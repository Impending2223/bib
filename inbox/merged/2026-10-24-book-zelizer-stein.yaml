- add:
    entry:
      id: cal.1961-04-20.economy
      when: Apr. 20
      date: '1961-04-20'
      thread: economy
      c: 'Tax message. An investment credit: 15 percent of new plant and equipment spending above depreciation, 6 percent between half of depreciation and all of it, 10 percent on the first $5,000; about
        $1.7 billion a year. To pay for it: withholding of 20 percent on dividends and interest from Jan. 1, 1962, about $600 million; the dividend credit and exclusion repealed; income kept abroad and
        expense accounts taxed.'
      n: 'Special Message to the Congress on Taxation, [1961 Pub. Papers 290](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=348) (Apr. 20, 1961). [[w.zelizer-taxing-america]],
        185–88 (the 15 percent credit, withholding, income abroad); [[w.stein-fiscal-revolution-in-america]], 390–91 (the credit, income abroad, withholding). To check: [[w.manley-politics-of-finance]].'
      tags:
      - name:kennedy-john-f
    section: '196104'
- add:
    entry:
      id: cal.1961-10-26.economy
      when: Oct. 26
      date: '1961-10-26'
      thread: economy
      c: 'Statement to Cabinet officers and agency heads: "a most careful and frugal policy" on commitments and spending under the 1962 budget. The deficit, the recession''s, much smaller than fiscal 1959''s
        $12.4 billion. A balanced budget for fiscal 1963, barring extraordinary and unforeseen defense needs.'
      n: Statement by the President to Cabinet Officers and Agency Heads on the 1962 and 1963 Budget Outlook, [1961 Pub. Papers 681](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=739)
        (Oct. 26, 1961). [[w.stein-fiscal-revolution-in-america]], 403–04. See [[cal.1961-07-25.economy]].
      tags:
      - name:kennedy-john-f
    section: '196110'
- add:
    entry:
      id: cal.1962-02-21.economy
      when: Feb. 21
      date: '1962-02-21'
      thread: economy
      c: News conference. A tax cut in a few years possible, if there is no recession; the Berlin buildup's $3.5 billion forestalled one last summer. "For the present there is not a chance of a tax reduction."
      n: The President's News Conference of February 21, 1962, [1962 Pub. Papers 151](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=211). [[w.stein-fiscal-revolution-in-america]],
        406. See [[cal.1962-01-18.economy]].
      tags:
      - name:kennedy-john-f
    section: '196202'
- add:
    entry:
      id: cal.1962-05-29.economy
      when: May 29
      date: '1962-05-29'
      thread: economy
      c: 'The day after the market''s fall, by Sorensen''s account: Kennedy with Dillon, Heller, Martin and others on an address to the nation, lower margin requirements, a prompt cut in income taxes, temporary.
        The Council for a cut unless the economy improves; Dillon against unless it worsens. No decision.'
      n: '[[w.stein-fiscal-revolution-in-america]], 408, 422–23. To check: [[w.sorensen-kennedy]], 423–24. See [[cal.1962-05-28.economy]]. Names: Sorensen, Kennedy, Dillon, Heller, Martin.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:dillon-c-douglas
      - name:heller-walter-w
      - name:martin-william-mcchesney-jr
    section: '196205'
- add:
    entry:
      id: cal.1962-06-04.economy
      when: June 4
      date: '1962-06-04'
      thread: economy
      c: 'Dillon to the New York Financial Writers Association: the tax reform for January will bring "a top-to-bottom reduction in the rates of income tax," offset by a broader base "in whole or in part."'
      n: '[[w.stein-fiscal-revolution-in-america]], 409. Check: the Record prints the address, 108 Cong. Rec. 10299 (Stein, 509 n.46). See [[cal.1962-05-28.economy]]. Names: Dillon.'
      tags:
      - name:dillon-c-douglas
    section: '196206'
- add:
    entry:
      id: cal.1962-06-07.economy
      when: June 7
      date: '1962-06-07'
      thread: economy
      c: News conference. For the next Congress, effective Jan. 1, 1963, "an across-the-board reduction in personal and corporate income tax rates which will not be wholly offset by other reforms—in other
        words, a net tax reduction." Standby authority to cut taxes asked again.
      n: The President's News Conference of June 7, 1962, [1962 Pub. Papers 456](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=516). [[w.stein-fiscal-revolution-in-america]],
        407–10. See [[cal.1962-05-28.economy]].
      tags:
      - name:kennedy-john-f
    section: '196206'
- add:
    entry:
      id: cal.1962-06-29.economy
      when: June 29
      date: '1962-06-29'
      thread: economy
      c: 'The Chamber of Commerce, by its committee on taxation: an immediate cut of about $8 billion, the budget''s unbalance notwithstanding; corporate and upper-bracket rates first.'
      n: '[[w.stein-fiscal-revolution-in-america]], 417–18, 430. See [[cal.1962-05-28.economy]].'
    section: '196206'
- add:
    entry:
      id: cal.1962-07-26.economy
      when: July 26
      date: '1962-07-26'
      thread: economy
      c: 'Mills''s Ways and Means opens closed hearings on the state of the economy: some forty witnesses, most from business and finance, through Aug. 1 (Check). Most see no emergency calling for a tax
        cut before 1963. Not published.'
      n: 'Daily Digest, [108 Cong. Rec. D410](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=408) (July 26, 1962). [[w.stein-fiscal-revolution-in-america]], 428;
        [[w.zelizer-taxing-america]], 194–95. See [[cal.1962-05-28.economy]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
    section: '196207'
- add:
    entry:
      id: cal.1962-08-06.economy
      when: Aug. 6
      date: '1962-08-06'
      thread: economy
      c: 'Kennedy and Mills on a tax cut, recorded. Mills against a quick, temporary cut: business and labor each want a different one; "Even if we made up our minds that we wanted a tax cut, we can''t
        win." Reform of oil depletion: "never happen."'
      n: '[Meeting with Wilbur Mills on the Tax Cut Proposal, 6:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-wilbur-mills-tax-cut-proposal), Tape 7 (Miller Center).
        [[w.zelizer-taxing-america]], 191, 195. See [[cal.1962-05-28.economy]]. Names: Kennedy, Mills.'
      tags:
      - name:kennedy-john-f
      - name:mills-wilbur-d
    section: '196208'
- add:
    entry:
      id: cal.1962-11-16.economy
      when: Nov. 16
      date: '1962-11-16'
      thread: economy
      c: 'Meeting on the economy and the tax program for 1963, recorded: Kennedy with Dillon, Fowler, Bell, Wirtz, Heller, Gordon, Gudeman, Schultze, Samuelson, Solow, Tobin and Ackley. Bell: a case "of
        the kind that Mills is after" can be made "at the expense of deferring a number of things that really are needed."'
      n: '[Meeting on the Economy, 10:08 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-economy), Tape 58 (Miller Center). [[w.zelizer-taxing-america]], 196. See [[cal.1962-08-13.economy]].
        Names: Kennedy, Dillon, Fowler, Bell, Wirtz, Heller, Gordon, Gudeman, Schultze, Samuelson, Tobin, Ackley, Mills.'
      tags:
      - name:kennedy-john-f
      - name:dillon-c-douglas
      - name:fowler-henry-h
      - name:bell-david-e
      - name:wirtz-w-willard
      - name:heller-walter-w
      - name:gordon-kermit
      - name:gudeman-edward
      - name:schultze-charles-l
      - name:samuelson-paul-a
      - name:tobin-james
      - name:ackley-gardner
      - name:mills-wilbur-d
    section: '196211'
- add:
    entry:
      id: cal.1962-11-19.economy
      when: Nov. 19
      date: '1962-11-19'
      thread: economy
      c: 'The President''s Advisory Committee on Labor-Management Policy, Henry Ford II, Meany, Reuther, Burns and Kerr among its members: "a prompt and significant reduction in income tax rates," a majority
        for about $10 billion early in 1963; some would spread it over two or three years, a few hold it to $4 to $5 billion.'
      n: 'The President''s News Conference of November 20, 1962, [1962 Pub. Papers 830](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=890), item 17. [[w.stein-fiscal-revolution-in-america]],
        418, 430. See [[cal.1962-08-13.economy]]. Names: Henry Ford II, Meany, Reuther, Burns, Kerr.'
      tags:
      - name:ford-henry-ii
      - name:meany-george
      - name:reuther-walter
      - name:burns-arthur-f
      - name:kerr-clark
    section: '196211'
- add:
    entry:
      id: cal.1962-12-12.economy
      when: Dec. 12
      date: '1962-12-12'
      thread: economy
      c: 'Kennedy and Mills on the tax cut, 5:36 p.m., recorded. Mills, in *U.S. News & World Report* of Dec. 17: no cut from Jan. 1, 1963, nor one made without regard to the deficit; spending held, and
        reforms to offset part of the cut.'
      n: '[Meetings with Wilbur Mills on the Tax Cut Proposal and on Agricultural Subsidies](https://millercenter.org/the-presidency/secret-white-house-tapes/meetings-wilbur-mills-tax-cut-proposal-and-agricultural),
        Tape 67 (Miller Center). The President''s News Conference of December 12, 1962, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926): "I''m
        going to see Congressman Mills today." [[w.stein-fiscal-revolution-in-america]], 434; [[w.zelizer-taxing-america]], 198. See [[cal.1962-08-13.economy]]. Names: Kennedy, Mills.'
      tags:
      - name:kennedy-john-f
      - name:mills-wilbur-d
    section: '196212'
- add:
    entry:
      id: cal.1962-12-14.economy-2
      when: Dec. 14
      date: '1962-12-14'
      thread: economy
      c: 'The Committee for Economic Development, *Reducing Tax Rates for Production and Growth*, released the morning of the Economic Club speech: $11 billion off, $6 billion from Jan. 1, 1963, $5 billion
        more once fiscal 1964 spending is held at 1963''s; the corporate rate from 52 to 42 percent; no reforms to delay it.'
      n: '[[w.stein-fiscal-revolution-in-america]], 418–19, 430, 441. Check: Zelizer, 198, dates the committee''s statement Dec. 13. See [[cal.1962-08-13.economy]].'
    section: '196212'
- add:
    entry:
      id: cal.1963-09-18.medicare
      when: Sept. 18
      date: '1963-09-18'
      thread: medicare
      c: 'Mills, before the Rules Committee on the tax bill: he will not ask Ways and Means to report hospital insurance for the aged this session.'
      n: 'Daily Digest, [109 Cong. Rec. D450](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=448) (Sept. 18, 1963) (Mills before Rules). [[w.zelizer-taxing-america]],
        220. To check: Cohen to Sorensen, Oct. 25, 1963 (Wilbur J. Cohen Papers, Wisconsin Historical Society). See [[cal.1963-02-21.medicare]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
    section: '196309'
- add:
    entry:
      id: cal.1964-01-08.economy
      when: Jan. 8
      date: '1964-01-08'
      thread: economy
      c: 'After the State of the Union, Johnson by telephone on the budget held under $98 billion. To Byrd, 3:25 p.m.: "You are my inspiration for doing it." Fowler, 5:40 p.m.: "making an honest man out
        of me and out of Wilbur Mills in one day."'
      n: '[Johnson and Byrd, 3:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-harry-byrd-january-8-1964), Conversation WH6401-08-1247; [Johnson and Fowler, 5:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-january-8-1964),
        Conversation WH6401-08-1254 (Miller Center). [[w.zelizer-taxing-america]], 203. See [[cal.1964-01-08.program]]; [[cal.1963-01-24.economy]]. Names: Johnson, Byrd, Fowler, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:byrd-harry-f
      - name:fowler-henry-h
      - name:mills-wilbur-d
    section: '196401'
- add:
    entry:
      id: cal.1964-02-07.economy-2
      when: Feb. 7
      date: '1964-02-07'
      thread: economy
      c: 'Johnson to Mills, 11:36 a.m., on the tax bill before the Senate''s vote: "If it gets behind civil rights, God knows when it will be there!" To O''Brien, 7:25 p.m.: each day''s delay costs the
        economy $30 million.'
      n: '[Johnson and Mills, 11:36 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-february-7-1964), Conversation WH6402-08-1921; [Johnson and O''Brien,
        7:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-february-8-1964), Conversation WH6402-09-1955 (Miller Center). [[w.zelizer-taxing-america]],
        204. See [[cal.1963-01-24.economy]]. Names: Johnson, Mills, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      - name:obrien-lawrence-f
    section: '196402'
- add:
    entry:
      id: cal.1964-02-26.economy-2
      when: Feb. 26
      date: '1964-02-26'
      thread: economy
      c: 'Johnson to Mills, 11:55 a.m., before the signing: thanks for the tax bill. Mills: the budget cuts brought Byrnes and the Finance Committee along; credit Halleck and Byrnes for taking the conference
        report. Byrnes "did exactly what he told you he would do."'
      n: '[Johnson and Mills, 11:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-february-26-1964), Conversation WH6402-21-2200 (Miller Center). [[w.zelizer-taxing-america]],
        208. See [[cal.1963-01-24.economy]]. Names: Johnson, Mills, Byrnes, Halleck.'
      tags:
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      - name:byrnes-john-w
      - name:halleck-charles-a
    section: '196402'
- add:
    entry:
      id: cal.1964-03-09.medicare
      when: Mar. 9
      date: '1964-03-09'
      thread: medicare
      c: 'Johnson to Celebrezze, 12:30 p.m.: stop the leaks. An AP story, HEW its source, told of his private talk urging Mills to come to terms with Cohen; such stories will "run Mills off." Celebrezze,
        back from two days with Mills at Little Rock: "a fine gentleman."'
      n: '[Johnson and Celebrezze, 12:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-anthony-celebrezze-march-9-1964), Conversation WH6403-05-2409 (Miller Center).
        [[w.zelizer-taxing-america]], 222–23. See [[cal.1964-02-10.medicare]]. Names: Johnson, Celebrezze, Mills, Cohen.'
      tags:
      - name:johnson-lyndon-b
      - name:celebrezze-anthony-j
      - name:mills-wilbur-d
      - name:cohen-wilbur-j
    section: '196403'
- add:
    entry:
      id: cal.1964-03-21.medicare
      when: Mar. 21
      date: '1964-03-21'
      thread: medicare
      c: 'Johnson to Cohen, 6:04 p.m.: get Mills something, if labor will take it, "that he can call a Mills bill." Cohen: "I''m positive of that."'
      n: '[Johnson and Cohen, 6:04 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-cohen-march-21-1964), Conversation WH6403-15-2612 (Miller Center). [[w.zelizer-taxing-america]],
        223. See [[cal.1964-02-10.medicare]]. Names: Johnson, Cohen, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:cohen-wilbur-j
      - name:mills-wilbur-d
    section: '196403'
- add:
    entry:
      id: cal.1964-05-18.medicare
      when: May 18
      date: '1964-05-18'
      thread: medicare
      c: 'O''Brien to Johnson, 7:35 p.m., on Mills and hospital insurance: Cohen has been "living" with Mills for months; Mills promises a package by the week''s end, with "the Mills stamp on it," and is
        "certainly in the Medicare ball park." Johnson: "A Democratic President ought to know what a Democratic chairman is doing."'
      n: '[Johnson and O''Brien, 7:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-may-18-1964-0), Conversation WH6405-08-3472 (Miller Center). [[w.zelizer-taxing-america]],
        224–25. See [[cal.1964-02-10.medicare]]. Names: O''Brien, Johnson, Cohen, Mills.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:cohen-wilbur-j
      - name:mills-wilbur-d
    section: '196405'
- add:
    entry:
      id: cal.1964-06-09.medicare
      when: June 9
      date: '1964-06-09'
      thread: medicare
      c: 'Johnson to Mills, 9:55 a.m.: the hospital bill "will mean more than all the bills we passed put together"; "grind something out of there." Mills, wary of working people''s reaction to the payroll
        tax: "we are making every effort to do something."'
      n: '[Johnson and Mills, 9:55 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-june-9-1964), Conversation WH6406-03-3642 (Miller Center). [[w.zelizer-taxing-america]],
        225–26. See [[cal.1964-02-10.medicare]]. Names: Johnson, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
    section: '196406'
- add:
    entry:
      id: cal.1964-06-11.medicare
      when: June 11
      date: '1964-06-11'
      thread: medicare
      also:
      - economy
      c: 'Johnson, O''Brien and Mills, 3:55 p.m. Mills wants a bill he "could say" differs from King–Anderson, and Republican votes; Celebrezze''s "three-pronged approach," hospital insurance, cash benefits
        and Kerr–Mills. Johnson: cash benefits and Kerr–Mills alone would "murder" Medicare. The tax cut, Johnson says, is helping his campaign.'
      n: '[Johnson, O''Brien and Mills, 3:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-office-conversation-and-wilbur), Conversations WH6406-06-3686,
        [3687](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-and-wilbur-mills-june-11-1964) (Miller Center). [[w.zelizer-taxing-america]], 210–11, 226. See [[cal.1964-02-10.medicare]].
        Names: Johnson, O''Brien, Mills, Celebrezze.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:mills-wilbur-d
      - name:celebrezze-anthony-j
    section: '196406'
- add:
    entry:
      id: cal.1964-06-22.medicare
      when: June 22
      date: '1964-06-22'
      thread: medicare
      c: 'O''Brien to Johnson, 5:10 p.m.: "the Wilbur Mills situation is deteriorated, I would say at this moment totally." Watts and Herlong lost; Mills for a rise in cash benefits, hospital insurance
        to wait or to be added in the Senate. They choose to keep it from a vote in committee and attach King–Anderson in the Senate.'
      n: '[Johnson and O''Brien, 5:10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-and-office-conversation-june-22), Conversation WH6406-12-3804 (Miller
        Center). [[w.zelizer-taxing-america]], 227–28. See [[cal.1964-02-10.medicare]]. Names: O''Brien, Johnson, Mills, Watts, Herlong.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      - name:watts-john-c
      - name:herlong-a-sydney-jr
    section: '196406'
- add:
    entry:
      id: cal.1964-06-24.medicare
      when: June 24
      date: '1964-06-24'
      thread: medicare
      c: 'Ways and Means takes its decisions on the Social Security amendments. Mills: he cannot support King–Anderson now, the future wage base and tax rate unknown; nor are the votes there.'
      n: 'Daily Digest, [110 Cong. Rec. D313](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=311) (June 29, 1964) (the decisions of June 24). [[w.zelizer-taxing-america]],
        229. See [[cal.1964-02-10.medicare]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
    section: '196406'
- add:
    entry:
      id: cal.1964-08-14.medicare
      when: Aug. 14
      date: '1964-08-14'
      thread: medicare
      c: 'Johnson to O''Brien, 12:02 p.m.: Anderson to "slug it out" for King–Anderson in the Senate and go to conference; there Mills can "scare the living hell out of the doctors" and come up with a compromise.
        "Wilbur Mills will take your pants unless you got something that he got to trade for."'
      n: '[Johnson and O''Brien, 12:02 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-larry-obrien-august-14-1964-0), Conversation WH6408-19-4921 (Miller Center). [[w.zelizer-taxing-america]],
        228–29. See [[cal.1964-02-10.medicare]]. Names: Johnson, O''Brien, Anderson, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:anderson-clinton-p
      - name:mills-wilbur-d
    section: '196408'
- add:
    entry:
      id: cal.1964-12-02.medicare
      when: Dec. 2
      date: '1964-12-02'
      thread: medicare
      c: 'Mills, to the Downtown Little Rock Lions Club: he could support a payroll tax for health benefits "just as I have supported a payroll tax for cash benefits."'
      n: '[[w.zelizer-taxing-america]], 231. See [[cal.1964-09-02.medicare]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
    section: '196412'
- add:
    entry:
      id: cal.1965-03-02.medicare
      when: Mar. 2
      date: '1965-03-02'
      thread: medicare
      c: 'Ways and Means in executive session on H.R. 1. Before it the administration''s hospital insurance, the AMA''s Eldercare, Byrnes''s Bettercare. Mills, in the afternoon, to Cohen: "Maybe it would
        be a good idea if we put all three of these bills together. You go back and work this out overnight." The three-layer cake.'
      n: 'Daily Digest, [111 Cong. Rec. D81](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=79) (Mar. 2, 1965). [[w.zelizer-taxing-america]], 239–42. To check:
        [[w.harris-sacred-trust]], 187–88. See [[cal.1965-01-07.medicare]]. Names: Mills, Byrnes, Cohen.'
      tags:
      - name:mills-wilbur-d
      - name:byrnes-john-w
      - name:cohen-wilbur-j
    section: '196503'
- add:
    entry:
      id: cal.1967-08-24.economy-surcharge
      when: Aug. 24
      date: '1967-08-24'
      thread: economy-surcharge
      c: 'Business leaders gathered by Fowler, by telegram to Mills: the surcharge and the cuts in spending, against inflation. The American Bankers Association, the Mortgage Bankers Association and the
        National Association of Home Builders among them.'
      n: '[[w.zelizer-taxing-america]], 258–59. See [[cal.1967-08-03.economy]]. Names: Fowler, Mills.'
      tags:
      - name:fowler-henry-h
      - name:mills-wilbur-d
    section: '196708'
- add:
    entry:
      id: cal.1967-10-06.economy-surcharge
      when: Oct. 6
      date: '1967-10-06'
      thread: economy-surcharge
      c: 'Mills, in a statement on federal spending and the growth of government: the committee''s action "not irresponsible, bullheaded, or spiteful," but the anxiety members found at home over the Labor
        Day recess about "the recent sharp rise in federal outlays" (Check the day).'
      n: '[[w.zelizer-taxing-america]], 265. See [[cal.1967-10-03.economy]]. Names: Mills.'
      tags:
      - name:mills-wilbur-d
    section: '196710'
- add:
    entry:
      id: cal.1967-11-15.economy
      when: Nov. 15
      date: '1967-11-15'
      thread: economy
      c: 'Surrey, to a New York financial group: "tax expenditures," revenue given up through the tax law''s special provisions. "When Congressional talk and public opinion turn to reduction and control
        of Federal expenditures, these tax expenditures are never mentioned."'
      n: '[[w.zelizer-taxing-america]], 286–88, 297. See [[cal.1967-01-10.economy]]. Names: Surrey.'
      tags:
      - name:surrey-stanley-s
    section: '196711'
- add:
    entry:
      id: cal.1967-12-14.economy-surcharge
      when: Dec. 14
      date: '1967-12-14'
      thread: economy-surcharge
      c: Fowler, Mills and Byrnes agree a tax bill needs an "austere" budget; Mills to bring the surcharge back in January on the dollar and the balance of payments. By Fowler's report to Johnson.
      n: '[[w.zelizer-taxing-america]], 270. To check: Fowler to Johnson, Dec. 14, 1967 (LBJ Library, White House Central Files). See [[cal.1967-11-29.economy]]. Names: Fowler, Mills, Byrnes, Johnson.'
      tags:
      - name:fowler-henry-h
      - name:mills-wilbur-d
      - name:byrnes-john-w
      - name:johnson-lyndon-b
    section: '196712'
- add:
    entry:
      id: cal.1968-03-22.economy-surcharge
      when: Mar. 22
      date: '1968-03-22'
      thread: economy-surcharge
      c: 'Lunch: Mills, Fowler, Mahon and Martin on the gold crisis and the surcharge. Mills "despondent" and "disgusted" with Congress on appropriations: no surcharge through the House without $6 billion
        off fiscal 1969 and cuts in built-in spending. By Fowler''s report to Johnson.'
      n: '[[w.zelizer-taxing-america]], 272–73. To check: Fowler to Johnson, Mar. 22, 1968 (LBJ Library, Confidential File). See [[cal.1967-01-10.economy]]. Names: Mills, Fowler, Mahon, Martin, Johnson.'
      tags:
      - name:mills-wilbur-d
      - name:fowler-henry-h
      - name:mahon-george-h
      - name:martin-william-mcchesney-jr
      - name:johnson-lyndon-b
    section: '196803'
- add:
    entry:
      id: cal.1968-04-30.economy-surcharge
      when: Apr. 30
      date: '1968-04-30'
      thread: economy-surcharge
      c: 'Johnson with the Democratic leaders at the White House: Mills, he says, has agreed to Mahon''s compromise, $4 billion off fiscal 1969 spending and nearly $18 billion off appropriations past and
        future.'
      n: '[[w.zelizer-taxing-america]], 274. To check: Califano to Johnson, Apr. 30, 1968 (LBJ Library, White House Central Files). See [[cal.1967-01-10.economy]]. Names: Johnson, Mills, Mahon.'
      tags:
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
      - name:mahon-george-h
    section: '196804'
- add:
    entry:
      id: cal.1968-05-01.economy-surcharge
      when: May 1
      date: '1968-05-01'
      thread: economy-surcharge
      c: 'Cabinet meeting. Johnson: "take the bull by the tail and get the tax bill now"; the departments to find how $6 billion could be cut.'
      n: '[[w.zelizer-taxing-america]], 275. To check: "The Cabinet Meeting of May 1, 1968" (LBJ Library, Cabinet Papers). See [[cal.1967-01-10.economy]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196805'
- add:
    entry:
      id: cal.1968-05-03.economy-surcharge
      when: May 3
      date: '1968-05-03'
      thread: economy-surcharge
      c: 'News conference. A tax bill "without any ''ands,'' ''buts,'' or ''ors''"; cuts as each appropriation bill comes up: "stand up like men and answer the roll call." "But don''t hold up a tax bill
        until you can blackmail someone into getting your own personal viewpoint over on reductions."'
      n: 'The President''s News Conference of May 3, 1968, [1968–69 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=634). [[w.zelizer-taxing-america]], 275.
        See [[cal.1967-01-10.economy]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
    section: '196805'
- add:
    entry:
      id: cal.1963-02-25.economy
      when: Feb. 25
      date: '1963-02-25'
      thread: economy
      c: 'Kennedy to the American Bankers Association''s symposium on economic growth. Asked whether reform may delay the cut: "the first priority is a bill. ... Whatever is necessary to get that bill,
        I would support."'
      n: Remarks and Question and Answer Period at the American Bankers Association Symposium on Economic Growth, [1963 Pub. Papers 210](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=268)
        (Feb. 25, 1963). [[w.stein-fiscal-revolution-in-america]], 438. See [[cal.1963-01-24.economy]].
      tags:
      - name:kennedy-john-f
    section: '196302'
- add:
    entry:
      id: cal.1963-03-06.economy
      when: Mar. 6
      date: '1963-03-06'
      thread: economy
      c: News conference. A $13½ billion cut without the reforms? "No, that isn't what I said." The program sent up, reduction and reform together, the best combination; the bill Congress enacts will hold
        "important elements of the reforms."
      n: The President's News Conference of March 6, 1963, [1963 Pub. Papers 236](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=294), item 2. [[w.stein-fiscal-revolution-in-america]],
        438–39. See [[cal.1963-01-24.economy]].
      tags:
      - name:kennedy-john-f
    section: '196303'
- add:
    entry:
      id: cal.1963-11-04.economy
      when: Nov. 4
      date: '1963-11-04'
      thread: economy
      c: 'Henry Ford II and Stuart T. Saunders, cochairmen of the Business Committee for Tax Reduction in 1963, before Senate Finance on H.R. 8363: the cut enacted this year, effective Jan. 1, 1964. Byrd:
        what harm in waiting for the January budget and its cuts in spending?'
      n: 'Daily Digest, [109 Cong. Rec. D532](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=530) (Nov. 4, 1963). [[w.stein-fiscal-revolution-in-america]], 451–52.
        See [[cal.1963-04-25.economy]]. Names: Henry Ford II, Byrd.'
      tags:
      - name:ford-henry-ii
      - name:byrd-harry-f
    section: '196311'
- add:
    entry:
