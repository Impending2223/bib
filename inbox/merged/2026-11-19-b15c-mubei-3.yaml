      id: cal.1961-11-25.china-leadership-4
      when: Nov. 25
      date: '1961-11-25'
      thread: china-leadership
      c: 'The Dingxi 定西 prefectural committee sends the Gansu 甘肅 provincial committee "Some opinions of the county committees'' enlarged meetings on the responsible comrades of the Center and the province" 《定西地委轉報各縣委擴大會議對中央和省委負責同志的一些意見》. Central leaders inspected Gansu and sent work teams, rated its work high and found nothing in the Tao project 引洮工程; Tan Zhenlin''s 譚震林 "grain has passed the hurdle" and "rope traction is agriculture''s direction" misled the cadres. The communist wind, the big mess halls and free meals came from the Center; Chairman Liu''s 劉主席 (Liu Shaoqi 劉少奇) "one county, one commune" on his Henan 河南 visit weighed on those below; the five winds were raised from above and commandism forced by inspection groups. The provincial committee says it will not trace past errors, yet Zhang Zhongliang 張仲良 and Dou Minghai 竇明海 remain secretaries and those below get training classes or dismissal: "above sets the question, below elaborates."'
      n: '[[w.yang-jisheng-mubei]], I, 175–176. Made public: 2008. To check: Dingxi Prefectural Committee, "Some opinions of the county committees'' enlarged meetings on the responsible comrades of the Center and the province," titled Nov. 28, 1961, sent to the provincial committee Nov. 25 (quoted by [[w.yang-jisheng-mubei]], I, 175–176; no note). Names: Tan Zhenlin, Liu Shaoqi. Check: the book dates the document Nov. 28 in its title (I, 175) and has the prefectural committee send it Nov. 25 (I, 176).'
      src:
