      id: cal.1962-10-13.china-leadership-5
      when: Oct. 13
      date: '1962-10-13'
      thread: china-leadership
      c: 'The Central work group 中央工作組 (the United Front Work Department''s group 統戰部小組) sent to Sichuan 四川 issues no. 24 of its Situation Bulletin 《情況簡報》, on Hechuan 合川 county: "In three years 60 percent of commune Party secretaries criticized or punished" 《四川省合川縣三年來公社一級黨委書記受批判、處分面達60%》. Of the county''s 25,283 cadres 5,184, 20.5 percent, were dealt with from 1959 to 1961: of commune Party secretaries 60 percent, of brigade secretaries and deputies 57.2, of production-team heads and deputies 24.8.'
      n: '[[w.yang-jisheng-mubei]], II, 836–837, I, 245. Made public: 2008. To check: Central Work Group (United Front Work Department group), ed., *Situation Bulletin* no. 24, Oct. 13, 1962: "In Sichuan''s Hechuan county, 60 percent of commune Party secretaries criticized or punished in three years" (cited by [[w.yang-jisheng-mubei]], II, 837 n.61); Central Work Group (United Front Work Department group), ed., *Situation Bulletin* no. 24, Oct. 13, 1962: "In Sichuan''s Hechuan county, 60 percent of commune Party secretaries criticized or punished in three years" (cited by [[w.yang-jisheng-mubei]], I, 245 n.113). Check: the text dates the work group''s survey "Oct. 1962"; the day is the bulletin''s, in the note.'
