      when: Feb. 27
      date: '1961-02-27'
      thread: china-leadership
      c: The Gansu 甘肅 provincial committee 省委, reorganized with Wang Feng 汪鋒 first secretary in Zhang Zhongliang's 張仲良 place, issues its "Provisions on running centralized training classes and special training classes" 《關於舉辦集中訓練班和特別訓練班的規定》. Bureaucrats and others with grave errors not moved away are to be put in the centralized class 集訓; class-alien elements who crept in, and degenerates who took revenge on the working people, in the special class 特訓. By the figures the province puts 10,869 through, 6,105 in the first and 4,764 in the second.
      n: '[[w.yang-jisheng-mubei]], I, 175. Made public: 2008. To check: Gansu Provincial Committee, "Provisions on running centralized and special training classes," Feb. 27, 1961 (quoted by [[w.yang-jisheng-mubei]], I, 175; no note of its own); Gansu Provincial Committee, "Inspection report on some problems in carrying out the spirit of the Northwest Bureau''s Lanzhou meeting over two years," adopted Dec. 3, 1962 (cited by [[w.yang-jisheng-mubei]], I, 175 n.51). Check: the note closing the passage (I, 175 n.51) is the provincial committee''s inspection report of Dec. 3, 1962, which the book does not say holds the figures; old cadres say far more were put through.'
