      c: 'The Wuwei 武威 prefectural committee 地委 reports by telephone to the Gansu 甘肅 provincial committee on illness, cooking stopped and outflow of people in Yongchang 永昌 county. On the county committee''s call of the 14th: in 14 communes, 3,255 sick of edema and the like; 1,876 households, 8,782 people, 11.9 percent of the population, with no cooking. The prefectural committee holds that the county''s 1961 grain was better than 1960''s and procurement nearly done; some communes and teams procured ration and seed grain too, but any problems cannot be large.'
