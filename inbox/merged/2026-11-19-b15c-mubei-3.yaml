      c: Shaoshan 韶山, Hunan 湖南, evening. With Mao's 毛澤東 consent the Central investigation group 中央調查組 headed by Hu Qiaomu 胡喬木 calls a members' meeting 社員大會 at Chenjiawan 陳家灣 in Daping 大坪 brigade and announces the dissolution of the public mess hall 公共食堂. The members are delighted.
