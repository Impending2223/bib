      when: Jan. 2
      date: '1961-01-02'
      thread: china-leadership
      c: 'Wang Congwu 王從吾, at the Central Control Commission 中央監委, talks with Zeng Qingmei 曾慶梅 and Shan Jingzhi 單敬之 of Anhui 安徽. He tells them: they must on return open the lid wholly; blocking the news is wrong and Shan is to write an examination for the Commission; Zhang Shaobai 張少柏 should be praised for telling the truth and they must give him their word of no reprisal; the Anhui committee''s failure to report the facts is against the Party constitution. Zeng says he fully agrees with the group''s views, that he is responsible for holding back the people''s letters, and that writing to the Center against the group was wrong.'
      n: '[[w.yang-jisheng-mubei]], I, 325–326. Made public: 2008. To check: Li Jian 李堅, talk with Yang Jisheng, Apr. 9, 2001 (afternoon, at Li''s home) (cited by [[w.yang-jisheng-mubei]], I, 325 n.98). See [[cal.1960-12-28.china-leadership-3]]. Check: the book gives Wang''s words as said at the Commission''s standing committee of Jan. 3, 1961, of a talk "yesterday"; dated Jan. 2 here.'
