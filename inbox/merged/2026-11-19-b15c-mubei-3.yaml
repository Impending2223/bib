      thread: china-leadership
      c: 'Wu De 吳德, first secretary of the Jilin 吉林 provincial committee, writes Mao 毛澤東 his first letter 《吳德同志寫給主席的第一封信》. He complains that grain output falls far behind the growing procurement: against 1957 the average assigned output 分配產量 of 1958–60 is up 15.8 percent and net procurement 75.6 percent; the share procurement takes of assigned output rises from 28.2 to 51.8 percent and the share left falls from 71.8 to 48.2. In the soybean areas, where beans have no separate quota, a poor crop is made up by paying coarse grain in the beans'' place.'
      n: '[[w.yang-jisheng-mubei]], I, 341–342. Made public: 2008. To check: Wu De, "Comrade Wu De''s first letter to the Chairman," May 9, 1961, Jilin Provincial Archives (cited by [[w.yang-jisheng-mubei]], I, 342 n.4). Names: Mao Zedong.'
