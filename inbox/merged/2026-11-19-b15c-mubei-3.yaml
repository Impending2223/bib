      when: May 10
      date: '1961-05-10'
      thread: china-leadership
      c: 'Wu De 吳德, first secretary of the Jilin 吉林 provincial committee, writes Mao 毛澤東 his second letter, on the mess halls 《吳德同志寫給主席的第二封信》. Under present conditions the all-people mess halls, he says, have proved unworkable and very few are kept; many of those left run against the members'' wishes, badly managed, wasting fuel, men and money, with a hundred jin of grain not going as far as at home, with leveling, a hindrance to the families'' raising of stock, and "no freedom in eating". But in two mountain districts surveyed, single men, young couples with no old or young to care for and five-guarantee households, 90 percent of them, want year-round mess halls: whether to run them, and how, should be settled by the local masses, with no "one knife cut".'
