      c: Fengyang 鳳陽 county. At the rectification meeting 整風會議 of section and bureau heads 科局長, the head of the tractor station 拖拉機站, Wang, speaks in the evening. In 1959, at rectification in Zhetang 浙塘 brigade, Banqiao 板橋 commune, he says, he dared not report the deaths as from lack of grain and put them to poor hygiene work. A woman who had eaten a dead child, on report to the deputy county head Ji Wenxiang 季文祥, was bound that night by Ji's work team and sent to the public security bureau as a wrecker of socialism. Coming back from Banqiao he saw six or seven corpses on a grave mound.
