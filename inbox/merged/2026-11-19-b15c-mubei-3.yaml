      when: Sept. 19
      date: '1961-09-19'
      thread: china-leadership
      c: 'The Sichuan 四川 provincial committee''s work group 省委工作組 reports on Jiangbei 江北 county after its committee corrected the "rightist retrogression" of household contracting 包產到戶 《關於江北縣委糾正包產到戶的右傾倒退錯誤後的情況報告》. After the provincial instruction the county held cadre meetings of all levels in late July and sent cadres down, with some result, but the correcting was not thorough. Since the end of August the tendency has risen again: the contracted area grows, some brigades divide the big-season grain by work group or courtyard, autumn vegetables go to households, all the wheat seed is divided to households, private plots are enlarged; of the ten commune Party secretaries of Xinglong 興隆 district none firmly opposes. It proposes a mass movement of socialist education.'
      n: '[[w.yang-jisheng-mubei]], I, 232. Made public: 2008. To check: Sichuan Provincial Committee Work Group, "Report on the situation after the Jiangbei county committee corrected the rightist retrogression of household contracting," Sept. 19, 1961 (prefectural secretaries'' conference doc. 22, Sept. 1961, no. 000002) (cited by [[w.yang-jisheng-mubei]], I, 232 n.99). Check: the note (I, 232 n.99) gives only a conference-document number, "[61·9] prefectural secretaries'' conference document 22"; the day is the text''s.'
