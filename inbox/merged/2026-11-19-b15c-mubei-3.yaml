      c: The planning department 計劃司 of the Grain Ministry 糧食部 issues its digest of grain data 《糧食部計劃司糧食資料提要》. Its tables, as the book uses them, give the state's procurement and sale of grain in the villages in the grain years 1957–61, the grain stocks of 1959–60, and the output, procurement and sale of grain in Anhui 安徽 and Jilin 吉林.
