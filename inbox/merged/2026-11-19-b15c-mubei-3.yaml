      c: The general office of the Jiangsu 江蘇 provincial people's council 江蘇省人委辦公廳 issues an investigation of market trade in six market towns, Jinsha 金沙 and others 《金沙等六個集鎮集市貿易的情況調查》. By its account market trade, let back at the end of 1960 and the start of 1961, has grown by 1962; its goods are about 15 percent of retail sales. At the opening food prices stood more than two times above the state price 高出兩倍以上; by June 1962 only some tens of percent above.
