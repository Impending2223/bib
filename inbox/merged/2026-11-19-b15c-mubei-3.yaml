      c: The Jilin 吉林 provincial committee reports to the Central Committee and the Northeast Bureau 東北局 on the grain situation and the arrangement of livelihood 《關於糧食情況和生活安排問題的報告》. Procurement has been declared finished, 96 percent of the task done by the end of January; the peasants are left 780 million jin of ration, 85 jin each for the next eight months. Already 2.19 million people, 23.8 percent of the rural population, have no grain, and by the end of July 4.73 million, 54.1 percent; edema stands at about 20,000 at the end of Dec. and rises, and draft animals die for want of feed.
