      when: Apr. 8
      date: '1962-04-08'
      thread: china-leadership
      c: The Gannan 甘南 prefectural committee 州委 reports to the Gansu 甘肅 provincial committee on the arrangement of livelihood and a larger rural grain quota 《關於生活安排情況和增撥農村糧食指標的報告》. Rations are tight, the outflow of people and illness still rising, draft animals slaughtered everywhere; for want of seed the year's grain acreage may fall short. Lintan 臨潭 county lacks 3.69 million jin and the prefecture gives 1.1 million; of Changchuan 長川 commune's shortfall of 341,696 jin, the county gives 114,000, none of it for ration and 26,740 for seed.
