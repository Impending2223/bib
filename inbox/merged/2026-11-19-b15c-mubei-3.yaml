      c: 'He Jianzhong 何建中, a cadre of the Yanbian 延邊 prefectural committee, telephones its secretary Fu 富 in the evening, the call recorded by Lan Ganting 蘭幹亭, and reports: by the count of early February over 10,000 in Yanbian have edema, 7 percent of the people of Tumen 圖們 town and 7.5 percent in Chaoyang 朝陽 commune, Yanji 延吉 county, more in some schools and offices, 15 percent at the medical college and 10 percent at the prefectural newspaper. Of 3,899 women cadres surveyed 1,154, 29.6 percent, have women''s diseases; in all the cities and counties but Dunhua 敦化 the people strip elm bark to eat, and along the roads and railways and round the villages most elms are stripped.'
