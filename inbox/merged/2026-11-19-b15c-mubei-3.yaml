      c: Chen Zhenya 陳振亞, deputy head of the Anhui 安徽 provincial committee's rural work department 農村工作部 and head of the Fengyang 鳳陽 work group 工作組, reports on the Fengyang problem 《關於鳳陽問題的報告》. In 1959 and 1960 together 60,245 starved, 17.7 percent of the rural population; in Wudian 武店 commune 14,285 of 53,759, and in its Banjing 半井 brigade 1,627 of 4,100; Xiaoxihe 小溪河 commune 14,072, 26.9 percent; in Daimiao 大廟 commune's Xiahuangzhuang 夏黃莊, 48 of 70. 8,404 households died out, 3.4 percent of the total; 27 villages are empty of the dead and the fled.
