      id: cal.1961-09-19.china-leadership-6
      when: Sept. 19
      date: '1961-09-19'
      thread: china-leadership
      c: The refund committee's office 退賠委員會辦公室 of the Sichuan 四川 provincial committee 中共四川省委 issues "Opinions on several problems in the present refund work" 《關於當前退賠工作中幾個問題的意見》. Counties and communes have no money to refund and ask that finance supply it; finance has none. Commerce and industry departments in places produce goods for the refunds, but the units that took the goods have no cash to pay, and the goods pile up and do not reach communes, brigades or members.
      n: '[[w.yang-jisheng-mubei]], II, 824. Made public: 2008. To check: Sichuan Provincial Committee Refund Committee Office, "Opinions on several problems in the present refund work," Sept. 19, 1961 (cited by [[w.yang-jisheng-mubei]], II, 824 n.31).'
