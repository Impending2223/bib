      id: cal.1962-12-11.china-leadership-4
      when: Dec. 11
      date: '1962-12-11'
      thread: china-leadership
      c: 'The Center forwards to the whole country the Anhui 安徽 provincial committee''s summary "The situation of correcting ''responsibility fields''" 《安徽省改正「責任田」情況》. By the latest count over 60,100 teams, 23 percent of those that had the system, have corrected it. The summary lists the harms the correcting brought to light in under two years: control of the means of production passing to individuals and their ownership much changed; no unified planning or use of labor; distribution upset, collective and state interests hurt; a sharp polarization; individualism and selfishness growing, socialist and patriotic thought fading.'
      n: '[[w.yang-jisheng-mubei]], II, 830–831. Made public: 2008. To check: Anhui Provincial Committee, "The situation of correcting ''responsibility fields'' in Anhui," forwarded by the Central Committee Dec. 11, 1962 (cited by [[w.yang-jisheng-mubei]], II, 831 n.46).'
