      when: Aug. 24
      date: '1961-08-24'
      thread: china-leadership
      c: Ma Weimin 馬維民, secretary of the Fengyang 鳳陽 county committee, reports at a three-level cadre meeting on "Fengyang county's experience and lessons of two years" 《鳳陽縣兩年來的經驗教訓》. On the deaths, he says, everyone knew in the main; when single deaths began they were taken for individual cases and not told above, and as the deaths grew the committee panicked and dared not tell. Those who starved were said to have died of old age or illness, abnormal deaths made normal; some places forbade the families to weep and wear mourning or to bury, held back the letters that reported deaths and struck at their writers, and cadres who reported truly were struggled against. Fear of error, of punishment and of losing the official's hat kept them from exposing it; the less exposed, the bigger the problem.
      n: '[[w.yang-jisheng-mubei]], I, 265, 273. Made public: 2008. To check: Ma Weimin, speech at the Fengyang county committee''s three-level cadre meeting, "Fengyang county''s experience and lessons of two years," Aug. 24, 1961 (cited by [[w.yang-jisheng-mubei]], I, 265 n.16b). Check: the quotation at I, 273 has no note of its own; I, 265 n.16 gives the speech of this title and day.'
