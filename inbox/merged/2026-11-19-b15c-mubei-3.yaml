      c: 'The finance and trade ministers of the three Northeast provinces meet to study substitute foods. They require 100 jin of dry and wet starch for every rural person by the end of March, and substitute foods taken as seriously as grain; a daily "qian" of artificial meat essence 人造肉精 for every person in the large and medium cities. Examples are given: Sihe 四合 brigade, Jianye 建業 commune, Jin 錦 county, Liaoning 遼寧, half of 1,500 people making starch, 4,200 jin a day; Heilongjiang''s 黑龍江 commerce college plant making 60 to 100 jin of meat essence a day.'
