      when: Dec. 3
      date: '1962-12-03'
      thread: china-leadership
      c: 'The Gansu 甘肅 provincial committee''s third committee, fourth session 中共甘肅省委三屆四次會議, adopts its inspection report on some problems in carrying out the spirit of the Northwest Bureau''s Lanzhou meeting over two years 《中共甘肅省委關於兩年來貫徹執行西北局蘭州會議精神若干問題的檢查報告》. It censures the grassroots cadres'' blaming of their superiors as "vicious", an attempt to put the blame on the Center and Mao Zedong 毛主席; Gansu''s errors are general and special, the special chief, and mostly from Zhang Zhongliang''s 張仲良 personal ideas and character. It lists four things: the Center''s rule of 70 percent of investment for poor teams and 30 for communes altered; Mao''s Party letter to the cadres of six levels not carried out, Zhang issuing his own opinion on five powers for the teams; the Center''s water policy changed; the campaign against the right opportunists carried outside the Party.'
      n: '[[w.yang-jisheng-mubei]], I, 175–177. Made public: 2008. To check: Gansu Provincial Committee, "Inspection report on some problems in carrying out the spirit of the Northwest Bureau''s Lanzhou meeting over two years," adopted Dec. 3, 1962 (cited by [[w.yang-jisheng-mubei]], I, 175 n.51). Names: Mao Zedong.'
