      c: Hefei 合肥, evening. Zeng Xisheng 曾希聖, first secretary of the Anhui 安徽 provincial committee, back from Canton, calls the committee's standing committee 省委常委會, relays the Canton conference, and has "responsibility fields" 責任田 put through the whole province, to be tried for a year and kept if they prove good.
