      c: The Northeast Bureau 東北局 reports to the Center and the Chairman on the big drive for substitute foods in the Northeast 《關於東北地區大搞代食品情況的報告》. By the provinces' reports, from Jan. to Sept. the rural ration in many places is under 120 jin a head after procurement, seed, feed and what was eaten before the New Year, Liaoning's 遼寧 average 92. The movement, centered on artificial starch, took in before the New Year over 5.48 million people, 64 billion jin of raw material and 360 million jin of starch; 80 to 90 percent of the mess halls eat substitute food.
