      id: cal.1962-05-11.china-leadership-7
      when: May 11
      date: '1962-05-11'
      thread: china-leadership
      c: 'The Linxia 臨夏 prefectural committee 州委 reports to the Gansu 甘肅 provincial committee on the hardship of the Bonan 保安族 people of Dahejia 大河家 commune, Linxia county 《臨夏縣大河家保安族公社生活情況簡報》. With grain in the county at its worst the Bonan are worse off: people tear down and sell houses, sell tools and clothes, even children; the sick are 22.8 percent of the people; unnatural deaths follow, and begging outside grows.'
