      c: 'The general office of the Jilin 吉林 provincial committee issues "The situation of the big drive for substitute foods in Jilin" 《吉林省大搞代食品的情況》. By the end of Dec. 1960 the province has stored over 510,000 tons of raw material, set up over 40,000 processing points around the mess halls and 38,200 specialist teams of over 460,000 people, 15 percent of rural labor, and made 30,000 tons of starch; over twenty materials are used. The province runs a "three hundreds" movement: a million people, a hundred days, a hundred jin of substitute food for every rural person.'
