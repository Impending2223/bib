      c: Ruan Dimin 阮迪民 and Wang Bingxiang 王秉祥 press to have their cases reversed; Zhang Zhongliang 張仲良 does not dare, but sympathizes and supports them. They criticize the Northwest Bureau's Lanzhou meeting for denying the gains and only exposing and criticizing; hold that Gansu has no special errors, only general ones, in carrying out what the Center had been asked about; that the training classes struck too wide; that the Xinyang 信陽 experience does not fit Gansu and the Qingshui 清水 experience was wrong.
