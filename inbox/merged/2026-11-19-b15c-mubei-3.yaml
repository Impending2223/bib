      c: 'Anhui 安徽 runs training classes in three areas for over 10,000 district and commune cadres on correcting the responsibility fields 改正責任田訓練班; formed into work teams, they go to the villages to correct them by force. The provincial committee: some teams corrected before the spring ploughing of 1963, the rest before that of 1964.'
