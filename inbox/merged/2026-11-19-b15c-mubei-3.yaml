      id: cal.1961-08-24.china-leadership-6
      when: Aug. 24
      date: '1961-08-24'
      thread: china-leadership
      c: The rural work department 農村工作部 of the Central Committee issues its report on how the Sixty Articles 六十條 are carried out 《各地貫徹執行六十條的情況和問題》. On August figures the goods taken without pay 平調 come to 25 billion yuan for the country, against 11.1 billion first estimated; 20 to 30 percent is refunded; the old refunds are incomplete and new transfers occur, in the 1961 summer harvest some places seizing the wheat of members' private plots to pay the levy, some counting plot grain against the ration. The Center's rule gives private plots 自留地 5 percent of the land; Jiangsu 江蘇 gives 4.7 percent on average, some places under 4.
      n: '[[w.yang-jisheng-mubei]], II, 824, 826. Made public: 2008. To check: Central Committee Rural Work Department, "The situation and problems of carrying out the Sixty Articles in the various places," Aug. 24, 1961 (cited by [[w.yang-jisheng-mubei]], II, 824 n.33); Central Committee Rural Work Department, "The situation and problems of carrying out the Sixty Articles in the various places," Aug. 24, 1961 (cited by [[w.yang-jisheng-mubei]], II, 826 n.38). Check: the book gives the August figures before the report''s note (II, 824 n.33) and the Jiangsu share before II, 826 n.38; it does not say the report holds every figure.'
