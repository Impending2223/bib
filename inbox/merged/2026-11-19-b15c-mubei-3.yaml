      c: 'Bengbu 蚌埠. The city committee''s enlarged meeting 擴大會議 on cutting the town population: of the year''s plan of 35,600, 28,390 cut by the end of October; the rest of the quotas handed to the departments, every enterprise and institution to take stock, stop, merge or cut, and press all who can be spared back to the countryside. Its leading group on compressing the town population 壓縮城鎮人口領導小組 issues "Working opinions on further compressing the urban population and streamlining staff" 《關於進一步壓縮城鎮人口和精簡職工的工作意見》.'
      n: '[[w.yang-jisheng-mubei]], II, 833, I, 325. Made public: 2008. To check: Bengbu City Committee, Leading Group on Compressing Urban Population, "Working opinions on further compressing the urban population and streamlining staff," Nov. 17, 1961 (cited by [[w.yang-jisheng-mubei]], II, 833 n.56). Check: the book dates the meeting "November" with no day; the leading group''s opinions of Nov. 17 close the passage, and the enlarged meeting''s document 20, the city''s disease-elimination group''s report, is of the same day (I, 325 n.97).'
