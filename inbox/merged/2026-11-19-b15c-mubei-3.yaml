      when: Jan. 7
      date: '1961-01-07'
      thread: china-leadership
      c: 'Fengyang 鳳陽 county. At the county committee''s five-level enlarged cadre meeting 五級幹部擴大會議, called to correct the "five winds" 五風, Zhao Yushu 趙玉書, the county committee''s secretary, makes the committee''s first examination 檢查. The order to check the communist wind, he says, was not carried out because of the county committee''s guiding thought, above all his own: it always wished to go over faster to a higher form of ownership, and planned to take the county''s 14 communes in three batches to ownership by the commune, with the commune''s own economy growing fast, the supply system early and public accumulation large.'
      n: '[[w.yang-jisheng-mubei]], I, 260, 262. Made public: 2008. To check: Zhao Yushu 趙玉書, examination on behalf of the Fengyang county committee at the five-level cadre enlarged meeting (first examination material), dated Jan. 7, 1960 as printed (cited by [[w.yang-jisheng-mubei]], I, 260 n.5); Zhao Yushu 趙玉書, examination on behalf of the Fengyang county committee at the five-level cadre enlarged meeting (first examination material), dated Jan. 7, 1960 as printed (cited by [[w.yang-jisheng-mubei]], I, 262 n.10). Check: the notes (I, 260 n.5; 262 n.10) print the examination as of "Jan. 7, 1960"; the text puts it in the five-level meeting "of early 1961" (I, 260; 273), whose bulletins are dated Jan. 8–10, 1961. Dated here Jan. 7, 1961.'
