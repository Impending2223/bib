      c: Meishan 眉山 county, Sichuan 四川. A report on the main situation of refunds 《眉山縣退賠的主要情況》, addressed to Li Dazhang 李大章, copies to Liao Qigao 廖起高 and Xu Mengxia 許夢俠. By June 1961 the goods taken in the steel drive 大辦鋼鐵 are in the main not refunded; of those taken for water works and for communications 大辦水利、大辦交通, only a small part.
