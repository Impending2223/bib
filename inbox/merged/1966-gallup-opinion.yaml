patch: 1966-gallup-opinion
by: Claude (agent), from The Gallup Poll, III (1972), pp. 1983-2040, read off the page images
ops:
- add:
    entry:
      id: cal.1966-01-12.opinion
      when: Jan. 12
      date: '1966-01-12'
      thread: opinion
      c: 'Gallup, Dec. 11–16, 1965: the policy Johnson should follow: more to the right, with business and conservative groups, 20 percent; more to the left, with labor and other liberal groups, 14; half-way between, 52.'
      n: '[[w.gallup-poll]], III, 1983. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1966-01-14.opinion
      when: Jan. 14
      date: '1966-01-14'
      thread: opinion
      also: [congress]
      c: 'Gallup, Dec. 11–16, 1965: a four-year term for members of the House in place of two: favor 61 percent, oppose 24. Republicans 65 favor; Democrats 59; independents 65.'
      n: '[[w.gallup-poll]], III, 1983. See [[cal.1966-01-12.program]].'
- add:
    entry:
      id: cal.1966-01-16.opinion
      when: Jan. 16
      date: '1966-01-16'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Dec. 11–16, 1965: liked best about Nixon: his honesty 12 percent; sincerity 8; personality 8; experience 7. Least: personality 9; on the fence 8; his policies 7; a poor loser 5. Wants to be President, 77. Will win the nomination: yes 24, no 64. Would like to see him President: yes 31, no 57; Republicans 60, independents 33, Democrats 15.'
      n: '[[w.gallup-poll]], III, 1983–85. Names: Nixon (Opp. III.E).'
      tags: ['name:nixon-richard-m']
- add:
    entry:
      id: cal.1966-01-23.opinion
      when: Jan. 23
      date: '1966-01-23'
      thread: opinion
      also: [elections-1966]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the party one would like to see win the congressional district, by region: South, Democratic 71 percent, Republican 29; East 59 and 41; West 53 and 47; Midwest 52 and 48.'
      n: '[[w.gallup-poll]], III, 1985.'
- add:
    entry:
      id: cal.1966-01-26.opinion
      when: Jan. 26
      date: '1966-01-26'
      thread: opinion
      also: [congress]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Senators limited to two six-year terms: favor 50 percent, oppose 38.'
      n: '[[w.gallup-poll]], III, 1986.'
- add:
    entry:
      id: cal.1966-01-30.opinion
      when: Jan. 30
      date: '1966-01-30'
      thread: opinion
      also: [jobs-and-wages]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the $1.25 minimum wage: increase 66 percent, leave as is 33. The work week cut from 40 hours to 35: should 28, should not 65. Overtime at double time in place of time-and-a-half: favor 28, oppose 65. No strike to last more than seven days, a committee appointed by the Government then to decide: favor 58, oppose 29.'
      n: '[[w.gallup-poll]], III, 1986.'
- add:
    entry:
      id: cal.1966-02-04.opinion
      when: Feb. 4
      date: '1966-02-04'
      thread: opinion
      also: [economy, vietnam]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: prices and wages frozen for as long as the war in Vietnam lasts: a good idea 45 percent, a poor idea 42.'
      n: '[[w.gallup-poll]], III, 1987.'
- add:
    entry:
      id: cal.1966-02-06.opinion
      when: Feb. 6
      date: '1966-02-06'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Republicans'' best candidate for 1968: Nixon 33, Lodge 15, Goldwater 11, Romney 10, Scranton 5, Dirksen 5, Rockefeller 5, Lindsay 4, Taft 4, Reagan 3, Percy 2, Hatfield 1. Independents: Nixon 21, Lodge 15, Romney 12, Goldwater 10, Rockefeller 8, Dirksen 7. Democrats: Lodge 17, Nixon 14, Rockefeller 13, Scranton 11.'
      n: '[[w.gallup-poll]], III, 1987. Names: Nixon (Opp. III.E); Lodge (K–J Adm. III.E); Goldwater, Percy, Hatfield (Opp. III.B); Romney, Scranton, Rockefeller (Opp. III.H); Dirksen (K–J Cong. III.A); Lindsay (Opp. III.D); Reagan (Opp. III.F).'
      tags: ['name:nixon-richard-m', 'name:lodge-henry-cabot', 'name:goldwater-barry-m', 'name:romney-george-w', 'name:scranton-william-w', 'name:dirksen-everett', 'name:rockefeller-nelson', 'name:lindsay-john-v', 'name:taft-robert-jr', 'name:reagan-ronald', 'name:percy-charles-h', 'name:hatfield-mark-o']
- add:
    entry:
      id: cal.1966-02-09.opinion
      when: Feb. 9
      date: '1966-02-09'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Jan. 21–26: the move to ask the UN to work out its own formula for peace in Vietnam: approve 74 percent, disapprove 13. The United States to accept the UN''s decision, whatever it is: a good idea 49, a poor idea 37. Dec. 31, 1965–Jan. 5, 1966: the war to end in a clear-cut military victory 7; in a compromise settlement 69.'
      n: '[[w.gallup-poll]], III, 1987–88. See [[cal.1966-01-31.vietnam]].'
- add:
    entry:
      id: cal.1966-02-11.opinion
      when: Feb. 11
      date: '1966-02-11'
      thread: opinion
      also: [court]
      c: 'Gallup, Dec. 11–16, 1965: Supreme Court Justices and other federal judges required to retire at 72: a good idea 76 percent, a poor idea 17.'
      n: '[[w.gallup-poll]], III, 1988.'
- add:
    entry:
      id: cal.1966-02-13.opinion
      when: Feb. 13
      date: '1966-02-13'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: Humphrey 47 percent, Nixon 45, undecided 8. Independents: Nixon 53, Humphrey 32. East: Humphrey 59, Nixon 34. South: Nixon 56, Humphrey 33.'
      n: '[[w.gallup-poll]], III, 1988–89. Names: Humphrey (K–J Cong. III.A); Nixon (Opp. III.E).'
      tags: ['name:humphrey-hubert-h', 'name:nixon-richard-m']
- add:
    entry:
      id: cal.1966-02-16.opinion
      when: Feb. 16
      date: '1966-02-16'
      thread: opinion
      also: [elections-1966]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: the party more likely to keep the country out of World War III: Democratic 28 percent, Republican 25, no difference 31. To keep it prosperous: Democratic 48, Republican 19, no difference 21.'
      n: '[[w.gallup-poll]], III, 1989.'
- add:
    entry:
      id: cal.1966-02-18.opinion
      when: Feb. 18
      date: '1966-02-18'
      thread: opinion
      also: [defense, vietnam]
      c: 'Gallup, Dec. 31, 1965–Jan. 5, 1966: can identify McNamara, 58 percent; college-educated 88, grade school 34. Of them, his grade for running the Defense Department: A 31, B 25, C 18, D 5, flunk 10. For handling the military problems in Vietnam: A 23, B 24, C 22, D 7, flunk 13.'
      n: '[[w.gallup-poll]], III, 1989. Names: McNamara (K–J Adm. III.F).'
      tags: ['name:mcnamara-robert-s']
- add:
    entry:
      id: cal.1966-02-27.opinion
      when: Feb. 27
      date: '1966-02-27'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Jan. 21–26: can identify Romney, 43 percent; Republicans 56, independents 55, Democrats 33. Of all asked, a favorable opinion of him 30, unfavorable 3. Of those who can identify him, would like to see him President: yes 38, no 28.'
      n: '[[w.gallup-poll]], III, 1991. Names: Romney (Opp. III.H).'
      tags: ['name:romney-george-w']
- add:
    entry:
      id: cal.1966-03-04.opinion
      when: Mar. 4
      date: '1966-03-04'
      thread: opinion
      also: [jobs-and-wages]
      c: 'Gallup, Jan. 21–26: a worker in a unionized plant required to join the union: should 42 percent, should not 49. A law making all strikes illegal: favor 27, oppose 61. Unions covering whole industries brought under the antitrust laws: agree 43, disagree 26. The laws regulating unions: not strict enough 40, too strict 11, about right 25. Those regulating business: not strict enough 20, too strict 20, about right 32.'
      n: '[[w.gallup-poll]], III, 1992–93. The union-shop question''s field dates printed 1/21-26/65 (survey 723-K).'
- add:
    entry:
      id: cal.1966-03-06.opinion
      when: Mar. 6
      date: '1966-03-06'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Feb. 10–15: bombing industrial plants and factories in North Vietnam: favor 61 percent, oppose 26. Bombing big cities in North Vietnam: favor 28, oppose 60.'
      n: '[[w.gallup-poll]], III, 1993.'
- add:
    entry:
      id: cal.1966-03-09.opinion
      when: Mar. 9
      date: '1966-03-09'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Feb. 10–15: Johnson''s handling of Vietnam: approve 50 percent, disapprove 33.'
      n: '[[w.gallup-poll]], III, 1993. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1966-03-11.opinion
      when: Mar. 11
      date: '1966-03-11'
      thread: opinion
      also: [elections-1968, robert-kennedy]
      c: 'Gallup, Feb. 10–15: Robert Kennedy 54 percent, Nixon 41, undecided 5. Independents: Nixon 52, Kennedy 39. South: 46 and 46. College-educated: Nixon 53, Kennedy 43. Catholics: Kennedy 67, Nixon 29; Protestants: Nixon 48, Kennedy 47.'
      n: '[[w.gallup-poll]], III, 1993–94. Names: Robert Kennedy (K–J Adm. III.A); Nixon (Opp. III.E).'
      tags: ['name:kennedy-robert-f', 'name:nixon-richard-m']
- add:
    entry:
      id: cal.1966-03-13.opinion
      when: Mar. 13
      date: '1966-03-13'
      thread: opinion
      also: [foreign-aid, vietnam]
      c: 'Gallup, Feb. 10–15: foreign aid in general: for 53 percent, against 35. The kinds favored: training teachers and building schools 65; better farming methods 61; hospitals, doctors and nurses, medicine 61; birth control information 43; surplus food 41; factories and industries 33; highways and railroads 21; military strength 18. A country receiving aid that fails to support the United States in a major decision such as Vietnam: continue the aid 16, reduce it 30, cut it off 45.'
      n: '[[w.gallup-poll]], III, 1995.'
- add:
    entry:
      id: cal.1966-03-20.opinion
      when: Mar. 20
      date: '1966-03-20'
      thread: opinion
      also: [elections-1966]
      c: 'Gallup, Mar. 3–8: the party one would like to see win the congressional district, by region: South, Democratic 74 percent, Republican 26; East 56 and 44; Midwest 51 and 49; West 50 and 50.'
      n: '[[w.gallup-poll]], III, 1996.'
- add:
    entry:
      id: cal.1966-03-25.opinion
      when: Mar. 25
      date: '1966-03-25'
      thread: opinion
      c: 'Gallup, Mar. 3–8: can identify Rusk, 65 percent; college-educated nine in ten, grade school 39. Of them, his grade as Secretary of State: A 32, B 33, C 15, D 2, flunk 3. Republicans A 22; Democrats A 40.'
      n: '[[w.gallup-poll]], III, 1997. Names: Rusk (K–J Adm. III.E).'
      tags: ['name:rusk-dean']
- add:
    entry:
      id: cal.1966-04-01.opinion
      when: Apr. 1
      date: '1966-04-01'
      thread: opinion
      also: [vietnam, elections-1966]
      c: 'Gallup, Mar. 3–8: a candidate for Congress who says we should try harder for a compromise peace in Vietnam: more inclined to vote for him 67 percent, less 15. Republicans 65 more inclined; Democrats 69; independents 65.'
      n: '[[w.gallup-poll]], III, 1998.'
- add:
    entry:
      id: cal.1966-04-03.opinion
      when: Apr. 3
      date: '1966-04-03'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Mar. 3–8: overall feelings about Vietnam: a necessary evil 43 percent; the United States should get out 15; be more aggressive 12; fear of war 11; a wish for a quick end 10; too many lives lost 5.'
      n: '[[w.gallup-poll]], III, 1998–99.'
- add:
    entry:
      id: cal.1966-04-06.opinion
      when: Apr. 6
      date: '1966-04-06'
      thread: opinion
      also: [court]
      c: 'Gallup, Jan. 21–26: Supreme Court Justices and other federal judges chosen by the President from a list of candidates the American Bar Association approves: a good idea 61 percent, a poor idea 22.'
      n: '[[w.gallup-poll]], III, 1999.'
- add:
    entry:
      id: cal.1966-04-10.opinion
      when: Apr. 10
      date: '1966-04-10'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Mar. 24–29: Republicans'' best candidate for 1968: Nixon 27, Romney 14, Goldwater 13, Lodge 12, Dirksen 7, Scranton 6, Rockefeller 5, Reagan 4, Lindsay 2, Hatfield 1. Independents: Nixon 22, Lodge 14, Romney 14, Goldwater 10. Of five, Hatfield, Lindsay, Reagan, Romney and Scranton: Republicans, Romney 34, Scranton 17, Reagan 11, Lindsay 11, Hatfield 7; independents, Romney 28, Scranton 22, Lindsay 14, Reagan 7, Hatfield 3.'
      n: '[[w.gallup-poll]], III, 1999–2000. Names: Nixon (Opp. III.E); Romney, Scranton, Rockefeller (Opp. III.H); Goldwater, Hatfield (Opp. III.B); Lodge (K–J Adm. III.E); Dirksen (K–J Cong. III.A); Reagan (Opp. III.F); Lindsay (Opp. III.D).'
      tags: ['name:nixon-richard-m', 'name:romney-george-w', 'name:goldwater-barry-m', 'name:lodge-henry-cabot', 'name:dirksen-everett', 'name:scranton-william-w', 'name:rockefeller-nelson', 'name:reagan-ronald', 'name:lindsay-john-v', 'name:hatfield-mark-o']
- add:
    entry:
      id: cal.1966-04-15.opinion
      when: Apr. 15
      date: '1966-04-15'
      thread: opinion
      also: [economy]
      c: 'Gallup, Feb. 10–15: one''s own federal income tax: too high 52 percent, about right 39, too low under 1.'
      n: '[[w.gallup-poll]], III, 2000.'
- add:
    entry:
      id: cal.1966-04-17.opinion
      when: Apr. 17
      date: '1966-04-17'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Mar. 24–29, a peace plan: the UN to hold elections in North and South Vietnam on their governments and on unification; the United States to withdraw its soldiers from the mainland, the North Vietnamese theirs from the South; American ships and planes to stay offshore, ready to bomb the North. Favor 62 percent, oppose 18. Republicans 64, Democrats 63, independents 62. Grade school 52 favor, 38 no opinion.'
      n: '[[w.gallup-poll]], III, 2001.'
- add:
    entry:
      id: cal.1966-04-20.opinion
      when: Apr. 20
      date: '1966-04-20'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Mar. 24–29: Johnson''s handling of Vietnam: approve 54 percent, disapprove 31.'
      n: '[[w.gallup-poll]], III, 2001. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry: {id: cal.1966-04-22.opinion, when: Apr. 22, date: '1966-04-22', thread: opinion, c: 'Gallup, Mar. 24–29: Communist China admitted to the UN: should 25 percent, should not 55. If the UN votes to admit it, the United States to go along: should 49, should not 31. Admission if it would improve relations with the United States: yes 56, no 28.', n: '[[w.gallup-poll]], III, 2001–02.'}
- add:
    entry:
      id: cal.1966-04-27.opinion
      when: Apr. 27
      date: '1966-04-27'
      thread: opinion
      also: [elections-1966, vietnam]
      c: 'Gallup, Mar. 24–29, Republicans: the best reasons Republican candidates for Congress can give this fall, by frequency of mention: Vietnam, by about half of those with an opinion; high taxes and prices; the Democratic Administration in general.'
      n: '[[w.gallup-poll]], III, 2002.'
- add:
    entry:
      id: cal.1966-04-29.opinion
      when: Apr. 29
      date: '1966-04-29'
      thread: opinion
      also: [elections-1966, poverty]
      c: 'Gallup, Mar. 24–29, Democrats: the best reasons Democratic candidates for Congress can give this fall, by frequency of mention: the handling of Vietnam; the antipoverty program; the Democrats'' record.'
      n: '[[w.gallup-poll]], III, 2002.'
- add:
    entry:
      id: cal.1966-05-06.opinion
      when: May 6
      date: '1966-05-06'
      thread: opinion
      also: [poverty]
      c: 'Gallup, Mar. 24–29: have heard or read of the antipoverty program, 80 percent. Of them, a program in their area: yes 27, no 37, don''t know 36; of those saying yes, about a third call the money well spent, a third poorly. The program nationwide: favorable 48, unfavorable 31.'
      n: '[[w.gallup-poll]], III, 2003–04. The survey printed 724-K (Feb. 10–15), the field dates Mar. 24–29 (726-K). Check.'
- add:
    entry:
      id: cal.1966-05-11.opinion
      when: May 11
      date: '1966-05-11'
      thread: opinion
      also: [economy, vietnam]
      c: 'Gallup, Apr. 14–19: have heard of the suggestion from Washington of higher income taxes, 68 percent. Of them, an increase now: favor 16, oppose 76.'
      n: '[[w.gallup-poll]], III, 2005.'
- add:
    entry:
      id: cal.1966-05-11.opinion-2
      when: May 11
      date: '1966-05-11'
      thread: opinion
      also: [economy, vietnam]
      c: 'Gallup, Apr. 14–19: prices and wages frozen for as long as the war in Vietnam lasts: a good idea 42 percent, a poor idea 44.'
      n: '[[w.gallup-poll]], III, 2005.'
- add:
    entry:
      id: cal.1966-05-13.opinion
      when: May 13
      date: '1966-05-13'
      thread: opinion
      also: [economy]
      c: 'Gallup, Mar. 3–8: prices in the next six months: up 81 percent, down 3, the same 13. The party more likely to keep prices down: Republican 26, Democratic 24, no difference 35. Independents: Republican 23, Democratic 17, no difference 42.'
      n: '[[w.gallup-poll]], III, 2005.'
- add:
    entry:
      id: cal.1966-05-15.opinion
      when: May 15
      date: '1966-05-15'
      thread: opinion
      also: [transportation]
      c: 'Gallup, Apr. 14–19: the chief reason for auto accidents: careless drivers 60 percent; speeding 31; drinking 21; young drivers 5; faulty cars 3; cars too high-powered 2. Higher safety standards for future cars set by the Federal Government 12, by the industry 29, by both 55.'
      n: '[[w.gallup-poll]], III, 2005–06.'
- add:
    entry:
      id: cal.1966-05-18.opinion
      when: May 18
      date: '1966-05-18'
      thread: opinion
      also: [congress]
      c: 'Gallup, Jan. 21–26: a constitutional amendment to abolish the Electoral College and elect the President by the national popular vote: approve 63 percent, disapprove 20.'
      n: '[[w.gallup-poll]], III, 2006.'
- add:
    entry:
      id: cal.1966-05-20.opinion
      when: May 20
      date: '1966-05-20'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, May 5–10: Johnson''s handling of Vietnam: approve 47 percent, disapprove 35. Democrats 57 approve; independents 46; Republicans 35.'
      n: '[[w.gallup-poll]], III, 2006–07. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1966-05-22.opinion
      when: May 22
      date: '1966-05-22'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, Apr. 14–19: if the South Vietnamese start fighting among themselves on a big scale: continue to help them 28 percent, withdraw 54; college-educated 40 and 45. If the South Vietnamese government stops fighting: the United States to go on with the war alone 16, withdraw 72. The South Vietnamese able to establish a stable government: yes 32, no 48.'
      n: '[[w.gallup-poll]], III, 2007–09. See [[cal.1966-03-10.vietnam]].'
- add:
    entry:
      id: cal.1966-05-25.opinion
      when: May 25
      date: '1966-05-25'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, Apr. 14–19: Johnson 54 percent, Nixon 36, undecided 10.'
      n: '[[w.gallup-poll]], III, 2009. Names: Johnson (K–J Adm. III.D); Nixon (Opp. III.E).'
      tags: ['name:johnson-lyndon-b', 'name:nixon-richard-m']
- add:
    entry:
      id: cal.1966-05-27.opinion
      when: May 27
      date: '1966-05-27'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, May 5–10: the most important problem: Vietnam 45 percent; the cost of living 16; civil rights 9; threat of war 8; world communism 5; lack of religion, immorality 5. The party better able to handle it: Democratic 29, Republican 22, no difference 37.'
      n: '[[w.gallup-poll]], III, 2009.'
- add:
    entry:
      id: cal.1966-05-29.opinion
      when: May 29
      date: '1966-05-29'
      thread: opinion
      also: [elections-1966]
      c: 'Gallup, May 19–24: the party one would like to see win the congressional district: Democratic 53 percent, Republican 47. South 68 and 32; outside the South 50 and 50.'
      n: '[[w.gallup-poll]], III, 2009.'
- add:
    entry:
      id: cal.1966-06-01.opinion
      when: June 1
      date: '1966-06-01'
      thread: opinion
      also: [desegregation-schools]
      c: 'Gallup, May 5–10: white parents who would object to a school where a few of the children are colored: outside the South 6 percent, South 24; where half are, 32 and 49; where more than half are, 60 and 62.'
      n: '[[w.gallup-poll]], III, 2010.'
- add:
    entry:
      id: cal.1966-06-03.opinion
      when: June 3
      date: '1966-06-03'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, May 5–10: the United States made a mistake sending troops to fight in Vietnam: yes 36 percent, no 49. Republicans 42 yes; independents 37; Democrats 32. Under 30, 29; 50 and over, 42. Canadians, a special survey, the United States'' handling of Vietnam: approve 35, disapprove 34.'
      n: '[[w.gallup-poll]], III, 2010.'
- add:
    entry:
      id: cal.1966-06-08.opinion
      when: June 8
      date: '1966-06-08'
      thread: opinion
      also: [vietnam]
      c: 'Gallup, May 19–24: Johnson''s handling of Vietnam: approve 41 percent, disapprove 37. Democrats 49 approve; Republicans 34; independents 33.'
      n: '[[w.gallup-poll]], III, 2011. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1966-06-12.opinion
      when: June 12
      date: '1966-06-12'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, special survey of 1,597 Republican county chairmen, their own choice for 1968 from a list of thirteen: Nixon 717, Romney 342, Goldwater 174, Scranton 79, Reagan 74, Morton 49, Hatfield 48; others 98. The likely nominee: Nixon 775, Romney 445, Scranton 64, Reagan 19. Between Nixon and Romney: Nixon 944, Romney 475, undecided 178.'
      n: '[[w.gallup-poll]], III, 2012. "Morton" as printed. Check. Names: Nixon (Opp. III.E); Romney, Scranton (Opp. III.H); Goldwater, Hatfield (Opp. III.B); Reagan (Opp. III.F).'
      tags: ['name:nixon-richard-m', 'name:romney-george-w', 'name:goldwater-barry-m', 'name:scranton-william-w', 'name:reagan-ronald', 'name:hatfield-mark-o']
- add:
    entry:
      id: cal.1966-06-13.opinion
      when: June 13
      date: '1966-06-13'
      thread: opinion
      also: [elections-1968]
      c: 'Gallup, the same county chairmen: Nixon able to beat Johnson in 1968: yes 59 percent, no 30. East 45 and 44; Midwest 62 and 26; South 69 and 22; West 54 and 33. The harder Democrat to beat, in 1968 or 1972: Robert Kennedy 77, Humphrey 12.'
      n: '[[w.gallup-poll]], III, 2012–13. The votes printed under it (944, 475, 178) are those for Nixon and Romney ([[cal.1966-06-12.opinion]]). Check. Names: Nixon (Opp. III.E); Johnson (K–J Adm. III.D); Robert Kennedy (K–J Adm. III.A); Humphrey (K–J Cong. III.A).'
      tags: ['name:nixon-richard-m', 'name:johnson-lyndon-b', 'name:kennedy-robert-f', 'name:humphrey-hubert-h']
- add:
    entry:
      id: cal.1966-06-14.opinion
      when: June 14
      date: '1966-06-14'
      thread: opinion
      also: [elections-1966]
      c: 'Gallup, the same county chairmen: the best reasons Republican candidates for Congress can give this year: Vietnam 44 percent; the threat of inflation 41; Johnson''s domestic programs 37; too much government spending 33; Johnson has too much power 19; states'' rights 9; foreign policy 8.'
      n: '[[w.gallup-poll]], III, 2013. Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1966-06-15.opinion
      when: June 15
