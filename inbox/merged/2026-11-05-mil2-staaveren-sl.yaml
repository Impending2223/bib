patch: mil2-staaveren-sl
by: 'Claude (the military re-read, second run: Van Staaveren, Interdiction in Southern Laos, pp. 56-140), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1965-03-23.laos
      when: Mar. 23
      date: '1965-03-23'
      thread: laos
      c: The Joint Chiefs instruct CINCPAC and the Pacific Air and Fleet commanders to submit an operational plan for Steel
        Tiger's first two weeks.
      n: '[[w.staaveren-u-s-air-force]], 56. See [[cal.1965-03-20.laos]].'
      src:
        c: ccd2eb6b
        rows:
        - 'w.staaveren-u-s-air-force 56: all'
- add:
    entry:
      id: cal.1965-04-01.laos
      when: Apr. 1
      date: '1965-04-01'
      thread: laos
      also:
      - vietnam-air-war
      c: Green Python, the 15th Tactical Reconnaissance Squadron's RF-101s at Udorn since Mar. 31, flies its first Yankee
        Team mission over Laos; Apr. 2, by the Chiefs' order, its first over North Vietnam, opening Blue Tree.
      n: '[[w.staaveren-u-s-air-force]], 63.'
      src:
        c: 3e66fd38
        rows:
        - 'w.staaveren-u-s-air-force 63: all'
- add:
    entry:
      id: cal.1965-04-05.laos-2
      when: Apr. 5
      date: '1965-04-05'
      thread: laos
      c: 'The Air Force''s first Steel Tiger mission: four F-100s to strike and four for MiG cover, with two RF-101s, armed
        reconnaissance on three routes; the Ban Phanop supply depot hit.'
      n: '[[w.staaveren-u-s-air-force]], 59. See [[cal.1965-04-03.laos]].'
      src:
        c: 2baf9ba1
        rows:
        - 'w.staaveren-u-s-air-force 59: all'
- add:
    entry:
      id: cal.1965-04-08.laos
      when: Apr. 8
      date: '1965-04-08'
      thread: laos
      c: Steel Tiger aircraft attack a Pathet Lao airfield near Tchepone. In the first week few trucks sighted; 791 Steel
        Tiger sorties of all kinds by Apr. 29, the two services about even.
      n: '[[w.staaveren-u-s-air-force]], 61. See [[cal.1965-04-03.laos]].'
      src:
        c: 540e661e
        rows:
        - 'w.staaveren-u-s-air-force 61: all'
- add:
    entry:
      id: cal.1965-04-12.laos
      when: Apr. 12
      date: '1965-04-12'
      thread: laos
      c: 'McNamara with the Joint Chiefs on making the air programs in Laos tell against the Pathet Lao, the North Vietnamese
        and infiltration: he approves passing some of his authority over Barrel Roll and Steel Tiger to the Chiefs and Sharp,
        and easier rules.'
      n: '[[w.staaveren-u-s-air-force]], 61. See [[cal.1965-04-17.laos]]. Names: McNamara, Sharp.'
      src:
        c: 0c831693
        rows:
        - 'w.staaveren-u-s-air-force 61: all'
      tags:
      - name:mcnamara-robert-s
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1965-05-01.laos
      when: May 1
      date: '1965-05-01'
      thread: laos
      also:
      - vietnam-air-war
      c: Thailand approves up to twelve RF-101s at Udorn; six more flown in, eleven Thai-based reconnaissance aircraft in
        all.
      n: '[[w.staaveren-u-s-air-force]], 63.'
      src:
        c: 7736c8cd
        rows:
        - 'w.staaveren-u-s-air-force 63: all'
- add:
    entry:
      id: cal.1965-05-03.laos
      when: May 3
      date: '1965-05-03'
      thread: laos
      c: Sullivan allows Steel Tiger pilots to strike approved secondary targets first, before armed reconnaissance.
      n: '[[w.staaveren-u-s-air-force]], 62. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: d39b8a48
        rows:
        - 'w.staaveren-u-s-air-force 62: all'
      tags:
      - name:sullivan-william-h
- cite:
    id: cal.1965-05-09.laos
    item: '[[w.staaveren-u-s-air-force]], 65 (the Bango aircraft''s first mission, in support of the RLAF''s attack on an
      armored column on the Plain of Jars)'
    units: all
- add:
    entry:
      id: cal.1965-05-11.laos
      when: May 11
      date: '1965-05-11'
      thread: laos
      c: 'Two Navy aircraft strike two civilian buses west of Muong Phalane: fourteen Lao killed, mostly dependents of Group
        Mobile 15''s soldiers, forty-one wounded. Sullivan halts all Steel Tiger operations.'
      n: '[[w.staaveren-u-s-air-force]], 66. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: 1253d3e8
        rows:
        - 'w.staaveren-u-s-air-force 66: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-05-11.laos-2
      when: May 11–25
      date: '1965-05-11'
      thread: laos
      c: 'Red Haze: MACV tests an OV-1C Mohawk with infrared instruments over southern Laos at about 150 feet, OV-1A escorts.'
      n: '[[w.staaveren-u-s-air-force]], 63. See [[cal.1965-04-03.laos]].'
      src:
        c: f96cbec4
        rows:
        - 'w.staaveren-u-s-air-force 63: all'
- add:
    entry:
      id: cal.1965-05-19.laos
      when: May 19
      date: '1965-05-19'
      thread: laos
      c: Sullivan approves the Pacific Fleet's request to fly its carrier aircraft over North Vietnam on the way to Laotian
        targets, 60 to 160 miles shorter.
      n: '[[w.staaveren-u-s-air-force]], 65. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: ade6437a
        rows:
        - 'w.staaveren-u-s-air-force 65: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-05-22.laos-2
      when: May 22
      date: '1965-05-22'
      thread: laos
      c: 'Two more short rounds. Navy jets near Muong Phalane hit the same Laotian unit as on May 11: two killed, the company
        commander among them, eight wounded. Sullivan halts Steel Tiger in the area again; strikes below 5,000 feet only
        by the embassy''s leave.'
      n: '[[w.staaveren-u-s-air-force]], 67. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: d08e5fee
        rows:
        - 'w.staaveren-u-s-air-force 67: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-06-07.laos
      when: June 7
      date: '1965-06-07'
      thread: laos
      c: Steel Tiger resumes under new instructions to the Pacific Air Force's and Fleet's pilots.
      n: '[[w.staaveren-u-s-air-force]], 67. See [[cal.1965-04-03.laos]].'
      src:
        c: fd05eb46
        rows:
        - 'w.staaveren-u-s-air-force 67: all'
- add:
    entry:
      id: cal.1965-07-19.laos
      when: July 19
      date: '1965-07-19'
      thread: laos
      c: The two-mile buffer zone along the North Vietnamese border, the Chiefs' rule of December 1964, deleted with Souvanna
        Phouma's assent; State and Defense had agreed June 25 to Sullivan's request.
      n: '[[w.staaveren-u-s-air-force]], 66. Names: Souvanna Phouma, Sullivan.'
      src:
        c: 27575c4c
        rows:
        - 'w.staaveren-u-s-air-force 66: all'
      tags:
      - name:souvanna-phouma
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-07-16.laos
      when: July 16–17
      date: '1965-07-16'
      thread: laos
      c: The Pacific Air Force's F-105s drop 18,000 pounds of ordnance on each of the passes on the North Vietnamese border,
        Mụ Giạ the most.
      n: '[[w.staaveren-u-s-air-force]], 77. See [[cal.1965-04-03.laos]].'
      src:
        c: 173b17e3
        rows:
        - 'w.staaveren-u-s-air-force 77: all'
      tags:
      - place:mu-gia-pass
- add:
    entry:
      id: cal.1965-07-23.laos
      when: July 23–24
      date: '1965-07-23'
      thread: laos
      c: 'Bangkok, SEACOORD. Westmoreland: small non-jet aircraft wanted, five O-1E Bird Dogs to be asked. Golden Eagle,
        forays on the trail from Thailand, approved "for planning purposes."'
      n: '[[w.staaveren-u-s-air-force]], 80, 87–88. Names: Westmoreland.'
      src:
        c: be1d594d
        rows:
        - 'w.staaveren-u-s-air-force 80, 87–88: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-09-12.laos
      when: Sept. 12
      date: '1965-09-12'
      thread: laos
      c: A photographic readout shows more enemy troops near the South Vietnamese border. MACV, the 2d Air Division and
        the embassy plan 50 to 100 sorties there in the first half of October, four free-strike zones, Shining Brass teams
        on the trail. Washington approves the strikes Sept. 24; canceled for bombing errors.
      n: '[[w.staaveren-u-s-air-force]], 88. See [[cal.1965-09-18.laos]].'
      src:
        c: 130466b6
        rows:
        - 'w.staaveren-u-s-air-force 88: all'
- add:
    entry:
      id: cal.1965-09-20.laos
      when: Sept. 20
      date: '1965-09-20'
      thread: laos
      c: 'The Joint Chiefs tell Westmoreland Shining Brass is approved "in principle": Phase I may begin; teams with American
        advisers to enter Laos by land from South Vietnam.'
      n: '[[w.staaveren-u-s-air-force]], 89. See [[cal.1965-09-18.laos]]. Names: Westmoreland.'
      src:
        c: f9203439
        rows:
        - 'w.staaveren-u-s-air-force 89: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1965-09-29.laos
      when: Sept. 29
      date: '1965-09-29'
      thread: laos
      c: 'Two Navy A-1Hs, thirty miles off course, strike southeast of Thakhek. Sept. 30, four F-105s take fish traps for
        a pontoon bridge and strafe a prohibited area near the South Vietnamese border: two villagers wounded.'
      n: '[[w.staaveren-u-s-air-force]], 88–89. See [[cal.1965-04-03.laos]].'
      src:
        c: c3b75525
        rows:
        - 'w.staaveren-u-s-air-force 88–89: all'
- add:
    entry:
      id: cal.1965-10-01.laos
      when: Oct. 1
      date: '1965-10-01'
      thread: laos
      c: F-105s, on badly marked maps, strike a bridge in a prohibited area three times; F-4s had hit it by accident Sept.
        15. Sullivan suspends all armed reconnaissance in Steel Tiger. Pettigrew's "three uncomfortable hours" with Thao
        Ma.
      n: '[[w.staaveren-u-s-air-force]], 89. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: 6db1cf9a
        rows:
        - 'w.staaveren-u-s-air-force 89: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-10-06.laos
      when: Oct. 6
      date: '1965-10-06'
      thread: laos
      c: Sullivan lets Steel Tiger resume within narrower bounds.
      n: '[[w.staaveren-u-s-air-force]], 89. See [[cal.1965-04-03.laos]]. Names: Sullivan.'
      src:
        c: 2d51263d
        rows:
        - 'w.staaveren-u-s-air-force 89: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1965-10-30.vietnam-air-war
      when: Oct. 30
      date: '1965-10-30'
      thread: vietnam-air-war
      also:
      - laos
      c: 'Nine RF-4Cs arrive at Tân Sơn Nhứt: side-looking radar, forward-looking infrared, day and night cameras. Their
        first mission over Laos Dec. 16.'
      n: '[[w.staaveren-u-s-air-force]], 102.'
      src:
        c: 4b1fcc2e
        rows:
        - 'w.staaveren-u-s-air-force 102: all'
      tags:
      - place:tan-son-nhut
- add:
    entry:
      id: cal.1965-11-02.laos
      when: Nov. 2
      date: '1965-11-02'
      thread: laos
      c: 'Shining Brass''s second team, put off by weather, lifted in near the border: a skirmish, two enemy killed; strikes
        called, then the team out. Nov. 3–11, eighty-three sorties on the target it found; B-57s Nov. 5.'
      n: '[[w.staaveren-u-s-air-force]], 93. See [[cal.1965-10-18.laos-2]].'
      src:
        c: e4a32f94
        rows:
        - 'w.staaveren-u-s-air-force 93: all'
- add:
    entry:
      id: cal.1965-11-03.laos
      when: Nov. 3
      date: '1965-11-03'
      thread: laos
      c: Thao Ma, with Pettigrew, again allows American strikes in the areas closed since September, with "extreme care"
        and notice to him.
      n: '[[w.staaveren-u-s-air-force]], 94.'
      src:
        c: dbffebfe
        rows:
        - 'w.staaveren-u-s-air-force 94: all'
- add:
    entry:
      id: cal.1965-11-20.laos
      when: Nov. 20
      date: '1965-11-20'
      thread: laos
      c: MACV transfers five O-1E Bird Dogs from the Army to the Air Force's Detachment 6, 1st Air Commando Squadron, at
        Udorn, of the ten Thao Ma asked. The same day F-105s drop near Khangkhai, by the Plain of Jars, without much damage.
      n: '[[w.staaveren-u-s-air-force]], 95, 97.'
      src:
        c: 5253c983
        rows:
        - 'w.staaveren-u-s-air-force 95, 97: all'
- add:
    entry:
      id: cal.1965-11-21.laos
      when: Nov. 21
      date: '1965-11-21'
      thread: laos
      c: 'B-57s aiming at a bridge over the Kong River near Attopeu hit a station wagon, houses and a temple: a monk killed,
        civilians injured. More mishaps in the panhandle Nov. 24, Nov. 30 and Dec. 1.'
      n: '[[w.staaveren-u-s-air-force]], 97. See [[cal.1965-04-03.laos]].'
      src:
        c: b376ac69
        rows:
        - 'w.staaveren-u-s-air-force 97: all'
- cite:
    id: cal.1965-12.laos-2
    item: '[[w.staaveren-u-s-air-force]], 101 (two Ranch Hand UC-123s begin defoliating routes and trails in the Tiger Hound
      sector, Dec. 6)'
    units: all
- check:
    id: cal.1965-12.laos-2
    text: 'Check: Van Staaveren, 101, dates it Dec. 6, in the Tiger Hound sector.'
- add:
    entry:
      id: cal.1965-12-25.laos
      when: Dec. 25
      date: '1965-12-25'
      thread: laos
      c: Johnson, persuaded by Sullivan that a halt over the North need not touch Laos, lets Barrel Roll, Steel Tiger and
        Tiger Hound resume on Christmas Day; by Dec. 28 some hundred sorties a day in Tiger Hound.
      n: '[[w.staaveren-u-s-air-force]], 103. See [[cal.1965-12-24.laos]]. Names: Johnson, Sullivan.'
      src:
        c: 464ba32b
        rows:
        - 'w.staaveren-u-s-air-force 103: all'
      tags:
      - name:johnson-lyndon-b
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1966-01-07.laos
      when: Jan. 7
      date: '1966-01-07'
      thread: laos
      c: Bond takes up his post at Udorn as the 2d Air Division's deputy commander, Thirteenth Air Force; with the Seventh
        Air Force, Apr. 1, its deputy.
      n: '[[w.staaveren-u-s-air-force]], 108.'
      src:
        c: ef418f86
        rows:
        - 'w.staaveren-u-s-air-force 108: all'
- add:
    entry:
      id: cal.1966-01-14.laos
      when: Jan. 14
      date: '1966-01-14'
      thread: laos
      c: Sullivan narrows the Steel Tiger area to the southernmost sector of Laos, after the mis-strikes.
      n: '[[w.staaveren-u-s-air-force]], 129. Names: Sullivan.'
      src:
        c: d4c27cb9
        rows:
        - 'w.staaveren-u-s-air-force 129: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1966-01-17.laos
      when: Jan. 17
      date: '1966-01-17'
      thread: laos
      c: Detachment 1 of the 505th Tactical Control Group, Air Force O-1s, set up at Nakhon Phanom. Feb. 8, five more O-1s
        and six pilots; the O-1s also drop road spikes.
      n: '[[w.staaveren-u-s-air-force]], 108, 110.'
      src:
        c: 31795ada
        rows:
        - 'w.staaveren-u-s-air-force 108, 110: all'
- add:
    entry:
      id: cal.1966-01-30.laos
      when: Jan. 30
      date: '1966-01-30'
      thread: laos
      also:
      - vietnam-air-war
      c: Rolling Thunder resumes; attack sorties in Laos, 3,023 in December and 8,000 in January during the pause, fall
        to 5,232 in February.
      n: '[[w.staaveren-u-s-air-force]], 107.'
      src:
        c: ed390760
        rows:
        - 'w.staaveren-u-s-air-force 107: all'
- add:
    entry:
      id: cal.1966-02-05.laos
      when: Feb. 5
      date: '1966-02-05'
      thread: laos
      c: 'Two F-4Cs, diverted from Barrel Roll, strike Muong Hiem in Xiengkhouang, the headquarters of a battalion of Kong
        Lê''s: twelve friendly killed, thirty-seven wounded.'
      n: '[[w.staaveren-u-s-air-force]], 129. Names: Kong Lê.'
      src:
        c: ece95224
        rows:
        - 'w.staaveren-u-s-air-force 129: all'
      tags:
      - name:kong-le
- add:
    entry:
      id: cal.1966-02-17.laos
      when: Feb. 17–18
      date: '1966-02-17'
      thread: laos
      c: 'Shining Brass team Maine on a trail segment: some 66 men seen; two A-1Es bomb and strafe; two secondary explosions.
        Lifted out Mar. 19 under automatic-weapons fire.'
      n: '[[w.staaveren-u-s-air-force]], 120–21. See [[cal.1965-10-18.laos-2]].'
      src:
        c: d20c1c56
        rows:
        - 'w.staaveren-u-s-air-force 120–21: all'
- add:
    entry:
      id: cal.1966-02-25.laos
      when: Feb. 25
      date: '1966-02-25'
      thread: laos
      c: 'Sullivan eases the halt that followed the strike on a FAR command post: no flights below 18,000 feet within thirty-five
        miles of Muong Phalane but on prebriefed targets the RLAF has validated.'
      n: '[[w.staaveren-u-s-air-force]], 130. Names: Sullivan.'
      src:
        c: 55dd2e4d
        rows:
        - 'w.staaveren-u-s-air-force 130: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1966-02-27.laos
      when: Feb. 27–Mar. 1
      date: '1966-02-27'
      thread: laos
      c: 'Shining Brass teams Idaho and Dakota in Laos opposite Kon Tum: a strike''s target found with a few craters, no
        damage seen.'
      n: '[[w.staaveren-u-s-air-force]], 120. See [[cal.1965-10-18.laos-2]].'
      src:
        c: fdfd4004
        rows:
        - 'w.staaveren-u-s-air-force 120: all'
- add:
    entry:
      id: cal.1966-03-03.laos
      when: Mar. 3
      date: '1966-03-03'
      thread: laos
      c: 'Attopeu threatened: three demoralized FAR battalions, six North Vietnamese. RLAF T-28s strike; the first Air Force
        AC-47 there, Spooky 41, the next evening.'
      n: '[[w.staaveren-u-s-air-force]], 126.'
      src:
        c: c88ebc38
        rows:
        - 'w.staaveren-u-s-air-force 126: all'
- add:
    entry:
      id: cal.1966-03-15.laos
      when: Mar. 15
      date: '1966-03-15'
      thread: laos
      also:
      - vietnam-air-war
      c: Approval of SAC's B-52 strikes, Washington's till now, given jointly to PACOM and SAC.
      n: '[[w.staaveren-u-s-air-force]], 133.'
      src:
        c: 1b4a13e8
        rows:
        - 'w.staaveren-u-s-air-force 133: all'
- add:
    entry:
      id: cal.1966-05-26.laos
      when: May 26
      date: '1966-05-26'
      thread: laos
      c: The first guerrilla penetration toward Route 110, held up by weather and enemy troops; a unit reaches the road
        between Kong My and Muong May and mines it, eight antivehicle and thirty-two antipersonnel mines. A second unit
        reaches it June 2.
      n: '[[w.staaveren-u-s-air-force]], 124.'
      src:
        c: de149eb2
        rows:
        - 'w.staaveren-u-s-air-force 124: all'
- cite:
    id: cal.1966-05-18.laos
    item: '[[w.staaveren-u-s-air-force]], 123 (Sullivan''s assent to the Nungs in platoons, three American advisers at most,
      four missions a month)'
    units: all
- check:
    id: cal.1966-05-18.laos
    text: 'Check: Van Staaveren, 123, dates Sullivan''s assent May 24; the first launch not before June 7, McNamara consenting
      June 16.'
- add:
    entry:
      id: cal.1966-06-01.laos
      when: June 1
      date: '1966-06-01'
      thread: laos
      c: 'The 23d Tactical Air Support Squadron activated at Nakhon Phanom: twenty-two aircraft, twenty-five pilots; twelve
        more O-1s had come Apr. 1.'
      n: '[[w.staaveren-u-s-air-force]], 112.'
      src:
        c: cabdcd76
        rows:
        - 'w.staaveren-u-s-air-force 112: all'
- add:
    entry:
      id: cal.1966-07-20.vietnam-air-war
      when: July 20
      date: '1966-07-20'
      thread: vietnam-air-war
      also:
      - laos
      c: Tally Ho launched, against infiltration through the corner of North Vietnam above the DMZ.
      n: '[[w.staaveren-u-s-air-force]], 119.'
      src:
        c: 6e8d8edf
        rows:
        - 'w.staaveren-u-s-air-force 119: all'
- add:
    entry:
      id: cal.1966-12-12.laos
      when: Dec. 12
      date: '1966-12-12'
      thread: laos
      c: B-52s strike the Mụ Giạ Pass, the first time since April. Arc Light flew 406 sorties in Laos in the first half
        of 1966, mostly in April; Sullivan vetoed 25 missions, 216 sorties, May 27–July 5.
      n: '[[w.staaveren-u-s-air-force]], 139–40. See [[cal.1966-04-12.vietnam]]. Names: Sullivan.'
      src:
        c: 57738f79
        rows:
        - 'w.staaveren-u-s-air-force 139–40: all'
      tags:
      - place:mu-gia-pass
      - name:sullivan-william-h
