      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 141 (Apr. 12, 13, 1967); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 655 (Apr. 12–18, 1967; at the enlarged meeting of the Military Commission Lin Biao, Jiang Qing, Chen Boda, Kang Sheng and Zhang Chunqiao speak in turn, the book says concocting and criticizing the so-called "crimes" of Liu Shaoqi and Deng Xiaoping). Made public: 1968 ([[w.wuxian-fengguang-zai-xianfeng]], Jiang Qing''s speech). Names: Zhou Enlai, Kang Sheng, Chen Boda, Jiang Qing, Liu Shaoqi, Deng Xiaoping. Check: whether [[w.wuxian-fengguang-zai-xianfeng]] (1968), a Red Guard compilation, on which the year rests, was printed for internal circulation; if so, Made public is the year of the next work cited.'
- edit:
    id: cal.1967-05.china-leadership
    base: d8a9aad7
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1967 (no day); [[w.macfarquhar-maos-last-revolution]], 170–171 (to visiting Albanian officers: the original idea was to pick some successors from the intellectuals; the Peking Revolutionary Committee was "not necessarily appropriate" and there has to be a reorganization). Made public: 1967 ([[w.zheng-fa-hong-qi]], Oct. 17, 1967, the needle remark). Check: MacFarquhar (50) has Mao tell a visiting Albanian delegation in 1967 that it would have been "unsafe" to walk Peking''s streets before May 1966, and that two divisions were added to the garrison when the reorganization of the Peking committee was announced; whether this talk. Check: the day; the book dates the talk by its audience ("a delegation of visiting Albanian officers") only; the entry has "a foreign military delegation" in May. To check: [[w.nianyi-guanyu-he-long-yuanande]], 3 (cited by [[w.macfarquhar-maos-last-revolution]], 50 n.85); Minutes of Mao Zedong''s conversation with Albanian visitors, transcript in Chinese diary no. 10, in the authors'' possession (cited by [[w.macfarquhar-maos-last-revolution]], 171 n.3). Names: Mao Zedong, Lin Biao, Yao Wenyuan, Jiang Qing, Qi Benyu. Check: the delegation and the day; the nianpu gives only "5月."'
