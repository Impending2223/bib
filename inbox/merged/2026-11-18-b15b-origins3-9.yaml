      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1961. [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 541 (Sept. 24, 1961; at Wuhan Mao meets Montgomery, who asks who his successor is; Mao: very clear, Liu Shaoqi, first vice-chairman of the Party; after Mao''s death, him; asked if Zhou Enlai follows Liu, Mao says he does not care about what is after Liu). Made public: 1961 ([[w.sunday-times]], Oct. 15, 1961, Montgomery''s account). Names: Mao Zedong, Montgomery, Wang Renzhong, Liu Shaoqi.'
