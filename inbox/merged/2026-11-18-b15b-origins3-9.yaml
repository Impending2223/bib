      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 3, 1966 ("二月五日"). [[w.macfarquhar-maos-last-revolution]], 29 (the third draft to Liu, Zhou and Deng); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 631 (Feb. 5, 1966; Liu presides at the Politburo Standing Committee meeting, which discusses and agrees to the "Outline Report on the Current Academic Discussion" the Central Cultural Revolution Group of Five submitted (the "February Outline"); the outline says to keep to Mao''s policy of "letting go" stated at the propaganda work conference of March 1957, to hold to seeking truth from facts and equality before truth, to convince by reason and not decide like an academic overlord or press by force, to promote holding to truth and correcting mistakes at any time, to establish while breaking, to allow and welcome those who err and those who counter-attack academically to correct themselves, and to be serious and kind toward them, not "forbid revolution," and careful about publicly naming names in the press; Feb. 8 Peng Zhen and others report to Mao at Wuhan; Feb. 12 the Center sends the outline to the whole Party; footnote 1 (631) gives the Group''s head as Peng Zhen and its members as Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi); [[w.lengxi-shinian-lunzhan-1956-1966]], 933 ("early February": Liu Shaoqi''s meeting of the Standing Committee members in Peking, Zhou and Deng, after the Group of Five''s report, also took up whether to attend the CPSU''s 23rd Congress, invited in January; no view settled; Peng Zhen and Wu to ask Mao at Wuchang). Made public: 1982 ([[w.kan-kang-sheng-pingzhuan]]). Check: Wu (933) dates the meeting only "early February," and has it take up the CPSU''s invitation to its 23rd Congress as well. To check: Outline Report of the Group of Five (the "February Outline"), as sent to the Center, in [[w.mao-zhuxi-zuixin-zhishi]], 1057–58 (cited by [[w.macfarquhar-maos-last-revolution]], 29 n.65). See [[cal.1966-02-03.china-leadership-2]]. Names: Liu Shaoqi, Peng Zhen. Check: whether [[w.kan-kang-sheng-pingzhuan]] (1982), on which the year rests, was printed for internal circulation; if so, Made public is the year of the next work cited ([[w.jin-1949-1989-niande-zhongguo]], 1989).'
