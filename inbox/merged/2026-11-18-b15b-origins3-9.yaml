ops:
- edit:
    id: cal.1963-09-13.china-leadership
    base: dcbf4bcc
    set:
      c: 'Mao revises the second commentary on the Soviet open letter three times (early to mid-September), retitled "On the question of Stalin": the Stalin question a great question the world over, which stirred every class and is still argued; no verdict is likely this century. He adds Liu Shaoqi''s name beside his own: "Chinese Marxist-Leninists as represented by Comrade Mao Zedong and Comrade Liu Shaoqi."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 13, 1963 (the entry for early and mid-Sept.). [[w.zhou-enlai-nianpu-1949]], II, 583 (Sept. 1963: the nianpu notes that to set out its differing views the Renmin ribao and Hongqi jointly published, after discussion by the Center, commentary articles, nine by July 1964, opening the open polemic; a note gives the CPSU Central Committee''s open letter of July 14 as the cause); [[w.lengxi-shinian-lunzhan-1956-1966]], 645–646 (Mao made the most changes of the second commentary and wrote its opening himself: the Stalin question a world question, no verdict likely in this century); [[w.jianguo-yilai-mao-zedong]], XVII, 63–68 (Sept. 11, 1963; Mao''s note of Sept. 11, 7 a.m., to Kang Sheng: agreed to print on the 13th, some revisions, to be settled by Kang; his revisions run through the drafts of Sept. 2, 5 and 10, whose title "Why be willing to be Stalin''s enemy?" he changed to "On the question of Stalin"; the passage that no verdict on Stalin is likely this century). Made public: 1997. To check: Kang Sheng and Wu Lengxi, report to Mao Zedong sending the revised draft of "On the question of Stalin: second comment on the open letter of the CPSU Central Committee," Sept. 10, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 68 n.1a); Draft of the second comment on the CPSU open letter, "Why be willing to be Stalin''s enemy?", Sept. 2, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 68 n.1b); Draft of the second comment on the CPSU open letter, Sept. 5, 1963 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 68 n.1c). See [[cal.1963-09-06.china-leadership-5]]. Names: Mao Zedong, Liu Shaoqi. Check: the days of the revision; the nianpu gives early to mid-September, and Sept. 13 is the day of printing ([[w.lengxi-shinian-lunzhan-1956-1966]], 645).'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: f5969196
        rows:
