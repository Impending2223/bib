      id: cal.1963-09.king-2
      when: Sept.
      date: 1963-09
      thread: king
      c: 'Levison, overheard by the FBI, back at work on King''s Birmingham book: Al Duckett''s revisions found wanting, a
        second writer found, then a third; Joan Daves, King''s agent: Clarence Jones ineffective as go-between. Through Jones,
        to King: if he leaves Birmingham for Danville, readers will not care for the spring''s events, and King will come
        off "like a child who can''t finish something and moves on to some other game."'
      n: '[[w.branch-parting-the-waters]], 910–11. To check: FBI intercepts, Sept. 16, 1963, FLNY-9-292a; Sept. 21, FLNY-9-297a;
        Sept. 23, FLNY-7-553a; Sept. 24, FLNY-7-554b (cited by [[w.branch-parting-the-waters]], 911 n.1). Check: the days;
        Branch tells the book''s course from September into October and gives the intercepts together. See [[cal.1963-08-21.king-2]].
        Names: Levison, Martin Luther King.'
      tags:
      - name:levison-stanley-d
      - name:king-martin-luther-jr
      src:
