patch: b6-branch-ptw
by: 'Claude (batch 6 reader, Branch, Parting the Waters: the Passed over rows re-ruled under R18 as amended, Nov. 10-11, 2026)'
ops:
- add:
    entry:
      id: cal.1961-12-14.king
      when: Dec. 14
      date: '1961-12-14'
      thread: king
      c: 'King to Edward D. Ball, by letter, citing Du Bois''s application to the Communist Party, Oct. 1, as the act of "one
        of the most brilliant Negro scholars in America": "There can be no doubt that if the problem of racial discrimination
        is not solved in the not too distant future, some Negroes, out of frustration, discontent, and despair, will turn
        to some other ideology."'
      n: '[[w.branch-parting-the-waters]], 563. To check: King to Edward D. Ball, Dec. 14, 1961, King Papers, KP17, folder
        1 (cited by [[w.branch-parting-the-waters]], 563 n.3); Du Bois to Gus Hall, Oct. 1, 1961, King Papers, KP8, folder
        36; Jet, Dec. 7, 1961, 5 (cited by [[w.branch-parting-the-waters]], 563 n.2). Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: a79453ae
        rows:
        - 'w.branch-parting-the-waters 563: all'
        - 'via w.branch-parting-the-waters 563 n.3: all'
        - 'via w.branch-parting-the-waters 563 n.2a: all'
        - 'via w.branch-parting-the-waters 563 n.2b: all'
- add:
    entry:
      id: cal.1962-07-10.king
      when: July 10
      date: '1962-07-10'
      thread: king
      also:
      - georgia-albany
      c: 'Dora McDonald, King''s secretary, in her daily report to King in the Albany jail on the calls to his Atlanta office:
        an official of the National Press Club asks why King did not wait until after his speech there, July 19.'
      n: '[[w.branch-parting-the-waters]], 600. To check: McDonald to King, July 10, 1962, King Papers, KP15, folder 9 (cited
        by [[w.branch-parting-the-waters]], 600 n.2). See [[cal.1962-07-10.albany]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: e2242e6b
        rows:
        - 'w.branch-parting-the-waters 600: all'
        - 'via w.branch-parting-the-waters 600 n.2: all'
- add:
    entry:
      id: cal.1962-08.king
      when: Aug.
      date: 1962-08
      thread: king
      also:
      - georgia-albany
      c: Albany, the city jail. King at work on a new book of sermons, later *Strength to Love*.
      n: '[[w.branch-parting-the-waters]], 626. Check: the day; Branch dates the work only to King''s weeks in the jail, from
        his arrest of July 27, and gives no record for it. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: e311846b
        rows:
        - 'w.branch-parting-the-waters 626: all'
- add:
    entry:
      id: cal.1962-07-16.mississippi
      when: July 16
      date: '1962-07-16'
      thread: mississippi
      also:
      - voting-rights
      c: 'Sam Block of SNCC to SCLC, by letter, on its literacy booklets in the Delta''s registration classes: "We are using
        the Workshop Booklets, and the old people think the world of them. They tell the others, ''this is my school book.''"'
      n: '[[w.branch-parting-the-waters]], 634. To check: Block to SCLC, July 16, 1962, SCLC Papers, SC33, folder 12 (cited
        by [[w.branch-parting-the-waters]], 634 n.3).'
      src:
        c: 131f0a8a
        rows:
        - 'w.branch-parting-the-waters 634: all'
        - 'via w.branch-parting-the-waters 634 n.3: all'
- add:
    entry:
      id: cal.1963-02.king-2
      when: Feb.
      date: 1963-02
      thread: king
      c: New York. King preaches for Powell and speaks at several fund-raisers; then a vacation in Jamaica.
      n: '[[w.branch-parting-the-waters]], 695. To check: King''s log, SCLC Papers, SC29; King to Powell, Feb. 15, 1963, King
        Papers, Boston University, box 5, folder 7 (cited by [[w.branch-parting-the-waters]], 695 n.3). Check: the days; Branch
        gives none. Check: Branch, 695: the speech "out of the country" given in King''s regrets to the White House''s Lincoln''s
        Birthday reception "merely the pretext for his escape." See [[cal.1963-02-05.king]]. Names: Martin Luther King, Powell.'
      tags:
      - name:king-martin-luther-jr
      - name:powell-adam-clayton-jr
      src:
        c: 3fc97dd1
        rows:
        - 'w.branch-parting-the-waters 695: all'
        - 'via w.branch-parting-the-waters 695 n.3a: all'
        - 'via w.branch-parting-the-waters 695 n.3b: all'
- add:
    entry:
      id: cal.1963-02-21.mississippi
      when: Feb. 21
      date: '1963-02-21'
      thread: mississippi
      also:
      - civil-rights-organizations
      c: 'Andrew Young to James Bevel and Diane Nash Bevel, by letter, against another SCLC citizenship training center, in
        Mississippi: "It is quite possible that there will never be anything to show for your stay in Mississippi, not in
        a material sense anyway."'
      n: '[[w.branch-parting-the-waters]], 717. To check: Young to James and Diane Bevel, Feb. 21, 1963, SCLC Papers, SC41,
        folder 5 (cited by [[w.branch-parting-the-waters]], 717 n.1). Check: Branch, 717, tells Young''s refusal with the
        days after Travis''s shooting of Feb. 28; the letter is dated Feb. 21. Names: Andrew Young, Nash.'
      tags:
      - name:young-andrew-j-jr
      - name:nash-diane
      src:
        c: 39e3a47d
        rows:
        - 'w.branch-parting-the-waters 717: all'
        - 'via w.branch-parting-the-waters 717 n.1: all'
- add:
    entry:
      id: cal.1963-03.mississippi
      when: Mar.
      date: 1963-03
      thread: mississippi
      also:
      - voting-rights
      c: Greenwood. Annelle Ponder, Septima Clark's assistant at Dorchester, takes up residence for SCLC, within a week of
        Travis's shooting, as the Delta's Negro churches first open their doors to registration classes. Bernice Robinson
        of Highlander comes into Mississippi at SNCC's appeal.
      n: '[[w.branch-parting-the-waters]], 717. To check: Ponder, report on Mississippi, Sept. 1963, SCLC Papers, SC155, folder
        26 (cited by [[w.branch-parting-the-waters]], 717 n.2); Ponder, report on Mississippi, Mar. 1963, SCLC Papers, SC417
        (cited by [[w.branch-parting-the-waters]], 717 n.3). Check: the day; Branch: "within a week of the shooting" of Feb.
        28. See [[cal.1963-02-28.mississippi]]. Names: Ponder.'
      tags:
      - name:ponder-annelle
      src:
        c: e97343cc
        rows:
        - 'w.branch-parting-the-waters 717: all'
        - 'via w.branch-parting-the-waters 717 n.2: B'
        - 'via w.branch-parting-the-waters 717 n.3: B'
- add:
    entry:
      id: cal.1963-04.voting-rights
      when: Apr.
      date: 1963-04
      thread: voting-rights
      also:
      - king
      c: 'Atlanta. Wiley Branton of the Voter Education Project, complaining to his colleagues, blames King for the collapse
        of the Greenwood movement: by Branch''s account, an envious King had launched "a quick diversion" in Birmingham.'
      n: '[[w.branch-parting-the-waters]], 725. To check: Branton, oral history, Civil Rights Documentation Project, Howard
        University; interview with Leslie Dunbar, May 12, 1986 (cited by [[w.branch-parting-the-waters]], 725 n.5). Check:
        the day; Branch tells it after the Greenwood settlement of Apr. 3. Check: "a quick diversion" is Branch''s phrase,
        not a quotation of Branton. See [[cal.1963-04-03.mississippi]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: a7e86281
        rows:
        - 'w.branch-parting-the-waters 725: all'
        - 'via w.branch-parting-the-waters 725 n.5a: all'
        - 'via w.branch-parting-the-waters 725 n.5b: all'
- add:
    entry:
      id: cal.1960-07-22.alabama
      when: July 22
      date: '1960-07-22'
      thread: alabama
      c: 'Bishop Will Scarlett to Bishop C. C. J. Carpenter of Alabama, by letter, pressing him to speak against segregation:
        "the sight of the great Bishop of Alabama ridden out of his State on a rail because of courageous and enlightened
        speech, would be one of the greatest events of many years. ... I think you have an opportunity of a hundred years."'
      n: '[[w.branch-parting-the-waters]], 742. To check: Scarlett to Carpenter, July 22, 1960, Carpenter Papers, Birmingham
        Public Library, C15, folder 16 (cited by [[w.branch-parting-the-waters]], 742 n.3).'
      src:
        c: 979a4371
        rows:
        - 'w.branch-parting-the-waters 742: all'
        - 'via w.branch-parting-the-waters 742 n.3: all'
- add:
    entry:
      id: cal.1963-04.alabama-birmingham-2
      when: Apr.
      date: 1963-04
      thread: alabama-birmingham
      also:
      - king
      c: 'King, in the Birmingham jail, at Walker''s urging and through Clarence Jones, orders Hosea Williams and the aides
        he has brought from Savannah out of the Gaston Motel: the outside staff on SCLC''s bill outnumber the local volunteers
        going to jail.'
      n: '[[w.branch-parting-the-waters]], 742. To check: interview with Edwin Gardner, Jan. 21, 1986 (cited by [[w.branch-parting-the-waters]],
        742 n.6). Check: the day; Branch tells it with King''s writing of his letter in the jail. See [[cal.1963-04-16.alabama-birmingham]].
        Names: Martin Luther King, Hosea Williams.'
      tags:
      - name:king-martin-luther-jr
      - name:williams-hosea
      src:
        c: a609aaf9
        rows:
        - 'w.branch-parting-the-waters 742: all'
        - 'via w.branch-parting-the-waters 742 n.6: all'
- add:
    entry:
      id: cal.1963-04.alabama-birmingham-3
      when: Apr.
      date: 1963-04
      thread: alabama-birmingham
      c: 'Bishop Carpenter, having read King''s letter from the Birmingham jail, to his coadjutor, George Murray, by Murray''s
        account: "This is what you get when you try to do something. You get it from both sides. George, you just have to
        live with that."'
      n: '[[w.branch-parting-the-waters]], 745. To check: interview with Bishop George Murray, July 16, 1987 (cited by [[w.branch-parting-the-waters]],
        745 n.1). Check: the day; Branch gives none. See [[cal.1963-04-16.alabama-birmingham]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: fadf22b2
        rows:
        - 'w.branch-parting-the-waters 745: all'
        - 'via w.branch-parting-the-waters 745 n.1: all'
- add:
    entry:
      id: cal.1963-04-24.civil-rights-organizations
      when: Apr. 24
      date: '1963-04-24'
      thread: civil-rights-organizations
      also:
      - alabama
      c: 'Atlanta. Forman of SNCC telephones William Moore''s widow in Binghamton: would her husband have wanted students
        to take up his walk?'
      n: '[[w.branch-parting-the-waters]], 750. To check: [[w.forman-making-of-black-revolutionaries]], 308 (cited by [[w.branch-parting-the-waters]],
        750 n.4). Check: the day; Branch tells the call with the responses to the shooting of Apr. 23. See [[cal.1963-04-23.alabama]].
        Names: Forman, William Moore.'
      tags:
      - name:forman-james
      - name:moore-william-l
      src:
        c: b77fa006
        rows:
        - 'w.branch-parting-the-waters 750: all'
- add:
    entry:
      id: cal.1963-05-18.king
      when: May 18–24
      date: '1963-05-18'
      thread: king
      c: 'Levison, overheard by the FBI, with Kunstler, King, Clarence Jones and O''Dell: Kunstler''s plan for a book written
        jointly by King and himself set aside, Kunstler an "opportunist." A publisher suggests to Levison a title for King''s
        third book, *Why We Can''t Wait*.'
      n: '[[w.branch-parting-the-waters]], 804. To check: FBI intercepts of Levison''s conversations with Kunstler, King,
        Jones and O''Dell, May 18–24, 1963, FLNY-9-171a, 172, 172a, 174; FLNY-7-427a, 431a (cited by [[w.branch-parting-the-waters]],
        804 n.7). Check: Branch gives the week''s talks together, and no day or record for the publisher''s suggestion. See
        [[cal.1963-05-19.press-and-broadcasting]]. Names: Levison, Martin Luther King, O''Dell.'
      tags:
      - name:levison-stanley-d
      - name:king-martin-luther-jr
      - name:odell-jack-h
      src:
        c: e4057eee
        rows:
        - 'w.branch-parting-the-waters 804: all'
        - 'via w.branch-parting-the-waters 804 n.7a: A'
        - 'via w.branch-parting-the-waters 804 n.7b: A'
        - 'via w.branch-parting-the-waters 804 n.7c: A'
        - 'via w.branch-parting-the-waters 804 n.7d: A'
        - 'via w.branch-parting-the-waters 804 n.7e: A'
        - 'via w.branch-parting-the-waters 804 n.7f: A'
- add:
    entry:
      id: cal.1963-05.king-3
      when: May
      date: 1963-05
      thread: king
      c: Clarence Jones moves to stop the wildcat printings of King's "Letter from Birmingham Jail," to protect King's copyright
        for the book negotiations.
      n: '[[w.branch-parting-the-waters]], 804. Check: the day; Branch: "soon" after the *New York Post* printed the Letter,
        May 19, and gives no record. See [[cal.1963-05-19.press-and-broadcasting]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      src:
        c: 0785eedb
        rows:
        - 'w.branch-parting-the-waters 804: all'
- add:
    entry:
      id: cal.1963-05.civil-rights-the-executive-4
      when: May, late
      date: 1963-05
      thread: civil-rights-the-executive
      also:
      - robert-kennedy
      c: 'Robert Kennedy, from the FBI''s reports on the guests at the Baldwin meeting: Clarence Jones among three Negroes
        there married to whites; they must suffer from psychological "complexes" about living so comfortably apart from their
        race.'
      n: '[[w.branch-parting-the-waters]], 812. To check: Robert Kennedy, oral history, Apr. 30, 1964, 427–29, JFK Library
        (cited by [[w.branch-parting-the-waters]], 812 n.3). Check: the day; Branch: the FBI''s reports "supplied swiftly"
        after the meeting of May 24. See [[cal.1963-05-24.civil-rights-the-executive]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: '96906869'
        rows:
        - 'w.branch-parting-the-waters 812: all'
        - 'via w.branch-parting-the-waters 812 n.3: all'
- add:
    entry:
      id: cal.1963-05.civil-rights-the-executive-5
      when: May, late
      date: 1963-05
      thread: civil-rights-the-executive
      also:
      - robert-kennedy
      c: 'Robert Kennedy to Guthman, days after the Baldwin meeting: perhaps he would feel that strongly against his country
        had he grown up a Negro.'
      n: '[[w.branch-parting-the-waters]], 812. To check: interview with Edwin Guthman, June 25, 1984 (cited by [[w.branch-parting-the-waters]],
        812 n.5). Check: the day; Branch: "only days after" the meeting of May 24. See [[cal.1963-05-24.civil-rights-the-executive]].
        Names: Robert Kennedy, Guthman.'
      tags:
      - name:kennedy-robert-f
      - name:guthman-edwin-o
      src:
        c: ee9a1eb8
        rows:
        - 'w.branch-parting-the-waters 812: all'
        - 'via w.branch-parting-the-waters 812 n.5: all'
- add:
    entry:
      id: cal.1963-05-31.mississippi-2
      when: May 31
      date: '1963-05-31'
      thread: mississippi
      also:
      - civil-rights-organizations
      c: Jackson, some six hundred Negroes in jail. Evers, the NAACP's field secretary, consults King covertly on what to
        do, and calls Wilkins.
      n: '[[w.branch-parting-the-waters]], 815–16. Check: the day; Branch tells it after the march of May 31 and before Wilkins''s
        arrest of June 1, and gives no record; King to Levison and Jones, June 1: Evers "had called again" (816). See [[cal.1963-05-31.mississippi]].
        Names: Evers, Martin Luther King, Wilkins.'
      tags:
      - name:evers-medgar
      - name:king-martin-luther-jr
      - name:wilkins-roy
      src:
        c: 76792fa8
        rows:
        - 'w.branch-parting-the-waters 815–16: all'
- add:
    entry:
      id: cal.1963-06-02.march-on-washington
      when: June 2–3
      date: '1963-06-02'
      thread: march-on-washington
      also:
      - king
      c: 'Levison to Ann Jones, overheard by the FBI, of King''s call of June 1: "you tingled"; his own ideas "a step behind
        Martin." Clarence Jones: "We both know that Martin is a very cautious and thoughtful person, and he is saying the
        hour is now."'
      n: '[[w.branch-parting-the-waters]], 817. To check: FBI intercepts, Levison with Ann and Clarence Jones, June 2, 1963,
        FLNY-9-186a; with Jones and "Alice" [Loewi?], June 3, 1963, FLNY-7-441 (cited by [[w.branch-parting-the-waters]],
        817 n.1). See [[cal.1963-06-01.march-on-washington]]. Names: Levison.'
      tags:
      - name:levison-stanley-d
      src:
        c: 7e7e905b
        rows:
        - 'w.branch-parting-the-waters 817: all'
        - 'via w.branch-parting-the-waters 817 n.1a: all'
        - 'via w.branch-parting-the-waters 817 n.1b: all'
- add:
    entry:
      id: cal.1963-06-14.civil-rights-organizations
      when: June 14
      date: '1963-06-14'
      thread: civil-rights-organizations
      also:
      - king
      c: 'Levison to Frank Montero, overheard by the FBI, of the quarrel over the Evers fund: "The antagonism towards Martin
        at NAA[CP] has been a disgrace for a long time"; the malice "all on one side"; "Roy and every single member of his
        staff except John Morsell ... have carried on against Martin."'
      n: '[[w.branch-parting-the-waters]], 829. To check: FBI intercept, Levison and Frank Montero, June 14, 1963, FLNY-7-452a
        (cited by [[w.branch-parting-the-waters]], 829 n.6). See [[cal.1963-06-13.civil-rights-organizations]]. Names: Levison,
        Wilkins.'
      tags:
      - name:levison-stanley-d
      - name:wilkins-roy
      src:
        c: 6a299a37
        rows:
        - 'w.branch-parting-the-waters 829: all'
        - 'via w.branch-parting-the-waters 829 n.6: all'
- add:
    entry:
      id: cal.1963-06-16.civil-rights-organizations-2
      when: June 16
      date: '1963-06-16'
      thread: civil-rights-organizations
      c: 'Washington, the day after the Evers funeral. Roy Wilkins to his nephew Roger, of the State Department: "Can you
        imagine it? Medgar was an NAACP man all the way, and King comes in and tries to take the money."'
      n: '[[w.branch-parting-the-waters]], 830–31. To check: [[w.wilkins-mans-life]], 123 (cited by [[w.branch-parting-the-waters]],
        831 n.1). Check: the day; Branch: the national officers left Jackson "the day after the Evers funeral" of June 15.
        See [[cal.1963-06-16.civil-rights-organizations]]. Names: Roy Wilkins, Roger Wilkins, Evers, Martin Luther King.'
      tags:
      - name:wilkins-roy
      - name:wilkins-roger-w
      - name:evers-medgar
      - name:king-martin-luther-jr
      src:
        c: 7e8c40e5
        rows:
        - 'w.branch-parting-the-waters 830–31: all'
        - 'via w.branch-parting-the-waters 831 n.1: all'
- add:
    entry:
      id: cal.1963-07.civil-rights-organizations-2
      when: July
      date: 1963-07
      thread: civil-rights-organizations
      also:
      - king
      c: 'Wilkins and King, in private, partners on television for the March: Wilkins, "In fact, Martin, if you have desegregated
        anything by your efforts, kindly enlighten me"; King, "I guess about the only thing I''ve desegregated so far is a
        few human hearts."'
      n: '[[w.branch-parting-the-waters]], 849. To check: [[w.farmer-lay-bare-the-heart]], 216 (cited by [[w.branch-parting-the-waters]],
        849 n.2). Check: the day; Branch gives none. Names: Wilkins, Martin Luther King.'
      tags:
      - name:wilkins-roy
      - name:king-martin-luther-jr
      src:
        c: ee996658
        rows:
        - 'w.branch-parting-the-waters 849: all'
- add:
    entry:
      id: cal.1963-07-24.king-2
      when: July 24
      date: '1963-07-24'
      thread: king
      also:
      - march-on-washington
      c: Levison, overheard by the FBI, chuckles at the irony that the President should see him as such a danger, when he
        has been arguing to King that Kennedy's civil rights record is improving and the March should not be aimed at him.
      n: '[[w.branch-parting-the-waters]], 857. To check: FBI intercept, July 24, 1963, FLNY-9-238a (cited by [[w.branch-parting-the-waters]],
        857 n.3). See [[cal.1963-07-24.king]]. Names: Levison, John F. Kennedy.'
      tags:
      - name:levison-stanley-d
      - name:kennedy-john-f
      src:
        c: c5a2e3e5
        rows:
        - 'w.branch-parting-the-waters 857: all'
        - 'via w.branch-parting-the-waters 857 n.3: all'
- add:
    entry:
      id: cal.1963-08.king-2
      when: Aug., early
      date: 1963-08
      thread: king
      c: 'New York, at work on the Birmingham book. King, more than once, asks Clarence Jones whether Levison understands
        why he does not call him. Jones: "In fact, he would be rather upset if you did."'
      n: '[[w.branch-parting-the-waters]], 859. To check: [[w.garrow-fbi-and-martin-luther]], 70 (cited by [[w.branch-parting-the-waters]],
        859 n.2). Check: the day; Branch: "In early August." See [[cal.1963-08-05.king]]. Names: Martin Luther King, Levison.'
      tags:
      - name:king-martin-luther-jr
      - name:levison-stanley-d
      src:
        c: 4972f525
        rows:
        - 'w.branch-parting-the-waters 859: all'
- add:
    entry:
      id: cal.1963-08-21.king-2
      when: Aug. 21
      date: '1963-08-21'
      thread: king
      c: 'Clarence Jones to Levison from a pay telephone, overheard on the FBI''s tap on Levison, on the Birmingham book:
        "I would like to get what you have, and start getting it transcribed." Levison, drafting passages for King and Al
        Duckett at the Riverdale Motor Inn, promises "something" by that night. The FBI identifies Jones''s voice.'
      n: '[[w.branch-parting-the-waters]], 870. To check: FBI intercept, Aug. 21, 1963, FLNY-9-266 (cited by [[w.branch-parting-the-waters]],
        870 n.1). See [[cal.1963-08-05.king]]. Names: Levison, Martin Luther King.'
      tags:
      - name:levison-stanley-d
      - name:king-martin-luther-jr
      src:
        c: 48ae4545
        rows:
        - 'w.branch-parting-the-waters 870: all'
        - 'via w.branch-parting-the-waters 870 n.1: all'
- add:
    entry:
      id: cal.1963-08-28.march-on-washington-4
      when: Aug. 28
      date: '1963-08-28'
      thread: march-on-washington
      also:
      - king
      c: 'Levison, overheard by the FBI, 4:30 p.m., of King''s speech: "it was marvelous in Martin''s speech the way he handled
        the white and Negro question, completely repudiating this kind of nonsense of Adam Powell and the Muslims and everybody
        else in a way that was so positive"; King "the man of the hour for everybody"; Levison "bowled over" by Wilkins''s
        generosity.'
      n: '[[w.branch-parting-the-waters]], 886–87. To check: FBI intercept, 4:30 p.m., Aug. 28, 1963, FLNY-9-273a (cited by
