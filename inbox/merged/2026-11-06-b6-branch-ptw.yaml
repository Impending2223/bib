      when: Sept. 24–27
      date: '1963-09-24'
      thread: civil-rights-organizations
      also:
      - king
      c: Richmond, SCLC's convention. Walker demands nearly three times his salary. He dismisses four top employees for "irresponsibility
        and insubordination"; King later talks him into docking their pay instead. Asked to make amends with Bevel too, Walker
        resigns, "This is intolerable. I'm gone"; King calms him.
