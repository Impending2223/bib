- edit:
    id: cal.1962-03-26.king
    base: becbd151
    set:
      c: 'The FBI''s microphones in Levison''s office. Walker reports sixty-one citizenship schools already founded by the
        Dorchester trainees; Levison: where is the news? With Clarence Jones, Levison objects to "Gandhi Foundation" for the
        tax-exempt body Wachtel proposes: "foundation" too corporate for the unions. It becomes the Gandhi Society. Of Walker,
        to Jones: "more advanced than Martin."'
      n: '[[w.branch-parting-the-waters]], 579, 583, 596. To check: Levison microphone notes, Mar. 26, 1962; FBI summary of
        Levison-Jones conversation, Mar. 26, 1962, FBI New York file 100-111180, subfile 5 (cited by [[w.branch-parting-the-waters]],
        579 n.5, 583 n.2, 596 n.2). Check: Branch, 596–97: that spring Levison "kept saying" Walker was a poor executive director
        for SCLC, "emotionally immature even though he is brilliant." See [[cal.1962-03.king]]. Names: Levison.'
      src:
        c: f74c2f43
        rows:
        - 'w.branch-parting-the-waters 579, 583, 596: all'
