      c: 'Reinhold Niebuhr to Bishop Will Scarlett, by letter: "Your former choir boy, Barry Goldwater, is cutting a wide
        swath. Interesting how Rockefeller''s lack of private morality has made him a dead duck and given Barry his chance."
        The Republicans, he fears, may become "a reactionary party."'
      n: '[[w.branch-parting-the-waters]], 862–63. To check: Niebuhr to Scarlett, Nov. 11, 1963, Niebuhr Papers, box 33, Library
