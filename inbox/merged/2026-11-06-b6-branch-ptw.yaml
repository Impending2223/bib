      date: '1963-11-26'
      thread: king
      also:
      - assassination
      c: 'Levison, overheard by the FBI, back from the funeral: Washington "a whole city in which no one talked in a normal
        tone of voice"; Oswald perhaps of the "Chinese wing of the ultra-left." To King''s literary agent: the Birmingham
        book postponed again, "This book always seems to be in the shadow of tragic deaths." He is "not at all pessimistic"
        about Johnson on civil rights.'
      n: '[[w.branch-parting-the-waters]], 917–18. To check: FBI intercepts, Nov. 26, 1963, FLNY-9-363 (cited by [[w.branch-parting-the-waters]],
        917 n.6); FLNY-7-617a (cited by [[w.branch-parting-the-waters]], 918 n.1). Check: the days of the call to the agent
        and of the remark on Johnson; Branch tells them with the intercepts of Nov. 24–26 and gives no record. See [[cal.1963-11-24.king]].
        Names: Levison, Oswald, Johnson.'
