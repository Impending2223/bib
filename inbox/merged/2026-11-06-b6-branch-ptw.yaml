        Howard University; interview with Walker, Aug. 20, 1984 (cited by [[w.branch-parting-the-waters]], 898 n.3); Walker
        to King, "Staff Discipline," undated, King Papers, KP36, folder 4 (cited by [[w.branch-parting-the-waters]], 900 n.4);
        Walker to King, Oct. 3, 1963, King Papers, KP36, folder 1 (cited by [[w.branch-parting-the-waters]], 900 n.5). Check:
        the days; Branch tells these with the convention of Sept. 24–27. See [[cal.1963-09-24.civil-rights-bill]]. Names:
        Martin Luther King.'
