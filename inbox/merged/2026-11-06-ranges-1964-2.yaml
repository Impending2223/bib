        n: '[110 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-2-1.pdf) (1964); [June 19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt11/pdf/GPO-CRECB-1964-pt11-3-2.pdf). Statement by the President Following Senate Passage of the Civil Rights Bill, [1963–64 Pub. Papers 787](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=871) (June 19, 1964). [[w.perlstein-before-the-storm]], 363–64 (Goldwater; Dirksen, June 19); [[w.branch-pillar-of-fire]], 357; [[w.humphrey-education-of-a-public-1976]], 285 (final passage; the toast in Mansfield''s office); [[w.solberg-hubert-humphrey]], 226–27 (the passage; to Lippmann, "most significant piece of legislation of this century"); [[w.kabaservice-rule-and-ruin]], 98, 101–2 (the vote; Goldwater one of the six Republicans against; his "federal police state of mammoth proportions"); [[w.white-suite-3505]], 370–71, 429–31 (Goldwater''s speech of June 18; its text, Appendix B); [[w.sundquist-politics-and-policy]], 270 (the vote, 73–27; Goldwater); [[w.mann-walls-of-jericho]], 427–28 (the substitute, 76–18, June 17; the vote, 73–27); [[w.white-making-of-the-president-1965]], 177 n.5 (7:49 p.m., 73 to 27); [[w.kotz-judgment-days]], 152 (73–27; Goldwater against, advised by Rehnquist and Bork); [[w.goldberg-barry-goldwater]], 197 (one of twenty-seven against: "fundamentally a matter of the heart. The problems of discrimination can not be cured by laws alone"; "If my vote is misconstrued, let it be, and let me suffer its consequences"); [[w.zelizer-fierce-urgency-of-now]], 128 (73–27, 7:49 p.m.; Dirksen''s speech; Russell: "overwhelmed and gagged"); [[w.bernstein-guns-or-butter]], 77 (73 to 27; Goldwater, June 18: "My basic objection . . . is constitutional"); [[w.whalen-longest-debate]], 211, 212–15 (76–18, forty-six Democrats and thirty Republicans; Gore''s motion; Goldwater''s speech; 7:40 p.m.). Humphrey''s call before the vote: [[cal.1964-06-19.civil-rights-bill-4]]. The Senate met at noon (its standing order, Daily Digest, D3) and adjourned at 8:10 p.m.: [Daily Digest, D288](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=286). See [[cal.1964-02-10.civil-rights-bill]]; [[cal.1964-06-10.civil-rights-bill]]. Names: Yarborough, Gore, Mansfield, Dirksen, Goldwater, Johnson. Check: the page.'
