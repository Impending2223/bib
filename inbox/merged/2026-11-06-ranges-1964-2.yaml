tes it June 9 (226). Humphrey''s count that morning: [[cal.1964-06-10.civil-rights-bill-6]]. To check: [[w.finley-delaying-the-dream]]; [[w.macneil-dirksen]]. See [[cal.1964-02-10.civil-rights-bill]]. Names: Byrd, Dirksen, Morton. Check: the page.'
