- add:
    entry:
      id: cal.1967-10-07.economy-surcharge
      when: Oct. 7
      date: '1967-10-07'
      thread: economy-surcharge
      c: 'An administration group works out concessions to Mills, who has asked that no new domestic programs come in fiscal
        1969: $2 billion off defense; Mahon''s "line item" list of 700 cuts; a commission to propose cuts in federal programs
        after the 1968 elections. Califano: the package "fragile." O''Brien and Sanders all but sure the tax bill is dead.'
      n: '[[w.bernstein-guns-or-butter]], 370–71. To check: Califano to Johnson, Oct. 7, 1967, with attachments, LE FI 11-4
        File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 371 n.6). See [[cal.1967-10-03.economy]]. Names: Mills,
        Mahon, Califano, O''Brien, Sanders.'
      tags:
