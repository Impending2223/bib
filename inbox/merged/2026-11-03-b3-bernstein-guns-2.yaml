      date: '1968-04-24'
      thread: economy-surcharge
      c: 'The conference on H.R. 15414. Mills takes control: the Senate''s bill "unacceptable and inadequate," holding back
        only fiscal 1969''s expenditures, not "the upstream authority to obligate"; the House to take the initiative through
        its committees. By Fowler''s report.'
      n: '[[w.bernstein-guns-or-butter]], 374. To check: Fowler to Johnson, Apr. 24, 1968, Califano Papers, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 374 n.8). See [[cal.1968-04-02.economy]]. Names: Mills, Fowler.'
      tags:
