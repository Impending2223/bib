- add:
    entry:
      id: cal.1968-05-20.economy-surcharge
      when: May 20
      date: '1968-05-20'
      thread: economy-surcharge
      c: 'Okun to Johnson: "The financial mess that would follow failure of the surcharge could jeopardize our 87-month
        record prosperity. It could bring on a recession and slump. Even a mild recession would cost $30 or $40 billion
        of production and 1½ million jobs."'
      n: '[[w.bernstein-guns-or-butter]], 376. To check: Okun to Johnson, May 20, 1968, Califano Papers, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 376 n.8). See [[cal.1968-05-09.economy-surcharge]]. Names: Okun, Johnson.'
      tags:
