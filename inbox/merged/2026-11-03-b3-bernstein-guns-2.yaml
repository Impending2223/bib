# Bernstein, Guns or Butter, pp. 31-32, 358-378 (chs. 2 and 14), read Nov. 4, 2026
patch: b3-bernstein-guns-2
by: batch-3 reader, greatsociety
ops:
- edit:
    id: cal.1963-11-23.poverty-2
    base: 4fea2368
    set:
      c: 'Heller to Johnson, 7:41 p.m.: early in November he had asked the departments for ideas against poverty, and three
        days before his death Kennedy approved his planning a program. Did Johnson want one? "Go ahead. Give it the highest
        priority. Push ahead full tilt," by Johnson''s account. As Heller left, Johnson: "I''m no budget slasher. ... If
        you looked at my record, you would know that I am a Roosevelt New Dealer. As a matter of fact, ... John F. Kennedy
        was a little too conservative to suit my taste," by Heller''s notes.'
      n: '[President''s Daily Diary, Nov. 23, 1963](https://catalog.archives.gov/id/192431), image 3 (LBJ Library; National
        Archives Catalog) (the time). [[w.johnson-vantage-point]], 69–71; [[w.dallek-flawed-giant]], 60 (Johnson''s words,
        in Dallek''s form: "That''s my kind of program"); [[w.caro-passage-of-power]], 539–40 (Heller''s account: "we should
        push ahead full tilt"); [[w.sundquist-politics-and-policy]], 137 (Johnson to Heller: "That''s my kind of program.
        ... Move full speed ahead," by Heller''s account). [[w.bernstein-guns-or-butter]], 31 (Johnson as Heller left, by
        Heller''s notes). Johnson gives 7:40 p.m. (69). [[w.branch-pillar-of-fire]], 174–75. To check: Heller, Notes on
        Meeting with President Johnson, 7:40 p.m., Nov. 23, 1963, Heller Papers, Kennedy Library (cited by [[w.bernstein-guns-or-butter]],
        31 n.2). Names: Heller, Johnson, Kennedy.'
      src:
        c: 62fb61a9
        rows:
        - 'https://catalog.archives.gov/id/192431: A-C'
