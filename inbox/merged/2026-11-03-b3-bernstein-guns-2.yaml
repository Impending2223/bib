- add:
    entry:
      id: cal.1963-11-23.economy-2
      when: Nov. 23
      date: '1963-11-23'
      thread: economy
      also:
      - succession
      c: 'Heller to Johnson, by memorandum, the economy and the issues pending: the eleventh quarter of expansion since
        early 1961; unemployment still 5.5 percent. Without the tax cut, or with it delayed too long, "a slowdown or even
        a downturn, in the second half of 1964." The House''s bill would lift GNP $12 billion in 1964 and $30 billion a
        year in full effect.'
      n: '[[w.bernstein-guns-or-butter]], 31. To check: Heller to Johnson, "Summary Review of the Economic Situation and
        Pending Issues," Nov. 23, 1963, attached to the Administrative History of the Council of Economic Advisers, LBJ
        Library (cited by [[w.bernstein-guns-or-butter]], 31 n.2). Names: Heller, Johnson.'
      tags:
      - name:heller-walter-w
      - name:johnson-lyndon-b
      src:
        c: 1c6afd02
        rows:
        - 'w.bernstein-guns-or-butter 31: all'
        - 'via w.bernstein-guns-or-butter 31 n.2a: all'
- add:
    entry:
      id: cal.1965-11-23.economy
      when: Nov. 23
      date: '1965-11-23'
      thread: economy
      c: 'Seymour E. Harris, consultant to the Treasury, brings twenty leading economists together with the departments''
        officials: growth in 1966 of 4 percent in real terms, somewhat less than in 1965. "With a few dissenters, there
        was no great concern that the economy was overheated and would require restrictive monetary policy."'
      n: '[[w.bernstein-guns-or-butter]], 364. To check: Harris to Moyers, Dec. 16, 1965, Confidential File, FG 105-4, LBJ
        Library (cited by [[w.bernstein-guns-or-butter]], 364 n.3).'
      src:
        c: 612ed2c5
        rows:
        - 'w.bernstein-guns-or-butter 364: all'
        - 'via w.bernstein-guns-or-butter 364 n.3a: all'
