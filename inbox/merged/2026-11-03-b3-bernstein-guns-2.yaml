      when: Mar. 12–14
      date: '1968-03-12'
      thread: economy-surcharge
      c: 'Finance, Long its chairman, hears the administration''s witnesses alone, Fowler leading, Mar. 12 and 14. Anderson
        will move the surtax as an amendment to H.R. 15414, Smathers with him. Fowler: "I would applaud any move. I''m for
        prompt action."'
      n: '[[w.bernstein-guns-or-butter]], 373. To check: *CQ Almanac*, 1968, 263–78 (cited by [[w.bernstein-guns-or-butter]],
