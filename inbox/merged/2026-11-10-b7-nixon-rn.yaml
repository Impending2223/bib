        gives neither. To check: the delegation''s summary of the formal session, telegram 22109/Delto 807 from Paris, Oct.
        9, 1968, RG 59, A/IM Files: Lot 93 D 82, HARVAN-(Incoming)-October 1968, National Archives; Jorden''s notes of the
        25th meeting, William J. Jorden Papers, LBJ Library (cited by FRUS 1964–68, VII, doc. 54 n.1). See [[cal.1968-10-09.vietnam]].
        Names: Johnson, Nixon.'
