    set:
      n: 'Kramer & Roberts, *"I Never Wanted to Be Vice-President of Anything!"*; Persico, *The Imperial Rockefeller*; Smith, *On His Own Terms* (Opp. II.C). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H).'
- edit:
    id: cal.1964-01-03.elections-1964
    base: b9290a6a
    set:
      n: '[Remarks Announcing Candidacy for the Republican Presidential Nomination](https://www.presidency.ucsb.edu/documents/remarks-announcing-candidacy-for-the-republican-presidential-nomination) (Jan. 3, 1964). Shadegg, *What Happened to Goldwater?*; White, *Suite 3505*; Goldberg, *Barry Goldwater*; Edwards, *Goldwater*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). Goldwater, *With No Apologies* (Opp. II.G.1). See [[cal.1963-04-08.elections-1964]]. Names: Goldwater (Opp. III.B).'
- edit:
    id: cal.1963-10-24.right-and-the-military
    base: adff6482
    set:
      n: 'Minutaglio & Davis, *Dallas 1963*; Miller, *Nut Country* (Opp. II.B). Manchester, *The Death of a President* (K–J Adm. II.F). Martin, *Adlai Stevenson and the World* (K–J Adm. II.G.4). See [[cal.1961-03.right-and-the-military]]. Names: Stevenson (K–J Adm. III.E); Walker (K–J Adm. III.F).'
