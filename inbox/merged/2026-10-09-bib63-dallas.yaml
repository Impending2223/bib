      n: 'White, *Suite 3505*; Rusher, *The Rise of the Right*; Goldberg, *Barry Goldwater*; Brennan, *Turning Right in the Sixties*; Edwards, *Goldwater*; Perlstein, *Before the Storm*; Middendorf, *A Glorious Disaster* (Opp. II.B). Goldwater, *With No Apologies*; Goldwater & Casserly, *Goldwater* (Opp. II.G.1). Novak, *The Agony of the G.O.P. 1964*; Kabaservice, *Rule and Ruin* (Opp. II.A). White, *The Making of the President 1964* (Opp. II.E). Names: O''Donnell, White (Opp. III.F); Goldwater (Opp. III.B).'
