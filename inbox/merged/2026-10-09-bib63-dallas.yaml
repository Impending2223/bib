      n: 'Kramer & Roberts, *"I Never Wanted to Be Vice-President of Anything!"*; Persico, *The Imperial Rockefeller*; Smith, *On His Own Terms* (Opp. II.C). Novak, *The Agony of the G.O.P. 1964* (Opp. II.A). White, *The Making of the President 1964* (Opp. II.E). See [[cal.1963-04-08.elections-1964]]. Names: Rockefeller (Opp. III.H); Margaretta Rockefeller (K–J Cong. III.K).'
