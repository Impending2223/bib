      base: 689c6ba8
      set:
        time: 1964-10-22T16:00Z
        n: '[U.S. Department of Energy, *United States Nuclear Tests, July 1945 through September 1992*, DOE/NV-209, rev. 16 (2015), PDF p. 49](https://www.osti.gov/servlets/purl/1351809#page=49), no. 387 (the time: 16:00 GMT). [[w.branch-pillar-of-fire]], 442 n.. To check: New York Times, Oct. 23, 1964, p. 2. Also NYT, Oct. 12, 1964, p. 23, Oct. 13, 1964, p. 86, Oct. 27, 1964, p. 77, Oct. 29, 1964, p. 70, Nov. 18, 1964, p. 30. "Officials refused to go ahead with the test until wind conditions were right," the Times reported on Oct. 23, "in view of the possibility that the explosion might crack the earth and permit radioactivity to escape....On the surface of the blast site were a collection of instruments, a Confederate battle flag, and a small sign that read, "The South Shall Rise Again.''" (cited by [[w.branch-pillar-of-fire]], 442).'
