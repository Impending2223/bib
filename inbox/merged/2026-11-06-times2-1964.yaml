        n: '[Johnson and Robert Kennedy, 11:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-november-4-1964), Conversation WH6411-02-6142 (Miller Center). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). [President''s Daily Diary, Nov. 3, 1964](https://catalog.archives.gov/id/192447), image 5 (LBJ Library; National Archives Catalog). [[w.schlesinger-robert-kennedy-and-his]], 675 (the election; the margin, 719,693); [[w.thomas-robert-kennedy]], 301 (won by 700,000; the late-night call: "Listen, I guess I pulled you through up here"). The hour Austin''s: PRDE places the call at Austin. To check: [[w.shesol-mutual-contempt]]. See [[cal.1964-08-25.elections-1964]]; [[cal.1964-11-03.elections-1964-2]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy, Keating, Johnson. Check: the Daily Diary gives a call from Kennedy at 11:52 p.m. (image 5).'
