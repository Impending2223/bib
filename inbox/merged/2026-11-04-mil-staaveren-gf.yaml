patch: mil-staaveren-gf
by: 'Claude (the military re-read, group af: Van Staaveren, Gradual Failure, 2002), Nov. 5, 2026'
ops:
- cite:
    id: cal.1965-04-03.vietnam
    item: '[[w.staaveren-gradual-failure]], 106–07 (Apr. 3: seventy-nine aircraft, forty-six F-105s, sixteen with Bullpups
      and thirty with eight 750-pound bombs, twenty-one F-100s, two RF-101s, ten KC-135s; 254 bombs and 266 rockets, the spans
      not dropped; the next day 384 bombs and Bullpups, one span sagging)'
- cite:
    id: cal.1965-04-16.vietnam-air-war
    item: '[[w.staaveren-gradual-failure]], 113 (U-2 photographs of Apr. 5 disclose the first SA-2 site, some fifteen miles
      southeast of Hanoi)'
- check:
    id: cal.1965-04-16.vietnam-air-war
    text: 'Check: Van Staaveren dates the U-2''s photographs of the site Apr. 5 (113)'
- add:
    entry:
      id: cal.1965-04-22.vietnam-air-war
      when: Apr. 22
      date: '1965-04-22'
      thread: vietnam-air-war
      c: Two B-57s of the 3d Bombardment Wing, from Bien Hoa, fly the first night armed reconnaissance over North Vietnam;
        some six trucks and six buildings damaged.
      n: '[[w.staaveren-gradual-failure]], 125.'
      src:
        c: 0e233665
        rows:
        - 'w.staaveren-gradual-failure 125: all'
- add:
    entry:
      id: cal.1965-05-04.vietnam-air-war-2
      when: May 4–5
      date: '1965-05-04'
      thread: vietnam-air-war
      c: The night of May 4–5, the first Blindbat C-130 flare and navigation planes over the North, pathfinders for B-57s
        with 500- and 750-pound bombs and rockets.
      n: '[[w.staaveren-gradual-failure]], 125. See [[cal.1965-04-22.vietnam-air-war]].'
      src:
        c: eea1de36
        rows:
        - 'w.staaveren-gradual-failure 125: all'
- add:
    entry:
      id: cal.1965-05-07.vietnam-air-war
      when: May 7
      date: '1965-05-07'
      thread: vietnam-air-war
      c: 'The Thanh Hoa bridge struck again: Moore''s strike force of sixty-four aircraft under Major Watry, twenty-eight
        F-105s with 356 750-pound bombs and 304 rockets; an F-105 hit, its pilot rescued from the Gulf of Tonkin.'
      n: '[[w.staaveren-gradual-failure]], 126. See [[cal.1965-04-03.vietnam]]. Names: Moore.'
      src:
        c: adc848d5
        rows:
        - 'w.staaveren-gradual-failure 126: all'
      tags:
      - name:moore-joseph-h
- cite:
    id: cal.1965-07-24.vietnam
    item: '[[w.staaveren-gradual-failure]], 163 (the first SA-2s fired, from near the Hanoi sanctuary; the F-4C and its crew
      of two lost)'
- add:
    entry:
      id: cal.1965-08-03.vietnam-air-war
      when: Aug. 3
      date: '1965-08-03'
      thread: vietnam-air-war
      c: The Joint Chiefs for the first time authorize Air Force and Navy commanders to fly low-altitude photo reconnaissance,
        the sanctuaries excepted, to confirm SAM sites and strike them at once.
      n: '[[w.staaveren-gradual-failure]], 174. See [[cal.1965-07-24.vietnam]].'
      src:
        c: ce40f1b0
        rows:
        - 'w.staaveren-gradual-failure 174: all'
- add:
    entry:
      id: cal.1965-08-16.vietnam-air-war
      when: Aug. 16
      date: '1965-08-16'
      thread: vietnam-air-war
      c: The Air Force's first Iron Hand mission, against the SAMs, with strikes on the Binh Linh barracks, the Bai Du Thon
        highway and the Kbu Mai staging areas; an F-105 Iron Hand alert force set up. The Navy's 124 missions of Aug. 12–13,
        no results verified.
      n: '[[w.staaveren-gradual-failure]], 169. See [[cal.1965-07-24.vietnam]].'
      src:
        c: 6b5dc740
        rows:
        - 'w.staaveren-gradual-failure 169: all'
- add:
    entry:
      id: cal.1965-12-20.vietnam-air-war-2
      when: Dec. 20
      date: '1965-12-20'
      thread: vietnam-air-war
      c: A Wild Weasel F-100F, after leading a strike on a SAM site southeast of Kep, shot down by antiaircraft fire; Captain
        Pitchford captured, Captain Trier killed. The first Wild Weasel flight into SAM country, Dec. 19, had found no radar.
      n: '[[w.staaveren-gradual-failure]], 197. See [[cal.1965-08-16.vietnam-air-war]].'
      src:
        c: 7341e00f
        rows:
        - 'w.staaveren-gradual-failure 197: all'
- add:
    entry:
      id: cal.1966-02-25.vietnam-air-war
      when: Feb. 25
      date: '1966-02-25'
      thread: vietnam-air-war
      c: 'Rolling Thunder 49 approved: the armed reconnaissance area enlarged to that of Dec. 24, 1965, parts of route package
        5 included; the Navy''s coastal armed reconnaissance resumed. Less than Sharp and the Chiefs asked.'
      n: '[[w.staaveren-gradual-failure]], 237. See [[cal.1966-01-31.vietnam-air-war]]. Names: Sharp.'
      src:
        c: f13a548f
        rows:
        - 'w.staaveren-gradual-failure 237: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1966-04-01.vietnam-air-war
      when: Apr. 1
      date: '1966-04-01'
      thread: vietnam-air-war
      c: Rolling Thunder 50 begins on Sharp's execute message, over the enlarged area; route package 1 alone takes 2,406 sorties
        in April, most the Air Force's. It runs to early July.
      n: '[[w.staaveren-gradual-failure]], 252, 319. See [[cal.1966-02-25.vietnam-air-war]]. Names: Sharp.'
      src:
        c: 6ccbab88
        rows:
        - 'w.staaveren-gradual-failure 252, 319: all'
      tags:
      - name:sharp-u-s-grant
- add:
    entry:
      id: cal.1966-04-18.vietnam-air-war
      when: Apr. 18
      date: '1966-04-18'
      thread: vietnam-air-war
      c: An F-100F Wild Weasel launches the first Shrike missile against a SAM site, results undetermined; the Wild Weasels
        now suppress SAM and gun radars with the strike force.
      n: '[[w.staaveren-gradual-failure]], 270. See [[cal.1965-12-20.vietnam-air-war-2]].'
      src:
        c: 9820b31c
        rows:
        - 'w.staaveren-gradual-failure 270: all'
