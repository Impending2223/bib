- edit:
    id: cal.1963-09-03.china-leadership-7
    base: d5da7f86
    set:
      n: '[[w.yang-shangkun-riji]], II, 311 (Sept. 3, 1963). The words: 下午3时到6时，刘澜涛同志来谈话，梅行、杨波同志来汇报 (II, 311). After [[cal.1963-09-03.china-leadership-5|Liu Lantao''s talk]]: the diary gives both visits one afternoon, 3 to 6 p.m., Liu Lantao named first, Mei Xing and Yang Bo after him (II, 311); the order of the diary''s sentence is the only basis, the weakest kind. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Mei Xing, Yang Bo, Yang Shangkun.'
