    base: f49e276e
    set:
      n: '[[w.reeves-president-kennedy]], 593–94. The letter: [[cal.1963-09-11.testing]]. After [[cal.1963-09-09.vietnam|the Huntley–Brinkley interview]], by Reeves (593–94): the interview was videotaped in the President''s office the morning of Sept. 9 and broadcast that evening (the Public Papers'' note to the transcript, [1963 Pub. Papers 658](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=716)). Check: Reeves has the letter come "the next day." Names: Dirksen, Mansfield, Kennedy.'
