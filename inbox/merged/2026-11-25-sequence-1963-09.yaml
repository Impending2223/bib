- edit:
    id: cal.1963-09-24.defense
    base: 8ab2b60a
    set:
      n: 'The Senate sat from 10 a.m. (its order of Sept. 18 that it "convene at 10 a.m." that day) to 4:52 p.m.: [Daily Digest, D448](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=446), [D456](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=454). After [[cal.1963-09-24.vietnam-congress|McGovern''s speech]]: the treaty''s consent, [109 Cong. Rec. 17,832](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf#page=12); the Senate resumes the bill, [17,865](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf#page=45); McGovern for his amendment, 17,881–85; the amendment refused, 2 to 74, [17,889](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf#page=69); the bill passed, 77 to 0, [17,894](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf#page=74). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 139–40. To check: 109 Cong. Rec. 16943–72 (Sept. 24, 1963) (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 140 n.73). Check: the roll calls (Voteview). See [[cal.1963-09-17.defense]]. Names: McGovern, Randolph, Saltonstall, Proxmire, Russell.'
