- edit:
    id: cal.1963-09-18.vietnam-4
    base: 4c06ccfd
    set:
      n: '[[w.preston-war-council]], 126. To check: telcon, Rusk and Bundy, Sept. 18, 1963, Rusk Records, box 48, National Archives (cited by [[w.preston-war-council]], 126 n.70). After [[cal.1963-09-18.vietnam-2|Lodge''s Embtel 536]], received at 7:58 a.m. ([FRUS 1961–63, IV, doc. 126](https://history.state.gov/historicaldocuments/frus1961-63v04/d126) n.1): at 10:05 a.m. Harriman asks Bundy the reaction to "the answer from Lodge"; Bundy would have the mission managed so it gives Diệm no comfort, and will call the Secretary ([doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v04/d127)); Bundy calls Rusk on Lodge''s message at 10:19 a.m. (doc. 126 n.3). Whether Preston''s call is that one is not shown. See [[cal.1963-09-21.vietnam]]. Names: Bundy, Rusk, McNamara, Ngô Đình Diệm.'
