- edit:
    id: cal.1963-09-17.vietnam
    base: 45b0fb39
    set:
      n: '[FRUS 1961–63, IV, doc. 125](https://history.state.gov/historicaldocuments/frus1961-63v04/d125) (CAP 63516). [[w.miller-misalliance]], 299 ("pressures and persuasion" endorsed, Sept. 17); [[w.mcnamara-in-retrospect]], ch. 3 at n.23 (the "conciliatory" cable, CAP 63516, after Kennedy met his closest advisers; McNamara and Taylor to go). [[w.reeves-president-kennedy]], 600–601 (the cable); [[w.selverstone-kennedy-withdrawal]], 158–59 (Kennedy to Lodge: "no good opportunity for action to remove present government in immediate future"; pressures to be applied; the day of the letter not given); [[w.mann-grand-delusion]], 294 (Kennedy to Lodge, "eyes only," Sept. 17: "There is increasing concern here with strictly military aspects of the problem," and the need "to make [an] effective case with Congress for continued prosecution of the effort"; not the meeting''s approval of pressures, the "no good opportunity" line or Lodge''s comment asked); [[w.sen-church-alleged-assassination-plots]], 220 (in mid-September, of two proposals, "increasingly severe pressure" or acquiescence, the first adopted, and McNamara and Taylor sent to Vietnam; not the day, the cable or its words). After [[cal.1963-09-17.vietnam-3|the recorded meeting]]: the cable reports what the "Highest level meeting today has approved" (doc. 125); the day''s recorded meeting is at 5:45 p.m. in the Cabinet Room, Kennedy with Rusk, McNamara, Robert Kennedy, Harriman, McCone, Bundy and Taylor ([Meeting Tape 111.3](https://prde.upress.virginia.edu/conversations/4003063) (PRDE only)); the next morning Bundy has Lodge''s answer sent "to those present yesterday p.m." ([doc. 126](https://history.state.gov/historicaldocuments/frus1961-63v04/d126) n.3), and Harriman speaks of "people at table yesterday" ([doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v04/d127)). See [[cal.1963-05-08.vietnam]]. Made public: [[w.def-u-s-viet-rels]], Book 12, 545–47 (1971). Names: Kennedy, Lodge.'
- edit:
    id: cal.1963-09-17.vietnam-3
    base: a06c5b34
    set:
      time: 1963-09-17T21:45Z
      time_zone: America/New_York
      n: 'The hour and the room: [Meeting Tape 111.3, Sept. 17, 1963, 5:45 p.m., Cabinet Room](https://prde.upress.virginia.edu/conversations/4003063) (PRDE only; the catalogue''s entry, the recording not heard). [[w.selverstone-kennedy-withdrawal]], 158–59. To check: Meeting Tape 111, Sept. 17, 1963, POF, Presidential Recordings, JFKL (cited by [[w.selverstone-kennedy-withdrawal]], 159 n.59). See [[cal.1963-09-17.vietnam]]. Names: Kennedy, McNamara, Taylor, Lodge.'
- follows:
