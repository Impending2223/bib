- edit:
    id: cal.1963-09-24.vietnam-congress
    base: df4e238a
    set:
      n: 'The Senate sat from 10 a.m. (its order of Sept. 18 that it "convene at 10 a.m." that day) to 4:52 p.m.: [Daily Digest, D448](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=446), [D456](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=454). [109 Cong. Rec. 17,881–85](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf) (1963). After [[cal.1963-09-24.testing|the vote on the treaty]]: the consent, [109 Cong. Rec. 17,832](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt13/pdf/GPO-CRECB-1963-pt13-8-1.pdf#page=12), stands before McGovern''s speech in the Record of the day. [[w.mann-grand-delusion]], 293; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 139 (McGovern''s amendment to cut procurement and research by 10 percent, about $2.3 billion, the day of the treaty''s consent). Names: McGovern.'
