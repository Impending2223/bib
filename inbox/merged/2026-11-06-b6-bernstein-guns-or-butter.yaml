      when: Mar. 30–31
      date: '1968-03-30'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'Saturday evening, New York, Toots Shor''s: the O''Briens'' farewell dinner for their son, bound for Vietnam, Breslin
        with them. Unruh, for peace and Robert Kennedy, against Johnson; to O''Brien: "If you feel that strongly, why isn''t
        your son in Vietnam?" O''Brien: "As a matter of fact, this is a goodbye dinner we''re having; he''s on his way." The
        next day Unruh telephones to apologize.'
      n: '[[w.bernstein-guns-or-butter]], 486. To check: O''Brien, oral history, XXI, LBJ Library (cited by [[w.bernstein-guns-or-butter]],
        486 n.3). Names: O''Brien, Unruh, Robert Kennedy, Johnson.'
      src:
        c: 10441c31
        rows:
        - 'w.bernstein-guns-or-butter 486: all'
      tags:
      - name:obrien-lawrence-f
      - name:unruh-jesse-m
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
