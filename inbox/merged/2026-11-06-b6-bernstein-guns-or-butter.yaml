      id: cal.1963-11-22.succession-14
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'From Air Force One, Mrs. Johnson and Liz Carpenter by car to the Elms. Carpenter: "It''s a terrible thing to say,
        but the salvation of Texas is that the governor was hit." Mrs. Johnson: "Don''t think I haven''t thought of that.
        I only wish it could have been me."'
      n: '[[w.bernstein-guns-or-butter]], 18. To check: Carpenter, tape recording of the events of Nov. 22, 1963, Dec. 1963,
        Assassination of John F. Kennedy File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 18 n.1). Names: Lady
        Bird Johnson, Carpenter.'
      src:
        c: a38c539a
        rows:
        - 'w.bernstein-guns-or-butter 18: all'
        - 'via x.1963-12.carpenter-tape-recording-of-the-events-of: all'
      tags:
