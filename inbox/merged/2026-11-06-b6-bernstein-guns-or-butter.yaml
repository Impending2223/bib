      c: Margaret McNamara at Johns Hopkins Hospital, Baltimore, for ulcer operations, entered under an assumed name so the
        press would not say her husband left her for the trip to Vietnam the President had ordered. McNamara drives the forty
        miles to her each night; at the hospital he hears that McNaughton is dead.
