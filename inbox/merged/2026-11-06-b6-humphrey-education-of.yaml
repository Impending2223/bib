- add:
    entry:
      id: cal.1968-09.elections-1968-humphrey-2
      when: 'Sept., fall'
      date: 1968-09
      thread: elections-1968-humphrey
      c: 'An airport, Humphrey leaving for Los Angeles. He takes Cranston, ahead in his Senate race by ten or twelve points
        in his poll, aside: "Alan, you have your campaign won. Now Muskie and I need your help. ... just please mention our
        names." Their names absent from local literature and advertising in California. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 398–99. Check: the day; the memoir: "one day" in the fall campaign. Names:
        Humphrey, Cranston, Muskie.'
      src:
        c: 64fc782b
        rows:
