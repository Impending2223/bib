- add:
    entry:
      id: cal.1963-11-22.assassination-10
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: 'The Chilean Embassy, Ambassador Tomic''s luncheon for the Australian Ambassador, about 1:30 p.m. Edward P. Morgan
        of ABC, called to the telephone, tells Humphrey the President has been shot; Dungan, of the White House staff, confirms
        it with the Secret Service and leaves; he telephones that the President is dead. Humphrey tells the guests; Tomic
        eulogizes Kennedy. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 257–59. See [[cal.1963-11-22.assassination]]. Names: Humphrey, Dungan,
        Kennedy.'
