      id: cal.1966-05-27.transition-and-staff
      when: May 27
      date: '1966-05-27'
      thread: transition-and-staff
      also:
      - press-and-broadcasting
      c: 'Humphrey''s birthday. Johnson calls in the press and photographers and gives him a watch, an electric razor and
        three pictures of the two together. The Humphreys at the White House for dinner and movies several evenings in May.
        By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 342. Names: Johnson, Humphrey.'
