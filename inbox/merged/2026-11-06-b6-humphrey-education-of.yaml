- add:
    entry:
      id: cal.1966-09.elections-1966
      when: 'Sept., fall'
      date: 1966-09
      thread: elections-1966
      also:
      - elections-1960-primaries
      c: 'Boston, the 1966 campaign. Humphrey, with Governor Peabody, then running for the Senate, and Edward McCormack, calls
        on Cardinal Cushing. Cushing to Peabody: "You crossed Teddy. ... I don''t believe you are going to have his help."
        To Humphrey, of 1960: the decisions on West Virginia made in his library with Joseph Kennedy, which Protestant ministers
        and churches, the smaller black churches especially, would get $100, $200 or $500. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 216–18. Check: the month; the memoir: "During the 1966 Congressional
        campaign." See [[cal.1960-04.elections-1960-5]]. Names: Humphrey, Peabody, Edward J. McCormack Jr., Cushing, Edward
        Kennedy, Joseph P. Kennedy.'
      src:
        c: 0ab4d65e
        rows:
        - 'w.humphrey-education-of-a-public-1976 216–18: all'
