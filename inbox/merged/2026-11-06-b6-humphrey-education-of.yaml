      when: Aug. 28
      date: '1964-08-28'
      thread: press-and-broadcasting
      also:
      - elections-1964-johnson
      c: 'At the airport, leaving for the Ranch after the convention, Johnson lifts Katharine Graham of the *Washington Post*
        over the fence: "On the plane, Katie; we''re going to Texas and we want you with us." She flies with him and the Humphreys
        to the Ranch. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 305. Check: the day; the memoir puts it after the convention closed.
        See [[cal.1964-08-29.elections-1964]]. Names: Johnson, Katharine Graham, Humphrey.'
      src:
        c: 64cba965
        rows:
        - 'w.humphrey-education-of-a-public-1976 305: all'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:graham-katharine'
      - 'name:humphrey-hubert-h'
