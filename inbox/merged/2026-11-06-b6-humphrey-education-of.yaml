      - 'name:kennedy-john-f'
- add:
    entry:
      id: cal.1963-11-22.succession-12
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Humphrey''s Senate office, about 8:30 p.m. Smathers and Humphrey on Johnson''s leadership, his needs and his nature,
        and what they might do to help him. Smathers: Johnson as majority leader often spoke of Humphrey''s support, and will
        need him more than ever. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 261. See [[cal.1963-11-22.succession]]. Names: Humphrey, Smathers, Johnson.'
      src:
        c: 488c1579
        rows:
        - 'w.humphrey-education-of-a-public-1976 261: all'
      tags:
      - 'name:humphrey-hubert-h'
      - 'name:smathers-george-a'
      - 'name:johnson-lyndon-b'
- add:
    entry:
      id: cal.1963-11-23.succession-11
      when: Nov. 23–24
      date: '1963-11-23'
      thread: succession
      c: 'Humphrey, for his files, on Johnson: grown in domestic matters, his commitment to the tax program, full employment,
        Medicare and civil rights; little travel abroad as a Senator, his knowledge of the world "rather limited," shaped
        by Preparedness, Space and the foreign-aid appropriations; "No one can predict what a President will do in foreign
        affairs."'
      n: '[[w.humphrey-education-of-a-public-1976]], 262–63 (quoting it). Check: the day; the memoir: "That weekend." See
        [[cal.1963-11-22.succession]]. Names: Humphrey, Johnson.'
      src:
        c: 0747164f
        rows:
        - 'w.humphrey-education-of-a-public-1976 262–63: all'
        - 'via w.humphrey-education-of-a-public-1976 262 n.text: all'
      tags:
      - 'name:humphrey-hubert-h'
      - 'name:johnson-lyndon-b'
- add:
    entry:
