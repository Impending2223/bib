# Batch 3 resumed (Nov. 4, 2026), reader "advisers": Woods, *J. William Fulbright, Vietnam, and the Search for a Cold
# War Foreign Policy* (1998; w.woods-j-william-fulbright-vietnam), pp. 106-140 (1966) set against the calendar, after
# b3-woods-2 (pp. 16-105 and a few later pages). The owner's copy, born-digital text (printed page = PDF page - 8).
