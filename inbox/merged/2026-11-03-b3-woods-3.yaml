patch: b3-woods-3
by: Claude (batch 3 resumed, advisers group; Woods, J. William Fulbright, Vietnam, and the Search for a Cold War Foreign Policy)
ops:
- add:
    entry:
      id: cal.1966-05-17.vietnam-congress
      when: May 17
      date: '1966-05-17'
      thread: vietnam-congress
      c: 'Fulbright at the National Press Club: regret for calling Saigon a whorehouse and for comparing the United States
        to the Third Reich.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 131. See [[cal.1966-05-09.vietnam-congress]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-05-14.vietnam
      when: May 14
      date: '1966-05-14'
      thread: vietnam
      c: 'McNamara to Harriman, by Harriman''s memorandum: Washington should "get in touch direct with the NLF, also the North
        Vietnamese, but particularly the NLF, and begin to try to work up a deal for a coalition government."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 132. Names: McNamara, Harriman.'
      tags:
      - name:mcnamara-robert-s
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1966-04.vietnam-congress-2
      when: Apr., late
      date: 1966-04
      thread: vietnam-congress
      c: 'New York. Fulbright to the Associated Press and the American Newspaper Publishers Association: erroneous assumptions
        under the policy in Vietnam.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 125. See [[cal.1966-04-21.vietnam]]. Names: Fulbright. Check: the day.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-03.right-and-the-military
      when: Mar.
      date: 1966-03
      thread: right-and-the-military
      c: 'A Missouri chapter of the Minutemen plans to shoot Fulbright. By the testimony in Kansas City of Jerry Milton Brooks,
        after his arrest by the FBI: the order called off at the last minute, part of a plan to intimidate members of Congress
        into "voting American."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 125. Names: Fulbright. Check: the day; the day of Brooks''s testimony.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-03.vietnam-congress-3
      when: Mar., third week
      date: 1966-03
      thread: vietnam-congress
      c: 'Storrs, Conn., the Brien McMahon lecture. Fulbright: "There are two Americas. One is the America of Lincoln and
        Adlai Stevenson; the other is the America of Teddy Roosevelt and General MacArthur."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 124. Names: Fulbright. Check: the day.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-02-19.vietnam-support-2
      when: Feb. 19
      date: '1966-02-19'
      thread: vietnam-support
      also:
      - vietnam-hearings
      c: 'Johnson to Hoover: the FBI to "cover Senate Foreign Relations Committee television presentation with a view toward
        determining whether Senator Fulbright and the other Senators were receiving information from Communists." The Bureau
        draws "parallels" between the hearings and "documented Communist Party publications or statements of Communist leaders."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 119. See [[cal.1966-02-18.vietnam-hearings]]. Names: Johnson, Hoover, Fulbright.
        Check: the day of the Bureau''s report.'
      tags:
      - name:johnson-lyndon-b
      - name:hoover-j-edgar
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-02-14.press-and-broadcasting
      when: Feb. 14
      date: '1966-02-14'
      thread: press-and-broadcasting
      also:
      - vietnam-hearings
      c: The BBC runs Kennan's testimony and Fulbright's questioning almost verbatim. Labour members on the talk shows, agreeing
        with the doubts.
      n: '[[w.woods-j-william-fulbright-vietnam]], 121. See [[cal.1966-02-10.vietnam-hearings]]. Names: Kennan, Fulbright.'
      tags:
      - name:kennan-george-f
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-01-13.vietnam-congress-2
      when: Jan. 13
      date: '1966-01-13'
      thread: vietnam-congress
      c: 'Bangkok. Clyde Petit, back from interviewing some two hundred servicemen for the Arkansas radio network, to Lee
        Williams of Fulbright''s staff, for Fulbright''s eyes: "the situation is worse than is reported in the press and worse,
        I believe, than is indicated in intelligence reports"; most troops "literally confined in closely-guarded compounds."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 106. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
