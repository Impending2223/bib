  - edit:
      id: cal.1963-05-07.china-leadership
      base: 03ffacea
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, May 7, 1963 (the entry for May 7–11); [[w.zhou-enlai-nianpu-1949]], II, 552 (May 10–11, 1963: Zhou Enlai at the meetings of May 10 and 11; he asks that "90-odd" read "over 95" percent in the draft; Mao agrees); [[w.lengxi-shinian-lunzhan-1956-1966]], 562 (Wu on the enlarged Standing Committee at Hangzhou, to which Wu''s party came May 2: its two subjects, the home one ("guard against revisionism at home"; the draft decision of the "Former Ten Points" on rural work, almost wholly dictated by Mao and put in order by Chen Boda, discussed chiefly by the regional bureaus'' secretaries) and the foreign one (the Peking and Hangzhou drafts of the reply on the general line)); [[w.macfarquhar-origins-of-the-cultural]], III, 339–40 (the Hangzhou meeting, May 2–12: Mao with regional leaders, then most of the leadership, Zhou Enlai and Deng Xiaoping at the end, Liu Shaoqi abroad; the draft: class struggle, the poor and lower-middle peasants, the four clean-ups, education not punishment, cadres in labor, ''squatting''); [[w.macfarquhar-origins-of-the-cultural]], III, 339 (the draft: drafted and revised by Peng Zhen, finished by Chen Boda, Mao correcting throughout; on twenty reports from the provinces); [[w.macfarquhar-origins-of-the-cultural]], III, 340–41 (Mao''s four speeches and written comments at the meeting: no lifting of the ban on executions this year; leniency where restitution is made; the seven Zhejiang documents on cadres'' labor ''very good''); [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.38 (Zhou Enlai has Mao cut the potential enemies from 10 to 5 percent); [[w.mao-zedong-zhuan]], VI, ch. 72 (May 7, at Hangzhou, Mao takes the first draft of the decision, with Peng Zhen, Chen Boda, the bureaus'' first secretaries, Hu Yaobang and Jiang Hua: shorter and graver; class, class struggle, socialist education, reliance on the poor and lower-middle peasants, the four clean-ups, cadres in labor; the "warm-water bath"; the toast to the four clean-ups and five-antis and the victory over revisionism''s root; at table and again after it (n.8)). [[w.jian-zhou-enlai]], 488 (May 7, Mao: socialist education is about class, class struggle and reliance on the poor and lower-middle peasants); [[w.peng-zhen-nianpu-1902]], IV, 262–263 (May 7–12, 1963; Peng Zhen at Mao''s meeting at Hangzhou of the regional bureaus'' first secretaries, Chen Boda, Jiang Hua and Hu Yaobang, on the first draft of the decision on current questions of rural work; May 7, Mao: since the Tenth Plenum socialist education done without the point or the method; the point class and class struggle, reliance on the poor and lower-middle peasants, the "four clean-ups," cadres in labor; of eleven provinces only Hunan and Hebei spoke to him of it; ten years without class struggle in the villages; the "four clean-ups" among the people, a "warm bath" for over 90 percent; the paper shorter and graver; the poor and lower-middle peasants, 50 to 70 percent, the core); [[w.teiwes-tragedy-of-lin-biao]], 199 (Mao''s favourable reference to Lin at the Hangzhou conference on rural problems, May 7–11); [[w.lengxi-shinian-lunzhan-1956-1966]], 562; [[w.macfarquhar-origins-of-the-cultural]], III, 339; [[w.peng-zhen-nianpu-1902]], IV, 263; [[w.zhou-enlai-nianpu-1949]], II, 552–53; [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.38. Made public: abroad, [[w.baum-ssu-ching]], 58–70 (1968, the draft decision); in China, [[w.jin-1949-1989-niande-zhongguo]], 530 (1989; copyright page seen: priced, ISBN, Xinhua, no 内部 mark). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], 9, 515–16 (1987–98); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 285–9, 292–309 (1987–98); [[w.nongye-jitihua-zhongyao-wenjian]], xia, 680–94 (1981). Circulated in China: [[w.mao-zedong-sixiang-wan-1969]], 445 (a Red Guard compilation of Mao''s talks, 1969; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.39). Check: the book dates the meeting May 2–12 and has Mao begin it with the regional first secretaries and Peng Zhen; the Mao chronology has the first secretaries convened May 7–11 (III, 339 n.33). To check: the draft of May 1963 and the 1963 Central Committee decision issued May 20 (the "First Ten Points"); [[w.qian-wannian-suiyue]], 246 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.33); [[w.jin-1949-1989-niande-zhongguo]], 530 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.35a); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 515–16 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.35b); CCP CC, draft resolution on some problems in current rural work (the Former Ten Points), May 1963, in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 680–93 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.42a); [[w.baum-ssu-ching]], 58–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.42b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1107–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.36a); [[w.bian-mao-zedong-he-tade]], 73 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.36b); Informant E, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 339 n.36c); [[w.mao-zedong-sixiang-wan-1969]], 445 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.39); Mao Zedong, comments on the seven Zhejiang documents, May 1963, in [[w.nongye-jitihua-zhongyao-wenjian]], xia, 693–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.42c); Mao Zedong, four speeches and written comments at the Hangzhou meeting, May 1963, in [[w.zedong-jianguo-yilai-mao-zedong]], 10, 285–9, 292–309 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 340 n.43a); Mao Zedong 毛泽东, talk at the Hangzhou meeting 杭州会议 of some Politburo members and the bureaus'' first secretaries, May 7, 1963 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.8); [[w.xianzhi-mao-zedong-zhuan-1949]], 1317 (cited by [[w.jian-zhou-enlai]], 488 n.108); [[w.mao-zedong-sixiang-wansui-beijing-1967]], 456 (cited by [[w.teiwes-tragedy-of-lin-biao]], 199 n.68). Names: Mao Zedong, Peng Zhen, Chen Boda, Zhou Enlai, Deng Xiaoping, Jiang Hua, Hu Yaobang, Liu Shaoqi, Wu Lengxi. Check: Mao''s talk at the meeting is translated in [[w.tse-tung-miscellany-of-mao-tse]], II, 322 (1974), by MacFarquhar (III, 340 n.39).'
