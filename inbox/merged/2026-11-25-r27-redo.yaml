      base: b0fc9e8d
      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 404–5; [[w.macfarquhar-origins-of-the-cultural]], III, 400 (the report); [[w.yang-jisheng-mubei]], II, 1134 n.48 (Wang Guangmei''s summary of July 5, 1964, "Experience of a brigade''s socialist education movement," the Taoyuan experience, printed in the critique materials of 1967); [[w.yang-jisheng-tiandi-fanfu]], I, 87 (her oral report to the Hebei committee, written up as the "Taoyuan experience"; Mao reads it with approval and has it forwarded). Mao, by one informant''s account, voices disgust at the performance in a coarse peasant phrase (III, 405 n.36). Made public: [[w.macfarquhar-origins-of-the-cultural]], III, 404–5 (1997). Printed for internal circulation: [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 472–3, 472–84 (1986). Circulated in China: the report in full, a Red Guard print of Sept. 1967, in [[w.shaoqi-yanlun-ji-a-collection]], 3, 471–570 (a Red Guard print of 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 400 n.10b); Wang Guangmei 王光美, 《關於一個大隊的社會主義教育運動的經驗總結》, July 5, 1964, in *Pipan cailiao* 《批判材料》, 471–570 (a Red Guard compilation; cited by [[w.yang-jisheng-tiandi-fanfu]], I, 85 n.109). To check: Wang Guangmei, report on the Taoyuan experience, July 5, 1964, in [[w.zhonggong-dangshi-jiaoxue-cankao]], 24, 472–3, 472–84 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 400 n.10a); the report in full, a Red Guard print of Sept. 1967, in [[w.shaoqi-yanlun-ji-a-collection]], 3, 471–570 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 400 n.10b); Informant T, interview with the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 405 n.36); Wang Guangmei 王光美, 《關於一個大隊的社會主義教育運動的經驗總結》, July 5, 1964, in *Pipan cailiao* 《批判材料》, 471–570 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 85 n.109). See [[cal.1963-11.china-leadership-3]]. Names: Peng Zhen, Wang Guangmei.'
