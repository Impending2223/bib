  - edit:
      id: cal.1966-05-05.china-leadership-3
      base: b791c840
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 37–38; [[w.macfarquhar-origins-of-the-cultural]], III, 459 (Kang Sheng speaks eight hours, May 5 and 6, relaying Mao''s displeasure with Peng Zhen and Lu Dingyi); [[w.yang-jisheng-tiandi-fanfu]], I, 158–159 (the first four days: Kang Sheng relays Mao''s remarks and instructions on Peng Zhen, Lu Dingyi and others since 1962, and tells how the Notice was drafted, Mao having revised it seven times, with the passages he wrote himself; then Zhang Chunqiao on the Yao Wenyuan article and the "two-line struggle" on the cultural front, Xiao Hua 蕭華 on Luo Ruiqing and the meeting against him, and Chen Boda''s systematic exposure of Peng; the day of each not given); [[w.peng-zhen-nianpu-1902]], IV, 484 (May 5, afternoon, and May 6, morning, 1966; Kang Sheng relays Mao''s words since 1962, above all since November 1965, criticizing Peng Zhen and Lu Dingyi, for dissolving the Propaganda Department and the Peking committee and for the cultural revolution); [[w.pu-weihua-zalan-jiu-shijie]], 62 (Lin Mohan''s recollection, the day not given: at the meeting that passed the May 16 Circular Kang Sheng said Jiang Qing had complained to Mao that Peng Zhen suppressed her, and Mao answered that he could topple Peng with a little finger, Kang being there; and that Mao had told him to tell Jiang Qing and Zhang Chunqiao not to worry); [[w.pu-weihua-zalan-jiu-shijie]], 75–77 (the afternoon of May 5 and the morning of May 6, eight hours; the time is the first day''s; Mao''s directions since September 1962 and November 1965 on Peng Zhen and Lu Dingyi and on dissolving the Propaganda Department and the Peking committee; the Notice''s drafting; Lin Biao calls it the most important document since liberation; by Kang''s account: Shanghai under Ke Qingshi from 1962 against Peking and the Department; Mao''s letter of Dec. 12, 1963 to Peng Zhen and Liu Ren; Peng''s "hard resistance" Nov. 10 to Dec. 20, 1965; Peng alone with Mao Dec. 23; four days at Mao''s, Feb. 7 to 10, Wang Renzhong there; a night with Zhou Enlai before Shanghai, three talks with Mao there; the Secretariat Apr. 9, 11 and 12; a meeting at Mao''s Apr. 22). Made public: [[w.nianyi-da-dongluande-niandai]], 10–12 (1988; copyright page seen: priced, ISBN, Xinhua, no 内部 mark). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 21 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); Kang Sheng, speech of May 5–6, 1966 (part), and a later speech of Chen Boda, in [[w.lin-biao-wenxuan-2]], xia, 264–72 (a Red Guard compilation of Lin Biao''s writings, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.158b). To check: [[w.gaoju-mao-zedong-sixiang]], 21 (cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); [[w.nianyi-da-dongluande-niandai]], 10–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.158a); Kang Sheng, speech of May 5–6, 1966 (part), and a later speech of Chen Boda, in [[w.lin-biao-wenxuan-2]], xia, 264–72 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.158b); Lin Mohan 林默涵, 〈「文革」前的幾場文藝風波〉, in [[w.huishou-wenge-2-vols]], I, 265–266 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 62 n.83). Names: Kang Sheng, Peng Zhen, Luo Ruiqing, Lu Dingyi, Yang Shangkun. Check: the day of Zhang Chunqiao''s briefing. Check: the afternoon of May 6 ([[w.macfarquhar-origins-of-the-cultural]], III, 459); the briefing, which this entry carried, is now an entry of its own, [[cal.1966-05-06.china-leadership-2]].'
      kind: correct
  - edit:
      id: cal.1966-05-14.china-leadership
      base: ab52c560
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 35; [[w.macfarquhar-origins-of-the-cultural]], III, 459 (the note on each seat; Lin Biao will not accept Lu Dingyi''s plea that he knew nothing of his wife''s letter); [[w.yang-jisheng-tiandi-fanfu]], I, 146, 148 (the note of Lin Biao, dated May 14, laid on each desk before the first plenary session of May 20; at the meeting Lu Dingyi, in his self-criticism, says he did not know of Yan Weibing''s letters and cannot speak falsely at the Politburo; Lin Biao presses how a husband could not know); [[w.teiwes-tragedy-of-lin-biao]], 15 (Lin circulates a letter that Ye Qun was a virgin at their marriage, against the anonymous charges of Lu Dingyi''s wife, and at the meeting attacks Lu: "I''d love to shoot you"); [[w.pu-weihua-zalan-jiu-shijie]], 88–89 (Lin Biao''s note, dated May 14, given out before Lu Dingyi''s self-criticism at the afternoon session of May 19: Ye Qun pure at their marriage and faithful since; she never loved Wang Shiwei; their children theirs; Yan Weibing''s letters all fabrications; Lu: he has the pen alone, is sixty-one and ill, could he make a coup; he knew nothing of the letters, his letter of Apr. 18 already said so; Lin, pounding the table, abuses him). Made public: abroad, [[w.zhan-bao]], Jan. 18, 1967, translated in *Survey of China Mainland Press, Supplement*, no. 165, 12 (1967); in China, [[w.nianyi-da-dongluande-niandai]], 19 (1988; copyright page seen: priced, ISBN, Xinhua, no 内部 mark). Circulated in China: [[w.zhan-bao]], Jan. 18, 1967 (a Red Guard paper; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.162b). To check: [[w.han-789-jizhongying]], 12–30 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.16); [[w.nianyi-da-dongluande-niandai]], 19 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.17); [[w.zhan-bao]], Jan. 18, 1967 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.162b); Chen Qingquan 陳清泉 and Song Guangwei 宋廣渭, *Lu Dingyi zhuan* 《陸定一傳》 (Zhonggong dangshi chubanshe 中共黨史出版社, 1999), 501 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 146 n.40); [[w.li-wang-li-fansi-lu]], the 2008 Beixing ed. 香港北星出版社 as Yang cites it, 24 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 148 n.46). Names: Lin Biao, Ye Qun, Lu Dingyi. Check: MacFarquhar (35) dates the note May 14 and the session by it.'
      kind: correct
  - edit:
      id: cal.1966-05-18.china-leadership-2
      base: 8871b12f
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, May, mid, 1966 (the two entries "5月中旬" and "同旬"); [[w.macfarquhar-origins-of-the-cultural]], III, 459 (Mao has Zhou tighten security in Peking and the Zhongnanhai); [[w.jian-zhou-enlai]], 541 (Zhou, on Mao''s orders, deploys more "reliable military units" for the "safety of Beijing and the surrounding areas," and knows he must stay in Peking; not the day); [[w.pu-weihua-zalan-jiu-shijie]], 113 (mid-May 1966, during the enlarged Politburo meeting, Mao raises the strengthening of the capital''s guard; he dares not lightly come back to Peking). Made public: [[w.macfarquhar-origins-of-the-cultural]], III, 459 (1997). Circulated in China: Zhou Enlai, speech to Red Guards on Mao''s security orders, in [[w.zhongyang-shouzhang-jianghua-1967]], 1, 249 (a Red Guard compilation of central leaders'' speeches, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.160b). To check: Zhou Enlai, speech to Red Guards on Mao''s security orders, in [[w.zhongyang-shouzhang-jianghua-1967]], 1, 249 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.160b); Michael Schoenhals, communication to the author (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 459 n.160c); [[w.zhou-enlai-junshi-huodong]], 628–629 (cited by [[w.jian-zhou-enlai]], 541 n.87a); [[w.zhou-enlai-nianpu-1949]], III, 31–32 (cited by [[w.jian-zhou-enlai]], 541 n.87b). Names: Zhou Enlai, Mao Zedong, Lin Biao. Check: the nianpu dates the two papers only to the middle ten days of May; May 18 is Zhou''s report''s date.'
  - edit:
      id: cal.1966-05-21.china-leadership-2
      base: 6d7027f4
      set:
        n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 31 (May 21, 1966); [[w.macfarquhar-maos-last-revolution]], 37–38, 41 (Zhou''s remarks of May 21); [[w.macfarquhar-origins-of-the-cultural]], III, 459–60 (Zhou: the four took the capitalist road; their exposure a victory for Mao Zedong Thought); [[w.yang-jisheng-tiandi-fanfu]], I, 132, 149, 152 (the same speech, May 21: Yang Shangkun cannot compare with the three others, he cannot make a weather of his own and only held on to legs 抱了腿, namely Liu''s and Deng''s; Lu Dingyi was found in the husband-and-wife shop 夫妻老婆店, their common ground against putting politics first and against Mao Zedong Thought; his wife wrote anonymous letters six years, more of them when politics was put first; the "Four Families" 四大家族 have taken many positions, uncovering them is a victory of the "bamboo-shoot-stripping policy" 剝筍政策, to be celebrated; after the Gao Gang and Peng-Huang-Zhang-Zhou affairs this is the third; Lin Biao interjects: either they strip us or we strip them); [[w.yang-jisheng-tiandi-fanfu]], I, 159, 169 (Zhou treats loyalty to Mao as keeping one''s integrity in later years 晚節 ("integrity not kept is cancelled at a stroke"); on coups Zhou takes up Lin''s point of sixty-one coups in Asia, Africa and Latin America and names three preventions: revisionism in power, a revisionist coup, a revisionist military coup; revisionism''s coup rests on pen and gun, which Peng, Luo, Lu and Yang took one by one); [[w.yang-jisheng-tiandi-fanfu]], II, 695, 697 (on keeping one''s integrity in later years: Qu Qiubai a traitor, Li Xiucheng a traitor; he proposes moving Qu out of Babaoshan and destroying Li''s palace at Suzhou); [[w.jian-zhou-enlai]], 541–542 (Zhou endorses Lin on preventing a "reactionary coup d''état"; "revisionism will come into being on both the central and local levels," not to be let "take over our control of power"; on "keeping one''s political integrity in his senior years": "We must follow Chairman Mao. Chairman Mao is our leader today, and he will remain our leader one hundred years later"; one disloyal in later years undoes all past merit, "Even after one''s coffin is sealed ... one will still be doomed"); [[w.pu-weihua-zalan-jiu-shijie]], 60 n.79 (Zhou Enlai, as Bu quotes him: the Outline of Feb. 7, Mao caught it within five days; asked of the localities at last year''s work conference whether they would rebel if revisionism appeared at the Center; the "four great families" have taken many of our positions; the passage not in the *Wenku*''s text of the speech, from another version circulated in the Cultural Revolution); [[w.pu-weihua-zalan-jiu-shijie]], 85 (Zhou Enlai: fully agrees with Lin Biao''s speech; revisionism bound to rise, at the Center and in the localities; Peng, Luo, Lu and Yang took our positions one by one, the pen and the gun; to prevent revisionists in power, their subversion and their military coup). Made public: [[w.schoenhals-ccp-central-case-examination]], 5–6 (1995). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 21 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966, in [[w.ziliao-xuanbian]], 10–11 (a Red Guard compilation of central leaders'' speeches, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 41 n.40); Zhou Enlai, speech of May 21, 1966, in [[w.gaoju-mao-zedong-sixiang]], 19–23 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163b). Check: MacFarquhar (37–38, 41) has Zhou call the four purged the "four big families" and their removal a time bomb removed, and say the movement will target the center, the inside of the Party and the higher levels. To check: [[w.gaoju-mao-zedong-sixiang]], 21 (cited by [[w.macfarquhar-maos-last-revolution]], 38 n.25); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966, in [[w.ziliao-xuanbian]], 10–11 (cited by [[w.macfarquhar-maos-last-revolution]], 41 n.40); [[w.schoenhals-ccp-central-case-examination]], 5–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163a); Zhou Enlai, speech of May 21, 1966, in [[w.gaoju-mao-zedong-sixiang]], 19–23 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 460 n.163b); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 149 n.51); Zhou Enlai, remarks to the enlarged Politburo meeting, May 21, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 159 n.4); Zhou''s speech at a Politburo enlarged meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 542 n.90); Zhou Enlai 周恩來, speech at the enlarged Politburo meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] and another version circulated in the Cultural Revolution (cited by [[w.pu-weihua-zalan-jiu-shijie]], 60 n.79); Zhou Enlai 周恩來, speech at the enlarged Politburo meeting, May 21, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (2002) (cited by [[w.pu-weihua-zalan-jiu-shijie]], 85 n.12). Names: Zhou Enlai.'
      kind: correct
