  - edit:
      id: cal.1965-11-18.china-leadership
      base: 5302647f
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 22; [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.44 (Lin Biao proposes, and Mao approves, five principles for PLA work in 1966, the first two the study of Mao''s works and the "four firsts"); [[w.yang-jisheng-tiandi-fanfu]], I, 63 (Lin Biao: whatever is Chairman Mao''s instruction is to be firmly supported and carried out, "up a mountain of knives, into a sea of fire"); [[w.pu-weihua-zalan-jiu-shijie]], 31–32 (the five principles quoted: study Mao''s works in a living way, his books the highest instructions; the four firsts; leading cadres to the grass roots and the four-good companies; promote the best boldly; train hard, close and night fighting; Lin: giving prominence to politics not optional but a law of socialist society); [[w.teiwes-tragedy-of-lin-biao]], 209 (formulated on the eve of a political work conference, unexpectedly put off to Dec. 30; ranking cadres to investigate at the grass roots, good fighters promoted, close-range and night training stepped up). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], 11, 480–1 (1987–98). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 188 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.teiwes-tragedy-of-lin-biao]], 209 n.106). Check: [[w.jianguo-yilai-mao-zedong]], XVIII, 169 n.1, gives five principles in Lin Biao''s citation of Nov. 14 to the naval units (*Renmin ribao*, Nov. 15) and in his telephone report to Mao of Nov. 16, proposed as the army''s guide for 1966, the first to study Mao''s works more urgently and apply them; whether the principles of Nov. 18 are the same text. To check: [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 262 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.34); Mao Zedong, approval of Lin Biao''s five principles, Nov. 1965, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 480–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.44b); Lin Biao 林彪, 〈關於1966年全軍工作方針的指示〉, Nov. 18, 1965, in *Lin fuzhuxi yulu* 《林副主席語錄》 (printed May 1969), 34 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 63 n.53); [[w.gaoju-mao-zedong-sixiang]], 188 (cited by [[w.teiwes-tragedy-of-lin-biao]], 209 n.106). Names: Lin Biao, Mao Zedong.'
  - edit:
      id: cal.1965-12-02.china-leadership-3
      base: 1f77c2c7
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 24; [[w.jianguo-yilai-mao-zedong]], XVIII, 175–177 (Dec. 2, 1965; Mao''s note of Dec. 2 on Lin Biao''s forwarding of the Lanzhou Military Region Party committee''s report of Nov. 7 on the 55th Division''s emergency war preparation: fully agrees with Lin''s view; the division''s case probably like the others''; may it go to all military regions, services and arms down to division Party committees; those who do not believe in prominence for politics, who comply in form and spread eclecticism, that is opportunism, are to be watched; to go first to Liu Shaoqi, Zhou and Peng Zhen); [[w.peng-zhen-nianpu-1902]], IV, 451 (Dec. 2, 1965; Peng Zhen, with Liu Shaoqi and Zhou Enlai, receives Mao''s comment on the Lanzhou Military Region committee''s report on the 55th Division; Peng then forwards it, as Mao directs, to the military regions, services and arms and the army and division Party committees); [[w.jian-zhou-enlai]], 531 (Mao, on a report Lin had sent him, endorses "highlighting politics" and denounces "those who have spread eclecticism [that is, opportunism]" in the army; he has the words relayed to Zhou, Liu and the other leaders); [[w.pu-weihua-zalan-jiu-shijie]], 27 (Mao''s comment on Lin''s letter of Nov. 18 and the Lanzhou Military Region''s material, wholly agreeing); [[w.teiwes-tragedy-of-lin-biao]], 212 (Mao''s comment on a military report: "eclecticism," wavering between military and political work, "opportunism"; soon plainly aimed at Luo); [[w.teiwes-tragedy-of-lin-biao]], 30 (the key development, Mao''s warning of Dec. 2 against opportunists "who don''t believe in giving prominence to politics"). Made public: [[w.shinian-houde-pingshuo]], 66, 68 (1987; marking not seen). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], XI, 486 (1987–98). Circulated in China: Mao Zedong, "Fandui zhezhongzhuyide wenti" (On Opposing Eclecticism), in [[w.mao-zedong-sixiang-wan]], 149 (a Red Guard compilation of Mao''s talks; cited by [[w.macfarquhar-maos-last-revolution]], 24 n.45). To check: Mao Zedong, "Fandui zhezhongzhuyide wenti" (On Opposing Eclecticism), in [[w.mao-zedong-sixiang-wan]], 149 (cited by [[w.macfarquhar-maos-last-revolution]], 24 n.45); Party committee of the Lanzhou Military Region, report on giving prominence to politics in the 55th Division''s emergency war preparation (ordered to the Sino-Indian border in mid- and late Sept. 1965, then a week of motorized and foot-march exercise), Nov. 7, 1965, sent to Mao by Lin Biao Nov. 18 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 176 n.1); Lin Biao, letter to Mao Zedong of Dec. 3, 1965 accepting Mao''s note, to be sent to Liu Shaoqi, Zhou and Peng Zhen and the Military Commission''s Standing Committee, then to Party committees at division level and above (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 177 n.4); [[w.zedong-jianguo-yilai-mao-zedong]], XI, 486 (cited by [[w.jian-zhou-enlai]], 531 n.54); [[w.peng-zhen-nianpu-1902]], IV, 451 (cited by [[w.jian-zhou-enlai]], 531 n.55); [[w.qibin-zhongguo-gongchandang-zhizheng-sishinian]], 262 (cited by [[w.teiwes-tragedy-of-lin-biao]], 212 n.116a); [[w.jin-1949-1989-niande-zhongguo]], 635 (cited by [[w.teiwes-tragedy-of-lin-biao]], 212 n.116b); [[w.jin-1949-1989-niande-zhongguo]], 633 (cited by [[w.teiwes-tragedy-of-lin-biao]], 30 n.57a); [[w.shinian-houde-pingshuo]], 66, 68 (cited by [[w.teiwes-tragedy-of-lin-biao]], 30 n.57b); [[w.xiao-jingguang-huiyilu-xuji]], 241, 246, 249–251 (cited by [[w.teiwes-tragedy-of-lin-biao]], 30 n.57c); Teiwes and Sun''s unnamed oral sources (interviews with Party and military historians and with persons connected to the actors, early 1990s), as they report them (cited by [[w.teiwes-tragedy-of-lin-biao]], 30 n.57d). Names: Mao Zedong, Lin Biao. Check: 内部发行 or a like marking in [[w.shinian-houde-pingshuo]] (copyright page not seen; its catalogue record, CiNii NCID BN05540441, notes none).'
