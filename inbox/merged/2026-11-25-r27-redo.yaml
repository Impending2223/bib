      base: 1a464547
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 49; [[w.macfarquhar-origins-of-the-cultural]], III, 456, 458 n.153 (Peng Zhen inspects the third front in Sichuan; Peng Dehuai keeps out of his photographs); [[w.peng-zhen-nianpu-1902]], IV, 470–471 (Feb. 20–Mar. 1, 1966; Peng Zhen leads Xu Liqun, Hu Sheng and others, eleven, by air to Sichuan to inspect the third front; over 600 km by car on mountain roads: the Deyang heavy machinery and electrical machinery works, the Zigong natural gas campaign and salt wells, the Panzhihua iron mine, the bridges of the Jinsha and Yalong railway and road, the Xichang vanadium-titanium works; with Yan Xiufeng 阎秀峰 and Zhou Yi 周颐; at Dukou 渡口 he meets some 250 activists of the third front, dines with them and sees a performance). Made public: [[w.chuncai-peng-dehuai-zai-san]], 68–9 (1991; marking not seen). Circulated in China: *Peng Zhen zuie shi (1925–1966)* (a Red Guard chronology of Peng Zhen, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73c); *Dadao Li Jingquan* (a Red Guard compilation against Li Jingquan, 1967; cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73d). To check: [[w.chang-mao]], 528 (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73a); [[w.dongbing-zuichude-kangzheng]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73b); [[w.peng-zhen-zuie-shi]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73c); [[w.dadao-li-jingquan]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73d); [[w.chuncai-peng-dehuai-zai-san]], 68–9 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 458 n.153c). Names: Peng Zhen, Li Jingquan. Check: MacFarquhar (49 n.73): *Peng Zhen zuie shi* has Peng in Sichuan Feb. 20–28 and meeting Li Jingquan; *Dadao Li Jingquan* has him arrive in "late February" and return Mar. 6; neither mentions a meeting with Peng Dehuai, as Chang and Halliday (528) have it. Check: 内部发行 or a like marking in [[w.chuncai-peng-dehuai-zai-san]] (copyright page not seen; its catalogue record, CiNii NCID BN07571468, notes none).'
