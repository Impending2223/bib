      id: cal.1961-06-12.china-leadership
      base: 794b2a2b
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], IV, June 12, 1961; [[w.macfarquhar-origins-of-the-cultural]], III, 63 (Mao''s closing speech; his later claim of a self-criticism); [[w.macfarquhar-origins-of-the-cultural]], III, 235 (Mao''s view, "that summer," that the campaign against right opportunism had spread too widely, with reversals of verdicts proposed); [[w.yang-shangkun-riji]], II, 41 (June 12, 1961; the plenary, 11 a.m. to 2 p.m.; Mao: sum up experience, educate cadres, learn Marxism-Leninism from three years'' work, sum up eleven years of building; it may take another eleven); [[w.deng-xiaoping-nianpu-1904]], III, 1645 (June 12, 1961; Deng at the plenary; Mao on summing up experience and educating cadres; city work this year; Lushan in August on rectification in the cities and industry); [[w.mao-zedong-zhuan]], V, ch. 68 n.19 (June 12, morning: Mao closes the conference, reviewing the years since Zhengzhou; the first Zhengzhou meeting copied Stalin, the second hurried; the Beidaihe talks of 1960 mostly on foreign affairs, the twelve articles of November the turn; he asks all to read Stalin''s *Economic Problems of Socialism in the USSR* again). [[w.yang-jisheng-mubei]], II, 918 n.147 (after Lushan the mistake was to pass the resolution on Peng, Huang, Zhang and Zhou below the county; it should have stopped at the county, with the Zhengzhou minutes and the Shanghai eighteen questions still carried out below and the left still opposed; fighting the right made a false picture; good people who spoke the truth were made right opportunists, even counterrevolutionaries); [[w.peng-zhen-nianpu-1902]], IV, 133 (June 12, 1961; Peng Zhen at the plenary; Mao on summing up experience and educating cadres); [[w.friedman-shadow-cold-war]], 62 (Mao makes some self-criticism at a Central Work Conference in Peking in June 1961, not circulated to the lower levels); [[w.chen-yun-nianpu-xiuding]], III, 93 (morning: Chen Yun at the plenary; when Li Fuchun says the plan must first meet the needs of farming and the market, Mao interjects: "Comrade Chen Yun said before that the market comes first; many opposed it then, and I did not speak; now are we not back on that track?"); [[w.teiwes-tragedy-of-lin-biao]], 194 (Mao there praises Lin''s field investigations in the combat units, "once at Guangzhou, once at Yangcun"); [[w.yang-shangkun-riji]], II, 41; [[w.mao-zedong-zhuan]], V, ch. 68. [[w.chen-yun-nianpu-xiuding]], III, 93; [[w.yang-shangkun-riji]], II, 41; [[w.peng-zhen-nianpu-1902]], IV, 133. Made public: abroad, [[w.lieberthal-research-guide-to-central-1989]], 118 (1989); in China, [[w.gailong-dangdai-zhongguo-zhengzhi-dashidian]], 631 (1991; marking not seen). Circulated in China: [[w.mao-zedong-sixiang-wan-1969]], 406 (a Red Guard compilation of Mao''s talks, 1969; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132a); [[w.mao-zedong-sixiang-wan]], xia, 332–34 (a Red Guard compilation of Mao''s talks; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.133). Check: the book places Mao''s view only "that summer"; its source is Wang Bangzuo ([[w.bangzuo-zhongguo-gongchan-dang-tongyi]], 530–31). Check: Yang Shangkun''s diary has the closing plenary from 11 a.m. to 2 p.m., Li Fuchun on adjusting the industrial targets, Zhou Enlai on rural grain and cutting staff and Li Xiannian on oil crops and foreign trade speaking after Mao ([[w.yang-shangkun-riji]], II, 41); a time field. Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 41) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 68), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.mao-zedong-sixiang-wan-1969]], 406 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132a); [[w.gailong-dangdai-zhongguo-zhengzhi-dashidian]], 631 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132b); [[w.lieberthal-research-guide-to-central-1989]], 118 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.132c); [[w.mao-zedong-sixiang-wan]], xia, 332–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.133); [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 223 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 63 n.134); [[w.bangzuo-zhongguo-gongchan-dang-tongyi]], 530–31 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 235 n.10); Mao Zedong 毛泽东, speech at the Central Work Conference 中央工作会议, Peking, June 12, 1961 (record 讲话记录) (cited by [[w.mao-zedong-zhuan]], V, ch. 68 n.19); Kenneth Lieberthal, “The Great Leap Forward and the Split in the Yan’an leadership, 1958–1965,” in The Politics of China, ed. Roderick Macfarquhar, 112 (cited by [[w.friedman-shadow-cold-war]], 62 n.5); [[w.mao-zedong-sixiang-wansui-beijing-1967]], 365 (cited by [[w.teiwes-tragedy-of-lin-biao]], 194 n.57). Names: Mao Zedong, Peng Dehuai, Huang Kecheng, Zhang Wentian, Zhou Xiaozhou, Chen Yun, Li Fuchun, Zhou Enlai, Li Xiannian, Peng Zhen. Check: [[w.chenghua-zhonghua-renmin-gongheguo-zhengzhi]], 223 (1987), cited by MacFarquhar (III, 63 n.134) on Peng Dehuai''s case, may print the speech earlier. Check: 内部发行 or a like marking in [[w.gailong-dangdai-zhongguo-zhengzhi-dashidian]] (copyright page not seen; its catalogue record, CiNii NCID BN07100166, notes none).'
      kind: correct
  - edit:
      id: cal.1962-01-29.china-leadership
      base: c1cb3c3e
      set:
        n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 29, 1962. [[w.macfarquhar-origins-of-the-cultural]], III, 166–68 (Lin Biao''s speech); [[w.macfarquhar-origins-of-the-cultural]], III, 143–144 (Lin Biao; Mao opens the second stage); [[w.yang-shangkun-riji]], II, 118 (Jan. 29, 1962; 4 to 7 p.m., the plenary; Lin Biao speaks; Mao: all to "vent their anger" 出气, the conference extended some days, to close before the Spring Festival); [[w.deng-xiaoping-nianpu-1904]], III, 1686–1687 (Jan. 29, 1962; afternoon; Deng at the plenary; Lin Biao on Party and military work; Mao extends the meeting over the Spring Festival, a "venting" meeting); [[w.mao-zedong-zhuan]], V, ch. 69 nn.19, 21 (Jan. 29, plenary, Mao presiding: Lin Biao speaks, the difficulties in part from not following Mao''s instructions; Mao calls it very good and asks that it be written up in a week or two; Mao then announces that the session is lengthened, that all may let off steam, speak freely and say it all; democratic centralism not yet a fact). [[w.dikotter-maos-great-famine]], 336 n.3 (Lin Biao lauds the Great Leap as an unprecedented accomplishment: work went well when Mao''s thought was carried out and not interfered with); [[w.yang-jisheng-mubei]], II, 1115–1116 n.11–13 (on the afternoon of Jan. 29, after Mao has said ''vent by day, see plays at night, two dry meals and one thin'' and the conference is held on, Lin Biao speaks, with Mao presiding: the Three Red Banners right, the difficulties the result of not following Mao''s instructions; Mao says it is a very good speech on the Party''s line and military policy and asks for it to be collated in a week or half a month); [[w.jian-zhou-enlai]], 462 (Lin Biao hails Mao, the disaster from a "failure to follow Mao Thought"); [[w.yang-jisheng-tiandi-fanfu]], I, 68–69 (the afternoon of the 29th, told that the delegates have not had their say and still have "a bellyful of anger," Mao: "vent your anger by day, see an opera at night, two solid meals and one of gruel, and all are content," and the conference, set to close Jan. 30 or 31, goes on; Lin Biao: the difficulties came "precisely because" Mao''s instructions were not followed; Mao''s outstanding merit is that he is practical; Mao presiding, after: "a very good speech ... tidy it up; a week or half a month"); [[w.peng-zhen-nianpu-1902]], IV, 170 (Jan. 29, 1962, afternoon; Peng Zhen at the plenary, Mao presiding; Lin Biao: the difficulties came from not acting on Mao''s instructions, warnings and thought, work goes well when Mao''s thought is not interfered with; Mao: "a very good speech," to be put in order; Mao extends the conference over the Spring Festival for "venting" meetings, the prefectural and county cadres being afraid to speak of the provincial leaders); [[w.dikotter-cultural-revolution]], 12 n.14 (Lin Biao hails the Great Leap as unprecedented: the Chairman''s thoughts always correct; whenever his ideas were not respected or suffered interference, there were problems); [[w.teiwes-tragedy-of-lin-biao]], 196 (Lin''s speech, in a printed text the authors were given: Mao''s leadership and authority defended; the situation after the Leap not nearly so bad as it seemed, a little faith all that is needed; the hall cool to it; Mao leads the applause). Made public: [[w.yunsheng-maojiawan-jishi]], 210 (1988; marking not seen). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], 10, 59–60, 62–65 (1987–98). Circulated in China: [[w.lin-biao-xuanji-untitled]], 129–40 (a Cultural Revolution collection of Lin Biao''s works; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136a); [[w.lin-biao-xuanji-untitled]], 132 (a Cultural Revolution collection of Lin Biao''s works; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.142a); [[w.lin-biao-xuanji-untitled]], 129 (a Cultural Revolution collection of Lin Biao''s works; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.143a); [[w.lin-biao-xuanji-untitled]], 132–34 (a Cultural Revolution collection of Lin Biao''s works; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145a). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 118) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Check: Made public: the *Mao Zedong zhuan* prints the act in its 2011 text ([[w.mao-zedong-zhuan]], V, ch. 69), by its postscript first in 2003 ([[w.xianzhi-mao-zedong-zhuan-1949]]), earlier than the year given; earlier still if [[w.macfarquhar-origins-of-the-cultural]], cited here, prints it. To check: [[w.lin-biao-xuanji-untitled]], 129–40 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136a); [[w.jin-1949-1989-niande-zhongguo]], 410–12 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136b); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 5–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136c); [[w.yunsheng-maojiawan-jishi]], 210 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136d); [[w.qi-qian-ren-dahui]], 125–61 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 166 n.136e); [[w.lin-biao-xuanji-untitled]], 132 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.142a); [[w.qi-qian-ren-dahui]], 129–30 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.142b); [[w.lin-biao-xuanji-untitled]], 129 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.143a); [[w.qi-qian-ren-dahui]], 126 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 167 n.143b); [[w.lin-biao-xuanji-untitled]], 132–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145a); [[w.qi-qian-ren-dahui]], 130–34 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145b); [[w.macfarquhar-origins-of-the-cultural]], II, 15–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.145c); [[w.wenzao-guanyu-qiqian-ren-dahuide]], 6 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148a); [[w.jin-1949-1989-niande-zhongguo]], 413 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148b); [[w.zhisui-private-life-of-chairman]], 387–88 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148c); [[w.zedong-jianguo-yilai-mao-zedong]], 10, 59–60, 62–65 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 168 n.148d); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1019 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 143 n.19); [[w.tianrong-guanyu-yijiuliuer-nian-qiqian]], 6–10 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-a); [[w.xiangqian-qiqian-ren-dahui-shimo]], 28 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 144 n.sources-d); Lin Biao 林彪, speech at the enlarged Central Work Conference, Jan. 29, 1962; in [[w.jianguo-yilai-zhongyao-wenxian]], XV, 107–108 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.19); Record of the enlarged Central Work Conference 扩大的中央工作会议记录, Jan. 29, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.21); Lin Biao, speech of Jan. 29, 1962, Gansu Provincial Archives, 91-18-493, pp. 163–164 (cited by [[w.dikotter-maos-great-famine]], 336 n.3); [[w.zhang-suhua-bianju-qiqian-ren-dahui-shimo]], 143–145 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 69 n.65); Lin Biao, speech to the enlarged Central Work Conference, Jan. 29, 1962, edited text, a printed text provided to the authors by Chinese sources (cited by [[w.teiwes-tragedy-of-lin-biao]], 196 n.61a); [[w.jin-1949-1989-niande-zhongguo]], 406–407, 410–412 (cited by [[w.teiwes-tragedy-of-lin-biao]], 196 n.61b). See [[cal.1962-01-27.china-leadership]]. Names: Mao Zedong, Lin Biao. Check: 内部发行 or a like marking in [[w.yunsheng-maojiawan-jishi]] (copyright page not seen; its catalogue record, CiNii NCID BN07990879, notes none).'
