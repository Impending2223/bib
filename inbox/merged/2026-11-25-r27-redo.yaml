      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 275 (read out by Zhou Enlai at the Twelfth Plenum, October 1968); [[w.yang-jisheng-mubei]], II, 903 (the line "the general''s one leap ruins his body and name"); [[w.pu-weihua-zalan-jiu-shijie]], 37 n.58 (the verse quoted, Xin Qiji''s line with "a hundred battles" made "one jump"). Made public: [[w.macfarquhar-maos-last-revolution]], 275 (2006). Circulated in China: Zhou Enlai''s speech, in [[w.zai-zhonggong-ba-jie]], 31–34 (a compilation of speeches at the Twelfth Plenum, 1969; cited by [[w.macfarquhar-maos-last-revolution]], 276 n.8). To check: Zhou Enlai''s speech, in [[w.zai-zhonggong-ba-jie]], 31–34 (cited by [[w.macfarquhar-maos-last-revolution]], 276 n.8). See [[cal.1966-03-18.china-leadership-3]]. Names: Ye Jianying, Luo Ruiqing. Check: the day.'
