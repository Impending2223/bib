      base: f51f2c10
      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 387; [[w.jianguo-yilai-mao-zedong]], XVII, 269–271 (June 27, 1964; Mao''s comment, dated June 27, on the Propaganda Department''s draft report of May 8, sent to Liu, Zhou, Deng, Peng, Kang Sheng, Lu Dingyi, Zhou Yang, Wu Lengxi and Chen Boda, back to Mao; "a club like Hungary''s Petőfi Club"); [[w.mao-zedong-zhuan]], VI, ch. 72 (June 27 Mao to Liu, Zhou, Deng, Peng Zhen and others: for fifteen years the associations have in the main not carried out Party policy, have slid to the edge of revisionism, and will become like the Petőfi Club (n.21)). The Chinese texts have "basically," the *Current Background* translation not (III, 387 n.42). [[w.yang-jisheng-tiandi-fanfu]], I, 100 ("one day they will become groups like Hungary''s Petőfi Club"); [[w.peng-zhen-nianpu-1902]], IV, 340 (June 27, 1964; Mao''s comment on the Propaganda Department''s report of May 8 on the rectification of the Federation of Literary and Art Circles and the associations: most of them and their journals, for fifteen years, did not carry out the Party''s policy, acted as officials and lords, kept from the workers, peasants and soldiers, did not reflect the socialist revolution, and lately fell to the edge of revisionism; unremolded, some day a Petőfi Club; sent to Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Kang Sheng, Lu Dingyi, Zhou Yang, Wu Lengxi and Chen Boda); [[w.dikotter-cultural-revolution]], 38 n.34b (the Federation of Literature and Art on the edge of revisionism: "For the last fifteen years, they have not been carrying out the party''s policy"); [[w.pu-weihua-zalan-jiu-shijie]], 3 (the comment on the Propaganda Department''s literature and art office''s report on the rectification in the federation and associations, quoted); [[w.teiwes-tragedy-of-lin-biao]], 201–202 (a new, harsher attack on the responsible cultural officials: "acted as high and mighty bureaucrats"). Made public: abroad, [[w.current-background]], no. 891 (Oct. 8, 1969), 41; in China, [[w.jin-1949-1989-niande-zhongguo]], 553, 554 (1989; copyright page seen: priced, ISBN, Xinhua, no 内部 mark). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], 11, 91–3 (1987–98); [[w.zedong-jianguo-yilai-mao-zedong]], XI, 91 (1987–98). Circulated in China: [[w.mao-zedong-sixiang-wan]], 26 (a Red Guard compilation of Mao''s talks; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42c). To check: [[w.jin-1949-1989-niande-zhongguo]], 553 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.41a); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1221–2 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.41b); [[w.yibo-ruogan-zhongda-juece-yu-1991-93]], 2, 1222, 1222–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42a); Mao Zedong, comment of June 27, 1964, in [[w.zedong-jianguo-yilai-mao-zedong]], 11, 91–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42b); [[w.mao-zedong-sixiang-wan]], 26 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42c); [[w.current-background]], 41 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42d); [[w.jin-1949-1989-niande-zhongguo]], 554 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 387 n.42e); Central Propaganda Department to the Center, "Report on the rectification of the Federation of Literary and Art Circles and the associations (draft)," May 8, 1964 (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 269 n.1a); Writers'' Union party group, "Summary report on the rectification" (sent with the Propaganda Department''s draft report of May 8, 1964) (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 271 n.1b); Mao Zedong 毛泽东, comment to Liu Shaoqi 刘少奇, Zhou Enlai 周恩来, Deng Xiaoping 邓小平, Peng Zhen 彭真 and others on the literary and art associations (manuscript 手稿), June 27, 1964 (cited by [[w.mao-zedong-zhuan]], VI, ch. 72 n.21); [[w.zedong-jianguo-yilai-mao-zedong]], XI, 91 (cited by [[w.pu-weihua-zalan-jiu-shijie]], 3 n.5). Names: Mao Zedong. Check: Made public: 1967, which no work read bears out (the first read printing [[w.teiwes-tragedy-of-lin-biao]], 201–202, 1996); whether the comment was printed openly in May 1967 with Mao''s comment of Dec. 12, 1963, or first in [[w.current-background]].'
