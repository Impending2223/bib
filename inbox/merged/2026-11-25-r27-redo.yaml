      base: 5497d64a
      set:
        n: '[[w.jianguo-yilai-mao-zedong]], XVII, 259–260 (May 9, 1964; note 1); [[w.teiwes-tragedy-of-lin-biao]], 201 (after a briefing on the third arts festival: two criteria for revolutionary art, a political and an aesthetic, "chemically combined, not simply lumped together"; issued as his "Instruction on the PLA''s literature and art work"). Made public: [[w.teiwes-tragedy-of-lin-biao]], 201 (1996). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 183 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.teiwes-tragedy-of-lin-biao]], 201 n.76). To check: General Political Department, Gongzuo tongxun no. 131, June 2, 1964, printing Lin Biao''s talk of May 9 on army arts (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 259 n.1); [[w.gaoju-mao-zedong-sixiang]], 183 (cited by [[w.teiwes-tragedy-of-lin-biao]], 201 n.76). Names: Lin Biao, Liu Zhijian, Fu Zhong, Chen Qitong. Check: whether the notes of the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) give it.'
