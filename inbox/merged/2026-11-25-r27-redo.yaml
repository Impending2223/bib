      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 275–276 (a keynote Chinese histories do not mention); [[w.yang-jisheng-tiandi-fanfu]], II, 707–709 (on the marshals: Nie Rongzhen and Zhao Erlu, the receptions of Nov. 13 and 27, 1966, Ye Jianying''s daughter, Ye and the Sichuan leaflet of Feb. 17, 1967, Qinghai and Liu Xianquan''s letter held back by Xu Xiangqian); [[w.jian-zhou-enlai]], 589 ("At the plenum, Zhou delivered a speech about the Liu case on the party''s behalf"; no note, not the day). Made public: [[w.macfarquhar-maos-last-revolution]], 275–276 (2006). Circulated in China: Zhou Enlai''s speech, in [[w.zai-zhonggong-ba-jie]], 31–34 (a compilation of speeches at the Twelfth Plenum, 1969; cited by [[w.macfarquhar-maos-last-revolution]], 276 n.8). Check: whether this is the speech on the Liu case that [[w.jian-zhou-enlai]], 589, has Zhou give at the plenum for the Party. To check: Zhou Enlai''s speech, in [[w.zai-zhonggong-ba-jie]], 31–34 (cited by [[w.macfarquhar-maos-last-revolution]], 276 n.8); Zhou Enlai, on the question of some marshals, Oct. 1968, in the *Wenku* (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 709 n.45). Names: Zhou Enlai, Nie Rongzhen, Zhao Erlu, Xu Xiangqian, Ye Jianying, Luo Ruiqing, Chen Yi, Zhu De, Li Fuchun, Li Xiannian, Chen Yun, Mao Zedong, Zhang Guotao, Deng Zihui. Check: the day. Check: perhaps his speech to the plenum''s sixth group, Oct. 16, 1968, in the Zhou chronology, which names Tan Zhenlin, Li Xiannian, Li Fuchun, Xu Xiangqian and Nie Rongzhen.'
