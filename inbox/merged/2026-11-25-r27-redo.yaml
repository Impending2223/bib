      base: d2b61df7
      set:
        n: '[[w.macfarquhar-maos-last-revolution]], 136–137; [[w.mao-zedong-zhuan]], VI, ch. 75 n.17 (Oct. 16 Chen Boda''s long speech ''Two lines in the proletarian cultural revolution'', the conference''s main report: the struggle of the two lines goes on, the Sixteen Points corrected the earlier bourgeois line, but a wrong line may take other forms; some, a few, comrades think themselves old revolutionaries, are officials and gentry, forget their revolutionary history, and will not let the masses touch them; ''a handful'' of power-holders on the capitalist road and many muddled; printed with Mao''s approval; the day of the printing not given, n.17). [[w.yang-jisheng-tiandi-fanfu]], I, 300 (Oct. 16 Chen Boda gives for the Center the main report, 〈無產階級文化大革命中的兩條路線〉, later retitled "summing up two months of the movement"; Mao had told Chen his thoughts before; the report praises the movement of the preceding stretch and the masses'' rebellion, finds the situation excellent, analyzes the new forms of the bourgeois reactionary line, criticizes the beating of rebels as counter-revolutionaries and the "blood-line theory": "why must the children of high cadres hold the power? is their blood noble?"; asks the cadres to drop fear and let the masses go; criticizes sectarianism put in place of the class line); [[w.jian-zhou-enlai]], 553–554 (Chen Boda''s keynote, revised and approved by Mao: the two-line struggles of the Party''s history complicated and fierce; dispel fear, mobilize the masses, deepen the Cultural Revolution); [[w.dikotter-cultural-revolution]], 116 n.5 (Chen Boda names Liu Shaoqi and Deng Xiaoping the main targets, sets their "bourgeois reactionary line" against Mao''s line, and savages Tan Lifu''s bloodline couplet; the talk widely disseminated on Mao''s instructions); [[w.pu-weihua-zalan-jiu-shijie]], 215 (in his report Chen Boda names Tan Lifu''s views and criticizes him severely; afterward Chen Boda, Jiang Qing, Kang Sheng, Zhang Chunqiao, Yao Wenyuan, Wang Li, Guan Feng, Qi Benyu and Xie Fuzhi criticize him by name on various occasions). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 75 n.17). Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 140–142 (1987–98). Circulated in China: *Wuchanjieji wenhua dageming zhongde liangtiao luxian—Chen Boda 1966 nian 10 yue 16 ri zai zhongyang gongzuo huiyi shangde jianghua* (a printing of Chen Boda''s speech, 1966; cited by [[w.macfarquhar-maos-last-revolution]], 137 n.13). To check: [[w.zedong-jianguo-yilai-mao-zedong]], XII, 140–142 (cited by [[w.macfarquhar-maos-last-revolution]], 136 n.12); [[w.wuchanjieji-wenhua-dageming-zhongde]] (cited by [[w.macfarquhar-maos-last-revolution]], 137 n.13); Chen Boda 陈伯达, speech at the Central Work Conference 中央工作会议, "Two lines in the proletarian cultural revolution" 《无产阶级文化大革命中的两条路线》 (record 讲话记录), Oct. 16, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.17); Chen Boda 陈伯达, speech at the Central Work Conference 中央工作会议, "Two lines in the proletarian cultural revolution" 《无产阶级文化大革命中的两条路线》 (record 讲话记录), Oct. 16, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 300 n.t1); Chen Boda''s speech at the Central Work Conference, October 16, 1966, in [[w.song-yongyi-zhongguo-wenhua-dageming-wenku]] (cited by [[w.jian-zhou-enlai]], 554 n.44). See [[cal.1966-10-16.china-leadership-3]]. Names: Chen Boda, Mao Zedong. Check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition of [[w.mao-zedong-zhuan]], may print it earlier (2003).'
