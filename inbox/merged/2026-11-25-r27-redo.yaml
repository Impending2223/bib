      set:
        n: '[[w.macfarquhar-origins-of-the-cultural]], III, 436; [[w.teiwes-tragedy-of-lin-biao]], 190–191 (Lin''s long speech to the closing session, Oct. 20, the text the book cites at *Gaoju* 145–154: the "spiritual atom bomb"; to grab and hold political power, and to develop the people''s productivity; 60 to 80 percent of the time for military training; Mao''s Thought "the peak" said at the meeting). Made public: [[w.lin-biao-1959-nian]], 11 (1993; marking not seen). Circulated in China: [[w.gaoju-mao-zedong-sixiang]], 145–154 (a Red Guard compilation of leaders'' speeches, 1967; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.39b; [[w.teiwes-tragedy-of-lin-biao]], 191 n.51); Lin Biao, speech of 1960 to senior officers, in [[w.lin-biao-xuanji-untitled]], 102–19 (a Cultural Revolution collection of Lin Biao''s works; cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.39c). To check: [[w.lin-biao-1959-nian]], 11 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.39a); [[w.gaoju-mao-zedong-sixiang]], 145–154 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.39b; [[w.teiwes-tragedy-of-lin-biao]], 191 n.51); Lin Biao, speech of 1960 to senior officers, in [[w.lin-biao-xuanji-untitled]], 102–19 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 436 n.39c). Names: Lin Biao. Check: [[w.lin-biao-1959-nian]] may print it earlier (1993). Check: 内部发行 or a like marking in [[w.lin-biao-1959-nian]] (copyright page not seen; its catalogue record, CiNii NCID BN12880202, notes none).'
      kind: correct
