    base: '26663966'
    set:
      time_range:
      - 1962-10-25T02:00Z
      - 1962-10-25T04:00Z
      time_band: night
      time_zone: America/New_York
      range_basis: record
      c: 'Harriman, by telephone from Washington on Wednesday night, to Schlesinger in New York: Khrushchev wants help off the hook, and is sending signals, the letter
        to Bertrand Russell, the orders to Soviet ships to avoid confrontation, the evening with Jerome Hines; Eisenhower ignored such signals after the U-2. "If
        we do nothing but get tougher and tougher, we will force him into counter measures.... We must give him an out." He has not talked to Rusk, who never asks
        his advice outside the Far East. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 175–76. The words: "On Wednesday night" (175). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger,
        Khrushchev, Rusk, Eisenhower, Bertrand Russell.'
    kind: correct
