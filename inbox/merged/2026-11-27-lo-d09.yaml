      c: 'Robert Kennedy to Dobrynin, in his office at the Justice Department, 7:45 p.m.: the Jupiters to go, privately.{4} By Dobrynin''s report written then: the
        generals "spoiling for a fight"; the Jupiters out in four to five months, nothing said publicly; an answer by Sunday.{5}'
      n: '[FRUS 1961–63, XI, doc. 96](https://history.state.gov/historicaldocuments/frus1961-63v11/d96) (Robert Kennedy to Rusk, Oct. 30, 1962: "We met in my office";
        "no quid pro quo"). [[w.thomas-robert-kennedy]], 227–28 (7:45 p.m., his office at the Justice Department: no quid pro quo, the Jupiters out in four or five
        months); [[w.dobrynin-in-confidence]], 89–91 (the U-2 down; the generals "spoiling for a fight"; the Jupiters out in four to five months, nothing said publicly;
        an answer by Sunday; by Dobrynin''s report written that night); [[w.schlesinger-robert-kennedy-and-his]], 520–23 (at the Department of Justice, half an hour
        after the letter went off); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 222; [[w.poole-joint-chiefs-of-staff]], 181; [[w.fursenko-khrushchevs-cold-war]],
