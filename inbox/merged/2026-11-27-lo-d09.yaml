- edit:
    id: cal.1962-07-18.china-leadership
    base: 05225d9c
    set:
      c: 'Afternoon.{1} Mao to Yang Shangkun: whether to take the collective road or the individual one; and his dissatisfaction with the State Planning Commission
        and the Ministry of Commerce; "against dispersionism" again.{2} Yang''s diary that day: "I think the situation grave!! deeply uneasy."{3}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1962; [[w.yang-shangkun-riji]], II, 195–196 (July 18, 1962; at the swimming pool, to 6:30 p.m.); [[w.mao-zedong-zhuan]],
        V, ch. 70 nn.29, 30 (July 18, afternoon, at the pool: Mao to Yang Shangkun: the collective road or the individual one, and against dispersionism, the Planning
        Commission and the Ministry of Commerce; Yang''s diary: "the situation grave" (II, 196)). [[w.jian-zhou-enlai]], 468 (July 18: Mao to Yang Shangkun on collective
        or private farming; unhappy with the Planning Commission and the Commerce Ministry under Zhou); [[w.chen-yun-nianpu-xiuding]], III, 136 (Mao to Yang Shangkun:
        the collective road or the individual economy? Yang''s diary: "I feel the matter is very grave!! Most uneasy!"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]]
        (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II,
        195–196) stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Names: Mao Zedong, Zhou
        Enlai, Yang Shangkun.'
    kind: correct
- cite:
    id: cal.1962-07-18.china-leadership-6
    item: '[[w.yang-shangkun-riji]], II, 195–196 (July 18, 1962: after supper he rests until 9, then has Zhou Enlai come and talks of the points of the chairman''s
      talk: 晚饭后休息到9时，约恩来同志来谈主席谈话的要点)'
- cite:
    id: cal.1962-07-18.china-leadership-6
    item: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1962 (that evening Yang Shangkun reports Mao''s talk to Zhou Enlai)'
