    base: 7a4b0ff0
    set:
      c: Kennedy leaves Chicago with a "cold."{1} Airborne at 11 a.m.; at the White House at 1:30.{5}
      n: '[[w.salinger-with-kennedy]], 252 (airborne at 11 a.m.; at the White House at 1:30); [[w.sorensen-kennedy]], 692–93 (called back a little after 10 a.m.,
        Washington time; the helicopter on the South Lawn a little after 1:30, 693); [[w.odonnell-johnny-we-hardly-knew]], 364–65 (the President boards Air Force
        One that morning wearing a hat); [[w.obrien-no-final-victories]], 140–41 (the plane to Andrews, the helicopter, Kennedy silent, chin in hand); [[w.ball-past-has-another-pattern]],
        294 (he broke off campaigning in Chicago on the excuse of a bad cold and a fever and was back early that afternoon); [[w.fursenko-one-hell-of-a]], 234 (back
