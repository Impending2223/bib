- edit:
    id: cal.1962-07-18.middle-east
    base: ba6f1104
    set:
      c: Iran. The Shah accepts the resignation of Amini and his Cabinet and names Asadollah Alam Prime Minister.
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) n.1 ("On July 18, the Shah of Iran accepted the resignation
        of Amini and his Cabinet and appointed Asadollah Alam as Iran''s new Prime Minister"). See [[cal.1961-05-04.middle-east]]. Names: Amini, Alam, Pahlavi.'
      tags:
      - name:amini-ali
      - name:alam-assadollah
      - name:pahlavi-mohammed-reza
      place: tehran
    kind: correct
- add:
    entry:
      id: cal.1962-07-18.middle-east-2
      when: July 18
      date: '1962-07-18'
      place: washington
      thread: middle-east
      c: 'State''s press statement, after reports that Amini blames the lack of US support for his fall: the United States gave $67.3 million in grants and loans
        under Amini and committed $20 million more for a development loan.'
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) n.1 (Department of State telegram 50 to Tehran, July 18,
        which records the statement). See [[cal.1962-07-18.middle-east]]. Names: Amini. Check: the hour of the statement.'
      tags:
      - name:amini-ali
- add:
    entry:
      id: cal.1962-07-18.middle-east-3
      when: July 18
      date: '1962-07-18'
      place: washington
      thread: middle-east
      c: 'Komer to Kennedy: base policy on saving Amini, the only good Prime Minister Iran has had in years; Amini''s charges of too little US aid are wild; tell
        the Iranians to cover the budget gap with oil revenues and deficit financing, no new money until the budget is pared. The Shah''s refusal to back cuts in
        the military and civil budgets is the real cause. Sent to Bundy with a note: $87.3 million given or pledged to Amini, against a four-year average of $59.4
        million.'
      n: 'FRUS 1961–63, XVIII, doc. [5](https://history.state.gov/historicaldocuments/frus1961-63v18/d5) (July 18, 1962; "No indication has been found that the memorandum
        was forwarded to President Kennedy"). See [[cal.1962-07-18.middle-east]]. Names: Komer, Amini, Pahlavi, Bundy, Kennedy.'
      tags:
      - name:komer-robert-w
      - name:amini-ali
      - name:pahlavi-mohammed-reza
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-07-19.middle-east
      when: July 19
      date: '1962-07-19'
      place: washington
      thread: middle-east
      c: 'Komer to Bundy: "We have lost Amini," at least temporarily. The Alam cabinet, tantamount to direct rule by the Shah, will be even less able to cut the deficit
        of at least $110–120 million. Holmes and State: let the Iranians come to us first. Komer and Gaud: tell them again to cover the gap themselves; the Shah to
        cut the military budget back to last year''s level. Komer asks whether Kennedy will say so.'
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) (July 19, 1962). See [[cal.1962-07-18.middle-east]]. Names:
        Komer, Bundy, Amini, Alam, Pahlavi, Kennedy, Holmes, Gaud.'
      tags:
      - name:komer-robert-w
      - name:bundy-mcgeorge
      - name:amini-ali
      - name:alam-assadollah
      - name:pahlavi-mohammed-reza
      - name:kennedy-john-f
