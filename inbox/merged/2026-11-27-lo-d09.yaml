      c: Talbot telephones Kennedy with the figures of American aid to Amini's Iran.
      n: 'FRUS 1961–63, XVIII, doc. [5](https://history.state.gov/historicaldocuments/frus1961-63v18/d5), source note (Komer''s covering note to Bundy, July 18: "Talbot
        has already called JFK with aid figures"). See [[cal.1962-07-18.middle-east]]. Names: Talbot, Kennedy. Check: the day.'
      tags:
      - name:talbot-phillips
      - name:kennedy-john-f
      - name:amini-ali
- add:
    entry:
      id: cal.1962-07-16.middle-east
      when: July 16
      date: '1962-07-16'
      place: washington
      thread: middle-east
      c: 'Komer to Kennedy: whether Amini has resigned is not yet known, but Iran faces a major financial crisis; Amini cannot balance the budget, the military budget
        being the Shah''s. Iran to dig itself out: cut the budget, cover the rest by deficit financing and oil revenues diverted from development; no repeat of last
        year''s $15 million budget support. Press the Shah to keep Amini and cut the military budget.'
      n: 'FRUS 1961–63, XVIII, doc. [4](https://history.state.gov/historicaldocuments/frus1961-63v18/d4) (July 16, 1962). See [[cal.1962-07-04.middle-east]]. Names:
        Komer, Kennedy, Amini, Pahlavi.'
      tags:
      - name:komer-robert-w
      - name:kennedy-john-f
      - name:amini-ali
      - name:pahlavi-mohammed-reza
