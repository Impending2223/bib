- edit:
    id: cal.1962-11-28.governors-mn-recount
    base: 3a5d60a0
    set:
      when: Nov. 28
      c: The Minnesota Supreme Court, hearing the petitions of Andersen and Rolvaag on Nov. 28, orders the State Canvassing Board to reassemble and count the amended
        returns of ten counties.
      n: '*Rolvaag v. Donovan*, [264 Minn. 257](https://static.case.law/minn/264/case-pdfs/0257-01.pdf), 119 N.W.2d 1 (1962) (heard Nov. 28; the order "made and filed"
        the same sitting, day not stated in the opinion; opinion filed Dec. 11). Check: the day of the order: the opinion has the hearing on Nov. 28 and the order
        made and filed with no day; the Board''s declaration of Nov. 29 calls it "the order of the Supreme Court dated November 29, 1962" ([*Report of the State Canvassing
        Board, General Election, November 6, 1962*](https://www.lrl.mn.gov/docs/2023/Other/232070/1962.pdf)). See [[cal.1962-11-06.governors-mn]]. Names: Andersen,
        Rolvaag.'
    kind: correct
- add:
