      time_zone: Europe/Budapest
      range_basis: record
      c: 'Budapest. A telegram arrives in the lunch interval, with instructions to use the closing reception to rebut critics on three points: that the worsening
        of relations between the CPSU and the CCP and the Albanians is attributable to Moscow, that the anti-China chorus is directed by the CPSU, and that party
        congresses should promote unity, not split. It includes an official Chinese statement to be read out.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 319–20 ("a telegram arrived in the lunch interval"). Made public: 1991. To check: [[w.xiuquan-huiyi-yu-huainian]],
        349–52 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 320 n.119). Check: the hour of the telegram, and the day it was sent from Peking; the calendar''s
        entry for the Peking meeting on the delegation''s cable ([[cal.1962-11.china-leadership]]) is dated after Nov. 21. See [[cal.1962-11-24.china-leadership]].
        Names: Wu Xiuquan.'
