      place: minnesota
      thread: governors-mn-recount
      c: 'The State Canvassing Board, in final session pursuant to the Supreme Court''s order, counts the amended returns from ten counties and declares Andersen
        elected Governor: Andersen 619,722, Rolvaag 619,580, Braatz 7,234.'
      n: '[*Report of the State Canvassing Board, General Election, November 6, 1962*](https://www.lrl.mn.gov/docs/2023/Other/232070/1962.pdf) (Preface; the declaration
        of Nov. 29, 1962, signed by all five members). *Rolvaag v. Donovan*, [264 Minn. 257](https://static.case.law/minn/264/case-pdfs/0257-01.pdf), 119 N.W.2d 1
        (1962) (the order). See [[cal.1962-11-06.governors-mn]]; [[cal.1962-11-28.governors-mn-recount]]. Names: Andersen, Rolvaag.'
      tags:
      - state:mn
      - name:andersen-elmer-l
