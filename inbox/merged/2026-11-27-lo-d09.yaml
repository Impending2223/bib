      place: washington
      thread: middle-east
      c: 'State, telegram 33 to Tehran, concurs with Ambassador Holmes: the United States to go on supporting Amini.'
      n: 'FRUS 1961–63, XVIII, doc. [4](https://history.state.gov/historicaldocuments/frus1961-63v18/d4) n.1 (telegram 33 to Tehran, July 13; Department of State,
        Central Files, 888.10/7–1162). See [[cal.1962-07-04.middle-east]]. Names: Amini.'
      tags:
      - name:amini-ali
- edit:
    id: cal.1962-07-20.economy
    base: d72baf4d
    set:
      c: Giscard d'Estaing with Kennedy, 10 a.m.; no record of the conversation found. Giscard says afterward that he told the President the French gold purchase
        was to raise the gold ratio of France's reserves from 65 to 70 percent and that Kennedy understood it as a contribution to stabilizing the US balance of payments.{1}
      n: 'FRUS 1961–63, XIII, doc. [258](https://history.state.gov/historicaldocuments/frus1961-63v13/d258) n.1 (Giscard "talked with the President at 10 a.m." by
        the President''s Appointment Book, Kennedy Library; "no other record of the conversation has been found") and text (Giscard to Ball that evening, of "their
        talk this morning"). [[w.gavin-gold-dollars-and-power]], 78 ("On 20 and 21 July 1962, Giscard met first with Kennedy"). To check: Ball to Kennedy, "Visit
        of French Finance Minister," July 18, 1962, National Security Files, Kennedy Library (cited by [[w.gavin-gold-dollars-and-power]], 78 n.70). Names: Giscard
        d''Estaing, Kennedy.'
      time_zone: America/New_York
      src:
        c: f5c194ed
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d258: 1'
        - 'w.gavin-gold-dollars-and-power 78: 1'
        - 'via w.gavin-gold-dollars-and-power 78 n.70: 1'
      tags:
      - name:giscard-destaing-valery
      - name:kennedy-john-f
    kind: correct
- add:
    entry:
      id: cal.1962-07-20.economy-3
      when: July 20
      date: '1962-07-20'
      time_range:
      - 1962-07-20T22:00Z
      - 1962-07-20T22:50Z
      time_zone: America/New_York
      range_basis: record
      place: washington
      thread: economy
      also:
      - europe-and-the-alliance-france
      follows:
      - cal.1962-07-20.economy
      c: 'Giscard d''Estaing with Acting Secretary Ball at State, 6 to 6:50 p.m. Giscard: no unilateral change in the dollar''s parity; a secret approach among the
        United States, Britain, France, Germany and Italy under cover of the OECD, the creditors to abstain from buying gold and to hold their dollars for a time.
        Ball: minimum gold reserves, and a ratio of gold to dollars above them.'
      n: 'FRUS 1961–63, XIII, doc. [258](https://history.state.gov/historicaldocuments/frus1961-63v13/d258) (memorandum of conversation, Washington, July 20, 1962,
        6–6:50 p.m.). [[w.gavin-gold-dollars-and-power]], 78–80 (Giscard with Ball, Bundy and Tobin after Kennedy; Ball on a ratio of gold to dollar holdings; Giscard:
        no unilateral action, the creditors to hold their dollars for a time). To check: memorandum of conversation (luncheon), July 21, 1962 (cited by [[w.gavin-gold-dollars-and-power]],
        79 n.71). Check: Gavin''s meeting with Ball, Bundy and Tobin may be the luncheon of July 21 (79 n.71). See [[cal.1962-07-20.economy]]. Names: Giscard d''Estaing,
        Ball.'
      tags:
      - name:giscard-destaing-valery
      - name:ball-george-w
