- edit:
    id: cal.1962-11-21.laos
    base: bff06dd0
    set:
      n: '[[w.fursenko-one-hell-of-a]], 323; [[w.fursenko-khrushchevs-cold-war]], 504–05 ("We will not do it!"; "Peace has been made without winners and losers";
        "We did everything we could"); [[w.prezidium-tsk-kpss-1954]], I, 646 (Protocol 68, item II, Nov. 21, 1962, Malin''s notes, "On instructions to the Soviet
        ambassador in Laos," Khrushchev: "Не будем делать: летать, поставлять секретным порядком оружие" (we will not fly or supply arms secretly); "Главное мир.
        Мир заключен без побежденных и победителей"; "Если хотите вести войну это ваше внутреннее дело"; the Pathet Lao "shows no flexibility"). Check: the protocol
        (I, 646) and its note (I, 1115 n.2) give the ambassador''s instructions and the coalition government''s request for economic aid, not a Pathet Lao request
        for arms. Names: Khrushchev.'
