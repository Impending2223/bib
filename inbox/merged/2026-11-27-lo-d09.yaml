      n: 'FRUS 1961–63, XVIII, doc. [4](https://history.state.gov/historicaldocuments/frus1961-63v18/d4) n.1 (telegram 15 from Tehran, July 4; Department of State,
        Central Files, 888.10/7–462). See [[cal.1961-05-04.middle-east]]. Names: Amini.'
      tags:
      - name:amini-ali
