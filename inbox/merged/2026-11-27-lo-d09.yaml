- edit:
    id: cal.1962-11-19.china
    base: 992dd368
    set:
      c: Zhongnanhai.{1} At 4:30 p.m. Mao Zedong calls Zhou Enlai and others to Juxiang Shuwu 菊香书屋 to study how to promote peace talks with India, the second meeting
        of the day; Zhou comes half an hour after Mao's note and tells him this is something new.{2}
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 19, 1962 (下午四时, Mao''s note; 四时半，在中南海菊香书屋召集周恩来等开会，研究促进中印和平谈判问题: at 4:30 p.m., a meeting at Juxiang Shuwu on promoting
        Sino-Indian peace talks; after it Zhou Enlai and Chen Yi see India''s chargé). [[w.jian-zhou-enlai]], 482 (Nov. 18: Zhou "rushed to Mao''s residence half
        an hour later," and told him this was something new); [[w.zhou-enlai-nianpu-1949]], II, 513 (Nov. 19, 1962: after two meetings at Mao''s and a talk with the
        Foreign Ministry''s people, Zhou and Chen Yi receive Banerjee); [[w.mao-zedong-zhuan]], V, ch. 71 (Nov. 19: Mao twice calls Zhou Enlai and others to meetings
        at his residence at Zhongnanhai; Zhou and Chen Yi then receive the Indian chargé Banerjee). Made public: Check (2011 at the latest). Check: Made public: the
