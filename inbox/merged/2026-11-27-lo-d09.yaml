      c: 'Bundy tells Kennedy at breakfast.{1} About 8 a.m., Kennedy, still in his pajamas: "He can''t do this to me!"{4}'
      n: 'FRUS 1961–63, XI, [doc. 16](https://history.state.gov/historicaldocuments/frus1961-63v11/d16) (editorial note: Bundy told the evening before, the President
        in the morning). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 204–06 (Bundy at 8:45 a.m., 204); [[w.fursenko-one-hell-of-a]], 222–27 (Kennedy reading the Tuesday
        morning papers in bed when Bundy tells him, 222); [[w.rusk-as-i-saw-it-1990]], 230–31 (briefed when he awoke); [[w.sorensen-kennedy]], 673–78 (about 9 a.m.,
        in his bedroom, over the morning papers; Bundy''s memorandum "for your memoirs", 673); [[w.preston-war-council]], 65–66 (the day Bundy told Kennedy; Bundy
        for the strike); [[w.fursenko-khrushchevs-cold-war]], 465–66 (Bundy with the photographs; the first options); [[w.thomas-robert-kennedy]], 209 (Bundy to the
        President about 8 a.m., the President in his pajamas: "He can''t do this to me!"); [[w.taylor-swords-and-plowshares]], 265–66 (Bundy had already shown him
        the photographs before the 11:45 meeting). [[w.schlesinger-thousand-days-1965]], 794–808 (at breakfast, in his dressing gown, at 8:45, 801). [[w.reeves-president-kennedy]],
        368–77 (8:45 a.m., on the edge of his bed, 368). Check: the hour: Kaplan (204), Reeves (368) and Schlesinger (*A Thousand Days*, 801) have 8:45 a.m.; Thomas
        (209) about 8; Sorensen (*Kennedy*, 673) about 9. See [[cal.1962-05-24.missile-crisis]]. Names: Bundy, Kennedy.'
