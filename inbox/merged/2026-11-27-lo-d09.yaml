      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) n.1 (telegram 78 from Tehran, July 18; Department of State,
        Central Files, 888.10/7–1862). See [[cal.1962-07-18.middle-east]]. Names: Amini.'
      tags:
      - name:amini-ali
