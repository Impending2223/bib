      n: '[[w.salinger-with-kennedy]], 259. After [[cal.1962-10-21.missile-crisis-12|the talk on Mass]] and the meeting called "within the hour," in Salinger''s sequence
        (258–59). The meeting is the 506th of the National Security Council, 2:30 to 4:50 p.m. ([FRUS 1961–63, XI, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v11/d38)):
        its minutes hold what Salinger lists, the invitation to a summit struck from the draft of the speech, Acheson, Dowling and Bruce to brief de Gaulle and the
        NATO Council, Adenauer and Macmillan, and Wilson''s plan for the Cuban people, with Stevenson and Wilson present. Salinger places the meeting "that morning"
        (259) in the Cabinet Room, and has himself home at 4 p.m. (260); the FRUS notes of the Oval Room meeting of 11:30 a.m. to 12:30 p.m. (doc. 36) are of the
        military plans. The instructions came "immediately following the meeting," so about 4:50 p.m. See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Salinger,
        O''Brien.'
      time: 1962-10-21T20:50Z
      time_approx: true
      time_zone: America/New_York
