- edit:
    id: cal.1961-06-03.berlin-and-vienna-3
    base: 14aa7eb0
    set:
      n: '[[w.odonnell-johnny-we-hardly-knew]], 335 (O''Donnell''s and Powers''s account). After [[cal.1961-06-03.berlin-and-vienna|the first talk]]: the leaders talk for an hour in the embassy and then come in to lunch ([[w.salinger-with-kennedy]], 177–78; [[w.odonnell-johnny-we-hardly-knew]], 333–35). Names: Kennedy, Khrushchev.'
- edit:
    id: cal.1961-06-13.china-leadership-5
    base: c5394773
    set:
      n: '[[w.zhou-enlai-waijiao-huodong]], 313 (June 13, 1961; 晚上); [[w.peng-zhen-nianpu-1902]], IV, 134 (June 13, 1961, evening; Peng Zhen at Liu Shaoqi''s banquet welcoming Sukarno and his party). After [[cal.1961-06-13.china-leadership|Mao''s reception of Sukarno]]: the reception at 下午6时20分, the banquet 晚上 ([[w.zhou-enlai-waijiao-huodong]], 313). Names: Zhou Enlai, Liu Shaoqi, Sukarno.'
- edit:
    id: cal.1961-06-16.china-leadership-6
    base: fdd1d72f
    set:
      n: '[[w.yang-shangkun-riji]], II, 42 (June 16, 1961). The words: 下午 (II, 42). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). After [[cal.1961-06-16.china-leadership-5|Zeng San and Deng Diantao]]: 下午曾三、邓典桃，然后是富春同志来谈话 ([[w.yang-shangkun-riji]], II, 42). Names: Li Fuchun, Yang Shangkun.'
