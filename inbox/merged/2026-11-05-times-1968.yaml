      n: 'Talking Points of the President at a Luncheon for the National Alliance of Businessmen, [1968–69 Pub.
        Papers 78](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=156) (Jan. 27,
        1968). FRUS 1964–68, VI, doc. [29](https://history.state.gov/historicaldocuments/frus1964-68v06/d29). [[w.califano-triumph-and-tragedy-of]],
        225–26 (Saturday, the living quarters, fifteen executives; "This is no bullshit meeting"; "make taxpayers
        out of these taxeaters"; McDonnell: "I commit!"; "you committed when you ate the first bite of my steak";
        100,000 at work by Dec. 1, 1968). Check: the Papers'' note has the luncheon at 2 p.m.; FRUS''s editorial
        note, 1:25 p.m. See [[cal.1968-01-23.jobs-and-wages]]. Names: Johnson.'
