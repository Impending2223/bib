    id: cal.1968-03-30.vietnam-205000-3
    base: b4bb61bb
    set:
      time: 1968-03-30T17:15Z
      n: 'The President''s News Conference of March 30, 1968, [1968–69 Pub. Papers 462](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=540)
        (Mar. 30, 1968) (the hour). [[w.shesol-mutual-contempt]], 435. Check: the Public Papers'' item. Check: Kotz
        quotes Johnson''s answer on the Poor People''s march, in light of Memphis: "I would hope, if there is a
        march, that it will be in keeping with the law ... and that no violence will flow from it" (405). Check:
        the Papers'' note has 12:15 p.m., not noon. To check: [*New York Times*, Mar. 31, 1968](https://timesmachine.nytimes.com/timesmachine/1968/03/31/issue.html),
        1, 38 (cited by [[w.shesol-mutual-contempt]], 435). Names: Johnson.'
