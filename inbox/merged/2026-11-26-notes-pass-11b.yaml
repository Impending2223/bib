# cal.1962-05-07: Yang Jisheng's characterization is later commentary (R19b): moved to the gloss by the audit
- edit:
    id: cal.1962-05-07.china-leadership
    base: 0581cf76
    set:
      gloss:
        title: Commentary
        text:
        - 'Yang Jisheng (2016): the Xilou and May meetings follow Liu Shaoqi''s line of "retreat enough" and, on Chen Yun''s views, take the more thorough measures, "extraordinary measures for an extraordinary time" ([[w.yang-jisheng-mubei]], II, 1175).'
- add-words:
    id: cal.1962-05-07.china-leadership
    after: 'Peking.'
    words: The Huairen Tang 怀仁堂.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1836'
# Deng's two central tasks are his speech of May 11 (cal.1962-05-11.china-leadership-3): moved there by the audit
- add-words:
    id: cal.1962-05-11.china-leadership-3
    after: end
    words: 'Two central tasks: 20 million fewer townspeople, and better work in the production teams.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1704'
- cite:
    id: cal.1962-05-11.china-leadership-3
    item: '[[w.chen-yun-nianpu-xiuding]], III, 133'
    on: 'Two central tasks: … production teams.'
- add-words:
    id: cal.1962-05-11.china-leadership
    after: end
    words: 'By Yang''s notes of the speech, from 3:30 p.m.: cutting 20 million is like moving a country; the Seven Thousand conference''s long-range targets cannot stand; the summer harvest is poor; imports are to be held within 700 million dollars; staff are to be cut by 10 to 10.7 million and the towns by 10 million, mostly within a year.'
    item: '[[w.yang-shangkun-riji]], II, 169–171'
