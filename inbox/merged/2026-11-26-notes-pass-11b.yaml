- add-words:
    id: cal.1962-05-24.china-leadership-3
    after: end
    words: The Finance Group's plan lowers 1962's gross industrial and farm output from 140 billion yuan to 130 billion.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 291 n.1'
# Zhou's letter of May 19 is the act of cal.1962-05-19.china-leadership: moved there by the audit
- add-words:
    id: cal.1962-05-19.china-leadership
    after: end
    words: Zhou's covering letter, by Li Fuchun, asks that Li Fuchun, then at Shanghai, report to Mao at Hangzhou; if Mao has no time, he is to read the directive first, and Tian Jiaying or Lin Ke to give him the report's gist.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 292 n.2'
- names:
    id: cal.1962-05-19.china-leadership
    add:
    - Li Fuchun
    - Tian Jiaying
    - Lin Ke
    tags:
    - name:li-fuchun
    - name:tian-jiaying
    - name:lin-ke
- add-words:
    id: cal.1962-06-20.china-leadership-3
    after: end
    words: 'Luo Ruiqing and Chen Yi report on the Taiwan authorities'' plan for a "counterattack on the mainland." Deng: whatever comes is met in kind, big with big, middle with middle, small with small, none with none; the time to educate and rouse the people; "this episode does us good."'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1711'
- names:
    id: cal.1962-06-20.china-leadership-3
    add:
    - Luo Ruiqing
    - Chen Yi
    tags:
    - name:luo-ruiqing
    - name:chen-yi
- add-words:
    id: cal.1962-07-07.china-leadership-3
    after: end
    words: 'By the Chen Yun nianpu, some days after Chen Yun''s talk Mao tells a small meeting he very much disagrees with Chen Yun''s view, but that Chen Yun, a Standing Committee member, did no organizational wrong in putting it to the Party''s Chairman. Mao criticizes Deng Zihui and Tian Jiaying: their "dividing the fields to go it alone" breaks up the collective economy.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 135–136'
- names:
    id: cal.1962-07-07.china-leadership-3
    add:
    - Deng Zihui
    - Tian Jiaying
    tags:
    - name:deng-zihui
    - name:tian-jiaying
- add-words:
    id: cal.1962-08-02.china-leadership-2
    after: end
    words: 'His note: "print for the comrades."'
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 331'
- add-words:
    id: cal.1962-08-02.china-leadership-2
    after: end
    words: The comrades, by the editors, are those to attend the Central Work Conference at Beidaihe, Aug. 6–24.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 331 n.1'
- add-words:
    id: cal.1962-08-02.china-leadership-2
    after: end
    words: The letter recommends the responsibility field, output fixed to the plot and duty to the person; in Taihu's Qiaoxi brigade grain rose 81 percent in 1961 over 1960; at least 80 percent of the peasants, perhaps over 90, back it.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 331–332 n.2'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: 'Liu says the May conference overrated single farming at 20 percent; nationwide it is 10 percent at most. Mao is harsh with Deng Zihui and raises the old account of cutting 200,000 co-ops. Mao adds a contradiction: copying from abroad against self-reliance.'
    item: '[[w.mao-zedong-zhuan]], V, ch. 70 n.45'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: 'Deng Xiaoping: educating cadres is a great matter, and building the Party''s leading core; some cores have problems.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1721'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 210'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: Mao names Tian Jiaying for criticism, who would have 40 percent collective and 60 percent household contracting.
    item: '[[w.mao-zedong-zhuan]], V, ch. 70 n.44'
