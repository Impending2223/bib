      thread: cuba
      c: 'Kent, of the Board of National Estimates, to Dulles, "The Situation and Prospects in Cuba": the regime with enough popular support and repression to cope with any internal threat likely in the foreseeable future; economic difficulties serious, not insurmountable. The bloc''s credits for industrial development some $357 million.'
