      c: 'Bundy, "The Defense of Berlin if Cuba is Blockaded": a Soviet blockade of Berlin would "inevitably stir feeling among all Europeans that this crisis was in some measure the fault of the Americans"; Berlin''s morale to crack without more military effort and readiness "to confront Khrushchev at a very early stage with a bluntly nuclear choice." In stalemate the weapons stay in Cuba and Castro in place.'
