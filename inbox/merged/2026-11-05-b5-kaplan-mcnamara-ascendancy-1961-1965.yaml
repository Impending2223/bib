    set:
      c: 'State of the Union. A tax cut of $13.5 billion, $10 billion net of reforms, over three years: individual rates 14 to 65 percent, from 20 to 91; corporate 47, from 52. Youth, a domestic service corps, education, hospital insurance through Social Security, counsel for poor defendants in federal courts, the vote. Abroad: "The spearpoint of aggression has been blunted in Viet-Nam"; a settlement in Laos "still precarious."'
      n: 'Annual Message to the Congress on the State of the Union, [1963 Pub. Papers 11](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=69) (Jan. 14, 1963). [109 Cong. Rec.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt1/pdf/GPO-CRECB-1963-pt1-3-1.pdf) (1963). [[w.sorensen-kennedy]], 427, 429–30 (the tax cut); [[w.sundquist-politics-and-policy]], 46, 134 (the tax cut in stages, with reform, 46; the youth corps at the head of the program, 134; not the figures); [[w.fursenko-khrushchevs-cold-war]], 508–09 ("leaving fear astern"; "A moment of pause is not a promise of peace"); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 282 (Vietnam). To check: [[w.bernstein-promises-kept]]; [[w.giglio-presidency-of-john-f]]. See [[cal.1962-01-11.program]]. Check: the page.'
      also:
      - economy
      - vietnam
