      id: cal.1961-03-30.berlin-and-vienna
      when: Mar. 30
      date: '1961-03-30'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'McGhee sends Bundy State''s paper "The Problem of Berlin": an arrangement allowing East Germany a limited role in controlling access without sacrificing the West''s basic position, preceded by a strong warning that aggression would bring mobilization on the scale of Korea, 1950. Detailed contingency planning difficult: the governments, the British above all, "reluctant to commit themselves to rigid courses of action on a purely hypothetical basis."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 147–48. To check: McGhee to Bundy, with attachment, "The Problem of Berlin," Mar. 30, 1961, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 148 n.19). Names: McGhee, Bundy.'
      src:
        c: b4c79577
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 147–48: all'
        - 'via x.1961-03-30.mcghee-to-bundy-problem-of-berlin: all'
      tags:
      - name:mcghee-george-c
      - name:bundy-mcgeorge
    section: '196103'
