      id: cal.1962-08-24.defense-2
      when: Aug. 24
      date: '1962-08-24'
      thread: defense
      also:
      - europe-and-the-alliance
      c: 'McNamara with Hitch and Harold Brown on Skybolt, after their memorandum on its technical and financial course: Hitch proposes, McNamara agrees, to wait until the fall and then drop it from the fiscal 1964 budget. Their memorandum''s "The British Consideration": British reaction hard to predict. ISA''s paper: the United Kingdom would feel "let down."'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 379. To check: Brown to McNamara, Aug. 21, 1962, with attachments, McNamara Records, RG 200 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 379 n.78); Neustadt, *Report to JFK*, 30–31 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 379 n.78). Names: McNamara, Hitch, Brown.'
      src:
        c: 3d85628d
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 379: all'
        - 'via x.1962-08-21.brown-to-mcnamara-skybolt: A-C'
      tags:
      - name:mcnamara-robert-s
      - name:hitch-charles-j
      - name:brown-harold
    section: '196208'
