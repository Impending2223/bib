- add:
    entry:
      id: cal.1964-03-20.defense
      when: Mar. 20
      date: '1964-03-20'
      thread: defense
      c: 'Johnson signs the fiscal 1965 procurement and research authorization, [78 Stat. 167](https://www.govinfo.gov/content/pkg/STATUTE-78/pdf/STATUTE-78-Pg167-2.pdf): almost $17 billion, "the largest separate fund authorization ever enacted." A tribute to Vinson, fifty years in Congress: "No man in the history of this republic knows more about the posture of our defense, and no man has done more to improve it."'
      n: 'Remarks Upon Signing Bill Authorizing Appropriations for Defense Procurement and for Research and Development, [1963–64 Pub. Papers 402](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=486) (Mar. 20, 1964). Statute (K–J Cong. II.J.2). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 486 (the signing; the tribute). Names: Johnson, Vinson.'
      src:
        c: 73ff73e8
        rows:
