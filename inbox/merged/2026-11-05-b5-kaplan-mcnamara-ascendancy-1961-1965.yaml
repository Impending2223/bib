      thread: cuba
      c: 'Hurwitch, State''s officer for Mongoose, to Martin, on the combined report on Phase I: the CIA believes that with assurance of intervention a revolt could be mounted by late 1963, destroyed within days without substantial military force; Defense needs eighteen, perhaps twelve, days'' preparation, some units five; State needs "a virtual civil war situation" first. "These three conditions do not appear to be easily reconciled."'
      n: 'Memorandum From the Deputy Director of the Office of Caribbean and Mexican Affairs (Hurwitch) to the Assistant Secretary of State for Inter-American Affairs (Martin), [FRUS 1961–63, X: Cuba, January 1961–September 1962, doc. 361](https://history.state.gov/historicaldocuments/frus1961-63v10/d361) (July 26, 1962). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 199. Names: Martin.'
