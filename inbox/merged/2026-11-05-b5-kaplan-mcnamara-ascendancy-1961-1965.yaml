      - defense
      c: 'Rusk to McNamara: any talk with the British of alternatives to Skybolt to mention three, a British Skybolt program, Hound Dog, or a sea-based MRBM force "under multilateral manning and ownership." "No possibility of our helping them set up a nationally manned and owned MRBM force."'
