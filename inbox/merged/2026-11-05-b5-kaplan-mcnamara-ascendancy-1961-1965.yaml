      when: Mar. 13
      date: '1961-03-13'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance
      c: 'Brandt with Kennedy, 3 to 3:40 p.m., Kohler there. Brandt: watch the Soviet Party Congress in October; a separate treaty more likely than a military confrontation; six months'' stocks of fuel and food in West Berlin; the city a window to the West for East Germany. Kennedy: of the legacies of the war Berlin the most difficult, "we would just have to live with the situation."'
      n: 'Memorandum of Conversation, [FRUS 1961–63, XIV: Berlin Crisis, 1961–1962, doc. 10](https://history.state.gov/historicaldocuments/frus1961-63v14/d10) (Mar. 13, 1961). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 146 (the meeting; the pledge to West Berlin repeated). Names: Brandt, Kennedy, Kohler.'
      src:
        c: fefb953c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d10: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 146: A'
        - 'via x.1961-03-13.memcon-kennedy-and-brandt: all'
      tags:
      - name:brandt-willy
      - name:kennedy-john-f
      - name:kohler-foy-d
