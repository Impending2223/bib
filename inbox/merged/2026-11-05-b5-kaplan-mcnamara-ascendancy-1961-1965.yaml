- add:
    entry:
      id: cal.1961-09-29.berlin-and-vienna
      when: Sept. 29
      date: '1961-09-29'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'ISA''s "Estimate of the Situation #2," the poodle blanket: Allied measures in four phases by the degree of Soviet provocation. Platoon probes on the ground and fighter escort in the air; then economic embargo, maritime harassment, UN action, NATO''s mobilization; then a naval blockade or non-nuclear air and ground action in division strength or more into East Germany; lastly nuclear weapons, selective demonstration first, through tactical weapons to general war.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 163. To check: ISA, "Estimate of the Situation #2," Sept. 29, 1961, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 163 n.85). See [[cal.1961-10-23.berlin-and-vienna-2]].'
      src:
        c: 8e462e23
        rows:
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 163: all'
        - 'via x.1961-09-29.isa-estimate-of-the-situation-2: all'
    section: '196109'
