      when: Aug. 11
      date: '1961-08-11'
      thread: berlin-and-vienna
      c: 'Khrushchev in Moscow, in public, what he had told McCloy in private: if the West makes war over a separate peace treaty, the Soviets will strike at NATO''s bases wherever they are.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 154. To check: Khrushchev''s address, Moscow, Aug. 11, 1961, *Current Digest of the Soviet Press*, Sept. 6, 1961, 9–12 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 154 n.50). See [[cal.1961-07-26.berlin-and-vienna]]. Names: Khrushchev, McCloy.'
