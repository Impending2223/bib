      id: cal.1961-07-29.berlin-and-vienna
      when: July 29–30
      date: '1961-07-29'
      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance
      c: Acheson with Strauss, the West German Defense Minister, the weekend at Nitze's home in southern Maryland. Strauss for economic sanctions or closing the Baltic or the Black Sea, unhappy at what would follow if they failed; after midnight, rather than conventional war on German soil, evacuate West Berlin. In the morning he disavows it.
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 155–56. To check: Acheson''s notes of the conversation with Strauss, Aug. 1, 1961, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 156 n.56). Names: Acheson, Strauss, Nitze.'
