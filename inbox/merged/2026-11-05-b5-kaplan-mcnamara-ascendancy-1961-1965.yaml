      when: Nov. 8
      date: '1964-11-08'
      thread: europe-and-the-alliance
      c: 'Bundy to Johnson, "NATO Nuclear Policy": the MLF "Presidential business," every activity reported to the White House and cleared as it requires; all negotiators and travelers with written instructions cleared by State, Defense and the White House; a detailed position before Wilson''s visit. State''s emissaries "hard and dogmatic," Defense''s "merchandisers or military skeptics."'
