      date: '1961-04-03'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'ISA''s policy planning staff against State''s paper: it "does not deal with the situation which would arise if the Soviets increased pressures"; "a pessimistic, defeatist tone"; an impression of "a readiness to make concessions which ISA should oppose." A more positive view of the contingency measures.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 148. To check: Polk to the Deputy Assistant Secretary (ISA), Apr. 3, 1961; Wade to the Assistant Secretary of State (Regional Affairs), Mar. 30, 1961, ISA files, Acc 64A-2382 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 148 n.20). Check: the day; the note cites papers of Mar. 30 and Apr. 3. See [[cal.1961-03-30.berlin-and-vienna]].'
      src:
        c: 18621c09
        rows:
