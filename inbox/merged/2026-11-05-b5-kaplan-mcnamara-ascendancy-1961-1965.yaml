- edit:
    id: cal.1961-01-25.cuba
    base: 3f15f008
    set:
      c: 'Kennedy asks the Joint Chiefs what should be done about Cuba. Lemnitzer: the plans were for clandestine operations; with the arms from Czechoslovakia, the clandestine forces not strong enough. Lemnitzer: a government in exile, then troops ashore and guerrilla groups at work; "At that point we would come in and support them." Laos, first on the Chiefs'' list: Thompson''s cable doubting a military solution; Lemnitzer, the support of indigenous forces, not major American forces. Kennedy: American troops "the last step to be employed."'
      n: '[FRUS 1961–63, X, doc. 26](https://history.state.gov/historicaldocuments/frus1961-63v10/d26) (Goodpaster). Laos: Memorandum of Conference With President Kennedy, [FRUS 1961–63, XXIV: Laos Crisis, doc. 12](https://history.state.gov/historicaldocuments/frus1961-63v24/d12) (Jan. 25, 1961, 10:15 a.m.). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 49 (Lemnitzer''s view); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 176; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 233 (Laos). To check: Burke, oral history, 21–22, Kennedy Library (cited by [[w.jones-bay-of-pigs]], 49 n.10). See [[cal.1960-03-17.cuba]]. Names: Kennedy, Lemnitzer, Thompson.'
      also:
      - laos
      tags:
      - name:kennedy-john-f
      - name:lemnitzer-lyman-l
      - name:thompson-llewellyn-e
