      thread: berlin-and-vienna
      also:
      - europe-and-the-alliance
      c: 'Kennedy and Adenauer''s joint statement, after two days'' talks: only self-determination a just solution for Germany including Berlin; their pledge renewed to preserve the freedom of West Berlin pending reunification; NATO the keystone of the common defense.'
      n: 'Joint Statement and Remarks Following Discussions With Chancellor Adenauer of Germany, [1961 Pub. Papers 265](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=323) (Apr. 13, 1961). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 146 (the pledge to West Berlin). See [[cal.1961-04-13.european-community]]. Names: Kennedy, Adenauer.'
