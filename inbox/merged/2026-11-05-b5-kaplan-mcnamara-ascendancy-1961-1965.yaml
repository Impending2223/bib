      c: 'Bundy to the President: signs of compromise among the planners, "toward acceptance of the GDR, the Oder-Neisse line, a non-aggression pact, and even the idea of two peace treaties." No Soviet gesture to meet them.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 160 (by Bundy''s later account). To check: [[w.bundy-danger-and-survival]], 384–85 (cited by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 160 n.73). Names: Bundy, Kennedy.'
