- add:
    entry:
      id: cal.1964-06-05.vietnam-4
      when: June 5
      date: '1964-06-05'
      thread: vietnam
      c: McNamara's "South Vietnam Action Program" for the President, for a meeting at 6 p.m. In the eight critical provinces more Vietnamese troops under the province chiefs, police, radios, 434 more American advisers. Little effect in three to six months; a congressional resolution to be considered about mid-July; plans for a strike against the North kept up, a strike unlikely to be desirable within three to six months. Attached, a list of military moves, from reconnaissance to a Marine division to Okinawa.
      n: 'Paper prepared for the President by the Secretary of Defense, [FRUS 1964–68, I: Vietnam, 1964, doc. 201](https://history.state.gov/historicaldocuments/frus1964-68v01/d201) (June 5, 1964); the President with Rusk, Bundy and McNamara, 6:52 to 7:43 p.m. (doc. 201 n.1, the Daily Diary; no record found). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 517 (the program; plans for a strike). Names: McNamara, Johnson.'
      src:
        c: 1e34eb3b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d201: all'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 517: A, C'
        - 'via x.1964-06-05.mcnamara-south-vietnam-action-program: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
