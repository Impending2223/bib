- add:
    entry:
      id: cal.1967-03-14.vietnam-congress
      when: Mar. 14
      date: '1967-03-14'
      thread: vietnam-congress
      c: 'Whitten with Johnson. His proposal, in notes found in the President''s pocket: announce "We expect to pursue present
        policies for [unspecified number of] days without letup"; if Hanoi has then taken no official action toward a just
        settlement, the Joint Chiefs "shall be directed to ''win the war,'' after which we can discuss an honorable relationship."'
      n: '[[w.barrett-uncertain-warriors]], 69, 221 n.27. To check: notes by Whitten found in the President''s pocket, Mar.
        14, 1967, Diary backup, box 57, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 69 n.27b). Names: Whitten,
        Johnson.'
      tags:
      - name:whitten-jamie-l
      - name:johnson-lyndon-b
      src:
        c: 8017c59a
        rows:
        - 'w.barrett-uncertain-warriors 69, 221 n.27: all'
        - 'via w.barrett-uncertain-warriors 69 n.27b: all'
- add:
