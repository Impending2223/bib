      id: cal.1967-03-15.war-opposition
      when: Mar. 15
      date: '1967-03-15'
      thread: war-opposition
      c: 'Nashville, after the President''s address: two young protesters throw themselves in front of his car, a youth, then
        a girl "practically under the wheels." Officers lift them away. By Lady Bird Johnson''s diary.'
      n: '[[w.barrett-uncertain-warriors]], 72. Check: the day: the work gives "In March," after a speech on Vietnam in Tennessee.
        To check: [[w.johnson-white-house-diary]], 501–02 (cited by [[w.barrett-uncertain-warriors]], 72 n.32). See [[cal.1967-03-15.vietnam]].
        Names: Johnson, Lady Bird Johnson.'
      tags:
