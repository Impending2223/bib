      when: Mar. 11
      date: '1967-03-11'
      thread: vietnam-congress
      c: 'Henry Wilson to Watson, on the members of Congress who see the President against the war: they should "be impressed
        with the fact that the President is willing to listen to arguments from all sides."'
      n: '[[w.barrett-uncertain-warriors]], 69 ("as one staffer wrote to another"). Check: the text names neither staffer;
        the note gives Wilson to Watson, Mar. 11, 1967 (69 n.27a). To check: Henry Wilson to Marvin Watson, Mar. 11, 1967,
        Diary backup, box 57, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 69 n.27a). Names: Henry Wilson, Watson.'
      tags:
