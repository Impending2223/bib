- add:
    entry:
      id: cal.1965-03-24.vietnam-4
      when: Mar. 24
      date: '1965-03-24'
      thread: vietnam
      c: 'McNaughton to McNamara: "The situation in general is bad and deteriorating. ... U.S. policy appears to be drifting."
        A near-consensus that the efforts in the South will probably fail to prevent collapse, yet all three remedies rejected:
        a "will-breaking" strike on the North, large troop deployments, exit by negotiations.'
      n: '[[w.barrett-uncertain-warriors]], 24. To check: McNaughton to McNamara, Mar. 24, 1965, printed in the Pentagon Papers,
        vol. 3, 694, the edition not named (cited by [[w.barrett-uncertain-warriors]], 24 n.36a). Names: McNaughton, McNamara.'
      tags:
      - name:mcnaughton-john-t
      - name:mcnamara-robert-s
      src:
        c: 4734c4d3
        rows:
        - 'w.barrett-uncertain-warriors 24: all'
        - 'via w.barrett-uncertain-warriors 24 n.36a: all'
- add:
    entry:
      id: cal.1965-06-22.vietnam-congress-2
      when: June 22
      date: '1965-06-22'
      thread: vietnam-congress
      c: 'Russell to a constituent: "I have never seen where Vietnam has strategic, tactical, or economic value, and in addition
        to the billions we are spending there now, we lost three billion down the drain supporting the French in Dienbienphu."'
      n: '[[w.barrett-uncertain-warriors]], 35. Check: the day: the text gives a letter of June 1965; the note cites letters
        to constituents of June 22, 1965, and Jan. 6, 1966 (35 n.78). To check: Russell to constituents, June 22, 1965, Series
        F-Dictation, Russell Library (cited by [[w.barrett-uncertain-warriors]], 35 n.78b). Names: Russell.'
      tags:
      - name:russell-richard-b
      src:
        c: 8ee1e1c6
        rows:
        - 'w.barrett-uncertain-warriors 35: all'
        - 'via w.barrett-uncertain-warriors 35 n.78b: all'
- add:
    entry:
      id: cal.1965-07-07.vietnam-july-decision-2
      when: July 7
      date: '1965-07-07'
      thread: vietnam-july-decision
      c: 'Acheson to Erik Boheman, by letter: "what needs to be done is not obscure. How to do it with the human material
        available, in the God-awful terrain given and against the foreign-directed and supplied obstacles is very hard indeed."'
      n: '[[w.barrett-uncertain-warriors]], 40 (Acheson "told a friend"). Check: which letter: the note cites Acheson to Truman,
        July 10, and Acheson to Erik Boheman, July 7, 1965, together (40 n.96); the words taken here as Boheman''s. To check:
        [[w.among-friends]], 272–73 (cited by [[w.barrett-uncertain-warriors]], 40 n.96b). Names: Acheson.'
      tags:
      - name:acheson-dean-g
      src:
        c: 7eca936d
        rows:
        - 'w.barrett-uncertain-warriors 40: all'
        - 'via w.barrett-uncertain-warriors 40 n.96b: all'
- add:
    entry:
      id: cal.1965-07-09.vietnam-july-decision-2
      when: July 9
      date: '1965-07-09'
      thread: vietnam-july-decision
      c: 'Gilpatric to McGeorge Bundy, after the panel of former officials: "The U.S. has a commitment in South Vietnam, non-fulfillment
        of which would have extremely grave consequences not only in Asia but in Europe"; the United States to take "a major
        part in the combat itself," large forces and heavier casualties, military power "perhaps as much as brought to bear
        in Korea fifteen years ago."'
      n: '[[w.barrett-uncertain-warriors]], 40. To check: Gilpatric to McGeorge Bundy, July 9, 1965, file "President''s consultants,"
        NSF, Files of McGeorge Bundy, boxes 18–19, LBJ Library (cited by [[w.barrett-uncertain-warriors]], 40 n.97). See [[cal.1965-07-08.vietnam-july-decision]].
        Names: Gilpatric, McGeorge Bundy.'
      tags:
      - name:gilpatric-roswell-l
      - name:bundy-mcgeorge
      src:
        c: 0afe8cdb
        rows:
        - 'w.barrett-uncertain-warriors 40: all'
        - 'via w.barrett-uncertain-warriors 40 n.97: all'
- add:
    entry:
      id: cal.1965-07-10.vietnam-july-decision-2
      when: July 10
      date: '1965-07-10'
      thread: vietnam-july-decision
      c: 'Acheson to Truman, by letter, on the panel''s meeting with Johnson: "We were all disturbed by a long complaint about
        how mean everything and everybody was to him." Acheson "blew my top": Johnson right in the Dominican Republic and
        Vietnam, no choice but to press on; Lovett and Bradley with him. "I think LBJ''s press conference of yesterday showed
        that we scored."'
      n: '[[w.barrett-uncertain-warriors]], 39–40. To check: [[w.among-friends]], 272–73 (cited by [[w.barrett-uncertain-warriors]],
        40 n.96a). See [[cal.1965-07-08.vietnam-july-decision]]. Names: Acheson, Truman, Johnson, Lovett, Bradley.'
      tags:
      - name:acheson-dean-g
      - name:truman-harry-s
      - name:johnson-lyndon-b
      - name:lovett-robert-a
      - name:bradley-omar-n
      src:
        c: 0f80da7c
        rows:
        - 'w.barrett-uncertain-warriors 39–40: all'
        - 'via w.barrett-uncertain-warriors 40 n.96a: all'
