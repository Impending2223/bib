- add:
    entry:
      id: cal.1967-06-06.middle-east-six-day-war
      when: June 6
      date: '1967-06-06'
      thread: middle-east-six-day-war
      c: 'McPherson south with an Israeli officer: the trucks at the Gaza border, smoke over Gaza, turned back; by Sde Boker;
        north of Beersheba a search for two fedayeen. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 415–16. Check: the day, "next day." See [[cal.1967-06-05.middle-east-six-day-war]].
        Names: McPherson.'
      tags:
      - name:mcpherson-harry
      src:
        c: '4816cbc7'
        rows:
        - 'w.mcpherson-political-education 415–16: all'
- add:
    entry:
      id: cal.1967-06-07.middle-east-six-day-war
      when: June 7
      date: '1967-06-07'
      thread: middle-east-six-day-war
      c: 'Rehovot, the Weizmann Institute''s party for the Wailing Wall''s capture. Weisgal: "To the Jews in Jerusalem!" McPherson:
        "you''ll have to give it back if you want peace." A physicist: "Never!" By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 417. Check: the day. See [[cal.1967-06-07.middle-east]]. Names: McPherson.'
      tags:
      - name:mcpherson-harry
      src:
        c: fa462071
        rows:
        - 'w.mcpherson-political-education 417: all'
- add:
    entry:
      id: cal.1968-03-31.vietnam-205000
      when: Mar. 31
      date: '1968-03-31'
      thread: vietnam-205000
      also:
      - elections-1968
      c: 'Sunday. McPherson to Clifford by telephone: the draft, the 20th parallel taken out, reads as if only the DMZ will
        be bombed; hold the raids near it a few days. Clifford: Hanoi will not quibble; the orders have likely gone from CINCPAC.
        About five, Johnson to McPherson: "Well, I think it''s best. So long, podner."'
      n: '[[w.mcpherson-political-education]], 438–39. See [[cal.1968-03-31.elections-1968]]. Names: McPherson, Clifford,
        Johnson.'
      tags:
      - name:mcpherson-harry
      - name:clifford-clark
      - name:johnson-lyndon-b
      src:
        c: '26b37ed4'
        rows:
        - 'w.mcpherson-political-education 438–39: all'
- add:
    entry:
      id: cal.1968-04-15.vietnam-paris
      when: Apr. 15–17
      date: '1968-04-15'
      thread: vietnam-paris
      c: 'Honolulu, the Kaiser estate, for the meeting with Park. Johnson and McPherson by the pool list sites for the talks
        beyond Geneva, Vientiane, Rangoon, Djakarta and New Delhi: Colombo, Kabul, Katmandu, Vienna, Helsinki; "Fifteen."
        By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 440. Check: the day. See [[cal.1968-04-15.japan-and-korea]]. Names: Johnson,
        McPherson, Park Chung Hee.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:park-chung-hee
      src:
        c: '59ad7514'
        rows:
        - 'w.mcpherson-political-education 440: all'
- add:
    entry:
      id: cal.1968-04.vietnam-paris-2
      when: Apr.
      date: '1968-04'
      thread: vietnam-paris
      c: 'Clifford to McPherson at a party: "We must convince our friend that he should end this argument over a site." McPherson
        dictates a memorandum; next morning at 8:30 Johnson by telephone, "hopping mad": who put him up to it? Clifford''s
        notes: his own call with Johnson ended at 8:29. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 440–41. Check: the day. Names: Clifford, McPherson, Johnson.'
      tags:
      - name:clifford-clark
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: b8078a07
        rows:
        - 'w.mcpherson-political-education 440–41: all'
