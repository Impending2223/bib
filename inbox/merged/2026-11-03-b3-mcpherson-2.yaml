# The entries of b3-mcpherson-more (Oct. 29), whose file was lost before the merge, re-read from the owner's copy
# (printed page = PDF page - 12) and written again; and McPherson's pinpoints on the Asian trip's stops and the TCU address.
patch: b3-mcpherson-2
by: 'Claude (batch 3 reading run, staff group: McPherson, A Political Education), Nov. 4, 2026'
ops:
- add:
    entry:
      id: cal.1960-08.elections-1960-7
      when: Aug.
      date: '1960-08'
      thread: elections-1960
      also:
      - congress
      c: 'The post-convention session. Scott in the Senate against the Kennedy Foundation''s flights of African students from
        Dar es Salaam to American schools: a political move to preempt the administration. Kennedy replies with heat; Johnson
        calls a score of Democrats to the floor against Scott. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 179–80. Check: the day and the Record''s page. Names: Scott, Kennedy, Johnson.'
      tags:
      - name:scott-hugh-d-jr
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      src:
        c: '712a1ed5'
        rows:
        - 'w.mcpherson-political-education 179–80: all'
- add:
    entry:
      id: cal.1961-01-20.rules
      when: Jan. 20
      date: '1961-01-20'
      thread: rules
      c: After the inaugural address, McPherson hands Mansfield a memorandum on the filibuster rule, in the Senate chamber.
      n: '[[w.mcpherson-political-education]], 182. Names: McPherson, Mansfield.'
      tags:
      - name:mcpherson-harry
      - name:mansfield-mike
      src:
        c: cca616c4
        rows:
        - 'w.mcpherson-political-education 182: all'
- add:
    entry:
      id: cal.1961-01.congress
      when: Jan.
      date: '1961-01'
      thread: congress
      c: 'Mansfield, the new majority leader, keeps McPherson as general counsel of the Policy Committee. The leadership''s
        staff cut to a few: Baker to count votes, McPherson the program and the floor, Pauline Moore the records. By McPherson''s
        account.'
      n: '[[w.mcpherson-political-education]], 183. Check: the day. Names: Mansfield, McPherson, Baker.'
      tags:
      - name:mansfield-mike
      - name:mcpherson-harry
      - name:baker-robert-g
      src:
        c: '5fcd1bbd'
        rows:
        - 'w.mcpherson-political-education 183: all'
- add:
    entry:
      id: cal.1963-06.civil-rights-bill
      when: June
      date: '1963-06'
      thread: civil-rights-bill
      c: 'Johnson, presiding over the Senate soon after the bill is introduced, to McPherson beside him: "Not a chance. And
        yet, you know, it really ought to pass." His cook and her husband, driving his car through the South, eating from
        country stores, "peeing in a ditch"; a Southern Senator: "our people will need a lot of time." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 194–95. Check: the day; "soon after the bill was introduced" (June 19). See
        [[cal.1963-06-19.civil-rights-bill]]. Names: Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: fc0dbba9
        rows:
        - 'w.mcpherson-political-education 194–95: all'
- add:
    entry:
      id: cal.1963-08.transition-and-staff
      when: Aug.
      date: '1963-08'
      thread: transition-and-staff
      c: 'Late summer. Vance offers McPherson the post of Deputy Under Secretary of the Army for International Affairs: the
        Canal Zone, Okinawa, the Special Forces. Johnson advises against it, then: "What do you want?" McPherson takes it.
        By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 200–02. Check: the day; "the late summer of 1963." Names: Vance, McPherson,
        Johnson.'
      tags:
      - name:vance-cyrus
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: '85b8e1a6'
        rows:
        - 'w.mcpherson-political-education 200–02: all'
- add:
    entry:
      id: cal.1964-01-07.latin-america-panama
      when: Jan. 7
      date: '1964-01-07'
      thread: latin-america-panama
      c: 'Fleming, Governor of the Canal Zone, by telephone to McPherson at the Army: the American flag lowered at Balboa
        High School under the two-flag order, run up again by students camped round the pole. McPherson, Vance and Ailes:
        hold his fire, persuade, then warn of discipline. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 216–17. Check: the day; "one morning in early January," two days before Fleming
        left and the march of Jan. 9. See [[cal.1964-01-09.latin-america]]. Names: McPherson, Vance, Ailes.'
      tags:
      - name:mcpherson-harry
      - name:vance-cyrus
      - name:ailes-stephen
      src:
        c: f86baea3
        rows:
        - 'w.mcpherson-political-education 216–17: all'
- add:
    entry:
      id: cal.1964-01.latin-america-panama
      when: Jan.
      date: '1964-01'
      thread: latin-america-panama
      c: 'Panama City. McPherson, Califano and Owen Smith brief the Army''s case on the riots before the International Commission
        of Jurists'' committee, three days and nights. The Zone police chief''s account: five of the two hundred marchers
        to stand at the flagpole; the flag torn in a scuffle.'
      n: '[[w.mcpherson-political-education]], 221–22. Check: the day; "shortly afterwards." The committee''s later finding:
        most Panamanian deaths from collapsing buildings, looters and stray fire (221). See [[cal.1964-01-09.latin-america]].
        Names: McPherson, Califano.'
      tags:
      - name:mcpherson-harry
      - name:califano-joseph-a-jr
      src:
        c: ba446345
        rows:
        - 'w.mcpherson-political-education 221–22: all'
- add:
    entry:
      id: cal.1964-07.civil-rights-the-executive
      when: July
      date: '1964-07'
      thread: civil-rights-the-executive
      also:
      - mississippi
      c: 'Summer. McPherson, the Army''s special assistant for civil functions, at Corps of Engineers reservoirs in Mississippi:
        the lodges and restaurants leased to private operators closed to Negroes. Back in Washington he tells the District
        engineers: no discrimination in any facility, operated or leased. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 225–26. Check: the day; "one torrid summer day." Names: McPherson.'
      tags:
      - name:mcpherson-harry
      - state:ms
      src:
        c: '4e0e96fa'
        rows:
        - 'w.mcpherson-political-education 225–26: all'
- add:
    entry:
      id: cal.1964-08-26.transition-and-staff
      when: Aug. 26
      date: '1964-08-26'
      thread: transition-and-staff
      c: 'McPherson sworn in as Assistant Secretary of State for Educational and Cultural Affairs, Rusk presiding, the day
        the convention learns Humphrey is Johnson''s choice. Read had sounded him; Battle leaving for Cairo; McNamara, through
        Califano: a "backwater."'
      n: '[[w.mcpherson-political-education]], 226–28. Check: McPherson puts it on his thirty-fifth birthday; the Executive
        roster has him from Aug. 23. Names: McPherson, Rusk, Humphrey, Read, McNamara, Califano.'
      tags:
      - name:mcpherson-harry
      - name:rusk-dean
      - name:humphrey-hubert-h
      - name:read-benjamin-h
      - name:mcnamara-robert-s
      - name:califano-joseph-a-jr
      src:
        c: '37533a55'
        rows:
        - 'w.mcpherson-political-education 226–28: all'
- add:
    entry:
      id: cal.1965-02.congress
      when: Feb.
      date: '1965-02'
      thread: congress
      c: 'McPherson before Rooney''s House Appropriations subcommittee on the exchange program, some $50 million, Rusk having
        cut his requests the day before. Rooney: "Are you bringing politics into this?" McPherson: "Mr. Chairman, it was already
        here." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 233–36. Check: the day. To check: the subcommittee''s hearings on the Department
        of State''s appropriation for fiscal 1966. Names: McPherson, Rooney, Rusk.'
      tags:
      - name:mcpherson-harry
      - name:rooney-john-j
      - name:rusk-dean
      src:
        c: b4a63b33
        rows:
        - 'w.mcpherson-political-education 233–36: all'
- add:
    entry:
      id: cal.1965-02.transition-and-staff
      when: Feb.
      date: '1965-02'
      thread: transition-and-staff
      c: 'Moyers to McPherson at the White House: Feldman leaving, Lee White to be special counsel; would McPherson understudy
        White? He agrees, asks time for his hearing before Rooney, and leaves State at the end of February. By McPherson''s
        account.'
      n: '[[w.mcpherson-political-education]], 235–36. Check: the day; "a few weeks before the hearing." Check: the Executive
        roster has his special assistantship from Aug. 1965. Names: Moyers, McPherson, Feldman, Lee White.'
      tags:
      - name:moyers-bill
      - name:mcpherson-harry
      - name:feldman-myer
      - name:white-lee-c
      src:
        c: '5146ba37'
        rows:
        - 'w.mcpherson-political-education 235–36: all'
- add:
    entry:
      id: cal.1965-10.states-and-cities
      when: Oct.
      date: '1965-10'
      thread: states-and-cities
      c: 'After home rule''s defeat, Johnson to McPherson: "I agreed before I started. But I wanted to pass it"; "You''ve
        got just one year when they treat you right ... The fourth year''s all politics." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 267–68. Check: the day. See [[cal.1965-09-27.states-and-cities]]. Names: Johnson,
        McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - city:dc
      src:
        c: '90affb94'
        rows:
        - 'w.mcpherson-political-education 267–68: all'
- add:
    entry:
      id: cal.1965-01.health
      when: Jan.
      date: '1965-01'
      thread: health
      c: 'Johnson orders eleven veterans hospitals closed: poor care, old buildings, few patients. The veterans'' organizations
        and Congress against it; Mansfield, a hospital in Montana, among them. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 281. Check: the day and the order. The committee named Apr. 3: [[cal.1965-04-03.health]].
        Names: Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      src:
        c: '400bb453'
        rows:
        - 'w.mcpherson-political-education 281: all'
- add:
    entry:
      id: cal.1965-04.health
      when: Apr.
      date: '1965-04'
      thread: health
      also:
      - labor
      c: 'Spring. The Mine Workers'' ten hospitals in West Virginia, Kentucky and Virginia, a $1 million note due June 1 to
        the union''s welfare and pension fund. Sweeney, Moynihan and McPherson ask Josephine Roach to extend it: "No! No!
        They won''t pay!" Next day John L. Lewis: "The fund is also independent." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 286–88. Check: the day. Later, at Johnson''s asking, Donald Cook works with
        the Presbyterian Church to raise the money. Names: Sweeney, Moynihan, McPherson, Cook.'
      tags:
      - name:sweeney-john-l
      - name:moynihan-daniel-patrick
      - name:mcpherson-harry
      - name:cook-donald-c
      src:
        c: '4a1492a2'
        rows:
        - 'w.mcpherson-political-education 286–88: all'
- add:
    entry:
      id: cal.1966-10.vietnam-asian-trip
      when: Oct.
      date: '1966-10'
      thread: vietnam-asian-trip
      c: 'The advance party, eight days: Moyers, Roche, Symington, McPherson and Marty Underwood to Samoa, Wellington, Canberra,
        Manila, Bangkok, Kuala Lumpur and Seoul and back. Moyers the press, Symington the dignitaries and quarters, Underwood
        the crowds.'
      n: '[[w.mcpherson-political-education]], 303–04. Check: the days; back thirty-six hours before Johnson left (Oct. 17).
        See [[cal.1966-10-17.vietnam]]. Names: Moyers, Roche, Symington, McPherson.'
      tags:
      - name:moyers-bill
      - name:roche-john-p
      - name:symington-james-w
      - name:mcpherson-harry
      src:
        c: '84b25a4c'
        rows:
        - 'w.mcpherson-political-education 303–04: all'
- add:
    entry:
      id: cal.1966-10-20.vietnam-asian-trip-2
      when: Oct. 20
      date: '1966-10-20'
      thread: vietnam-asian-trip
      also:
      - war-opposition
      c: Wellington. Demonstrators with STOP THE WAR banners push through the crowd as Johnson goes to Parliament; on the
        steps he turns and makes a V sign. By McPherson's account.
      n: '[[w.mcpherson-political-education]], 305. Check: the day, "the following day" after the arrival. See [[cal.1966-10-19.vietnam-asian-trip]].
        Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: '5674e387'
        rows:
        - 'w.mcpherson-political-education 305: all'
- add:
    entry:
      id: cal.1966-10-22.vietnam-asian-trip
      when: Oct. 22
      date: '1966-10-22'
      thread: vietnam-asian-trip
      also:
      - war-opposition
      c: 'Sydney. A big crowd; a few demonstrators break through and throw red paint on Johnson''s car: the news of the Australian
        trip. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 305–06. Check: the day. See [[cal.1966-10-20.vietnam-asian-trip]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: '8619489c'
        rows:
        - 'w.mcpherson-political-education 305–06: all'
- add:
    entry:
      id: cal.1966-10-22.vietnam-asian-trip-2
      when: Oct. 22
      date: '1966-10-22'
      thread: vietnam-asian-trip
      c: 'Brisbane airport, at night. In McPherson''s draft: "something like a million Americans passed through Brisbane during
        World War II." The consul alarmed; Moyers strikes the sentence before Johnson speaks. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 306. Check: the day. See [[cal.1966-10-20.vietnam-asian-trip]]. Names: McPherson,
        Moyers, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:moyers-bill
      - name:johnson-lyndon-b
      src:
        c: '51c14033'
        rows:
        - 'w.mcpherson-political-education 306: all'
- add:
    entry:
      id: cal.1968-07-07.latin-america
      when: July 7
      date: '1968-07-07'
      thread: latin-america
      c: 'San Andrés, El Salvador. Johnson at the Alberto Masferrer Normal School, McPherson''s draft: the teachers "the indispensable
        teachers, the awakeners, the liberators"; "In each man there is an immortal hero." The students restive, by McPherson''s
        account.'
      n: 'Remarks at the Alberto Masferrer Normal School, San Andres, El Salvador, [1968–69 Pub. Papers 793](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=103)
        (July 7, 1968). [[w.mcpherson-political-education]], 321 (the draft; the students). See [[cal.1968-07-06.latin-america]].
        Names: Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: '833926ac'
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=103: A-C'
        - 'w.mcpherson-political-education 321: B, D'
- add:
    entry:
      id: cal.1966-08-19.health
      when: Aug. 19
      date: '1966-08-19'
      thread: health
      also:
      - school-aid
      c: 'Ellenville, N.Y. Johnson dedicates the community hospital, telling the school bill''s story: B''nai B''rith''s award
        and its denunciation, the Cardinals, "our Billy": "before the sun went down that night we had the Cardinals and we
        had the Rabbis."'
      n: 'Remarks at the Dedication of the Ellenville Community Hospital, Ellenville, New York, [1966 Pub. Papers 849](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=223)
        (Aug. 19, 1966). [[w.mcpherson-political-education]], 328–29. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:ny
      src:
        c: '85ee41fc'
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=223: all'
        - 'w.mcpherson-political-education 328–29: all'
- add:
    entry:
      id: cal.1965-04.civil-rights-the-executive
      when: Apr.
      date: '1965-04'
      thread: civil-rights-the-executive
      c: 'Moynihan brings McPherson, three days in hospital, one of a hundred copies of *The Negro Family: The Case for National
        Action*, "For Official Use Only"; four hours'' talk. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 334–35. Check: the day. Names: Moynihan, McPherson.'
      tags:
      - name:moynihan-daniel-patrick
      - name:mcpherson-harry
      src:
        c: b139b054
        rows:
        - 'w.mcpherson-political-education 334–35: all'
- add:
    entry:
      id: cal.1965-06.civil-rights-the-executive
      when: June
      date: '1965-06'
      thread: civil-rights-the-executive
      c: 'After Howard University, talks in the West Wing on the White House conference: Erikson, Parsons, Bronfenbrenner,
        James Q. Wilson, Pettigrew, Coles. Rustin''s first doubts about centering it on *The Negro Family*: "We must talk
        about the poor family, not simply the Negro family." By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 339–40. Check: the days, summer and fall 1965. See [[cal.1965-06-04.civil-rights-the-executive]].
        Names: Rustin.'
      tags:
      - name:rustin-bayard
      src:
        c: a34fb329
        rows:
        - 'w.mcpherson-political-education 339–40: all'
- add:
    entry:
      id: cal.1968-12.civil-rights-the-executive
      when: Dec.
      date: '1968-12'
      thread: civil-rights-the-executive
      c: 'McPherson''s executive order to put new federal buildings where the jobless could reach them dropped: the agencies''
        objections not met, Johnson will not bind a new administration so close to the transition.'
      n: '[[w.mcpherson-political-education]], 352. Check: the day. Names: McPherson, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      src:
        c: da3a7a26
        rows:
        - 'w.mcpherson-political-education 352: all'
- add:
    entry:
      id: cal.1968-12.transition-and-staff
      when: Dec.
      date: '1968-12'
      thread: transition-and-staff
      c: Johnson's long sessions, one by one, with the Cabinet on their departments' five years, for the Johnson Library's
        records; Califano and McPherson at many. By McPherson's account.
      n: '[[w.mcpherson-political-education]], 450. Check: the days; after the election. Names: Johnson, Califano, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:mcpherson-harry
      src:
        c: '4ea3b528'
        rows:
        - 'w.mcpherson-political-education 450: all'
- add:
    entry:
      id: cal.1967-08.civil-disorders-2
      when: Aug.
      date: '1967-08'
      thread: civil-disorders
      c: 'Ramsey Clark: lawyers in every division of Justice on the evidence against Carmichael, come up empty-handed; an
        indictment for inciting to riot likely, conviction not, acquittal would make him a hero. Johnson abides by it. By
        McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 362–63. Check: the day; after Detroit. Names: Ramsey Clark, Carmichael, Johnson.'
      tags:
      - name:clark-ramsey
      - name:carmichael-stokely
      - name:johnson-lyndon-b
      src:
        c: '0f6ba8bc'
        rows:
        - 'w.mcpherson-political-education 362–63: all'
- add:
    entry:
      id: cal.1968-05-01.civil-disorders-king
      when: May 1
      date: '1968-05-01'
      thread: civil-disorders-king
      c: '"Riot Lessons," eleven points: security forces not under 10,000; minimum force, "arrest, not shooting"; tear gas
        and curfews early; planning for arrests and the courts; squelching rumors.'
      n: '[[w.mcpherson-political-education]], 370 (quoted). Check: the author and the addressee; McPherson prints it without
        either.'
      src:
        c: '54eac53b'
        rows:
        - 'w.mcpherson-political-education 370: all'
        - 'via x.1968-05-01.riot-lessons: all'
- add:
    entry:
      id: cal.1968-03.civil-disorders-kerner-2
      when: Mar.
      date: '1968-03'
      thread: civil-disorders-kerner
      c: 'Johnson to McPherson on the Kerner report''s charge of white racism, after an officer of the American Jewish Committee
        in the *New York Times*: "There aren''t that many of us that we can afford to set some of us against the rest of us."'
      n: '[[w.mcpherson-political-education]], 376. Check: the day, and the *Times* piece. See [[cal.1968-02-29.civil-disorders]].
        Names: Johnson, McPherson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      src:
        c: c62fa0ee
        rows:
        - 'w.mcpherson-political-education 376: all'
- add:
    entry:
      id: cal.1967-05.vietnam
      when: May
      date: '1967-05'
      thread: vietnam
      c: 'Mid-May. McPherson, at his own asking, two weeks in South Vietnam to see pacification: I Corps, the Montagnard country,
        the Delta; Vũng Tàu''s RD center; a Mekong patrol boat. Before he left, Russell: "Look into that free-fire zone business."'
      n: '[[w.mcpherson-political-education]], 404–10. Check: the days. His report: [[cal.1967-06-13.vietnam-2]]. Names: McPherson,
        Russell.'
      tags:
      - name:mcpherson-harry
      - name:russell-richard-b
      src:
        c: ad2610b0
        rows:
        - 'w.mcpherson-political-education 404–10: all'
- add:
    entry:
      id: cal.1967-05.vietnam-2
      when: May
      date: '1967-05'
      thread: vietnam
      c: 'Saigon. Kỳ to McPherson at dinner: "Most of the generals are corrupt"; "You live with it in Chicago and New York."
        Bunker at lunch, of Kỳ and Thiệu: "The problem is not what they say, but what they do"; Thắng, of the RD program,
        the same and wanting to quit. Weyand: "we were at minus fifty. Now we are at zero."'
      n: '[[w.mcpherson-political-education]], 405–08. Check: the days. See [[cal.1967-05.vietnam]]. Names: Nguyễn Cao Kỳ,
        McPherson, Bunker, Nguyễn Văn Thiệu, Weyand.'
      tags:
      - name:nguyen-cao-ky
      - name:mcpherson-harry
      - name:bunker-ellsworth
      - name:nguyen-van-thieu
      - name:weyand-frederick-c
      src:
        c: '6b90cd61'
        rows:
        - 'w.mcpherson-political-education 405–08: all'
- add:
    entry:
      id: cal.1967-06.vietnam-elections
      when: June
      date: '1967-06'
      thread: vietnam-elections
      c: 'A few days before McPherson leaves Saigon. Kỳ: a civilian President "might try to negotiate with the North ... That
        would bring on a coup"; his problem keeping his vote down. Thiệu: "Mr. Huong ... would make an excellent President.
        I would be glad to serve him." The embassy cables it to Washington.'
      n: '[[w.mcpherson-political-education]], 410–11. Check: the day, late May or early June. Names: Nguyễn Cao Kỳ, Nguyễn
        Văn Thiệu, Trần Văn Hương, McPherson.'
      tags:
      - name:nguyen-cao-ky
      - name:nguyen-van-thieu
      - name:tran-van-huong
      - name:mcpherson-harry
      src:
        c: '81271727'
        rows:
        - 'w.mcpherson-political-education 410–11: all'
        - 'via x.1967-06.mcpherson-thieu-conversation: all'
- add:
    entry:
      id: cal.1967-06-05.middle-east-six-day-war-3
      when: June 5
      date: '1967-06-05'
      thread: middle-east-six-day-war
      c: 'Tel Aviv, in the blackout. Barbour and McPherson complain to an Israeli official of no word before or since the
        attack; he: Israel has spared the United States embarrassment by acting alone. By McPherson''s account.'
      n: '[[w.mcpherson-political-education]], 415. Check: the day; McPherson dates his arrival June 6 (414). See [[cal.1967-06-05.middle-east-six-day-war]].
        Names: Barbour, McPherson.'
      tags:
      - name:barbour-walworth
      - name:mcpherson-harry
      src:
        c: '26b145df'
        rows:
        - 'w.mcpherson-political-education 415: all'
      follows:
