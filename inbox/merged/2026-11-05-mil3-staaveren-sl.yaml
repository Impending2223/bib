    item: '[[w.staaveren-u-s-air-force]], 197–98 (the Sihanouk Trail found a major artery Jan. 25; Spike Team Maine in Feb.
      2, five Air Force planes on eighty-five troops; Hornet platoons Delta and Echo in the bombed area Feb. 3 and 5, a cache,
      thirty-five secondary explosions, Echo losing one American and two Vietnamese killed; eight platoons in and out Feb.
      10–27; 110 sorties Mar. 23–Apr. 4)'
