patch: mil3-staaveren-sl
by: 'Claude (the military re-read, third run: Van Staaveren, Interdiction in Southern Laos, 1993), Nov. 5, 2026'
ops:
- add:
    entry:
      id: cal.1965-05-12.laos
      when: May 12
      date: '1965-05-12'
      thread: laos
      c: 'Westmoreland to Sharp and the Joint Chiefs: unless Sullivan accepts his concept of Shining Brass and drops his objection
        to helicoptering cross-border teams with American advisers, the project should be scrapped; entry first to two zones,
        as Sullivan wishes. Sharp and the Chiefs endorse him; the Chiefs send McNamara a modified concept, Phase I.'
      n: '[[w.staaveren-u-s-air-force]], 73. To check: Msg, COMUSMACV to CINCPAC, 120152Z May 65 (cited by [[w.staaveren-u-s-air-force]],
        73 n.42). Names: Westmoreland, Sullivan, Sharp, McNamara.'
      src:
        c: 503ae95d
        rows:
        - 'w.staaveren-u-s-air-force 73: all'
        - 'via x.1965-05-12.msg-comusmacv-to-cincpac-120152z-may-65: ?'
      tags:
      - name:westmoreland-william
      - name:sullivan-william-h
      - name:sharp-u-s-grant
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-05-24.laos
      when: May 24
      date: '1965-05-24'
      thread: laos
      c: 'The analysts'' count of a month''s Steel Tiger, Apr. 24–May 24: 179 trucks sighted and attacked, some 51 destroyed
        or damaged, six sorties a truck; sightings fall after May 24.'
      n: '[[w.staaveren-u-s-air-force]], 69. See [[cal.1965-04-03.laos]].'
      src:
        c: f811922d
        rows:
        - 'w.staaveren-u-s-air-force 69: all'
- add:
    entry:
      id: cal.1965-08-19.laos
      when: Aug. 19
      date: '1965-08-19'
      thread: laos
      c: 'The roadwatch teams'' count, June 1–Aug. 19: some 22,000 troops on the Muong Sen–Muong Phine segment of Route 23,
        two-thirds seemingly North Vietnamese come by the Mụ Giạ Pass; their reports over the months suggest most were Pathet
        Lao. No traffic north of Muong Phine May 26 to mid-July.'
      n: '[[w.staaveren-u-s-air-force]], 78. Check: the count''s day; the book gives the span. See [[cal.1965-04-03.laos]].'
      src:
        c: 33947c4f
        rows:
        - 'w.staaveren-u-s-air-force 78: all'
- add:
    entry:
      id: cal.1965-12-23.laos
      when: Dec. 23
      date: '1965-12-23'
      thread: laos
      c: 'The Air Force''s estimate of attrition in Barrel Roll, Steel Tiger and Tiger Hound to Dec. 23: destroyed, vehicles
        108 (Air Force 67, Navy 41), structures 712, bridges 201; damaged 115, 471 and 174. No reliable evidence the air programs
        reduced the movement south; MACV: infiltration not abating.'
      n: '[[w.staaveren-u-s-air-force]], 103. See [[cal.1965-12-06.laos]].'
      src:
        c: bea044e4
        rows:
        - 'w.staaveren-u-s-air-force 103: all'
- add:
    entry:
      id: cal.1965-12-31.laos
      when: Dec. 31
      date: '1965-12-31'
      thread: laos
      c: 'Air Force planes strike a civilian target near Saravane: civilian damage and casualties.'
      n: '[[w.staaveren-u-s-air-force]], 128. To check: Msgs, 2d AD to CINCPAC, NMCC, et al, 010305Z Jan 66, COMUSMACV to
        CINCPAC, 170300Z Jan 66, AIRA Vientiane to 2d AD, 210415Z Jan 66, AmEmb Vientiane to COMUSMACV, 2d AD, 141045Z Jan
        66, 2d AD to AIRA Vientiane, COMUSMACV, et al, 201200Z Jan 66 (cited by [[w.staaveren-u-s-air-force]], 128 n.68).
        See [[cal.1965-12-06.laos]].'
      src:
        c: 27c688c2
        rows:
        - 'w.staaveren-u-s-air-force 128: all'
        - 'via x.1966-01-01.msgs-2d-ad-to-cincpac-nmcc-et: ?'
- add:
    entry:
      id: cal.1966-01.laos-3
      when: Jan., first week
      date: 1966-01
      thread: laos
      c: 'Unidentified propeller aircraft hit unapproved targets in southern Laos: Ban Kagnak destroyed, Ban Kengxai damaged,
        bombs north and south of Ban Sok; villagers in Military Region IV flee to the forests and caves by day, some toward
        Attopeu.'
      n: '[[w.staaveren-u-s-air-force]], 128. Check: the day. See [[cal.1965-12-31.laos]].'
      src:
        c: 5684278a
        rows:
        - 'w.staaveren-u-s-air-force 128: all'
- add:
    entry:
      id: cal.1966-01-05.laos
      when: Jan. 5
      date: '1966-01-05'
      thread: laos
      c: A Viet Cong mortar attack destroys an O-1 at Khe Sanh, Tiger Hound's forward operating base. Ten aircraft hit over
        Tiger Hound in January, four downed.
      n: '[[w.staaveren-u-s-air-force]], 115. See [[cal.1965-12-06.laos]].'
      src:
        c: d75cd732
        rows:
        - 'w.staaveren-u-s-air-force 115: all'
- add:
    entry:
      id: cal.1966-01-06.laos-2
      when: Jan. 6–7
      date: '1966-01-06'
      thread: laos
      c: The night of Jan. 6–7, Shining Brass team Ohio, near an infiltration point, hears voices and vehicles; after lift-out
        an American of the team flies over with a forward air controller and fixes the spot, but a break in communications
        keeps the request from Vientiane's validation center; the strike scrubbed. Nine Shining Brass/Tiger Hound missions
        by Jan. 24.
      n: '[[w.staaveren-u-s-air-force]], 120. Check: the page prints Jan. 6–7, 1968. To check: Msgs, COMUSMACV to CINCPAC,
        091716Z Jan 66, JCS to CINCPAC, 120426Z Jan 66, AmEmb Bangkok to SECSTATE, SECDEF, JCS, 250855Z Jan 66 (cited by [[w.staaveren-u-s-air-force]],
        120 n.39). See [[cal.1965-12-06.laos]].'
      src:
        c: 4a46191d
        rows:
        - 'w.staaveren-u-s-air-force 120: all'
        - 'via x.1966-01-09.msgs-comusmacv-to-cincpac-091716z-jan-66: ?'
- add:
    entry:
      id: cal.1966-01-14.laos-2
      when: Jan. 14
      date: '1966-01-14'
      thread: laos
      c: Over Tiger Hound, gunners down an Army OV-1B and so damage a Navy A-4C that its pilot ejects near his carrier.
      n: '[[w.staaveren-u-s-air-force]], 115. See [[cal.1966-01-05.laos]].'
      src:
        c: 2156b454
        rows:
        - 'w.staaveren-u-s-air-force 115: all'
- add:
    entry:
      id: cal.1966-06-16.laos
      when: June 16
      date: '1966-06-16'
      thread: laos
      c: 'The Cricket forward air controllers find a convoy crossing a chokepoint and direct strikes: fourteen trucks destroyed.'
      n: '[[w.staaveren-u-s-air-force]], 114. To check: Trest and Hammons, USAF Operations from Thailand, 1966, pp 103-04;
        msg, Westmoreland to Sharp and Wheeler, 160950Z Jul 66 (cited by [[w.staaveren-u-s-air-force]], 114 n.23). See [[cal.1966-01-17.laos]].'
      src:
        c: 0b744c1e
        rows:
        - 'w.staaveren-u-s-air-force 114: all'
        - 'via x.1966-07-16.msg-westmoreland-to-sharp-and-wheeler-160950z: ?'
        - 'via x.1966.trest-and-hammons-usaf-operations-from-thailand: ?'
- add:
    entry:
      id: cal.1966-04-27.laos
      when: Apr. 27
      date: '1966-04-27'
      thread: laos
      c: 'The Seventh Air Force marks its 1,000th truck destroyed since Tiger Hound began, Dec. 5, 1965. Trucks destroyed
        and damaged: March 344, April 673 (Air Force 540, Navy 31, Marines 102). Sullivan: the enemy can "ill afford to take
        losses of this magnitude."'
      n: '[[w.staaveren-u-s-air-force]], 117. To check: Msg, AmEmb Vientiane to COMUSMACV, 090400Z Apr 66 (cited by [[w.staaveren-u-s-air-force]],
        117 n.32). See [[cal.1965-12-06.laos]]. Names: Sullivan.'
      src:
        c: 0377e557
        rows:
        - 'w.staaveren-u-s-air-force 117: all'
        - 'via x.1966-04-09.msg-amemb-vientiane-to-comusmacv-090400z-apr: ?'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1966-05-09.vietnam-air-war
      when: May 9
      date: '1966-05-09'
      thread: vietnam-air-war
      c: 'McConnell before a Senate subcommittee on the ordnance shortage: commanders "did not need to cancel any sorties
        if they had been more diligent"; some bases short of certain bombs; 470 of a possible 29,000 combat sorties stood
        down or canceled.'
      n: '[[w.staaveren-u-s-air-force]], 142. To check: msg, SECDEF to COMUSMACV, 081853Z Apr 66 (cited by [[w.staaveren-u-s-air-force]],
        142 n.112). See [[cal.1966-04-11.defense]]. Names: McConnell.'
      src:
        c: 8bc8724b
        rows:
        - 'w.staaveren-u-s-air-force 142: all'
        - 'via x.1966-04-08.msg-secdef-to-comusmacv-081853z-apr-66: ?'
      tags:
      - name:mcconnell-john-p
- add:
    entry:
      id: cal.1966-05-01.laos
      when: May 1
      date: '1966-05-01'
      thread: laos
      c: 'The American estimate: 39 North Vietnamese engineering battalions and 24,800 laborers throughout Laos, some 16,000
        maintaining the trail, impressed villagers not counted.'
      n: '[[w.staaveren-u-s-air-force]], 147. To check: Murphy EOTR, Jun 15, 1966; msg, JANAF Vientiane to DIA, 140232Z May
        66; Southeast Asia Military Fact Book, May 66, p C-13 (cited by [[w.staaveren-u-s-air-force]], 147 n.129). See [[cal.1966-04-27.laos]].'
      src:
        c: 6c52d683
        rows:
        - 'w.staaveren-u-s-air-force 147: all'
        - 'via x.1915-06.murphy-eotr-jun-15-1966: ?'
        - 'via x.1966-05-14.msg-janaf-vientiane-to-dia-140232z-may: ?'
        - 'via x.1966-05.southeast-asia-military-fact-book-may-66: ?'
- cite:
    id: cal.1966-07-20.vietnam-air-war
    item: '[[w.staaveren-u-s-air-force]], 151–55, 158 (the infiltration''s shift toward the DMZ; Momyer''s staff briefs Westmoreland
      July 19; by Nov. 30: 72 trucks destroyed and 61 damaged, 1,208 structures and 624, 85 watercraft and 132, 22 gun positions
      and 92; 139 troops killed by air, 339 roads cut, 1,414 secondary explosions)'
- add:
    entry:
      id: cal.1966-07-25.vietnam-air-war
      when: July 25–26
      date: '1966-07-25'
      thread: laos
      c: 'Tally Ho. Several targets hit July 24 and 25; July 25–26, Abersold and Smyth, flying near Dong Ha some four miles
        above the DMZ, call in a strike on what look like trucks: a stack of supplies 200 feet long, an ammunition dump; some
        fifty Air Force and Marine strikes that day from Đà Nẵng, Chu Lai, Cam Ranh Bay and Pleiku.'
      n: '[[w.staaveren-u-s-air-force]], 156. See [[cal.1966-07-20.vietnam-air-war]].'
      src:
        c: 71062e04
        rows:
        - 'w.staaveren-u-s-air-force 156: all'
- add:
    entry:
      id: cal.1966-08-03.vietnam-air-war
      when: Aug. 3
      date: '1966-08-03'
      thread: laos
      also:
      - vietnam-operations
      c: B-52s begin striking the Tally Ho region, the DMZ only, in support of the Marines' Hastings as it closes.
      n: '[[w.staaveren-u-s-air-force]], 157. To check: Msg, COMUSMACV to CTF 77, 7th AF, 291804Z Sep 66 (cited by [[w.staaveren-u-s-air-force]],
        157 n.12); msg, CINCPACAF to CSAF, 120341Z Aug 66 (cited by [[w.staaveren-u-s-air-force]], 157 n.15). See [[cal.1966-07-20.vietnam-air-war]].'
      src:
        c: fd8755bc
        rows:
        - 'w.staaveren-u-s-air-force 157: all'
        - 'via x.1966-08-12.msg-cincpacaf-to-csaf-120341z-aug-66: ?'
        - 'via x.1966-09-29.msg-comusmacv-to-ctf-77-7th-af: ?'
- add:
    entry:
      id: cal.1966-08-28.vietnam-air-war
      when: Aug. 28
      date: '1966-08-28'
      thread: laos
      c: Donalson allows the O-1s over Tally Ho again at night, for visual reconnaissance only, after Abersold's pleas; Aug.
        28–Sept. 1, twenty-nine trucks seen, one with lights, most at up to thirty miles an hour.
      n: '[[w.staaveren-u-s-air-force]], 157. See [[cal.1966-07-20.vietnam-air-war]].'
      src:
        c: 074088cf
        rows:
        - 'w.staaveren-u-s-air-force 157: all'
- add:
    entry:
      id: cal.1966-08-19.laos
      when: Aug. 19–20
      date: '1966-08-19'
      thread: laos
      c: 'Tiger Hound pilots, guided by O-1 forward air controllers, attack a truck park on the Sihanouk Trail: seventeen
        trucks destroyed or damaged.'
      n: '[[w.staaveren-u-s-air-force]], 161. To check: Briefing, Talbott for McNamara, Oct 9, 1966 (cited by [[w.staaveren-u-s-air-force]],
        161 n.25). See [[cal.1966-04-27.laos]].'
      src:
        c: c70b5d73
        rows:
        - 'w.staaveren-u-s-air-force 161: all'
        - 'via x.1966.briefing-talbott-for-mcnamara-oct-9-1966: ?'
- add:
    entry:
      id: cal.1966-07-11.laos
      when: July 11–30
      date: '1966-07-11'
      thread: laos
      c: Nine air-supported Shining Brass teams probe the trail, July 11–30, flown in and out by VNAF CH-34s, covered by Tiger
        Hound aircraft and Army UH-1Bs; twelve forays in August.
      n: '[[w.staaveren-u-s-air-force]], 165. Check: the span; the page reads "July 1 1 and 30." See [[cal.1966-05-26.laos]].'
      src:
        c: 40223f78
        rows:
        - 'w.staaveren-u-s-air-force 165: all'
- add:
    entry:
      id: cal.1966-07-30.laos
      when: July 30
      date: '1966-07-30'
      thread: laos
      c: Team Montana, lifted out in haste after a firefight at thirty feet, leaves two Special Forces team leaders and three
        tribesmen missing. Team Texas, July 30–Aug. 1, brings out two women who tell of some 100 troops carrying supplies
        south from a nearby valley.
      n: '[[w.staaveren-u-s-air-force]], 166–67. To check: msg, AmEmb Saigon to SECSTATE, 090230Z Oct 66; memo, Leonard Unger,
        Dep Asst SECSTATE for Far Eastern Affairs to Under SECSTATE, subj: Expansion of Shining Brass Operations in Laos,
        Dec 2, 1966 (cited by [[w.staaveren-u-s-air-force]], 167 n.49). See [[cal.1966-07-11.laos]].'
      src:
        c: 5653b80c
        rows:
        - 'w.staaveren-u-s-air-force 166–67: all'
        - 'via x.1966-10-09.msg-amemb-saigon-to-secstate-090230z-oct: ?'
        - 'via x.1966.memo-leonard-unger-dep-asst-secstate-for: ?'
- add:
    entry:
      id: cal.1966-08-07.laos
      when: Aug. 7–9
      date: '1966-08-07'
      thread: laos
      c: 'Team Iowa, reconnoitering, draws twenty-three Tiger Hound strikes and fourteen Army armed helicopter sorties: fifty-nine
        huts or structures destroyed, four secondary explosions; three enemy killed in ground actions, two prisoners taken.'
      n: '[[w.staaveren-u-s-air-force]], 165–66. See [[cal.1966-07-11.laos]].'
      src:
        c: 024c8781
        rows:
        - 'w.staaveren-u-s-air-force 165–66: all'
- add:
    entry:
      id: cal.1966-10-03.laos
      when: Oct. 3
      date: '1966-10-03'
      thread: laos
      c: The American-led Shining Brass teams renamed Spike teams.
      n: '[[w.staaveren-u-s-air-force]], 166. See [[cal.1966-07-11.laos]].'
      src:
        c: da186be7
        rows:
        - 'w.staaveren-u-s-air-force 166: all'
- add:
    entry:
      id: cal.1966-11-07.laos
      when: Nov. 7
      date: '1966-11-07'
      thread: laos
      c: The Shining Brass exploitation platoons redesignated Hornet Force; Westmoreland names the company and battalion forces
        Havoc Force and Haymarket Force.
      n: '[[w.staaveren-u-s-air-force]], 166. See [[cal.1966-10-03.laos]]. Names: Westmoreland.'
      src:
        c: 43a5df12
        rows:
        - 'w.staaveren-u-s-air-force 166: all'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1966-10-07.laos
      when: Oct. 7
      date: '1966-10-07'
      thread: laos
      c: 'Slam I, the first Slam strike: after Spike Team Colorado''s probe of Oct. 3–7 near Route 110, the Sihanouk Trail,
        the B-52s strike the team''s area on its lift-out, then tactical strikes and leaflets. No team enters; results unknown.
        Sullivan''s staff oversees the targeting.'
      n: '[[w.staaveren-u-s-air-force]], 159, 166, 186 n.. See [[cal.1966-07-11.laos]]. Names: Sullivan.'
      src:
        c: 720d22b7
        rows:
        - 'w.staaveren-u-s-air-force 159, 166, 186 n.: all'
      tags:
      - name:sullivan-william-h
- add:
    entry:
      id: cal.1966-10-13.laos
      when: Oct. 13
      date: '1966-10-13'
      thread: laos
      c: The second Slam strike, again near Route 110, where a second team had gone in Oct. 11; a platoon reconnoiters the
        area after the B-52s and finds few signs of the enemy.
      n: '[[w.staaveren-u-s-air-force]], 159, 167. See [[cal.1966-10-07.laos]].'
      src:
        c: 620fba2f
        rows:
        - 'w.staaveren-u-s-air-force 159, 167: all'
- add:
    entry:
      id: cal.1966-11-16.laos
      when: Nov. 16
      date: '1966-11-16'
      thread: laos
      c: The Seventh Air Force tells all units of the waiver for forward air control strikes on vehicles "on or within 200
        yards of a motorable road"; Vientiane and Washington keep a "pro forma" RLAF observer aboard the ABCCCs.
      n: '[[w.staaveren-u-s-air-force]], 164. To check: Msgs, COMUSMACV to AmEmb Vientiane, 14071 1Z Nov 66, AmEmb Vientiane
        to COMUSMACV (Swank to Westmoreland), 151130Z Nov 66, 7th AF to all Tiger Hound addressees, 160952Z Nov 66 (cited
        by [[w.staaveren-u-s-air-force]], 164 n.36). See [[cal.1966-01-14.laos]].'
      src:
        c: 753b8586
        rows:
        - 'w.staaveren-u-s-air-force 164: all'
        - 'via x.1966-11-15.msgs-comusmacv-to-amemb-vientiane-14071-1z: ?'
- cite:
    id: cal.1966-10-21.laos
    item: '[[w.staaveren-u-s-air-force]], 165 (Thao Ma and twenty-five pilots fail and flee with most of their planes to Thailand;
      the RLAF''s activities suspended some three weeks; Shining Brass and Cricket West cut back for want of observers)'
- add:
    entry:
      id: cal.1966-11-08.laos
      when: Nov. 8
      date: '1966-11-08'
      thread: laos
      c: An Air Force O-1 carrying a forward air controller and a Shining Brass observer downed by ground fire; a rescue aircraft
        saves the observer.
      n: '[[w.staaveren-u-s-air-force]], 167. See [[cal.1966-10-03.laos]].'
      src:
        c: 445a5d22
        rows:
        - 'w.staaveren-u-s-air-force 167: all'
- add:
    entry:
      id: cal.1966-06-21.laos
      when: June 21
      date: '1966-06-21'
      thread: laos
      c: The A-26Ks at Nakhon Phanom, Detachment 1 of the 603d Air Commando Squadron (Big Eagle), begin largely orientation
        missions, call sign Nimrod; in ten days one shot down, two damaged; they are switched to night work.
      n: '[[w.staaveren-u-s-air-force]], 174. To check: Seventh Air Force Commander’s Operations Command Book, Sep 22, 1966,
        Sec J; Porter, Interdiction in SEA, 1965-1966, p 58 (cited by [[w.staaveren-u-s-air-force]], 174 n.71). See [[cal.1966-01-17.laos]].'
      src:
        c: 5ea837ef
        rows:
        - 'w.staaveren-u-s-air-force 174: all'
        - 'via x.1922-09.seventh-air-force-commander-s-operations-command: ?'
        - 'via x.1965.porter-interdiction-in-sea-1965-1966-p: ?'
- add:
    entry:
      id: cal.1966-07-01.laos
      when: July 1
      date: '1966-07-01'
      thread: laos
      c: The A-26Ks at Nakhon Phanom begin a ninety-day night combat test against trucks.
      n: '[[w.staaveren-u-s-air-force]], 170. To check: Msgs, COMUSMACV to CINCPAC, 051035Z Jul 66, USARPAC to CINCPAC, 180402Z
        Jul 66; Mission Briefing, 23d TASS, Oct 66 (cited by [[w.staaveren-u-s-air-force]], 170 n.57). See [[cal.1966-06-21.laos]].'
      src:
        c: 862fa89d
        rows:
        - 'w.staaveren-u-s-air-force 170: all'
        - 'via x.1966-07-05.msgs-comusmacv-to-cincpac-051035z-jul-66: ?'
        - 'via x.1966-10.mission-briefing-23d-tass-oct-66: ?'
- add:
    entry:
      id: cal.1966-07-24.laos
      when: July 24
      date: '1966-07-24'
      thread: laos
      c: The first major Cricket West operations, after gunners down a Laotian T-28 supporting a FAR unit at Thakhek; two
        Air Force O-1s answer its call.
      n: '[[w.staaveren-u-s-air-force]], 173. See [[cal.1966-06-21.laos]].'
      src:
        c: 944e3a20
        rows:
        - 'w.staaveren-u-s-air-force 173: all'
- add:
    entry:
      id: cal.1966-09-27.laos
      when: Sept. 27
      date: '1966-09-27'
      thread: laos
      c: Some 400 enemy near Thakhek threaten to overrun Groupe Mobile 12; A-26Ks under O-1 control bomb and strafe them,
        a cave among the targets.
      n: '[[w.staaveren-u-s-air-force]], 173. See [[cal.1966-07-24.laos]].'
      src:
        c: 50ab2133
        rows:
        - 'w.staaveren-u-s-air-force 173: all'
- add:
    entry:
      id: cal.1966-10-25.laos
      when: Oct. 25
      date: '1966-10-25'
      thread: laos
      c: 'Pettigrew, Bond and Vientiane, faced with a Pathet Lao and North Vietnamese buildup in Barrel Roll, divert A-26K
        sorties there from Cricket: four A-26K, twelve A-1E and eighteen F-105 sorties a day. They end the Bango/Whiplash
        strip alert from Thai bases, begun April 1965, from Nov. 1.'
      n: '[[w.staaveren-u-s-air-force]], 175–76. See [[cal.1966-07-24.laos]]. Names: Bond.'
      src:
        c: 0970f39c
        rows:
        - 'w.staaveren-u-s-air-force 175–76: all'
      tags:
      - name:bond-julian
- add:
    entry:
      id: cal.1966-10-11.laos
      when: Oct. 11
      date: '1966-10-11'
      thread: laos
      c: The first weekly targeting meeting of the air attaché's office, the Seventh/Thirteenth Air Force's deputy commander,
