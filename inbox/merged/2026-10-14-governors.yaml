patch: governors
by: claude
ops:
  - add:
      entry:
        id: cal.1960-11-08.governors
        when: Nov. 8
        date: '1960-11-08'
        thread: governors
        also: [elections-1960]
        c: 'Twenty-seven governors elected: Democrats 15, Republicans 12. Each party took six or seven States from the other. Kerner (D) over Governor Stratton in Illinois; Volpe (R) in Massachusetts; Sanford (D) in North Carolina; Andersen (R) over Freeman in Minnesota. Governorships after the election: Democrats 34, Republicans 16.'
        n: '[Wikipedia, "1960 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1960_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1960-11-08.elections-1960]]. Names: Kerner, Sanford (K–J Cong. III.F); Volpe (Opp. III.H); Freeman (K–J Adm. III.G).'
        tags: ['governors:1960-11-08', 'name:kerner-otto', 'name:volpe-john-a', 'name:sanford-terry', 'name:freeman-orville-l']
  - add:
      entry:
        id: cal.1962-11-06.governors
        when: Nov. 6
        date: '1962-11-06'
        thread: governors
        also: [elections-1962]
        c: 'Thirty-five governors elected: Democrats 21, Republicans 14; each party took seven States from the other. Brown (D) over Nixon in California; Rockefeller (R) re-elected in New York; Romney (R) over Governor Swainson in Michigan; Scranton (R) in Pennsylvania; Rhodes (R) over Governor DiSalle in Ohio; Bellmon (R), Oklahoma''s first Republican governor. Minnesota to a recount.'
        n: '[Wikipedia, "1962 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1962_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1962-11-06.elections-1962]]. Names: Brown (K–J Cong. III.F); Nixon (Opp. III.E); Rockefeller, Romney, Scranton, Rhodes, Bellmon (Opp. III.H).'
        tags: ['governors:1962-11-06', 'name:brown-edmund-g', 'name:nixon-richard-m', 'name:rockefeller-nelson', 'name:romney-george-w', 'name:scranton-william-w', 'name:rhodes-james-a', 'name:bellmon-henry']
  - add:
      entry:
        id: cal.1964-11-03.governors
        when: Nov. 3
        date: '1964-11-03'
        thread: governors
        also: [elections-1964]
        c: 'Twenty-five governors elected: Democrats 17, Republicans 8. Republicans took Massachusetts (Volpe), Washington (Evans) and Wisconsin; Democrats Arizona and Utah. Kerner (D) over Percy in Illinois; Romney (R) re-elected in Michigan. Governorships after the election: Democrats 33, Republicans 17.'
        n: '[Wikipedia, "1964 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1964_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1964-11-03.elections-1964]]. Names: Kerner (K–J Cong. III.F); Volpe, Evans, Romney (Opp. III.H); Percy (Opp. III.B).'
        tags: ['governors:1964-11-03', 'name:volpe-john-a', 'name:evans-daniel-j', 'name:kerner-otto', 'name:percy-charles-h', 'name:romney-george-w']
  - add:
      entry:
        id: cal.1966-11-08.governors
        when: Nov. 8
        date: '1966-11-08'
        thread: governors
        also: [elections-1966]
        c: 'Thirty-five governors elected: Republicans 23, Democrats 12. Republicans took ten States, Democrats two. Reagan (R) over Governor Brown in California; Rockefeller (R) re-elected in New York; Winthrop Rockefeller (R) in Arkansas and Kirk (R) in Florida, each State''s first Republican governor since Reconstruction; Agnew (R) over Mahoney in Maryland; Lurleen Wallace (D) in Alabama. Georgia: no majority; to the legislature. Governorships after the election: 25 each.'
        n: '[Wikipedia, "1966 United States gubernatorial elections"](https://en.wikipedia.org/wiki/1966_United_States_gubernatorial_elections); each race''s figures as its article gives them, with the source it cites (the table). [[w.sabato-goodbye-to-good-time]]. See [[cal.1966-11-08.elections-1966]]. Names: Brown (K–J Cong. III.F); Reagan, Nelson Rockefeller, Winthrop Rockefeller, Kirk, Agnew (Opp. III.H); Mahoney, Lurleen Wallace (K–J Cong. III.K).'
        tags: ['governors:1966-11-08', 'name:reagan-ronald', 'name:brown-edmund-g', 'name:rockefeller-nelson', 'name:rockefeller-winthrop', 'name:kirk-claude-r-jr', 'name:agnew-spiro-t', 'name:mahoney-george-p', 'name:wallace-lurleen-b']
