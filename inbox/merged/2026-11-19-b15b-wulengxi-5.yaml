        Revolution.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 854, 860 (decided at the meeting of Nov. 4; "a friendly gesture" not made in several years, 854; Liu at the embassy "that evening," 860). Names: Liu Shaoqi.
