      also:
      - soviet-union
      c: The Central Committee decides to resume the anti-revisionist articles from Oct. 11, the National Day guests gone; Mao tells the writers to hurry the Tenth Commentary and the other articles.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 827 (after National Day; the pause since Sept. 15). Made public: 1999. See [[cal.1964-09-15.china-leadership-4]]. Names: Mao Zedong. Check: the day; Wu
        gives none before Oct. 10.'
      tags:
      - polity:prc
