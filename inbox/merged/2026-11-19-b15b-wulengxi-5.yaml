- add:
    entry:
      id: cal.1964-12-14.china-leadership
      when: Dec. 14
      date: '1964-12-14'
      thread: china-leadership
      also:
      - latin-america
      - soviet-union
      c: 'Mao receives the nine-party Latin American delegation. The polemic cannot stop: China has answered only the CPSU open letter, in nine articles; the CPSU''s many other documents are unanswered;
        parties which attacked China cannot deny it an answer; a hundred, a thousand, ten thousand years if need be. China will attend no conference of 26, 60 or 80 parties the CPSU called alone; the new
        leaders'' decision differs from Khrushchev''s only in its coat. Mao tells them he suspects they come as the CPSU''s emissaries: welcome, but their words not accepted.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 911–912 (Dec. 14; the delegation went back to Moscow, its errand failed, 912). Made public: 1999. See [[cal.1964-12-12.china-leadership-4]]. Names: Mao
        Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - polity:cuba
      - vis:only:prc+cuba
