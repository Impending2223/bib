      when: Nov. 8
      date: '1964-11-08'
      time_range:
      - 1964-11-07T22:00Z
      - 1964-11-08T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Morning. Mao presides over the Standing Committee in the Yinian Tang on the delegation''s cable. Liu, Deng and Peng Zhen are angry; the new CPSU leaders still do Khrushchev''s thing, though Malinovsky''s
        talk with Chuikov shows they differ. Agreed: a formal, serious protest in the Central Committee''s name, demanding a formal reply; take the offensive in Moscow, "not fear a row"; Mao: "now they
        have a pigtail in our hands"; even if they apologize no other business, no conference, no preparatory meeting, no bilateral talks; the polemic goes on after the holiday. Deng dictates, Wu writes,
        a telegram to the delegation: protest, offensive on the reversal of friend and foe; no talk of the conference or bilateral talks; no stop to the polemic unless they admit error. Mao reads it; Yang
        Shangkun sends it by "AAAA" cable, to reach the delegation before the Soviet leaders come to eat.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 862–865 (the meeting; the three points of the telegram; the sending). Made public: 1999. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
      src:
