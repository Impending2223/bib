      when: Nov. 3
      date: '1964-11-03'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao presides over the Standing Committee on what the delegation is to do if the CPSU raises the conference. Stand on principle against any hasty, illegal, splitting meeting; do not propose putting
        the preparatory meeting off, nor insist on talks in May 1965. If the CPSU proposes a preparatory meeting: agree in principle, the date to be fixed; if it proposes putting it off: agree, but no date,
        all parties to be consulted; if it proposes bilateral talks: agree in principle, the date left open, China not to ask. Mao: "fire reconnaissance": Zhou and He Long are the shells; no program, no
        agreement.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 848–849 (Nov. 3; the points; "fire reconnaissance," 849). Made public: 1999. Names: Mao Zedong, Zhou Enlai, He Long. Check: Zhou''s chronology (II, 677)
        lists his meetings at Mao''s on Oct. 16, 19, 27, 29, Nov. 1 and 4, not Nov. 3.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:he-long
      - vis:only:prc
      src:
        c: adc88c86
