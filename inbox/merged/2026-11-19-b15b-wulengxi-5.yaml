- add:
    entry:
      id: cal.1964-10-14.china-leadership-2
      when: Oct. 14
      date: '1964-10-14'
      time_range:
      - 1964-10-14T14:00Z
      - 1964-10-14T16:00Z
      time_band: night
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking, late at night. Soviet ambassador Chervonenko telephones the Central Committee''s General Office asking an urgent meeting with Chinese leaders; Yang Shangkun asks Liu Shaoqi, who sends
        Wu Xiuquan, who receives him in his home. Chervonenko, on the CPSU Central Committee''s instruction: that day the Central Committee relieved Khrushchev; Brezhnev first secretary, Kosygin chairman
        of the Council of Ministers; Mikoyan remains chairman of the Supreme Soviet''s Presidium.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 829–830 ("the late night of Oct. 14"; Liu''s choice of Wu Xiuquan; Yang Shangkun reported at once to Mao, Liu, Zhou and Deng; the General Office told the
        whole Politburo early next morning; the Soviet announcement, Oct. 16, 831). Made public: 1999. To check: [[w.khrushchev-1964-stenogrammy]] (a Soviet record of the call, if any). Names: Chervonenko,
        Liu Shaoqi, Khrushchev, Brezhnev, Kosygin, Mikoyan.'
      tags:
      - polity:prc
      - polity:ussr
      - name:liu-shaoqi
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - name:mikoyan-anastas
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
      src:
        c: e737b75c
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 829–830: all'
- add:
    entry:
      id: cal.1964-10-14.china-leadership-3
      when: Oct. 14
      date: '1964-10-14'
      time_range:
      - 1964-10-14T11:00Z
      - 1964-10-14T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - testing
      c: 'Diaoyutai, building 6, the evening. Zhou Enlai, the Central Committee having approved the firing of the first atomic device on Oct. 16, has Wu Lengxi, Qiao Guanhua and Yao Zhen draft the government''s
        statement and a news communiqué: the Soviet breach of the agreement and withdrawal of the experts, China''s own work since, its policy of the total prohibition of nuclear weapons; the hour of firing
        to wait on the weather and the site. Both drafts done soon after midnight.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 831–833 (Zhou''s summons that afternoon; after supper at building 6, his usual quarters; the drafts by soon after midnight, Zhou satisfied, to go to Mao
        after a few changes; his double-yolk noodles, "two bombs," the round one and the long one). Made public: 1999. See [[cal.1964-10-14.china-leadership]]. Names: Zhou Enlai, Qiao Guanhua.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:qiao-guanhua
      - vis:only:prc
      src:
        c: f137b2fe
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 831–833: all'
