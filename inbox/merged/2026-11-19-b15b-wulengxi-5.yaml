      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 927 (Mar. 22). Made public: 1999. See [[cal.1965-03-21.china-leadership-7]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
