      date: '1965-02-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking. The third volume of *Khrushchev''s Speeches* is published (1954: 24 pieces, 325,000 words), and the *Renmin ribao* prints its publisher''s note: his eleven years in office left over ten
        million words, 30-odd volumes to come; the secret report to the 20th Congress, never published in Moscow, left out for now; the volumes an encyclopedia of modern revisionism.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 906–907 (Feb. 26, 1965; the first and second volumes, 1932–53, published before).'
      tags:
      - polity:prc
      src:
        c: 469c62f2
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 906–907: all'
- add:
    entry:
      id: cal.1965-03-01.soviet-union
      when: Mar. 1–5
      date: '1965-03-01'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The CPSU holds what it now calls a "consultative meeting" of the communist and workers'' parties, Mar. 1 to 5. Present: 16 parties'' delegates and observers, split-offs from Brazil and
        Australia, and the Dange group of the Indian party, 19 in all. Seven parties refuse: Albania, Vietnam, Indonesia, China, Korea, Romania, Japan, five of them governing parties.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 921–922 (Mar. 1–5; "16 parties'' delegates and observers," the 19 "units"; the seven refusals).'
      tags:
      - polity:ussr
      src:
        c: 675d915e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 921–922: all'
- add:
    entry:
      id: cal.1965-03-10.soviet-union
      when: Mar. 10
      date: '1965-03-10'
      thread: soviet-union
      also:
      - china-leadership
      c: 'Moscow. The communique of the March meeting is published: a "consultation of delegations of communist and workers'' parties," not tied to a conference of the parties; it calls for ending the open
        polemic, condemns a "factional" Chinese party, and asks "active, all-round" preparation of an international conference "at a suitable time."'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 921–922, 928–929 (the communique, Mar. 10; the points Wu''s article answers).'
      tags:
      - polity:ussr
      src:
        c: dba30f80
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 921–922, 928–929: all'
