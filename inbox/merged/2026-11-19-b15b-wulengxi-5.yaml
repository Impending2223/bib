- add:
    entry:
      id: cal.1964-07-12.china-leadership-3
      when: July 12
      date: '1964-07-12'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Politburo, Mao presiding, approves the final text of the Ninth Commentary, the members going through it paragraph by paragraph. In this last revision Mao rewrites the second of the 15 points
        himself: the socialist period a long historical stage, with classes and class struggle; the contest of who wins taking a hundred to several hundred years; better to prepare for longer and to see
        things as harder.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 12, 1964 (the Politburo''s approval). [[w.lengxi-shinian-lunzhan-1956-1966]], 784 (the final text July 12; "paragraph by paragraph"; the point as Mao rewrote
        it; the others'' changes, many in wording). Made public: 1999. See [[cal.1964-07-05.china-leadership]]. Names: Mao Zedong. Check: the Mao chronology has the "hundred to several hundred years" under
        the revisions from July 5.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: e5b5c3bb
        rows:
        - 'w.zedong-mao-zedong-nianpu V, July 12, 1964: A'
        - 'w.lengxi-shinian-lunzhan-1956-1966 784: all'
- add:
    entry:
      id: cal.1964-07-23.china-leadership-3
      when: July 23
      date: '1964-07-23'
      thread: china-leadership
      also:
      - soviet-union
      - korea-leadership
      c: 'Mao presides over the Standing Committee. Zhou Enlai reports on his talk with Kim Il Sung in Korea on the war in Vietnam and brings back the Korean party''s views on the polemic. Liu Shaoqi and
        Deng are out of Peking; Mao has Peng Zhen tell them to return for the reply to the CPSU letter. Mao proposes dropping the eight conditions for ending the open polemic from the draft reply: ask only
        that the CPSU print China''s answers as China has printed its attacks; Khrushchev will be angry and may risk all. The Korean party asks what if the CPSU forces the preparatory meeting; Mao: to be
        weighed.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 796–798 (July 23; Zhou back from Korea, where he had briefed Kim Il Sung on the war in Vietnam; the eight conditions; the Korean party''s question; Mao:
        wait for Liu and Deng). Made public: 1999. See [[cal.1964-07-23.china-leadership]]. Names: Mao Zedong, Zhou Enlai, Kim Il Sung, Liu Shaoqi, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:kim-il-sung
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
      src:
        c: 52e63fe0
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 796–798: all'
- add:
    entry:
      id: cal.1964-07-30.soviet-union-2
      when: July 30
      date: '1964-07-30'
      thread: soviet-union
      also:
      - china-leadership
      c: 'The CPSU Central Committee answers the Chinese reply of July 28 within two days: it invites the 26 parties of the 1960 drafting committee to be in Moscow by Dec. 15, 1964, to start work on preparing
        the conference even if some send no one; the conference itself around mid-1965, with all 81 parties of 1960 invited, no refusal a ground for delay.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 808–810 (July 30; Dec. 15; mid-1965; read by the Chinese at Beidaihe, two days before the meeting of Aug. 4, 810). Made public: 1999. To check: the letter
        of July 30, 1964 (the text, and its printing in 1964). Check: Wu''s summary only.'
      tags:
      - polity:ussr
      - polity:prc
      - vis:only:ussr+prc
      src:
        c: 7265bdea
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 808–810: all'
