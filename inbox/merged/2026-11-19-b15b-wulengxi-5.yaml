      when: Nov. 21
      date: '1964-11-21'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The *Hongqi* editorial "How Khrushchev Came to Fall," in its double issue nos. 21–22, printed in the *Renmin ribao*: his fall expected, the bankruptcy of modern revisionism; 12 charges; he fell
        for his revisionist line, not for age or health as the CPSU communiqué and *Pravda* said; "Khrushchevism without Khrushchev" will not succeed. Nothing on the new leaders.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 900–903 (Nov. 21; settled at the Standing Committee of Nov. 18; the plate of the *Renmin ribao*, 901; from Nov. 21 to the end of January the paper reprinted
        the comments of twenty-odd parties on the fall, 903–906). See [[cal.1964-11-18.china-leadership]].'
      tags:
      - polity:prc
      src:
        c: 0bb4ab0e
        rows:
