- add:
    entry:
      id: cal.1964-11-07.china-leadership-7
      when: Nov. 7
      date: '1964-11-07'
      time_range:
      - 1964-11-07T16:00Z
      - 1964-11-07T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
      thread: china-leadership
      also:
      - soviet-union
      c: 'Moscow, the Kremlin reception for the anniversary. Marshal Malinovsky, among Soviet generals around Marshal Chuikov, says to He Long: we have removed Khrushchev, you do the same, remove Mao Zedong,
        and we shall be reconciled. He Long, angry, answers that the two parties are not alike, the idea is wrong and will not be realized; Chuikov tells Malinovsky he sees it differently. Zhou, at the
        head table, tells Brezhnev, Suslov and Mikoyan it is a grave provocation; Brezhnev sends to inquire, then says Malinovsky was drunk and speaks for no one; Zhou: not a drunkard''s slip but a drunkard''s
        truth. Zhou leaves the reception early.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 860–862 (the evening reception; the interpreters'' account; Brezhnev''s inquiry and answer; Zhou''s early exit). Made public: 1999. See [[cal.1964-11-07.china-leadership-2]].
        Names: He Long, Malinovsky, Zhou Enlai, Brezhnev, Suslov, Mikoyan.'
      tags:
      - polity:prc
      - polity:ussr
      - name:he-long
      - name:malinovsky-rodion-y
      - name:zhou-enlai
      - name:brezhnev-leonid
      - name:suslov-mikhail-a
      - name:mikoyan-anastas
      - vis:only:prc+ussr
      src:
