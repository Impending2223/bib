      c: The *Renmin ribao* prints the Brazilian party Central Committee's statement against the CPSU's splitting meeting.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 827 ("the same day," Oct. 11). See [[cal.1964-10-11.china-leadership-5]].'
