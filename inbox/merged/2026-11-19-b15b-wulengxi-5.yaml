      c: 'Mao presides over the Standing Committee, Wu attending. It reads the *Pravda* editorial of Oct. 17, received that day: it names no difference of principle, blames lack of collective leadership
        and the personality cult, subjectivism and hasty decisions, and promises to carry out the line of the 20th to 22nd Congresses and the program. The line is unchanged; Mao''s "watch quietly" stands.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 840 (Oct. 18; the editorial of Oct. 17). Made public: 1999. Names: Mao Zedong.'
