      also:
      - soviet-union
      c: The *Renmin ribao* prints the joint statement of the Indonesian and Ceylonese parties asking full preparation and agreement for any conference of the parties.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 827 (Oct. 12).'
      tags:
