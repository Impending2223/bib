      when: Mar. 5
      date: '1966-03-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Liu Shaoqi calls a small meeting on whether to attend the CPSU''s 23rd Congress: Zhou, Deng, Peng Zhen, Chen Yi, Kang Sheng, Liu Ningyi and Wu Lengxi. All lean to sending no delegation: at the
        22nd Congress Zhou''s delegation was caught unready by the attack on Albania; the new leaders practice Khrushchevism without Khrushchev; the Congress is the CPSU''s own, no conference of parties,
        and China need not go even if Vietnam and Korea do.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 935 (Mar. 5; those present; after the meeting Wu''s writers drafted a telephone report, which Peng Zhen and Liu read and the General Office sent to Mao
        at Wuchang, no day given). Made public: 1999. Names: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi, Kang Sheng.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - name:chen-yi
      - name:kang-sheng
      - vis:only:prc
      src:
        c: 453554c2
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 935: all'
- add:
    entry:
      id: cal.1966-03-10.china-leadership-4
      when: Mar. 10
      date: '1966-03-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Liu Shaoqi calls a smaller meeting: Peng Zhen, Chen Yi, Li Fuchun and Kang Sheng, Liu Ningyi and Wu present; Zhou is at Xingtai for the earthquake, Deng on the southwestern third-line tour. Mao
        has not answered the report of Mar. 5. Peng proposes another view for Mao: attend the 23rd Congress as guests, a matter of courtesy, with no tie to a conference, as Vietnam and Korea will; the others
        find it weak and incline to stay away. Liu: the matter was settled and reported; this meeting is not the Standing Committee nor the Politburo.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 936–937 (Mar. 10; Peng''s view; Liu''s limits; afterward Peng drafted the second telephone report himself, Wu and Yao Zhen helping with the wording, and
        no answer came). Made public: 1999. Names: Liu Shaoqi, Peng Zhen, Chen Yi, Li Fuchun, Kang Sheng, Zhou Enlai, Deng Xiaoping. Check: Zhou''s whereabouts: Wu says Xingtai; Zhou''s chronology has him
        at Shijiazhuang and Longyao that day.'
      tags:
