    set:
      c: 'Mao revises, from July 5, in several meetings, the ninth commentary on the CPSU open letter: retitled "On Khrushchov''s Phony Communism and Its Historical Lessons for the World". He changes the
        time the contest between socialism and capitalism needs from "quite long" to "very long", adding: not in decades, a hundred to several hundred years; prepare for longer, not shorter.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 5, 1964. Made public: 1999. Names: Mao Zedong.'
