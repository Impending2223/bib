      c: Diaoyutai. Deng Xiaoping, the day after the drafting group sends him the much-revised Ninth Commentary, presides over the group's full meeting, which reads, discusses and revises the draft paragraph
        by paragraph.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 779 ("the end of June"; Deng "the next day," at Diaoyutai). Made public: 1999. Names: Deng Xiaoping. Check: the days; Wu gives none. The meeting may be
        Deng''s of June 30 at Diaoyutai on the reply to the CPSU letter (796).'
      tags:
      - polity:prc
