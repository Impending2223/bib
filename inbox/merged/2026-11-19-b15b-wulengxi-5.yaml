      date: '1964-10-12'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The *Renmin ribao* prints the Albanian Party of Labor''s open letter to the CPSU''s members: the Khrushchev group''s illegal conference a plot to split the movement; the Albanian party will not
        answer the CPSU letter of July 30.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 827–828 ("the same day," Oct. 12). See [[cal.1964-10-12.china-leadership-5]].'
      tags:
      - polity:prc
      src:
