      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 800–801 (the Politburo decides broadcast that evening and printing July 29, 800; the plate: the issue of July 31, 1964, 801). See [[cal.1964-07-28.china-leadership]].
        Check: Wu says the Politburo fixed the broadcast for the evening of July 28 and the printing for July 29 (800); the plate he prints is of the issue of July 31 (801).'
      tags:
