- add:
    entry:
      id: cal.1964-08-15.china-leadership
      when: Aug. 15
      date: '1964-08-15'
      thread: china-leadership
      also:
      - soviet-union
      - vietnam-hanoi
      c: 'Beidaihe. Mao calls a meeting in his bungalow on the mountainside. He reports his talk with Lê Duẩn: China will issue a statement backing the Korean and Vietnamese refusal of the 26-party meeting.
        The meeting would tell the Japanese, New Zealand, Australian, Indonesian and other Asian parties China''s stand; Mao: the Politburo to decide in Peking. A short reply to the CPSU letter of July
        30, rebuking its order to hold the meeting, to be drafted.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 812 (Aug. 15; the bungalow on the slope; the proposed notice to the left parties; the short reply). Made public: 1999. Names: Mao Zedong, Lê Duẩn.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:le-duan
      - vis:only:prc
      src:
        c: a19b99f4
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 812: all'
- add:
    entry:
      id: cal.1964-09.china-leadership-2
      when: Sept., early
      date: 1964-09
      at: before 1964-09-01
      thread: china-leadership
      also:
      - soviet-union
      - testing
      c: 'Mao calls a Standing Committee at his residence before leaving Peking to inspect the Four Cleans. He asks after the Tenth, which Wu says deals with Sino-Soviet relations, the border in a separate
        piece. Mao: more anti-revisionist pieces, left-party articles first. He would rather the CPSU hold its December meeting, so that its last card is played. The left parties'' stands surveyed: Korea,
        Vietnam, Japan, Indonesia, Albania against, Italy too after Togliatti''s memorandum. National Day: invite all; Zhou, just out of hospital, proposes the guests make no speeches. Zhou: the first nuclear
        test, before or after National Day; Mao: no hurry, nothing rushed.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 815–819 (the meeting before Mao''s departure; Wu gives no day; Togliatti died soon after, 817; the nuclear test, 818–819). Made public: 1999. Names: Mao
        Zedong, Zhou Enlai. Check: the day: Wu has it soon after the reply of Aug. 30 and shortly before Mao left Peking.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
      src:
        c: 5b6e5553
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 815–819: all'
- add:
    entry:
      id: cal.1964-09-15.china-leadership-4
      when: Sept. 15
      date: '1964-09-15'
      thread: china-leadership
      also:
      - soviet-union
      c: The Chinese press and radio stop printing anti-revisionist articles, their own and the left parties', with National Day near and the guests arriving; the pause lasts to Oct. 10.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 822, 827 (the Center''s decision; "from Sept. 15"; to Oct. 10). Up to mid-September they had printed the New Zealand party secretariat''s statement, Miyamoto''s
        speech, the *Rodong Sinmun* editorial, the Japanese party''s reply of Aug. 26 to the CPSU letter of Apr. 18 (the *Akahata*, Sept. 2) and the Japanese and Indonesian parties'' joint statement (819–822;
        no days).'
      tags:
      - polity:prc
      src:
        c: 677effd3
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 822, 827: all'
