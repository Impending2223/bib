- add:
    entry:
      id: cal.1965-03-19.china-leadership-6
      when: Mar. 19
      date: '1965-03-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wuchang, the East Lake villa. Mao, at his call, meets foreign experts and Asian parties'' delegates brought from Peking by the Liaison Department: Epstein, Frank Coe, Sol Adler. Three questions:
        is the article on the Moscow meeting needed, is it dangerous, what is wrong in it. Epstein: needed, the March meeting wants an answer and many have illusions about the new CPSU leaders; some guests
        fear it too sharp, others say the illusions are the reason. Mao: sharp words may be softened, the tone stays; no loud campaign yet, only what the new leaders have done. The guests would have more
        on unity; Mao has Zhao Yimin, who came with them, take this back to Peking.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 17–19, 1965 (Mar. 19: Adler would stress unity and the anti-imperialist, anti-U.S. camp; Mao: both worth noting). [[w.lengxi-shinian-lunzhan-1956-1966]],
        923–926 (Mar. 19; Coe''s "horse meat sold as steak" for "hanging a sheep''s head, selling dog meat"; Zhao Yimin, deputy head of the Liaison Department). Made public: 1999. See [[cal.1965-03-17.china-leadership]].
        Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 6122ab81
        rows:
        - 'w.zedong-mao-zedong-nianpu V, Mar. 17–19, 1965: A-C, H'
        - 'w.lengxi-shinian-lunzhan-1956-1966 923–926: all'
