      c: The Central Committee receives the CPSU letter signed June 15.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 792 ("five days" after the signing of June 15; Wu prints the day as May 20, a slip of the book''s, seen on the image; the Central Committee at work on the
        Ninth). See [[cal.1964-06-15.soviet-union]]. Check: Wu''s "May 20" for the receipt is read as June 20 from "signed June 15, received five days later."'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc+ussr
      src:
        c: 8275af27
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 792: all'
- add:
    entry:
      id: cal.1964-06-29.china-leadership-3
      when: June 29
      date: '1964-06-29'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao presides over the Standing Committee at his home on the CPSU letter of June 15. All agree it must be answered, point by point or briefly turned back, saying the CPSU, insisting on the meeting,
        means a splitting conference. Mao leans to turning it back briefly: put the strength into the Ninth, "you fight yours, I fight mine"; after the Ninth a Tenth, and many more titles.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 795 (June 29; Wu then back to Diaoyutai, building 8, where the writers had lived over two years). Made public: 1999. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: fc54e0f6
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 795: all'
- add:
    entry:
      id: cal.1964-06-30.china-leadership-5
      when: June 30
      date: '1964-06-30'
      time_range:
      - 1964-06-29T22:00Z
      - 1964-06-30T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai, building 8, the morning. Deng Xiaoping meets the drafting group on the reply to the CPSU letter. The writers favor answering point by point; Deng agrees: argue each question, with reasons
        and some bite, and show Khrushchev reversing himself.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 795–796 (Wu phoned the group''s view to Deng after the Standing Committee of June 29; Deng came "the next morning," June 30; he then reported to Mao, who
        agreed, and had the group split, some on the Ninth, some on the reply, the Tenth and the draft program put off; no day for these). Made public: 1999. Names: Deng Xiaoping.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: da4da3f8
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 795–796: all'
