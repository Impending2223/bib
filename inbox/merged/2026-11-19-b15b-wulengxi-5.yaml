      c: Peking. A delegation of nine Latin American communist parties arrives, under Rodríguez of the Cuban party, with delegates of the parties of Uruguay, Venezuela, Argentina, Mexico, Colombia, Costa
        Rica, Bolivia and Guatemala, to urge China to end the open polemic.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 911 (arriving "at the same time" as the *Pravda* notice of Dec. 12; in talks with the Liaison Department the delegates said the polemic harmed the Latin
        American movements). Made public: 1999. See [[cal.1964-12-12.soviet-union]]. Check: the day; Wu has the arrival "at the same time" as the notice.'
