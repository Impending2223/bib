      - soviet-union
      c: 'The Central Committee receives the CPSU letter: the 26 parties'' drafting committee to start practical work, however many attend; the meeting now a "consultative meeting," to open Mar. 1, 1965.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 908–909 (received Nov. 26, the day after the enlarged Standing Committee; the three points; the CPSU had written other parties before Nov. 24, some, the
        Indonesian among them, only on Dec. 1, 909; Mao to Kosygin cites the letter as of Nov. 24, 918). Made public: 1999. See [[cal.1964-11-25.china-leadership]]; [[cal.1964-11-26.soviet-union-leadership]].'
