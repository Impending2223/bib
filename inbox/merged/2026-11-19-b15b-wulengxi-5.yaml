      c: Peking. The revised Ninth Commentary is printed and sent to Mao, Liu Shaoqi and Zhou Enlai.
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 779 ("the beginning of July"). Made public: 1999. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai. Check: the day; Wu gives none.'
      tags:
      - polity:prc
