      - soviet-union
      c: 'The *Renmin ribao* resumes printing the left parties'' statements: the Peruvian party''s political committee refuses the CPSU''s splitting meeting and its "father party" ways.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 827 (Oct. 11). See [[cal.1964-10.china-leadership]].'
