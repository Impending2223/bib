- add:
    entry:
      id: cal.1964-06-15.soviet-union
      when: June 15
      date: '1964-06-15'
      thread: soviet-union
      also:
      - china-leadership
      c: 'The CPSU Central Committee signs its reply to the Chinese letter of May 7: the Chinese call to put off an international conference is a refusal; the preparatory meeting of the 26 parties is the
        only way out and to meet at once; the 17 parties the Chinese name are wrong; the Sino-Soviet talks are cut loose from the conference and left to "any date agreed."'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 792–794 (signed June 15, 792; the meeting "in the shortest time," 793; talks with China "at any date agreed," 793). Made public: *Renmin ribao*, July 31,
        1964 (the plate, [[w.lengxi-shinian-lunzhan-1956-1966]], 801). To check: the letter, *Renmin ribao*, July 31, 1964 (the text). Check: Wu''s summary only; Wu prints "May 20" for the day the Central
        Committee received it (792), against its signing on June 15 and "five days" after (June 20).'
      tags:
      - polity:ussr
      - polity:prc
      - vis:only:ussr+prc
      src:
        c: 208ba933
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 792–794: all'
