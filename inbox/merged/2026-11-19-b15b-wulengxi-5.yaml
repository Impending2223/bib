      date: '1964-10-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The *Renmin ribao* prints the *Akahata* editorial against a splitting conference: preparation needs at least the agreement of all who attended the 1960 meeting of 81 parties.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 828 (Oct. 13).'
