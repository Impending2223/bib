        n: 'Votes: [Alaska, *Official Returns by Election Precinct, General Election, November 5, 1968*, 7](https://www.elections.alaska.gov/Core/Archive/68GENR/68genr.pdf#page=8) (statewide totals; Gruening''s column "write-ins"; persons voting 82,886), the Clerk''s *Statistics*, and [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), alike. See [[cal.1968-08-27.elections-1968-ak]]; [[cal.1968-11-05.elections-1968]]. Names: Gravel, Rasmuson, Gruening.'
  - add:
      entry:
        id: cal.1965-05-06.legislatures-wa
        when: May 6
        date: '1965-05-06'
        thread: legislatures
        c: 'Washington. The Senate passes H.B. 714 (the House, May 5), redrawing the congressional districts and referring them to the people at the general election of November 1966. Filed with the Secretary of State May 7.'
        n: 'Wash. Laws 1965, Ex. Sess., ch. 152, [2252](https://leg.wa.gov/media/svdj12jt/1965pam2.pdf#page=618); § 10 (the referral) and the passage and filing, [2257](https://leg.wa.gov/media/svdj12jt/1965pam2.pdf#page=623). Check: that ch. 152 is Referendum Bill 16 ([[cal.1966-11-08.legislatures-wa]]). [[w.dixon-democratic-representation]].'
        tags: [state:wa]
  - edit:
      id: cal.1966-11-08.legislatures-wa
      base: f4a69416
      set:
        n: 'Votes: Wash. Secretary of State, [Election Results Archive](https://www.sos.wa.gov/elections/data-research/election-data-and-maps/election-results-and-voters-pamphlets/washington-state-election-results-archive) ("1966 General", Referendum Bill 16); Check: Wash. *Abstract of Votes*, Nov. 8, 1966. The act: Wash. Laws 1965, Ex. Sess., ch. 152 (H.B. 714), [2252](https://leg.wa.gov/media/svdj12jt/1965pam2.pdf#page=618). See [[cal.1965-05-06.legislatures-wa]].'
  - edit:
      id: cal.1966-09-02.alabama-al
      base: 9116c2af
      set:
        c: 'At Wallace''s call, the legislature, in special session, declares void every agreement of a local school board with HEW under the desegregation guidelines and forbids new ones. Wallace approves it, Act No. 252 (H. 446), at 1:05 p.m.'
        n: '[*Acts of Alabama*, Special Session, 1966, 372–377](https://archive.org/details/alabama-acts-1966/page/n370): "Approved September 2, 1966. Time: 1:05 P.M.," [377](https://archive.org/details/alabama-acts-1966/page/n375). Cited in [*Wallace v. Lee*, Motion to Affirm](https://ldfrecollection.org/archives/archives-search/archives-item/8f325deb-eb93-40a1-bf4f-3e634cbbfcdd/wallace-v-lee-motion-to-affirm) (NAACP Legal Defense Fund). [[w.carter-politics-of-rage-1995]]. See [[cal.1964-07-13.alabama]]. Names: Wallace.'
  - add:
      entry:
        id: cal.1963-05-21.alabama-al
        when: May 21
        date: '1963-05-21'
        thread: alabama
        also: [antisubversion]
        c: 'The legislature''s Commission to Preserve the Peace, five members, three of the House and two of the Senate: to investigate persons and groups "engaged in activities of an unlawful nature against the sovereignty of the State of Alabama," hearings open or closed as it decides (H.J.R. 5, Act No. 3). Approved 3:17 p.m.'
        n: '[*Acts of Alabama*, 1963, Regular Session, Act No. 3, 380–381](https://archive.org/details/alabama-acts-1963_v1/page/n372): "Approved May 21, 1963." [[w.carter-politics-of-rage-1995]].'
        tags: [state:al]
  - edit:
      id: cal.1963-10.alabama-al
      base: 82f5115e
      set:
        when: Sept. 16
        date: '1963-09-16'
        c: 'Wallace approves Act No. 514, Alabama''s State Sovereignty Commission: seven members, $50,000, its records closed to the public. Members named Dec. 21.'
        n: '[*Acts of Alabama*, 1963, Regular Session, Act No. 514, 1098–1100](https://archive.org/details/alabama-acts-1963_v3/page/n424): "Approved September 16, 1963. Time: 8:06 A.M." Jeremy Gray, "Alabama Sovereignty Commission formed with sweeping powers, no public oversight (Oct. 5, 1963)," al.com, Oct. 5, 2013, from the *Birmingham News*. [[w.carter-politics-of-rage-1995]]. Names: Wallace.'
  - add:
      entry:
        id: cal.1966-02-24.voting-rights-tx
        when: Feb. 24
        date: '1966-02-24'
        thread: voting-rights
        c: 'Texas. Connally approves S.B. 1, a registration of voters in place of the poll tax: a general registration if the poll tax is finally held void or repealed, and certificates for the elections of 1966 meanwhile. The Senate''s vote 24–6, the House''s 124–22.'
        n: '[Tex. Gen. Laws, 59th Leg., 1st C.S., 1966, ch. 1](https://lrl.texas.gov/scanned/sessionLaws/59-1/SB_1_CH_1.pdf): passed the Senate Feb. 21, the House with amendments Feb. 22, the Senate concurring the same day, 28–0; "Approved Feb. 24, 1966," [13](https://lrl.texas.gov/scanned/sessionLaws/59-1/SB_1_CH_1.pdf#page=13) (the PDF''s page). Tex. Legis. Ref. Library, [S.B. 1, 59th 1st C.S.](https://lrl.texas.gov/legis/billSearch/BillDetails.cfm?legSession=59-1&billTypeDetail=SB&billNumberDetail=1). See [[cal.1966-02-14.voting-rights-tx]]. Names: Connally.'
        tags: [state:tx, name:connally-john]
  - edit:
      id: cal.1966-02-14.voting-rights-tx
      base: 7ea52237
      set:
        c: 'Texas Legislature in special session at Connally''s call, to Feb. 23, on one subject: registration of voters for the 1966 elections, should the poll tax be finally held void, and in its place thereafter.'
        n: 'Tex. Legis. Ref. Library, [59th Legislature, first called session](https://lrl.texas.gov/sessions/specialSessions/specialSessionTopics.cfm?legSessionID=59-1) (the proclamation of Feb. 10). The act: [[cal.1966-02-24.voting-rights-tx]]. See [[cal.1966-02-09.voting-rights-tx]]. Names: Connally.'
  - add:
      entry:
        id: cal.1965-04-05.desegregation-public-places-nv
        when: Apr. 5
        date: '1965-04-05'
        thread: desegregation-public-places
        also: [jobs-and-wages]
        c: 'Nevada. Sawyer approves A.B. 404, the civil rights act: no discrimination by race, color, religion or national origin in places of public accommodation or in employment, with a penalty, civil actions and injunctions; the State''s commission (NRS 233) given findings of fact and rule making.'
        n: '1965 Nev. Stat., ch. 332, [689–696](https://www.leg.state.nv.us/Statutes/53rd/Stats196504.html#Stats196504page689): "[Approved April 5, 1965]." Names: Sawyer.'
        tags: [state:nv, name:sawyer-grant]
  - edit:
      id: cal.1961-08-01.jobs-and-wages-mo
      base: 1a6325ab
      set:
        c: 'Dalton approves S.B. 257, Missouri''s Fair Employment Practices Act: no discrimination in employment by race, creed, color, religion, national origin or ancestry; the Commission on Human Rights to enforce it.'
        n: '*Laws of Missouri*, 1961, [439–443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54161): "Approved August 1, 1961," [443](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/54165) (Missouri State Archives, Missouri Digital Heritage). Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), history and chronology. [[w.lang-grassroots-at-the-gateway]]. Names: Dalton.'
  - tag: {id: cal.1961-08-01.jobs-and-wages-mo, add: [name:dalton-john-m]}
  - edit:
      id: cal.1965-06-30.desegregation-public-places-mo
      base: 00424b0a
      set:
        c: 'Hearnes approves S.C.S.S.B. 246, Missouri''s Public Accommodations Act: no discrimination or segregation in places of public accommodation on the grounds of race, creed, color, religion, national origin or ancestry; private clubs exempted, and barber shops and beauty parlors not within a covered establishment; the Commission on Human Rights to enforce it.'
        n: '*Laws of Missouri*, 1965, [505–508](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56935): "Approved June 30, 1965," [508](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56938) (Missouri State Archives, Missouri Digital Heritage). Missouri State Archives, [Commission on Human Rights records, RG 328.01](https://www.sos.mo.gov/CMSImages/Archives/findingaids/RG328.01.pdf), chronology. See [[cal.1961-08-01.jobs-and-wages-mo]]. Names: Hearnes.'
  - move: {id: cal.1963-10.alabama-al, section: '196309', after: cal.1963-09-16.desegregation-schools}
