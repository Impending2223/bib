      set:
        time_range:
          - 1969-01-20T11:00Z
          - 1969-01-20T17:00Z
        time_zone: America/New_York
        n: 'Statement by the President Upon Signing Five Proclamations Adding Lands to the National Park System, [1968–69 Pub. Papers 1369](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=679) (Jan. 20, 1969); [Proclamation 3889—Establishing Marble Canyon National Monument, Arizona](https://www.presidency.ucsb.edu/documents/proclamation-3889-establishing-marble-canyon-national-monument-arizona) (Jan. 20, 1969); [Proclamation 3887—Enlarging the Arches National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3887-enlarging-the-arches-national-monument-utah) (Jan. 20, 1969); [Proclamation 3888—Enlarging the Capitol Reef National Monument, Utah](https://www.presidency.ucsb.edu/documents/proclamation-3888-enlarging-the-capitol-reef-national-monument-utah) (Jan. 20, 1969); [Proclamation 3890—Enlarging the Katmai National Monument, Alaska](https://www.presidency.ucsb.edu/documents/proclamation-3890-enlarging-the-katmai-national-monument-alaska) (Jan. 20, 1969). [[w.longley-lbjs-1968]], 260–62 (the proclamations chosen, by Johnson''s account); [[w.shesol-mutual-contempt]], 463 (the small grants signed, the large refused, a million acres in Arizona among them; Udall: "If I had named the stadium after Lyndon Johnson, I would have had all seven million acres"); [[w.bernstein-guns-or-butter]], 305 (the big proposals would "strain" the law). Before noon, when his term ended (U.S. Const. amend. XX, § 1). Check: Bernstein, 305, has Johnson sign three orders, some 300 acres in the Sonoran Desert, Mt. McKinley enlarged, a new park above the Arctic Circle. To check: [[w.smith-stewart-l-udall]]; [[w.gould-lady-bird-johnson-and]]. Names: Johnson, Udall.'
