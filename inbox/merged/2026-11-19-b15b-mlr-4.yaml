      id: cal.1966-08-13.china-leadership-5
      when: Aug. 13
      date: '1966-08-13'
      thread: china-leadership
      also:
      - china
      c: Peking Workers' Stadium. A rally of some 70,000 young people, staged by the Peking Party committee, at which about a dozen young "hooligans" are paraded and denounced; as it climaxes they are beaten up. Wang Renzhong, deputy director of the Central Cultural Revolution Group charged with monitoring the Cultural Revolution in Peking, is present and does not or cannot interfere.
      n: '[[w.macfarquhar-maos-last-revolution]], 103, 125. To check: [[w.beijing-shi-wuchanjieji-wenhua]], 22 (cited by [[w.macfarquhar-maos-last-revolution]], 103 n.6). Check: the book takes the rally as "almost certainly intended" to strike at the hooligans of the Aug. 6 appeal; university students'' recollections of a few months later (103 n.6) speak of an "extremely bad impact."'
      src:
        c: 006d4d41
        rows:
        - 'w.macfarquhar-maos-last-revolution 103: all'
      tags:
      - polity:prc
