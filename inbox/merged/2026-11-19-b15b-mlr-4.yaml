      date: '1967-01-01'
      thread: china-leadership
      also:
      - china
      c: Wang Li tells cadres of the State Council Secretariat and the Central Committee's General Office that on investigation the situation at Daxing is "excellent"; a struggle of this magnitude cannot always proceed smoothly.
