      c: Chen Boda distributes to the delegates of the Central Work Conference the text of his report, "Two Lines in the Great Proletarian Cultural Revolution," marking the end of the conference's first stage; the printed text goes out before he speaks, at Mao's suggestion.
      n: '[[w.macfarquhar-maos-last-revolution]], 136. Made public: 1966. To check: [[w.wuchanjieji-wenhua-dageming-zhongde]] (cited by [[w.macfarquhar-maos-last-revolution]], 137 n.13). See [[cal.1966-10-15.china-leadership]]. Names: Chen Boda, Mao Zedong. Check: the book (136) says it may have been because many would not follow Chen''s heavy Fujian accent.'
