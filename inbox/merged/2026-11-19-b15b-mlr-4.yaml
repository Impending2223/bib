      when: May
      date: '1966-05'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai submits to Mao, for the Capital Work Team, the idea of sending city residents of "bad" class background back to their villages. Mao rejects it: it would merely export the problem downward.'
