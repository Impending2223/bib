      when: 1966, after May
      date: '1966'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, after Peng Zhen's fall, calls Peng's speech of January 1965 on indiscriminate struggle in the schools "very bad."
      n: '[[w.macfarquhar-maos-last-revolution]], 103. Made public: 1967. To check: [[w.wuchanjieji-wenhua-dageming-shouzhang]], 372 (cited by [[w.macfarquhar-maos-last-revolution]], 103 n.8). See [[cal.1965-01.china-leadership-5]]. Names: Zhou Enlai, Peng Zhen. Check: the day; the book dates it only "after Peng''s fall" and says Mao''s reaction is not known (103).'
