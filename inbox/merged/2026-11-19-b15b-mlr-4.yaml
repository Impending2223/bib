      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: A few days later Li Na comes again; the leaders of the commune have found out who she is, and she tells them openly that her father has asked her to find out what moved the students who clashed with the work teams and the local Party apparatus.
      n: '[[w.macfarquhar-maos-last-revolution]], 133–134. Made public: 2006. See [[cal.1966-08.china-leadership-27]]. Names: Mao Zedong. Check: the day; "a few days" after the first visit, in mid-August (133); the book names no source; of the months that followed it says only that the commune''s leaders could pass their ideas to Mao directly through this channel (134).'
