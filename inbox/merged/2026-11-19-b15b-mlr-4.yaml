      - china
      c: Peking Workers' Stadium. Red Guard groups of the campuses cram 120,000 of their members and supporters into the stadium for the first of the great struggle rallies, at which more than a dozen "scum of the Party" are dragged out and "struggled," among them Peng Zhen, Liu Ren, Wan Li, Zheng Tianxiang and Wu Han.
