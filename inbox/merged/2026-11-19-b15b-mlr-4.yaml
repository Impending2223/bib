      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: 'The first mass meeting Red Guards organize themselves "to denounce and struggle the black gang" is held in Sun Yat-sen Park, just off Tiananmen Square: they denounce, humiliate and physically abuse thirteen city education officials, among them the director of the municipal Education Bureau, who suffers a broken rib.'
      n: '[[w.macfarquhar-maos-last-revolution]], 125–126. To check: [[w.jian-wenhua-dageming-shiqi-beijing]], 23 (cited by [[w.macfarquhar-maos-last-revolution]], 126 n.45). Check: the day; the book places it after Aug. 13 and Aug. 18 (125).'
