    entry:
      id: cal.1966-10-23.china-leadership-4
      when: Oct. 23–24
      date: '1966-10-23'
      thread: china-leadership
      also:
      - china
      c: 'Within twenty-four hours of Liu''s and Deng''s self-criticisms the whole staff, about a hundred, of a section of the Central Committee''s Organization Department sign the first big-character poster to attack Deng Xiaoping by name, "Deng Xiaoping Is Also China''s Khrushchev!": it accuses him of deleting references to Mao Zedong Thought from the constitution of the Eighth Party Congress, of opposing organized study of Mao''s works among cadres and of promoting individual farming after the Great Leap disaster, and reveals for the first time that in 1962 he said the color of the cat does not matter so long as it catches mice.'
      n: '[[w.macfarquhar-maos-last-revolution]], 146. To check: [[w.dadao-deng-xiaoping]], 26–28 (cited by [[w.macfarquhar-maos-last-revolution]], 146 n.48). See [[cal.1966-10-21.china-leadership-4]]. Names: Deng Xiaoping, Mao Zedong. Check: the day, within a day of the self-criticisms of Oct. 23 (146).'
