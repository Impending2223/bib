      when: '1966'
      date: '1966'
      thread: china-leadership
      also:
      - china
      c: In each of eighty-five elite colleges, middle schools and elementary schools throughout China later investigated by a Chinese scholar, teachers are tortured by students; at twelve a teacher is beaten to death, at one two are; of the thirteen institutions with killings, eleven are middle schools, four of them girls' schools, and two elementary.
      n: '[[w.macfarquhar-maos-last-revolution]], 126. Made public: 1996. To check: [[w.youqin-student-attacks-against-teachers]], 1, 20–22 (cited by [[w.macfarquhar-maos-last-revolution]], 126 n.46). Check: the days; the book does not date the tortures (126 n.46).'
