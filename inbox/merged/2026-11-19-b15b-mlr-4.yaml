      thread: china-leadership
      also:
      - china
      c: At a mass rally Li Jianping, called a counterrevolutionary element sheltered for years by the old municipal Party committee, is denounced and beaten to death with clubs.
      n: '[[w.macfarquhar-maos-last-revolution]], 127. To check: [[w.pipan-tan-lifu-jianghua]], 30 (cited by [[w.macfarquhar-maos-last-revolution]], 127 n.49). Check: the place; the account is the poster of Sept. 2 (127 n.49), whose writer says she denounced Li Jianping at the mass rally of Aug. 27.'
