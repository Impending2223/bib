      c: Mao sends his daughter Li Na, twenty-six, to make contact with the students of the Peking Geological Institute who have just formed the East Is Red Commune. With an identity card she presents herself as Xiao Li of the Central Committee's General Office, come to gather information on the progress of the movement on the campus.
