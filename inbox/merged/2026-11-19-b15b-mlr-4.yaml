      - china
      c: 8 a.m., Tiananmen. Some students are issued silk Red Guard armbands and taken to meet Mao and his colleagues on the rostrum; Jiang Qing, in twenty-fifth place in the official ranking, is among them.
      n: '[[w.macfarquhar-maos-last-revolution]], 107–108. To check: [[w.zhenhua-red-flower-of-china]], 84–87 (cited by [[w.macfarquhar-maos-last-revolution]], 108 n.23). See [[cal.1966-08-18.india-and-china-cultural-revolution]]. Names: Jiang Qing, Mao Zedong. Check: the account of the day is a participant''s (108 n.23); the time is "at eight."'
      src:
