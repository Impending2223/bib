    entry:
      id: cal.1966-10-01.china-leadership-8
      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      also:
      - china
      c: Back behind the walls of the Forbidden City, Mao tells the Central Cultural Revolution Group that they will carry the Great Cultural Revolution through to the end, and that if it comes down to it they will all go down together.
