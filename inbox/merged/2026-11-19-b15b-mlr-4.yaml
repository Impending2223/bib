      date: '1968-06'
      thread: china-leadership
      also:
      - china
      c: Xie Fuzhi, at a meeting with officials of the rural counties around Peking, asks whether the Daxing murders have been properly dealt with; someone answers that the matter has "already been taken care of."
      n: '[[w.macfarquhar-maos-last-revolution]], 130. Made public: 1968. To check: Dongfeng (East Wind) (Beijing: Eighth Ministry of Machine Building Joint General Documentation Office), nos. 20–23, July 10, 1968 (cited by [[w.macfarquhar-maos-last-revolution]], 130 n.58). Names: Xie Fuzhi. Check: the day; the book says it is uncertain what the answer meant (130).'
