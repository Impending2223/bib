      when: Aug., after the 22nd
      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: Xie Fuzhi, back from a meeting at the center, tells a meeting of police officers in Peking to protect and support the Red Guards, to talk them out of killing and to persuade them to act on the Sixteen Points; if in anger they beat a bad person to death, the police are not to call it wrong.
      n: '[[w.macfarquhar-maos-last-revolution]], 125. Made public: 1966. To check: [[w.wuchanjieji-wenhua-dageming-ziliao-1966]], II, 192 (cited by [[w.macfarquhar-maos-last-revolution]], 125 n.42). Names: Xie Fuzhi. Check: the day; the book gives none, placing the speech after Zhongfa [1966] 410 of Aug. 22 (124–125); the Daxing bureau released "Xie Fuzhi''s speech to the municipal public security conference" on Aug. 26 (128), if it is the same speech.'
      at: after 1966-08-22
