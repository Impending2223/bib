      date: '1967-01'
      thread: china-leadership
      also:
      - china
      c: 'Zhu Chengzhao, the Capital 3rd HQ''s "commander," develops views that officialdom takes to be the most reactionary of any student''s in China: that the whole nationwide exchange of revolutionary experiences, Mao''s free travel scheme, was "premature"; that the CCRG is arresting too many Red Guards; that a number of the middle school students of the West City Pickets and similar "royalist" bodies were genuine "leftists"; and that the CCRG is "harassing the masses."'
      n: '[[w.macfarquhar-maos-last-revolution]], 151. Made public: 1967. To check: Dongtai (Current Intelligence), no. 124, Aug. 16, 1967 (cited by [[w.macfarquhar-maos-last-revolution]], 151 n.65); Dongfanghong bao (The East Is Red Paper) (Beijing: Beijing Geological Institute East Is Red Commune), Aug. 29, 1967 (cited by [[w.macfarquhar-maos-last-revolution]], 151 n.66). See [[cal.1966-09.china-leadership-14]]. Names: Mao Zedong. Check: the day; the note cites the *Dongtai* of Aug. 16, 1967 and the *Dongfanghong bao* of Aug. 29, 1967; his career as a Red Guard leader ends once the views are widely known (151).'
