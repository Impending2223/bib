      thread: china-leadership
      also:
      - china
      c: Zhou Enlai tells Red Guards that they wanted to change the name of Tiananmen Square, but into what, "The East Is Red"? He asked Mao, who did not agree to any change; names are all right so long as they are not too feudal or backward.
      n: '[[w.macfarquhar-maos-last-revolution]], 115–116. Made public: 1967. To check: [[w.wuchanjieji-wenhua-dageming-ziliao]], 480 (cited by [[w.macfarquhar-maos-last-revolution]], 116 n.71). Names: Zhou Enlai, Mao Zedong.'
