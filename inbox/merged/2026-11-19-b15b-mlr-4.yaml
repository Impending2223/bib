      date: '1966-11'
      thread: china-leadership
      also:
      - china
      c: About 200 teachers and students of Peking Normal University, led by Tan Houlan, a young cadre on leave who enrolled as a student, descend on Qufu county, Shandong, and announce their intention to "thoroughly demolish the Confucius Family Shop."
      n: '[[w.macfarquhar-maos-last-revolution]], 119. To check: [[w.wuchanjieji-wenhua-dageming-cankao]], IV, 9–10 (cited by [[w.macfarquhar-maos-last-revolution]], 119 n.14). See [[cal.1966-11.china-leadership-3]]. Check: the day.'
