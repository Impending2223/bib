      date: '1966-08-27'
      thread: china-leadership
      also:
      - china
      c: 'Red Guards from three Shandong middle schools destroy the grave of Wu Xun, the nineteenth-century beggar who founded schools: they exhume the body, carry it to a public square, hold a mass sentencing rally and break it up and burn it.'
      n: '[[w.macfarquhar-maos-last-revolution]], 120. To check: [[w.chen-thought-reform-of-the]], 38–42 (cited by [[w.macfarquhar-maos-last-revolution]], 120 n.18). Check: no source named for the event (120); the note is on the attack on Wu Xun of the early 1950s.'
