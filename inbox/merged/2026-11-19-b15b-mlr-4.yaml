      when: '1967'
      date: '1967'
      thread: china-leadership
      also:
      - china
      c: The students, having found nothing, are told to cut short their work and forget the affair; they have begun to suspect that Zhou Enlai may have played a suspect role in what happened in Tianjin in 1928, and when this leaks they are accused of using their investigation as a pretext to dig up dirt on Zhou.
      n: '[[w.macfarquhar-maos-last-revolution]], 146. Made public: 2006. To check: Hao Kewei, "28 zhuan''an de faqi guocheng" (How "Special Case 28" Was Launched), March 23, 1970, handwritten confession from Beijing, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 146 n.45). See [[cal.1967.china-leadership-14]]. Names: Zhou Enlai. Check: the day; the book gives none; the students are later assigned to poor jobs and stigmatized as suspected "May 16" conspirators (146 n.46).'
