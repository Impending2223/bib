- edit:
    id: cal.1966-08-12.china-leadership-5
    base: 87a4e8cf
    set:
      c: 'The Central Cultural Revolution Group informs Mao that each of the provinces wants a copy of its Bulletin sent to it. In the same internal memorandum, the basis of an oral report to Mao, it proposes that the provinces and municipalities be urged not to send large numbers to Peking and to send home those already there to make revolution: 7,000 people from outside Peking are living on the Tsinghua campus, and food and lodging are a problem.'
      n: '[[w.macfarquhar-maos-last-revolution]], 81 (the Bulletin); [[w.macfarquhar-maos-last-revolution]], 106–107 (the memorandum and the students). Made public: 2006. To check: [[w.qian-wenge-mantan]], item no. 2 (cited by [[w.macfarquhar-maos-last-revolution]], 81 n.62); Central Cultural Revolution Group, internal memorandum of Aug. 12, 1966, the basis of an oral report to Mao ([[w.qian-wenge-mantan]], item 2) (cited by [[w.macfarquhar-maos-last-revolution]], 107 n.19b). Names: Mao Zedong. Check: whether Mao agreed; MacFarquhar (81) has "reason to believe" he did. Check: both matters are quoted from Cheng Qian''s item no. 2 (81 n.62, 107 n.19), one memorandum.'
      src:
        c: aee42a65
        rows:
        - 'w.macfarquhar-maos-last-revolution 81: A'
        - 'w.macfarquhar-maos-last-revolution 106–107: B'
        - 'via x.1966-08-12.central-cultural-revolution-group-internal-memorandum-of-aug: B'
- edit:
