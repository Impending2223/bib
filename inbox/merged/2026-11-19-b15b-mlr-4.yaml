      when: Dec.
      date: '1966-12'
      thread: china-leadership
      also:
      - china
      c: 'Back in Peking, the Tan Houlan group meets rumors that the destruction was not efficient and thorough enough and that they "just made a lot of noise." A member of the Central Cultural Revolution Group''s staff defends them: that was already no mean feat.'
      n: '[[w.macfarquhar-maos-last-revolution]], 120. Made public: 2006. To check: Wang Naiying, "Jiao xitong de jiefa cailiao" (Fairly Systematic Revelations), Jan. 13, 1968, manuscript, Schoenhals collection, 25 (cited by [[w.macfarquhar-maos-last-revolution]], 120 n.17). Check: the day; the book dates it only "when Tan Houlan and her group returned" (120).'
