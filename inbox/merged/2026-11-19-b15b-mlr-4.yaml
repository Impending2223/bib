      date: '1966-11'
      thread: china-leadership
      also:
      - china
      c: During a four-week stay in Qufu the group from Peking, with local people and students of the Qufu Teachers' Institute, destroys 6,618 registered cultural artifacts, including 929 paintings, more than 2,700 books, 1,000 stone steles and 2,000 graves.
      n: '[[w.macfarquhar-maos-last-revolution]], 119. To check: [[w.thurston-enemies-of-the-people]], 102–103 (cited by [[w.macfarquhar-maos-last-revolution]], 119 n.15a); [[w.nianyi-da-dongluande-niandai]], 118–119 (cited by [[w.macfarquhar-maos-last-revolution]], 119 n.15b). See [[cal.1966-11.china-leadership-4]]. Check: the days; the book says "a four-week stay" from November (119).'
