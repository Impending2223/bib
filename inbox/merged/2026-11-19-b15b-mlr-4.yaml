      date: '1966-09-13'
      thread: china-leadership
      also:
      - china
      c: 'Red Guards of the Peking School of Industry issue an "Appeal to Fellow Students in All of Beijing": those who want revolution are to step forward and the rest to "piss off"; its anger is at young people living on "three meals and a shit," knitting string bags and sweaters or preparing for the winter cold instead of making revolution.'
      n: '[[w.macfarquhar-maos-last-revolution]], 114. To check: Gao quanshi tongxue shu (Appeal to Fellow Students in All of Beijing), Sept. 13, 1966 (cited by [[w.macfarquhar-maos-last-revolution]], 114 n.63).'
