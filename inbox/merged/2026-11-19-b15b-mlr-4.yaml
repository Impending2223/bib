      when: Sept. 1
      date: '1966-09-01'
      thread: china-leadership
      also:
      - china
      c: The three cadres return to Daxinzhuang and prevent a still greater massacre; those who in the meantime had done their best to carry out the order react with open hostility.
      n: '[[w.macfarquhar-maos-last-revolution]], 130. Made public: 2006. See [[cal.1966-08-31.china-leadership-7]]. Check: no source named (130); Yu Luowen''s investigation of 2003 (131 n.59) may print it first.'
