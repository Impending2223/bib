      when: Oct. 1
      date: '1966-10-01'
      thread: china-leadership
      also:
      - china
      c: After the parade Mao insists on going for a motorized greeting session with some of his "closest comrades-in-arms." The masses surge forward and the cars cannot move; Fu Chongbi, commander of the Peking Garrison, has three ribs broken clearing the way, about ten people are trampled to death and nearly a hundred are injured. The incident is kept out of the news.
      n: '[[w.macfarquhar-maos-last-revolution]], 109. Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], II, 709 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.32). See [[cal.1966-10-01.china-leadership]]. Names: Mao Zedong. Check: the account is Wang Li''s (109 n.32).'
