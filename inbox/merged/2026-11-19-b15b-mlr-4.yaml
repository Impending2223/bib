    set:
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 70 (Sept., end 1966). [[w.macfarquhar-maos-last-revolution]], 134–135 (four days of "hearings," called by Wang Renzhong as deputy director of the Central Cultural Revolution Group and organized with the Capital 3rd HQ: some twenty representatives of the "minority faction," Kuai Dafu and Tan Houlan among them, before a panel chaired by Zhang Chunqiao; the detailed minutes go to Mao). Made public: 2001. To check: [[w.li-wang-li-fansi-lu]], II, 625 (cited by [[w.macfarquhar-maos-last-revolution]], 134 n.6). Names: Zhou Enlai, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Yao Wenyuan, Jiang Qing, Chen Boda. Check: MacFarquhar (134–135) dates the hearings Sept. 17–20; the Zhou chronology, the end of September.'
