      when: Nov.–Dec.
      date: '1966-11'
      thread: china-leadership
      also:
      - china
      c: At one of the mass rallies the visitors organize in Qufu to denounce Confucius, a local "activist in the study of Mao Zedong's Works" says that to be "nurtured" on Confucius's thoughts has produced only cowardly bastards who exploit and bully others, and that the "educating" of people with them would foster landlords and counterrevolutionaries and a capitalist restoration.
      n: '[[w.macfarquhar-maos-last-revolution]], 119–120. To check: [[w.gaoju-mao-zedong-sixiang-1966]], 13 (cited by [[w.macfarquhar-maos-last-revolution]], 120 n.16). See [[cal.1966-11.china-leadership-4]]. Check: the day; the pamphlet''s year is bracketed [1966].'
      src:
