      when: '1966'
      date: '1966'
      thread: china-leadership
      also:
      - china
      c: At Peking No. 6 Middle School, across the road from Zhongnanhai, Red Guards turn the music classroom into a jail, write on the wall "Long live the red terror" and repaint the characters from time to time with the blood of their victims, by some accounts chickens' blood. They beat to death a student, a janitor and a local resident; a vice dean dies a few weeks after three months' incarceration there.
      n: '[[w.macfarquhar-maos-last-revolution]], 126. Made public: 1996. To check: [[w.youqin-student-attacks-against-teachers]], 3 (cited by [[w.macfarquhar-maos-last-revolution]], 126 n.48). Check: the dates; the book gives none (126 n.48).'
