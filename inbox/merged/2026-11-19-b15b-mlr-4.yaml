      date: '1966'
      thread: china-leadership
      also:
      - china
      c: The Foshan, Guangdong, municipal government annuls its 1962 decision designating the Hall of Scriptures Right Monastery, Emperor Guan's Shrine-on-the-Water, the Southern Springs Right Shrine and the Ancestral Temple of the Prince's Daughter's Husband as key protected cultural relics, and voids their contracts with the municipal Cultural Bureau, to suit the "called-for destruction of the 'four olds.'"
      n: '[[w.macfarquhar-maos-last-revolution]], 120–121. Made public: 1991. To check: [[w.foshan-shi-dashiji-1949]], 116 (cited by [[w.macfarquhar-maos-last-revolution]], 121 n.20). Check: the day; whether the decree was made public at the time.'
