      c: In Tianjin a play based on the story of a man from Hunan committed to a mental institution for criticizing Liu Shaoqi's *How to Be a Good Communist*, *The Madman of the New Age*, is performed and briefly touted as the "ninth model opera"; an American Communist, moved to tears, tells the artists that it reflects the Great Cultural Revolution the way it really is.
