      c: Red Guards of the Central Drama Academy, led by a marshal's daughter, confront the guards of an archive to which they insist on access; two guards have their testicles squeezed so hard that, in a sympathetic account, "drops the size of peas" ran down their faces; the Red Guards loot the archive.
      n: '[[w.macfarquhar-maos-last-revolution]], 128. To check: [[w.jiekai-zhongyang-xiju-xueyuan]], 4, 9–10 (cited by [[w.macfarquhar-maos-last-revolution]], 128 n.51). Check: the day; a 1967 Red Guard account (128 n.51).'
