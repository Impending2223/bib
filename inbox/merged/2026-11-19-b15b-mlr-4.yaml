      c: Lin Biao argues that among the five red categories there are those who are not red, as among the five black categories there are those who are not black; class origins are not to decide everything, and it is better still to distinguish left, center and right.
      n: '[[w.macfarquhar-maos-last-revolution]], 134. Made public: 1967. To check: [[w.lin-biao-tongzhi-youguan]], 53 (cited by [[w.macfarquhar-maos-last-revolution]], 134 n.5). Names: Lin Biao. Check: the day and the occasion; the book says "in October" (134).'
