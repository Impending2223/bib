      date: '1967-12'
      thread: china-leadership
      also:
      - china
      c: By the end of 1967 cerebral-spinal meningitis has caused 3.04 million recorded cases and more than 160,000 deaths; an official source says the worst affected were youths and children, many of them Red Guards on the "great exchange of revolutionary experiences."
      n: '[[w.macfarquhar-maos-last-revolution]], 113. Made public: 1997. To check: [[w.lei-fasheng-zai-1966-1976]], 76 (cited by [[w.macfarquhar-maos-last-revolution]], 113 n.57). See [[cal.1967-03-07.china-leadership-4]]. Check: the book (113) ties the epidemic to the autumn 1966 mass travel; the figure is the end-1967 total.'
