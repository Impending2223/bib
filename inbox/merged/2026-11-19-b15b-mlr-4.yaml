      also:
      - china
      c: Provincial Party leaders follow the capital in dismissing university administrators and Party secretaries; the more important dismissals the *Quarterly Chronicle* lists are at Nanjing, Wuhan and Xi'an and in Jiangsu, Qinghai, Shandong, Zhejiang, Henan, Guizhou, Sichuan, Guangxi and Jiangxi.
