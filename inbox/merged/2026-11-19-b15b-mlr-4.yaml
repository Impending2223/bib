    entry:
      id: cal.1965-01.china-leadership-5
      when: Jan.
      date: '1965-01'
      thread: china-leadership
      also:
      - china
      c: Peng Zhen tells colleagues, in a speech on the Socialist Education Movement, that indiscriminate struggle goes on in the schools, including those the leaders' own children attend. A Beijing middle school student who wrote a silly poem was beaten until he confessed to opposing Mao, then to wanting to kill him; sons of some in the room were beaten for trying to stop it.
      n: '[[w.macfarquhar-maos-last-revolution]], 103. Made public: 1966. To check: [[w.peng-zhen-guanyu-siqing]], 6 (cited by [[w.macfarquhar-maos-last-revolution]], 103 n.7). Names: Peng Zhen, Mao Zedong. Check: the day.'
      src:
        c: c73c5a6b
        rows:
        - 'w.macfarquhar-maos-last-revolution 103: all'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:mao-zedong
      - vis:only:prc
