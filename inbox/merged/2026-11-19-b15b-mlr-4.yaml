      n: '[[w.macfarquhar-maos-last-revolution]], 104. To check: [[w.hui-hongweibing-mi-lu]], 8–9 (cited by [[w.macfarquhar-maos-last-revolution]], 104 n.10a); [[w.xiaoxia-repressive-movements-and-the]], 142–143 (cited by [[w.macfarquhar-maos-last-revolution]], 104 n.10b). See [[cal.1966-05-30.china-leadership-2]].'
