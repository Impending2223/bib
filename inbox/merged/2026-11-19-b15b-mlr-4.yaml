      when: May
      date: '1966-05'
      thread: china-leadership
      also:
      - china
      c: 'Zhou Enlai, at the enlarged Politburo meeting, speaks in favor of throwing Qu Qiubai''s ashes, once at the head of the Party, out of the Babaoshan Revolutionary Cemetery in western Peking, and calls for the destruction of Li Xiucheng''s palace at Suzhou: both men, he insists, were "shameless" renegades.'
      n: '[[w.macfarquhar-maos-last-revolution]], 120. Made public: 1967. To check: [[w.ziliao-xuanbian]], 13 (cited by [[w.macfarquhar-maos-last-revolution]], 120 n.19a). His speech to the session of May 21: [[cal.1966-05-21.china-leadership-2]]. Names: Zhou Enlai. Check: the day; the book gives only "the expanded Politburo session in May" (120 n.19); the note''s source is a 1967 Red Guard collection of central leaders'' speeches.'
