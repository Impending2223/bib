      when: Aug. 18
      date: '1966-08-18'
      thread: china-leadership
      also:
      - china
      c: At the rally Song Binbin, a student of the girls' middle school attached to Peking Normal University and the daughter of Song Renqiong, puts a Red Guard armband on Mao's arm. Told that her given name means "suave," Mao says she ought rather to "be martial."
      n: '[[w.macfarquhar-maos-last-revolution]], 108. To check: [[w.wenhua-dageming-bowuguan-2]], I, 88 (cited by [[w.macfarquhar-maos-last-revolution]], 108 n.26a); [[w.zhenhua-red-flower-of-china]], 88–89 (cited by [[w.macfarquhar-maos-last-revolution]], 108 n.27a); [[w.rittenberg-man-who-stayed-behind]], 317–319 (cited by [[w.macfarquhar-maos-last-revolution]], 108 n.27b). See [[cal.1966-08-18.india-and-china-cultural-revolution]]. Names: Mao Zedong. Check: the time of day, not given; the school is then renamed the Red "Be Martial" School (108).'
      src:
