      when: Aug., after the 12th
      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: Mao tells the Central Cultural Revolution Group that one reason the Soviet Union "discarded Leninism" is that too few people saw Lenin in person; as many as possible of the younger generation, the more the better, should see the older generation of revolutionary leaders in person.
      n: '[[w.macfarquhar-maos-last-revolution]], 107. Made public: 2006. To check: Wang Li''s report of Mao''s remarks on students coming to Beijing (cited by [[w.macfarquhar-maos-last-revolution]], 107 n.19a); Central Cultural Revolution Group, internal memorandum of Aug. 12, 1966, the basis of an oral report to Mao ([[w.qian-wenge-mantan]], item 2) (cited by [[w.macfarquhar-maos-last-revolution]], 107 n.19b). See [[cal.1966-08-12.china-leadership-5]]. Names: Mao Zedong. Check: the day; Mao answers the Group after its memorandum of Aug. 12, and Wang Li reports his remarks (107 n.19).'
      at: after 1966-08-12
