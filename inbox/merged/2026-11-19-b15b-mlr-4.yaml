      when: Sept. 2
      date: '1966-09-02'
      thread: china-leadership
      also:
      - china
      c: 'Li XX, a twenty-two-year-old student in the East Asian Languages Department at Peking University, puts up a big-character poster at the municipal Party committee''s premises: it was class hatred that made her denounce Li Jianping at the mass rally of Aug. 27 and drove the masses to beat her to death; she will next settle scores with those who shelter traitors, butchers and counterrevolutionaries.'
      n: '[[w.macfarquhar-maos-last-revolution]], 127. To check: [[w.pipan-tan-lifu-jianghua]], 30 (cited by [[w.macfarquhar-maos-last-revolution]], 127 n.49). See [[cal.1966-08-27.china-leadership-5]].'
