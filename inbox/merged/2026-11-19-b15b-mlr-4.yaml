      n: '[[w.macfarquhar-maos-last-revolution]], 146. To check: [[w.liu-shaoqi-shi-zhongguo]], 4–26 (cited by [[w.macfarquhar-maos-last-revolution]], 146 n.47). Names: Liu Shaoqi, Mao Zedong.'
