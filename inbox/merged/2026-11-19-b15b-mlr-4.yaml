      id: cal.1966-08.china-leadership-10
      when: Aug., at the work conference after the plenum
      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: 'Mao, at a Central Work Conference after the plenum, says Peking is "too civilized": there is not much disorder, the hooligans are very few, and it is not the time to interfere.'
      n: '[[w.macfarquhar-maos-last-revolution]], 102. Made public: Check (the year; [[w.mao-zedong-sixiang-wan]] is undated). To check: [[w.mao-zedong-sixiang-wan]], 269 (cited by [[w.macfarquhar-maos-last-revolution]], 102 n.3). See [[cal.1966-08-13.china-leadership]]. Names: Mao Zedong. Check: the day; the book dates the work conference Aug. 13–17 (132 n.10), the Mao chronology Aug. 13–23; it takes the remarks as prompted by the Aug. 6 appeal and says Mao called the need for the appeal into question (102–103); the short-form note "Mao Zedong sixiang wan sui" is read as the (1960–1967) volume.'
      at: after 1966-08-13
      src:
        c: cbd2c390
        rows:
        - 'w.macfarquhar-maos-last-revolution 102: all'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1966-08-06.china-leadership-4
      when: Aug. 6
      date: '1966-08-06'
      thread: china-leadership
      also:
      - china
      c: 'Red Guards of the middle schools attached to Tsinghua University, Peking University and the Beijing Aeronautical Institute issue an "Urgent Appeal!": "hooligans" posing as Red Guards are rampaging, destroying state property and beating people at random, and all genuine revolutionary Red Guards are to act to end the "disorder."'
      n: '[[w.macfarquhar-maos-last-revolution]], 102–103. To check: [[w.wenhua-dageming-yanjiu-ziliao]], I, 71–72 (cited by [[w.macfarquhar-maos-last-revolution]], 103 n.4).'
      src:
        c: 42db5f34
        rows:
        - 'w.macfarquhar-maos-last-revolution 102: all'
      tags:
      - polity:prc
- add:
