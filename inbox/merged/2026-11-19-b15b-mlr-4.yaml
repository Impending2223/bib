      date: '1966-11'
      thread: china-leadership
      also:
      - china
      c: About 1,000 Red Guards from Sichuan and Beijing have reached Tibet by mid-November and their numbers grow no further. A hastily drawn policy dissuades Han students from traveling into minority areas.
