      date: '1966-09'
      thread: china-leadership
      also:
      - china
      c: After the rally of Sept. 15 the Central Committee's Propaganda Department, finding no photograph of Deng Xiaoping beside Kang Sheng, distributes nationwide a cut-and-paste picture of Deng's head on Chen Yi's body. The department's deputy director loses his job over it.
      n: '[[w.macfarquhar-maos-last-revolution]], 108–109. Made public: 1967. To check: [[w.pipan-liu-deng-luxian]], 59–60 (cited by [[w.macfarquhar-maos-last-revolution]], 109 n.31). See [[cal.1966-09-15.china-leadership]]. Names: Deng Xiaoping, Kang Sheng, Chen Yi. Check: the day of the picture and of the dismissal; the book gives "in the wake of the rally"; the dismissal is from the note (109 n.31).'
