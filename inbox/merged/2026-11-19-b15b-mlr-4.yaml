      when: Aug. 22
      date: '1966-08-22'
      thread: china-leadership
      also:
      - china
      c: 'The Center issues Zhongfa [1966] 410, which Mao ratified: a Ministry of Public Security report, "Mobilizing the Police to Suppress the Student Movement Is Strictly Prohibited." Under no pretext may the police be mobilized to interfere with or suppress the student movement; they stay out of the schools and arrest no one in the movement except a proven murderer, arsonist, poisoner, saboteur or thief of state secrets.'
      n: '[[w.macfarquhar-maos-last-revolution]], 124–125. Made public: 1988. To check: Zhongfa [1966] 410, Ministry of Public Security report "Mobilizing the Police to Suppress the Student Movement Is Strictly Prohibited," ratified by Mao and issued Aug. 22, 1966 ([[w.wenhua-dageming-yanjiu-ziliao]], I, 91) (cited by [[w.macfarquhar-maos-last-revolution]], 125 n.41a); [[w.schoenhals-chinas-cultural-revolution-1966]], 48–49 (cited by [[w.macfarquhar-maos-last-revolution]], 125 n.41b). Names: Mao Zedong. Check: the day Mao ratified it; the book gives only the day of issue (124).'
