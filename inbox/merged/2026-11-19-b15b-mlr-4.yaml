      when: '1966'
      date: '1966'
      thread: china-leadership
      also:
      - china
      c: Zhou Enlai, learning that Red Guards have desecrated the family grave of Chiang Kai-shek in Zhejiang, immediately orders the provincial leadership to repair and restore it, and arranges for photographs of the restored grave to be passed to Chiang through Zhang Shizhao, by way of Hong Kong.
      n: '[[w.macfarquhar-maos-last-revolution]], 120. Made public: 1997. To check: [[w.qinhua-1978-nianqian-haixia-liangan]], 23 (cited by [[w.macfarquhar-maos-last-revolution]], 120 n.19b). Names: Zhou Enlai, Chiang Kai-shek. Check: the day and the year; the book gives neither (120 n.19), placing it among the Red Guards'' attacks of the autumn of 1966.'
