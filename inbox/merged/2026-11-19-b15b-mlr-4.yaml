by: 'Claude (batch 15, second wave: MacFarquhar and Schoenhals, Mao''s Last Revolution, run 4: pp. 102-154, ch. 6-8, the Red Guards, the Red Terror and Confusion Nationwide, with their notes), Nov. 19, 2026'
