      also:
      - china
      c: 'The Central Committee''s General Office approaches a group of students from two Peking universities and a research institute who are investigating whether Liu Shaoqi betrayed the Party organization in Tianjin in 1928, and offers help on condition that central involvement is not divulged: they are to say they act in the name of a mass organization, and are not to inquire into matters they are not supposed to know about.'
      n: '[[w.macfarquhar-maos-last-revolution]], 145. Made public: 2006. To check: Hao Kewei, "28 zhuan''an de faqi guocheng" (How "Special Case 28" Was Launched), March 23, 1970, handwritten confession from Beijing, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 145 n.44). Names: Liu Shaoqi. Check: the day; the book says "in the spring of 1967" (145).'
