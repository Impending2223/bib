      c: The front page of *Cankao xiaoxi*, Xinhua's internal paper, runs the headline "Lin Biao is a plain, staunch, and modest person" over a translation of Edgar Snow's short laudatory sketch of Lin, published earlier in the month in a Japanese weekly, which ends by saying that Lin's ascent to power shows militant communism has the upper hand over bureaucratic communism.
