      n: '[[w.macfarquhar-maos-last-revolution]], 111. Made public: 1991. To check: [[w.zhonggong-guangzhou-dangshi-dashiji]], 286 (cited by [[w.macfarquhar-maos-last-revolution]], 111 n.47). Names: Mao Zedong.'
