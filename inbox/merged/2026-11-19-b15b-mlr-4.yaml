      when: Aug. 31
      date: '1966-08-31'
      thread: china-leadership
      also:
      - china
      c: Daxinzhuang People's Commune, Daxing county. At a meeting of brigade cadres the commune head and the secretary of the commune Youth League committee, relaying what they say is the latest "spirit" from on high, picked up at a nearby labor reform camp, call for the immediate extermination of "landlord and rich peasant elements" and all their kin, to preempt a massacre by "class enemies."
      n: '[[w.macfarquhar-maos-last-revolution]], 128–129. Made public: 2006. See [[cal.1966-08-26.china-leadership-6]]. Check: the book gives no source for the account (128–130); Yu Luowen''s investigation of 2003 (131 n.59) may print it first.'
      src:
        c: 061e88c7
        rows:
        - 'w.macfarquhar-maos-last-revolution 128: all'
      tags:
