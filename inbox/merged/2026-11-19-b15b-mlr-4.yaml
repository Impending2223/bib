      date: '1966-06-24'
      thread: china-leadership
      also:
      - china
      c: 'The Red Guards of the middle school attached to Tsinghua University put up the first of four big-character posters, "Long live the proletarian revolutionary spirit of rebellion!": they intend to strike down the reactionaries in their school and throughout the world and to "create a big proletarian commotion in the heavenly palace."'
      n: '[[w.macfarquhar-maos-last-revolution]], 106. To check: Hongqi, no. 11 (1966), the first three posters "Long live the proletarian revolutionary spirit of rebellion!" (cited by [[w.macfarquhar-maos-last-revolution]], 106 n.17a); [[w.wenhua-dageming-yanjiu-ziliao]], I, 63–65 (cited by [[w.macfarquhar-maos-last-revolution]], 106 n.17b). Mao''s letter in reply: [[cal.1966-07-31.china-leadership]]. Check: the day, June 24, is the Mao chronology''s, in its entry of July 31; MacFarquhar (106) has "at the end of June."'
