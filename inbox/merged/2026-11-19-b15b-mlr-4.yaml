      date: '1966-09-16'
      thread: china-leadership
      also:
      - china
      c: '*Cankao xiaoxi* prints, under the Xinhua headline "Red Guards Achieve Propaganda Victory," a translation of an Associated Press telegram from Hong Kong: letters mailed from the mainland to "Expel-the-Imperialists-City," the name Red Guards in Guangdong have given Hong Kong, will be delivered by the local postal authorities, a colonial spokesman says.'
      n: '[[w.macfarquhar-maos-last-revolution]], 115. To check: Cankao xiaoxi (Reference News), Sept. 16, 1966 (cited by [[w.macfarquhar-maos-last-revolution]], 115 n.69).'
