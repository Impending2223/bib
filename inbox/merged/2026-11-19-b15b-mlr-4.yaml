      - china
      c: '*Cankao xiaoxi* prints, in its daily Mao-quote box at the top left of page 1, "Everything our enemies oppose, we shall support"; a second report quotes the American press as saying the Party''s new "thug rule" is nothing new but was tried by Adolf Hitler.'
