      c: 'Red Guards of Peking No. 29 Middle School distribute a broadsheet against foul and vulgar language: "slang that is intolerable to the ear" is an "opium of the working people," unfit for the home of the Party center and Chairman Mao.'
      n: '[[w.macfarquhar-maos-last-revolution]], 114. To check: Huyu!! Tehao (Appeal!! Special Issue), handbill, Aug. 23, 1966, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 114 n.64). Check: the book (114) has the distribution on Aug. 2; the issue the note cites is dated Aug. 23.'
