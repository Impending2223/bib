      thread: china-leadership
      also:
      - china
      c: A poster put up at the Tsinghua middle school proclaims that those who go against Mao Zedong Thought, whoever they are, whatever banner they fly, whatever their rank, are to be beaten to a pulp.
      n: '[[w.macfarquhar-maos-last-revolution]], 104. To check: Untitled Red Guard poster, June 2, 1966, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 104 n.11). Names: Mao Zedong.'
