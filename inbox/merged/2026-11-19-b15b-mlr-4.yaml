      also:
      - china
      c: 'The Swedish embassy in Peking to the Ministry for Foreign Affairs, Stockholm, "Peking at the Start of the New Year": industrial production, the embassy is told, has consistently surpassed plan targets, which have never been made public, and is said to have been a full 20 percent above 1965 in 1966; whether it is due to the spiritual vigor of an intensive reading of Mao''s writings or to the major investments of the late 1950s must remain undecided.'
