      thread: china-leadership
      also:
      - china
      c: Chen Boda, consulted by the Peking Normal University group before it leaves for Qufu, rules that it is all right to dig up and level Confucius's grave but that the Confucius Temple and its contents are not to be set on fire; he does not object to burning the memorial tablets, but allegedly does not advocate smashing the Han dynasty steles.
