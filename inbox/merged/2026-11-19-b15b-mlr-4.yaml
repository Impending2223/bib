      date: '1966-08-13'
      thread: china-leadership
      also:
      - china
      c: That Saturday night a "red terror" spreads through the capital.
      n: '[[w.macfarquhar-maos-last-revolution]], 103 (the sentence after the rally). See [[cal.1966-08-13.china-leadership-5]].'
      src:
