      date: '1966-08-26'
      thread: china-leadership
      also:
      - china
      c: The Daxing county Bureau of Public Security releases the contents of Xie Fuzhi's speech to the municipal public security conference. In the county it is rumored that officials of commune, county and city will not interfere with violence against the "five black elements," and that "even Premier Zhou supports it."
      n: '[[w.macfarquhar-maos-last-revolution]], 128. Made public: 2006. To check: [[w.schoenhals-talk-about-a-revolution]] (cited by [[w.macfarquhar-maos-last-revolution]], 129 n.54, for the term "five kinds of elements"). Names: Xie Fuzhi, Zhou Enlai. Check: the book gives no source for the Daxing account (128–130); its n.54, called at the end of the paragraph, defines the "five kinds of elements"; Yu Luowen''s investigation of 2003 (131 n.59) may print it first.'
