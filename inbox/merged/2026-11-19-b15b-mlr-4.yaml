      c: The "Red Rebel Regiment" at Nankai University, Tianjin, writes to Zhou Enlai that in digging into the university's former Party past it has discovered that Liu Shaoqi and a number of senior leaders are "renegades," hundreds, possibly a thousand, in a vast bloc; it proposes that the center open an inquiry at once and let the regiment help "eradicate" them.
