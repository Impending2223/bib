      thread: china-leadership
      also:
      - china
      c: 'Wu De, Peking''s acting mayor, gives the keynote speech at the rally: the men dragged out are the "scum of the party, the scum of the people" who colluded in a scheme to usurp the power of the Party, the army and the government; the fight against them is a life-and-death struggle.'
      n: '[[w.macfarquhar-maos-last-revolution]], 124. To check: [[w.wuchanjieji-wenhua-dageming-ziliao]], 546 (cited by [[w.macfarquhar-maos-last-revolution]], 124 n.33). See [[cal.1966-12-12.china-leadership-2]]. Check: the time of day.'
