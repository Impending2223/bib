      c: Kang Sheng says that wages are still paid according to work and remnants of bourgeois right still exist in the factories, where they can generate capitalism; unless the factories are handled well revisionism will emerge in them too, and from this point of view the Great Cultural Revolution is even more important in the factories than in the schools.
      n: '[[w.macfarquhar-maos-last-revolution]], 143. Made public: 1988. To check: [[w.nianyi-da-dongluande-niandai]], 138–139 (cited by [[w.macfarquhar-maos-last-revolution]], 143 n.38). See [[cal.1966-11.china-leadership-10]]. Names: Kang Sheng. Check: the day; the book draws his words on Marx, Lenin and Mao.'
