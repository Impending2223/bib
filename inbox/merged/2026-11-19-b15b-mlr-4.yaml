      c: 'Red Guards of Peking No. 66 Middle School present the municipal Party committee and the Bureaus of Public Security and Labor a "Diplomatic Note": neighborhood committees across the city to put undesirable "elements" to labor under "mass supervision"; a minimum age of twenty-five for smoking and drinking; private hospitals, restaurants and barber shops to close at once.'
