      - china
      c: Red Guards of Peking No. 4 Middle School issue a "General Order" of five orders for the deportation of the "four kinds of elements," to make the capital "purer and redder" for National Day. The repatriation involves tacit cooperation between Red Guards and the authorities.
      n: '[[w.macfarquhar-maos-last-revolution]], 122. To check: Tongling: Guanyu quzhu silei fenzide wuxiang mingling (General Order: Five Orders on the Deportation of Four Kinds of Elements), Beijing No. 4 Middle School revolutionary teachers and students, Aug. 24, 1966 (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.23a); Shoudu hongweibing jiuchadui xicheng fendui zhihuibu di qi hao tongling (General Order No. 7 of the Western City District Command of the Red Guard Pickets of the Capital), Sept. 9, 1966, Schoenhals collection (cited by [[w.macfarquhar-maos-last-revolution]], 122 n.23d). Check: the book (122) cites the handbill for the sentence on National Day; the note''s items after it (122 n.23b–c, e–f) are on Zhou''s proposal of May (see [[cal.1966-05.china-leadership-10]]).'
