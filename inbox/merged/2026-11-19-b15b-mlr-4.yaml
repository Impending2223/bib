      when: Aug. 31
      date: '1966-08-31'
      thread: china-leadership
      also:
      - china
      c: Three brigade cadres at the Daxinzhuang meeting, just back from reading big-character posters at Peking University, doubt the extermination order, rush to central Peking and, after a long delay, are told by the staff of the municipal Party committee's reception office that it contravenes central policy.
      n: '[[w.macfarquhar-maos-last-revolution]], 129–130. Made public: 2006. See [[cal.1966-08-31.china-leadership-5]]. Check: the day, or days; the book says "when the meeting was over" (130); no source named; Yu Luowen''s investigation of 2003 (131 n.59) may print it first.'
      src:
