      when: Aug., after the 5th
      date: '1966-08'
      thread: china-leadership
      also:
      - china
      c: Members of the Central Cultural Revolution Group leak Mao's personal opinion that the June 18 incident at Peking University was a revolutionary, not a counterrevolutionary, incident.
      n: '[[w.macfarquhar-maos-last-revolution]], 103. Made public: Check (the year; [[w.mao-zedong-sixiang-wan]] is undated). To check: [[w.mao-zedong-sixiang-wan]], 262 (cited by [[w.macfarquhar-maos-last-revolution]], 103 n.5). See [[cal.1966-08-05.china-leadership-3]]. Names: Mao Zedong. Check: the day; after Mao''s revocation of Aug. 5.'
