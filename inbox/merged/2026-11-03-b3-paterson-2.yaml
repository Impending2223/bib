- add:
    entry:
      id: cal.1963-12-19.cuba
      when: Dec. 19
      date: '1963-12-19'
      thread: cuba
      c: 'The White House, 10:55 a.m.: Johnson briefed on Cuba by FitzGerald and Bundy, Ball, Vance, Wheeler, Helms and others present. No attack on the Matanzas power plant for now, low-risk sabotage to go on; Artime''s and Ray''s groups to operate from outside the United States. Bundy: the "very tenuous, sensitive, and marginal contacts" with Castro, at his initiative; Kennedy''s speech of Nov. 18 meant to encourage revolt within Cuba and to warn there would be no other Cuba.'
      n: '[FRUS 1961–63, XI, doc. 388](https://history.state.gov/historicaldocuments/frus1961-63v11/d388) (Chase''s memorandum, drafted Dec. 27; n. 3: Carter''s and FitzGerald''s memoranda give the decision on Matanzas as Johnson''s). [[w.paterson-contesting-castro]], 261–62 nn.49, 54 (Bundy on the speech of Nov. 18; the contacts "tenuous" and "marginal"). Made public: [[w.paterson-contesting-castro]] (1994), from the National Security File; FRUS 1961–63, XI. To check: [[w.attwood-reds-and-the-blacks]], 146 (the contacts put "on ice"; cited by [[w.paterson-contesting-castro]], 262 n.54). See [[cal.1963-11-18.cuba]]. Names: Johnson, FitzGerald, Bundy, Ball, Vance, Wheeler, Helms, Artime, Ray, Castro, Kennedy.'
      tags:
      - name:johnson-lyndon-b
