- edit:
    id: cal.1963-06-21.open-housing-ca
    base: 9822ef2e
    set:
      n: '[Cal. Stats. 1963, ch. 1853, 3823](https://clerk.assembly.ca.gov/sites/clerk.assembly.ca.gov/files/archive/Statutes/1963/63Vol2_Chapters.pdf#page=1322) (Health & Saf. Code §§ 35700–35744; the coverage, §§ 35710, 35720, 35730). The Statutes date the approval July 18, 1963 (the chapter''s head): the signing, [[cal.1963-07-18.open-housing-ca]]. To check: [[w.hosang-racial-propositions]]; [[w.brilliant-color-of-america-has]]; [[w.self-american-babylon]]; [[w.rarick-california-rising]]. Names: Rumford, Brown.'
      c: 'California. The Rumford Fair Housing Act, Rumford''s A.B. 1240, passes the Senate in the session''s last hours: discrimination by race, religion or national origin barred in the sale and rental of publicly assisted housing and of private dwellings of more than four units, the Fair Employment Practice Commission to enforce it. Check the day passed.'
