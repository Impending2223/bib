patch: north
by: agent
ops:
  - add:
      entry:
        id: cal.1967-02-28.mayors-chicago
        when: Feb. 28
        date: '1967-02-28'
        thread: mayors
        also: [elections-1967]
        c: 'Chicago primaries for mayor. Democratic: Daley renominated for a fourth term, some 420,000 votes (Check). Republican: John Waner, an air-conditioning contractor and the 23rd Ward''s committeeman, 145,122, 82.5 percent, over two others; write-ins 8.3.'
        n: 'Votes: [Wikipedia, "1967 Chicago mayoral election"](https://en.wikipedia.org/wiki/1967_Chicago_mayoral_election). Check: the Board of Election Commissioners'' canvass. [[w.cohen-american-pharaoh]]; [[w.royko-boss]]; [[w.biles-richard-j-daley]]. See [[cal.1963-04-02.mayors-chicago]]. Names: Daley, Waner.'
        tags: [state:il, city:chicago, name:daley-richard-j, name:waner-john-l]
  - add:
      entry:
        id: cal.1967-04-04.mayors-chicago
        when: Apr. 4
        date: '1967-04-04'
        thread: mayors
        also: [elections-1967]
        c: 'Chicago. Daley (D) elected to a fourth term over Waner (R), 792,238 to 272,542, 73.0 percent, carrying all fifty wards. Write-ins for Dick Gregory 19,480.'
        n: 'Votes: [Wikipedia, "1967 Chicago mayoral election"](https://en.wikipedia.org/wiki/1967_Chicago_mayoral_election). Check: the Board of Election Commissioners'' canvass. [[w.royko-boss]], 159. See [[cal.1967-02-28.mayors-chicago]]. Names: Daley, Waner, Gregory.'
        tags: [state:il, city:chicago, name:daley-richard-j, name:waner-john-l, name:gregory-dick]
  - add:
      entry:
        id: cal.1967-04-04.state-constitutions-ny
        when: Apr. 4
        date: '1967-04-04'
        thread: state-constitutions
        c: 'Albany, N.Y. New York''s constitutional convention opens, the delegates elected in November 1966. Travia, Speaker of the Assembly, its president.'
        n: '[WNYC, "The Convention to End All Conventions?"](https://wnyc.org/story/convention-end-all-conventions). Check: *Journal of the Constitutional Convention of the State of New York*, 1967. [[w.dullea-charter-revision-in-the]]; [[w.connery-rockefeller-of-new-york]]. See [[cal.1966-11-08.state-constitutions-ny]]. Names: Travia.'
        tags: [state:ny, city:albany, name:travia-anthony-j]
  - add:
      entry:
        id: cal.1967-04-21.jobs-and-wages-ny
        when: Apr. 21
        date: '1967-04-21'
        thread: jobs-and-wages
        also: [states-and-cities]
        c: 'New York. Rockefeller signs the Public Employees'' Fair Employment Act, the Taylor Law, in place of the Condon–Wadlin Act of 1947: public employees may organize and bargain collectively; strikes forbidden, punished by fines and jail; a Public Employment Relations Board. In force Sept. 1. Laws of 1967, ch. 392.'
        n: '[N.Y. Public Employment Relations Board, "1967–1971"](https://perb.ny.gov/timeline-notable-events); [Wikipedia, "Taylor Law"](https://en.wikipedia.org/wiki/Taylor_Law). Check: *Laws of New York*, 1967, ch. 392. [[w.connery-rockefeller-of-new-york]]; [[w.smith-on-his-own-terms]]. See [[cal.1966-01-01.jobs-and-wages]]. Names: Rockefeller.'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1967-05-02.mayors-gary
        when: May 2
        date: '1967-05-02'
        thread: mayors
        also: [elections-1967]
        c: 'Gary, Democratic primary for mayor. Richard Hatcher, a Negro member of the city council, 18,227, 39.3 percent; Mayor Katz 16,107, 34.7; a third 26.0.'
        n: 'Votes: [Wikipedia, "1967 Gary, Indiana, mayoral election"](https://en.wikipedia.org/wiki/1967_Gary,_Indiana,_mayoral_election), from Our Campaigns. Check: the Lake County canvass. [[w.poinsett-black-power-gary-style]]; [[w.nelson-electing-black-mayors]]. Names: Hatcher, Katz.'
        tags: [state:in, city:gary, name:hatcher-richard-g, name:katz-a-martin]
  - add:
      entry:
        id: cal.1967-05-16.mayors-philadelphia
        when: May 16
        date: '1967-05-16'
        thread: mayors
        also: [elections-1967]
        c: 'Philadelphia primaries for mayor. Democratic: Mayor Tate 152,949, 63.8 percent, over Hemphill, the city controller, the city chairman''s choice, 81,238, 33.9. Republican: Specter, the district attorney, nominated.'
        n: 'Votes: *Philadelphia Inquirer*, May 18, 1967, 4, as [Wikipedia, "1967 Philadelphia mayoral election"](https://en.wikipedia.org/wiki/1967_Philadelphia_mayoral_election) gives them. Check: the County Board of Elections'' returns. [[w.clark-rally-and-relapse-1946]]; [[w.specter-passion-for-truth]]; [[w.beers-pennsylvania-politics-today-and]]. See [[cal.1963-11-05.mayors-philadelphia]]. Names: Tate, Hemphill, Specter.'
        tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:hemphill-alexander, name:specter-arlen]
  - add:
      entry:
        id: cal.1967-05-16.state-constitutions-pa
        when: May 16
        date: '1967-05-16'
        thread: state-constitutions
        also: [legislatures]
        c: 'Pennsylvania''s voters, at the primary, call a constitutional convention of limited powers under the act of Mar. 15: taxation and finance, the judiciary, the legislature''s apportionment, local government. 163 members: three delegates from each Senate district, to be chosen in November, and the legislature''s leaders. Check the vote.'
        n: '[Act of Mar. 15, 1967, P.L. 2, No. 2](https://www.legis.state.pa.us/WU01/LI/LI/US/PDF/1967/0/0002..PDF), with the compiler''s note of the vote. Check: the *Pennsylvania Manual*, vol. 98. [[w.beers-pennsylvania-politics-today-and]].'
        tags: [state:pa]
  - add:
      entry:
        id: cal.1967-05-25.states-and-cities-mn
        when: May 25
        date: '1967-05-25'
        thread: states-and-cities
        c: 'Minnesota. The Metropolitan Council Act approved: a council of fifteen, named by the governor, for the seven counties of Minneapolis and St. Paul. In force July 1. LeVander names its members Aug. 8.'
        n: '[Laws of Minnesota 1967, ch. 896](https://www.revisor.mn.gov/laws/1967/0/896). [Wikipedia, "Metropolitan Council (Minnesota)"](https://en.wikipedia.org/wiki/Metropolitan_Council_(Minnesota)). [[w.peirce-great-plains-states-of]]. Names: LeVander.'
        tags: [state:mn, city:minneapolis, name:levander-harold]
  - add:
      entry:
        id: cal.1967-06-01.state-and-city-finance-mn
        when: June 1
        date: '1967-06-01'
        thread: state-and-city-finance
        c: 'Minnesota. LeVander vetoes the special session''s tax bill, H.F. 27: the State''s first sales tax, 3 percent, with relief from the property tax for owners and renters. He had asked for a referendum first. The legislature overrides him (Check the day). His veto of the regular session''s bill, May 20, had stood.'
        n: '[Minn. Legislative Reference Library, vetoes of 1967](https://www.lrl.mn.gov/Vetoes/vetodetails?gov=1); [the veto message, June 1, 1967](https://www.leg.mn.gov/archive/vetoes/1967_sp1veto_HF27.pdf). Check: Laws of 1967, Extra Session, ch. 32. [MNopedia, "LeVander, Karl Harold Phillip"](https://www.mnhs.org/mnopedia/search/index/person/levander-karl-harold-phillip-1910-1992). [[w.peirce-great-plains-states-of]]. Names: LeVander.'
        tags: [state:mn, name:levander-harold]
  - add:
      entry:
        id: cal.1967-06-09.desegregation-schools-boston
        when: June 9
        date: '1967-06-09'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Massachusetts. The Supreme Judicial Court upholds the Racial Imbalance Act against the Boston School Committee: not vague; the legislature''s finding of an emergency not open to review; no denial of equal protection, no pupil shown excluded from a school for his race.'
        n: '*School Committee of Boston v. Board of Education*, [352 Mass. 693](https://static.case.law/mass/352/html/0693-01.html) (1967). [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]. See [[cal.1966-04.desegregation-schools-boston]].'
        tags: [state:ma, city:boston]
  - add:
      entry:
        id: cal.1967-07-01.state-and-city-finance-mi
        when: July 1
        date: '1967-07-01'
        thread: state-and-city-finance
        c: 'Michigan. The legislature passes Romney''s fiscal program, the State''s first income tax: 2.6 percent on individuals, an exemption of $1,200 a dependent, from Oct. 1; 5.6 percent on corporations and 7 on financial institutions, from Jan. 1, 1968; the business activities tax repealed; relief from property and city income taxes. House 62–44, June 30; Senate 22–15, July 1, refusing it immediate effect. Act 281; Romney signs (Check the day).'
        n: '*Pontiac Press*, [July 1, 1967](https://our.oakland.edu/bitstreams/796dd1e2-b1a8-4121-8d3a-f058cea60603/download), 1. [Income Tax Act of 1967](https://www.legislature.mi.gov/documents/mcl/pdf/MCL-206-1.pdf), 1967 PA 281, in force Oct. 1, 1967. [[w.mollenhoff-george-romney]]; [[w.peirce-great-lakes-states-of]]. See [[cal.1963-09-11.state-and-city-finance-mi]]. Names: Romney.'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1967-07.states-and-cities-nyc
        when: July–Sept.
        date: '1967-07'
        thread: states-and-cities
        c: 'New York City. Three demonstration districts for community control of the schools, with Ford Foundation money: Ocean Hill–Brownsville in Brooklyn, Intermediate School 201 in Harlem, Two Bridges on the Lower East Side. Ocean Hill''s governing board of parents and members of the community elected in August; Rhody McCoy, an acting principal, its unit administrator. Check the dates.'
        n: 'Check: the Board of Education''s resolution. [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]; [[w.cannato-ungovernable-city]]; [[w.kahlenberg-tough-liberal]]. Names: McCoy.'
        tags: [state:ny, city:nyc, name:mccoy-rhody-a]
  - add:
      entry:
        id: cal.1967-08-28.open-housing-milwaukee
        when: Aug. 28
        date: '1967-08-28'
        thread: open-housing
        also: [states-and-cities]
        c: 'Milwaukee. The NAACP Youth Council, Groppi its adviser, close to 200, marches across the 16th Street Viaduct to the South Side for Vel Phillips''s open housing ordinance, which the Common Council has refused four times; a crowd of thousands throws bricks, rocks and bottles. Again Aug. 29, to Kosciuszko Park. Maier forbids night marches for thirty days (Check the day). The marches go on, nightly.'
        n: '[March on Milwaukee (University of Wisconsin–Milwaukee Libraries), "Open Housing"](https://uwm.edu/marchonmilwaukee/keyterms/open-housing/); *Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download) (AP). [[w.jones-selma-of-the-north]]. See [[cal.1965-12-09.open-housing-wi]]; [[cal.1966-08.desegregation-public-places-milwaukee]]. Names: Groppi, Phillips, Maier.'
        tags: [state:wi, city:milwaukee, name:groppi-james, name:phillips-vel, name:maier-henry-w]
  - add:
      entry:
        id: cal.1967-09-11.states-and-cities-nyc
        when: Sept. 11–28
        date: '1967-09-11'
        thread: states-and-cities
        also: [jobs-and-wages]
        c: 'New York City. The United Federation of Teachers strikes the schools as they open, Shanker its president: pay, the size of classes, the removal of disruptive pupils. Settled Sept. 28 (Check the days). Under the Taylor Law the union fined and Shanker sentenced to fifteen days, served in December.'
        n: '[Tamiment Library, United Federation of Teachers records](https://findingaids.library.nyu.edu/tamwag/wag_022). [[w.kahlenberg-tough-liberal]]; [[w.podair-strike-that-changed-new]]; [[w.ravitch-great-school-wars]]. See [[cal.1967-04-21.jobs-and-wages-ny]]. Names: Shanker.'
        tags: [state:ny, city:nyc, name:shanker-albert]
  - add:
      entry:
        id: cal.1967-09-26.state-constitutions-ny
        when: Sept. 26
        date: '1967-09-26'
        thread: state-constitutions
        also: [school-aid, welfare]
        c: 'New York''s constitutional convention adjourns. Its constitution to go to the voters as one question, as Travia wanted: the Blaine Amendment''s bar on State aid to church schools taken out; the State to take over the cost of welfare and the courts (Check the terms).'
        n: '[Wikipedia, "1967 New York state election"](https://en.wikipedia.org/wiki/1967_New_York_state_election); [WNYC, "The Convention to End All Conventions?"](https://wnyc.org/story/convention-end-all-conventions). See [[cal.1967-04-04.state-constitutions-ny]]. Names: Travia.'
        tags: [state:ny, name:travia-anthony-j]
  - add:
      entry:
        id: cal.1967-09-26.mayors-boston
        when: Sept. 26
        date: '1967-09-26'
        thread: mayors
        also: [elections-1967]
        c: 'Boston''s preliminary election for mayor, Collins not running. Hicks, of the School Committee, 43,722, 28.2 percent; White, secretary of the Commonwealth, 30,789, 19.8; Sears, a State representative, 23,924, 15.4; Logue, once of the Redevelopment Authority, 23,766, 15.3; six others. Hicks and White to the final.'
        n: '[Boston, *Annual Report of the Election Department*, 1967 (City Document No. 10), 46](https://archive.org/details/annualreportofbo1967bost/page/n55/mode/1up). [[w.formisano-boston-against-busing]]; [[w.oconnor-building-a-new-boston]]; [[w.vrabel-peoples-history-of-the]]; [[w.cohen-saving-americas-cities]]. See [[cal.1963-11-05.mayors-boston]]. Names: Collins, Hicks, White, Sears, Logue.'
        tags: [state:ma, city:boston, name:collins-john-f, name:hicks-louise-d, name:white-kevin-h, name:sears-john-w, name:logue-edward-j]
  - add:
      entry:
        id: cal.1967-10-03.mayors-cleveland
        when: Oct. 3
        date: '1967-10-03'
        thread: mayors
        also: [elections-1967]
        c: 'Cleveland''s Democratic primary for mayor. Carl Stokes, a State representative, 110,769, 53.7 percent, over Mayor Locher, 92,033, 44.6; a third 1.7.'
        n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. [[w.weinberg-black-victory]]; [[w.stokes-promises-of-power]]; [[w.nelson-electing-black-mayors]]; [[w.moore-carl-b-stokes-and]]; [[w.stradling-where-the-river-burned]]. See [[cal.1965-11-02.mayors-cleveland]]. Names: Stokes, Locher.'
        tags: [state:oh, city:cleveland, name:stokes-carl-b, name:locher-ralph-s]
  - add:
      entry:
        id: cal.1967-10.open-housing-mi
        when: Oct.–Dec.
        date: '1967-10'
        thread: open-housing
        also: [states-and-cities]
        c: 'Michigan. Romney asks the legislature, in special session, for a State open occupancy law against discrimination in the sale or rental of most housing, and more money for the Civil Rights Commission. Oct. 16, demonstrators against it in the House gallery, some for Wallace. The House turns it down as the session ends, about Dec. 14 (Check the day and the vote).'
        n: '*Pontiac Press*, [Oct. 17, 1967](https://our.oakland.edu/bitstreams/85b05cb4-a4a7-42a0-902f-c756b61b8cc7/download), 1; [Jan. 10, 1968](https://our.oakland.edu/bitstreams/0fd81de3-05ea-4cb6-a8dd-e5008a871b71/download), 1 ("turned down by the House only 27 days ago"). [[w.fine-expanding-the-frontiers-of]]; [[w.mollenhoff-george-romney]]. Names: Romney.'
        tags: [state:mi, name:romney-george-w]
  - add:
      entry:
        id: cal.1967-11-07.mayors-cleveland
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'Cleveland. Stokes (D) elected mayor over Seth Taft (R), 129,318 to 127,467, 50.4 percent. He and Hatcher at Gary the first Negroes elected mayor of cities over 100,000.'
        n: 'Votes: [Wikipedia, "1967 Cleveland mayoral election"](https://en.wikipedia.org/wiki/1967_Cleveland_mayoral_election), from Our Campaigns. Check: the Cuyahoga County Board of Elections. See [[cal.1967-10-03.mayors-cleveland]]. Names: Stokes, Taft, Hatcher.'
        tags: [state:oh, city:cleveland, name:stokes-carl-b, name:taft-seth-c, name:hatcher-richard-g]
  - add:
      entry:
        id: cal.1967-11-07.mayors-gary
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967, voting-rights]
        c: 'Gary. Hatcher (D) elected mayor over Joseph Radigan (R), 39,940 to 37,729, 51.4 percent, the Lake County Democratic organization, Krupa its chairman, for Radigan. Nov. 6, the federal court at Hammond enjoins the organization''s officials in Gary from interfering with the election, on suits of the Justice Department and Hatcher (Check). The National Guard stands by.'
        n: '*Observer* (Notre Dame), [Nov. 9, 1967](https://archives.nd.edu/Observer/1967-11-09_v02_022.pdf), 1. Votes: [Wikipedia, "1967 Gary, Indiana, mayoral election"](https://en.wikipedia.org/wiki/1967_Gary,_Indiana,_mayoral_election), from Our Campaigns. Check: the Lake County canvass; the suits'' titles. See [[cal.1967-05-02.mayors-gary]]. Names: Hatcher, Radigan, Krupa.'
        tags: [state:in, city:gary, name:hatcher-richard-g, name:radigan-joseph-b, name:krupa-john-g]
  - add:
      entry:
        id: cal.1967-11-07.mayors-boston
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'Boston. White elected mayor over Hicks, 102,706 to 90,154, 53.3 percent. Sworn Jan. 1.'
        n: '[Boston, *Annual Report of the Election Department*, 1967 (City Document No. 10), 107](https://archive.org/details/annualreportofbo1967bost/page/n116/mode/1up). See [[cal.1967-09-26.mayors-boston]]. Names: White, Hicks.'
        tags: [state:ma, city:boston, name:white-kevin-h, name:hicks-louise-d]
  - add:
      entry:
        id: cal.1967-11-07.mayors-philadelphia
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'Philadelphia. Tate (D) re-elected over Specter (R), 353,326 to 342,398, 49.0 percent; Cecil Moore (Political Freedom Rights) 9,031, 1.3; two others.'
        n: 'Votes: [Wikipedia, "1967 Philadelphia mayoral election"](https://en.wikipedia.org/wiki/1967_Philadelphia_mayoral_election), from the city''s list of mayors. [*New York Times*, Nov. 8, 1967](https://www.nytimes.com/1967/11/08/archives/fate-beats-specter-in-philadelphia-mayors-race.html). Check: the County Board of Elections'' returns. See [[cal.1967-05-16.mayors-philadelphia]]. Names: Tate, Specter, Moore.'
        tags: [state:pa, city:philadelphia, name:tate-james-h-j, name:specter-arlen, name:moore-cecil-b]
  - add:
      entry:
        id: cal.1967-11-07.mayors-indianapolis
        when: Nov. 7
        date: '1967-11-07'
        thread: mayors
        also: [elections-1967]
        c: 'Indianapolis. Richard Lugar (R), once of the school board, elected mayor over Mayor Barton (D), 72,278 to 63,284, 53.3 percent. Republicans take the city council, 6 to 3.'
        n: 'Votes: [Wikipedia, "1967 Indianapolis mayoral election"](https://en.wikipedia.org/wiki/1967_Indianapolis_mayoral_election). Check: the Marion County canvass. [[w.encyclopedia-of-indianapolis]]. See [[cal.1963-11-05.mayors-indianapolis]]. Names: Lugar, Barton.'
        tags: [state:in, city:indianapolis, name:lugar-richard-g, name:barton-john-j]
  - add:
      entry:
        id: cal.1967-11-07.state-constitutions-ny
        when: Nov. 7
        date: '1967-11-07'
        thread: state-constitutions
        also: [elections-1967, transportation]
        c: 'New York''s voters reject the convention''s constitution, 1,327,999 to 3,487,513, 27.6 percent for. They approve Rockefeller''s transportation bond issue, $2.5 billion (Check the vote).'
        n: '[New York State Constitutional Convention Clearinghouse, results of the referendums to ratify](https://newyork.concon.info/?p=315). Check: the *Legislative Manual*, 1968; [*New York Times*, Dec. 12, 1967, 37](https://www.nytimes.com/1967/12/12/archives/new-charter-lost-by-2million-votes.html), the official canvass. See [[cal.1967-04-04.state-constitutions-ny]]. Names: Rockefeller.'
        tags: [state:ny, name:rockefeller-nelson]
  - add:
      entry:
        id: cal.1967-11-07.legislatures-nj
        when: Nov. 7
        date: '1967-11-07'
        thread: legislatures
        also: [elections-1967]
        c: 'New Jersey''s legislative elections, the first under the districts of the 1966 convention, a Senate of forty: Republicans 31 seats, Democrats 9; in the outgoing Senate Democrats 18, Republicans 8. Republicans take the Assembly too (Check the count). Hughes, a Democrat, faces Republican majorities in both houses.'
        n: '[*Results of the General Election Held November 7, 1967*](https://www.nj.gov/state/elections/assets/pdf/election-results/1920-1970/1967-general-election.pdf) (Secretary of State); [Wikipedia, "1967 New Jersey Senate election"](https://en.wikipedia.org/wiki/1967_New_Jersey_Senate_election). [[w.salmore-new-jersey-politics-and]]. See [[cal.1966-11-08.state-constitutions-nj]]; [[cal.1965-11-02.governors-nj]]. Names: Hughes.'
        tags: [state:nj, name:hughes-richard-j]
  - add:
      entry:
        id: cal.1967-11-09.states-and-cities-nyc
        when: Nov. 9
        date: '1967-11-09'
        thread: states-and-cities
        c: 'New York City. Lindsay''s Advisory Panel on Decentralization, Bundy its chairman, reports, *Reconnection for Learning*: the schools to be divided into thirty to sixty community districts, each with a board chosen largely by parents, with power over budget, staff and curriculum. Check the day.'
        n: '[[w.schools-reconnection-for-learning|full]]. [Wikipedia, "Bundy Report"](https://en.wikipedia.org/wiki/Bundy_Report). See [[cal.1967-07.states-and-cities-nyc]]. Names: Lindsay, Bundy.'
        tags: [state:ny, city:nyc, name:lindsay-john-v, name:bundy-mcgeorge]
  - add:
      entry:
        id: cal.1967-11-17.students-philadelphia
        when: Nov. 17
        date: '1967-11-17'
        thread: students
        also: [states-and-cities]
        c: 'Philadelphia. Some 3,500 Negro high school students walk out to the Board of Education for courses in Negro history, more Negro teachers and the right to wear African dress. Rizzo, police commissioner since May, sends in the police; students and others beaten and arrested. Check the figures.'
        n: '[Chalkbeat, Sept. 25, 2002](https://chalkbeat.org/philadelphia/2002/9/25/22185400/1967-african-american-students-strike-survive-police-riot-to-force-change); [WHYY](https://whyy.org/segments/honoring-50th-anniversary-pivotal-student-protest-philadelphia). Check: *Philadelphia Inquirer*, Nov. 18, 1967. [[w.countryman-up-south]]. Names: Rizzo.'
        tags: [state:pa, city:philadelphia, name:rizzo-frank-l]
  - add:
      entry:
        id: cal.1967-12-01.state-constitutions-pa
        when: Dec. 1
        date: '1967-12-01'
        thread: state-constitutions
        also: [legislatures]
        c: 'Harrisburg. Pennsylvania''s constitutional convention opens in the House chamber, its delegates elected Nov. 7. Broderick, the lieutenant governor, its president (Check).'
        n: '[Jenkins Law Library, "1967–68 Convention"](https://guides.jenkinslaw.org/pennsylvania-constitution/1967-68-convention). Check: *Journal of the Constitutional Convention of the Commonwealth of Pennsylvania of 1967–1968*. See [[cal.1967-05-16.state-constitutions-pa]]. Names: Broderick.'
        tags: [state:pa, name:broderick-raymond-j]
  - add:
      entry:
        id: cal.1967-12-12.open-housing-milwaukee
        when: Dec. 12
        date: '1967-12-12'
        thread: open-housing
        also: [states-and-cities]
        c: 'Milwaukee. The Common Council passes an alderman''s compromise open housing ordinance, modeled on the State''s law of 1965, covering a third of the city''s housing. Phillips''s ordinance, covering all of it, still refused; the Youth Council''s marches go on.'
        n: '[Milwaukee Public Library, "200 Nights That Shook Milwaukee"](https://mpl.org/blog/now/200-nights-that-shook-milwaukee-the-1967-1968-open-housing-marches). Check: the Common Council''s *Proceedings*, Dec. 12, 1967. See [[cal.1967-08-28.open-housing-milwaukee]]. Names: Phillips.'
        tags: [state:wi, city:milwaukee, name:phillips-vel]
