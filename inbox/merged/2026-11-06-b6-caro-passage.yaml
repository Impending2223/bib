      c: 'Robert Kennedy to Schlesinger, asked about Oswald, by Schlesinger''s journal: no serious doubt that he was guilty;
        the "argument" is whether he acted alone or in a larger plot, Castro''s or gangsters''.'
      n: '[[w.caro-passage-of-power]], 574. To check: [[w.schlesinger-journals]], 214 (cited by [[w.caro-passage-of-power]],
        574 n.perhaps). See [[cal.1963-12-05.robert-kennedy]]. Names: Robert Kennedy, Schlesinger.'
      src:
        rows:
        - 'w.caro-passage-of-power 574: all'
        - 'via w.caro-passage-of-power 574 n.perhaps: all'
        c: 98717b24
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1963-12-30.transition-and-staff
      when: Dec. 30
      date: '1963-12-30'
      thread: transition-and-staff
      c: 'Schlesinger, in his journal, on Johnson: "unlike JFK, he does not retain what he has been told"; "Policy for Johnson
        has always been determined by the balance of political pressures," and he is not prepared to examine its merits.'
      n: '[[w.caro-passage-of-power]], 588. To check: [[w.schlesinger-journals]], 216–19 (cited by [[w.caro-passage-of-power]],
        588 n.the-new-president). Names: Schlesinger, Johnson.'
      src:
        rows:
        - 'w.caro-passage-of-power 588: all'
        - 'via w.caro-passage-of-power 588 n.the-new-president: all'
        c: '64871841'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-20.press-and-broadcasting
      when: Jan. 20
      date: '1964-01-20'
      thread: press-and-broadcasting
      c: 'Johnson to Albert Thomas, by telephone, 9:05 p.m., on the Houston *Chronicle*: "Is the Chronicle for us now? ...
        All out, all the time, aren''t they?" Thomas: for two or three weeks, a favorable story "every other page."'
      n: '[[w.caro-passage-of-power]], 527. To check: [Johnson and Albert Thomas, 9:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-albert-thomas-january-21-1964),
        Conversation WH6401-18-1445 (Miller Center); [[w.presidential-recordings-2005]], III, 678 (cited by [[w.caro-passage-of-power]],
        527 n.is-the-chronicle). See [[cal.1964-01-08.press-and-broadcasting]]. Names: Johnson, Thomas.'
      src:
        rows:
        - 'w.caro-passage-of-power 527: all'
        - 'via w.caro-passage-of-power 527 n.is-the-chronicle: all'
        c: 5231809d
      tags:
      - name:johnson-lyndon-b
      - name:thomas-albert
      - state:tx
      - city:houston
