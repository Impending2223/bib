- add:
    entry:
      id: cal.1960-01-25.elections-1960
      when: Jan. 25
      date: '1960-01-25'
      thread: elections-1960
      c: 'Judge Walter Ely to Jenkins, by telephone from California: Brown''s effort to keep his 81-vote delegation uncommitted
        falling apart; "If I could bring Lyndon in contact with" the delegates, "he would own them like he does everybody
        he meets."'
      n: '[[w.caro-passage-of-power]], 74. To check: transcript, Jan. 25, 1960, "Transcripts of Telephone Calls—February 1960,"
        Box 1, Series 2, Office Files of Walter Jenkins, LBJ Library (cited by [[w.caro-passage-of-power]], 74 n.if-i-could).
        Names: Jenkins, Brown, Johnson.'
      src:
        rows:
        - 'w.caro-passage-of-power 74: all'
        - 'via w.caro-passage-of-power 74 n.if-i-could: all'
        c: 108ba148
      tags:
      - name:jenkins-walter-w
      - name:brown-edmund-g
      - name:johnson-lyndon-b
      - state:ca
- add:
    entry:
      id: cal.1960-03-23.elections-1960-2
      when: Mar. 23
      date: '1960-03-23'
      thread: elections-1960
      c: 'Charles Herring, Texas State Senator, to Jenkins, by telephone, on Johnson''s silence: "We DO have a candidate,
        don''t we? He isn''t going to run out on us, is he?"'
      n: '[[w.caro-passage-of-power]], 82. To check: "Telephone Conversation between Charlie Herring and W. Jenkins," Mar.
        23, 1960, Box 1, Series 2, Office Files of Walter Jenkins, LBJ Library (cited by [[w.caro-passage-of-power]], 82 n.we-do).
        Names: Jenkins, Johnson.'
      src:
        rows:
        - 'w.caro-passage-of-power 82: all'
        - 'via w.caro-passage-of-power 82 n.we-do: all'
        c: 9cba513e
      tags:
      - name:jenkins-walter-w
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1960-07-08.elections-1960-los-angeles
      when: July 8
      date: '1960-07-08'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, Johnson arrived, by Herring''s account. Johnson to his chief campaign workers: they have not done enough
        with the delegates, "If you''d done the job you were supposed to have done, I wouldn''t be in this situation"; he
        will win all the same, the States he names switching after the first ballot.'
      n: '[[w.caro-passage-of-power]], 98. Check: the day (Caro: after the flight of Friday, July 8). See [[cal.1960-07-08.elections-1960-2]].
        Names: Johnson.'
      src:
        rows:
        - 'w.caro-passage-of-power 98: all'
        - 'via w.caro-passage-of-power 98 n.he-got-mad: all'
        c: 2e7b1590
      tags:
      - name:johnson-lyndon-b
      - city:los-angeles
      - state:ca
- cite:
    id: cal.1960-07-08.elections-1960-2
    item: '[[w.caro-passage-of-power]], 98 (Johnson flies to Los Angeles, Friday, July 8)'
    units: A
- add:
    entry:
      id: cal.1963-05-29.transition-and-staff
      when: May 29
      date: '1963-05-29'
      thread: transition-and-staff
      c: 'The White House, Kennedy''s surprise birthday party. The Vice President not invited. Evelyn Lincoln, who planned
        it: "I forgot all about inviting Mr. Johnson. And no one reminded me."'
      n: '[[w.caro-passage-of-power]], 225. To check: [[w.lincoln-kennedy-and-johnson]], 188 (cited by [[w.caro-passage-of-power]],
        225 n.i-hate). Names: Kennedy, Johnson, Lincoln.'
      src:
        rows:
        - 'w.caro-passage-of-power 225: all'
        c: 21355ca8
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:lincoln-evelyn
- add:
    entry:
      id: cal.1963-06-01.civil-rights-bill-2
      when: June 1
      date: '1963-06-01'
      thread: civil-rights-bill
      c: Saturday. Johnson, put off in his requests to see the President on the civil rights legislation, tells O'Donnell,
        in an Administration official's words, "he thought he should have fifteen minutes alone with the President."
      n: '[[w.caro-passage-of-power]], 258. The meeting: [[cal.1963-06-03.civil-rights-bill]]. Names: Johnson, O''Donnell.'
      src:
        rows:
        - 'w.caro-passage-of-power 258: all'
        c: 7af9ba91
      tags:
      - name:johnson-lyndon-b
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1963-09-09.baker
      when: Sept. 9
      date: '1963-09-09'
      thread: baker
      c: 'Ralph Hill, of a vending-machine firm, sues the Serv-U Corporation and Baker in the United States District Court
        in Washington: Baker took $5,600 from Hill to use his influence with North American Aviation to place Hill''s machines
        with a subcontractor, then had the subcontractor replace them with Serv-U''s.'
      n: '[[w.caro-passage-of-power]], 276. Check: the docket. Names: Baker.'
      src:
        rows:
        - 'w.caro-passage-of-power 276: all'
        c: ccae37ab
      tags:
      - name:baker-robert-g
- add:
    entry:
      id: cal.1963-11-15.assassination
      when: Nov. 15
      date: '1963-11-15'
      thread: assassination
      c: Friday. Johnson flies to the ranch, a week ahead of the Kennedys' visit after the Austin dinner of Nov. 22; the house
        cleaned, eight of Wesley West's thoroughbreds brought over, a horse trailer sent to Tennessee for Lady Bird Johnson's
        walking horse.
      n: '[[w.caro-passage-of-power]], 299. Names: Johnson, Lady Bird Johnson.'
      src:
        rows:
        - 'w.caro-passage-of-power 299: all'
        c: 3afe31bd
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:tx
- add:
    entry:
      id: cal.1963-11-26.succession-3
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'The Elms, the day after the funeral. Lady Bird Johnson asks the chief usher, J. B. West, to plan the move: only
        her own and her daughters'' bedroom furniture to come, the rooms Jacqueline Kennedy restored left as they are; "I
        want you to run the White House."'
      n: '[[w.caro-passage-of-power]], 500. To check: [[w.west-upstairs-at-the-white]], 283–87 (cited by [[w.caro-passage-of-power]],
        500 n.there-was-nothing-tentative). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      src:
        rows:
        - 'w.caro-passage-of-power 500: all'
        c: 381205f4
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1963-12-07.succession
    item: '[[w.caro-passage-of-power]], 500 (the move: Jacqueline Kennedy and her children out that morning, to a house in
      Georgetown lent by Harriman; the Johnsons in, Lady Bird Johnson arriving about 3 p.m. with Rayburn''s photograph; Jacqueline
      Kennedy''s note, "you will be happy here")'
- check:
    id: cal.1963-12-07.succession
    text: 'Check: Caro gives Jacqueline Kennedy''s leaving as Dec. 6 at 388, the morning of Dec. 7 at 500.'
