      when: Feb. 9
      date: '1964-02-09'
      thread: press-and-broadcasting
      c: 'Johnson to Valenti, by telephone, Mary Margaret Valenti on the line: plant "a paragraph" in the Houston *Chronicle*.
        Valenti: William P. Steven, its editor, prints whatever he asks "the next day."'
      n: '[[w.caro-passage-of-power]], 527. To check: [Johnson, Jack Valenti and Mary Margaret Valenti](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-jack-valenti-and-mary-margaret-valenti),
        Conversation WH6402-12-1987 (Miller Center); [[w.presidential-recordings-2005]], IV, 394 (cited by [[w.caro-passage-of-power]],
        527 n.a-paragraph). Check: the hour (Caro''s note: 8:45 p.m.; PRDE lists 08:45). See [[cal.1964-01-08.press-and-broadcasting]].
        Names: Johnson, Valenti.'
      src:
