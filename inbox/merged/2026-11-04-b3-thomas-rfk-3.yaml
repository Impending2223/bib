        c: 'The White House, the reception for the Congress, white tie, the Marine Band playing "Mr. Wonderful." Kennedy to Smathers: "The shit has hit the fan." Smathers: send in the Marines. Robert Kennedy, standing by: "What? Are you crazy?" By Peek''s account.'
