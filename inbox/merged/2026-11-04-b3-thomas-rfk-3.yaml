  - add:
      entry:
        id: cal.1962-10-16.missile-crisis-2
        when: Oct. 16
        date: '1962-10-16'
        thread: missile-crisis
        also: [robert-kennedy]
        c: 'The President to Robert Kennedy at Justice: "We have some big trouble. I want you over here." About 9 a.m., Bundy''s office: the photographs. Robert Kennedy: "Oh shit. Shit! Shit! Those sons a bitches Russians." Later: "Can they hit Oxford, Mississippi?"'
        n: '[[w.thomas-robert-kennedy]], 209. To check: Dino A. Brugioni, *Eyeball to Eyeball*, 223; [[w.kennedy-thirteen-days]], 24, 27 (cited by [[w.thomas-robert-kennedy]], 209). Names: Kennedy, Robert Kennedy, Bundy.'
        src:
          c: f95f3983
          rows:
            - 'w.thomas-robert-kennedy 209: all'
            - 'via x.undated.brugioni-eyeball-to-eyeball: all'
        tags: [name:kennedy-john-f, name:kennedy-robert-f, name:bundy-mcgeorge]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-16.cuba
        when: Oct. 16
        date: '1962-10-16'
        thread: cuba
        also: [robert-kennedy, missile-crisis]
        c: '2:30 p.m., the Special Group (Augmented). Robert Kennedy: the President "dissatisfied" with Mongoose; he will give it more of his "personal attention"; the group to meet every morning at 9:30. The CIA''s new sabotage plans approved, with more "push": frogmen against shipping, a tanker fired in Havana harbor, grenades at the Chinese embassy. How many Cubans would fight Castro if Cuba were invaded?'
        n: '[[w.thomas-robert-kennedy]], 211–12. To check: Operation Mongoose Sabotage Proposals, Oct. 16, 1962, Assassination Records Review Board; Helms, Memorandum for the Record, FRUS 1961–63, XI, p. 45 (cited by [[w.thomas-robert-kennedy]], 212 n.). Names: Robert Kennedy, Kennedy, Castro.'
        src:
          c: f45bb84e
          rows:
            - 'w.thomas-robert-kennedy 211–12: all'
            - 'via x.1962-10-16.helms-memorandum-for-the-record: all'
        tags: [name:kennedy-robert-f, name:kennedy-john-f, name:castro-fidel]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-16.missile-crisis-3
        when: Oct. 16
        date: '1962-10-16'
        thread: missile-crisis
        also: [robert-kennedy]
        c: '6:30 p.m., the Cabinet Room, taped. The President: "We''re going to take out those missiles." Taylor: never one hundred percent; an invasion "deep mud." Robert Kennedy: "get into it, and get it over with, and take our losses"; "whether there''s some ship that ... you know, sink the Maine or something." His note after nine: "If we go in, we go in hard."'
        n: '[[w.thomas-robert-kennedy]], 212–13. To check: [[w.kennedy-tapes]], 78–117; Cuba ExCom Meeting, RFK Notes, Oct. 16, 1962, RFK Confidential File, JFK Library (cited by [[w.thomas-robert-kennedy]], 213 n.). See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Taylor, Robert Kennedy.'
        src:
          c: db10f486
          rows:
            - 'w.thomas-robert-kennedy 212–13: all'
            - 'via x.1962-10-16.cuba-excom-meeting-robert-kennedy-notes: all'
        tags: [name:kennedy-john-f, name:taylor-maxwell, name:kennedy-robert-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-18.missile-crisis-7
        when: Oct. 18
        date: '1962-10-18'
        thread: missile-crisis
        also: [robert-kennedy]
        c: 'About 7 p.m., the Oval Office. Robert Kennedy to Lovett, waiting outside: "Hey, you!" The President: "Goddamn, Bobby!" By the fire, Robert Kennedy agrees with Lovett on "taking less violent steps at the outset because we could always blow up the place if necessary"; the President pushed by the military''s hawks.'
        n: '[[w.thomas-robert-kennedy]], 216–17. To check: Brugioni, *Eyeball to Eyeball*, 288; Robert Lovett oral history, JFK Library (cited by [[w.thomas-robert-kennedy]], 216 n.). Names: Robert Kennedy, Kennedy.'
        src:
          c: ab03fcbc
          rows:
            - 'w.thomas-robert-kennedy 216–17: all'
            - 'via x.undated.robert-lovett-oral-history-jfk-library: all'
        tags: [name:kennedy-robert-f, name:kennedy-john-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-19.missile-crisis-4
        when: Oct. 19
        date: '1962-10-19'
        thread: missile-crisis
        also: [defense]
        c: 'The Chiefs alone with the President, taped. LeMay: "If we don''t do anything to Cuba, then they''re going to push on Berlin"; "You''re in a pretty bad fix, Mr. President." Earlier the President has told Bundy to keep the air strike alive.'
        n: '[[w.thomas-robert-kennedy]], 217–18. To check: [[w.kennedy-tapes]], 177, 182; [[w.bird-color-of-truth]], 234 (cited by [[w.thomas-robert-kennedy]], 217 n.). Names: Kennedy, LeMay, Bundy.'
        src:
          c: 8bd04ea3
          rows:
            - 'w.thomas-robert-kennedy 217–18: all'
        tags: [name:kennedy-john-f, name:lemay-curtis-e, name:bundy-mcgeorge]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-19.missile-crisis-5
        when: Oct. 19
        date: '1962-10-19'
        thread: missile-crisis
        also: [robert-kennedy]
        c: 'After the Chiefs, the President to Robert Kennedy and Sorensen in the hall: "This thing is falling apart. You have to pull it together." To O''Donnell: if we do what the brass hats want, "none of us will be alive later to tell them they''re wrong."'
        n: '[[w.thomas-robert-kennedy]], 217. To check: [[w.odonnell-johnny-we-hardly-knew]], 361 (cited by [[w.thomas-robert-kennedy]], 217 n.). See [[cal.1962-10-19.missile-crisis-4]]. Names: Kennedy, Robert Kennedy, Sorensen, O''Donnell.'
        src:
          c: d05f31ca
          rows:
            - 'w.thomas-robert-kennedy 217: all'
            - 'via x.undated.theodore-sorensen-interview-thomas: all'
        tags: [name:kennedy-john-f, name:kennedy-robert-f, name:sorensen-theodore-c, name:odonnell-kenneth-p]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-22.missile-crisis-14
        when: Oct. 22
        date: '1962-10-22'
        thread: missile-crisis
        also: [europe-and-the-alliance-jupiters]
        c: 'Harriman to Robert Kennedy, the morning: the American missiles in Turkey an irritant to the Kremlin, "humiliating to Soviet pride."'
        n: '[[w.thomas-robert-kennedy]], 221. To check: [[w.abramson-spanning-the-century]], 593 (cited by [[w.thomas-robert-kennedy]], 221 n.). Names: Harriman, Robert Kennedy.'
        src:
          c: 739407e9
          rows:
            - 'w.thomas-robert-kennedy 221: all'
        tags: [name:harriman-w-averell, name:kennedy-robert-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-22.missile-crisis-15
        when: Oct. 22
        date: '1962-10-22'
        thread: missile-crisis
        also: [robert-kennedy]
        c: 'Before the address, Robert Kennedy''s notes of the reasons for the middle course: an invasion or strike could not be sure of getting them all; "Pearl Harbor"; to do nothing would weaken Berlin, "We are going to have to act in Berlin anyway"; "Did not give up on Strike until talked to Gen. Sweeney yesterday."'
        n: '[[w.thomas-robert-kennedy]], 219 n.*. To check: Cuba ExCom Meeting, RFK Notes, Oct. 22, 1962, RFK Confidential File, JFK Library (cited by [[w.thomas-robert-kennedy]], 219 n.). Names: Robert Kennedy.'
        src:
          c: 5564f95a
          rows:
            - 'w.thomas-robert-kennedy 219 n.*: all'
            - 'via x.1962-10-22.cuba-excom-meeting-robert-kennedy-notes: all'
        tags: [name:kennedy-robert-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-23.missile-crisis-12
        when: Oct. 23
        date: '1962-10-23'
        thread: missile-crisis
        also: [robert-kennedy]
        c: '7:10 p.m., the Oval Office, taped, the brothers alone. Robert Kennedy: Holeman has seen Bolshakov, who says the base is defensive. The President: "Holeman? ... But he''s not with us on this." Nothing said of the trade. The President: "It looks really mean, doesn''t it?"'
        n: '[[w.thomas-robert-kennedy]], 222–24. To check: [[w.kennedy-tapes]], 342–43 (cited by [[w.thomas-robert-kennedy]], 222 n.). See [[cal.1962-10-23.missile-crisis-6]]. Names: Robert Kennedy, Kennedy, Bolshakov.'
        src:
          c: 7a6826e3
          rows:
            - 'w.thomas-robert-kennedy 222–24: all'
        tags: [name:kennedy-robert-f, name:kennedy-john-f, name:bolshakov-georgi]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-27.missile-crisis-8
        when: Oct. 27
        date: '1962-10-27'
        thread: missile-crisis
        also: [robert-kennedy, europe-and-the-alliance-jupiters]
        c: 'About 7 p.m., the Oval Office: the President with Rusk, McNamara, Bundy, Sorensen, Robert Kennedy and a few others, sworn to secrecy. Robert Kennedy to see Dobrynin: the missiles out and no invasion, or "further action was unavoidable"; no public deal on Turkey, but the Jupiters to go after the crisis; any Soviet mention of it to void it. Made public by Bundy, 1988.'
        n: '[[w.thomas-robert-kennedy]], 227–28. To check: [[w.bundy-danger-and-survival]], 432–44 (cited by [[w.thomas-robert-kennedy]], 227 n.). See [[cal.1962-10-27.missile-crisis]]. Names: Kennedy, Rusk, McNamara, Bundy, Sorensen, Robert Kennedy, Dobrynin.'
        src:
          c: ebad6438
          rows:
            - 'w.thomas-robert-kennedy 227–28: all'
        tags: [name:kennedy-john-f, name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:sorensen-theodore-c, name:kennedy-robert-f, name:dobrynin-anatoly]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-27.missile-crisis-9
        when: Oct. 27
        date: '1962-10-27'
        thread: missile-crisis
        c: 'From 9 p.m., the ExComm, taped. Robert Kennedy to McNamara: "How are you doing, Bob?" McNamara: be sure the Russians understand the consequences; "an eye for an eye." Robert Kennedy: "I''d take Cuba back." Someone: "Suppose we make Bobby mayor of Havana."'
        n: '[[w.thomas-robert-kennedy]], 229. To check: [[w.kennedy-tapes]], 628 (cited by [[w.thomas-robert-kennedy]], 229 n.). Names: Robert Kennedy, McNamara.'
        src:
          c: acc822ad
          rows:
            - 'w.thomas-robert-kennedy 229: all'
        tags: [name:kennedy-robert-f, name:mcnamara-robert-s]
      section: '196210'
