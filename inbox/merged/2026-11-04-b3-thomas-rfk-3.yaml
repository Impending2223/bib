  - add:
      entry:
        id: cal.1960-04-04.press-and-broadcasting
        when: Apr. 4
        date: '1960-04-04'
        thread: press-and-broadcasting
        also: [elections-1960]
        c: 'Milwaukee, a German restaurant, the night before the Wisconsin primary. Robert Kennedy asks Vanocur of NBC how they will do; Vanocur: "I think you''ll carry the Catholic vote." Robert Kennedy blows up. Vanocur to Kennedy at the door: "That brother of yours has no manners"; Kennedy: "Ignore him."'
        n: '[[w.thomas-robert-kennedy]], 108. Names: Robert Kennedy, Kennedy. Check: Thomas cites no source.'
        src:
          c: ece99f6a
          rows:
            - 'w.thomas-robert-kennedy 108: all'
        tags: [name:kennedy-robert-f, name:kennedy-john-f]
      section: '196004'
  - add:
      entry:
        id: cal.1960-04.elections-1960-10
        when: Apr.
        date: 1960-04
        thread: elections-1960
        also: [labor]
        c: West Virginia, after Wisconsin. Kennedy asks Meany and Reuther, quietly, to have Humphrey disavow religious bigotry; they call on him. Humphrey refuses to be labor's "tool." By O'Donnell's account.
        n: '[[w.thomas-robert-kennedy]], 94. To check: Kenneth O''Donnell, tape-recorded reminiscences with Sander Vanocur, JFK Library (cited by [[w.thomas-robert-kennedy]], 94). Names: Kennedy, Meany, Reuther, Humphrey, O''Donnell. Check: the day.'
        src:
