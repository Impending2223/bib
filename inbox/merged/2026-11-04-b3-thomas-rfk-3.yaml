          rows:
            - 'w.thomas-robert-kennedy 234: all'
            - 'via x.1962-11-14.harvey-chronology-of-matahambre: all'
        tags: [name:kennedy-robert-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-24.cuba
        when: Oct. 24
        date: '1962-10-24'
        thread: cuba
        also: [robert-kennedy, missile-crisis]
        c: 'San Roman to Robert Kennedy by telephone from Miami: the CIA means to send some sixty exiles into Cuba for intelligence for an invasion. News to Kennedy; on the telephone he learns the CIA is already putting teams in. By San Roman''s account.'
        n: '[[w.thomas-robert-kennedy]], 234–35. Names: Robert Kennedy. Check: the day; Thomas: "probably" Oct. 24 or 25.'
        src:
