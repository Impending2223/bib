        thread: civil-rights-the-executive
        also: [robert-kennedy, voting-rights]
        c: 'Robert Kennedy to Marshall on the Civil Rights Division''s case against a Democratic constable in Wayne County, W. Va., for the false arrest of a Republican election official on election day, 1960: "Burke, this is the kind of thing that could lose West Virginia for us. ... You just don''t seem to understand how things are done in West Virginia."'
