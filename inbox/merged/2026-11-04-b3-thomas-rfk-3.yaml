      item: '[[w.thomas-robert-kennedy]], 237 (Nolan to Robert Kennedy at 5 a.m.: no cash, no prisoners; $2.9 million; Cushing''s $1 million, Clay''s note; Kennedy on the stairs at Hickory Hill: "All right you guys, what about Hoffa?")'
      units: B-C
  - cite:
      id: cal.1962-12-29.cuba
