          rows:
            - 'w.thomas-robert-kennedy 105: all'
        tags: [name:kennedy-robert-f]
      section: '196009'
  - add:
      entry:
        id: cal.1960-09-26.elections-1960-6
        when: Sept. 26
        date: '1960-09-26'
        thread: elections-1960
        c: 'Chicago, the first debate. Asked by a CBS producer, Kennedy declines makeup; Nixon, listening, declines it too. Kennedy powdered by his own man in his dressing room; Nixon applies a "Lazy-Shave" stick. Robert Kennedy, asked in the control room by a Nixon aide how Nixon looks: "Terrific." Afterward, among the reporters around Nixon, a woman planted by Tuck: "That''s all right. You''ll do better next time."'
        n: '[[w.thomas-robert-kennedy]], 105–06. To check: [[w.matthews-kennedy-and-nixon]], 148–49, 159 (cited by [[w.thomas-robert-kennedy]], 105). See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Nixon, Robert Kennedy.'
        src:
          c: 55b0ddfa
          rows:
            - 'w.thomas-robert-kennedy 105–06: all'
        tags: [name:kennedy-john-f, name:nixon-richard-m, name:kennedy-robert-f]
      section: '196009'
  - add:
      entry:
        id: cal.1960-10-07.elections-1960-2
        when: Oct. 7
        date: '1960-10-07'
        thread: elections-1960
        c: Washington, the second debate. Nixon's men have the studio kept cold; Robert Kennedy storms into the control room and demands the heat turned up.
        n: '[[w.thomas-robert-kennedy]], 106. See [[cal.1960-10-07.elections-1960]]. Names: Nixon, Robert Kennedy.'
        src:
          c: f36a1133
          rows:
            - 'w.thomas-robert-kennedy 106: all'
        tags: [name:nixon-richard-m, name:kennedy-robert-f]
      section: '196010'
  - add:
      entry:
        id: cal.1960-10.elections-1960-15
        when: Oct.
        date: 1960-10
        thread: elections-1960
        c: 'Anti-Catholic literature traced to a press in a building on Long Island owned by H. L. Hunt. Hunt then gives the campaign a large donation; Robert Kennedy has it returned: a Kennedy administration might want to prosecute the press''s owner. By Seigenthaler''s account.'
        n: '[[w.thomas-robert-kennedy]], 99–100. To check: John Seigenthaler oral history, JFK Library (cited by [[w.thomas-robert-kennedy]], 99). Names: Robert Kennedy, Seigenthaler. Check: the month; Thomas: "That fall."'
        src:
          c: f3547178
          rows:
            - 'w.thomas-robert-kennedy 99–100: all'
            - 'via w.thomas-robert-kennedy 99 n.h-l-hunt-donation: all'
        tags: [name:kennedy-robert-f, name:seigenthaler-john]
      section: '196010'
  - add:
      entry:
        id: cal.1960-10.king
        when: Oct., late
        date: 1960-10
        thread: king
        also: [elections-1960, robert-kennedy]
        c: 'A few days after King''s jailing, by Vandiver''s account. Kennedy telephones Governor Vandiver at 6:30 a.m.: can he get King out? Vandiver, a segregationist who cannot act in public, calls George D. Stewart, secretary of the State Senate and a friend of Judge Mitchell. Mitchell will release King if he can say Kennedy or his brother called him. Vandiver tells Kennedy; Kennedy has Robert Kennedy call the judge.'
        n: '[[w.thomas-robert-kennedy]], 102–03. Made public: Vandiver to Jack Bass, 1993 ([[w.thomas-robert-kennedy]], 103). To check: J. Ernest Vandiver oral history, JFK Library (cited by [[w.thomas-robert-kennedy]], 102); [[w.bass-taming-the-storm]], 168–71; Clifford Kuhn, "''There''s a Footnote to History!''," *Journal of American History* (Sept. 1997) (cited by [[w.thomas-robert-kennedy]], 103). See [[cal.1960-10-25.king]]. Names: Kennedy, Vandiver, Mitchell, Robert Kennedy, Martin Luther King. Check: the day; Thomas: "one morning a few days after King''s imprisonment"; King was out Oct. 27.'
        src:
          c: 21fe44e4
          rows:
            - 'w.thomas-robert-kennedy 102–03: all'
            - 'via w.thomas-robert-kennedy 102 n.more-complicated: all'
            - 'via w.thomas-robert-kennedy 103 n.vandiver-broke-his-silence: all'
        tags: [name:kennedy-john-f, name:vandiver-s-ernest-jr, name:mitchell-oscar, name:kennedy-robert-f, name:king-martin-luther-jr, state:ga]
      section: '196010'
  - add:
      entry:
        id: cal.1960-11.elections-1960-6
        when: Nov., early
        date: 1960-11
        thread: elections-1960
        c: 'The campaign''s last week. Robert Kennedy has Haddad, a New York Post reporter he uses as an investigator, work with Bellino, his accountant from the Rackets Committee, on a file of negative research on Nixon: by Haddad''s later account, Nixon''s land deals with Rebozo among it.'
        n: '[[w.thomas-robert-kennedy]], 106. Names: Robert Kennedy, Nixon, Rebozo. Check: the day.'
        src:
          c: e2544a65
          rows:
            - 'w.thomas-robert-kennedy 106: all'
            - 'via w.thomas-robert-kennedy 106 n.haddad-role: all'
        tags: [name:kennedy-robert-f, name:nixon-richard-m, name:rebozo-charles-g]
      section: '196011'
  - add:
      entry:
        id: cal.1960-11-08.elections-1960-9
        when: Nov. 8
        date: '1960-11-08'
        thread: elections-1960
        also: [robert-kennedy]
        c: 'Hyannis Port, election night. Robert Kennedy''s command center on the sunporch of his cottage, with Harris and the returns. At 7:15 p.m.: "We''re being clobbered"; minutes later Bailey calls: Connecticut carried, a heavy turnout. In the small hours Daley to Robert Kennedy: Illinois will come in. Robert Kennedy the last awake; to bed about 7 a.m.'
        n: '[[w.thomas-robert-kennedy]], 107. To check: [[w.white-making-of-the-president]], 344–47; James W. Hilty, *Robert Kennedy: Brother Protector*, 179 (cited by [[w.thomas-robert-kennedy]], 107). See [[cal.1960-11-08.elections-1960-3]]. Names: Robert Kennedy, Harris, Daley.'
        src:
          c: 7824f674
          rows:
            - 'w.thomas-robert-kennedy 107: all'
            - 'via w.thomas-robert-kennedy 107 n.election-returns: all'
        tags: [name:kennedy-robert-f, name:harris-louis, name:daley-richard-j]
      section: '196011'
  - add:
      entry:
        id: cal.1960-11.press-and-broadcasting
        when: Nov.
        date: 1960-11
        thread: press-and-broadcasting
        also: [robert-kennedy, king]
        c: 'After the election. Kempton asks Robert Kennedy whether he is glad he called King''s judge. Robert Kennedy: "Sure I''m glad, but I would hope I''m not glad for the reason you think I''m glad."'
        n: '[[w.thomas-robert-kennedy]], 104. To check: [[w.schlesinger-robert-kennedy-and-his]], 218 (cited by [[w.thomas-robert-kennedy]], 104). See [[cal.1960-10-25.king]]. Names: Robert Kennedy.'
        src:
          c: 64be4283
          rows:
            - 'w.thomas-robert-kennedy 104: all'
        tags: [name:kennedy-robert-f]
      section: '196011'
