        when: July, before the convention
        date: 1960-07
        thread: elections-1960
        also: [robert-kennedy]
        c: 'Los Angeles, the eve of the convention, after the Johnson camp''s talk of Kennedy''s health. Robert Kennedy seeks out Bobby Baker at a hotel and, fists clenched, hisses: "You''ll get yours." By Baker''s account.'
        n: '[[w.thomas-robert-kennedy]], 97. To check: [[w.baker-wheeling-and-dealing]], 118 (cited by [[w.thomas-robert-kennedy]], 97). See [[cal.1960-07-04.robert-kennedy]]. Names: Robert Kennedy, Baker.'
        src:
          c: ade1fb73
          rows:
            - 'w.thomas-robert-kennedy 97: all'
        tags: [name:kennedy-robert-f, name:baker-robert-g]
      section: '196007'
