        date: '1961-05-22'
        thread: robert-kennedy
        also: [freedom-rides, king]
        c: 'After midnight, the Guard holding the church. King to Robert Kennedy, who is giving a Time reporter an interview: "You shouldn''t have withdrawn the marshals." Kennedy: he has confidence in the state police chief and the Guard''s commander; "if it hadn''t been for the United States Marshals, you''d be dead as Kelsey''s nuts right now!"'
        n: '[[w.thomas-robert-kennedy]], 131. To check: [[w.reeves-president-kennedy]], 131, 682 (cited by [[w.thomas-robert-kennedy]], 131). See [[cal.1961-05-21.robert-kennedy-2]]. Names: Martin Luther King, Robert Kennedy.'
