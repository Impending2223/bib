        n: '[[w.thomas-robert-kennedy]], 128. To check: [[w.robert-kennedy-in-his]], 83; [[w.guthman-we-band-of-brothers]], 167 (cited by [[w.thomas-robert-kennedy]], 128). Names: Robert Kennedy. Check: the day.'
