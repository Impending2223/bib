        when: Sept. 4
        date: '1962-09-04'
        thread: soviet-union
        also: [robert-kennedy, cuba]
        c: 'Bolshakov in the Oval Office. The President: tell Khrushchev "I''ve ordered those flights stopped today," the surveillance of Soviet ships bound for Cuba. In the alley outside, Robert Kennedy: "Goddamn it, Georgi, doesn''t Premier Khrushchev realize the President''s position?" Nothing provocative before November; "they" on the right "might go to any length."'
        n: '[[w.thomas-robert-kennedy]], 207–08. To check: [[w.fursenko-one-hell-of-a]], 193–94 (cited by [[w.thomas-robert-kennedy]], 207 n.). See [[cal.1962-08.soviet-union]]. Names: Bolshakov, Kennedy, Khrushchev, Robert Kennedy, Keating.'
