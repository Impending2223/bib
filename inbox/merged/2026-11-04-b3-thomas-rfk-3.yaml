        when: May 21
        date: '1961-05-21'
        thread: robert-kennedy
        also: [freedom-rides, king]
        c: 'The siege of the First Baptist Church. King by telephone to Robert Kennedy at his command post in his office: when is help coming? Kennedy: more marshals on the way; "As long as you''re in church, Reverend King, and our men are down there, you might as well say a prayer for us." King: "If they don''t get here immediately, we''re going to have a bloody confrontation." Burke Marshall listening.'
        n: '[[w.thomas-robert-kennedy]], 130. To check: [[w.garrow-bearing-the-cross]], 156–58 (cited by [[w.thomas-robert-kennedy]], 130). See [[cal.1961-05-21.freedom-rides]]. Names: Martin Luther King, Robert Kennedy, Marshall.'
