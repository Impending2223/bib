        date: '1961-05-21'
        thread: freedom-rides
        also: [robert-kennedy, alabama]
        c: 'During the siege. Patterson to Robert Kennedy: the demonstration endangers his political career. Kennedy: "John, it''s more important that those people in the church survive physically than for us to survive politically."'
        n: '[[w.thomas-robert-kennedy]], 132. To check: Salinger, Guthman, Mankiewicz and Seigenthaler, eds., *An Honorable Profession*, 20–21 (cited by [[w.thomas-robert-kennedy]], 132). See [[cal.1961-05-21.freedom-rides]]. Names: Patterson, Robert Kennedy.'
