          rows:
            - 'w.thomas-robert-kennedy 94: all'
            - 'via w.thomas-robert-kennedy 94 n.cheap-cunning-politician: all'
        tags: [name:kennedy-john-f, name:meany-george, name:reuther-walter, name:humphrey-hubert-h, name:odonnell-kenneth-p]
      section: '196004'
  - add:
      entry:
        id: cal.1960-05.elections-1960-16
        when: May
        date: 1960-05
        thread: elections-1960
        c: West Virginia, before the primary. Raymond Chafin, a local boss, asks the Kennedy campaign for $3,500 for drivers to take voters to the polls; heard as $35,000, he is handed two suitcases of cash at the airport. By Chafin's account.
        n: '[[w.thomas-robert-kennedy]], 95. To check: Raymond Chafin and Topper Sherwood, *Just Good Politics*, 127–45 (cited by [[w.thomas-robert-kennedy]], 95). Check: the day.'
        src:
          c: dda9ad0e
          rows:
            - 'w.thomas-robert-kennedy 95: all'
            - 'via w.thomas-robert-kennedy 95 n.chafin: all'
        tags: []
      section: '196005'
  - add:
      entry:
        id: cal.1960-05-10.elections-1960-3
        when: May 10
        date: '1960-05-10'
        thread: elections-1960
        c: 'West Virginia, primary day. Donahue, a Lowell lawyer working for the Kennedys, has delivered $25,000 to the poll workers, in bundles of up to $100 to precinct leaders, to "keep their organizations going." White beside him watching the voters: "Isn''t democracy wonderful!" By Donahue''s account.'
        n: '[[w.thomas-robert-kennedy]], 95. See [[cal.1960-05-10.elections-1960]]. Names: White.'
        src:
          c: 67f52f50
          rows:
            - 'w.thomas-robert-kennedy 95: all'
            - 'via w.thomas-robert-kennedy 95 n.divided-into-little-bundles: all'
        tags: [name:white-theodore-h]
      section: '196005'
  - add:
      entry:
        id: cal.1960-05-10.elections-1960-4
        when: May 10
        date: '1960-05-10'
        thread: elections-1960
        also: [robert-kennedy]
        c: 'Late that night. Robert Kennedy at Humphrey''s hotel room; Humphrey''s workers clear a path; he kisses Muriel Humphrey on the cheek. Rauh, there: "I thought she was going to hit him."'
        n: '[[w.thomas-robert-kennedy]], 95–96. To check: Joseph Rauh oral history, LBJ Library (cited by [[w.thomas-robert-kennedy]], 96). See [[cal.1960-05-10.elections-1960-2]]. Names: Robert Kennedy, Humphrey, Rauh.'
        src:
          c: 2f52a47e
          rows:
            - 'w.thomas-robert-kennedy 95–96: all'
            - 'via w.thomas-robert-kennedy 96 n.going-to-hit-him: all'
        tags: [name:kennedy-robert-f, name:humphrey-hubert-h, name:rauh-joseph-l-jr]
      section: '196005'
  - add:
      entry:
        id: cal.1960-05-11.elections-1960-3
        when: May 11
        date: '1960-05-11'
        thread: elections-1960
        also: [robert-kennedy]
        c: '3 a.m. Robert Kennedy telephones Bill Rivkin, president of the Young Democrats of Illinois and a friend of Humphrey''s, on whom he had slammed a door in Milwaukee on Wisconsin''s primary night: "Okay. Jack won. Are you with us?" Rivkin is.'
        n: '[[w.thomas-robert-kennedy]], 93, 96. Names: Robert Kennedy, Humphrey.'
        src:
