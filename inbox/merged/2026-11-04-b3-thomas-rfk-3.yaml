  - add:
      entry:
        id: cal.1962-09.cuba-bay-of-pigs
        when: Sept.
        date: 1962-09
        thread: cuba-bay-of-pigs
        also: [robert-kennedy]
        c: 'Robert Kennedy chairs a meeting on the Bay of Pigs prisoners, Rusk and Bundy present. Bundy: paying ransom to Communists before the election unwise. Kennedy: "I don''t care if we lose every election until Kingdom come. We put those guys in there and we are going to get them out." He throws his pencil across the table and walks out.'
        n: '[[w.thomas-robert-kennedy]], 236. Names: Robert Kennedy, Rusk, Bundy. Check: the day.'
