        when: Aug.
        date: 1960-08
        thread: elections-1960
        c: 'Robert Kennedy roused that Jackie Robinson backs Nixon. Kennedy: "Tell Bobby that we''re running against Nixon, not Jackie Robinson."'
        n: '[[w.thomas-robert-kennedy]], 108. Names: Robert Kennedy, Robinson, Nixon, Kennedy. Check: Thomas cites no source.'
