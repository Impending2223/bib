          rows:
            - 'w.thomas-robert-kennedy 236: all'
            - 'via x.undated.john-nolan-interview-thomas: all'
        tags: [name:kennedy-robert-f, name:donovan-james-b]
      section: '196211'
  - add:
      entry:
        id: cal.1962-12.cuba-4
        when: Dec., early
        date: 1962-12
        thread: cuba
        also: [robert-kennedy]
        c: 'A Sunday morning, Hickory Hill, the library. Robert Kennedy and Quintero on a new operation against Castro, apart from the CIA. Kennedy: "There was no chance" of an invasion now; who could unite the opposition? Quintero names Artime, still in prison. By Quintero''s account.'
        n: '[[w.thomas-robert-kennedy]], 235–36. Names: Robert Kennedy, Castro, Artime. Check: the day.'
        src:
          c: 673712a1
          rows:
            - 'w.thomas-robert-kennedy 235–36: all'
            - 'via x.undated.rafael-quintero-interview-thomas: all'
        tags: [name:kennedy-robert-f, name:castro-fidel, name:artime-manuel]
      section: '196212'
