            - 'via w.thomas-robert-kennedy 96 n.are-you-with-us: all'
            - 'via w.thomas-robert-kennedy 93 n.bill-rivkin-story: all'
        tags: [name:kennedy-robert-f, name:humphrey-hubert-h]
      section: '196005'
  - add:
