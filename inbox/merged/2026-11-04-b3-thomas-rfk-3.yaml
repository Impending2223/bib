          c: 8b62b088
          rows:
            - 'w.thomas-robert-kennedy 236: all'
            - 'via x.undated.mike-miskovsky-interview-thomas: all'
        tags: [name:kennedy-robert-f, name:rusk-dean, name:bundy-mcgeorge]
      section: '196209'
  - add:
      entry:
        id: cal.1962-10-16.cuba-2
        when: Oct. 16
        date: '1962-10-16'
        thread: cuba
        also: [robert-kennedy, missile-crisis]
        c: 'The first or second day of the crisis. Robert Kennedy to Roberto San Roman, without telling him of the missiles: "What do you think you can do to provoke a situation?" San Roman: badly damage a Russian ship approaching port. Kennedy sends him to Lansdale. By San Roman''s account.'
        n: '[[w.thomas-robert-kennedy]], 234. Names: Robert Kennedy, Lansdale. Check: the day; Oct. 16 or 17.'
        src:
          c: 30ba6b6e
          rows:
            - 'w.thomas-robert-kennedy 234: all'
            - 'via x.undated.roberto-san-roman-interview-thomas: all'
        tags: [name:kennedy-robert-f, name:lansdale-edward-g]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-19.cuba
        when: Oct. 19
        date: '1962-10-19'
        thread: cuba
        also: [missile-crisis]
        c: Night. With Robert Kennedy's approval, six exile commandos set out again against the Matahambre mines; the two sent ashore are lost. Three missions failed in September.
        n: '[[w.thomas-robert-kennedy]], 234. To check: Harvey to the Director of Central Intelligence, "Chronology of Matahambre Mine Sabotage Operation," Nov. 14, 1962, Assassination Records Review Board, Gerald Ford Library (cited by [[w.thomas-robert-kennedy]], 234 n.). Names: Robert Kennedy.'
        src:
