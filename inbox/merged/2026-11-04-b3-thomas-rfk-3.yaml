        date: 1960-07
        thread: elections-1960
        also: [robert-kennedy]
        c: Los Angeles. Robert Kennedy assures labor leaders and northern liberals that Johnson is not even on the list for Vice President.
        n: '[[w.thomas-robert-kennedy]], 97. Names: Robert Kennedy, Johnson. Check: the day.'
