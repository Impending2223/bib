        when: Sept.
        date: 1960-09
        thread: elections-1960
        also: [robert-kennedy, georgia]
        c: 'Georgia, a trip. At Savannah for a political dinner, Robert Kennedy has himself driven through the Negro part of town. An aide to the governor tells him no Negroes will be at the dinner, the hotels being segregated. Robert Kennedy: no Negroes, no dinner.'
        n: '[[w.thomas-robert-kennedy]], 100. To check: Scott Peek oral history, Senate Historical Office (cited by [[w.thomas-robert-kennedy]], 100). Names: Robert Kennedy. Check: the day.'
        src:
          c: c50161ca
          rows:
            - 'w.thomas-robert-kennedy 100: all'
            - 'via w.thomas-robert-kennedy 100 n.no-blacks-no-dinner: all'
        tags: [name:kennedy-robert-f, state:ga]
      section: '196009'
  - add:
