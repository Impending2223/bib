        when: May, late
        date: 1961-05
        thread: freedom-rides
        also: [robert-kennedy]
        c: 'After King''s refusal of bail for the riders in Jackson. Robert Kennedy to Wofford: "This is too much! I wonder if they have the best interests of their country at heart. Do you know that one of them is against the atom bomb?"'
        n: '[[w.thomas-robert-kennedy]], 132. To check: [[w.wofford-of-kennedys-and-kings]], 156 (cited by [[w.thomas-robert-kennedy]], 132). See [[cal.1961-05-24.robert-kennedy]]. Names: Robert Kennedy, Wofford.'
