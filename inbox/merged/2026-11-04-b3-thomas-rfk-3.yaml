        also: [press-and-broadcasting, latin-america]
        c: 'Maas of the Saturday Evening Post puts to Robert Kennedy the evidence that Igor Cassini, a friend of Joseph Kennedy''s, took $200,000 as Trujillo''s secret agent. Kennedy: "Thank you very much." The next day two FBI agents ask Maas for his notes. The President sends Salinger to talk Maas out of the story. By Maas''s account.'
