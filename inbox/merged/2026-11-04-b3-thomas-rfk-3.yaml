          rows:
            - 'w.thomas-robert-kennedy 234–35: all'
            - 'via x.undated.roberto-san-roman-interview-thomas: all'
        tags: [name:kennedy-robert-f]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-26.cuba-2
        when: Oct. 26
        date: '1962-10-26'
        thread: cuba
        also: [missile-crisis, robert-kennedy]
        c: '2:30 p.m., the Special Group (Augmented), the Chiefs'' operations room at the Pentagon. Robert Kennedy at Harvey: why send exiles into Cuba now without approval? Harvey: in support of the military''s planning; the Kennedys to blame for the Bay of Pigs and the crisis. Kennedy walks out. McCone later: "Harvey has destroyed himself today."'
        n: '[[w.thomas-robert-kennedy]], 235. To check: McCone, memorandum of Mongoose meeting, Oct. 26, 1962, Assassination Records Review Board; David Corn, *Blond Ghost*, 93 (cited by [[w.thomas-robert-kennedy]], 235 n.). Names: Robert Kennedy, Harvey, McCone.'
        src:
          c: 1f8637e3
          rows:
            - 'w.thomas-robert-kennedy 235: all'
            - 'via x.1962-10-26.mccone-memorandum-of-mongoose-meeting: all'
        tags: [name:kennedy-robert-f, name:harvey-william-k, name:mccone-john-a]
      section: '196210'
  - add:
      entry:
        id: cal.1962-10-28.robert-kennedy
        when: Oct. 28
        date: '1962-10-28'
        thread: robert-kennedy
        also: [missile-crisis]
        c: 'After the news, Robert Kennedy to the White House, then to Dobrynin: "a great relief"; "At last I''m going to see my kids." Dobrynin sees him smile for the first time in the crisis.'
        n: '[[w.thomas-robert-kennedy]], 230–31. To check: [[w.dobrynin-in-confidence]], 92 (cited by [[w.thomas-robert-kennedy]], 231 n.). See [[cal.1962-10-28.missile-crisis]]. Names: Robert Kennedy, Dobrynin.'
        src:
          c: da7047c1
          rows:
            - 'w.thomas-robert-kennedy 230–31: all'
        tags: [name:kennedy-robert-f, name:dobrynin-anatoly]
      section: '196210'
  - add:
      entry:
        id: cal.1962-11.cuba-bay-of-pigs
        when: Nov., late
        date: 1962-11
        thread: cuba-bay-of-pigs
        also: [robert-kennedy]
        c: Told by a cattle breeder back from Castro's jails that the prisoners are dying "like animals," Robert Kennedy has his top aides at Justice get them out by Christmas. Miskovsky of the CIA's counsel's office suggests Donovan.
        n: '[[w.thomas-robert-kennedy]], 236. To check: [[w.schlesinger-robert-kennedy-and-his]], 536–38 (cited by [[w.thomas-robert-kennedy]], 236 n.). Names: Robert Kennedy, Donovan. Check: the day.'
