        when: Sept.
        date: 1960-09
        thread: elections-1960
        c: 'Robert Kennedy through the Catskills, to Jewish voters: an attack on Catholics could presage an attack on them.'
        n: '[[w.thomas-robert-kennedy]], 105. Names: Robert Kennedy. Check: the day; Thomas cites no source.'
        src:
