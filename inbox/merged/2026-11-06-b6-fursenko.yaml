      when: Aug.
      date: 1960-08
      thread: cuba
      also:
      - soviet-union
      c: The KGB renames its file on the Castro regime, from YOUNGSTYE ("Youngsters") to AVANPOST ("Bridgehead").
      n: '[[w.fursenko-khrushchevs-cold-war]], 306. Check: the day. To check: [[w.fursenko-one-hell-of-a]], 55 (cited by [[w.fursenko-khrushchevs-cold-war]],
        306 n.62).'
      src:
        c: 8b2378cf
        rows:
        - 'w.fursenko-khrushchevs-cold-war 306: all'
- add:
    entry:
      id: cal.1961-06.transition-and-staff
      when: June
      date: 1961-06
      thread: transition-and-staff
      c: After Vienna, Kennedy some days at Palm Beach. The back, hurt at Ottawa, flares; on crutches again. A fruit picker's
        crane lifts him onto Air Force One for the flight back. His cortisone raised against a virus.
      n: '[[w.fursenko-khrushchevs-cold-war]], 367. Check: the days. Check: Fursenko and Naftali put the injury at Ottawa
        in March; the visit was in May (see [[cal.1961-05-16.transition-and-staff]]). To check: [[w.sidey-john-f-kennedy-president]],
        173–74 (cited by [[w.fursenko-khrushchevs-cold-war]], 367 n.6); [[w.dallek-unfinished-life]] (cited by [[w.fursenko-khrushchevs-cold-war]],
        367 n.5). Names: John F. Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 856d7775
        rows:
        - 'w.fursenko-khrushchevs-cold-war 367: all'
- add:
    entry:
      id: cal.1961-06.berlin-and-vienna
      when: June
      date: 1961-06
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: After Vienna, Kennedy reads aloud from the State Department's transcripts of his talks with Khrushchev to close friends,
        Joseph Alsop and Philip Graham of the *Washington Post* among them.
      n: '[[w.fursenko-khrushchevs-cold-war]], 367. Check: the day. To check: [[w.bohlen-witness-to-history-1929]], 483 (cited
        by [[w.fursenko-khrushchevs-cold-war]], 367 n.4). See [[cal.1961-06-03.berlin-and-vienna]]. Names: John F. Kennedy,
        Khrushchev, Alsop.'
      tags:
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:alsop-joseph
      src:
        c: 59cde123
        rows:
        - 'w.fursenko-khrushchevs-cold-war 367: all'
