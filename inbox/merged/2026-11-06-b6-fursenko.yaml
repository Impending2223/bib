      when: Jan. 20
      date: '1962-01-20'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: After an East German complaint, the Soviet Foreign Ministry rejects Pervukhin's recommendation of a protest at the
        U.S. Army's use of the autobahn. The ambassador in East Berlin told it is unnecessary.
      n: '[[w.fursenko-khrushchevs-cold-war]], 421, 608 n.26 ("In mid-January"). To check: Foreign Ministry record, Jan. 20,
        1962, MFA (cited by [[w.fursenko-khrushchevs-cold-war]], 421 n.26). Names: Pervukhin.'
      tags:
      - name:pervukhin-mikhail-georgievich
      src:
        c: cab4544f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 421, 608 n.26: all'
        - 'via w.fursenko-khrushchevs-cold-war 421 n.26: all'
