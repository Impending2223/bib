      when: Aug.
      date: 1961-08
      thread: berlin-and-vienna
      c: 'Schlesinger to a friend: "I feel more gloomy about international developments than I have felt since the summer
        of 1939."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 387. Check: the day: the work sets it in the late summer, after Kennan''s return
        from Belgrade in August. To check: [[w.schlesinger-thousand-days-1965]], 397–98 (cited by [[w.fursenko-khrushchevs-cold-war]],
        387 n.97). See [[cal.1961-08.berlin-and-vienna-2]]. Names: Schlesinger.'
      tags:
      - name:schlesinger-arthur-m-jr
      src:
        c: 9dc2f4f4
        rows:
        - 'w.fursenko-khrushchevs-cold-war 387: all'
- add:
    entry:
      id: cal.1961-10.soviet-union
      when: Oct.
      date: 1961-10
      thread: soviet-union
      also:
      - china
      - indonesia
      c: Moscow, the Twenty-Second Party Congress. The Laotian, Vietnamese and Chinese Communists refuse to back Khrushchev's
        criticism of the Albanians; so do the Indonesians, who had echoed his criticism of Stalin in 1956.
      n: '[[w.fursenko-khrushchevs-cold-war]], 400. Check: the days. See [[cal.1961-10-31.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 668e688f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 400: all'
- add:
    entry:
      id: cal.1961-12-01.china
      when: Dec. 1
      date: '1961-12-01'
      thread: china
      also:
      - berlin-and-vienna
      c: 'Peking. The East German ambassador, Hegen, to the Polish minister counselor: the Chinese wonder why Khrushchev has
        not shown the courage of 1956. At Suez "the Soviet ultimatum, which was taken seriously, scared the imperialists";
        his retreat now will "only induce the adversary to even firmer policies, to greater demands, and to stronger provocations."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 411 ("at the end of 1961"). To check: memorandum of conversation, Hegen with
        the Polish minister counselor, Dec. 1, 1961, cited in [[w.harrison-driving-the-soviets-up]], 240 (cited by [[w.fursenko-khrushchevs-cold-war]],
        411 n.7). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: f6de3c07
        rows:
        - 'w.fursenko-khrushchevs-cold-war 411: all'
        - 'via w.fursenko-khrushchevs-cold-war 411 n.7: all'
- add:
    entry:
