      when: Feb.
      date: 1964-02
      thread: soviet-union
      c: 'Khrushchev to a visiting Italian dignitary, asked whether he will write his memoirs: "Perhaps," "when they send
        me away."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 539. Check: the day. To check: Brimelow''s dispatch, British Embassy, Moscow,
        Mar. 6, 1964, FO 371/177165, National Archives (UK) (cited by [[w.fursenko-khrushchevs-cold-war]], 539 n.31). Names:
        Khrushchev.'
      tags:
