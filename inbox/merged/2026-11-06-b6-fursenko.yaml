- add:
    entry:
      id: cal.1960-05-17.soviet-union-u2-3
      when: May 17
      date: '1960-05-17'
      time: 1960-05-17T14:00Z
      thread: soviet-union-u2
      also:
      - europe-and-the-alliance
      c: 'Paris, 3 p.m. Eisenhower, Macmillan and de Gaulle with their ministers, the Soviets absent. Khrushchev''s word by
        telephone: a meeting only to resume the day before''s debate. De Gaulle: the summit cannot convene; it has not even
        started. Macmillan for holding the declaration until Khrushchev answers in writing. Eisenhower: if de Gaulle wants
        to see "this man" he will not object.'
      n: '[FRUS 1958–60, IX, doc. 178](https://history.state.gov/historicaldocuments/frus1958-60v09/d178) (May 17, 1960, 3
        p.m.). [[w.fursenko-khrushchevs-cold-war]], 288 (Eisenhower''s "this man"). Made public: FRUS 1958–60, IX. See [[cal.1960-05-17.soviet-union-u2-2]].
        Names: Eisenhower, Macmillan, de Gaulle, Khrushchev.'
      tags:
      - name:eisenhower-dwight-d
      - name:macmillan-harold
      - name:de-gaulle-charles
      - name:khrushchev-nikita-s
      src:
        c: a8dba780
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d178: all'
        - 'w.fursenko-khrushchevs-cold-war 288: G'
        - 'via w.fursenko-khrushchevs-cold-war 288 n.82: all'
- add:
    entry:
      id: cal.1960-05-17.soviet-union-u2-4
      when: May 17
      date: '1960-05-17'
      thread: soviet-union-u2
      also:
      - europe-and-the-alliance
      c: 'Macmillan, by his diary: "The Summit—on which I had set high hopes and for which I worked for over 2 years—has blown
        up, like a volcano! It is ignominious; it is tragic; it is almost incredible."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 288. Check: the day: the work sets the words on the day of Khrushchev''s brushoff.
        To check: Macmillan''s diary, quoted in [[w.horne-macmillan-1957-1986]], II, 228 (cited by [[w.fursenko-khrushchevs-cold-war]],
        288 n.83). See [[cal.1960-05-17.soviet-union-u2-3]]. Names: Macmillan.'
      tags:
      - name:macmillan-harold
      src:
        c: c16afbe9
        rows:
        - 'w.fursenko-khrushchevs-cold-war 288: all'
        - 'via w.fursenko-khrushchevs-cold-war 288 n.83: all'
- add:
    entry:
