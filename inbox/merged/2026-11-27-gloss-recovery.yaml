- edit:
    id: cal.1964-06-07.states-and-cities-us
    base: 01b0cad6
    set:
      gloss:
        title: Commentary
        text:
        - 'Hess and Broder (1967): at Cleveland the governors'' "attempted power play" to block Goldwater''s nomination collapsed in "a tragicomedy" of rival ambitions, poor communication and bad politics ([[w.hess-republican-establishment]], 31–32).'
- edit:
    id: cal.1964-12-28.china-leadership
    base: d7c2f54e
    set:
      gloss:
        title: Commentary
        text:
        - 'Mao to Edgar Snow (Dec. 10, 1970): the first point of the Twenty-three Articles, against those in authority taking the capitalist road, Liu Shaoqi had "strenuously opposed" right at the meeting ([[w.macfarquhar-origins-of-the-cultural]], III, 431 and n.1).'
        - 'Hu Qiaomu, as Cong Jin (1989) quotes him: Liu did not oppose the point directly, but spoke only of the overlapping of contradictions among the people with those between the people and the enemy ([[w.macfarquhar-origins-of-the-cultural]], III, 431 and n.4).'
        - 'MacFarquhar (1997): the "capitalist roaders" are in article 2, not article 1 ([[w.macfarquhar-origins-of-the-cultural]], III, 431 n.1).'
- edit:
    id: cal.1968-09-10.elections-1968
    base: 1501b3da
    set:
      gloss:
        title: Commentary
        text:
        - 'Chester, Hodgson and Page (1969): George Christian "still insists" that the New Orleans speech was written a week before Humphrey''s statement, that Johnson went over it on the plane with two speech-writers, and that Humphrey''s statement was never mentioned: "We goofed." Larry O''Brien, Humphrey''s manager, told of it: "That isn''t how I remember it" ([[w.chester-american-melodrama]], 634).'
- edit:
    id: cal.1964-05.middle-east
    base: 1bd4189d
    set:
      gloss:
        title: Commentary
        text:
        - 'Friedman (2015): the visit, the culmination of Khrushchev''s policy in the developing world, was announced just after Zhou Enlai''s tour of ten African countries and the Jakarta preparatory meeting that left the USSR out; Khrushchev needed Nasser to restore Soviet prestige there, and Nasser needed him, for his standing in Africa and the Arab world and for his economy ([[w.friedman-shadow-cold-war]], 110–11).'
- edit:
    id: cal.1965-08-11.states-and-cities
    base: 0e3fbacd
    set:
      gloss:
        title: Commentary
        text:
        - 'Purdum (2014): a darker, more divisive, more violent era followed the civil rights laws of 1964 and 1965; Watts, five days after Johnson signed the Voting Rights Act, "a portent of widespread unrest to come" ([[w.purdum-idea-whose-time-has-2014]], 332).'
- edit:
    id: cal.1966-03.elections-1966
    base: 020f80bd
    set:
      gloss:
        title: Commentary
        text:
        - 'Nofziger, Reagan''s press secretary (interview, Oct. 10, 1978): the Commandment''s purpose "was to keep the other side in the primary from attacking Reagan," who was ahead; with it Parkinson "pretty much helped assure a Reagan victory" ([[w.kabaservice-rule-and-ruin]], 171 and n.44).'
        - 'Kabaservice (2012): the Commandment a ceasefire between moderates and conservatives, and between the State''s north and south; many moderates took it for a cover for a conservative takeover; in the long run it served the moderates too, and Reagan made it his own ([[w.kabaservice-rule-and-ruin]], 171–72).'
- add-words:
    id: cal.1963-06.goldwater
    after: 'White''s West Coast trip, north from Los Angeles to San Francisco, Portland and Seattle, the draft''s State organizations.'
    words: At Seattle, Luke Williams, a Spokane businessman, is ready to work for it.
    item: '[[w.white-making-of-the-president-1965]], 133–34'
