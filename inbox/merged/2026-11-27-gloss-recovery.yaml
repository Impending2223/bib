- add-words:
    id: cal.1964-05-06.civil-rights-bill
    after: end
    words: 'John Stewart, Humphrey''s aide, in his diary that day: "somewhat of a minor miracle" if the pro-civil-rights forces "can get themselves back in order."'
    item: '[[w.purdum-idea-whose-time-has-2014]], 278–79'
- add-words:
    id: cal.1964-05-08.civil-rights-bill-2
    after: end
    words: 'O''Brien, on the votes of May 6: "That shook the hell out of them"; Humphrey must "get a damn whip out"; Dirksen will hold the bill until just before the Republican convention. Johnson: "I''m going to call them back, too, if they do."'
    item: '[[w.presidential-recordings-2005]], VI, 527–28'
