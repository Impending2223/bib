ops:
- add:
    entry:
      id: cal.1963-12.goldwater-9
      when: Dec.
      date: 1963-12
      place: washington-state
      thread: goldwater
      also:
      - elections-1964-state-conventions
      c: 'Washington. All 5,500 Republican precincts filled with activists, 65 percent of them Luke Williams''s and Clif White''s people; when Williams began, 2,500 had an organization, perhaps half of it led by moderates and 30 percent by conservatives.'
      n: '[[w.white-making-of-the-president-1965]], 134 ("by the end of 1963"). See [[cal.1963-06.goldwater]]. Names: White.'
      tags:
      - 'name:white-f-clifton'
      - 'state:wa'
- add:
    entry:
      id: cal.1964-05-06.civil-rights-bill-6
      when: May 6
      date: '1964-05-06'
      place: washington
      thread: civil-rights-bill
      time_range:
      - '1964-05-07T00:36Z'
      - '1964-05-07T04:00Z'
      time_band: night
      time_zone: America/New_York
      c: 'O''Brien to Humphrey, after the votes on Morton''s amendment: his counts run 59 to 62, depending on the day; cloture cannot come without sessions around the clock; he has the title of whip and should "get a damn whip out." By O''Brien''s account to Johnson, May 8.'
      n: '[[w.presidential-recordings-2005]], VI, 527–28 (O''Brien to Johnson by telephone, May 8, 1964: he spoke to Humphrey "after that series of votes and that night"; the editors'' note 64: the votes of May 6 on the jury-trial amendments). The hour: after the Senate rose, 8:36 p.m. See [[cal.1964-05-06.civil-rights-bill]]. Names: O''Brien, Humphrey.'
      tags:
      - 'name:obrien-lawrence-f'
      - 'name:humphrey-hubert-h'
- add:
    entry:
      id: cal.1966-08.jobs-and-wages-airlines
      when: Aug., after the 19th
      date: 1966-08
      at: after 1966-08-19
      thread: jobs-and-wages-airlines
      c: 'Siemiller, the machinists'' president: the airline settlement "destroy[ed] all existing wage and price guidelines now in existence."'
      n: '[[w.califano-triumph-and-tragedy-of]], 146 (after the members approve the agreement; no day). See [[cal.1966-08-19.jobs-and-wages-airlines]]. Names: Siemiller. Check: the day; Califano gives none.'
      gloss:
        title: Commentary
        text:
        - 'Califano (1991): Siemiller "irresponsibly—but correctly" bragged so; so far as organized labor was concerned, as the summer of 1966 closed, the guideposts "were indeed dead" ([[w.califano-triumph-and-tragedy-of]], 146).'
      tags:
      - 'name:siemiller-p-l'
- edit:
    id: cal.1965-11-10.china-leadership
    base: 48690f21
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 10, 1965. Published: *Wenhui bao*, Nov. 10, 1965. [[w.macfarquhar-maos-last-revolution]], 18 (the publication); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628 (Nov. 10, 1965; the book says Yao Wenyuan''s article, in the Shanghai *Wenhui bao*, on the historical play *Hai Rui Dismissed from Office* "opened the prelude to the Cultural Revolution"; footnote 1 (628) names Yao as then a member of the editorial board of *Jiefang ribao* and of the writing group of the Shanghai committee); [[w.macfarquhar-origins-of-the-cultural]], III, 249, 252 (Yao''s article, dated and titled; it is the first target on the eve of the Cultural Revolution, Wu Han, whom Mao had admired); [[w.macfarquhar-origins-of-the-cultural]], III, 445 (the article in the Shanghai *Wenhui bao*, kept secret from the Peking committee); [[w.deng-xiaoping-nianpu-1904]], III, 1880 (Nov. 10, 1965; the Shanghai Wenhui bao prints Yao Wenyuan 姚文元''s article ''On the new historical play *Hai Rui Dismisses the Official*''; the nianpu (footnote 2: Yao then editorial-board member of the Jiefang ribao and a member of the Shanghai Party committee''s writing group): the article was planned by Jiang Qing at Shanghai and approved by Mao before publication; it ties the play''s ''returning the land'' and ''redressing wrongs'' to the so-called ''go-it-alone wind'' and ''reversal wind'' of 1962, charges the author Wu Han 吴晗 (footnote 3: then vice-mayor of Peking) with wishing to pull down the people''s communes and restore the landlords'' and rich peasants'' rule, shocked the country and became the fuse of the Cultural Revolution); [[w.mao-zedong-zhuan]], VI, ch. 74 (Nov. 10 the Wenhui bao prints Yao Wenyuan''s article on Hai Rui Dismissed from Office, written at Jiang Qing''s planning; Mao saw it and agreed to its printing (Mao to foreign guests, 1967: Peking could not organize it, Shanghai did) (n.14)). [[w.yang-jisheng-tiandi-fanfu]], II, 1143 (planned by Mao, the fuse of the Cultural Revolution); [[w.peng-zhen-nianpu-1902]], IV, 447 (Nov. 10, 1965; *Wenhui bao* prints Yao Wenyuan''s article; the play''s author the historian and Peking vice-mayor Wu Han 吴晗, charged with speaking up through Hai Rui for the overthrown, "a poisonous weed"; planned by Jiang Qing with Zhang Chunqiao and Yao in Shanghai early in 1965 and written in secret); [[w.jian-zhou-enlai]], 529–530 (Yao Wenyuan''s essay in the *Wenhui bao*; the play by Wu Han, vice mayor of Peking); [[w.dikotter-cultural-revolution]], 48–49 n.16 (Yao, on Jiang Qing''s advice in a sanatorium for the summer; nine drafts, three edited by Mao; 10,000 words; Mao in Shanghai for it; printed in two local papers); [[w.pu-weihua-zalan-jiu-shijie]], 7; [[w.liu-jixian-ye-jianying-nianpu]], II, 932 (Nov. 10, 1965; Yao Wenyuan''s 姚文元 article in Shanghai''s 上海 *Wenhui bao* 文汇报, by this book the opening of the "Cultural Revolution"); [[w.chen-yun-nianpu-xiuding]], III, 150–151 (Mao approved the article''s publication and had it reprinted nationwide; under Jiang Qing and Zhang Chunqiao the attack soon grew into a campaign in literature and art, the prelude and fuse of the Cultural Revolution); [[w.zhu-de-nianpu-xinbian]], III, 1942 (Nov. 10, 1965; Shanghai''s *Wenhui bao* 《文汇报》 prints Yao Wenyuan''s 姚文元 "On the new historical play *Hai Rui Dismissed from Office*" 《评新编历史剧〈海瑞罢官〉》; worked by Jiang Qing 江青 and Zhang Chunqiao 张春桥, it grows into a campaign of criticism and becomes the fuse of the "Cultural Revolution"); [[w.peng-dehuai-nianpu]], 792 (Nov. 10, 1965: Shanghai''s *Wenhui bao* 《文汇报》 prints Yao Wenyuan''s 姚文元 "On the new historical play *Hai Rui Dismissed from Office*" 《评新编历史剧〈海瑞罢官〉》, which ties the play''s "returning the land" and "redressing wrongs" to the "go-it-alone wind" and the "wind of reversing verdicts," and those to Lushan 庐山 and Peng Dehuai 彭德怀); [[w.teiwes-tragedy-of-lin-biao]], 209 (prepared in secret with Mao''s blessing); [[w.dikotter-cultural-revolution]], 48; [[w.peng-zhen-nianpu-1902]], IV, 447. To check: [[w.fangeming-xiuzhengzhuyi-fenzi-fan]], 18 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.11); Yao Wenyuan, "On the new historical play *The Dismissal of Hai Rui*," [[w.wenhui-bao]], Nov. 10, 1965 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 249 n.1a); Mao Zedong 毛泽东, talk with Cabo 卡博 and Baluku 巴卢库, Feb. 3, 1967 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.14). Names: Yao Wenyuan, Wu Han.'
      gloss:
        title: Commentary
        text:
        - 'The Liu Shaoqi nianpu (1996): Yao Wenyuan''s article "opened the prelude" to the "Cultural Revolution" ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628).'
        - 'Estimates. The Cultural Revolution''s dead (the thread''s matter, set on its first entry, Yao Wenyuan''s article, by the owner''s rule of Nov. 21, 2026).'
        - 'Estimates. Yang Jisheng: the cleansing of the class ranks, the "one strike, three anti" and the hunt for the "May 16" elements together cost over 2 million abnormal deaths, twenty times the cadres who died abnormally in the Cultural Revolution; those killed in mass slaughters by the authorities not fewer than 300,000 ([[w.yang-jisheng-tiandi-fanfu]], II, 633, 685). In Guangxi, of the 89,700 dead with names and addresses reported in 1984, 79,000 killed in organized massacres; on a total of 100,000, 80,000 massacred (II, 676).'
        - 'Estimates. The estimates Yang gives: Ding Shu, 30 million struggled in the cleansing and 500,000 dead; Andrew Walder and Su Yang, from over 1,500 county gazetteers, some 36 million persecuted in the countryside, 750,000 to 1.5 million killed, as many maimed; the official history, 100 million implicated ([[w.yang-jisheng-tiandi-fanfu]], II, 600). For the "one strike, three anti": Wang Rui, 20,000 to 30,000 killed; Ding Shu, 100,000, or 150,000 to 200,000 (II, 632).'
        - 'Estimates. Dikötter, after Ding Shu and Jonathan Unger: in the cleansing of the class ranks, in the great majority of the more than 2,000 counties more than a hundred people beaten to death or driven to suicide, in some four to five hundred; in Guangdong, by one estimate, 40,000 unnatural deaths ([[w.dikotter-cultural-revolution]], 189). After Su Yang: in the Cultural Revolution more than 400,000 people systematically exterminated in villages across the country, neighbours killing neighbours (223). The hunt for the "May Sixteenth" elements, from 1967, may alone have implicated as many as 3.5 million (235, 240).'
