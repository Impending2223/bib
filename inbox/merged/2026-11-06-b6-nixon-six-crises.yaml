      date: '1960-11-09'
      thread: republican-party
      c: 'Los Angeles, about 9 a.m., by Nixon''s account. A partner in one of the city''s largest law firms telephones Nixon:
        a full partnership, his partners agreed by telephone, at about three times the Vice President''s salary, should he
        return to Los Angeles. The first of scores of offers.'
      n: '[[w.nixon-six-crises]], 395. Names: Nixon.'
