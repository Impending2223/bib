      when: Dec.–Jan.
      date: 1960-12
      thread: republican-party
      also:
      - transition-and-staff
      c: 'Two White House dinners, Mrs. Eisenhower presiding, by Nixon''s account. At each Eisenhower toasts Nixon and his
        wife for their part in his Administration and the campaign. At one, by Nixon''s account elsewhere, Nixon beside Mrs.
        Eisenhower: she urges him to write the story of his trips to South America and Russia.'
      n: '[[w.nixon-six-crises]], 415; xi (Mrs. Eisenhower, "shortly after the election"). Check: the days. Names: Eisenhower,
        Nixon, Pat Nixon.'
      src:
        rows:
        - 'w.nixon-six-crises 415: A-B'
        - 'w.nixon-six-crises xi: C'
        c: 3f5e0924
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      - name:nixon-pat
- add:
    entry:
      id: cal.1960-12.republican-party-3
      when: Dec.–Jan.
      date: 1960-12
      thread: republican-party
      c: 'Washington, a dinner given by Nixon and his wife, by Nixon''s account. James Byrnes and his wife come from South
        Carolina; Byrnes''s toast: "If the Vice President had won this election, I would not be here tonight." Afterward,
        to Nixon, on his own first defeat: "Only a man who has suffered a close defeat can possibly know how someone else
        feels."'
      n: '[[w.nixon-six-crises]], 415. Check: the day (after Christmas, before Jan. 6). Names: Byrnes, Nixon, Pat Nixon.'
      src:
        rows:
        - 'w.nixon-six-crises 415: all'
        c: d17302b0
      tags:
      - name:byrnes-james-f
      - name:nixon-richard-m
      - name:nixon-pat
- add:
    entry:
      id: cal.1961-04.republican-party
      when: Apr., two days
      date: 1961-04
      thread: republican-party
      c: 'California, by Nixon''s account. Adela Rogers St. Johns telephones Nixon: Ken McCormick of Doubleday is flying out
        to see him the next day. That night Nixon notes a dozen crises of his career and chooses six; McCormick approves the
        plan and persuades him to write the book, *Six Crises*.'
      n: '[[w.nixon-six-crises]], xi–xii. Check: the days. Names: Nixon.'
      src:
        rows:
        - 'w.nixon-six-crises xi–xii: all'
        c: 67281ee5
      tags:
      - name:nixon-richard-m
      - state:ca
- edit:
    id: cal.1960-09-26.elections-1960-3
    base: 6651d5dd
    set:
      c: 'Chicago, the Pick-Congress, after the first debate, by Nixon''s account. Hall, Seaton, Finch, Drown and Shepley
        called in; Rose Mary Woods''s parents have telephoned from Sebring, Ohio: he looked pale and tired. Later his mother,
        after the broadcast in California, telephones to ask Woods whether he is "feeling all right." The advisers agree:
        too much substance, too little appearance. Dr. Malcolm Todd weighs him, 160 pounds, ten under his normal, and orders
        a milkshake with every meal.'
      src:
        c: de91fe51
        rows:
        - 'w.nixon-six-crises 340–41: all'
