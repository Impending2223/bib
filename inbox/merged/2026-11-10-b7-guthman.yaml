      thread: robert-kennedy
      c: 'Hundley, of the Criminal Division''s Organized Crime and Racketeering Section, 1954–66, days after Hoover blames Robert Kennedy for the eavesdropping: "Sure, I knew for years that the FBI was making widespread use of electronic bugs"; "the top brass of the Bureau would flat-out lie to me, denying it." He took it for a matter between the Attorney General and the Director, and never raised it.'
      n: '[[w.guthman-we-band-of-brothers]], 263–64. Check: the day, and to whom Hundley said it; Guthman names no source. See [[cal.1966-12.robert-kennedy]]. Names: Hoover, Robert Kennedy.'
      src:
        c: '901f038e'
        rows:
        - 'w.guthman-we-band-of-brothers 263–64: all'
