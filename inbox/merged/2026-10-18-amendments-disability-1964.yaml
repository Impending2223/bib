        also: [succession, congress]
        c: 'Senate Judiciary''s Subcommittee on Constitutional Amendments, Bayh''s, opens hearings on presidential succession and disability, S.J. Res. 13, 28, 35, 138, 139, 140 and 143: Members of Congress first, then public hearings in February and March, Nixon and the former Attorneys General Brownell and Biddle among the witnesses. The same month a dozen legal scholars called by the American Bar Association reach a consensus in two days; its House of Delegates endorses it.'
        n: 'Bayh''s notice, [110 Cong. Rec. 526](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt1/pdf/GPO-CRECB-1964-pt1-8-1.pdf) (1964); his account of the hearings, [8161–62](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt6/pdf/GPO-CRECB-1964-pt6-9-2.pdf). The consensus, [111 Cong. Rec. 1175–76](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-17-1.pdf) (1965). *Presidential Inability and Vacancies in the Office of Vice President: Hearings before the Subcommittee on Constitutional Amendments of the Senate Committee on the Judiciary*, 88th Cong. (1964) (Check the title and a digitized copy). [[w.feerick-twenty-fifth-amendment]]; [[w.bayh-one-heartbeat-away]]. See [[cal.1963-11-22.succession]]. Names: Bayh, Nixon, Brownell.'
        tags: [name:bayh-birch, name:nixon-richard-m, name:brownell-herbert-jr]
