      id: cal.1965-01.vietnam-macv
      when: Jan.
      date: 1965-01
      thread: vietnam-macv
      also:
      - defense
      c: Hong Kong. LeMay, visiting, summons Joseph Moore, Westmoreland's air commander, and upbraids him for failing to uphold
        Air Force doctrine; by Westmoreland's account, for endorsing machine guns on helicopters.
      n: '[[w.westmoreland-soldier-reports]], 86–87. Check: the day; the book gives "a few weeks" after LeMay upbraided Westmoreland
        in Washington late in 1964. See [[cal.1964-12.vietnam-2]]. Names: LeMay, Moore, Westmoreland.'
      tags:
      - name:lemay-curtis-e
      - name:moore-joseph-h
      - name:westmoreland-william
      src:
        c: b400edce
        rows:
        - 'w.westmoreland-soldier-reports 86–87: all'
    section: '196501'
- add:
    entry:
      id: cal.1966-02-06.vietnam-honolulu
      when: Feb. 6–8
      date: '1966-02-06'
      thread: vietnam-honolulu
      c: 'Honolulu. Johnson to Westmoreland, in private talks: "General, I have a lot riding on you." Later, of Truman and
        MacArthur: "I hope you don''t pull a MacArthur on me." Westmoreland makes no answer. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 159. Check: the days; the book gives none within the President''s stay. See
        [[cal.1966-02-06.vietnam]]. Names: Johnson, Westmoreland, Truman.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      src:
        c: ab3151f3
        rows:
        - 'w.westmoreland-soldier-reports 159: all'
    section: '196602'
- add:
    entry:
      id: cal.1966-10-24.vietnam-asian-trip-2
      when: Oct. 24–25
      date: '1966-10-24'
      thread: vietnam-asian-trip
      also:
      - soviet-union
      c: 'Manila, during the conference. A luncheon, Harriman, Blair and Westmoreland. Harriman: "I can tell you, General
        Westmoreland, categorically, the Russians are doing everything they can to bring peace in Vietnam." By Westmoreland''s
        account.'
      n: '[[w.westmoreland-soldier-reports]], 121. Check: the day. See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Harriman,
        Blair, Westmoreland.'
      tags:
      - name:harriman-w-averell
      - name:blair-william-m-jr
      - name:westmoreland-william
      src:
        c: fb88c160
        rows:
        - 'w.westmoreland-soldier-reports 121: all'
    section: '196610'
- add:
    entry:
      id: cal.1966-11-01.vietnam-saigon
      when: Nov. 1
      date: '1966-11-01'
      thread: vietnam-saigon
      also:
      - vietnam-operations
      c: Saigon, the National Day parade, Westmoreland in the reviewing stand. The Viet Cong fire fourteen rounds from recoilless
        rifles during it.
      n: '[[w.westmoreland-soldier-reports]], 188. Names: Westmoreland.'
      tags:
      - name:westmoreland-william
      - place:saigon
      src:
        c: 1e5ea9f8
        rows:
        - 'w.westmoreland-soldier-reports 188: all'
    section: '196611'
- add:
    entry:
      id: cal.1968-10-08.defense
      when: Oct. 8
      date: '1968-10-08'
      thread: defense
      c: 'Fort Myer, Va., Quarters 1. The Westmorelands'' "little family dinner" for the Johnsons, at the President''s asking:
        Lynda Robb, the Wheelers. Johnson over an hour late, held by business at the White House. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 383. Names: Johnson, Lady Bird Johnson, Robb, Wheeler, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:robb-lynda-bird-johnson
      - name:wheeler-earle
      - name:westmoreland-william
      src:
        c: f3be409d
        rows:
        - 'w.westmoreland-soldier-reports 383: all'
    section: '196810'
- add:
    entry:
      id: cal.1961-06.defense-2
      when: June
      date: 1961-06
      thread: defense
      c: 'West Point, N.Y., the commencement, Johnson the speaker. Driving from the air base, he asks Westmoreland, the superintendent,
        whether to put aside the text his writers prepared and "speak from the heart." He begins with the text: "a nation
        which produced Davy Crockett and Daniel Boone and Jim Bowie is afraid of no forest and no swamp"; then sets it aside:
        freedom, poverty, education; the class to "nail the coonskins to the wall." By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 33. Check: the day. Names: Johnson, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      src:
        c: 4f785902
        rows:
        - 'w.westmoreland-soldier-reports 33: all'
    section: '196106'
- add:
    entry:
      id: cal.1962-12.defense-2
      when: Dec.
      date: 1962-12
      thread: defense
      c: 'The Army-Navy game. Kennedy to Westmoreland, superintendent at West Point: why so many more midshipmen than cadets?
        Westmoreland: the Naval Academy''s statute allows 2,000 more men. Kennedy assures him of his support for a bill to
        enlarge the Military Academy. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 36–37. Check: the day. Names: Kennedy, Westmoreland.'
      tags:
      - name:kennedy-john-f
      - name:westmoreland-william
      src:
        c: 28639b72
        rows:
        - 'w.westmoreland-soldier-reports 36–37: all'
    section: '196212'
- add:
    entry:
      id: cal.1964-01.vietnam-macv
      when: Jan.
      date: 1964-01
      thread: vietnam-macv
      c: 'New York, the Waldorf-Astoria. Westmoreland, his orders for Vietnam in hand, an hour and a half with MacArthur:
        treat the Vietnamese officers "as you did your cadets"; to defeat the guerrilla he may have to resort to a scorched
        earth policy. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 39–40. Check: the day; the book gives "some six months" after a conference in
        his last months at West Point, 1963, and he flew to Saigon late in January 1964 (41). Names: Westmoreland, MacArthur.'
      tags:
      - name:westmoreland-william
      src:
        c: fb37ec31
        rows:
        - 'w.westmoreland-soldier-reports 39–40: all'
    section: '196401'
- cite:
    id: cal.1966-11.vietnam
    item: '[[w.westmoreland-soldier-reports]], 212 (Johnson''s order to Lodge in November to reorganize the mission and put
      one man in charge, ninety days for the civilian agencies; the Office of Civil Operations under Porter; Knowlton at the
      head of MACV''s Revolutionary Development Support Directorate)'
    units: B, D
- check:
    id: cal.1966-11.vietnam
    text: 'Check: Westmoreland gives a two-week delay, ended by a prod from Washington, and Lathram chosen later, when Porter
      gave the office up (212).'
- cite:
    id: cal.1962-06-06.defense
    item: '[[w.westmoreland-soldier-reports]], 37–38 (Westmoreland escorting Kennedy; the class of 1962 makes him an honorary
      member; "another type of war ... war by guerrillas, subversives, insurgents, assassins")'
    units: A
- cite:
    id: cal.1967-07-12.vietnam-force-levels
    item: '[[w.westmoreland-soldier-reports]], 230 (the next day''s news conference: "we have reached a meeting of the minds")'
    units: E
- check:
    id: cal.1967-07-12.vietnam-force-levels
    text: 'Check: Westmoreland has himself, after his mother''s funeral at Columbia on July 12, with the National Security
      Council in the Cabinet Room, and Johnson deciding then for the lesser of his two packages, cut to just over 47,000 more
      men under a ceiling of 525,000 (230); whether this meeting.'
