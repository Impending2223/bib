      when: 'Oct. 12'
      date: '1963-10-12'
      thread: elections-1964
      c: 'Reston, in the *New York Times*, after the press conference of Oct. 9: "The President was lighthearted about the
        prospects of meeting Goldwater, but privately his associates are not so sure."'
      n: '[[w.white-suite-3505]], 235 & n.2. To check: James Reston, *New York Times*, Oct. 12, 1963 (cited by [[w.white-suite-3505]],
        235 n.2). See [[cal.1963-10-09.elections-1964]]. Names: Reston, Kennedy, Goldwater.'
      tags:
