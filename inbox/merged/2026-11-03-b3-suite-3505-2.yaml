- add:
    entry:
      id: cal.1963-10-13.goldwater
      when: 'Oct. 13'
      date: '1963-10-13'
      thread: goldwater
      c: 'Sevareid''s column: "The Goldwater phenomenon has reached proportions far beyond anything most serious observers,
        especially those in the Eastern centers, imagined it could attain a year ago, and the phenomenon is just hitting its
        stride."'
      n: '[[w.white-suite-3505]], 235. To check: Eric Sevareid, column, Oct. 13, 1963 (quoted by [[w.white-suite-3505]], 235).
        Names: Sevareid, Goldwater.'
