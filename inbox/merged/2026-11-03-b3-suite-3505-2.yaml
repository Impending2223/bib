- add:
    entry:
      id: cal.1964-01-18.elections-1964
      when: 'Jan. 18'
      date: '1964-01-18'
      thread: elections-1964
      c: 'The *Saturday Evening Post*, its issue of Jan. 18: five pages on Scranton, and Stewart Alsop''s column, "The Logical
        Candidate": Scranton "more nearly a Republican Stevenson—a reflective man, oddly reserved, highly intelligent, but
        seemingly without ambition or deep political passion."'
      n: '[[w.white-suite-3505]], 356–57. To check: *Saturday Evening Post*, Jan. 18, 1964 (named by [[w.white-suite-3505]],
        356). See [[cal.1964-01-09.elections-1964]]. Names: Scranton, Stewart Alsop.'
      tags:
      - 'name:scranton-william-w'
      - 'name:alsop-stewart'
      src:
        c: 910f05ce
        rows:
        - 'w.white-suite-3505 356–57: all'
        - 'via w.white-suite-3505 356 n.text: A'
