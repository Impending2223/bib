    entry:
      id: cal.1964-05-08.goldwater
      when: 'May 8'
      date: '1964-05-08'
      thread: goldwater
      also:
      - elections-1964
      c: '*Time*, its issue of May 8: "GOLDWATER''S ALMOST GOT IT!" Goldwater "clearly the man to beat in San Francisco";
        550 on the first ballot by its projection, with "impressive reserve strength" among the favorite sons'' delegations.'
      n: '[[w.white-suite-3505]], 319–20. To check: *Time*, May 8, 1964 (quoted by [[w.white-suite-3505]], 319–20). See [[cal.1964-05-05.goldwater]].
        Names: Goldwater.'
      tags:
      - 'name:goldwater-barry-m'
      src:
        c: 2a16e9b2
        rows:
        - 'w.white-suite-3505 319–20: all'
        - 'via w.white-suite-3505 319 n.text: A-B'
- add:
    entry:
      id: cal.1964-06-21.elections-1964-2
      when: 'June 21'
      date: '1964-06-21'
      thread: elections-1964
      c: 'John S. Knight, president and editor of the *Detroit Free Press*, in his "Editor''s Notebook": Goldwater not his
        candidate, but the "shabby treatment" he has from "most of the news media"; "Of the syndicated columnists, I can think
        of only a few who are not savagely cutting down Senator Goldwater day after day." Why Scranton is "suddenly the hero
        of the hour in most of the press."'
      n: '[[w.white-suite-3505]], 372 & n.6. To check: *Detroit Free Press*, June 21, 1964 (cited by [[w.white-suite-3505]],
        372 n.6). See [[cal.1964-06-12.elections-1964]]. Names: Goldwater, Scranton.'
      tags:
      - 'name:goldwater-barry-m'
      - 'name:scranton-william-w'
      src:
        c: c84e88c2
        rows:
        - 'w.white-suite-3505 372 & n.6: all'
