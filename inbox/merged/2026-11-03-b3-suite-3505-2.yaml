ops:
- add:
    entry:
      id: cal.1962-12-05.goldwater-2
      when: 'Dec. 5'
      date: '1962-12-05'
      thread: goldwater
      c: 'The *New York Herald Tribune*, in an editorial, on the draft group''s meeting at Chicago: a "conspiracy"; "bad timing,
        narrow motives and poor politics"; "The luxury of partisan bickering of the kind we have just seen in Chicago is political
        nonsense." Conservatives and liberals both reproved.'
      n: '[[w.white-suite-3505]], 107 & n.4. To check: *New York Herald Tribune*, Dec. 5, 1962 (cited by [[w.white-suite-3505]],
        107 n.4). See [[cal.1962-12-02.goldwater]].'
      src:
        c: b936f3da
        rows:
        - 'w.white-suite-3505 107 & n.4: all'
        - 'via w.white-suite-3505 107 n.4: A-C'
- add:
    entry:
      id: cal.1963-03-26.elections-1964
      when: 'Mar. 26'
      date: '1963-03-26'
      thread: elections-1964
      c: 'Trohan, the *Chicago Tribune*''s Washington bureau chief: "Kennedys Fear One Man in 1964 Election—Goldwater." The
        President and his brother fear Goldwater would carry the South and cut into the Northern States they carried narrowly
        in 1960; hence, by Trohan''s account, the Democrats'' word that Rockefeller is the hardest opponent.'
      n: '[[w.white-suite-3505]], 130–31 & n.1. To check: *Chicago Tribune*, Mar. 26, 1963 (cited by [[w.white-suite-3505]],
        130 n.1). See [[cal.1963-03-28.republican-party-congress]]. Names: John F. Kennedy, Robert Kennedy, Goldwater, Rockefeller.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:kennedy-robert-f'
      - 'name:goldwater-barry-m'
      - 'name:rockefeller-nelson'
      src:
        c: 0884c9cd
        rows:
        - 'w.white-suite-3505 130–31 & n.1: all'
        - 'via w.white-suite-3505 130 n.1: A-B'
- add:
    entry:
      id: cal.1963-04-30.goldwater
      when: 'Apr. 30'
      date: '1963-04-30'
      thread: goldwater
      c: 'Bergholz, political writer of the *Los Angeles Times*, on White''s travels for the draft, among them "a series of
        hush-hush meetings" with Goldwater''s men at Phoenix. Other stories follow; by June White no longer kept out of sight.
        By White''s account.'
      n: '[[w.white-suite-3505]], 160. To check: Richard Bergholz, *Los Angeles Times*, Apr. 30, 1963 (named by [[w.white-suite-3505]],
        160). See [[cal.1963-04-08.elections-1964]]. Names: White, Goldwater.'
      tags:
      - 'name:white-f-clifton'
      - 'name:goldwater-barry-m'
      src:
        c: 917face2
        rows:
        - 'w.white-suite-3505 160: all'
        - 'via w.white-suite-3505 160 n.text: A'
- add:
    entry:
      id: cal.1963-05-03.elections-1964
      when: 'May 3'
      date: '1963-05-03'
      thread: elections-1964
      c: 'The *Detroit News*, Michigan''s largest paper and Romney''s backer for governor, in an editorial the day after his
        visit to Washington: "Come home, George, and let''s get on with the chores." Romney back to Michigan; out of national
        politics, by White''s account, for more than a year.'
      n: '[[w.white-suite-3505]], 147–48. To check: *Detroit News*, May 3, 1963 (named by [[w.white-suite-3505]], 147). See
        [[cal.1963-05-02.republican-party]]. Names: Romney. Check: the day ("the day after" May 2, 147).'
      tags:
      - 'name:romney-george-w'
      - 'state:mi'
      src:
        c: 8cc0ffd8
        rows:
        - 'w.white-suite-3505 147–48: all'
        - 'via w.white-suite-3505 147 n.text: A'
- add:
    entry:
      id: cal.1963-06-24.elections-1964
      when: 'June 24'
      date: '1963-06-24'
      thread: elections-1964
      c: 'Steele, of the Scripps-Howard papers, in the *New York World-Telegram and Sun*: the favorite-son movement begun
        at Denver "an effort to slow down a Republican stampede to Goldwater"; it "unquestionably has slowed the Goldwater
        boom."'
      n: '[[w.white-suite-3505]], 164–65 & n.4. To check: Jack Steele, *New York World-Telegram and Sun*, June 24, 1963 (cited
        by [[w.white-suite-3505]], 164 n.4). See [[cal.1963-06.republican-party]]. Names: Goldwater.'
      tags:
      - 'name:goldwater-barry-m'
      src:
        c: 794f0674
        rows:
        - 'w.white-suite-3505 164–65 & n.4: all'
        - 'via w.white-suite-3505 164 n.4: A'
- add:
    entry:
      id: cal.1963-06-24.republican-party
      when: 'June 24'
      date: '1963-06-24'
      thread: republican-party
      also:
      - goldwater
      c: 'Evans and Novak''s column, from the national committee at Denver: Goldwater''s lead "proof of a little-understood
        transformation in the party''s power structure," "nothing less than a quiet revolt": the young conservatives of the
        small Western and Southern States "seizing power, displacing the Eastern party chiefs."'
      n: '[[w.white-suite-3505]], 165 (the column quoted). To check: Rowland Evans and Robert Novak, column, June 24, 1963
        (quoted by [[w.white-suite-3505]], 165). See [[cal.1963-06.republican-party]]. Names: Evans, Novak, Goldwater.'
      tags:
      - 'name:evans-rowland-jr'
      - 'name:novak-robert-d'
      - 'name:goldwater-barry-m'
      src:
        c: 558c9d71
        rows:
        - 'w.white-suite-3505 165: all'
        - 'via w.white-suite-3505 165 n.text: A'
- add:
    entry:
      id: cal.1963-07-05.goldwater
      when: 'July 5'
      date: '1963-07-05'
      thread: goldwater
      c: 'The Armory rally on the front pages. The *Washington Star* two stories on page one, McGrory''s and Broder''s: "a
        professionalism surprising in a group that opened its headquarters less than a month ago" (Broder). The *Star*''s
        crowd 8,000, the *Baltimore Sun*''s 6,000.'
      n: '[[w.white-suite-3505]], 187 & n.1. To check: Mary McGrory and David Broder, *Washington Evening Star*, July 5, 1963
        (cited by [[w.white-suite-3505]], 187 n.1); *Baltimore Sun*, July 5, 1963 (named by [[w.white-suite-3505]], 187).
        See [[cal.1963-07-04.elections-1964]]. Names: McGrory, Broder.'
      tags:
      - 'name:mcgrory-mary'
      - 'name:broder-david-s'
      src:
        c: 00099d78
        rows:
        - 'w.white-suite-3505 187 & n.1: all'
        - 'via w.white-suite-3505 187 n.1: A-B'
        - 'via w.white-suite-3505 187 n.textb: C'
- add:
    entry:
      id: cal.1963-07-06.elections-1964
      when: 'July 6'
      date: '1963-07-06'
      thread: elections-1964
      c: 'Krock, in the *New York Times*: the Goldwater boom "attained high visibility" at the Fourth of July rally; the Eastern
        effort to deflate it "less visible"; among its quiet strategies the "favorite-son gambit."'
      n: '[[w.white-suite-3505]], 187–88. To check: Arthur Krock, *New York Times*, July 6, 1963 (quoted by [[w.white-suite-3505]],
        187–88). See [[cal.1963-06.republican-party-2]]. Names: Krock, Goldwater.'
      tags:
      - 'name:krock-arthur'
      - 'name:goldwater-barry-m'
      src:
        c: cc019682
        rows:
        - 'w.white-suite-3505 187–88: all'
        - 'via w.white-suite-3505 187 n.text: A'
- add:
    entry:
      id: cal.1963-09-16.labor
      when: 'Sept. 16'
      date: '1963-09-16'
      thread: labor
      also:
      - elections-1964
      c: 'Riesel''s column: "For the first time since John Kennedy took over the White House there is an open break on the
        New Frontier''s labor front over support of the President for re-election in 1964." Lee Minton, AFL-CIO vice president
        and head of the Glass Bottle Blowers, urging other union men toward the Republicans; Rockefeller his man.'
      n: '[[w.white-suite-3505]], 237. To check: Victor Riesel, column, Sept. 16, 1963 (quoted by [[w.white-suite-3505]],
        237 n.2). Names: Kennedy, Rockefeller.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:rockefeller-nelson'
      src:
        c: 3f15f8fb
        rows:
        - 'w.white-suite-3505 237: all'
        - 'via w.white-suite-3505 237 n.2: A-B'
- add:
    entry:
      id: cal.1963-10-04.elections-1964
      when: 'Oct. 4'
      date: '1963-10-04'
      thread: elections-1964
      c: '*Time*, a State-by-State survey by its correspondents: Kennedy "could easily beat any other GOP candidate," but
        against Goldwater "he can only be rated even"; with Texas, Goldwater 266 electoral votes.'
      n: '[[w.white-suite-3505]], 234–35 & n.1. To check: *Time*, Oct. 4, 1963 (cited by [[w.white-suite-3505]], 235 n.1).
        See [[cal.1963-09-16.elections-1964]]. Names: Kennedy, Goldwater.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:goldwater-barry-m'
      src:
        c: 8a3a0c54
        rows:
        - 'w.white-suite-3505 234–35 & n.1: all'
        - 'via w.white-suite-3505 235 n.1: A'
