    id: cal.1968-07-03.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 269 (the secretaries'' record, July 3: Brezhnev presides over the Politburo in the Central Committee building, 9:30 p.m. to 12:20 a.m., after the talks with Kádár)'
