    id: cal.1968-07-08.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 270 (the secretaries'' record, July 8: at 11 p.m. Brezhnev talks with Dubček, from the dacha)'
