patch: 2026-11-14-b14-brezhnev-b
by: 'Claude (batch 14, reader 2: Brezhnev, Rabochie i dnevnikovye zapisi, vol. II, the records of his reception-room secretaries, 1965–82; the years 1965 to 1969 read), Nov. 14, 2026; audited by Claude (Opus), batch 14 audit, Nov. 14, 2026 (each entry against the secretaries'' record by its day; the thin entries, the Politburo''s and the commissions'' sessions known by their hours alone, dropped; one event an entry, the mixed days cut to their event and four split; misdated entries re-dated under new ids; doubles with vol. I folded into cites; the private sessions, councils, closed bloc meetings and unannounced trips ruled, the public visits left unruled and without "Made public")'
