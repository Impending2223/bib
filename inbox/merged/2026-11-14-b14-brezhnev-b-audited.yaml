    id: cal.1968-04-19.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 253 (the secretaries'' record, Apr. 19: at Zavidovo Brezhnev receives Mahmoud Riad, Gromyko, the ambassador Vinogradov and the UAR''s ambassador Ghaleb present)'
