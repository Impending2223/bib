- add:
    entry:
      id: cal.1966-01-10.soviet-union-leadership
      when: Jan. 10–11
      date: '1966-01-10'
      thread: soviet-union-leadership
      also:
      - south-asia
      c: 'On the train to Ulan Bator. Kosygin telephones from Tashkent, 12:15 a.m. Moscow time: Shastri has died suddenly, after negotiating there with Ayub Khan. Suslov sends the train a vote by high-frequency telegram on sending Kosygin to India with the body and to the funeral; at 3:10 a.m. Aleksandrov reports from Irkutsk Brezhnev''s vote for it. At 4:10 Semichastny asks that TASS and *Pravda* be told to publish the news.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 103 (Jan. 10–11). Made public: 2016. See [[cal.1966-01-10.india-and-china]]. Names: Brezhnev, Kosygin, Suslov, Semichastny, Shastri, Ayub Khan.'
