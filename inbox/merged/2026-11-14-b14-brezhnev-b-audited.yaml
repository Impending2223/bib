    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 77–78 (the secretaries'' record, Oct. 15–17: Brezhnev leaves on his trip Oct. 15, 2 p.m., and is back from Prague Oct. 17, 4:50 p.m.)'
    units: '?'
