    id: cal.1967-05-22.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 191 (the secretaries'' record, May 22–23: Brezhnev receives the KPD delegation under Reimann May 22 from 4 p.m., Suslov, Ponomarev and Belyakov taking part, and again May 23, 10 to 12:30, in the Politburo''s meeting hall)'
    units: '?'
