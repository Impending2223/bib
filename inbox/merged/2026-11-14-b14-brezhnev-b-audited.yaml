- cite:
    id: cal.1965-05-14.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 27 (the secretaries'' record, May 14: Brezhnev receives Shastri, Prime Minister of India, and his party, 9:30 to 11:40 a.m.; the rally in his honor May 15)'
    units: '?'
- cite:
    id: cal.1965-05-24.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 30–32 (the secretaries'' record, May 23–29: Moscow. Kádár and the Hungarian party-government delegation. Brezhnev meets them May 23, 10:10 p.m.; negotiates in the Kremlin May 24, 10 to 2, and May 25, 10 to 2:20; dines with Kádár at Ogarevo May 25; is with him at Zavidovo May 26 and part of May 27; sees the delegation off May 29)'
    units: '?'
- cite:
    id: cal.1965-09-07.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 61 (the secretaries'' record, Sept. 6–7: Moscow. Brezhnev meets Novotný at the airport Sept. 6 and calls on him at 5; Sept. 7, 10:15 to 2:15, negotiates with the Czechoslovak party-government delegation in the Kremlin)'
    units: '?'
- cite:
    id: cal.1965-09-27.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 71 (the secretaries'' record, Sept. 27–29: Brezhnev at the plenum Sept. 27, 9 to 7; presides Sept. 28, 10 to 3; at the plenum Sept. 29, 9 to 3)'
    units: '?'
- cite:
    id: cal.1965-10-13.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 77–78 (the secretaries'' record, Oct. 13–18: Brezhnev negotiates with a North Vietnamese delegation in the Kremlin: Oct. 13, 3 to 8:40 p.m.; Oct. 14, 10 to 1 and 5 to 8; Oct. 15, 10 to 1; after his trip to Prague, Oct. 18, 10 to 12:30)'
    units: '?'
- cite:
    id: cal.1965-10-18.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 78 (the secretaries'' record, Oct. 18: Moscow. The Higher Military Council, in the Presidium''s new hall, 4 to 7:30 p.m., Brezhnev presiding)'
    units: '?'
- cite:
    id: cal.1965-12-15.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 96–97 (the secretaries'' record, Dec. 15–17: Moscow. Brezhnev receives Boumediene, chairman of Algeria''s Revolutionary Council, Dec. 15, and attends the Kremlin dinner in his honor Dec. 17, 6 to 9)'
    units: '?'
- cite:
    id: cal.1966-06-20.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 132–133 (the secretaries'' record, June 21–22: Moscow. De Gaulle, President of France, on a state visit. Brezhnev reads the papers for the talks, 8 to 9:15 a.m.; negotiates June 21, 10 to 1, and June 22, 10 to 1:32, in the Kremlin; dines at the French embassy June 22, 7:30 p.m)'
    units: '?'
- cite:
    id: cal.1966-09-10.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 145–146 (the secretaries'' record, Sept. 10–11: Moscow. Ulbricht arrives Sept. 10, 9 a.m., Belorussky station. Brezhnev negotiates with him, 11 to 2 and 5 to 9 p.m.; lunch Sept. 11, and sees him off at 9:50 p.m)'
    units: '?'
- cite:
    id: cal.1966-10-15.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 150–151 (the secretaries'' record, Oct. 10–15: Moscow. Gomułka, Cyrankiewicz and the Polish party-government delegation. Brezhnev meets them at Vnukovo Oct. 10, 12 noon; negotiates Oct. 10, 2 to 5, Oct. 11, 10 to 2:20, and Oct. 14, 12:45 to 4:20; a reception Oct. 15)'
    units: '?'
- cite:
    id: cal.1966-10-21.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 152–153 (the secretaries'' record, Oct. 16–22: Moscow. The leaders of the socialist countries. Brezhnev meets Kádár''s Hungarian delegation Oct. 16, 6:35 p.m., and on Oct. 17 the leaders of Cuba, the GDR, Romania, Bulgaria, Czechoslovakia and Mongolia, dining with them at the Lenin Hills reception house at 5 p.m.; Oct. 21, 10 to 4, he negotiates with them in the Kremlin, then a reception, 4 to 6; sees off the leaders of Romania, Poland and others, 6 to 8, and Oct. 22 those of Bulgaria, the GDR and Hungary)'
    units: '?'
- cite:
    id: cal.1966-11-14.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 157 (the secretaries'' record, Nov. 12–18: Sofia. Brezhnev leads the CPSU delegation to the Ninth Congress of the Bulgarian Communist Party, leaving Nov. 12, 2:30 p.m.; speaks Nov. 15 at 10; at the Congress to Nov. 18; he flies out Nov. 20 and is in Moscow at 1:42 p.m)'
    units: '?'
- cite:
    id: cal.1966-12-07.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 160–161 (the secretaries'' record, Dec. 6–9: Moscow. Brezhnev and Suslov meet Kim Il Sung at Vnukovo Dec. 6, 2:20 p.m. Brezhnev negotiates with the Korean delegation Dec. 7, 9:20 to 1 and 6 to 8:30 (Suslov, Mazurov, Novikov and Rusakov with him), Dec. 8, 9 to 2, and Dec. 9, 9 to 1)'
    units: '?'
- cite:
    id: cal.1968-07-15.soviet-union
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 271 (the secretaries'' record, July 13–15: Brezhnev leads the party delegation to Warsaw, with Kosygin, Podgorny, Katushev and Shelest, for the meeting with the leaders of the socialist countries; the talks July 14 and 15 with the delegations of Bulgaria, Hungary, Poland and the GDR; the delegation leaves by train July 15, 8 p.m. Moscow time, and is back July 16, 5 p.m.; nothing of the letter)'
    units: '?'
- cite:
    id: cal.1968-07-29.soviet-union-czechoslovakia
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 274–75 (the secretaries'' record, July 28–Aug. 2: the delegation flies out July 28, 4 p.m.; the Soviet Politburo''s delegation named July 29 (Brezhnev, Voronov, Kosygin, Mazurov, Pelshe, Podgorny, Suslov, Shelepin, Shelest, the candidates Demichev and Masherov, the secretaries Katushev and Ponomarev) and the Czechoslovak Presidium''s (Dubček, Barbírek, Biľak, Černík, Kolder, Kriegel, Piller, Rigo, Smrkovský, Špaček, Švestka, the candidates Kapek, Lenárt and Šimon, Jakeš of the Control Commission), President Svoboda present; the talks July 29–31 at Čierna nad Tisou, resumed July 31 at 12:30 Moscow time, ended Aug. 2)'
    units: '?'
- cite:
    id: cal.1968-08-03.soviet-union-czechoslovakia
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 275 (the secretaries'' record, Aug. 2–5: Brezhnev with Kosygin, Podgorny, Suslov, Shelest, Katushev and Ponomarev leaves Čierna by train Aug. 2 for Bratislava, where Aug. 3 he takes part in the meeting of the delegations of Bulgaria (Zhivkov), Hungary (Kádár), the GDR (Ulbricht), Poland (Gomułka), the USSR and Czechoslovakia; the delegation is back in Moscow Aug. 5, 5 p.m)'
    units: '?'
- cite:
    id: cal.1968-08-26.soviet-union-czechoslovakia
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 279 (the secretaries'' record, Aug. 26: Brezhnev with the Politburo negotiates 4 to 11 p.m. with the Czechoslovak government delegation led by Svoboda; the joint communiqué signed after; from midnight to 1:30 the dinner for the delegations of Bulgaria (Zhivkov), Poland (Gomułka), Hungary (Kádár) and the GDR (Ulbricht), Kosygin and Podgorny with him)'
    units: '?'
- cite:
    id: cal.1968-11-12.soviet-union
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 298 (the secretaries'' record, Nov. 10–18: Brezhnev leads the CPSU delegation to the Fifth Congress of the Polish party (Shelest, Grishin, Katushev, Kiselev and others), arriving Nov. 10, 11 a.m.; speaks Nov. 12 at 11:15 Moscow time; back in Moscow Nov. 18, noon; the record has no word of the speech)'
    units: '?'
- cite:
    id: cal.1967-03-13.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 177–178 (the secretaries'' record, Mar. 13–14: Moscow. Zhivkov. Brezhnev meets him Mar. 13, 9 a.m., negotiates 10 to 2, and negotiates again Mar. 14 in the Politburo''s hall with Kosygin, Andropov and Lesechko)'
    units: '?'
- cite:
    id: cal.1967-03-17.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 178–179 (the secretaries'' record, Mar. 17–18: Moscow. Ceaușescu and the Romanian party delegation. Brezhnev meets them Mar. 17, 10 a.m., and negotiates 3 to 8 p.m. with Kosygin, Andropov and Gromyko; Mar. 18, 10 to 2 in the Politburo''s new hall, and 3 to 5 in the Central Committee; sees them off at 5)'
    units: '?'
