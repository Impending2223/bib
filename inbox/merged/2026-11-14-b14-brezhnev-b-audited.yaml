    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 250 (the secretaries'' record, Apr. 9–10: Brezhnev at the plenum Apr. 9, 10 to 2, where he speaks, and 4 to 6; Apr. 10, 10 to 2 and 4 to 6:20)'
