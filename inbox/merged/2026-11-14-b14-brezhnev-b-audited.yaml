- cite:
    id: cal.1968-07-27.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 274 (the secretaries'' record, July 27: Brezhnev presides over the Politburo in the new hall, 4:30 p.m. to 12:32 a.m., after its session of July 26, 4 to 11 p.m.)'
