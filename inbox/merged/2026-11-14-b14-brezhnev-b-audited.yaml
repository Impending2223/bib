    id: cal.1967-06-12.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 196 (the secretaries'' record, June 12–13: Moscow. Brezhnev negotiates with Boumediene in the Kremlin, 7 p.m. to 1 a.m)'
    units: '?'
- cite:
    id: cal.1968-03-06.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 244 (the secretaries'' record, Mar. 4–7: Brezhnev leads the party-government delegation to the Political Consultative Committee, leaving Moscow by special train Mar. 4, 1 p.m.; in Sofia Mar. 6, 9:20 a.m.; at the meeting Mar. 7)'
    units: '?'
- cite:
    id: cal.1968-04-22.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 253–254 (the secretaries'' record, Apr. 22–26: Moscow. Brezhnev negotiates with the North Vietnamese party-government delegation led by Phạm Văn Đồng: Apr. 22, 10:30 to 1, then 1 to 2 with the Soviet side alone; Apr. 23, 10 to 1 and 5 to 8; Apr. 24, 10 to 1, with Kosygin, Katushev, Rusakov and Gromyko; Apr. 26, 3 to 5, and a reception)'
    units: '?'
