    id: cal.1966-04-27.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 122 (the secretaries'' record, Apr. 26–28: Brezhnev flies to Tashkent Apr. 26, 11:25 a.m.; Apr. 27, with Kosygin, he visits the stricken districts and the Golodnaya Steppe; Apr. 28 on to Krasnodar)'
    units: '?'
