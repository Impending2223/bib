    id: cal.1968-09-05.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 282 (the secretaries'' record, Sept. 5: 9 to 11, Brezhnev''s meeting with Aristov, Abrasimov, Benediktov, Chervonenko, Puzanov, Basov, Soldatov, Sikachev, Panyushkin, Kuznetsov and Gromyko; the Politburo in the Kremlin, 4 to 7 p.m.)'
