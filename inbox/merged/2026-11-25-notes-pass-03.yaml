    text: 'FRUS 1964–68, V, doc. [177](https://history.state.gov/historicaldocuments/frus1964-68v05/d177)'
- names:
    id: cal.1967-05-19.vietnam
    tags:
    - ok:note-substance
# ---- July 12-13, 1967
- add-words:
    id: cal.1967-07-13.vietnam-program-5
    after: end
    words: 'Wheeler is with them. Johnson: "some additional troops are going to be needed and are going to be supplied."'
    item: '[[w.barrett-uncertain-warriors]], 104'
- add-words:
    id: cal.1967-07-13.vietnam-program-5
    after: end
    words: Clifford and Taylor are to go to the allies.
    item: '[[w.berman-lyndon-johnsons-war]], 55–56'
- names:
    id: cal.1967-07-13.vietnam-program-5
    add:
    - Wheeler
    - Clifford
    - Taylor
    tags:
    - name:wheeler-earle
    - name:clifford-clark
    - name:taylor-maxwell
- add-words:
    id: cal.1967-07-12.vietnam-force-levels
    after: end
    words: 'By Westmoreland''s account Johnson tells him after the meeting that he has chosen the smaller package, cut almost in half: just over 47,000 men, under a ceiling of 525,000.'
    item: '[[w.westmoreland-soldier-reports]], 230'
- names:
    id: cal.1967-07-12.vietnam-force-levels
    add:
    - Westmoreland
    tags:
    - name:westmoreland-william
- add:
    entry:
      id: cal.1967-07-13.vietnam-program-5-2
      when: July 13
      date: '1967-07-13'
      time: 1967-07-13T17:25Z
      time_zone: America/New_York
      place: washington
      thread: vietnam-program-5
      c: 'The Family Dining Room, 1:25 to 2:45 p.m. Johnson with McNamara, Wheeler, Westmoreland and Christian. McNamara: "complete accord" on the troops: 19 or 21 battalions, total strength 525,000; the allies to be consulted first. Westmoreland: no announcement of troop levels or increases. Johnson asks whether to send Taylor and Clifford to the allies; all agree. No censorship. Westmoreland "delighted with the outcome."'
      n: 'FRUS 1964–68, V, doc. [240](https://history.state.gov/historicaldocuments/frus1964-68v05/d240) (Tom Johnson''s notes; the plan approved July 12, 47,296 men for an authorized 525,000, n.2). Made public: FRUS 1964–68, V (2002). See [[cal.1967-07-13.vietnam-program-5]]. Names: Johnson, McNamara, Wheeler, Westmoreland, Christian, Taylor, Clifford. Check: the news conference is timed 2:10 p.m., within this meeting''s hours.'
      tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:wheeler-earle, name:westmoreland-william, name:christian-george, name:taylor-maxwell, name:clifford-clark]
# ---- Feb. 12, 1968: the cable (0612Z) and the meeting (1:45-3:08 p.m.)
- edit:
    id: cal.1968-02-12.vietnam-tet
    base: 3f3e8b1e
    set:
      time: 1968-02-12T06:12Z
      time_zone: Asia/Ho_Chi_Minh
- add-words:
    id: cal.1968-02-12.vietnam-tet
    after: 'he asks for reinforcements now.'
    words: 'He asks that a Marine regiment package and a brigade package of the 82d Airborne go at once: "I need these 525,000 troops now," the ceiling promised for 1969.'
    text: 'FRUS 1964–68, VI, doc. [68](https://history.state.gov/historicaldocuments/frus1964-68v06/d68) (MAC 01975, 0612Z)'
- add:
    entry:
      id: cal.1968-02-12.vietnam-tet-2
      when: Feb. 12
      date: '1968-02-12'
      time: 1968-02-12T18:45Z
      time_zone: America/New_York
      place: washington
      thread: vietnam-tet
      follows: [cal.1968-02-12.vietnam-tet]
      c: 'Johnson with his senior advisers on Westmoreland''s cable, 1:45 to 3:08 p.m. Rusk would send the six battalions without a permanent commitment. McNamara: send the units asked, for the emergency only, and send Wheeler to meet Bunker, Westmoreland and Vance; 14 days. Wheeler: 3,800 from the 82d Airborne and 6,500 Marines, 10,300 in all. Clifford asks what has changed in the enemy''s strategy.'
      n: 'FRUS 1964–68, VI, doc. [70](https://history.state.gov/historicaldocuments/frus1964-68v06/d70) (notes of the meeting). Made public: FRUS 1964–68, VI (2002). The cable (0612Z) came first. See [[cal.1968-02-12.vietnam-tet]]. Names: Johnson, Rusk, McNamara, Wheeler, Bunker, Westmoreland, Vance, Clifford.'
      tags: [name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s, name:wheeler-earle, name:bunker-ellsworth, name:westmoreland-william, name:vance-cyrus, name:clifford-clark]
# ---- Mar. 4, 1968: FRUS VI, doc. 104
- edit:
    id: cal.1968-03-04.vietnam
    base: be9bb97d
    set:
      time: 1968-03-04T22:33Z
      time_zone: America/New_York
- add-words:
    id: cal.1968-03-04.vietnam
    after: end
    words: 'The meeting, the Cabinet Room, 5:33 to 7:20 p.m. Clifford: "a whole new look at the whole situation." Without the troops for Korea and the naval units, 242,000 reservists and a 454,000 increase in strength.'
    text: 'FRUS 1964–68, VI, doc. [104](https://history.state.gov/historicaldocuments/frus1964-68v06/d104)'
- add-words:
    id: cal.1968-03-04.vietnam
    after: end
    words: 'Fowler: expenditures up $2.5 billion in fiscal 1968 and $10 billion in fiscal 1969, a $500 million cost to the balance of payments; a new fiscal program needed. Wheeler: the 22,000 is all that can be provided by June 15; with the call-up Westmoreland''s request can be met by Sept. 1 and Dec. 1, not by May 1.'
    text: 'FRUS 1964–68, VI, doc. [104](https://history.state.gov/historicaldocuments/frus1964-68v06/d104)'
- names:
    id: cal.1968-03-04.vietnam
    add:
    - Fowler
    - Wheeler
    tags:
    - name:fowler-henry-h
    - name:wheeler-earle
- names:
    id: cal.1968-03-04.vietnam
    tags:
    - ok:note-substance
# ---- Apr. 3, 1968: FRUS VI, doc. 176
- add-words:
    id: cal.1968-04-03.robert-kennedy
    after: end
    words: 'Johnson has Kennedy''s wire; he says he has taken himself out of the election. He hopes Kennedy will keep in touch with Katzenbach; Clifford will see him at any time. Kennedy: the speech was "magnificent"; a lot of it "was my fault."'
    text: 'FRUS 1964–68, VI, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v06/d176)'
- add-words:
    id: cal.1968-04-03.robert-kennedy
    after: end
    words: By Sorensen's account Johnson does some 90 percent of the talking; Humphrey is the next visitor.
    item: '[[w.sorensen-counselor]], 461–62'
- names:
    id: cal.1968-04-03.robert-kennedy
    add:
    - Katzenbach
    - Clifford
    - Humphrey
    tags:
    - name:katzenbach-nicholas
    - name:clifford-clark
    - name:humphrey-hubert-h
# ---- Nov. 15, 1960: FRUS 1958-60, IV, doc. 58
- add-words:
    id: cal.1960-11-15.economy
    after: end
    words: 'Present also: Lennartson, von Klemperer of the Treasury, Gen. George Brown, Hagerty and Col. John Eisenhower, who writes the memorandum. Eisenhower opens on the State and Defense memorandum for continued military aid to Italy, Belgium and the Netherlands; Anderson would make them pay. He wants the lower ranks favored in the cut of dependents; the regular services are "enlisted for service and not for personal gain."'
    text: 'FRUS 1958–60, IV, doc. [58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58)'
- names:
    id: cal.1960-11-15.economy
    add:
    - Hagerty
    - George Brown
    - John Eisenhower
    tags:
    - name:hagerty-james-c
    - name:brown-george-s
    - name:eisenhower-john-s-d
