    words: 'Peng reports the Center''s line: unity through criticism or struggle to a new unity; reconnaissance turned into an encounter battle; three steps, objection, refutation with their own view, the facts; Khrushchev''s "father party" shown; the Center''s three last moves, amendments, a signature with reservations, a statement.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 45–46'
- add-words:
    id: cal.1960-07-08.china-leadership
    after: end
    words: 'The discussion, by Wu''s account, takes up seven points: two lines, war and peace, Khrushchev''s rage, the surprise attack, a long struggle, no fear of a break, the reply to the notification. Mao: a struggle of "encirclement" and counter-encirclement.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 309–313'
