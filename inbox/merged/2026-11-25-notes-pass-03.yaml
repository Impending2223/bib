# ---- July 20, 1967, Wuhan
- edit:
    id: cal.1967-07-20.china-leadership
    base: 9d3afa5c
    set:
      time: 1967-07-19T21:10Z
      time_zone: Asia/Shanghai
    unset: [time_range, time_band]
- add-words:
    id: cal.1967-07-20.china-leadership
    after: end
    words: About 200 delegates of the "Million Heroes" come at dawn to Baihua No. 2 for Wang Li; Chen Zaidao and Xie Fuzhi promise to see them in the afternoon; several hundred, mostly soldiers, then rush in and beat Chen. Qiu Huizuo carries the letter of Lin Biao and Jiang Qing to Mao by plane.
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76, at n.54'
- add-words:
    id: cal.1967-07-20.china-leadership
    after: end
    words: 'At 5:10, 21 trucks of Unit 8201 and 41 armed vehicles of the Million Heroes burst into the guesthouse; about 6 Chen Zaidao is beaten and Wang Li put on a truck. Niu Huailong at the west gate: "put the machine guns away."'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 531'
- names:
    id: cal.1967-07-20.china-leadership
    add:
    - Chen Zaidao
    - Qiu Huizuo
    - Niu Huailong
    tags:
    - name:chen-zaidao
    - name:qiu-huizuo
    - name:niu-huailong
- add:
    entry:
      id: cal.1967-07-20.china-leadership-20
      when: July 20
      date: '1967-07-20'
      time: 1967-07-19T16:30Z
      time_zone: Asia/Shanghai
      place: wuhan
      thread: china-leadership
      c: 'Wuhan, the East Lake guesthouse, 0:30. Fourteen of the "Wuhan Public Security" reach the north gate, near Mao''s lodging, demanding that Xie Fuzhi and Wang Li receive them. Wang Dongxing sends Zhang Gencheng to the gate; Zhong Hanhua, asleep, does not answer. About 3 a.m. a platoon of the 29th Division holds them off.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 530 (by Xu Hailiang''s account, n.35). See [[cal.1967-07-20.china-leadership]]. Names: Xie Fuzhi, Wang Li, Wang Dongxing, Zhong Hanhua, Mao Zedong.'
      tags: [name:xie-fuzhi, name:wang-li, name:wang-dongxing, name:zhong-hanhua, name:mao-zedong, polity:prc]
# ---- July 25, 1967
- add-words:
    id: cal.1967-07-25.china-leadership-2
    after: end
    words: 'Some 300,000 (by another account a million). Zhou Enlai is on the rostrum, Wang Li in a wheelchair at the center between Lin and Zhou. Wang opposed the grand reception, which Lin directed: "not for you, for the Chairman." Kuai Dafu, on the rostrum: Lin raises his hand at "down with the handful in the army."'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 538, 540'
- names:
    id: cal.1967-07-25.china-leadership-2
    add:
    - Zhou Enlai
    - Kuai Dafu
    tags:
    - name:zhou-enlai
    - name:kuai-dafu
- names:
    id: cal.1967-07-25.china-leadership-2
    tags:
    - ok:note-substance
