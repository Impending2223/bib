# ---- FRUS 1964-68, V, doc. 149: Apr. 27, 1967
- edit:
    id: cal.1967-04-27.vietnam-program-5
    base: db8924d3
    set:
      time: 1967-04-27T15:35Z
      time_zone: America/New_York
    unset: [time_range, time_band, range_basis]
- add-words:
    id: cal.1967-04-27.vietnam-program-5
    after: end
    words: Rusk, McNamara, Katzenbach, Vance, Komer, Rostow and Wheeler are present; Christian takes the notes. The sessions run 10:35 to 11:50 a.m. and 4:45 to 6:30 p.m.
    text: 'FRUS 1964–68, V, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v05/d149) (the source note, by the Daily Diary)'
- add-words:
    id: cal.1967-04-27.vietnam-program-5
    after: end
    words: 'Westmoreland: the enemy totals 285,000 and the crossover point was reached last month; on the present program of 470,000 men, "a meat grinder," the war could go on five years; with 565,000, three; with 665,000, two. Johnson: "When we add divisions, can''t the enemy add divisions? If so, where does it all end?"'
    text: 'FRUS 1964–68, V, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v05/d149)'
- add-words:
    id: cal.1967-04-27.vietnam-program-5
    after: end
    words: 'Wheeler: the bombing will soon have struck all worthwhile fixed targets but the ports; without the added divisions "the momentum will die."'
    text: 'FRUS 1964–68, V, doc. [149](https://history.state.gov/historicaldocuments/frus1964-68v05/d149)'
- add-words:
    id: cal.1967-04-27.vietnam-program-5
    after: end
    words: 'By Westmoreland''s account, asked by McNamara how long to wind down: with the optimum force about three years, with the minimum at least five.'
    item: '[[w.westmoreland-soldier-reports]], 228'
- names:
    id: cal.1967-04-27.vietnam-program-5
    add:
    - McNamara
    - Rusk
    - Katzenbach
    - Vance
    - Komer
    - Rostow
    - Wheeler
    - Christian
    tags:
    - name:mcnamara-robert-s
    - name:rusk-dean
    - name:katzenbach-nicholas
    - name:vance-cyrus
    - name:komer-robert-w
    - name:rostow-walt-w
    - name:wheeler-earle
    - name:christian-george
