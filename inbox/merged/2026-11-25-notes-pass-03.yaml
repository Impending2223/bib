# ---- Nov. 1966, Shanghai
- add-words:
    id: cal.1966-11-09.china-leadership-3
    after: end
    words: Inaugurated on Cultural Plaza; Mayor Cao Diqiu calls the rebels "the dregs of humanity."
    item: '[[w.dikotter-cultural-revolution]], 125'
- names:
    id: cal.1966-11-09.china-leadership-3
    add:
    - Cao Diqiu
    tags:
    - name:cao-diqiu
    - ok:note-substance
- add:
    entry:
      id: cal.1966-11-06.china-leadership-4
      when: Nov. 6
      date: '1966-11-06'
      place: shanghai
      thread: china-leadership
      also: [china]
      c: Shanghai, the Shanghai Liaison Station of the Capital Third Headquarters. Worker rebels from seventeen factories meet and form the Shanghai Workers' Revolutionary Rebel General Headquarters; Wang Hongwen, thirty-two, a security guard, is "commander."
      n: '[[w.macfarquhar-maos-last-revolution]], 141. Check: the Zhou chronology and Dikötter date the founding Nov. 9 ([[cal.1966-11-09.china-leadership-3]]). Names: Wang Hongwen.'
      tags: [name:wang-hongwen, polity:prc]
- add:
    entry:
      id: cal.1966-11-09.china-leadership-9
      when: Nov. 9
      date: '1966-11-09'
      place: shanghai
      thread: china-leadership
      also: [china]
      c: Shanghai. Right after the rebel workers' inauguration more than 20,000 march to city hall to have their organization recognized, and wait for hours in the rain; a rumoured telegram from Zhou Enlai, "come to Beijing," sends them to the railway station.
      n: '[[w.dikotter-cultural-revolution]], 125 (the telegram a rumour). See [[cal.1966-11-09.china-leadership-3]]. Names: Zhou Enlai.'
      tags: [name:zhou-enlai, polity:prc]
      follows: [cal.1966-11-09.china-leadership-3]
# ---- Jan. 24, 1967: the budget's reception
- add:
    entry:
      id: cal.1967-01-24.republican-party
      when: Jan. 24
      date: '1967-01-24'
      thread: republican-party
      also: [economy]
      c: 'Halleck, former House minority leader, on the fiscal 1968 budget, $172.4 billion, the largest in history: "guns, butter and a lot of fat."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 271. See [[cal.1967-01-24.economy]]. Names: Halleck. Check: the day.'
      tags: [name:halleck-charles-a]
- add:
    entry:
      id: cal.1967-01-24.republican-party-congress
      when: Jan. 24
      date: '1967-01-24'
      thread: republican-party-congress
      also: [economy]
      c: 'Dirksen on the budget: Republicans will accept a "reasonable" deficit for Vietnam, but domestic spending, the Great Society above all, will "get a hard look."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 271. See [[cal.1967-01-24.economy]]. Names: Dirksen. Check: the day.'
      tags: [name:dirksen-everett]
- check:
    id: cal.1967-01-24.economy
    text: 'Check: Zelizer gives the budget as $172.4 billion ([[w.zelizer-fierce-urgency-of-now]], 271). Check: Gibbons gives $21.9 billion for fiscal 1968, against $22.4 billion above ([[w.gibbons-u-s-government-and]], IV, 585).'
- names:
    id: cal.1967-01-24.economy
    tags:
    - ok:note-substance
# ---- Feb. 3, 1967
- add-words:
    id: cal.1967-02-03.china-leadership
    after: end
    words: 'The decisive battle is not yet finished: February, March and April are the time of decision, and the solving of all may take to next February, March or April or longer; only by rousing the masses is there a way.'
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76, at n.11'
- add-words:
    id: cal.1967-02-03.china-leadership
    after: end
    words: 'Of the article on *Hai Rui*: Jiang Qing''s people organized it in Shanghai; he was told to show it to no one, not Zhou Enlai or Kang Sheng, for then Liu Shaoqi, Deng Xiaoping, Peng Zhen and Lu Dingyi, who opposed its publication, would see it.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 12'
