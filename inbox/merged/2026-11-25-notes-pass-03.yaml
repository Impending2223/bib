      c: 'Beidaihe. The Central Work Conference''s decisions: the Center''s directives on the whole Party''s turning to agriculture and grain, and on a drive for output and economy centered on grain and steel; Li Fuchun''s and Bo Yibo''s report on third-quarter industry and transport approved; capital construction cut, steel secured, labor cleared, agriculture''s front line strengthened; one account book only in the plans from now on. "Low standards" and "melons and vegetables in place of grain"; by Mao, the production team the basic accounting unit for five years at least, and private plots.'
      n: '[[w.deng-xiaoping-nianpu-1904]], III, 1564–1565; [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 491 (the report approved); [[w.chen-yun-nianpu-xiuding]], III, 39–40 ("low standards," "melons and vegetables," Mao on the team and the plots). See [[cal.1960-07-05.china-leadership]]. Names: Li Fuchun, Bo Yibo, Mao Zedong. Check: the day of each directive; the sources give the conference''s span.'
      tags: [name:li-fuchun, name:bo-yibo, name:mao-zedong, polity:prc]
