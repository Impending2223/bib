# ---- Jan. 17, 1968
- add-words:
    id: cal.1968-01-17.program
    after: end
    words: The text, asked at under 4,000 words, runs 4,070.
    item: '[[w.califano-triumph-and-tragedy-of]], 255'
- add-words:
    id: cal.1968-01-17.program
    after: end
    words: 'By Lady Bird Johnson''s account he enters to three minutes'' applause; the speech runs forty-nine minutes with about fifty applauses, the loudest for "The American people have had enough of rising crime and lawlessness"; the teleprompter fails and he interpolates.'
    item: '[[w.johnson-white-house-diary]], 618–19'
