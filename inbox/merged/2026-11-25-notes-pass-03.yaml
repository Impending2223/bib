# ---- May 28, 1968, Portland
- add-words:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-3
    after: end
    words: 'Kennedy goes first to Edith Green, sorry if he let her down: the loss his, not theirs. The telegram of congratulations to McCarthy is argued for half an hour; Kennedy: "we''ve lost the primary but we ought at least to be able to resolve this."'
    item: '[[w.obrien-no-final-victories]], 242'
