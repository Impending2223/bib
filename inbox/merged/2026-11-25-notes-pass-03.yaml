# ---- Mar. 12, 1968
- add:
    entry:
      id: cal.1968-03-12.robert-kennedy-campaign-decision
      when: Mar. 12, night
      date: '1968-03-12'
      time_range: [1968-03-13T03:00Z, 1968-03-13T05:00Z]
      time_band: night
      time_zone: America/New_York
      place: nyc
      thread: robert-kennedy-campaign-decision
      c: 'New York, driving uptown to "21." Moyers to Schlesinger: the White House "impenetrable"; "four more years of Johnson would be ruinous for the country"; Kennedy would still err to run.'
      n: '[[w.shesol-mutual-contempt]], 418. See [[cal.1968-03-12.robert-kennedy-campaign]]. Names: Moyers, Schlesinger, Johnson, Robert Kennedy.'
      tags: [name:moyers-bill, name:schlesinger-arthur-m-jr, name:johnson-lyndon-b, name:kennedy-robert-f]
- check:
    id: cal.1968-03-12.robert-kennedy-campaign
    text: 'Check: White has Kennedy at a restaurant with vanden Heuvel, Schlesinger and Tom Johnston ([[w.white-making-of-the-president-1969]], 162); Shesol has Moyers driving uptown to "21" with Schlesinger (418).'
