    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 540'
- add-words:
    id: cal.1967-08-04.china-leadership-6
    after: end
    words: By Jian's account Zhang Chunqiao and Yao Wenyuan back the attackers, hundreds of thousands; the plant's defenders surrender by the day's end.
    item: '[[w.jian-zhou-enlai]], 577'
