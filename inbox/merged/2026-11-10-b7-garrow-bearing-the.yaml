- add:
    entry:
      id: cal.1966-01-12.georgia-bond
      when: Jan. 12
      date: '1966-01-12'
      thread: georgia-bond
      c: Atlanta. King, back Jan. 11 and having seen Bond, announces a march to the capitol on Friday and a statewide voter
        registration campaign "to purge the state of political leaders with myopic vision." SNCC's stand against the draft
        endorsed "in principle"; he has "never encouraged evading the draft." "I would imagine that the vast majority of people
        in the United States support the policy of the administration."
      n: '[[w.garrow-bearing-the-cross]], 458. To check: King, "Statement . . .," Jan. 12, 1966, King Papers; Washington Evening
        Star, Jan. 12, 1966, A14; Atlanta Constitution, Jan. 12–15, 1966, 1; New York Times, Jan. 13, 1966, 18 (cited by [[w.garrow-bearing-the-cross]],
        459 n.29); [[w.carson-in-struggle]], 188–90 (cited by [[w.garrow-bearing-the-cross]], 459 n.29). See [[cal.1966-01-10.georgia-bond]].
        Names: King, Bond.'
      src:
        c: 9984e4af
        rows:
        - 'w.garrow-bearing-the-cross 458: all'
        - 'via x.1966-01-12.king-statement-jan-12-1966: all'
