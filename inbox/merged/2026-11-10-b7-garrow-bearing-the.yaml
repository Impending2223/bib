- add:
    entry:
      id: cal.1965-12-06.king-2
      when: Dec. 6–7
      date: '1965-12-06'
      thread: king
      also:
      - alabama
      c: 'The Black Belt, Butler, Sumter, Clarke and Greene Counties: King''s two-day tour, SCLC''s first step toward new
        protests in Alabama. He calls for federal legislation to protect civil rights workers and assure justice in southern
        courts. To reporters: the Liuzzo verdicts and the maximum sentences "have made it more difficult for us to dramatize
        the need for changes in the structure of courts and law enforcement agencies in the South."'
      n: '[[w.garrow-bearing-the-cross]], 453–54. To check: New York Times, Dec. 7, 1965, 33; Dec. 8, 1965, 33; King, in the
        Southern Courier, Dec. 11–12, 1965, 1 (cited by [[w.garrow-bearing-the-cross]], 454 n.26). See [[cal.1965-12-03.alabama]].
        Names: King, Liuzzo.'
      src:
        c: cb8a2727
        rows:
        - 'w.garrow-bearing-the-cross 453–54: all'
        - 'via x.1965-12-07.new-york-times-dec-7-1965-33: all'
        - 'via x.1965-12-08.new-york-times-dec-8-1965-33: all'
        - 'via x.1965-12-11.king-southern-courier-dec-11-12-1965: all'
      tags:
      - name:king-martin-luther-jr
      - name:liuzzo-viola
