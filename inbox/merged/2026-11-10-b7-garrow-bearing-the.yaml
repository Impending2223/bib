      id: cal.1966-01-14.georgia-bond
      when: Jan. 14
      date: '1966-01-14'
      thread: georgia-bond
      c: 'Atlanta, the capitol, in cold, raw weather. Hardly 1,500 hear King attack the House''s exclusion of Bond. After
        he leaves, SNCC''s protesters try to force the police lines into the capitol; a brief clash. Griffin, SCLC''s spokesman:
        King "hurt and shocked" by the violence.'
      n: '[[w.garrow-bearing-the-cross]], 458–59. Check: the day of Griffin''s statement. To check: King, "Address . . .,"
        Jan. 14, 1966, King Papers; New York Times, Jan. 15, 1966, 1; Atlanta Constitution, Jan. 12–15, 1966, 1 (cited by
        [[w.garrow-bearing-the-cross]], 459 n.29). See [[cal.1966-01-12.georgia-bond]]. Names: King, Bond.'
      src:
