      when: Jan. 16
      date: '1966-01-16'
      thread: war-opposition
      also:
      - king
      c: 'Atlanta, Ebenezer, the Sunday sermon, "Non-Conformist." King: dissent and nonconformity the essence of true Christianity;
        "we aren''t doing enough to end the war in Vietnam. . . . Our hands are dirty"; "Most people really aren''t educated
        about what''s happening in Vietnam."'
      n: '[[w.garrow-bearing-the-cross]], 459. To check: King, "Non-Conformist," Ebenezer, Jan. 16, 1966 (cited by [[w.garrow-bearing-the-cross]],
        459 n.29). See [[cal.1966-01-14.georgia-bond]]. Names: King.'
