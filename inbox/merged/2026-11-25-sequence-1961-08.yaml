    id: cal.1961-08-19.china-leadership-8
    base: 24b57817
    set:
      n: '[[w.chen-yi-nianpu]], 886. After [[cal.1961-08-19.china-leadership-7|the visits]]: the poems recited at the banquet, written for Goulart''s visit, are on Meijiawu and Pingfeng Hill, two of the day''s visits ([[w.chen-yi-nianpu]], 886). The words: 晚上 (886). Names: Chen Yi, Goulart, Zhou Jianren.'
