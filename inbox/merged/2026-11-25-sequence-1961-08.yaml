- edit:
    id: cal.1961-08-30.press-and-broadcasting
    base: 5b112fc3
    set:
      n: 'The President''s News Conference, [1961 Pub. Papers 572](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630) (Aug. 30, 1961), at 572–80 (the note, 580: the sixteenth, the place and the hour). After [[cal.1961-08-30.school-aid|the House''s vote]] and [[cal.1961-08-30.states-and-cities|Atlanta''s schools]]: the opening statement praises the four high schools "desegregated today," and the first question on school aid asks of "the House action today on your school aid measure" (572–80). Names: Kennedy.'
