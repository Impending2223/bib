- edit:
    id: cal.1961-08-31.berlin-and-vienna
    base: ea11db8c
    set:
      time: 1961-08-31T20:00Z
      time_approx: true
      n: '[FRUS 1961–63, XIV, doc. 135](https://history.state.gov/historicaldocuments/frus1961-63v14/d135) (Bundy''s memorandum of decisions). The President joins the Berlin Steering Group at the White House shortly after 4 p.m.: [FRUS 1961–63, XIV, doc. 135](https://history.state.gov/historicaldocuments/frus1961-63v14/d135), n.2 (Rusk''s appointment book; the President''s log). [[w.schlesinger-robert-kennedy-and-his]], 429–30; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 161 (Norstad authorized to replace civil aircraft with military and to let fighters take "aggressive protective measures"; no authority against anti-aircraft and missile fire, the allies refusing); [[w.poole-joint-chiefs-of-staff]], 150. To check: Robert Kennedy, dictated Sept. 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 430 n.54). See [[cal.1961-08-13.berlin-and-vienna]]. Names: Kennedy, Lemnitzer, Taylor, Robert Kennedy, McNamara. Check: Robert Kennedy''s notes do not date the meeting; Bundy''s memorandum is of Aug. 31.'
    unset: [time_range, time_band, range_basis]
