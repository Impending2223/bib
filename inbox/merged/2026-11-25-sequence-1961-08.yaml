    set:
      n: '[[w.zhou-enlai-waijiao-huodong]], 319 (Aug. 16, 1961; 上午). After [[cal.1961-08-16.china-leadership-3|the farewell to Phạm Văn Đồng]]: one item of the morning, the farewell at the Peking airport and then the flight with Nkrumah out of Peking ([[w.zhou-enlai-waijiao-huodong]], 319). Names: Zhou Enlai, Nkrumah.'
