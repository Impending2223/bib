      n: '[[w.branch-parting-the-waters]], 752. After [[cal.1963-04-26.alabama-birmingham|the verdict]]: the trial over, the petition came "accordingly, on the very day of the verdict" (Branch, 752). To check: Shuttlesworth to the Birmingham City Commission, Boutwell, Hodges and Robinson, telegrams, Apr. 26, 1963, Birmingham Public Library (cited by [[w.branch-parting-the-waters]], 752 n.1). Names: Shuttlesworth, Boutwell.'
