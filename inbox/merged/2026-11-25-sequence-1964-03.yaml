- edit:
    id: cal.1964-03-01.china-leadership
    base: fea1bc22
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 625 (Mar. 1, 1964); [[w.jian-zhou-enlai]], 503 (Zhou and Song back in Kunming Mar. 1). After [[cal.1964-03-01.china-leadership-9|the flight home over Burma]]: the party reached Kunming at 9:25 a.m. ([[w.chen-yi-nianpu]], 1018). Names: Zhou Enlai.'
- edit:
    id: cal.1964-03-06.china-leadership-7
    base: 283c2a2b
    set:
      n: '[[w.yang-shangkun-riji]], II, 358 (Mar. 6, 1964). The words: 与恩来同志通电话，告诉他会谈情况 (II, 358). After [[cal.1964-03-06.china-leadership-6|the ball with Li Bozhao]], in the diary''s sequence: after dinner the ball, then work to 2 and home to bed, then the call (II, 358). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Zhou Enlai.'
- edit:
    id: cal.1964-03-12.succession-2
    base: 51199dcb
    set:
      n: '[[w.johnson-white-house-diary]], 91–94 (Lady Bird Johnson''s account). The time is the lunch''s; the diary gives the burial no hour (91–93). After [[cal.1964-03-12.succession|the Requiem Mass and the procession]]: from the Athens Hilton, where the procession ended, to Tatoi; the Mass "two or three hours earlier" (91–92). Names: Lady Bird Johnson, Truman, Labouisse, Couve de Murville, Constantine, Juliana.'
- edit:
    id: cal.1964-03-18.elections-1964-primaries-2
    base: 3d2c17ba
    set:
      n: '[[w.salinger-with-kennedy]], 346. After [[cal.1964-03-18.elections-1964-primaries-4|his leaving the Sans Souci]]: back at the White House, waiting to see Johnson (346). Check: the day. Names: Salinger, Goldberg.'
- edit:
    id: cal.1964-03-18.elections-1964-primaries-3
    base: 04b0e7e8
    set:
      n: '[[w.salinger-with-kennedy]], 348. After [[cal.1964-03-18.elections-1964-primaries-2|the call to Goldberg]], in Salinger''s sequence: Goldberg while he waited to see Johnson (346); Brown his last call, made as he cleared his desk after the resignation and the briefing (348). Check: the day. Names: Salinger, Brown, Cranston.'
- edit:
    id: cal.1964-03-19.transition-and-staff-2
    base: c114d9db
    set:
      n: '[[w.johnson-white-house-diary]], 96 (Lady Bird Johnson''s account; she gives no hour); [[w.salinger-with-kennedy]], 347 (Johnson asks Salinger, then Jenkins and O''Donnell: Reedy or Valenti; all say Reedy, in the hospital; "He''s the new Press Secretary as of now"); [[w.salinger-with-kennedy]], 347. After [[cal.1964-03-19.transition-and-staff|the resignation]]: in Salinger''s account after the letter of 5 p.m. (346–47); in Lady Bird Johnson''s, after Salinger tells Johnson about 3 p.m. (96). See [[cal.1964-03-19.transition-and-staff]]. Names: Johnson, Reedy, Salinger, Jenkins, Valenti, O''Donnell.'
- edit:
    id: cal.1964-03-24.space-3
    base: 15230a52
    set:
      n: '[[w.johnson-white-house-diary]], 99–101 (Lady Bird Johnson''s account). After [[cal.1964-03-24.space|the greeting ceremony]]: "When the greeting ceremony was over" (99). Names: Lady Bird Johnson, Webb, Von Braun, Johnson, Erhard.'
- edit:
    id: cal.1964-03-24.space-4
    base: 16d0c409
    set:
      n: '[[w.johnson-white-house-diary]], 101 (Lady Bird Johnson''s account). After [[cal.1964-03-24.space-3|the test firing]]: "After a second and somewhat less dramatic firing we returned to the auditorium" (101). Names: Lady Bird Johnson, Webb, Von Braun.'
- edit:
    id: cal.1964-03-25.china-leadership-7
    base: 3d0e23ea
    set:
      n: '[[w.zhu-de-nianpu-xinbian]], III, 1904. The words: 晚，抵达桂林市 (1904). After [[cal.1964-03-25.china-leadership-6|Liuzhou]]: the nianpu has him leave Nandan for Guangxi on Mar. 24, reach Liuzhou and inspect its works on Mar. 25, and reach Guilin that evening (III, 1904). Names: Zhu De.'
