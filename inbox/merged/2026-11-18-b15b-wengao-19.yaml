      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 244–245 (Apr. 1968). Men He died Sept. 5, 1967, covering with his body an accidental explosion of explosive at the Bacang farm (n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day, which the book gives only as Apr. 1968. To check: Military Commission Office Group, request for instructions of Apr. 7, 1968, sending the draft order of the Central Committee, Military Commission and Cultural Revolution Group conferring on Men He the title ''a good cadre boundlessly loyal to Chairman Mao''s revolutionary line'' and a brief account of his heroic deeds; issued Apr. 23, 1968 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 244 n.1). Names: Mao Zedong.'
