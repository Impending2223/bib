      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 5, 16–17 (July 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day. To check: Military Commission Office Group (Junwei banshi zu 军委办事组), request for instructions of July 8, 1968 to Premier Zhou Enlai and others on changing the name of the military experts abroad (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 16 n.15). Names: Mao Zedong, Zhou Enlai.'
      tags:
