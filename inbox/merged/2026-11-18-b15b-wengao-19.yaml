      c: 'Mao 毛泽东, on the *Cankao xiaoxi* 参考消息 of Mar. 23, 1968 reprinting from the Hong Kong *Ta Kung Pao* of Mar. 18 the article ''The days of the panic of 1929'', to Lin Biao 林彪, Zhou Enlai 周恩来 and the Group''s members to read; and at the article''s conclusion, that the imperialists will not necessarily seek a way out in a great war: ''The conclusion is not necessarily right; there will still be fighting.'''
