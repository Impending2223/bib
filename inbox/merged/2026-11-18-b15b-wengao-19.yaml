- add:
    entry:
      id: cal.1968-07.china-leadership-5
      when: July
      date: '1968-07'
      thread: china-leadership
      at: after 1968-07-02
      also:
      - china
      c: 'Mao, on the Central Liaison Department''s request for instructions of July 2 on the wish of the Mao Zedong Thought study group of Malayan revolutionaries (Malaiya geming zhe Mao Zedong sixiang xuexi xiaozu 马来亚革命者毛泽东思想学习小组) to publish in China their article ''To hold to Mao Zedong Thought is to take the road to victory of the Malayan people''s revolution'': strikes a few characters, the words ''Mao Zedong Thought'' 毛泽东思想 from both places where the report hopes the Malayan Communist Party will settle its inner disagreements ''on the principles of Marxism-Leninism-Mao Zedong Thought''. The Department is to tell the Malayan comrades that the Chinese Party does not meddle in the internal affairs of fraternal parties and cannot print their article.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 5, 273 (July 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day, which the book gives as July–Aug. 1968 in the group of notes on foreign propaganda and as July 1968 on its own page. To check: Central Liaison Department, request for instructions of July 2, 1968 to the Central Committee and the Cultural Revolution Group on the wish of the Mao Zedong Thought study group of Malayan revolutionaries to publish in China the article ''To hold to Mao Zedong Thought is to take the road to victory of the Malayan people''s revolution'': the Department to tell the Malayan Communist Party comrades that the Chinese Party does not interfere in fraternal parties'' internal affairs, so their article cannot be printed (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 273 n.1). Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 426d39d2
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 5, 273: all'
        - 'via w.jianguo-yilai-mao-zedong XIX, 273 n.1: all'
