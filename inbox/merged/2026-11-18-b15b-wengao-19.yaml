- add:
    entry:
      id: cal.1968-12-22.china-leadership
      when: Dec. 22
      date: '1968-12-22'
      thread: china-leadership
      c: 'The *Renmin ribao* 人民日报, in the editors'' note to its reprint of the *Gansu ribao* 甘肃日报 item on the townspeople of Huining 会宁 county, sets in bold type a passage of Mao''s 毛泽东, undated in the book: for educated youth to go to the countryside and be re-educated by the poor and lower-middle peasants is quite necessary; the cadres in the cities and others are to be persuaded to send their children, graduates of junior middle, senior middle and university, to the villages, to ''carry out a mobilization''; the comrades in the villages everywhere are to welcome them.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 388 (Dec. 22, 1968). The book''s note: the movement of educated youth to the mountains and the villages followed across the country. Check: when Mao said it; the book dates it ''1968'' and prints it from the *Renmin ribao* of Dec. 22. Names: Mao Zedong.'
