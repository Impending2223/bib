      c: 'Mao 毛泽东 to Lin Biao 林彪, on the letter of Feb. 22 from Chen Min 陈民, wife of Ouyang Yi 欧阳毅, former deputy political commissar of the artillery: look at this, and whether to give it to Chengwu and his people to look into and handle. Ouyang has been held over five months and is struggled against ever harder, with forced confessions and blows; she begs that his life be saved.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 224 (Mar. 2, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Chen Min 陈民, letter of Feb. 22, 1968 to Mao Zedong on the struggle against her husband Ouyang Yi 欧阳毅, former deputy political commissar of the PLA artillery, held over five months, with forced confessions, false charges, blows and corporal punishment (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 224 n.1); Lin Biao, instruction of Mar. 2, 1968 to Yang Chengwu: ''Please follow the chairman''s instruction, look into it and handle it earnestly; report the result'' (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 224 n.2). Names: Mao Zedong, Lin Biao, Yang Chengwu.'
