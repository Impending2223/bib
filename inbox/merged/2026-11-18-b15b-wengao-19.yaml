- add:
    entry:
      id: cal.1968-10-10.china-leadership-2
      when: Oct. 10
      date: '1968-10-10'
      thread: china-leadership
      c: 'Lin Biao 林彪, on the draft list of those to attend the enlarged Twelfth Plenum: Xiao Li 肖力 and Mao Yuanxin 毛远新 have done well these two years, and he had meant to agree to their attending; in view of Mao''s 毛泽东 note and his view at the meeting of the evening before, Mao''s instruction is to be followed; Xiao Li, head of the Cultural Revolution Group''s office, who has done much for the *Jiefangjun bao* 解放军报, might attend as staff.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 346 (Oct. 10, 1968; n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) gives it. Check: Mao''s note and his view of the evening of Oct. 9, which the book does not print. Xiao Li is Li Na 李讷, Mao''s daughter (n.1). See [[cal.1968-10-09.china-leadership]]. Names: Lin Biao, Mao Zedong.'
      tags:
      - polity:prc
      - name:lin-biao
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 80c107d2
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 346: all'
