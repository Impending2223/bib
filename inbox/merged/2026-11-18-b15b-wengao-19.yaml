      when: Oct. 14
      date: '1968-10-14'
      thread: china-leadership
      c: '*Hongqi* 红旗 no. 4 sets in bold type, in its editorial ''Absorb the fresh blood of the proletariat'', two passages of Mao''s 毛泽东, undated in the book: unite all the broad masses who can be united and establish the proletariat''s all-round rule over the few bourgeois; and: who gave us our power? The working class, the poor and lower-middle peasants, the broad laboring masses, over 90 percent of the population; we represent the proletariat and the people, and the people support us because we have overthrown the people''s enemy; the basic point of the Communist Party is to rely directly on the broad revolutionary masses.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 349–350 (Oct. 14, 1968). The *Renmin ribao* printed the editorial Oct. 16 and the second passage again Oct. 17. Check: when Mao said them; the book dates them ''1968''. Names: Mao Zedong.'
