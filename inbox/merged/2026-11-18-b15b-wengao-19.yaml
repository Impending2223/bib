      c: 'Mao 毛泽东, on the draft editorial of the *Renmin ribao* 人民日报, *Hongqi* 红旗 and *Jiefangjun bao* 解放军报, ''Carry the great revolution on the news front through to the end'', sent by Yao Wenyuan 姚文元 Aug. 18: usable, but the two sections from p. 13 read heavy, with too many empty words and too little that is new; they should be cut and revised and should touch the present political struggle. He strikes from section 4 the passage that Mao Zedong Thought 毛泽东思想 is the third milestone of Marxism-Leninism and a universal truth for the four seas.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 297–298 (Aug. 1968). The article was printed in *Hongqi* no. 2 of Aug. 25 and the papers of Sept. 1 (XIX, 297 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day of Mao''s note, after Aug. 18. To check: Yao Wenyuan, draft of the Renmin ribao, Hongqi and Jiefangjun bao editorial ''Carry the great revolution on the news front through to the end'' (Ba xinwen zhanxian de da geming jinxing dao di 把新闻战线的大革命进行到底), five sections, sent to Mao Aug. 18, 1968; printed in Hongqi no. 2 of Aug. 25 and the papers of Sept. 1 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 297 n.1). Names: Mao Zedong, Yao Wenyuan.'
