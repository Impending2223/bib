- add:
    entry:
      id: cal.1967-06.china-leadership-4
      when: June
      date: '1967-06'
      thread: china-leadership
      at: before 1967-06-26
      c: 'Mao 毛泽东 gives Unit 8341, before its men go down to the factories, three points: in the work do deep, careful and hard political and ideological work, and as the factories hold many women workers send women comrades; do not hurry to take a stand, investigate first, and unite step by step two factions that are both revolutionary, since the masses want union and only a few heads do not; learn from the workers, do not fear mistakes, mend them, care for the workers'' living and set up a medical team.'
