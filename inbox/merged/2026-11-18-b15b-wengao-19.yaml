- add:
    entry:
      id: cal.1969-03.china-leadership-2
      when: Mar.
      date: '1969-03'
      thread: china-leadership
      at: before 1969-03-14
      c: 'Mao 毛泽东, on the draft *Hongqi* 红旗 editorial ''Summing up experience'' (Zongjie jingyan 总结经验), retitled ''On summing up experience'' (Guanyu zongjie jingyan 关于总结经验): ''To be published after discussion at the liaison meeting.'' He strikes two ''very'' (''very good'', ''very high''), the ten characters ''with great proletarian genius'' before ''summed up and scientifically generalized the basic experience of the masses'', and the words ''extremely'' and ''high'' of the sentence that this instruction of Chairman Mao is to be taken seriously by leaders at every level.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 402–403 (Mar. 1969). Made public: *Hongqi*, no. 3–4 (a combined number), Mar. 14, 1969, and the *Renmin ribao* Mar. 15 (the editorial as printed, with his quotation in bold type). Check: the day of Mao''s note, before Mar. 14. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: fe46ec73
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 402–403: all'
- add:
    entry:
      id: cal.1969-03-14.china-leadership-3
      when: Mar. 14
      date: '1969-03-14'
      thread: china-leadership
      c: '*Hongqi* 红旗 no. 3–4 sets in bold type, in its editorial ''On summing up experience'', two passages of Mao''s 毛泽东, undated in the book: to sum up experience earnestly; on going to a unit to learn its state, learn the whole course of its movement (how it began, how it went on, how it stands now; how the masses and the leaders acted; what contradictions and struggles arose and how they changed; what people came to understand), and find the regularities in it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 403 (Mar. 14, 1969). The *Renmin ribao* reprinted the editorial Mar. 15 (n.1). Check: when Mao said it; the book dates it ''1969''. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      src:
        c: fade4bf1
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 403: all'
