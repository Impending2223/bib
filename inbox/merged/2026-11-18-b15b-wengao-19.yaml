- add:
    entry:
      id: cal.1968-08-31.china-leadership
      when: Aug. 31
      date: '1968-08-31'
      thread: china-leadership
      c: 'Mao 毛泽东 writes for *Hongqi* 红旗 an editors'' note to the investigation report ''Shanghai''s worker-technicians grow in the struggle'', which the Shanghai 上海 Revolutionary Committee sent the Center and the Group Aug. 29 through Zhang Chunqiao 张春桥: the revolutionary committees of the large, middle and small industrial cities are asked to investigate their engineers and technicians and send the results to the Center; the road of picking engineers and technicians and ideological workers (professors, teachers, scientists, journalists, writers, artists, Marxist theorists) from workers, peasants, soldiers and their children is settled; those graduates and students who do not yet join the workers and peasants are to be changed step by step; even the stubborn capitalist-roaders, a tiny handful, need a way out. He sends the material and the note to Lin Biao 林彪, Zhou Enlai 周恩来 and the Group''s members, to go back to Yao Wenyuan 姚文元; and on Aug. 31 asks Zhou to raise it at the liaison meeting for revision and proposes it for *Hongqi* no. 3. He strikes ''unprecedented'' and ''in human history'' in the report. The report and the note were not printed in *Hongqi*.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 304–306 (Aug. 31, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Shanghai Revolutionary Committee, investigation report ''Shanghai''s worker-technicians grow in the struggle'' (Shanghai gongren jishu renyuan zai douzheng zhong chengzhang 上海工人技术人员在斗争中成长), Aug. 29, 1968, sent to the Center and the Cultural Revolution Group by Zhang Chunqiao: the workers'' share of technicians in the many small plants 80 percent (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 305 n.1). Names: Mao Zedong, Zhang Chunqiao, Lin Biao, Zhou Enlai, Yao Wenyuan.'
