    entry:
      id: cal.1968-07.china-leadership-7
      when: July
      date: '1968-07'
      thread: china-leadership
      at: after 1968-07-19
      c: 'Mao 毛泽东, on the investigation report ''The road of training engineers and technicians seen from the Shanghai Machine Tool Plant'' and the *Renmin ribao* 人民日报 editors'' note sent by Chen Boda 陈伯达 and Yao Wenyuan 姚文元 July 20: ''Issue as it is.'' He changes in the editors'' note his own words of July 12 to ''Universities are to be kept; what I mainly mean is that the universities of science and engineering are to be kept'', and the ''nearsighted persons who are not capitalist-roaders'' to ''those nearsighted persons who are not yet stubborn capitalist-roaders''. In the report, beside the graduate who came into the plant carrying a foreign book on thread grinders, he notes: ''It is not said that foreign books are not to be read.'' He adds that young students joining workers and peasants in productive labor is an important way to remold the world outlook and to learn practical technical knowledge.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 266–267 (July 1968). Made public: *Renmin ribao*, July 22, 1968, as to the report and the editors'' note as printed. Check: the day of Mao''s notes, July 20–22. To check: Chen Boda and Yao Wenyuan, report of July 20, 1968 sending Mao the investigation report ''The road of training engineers and technicians seen from the Shanghai Machine Tool Plant'', written by Xinhua and Wenhui bao reporters on his hint, with a draft editors'' note quoting his latest instruction (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 267 n.1). Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
