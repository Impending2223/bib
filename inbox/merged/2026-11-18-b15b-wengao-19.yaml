- cite:
    id: cal.1968-10-13.china-leadership-2
    item: '[[w.jianguo-yilai-mao-zedong]], XIX, 351–355 (Oct. 12, 1968; Mao''s note of Oct. 12 (''can be printed for the comrades of the Twelfth Plenum as a basis for discussion; a few changes''), and his changes: he strikes the three adverbs ''genially, creatively, comprehensively'' before ''inherited, defended and developed Marxism-Leninism'', puts ''Marxism, Leninism'' before ''Mao Zedong Thought'' in two places, and in chapter IV writes ''under the Chairman, Vice-Chairmen and Standing Committee, a number of necessary lean organs are set up to handle the daily work of the Party, government and army'', for ''organs such as the Central Cultural Revolution Group born in the Great Proletarian Cultural Revolution''; the draft is Kang Sheng''s, Zhang Chunqiao''s and Yao Wenyuan''s of Oct. 12)'
    units: A-C
