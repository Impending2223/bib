      thread: china-leadership
      at: before 1968-09-18
      also:
      - china
      c: 'Mao 毛泽东 revises the draft *Renmin ribao* 人民日报 editorial ''The course of victory of the revolutionary peoples of all countries'' (Ge guo geming renmin shengli de hangxiang 各国革命人民胜利的航向), for the sixth anniversary of his inscription of Sept. 1962 for Japanese workers; on it he writes: strike the empty talk that leaves the theme, do not boast to foreigners. The editorial attacks the Miyamoto Kenji 宫本显治 clique of the Japanese Communist Party as revisionist renegades.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 5–8, 17 (Sept. 1968). The editorial was printed Sept. 18 (XIX, 17 n.16). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day of Mao''s revision, before Sept. 18; the book prints the draft with his deletions and additions marked. Names: Mao Zedong, Miyamoto Kenji.'
