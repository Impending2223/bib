- add:
    entry:
      id: cal.1968.china-leadership-7
      when: 1968–69
      date: '1968'
      thread: china-leadership
      c: 'Mao 毛泽东 gives, over 1968 and 1969, four instructions on the Xuzhou 徐州 area of northern Jiangsu 江苏, where the revolutionary great alliance would not come about: the two Xuzhou factions are both revolutionary mass organizations and are to form a great alliance; Xuzhou has turned over several times and cannot turn over again; one faction does not work, two do; one faction holding power will not do, the union of two will; explain the policy, and most people can accept it.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 389–390 (1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Printed for internal circulation: the request of July 26, 1969 of the Party committee of the 68th Army on reorganizing the Xuzhou Revolutionary Committee, which quotes them in bold type, as the Center approved and sent it July 29, 1969 (XIX, 390 n.1). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the days of the four instructions, which the book gives only as 1968–1969. To check: Party committee of the 68th Army of the PLA, request for instructions of July 26, 1969 on reorganizing the Xuzhou Revolutionary Committee (Guanyu gaizu Xuzhoushi geming weiyuanhui de qingshi baogao 关于改组徐州市革命委员会的请示报告), later an annex to its report on carrying out the spirit of the Ninth Congress; the Center approved the report and annex July 29, 1969, and Mao wrote ''Do as proposed'' on the Center''s comment (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 390 n.1). Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
