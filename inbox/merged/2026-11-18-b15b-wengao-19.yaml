      id: cal.1968-11.china-leadership
      when: Nov.
      date: '1968-11'
      thread: china-leadership
      at: after 1968-11-19
      c: 'Mao 毛泽东, on the Military Commission Office Group''s report of Nov. 19 sending the Peking Military Region Party committee''s report of Oct. 29 on carrying out his instruction to be frugal in making revolution (a saving of over 73 million yuan in funds frozen, cut or reduced that year; over 90,000 tons of coal saved last winter and this spring; a number of small and medium factories built), in which the Office Group proposes to forward it to the whole army: ''May be forwarded.'''
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 372–373 (Nov. 1968). The report was printed Dec. 14 in the *Renmin ribao* and *Jiefangjun bao*, with their joint editorial ''Hold to the great policy of frugality in making revolution'' (XIX, 373 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day of Mao''s note, between Nov. 19 and Dec. 14. To check: Peking Military Region Party Committee, report of Oct. 29, 1968 on carrying out the instruction ''be frugal in making revolution'' (Guanyu guanche zhixing ''yao jieyue nao geming'' zhishi qingkuang baogao 关于贯彻执行“要节约闹革命”指示情况报告), sent to Mao by the Military Commission Office Group Nov. 19, 1968 with the proposal to forward it to the whole army; printed in the Renmin ribao and Jiefangjun bao Dec. 14 with a joint editorial (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 372 n.1). Names: Mao Zedong.'
