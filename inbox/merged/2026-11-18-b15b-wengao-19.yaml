- add:
    entry:
      id: cal.1967-04-28.china-leadership-4
      when: Apr. 28
      date: '1967-04-28'
      thread: china-leadership
      c: 'The *Renmin ribao* 人民日报 prints alone on its front page a sentence of Mao''s 毛泽东, undated in the book: trust and rely on the masses, on the People''s Liberation Army and on the great majority of the cadres. The paper reprints the same day, ahead of *Hongqi* 红旗, that journal''s editorial ''Warmly respond to the call to support the army and love the people'', which sets the sentence in bold type.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 52 (Apr. 28, 1967). *Hongqi* no. 6 appeared May 8 (n.1). Check: when Mao wrote the sentence; the book dates it ''1967'' and prints it from *Hongqi* no. 6. Names: Mao Zedong.'
