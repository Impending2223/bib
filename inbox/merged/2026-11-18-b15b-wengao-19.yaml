      date: '1967-11'
      thread: china-leadership
      at: after 1967-11-21
      c: 'Mao 毛泽东 revises the draft Center circular on the opinions sought on convening the Ninth Congress (Guanyu zhengxun zhaokai Jiu Da de yijian de tongbao 关于对征询召开“九大”的意见的通报): he strikes ''raise to the full the absolute authority of the great leader Chairman Mao and of Mao Zedong Thought, and of his proletarian revolutionary line'' and writes ''These two [lines] are not wanted''; he strikes ''and good student'' after ''Chairman Mao''s close comrade-in-arms'', and makes small changes in the passage on Party rectification. He writes: ''I struck a few lines; Lin Biao to read, then back to Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing.'''
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 196–198 (Nov. 1967). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the day of Mao''s revision, after Nov. 21, the date of the draft sent for review. To check: Draft Central Committee circular on the opinions sought on convening the Ninth Congress, drafted by Kang Sheng and Yao Wenyuan from the opinions received, passed at the Group''s enlarged liaison meeting the evening of Nov. 20 and sent to Mao by Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing Nov. 21, 1967; issued Nov. 27 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 197 n.1). Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
