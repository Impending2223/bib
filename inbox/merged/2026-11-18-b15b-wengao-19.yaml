      c: 'Mao 毛泽东, on the draft editorial of the *Renmin ribao* 人民日报 and *Jiefangjun bao* 解放军报, ''Warmly hail the founding of the Yunnan Revolutionary Committee'', sent by Chen Boda 陈伯达 and Yao Wenyuan 姚文元 Aug. 14: he revises the passage of his own that Yao marks as appearing in the press for the first time (''our country has 700 million people, the working class is the leading class; give full play to its leading role in the Cultural Revolution and in all work; the working class too must raise its political consciousness in the struggle'') and writes: ''Issue as it is.'''
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 282 (Aug. 14, 1968). Made public: *Renmin ribao*, Aug. 15, 1968 (the editorial prints his passage in bold type, undated in the book, for the first time). To check: Chen Boda and Yao Wenyuan, draft of the Renmin ribao and Jiefangjun bao editorial ''Warmly hail the founding of the Yunnan Revolutionary Committee'' (Relie huanhu Yunnan sheng geming weiyuanhui chengli 热烈欢呼云南省革命委员会成立), sent to Mao Aug. 14, 1968, marking a passage of his as appearing in the press for the first time; printed Aug. 15 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 282 n.1). Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
