      c: 'Mao revises the draft Center, State Council, Military Commission and Cultural Revolution Group notice on holding the 1968 spring export commodities fair (guanyu kaihao 1968 nian chunji chukou shangpin jiaoyihui de tongzhi 关于开好一九六八年春季出口商品交易会的通知). After the sentence making the propaganda of Mao Zedong Thought 毛泽东思想 the first task, he adds: but take care not to impose it on others.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 3, 14 (Mar. 10, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Draft notice of the Central Committee, State Council, Military Commission and Cultural Revolution Group on holding the 1968 spring export commodities fair, sent for review Mar. 8, 1968 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 14 n.8). Names: Mao Zedong.'
      tags:
