      when: Mar. 31
      date: '1969-03-31'
      thread: china-leadership
      c: 'Mao 毛泽东, at 2 p.m., to Lin Biao 林彪: he has read the third revised draft of the political report, sent by Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元 at 5:30 a.m., once more and made changes; chiefly, section 4 and section 3 are to be exchanged and the last small section made section 5, on the proposal of Guo Moruo 郭沫若, which he thinks better; Lin is to decide and tell Zhang and Yao. He also strikes the sentence that the Ninth Congress opens ''under the presidency of our great leader Chairman Mao''. The sections on relations with foreign countries and on Party rectification and building become parts 7 and 6 in the printed report.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 405, 410 (Mar. 31, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Names: Mao Zedong, Lin Biao, Zhang Chunqiao, Yao Wenyuan, Guo Moruo.'
