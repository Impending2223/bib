- add:
    entry:
      id: cal.1968-09-10.china-leadership-2
      when: Sept. 10
      date: '1968-09-10'
      thread: china-leadership
      c: 'Mao 毛泽东, on the commentator''s article of the *Renmin ribao* 人民日报 and *Hongqi* 红旗, ''An extremely important question'', retitled ''On the re-education of the intellectuals'' (Guanyu zhishifenzi zai jiaoyu wenti 关于知识分子再教育问题), sent by Yao Wenyuan 姚文元 Sept. 10 with the contents of *Hongqi* no. 3: ''Issue as it is.'' He adds that to build such a ranks of proletarian intellectuals one must carry through the proletarian revolution in education, take the road of training technicians and other intellectuals from workers, peasants and soldiers, choose students from those of practical experience in production, and re-educate the large number of intellectuals from the old schools, winning and uniting the broad mass of the intellectuals.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 317–318 (Sept. 10, 1968). Made public: *Hongqi*, no. 3, Sept. 10, 1968 (the article), reprinted in the *Renmin ribao* Sept. 12. To check: Yao Wenyuan, report of Sept. 10, 1968 sending Mao the contents of Hongqi no. 3 for approval, with the commentator''s article ''An extremely important question'' and the article on the ''barefoot doctors'', one passage of Mao''s to be set in bold type (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 318 n.1). Names: Mao Zedong, Yao Wenyuan.'
      tags:
