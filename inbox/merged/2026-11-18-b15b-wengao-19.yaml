      c: 'The *Renmin ribao* 人民日报 and *Jiefangjun bao* 解放军报 editorial ''Furong guo li jin zhaohui'' 芙蓉国里尽朝晖, on the founding of the Hunan 湖南 Revolutionary Committee, and the Renmin ribao''s column of Mao''s 毛泽东 latest instructions print in bold type a passage of Mao''s, undated in the book: the Great Proletarian Cultural Revolution is in essence a great political revolution under socialism, of the proletariat against the bourgeoisie and all exploiting classes, the continuation of the long struggle of the Party and the revolutionary people against the Kuomintang reactionaries, and of the class struggle between proletariat and bourgeoisie.'
