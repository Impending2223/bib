- add:
    entry:
      id: cal.1968-08-25.china-leadership-3
      when: Aug. 25
      date: '1968-08-25'
      thread: china-leadership
      c: 'Mao 毛泽东, on the Xinhua 新华社 material of Aug. 24, ''Why two leading groups formed in the Peking Erqi locomotive works'', to Kang Sheng 康生 and Yao Wenyuan 姚文元: study the Erqi works'' material and, with that of other Peking factories, see whether a document on Party rectification can be written to urge the localities to carry it out. In the margins: failing to draw rebel activists into the Party, with the old branch members too many, seems the chief cause of failure; if the party members on the workshop revolutionary committees are too few to be the core, and the branch is also to lead, is it not a contradiction?'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 299–300 (Aug. 25, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Xinhua News Agency, internal reference special issue Cultural Revolution Trends (Wenhua geming dongtai 文化革命动向) no. 1383, Aug. 24, 1968: ''Why two leading groups formed in the Peking Erqi locomotive and rolling stock works'' (Beijing Erqi jiche chang xingcheng liang tao lingdao banzi de yuanyin 北京二七机车厂形成两套领导班子的原因): two factory revolutionary committees, the old one of Oct. 1967 and the new one of June 20, 1968, with workshop Party branches (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 300 n.1). Names: Mao Zedong, Kang Sheng, Yao Wenyuan.'
      tags:
