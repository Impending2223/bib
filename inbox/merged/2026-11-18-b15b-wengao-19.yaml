      date: '1968-08-20'
      thread: china-leadership
      c: 'Mao 毛泽东, on the draft editorial of the *Renmin ribao* 人民日报 and *Jiefangjun bao* 解放军报, ''Unite against the enemy'' (Tuanjie dui di 团结对敌), welcoming the founding of the Fujian 福建 Revolutionary Committee, sent by Chen Boda 陈伯达 and Yao Wenyuan 姚文元 Aug. 20: ''Issue as it is.'' He retitles it ''Unite and meet the enemy together'' and adds a passage: that workers'' Mao Zedong Thought 毛泽东思想 propaganda teams, with PLA men, enter by plan the schools and other units that have not done the struggle, criticism and reform well, under the revolutionary committees, is a revolutionary innovation from his great strategic plan.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 287–288 (Aug. 20, 1968). The editorial was printed Aug. 21 (XIX, 287 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Chen Boda and Yao Wenyuan, draft of the Renmin ribao and Jiefangjun bao editorial ''Unite against the enemy'' (Tuanjie dui di 团结对敌), on the founding of the Fujian Revolutionary Committee, sent to Mao Aug. 20, 1968; printed Aug. 21 as ''Unite and meet the enemy together'' (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 287 n.1). Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
