- add:
    entry:
      id: cal.1969-02-21.china-leadership
      when: Feb. 21
      date: '1969-02-21'
      thread: china-leadership
      c: 'The *Renmin ribao* 人民日报 editorial ''Grasp revolution, promote production, win new victories on the industrial front'', after ''Chairman Mao has lately pointed out'', sets in bold type two sayings of Mao''s 毛泽东, undated in the book: in the stage of struggle, criticism and reform of the Cultural Revolution, pay earnest attention to policy; and in drawing up plans, rouse the masses and be sure to leave ample room.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 399–400 (Feb. 21, 1969). Check: when Mao said them; the book dates them ''1969'' and prints them from the *Renmin ribao* of Feb. 21. Names: Mao Zedong.'
