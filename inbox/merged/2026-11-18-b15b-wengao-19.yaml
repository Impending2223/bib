- add:
    entry:
      id: cal.1968-03-30.china-leadership-3
      when: Mar. 30
      date: '1968-03-30'
      thread: china-leadership
      c: 'The *Renmin ribao* 人民日报, *Hongqi* 红旗 and *Jiefangjun bao* 解放军报 editorial ''Revolutionary committees are good'' sets in bold type two passages of Mao''s 毛泽东, undated in the book: the basic point in reforming the state organs is to link with the masses; the basic experience of the revolutionary committees is three: they have representatives of the revolutionary cadres, of the army and of the revolutionary masses, the revolutionary three-in-one; they are to have unified leadership, break up the overlapping administrative organs, cut staff and simplify administration, and form a revolutionized leading group in touch with the masses.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 232–233 (Mar. 30, 1968). Check: when Mao said it; the book dates it ''1968''. The first passage is printed again in the *Renmin ribao*''s column of Mao''s latest instructions Apr. 1, the second Mar. 30 and 31. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      src:
        c: 40fd4468
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 232–233: all'
