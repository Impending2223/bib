      when: Aug. 5
      date: '1968-08-05'
      thread: china-leadership
      c: 'Mao 毛泽东, at 9 p.m., on the Peking Revolutionary Committee''s and Peking Garrison''s arrangement of Aug. 4, as Zhou Enlai 周恩来 revised it, for further propaganda of his latest instruction and the two notices: (1) wholly agreed; (2) Zheng Weishan 郑维山 should take part in the leading group; (3) the leading group is to meet often, sum up experience and correct errors. The arrangement draws on the experience of Guangxi 广西, Shandong 山东, Anhui 安徽 and Hunan 湖南; in it his latest instruction is his talk of July 28 with the five university leaders.'
