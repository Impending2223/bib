- add:
    entry:
      id: cal.1967-12-01.china-leadership-3
      when: Dec. 1
      date: '1967-12-01'
      thread: china-leadership
      c: 'Yao Wenyuan 姚文元 to Anzai Kuji 安斋库治 and others of the Japanese left review *Kakumei senshi* 革命战士: Mao 毛泽东 greets them; he has read their view on whether Japan is to take the road of surrounding the cities from the villages, and his note says Anzai''s view is right and his account of 1938 of the tasks of the proletarian parties of the capitalist countries still stands. Yao reads the note out and explains it from the passages of "Problems of war and strategy" (Zhanzheng he zhanlüe wenti 战争和战略问题) on taking the cities first.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 2 (Dec. 1, 1967). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. See [[cal.1967-11-27.china-leadership]]. Check: the place and who else was present; the book gives Yao''s talk without either. Names: Yao Wenyuan, Mao Zedong, Anzai Kuji.'
      tags:
      - polity:prc
      - name:yao-wenyuan
      - name:mao-zedong
      - polity:japan
      - vis:only:prc+japan
      src:
        c: aba54c58
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 2: all'
