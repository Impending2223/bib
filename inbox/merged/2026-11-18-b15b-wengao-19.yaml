      c: 'Mao 毛泽东, on Zhou Enlai''s 周恩来 report of 6 a.m. Apr. 18 summing up the nominations of the delegations to the Ninth Congress for its Central Committee (45 delegations, some 421 names so far, perhaps 450 in the end; of the first category, the Eighth Central Committee members and the Group''s members, 60 first proposed): ''To talk first at 4 p.m.'''
