      when: Sept. 3
      date: '1968-09-03'
      thread: china-leadership
      c: 'Mao 毛泽东 writes for *Hongqi* 红旗 the editors'' note to the Shanghai 上海 Revolutionary Committee''s investigation report ''The education revolution of the science and engineering universities seen from the struggle of the two lines at the Shanghai Machinery Institute'': to the revolutionary committees of the industrial cities, to organize typical investigations of their engineers and technicians and of the education revolution in their science and engineering schools; the graduates of the old colleges and middle schools already at work to be re-educated and joined to the workers and peasants; the stubborn capitalist-roaders and bourgeois technical authorities hated by the people are very few, and even they must be given a way out. He sends it to Yao Wenyuan 姚文元: it is still useful and may be printed; whether the note is right, to be raised at the liaison meeting.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 309–311 (Sept. 3, 1968). Made public: *Hongqi*, no. 3, Sept. 10, 1968 (the report and the editors'' note), reprinted in the *Renmin ribao* Sept. 5. To check: Shanghai Revolutionary Committee, investigation report ''The education revolution of the science and engineering universities seen from the struggle of the two lines at the Shanghai Machinery Institute'' (Cong Shanghai jixie xueyuan liang tiao luxian de douzheng kan li gong ke daxue de jiaoyu geming 从上海机械学院两条路线的斗争看理工科大学的教育革命), Sept. 1968: the first class of over 2,000 students of the Shanghai Machine-Building School chosen from workers and peasants; four views and plans for the science and engineering universities; printed in Hongqi no. 3 of Sept. 10 with Mao''s note, and in the Renmin ribao Sept. 5 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 310 n.1). Names: Mao Zedong, Yao Wenyuan.'
