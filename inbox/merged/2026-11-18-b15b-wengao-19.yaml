      c: 'Mao 毛泽东 to Zhou Shizhao 周世钊 (Zhou Dunyuan 惇元), an old classmate of the First Normal School of Hunan 湖南 and a member of the New People''s Study Society, in reply to his letter of Sept. 20: glad to have it today; his two earlier letters were not seen; his own poems and lyrics mean little and are not to be heeded; he does not agree to a commemoration of himself, and asks that the attached primary school be told; the couplet is worse still, not to be used.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 339–340 (Sept. 29, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Zhou Shizhao, letter to Mao Zedong of Sept. 20, 1968, saying he wrote twice last winter and spring, noting the many annotated editions of Mao''s poems and asking for the reliable annotation Mao spoke of on Jan. 11, 1965, and reporting that the attached primary school of the First Normal School is back in the academy and wants Mao''s couplet written out again (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 339 n.2). Names: Mao Zedong, Zhou Shizhao.'
