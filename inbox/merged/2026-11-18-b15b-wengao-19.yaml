    item: '[[w.jianguo-yilai-mao-zedong]], XIX, 433–439 (Apr. 28, 1969; Mao''s speech at the First Plenum of the Ninth Central Committee, printed from the Center''s document of May 9, 1969; he speaks of the Soviet revisionists'' attacks (''military-bureaucratic dictatorship''), that the socialist revolution goes on and that struggle, criticism and reform remain; that in a fairly large majority of factories the leadership is not in the hands of true Marxists or the workers; that cases like the Erqi works'' Kuomintang members are to be handled with distinctions; that war must be prepared in spirit, not to strike out but to let a big attack in; that Yang Dezhi and Wang Xiaoyu, and Xu Shiyou, Xie Fuzhi and others are not at enmity but in contradiction among the people; the notes at pp. 439–442 are not read)'
