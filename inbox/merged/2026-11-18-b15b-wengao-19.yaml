      c: 'The Center, the Military Commission and the Cultural Revolution Group send the whole army the Military Commission Office Group''s letters and visits digest of Aug. 28 on the heart-to-heart meetings (tanxinhui 谈心会) on supporting the army: the units doing the ''three supports and two militaries'' (sanzhi liangjun 三支两军) are to hold such meetings, as Mao 毛泽东 directs, treat masses of other views sincerely and criticize themselves more.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 312 (Oct. 4, 1968; n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) gives it. See [[cal.1968-09-04.china-leadership-2]]. Names: Mao Zedong.'
      tags:
