- add:
    entry:
      id: cal.1969-03.china-leadership-3
      when: Mar.–Apr.
      date: '1969-03'
      thread: china-leadership
      c: 'Mao''s 毛泽东 changes to the successive drafts of the political report of the Ninth Congress, undated within March and April 1969: after the death of Marx and Engels, the parties of the Second International, except Lenin''s Bolsheviks, almost all betrayed Marxism; the Red Guards'' first big-character poster at Peking University of May 25, 1966 (Nie Yuanzi and others) answered the Center''s call; the people support the army and the army protects the people; the good men who erred as capitalist-roaders are freed once they have raised their consciousness; his words of Oct. 5, 1968 to the Albanian delegation, that the final victory of a socialist country needs also the victory of the world revolution, so that to speak lightly of the final victory is wrong; a sentence added at the head of the section on relations with foreign countries; and, if the imperialists, revisionists and reactionaries impose a third world war, the peoples will rise and send them all to their graves.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 406–408, 411–412 (Mar. 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. Check: the dates of each change, which the book groups (XIX, 406–408, 411–412 nn.10–14). Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: c518c426
        rows:
        - 'w.jianguo-yilai-mao-zedong XIX, 406–408, 411–412: all'
- cite:
    id: cal.1969-04-01.china-leadership
    item: '[[w.jianguo-yilai-mao-zedong]], XIX, 416–423 (Apr. 1, 1969; Mao''s speech at the opening of the Ninth Congress, printed from the Center''s document, which the Center sent out May 9, 1969 with his speech of Apr. 28 at the First Plenum, for reading to the revolutionary committee members of factories, communes, schools and offices and army cadres of platoon level and above; he says of the first congress of 1921 that twelve delegates attended and that of them only he and Dong Biwu remain; he names Wang Jinmei, Deng Enming, Chen Tanqiu, He Shuheng and Li Hanjun as martyrs and Chen Gongbo, Zhou Fohai, Zhang Guotao and Liu Renjing as traitors, Li Da dead two years; and that of the Party''s early leaders Qu Qiubai, Li Lisan and Wang Ming erred, and that the political histories of Liu Shaoqi, Peng Zhen and Bo Yibo were unclear and are clear now)'
    units: D-E
