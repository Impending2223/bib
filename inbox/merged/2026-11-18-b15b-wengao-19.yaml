      when: Mar. 29
      date: '1969-03-29'
      thread: china-leadership
      c: 'Mao 毛泽东, at 4 p.m., on the second revised draft of the political report sent the evening of Mar. 28 by Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元: to Lin Biao 林彪 to review; return it to Zhang and Yao; some small changes. In it he strikes the passage that Chairman Mao''s leadership, his trust in the masses and reliance on them, and the proletarian leader''s air of ''looking down from a height, with the force of a bamboo split'', is the fundamental guarantee of the revolution. Another note on the same draft says: ''Read this; another note has been sent earlier.'''
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 405, 409–410 (Mar. 29, 1969). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. See [[cal.1969-03-29.china-leadership]]. Names: Mao Zedong, Lin Biao, Zhang Chunqiao, Yao Wenyuan.'
