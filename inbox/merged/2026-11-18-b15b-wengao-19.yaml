      c: 'Mao 毛泽东, at 9 p.m., on the draft ''Main points of propaganda for Aug., Sept. and Oct.'' of the temporary chief editors'' group of the *Jiefangjun bao* 解放军报, sent Aug. 5: to Lin Biao 林彪 to read, then to the responsible comrades of the *Renmin ribao* 人民日报, then back; the plan may be tried and its experience summed up from time to time and the plan revised; the *Renmin ribao* also is to try a plan; a respectable plan cannot succeed without asking the opinion of a number of basic readers.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 274–275 (Aug. 5, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Temporary chief editors'' group of the Jiefangjun bao, ''Main points of propaganda for Aug., Sept. and Oct.'' (Ba, jiu, shi yuefen xuanchuan yaodian 八、九、十月份宣传要点), seven points, sent to Mao Aug. 5, 1968 with a brief of Aug. 1 on a symposium of fourteen comrades of ten units (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 274 n.1). Names: Mao Zedong, Lin Biao.'
