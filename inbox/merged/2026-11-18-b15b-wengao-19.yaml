- add:
    entry:
      id: cal.1968-08-16.china-leadership-3
      when: Aug. 16
      date: '1968-08-16'
      thread: china-leadership
      c: 'Mao 毛泽东, on the draft editorial of the *Renmin ribao* 人民日报, ''Firmly take the road of union with the workers, peasants and soldiers'' (Jianding de zouShang tong gong nong bing xiangjiehe de daolu 坚定地走上同工农兵相结合的道路), for the second anniversary of his first review of the Red Guards, sent by Chen Boda 陈伯达 and Yao Wenyuan 姚文元 Aug. 16: ''Issue; a few changes.'' He adds a passage defending the editors'' note of July 22, that university students who look down on workers and peasants and think themselves great are urged to put down their airs: it is quite right; it is aimed at the small number who despise workers and peasants and put on airs, not at the majority who value them; and he changes ''stirring workers and peasants to fight students'' to ''stirring masses to fight masses''.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 285–286 (Aug. 16, 1968). The editorial was printed Aug. 18 (XIX, 286 n.1). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Chen Boda and Yao Wenyuan, draft of the Renmin ribao editorial ''Firmly take the road of union with the workers, peasants and soldiers'', for the second anniversary of Mao''s first review of the Red Guards, sent to Mao Aug. 16, 1968; printed Aug. 18 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 286 n.1). Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
