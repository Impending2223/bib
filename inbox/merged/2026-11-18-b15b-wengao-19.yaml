      c: 'Mao 毛泽东, on the investigation report ''The direction of the revolution in medical education seen from the growth of the barefoot doctors of the Jiangzhen commune'' (Cong Jiangzhen gongshe ''chijiao yisheng'' de chengzhang kan yixue jiaoyu geming de fangxiang 从江镇公社“赤脚医生”的成长看医学教育革命的方向), sent by Yao Wenyuan 姚文元 Sept. 3: ''Issue as it is.'' He adds that the doctor who went down from the city to the villages shows that most or the majority of the students of the old schools can join the workers, peasants and soldiers, some with inventions, if the line is right and the workers, peasants and soldiers re-educate them and change their old thinking; see the doctor of the Jiangzhen commune, in Chuansha county, Shanghai 上海. He adds two further passages and the six characters ''the old medical education system'', and retitles the report.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 321–323 (Sept. 1968). Made public: *Hongqi*, no. 3, Sept. 10, 1968 and the *Renmin ribao* Sept. 14 (the report with Mao''s additions, as printed). Check: the day of Mao''s note, after Sept. 3. Names: Mao Zedong, Yao Wenyuan.'
