      c: 'Lin Biao 林彪, by his office''s record of a telephone call of Nov. 25: he wants the whole of the third paragraph on p. 2 of the draft circular on the Ninth Congress struck, or rewritten more lightly, for the original rates him too high. The paragraph, as Mao 毛泽东 had already cut it, proposes that the Ninth Congress give wide publicity to Vice-Chairman Lin as Mao''s close comrade-in-arms and successor and write it into the report and resolutions.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 196–198 (Nov. 25, 1967). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Lin Biao''s office, record of Nov. 25, 1967 of his telephone instruction on the Center''s draft circular on the opinions on convening the Ninth Congress: strike the third paragraph of p. 2, or rewrite it more lightly (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 198 n.3). Names: Lin Biao, Mao Zedong.'
