- add:
    entry:
      id: cal.1968-08-13.china-leadership-3
      when: Aug. 13
      date: '1968-08-13'
      thread: china-leadership
      c: 'Mao 毛泽东, on two briefs of Aug. 10 of the chief editors'' office of the *Jiefangjun bao* 解放军报, ''Opinions of representatives of ten army units on running the paper well'' (a symposium of July 28) and ''The hopes of coast and frontier commanders and fighters'' (of Aug. 2): many of the opinions deserve notice and are to be taken up; they say no more than that the paper is not to be run behind closed doors but turned to the masses, with a main direction and fresh and lively; he asks that it go to Vice-Chairman Lin to read. Where the brief asks that the column ''Ideological front'' be quickly restored, he underlines it and writes that the four characters are to be rewritten; under the points that reporters go little to the ''three supports, two armies'' front and that it is hard to find anyone at the paper he writes of bureaucracy.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 280–281 (Aug. 13, 1968). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. To check: Jiefangjun bao chief editors'' office, brief ''Opinions of representatives of ten army units on running the Jiefangjun bao well'' (Bu dui shi ge danwei daibiao zuotan dui ban hao Jiefangjun bao de yixie yijian 部队十个单位代表座谈对办好《解放军报》的一些意见), in Junbao shenghuo (Army paper life) 军报生活 no. 292, Aug. 10, 1968, on the symposium of July 28 with delegates of ten army units (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 281 n.1a); Jiefangjun bao chief editors'' office, brief ''The hopes of coast and frontier commanders and fighters for running the paper well'', in Junbao shenghuo no. 292, Aug. 10, 1968, on the symposium of Aug. 2 with comrades of the Tibet and Fuzhou military regions and the navy (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 281 n.1b). Names: Mao Zedong, Lin Biao.'
