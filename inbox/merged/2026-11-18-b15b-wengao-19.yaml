- add:
    entry:
      id: cal.1967-04-23.china-leadership-6
      when: Apr. 23
      date: '1967-04-23'
      thread: china-leadership
      c: 'Mao 毛泽东 to Lin Biao 林彪 and Zhou Enlai 周恩来: print the Shaanxi 陕西 material for the comrades of the Military Commission''s enlarged meeting; what the army has done is quite right, and he hopes the whole army will do likewise. In the margins he writes: do not fear criticism, in it the army will come to know the world and change it; to trust the great majority of the cadres and masses is the most basic; the heart-to-heart talks are a very good method.'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 49–51 (Apr. 23, 1967). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. See [[cal.1967-04-23.china-leadership]]. To check: Quick Bulletin (Kuaibao 快报) no. 1944, Apr. 21, 1967, printed by the Cultural Revolution Group''s office: ''The responsible comrades of the Shaanxi garrison listen humbly to the masses'' opinions and improve their work'' (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 50 n.1a); Li Shiying, student of Xi''an Jiaotong University, eight opinions on the Shaanxi military district''s support of the Left, voiced at the symposium of mid-Apr. 1967 and printed in the Quick Bulletin (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 50 n.1b). Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags:
      - polity:prc
