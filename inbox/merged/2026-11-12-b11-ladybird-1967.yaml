- add:
    entry:
      id: cal.1967-01-17.congress
      when: Jan. 17
      date: '1967-01-17'
      thread: congress
      c: 'A campaign is launched to unseat McCormack as Speaker: "a challenge on the Hill, a column by Drew Pearson." Lady Bird Johnson, at the dinner for him that night, learns of it only later.'
      n: '[[w.johnson-white-house-diary]], 474 (Mrs. Johnson''s account). To check: Pearson''s column of Jan. 17, 1967. Names: McCormack, Pearson, Lady Bird Johnson.'
      tags:
      - name:mccormack-john-w
      - name:pearson-drew
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-01-23.congress
      when: Jan. 23
      date: '1967-01-23'
      thread: congress
      c: The White House briefing dinner for the second half of the Senate, by seniority; the new Senators among them, Hatfield, Hollings, Hansen, Percy, Spong and Griffin. McNamara, Rusk, Schultze and Ackley receive them. Johnson briefs the men in the East Room; in the Queen's Room Lynda Bird Johnson moderates for the wives, on youth, Bob Taft III of the Peace Corps in Tanzania and Jay Rockefeller of West Virginia. A Senator calls it "the best briefing he had ever participated in."
      n: '[[w.johnson-white-house-diary]], 477–79. Names: Lady Bird Johnson, Johnson, Hatfield, Hollings, Hansen, Percy, Spong, Griffin, McNamara, Rusk, Schultze, Ackley, Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
