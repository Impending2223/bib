    entry:
      id: cal.1967-06-25.soviet-union-4
      when: June 25
      date: '1967-06-25'
      thread: soviet-union
      c: 'Kosygin''s press conference at the United Nations, nearly an hour and a half, televised: the hard-line positions on the Middle East and Vietnam reaffirmed; on a treaty to ban the spread of nuclear weapons, by Lady Bird Johnson''s account, "not headway, but hope."'
      n: '[[w.johnson-white-house-diary]], 541–42. Names: Kosygin, Lady Bird Johnson.'
