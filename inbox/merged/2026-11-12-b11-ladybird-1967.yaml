      date: '1967-01-10'
      thread: congress
      c: Edward W. Brooke of Massachusetts is seated in the Senate, "the first Negro Senator since Reconstruction days."
      n: '[[w.johnson-white-house-diary]], 472 (Mrs. Johnson''s account). To check: the Congressional Record, Jan. 10, 1967. Names: Brooke, Lady Bird Johnson.'
      tags:
      - name:brooke-edward-w
