    entry:
      id: cal.1967-04-23.farm
      when: Apr. 23
      date: '1967-04-23'
      thread: farm
      c: 'After the play, in the White House kitchen, Orville Freeman tells Lady Bird Johnson of his trip to several farm States and meetings in which he "had a dialogue with farmers on the Administration and its policies": "a rather gloomy picture."'
      n: '[[w.johnson-white-house-diary]], 510 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Freeman.'
      tags:
      - name:johnson-lady-bird
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1967-04-25.court
      when: Apr. 25
      date: '1967-04-25'
      thread: court
      c: Reception at the White House for Justice Hugo Black, the thirtieth anniversary of his appointment, a little before 6 p.m. Johnson is abroad; at Lady Bird Johnson's request the Chief Justice stands in as host. His fellow Justices, former Justices including Arthur Goldberg, forty of his law clerks, Senators Hill and Sparkman. Humphrey gives the first toast; a clerk announces a Chair of Law in Black's honor at the University of Alabama.
      n: '[[w.johnson-white-house-diary]], 513–14. Names: Lady Bird Johnson, Black, Warren, Goldberg, Hill, Sparkman, Humphrey.'
      tags:
      - name:johnson-lady-bird
      - name:black-hugo-l
      - name:warren-earl
      - name:goldberg-arthur-j
      - name:hill-lister
      - name:sparkman-john
      - name:humphrey-hubert-h
      - state:al
- add:
    entry:
      id: cal.1967-04-25.white-house
      when: Apr. 25
      date: '1967-04-25'
      thread: white-house
      c: 'The Committee for the Preservation of the White House meets in the Yellow Oval Room at 10, two hours, Lady Bird Johnson presiding: Hartzog on visitors'' services; new dining room curtains and chair upholstery, about $37,000; the White House Historical Association to give another $50,000. Wanted: portraits of Adams and Madison. The rule that an artist be dead fifty years is eased to dead or no longer painting twenty. A collection of Presidents'' and First Ladies'' letters.'
      n: '[[w.johnson-white-house-diary]], 510–12. To check: the Committee''s minutes of Apr. 25, 1967. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-05-10.labor
      when: May 10
      date: '1967-05-10'
      thread: labor
      c: 'Carnegie Hall: a concert for retired members of the International Ladies Garment Workers'' Union, Stokowski conducting, Dubinsky and the union''s president Louis Stulberg present. Lady Bird Johnson speaks for the Great Society, "the Medicare law and the Older Americans Act." A retiree gives her roses and says they "were going to work hard for him in 1968."'
      n: '[[w.johnson-white-house-diary]], 515–16. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - city:nyc
- add:
    entry:
      id: cal.1967-05-10.war-opposition-2
      when: May 10
      date: '1967-05-10'
      thread: war-opposition
      c: 'Hotel Pierre, evening: dinner of the Citizens'' Committee for the Children of New York, with Mayor Lindsay, who leaves for another dinner; the speaker is Thurgood Marshall. The Women''s Strike for Peace chants outside. The Secret Service tells Lady Bird Johnson one woman in the audience "may arise and say ''Stop the War in Vietnam.''" It does not happen.'
      n: '[[w.johnson-white-house-diary]], 516–17. Names: Lady Bird Johnson, Lindsay, Marshall.'
      tags:
      - name:johnson-lady-bird
      - name:lindsay-john-v
      - name:marshall-thurgood
      - city:nyc
- add:
    entry:
      id: cal.1967-05-13.elections-1968-johnson
      when: May 13
      date: '1967-05-13'
      thread: elections-1968-johnson
      c: 'Queen''s Sitting Room, a little past 3, an hour and a half: Lady Bird Johnson and Abe Fortas on "how to get out and when." She has set March 1968 "in my own mind" as the time for Johnson to say he will not be a candidate. Fortas: if the war has improved, he could announce it then; if not, he "simply could not withdraw," and must try for the nomination; he must make no decision or announcement before March, which "would hamstring—almost immobilize—the war effort and Lyndon''s domestic program."'
      n: '[[w.johnson-white-house-diary]], 518–19 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Fortas, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:fortas-abe
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-06-09.conservation
      when: June 9
      date: '1967-06-09'
      thread: conservation
      c: 'Quincy, Mass., on a four-day New England trip: Lady Bird Johnson, with Udall and George Hartzog, tours the Adams family''s "Old House" with Charles Francis Adams; met at South Weymouth by Governor Volpe. Lunch at John Adams'' table; her toast to the second and sixth Presidents. She is told that no First Lady has visited the house "since Mrs. John Quincy Adams returned in 1829."'
      n: '[[w.johnson-white-house-diary]], 522–25. Names: Lady Bird Johnson, Udall, Volpe.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:volpe-john-a
      - state:ma
- add:
    entry:
      id: cal.1967-06-09.states-and-cities
      when: June 9
      date: '1967-06-09'
      thread: states-and-cities
      c: 'Mt. Mansfield, Vt.: an arts and crafts show and dinner at Spruce House, a hundred or more guests from Vermont, New Hampshire and Maine; Governors Hoff, King and Curtis each speak. Lady Bird Johnson gives the craftsmen certificates. King tells her he is "a solid Administration man in favor of Lyndon''s policies" and the wave of unpopularity "more smoke than fire."'
      n: '[[w.johnson-white-house-diary]], 526–27 (Mrs. Johnson''s account). Names: Lady Bird Johnson, King, Hoff, Curtis.'
      tags:
      - name:johnson-lady-bird
      - name:king-john-w
      - name:hoff-philip-h
      - name:curtis-kenneth-m
      - state:vt
      - state:nh
      - state:me
- add:
    entry:
      id: cal.1967-06-11.conservation
      when: June 11
      date: '1967-06-11'
      thread: conservation
      c: 'Plymouth, Vt.: the Calvin Coolidge homestead made a National Historic Landmark; John Coolidge presides, Udall and Governor Hoff speak. Lady Bird Johnson and Nash Castro of the National Park Service set the plaque.'
      n: '[[w.johnson-white-house-diary]], 527–29. Names: Lady Bird Johnson, Udall, Hoff.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:hoff-philip-h
      - state:vt
- add:
    entry:
      id: cal.1967-06-11.conservation-2
      when: June 11
      date: '1967-06-11'
      thread: conservation
      c: Woodstock, Vt., 3 p.m., on the Rockefellers' lawn, several hundred neighbors, selectmen, state officials and conservationists; Laurance Rockefeller presides. Lady Bird Johnson salutes George Perkins Marsh, whose home it was, and Rockefeller, "America's leading citizen-conservationist today"; she praises local initiative in the watershed, where Woodstock's bond issue will clear some thirty-six miles of scenic waterways. She unveils the plaque making the house a National Landmark.
      n: '[[w.johnson-white-house-diary]], 530–31. Names: Lady Bird Johnson, Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - state:vt
- add:
    entry:
      id: cal.1967-06-25.soviet-union
      when: June 25
      date: '1967-06-25'
      thread: soviet-union
      c: 'Glassboro day: at Johnson''s suggestion Lady Bird Johnson takes Kosygin''s daughter, Mrs. Ludmilla Gvishiana, "a very young-looking thirty-eight," with Lynda Bird Johnson, Liz Carpenter and Mrs. Hughes by helicopter to the New Jersey Governor''s beach house for lunch, press at every step. Talk of schools in Russia, parks, Leningrad. Gifts: The Living White House, a book on the National Gallery, an antique mirror of about 1780, a wrist watch. On the beach, asked if New Jersey reminds her of home, Mrs. Gvishiana: "Yes, of two parts of it. The sand is like the Baltic and the hot weather is like the Black Sea area—in Georgia." Back at Hollybush before 5.'
      n: '[[w.johnson-white-house-diary]], 534–40. Names: Lady Bird Johnson, Johnson, Kosygin.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
