    entry:
      id: cal.1967-06-25.soviet-union-2
      when: June 25
      date: '1967-06-25'
      thread: soviet-union
      c: 'About 7:30 p.m., on the White House lawn, Johnson reports to the American people on the talks with Kosygin. In Lady Bird Johnson''s gloss: a long way from agreement, but a hopeful air; "their ten hours of talks had made the world a smaller and a little less dangerous place." On the ride home: "Well, I''d say we didn''t move ahead far today."'
      n: '[[w.johnson-white-house-diary]], 541. To check: the Public Papers, 1967, June 25. Names: Johnson, Lady Bird Johnson, Kosygin.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1967-06-25.soviet-union-3
      when: June 25
      date: '1967-06-25'
      thread: soviet-union
      c: 'Evening: Johnson telephones Mansfield, Dirksen and Fulbright to report the day''s talks. From the calls Lady Bird Johnson gathers of the four hours with Kosygin: Johnson''s view that Kosygin came "for one purpose—to talk about Israel''s withdrawal of troops"; Bundy''s question, "Do you think Kosygin got notice that his first reports or recommendations were too soft?"; and Johnson''s answer to Kosygin''s repeated insistence that Israel started the war, that the closing of the Gulf of Aqaba, the massing of Egyptian troops and the statements about running Israel into the sea "could possibly have been considered an act of aggression."'
      n: '[[w.johnson-white-house-diary]], 541–42 (Mrs. Johnson''s account, from the calls). Made public: 1970. Names: Johnson, Lady Bird Johnson, Mansfield, Dirksen, Fulbright, Kosygin, Bundy.'
