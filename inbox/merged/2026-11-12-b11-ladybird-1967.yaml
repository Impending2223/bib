      date: '1967-12-05'
      thread: conservation
      c: 'Lincoln Sitting Room, thirty minutes of tea: Stewart Udall gives Lady Bird Johnson a sketch of the Administration''s conservation record: the air and water pollution laws, the Wilderness Bill, 2 to 3 percent of the country''s acreage; National Seashore Parks, Padre Island and Assateague; beautification of highways and cities. For the Committee for a More Beautiful Capital, "we couldn''t get much more federal expansion, moneywise": business and the schools.'
      n: '[[w.johnson-white-house-diary]], 596–97 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1967-12-24.vietnam-johnson-asia
      when: Dec. 24
      date: '1967-12-24'
      thread: vietnam-johnson-asia
      c: 'Upstairs, after the return from the round-the-world trip about 5 a.m., nearly two hours of talk of it while Johnson has his tea: Holt''s family and successor, Ambassador Ed Clark, the stop in Vietnam, Ayub Khan, "much, much about the Pope." Lady Bird Johnson: he hoped to give evidence of his feeling for the troops, and by meeting the Pope made "one further effort toward peace."'
      n: '[[w.johnson-white-house-diary]], 605–06 (Mrs. Johnson''s account of the talk). Made public: 1970. See [[cal.1967-12-19.vietnam]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-12-24.program
      when: Dec. 24
      date: '1967-12-24'
      thread: program
      c: 'Afternoon, in the White House theater, televised: Johnson''s résumé of the trip combined with a Christmas message to the nation. Harry McPherson, the Valentis and Rusk are with him; Christmas pictures follow.'
      n: '[[w.johnson-white-house-diary]], 606. To check: the Public Papers, 1967, Dec. 24. Names: Johnson, McPherson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-08-13.opinion
      when: Aug. 13
      date: '1967-08-13'
      thread: opinion
      c: 'A poll: Johnson at 39 percent, "the lowest he has ever been."'
      n: '[[w.johnson-white-house-diary]], 556 (Mrs. Johnson''s diary: "Today''s poll"; the poll not named, nor what it asked). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-26.states-and-cities
      when: Aug. 26
      date: '1967-08-26'
      thread: states-and-cities
      c: 'Kerrville, Tex.: Lady Bird Johnson at the dedication of the Butt-Holdsworth Library.'
      n: '[[w.johnson-white-house-diary]], 563. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:tx
      - city:kerrville
- add:
    entry:
      id: cal.1967-09-12.congress-3
      when: Sept. 12
      date: '1967-09-12'
      thread: congress
      c: 'The White House South grounds, afternoon: Lady Bird Johnson''s "Country Fair" for about five hundred children, six to eighteen, of Congressmen, Cabinet members and government officials: a ferris wheel, a merry-go-round, sack races, antique cars. Humphrey gives her a ride in one; Johnson comes out with Yuki, the children after him for autographs.'
      n: '[[w.johnson-white-house-diary]], 567–69. Names: Lady Bird Johnson, Humphrey, Johnson. Check: the day: the diary heads the entry "Thursday, September 12"; Sept. 12, 1967, was a Tuesday.'
      tags:
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-12-04.press-and-broadcasting
      when: Dec. 4
      date: '1967-12-04'
      thread: press-and-broadcasting
      c: 'Johnson''s evening, by Lady Bird Johnson''s account: from the Harrimans'' party for Lynda Bird Johnson and Chuck Robb to "an important appointment with William Randolph Hearst," then the National Foreign Policy Conference at the State Department.'
      n: '[[w.johnson-white-house-diary]], 594 (her account in the afternoon, of what he "would" do; nothing of what was said). Names: Johnson, Lady Bird Johnson, Harriman.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1967-12-05.congress-2
      when: Dec. 5
      date: '1967-12-05'
      thread: congress
      c: 'Hale and Lindy Boggs''s dinner at their house for Lynda Bird Johnson and Chuck Robb, between thirty and forty guests; the Johnsons leave the White House about 8:30 p.m. Seated by Boggs, Lady Bird Johnson hears "the progress of legislation, the state of affairs on the Hill." Toasts by Boggs, Robb, Johnson and Robb''s father.'
      n: '[[w.johnson-white-house-diary]], 597–98 (Mrs. Johnson''s account). Names: Boggs, Lady Bird Johnson, Johnson.'
      tags:
      - name:boggs-hale
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- cite:
    id: cal.1967-01-10.program
    item: '[[w.johnson-white-house-diary]], 471–73 (the evening of the speech: "a quiet, measured speech," the 6 percent surtax, "Let us fight crime" the most applause, "a time of testing," "an hour and nine minutes by my watch"; Fulbright silent, Robert Kennedy "stony-faced"; not the hour of 9:33 or the other proposals)'
    units: '?'
- cite:
    id: cal.1967-01-10.congress
    item: '[[w.johnson-white-house-diary]], 471–72 (Powell "expelled" in her word, with "a committee which is supposed to spend four or five weeks judging his case"; he "stormed out onto the steps, surrounded by his supporters, some of whom wore black masks," and called the legislators "the biggest bunch of hypocrites ever elected"; not the votes)'
    units: '?'
- cite:
    id: cal.1967-01-17.vietnam-congress
    item: '[[w.johnson-white-house-diary]], 474 (Johnson came in before the dinner "bringing Mike Mansfield and Senator Dirksen with whom he had been conferring"; not the Hanoi reply or the resolution)'
    units: '?'
- cite:
    id: cal.1967-01-17.press-and-broadcasting
    item: '[[w.johnson-white-house-diary]], 474–77 (the dinner for the Vice President, the Speaker and the Chief Justice; Joan Crawford, who had come that afternoon "to discuss the beautification program," in "shocking pink"; Johnson''s toast, "It was the fidelity of men like these that made us free"; not the hour of 8:20, the columns or Califano)'
    units: '?'
- cite:
    id: cal.1967-01-27.space
    item: '[[w.johnson-white-house-diary]], 481–82 (the signing in the East Room "a little past 5," Rusk and Goldberg for the United States, Patrick Dean, Dobrynin, the Ambassadors of sixty nations signing in turn; Johnson: "astronaut and cosmonaut will meet someday on the surface of the moon as brothers and not as warriors"; not the Moscow talk)'
    units: '?'
- cite:
    id: cal.1967-01-27.space-2
    item: '[[w.johnson-white-house-diary]], 482 (at the Connors'' farewell party, a note handed Johnson during the toast; he announced, "We have lost three astronauts—Ed White and Virgil Grissom and Roger Chaffee at Cape Kennedy. There was a fire in the spaceship"; not the hour or Webb)'
    units: '?'
- cite:
    id: cal.1967-01-31.space-apollo
    item: '[[w.johnson-white-house-diary]], 483–84 (Johnson "had decided to go to the funerals of Grissom and Chaffee" and asked her to go to West Point for White''s, in the Cadet Chapel; Mrs. White to her: "Please tell the President that Ed loved him"; not Arlington)'
    units: '?'
- cite:
    id: cal.1967-03-09.economy
    item: '[[w.johnson-white-house-diary]], 493 (the news conference "began with a surprise, asking Congress to restore the investment credit and the use of accelerated depreciation for buildings"; not the message or its figures)'
    units: '?'
- cite:
    id: cal.1967-03-15.vietnam
    item: '[[w.johnson-white-house-diary]], 501 (the address to the joint session a little before 12, its burden Vietnam, "a clear exposition of the historical background of the conflict," and the news that Bunker would replace Lodge "with Gene Locke to back him up and Bob Komer to work on pacification," a salute to Westmoreland; Governor Ellington had told her the legislature "had passed a Resolution supporting Lyndon''s stand in Vietnam"; not the bombing)'
    units: '?'
- cite:
    id: cal.1967-03-15.war-opposition
    item: '[[w.johnson-white-house-diary]], 501–02 (leaving the Capitol after the address, a youth "broke from the thinning crowd and flung himself right in front of the car," then "a young girl threw herself more successfully flat to the ground, practically under the wheels"; officers lifted both away; the day, Mar. 15, in the diary''s entry of that date)'
    units: '?'
- cite:
    id: cal.1967-03-18.states-and-cities-us
    item: '[[w.johnson-white-house-diary]], 505 ("all day long, Lyndon and the members of the Cabinet had labored with the Governors in briefings and with give-and-take questions"; not the remarks or the figures)'
    units: '?'
- cite:
    id: cal.1967-04-24.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 508, 510 (Johnson went down in the elevator about 8:45 a.m. on Sunday, Apr. 23, "a tough beginning for this trip to Germany"; on the 25th she watched part of the funeral on television by satellite and did not see him; not Kiesinger)'
    units: '?'
- cite:
    id: cal.1967-06-05.middle-east
    item: '[[w.johnson-white-house-diary]], 520–22 (two calls in the night, about 4:30 and an hour later; Johnson: "We have a war on our hands—in the Middle East"; a State Department official''s phrase "neutral in thought, word, and deed," and Rusk on television "to try to clarify the word"; not the hot line or the hour of 7:57)'
    units: '?'
- cite:
    id: cal.1967-06-23.soviet-union
    item: '[[w.johnson-white-house-diary]], 535–41 (June 25 only: Hollybush, Kosygin''s arrival, the first meeting on Friday "just the two of them with the two interpreters," lunch for about sixteen with Gromyko, Rusk, Rostow, Dobrynin and Thompson; the two emerged "well after 6"; she could see "no great advance"; not what was said)'
    units: '?'
- cite:
    id: cal.1967-08-16.republican-party-congress
    item: '[[w.johnson-white-house-diary]], 556 (Tower for the Republicans and Joe Clark for the Democrats on the Today show "talking about Vietnam," Tower "explained, backed—yes, even defended" the Administration; not the words)'
    units: '?'
- cite:
    id: cal.1967-08-22.states-and-cities
    item: '[[w.johnson-white-house-diary]], 559 (Walter Washington "was still in Lyndon''s office" a little past 9, "with a big smile," saying good-by to Johnson; she thought "maybe it would work out for him to be our next Mayor"; not the offer, Lindsay or the press)'
    units: '?'
- cite:
    id: cal.1967-09-08.elections-1968
    item: '[[w.johnson-white-house-diary]], 565–67 (Connally came by plane before noon; he and Johnson, joined by Pickle, rode and talked eight hours "about Lyndon''s big decision—when and how to announce that he is not going to run again"; Pickle "simply not to believe it," and spoke of the others running on the Democratic ticket; Connally "did believe it"; Johnson had Connally tell her how he would write the announcement: early, "to take it out of politics," at the Democratic Dinner of Oct. 7 or soon after, to give all his time to the war and the cities; Mrs. Johnson''s fear for his health; "we would only really know what was going to happen when we heard it happen"; not Connally''s doubts of reelection)'
    units: '?'
- cite:
    id: cal.1967-10-02.court
    item: '[[w.johnson-white-house-diary]], 572 (Saturday, Sept. 30, at the Ranch hangar, 12:30, the appointments announced, "including the appointment of Dean Griswold as Solicitor General to replace Thurgood Marshall"; not the swearing in)'
    units: '?'
- cite:
    id: cal.1967-10-04.vietnam-congress
    item: '[[w.johnson-white-house-diary]], 574 ("thirty Senators—another in a series of his stag dinners"; Johnson came in "about a quarter past 8," in higher spirits than at 9 that morning; not Rusk or McNamara)'
    units: '?'
- cite:
    id: cal.1967-10-26.latin-america
    item: '[[w.johnson-white-house-diary]], 584–87 (Oct. 26 only: the arrival ceremony at noon, the limousine "for the thirty-seventh time this year," the drive to Blair House, the State dinner for 190 guests; not Oct. 27–28 or the Chamizal)'
    units: '?'
- cite:
    id: cal.1967-11-12.vietnam
    item: '[[w.johnson-white-house-diary]], 588–89 (the sermon at Bruton Parish, the Johnsons in "George Washington''s own pew in the front row"; Lewis: "We are mystified ... While pledging our loyalty, we ask humbly: ''Why?''"; copies mimeographed for the press, his criticism "was the farthest thing from my mind"; Johnson "shook hands briefly with a smile," and later: "Greater love hath no man than that he goes to the Episcopal Church with his wife!"; not the 5,100 miles, the Governor or the letters)'
    units: '?'
- cite:
    id: cal.1967-11-29.defense
    item: '[[w.johnson-white-house-diary]], 591–92 (the 106 member countries to vote; the decision came and "a statement had been issued," Johnson showing her his and McNamara''s, at 10:20 p.m.; two days of press speculation that McNamara''s going meant the hawks taking over; not Woods or Fowler)'
    units: '?'
- cite:
    id: cal.1967-12-19.vietnam
    item: '[[w.johnson-white-house-diary]], 605–06 (home about 5 a.m. on Dec. 24, "the first American President ever to travel around the world while in office," sixty and one-half hours in the air and 27,300 miles; the Holt service, Thailand, Vietnam, Ayub Khan at Karachi, "late-night meetings in Rome"; not the days or the aide-mémoire)'
    units: '?'
- variant:
    id: cal.1967-11-12.vietnam
    unit: C
    witness: w.johnson-white-house-diary
    reads: 'Mrs. Johnson, in the front pew, has the sermon: "But there is a rather general consensus that something is wrong in Vietnam ..." and "While pledging our loyalty, we ask humbly: ''Why?''" (not "since ... we ask respectfully, why?")'
    at: '588'
