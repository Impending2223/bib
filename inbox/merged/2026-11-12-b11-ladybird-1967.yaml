- add:
    entry:
      id: cal.1967-01-26.states-and-cities
      when: Jan. 26
      date: '1967-01-26'
      thread: states-and-cities
      c: 'Forty-six Mayors, the Executive Committee of the U.S. Conference of Mayors, at tea with Lady Bird Johnson in the Red Room, 4:30 p.m., on beautification and conservation at home. Cavanagh moderates; Lindsay and Cervantes of St. Louis among those who speak. Johnson comes in and tells them it is up to them to get the votes in Congress for the cities: "I do not have enough horsepower. I can get just three votes in the Texas delegation. If your constituencies want model cities, they must express themselves." Last year''s bill passed "just by an eyelash."'
      n: '[[w.johnson-white-house-diary]], 479–81. Names: Lady Bird Johnson, Johnson, Cavanagh, Lindsay, Cervantes.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:cavanagh-jerome-p
      - name:lindsay-john-v
      - name:cervantes-alfonso-j
      - city:st-louis
- add:
    entry:
      id: cal.1967-01-27.transition-and-staff
      when: Jan. 27
      date: '1967-01-27'
      thread: transition-and-staff
      c: 'Farewell party upstairs for Secretary of Commerce John Connor, a little before 7 p.m.: the whole Cabinet, a few staff, the Connors'' kin. During Connor''s toast a note is handed to Johnson; he announces the deaths of the three astronauts and leaves for the Situation Room.'
      n: '[[w.johnson-white-house-diary]], 482–83 (Mrs. Johnson''s account). See [[cal.1967-01-27.space-2]]. Names: Connor, Johnson, Lady Bird Johnson.'
      tags:
      - name:connor-john-t
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-01-31.white-house
      when: Jan. 31
      date: '1967-01-31'
      thread: white-house
      c: 'The unveiling of Madame Shoumatoff''s portrait of Franklin Roosevelt, with FDR''s children, grandchildren, friends and co-workers in the audience. Lady Bird Johnson speaks and Madame Shoumatoff pulls the cord. Johnson: "He proved again and again that politics, scorned by so many, is an honorable calling." A scene from Sunrise at Campobello, Charlton Heston as FDR, Dore Schary narrating.'
      n: '[[w.johnson-white-house-diary]], 484–87. To check: the Public Papers, 1967, Jan. 31. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-03-02.congress
      when: Mar. 2
      date: '1967-03-02'
      thread: congress
      c: 'The eighth and last of the Congressional receptions. A late vote holds the House members until about 7; Johnson joins them a little before 7 and a little past 7 takes the men to the East Room. In the Queen''s Room Lynda Bird Johnson moderates for the wives: Charles Taft, Mrs. Van Seagraves, Barbara Eisenhower and Margaret Truman Daniel on their White House years.'
      n: '[[w.johnson-white-house-diary]], 490–92. Names: Lady Bird Johnson, Johnson, Taft.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:taft-charles-p
- add:
    entry:
      id: cal.1967-03-09.elections-1968-johnson
      when: Mar. 9
      date: '1967-03-09'
      thread: elections-1968-johnson
      c: 'News conference in the East Room, televised, Lady Bird Johnson on his right. Johnson begins by asking Congress to restore the investment credit and accelerated depreciation on buildings. Asked about a pause in the bombing, and whether he will run in 1968 with Humphrey as his running mate: "I am not ready to make a decision about my future after January 1969 at this time." On Vietnam critics: "I''m just not in a position to know how much information each critic of my policy in Vietnam happens to have at the time he makes his criticism."'
      n: '[[w.johnson-white-house-diary]], 492–93. To check: the Public Papers, 1967, Mar. 9. Names: Lady Bird Johnson, Johnson, Humphrey.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1967-03-14.school-aid
      when: Mar. 14
      date: '1967-03-14'
      thread: school-aid
      c: 'Appalachia, North Carolina, with Secretary of HEW John Gardner and Mrs. Moore, wife of the Governor, for the Teachers Corps; two busloads, more than forty press members. Canada Township: the Mathis family, a woodcutter, his wife and seven children, on under two thousand dollars a year, in their two-room house, and the school, six one-room schools consolidated, 105 students and four teachers. The Teachers Corps has about twelve hundred members: "Unless Congress votes the $12 million appropriation, the Teachers Corps will expire in June."'
      n: '[[w.johnson-white-house-diary]], 493–97. Names: Lady Bird Johnson, Gardner.'
      tags:
      - name:johnson-lady-bird
      - name:gardner-john-w
      - state:nc
- add:
    entry:
      id: cal.1967-03-14.school-aid-2
      when: Mar. 14
      date: '1967-03-14'
      thread: school-aid
      c: 'Cullowhee, Western Carolina College: the dedication of Hunter Library. Ruth Graham gives the invocation, Gardner a short speech. Lady Bird Johnson on federal participation in education, the Land Ordinance of 1785, the land grant colleges, the GI Bill; the trip is "to bring public exposure to the eighteen major measures" passed to advance education.'
      n: '[[w.johnson-white-house-diary]], 497–98. Names: Lady Bird Johnson, Gardner.'
      tags:
      - name:johnson-lady-bird
      - name:gardner-john-w
      - state:nc
- add:
    entry:
      id: cal.1967-03-14.school-aid-3
      when: Mar. 14
      date: '1967-03-14'
      thread: school-aid
      c: 'Asheville, Lee Edwards High School: Lady Bird Johnson with Gardner and Mrs. Moore visits an adult education class sponsored by the Asheville-Buncombe Technical Institute, students from eighteen to eighty-two, "fifty-five hundred Asheville citizens" enrolled in two years. A student asks her to take back their thanks to the President for the program.'
      n: '[[w.johnson-white-house-diary]], 498–99. Names: Lady Bird Johnson, Johnson, Gardner.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:gardner-john-w
      - state:nc
      - city:asheville
- add:
    entry:
      id: cal.1967-03-15.assassination
      when: Mar. 15
      date: '1967-03-15'
      thread: assassination
      c: '7 a.m., Arlington, in the rain: President Kennedy''s grave moved during the night; Cardinal Cushing prays. Present, Mrs. Kennedy and the family, and Johnson, who attends after a call about 10 p.m. the night before, sharing an umbrella with Robert Kennedy. He reaches the airport at Nashville a half-hour late.'
      n: '[[w.johnson-white-house-diary]], 499 (Mrs. Johnson''s account of what she was told). Names: Johnson, Kennedy, Jacqueline Kennedy, Cushing.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:kennedy-jacqueline
      - name:cushing-richard-g
      - state:va
- add:
    entry:
      id: cal.1967-03-15.school-aid
      when: Mar. 15
      date: '1967-03-15'
      thread: school-aid
      c: 'Nashville, the Hermitage, Andrew Jackson''s home, for breakfast: Assistant Postmaster General William McMillan brings the first issues of the stamp for the 200th birthday of Jackson. Lady Bird Johnson speaks on Jackson and on free public schools, "the eighteen new laws"; Governor Ellington introduces Johnson, who speaks; a wreath at the graves of Jackson and Rachel.'
      n: '[[w.johnson-white-house-diary]], 499–501. Names: Lady Bird Johnson, Johnson, Ellington.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:ellington-buford
      - state:tn
      - city:nashville
- add:
    entry:
      id: cal.1967-03-15.school-aid-2
      when: Mar. 15
      date: '1967-03-15'
      thread: school-aid
      c: 'Columbia, Tenn.: Columbia State Community College, rising from a bare field. Lady Bird Johnson: new colleges are being established "at the rate of one a week," from eight junior colleges at the turn of the century to 680. Johnson: "My own college education meant everything to me at a time when my future hung in the balance."'
      n: '[[w.johnson-white-house-diary]], 502. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tn
- add:
    entry:
      id: cal.1967-03-15.school-aid-3
      when: Mar. 15
      date: '1967-03-15'
      thread: school-aid
      c: 'Nashville, the Governor''s mansion, evening: a reception and seminar for educators of Tennessee, West Virginia and Alabama; Doug Cater moderates, with Frank Rose of the University of Alabama and Governor Hulett Smith of West Virginia. Johnson speaks about fifty minutes. Gardner, for the first time in twenty months in the Cabinet, praises the President in public: "It has been a privilege to see the generative power of one man''s deep conviction."'
      n: '[[w.johnson-white-house-diary]], 502–03. Names: Johnson, Gardner, Cater, Smith.'
      tags:
      - name:johnson-lyndon-b
      - name:gardner-john-w
      - name:cater-s-douglass
      - name:smith-hulett-c
      - state:tn
      - city:nashville
- add:
    entry:
      id: cal.1967-03-18.students
      when: Mar. 18
      date: '1967-03-18'
      thread: students
      c: 'Yellow Oval Room, morning: students from Texas, brought by the Texas State Society for its annual brunch, Busby the "entrepreneur," to honor "the campus generation": the University of Texas College Bowl team and student singers and a jazz band. Johnson comes in, "breaking away from the Governors'' briefing," and talks with them.'
      n: '[[w.johnson-white-house-diary]], 503–04. Names: Lady Bird Johnson, Johnson, Busby.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:busby-horace
      - state:tx
- add:
    entry:
      id: cal.1967-03-18.states-and-cities
      when: Mar. 18
      date: '1967-03-18'
      thread: states-and-cities
      c: 'The Governors'' wives at Lady Bird Johnson''s tree-planting at Gravelly Point on the Potomac: fifty-four white flowering dogwoods, one for each State and territory, in mud, at 29 degrees. No one plants Alabama''s, since Mrs. Wallace "was in conference with the other Governors." Then a bus tour of the Beautification Committee''s work and lunch at the State Department.'
      n: '[[w.johnson-white-house-diary]], 504–05. Names: Lady Bird Johnson, Wallace.'
      tags:
      - name:johnson-lady-bird
      - name:wallace-lurleen-b
      - state:al
      - state:va
- add:
    entry:
      id: cal.1967-03-18.states-and-cities-2
      when: Mar. 18
      date: '1967-03-18'
      thread: states-and-cities
      c: 'Dinner for the Governors and their wives, 7 p.m.: Connally, Ellington, Burns, Hulett Smith, Romney, Reagan, Winthrop Rockefeller, Guy, the Wallaces. Governor Rhodes of Ohio, a Republican, "gave a rousing endorsement of Lyndon" at the end of the evening. After Guys and Dolls, Johnson leaves from the lawn by helicopter for Guam.'
      n: '[[w.johnson-white-house-diary]], 505–06. Names: Lady Bird Johnson, Johnson, Connally, Ellington, Smith, Romney, Reagan, Rockefeller, Guy, George Wallace, Lurleen Wallace, Rhodes.'
      tags:
      - name:johnson-lady-bird
