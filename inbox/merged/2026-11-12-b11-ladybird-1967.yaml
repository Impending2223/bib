- add:
    entry:
      id: cal.1967-01-05.congress
      when: Jan. 5
      date: '1967-01-05'
      thread: congress
      c: At the Humphreys' apartment, a little before 10 p.m., steak for the Johnsons and the Humphreys. They "analyzed the Senate and its leadership, past and present, the coming session of Congress, the things we needed to do." No motorcycles; "I don't think anybody even knew we went."
      n: '[[w.johnson-white-house-diary]], 470 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson, Humphrey.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1967-01-05.press-and-broadcasting
      when: Jan. 5
      date: '1967-01-05'
      thread: press-and-broadcasting
      c: 'Peter Hurd "is breaking into print once more about the portrait," with more interviews. Lady Bird Johnson spends the morning on a brief answer: "The picture was too large," and the Capitol "too brilliantly, unrealistically lighted." She would have a short statement ready "and then no more."'
      n: '[[w.johnson-white-house-diary]], 469–70 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-01-10.congress-2
      when: Jan. 10
      date: '1967-01-10'
      thread: congress
      c: Representative John E. Fogarty of Rhode Island dies in his office, head of "the subcommittee through which most of the legislation on education and health passes." Flags at half-mast on the drive to the Capitol.
      n: '[[w.johnson-white-house-diary]], 471 (Mrs. Johnson''s account). To check: the Congressional Record, Jan. 10, 1967. Names: Fogarty, Lady Bird Johnson.'
      tags:
      - name:fogarty-john-e
      - name:johnson-lady-bird
      - state:ri
