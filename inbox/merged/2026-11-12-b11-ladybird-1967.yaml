- add:
    entry:
      id: cal.1967-07-07.conservation
      when: July 7
      date: '1967-07-07'
      thread: conservation
      c: 'Lady Bird Johnson tours the old Tenth Congressional District for "grass-roots beautification and restoration": Lockhart, where the townspeople raised six thousand dollars to light the Court House square; Praha; La Grange, where she plants a pine; Winedale, with Ima Hogg; Round Top. Pickle is her guide; the temperature 98; Head Start children at several stops.'
      n: '[[w.johnson-white-house-diary]], 543–48. Names: Lady Bird Johnson, Pickle.'
      tags:
      - name:johnson-lady-bird
      - name:pickle-james-j
      - state:tx
      - city:lockhart
- add:
    entry:
      id: cal.1967-07-31.civil-disorders-detroit
      when: July 31
      date: '1967-07-31'
      thread: civil-disorders-detroit
      c: 'Truman Balcony, 8 p.m.: Abe and Carol Fortas and Oveta Hobby with the Johnsons have "a lengthy exploration of the riots in Detroit": Romney''s statements and telegrams and later his press conference, Johnson''s speech of Thursday night, Cyrus Vance''s presence, the constitutional ramifications, "the ''1, 2, 3'' process" by which a Governor gets federal help, and the fourteen or more times in the nation''s history it was asked or sometimes refused.'
      n: '[[w.johnson-white-house-diary]], 549 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Johnson, Fortas, Hobby, Romney, Vance.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:hobby-oveta-culp
      - name:romney-george-w
      - name:vance-cyrus
      - city:detroit
      - state:mi
- add:
    entry:
      id: cal.1967-07-31.elections-1968-johnson
      when: July 31
      date: '1967-07-31'
      thread: elections-1968-johnson
      c: 'Lady Bird Johnson''s diary, on what has been on her mind "over the weekend," after a Sunday poll showing "a distinct downward trend" in approval of Johnson''s handling of the war: "Our own decision, our hope, our determination, is to leave when this term ends." When to tell it: "in the fall, as John Connally suggested? Or not until March 1968—my own idea?"'
      n: '[[w.johnson-white-house-diary]], 549–50 (Mrs. Johnson''s account; Connally''s suggestion undated). Made public: 1970. Names: Lady Bird Johnson, Johnson, Connally.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connally-john
- add:
    entry:
      id: cal.1967-08-01.program
      when: Aug. 1
      date: '1967-08-01'
      thread: program
      c: Morning, in Lady Bird Johnson's "Board of Directors Room," a session on the LBJ Library with Max Brooks, Gordon Bunshaft, Horace Busby, Arthur Drexler and Dorothy Territo, at President Grant's Cabinet table.
      n: '[[w.johnson-white-house-diary]], 550. Names: Lady Bird Johnson, Busby.'
      tags:
      - name:johnson-lady-bird
      - name:busby-horace
- add:
    entry:
      id: cal.1967-08-03.crime-and-hijacking
      when: Aug. 3
      date: '1967-08-03'
      thread: crime-and-hijacking
      c: 'New York, the Eastern shuttle, about 5 p.m.: the Secret Service takes Lady Bird Johnson off the plane at the runway after an anonymous call to Eastern Airlines that a bomb is on "the 5 o''clock shuttle." The other passengers get off too. She is airborne on another plane a little past 6 and reaches Washington at 7:30.'
      n: '[[w.johnson-white-house-diary]], 551–52. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:nyc
- add:
    entry:
      id: cal.1967-08-13.vietnam-clifford-taylor
      when: Aug. 13
      date: '1967-08-13'
      thread: vietnam-clifford-taylor
      c: 12:30 p.m., on television, thirty minutes, Clark Clifford and General Maxwell Taylor, whom Johnson and Lady Bird Johnson watch on the Sequoia. Taylor gives "a résumé of the economy, the politics, and the military situation in Vietnam since 1954"; Clifford answers on the coming Vietnamese elections and the President's feelings about them "as transmitted to Ky and Thieu."
      n: '[[w.johnson-white-house-diary]], 554. Names: Clifford, Taylor, Johnson, Lady Bird Johnson.'
      tags:
      - name:clifford-clark
      - name:taylor-maxwell
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-08-13.program
      when: Aug. 13
      date: '1967-08-13'
      thread: program
      c: 'Aboard the Sequoia, Johnson on how decisions are made, to columnists'' complaints that he is slow: "The important thing is not to get problems off your desk—it''s to make a decision that my grandchild and yours can live with." He has asked experienced men, George Ball one, to be "devil''s advocate" and give "a picture of all the bad things that could flow from a certain course of action."'
      n: '[[w.johnson-white-house-diary]], 554 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson, Ball.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:ball-george-w
- add:
    entry:
      id: cal.1967-08-13.state-and-city-finance
      when: Aug. 13
      date: '1967-08-13'
      thread: state-and-city-finance
      c: 'At the family dinner table, to Luci Johnson Nugent, who favors a sales tax in Austin, Johnson: "in a sales tax everything you wear or eat is taxed"; "A sales tax really helps the rich people at the expense of the poor people."'
      n: '[[w.johnson-white-house-diary]], 557 (Mrs. Johnson''s account, in the entry of Aug. 16: "Sunday night" of Luci''s and Pat''s visit, Joe Batson at the table; they came back from Nassau with him on Sunday, Aug. 13, and dined with the Johnsons, 554–55). Made public: 1970. Names: Johnson, Lady Bird Johnson. Check: the day: the visit began on Sunday, July 30, 548.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - state:tx
      - city:austin
- add:
    entry:
      id: cal.1967-08-16.vietnam-support
      when: Aug. 16
      date: '1967-08-16'
      thread: vietnam-support
      c: 'East Room, early: the Vietnam Civilian Service Awards. Lady Bird Johnson and Henry Cabot Lodge, the former Ambassador, are on the stage. A small group of civilians, AID workers and members of a church group, receive citations for their work in Saigon hospitals and schools.'
      n: '[[w.johnson-white-house-diary]], 559. Names: Lady Bird Johnson, Lodge.'
      tags:
      - name:johnson-lady-bird
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1967-08-16.conservation
      when: Aug. 16
      date: '1967-08-16'
      thread: conservation
      c: '10 a.m.: Lady Bird Johnson drives Mayor Harry Akin of Austin around Washington to show what the Committee for a More Beautiful Capital has done in "two years and eight months": the park at Third and Independence, Syphax School, the magnolias on Pennsylvania Avenue S.E., Rawlins Park.'
      n: '[[w.johnson-white-house-diary]], 556–57. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:austin
      - city:washington
- add:
    entry:
      id: cal.1967-08-22.middle-east-2
      when: Aug. 22
      date: '1967-08-22'
      thread: middle-east
      c: 'South Lawn, 5 p.m.: the arrival of the Shah of Iran. Rusk notes that Johnson has received sixty-six foreign Chiefs of State in twelve months. Johnson speaks of Iran''s economy, growing at about 10 percent a year: "You are winning progress without violence and without any bloodshed—a lesson that others have still to learn." The Shah answers without notes.'
      n: '[[w.johnson-white-house-diary]], 559–60. To check: the Public Papers, 1967, Aug. 22. Names: Pahlavi, Johnson, Rusk, Lady Bird Johnson.'
      tags:
      - name:pahlavi-mohammed-reza
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-08-22.middle-east-3
      when: Aug. 22
      date: '1967-08-22'
      thread: middle-east
      c: 'State dinner for the Shah of Iran, the Empress at home. Johnson''s toast: "I must add special congratulations on Your Majesty''s superb sense of timing. You have had the foresight to schedule your coronation when your polls are up." The Shah: women have gained "even equality in wearing a crown." The American Ballet Theater dances Rodeo in the East Room. David Lilienthal tells Lady Bird Johnson, "something like" this: "A very persuasive man has put me to work on Vietnam."'
      n: '[[w.johnson-white-house-diary]], 560–63. To check: the Public Papers, 1967, Aug. 22. Names: Pahlavi, Johnson, Lady Bird Johnson, Lilienthal.'
      tags:
      - name:pahlavi-mohammed-reza
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:lilienthal-david-e
- add:
    entry:
      id: cal.1967-09-12.congress-2
      when: Sept. 12
      date: '1967-09-12'
      thread: congress
      c: 'The third of Lady Bird Johnson''s small upstairs dinners: Senator and Mrs. McClellan, Senator Talmadge and Betty, Senator and Mrs. McGee, Smathers, Church, Cyril Magnin, the Leonard McCollums. Smathers, rumored to be leaving politics at the end of his term, "did not affirm or deny" it; much talk of the population explosion and birth control.'
      n: '[[w.johnson-white-house-diary]], 569 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, McClellan, Talmadge, McGee, Smathers, Church. Check: the day: the diary heads the entry "Thursday, September 12"; Sept. 12, 1967, was a Tuesday, the night of a stag dinner for Democratic Senators ([[cal.1967-09-12.vietnam-congress]]).'
      tags:
      - name:johnson-lady-bird
      - name:mcclellan-john-l
      - name:talmadge-herman-e
      - name:mcgee-gale-w
      - name:smathers-george-a
      - name:church-frank
- add:
    entry:
      id: cal.1967-09-25.elections-1968-johnson
      when: Sept. 25
      date: '1967-09-25'
      thread: elections-1968-johnson
      c: 'About 3:30 a.m. the Johnsons "talked and talked and talked about when and how to make the statement that Lyndon is not going to be a candidate again." Oct. 7, the Democratic dinner, is discussed: "Perhaps we have already passed up two possibilities—Lyndon''s birthday and the election in Vietnam." She does not think it can be made at the dinner, whose guests have paid a thousand dollars to hear "tough assurance and good cheer."'
      n: '[[w.johnson-white-house-diary]], 570 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-09-25.vietnam-support
      when: Sept. 25
      date: '1967-09-25'
      thread: vietnam-support
      c: Johnson's lunch for Sir Robert Menzies and Dame Patty and the Australian Ambassador and Mrs. Keith Waller; Lady Bird Johnson attends. Menzies "talked about how much he approved of what Lyndon was doing internationally," and tells him, "You've got to keep telling the people—go on TV," with the story of the candidate who made one speech "to seventy different audiences."
      n: '[[w.johnson-white-house-diary]], 570–71. Names: Johnson, Lady Bird Johnson, Menzies.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:menzies-robert-g
- add:
    entry:
      id: cal.1967-09-30.court
      when: Sept. 30
      date: '1967-09-30'
      thread: court
      c: 'The LBJ Ranch hangar, 12:30 p.m.: Johnson, with his family, announces appointments, among them Dean Erwin Griswold of the Harvard Law School as Solicitor General in place of Thurgood Marshall; Ramsey Clark, Barefoot Sanders, Ed Weisl, Jr. and Steve Pollak have flown in with Griswold. The occasion becomes "a real press conference."'
      n: '[[w.johnson-white-house-diary]], 571–72. To check: the news conference of Sept. 30, 1967, Public Papers. Names: Johnson, Lady Bird Johnson, Griswold, Marshall, Clark, Sanders, Weisl.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:griswold-erwin-n
      - name:marshall-thurgood
      - name:clark-ramsey
      - name:sanders-h-barefoot-jr
      - name:weisl-edwin-l-jr
      - state:tx
- add:
    entry:
      id: cal.1967-10-04.elections-1968-johnson
      when: Oct. 4
      date: '1967-10-04'
      thread: elections-1968-johnson
      c: 'After midnight, Andrews Air Force Base to the White House, forty-five minutes: Dr. Willis Hurst tells Lady Bird Johnson Johnson seems "bone tired," on "marginal energy." Asked point-blank whether as his doctor he thinks Johnson ought not to run again, Hurst says it is "beyond medical knowledge" to determine the results. He does not think Johnson can quit: "Because he hasn''t done everything that he wants to."'
      n: '[[w.johnson-white-house-diary]], 573–74 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-04.elections-1968-johnson-2
      when: Oct. 4
      date: '1967-10-04'
      thread: elections-1968-johnson
      c: A little past 6 a.m., Johnson up and working, the Johnsons have "a long talk, going over and over the same old ground—when could he make his announcement that he was not going to run again—when and how?" "Our mood was bleak and dispirited, and no answers came."
      n: '[[w.johnson-white-house-diary]], 574 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-10-04.states-and-cities
      when: Oct. 4
      date: '1967-10-04'
      thread: states-and-cities
      c: 'On television, Johnson with Walter Washington and Tom Fletcher in the Rose Garden on the new government for the District of Columbia. Lady Bird Johnson, who watches it that evening: "it''s not full self-government but it''s a sizable step toward something nobody else has been able to solve since 1789."'
      n: '[[w.johnson-white-house-diary]], 574. Names: Johnson, Washington, Lady Bird Johnson. Check: the day of the taping: the diary, Oct. 4, has her watch the program "later" that day; Walter Washington was sworn Sept. 28 ([[cal.1967-09-28.states-and-cities]]).'
      tags:
      - name:johnson-lyndon-b
      - name:washington-walter-e
      - name:johnson-lady-bird
      - city:dc
- add:
    entry:
      id: cal.1967-10-08.students
      when: Oct. 8
      date: '1967-10-08'
      thread: students
      c: 'Williamstown, Mass.: Lady Bird Johnson receives an honorary degree at Williams College and speaks at the opening of its Center for Environmental Studies. Pickets'' printed signs, "CONFRONT THE WAR MAKERS IN WASHINGTON, OCTOBER 21"; sixty-three graduates in white arm bands, by the local paper; thirty-five walk out as she is introduced, by the Massachusetts paper; "Shame, Shame!" as she leaves. She tells them "eleven thousand city planning positions must be filled in the next five years" and planning schools turn out "only four hundred and fifty graduates a year." Johnson telephones: "I just hate for you to have to take that sort of thing."'
      n: '[[w.johnson-white-house-diary]], 575–78. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:ma
- add:
    entry:
      id: cal.1967-10-09.students
      when: Oct. 9
      date: '1967-10-09'
      thread: students
      c: 'New Haven: Lady Bird Johnson speaks to the Yale Political Union in Freshman Commons, eight hundred or more members; outside about eight hundred picketers chant "Peace now" and "Hell no, we won''t go." President Kingman Brewster introduces her, saying that in his young days he opposed another war in another President''s time and has come to understand the difficulties of those conducting foreign policy. She asks: "Can a great democratic society generate the energy to plan and build projects of order and beauty?" Two standing ovations.'
      n: '[[w.johnson-white-house-diary]], 579–82. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:ct
      - city:new-haven
- add:
    entry:
      id: cal.1967-10-20.conservation
      when: Oct. 20
      date: '1967-10-20'
      thread: conservation
      c: 'Columbia Island: Lady Bird Johnson, Mayor Walter Washington and garden-club women plant daffodils from Mary Lasker''s gift of eight hundred thousand bulbs, bought before "Congress clamped down on the Park Service funds for planting new material."'
      n: '[[w.johnson-white-house-diary]], 582. Names: Lady Bird Johnson, Washington.'
      tags:
      - name:johnson-lady-bird
      - name:washington-walter-e
      - city:washington
- add:
    entry:
      id: cal.1967-10-20.elections-1968-johnson
      when: Oct. 20
      date: '1967-10-20'
      thread: elections-1968-johnson
      c: 'West Hall, evening: Lady Bird Johnson tells her houseguest Jim Cain, a medical man, that she does not want another campaign or four more years "as devouring as these last four." She asks what advice he can give. Cain: "Obviously he has aged"; he cannot say Johnson will not be able to serve as he should: "No man can say what will happen."'
      n: '[[w.johnson-white-house-diary]], 583–84 (Mrs. Johnson''s account). Made public: 1970. Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-20.congress
      when: Oct. 20
      date: '1967-10-20'
      thread: congress
      c: 'Dinner with the Jack Brookses and the George Mahons; Johnson, Marie Fehmer and Califano join them. Mahon openly deplores Congress'' inability to act; Brooks scores both Houses. Johnson would "give a piece of his life" to have Sam Rayburn back with the gavel and himself in the Senate for a week. Of Eisenhower: "He has paid me back one hundred percent for what I did for him when I was Majority Leader by just trying to be decent."'
      n: '[[w.johnson-white-house-diary]], 584 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson, Brooks, Mahon, Rayburn, Eisenhower, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:brooks-jack-b
      - name:mahon-george-h
      - name:rayburn-sam
      - name:eisenhower-dwight-d
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1967-10-26.latin-america-2
      when: Oct. 26
      date: '1967-10-26'
      thread: latin-america
      c: State dinner for President Díaz Ordaz of Mexico and Mrs. Díaz Ordaz, 190 guests. Johnson's toast is on the new strain of wheat from the experimental station at Chapingo, which yields more than twice the crop, is exported by Mexico to Pakistan and India and is being tested for Turkey, Iran and Afghanistan. Herb Alpert and the Tijuana Brass play.
      n: '[[w.johnson-white-house-diary]], 585–87. To check: the Public Papers, 1967, Oct. 26. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-10-26.vietnam-air-war
      when: Oct. 26
      date: '1967-10-26'
      thread: vietnam-air-war
      c: 'Nightcap upstairs with the houseguests after the dinner, Johnson explaining the bombing of North Vietnam: "We keep 600,000 men [the enemy] busy repairing what our four hundred bombers have taken out. That is a good trade."'
      n: '[[w.johnson-white-house-diary]], 587 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-11-29.defense-clifford
      when: Nov. 29
      date: '1967-11-29'
      thread: defense-clifford
      c: 'Late evening, West Hall, with Governor and Mrs. Connally, until nearly 2 a.m.: Johnson relays the sequence of McNamara''s leaving. In what she thinks was August McNamara "stayed behind after a meeting" to say that the World Bank presidency would fall vacant and he was interested, and that Defense might gain from "a fresh person"; Johnson "had listened and said nothing." Of McNamara''s call an hour before, near tears: "Except for one, this is the hardest day I have spent in this job."'
      n: '[[w.johnson-white-house-diary]], 592–93 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson, Lady Bird Johnson, Connally, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-12-04.health
      when: Dec. 4
      date: '1967-12-04'
      thread: health
      c: 'East Room, 11:30 a.m.: Johnson signs the Mental Retardation Amendments. His Committee on Mental Retardation sits in the front row, Muriel Humphrey and Eunice Shriver among them; Senator Lister Hill leads the Congressmen standing behind him; Johnson bestows pens.'
      n: '[[w.johnson-white-house-diary]], 593. To check: the statute and the Public Papers, 1967, Dec. 4. Names: Johnson, Lady Bird Johnson, Hill.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hill-lister
- add:
    entry:
      id: cal.1967-12-04.vietnam-support
      when: Dec. 4
      date: '1967-12-04'
      thread: vietnam-support
      c: 'Evening, the State Department: Johnson addresses the National Foreign Policy Conference of business executives; home at 9:30, "in a fighting mood," by Lady Bird Johnson''s account.'
      n: '[[w.johnson-white-house-diary]], 594–95. To check: the Public Papers, 1967, Dec. 4. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1967-12-05.congress
      when: Dec. 5
      date: '1967-12-05'
      thread: congress
      c: 'The Leadership Breakfast at the White House, 8:30 a.m.: Mansfield, Russell Long, the Speaker, Carl Albert, "a table full." Long gives Lady Bird Johnson, from the Democratic leadership, two Boehm porcelain "Blue Birds of Happiness" for Lynda Bird.'
      n: '[[w.johnson-white-house-diary]], 595–96. Names: Johnson, Lady Bird Johnson, Mansfield, Long, McCormack, Albert.'
