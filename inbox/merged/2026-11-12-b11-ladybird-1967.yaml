- add:
    entry:
      id: cal.1967-04-22.program
      when: Apr. 22
      date: '1967-04-22'
      thread: program
      c: 'Dinner in the Yellow Oval Room for Eric Sevareid, Max Frankel, Senator McGee, the Thomas McIntyres of New Hampshire and the Humphreys. Frankel on Punta del Este: Johnson "had conducted the conference quite skillfully"; "Gomez Arosemena" alone arose to protest. Humphrey on Windsor, dinner with the Queen, Wilson''s nightcap. Johnson tells Senate stories, Hoey, Russell; in her gist, what will "make or break the world in the decade just around the corner" are "the population explosion and the food supply." He leaves next morning for Adenauer''s funeral.'
      n: '[[w.johnson-white-house-diary]], 506–08 (Mrs. Johnson''s account; the Johnson remark is her gist). Made public: 1970. Names: Lady Bird Johnson, Johnson, Humphrey, Sevareid, Frankel, McGee, McIntyre.'
