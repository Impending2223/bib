      when: Oct. 2
      date: '1963-10-02'
      thread: space
      also:
      - testing
      c: 'Gromyko gives Rusk a draft declaration: neither nation to orbit "any objects carrying nuclear weapons." The Joint
        Chiefs: no treaty or agreement, the verification inadequate; "weapons of mass destruction" to be added. Kennedy decides
        on a General Assembly resolution.'
      n: '[[w.poole-joint-chiefs-of-staff]], 88. Names: Gromyko, Rusk, Kennedy.'
