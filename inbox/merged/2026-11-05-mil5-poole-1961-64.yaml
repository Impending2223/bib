      date: '1962-12-12'
      thread: testing
      c: The American delegation at Geneva tables a generally worded proposal for emergency communications links.
      n: '[[w.poole-joint-chiefs-of-staff]], 87. See [[cal.1962-10-23.testing]].'
      src:
        c: 77d37776
        rows:
        - 'w.poole-joint-chiefs-of-staff 87: all'
