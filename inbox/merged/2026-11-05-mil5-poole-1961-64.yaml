- add:
    entry:
      id: cal.1962-01.defense-3
      when: Jan., early
      date: 1962-01
      thread: defense
      c: Kennedy asks Clifton, his military aide, to propose candidates for Army Chief of Staff. The Army and Navy members
        of the Joint Chiefs recommend Wheeler, lately Director of the Joint Staff. Wheeler, going to Europe hoping to succeed
        Norstad, told he "should not unpack."
      n: '[[w.poole-joint-chiefs-of-staff]], 4. Check: the month; Poole: "Early in 1962." Names: Kennedy, Wheeler, Norstad.'
      src:
        c: b7b0237b
        rows:
        - 'w.poole-joint-chiefs-of-staff 4: all'
      tags:
      - name:kennedy-john-f
      - name:wheeler-earle
      - name:norstad-lauris
    section: '196201'
- add:
    entry:
      id: cal.1962-10.testing
      when: Oct.
      date: 1962-10
      thread: testing
      c: 'ISA to Taylor, informally: "the majority of JCS studies are so loaded with caveats as to constitute unreasonable
        measures which the USSR, even should she become desirous of reaching agreements, could not accept"; JCS advice overruled
        "on occasions when better studies might have won support."'
      n: '[[w.poole-joint-chiefs-of-staff]], 87. Check: the day; Poole: "Soon afterward," after Oct. 1. Names: Taylor.'
      src:
        c: a93ab489
        rows:
        - 'w.poole-joint-chiefs-of-staff 87: all'
      tags:
      - name:taylor-maxwell
    section: '196210'
- add:
    entry:
      id: cal.1963-04.testing-4
      when: Apr.
      date: 1963-04
