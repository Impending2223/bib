      when: July 1
      date: '1964-07-01'
      thread: defense
      c: 'Taylor, leaving the chairmanship for Saigon, to McNamara by letter: the Joint Staff "marginally adequate"; "the
        Services are still not putting their best people on the Joint Staff"; Army–Air Force relations worse; land commanders
        must have air power under their operational control.'
