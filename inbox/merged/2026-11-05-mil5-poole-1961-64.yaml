    entry:
      id: cal.1961-04-04.defense
      when: Apr. 4
      date: '1961-04-04'
      thread: defense
      c: 'McNamara before Senate Armed Services on the B-70: its speed and altitude no advantage against improved surface-to-air
        missiles; it cannot carry Skybolt; vulnerable on the ground and unsuited to airborne alert. White, days later: "To
        abolish the use of the manned bomber, you have to abolish aircraft."'
      n: '[[w.poole-joint-chiefs-of-staff]], 37. Names: McNamara, White.'
      src:
        c: 0903d969
        rows:
        - 'w.poole-joint-chiefs-of-staff 37: all'
      tags:
      - name:mcnamara-robert-s
      - name:white-thomas-d
    section: '196104'
- add:
    entry:
      id: cal.1961-08-03.defense-2
      when: Aug. 3
      date: '1961-08-03'
      thread: defense
      c: 'The Joint Chiefs'' memorandum to McNamara on the strategic retaliatory forces, split on every program: above all,
        whether the deterrent should be chiefly land-based or sea-based.'
      n: '[[w.poole-joint-chiefs-of-staff]], 37. Names: McNamara.'
      src:
        c: a652d99b
        rows:
        - 'w.poole-joint-chiefs-of-staff 37: all'
