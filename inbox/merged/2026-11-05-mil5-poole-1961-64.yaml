    section: '196106'
- add:
    entry:
      id: cal.1961-06-29.testing
      when: June 29
      date: '1961-06-29'
      thread: testing
      c: 'Kennedy sends Congress a draft bill: the director of an Arms Control and Disarmament Agency to answer to the Secretary
        of State, with direct access to the President, and to attend the NSC on disarmament.'
      n: '[[w.poole-joint-chiefs-of-staff]], 82. Signed: [[cal.1961-09-26.testing]]. Names: Kennedy.'
      src:
        c: 70ad2139
        rows:
        - 'w.poole-joint-chiefs-of-staff 82: all'
      tags:
      - name:kennedy-john-f
    section: '196106'
- add:
    entry:
      id: cal.1961-08-02.testing
      when: Aug. 2
      date: '1961-08-02'
      thread: testing
      c: 'The Committee of Principals reviews the disarmament draft. The Joint Chiefs on three unresolved issues of Stage
        One: reductions before a stop to fissionable material, tritium "absolutely essential"; Soviet and Chinese forces cut
        to American levels, verified, before 2.1 million; no limits on anti-ballistic missiles. Gilpatric with them on the
        first two.'
      n: '[[w.poole-joint-chiefs-of-staff]], 83. Names: Gilpatric.'
      src:
        c: a5f1454c
        rows:
        - 'w.poole-joint-chiefs-of-staff 83: all'
      tags:
      - name:gilpatric-roswell-l
    section: '196108'
- add:
    entry:
      id: cal.1961-08-17.testing
      when: Aug. 17
      date: '1961-08-17'
      thread: testing
      c: The Committee of Principals on the disarmament plan. Kennedy "didn't see why all the fuss" about linking cuts in
        delivery vehicles and fissionable material with conventional reductions; he would look again if serious negotiations
        began.
      n: '[[w.poole-joint-chiefs-of-staff]], 83. Names: Kennedy.'
      src:
        c: 8e956157
        rows:
        - 'w.poole-joint-chiefs-of-staff 83: all'
      tags:
      - name:kennedy-john-f
    section: '196108'
- add:
    entry:
      id: cal.1961-09.testing
      when: Sept.
      date: 1961-09
      thread: testing
      c: 'The Joint Chiefs against proposals for the President''s General Assembly address, medium bombers transferred for
        destruction and 200 kilograms of fissionable material each to UN control: "most inappropriate" amid Berlin and the
        Soviet tests; "a dangerous precedent"; "seriously deficient."'
      n: '[[w.poole-joint-chiefs-of-staff]], 83. Check: the day. See [[cal.1961-09-25.testing]].'
      src:
        c: 52e1d64c
        rows:
        - 'w.poole-joint-chiefs-of-staff 83: all'
    section: '196109'
- add:
    entry:
      id: cal.1961-12-06.testing
      when: Dec. 6
      date: '1961-12-06'
      thread: testing
      c: 'The Joint Chiefs for keeping the "Declaration on Disarmament" and scrapping Foster''s plan, 30 medium bombers a
        month destroyed and 1,000 delivery vehicles each for NATO and the Warsaw Pact: parity would forfeit a "substantive"
        second strike and spark "a quality race." Gilpatric, to Foster: a second-strike force adequate even at parity; perhaps
        limit warheads or megatonnage.'
      n: '[[w.poole-joint-chiefs-of-staff]], 84. Names: Foster, Gilpatric.'
      src:
        c: c13ee2c7
        rows:
        - 'w.poole-joint-chiefs-of-staff 84: all'
      tags:
      - name:foster-william-c
      - name:gilpatric-roswell-l
    section: '196112'
- add:
    entry:
      id: cal.1962-02.testing
      when: Feb., late
      date: 1962-02
      thread: testing
      c: ACDA proposes separate negotiations in Stage I for a 30 percent cut in strategic delivery vehicles, aircraft over
        25,000 kilograms empty and missiles over 200 kilometers, by types, categories, numbers or megatonnage, and 40,000
        kilograms of fissionable material transferred. The Joint Chiefs object.
      n: '[[w.poole-joint-chiefs-of-staff]], 84–85.'
      src:
        c: 065c65e0
        rows:
        - 'w.poole-joint-chiefs-of-staff 84–85: all'
    section: '196202'
- add:
    entry:
      id: cal.1962-03-01.testing
      when: Mar. 1
      date: '1962-03-01'
      thread: testing
      c: 'The Committee of Principals on ACDA''s plan. Rusk: parity or proportional reductions? McNamara: all armaments, or
        delivery vehicles alone, nuclear and conventional cuts linked. Agreed: "best to work for an across-the-board cut of
        about 30 percent" over three years.'
      n: '[[w.poole-joint-chiefs-of-staff]], 85. Names: Rusk, McNamara, Lemnitzer.'
      src:
        c: cfc1cd26
        rows:
        - 'w.poole-joint-chiefs-of-staff 85: all'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
    section: '196203'
- add:
    entry:
      id: cal.1962-03-09.testing
      when: Mar. 9
      date: '1962-03-09'
      thread: testing
      c: Kennedy approves the across-the-board approach to disarmament.
      n: '[[w.poole-joint-chiefs-of-staff]], 85. See [[cal.1962-03-01.testing]]. Names: Kennedy.'
      src:
        c: '16642970'
        rows:
        - 'w.poole-joint-chiefs-of-staff 85: all'
      tags:
      - name:kennedy-john-f
    section: '196203'
- add:
    entry:
