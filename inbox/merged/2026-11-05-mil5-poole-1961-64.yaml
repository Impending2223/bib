      when: Feb. 16–17
      date: '1961-02-16'
      thread: defense
      c: The Joint Chiefs discuss the strategic forces task force's report with McNamara; no disagreement found.
      n: '[[w.poole-joint-chiefs-of-staff]], 37. See [[cal.1961-02.defense-4]]. Names: McNamara.'
