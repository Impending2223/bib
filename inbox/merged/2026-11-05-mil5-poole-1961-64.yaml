- add:
    entry:
      id: cal.1961-06-10.testing
      when: June 10
      date: '1961-06-10'
      thread: testing
      c: 'The Joint Chiefs answer Gilpatric on the Disarmament Administration''s new proposal: it would "confer significant
        advantage on the Sino-Soviet Bloc," "a serious erosion" of the American plan of June 27, 1960. Separable Stage One
        steps: limits of 2.1 million men, zonal restrictions, fewer strategic delivery vehicles, nuclear-free zones, an uninspected
        ban on transfers, a cutoff of fissionable material.'
      n: '[[w.poole-joint-chiefs-of-staff]], 82–83. Names: Gilpatric.'
      src:
        c: 4dd7ca02
        rows:
        - 'w.poole-joint-chiefs-of-staff 82–83: all'
      tags:
