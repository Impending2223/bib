      when: Sept. 15
      date: '1962-09-15'
      thread: space
      also:
      - testing
      c: The Committee of Principals, Decker included, accepts a declaratory ban on weapons of mass destruction in orbit,
        monitored by technical means; Kennedy approves.
      n: '[[w.poole-joint-chiefs-of-staff]], 88. See [[cal.1962-09-14.space]]. Names: Decker, Kennedy.'
      src:
        c: 6718363f
        rows:
