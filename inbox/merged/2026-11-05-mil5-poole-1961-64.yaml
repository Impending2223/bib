- add:
    entry:
      id: cal.1963-03.transition-and-staff-nsc
      when: Mar.
      date: 1963-03
      thread: transition-and-staff-nsc
      c: 'A Standing Group of the NSC created, Bundy presiding, the Chairman of the Joint Chiefs a member: to "be alert to
        planning problems that are a little less ripe than today''s required decisions: like Cuba a year from now — or China
        in 1965." Of its fourteen meetings, April to September, ten on Cuba in whole or part.'
      n: '[[w.poole-joint-chiefs-of-staff]], 6. See [[cal.1963-04-16.cuba]]. Names: Bundy.'
      src:
        c: d23e9e25
        rows:
        - 'w.poole-joint-chiefs-of-staff 6: all'
      tags:
      - name:bundy-mcgeorge
