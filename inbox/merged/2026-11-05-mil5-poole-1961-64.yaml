    entry:
      id: cal.1961-02-21.testing
      when: Feb. 21
      date: '1961-02-21'
      thread: testing
      c: 'The Joint Chiefs reaffirm their recommendation to resume testing: the 1958 proposals for verification technically
        inadequate, "a constant erosion" of the American position since; without agreement within 60 days of the conference''s
        reopening, test in outer space, underground and under water. Fallout''s hazards given "importance far in excess of
        its significance." McNamara reserves judgment.'
      n: '[[w.poole-joint-chiefs-of-staff]], 93–94. Names: McNamara.'
      src:
        c: 98a9eaca
        rows:
        - 'w.poole-joint-chiefs-of-staff 93–94: all'
      tags:
      - name:mcnamara-robert-s
    section: '196102'
- add:
    entry:
      id: cal.1961-03-02.testing
      when: Mar. 2
      date: '1961-03-02'
      thread: testing
      c: 'The Fisk panel reports to McCloy: both countries could keep "very strong" deterrents without further tests. Senior
        officials settle every question but the number of on-site inspections.'
      n: '[[w.poole-joint-chiefs-of-staff]], 94. Check: Poole has the report not distributed until Mar. 3. Names: McCloy.'
      src:
        c: 81ee6603
        rows:
        - 'w.poole-joint-chiefs-of-staff 94: all'
      tags:
      - name:mccloy-john-j
    section: '196103'
- add:
    entry:
      id: cal.1961-03-04.testing
      when: Mar. 4
      date: '1961-03-04'
      thread: testing
      c: 'A White House session on inspections: McCloy''s ten a year, more for each unidentified seismic event beyond fifty,
        up to twenty; Lemnitzer for inspections in proportion to events, no ceiling; Nitze, for OSD, not of "paramount importance."
        Kennedy adopts McCloy''s proposal. Lemnitzer to Burke: "CONCUR WITHOUT SEEING!"'
      n: '[[w.poole-joint-chiefs-of-staff]], 94. Names: McCloy, Lemnitzer, Nitze, Kennedy, Burke.'
      src:
        c: 11460f03
        rows:
        - 'w.poole-joint-chiefs-of-staff 94: all'
      tags:
      - name:mccloy-john-j
      - name:lemnitzer-lyman-l
      - name:nitze-paul
      - name:kennedy-john-f
      - name:burke-arleigh-a
    section: '196103'
- add:
    entry:
      id: cal.1961-04-18.testing
      when: Apr. 18
      date: '1961-04-18'
      thread: testing
      c: 'The United States and Britain table a draft treaty at Geneva: all tests banned but those below 4.75 seismic magnitude;
        a control commission of equal American and Soviet members and three neutrals, a single administrator. The Soviets:
        stations manned by their own men, three inspections, a troika with vetoes.'
      n: '[[w.poole-joint-chiefs-of-staff]], 94–95.'
      src:
        c: eb5b959d
        rows:
        - 'w.poole-joint-chiefs-of-staff 94–95: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-05-19.testing
      when: May 19
      date: '1961-05-19'
      thread: testing
      c: Harold Brown briefs the NSC on resuming tests; under a voluntary moratorium the Soviets "almost certainly" would
        cheat and pull ahead.
      n: '[[w.poole-joint-chiefs-of-staff]], 95. Names: Harold Brown.'
      src:
        c: 4d947a39
        rows:
        - 'w.poole-joint-chiefs-of-staff 95: all'
      tags:
      - name:brown-harold
    section: '196105'
- add:
    entry:
      id: cal.1961-05-23.testing
      when: May 23
      date: '1961-05-23'
      thread: testing
      c: 'The Committee of Principals. McNamara: "the gross advantage to the US from a resumption of testing was substantial,"
        savings of "tens of billions." LeMay, Acting Chairman, for testing the first ICBMs. Wiesner: political considerations
        should decide the timing. McNamara: "whether the tests were held in July or December would make no difference."'
      n: '[[w.poole-joint-chiefs-of-staff]], 95. Names: McNamara, LeMay, Wiesner.'
      src:
        c: ac226c6d
        rows:
        - 'w.poole-joint-chiefs-of-staff 95: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemay-curtis-e
      - name:wiesner-jerome-b
    section: '196105'
- add:
    entry:
      id: cal.1961-06-22.testing
      when: June 22
      date: '1961-06-22'
      thread: testing
      c: McNamara circulates a draft letter asking the President to "make a decision at an early date to initiate preparations
        to resume nuclear weapons testing"; the chances "substantial" that the Soviets test secretly; the Berlin confrontation
        a time to show "the US means what it says." The Joint Chiefs would have him decide to resume now. McNamara sends his
        wording to McCloy, July 28.
      n: '[[w.poole-joint-chiefs-of-staff]], 96. Names: McNamara, McCloy.'
      src:
        c: ba164bcb
        rows:
        - 'w.poole-joint-chiefs-of-staff 96: all'
      tags:
      - name:mcnamara-robert-s
      - name:mccloy-john-j
    section: '196106'
- add:
    entry:
      id: cal.1961-07-21.testing
      when: July 21
      date: '1961-07-21'
      thread: testing
      c: 'The Panofsky panel reports: "none of the specific weapons tests now discussed appear to be of such urgency ... that
        a reasonable delay ... would be critical"; surprises unlikely in strategic weapons, likely in tactical. The Joint
        Chiefs: the estimates "subject to gross error." Brown, for Defense: resume underground "as soon as it is politically
        expedient."'
      n: '[[w.poole-joint-chiefs-of-staff]], 96. Names: Harold Brown.'
      src:
        c: c3d38f65
        rows:
        - 'w.poole-joint-chiefs-of-staff 96: all'
      tags:
      - name:brown-harold
    section: '196107'
- add:
    entry:
      id: cal.1961-08-08.testing
      when: Aug. 8
      date: '1961-08-08'
      thread: testing
      c: 'The White House, on testing. Lemnitzer: the Chiefs'' concern the lack of intelligence on Soviet testing and weapons;
        Dulles: we know much more. Kennedy orders the disagreements narrowed; Lemnitzer, Dulles and Wiesner agree on resuming
        "within a reasonable time."'
      n: '[[w.poole-joint-chiefs-of-staff]], 97. Names: Lemnitzer, Dulles, Kennedy, Wiesner.'
      src:
        c: 736854f5
        rows:
        - 'w.poole-joint-chiefs-of-staff 97: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:dulles-allen-w
      - name:kennedy-john-f
      - name:wiesner-jerome-b
    section: '196108'
- add:
    entry:
      id: cal.1961-09-29.testing
      when: Sept. 29
      date: '1961-09-29'
      thread: testing
      c: The Joint Chiefs recommend resuming atmospheric tests, preparations to begin at once, for radar and communications
        blackout and an ABM warhead's high-altitude kill radius. McNamara urges preparations; Kennedy approves.
      n: '[[w.poole-joint-chiefs-of-staff]], 97. See [[cal.1961-11-02.testing]]. Names: McNamara, Kennedy.'
      src:
        c: 25fe1c28
        rows:
        - 'w.poole-joint-chiefs-of-staff 97: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196109'
- add:
    entry:
      id: cal.1961-11.testing
      when: Nov., mid-month
      date: 1961-11
      thread: testing
      c: Kennedy sets up an NSC Committee on Atmospheric Testing Policy, Seaborg chairman, with Foster, Harold Brown, Wiesner
        and Bundy; tests only when needed and fallout minimized. It recommends 27 shots over three months from the spring;
        Kennedy approves, the announcement held to about Apr. 1.
      n: '[[w.poole-joint-chiefs-of-staff]], 98. Names: Kennedy, Seaborg, Foster, Harold Brown, Wiesner, Bundy.'
      src:
        c: ef36e97c
        rows:
        - 'w.poole-joint-chiefs-of-staff 98: all'
      tags:
      - name:kennedy-john-f
      - name:seaborg-glenn-t
      - name:foster-william-c
      - name:brown-harold
      - name:wiesner-jerome-b
      - name:bundy-mcgeorge
    section: '196111'
- add:
    entry:
      id: cal.1961-12-22.testing
      when: Dec. 22
      date: '1961-12-22'
      thread: testing
      c: 'The Joint Chiefs answer Nitze on the Soviet series, at least 45 explosions: without full-scale American testing
        the Soviets "well ahead" in ABM development and yield-to-weight; early atmospheric tests "imperative"; a test ban
        "most emphatically" against American interests.'
      n: '[[w.poole-joint-chiefs-of-staff]], 98. Names: Nitze.'
      src:
        c: be20c049
        rows:
        - 'w.poole-joint-chiefs-of-staff 98: all'
      tags:
      - name:nitze-paul
    section: '196112'
- add:
    entry:
      id: cal.1962-01-29.testing
      when: Jan. 29
      date: '1962-01-29'
      thread: testing
      c: The American and British delegates at Geneva force an indefinite suspension of the test ban talks.
      n: '[[w.poole-joint-chiefs-of-staff]], 98.'
      src:
        c: f49c7371
        rows:
        - 'w.poole-joint-chiefs-of-staff 98: all'
    section: '196201'
- add:
    entry:
      id: cal.1962-02-27.testing-2
      when: Feb. 27
      date: '1962-02-27'
      thread: testing
      c: 'The NSC on testing. Lemnitzer: the Chiefs strongly for resumption, for proof-testing whole weapon systems; they
        could not approve a treaty like that of Apr. 18, 1961. McNamara agrees on the tests but would "sign on to such a treaty."'
      n: '[[w.poole-joint-chiefs-of-staff]], 98. Names: Lemnitzer, McNamara.'
      src:
        c: f13d52b2
        rows:
        - 'w.poole-joint-chiefs-of-staff 98: all'
      tags:
      - name:lemnitzer-lyman-l
      - name:mcnamara-robert-s
    section: '196202'
- add:
    entry:
      id: cal.1962-10-02.testing
      when: Oct. 2
      date: '1962-10-02'
      thread: testing
      c: 'A second American atmospheric series begins, to Nov. 4: ten explosions, one a Polaris fired at sea. Kennedy vetoes
        an Atlas fired with its warhead from Vandenberg, Cal., over the Joint Chiefs'' protest.'
      n: '[[w.poole-joint-chiefs-of-staff]], 99. See [[cal.1962-04-25.testing]]. Names: Kennedy.'
      src:
        c: e37aef40
        rows:
        - 'w.poole-joint-chiefs-of-staff 99: all'
      tags:
      - name:kennedy-john-f
    section: '196210'
- add:
    entry:
      id: cal.1962-12.testing-2
      when: Dec.
      date: 1962-12
      thread: testing
      c: 'Taylor to McNamara: more testing essential; the Soviets "have conducted about five sophisticated high-altitude tests
        that should make them much better informed than we."'
      n: '[[w.poole-joint-chiefs-of-staff]], 99. Names: Taylor, McNamara.'
      src:
        c: 9525b7d5
        rows:
        - 'w.poole-joint-chiefs-of-staff 99: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
    section: '196212'
- add:
    entry:
      id: cal.1962-08-27.testing
      when: Aug. 27
      date: '1962-08-27'
      thread: testing
      c: 'The American and British delegates at Geneva table two draft treaties: a comprehensive ban with on-site inspections
        by international teams; a ban in the atmosphere, outer space and under water, without them. The conference recesses
        early in September.'
      n: '[[w.poole-joint-chiefs-of-staff]], 100.'
      src:
        c: efc0636c
        rows:
        - 'w.poole-joint-chiefs-of-staff 100: all'
    section: '196208'
- add:
    entry:
      id: cal.1963-01.testing
      when: Jan., late
      date: 1963-01
      thread: testing
      c: 'Nitze asks the Joint Chiefs where the test ban stands. Their answer: ACDA''s "quite radical" changes to the comprehensive
        draft of Aug. 27, 1962, too few inspections and too much reliance on black boxes, would invite Soviet evasion.'
      n: '[[w.poole-joint-chiefs-of-staff]], 100. Names: Nitze.'
      src:
        c: ba2fde31
        rows:
        - 'w.poole-joint-chiefs-of-staff 100: all'
      tags:
      - name:nitze-paul
    section: '196301'
- add:
    entry:
      id: cal.1963-03-04.testing
      when: Mar. 4
      date: '1963-03-04'
      thread: testing
      c: 'The Joint Chiefs protest to McNamara: ACDA''s three-day deadlines slight military views; the Chairman a "Principal,"
        an agenda, a record of decisions. McNamara: no Defense answer, and a boycott, unless seven days are allowed. Foster
        accepts most of it.'
      n: '[[w.poole-joint-chiefs-of-staff]], 101. Names: McNamara, Foster.'
      src:
        c: 2cc027a4
        rows:
        - 'w.poole-joint-chiefs-of-staff 101: all'
      tags:
      - name:mcnamara-robert-s
      - name:foster-william-c
    section: '196303'
- add:
    entry:
      id: cal.1963-03-23.testing
      when: Mar. 23
      date: '1963-03-23'
      thread: testing
      c: ACDA circulates the final draft of a comprehensive test ban treaty, seven black box sites and seven inspections a
        year on each side. McNamara finds it acceptable.
      n: '[[w.poole-joint-chiefs-of-staff]], 101. Names: McNamara.'
      src:
        c: 64027e5c
        rows:
        - 'w.poole-joint-chiefs-of-staff 101: all'
      tags:
      - name:mcnamara-robert-s
    section: '196303'
- add:
    entry:
      id: cal.1963-04-20.testing
      when: Apr. 20
      date: '1963-04-20'
      thread: testing
      c: 'The Joint Chiefs to McNamara: a total ban, with testing below the detection threshold, against American interests;
        the Soviets could reach clean warheads by undetectable tests; testing in all environments essential.'
      n: '[[w.poole-joint-chiefs-of-staff]], 101. Names: McNamara.'
      src:
        c: ced28008
        rows:
        - 'w.poole-joint-chiefs-of-staff 101: all'
      tags:
      - name:mcnamara-robert-s
    section: '196304'
- add:
    entry:
      id: cal.1963-05-27.testing
      when: May 27
      date: '1963-05-27'
      thread: testing
      c: 'Humphrey and Dodd, with 32 cosponsors, introduce a resolution: try again for a ban on tests in the atmosphere and
        under water; no American tests while the Soviets refrain, the sites kept "in a state of constant readiness."'
      n: '[[w.poole-joint-chiefs-of-staff]], 101. Names: Humphrey, Dodd.'
      src:
        c: 7b873261
        rows:
        - 'w.poole-joint-chiefs-of-staff 101: all'
      tags:
      - name:humphrey-hubert-h
      - name:dodd-thomas-j
    section: '196305'
- add:
    entry:
      id: cal.1963-06-12.testing
      when: June 12
      date: '1963-06-12'
      thread: testing
      c: 'The Joint Chiefs approve the Joint Staff''s finding on the Dodd–Humphrey resolution: "either a fully effective test
        ban ... or continued testing in all environments could be compatible with national security"; every limited ban proposed
        has shortcomings "of major military significance."'
      n: '[[w.poole-joint-chiefs-of-staff]], 102. See [[cal.1963-05-27.testing]].'
      src:
        c: 5a02980b
        rows:
        - 'w.poole-joint-chiefs-of-staff 102: all'
    section: '196306'
- add:
    entry:
      id: cal.1963-06-14.testing
      when: June 14
      date: '1963-06-14'
      thread: testing
      c: 'The Committee of Principals. McNamara: "a head-on collision be avoided if possible."'
      n: '[[w.poole-joint-chiefs-of-staff]], 102. Names: McNamara.'
      src:
        c: f6e923f3
        rows:
        - 'w.poole-joint-chiefs-of-staff 102: all'
      tags:
      - name:mcnamara-robert-s
    section: '196306'
- add:
    entry:
      id: cal.1963-06-26.testing
      when: June 26
      date: '1963-06-26'
      thread: testing
      c: Anderson reads Senate Armed Services the Joint Chiefs' statement against a comprehensive test ban treaty. LeMay,
        the next day, that testing is needed to keep advancing and stay superior; he has refused McNamara's rewording.
      n: '[[w.poole-joint-chiefs-of-staff]], 102. Names: Anderson, LeMay, McNamara.'
      src:
        c: 8af370c1
        rows:
        - 'w.poole-joint-chiefs-of-staff 102: all'
      tags:
      - name:anderson-george-w-jr
      - name:lemay-curtis-e
      - name:mcnamara-robert-s
    section: '196306'
- add:
    entry:
      id: cal.1963-07-09.testing
      when: July 9
      date: '1963-07-09'
      thread: testing
      c: 'The NSC on Harriman''s instructions for Moscow. Taylor: the Chiefs individually against a limited ban, a review
        wanted; McNamara against; Rusk: "we must now take the position that an atmospheric test ban is in the national interest."
        Later, the Oval Office: Kennedy promises Taylor the Chiefs their "full day in court before the Senate."'
      n: '[[w.poole-joint-chiefs-of-staff]], 103. Names: Harriman, Taylor, McNamara, Rusk, Kennedy.'
      src:
        c: de135318
        rows:
        - 'w.poole-joint-chiefs-of-staff 103: all'
      tags:
      - name:harriman-w-averell
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:kennedy-john-f
    section: '196307'
- add:
    entry:
      id: cal.1963-07-16.testing
      when: July 16
      date: '1963-07-16'
      thread: testing
      c: 'The Joint Chiefs approve, without sending it to McNamara, the Joint Staff''s memorandum of July 10: "significant
        military disadvantages"; "there must be overriding nonmilitary considerations favoring the treaty." Wheeler and LeMay
        carry "overriding" over Taylor''s "compensating."'
      n: '[[w.poole-joint-chiefs-of-staff]], 103. Names: Wheeler, LeMay, Taylor.'
      src:
        c: 08937eab
        rows:
        - 'w.poole-joint-chiefs-of-staff 103: all'
      tags:
      - name:wheeler-earle
      - name:lemay-curtis-e
      - name:taylor-maxwell
    section: '196307'
- add:
    entry:
      id: cal.1963-07-24.testing-2
      when: July 24
      date: '1963-07-24'
      thread: testing
      c: 'Morning. The Joint Chiefs with Kennedy: "we cannot reduce our military readiness if an accord is reached"; "all
        Chiefs should base their position on the broadest considerations, not just military factors." They poll McCone, Seaborg,
        Wiesner, Harold Brown, John Foster and Bradbury.'
      n: '[[w.poole-joint-chiefs-of-staff]], 104. Names: Kennedy, McCone, Seaborg, Wiesner, Harold Brown.'
      src:
        c: '82768562'
        rows:
        - 'w.poole-joint-chiefs-of-staff 104: all'
      tags:
      - name:kennedy-john-f
      - name:mccone-john-a
      - name:seaborg-glenn-t
      - name:wiesner-jerome-b
      - name:brown-harold
    section: '196307'
- add:
    entry:
      id: cal.1963-08-12.testing-3
      when: Aug. 12
      date: '1963-08-12'
      thread: testing
      c: 'The Joint Chiefs spend the day on Taylor''s draft and approve it: the treaty "compatible with the security interests
        of the US," with four safeguards, underground tests, the laboratories, test sites ready, better detection; cheating
        "a relatively minor factor." Taylor takes it to McNamara the same day, to Rusk and Kennedy the next.'
      n: '[[w.poole-joint-chiefs-of-staff]], 104–05. Names: Taylor, McNamara, Rusk, Kennedy.'
      src:
        c: 3b699e6d
        rows:
        - 'w.poole-joint-chiefs-of-staff 104–05: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:kennedy-john-f
    section: '196308'
- add:
    entry:
      id: cal.1963-08-13.testing
      when: Aug. 13
      date: '1963-08-13'
      thread: testing
      c: McNamara before Foreign Relations, his "unequivocal support" for the test ban treaty.
      n: '[[w.poole-joint-chiefs-of-staff]], 105. Names: McNamara.'
      src:
        c: 97027b53
        rows:
        - 'w.poole-joint-chiefs-of-staff 105: all'
      tags:
      - name:mcnamara-robert-s
    section: '196308'
- add:
    entry:
      id: cal.1963-08-19.testing
      when: Aug. 19
      date: '1963-08-19'
      thread: testing
      c: 'The Service Chiefs testify on the test ban treaty. LeMay: "we examined the military and technical aspects and came
        up with a net disadvantage"; the Chiefs'' "broad duty" to weigh political factors, which account for his approval.'
      n: '[[w.poole-joint-chiefs-of-staff]], 105. Names: LeMay.'
      src:
        c: ae3a539d
        rows:
        - 'w.poole-joint-chiefs-of-staff 105: all'
      tags:
      - name:lemay-curtis-e
    section: '196308'
