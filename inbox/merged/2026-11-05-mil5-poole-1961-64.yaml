      when: Sept.
      date: 1960-09
      thread: defense
      c: The Ballistic Missile Early Warning System's first station, in Greenland, begins limited operation; Alaska and England
        to follow.
      n: '[[w.poole-joint-chiefs-of-staff]], 51.'
      src:
        c: a76dcc08
        rows:
        - 'w.poole-joint-chiefs-of-staff 51: all'
    section: '196009'
- add:
    entry:
      id: cal.1961-02.defense-abm
      when: Feb., early
      date: 1961-02
      thread: defense-abm
      c: 'The Joint Chiefs'' split recommendations to McNamara on Nike-Zeus. Lemnitzer, Burke and Decker for limited production,
        units deployed by early 1965: "an indispensable element in deterrence," "an urgent requirement." White against a costly
        and inadequate system; research for "a truly effective" one.'
      n: '[[w.poole-joint-chiefs-of-staff]], 51–52. Names: McNamara, Lemnitzer, Burke, Decker, White.'
      src:
        c: acd61ce0
        rows:
        - 'w.poole-joint-chiefs-of-staff 51–52: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:burke-arleigh-a
      - name:decker-george-h
      - name:white-thomas-d
    section: '196102'
- add:
    entry:
      id: cal.1961-04-24.defense-abm
      when: Apr. 24
      date: '1961-04-24'
      thread: defense-abm
      c: 'The Joint Chiefs to McNamara on York''s reassessment of missile defense, $2.4 billion spent on Nike-Zeus by the
        end of fiscal 1961, the prospect for cities "bleak": an ABM system to be built at a pace "commensurate with technological
        advancement"; still split on producing Nike-Zeus; BMEWS only part of a future warning system.'
      n: '[[w.poole-joint-chiefs-of-staff]], 52. Names: McNamara, York.'
      src:
        c: 7ba071c6
        rows:
        - 'w.poole-joint-chiefs-of-staff 52: all'
      tags:
      - name:mcnamara-robert-s
      - name:york-herbert-f
    section: '196104'
- add:
    entry:
      id: cal.1961-09.defense-abm
      when: Sept.
      date: 1961-09
      thread: defense-abm
      c: The Joint Chiefs ask McNamara for 200 F-106 or F-4 interceptors, research on an Improved Manned Interceptor, and
        a "minimum production program" for Nike-Zeus, twelve batteries by fiscal 1967, for its "psychological impact" amid
        Berlin and the Soviet tests. McNamara agrees on Nike-Zeus, twelve batteries for six cities and 39 million people,
        not on the interceptors; most of the $400 million for civil defense to fallout shelters.
      n: '[[w.poole-joint-chiefs-of-staff]], 53. Names: McNamara.'
      src:
        c: 8fc12475
        rows:
        - 'w.poole-joint-chiefs-of-staff 53: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1962-04.defense-abm
      when: Apr., spring
      date: 1962-04
      thread: defense-abm
      c: The $76.2 million for Nike-Zeus preproduction cut from the budget until it is shown effective.
      n: '[[w.poole-joint-chiefs-of-staff]], 53. Check: the month and who cut it; Poole: "In the spring of 1962."'
      src:
        c: df380093
        rows:
        - 'w.poole-joint-chiefs-of-staff 53: all'
    section: '196204'
- add:
    entry:
      id: cal.1962-07.defense-abm
      when: July
      date: 1962-07
      thread: defense-abm
      c: A Nike-Zeus missile fired from Kwajalein intercepts a target vehicle launched from California.
      n: '[[w.poole-joint-chiefs-of-staff]], 54–55. Check: the day; Poole: three months before Oct. 6.'
      src:
        c: a8538a3a
        rows:
        - 'w.poole-joint-chiefs-of-staff 54–55: all'
    section: '196207'
- add:
    entry:
      id: cal.1962-10-06.defense-abm
      when: Oct. 6
      date: '1962-10-06'
      thread: defense-abm
      c: 'McNamara''s draft memorandum on missile defense: Nike-Zeus continued only in a restricted way; Nike-X, with the
        Sprint missile and a multifunction array radar, developed in full; a deployment decision put off to mid-1964, 26 batteries
        by 1972–73. The cost of defense at least twice that of the offense to overcome it, but "very substantial development
        expenditures" even if deployment is unlikely.'
      n: '[[w.poole-joint-chiefs-of-staff]], 54–55. Names: McNamara.'
      src:
        c: 190c107b
        rows:
        - 'w.poole-joint-chiefs-of-staff 54–55: all'
      tags:
      - name:mcnamara-robert-s
    section: '196210'
- add:
    entry:
      id: cal.1962-11-10.defense-abm
      when: Nov. 10
      date: '1962-11-10'
      thread: defense-abm
      c: 'The Joint Chiefs answer McNamara on missile defense. Wheeler and Anderson: its lack "the most glaring deficiency
        in the US military posture"; deploy Nike-Zeus from 1967, Nike-X by 1971; a Soviet shield around Leningrad apparently
        begun. Taylor: "of vital national importance to embark at once upon a production and development program." LeMay:
        develop both, deploy Nike-Zeus only when proven.'
      n: '[[w.poole-joint-chiefs-of-staff]], 55. See [[cal.1962-10-06.defense-abm]]. Names: McNamara, Wheeler, Anderson, Taylor,
        LeMay.'
      src:
        c: c033f381
        rows:
        - 'w.poole-joint-chiefs-of-staff 55: all'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:anderson-george-w-jr
      - name:taylor-maxwell
      - name:lemay-curtis-e
    section: '196211'
- add:
    entry:
      id: cal.1962-11-20.defense-abm
      when: Nov. 20
      date: '1962-11-20'
      thread: defense-abm
      c: 'McNamara sends Kennedy his views and the Chiefs'' on missile defense: a Soviet reaction "almost surely," penetration
        aids at a tenth to half the cost; minor powers "could still threaten cities ... not defended."'
      n: '[[w.poole-joint-chiefs-of-staff]], 55. See [[cal.1962-10-06.defense-abm]]. Names: McNamara, Kennedy.'
      src:
        c: 62d83f36
        rows:
        - 'w.poole-joint-chiefs-of-staff 55: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196211'
- add:
    entry:
      id: cal.1962-11-13.defense
      when: Nov. 13
      date: '1962-11-13'
      thread: defense
      c: 'McNamara''s draft memorandum on continental air defense, "negligible" against a missile strike followed by bombers:
        thirty dispersal bases and ten single-squadron sites; twenty Nike-Hercules batteries from SAC''s bomber bases to missile
        sites; eight regular and eleven Guard interceptor squadrons retired in fiscal 1965; ten SAGE centers retired; TRACE
        disapproved. The Joint Chiefs dispute much of it; LeMay for 196 improved interceptors, Wheeler and Anderson against.'
      n: '[[w.poole-joint-chiefs-of-staff]], 54. Names: McNamara, LeMay, Wheeler, Anderson.'
      src:
        c: 93fa9309
        rows:
        - 'w.poole-joint-chiefs-of-staff 54: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemay-curtis-e
      - name:wheeler-earle
      - name:anderson-george-w-jr
    section: '196211'
- add:
    entry:
      id: cal.1962-12-03.defense-2
      when: Dec. 3
      date: '1962-12-03'
      thread: defense
      c: 'McNamara''s revised memoranda. Continental defense now "inadequate," not "negligible": the ten single-squadron bases
        dropped and the 19 interceptor squadrons kept, as the Chiefs asked; the Nike-Hercules still to the missile sites;
        a war game of the bomber threat. General purpose forces: no change in the force levels.'
      n: '[[w.poole-joint-chiefs-of-staff]], 54, 69. See [[cal.1962-11-13.defense]]. Names: McNamara.'
      src:
        c: cce81a75
        rows:
        - 'w.poole-joint-chiefs-of-staff 54, 69: all'
      tags:
      - name:mcnamara-robert-s
    section: '196212'
- add:
    entry:
      id: cal.1963-10-09.defense
      when: Oct. 9
      date: '1963-10-09'
      thread: defense
      c: 'McNamara''s draft memorandum on continental defense: a "low" program, 456 interceptors and Nike-X kept in development,
        or a "high," 216 advanced interceptors, ABMs for the 22 largest urban areas by fiscal 1973 and more civil defense;
        too soon to choose. An "interim" program meanwhile: interceptors from 829 to 456. The Chiefs: "insufficient"; 648
        interceptors; Nike-X "as a matter of priority." McNamara keeps the 829 through fiscal 1966.'
      n: '[[w.poole-joint-chiefs-of-staff]], 56–57. Names: McNamara.'
      src:
        c: b12efc77
        rows:
        - 'w.poole-joint-chiefs-of-staff 56–57: all'
      tags:
      - name:mcnamara-robert-s
    section: '196310'
- add:
    entry:
      id: cal.1964-05-21.defense
      when: May 21
      date: '1964-05-21'
      thread: defense
      c: McNamara's tentative guidance on continental defense doubts a large interceptor force; the Chiefs to compare 782
        aircraft with 372 for 1967. The improved interceptor, Nike-X and the shelters all put off. The Chiefs but Harold Johnson
        oppose any cut.
      n: '[[w.poole-joint-chiefs-of-staff]], 57–58. Names: McNamara, Harold K. Johnson.'
      src:
        c: 66fbc374
        rows:
        - 'w.poole-joint-chiefs-of-staff 57–58: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-harold-k
    section: '196405'
- add:
    entry:
      id: cal.1964-11-05.defense-2
      when: Nov. 5
      date: '1964-11-05'
      thread: defense
      c: 'McNamara''s draft memorandum on continental defense: about 160 million dead with no protection, 120 million with
        $5 billion of civil defense, 80 million with a balanced $30 billion. Century interceptors to 330 by fiscal 1970; the
        DEW Line''s extension aircraft and picket ships phased out; $5 million for the F-12A.'
      n: '[[w.poole-joint-chiefs-of-staff]], 58. Names: McNamara.'
      src:
        c: 5d256a47
        rows:
        - 'w.poole-joint-chiefs-of-staff 58: all'
      tags:
      - name:mcnamara-robert-s
    section: '196411'
- check:
    id: cal.1962-12-27.defense
    text: 'Check: Poole, 55, has Kennedy, McNamara, Taylor and Wheeler at Palm Beach "late in December" on missile defense,
      Kennedy ruling for development without production: "too expensive to buy the proportionate share of $19 billion spread
      over ten years for Nike-Zeus at this stage." The same meeting?'
- add:
    entry:
      id: cal.1961-01-05.defense-2
      when: Jan. 5
      date: '1961-01-05'
      thread: defense
      c: The NSC rejects a "radical reallocation" of resources to strengthen conventional forces; two or more concurrent crises
        would degrade the general war posture "to an unacceptable degree."
      n: '[[w.poole-joint-chiefs-of-staff]], 61.'
      src:
        c: 85010a71
        rows:
        - 'w.poole-joint-chiefs-of-staff 61: all'
    section: '196101'
- add:
    entry:
      id: cal.1961-02-01.defense-3
      when: Feb. 1
      date: '1961-02-01'
      thread: defense
      c: 'The Deputy Assistant Secretary for International Security Affairs tells the Joint Chiefs to assume two concurrent
        aggressions, by not more than five lightly armed divisions each, in Laos and the Congo. The J-5: 45,000 more men in
        fiscal 1961 and 74,000 in 1962. White: strength "more than adequate," but for airlift.'
      n: '[[w.poole-joint-chiefs-of-staff]], 62. Names: White.'
      src:
        c: 6bf4f8a5
        rows:
        - 'w.poole-joint-chiefs-of-staff 62: all'
      tags:
      - name:white-thomas-d
    section: '196102'
- add:
    entry:
      id: cal.1961-02-09.defense
      when: Feb. 9
      date: '1961-02-09'
      thread: defense
      c: 'The Joint Chiefs answer Nitze''s request to compare deployment capabilities at crisis points, ninety days into a
        war: 10 American divisions to 43 Communist in Central Europe; 3 to 4 in the Congo; 5 to 14 in Iran; 3 to 23 in South
        Vietnam.'
      n: '[[w.poole-joint-chiefs-of-staff]], 62. Names: Nitze.'
      src:
        c: dd8295c1
        rows:
        - 'w.poole-joint-chiefs-of-staff 62: all'
      tags:
      - name:nitze-paul
    section: '196102'
- add:
    entry:
      id: cal.1961-02-17.defense
      when: Feb. 17
      date: '1961-02-17'
      thread: defense
      c: 'Nitze''s limited war task force reports: 3,000 more men for the Army''s Special Forces, 2,000 to bring the 1st Infantry
        Division toward combat readiness, 2,000 Marines; nothing more in fiscal 1961, $775 million more in 1962, chiefly for
        readiness and training, airlift and procurement.'
      n: '[[w.poole-joint-chiefs-of-staff]], 62–63. See [[cal.1961-01-24.defense]]. Names: Nitze.'
      src:
        c: 35e745bf
        rows:
        - 'w.poole-joint-chiefs-of-staff 62–63: all'
      tags:
      - name:nitze-paul
    section: '196102'
- add:
    entry:
      id: cal.1961-05-01.defense
      when: May 1
      date: '1961-05-01'
      thread: defense
      c: 'The Joint Chiefs, Lemnitzer in Southeast Asia, send McNamara their split views on his directive to plan a unified
        command of the Strategic Army Corps and Tactical Air Command: Decker and White for it, provided Navy and Marine units
        come in later; Burke for a joint task force only; Shoup for a doctrine only.'
      n: '[[w.poole-joint-chiefs-of-staff]], 63. Names: McNamara, Lemnitzer, Decker, White, Burke, Shoup.'
      src:
        c: 310366c4
        rows:
        - 'w.poole-joint-chiefs-of-staff 63: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:decker-george-h
      - name:white-thomas-d
      - name:burke-arleigh-a
      - name:shoup-david-m
    section: '196105'
- add:
    entry:
      id: cal.1961-08-21.defense
      when: Aug. 21
      date: '1961-08-21'
      thread: defense
      c: McNamara tells the Joint Chiefs to nominate an officer to head the unified command of the Army's and the Air Force's
        combat-ready forces in the United States.
      n: '[[w.poole-joint-chiefs-of-staff]], 63. See [[cal.1961-05-01.defense]]. Names: McNamara.'
      src:
        c: 1bf34956
        rows:
        - 'w.poole-joint-chiefs-of-staff 63: all'
      tags:
      - name:mcnamara-robert-s
    section: '196108'
- add:
    entry:
      id: cal.1961-09-19.defense
      when: Sept. 19
      date: '1961-09-19'
      thread: defense
      c: 'Kennedy approves Adams, the Joint Chiefs'' choice, to command the new Strike Command. Its headquarters open at MacDill,
        Fla., a month later: the combat-ready forces of Tactical Air and Continental Army Commands, eight divisions, 42 tactical
        and 19 troop carrier squadrons by January 1962.'
      n: '[[w.poole-joint-chiefs-of-staff]], 63. See [[cal.1961-08-21.defense]]. Names: Kennedy.'
      src:
        c: 71cea533
        rows:
        - 'w.poole-joint-chiefs-of-staff 63: all'
      tags:
      - name:kennedy-john-f
    section: '196109'
- add:
    entry:
      id: cal.1961-04.defense-2
      when: Apr., early
      date: 1961-04
      thread: defense
      c: 'White, on the growing Soviet submarine missile threat, proposes a Director of ASW Planning with a joint staff and
        a central agency for antisubmarine research. Decker: treat it world-wide; Burke: the Navy''s direction already "optimum
        integration," mobile Polaris the answer.'
      n: '[[w.poole-joint-chiefs-of-staff]], 63–64. Names: White, Decker, Burke.'
      src:
        c: d716d0b3
        rows:
        - 'w.poole-joint-chiefs-of-staff 63–64: all'
      tags:
      - name:white-thomas-d
      - name:decker-george-h
      - name:burke-arleigh-a
    section: '196104'
- add:
    entry:
      id: cal.1961-05-03.defense
      when: May 3
      date: '1961-05-03'
      thread: defense
      c: The Joint Chiefs, after long discussion of antisubmarine warfare, agree to await the analysis McNamara has asked
        for.
      n: '[[w.poole-joint-chiefs-of-staff]], 64. See [[cal.1961-04.defense-2]]. Names: McNamara.'
      src:
        c: f2183d10
        rows:
        - 'w.poole-joint-chiefs-of-staff 64: all'
      tags:
      - name:mcnamara-robert-s
    section: '196105'
- add:
    entry:
      id: cal.1961-04-20.defense-2
      when: Apr. 20
      date: '1961-04-20'
      thread: defense
      c: 'Kennedy asks whether more conventional strength is needed. Connally, the Secretary of the Navy, in charge: no "shopping
        list," but "an over-all perspective" and "new methods and techniques"; McNamara wants add-ons for the fiscal 1962
        budget.'
      n: '[[w.poole-joint-chiefs-of-staff]], 64. Names: Kennedy, Connally, McNamara.'
      src:
        c: 984b7fff
        rows:
        - 'w.poole-joint-chiefs-of-staff 64: all'
      tags:
      - name:kennedy-john-f
      - name:connally-john
      - name:mcnamara-robert-s
    section: '196104'
- add:
    entry:
      id: cal.1961-05-05.defense-2
      when: May 5
      date: '1961-05-05'
      thread: defense
      c: 'The Joint Chiefs to McNamara: the forces "highly trained, ready and competent" for the Basic War Plan; eleven Army
        and three Marine division/wing teams combat-ready; a 382-plane Composite Air Strike Force; 352 warships at sea or
        ready. The services ask 104,960 more men at $2.641 billion.'
      n: '[[w.poole-joint-chiefs-of-staff]], 64–65. See [[cal.1961-04-20.defense-2]]. Names: McNamara.'
      src:
        c: 444b4cea
        rows:
        - 'w.poole-joint-chiefs-of-staff 64–65: all'
      tags:
      - name:mcnamara-robert-s
    section: '196105'
- add:
    entry:
      id: cal.1961-05-08.defense
      when: May 8
      date: '1961-05-08'
      thread: defense
      c: McNamara meets the Joint Chiefs; the services' figures too high to support in full.
      n: '[[w.poole-joint-chiefs-of-staff]], 65. Names: McNamara.'
      src:
        c: 076feb16
        rows:
        - 'w.poole-joint-chiefs-of-staff 65: all'
      tags:
      - name:mcnamara-robert-s
    section: '196105'
- add:
    entry:
      id: cal.1961-05-10.defense-2
      when: May 10
      date: '1961-05-10'
      thread: defense
      c: 'McNamara to Kennedy, for Gilpatric, Connally and himself: the conventional forces "adequate for their purpose,"
        assuming no more than one large commitment at a time and the nuclear threshold at 250,000 to 300,000 American troops.
        An airborne brigade on Okinawa, 22 transports reactivated, equipment and ammunition sooner, by reprogramming; $100
        million more in fiscal 1962 to begin the ROAD divisions.'
      n: 'McNamara to Kennedy, [FRUS 1961–63, VIII: National Security Policy, doc. 27](https://history.state.gov/historicaldocuments/frus1961-63v08/d27)
        (May 10, 1961) (the assumptions; the $100 million). [[w.poole-joint-chiefs-of-staff]], 23, 65. Names: McNamara, Kennedy,
        Gilpatric, Connally.'
      src:
        c: 9a5fad15
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v08/d27: A, C'
        - 'w.poole-joint-chiefs-of-staff 23, 65: all'
        - 'via w.poole-joint-chiefs-of-staff 23 n.19: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - name:gilpatric-roswell-l
      - name:connally-john
    section: '196105'
- add:
    entry:
      id: cal.1961-09-15.defense-2
      when: Sept. 15
      date: '1961-09-15'
      thread: defense
      c: 'The Joint Chiefs to McNamara: the services'' enlarged force objectives "fundamentally sound." 16 Army divisions
        through fiscal 1967; $3.5 billion for Army procurement in fiscal 1963, against Eisenhower''s $2.2 billion; 15 attack
        and 10 ASW carriers; 1,300 tactical aircraft.'
      n: '[[w.poole-joint-chiefs-of-staff]], 66. Names: McNamara.'
      src:
        c: 3d4f8766
        rows:
        - 'w.poole-joint-chiefs-of-staff 66: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-22.defense
      when: Sept. 22
      date: '1961-09-22'
      thread: defense
      c: 'McNamara circulates a tentative five-year program for the general purpose forces: 14 Army divisions, three Marine
        division/wing teams, 15 attack and nine ASW carriers; Air Force tactical fighters from 1,278 in mid-1963 to 1,588
        in mid-1966.'
      n: '[[w.poole-joint-chiefs-of-staff]], 66. Names: McNamara.'
      src:
        c: '78212472'
        rows:
        - 'w.poole-joint-chiefs-of-staff 66: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-11.defense
      when: Nov.
      date: 1961-11
      thread: defense
      c: McNamara weighs 14 regular Army divisions against 16, two new regular divisions to replace the two Guard divisions
        when they are released. Taylor, at the White House, strongly for 16.
      n: '[[w.poole-joint-chiefs-of-staff]], 67. Names: McNamara, Taylor.'
      src:
        c: c27e7832
        rows:
        - 'w.poole-joint-chiefs-of-staff 67: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
    section: '196111'
- add:
    entry:
      id: cal.1961-12-01.defense
      when: Dec. 1
      date: '1961-12-01'
      thread: defense
      c: 'The Joint Chiefs to McNamara: 16 divisions required "to conduct contingency operations in two areas simultaneously
        while maintaining an acceptable general war posture." Decker for 16 regulars; Shoup if the Army''s ceiling stays at
        960,000; Anderson and LeMay for mobilizing two Guard divisions; Lemnitzer with Decker: calling reservists in each
        crisis "an unacceptable burden."'
      n: '[[w.poole-joint-chiefs-of-staff]], 67. Names: McNamara, Decker, Shoup, Anderson, LeMay, Lemnitzer.'
      src:
        c: 337a8f45
        rows:
        - 'w.poole-joint-chiefs-of-staff 67: all'
      tags:
      - name:mcnamara-robert-s
      - name:decker-george-h
      - name:shoup-david-m
      - name:anderson-george-w-jr
      - name:lemay-curtis-e
      - name:lemnitzer-lyman-l
    section: '196112'
- add:
    entry:
      id: cal.1962-01-02.defense
      when: Jan. 2
      date: '1962-01-02'
      thread: defense
      c: 'A conference of Kennedy, Johnson, Taylor, McNamara and Gilpatric settles the Army at 16 regular divisions. The program
        for fiscal 1963–67: three Marine division/wing teams, 15 attack and nine ASW carriers, 14 cruisers, some 250 destroyers,
        about 100 attack submarines; 21 tactical fighter wings.'
      n: '[[w.poole-joint-chiefs-of-staff]], 67–68. See [[cal.1961-12-01.defense]]. Names: Kennedy, Johnson, Taylor, McNamara,
        Gilpatric.'
      src:
        c: 176fa219
        rows:
        - 'w.poole-joint-chiefs-of-staff 67–68: all'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
    section: '196201'
- add:
    entry:
      id: cal.1962-04.defense-4
      when: Apr.
      date: 1962-04
      thread: defense
      c: 'McNamara orders the Army to examine ways of "quantum increases in mobility." The result: an air assault division
        of 459 helicopters and fixed-wing aircraft, able to lift itself in three movements; McNamara agrees to a provisional
        division.'
      n: '[[w.poole-joint-chiefs-of-staff]], 69. Check: the day. Names: McNamara.'
      src:
        c: f9719cc4
        rows:
        - 'w.poole-joint-chiefs-of-staff 69: all'
      tags:
      - name:mcnamara-robert-s
    section: '196204'
- add:
    entry:
      id: cal.1962-10-31.defense
      when: Oct. 31
      date: '1962-10-31'
      thread: defense
      c: 'McNamara''s draft memorandum on the general purpose forces repeats the levels of August, citing the Special Studies
        Group. Central Europe: 34 NATO divisions to contain a Warsaw Pact attack, 55 to 60 to hold; Iran, nine divisions and
        800 aircraft on the Zagros; Thailand and Vietnam, six American divisions against 21 Chinese and North Vietnamese;
        Korea, thirteen. The Chiefs: until forces suffice, NATO must be ready to use tactical nuclear weapons early.'
      n: '[[w.poole-joint-chiefs-of-staff]], 68–70. Names: McNamara.'
      src:
        c: a345492a
        rows:
        - 'w.poole-joint-chiefs-of-staff 68–70: all'
      tags:
      - name:mcnamara-robert-s
    section: '196210'
- add:
    entry:
      id: cal.1962-11-21.defense
      when: Nov. 21
      date: '1962-11-21'
      thread: defense
      c: 'The Joint Chiefs'' critique of McNamara''s memorandum on the general purpose forces: "fundamental" differences,
        in quality and quantity, from the services'' recommendations.'
      n: '[[w.poole-joint-chiefs-of-staff]], 69. See [[cal.1962-10-31.defense]]. Names: McNamara.'
      src:
        c: de4fbc28
        rows:
        - 'w.poole-joint-chiefs-of-staff 69: all'
      tags:
      - name:mcnamara-robert-s
    section: '196211'
- add:
    entry:
      id: cal.1962-11-09.defense
      when: Nov. 9
      date: '1962-11-09'
      thread: defense
      c: Kennedy asks McNamara to assume concurrent crises in Cuba, Central Europe and the Far East. Would interceptor and
        tactical air forces suffice? Would production meet the needs of 1964 or 1965? The Chiefs would answer that the forces
        are inadequate for three fronts.
      n: '[[w.poole-joint-chiefs-of-staff]], 73. Names: Kennedy, McNamara.'
      src:
        c: 6e4d801b
        rows:
        - 'w.poole-joint-chiefs-of-staff 73: all'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
    section: '196211'
- add:
    entry:
      id: cal.1963-05.defense-2
      when: May
      date: 1963-05
      thread: defense
      c: 'McNamara answers Kennedy on tactical air forces: "fair to say that we have sufficient aircraft programmed." His
        figures, a Sino-Soviet edge of 12,965 to 11,564 in 1963, a Free World edge of 10,367 to 6,980 in 1968.'
      n: '[[w.poole-joint-chiefs-of-staff]], 73. See [[cal.1962-11-09.defense]]. Names: McNamara, Kennedy.'
      src:
        c: d80cee0b
        rows:
        - 'w.poole-joint-chiefs-of-staff 73: all'
      tags:
      - name:mcnamara-robert-s
      - name:kennedy-john-f
    section: '196305'
- add:
    entry:
      id: cal.1963-10-10.defense-2
      when: Oct. 10
      date: '1963-10-10'
      thread: defense
      c: 'McNamara''s draft memorandum on the ground forces: 16 divisions and the provisional Air Assault Division enough
        for NATO and one emergency elsewhere. His Index of Combat Effectiveness: an American division about twice a Soviet
        one, the 58 to 75 Soviet divisions equal to 29 to 38. Wheeler: 1.2 to 1.7; NATO forces could delay and defend on the
        Rhine. Taylor, McDonald and Shoup would replace the 58-page rationale with eight pages.'
      n: '[[w.poole-joint-chiefs-of-staff]], 71–72. Names: McNamara, Wheeler, Taylor, McDonald, Shoup.'
      src:
        c: 52aa35cc
        rows:
        - 'w.poole-joint-chiefs-of-staff 71–72: all'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:mcdonald-david-l
      - name:shoup-david-m
    section: '196310'
- add:
    entry:
      id: cal.1963-10.defense
      when: Oct.
      date: 1963-10
      thread: defense
      c: 'Taylor to McNamara, separately: the Index of Combat Effectiveness "has no practical validity"; "in war the moral
        is to the physical as three is to one"; Allied Command Europe could not defend without early recourse to nuclear weapons,
        "the unanimous judgment of the military leaders of NATO."'
      n: '[[w.poole-joint-chiefs-of-staff]], 72. Check: the day. See [[cal.1963-10-10.defense-2]]. Names: Taylor, McNamara.'
      src:
        c: eb0e01d5
        rows:
        - 'w.poole-joint-chiefs-of-staff 72: all'
      tags:
      - name:taylor-maxwell
      - name:mcnamara-robert-s
    section: '196310'
- add:
    entry:
      id: cal.1963-12.defense-2
      when: Dec.
      date: 1963-12
      thread: defense
      c: 'McNamara''s final memorandum on the general purpose forces: 16 Army divisions; an American division 1.2 to 1.7 Soviet,
        the Army''s figures; NATO "should be able at least to delay to and defend on the line of the Rhine" without nuclear
        weapons; Taylor''s, McDonald''s and Shoup''s rationale an appendix. Tactical air 22 wings in mid-1965, 24 by mid-1968:
        "we can gain air superiority in a non-nuclear conflict in Europe or anywhere else."'
      n: '[[w.poole-joint-chiefs-of-staff]], 72–73. See [[cal.1963-10-10.defense-2]]. Names: McNamara, Taylor, McDonald, Shoup.'
      src:
        c: bef555ac
        rows:
        - 'w.poole-joint-chiefs-of-staff 72–73: all'
      tags:
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:mcdonald-david-l
      - name:shoup-david-m
    section: '196312'
- add:
    entry:
      id: cal.1964-10.defense
      when: Oct., early
      date: 1964-10
      thread: defense
      c: 'McNamara''s tentative proposals: 16 Army divisions, the Air Assault Division disbanded in mid-1965, about $2 billion
        for procurement; five divisions in Germany, two in Korea, one in the hemisphere, eight at home. 24 tactical fighter
        wings, the F-4 program cut from 14 wings to 12; the Quick Reaction Alert aircraft replaced by Pershing. Carriers 15,
        then 14 in fiscal 1970 and 13 in 1973. Harold Johnson holds out for 18 divisions.'
      n: '[[w.poole-joint-chiefs-of-staff]], 76–78. Names: McNamara, Harold K. Johnson.'
      src:
        c: 160d909e
        rows:
        - 'w.poole-joint-chiefs-of-staff 76–78: all'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-harold-k
    section: '196410'
- add:
    entry:
      id: cal.1964-11.defense-2
      when: Nov.
      date: 1964-11
      thread: defense
      c: 'McNamara''s November memorandum on the general purpose forces: the 16 troopships still to be phased out; four nuclear
        attack submarines and ten destroyer escorts for fiscal 1966; "successful prosecution of the War-at-Sea is within our
        grasp."'
      n: '[[w.poole-joint-chiefs-of-staff]], 78–79. Names: McNamara.'
      src:
        c: 89db3e0d
        rows:
        - 'w.poole-joint-chiefs-of-staff 78–79: all'
      tags:
      - name:mcnamara-robert-s
    section: '196411'
