      when: Apr. 12
      date: '1962-04-12'
      thread: testing
      c: 'A White House meeting: Kennedy "decided to go ahead with reduction by types," as Lemnitzer, Gilpatric and Rusk argue,
        against ACDA''s categories.'
      n: '[[w.poole-joint-chiefs-of-staff]], 85. Names: Kennedy, Lemnitzer, Gilpatric, Rusk.'
      src:
