    entry:
      id: cal.1964-03.defense
      when: Mar.
      date: 1964-03
      thread: defense
      c: 'JSOP-69 completed: all the Chiefs for 37 Polaris boats in fiscal 1966, not 35; LeMay for 1,500 Minuteman, not 1,200;
        Taylor with McNamara. The Joint Chiefs, for the second time that year, recommend project definition for the Advanced
        Manned Strategic Aircraft, first in January.'
      n: '[[w.poole-joint-chiefs-of-staff]], 48–49. Names: LeMay, Taylor, McNamara.'
      src:
        c: 89a6b003
        rows:
        - 'w.poole-joint-chiefs-of-staff 48–49: all'
