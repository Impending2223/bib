      when: Sept. 14
      date: '1962-09-14'
      thread: space
      also:
      - testing
      c: 'The Joint Chiefs to McNamara: a declaratory ban on weapons in orbit would inhibit the American space program and
        let the Soviets go on in secret.'
      n: '[[w.poole-joint-chiefs-of-staff]], 87–88. Names: McNamara.'
      src:
        c: e9f6e223
        rows:
        - 'w.poole-joint-chiefs-of-staff 87–88: all'
