        for a BNSP in single document form and, at the moment, am not persuaded that the NSC Planning Board should be reactivated."'
      n: 'McNamara to Wheeler, Mar. 3, 1965, quoted in [FRUS 1964–68, X: National Security Policy, doc. 75](https://history.state.gov/historicaldocuments/frus1964-68v10/d75),
