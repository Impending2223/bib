      date: '1964-04-16'
      thread: testing
      c: 'The United States offers the freeze plan at Geneva, the allies having approved. The Soviets: legalized espionage
        that would not "get rid of one missile or bomber."'
      n: '[[w.poole-joint-chiefs-of-staff]], 91. See [[cal.1964-03-12.testing]].'
      src:
