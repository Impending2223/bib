      date: '1961-03-11'
      thread: defense
      c: 'The Joint Chiefs to McNamara: generally agreed with Rusk''s views, NSC 5906/1 broad enough to take them in. Budget
        increases needed, and in Europe modernized American forces and a larger allied share; NATO "must not flinch" from
        nuclear weapons; selective use need not mean all-out war, as SACEUR judges.'
      n: '[[w.poole-joint-chiefs-of-staff]], 18. To check: JCSM-153-61 to SecDef, Mar. 11, 1961, JCS 2101/412, National Archives,
        RG 218, JCS Records, JMF 3001 (4 Feb 61) sec. 1 (cited by [[w.poole-joint-chiefs-of-staff]], 18 n.2). See [[cal.1961-02-04.defense-2]].
        Names: McNamara, Rusk.'
      src:
        c: b7ddf6e0
        rows:
