        limited to one-for-one replacement; inspection of closed and operating plants and of undeclared places.'
      n: '[[w.poole-joint-chiefs-of-staff]], 91–92.'
      src:
        c: 967d5f64
        rows:
        - 'w.poole-joint-chiefs-of-staff 91–92: all'
