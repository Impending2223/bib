    entry:
      id: cal.1961-08-15.defense
      when: Aug. 15
      date: '1961-08-15'
      thread: defense
      c: The Joint Chiefs, asked by McNamara to reconsider, report each member's position reaffirmed.
      n: '[[w.poole-joint-chiefs-of-staff]], 37. See [[cal.1961-08-03.defense-2]]. Names: McNamara.'
      src:
