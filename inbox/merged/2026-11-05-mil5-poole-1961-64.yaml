      when: Oct. 8
      date: '1963-10-08'
      thread: testing
      c: 'The Joint Chiefs to McNamara: the Outline of April 1962 poses "unwarranted risks"; no Chinese participation in Stage
        I, no control organization first, an untested verification system, no provision for quick withdrawal. McNamara supports
        most of it to ACDA, for more modest goals.'
      n: '[[w.poole-joint-chiefs-of-staff]], 89. Names: McNamara.'
      src:
        c: fbfa5b1e
        rows:
        - 'w.poole-joint-chiefs-of-staff 89: all'
      tags:
      - name:mcnamara-robert-s
    section: '196310'
- add:
    entry:
      id: cal.1963-12.testing
      when: Dec.
      date: 1963-12
      thread: testing
      c: 'ACDA proposes a 30 percent cut in American and Soviet strategic delivery vehicles over three years. The Joint Chiefs:
        it would disrupt NATO and endanger American security. McNamara to Taylor: "serious problems," but "we must in any
        event develop a firm US position."'
      n: '[[w.poole-joint-chiefs-of-staff]], 89. Names: McNamara, Taylor.'
      src:
