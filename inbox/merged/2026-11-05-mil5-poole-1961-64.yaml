      - name:mcnamara-robert-s
    section: '196403'
- add:
    entry:
      id: cal.1964-05-16.defense
      when: May 16
      date: '1964-05-16'
      thread: defense
      c: 'McNamara''s tentative force guidance on the strategic forces, circulated: assured destruction possible with fewer
        missiles than programmed.'
      n: '[[w.poole-joint-chiefs-of-staff]], 48. Names: McNamara.'
      src:
        c: f114083b
        rows:
        - 'w.poole-joint-chiefs-of-staff 48: all'
      tags:
      - name:mcnamara-robert-s
    section: '196405'
- add:
    entry:
      id: cal.1964-08-19.defense
      when: Aug. 19
      date: '1964-08-19'
      thread: defense
      c: 'Air Force officers brief the Joint Chiefs on the Advanced Manned Strategic Aircraft: cost effectiveness, employment,
        targets. Under Wheeler the Chiefs recommend unanimously proceeding to project definition. McNamara: $5 million and
        $3 million, against the Air Force''s $15 million for fiscal 1965 and $77 million for 1966; a short-range attack missile
        instead.'
      n: '[[w.poole-joint-chiefs-of-staff]], 49. Names: Wheeler, McNamara.'
      src:
        c: c1a38231
        rows:
        - 'w.poole-joint-chiefs-of-staff 49: all'
      tags:
      - name:wheeler-earle
      - name:mcnamara-robert-s
    section: '196408'
- add:
    entry:
      id: cal.1964-11-05.defense
      when: Nov. 5
      date: '1964-11-05'
      thread: defense
      c: 'McNamara''s draft presidential memorandum on the strategic forces: Minuteman capped at 1,000 launchers, B-52s slightly
        reduced, Polaris boats from 35 to 38 in fiscal 1966. Wheeler, separately: fewer Minuteman would dangerously erode
        American "relative superiority."'
      n: '[[w.poole-joint-chiefs-of-staff]], 48–49. Names: McNamara, Wheeler.'
      src:
        c: 451af130
        rows:
        - 'w.poole-joint-chiefs-of-staff 48–49: all'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
