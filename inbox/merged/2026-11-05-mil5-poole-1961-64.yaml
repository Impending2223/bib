      when: Feb. 15
      date: '1964-02-15'
      thread: testing
      c: 'The Joint Chiefs answer Nitze on freezing ABMs with delivery vehicles, a 68-page "preliminary" study: deterrence
        possible under one-for-one replacement in kind; with modernization, problems of the utmost complexity; inspection
        would need unprecedented intrusions.'
      n: '[[w.poole-joint-chiefs-of-staff]], 90. Names: Nitze.'
      src:
