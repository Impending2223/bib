      - name:taylor-maxwell
      - name:mcnamara-robert-s
    section: '196211'
- add:
    entry:
      id: cal.1963-04.testing-3
      when: Apr.
      date: 1963-04
      thread: testing
      c: American negotiators privately approach the Soviets on transferring fissionable material; the proposal presented
        at Geneva four months later, Kennedy allowing up to 100,000 kilograms and a ratio of two to one.
      n: '[[w.poole-joint-chiefs-of-staff]], 88. Names: Kennedy.'
      src:
        c: 7041116c
        rows:
        - 'w.poole-joint-chiefs-of-staff 88: all'
      tags:
      - name:kennedy-john-f
    section: '196304'
- add:
    entry:
      id: cal.1963-08.testing-2
      when: Aug., late
      date: 1963-08
      thread: testing
      c: Taylor directs the Joint Staff to set out terms for a comprehensive disarmament treaty and measure them against the
        Outline of April 1962.
      n: '[[w.poole-joint-chiefs-of-staff]], 89. Names: Taylor.'
      src:
        c: ec33de34
        rows:
        - 'w.poole-joint-chiefs-of-staff 89: all'
      tags:
      - name:taylor-maxwell
    section: '196308'
