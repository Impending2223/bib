    section: '196209'
- add:
    entry:
      id: cal.1962-09.testing-2
      when: Sept.
      date: 1962-09
      thread: testing
      c: 'The Joint Chiefs protest to McNamara, the Geneva conference recessed and ACDA reassessing: "while the Soviet position
        on disarmament has remained practically unchanged since June 1960, the US position has been in a constant state of
        evolution."'
      n: '[[w.poole-joint-chiefs-of-staff]], 86. Check: the day. Names: McNamara.'
      src:
        c: c1659eea
        rows:
        - 'w.poole-joint-chiefs-of-staff 86: all'
      tags:
      - name:mcnamara-robert-s
    section: '196209'
- add:
    entry:
      id: cal.1962-10-01.testing
      when: Oct. 1
      date: '1962-10-01'
      thread: testing
      c: 'McNamara answers the Joint Chiefs: their criticism "an oversimplification"; after "massive" analyses "it would indeed
        have been remarkable had no changes occurred." Their views to be aired at the Principals'' and the White House''s
        level.'
      n: '[[w.poole-joint-chiefs-of-staff]], 86. See [[cal.1962-09.testing-2]]. Names: McNamara.'
      src:
        c: 6eb104bf
        rows:
        - 'w.poole-joint-chiefs-of-staff 86: all'
      tags:
      - name:mcnamara-robert-s
    section: '196210'
