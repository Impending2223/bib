      when: Oct. 23
      date: '1962-10-23'
      thread: testing
      c: Nitze asks the Joint Chiefs to assess a "purple telephone" for instant contact with Moscow.
      n: '[[w.poole-joint-chiefs-of-staff]], 87. Names: Nitze.'
