      date: '1961-06-16'
      thread: defense
      c: 'Kaysen, of the NSC staff, to ISA: the transition point from conventional to nuclear response, any war involving
        more than 300,000 to 350,000 troops, "accepted without discussion"; a higher one, with a larger conventional capability,
