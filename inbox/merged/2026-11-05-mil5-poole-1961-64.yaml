    entry:
      id: cal.1962-04-18.testing
      when: Apr. 18
      date: '1962-04-18'
      thread: testing
      c: 'The American "Outline of Basic Provisions" presented at Geneva: in Stage I a 30 percent cut in "illustrative" types,
        missiles, aircraft over 40,000 kilograms, ABMs, tanks, artillery and warships over 400 tons; zones declared; an International
        Disarmament Organization with access to an agreed number of zones.'
      n: '[[w.poole-joint-chiefs-of-staff]], 85–86. See [[cal.1962-04-12.testing]].'
      src:
        c: 0a422fd4
        rows:
        - 'w.poole-joint-chiefs-of-staff 85–86: all'
    section: '196204'
- add:
    entry:
      id: cal.1962-05.testing
      when: May
      date: 1962-05
      thread: testing
      c: The American delegation at Geneva suggests quantities of delivery vehicles for Stage I, foreign bases cut in Stage
        I, zonal inspections put off to Stage II, the ceiling down to 1.9 million.
      n: '[[w.poole-joint-chiefs-of-staff]], 86.'
