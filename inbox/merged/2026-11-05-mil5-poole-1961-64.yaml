    section: '196312'
- add:
    entry:
      id: cal.1964-01-14.testing
      when: Jan. 14
      date: '1964-01-14'
      thread: testing
      c: 'The White House circulates a draft statement: both nations to "freeze where they are the size and number of strategic
        nuclear weapons." The Joint Chiefs oppose it; neither side would accept the inspection.'
      n: '[[w.poole-joint-chiefs-of-staff]], 89–90. See [[cal.1964-01-21.testing]].'
      src:
        c: d80edad2
        rows:
