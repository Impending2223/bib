    entry:
      id: cal.1963-09.defense-2
      when: Sept.
      date: 1963-09
      thread: defense
      c: 'McNamara''s draft memorandum on the strategic forces: by mid-1969, Atlas down to 72, half the Titans retired, 54
        Titan IIs kept; Minuteman silos slowed in fiscal 1967, 1,200 by mid-1969. Every Chief endorses it but LeMay.'
      n: '[[w.poole-joint-chiefs-of-staff]], 47. Names: McNamara, LeMay.'
      src:
        c: a01fd6a9
        rows:
        - 'w.poole-joint-chiefs-of-staff 47: all'
