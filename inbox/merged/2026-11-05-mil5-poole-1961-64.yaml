      when: Sept., mid-month
      date: 1962-09
      thread: testing
      c: 'The Joint Chiefs to McNamara on ACDA''s proposal not to transfer nuclear weapons to non-nuclear states: disadvantages
        "far outweighed" benefits; the United States might wish to help friends "in such fields as security, storage, permissive
        links, and alert procedures."'
      n: '[[w.poole-joint-chiefs-of-staff]], 86. Names: McNamara.'
