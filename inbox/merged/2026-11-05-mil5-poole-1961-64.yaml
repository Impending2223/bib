      when: Mar. 12
      date: '1964-03-12'
      thread: testing
      c: 'ACDA circulates a freeze proposal, to be cleared with NATO: inspection of declared facilities, a number of inspections
        of undeclared ones, observers at launchings. The Joint Chiefs against exploratory talks "at this time"; McNamara agrees
        to present it.'
      n: '[[w.poole-joint-chiefs-of-staff]], 90–91. Names: McNamara.'
