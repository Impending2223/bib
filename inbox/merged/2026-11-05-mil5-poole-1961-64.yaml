      when: May
      date: 1962-05
      thread: space
      also:
      - testing
      c: Kennedy charges an interagency committee with a negotiating position on weapons in outer space. It opposes a declaratory
        ban; Kennedy asks for a study of unilateral verification.
      n: '[[w.poole-joint-chiefs-of-staff]], 87. Names: Kennedy.'
