    entry:
      id: cal.1962-11.testing-2
      when: Nov., mid-month
      date: 1962-11
      thread: testing
      c: 'Foster suggests transferring 50,000 kilograms of uranium to peaceful purposes if the Soviets give half as much;
        later, an American ceiling of 100,000. Taylor: "we might be giving away important resources." McNamara would trade
        100,000 for 50,000 with a production stop.'
      n: '[[w.poole-joint-chiefs-of-staff]], 88. Names: Foster, Taylor, McNamara.'
      src:
        c: 4eeb65c3
        rows:
        - 'w.poole-joint-chiefs-of-staff 88: all'
      tags:
