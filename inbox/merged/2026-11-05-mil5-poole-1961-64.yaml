    entry:
      id: cal.1961-09-11.defense-2
      when: Sept. 11
      date: '1961-09-11'
      thread: defense
      c: The Joint Chiefs recommend more submarines, bombers and missiles in fiscal 1963 procurement than OSD proposes, against
        the J-5's advice to concur, Titan excepted, with OSD's figures.
      n: '[[w.poole-joint-chiefs-of-staff]], 37–38. Names: McNamara.'
      src:
        c: 844c4d41
        rows:
        - 'w.poole-joint-chiefs-of-staff 37–38: all'
