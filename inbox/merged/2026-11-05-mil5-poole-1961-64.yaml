- add:
    entry:
      id: cal.1961-09-21.defense
      when: Sept. 21
      date: '1961-09-21'
      thread: defense
      c: 'The Joint Chiefs explain their fiscal 1963 recommendations: eight more Polaris boats, 37 in all, for "the best mix
        of missiles" and "a continued orderly production program."'
      n: '[[w.poole-joint-chiefs-of-staff]], 38. See [[cal.1961-09-11.defense-2]].'
      src:
        c: ef13279c
        rows:
        - 'w.poole-joint-chiefs-of-staff 38: all'
    section: '196109'
- add:
    entry:
      id: cal.1961-09-23.defense
      when: Sept. 23
      date: '1961-09-23'
      thread: defense
      c: 'McNamara circulates his five-year program. By June 30, 1967: 630 B-52s with 1,150 Skybolts, the B-47s gone by mid-1965
        and the B-58s by mid-1966; 117 Atlas, 114 Titan, 900 hardened and 100 mobile Minuteman launchers. Fiscal 1963: 92
        Skybolts, 100 hardened and 50 mobile Minuteman, six missile submarines; no more B-52s or Titans.'
      n: '[[w.poole-joint-chiefs-of-staff]], 38–39. Names: McNamara.'
      src:
        c: 79c8ee87
        rows:
        - 'w.poole-joint-chiefs-of-staff 38–39: all'
      tags:
      - name:mcnamara-robert-s
    section: '196109'
- add:
    entry:
      id: cal.1961-09-12.defense
      when: Sept. 12
      date: '1961-09-12'
      thread: defense
      c: 'The services'' appraisals of the B-70 to the White House, Congress having appropriated $400 million against the
        $220 million asked. Decker: demonstrate feasibility only; Anderson: keep a mix of weapons; LeMay alone: unique capabilities,
        one wing forcing the Soviets to spend $20 to $40 billion on air defense.'
      n: '[[w.poole-joint-chiefs-of-staff]], 39–40. Names: Decker, Anderson, LeMay.'
      src:
        c: 3a511e88
        rows:
        - 'w.poole-joint-chiefs-of-staff 39–40: all'
      tags:
      - name:decker-george-h
      - name:anderson-george-w-jr
      - name:lemay-curtis-e
    section: '196109'
- add:
    entry:
      id: cal.1961-10-05.defense
      when: Oct. 5
      date: '1961-10-05'
      thread: defense
      c: 'The Joint Chiefs to Kennedy, after his SIOP briefing, a comparison of the strategic forces: ICBMs, 42 American against
        10 to 25 Soviet on Oct. 1, 382 against 75 to 125 in two years; "the US enjoys a military superiority over the USSR
        in both 1961 and 1963." LeMay puts the Soviet figures at 65 and 250.'
      n: '[[w.poole-joint-chiefs-of-staff]], 40. See [[cal.1961-09-13.defense]]. Names: Kennedy, LeMay.'
      src:
        c: 3bbbc726
        rows:
        - 'w.poole-joint-chiefs-of-staff 40: all'
      tags:
      - name:kennedy-john-f
      - name:lemay-curtis-e
    section: '196110'
- add:
    entry:
      id: cal.1961-10-09.defense
      when: Oct. 9
      date: '1961-10-09'
      thread: defense
      c: 'McNamara circulates his tentative recommendations, asking the Joint Chiefs for changes "absolutely essential." His
        memorandum on the general purpose forces: Army procurement $2.6 billion, $900 million under the Chiefs'' request;
        an oil-fired attack carrier in fiscal 1963; 1,588 tactical fighters against the Air Force''s 1,329.'
      n: '[[w.poole-joint-chiefs-of-staff]], 40, 66. Names: McNamara.'
      src:
        c: 15d5d96e
        rows:
        - 'w.poole-joint-chiefs-of-staff 40, 66: all'
      tags:
      - name:mcnamara-robert-s
    section: '196110'
- add:
    entry:
      id: cal.1961-10.defense
      when: Oct.
      date: 1961-10
      thread: defense
      c: McNamara announces the administration will not spend the funds Congress added to continue B-52 production and expand
        the B-70.
      n: '[[w.poole-joint-chiefs-of-staff]], 40. Check: the day; Poole: "Not long afterward," after Oct. 9. Names: McNamara.'
      src:
        c: 449f277c
        rows:
        - 'w.poole-joint-chiefs-of-staff 40: all'
      tags:
      - name:mcnamara-robert-s
    section: '196110'
- add:
    entry:
      id: cal.1961-10-30.defense
      when: Oct. 30
      date: '1961-10-30'
      thread: defense
      c: 'The Joint Chiefs with McNamara on the changes "absolutely essential." Lemnitzer: close to their positions of Sept.
        11 and 21, the impounded B-52 funds a complication. "A great difference of opinion" between McNamara and LeMay.'
      n: '[[w.poole-joint-chiefs-of-staff]], 40. Names: McNamara, Lemnitzer, LeMay.'
      src:
        c: ca16cd88
        rows:
        - 'w.poole-joint-chiefs-of-staff 40: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:lemay-curtis-e
    section: '196110'
- add:
    entry:
      id: cal.1961-11-17.defense
      when: Nov. 17
      date: '1961-11-17'
      thread: defense
      c: 'The Joint Chiefs to McNamara: OSD''s target system and its survivability, reliability and penetration factors generally
        valid; the median factor applied to 1965''s forces would need 125 more weapons. McNamara then raises Minuteman from
        750 to 800 for fiscal 1965 and from 1,000 to 1,100 for fiscal 1967.'
      n: '[[w.poole-joint-chiefs-of-staff]], 40–41. Names: McNamara.'
      src:
        c: b172ead6
        rows:
        - 'w.poole-joint-chiefs-of-staff 40–41: all'
      tags:
      - name:mcnamara-robert-s
    section: '196111'
- add:
    entry:
      id: cal.1962-01.defense-2
      when: Jan.
      date: 1962-01
      thread: defense
      c: 'McNamara asks Lemnitzer what makes for nuclear superiority. Lemnitzer: a strategic advantage now, a "decisive retaliatory
        capability" by 1963; any relaxation, "irreparable damage."'
      n: '[[w.poole-joint-chiefs-of-staff]], 41. Check: the month; Poole: "Early in 1962." Names: McNamara, Lemnitzer.'
      src:
        c: d34c1565
        rows:
        - 'w.poole-joint-chiefs-of-staff 41: all'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
    section: '196201'
- add:
    entry:
      id: cal.1962-09.defense-2
      when: Sept., early
      date: 1962-09
      thread: defense
      c: 'The Air Force''s Program Change Proposal for the RS-70, the B-70 renamed: $591.4 million in fiscal 1964 for eight
        experimental aircraft, "vitally needed" for reconnaissance and strike in the trans-attack phase. McNamara has held
        the B-70 to three prototypes.'
      n: '[[w.poole-joint-chiefs-of-staff]], 43.'
      src:
        c: 8e0bf2f7
        rows:
        - 'w.poole-joint-chiefs-of-staff 43: all'
    section: '196209'
- add:
    entry:
      id: cal.1962-09-29.defense
      when: Sept. 29
      date: '1962-09-29'
      thread: defense
      c: 'The Joint Chiefs to McNamara: "there is a military requirement for an armed reconnaissance capability"; reorient
        the B-70 to the RS-70 and approve what is needed to prove it feasible.'
      n: '[[w.poole-joint-chiefs-of-staff]], 43. Names: McNamara.'
      src:
        c: d3462896
        rows:
        - 'w.poole-joint-chiefs-of-staff 43: all'
      tags:
      - name:mcnamara-robert-s
    section: '196209'
