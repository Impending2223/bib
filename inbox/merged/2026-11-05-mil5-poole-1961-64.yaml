      date: '1962-11-10'
      thread: testing
      c: 'The Joint Chiefs answer Nitze: a teletype circuit quicker, more accurate and more secure than a telephone; consult
        the allies first.'
      n: '[[w.poole-joint-chiefs-of-staff]], 87. See [[cal.1962-10-23.testing]]. Names: Nitze.'
