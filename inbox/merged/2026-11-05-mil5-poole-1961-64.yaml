        moratorium on underground tests below 4.75 on the Richter scale; seventeen control posts on each side''s soil; twenty
        on-site inspections a year, ten as a fallback.'
      n: '[[w.poole-joint-chiefs-of-staff]], 93. Names: McCloy.'
