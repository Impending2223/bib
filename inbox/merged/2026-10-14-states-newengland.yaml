# ---------------------------------------------------------------- Massachusetts
  - add:
      entry:
        id: cal.1960-09-13.governors-ma
        when: Sept. 13
        date: '1960-09-13'
        thread: governors
        also: [elections-1960]
        c: 'Massachusetts primary. Democratic, for governor: Ward, Secretary of the Commonwealth, 180,848, 30.2 percent; Peabody 152,762, 25.5; Attorney General Kelly 16.4; four others. Furcolo, the governor, runs for the Senate. Volpe unopposed for the Republican nomination after the party''s convention.'
        n: '[Mass. *Election Statistics*, 1960 (P.D. 43), p. 159](https://archive.org/details/electionstatisti19591960mass/page/n226). [Wikipedia, "1960 Massachusetts gubernatorial election"](https://en.wikipedia.org/wiki/1960_Massachusetts_gubernatorial_election). [[w.litt-political-cultures-of-massachusetts]]; [[w.peirce-megastates-of-america]]. Names: Ward (K–J Cong. III.F); Kelly (K–J Cong. III.K); Furcolo (K–J Cong. III.K); Volpe (Opp. III.H).'
        tags: [state:ma, name:ward-joseph-d, name:peabody-endicott, name:kelly-francis-e, name:furcolo-foster, name:volpe-john-a]
  - add:
      entry:
        id: cal.1960-11-08.governors-ma
        when: Nov. 8
        date: '1960-11-08'
        thread: governors
        also: [elections-1960]
        c: 'Massachusetts. Volpe (R), once Eisenhower''s Federal Highway Administrator, governor over Ward (D), 1,269,295 to 1,130,810, 52.5 percent, while Kennedy carries the State.'
        n: '[Mass. *Election Statistics*, 1960 (P.D. 43), p. 5](https://archive.org/details/electionstatisti19591960mass/page/n72). See [[cal.1960-09-13.governors-ma]]; [[cal.1960-11-08.governors]]. Names: Volpe (Opp. III.H); Ward (K–J Cong. III.F).'
        tags: [state:ma, name:volpe-john-a, name:ward-joseph-d]
  - add:
      entry:
        id: cal.1960-10-20.cities-and-housing-boston
        when: Oct. 20
        date: '1960-10-20'
        thread: cities-and-housing
        also: [states-and-cities]
        c: 'Boston. Logue, New Haven''s development administrator under Lee since 1954, takes charge of the Boston Redevelopment Authority for Collins. The West End being cleared since 1958; Government Center to follow on Scollay Square.'
        n: '[Wikipedia, "Edward J. Logue"](https://en.wikipedia.org/wiki/Edward_J._Logue) (Check the date against the Authority''s minutes). [[w.oconnor-building-a-new-boston]]; [[w.cohen-saving-americas-cities]]; [[w.vrabel-peoples-history-of-the]]; [[w.gans-urban-villagers]]; for New Haven, [[w.talbot-mayors-game]]; [[w.wolfinger-politics-of-progress]]; [[w.rae-city]]. Names: Logue (K–J Cong. III.K); Lee (K–J Cong. III.F); Collins (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:logue-edward-j, name:lee-richard-c, name:collins-john-f]
  - add:
      entry:
        id: cal.1961-11-07.mayors-springfield
        when: Nov. 7
        date: '1961-11-07'
        thread: mayors
        also: [elections-1961]
        c: 'Springfield, Mass., the city''s first nonpartisan election for mayor. Ryan over O''Connor, mayor since 1958 and the Democrats'' nominee against Saltonstall in 1960, 28,999 to 26,471, 52.3 percent. O''Connor had led the primary of Oct. 10, 34.5 percent.'
        n: '[Wikipedia, "Mayoral elections in Springfield, Massachusetts"](https://en.wikipedia.org/wiki/Mayoral_elections_in_Springfield,_Massachusetts). Check against the city''s returns. Names: Ryan, O''Connor (K–J Cong. III.F).'
        tags: [state:ma, city:springfield, name:ryan-charles-v, name:oconnor-thomas-j-jr, name:saltonstall-leverett]
  - add:
      entry:
        id: cal.1962-09-18.governors-ma
        when: Sept. 18
        date: '1962-09-18'
        thread: governors
        also: [elections-1962]
        c: 'Massachusetts primary. Peabody, once of the Governor''s Council, Democratic nominee for governor, 596,553, 80.0 percent, over one opponent. Volpe renominated without opposition.'
        n: '[Mass. *Election Statistics*, 1962 (P.D. 43), p. 161](https://archive.org/details/electionstatisti19611963mass/page/n238). See [[cal.1962-09-18.elections-1962]]. Names: Volpe (Opp. III.H).'
        tags: [state:ma, name:peabody-endicott, name:volpe-john-a]
  - add:
      entry:
        id: cal.1962-09-18.states-and-cities-ma
        when: Sept. 18
        date: '1962-09-18'
        thread: states-and-cities
        also: [elections-1962]
        c: 'Massachusetts. Brooke, chairman of the Boston Finance Commission, Republican nominee for attorney general over Richardson, 238,147 to 195,791, 54.9 percent.'
        n: '[Mass. *Election Statistics*, 1962 (P.D. 43), p. 65](https://archive.org/details/electionstatisti19611963mass/page/n142). [[w.brooke-bridging-the-divide]]; [[w.rigueur-loneliness-of-the-black]]. Names: Brooke (Opp. III.B); Richardson (Adm. III.F).'
        tags: [state:ma, name:brooke-edward-w, name:richardson-elliot-l]
  - add:
      entry:
        id: cal.1962-11-06.governors-ma
        when: Nov. 6
        date: '1962-11-06'
        thread: governors
        also: [elections-1962]
        c: 'Massachusetts. Peabody (D) over Volpe (R), 1,053,322 to 1,047,891, 49.9 percent to 49.7; a margin of 5,431. A recount; Volpe concedes Dec. 20 (Check).'
        n: '[Mass. *Election Statistics*, 1962 (P.D. 43), p. 9](https://archive.org/details/electionstatisti19611963mass/page/n86). [Wikipedia, "1962 Massachusetts gubernatorial election"](https://en.wikipedia.org/wiki/1962_Massachusetts_gubernatorial_election). See [[cal.1962-09-18.governors-ma]]; [[cal.1962-11-06.governors]]. Names: Volpe (Opp. III.H).'
        tags: [state:ma, name:peabody-endicott, name:volpe-john-a]
  - add:
      entry:
        id: cal.1962-11-06.states-and-cities-ma
        when: Nov. 6
        date: '1962-11-06'
        thread: states-and-cities
        also: [elections-1962]
        c: 'Massachusetts. Brooke (R) attorney general over Kelly (D), 1,143,065 to 883,710, 56.0 percent: the first Negro elected attorney general of a State.'
        n: '[Mass. *Election Statistics*, 1962 (P.D. 43), p. 9](https://archive.org/details/electionstatisti19611963mass/page/n86). See [[cal.1962-09-18.states-and-cities-ma]]. Names: Brooke (Opp. III.B); Kelly (K–J Cong. III.K).'
        tags: [state:ma, name:brooke-edward-w, name:kelly-francis-e]
  - add:
      entry:
        id: cal.1963-05-10.states-and-cities-ma
        when: May 10
        date: '1963-05-10'
        thread: states-and-cities
        c: 'Massachusetts. Crimmins, of the Governor''s Council, with the chairman of the State Housing Board and the head of its urban renewal program, indicted for conspiracy and bribes on State housing contracts: the first indictments from the Crime Commission''s inquiries.'
        n: '[Wikipedia, "Joseph Ray Crimmins"](https://en.wikipedia.org/wiki/Joseph_Ray_Crimmins). Check against the *Boston Globe* and the Commission''s reports. [[w.hogarty-massachusetts-politics-and-public]]; [[w.peirce-megastates-of-america]]. Names: Crimmins (K–J Cong. III.K).'
        tags: [state:ma, name:crimmins-joseph-ray]
  - add:
      entry:
        id: cal.1963-06-18.desegregation-schools-boston
        when: June 18
        date: '1963-06-18'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Boston. The Stay Out for Freedom. In June the School Committee, Hicks its chairman, had met the NAACP''s demands, read by Batson, all but two: it would not acknowledge de facto segregation or discrimination in hiring teachers. Two to three thousand junior and senior high school students out, by the organizers'' count; Freedom Schools in Roxbury.'
        n: '[[w.napier-boston-freedom-schools-as]]; [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.sugrue-sweet-land-of-liberty]]; [[w.delmont-why-busing-failed]]. Names: Batson (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:hicks-louise-d, name:batson-ruth]
  - add:
      entry:
        id: cal.1963-09-24.mayors-boston
        when: Sept. 24
        date: '1963-09-24'
        thread: mayors
        also: [elections-1963]
        c: 'Boston, the preliminary election for mayor. Collins 56,989, 46.0 percent; Piemonte, of the City Council, 27,492, 22.2; McDonough, of the Council, 26,576, 21.5; Ansel 11,729. Collins and Piemonte to the final.'
        n: '[Boston, *Annual Report of the Election Department*, 1963, p. 47](https://archive.org/details/annualreportofbo1963bost/page/n62). [[w.oconnor-building-a-new-boston]]; [[w.vrabel-peoples-history-of-the]]. Names: Collins (K–J Cong. III.K); Piemonte, McDonough (K–J Cong. III.F); Ansel (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:collins-john-f, name:piemonte-gabriel, name:mcdonough-patrick-f, name:ansel-julius]
  - add:
      entry:
        id: cal.1963-11-05.mayors-boston
        when: Nov. 5
        date: '1963-11-05'
        thread: mayors
        also: [elections-1963]
        c: 'Boston. Collins re-elected over Piemonte, 108,624 to 73,067, 59.8 percent.'
        n: '[Boston, *Annual Report of the Election Department*, 1963, p. 114](https://archive.org/details/annualreportofbo1963bost/page/n129). See [[cal.1963-09-24.mayors-boston]]; [[cal.1963-11-05.states-and-cities]]. Names: Collins (K–J Cong. III.K); Piemonte (K–J Cong. III.F).'
        tags: [state:ma, city:boston, name:collins-john-f, name:piemonte-gabriel]
  - add:
      entry:
        id: cal.1964-02-26.desegregation-schools-boston
        when: Feb. 26
        date: '1964-02-26'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Boston. The second Freedom Stay-Out: nearly 20,000 pupils absent, over 10,000 at some forty Freedom Schools, by the organizers'' count; over a thousand suburban students, most of them white, among them. Brooke, the attorney general, had ruled the boycott illegal; no arrests. Leaders meet Collins at City Hall.'
        n: '[[w.napier-boston-freedom-schools-as]], 84, nn. 4, 96, 101, 120. See [[cal.1963-06-18.desegregation-schools-boston]]. Names: Brooke (Opp. III.B); Collins (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:brooke-edward-w, name:collins-john-f]
  - add:
      entry:
        id: cal.1964-09-15.governors-ma
        when: Sept. 15
        date: '1964-09-15'
        thread: governors
        also: [elections-1964]
        c: 'Massachusetts primary. Bellotti, the lieutenant governor, takes the Democratic nomination for governor from Peabody, 363,675 to 336,780, 49.6 percent to 45.9; two others. Hicks second for treasurer, 24.5 percent. Volpe unopposed for the Republican nomination.'
        n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 217](https://archive.org/details/electionstatisti1964mass/page/n222). [Wikipedia, "1964 Massachusetts elections"](https://en.wikipedia.org/wiki/1964_Massachusetts_elections). See [[cal.1964-06-19.congress]]. Names: Bellotti (K–J Cong. III.F); Volpe (Opp. III.H).'
        tags: [state:ma, name:bellotti-francis-x, name:peabody-endicott, name:hicks-louise-d, name:volpe-john-a]
  - add:
      entry:
        id: cal.1964-10-13.states-and-cities-ma
        when: Oct. 13
        date: '1964-10-13'
        thread: states-and-cities
        c: 'Massachusetts. Four members of the Governor''s Council, Crimmins among them, indicted for soliciting and taking bribes from Governor Furcolo for their votes to reappoint his commissioner of public works, DiNatale, in 1959 (Check the year). Crimmins indicted Oct. 7 on a second count, from the Crime Commission''s inquiry into the Department of Public Works.'
        n: '[Wikipedia, "Michael Favulli"](https://en.wikipedia.org/wiki/Michael_Favulli); [Wikipedia, "Joseph Ray Crimmins"](https://en.wikipedia.org/wiki/Joseph_Ray_Crimmins). Check against the indictments. See [[cal.1963-05-10.states-and-cities-ma]]. Names: Crimmins, Furcolo (K–J Cong. III.K).'
        tags: [state:ma, name:crimmins-joseph-ray, name:furcolo-foster]
  - add:
      entry:
        id: cal.1964-11-03.governors-ma
        when: Nov. 3
        date: '1964-11-03'
        thread: governors
        also: [elections-1964]
        c: 'Massachusetts. Volpe (R) back as governor over Bellotti (D), 1,176,462 to 1,153,416, 50.3 percent; Richardson (R) lieutenant governor. Brooke re-elected attorney general, 1,543,900, 67.2 percent. Johnson carries the State.'
        n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 7](https://archive.org/details/electionstatisti1964mass/page/n12). See [[cal.1964-09-15.governors-ma]]; [[cal.1964-11-03.elections-1964-2]]; [[cal.1964-11-03.governors]]. Names: Volpe (Opp. III.H); Bellotti (K–J Cong. III.F); Richardson (Adm. III.F); Brooke (Opp. III.B).'
        tags: [state:ma, name:volpe-john-a, name:bellotti-francis-x, name:richardson-elliot-l, name:brooke-edward-w]
  - add:
      entry:
        id: cal.1964-11-03.state-constitutions-ma
        when: Nov. 3
        date: '1964-11-03'
        thread: state-constitutions
        also: [governors]
        c: 'Massachusetts, Question 1: four-year terms for the governor, lieutenant governor, secretary, treasurer, attorney general and auditor, from the election of 1966; councillors and legislators still two. Yes 1,391,922, no 450,367, blank 546,141.'
        n: '[Mass. *Election Statistics*, 1964 (P.D. 43), p. 541](https://archive.org/details/electionstatisti1964mass/page/n546). Passed by the General Court in joint session, Mar. 29, 1961, 219–26, and May 8, 1963. [[w.hogarty-massachusetts-politics-and-public]].'
        tags: [state:ma]
  - add:
      entry:
        id: cal.1965-04-01.desegregation-schools-ma
        when: Apr. 1
        date: '1965-04-01'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Massachusetts. The final report of the advisory committee on racial imbalance named by Kiernan, Commissioner of Education, *Because It Is Right—Educationally*: more than half the Negro pupils in Boston''s schools in schools at least 80 percent Negro; the imbalance from housing segregation.'
        n: '[Wikipedia, "Boston desegregation busing crisis"](https://en.wikipedia.org/wiki/Boston_desegregation_busing_crisis). Check the title and the date against the report. [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.delmont-why-busing-failed]]. See [[cal.1964-02-26.desegregation-schools-boston]]. Names: Kiernan (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:kiernan-owen-b]
  - add:
      entry:
        id: cal.1965-04-22.king-boston
        when: Apr. 22–23
        date: '1965-04-22'
        thread: king
        also: [desegregation-schools]
        c: 'King in Boston. Meets Volpe and addresses the General Court in joint session, Apr. 22; leads a march from Roxbury to Boston Common, Apr. 23. Carter''s vigil before the School Committee''s offices begins Apr. 28.'
        n: '[Wikipedia, "1965–1966 Massachusetts legislature"](https://en.wikipedia.org/wiki/1965%E2%80%931966_Massachusetts_legislature). Check the march and its numbers against the *Boston Globe*, Apr. 24, 1965. [[w.formisano-boston-against-busing]]; [[w.sugrue-sweet-land-of-liberty]]. See [[cal.1965-04-01.desegregation-schools-ma]]. Names: King (K–J Cong. III.H); Volpe (Opp. III.H); Carter (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:king-martin-luther-jr, name:volpe-john-a, name:carter-vernon-e]
  - add:
      entry:
        id: cal.1965-08-18.desegregation-schools-ma
        when: Aug. 18
        date: '1965-08-18'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Massachusetts. Volpe signs the Racial Imbalance Act: a school more than half nonwhite is imbalanced; the State Board of Education may withhold State aid from a district that does not submit and carry out a plan. Carter''s vigil ends, its 114th day.'
        n: 'St. 1965, c. 641 (Check the chapter). [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]; [[w.delmont-why-busing-failed]]. See [[cal.1965-04-22.king-boston]]. Names: Volpe (Opp. III.H); Carter (K–J Cong. III.K).'
        tags: [state:ma, city:boston, name:volpe-john-a, name:carter-vernon-e]
  - add:
      entry:
        id: cal.1965-09-28.states-and-cities-ma
        when: Sept. 28
        date: '1965-09-28'
        thread: states-and-cities
        c: 'Massachusetts. Crimmins and three other members of the Governor''s Council, Sullivan, Favulli and Stasiun, convicted of conspiracy and soliciting bribes for DiNatale''s reappointment; Crimmins of taking one. Crimmins resigns; two and a half years.'
        n: '[Wikipedia, "Joseph Ray Crimmins"](https://en.wikipedia.org/wiki/Joseph_Ray_Crimmins). Check against the court''s record. See [[cal.1964-10-13.states-and-cities-ma]]. Names: Crimmins, Sullivan, Favulli, Stasiun (K–J Cong. III.K).'
        tags: [state:ma, name:crimmins-joseph-ray, name:sullivan-raymond-f, name:favulli-michael, name:stasiun-ernest-c]
  - add:
      entry:
        id: cal.1966-04.desegregation-schools-boston
        when: Apr.
        date: '1966-04'
        thread: desegregation-schools
        also: [states-and-cities]
        c: 'Massachusetts. The State Board of Education finds the Boston School Committee''s plan of December under the Racial Imbalance Act inadequate and withholds State aid. The Committee sues the Board in August, against the decision and the Act.'
        n: '[Wikipedia, "Boston desegregation busing crisis"](https://en.wikipedia.org/wiki/Boston_desegregation_busing_crisis). Check the dates. [[w.formisano-boston-against-busing]]; [[w.lukas-common-ground]]. See [[cal.1965-08-18.desegregation-schools-ma]].'
        tags: [state:ma, city:boston]
  - add:
      entry:
        id: cal.1966-09-13.governors-ma
        when: Sept. 13
        date: '1966-09-13'
        thread: governors
        also: [elections-1966]
        c: 'Massachusetts primary. McCormack, once attorney general, Democratic nominee for governor over O''Donnell, Kennedy''s appointments secretary, 343,381 to 279,541, 55.1 percent. Volpe unopposed.'
        n: '[Mass. *Election Statistics*, 1966 (P.D. 43), p. 131](https://archive.org/details/electionstatisti19651966mass/page/n204). See [[cal.1966-09-13.elections-1966]]. Names: McCormack (K–J Cong. III.K); O''Donnell (K–J Adm. III.B); Volpe (Opp. III.H).'
        tags: [state:ma, name:mccormack-edward-j-jr, name:odonnell-kenneth-p, name:volpe-john-a]
  - add:
      entry:
        id: cal.1966-11-08.governors-ma
        when: Nov. 8
        date: '1966-11-08'
        thread: governors
        also: [elections-1966]
        c: 'Massachusetts. Volpe (R) re-elected over McCormack (D), 1,277,358 to 752,720, 62.6 percent: the first four-year term.'
        n: '[Mass. *Election Statistics*, 1966 (P.D. 43), p. 8](https://archive.org/details/electionstatisti19651966mass/page/n81). See [[cal.1966-09-13.governors-ma]]; [[cal.1964-11-03.state-constitutions-ma]]; [[cal.1966-11-08.governors]]. Names: Volpe (Opp. III.H); McCormack (K–J Cong. III.K).'
        tags: [state:ma, name:volpe-john-a, name:mccormack-edward-j-jr]
  - add:
      entry:
        id: cal.1966-11-08.state-and-city-finance-ma
        when: Nov. 8
        date: '1966-11-08'
        thread: state-and-city-finance
        also: [state-constitutions]
        c: 'Massachusetts. The sales tax of 1966, 3 percent on retail sales, food, clothing and prescription medicines exempt, with a use tax and a Local Aid Fund for the cities and towns, in force since Apr. 1 and to run through 1967, put to the voters. Question 5, the law on referendum: yes 1,391,100, no 358,879. Question 6, the act by its title: yes 1,070,599, no 446,460.'
        n: '[Mass. *Election Statistics*, 1966 (P.D. 43), pp. 368–379](https://archive.org/details/electionstatisti19651966mass/page/n441). Passed by the House, 118–102, and the Senate, 21–16. [[w.hogarty-massachusetts-politics-and-public]]. Names: Volpe (Opp. III.H).'
        tags: [state:ma, name:volpe-john-a]
# ---------------------------------------------------------------- Connecticut
  - add:
      entry:
        id: cal.1961-01-21.governors-ct
        when: Jan. 21
        date: '1961-01-21'
        thread: governors
        c: 'Connecticut. Ribicoff resigns as governor to be Secretary of Health, Education, and Welfare; Dempsey, the lieutenant governor, succeeds him.'
        n: '[Wikipedia, "John N. Dempsey"](https://en.wikipedia.org/wiki/John_N._Dempsey). See [[cal.1961-01-20.transition-and-staff]]. [[w.peirce-new-england-states]]. Names: Ribicoff (K–J Adm. III.G); Dempsey (K–J Cong. III.F).'
        tags: [state:ct, name:ribicoff-abraham, name:dempsey-john-n]
  - add:
      entry:
        id: cal.1961-11-01.health-ct
        when: Nov. 1–10
        date: '1961-11-01'
        thread: health
        also: [court]
        c: 'New Haven. The Planned Parenthood League of Connecticut opens a center under Griswold, its executive director, and Buxton, of the Yale medical school, its medical director: advice and contraceptives for married persons, in defiance of the law of 1879. Arrested Nov. 10, as accessories.'
        n: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf), 480 (1965). [[w.garrow-liberty-and-sexuality]]. See [[cal.1961-06-19.court]]. Names: Griswold, Buxton (K–J Cong. III.K).'
        tags: [state:ct, city:new-haven, name:griswold-estelle, name:buxton-c-lee]
  - add:
      entry:
        id: cal.1962-01-02.health-ct
        when: Jan. 2
        date: '1962-01-02'
        thread: health
        also: [court]
        c: 'New Haven. Griswold and Buxton convicted in the Circuit Court as accessories, fined $100 each. Affirmed by its Appellate Division, Jan. 7, 1963, and by the Supreme Court of Errors, *State v. Griswold*, 151 Conn. 544 (1964).'
        n: '*Griswold v. Connecticut*, [381 U.S. 479](https://tile.loc.gov/storage-services/service/ll/usrep/usrep381/usrep381479/usrep381479.pdf), 480 (1965). See [[cal.1961-11-01.health-ct]]; [[cal.1965-06-07.court]]. Names: Griswold, Buxton (K–J Cong. III.K).'
        tags: [state:ct, city:new-haven, name:griswold-estelle, name:buxton-c-lee]
  - add:
      entry:
        id: cal.1964-06-22.legislatures-ct
        when: June 22
        date: '1964-06-22'
        thread: legislatures
        also: [court]
        c: '*Pinney v. Butterworth*, [378 U.S. 564](https://tile.loc.gov/storage-services/service/ll/usrep/usrep378/usrep378564/usrep378564.pdf): the three-judge court''s judgment that Connecticut''s apportionment of its General Assembly, the House by towns, violates the Equal Protection Clause, affirmed per curiam on *Reynolds v. Sims*; remanded for relief. Harlan dissents.'
        n: 'District court: *Butterworth v. Dempsey*, 229 F. Supp. 754 (D. Conn. 1964). [[w.horton-connecticut-state-constitution]]. See [[cal.1964-06-15.court]]. Names: Harlan (K–J Cong. III.G); Dempsey (K–J Cong. III.F).'
        tags: [state:ct, name:harlan-john-marshall, name:dempsey-john-n]
  - add:
      entry:
        id: cal.1965-01-05.state-constitutions-ct
        when: Jan. 5–22
        date: '1965-01-05'
        thread: state-constitutions
        also: [legislatures]
        c: 'Connecticut. The General Assembly, in the special session called in November, calls a constitutional convention to meet at Hartford July 1, Public Act No. 1, approved Jan. 5: 84 delegates, fourteen from each congressional district, no more than seven of a party; a two-thirds vote for any final action; its work done by Oct. 30. Public Act No. 2, approved Jan. 22, reapportions both houses.'
        n: '[Conn. *Register and Manual*, 1966, p. 46](https://archive.org/details/register66conn/page/n49). The federal court had put off its final judgment for a convention. [[w.horton-connecticut-state-constitution]]. See [[cal.1964-06-22.legislatures-ct]].'
        tags: [state:ct]
  - add:
      entry:
        id: cal.1965-07-01.state-constitutions-ct
        when: July 1–Oct. 20
        date: '1965-07-01'
        thread: state-constitutions
        c: 'Connecticut''s constitutional convention, 42 Democrats and 42 Republicans, opens in the Old State House at Hartford. Baldwin, once governor, chairman; Grasso, Secretary of the State, and Alcorn floor leaders. Oct. 20, a new constitution adopted unanimously, with a second proposal on taking property for public use.'
        n: '[Conn. *Register and Manual*, 1966, pp. 46–48](https://archive.org/details/register66conn/page/n49). [[w.horton-connecticut-state-constitution]]. See [[cal.1965-01-05.state-constitutions-ct]]. Names: Baldwin, Alcorn (K–J Cong. III.K).'
        tags: [state:ct, name:baldwin-raymond-e, name:grasso-ella-t, name:alcorn-h-meade]
  - add:
      entry:
        id: cal.1965-12-14.state-constitutions-ct
        when: Dec. 14
        date: '1965-12-14'
        thread: state-constitutions
        also: [legislatures]
        c: 'Connecticut ratifies its new constitution, the first since 1818: yes 178,432, no 84,129; 20.2 percent of the registered voting. The second proposal, no taking of property for public use unless necessary, fails, 117,494 to 139,701. Dempsey proclaims it Dec. 30.'
        n: '[Conn. *Register and Manual*, 1966, p. 665](https://archive.org/details/register66conn/page/n668); p. 44. See [[cal.1965-07-01.state-constitutions-ct]]. Names: Dempsey (K–J Cong. III.F).'
        tags: [state:ct, name:dempsey-john-n]
