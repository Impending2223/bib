      when: Feb.
      date: 1965-02
      thread: voting-rights
      c: 'Clarence Mitchell and Paul Douglas, who threatens a bill of his own, see Russell Long, the whip, on voting legislation.
        Long, a filibusterer of 1964, affable: federal examiners to enroll voters where 40 percent of Negroes are not registered.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 206. To check: Denton L. Watson, *Lion in the Lobby* (1990), 643 (cited by
