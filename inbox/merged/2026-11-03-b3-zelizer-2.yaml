        - 'via w.zelizer-fierce-urgency-of-now 212 n.103: all'
- add:
    entry:
      id: cal.1965-03-12.voting-rights-3
      when: Mar. 12
      date: '1965-03-12'
      thread: voting-rights
      c: 'McPherson to Johnson, by memorandum: "The public knows you are for the enforcement of civil rights. The Deep South
        knows it; that is why it went for Goldwater." The deepest outrage the public has felt on civil rights; Fortas now
        for troops at Selma; the "public wants you to express your own, present, sense of outrage."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 213. To check: McPherson to Johnson, Mar. 12, 1965, Legislative Background,
        Voting Rights Act of 1965, box 2, LBJ Library (cited by [[w.zelizer-fierce-urgency-of-now]], 213 n.105). Names:
        McPherson, Johnson, Fortas.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:fortas-abe
      src:
        c: 73e0b553
        rows:
        - 'w.zelizer-fierce-urgency-of-now 213: all'
        - 'via w.zelizer-fierce-urgency-of-now 213 n.105: all'
- add:
    entry:
      id: cal.1965-03-14.voting-rights-2
      when: Mar. 14
      date: '1965-03-14'
      thread: voting-rights
      also:
      - congress
      c: 'Johnson with the congressional leaders: McCormack''s "impromptu" invitation to a joint session, the first of its
        kind since 1946. Dirksen: let no one say the President "scared" Congress into the bill; but the public must hear.
