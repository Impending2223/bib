      date: 1963-12
      thread: economy
      c: 'The budget for fiscal 1965 under $100 billion, by cuts and by estimates held low. Heller suggests checking the
        figures with Dillon. Johnson: "Dillon is down vacationing on Hobe Sound, and if he wants to have his rest or his
        leisure on Hobe Sound he can have it, we''re going ahead." By Heller''s account.'
