      id: cal.1965-03-11.voting-rights
      when: Mar. 11
      date: '1965-03-11'
      thread: voting-rights
      also:
      - republican-party-congress
      c: 'Morning, Dirksen''s office, after two hours: Katzenbach and Dirksen agree on the voting bill. Dirksen accepts
        federal registrars sent by the Justice Department, and preclearance; they are to be called "examiners." Mar. 12,
        Mansfield and Dirksen tell reporters: an automatic trigger against the tests where registration is low.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 207–8, 212–13. To check: "Accord Is Reached on Voting Rights," *New York
        Times*, Mar. 12, 1965 (cited by [[w.zelizer-fierce-urgency-of-now]], 212 n.103). See [[cal.1965-03-02.voting-rights]].
        Names: Katzenbach, Dirksen, Mansfield.'
      tags:
