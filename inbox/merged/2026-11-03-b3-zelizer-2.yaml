      when: July 4
      date: '1963-07-04'
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'Over the holiday Burke Marshall goes to Piqua, Ohio, to McCulloch, who keeps him waiting much of the morning.
        McCulloch''s terms: the bill protected from being picked apart in the Senate; full credit to the Republicans for
        passage in the House; no fair employment commission with powers to regulate; the deal kept private. Marshall agrees
        to all.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 54–56. To check: [[w.whalen-longest-debate]], 13–14 (cited by [[w.zelizer-fierce-urgency-of-now]],
        56 n.54). Check: the day ("over the July 4 holiday"). See [[cal.1963-06-19.civil-rights-bill]]. Names: Marshall,
        McCulloch.'
      tags:
      - name:marshall-burke
      - name:mcculloch-william-m
      - state:oh
      src:
        c: f0ccb9dc
        rows:
        - 'w.zelizer-fierce-urgency-of-now 54–56: all'
- add:
    entry:
      id: cal.1963-10.civil-rights-bill
      when: Oct.
      date: 1963-10
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'On the amendments of Celler''s subcommittee, McCulloch publicly: "so severe" as to imperil "passage of civil rights
        legislation" on the House floor. Kennedy to his brother: "What the hell is this? Can the NAACP deliver sixty Republican
        votes on the floor? . . . McCulloch can deliver sixty Republican votes." Halleck: Republicans will not support the
        amended bill.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 57. To check: [[w.whalen-longest-debate]], 35, 39–40; [[w.reeves-president-kennedy]],
        629 (cited by [[w.zelizer-fierce-urgency-of-now]], 57 nn.55–57). Check: the days. See [[cal.1963-07-04.civil-rights-bill]].
        Names: McCulloch, Celler, Kennedy, Robert Kennedy, Halleck.'
      tags:
      - name:mcculloch-william-m
      - name:celler-emanuel
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:halleck-charles-a
