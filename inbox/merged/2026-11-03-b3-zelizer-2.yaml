- add:
    entry:
      id: cal.1965-03-08.voting-rights-3
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights
      c: 'After Selma. McCormack: a "disgraceful exercise of arbitrary power." O''Hara: "a savage action, storm trooper
        style, under direction of a reckless demagogue." Clark: a bill needed now; he and others will offer their own. Celler:
        if no word from the President "shortly," "I''m going to offer my own bill."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 209–10. To check: Nan Robertson, "Johnson Pressed for a Voting Law," *New
        York Times*, Mar. 9, 1965 (cited by [[w.zelizer-fierce-urgency-of-now]], 210 n.95). See [[cal.1965-03-07.voting-rights]].
        Names: McCormack, O''Hara, Clark, Celler.'
      tags:
      - name:mccormack-john-w
      - name:ohara-james-g
      - name:clark-joseph-s
      - name:celler-emanuel
      src:
