      when: Mar. 28
      date: '1963-03-28'
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'Javits and Keating with six other Republican Senators propose civil rights bills beyond the President''s: no discrimination
        in hotels and lodgings in interstate commerce, more against voting discrimination, a permanent federal commission
        on employment. They ask the Democrats to join them.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 42. To check: Robert Albright, "GOP Challenges Administration, Offers Broad
        ''Rights'' Program," *Washington Post*, Mar. 29, 1963; "Republicans Propose Civil Rights Bills," *Atlanta Daily
        World*, Mar. 29, 1963 (cited by [[w.zelizer-fierce-urgency-of-now]], 42 nn.38–39). Check: the day. See [[cal.1963-02-28.voting-rights]].
        Names: Javits, Keating.'
      tags:
      - name:javits-jacob-k
      - name:keating-kenneth-b
      src:
