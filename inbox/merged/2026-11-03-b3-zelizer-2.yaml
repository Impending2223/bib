- add:
    entry:
      id: cal.1963-03-02.civil-rights-bill
      when: Mar. 2
      date: '1963-03-02'
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'The Republicans of the House Judiciary Committee welcome the President''s proposals but are "disappointed" with
        "timid and almost reluctant proposals": no civil suits by the Attorney General, almost nothing on employment. McCulloch:
        the only civil rights bills passed came under a Republican President; most of Kennedy''s proposals in the Republicans''
        bill of a month before.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 41–42. To check: Rodney Crowther, "GOP Assails Rights Views," *Baltimore
        Sun*, Mar. 3, 1963 (cited by [[w.zelizer-fierce-urgency-of-now]], 42 n.36). Check: the day ("two days later"). See
        [[cal.1963-02-28.voting-rights]]. Names: McCulloch, Kennedy.'
      tags:
      - name:mcculloch-william-m
      - name:kennedy-john-f
      src:
        c: eaa96b80
        rows:
        - 'w.zelizer-fierce-urgency-of-now 41–42: all'
        - 'via w.zelizer-fierce-urgency-of-now 42 n.36: all'
