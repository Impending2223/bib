- add:
    entry:
      id: cal.1967-08-03.economy-surcharge
      when: Aug. 3
      date: '1967-08-03'
      thread: economy-surcharge
      also:
      - republican-party-congress
      c: 'On the surcharge message. Ford: "I will not concede that the present level of Federal spending cannot be cut back
        sufficiently to avoid a tax increase." Byrnes: "Without an austerity program on expenditures, a tax increase is
        out of the question." Mills: "I''m uncommitted."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 280. To check: Richard L. Lyons, "Tax Increase Plan Faces Stiff Battle in
        Both Houses," *Washington Post*, Aug. 4, 1967 (cited by [[w.zelizer-fierce-urgency-of-now]], 280 nn.36–37). Check:
        the day. See [[cal.1967-08-03.economy]]. Names: Ford, Byrnes, Mills.'
      tags:
      - name:ford-gerald-r
      - name:byrnes-john-w
      - name:mills-wilbur-d
      src:
        c: 8453ff44
        rows:
        - 'w.zelizer-fierce-urgency-of-now 280: all'
- add:
    entry:
      id: cal.1967-09-19.economy-surcharge-2
      when: Sept. 19
      date: '1967-09-19'
      thread: economy-surcharge
      c: 'Mills to Johnson by telephone, 5:30 p.m.: with deeper cuts in the appropriations, enough votes to pass the bill;
        the concessions must win twenty to twenty-five Republicans. "I never saw such damned opposition any day in my life
        as there is to . . . any increase in taxes."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 281–82. To check: the recordings, [Conversation with Wilbur Mills](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-september-19-1967),
        Conversation WH6709-01-12202 and -12203 (Miller Center) (cited by [[w.zelizer-fierce-urgency-of-now]], 282 n.40).
        See [[cal.1967-08-03.economy]]. Names: Mills, Johnson.'
      tags:
      - name:mills-wilbur-d
      - name:johnson-lyndon-b
      src:
        c: fa4f4fc2
        rows:
        - 'w.zelizer-fierce-urgency-of-now 281–82: all'
- add:
    entry:
      id: cal.1968-03-24.economy-surcharge
      when: Mar. 24
      date: '1968-03-24'
      thread: economy-surcharge
      c: 'Mills to Johnson by telephone, 5:19 p.m.: the Senate''s passage of the Smathers–Williams amendment, the surcharge
        and $6 billion in cuts, would help him show the House bipartisan support for joining the two.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 288–89. To check: the recording, [Conversation with Wilbur Mills](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-wilbur-mills-march-24-1968),
        Conversation WH6803-05-12848 (Miller Center) (cited by [[w.zelizer-fierce-urgency-of-now]], 289 n.56). The vote:
        [[cal.1968-04-02.economy]]. Names: Mills, Johnson.'
      tags:
      - name:mills-wilbur-d
      - name:johnson-lyndon-b
      src:
        c: 7ec46b43
        rows:
