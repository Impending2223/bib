      id: cal.1963-12.desegregation-public-places
      when: Late Dec.
      date: 1963-12
      thread: desegregation-public-places
      also:
      - civil-rights-bill
      c: 'The moratorium on demonstrations since the assassination ends in five Southern cities. Columbia, S.C., more than
        a hundred college students march; 126 arrested. New Orleans, some four hundred at a memorial for Kennedy, then to
        the post office to mail letters to Louisiana''s delegation for the bill. Chapel Hill, N.C., a sit-in, nine carried
        out. Atlanta, King: "The cancer of segregation cannot be cured by the Vaseline of gradualism or the sedative of
        tokenism."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 90–91. To check: "Mass Protests Resuming," *Afro-American*, Dec. 28, 1963
        (cited by [[w.zelizer-fierce-urgency-of-now]], 91 n.18). Check: the days. Names: Martin Luther King.'
