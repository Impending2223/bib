- add:
    entry:
      id: cal.1963-08-28.civil-rights-bill
      when: Aug. 28
      date: '1963-08-28'
      thread: civil-rights-bill
      also:
      - march-on-washington
      c: 'After the March, 5 p.m., the Oval Office: Kennedy with King, Randolph, Wilkins, Young and Reuther. Wilkins: the
        people "and not Martin Luther King or Roy Wilkins . . . have dreamed up this civil rights business." They ask a
        broader bill, a fair employment commission. Kennedy counts the House by delegation: 158 to 160 Democrats; 60 Republicans
        needed, 20 to 25 in the Senate. Randolph: "nothing less than a crusade." Kennedy: better from the grass roots than
        from the President.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 51–52. To check: the recording, [Kennedy, Blake, King, McKissick, Prinz,
        Randolph, Reuther, Wilkins and Young, 5 p.m.](https://prde.upress.virginia.edu/conversations/4006294), JFK Meeting
        Tape 108.1 and 108.2 (PRDE only); [[w.rosenberg-kennedy-johnson-and-the]], 136–39; [[w.reeves-president-kennedy]],
        585; [[w.whalen-longest-debate]], 27 (cited by [[w.zelizer-fierce-urgency-of-now]], 52 n.51). See [[cal.1963-08-28.march-on-washington]].
        Names: Kennedy, Martin Luther King, Randolph, Wilkins, Young, Reuther.'
      tags:
      - name:kennedy-john-f
      - name:king-martin-luther-jr
      - name:randolph-a-philip
      - name:wilkins-roy
      - name:young-whitney-m-jr
      - name:reuther-walter
      src:
        c: '27610831'
        rows:
        - 'w.zelizer-fierce-urgency-of-now 51–52: all'
