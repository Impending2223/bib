# Zelizer, The Fierce Urgency of Now (2015), read from the owner's copy (printed page = PDF page - 18 to p. 114, - 34 to
# p. 242, - 50 after: two sets of plates). The book's notes are mostly studies, newspapers and the White House tapes;
# the presidential statements it leaves uncited (its note at p. 329) are read in the Public Papers.
