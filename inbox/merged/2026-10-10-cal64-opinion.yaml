      n: '*The Gallup Poll*, III, 1883 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Humphrey (K–J Cong. III.A); Brown, Wagner (K–J Cong. III.F); Shriver (K–J Adm. III.G); Fulbright (K–J Cong. III.B).'
