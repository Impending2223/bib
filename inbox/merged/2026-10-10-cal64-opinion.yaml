- add:
    entry:
      id: cal.1964-04-10.opinion
      when: Apr. 10
      date: '1964-04-10'
      thread: opinion
      also: [elections-1964, baker]
      c: 'Gallup, special survey of 1,935 Republican county chairmen, the strongest argument against the Democrats: a weak foreign policy, prestige, foreign aid, Cuba, Vietnam, Panama, 1,302; too much spending, 491; the federal government too powerful, 409; the Baker scandal and corruption, 289; integration too fast, 172; personal criticism of Johnson, 104; farm policy, 94.'
      n: '*The Gallup Poll*, III, 1874 (K–J Cong. II.E). Names: Baker (K–J Cong. III.K); Johnson (K–J Adm. III.D).'
      tags: ['name:baker-robert-g', 'name:johnson-lyndon-b']
