patch: cal64-opinion
by: Claude (agent), from The Gallup Poll, III (1972), pp. 1859-1911, read off the page images
ops:
- add:
    entry:
      id: cal.1964-01-17.opinion
      when: Jan. 17
      date: '1964-01-17'
      thread: opinion
      also: [economy, civil-rights-bill, medicare]
      c: 'Gallup, Jan. 2–7: what Congress should do when it meets. Tax reduction first; civil rights second; medical care for older persons third; then federal spending, aid to education, foreign problems, unemployment.'
      n: '*The Gallup Poll*, III, 1859–60 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-01-19.opinion
      when: Jan. 19
      date: '1964-01-19'
      thread: opinion
      also: [elections-1964]
      c: 'Gallup, Jan. 2–7: Democrats'' choice for Vice President: Robert Kennedy 34, Stevenson 26, Humphrey 14, Shriver 8, Brown 5, Fulbright 2, McCarthy 2, Wagner 2; others, no preference 7. Independents: Stevenson 26, Robert Kennedy 25, Humphrey 13.'
      n: '*The Gallup Poll*, III, 1860 (K–J Cong. II.E). Names: Kennedy (K–J Adm. III.A); Stevenson (K–J Adm. III.E); Shriver (K–J Adm. III.G); Humphrey (K–J Cong. III.A); Fulbright, McCarthy (K–J Cong. III.B); Brown, Wagner (K–J Cong. III.F).'
      tags: ['name:kennedy-robert-f', 'name:stevenson-adlai-e', 'name:shriver-r-sargent', 'name:humphrey-hubert-h', 'name:fulbright-j-william', 'name:mccarthy-eugene-j', 'name:brown-edmund-g', 'name:wagner-robert-f-jr']
- add:
    entry:
      id: cal.1964-01-31.opinion
      when: Jan. 31
      date: '1964-01-31'
      thread: opinion
      also: [succession]
      c: 'Gallup, Jan. 2–7: 53 percent have followed the discussion of presidential succession. Of them, the Secretary of State to succeed in place of the Speaker, 46 for, 36 against.'
      n: '*The Gallup Poll*, III, 1862 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-02-02.opinion
      when: Feb. 2
      date: '1964-02-02'
      thread: opinion
      also: [desegregation-public-places, civil-rights-bill]
      c: 'Gallup, Jan. 2–7: a law giving all persons, Negro and white, the right to be served in hotels, restaurants, theaters, and the like, 61 percent for, 31 against. Whites outside the South 71 for; Southern whites 20 for, 72 against.'
      n: '*The Gallup Poll*, III, 1863 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-02-12.opinion
      when: Feb. 12
      date: '1964-02-12'
      thread: opinion
      also: [latin-america]
      c: 'Gallup, Jan. 31–Feb. 5: 64 percent have followed the dispute with Panama over the Canal Zone. Of them: a firm policy, no concessions, 45 percent; firm, but better relations, 11; concessions (more rent, a new treaty, the Canal to Panama), 9; no opinion 23.'
      n: '*The Gallup Poll*, III, 1864 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-02-16.opinion
      when: Feb. 16
      date: '1964-02-16'
      thread: opinion
      also: [elections-1964]
      c: 'Gallup, Jan. 30–Feb. 5: Republicans'' choice for 1964: Nixon 31, Goldwater 20, Rockefeller 16, Lodge 12, Scranton 7, Romney 5; others, no preference 9. Independents: Nixon 29, Goldwater 18, Lodge 18, Rockefeller 16.'
      n: '*The Gallup Poll*, III, 1864–65 (K–J Cong. II.E). Names: Nixon (Opp. III.E); Goldwater (Opp. III.B); Lodge (K–J Adm. III.E); Rockefeller, Romney, Scranton (Opp. III.H).'
      tags: ['name:nixon-richard-m', 'name:goldwater-barry-m', 'name:lodge-henry-cabot', 'name:rockefeller-nelson', 'name:romney-george-w', 'name:scranton-william-w']
- add:
    entry:
      id: cal.1964-02-19.opinion
      when: Feb. 19
      date: '1964-02-19'
      thread: opinion
      also: [elections-1964]
      c: 'Gallup, Jan. 30–Feb. 5: the convention''s choice between Goldwater and Rockefeller: Rockefeller 49, Goldwater 36, undecided 15. Republicans: Goldwater 44, Rockefeller 41. Independents: Rockefeller 48, Goldwater 40.'
      n: '*The Gallup Poll*, III, 1865 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Rockefeller (Opp. III.H).'
      tags: ['name:goldwater-barry-m', 'name:rockefeller-nelson']
- add:
    entry:
      id: cal.1964-02-23.opinion
      when: Feb. 23
      date: '1964-02-23'
      thread: opinion
      c: 'Gallup, Jan. 30–Feb. 2: Johnson''s handling of problems at home, 70 percent approve, 12 disapprove; of foreign policy, 61 approve, 14 disapprove. Republicans 57 and 47 approve.'
      n: '*The Gallup Poll*, III, 1866–67 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1964-02-26.opinion
      when: Feb. 26
      date: '1964-02-26'
      thread: opinion
      also: [desegregation-public-places, civil-rights-bill]
      c: 'Gallup, Jan. 30–Feb. 2: the Johnson administration pushing integration too fast, 30 percent; not fast enough, 15; about right, 39. Southern whites 49 too fast; whites outside the South 28.'
      n: '*The Gallup Poll*, III, 1867 (K–J Cong. II.E). Names: Johnson (K–J Adm. III.D).'
      tags: ['name:johnson-lyndon-b']
- add:
    entry:
      id: cal.1964-03-04.opinion
      when: Mar. 4
      date: '1964-03-04'
      thread: opinion
      also: [elections-1964]
      c: 'Gallup, Jan. 30–Feb. 4: the party to keep the country prosperous: Democratic 48 percent, Republican 20, no difference 21. To keep the country out of World War III: Democratic 34, Republican 21, no difference 31.'
      n: '*The Gallup Poll*, III, 1868 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-03-22.opinion
      when: Mar. 22
      date: '1964-03-22'
      thread: opinion
      also: [poverty]
      c: 'Gallup, Feb. 28–Mar. 5: more often to blame if a person is poor: lack of effort 33 percent, circumstances 29, both equally 32. Of those choosing, Republicans 64 effort; Democrats 53 circumstances. Poverty ever done away with here: yes 9, no 83.'
      n: '*The Gallup Poll*, III, 1870 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-03-25.opinion
      when: Mar. 25
      date: '1964-03-25'
      thread: opinion
      also: [rules, civil-rights-bill]
      c: 'Gallup, Feb. 28–Mar. 5: 54 percent can say what a filibuster is. Of them, a simple majority to end debate in place of two-thirds, 40 approve, 38 disapprove. The South 35 approve, 41 disapprove.'
      n: '*The Gallup Poll*, III, 1870–71 (K–J Cong. II.E).'
- add:
    entry:
      id: cal.1964-03-29.opinion
      when: Mar. 29
      date: '1964-03-29'
      thread: opinion
      also: [elections-1964]
      c: 'Gallup, special survey of Republican county chairmen, their own choice for the nomination: Goldwater 878, Nixon 383, Lodge 244, Scranton 164, Rockefeller 117; others 37, no preference 17.'
      n: '*The Gallup Poll*, III, 1871 (K–J Cong. II.E). Names: Goldwater (Opp. III.B); Nixon (Opp. III.E); Lodge (K–J Adm. III.E); Scranton, Rockefeller (Opp. III.H).'
      tags: ['name:goldwater-barry-m', 'name:nixon-richard-m', 'name:lodge-henry-cabot', 'name:scranton-william-w', 'name:rockefeller-nelson']
