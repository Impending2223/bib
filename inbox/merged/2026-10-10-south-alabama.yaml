patch: south-1964-alabama
by: south-1964 drafter (Alabama)
ops:
- add:
    entry:
      id: cal.1964-02-03.alabama
      when: Feb. 3–18
      date: '1964-02-03'
      thread: alabama
      also:
      - desegregation-schools
      c: Tuskegee. On the State Board of Education's order, Wallace its president ex officio, Tuskegee High closed above the seventh grade, Feb. 3; its twelve pupils, all Black, left to go back to Tuskegee Institute High. Judge Johnson orders them admitted to the white high schools at Shorter and Notasulga. Feb. 4, the State board "deplores the order of Judge Johnson" and directs tuition grants. Feb. 5, Notasulga's mayor turns six away under new town ordinances; the white pupils leave both schools. Feb. 14, Johnson enjoins the mayor. Feb. 18, the justices of the Alabama Supreme Court, asked by Wallace, advise that no State law authorized the board's orders.
      n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/html/0743-01.html) (M.D. Ala. 1964) (the three-judge court''s findings, July 13); *United States v. Rea*, [231 F. Supp. 772](https://static.case.law/f-supp/231/html/0772-01.html) (M.D. Ala. 1964). Bass, *Taming the Storm* (K–J Cong. II.G). See [[cal.1963-09-02.alabama]]. Names: Wallace (K–J Cong. III.F); Johnson (K–J Cong. III.G).'
      tags:
      - name:wallace-george-c
      - name:johnson-frank-m-jr
- add:
    entry:
      id: cal.1964-03-06.elections-1964
      when: Mar. 6
      date: '1964-03-06'
      thread: elections-1964
      also:
      - alabama
      c: 'Wallace at Madison: he files in Wisconsin''s Democratic presidential primary, his slate of sixty delegates against the favorite-son slate of the State''s governor.'
      n: '[Photograph](https://wisconsinhistory.org/Records/Image/IM116625) by Richard Sroda, Mar. 6, 1964, and its caption (Wisconsin Historical Society). Carter, *The Politics of Rage* (K–J Cong. II.H). Lesher, *George Wallace* (K–J Cong. II.I.3). Names: Wallace (K–J Cong. III.F).'
      tags:
      - name:wallace-george-c
- add:
    entry:
      id: cal.1964-03-19.voting-rights
      when: Mar. 19
      date: '1964-03-19'
      thread: voting-rights
      also:
      - alabama
      c: 'Selma. Judge Thomas denies the Justice Department''s two Dallas County suits, filed June 26 and Nov. 12, 1963. Sheriff Clark''s men at the mass meetings, the arrests of registration workers: no federal right violated, the plaintiff having "failed in its proof" (*United States v. Dallas County*). The county grand jury, acting in good faith, may compel the Civil Rights Division''s lawyers to testify (*United States v. McLeod*).'
      n: '*United States v. Dallas County*, [229 F. Supp. 1014](https://static.case.law/f-supp/229/html/1014-01.html) (S.D. Ala. 1964); *United States v. McLeod*, [229 F. Supp. 383](https://static.case.law/f-supp/229/html/0383-01.html) (S.D. Ala. 1964). Both reversed: *United States v. McLeod*, [385 F.2d 734](https://static.case.law/f2d/385/html/0734-01.html) (5th Cir. 1967). Garrow, *Protest at Selma*; Lawson, *Black Ballots* (K–J Cong. II.C). Landsberg, *Enforcing Civil Rights* (K–J Adm. II.C). Names: Thomas, Clark (K–J Cong. III.K).'
      tags:
      - name:thomas-daniel-h
      - name:clark-james-g-jr
- add:
    entry:
      id: cal.1964-05-05.alabama
      when: May 5
      date: '1964-05-05'
      thread: alabama
      also:
      - elections-1964
      c: 'Alabama''s Democratic primary. Ten unpledged electors nominated over a slate pledged to the national ticket: Place No. 1, Lieutenant Governor Allen 516,612, the pledged candidate 84,721. Representatives by the nine old districts, for eight seats: Carl Elliott over Bevill in the 7th; Amelia Boynton of Selma, 4,753 to Roberts''s 47,360 in the 4th. Connor elected national committeeman, 282,703 of 525,395.'
      n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [489](https://archive.org/details/alabama-official-statistical-register-1967/page/n490) (Representatives), [499](https://archive.org/details/alabama-official-statistical-register-1967/page/n500)–[501](https://archive.org/details/alabama-official-statistical-register-1967/page/n502) (national committeeman, electors). Cosman, *Five States for Goldwater* (Opp. II.E). Bartley & Graham, *Southern Politics and the Second Reconstruction* (Opp. II.F). Carter, *The Politics of Rage* (K–J Cong. II.H). Names: Boynton, Connor (K–J Cong. III.K).'
      tags:
      - name:allen-james-b
      - name:elliott-carl-a
      - name:bevill-tom
      - name:boynton-amelia-platts
      - name:roberts-kenneth-a
      - name:connor-eugene
- add:
    entry:
      id: cal.1964-06-01.court
      when: June 1
      date: '1964-06-01'
      thread: court
      also:
      - alabama
      - civil-rights-organizations
      c: '*NAACP v. Alabama ex rel. Flowers*, [377 U.S. 288](https://tile.loc.gov/storage-services/service/ll/usrep/usrep377/usrep377288/usrep377288.pdf). The NAACP, barred from Alabama by a State court''s order of June 1, 1956, before the Court a fourth time. The judgment ousting it reversed; the Alabama Supreme Court to have the injunction vacated and the Association let qualify to do business. Harlan for the Court.'
      n: 'Opinion (K–J Cong. II.J.1). Powe, *The Warren Court and American Politics* (K–J Cong. II.G). Wilkins, *Standing Fast* (K–J Cong. II.I.4). Names: Harlan (K–J Cong. III.G).'
      tags:
      - name:harlan-john-marshall
- add:
    entry:
      id: cal.1964-06-02.alabama
      when: June 2
      date: '1964-06-02'
      thread: alabama
      also:
      - elections-1964
      c: 'Alabama''s second primary. The nine Democratic nominees for Representative on one statewide ballot, the eight highest to be the party''s nominees: Carl Elliott ninth, 316,775, 5,098 votes short. Connor nominated president of the Public Service Commission, 225,676 to 204,418. Aug. 19, the legislature, in special session, draws eight districts for November (Act No. 21).'
      n: '*Alabama Official and Statistical Register, 1967* (Ala. Dept. of Archives and History), [524](https://archive.org/details/alabama-official-statistical-register-1967/page/n525)–[526](https://archive.org/details/alabama-official-statistical-register-1967/page/n527), [530](https://archive.org/details/alabama-official-statistical-register-1967/page/n531) (the nominees), [260](https://archive.org/details/alabama-official-statistical-register-1967/page/n261) (Act No. 21). Encyclopedia of Alabama, ["Carl Elliott"](https://encyclopediaofalabama.org/article/carl-elliott/). See [[cal.1964-05-05.alabama]]. Names: Connor (K–J Cong. III.K).'
      tags:
      - name:elliott-carl-a
      - name:connor-eugene
- add:
    entry:
      id: cal.1964-06-18.desegregation-schools
      when: June 18
      date: '1964-06-18'
      thread: desegregation-schools
      also:
      - alabama
      c: 'Fifth Circuit, on the Birmingham and Mobile school plans: desegregation to proceed "at a swifter pace," ten years after *Brown*. Birmingham, its 12th grade begun in 1963, to add the 10th, 11th and 1st grades in September 1964, then a grade a year at each level; Mobile to file a plan meeting the same minimum.'
      n: '*Armstrong v. Board of Education of the City of Birmingham*, [333 F.2d 47](https://static.case.law/f2d/333/html/0047-01.html) (5th Cir. 1964); *Davis v. Board of School Commissioners of Mobile County*, [333 F.2d 53](https://static.case.law/f2d/333/html/0053-01.html) (5th Cir. 1964). Bass, *Unlikely Heroes* (K–J Cong. II.H). See [[cal.1963-09-09.alabama]].'
- add:
    entry:
      id: cal.1964-07-04.alabama
      when: July 4–9
      date: '1964-07-04'
      thread: alabama
      also:
      - voting-rights
      - desegregation-public-places
      c: Selma tests the Civil Rights Act. July 4, four students arrested at the Thirsty Boy drive-in, Sheriff Clark using a cattle prod; Black teenagers made to leave the Wilby Theatre, which Clark closes. July 5, his possemen club and gas the crowd leaving a mass meeting. July 6, 53 arrested at the courthouse, where pickets urged registration. July 9, Circuit Judge Hare enjoins gatherings of three or more in public, naming some 47 persons and 15 organizations, the Klan among them. Sept. 2, the United States sues Clark, Hare, the circuit solicitor, the probate judge and the city (*United States v. Clark*); heard in December by a three-judge court.
      n: '*United States v. Clark*, [249 F. Supp. 720](https://static.case.law/f-supp/249/html/0720-01.html) (S.D. Ala. 1965) (the findings); [the case](https://clearinghouse.net/case/14753/), Civil Rights Litigation Clearinghouse (filed Sept. 2, 1964). Garrow, *Protest at Selma* (K–J Cong. II.C). Carson, *In Struggle* (K–J Cong. II.F). Lewis, *Walking with the Wind* (K–J Cong. II.I.4). See [[cal.1964-03-19.voting-rights]]; [[cal.1964-07-03.civil-rights-bill]]. Names: Clark, Hare (K–J Cong. III.K).'
      tags:
      - name:clark-james-g-jr
      - name:hare-james-a
- add:
    entry:
      id: cal.1964-07-13.alabama
      when: July 13
      date: '1964-07-13'
      thread: alabama
      also:
      - desegregation-schools
      c: '*Lee v. Macon County Board of Education*. A three-judge court, Judge Johnson sitting, enjoins Wallace as president of the State Board of Education, the board and the State superintendent from interfering with any school board in Alabama desegregating under a federal court''s order. No tuition grants for any school limited by race. No statewide order "at this time"; State money for segregated schools to stop within a reasonable time. Macon County to extend its plan for September; Macon Academy made a defendant.'
      n: '*Lee v. Macon County Board of Education*, [231 F. Supp. 743](https://static.case.law/f-supp/231/html/0743-01.html) (M.D. Ala. 1964). Opinion (K–J Cong. II.J.1). Bass, *Taming the Storm* (K–J Cong. II.G). Bass, *Unlikely Heroes* (K–J Cong. II.H). See [[cal.1964-02-03.alabama]]. Names: Johnson (K–J Cong. III.G); Wallace (K–J Cong. III.F).'
      tags:
      - name:johnson-frank-m-jr
      - name:wallace-george-c
- add:
    entry:
      id: cal.1964-07-19.elections-1964
      when: July 19
      date: '1964-07-19'
      thread: elections-1964
      also:
      - alabama
      c: Wallace, on CBS's *Face the Nation*, withdraws as a candidate for President, four days after Goldwater's nomination. Check.
      n: 'Carter, *The Politics of Rage* (K–J Cong. II.H). See [[cal.1964-03-06.elections-1964]]; [[cal.1964-07-15.elections-1964]]. The program, CBS, July 19, 1964, Wallace the guest: *Face the Nation, 1954–1970: Index* (1972). Names: Wallace (K–J Cong. III.F); Goldwater (Opp. III.B).'
      tags:
      - name:wallace-george-c
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-31.desegregation-schools
      when: July 31
      date: '1964-07-31'
      thread: desegregation-schools
      also:
      - alabama
      c: 'Judge Johnson orders Montgomery County''s schools desegregated from September: the 1st, 10th, 11th and 12th grades, under the Placement Law after public notice; a plan for the whole system by Jan. 15, 1965 (*Carr*). Aug. 5, Bullock County: the Placement Law applied without discrimination from September, a plan by the same date (*Harris*).'
      n: '*Carr v. Montgomery County Board of Education*, [232 F. Supp. 705](https://static.case.law/f-supp/232/html/0705-01.html) (M.D. Ala. 1964); *Harris v. Bullock County Board of Education*, [232 F. Supp. 959](https://static.case.law/f-supp/232/html/0959-01.html) (M.D. Ala. 1964). Bass, *Taming the Storm* (K–J Cong. II.G). See [[cal.1964-06-18.desegregation-schools]]; [[cal.1964-07-13.alabama]]. Names: Johnson (K–J Cong. III.G).'
      tags:
      - name:johnson-frank-m-jr
- add:
    entry:
      id: cal.1964-08-24.alabama
      when: Aug. 24–25
      date: '1964-08-24'
      thread: alabama
      also:
      - elections-1964
      c: 'Atlantic City. Alabama''s delegates, elected pledged to Wallace, seated only on signing a pledge to support the convention''s nominees. Most refuse, Connor, the national committeeman, among them; on the opening night those not seated sit in the delegation''s seats. Aug. 25, Johnson, by telephone with Connally and Georgia''s governor: "Nobody claims they won''t do it except Mississippi and Alabama." Check the counts and the dates.'
      n: '[Johnson, Connally, and Sanders, 4:32 p.m.](https://prde.upress.virginia.edu/conversations/4002851), Conversation WH6408-37-5183, 5184 (PRDE), quoted in KC Johnson, ["The Atlantic City Convention"](https://allthewaywithlbj.com/the-atlantic-city-convention/). Made public: the recordings, opened by the LBJ Library. Check the year. White, *The Making of the President 1964* (Opp. II.E). Carter, *The Politics of Rage* (K–J Cong. II.H). See [[cal.1964-05-05.alabama]]; [[cal.1964-08-22.mississippi]]. Names: Wallace (K–J Cong. III.F); Connor (K–J Cong. III.K); Johnson (K–J Adm. III.D); Connally (K–J Cong. III.F).'
      tags:
      - name:wallace-george-c
      - name:connor-eugene
      - name:johnson-lyndon-b
      - name:connally-john
- add:
    entry:
      id: cal.1964-09-17.desegregation-public-places
      when: Sept. 17
      date: '1964-09-17'
      thread: desegregation-public-places
      also:
      - alabama
      - civil-rights-bill
      c: 'Birmingham. Ollie''s Barbecue, eleven blocks from the nearest interstate highway: some $150,000 of food a year, bought locally, $69,783 of it meat shipped from outside the State. A three-judge court holds Title II, applied to it, beyond the power of Congress, and enjoins its enforcement against the owners. Oct. 5, the Supreme Court notes probable jurisdiction.'
      n: '*McClung v. Katzenbach*, [233 F. Supp. 815](https://static.case.law/f-supp/233/html/0815-01.html) (N.D. Ala. 1964). Reversed: [[cal.1964-12-14.court]]. Powe, *The Warren Court and American Politics* (K–J Cong. II.G). See [[cal.1964-07-03.civil-rights-bill]].'
- add:
    entry:
      id: cal.1964-11-03.alabama
      when: Nov. 3
      date: '1964-11-03'
      thread: alabama
      also:
      - elections-1964
      c: 'Alabama. Goldwater 479,085, the unpledged Democratic electors 210,732; no electors for Johnson on the ballot. Republicans take five of the eight House seats: Edwards, Dickinson, Glenn Andrews, Buchanan, Martin. Grant, Roberts and Huddleston beaten; the open 1st and 7th lost as well.'
      n: '[*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965), 2. Cosman, *Five States for Goldwater* (Opp. II.E). Bartley & Graham, *Southern Politics and the Second Reconstruction* (Opp. II.F). See [[cal.1964-06-02.alabama]]; [[cal.1964-11-03.elections-1964]]. Names: Goldwater (Opp. III.B); Johnson (K–J Adm. III.D); Martin (Opp. III.I).'
      tags:
      - name:goldwater-barry-m
      - name:johnson-lyndon-b
      - name:edwards-william-j
      - name:dickinson-william-l
      - name:andrews-arthur-g
