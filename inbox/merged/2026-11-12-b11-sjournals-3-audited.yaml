      when: Aug. 25
      date: '1968-08-25'
      thread: elections-1968-chicago-kennedy
      c: 'Chicago, Sunday afternoon. California delegates to Schlesinger: Edward Kennedy could get the nomination only if he came in as an active candidate against Humphrey. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 298. See [[cal.1968-08-24.elections-1968-2]]. Names: Kennedy, Humphrey, Schlesinger.'
