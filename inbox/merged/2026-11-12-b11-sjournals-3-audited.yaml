- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-kennedy
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago-kennedy
      c: 'Chicago, after dinner. Schlesinger telephones Edward Kennedy. Kennedy: "I have a gut feeling that this is not the year, that it is too early for me"; he expects Humphrey to win on the first ballot; "We''ve called off" DiSalle, who had planned to nominate him; "I don''t plan to do a thing. If the convention wants me, they will be doing this on their own." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 298–99. Check: the day (the call follows the paragraph on "Monday morning"; the page gives no day). See [[cal.1968-08-25.elections-1968-chicago-kennedy]]. Names: Kennedy, Schlesinger, Humphrey, DiSalle.'
