- cite:
    id: cal.1967-11-29.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 264–66 (the journal of Nov. 29: New York, the King Cole Bar, around eleven, with Salinger, the vanden Heuvels and Tom Johnson; McNamara had had no intimation that Johnson sent his name up, only a general talk the spring before, and heard it from a leak in London; Schlesinger: "Wouldn''t any self-respecting man, I asked Bobby, have his resignation on the President''s desk half an hour after he heard the London bulletin?"; Kennedy thinks McNamara will not take the Bank and will quietly resign; the morning *Times* when they broke up around one, "MCNAMARA TAKES WORLD BANK POST"; Kennedy on McCarthy''s campaign and his own; not the afternoon papers)'
    units: B, C, D, E, F
- cite:
    id: cal.1967-11.robert-kennedy
    item: '[[w.schlesinger-journals]], 265 (Kennedy at the King Cole Bar, Nov. 29: McCarthy "had come in to see him the other day and stayed for seven minutes," said nothing of his plans for organization or issues, "didn''t ask a single question"; Edward Kennedy the same; not McCarthy''s saying he will announce or the "stalking horse")'
    units: C
- cite:
    id: cal.1967-12-10.robert-kennedy
    item: '[[w.schlesinger-journals]], 268–70 (a Sunday luncheon at vanden Heuvel''s; those present; Schlesinger and Goodwin for running in 1968; Edward Kennedy and Sorensen for waiting, 1972; "He would die and make Hubert President rather than let me get it"; "he supposed he would do nothing, and nothing would happen"; no final decisions for a few more weeks; not the city)'
    units: B, C, D, E, F, G
- cite:
    id: cal.1968-01-17.robert-kennedy
    item: '[[w.schlesinger-journals]], 273–75 (Wednesday, Jan. 17, Lippmann''s apartment, Kennedy and Schlesinger; the California primary and Johnson''s stopping the bombing; Lippmann: "whether you did everything you could do to avert this catastrophe"; not the city or Kennedy''s having no support)'
    units: C-E
- cite:
    id: cal.1968-01-25.robert-kennedy-campaign-decision
    item: '[[w.schlesinger-journals]], 275–76 (dinner at La Caravelle with Ethel Kennedy and Schlesinger and his wife; his brother Ted "the strongest opponent of his moving"; Ethel for it; not the Schmidts, the quotation, Schlesinger''s stand at the table or the *Pueblo* reserves)'
    units: B
- cite:
    id: cal.1968-02-04.japan-and-korea-pueblo
    item: '[[w.schlesinger-journals]], 278–79 (McNamara''s *Meet the Press* of Feb. 4, by his account to Schlesinger at Hickory Hill after Feb. 16: called the Friday night before; acutely nervous until the broadcast, not wanting to say on Vietnam what he did not believe nor to let the administration down; Schlesinger''s congratulations on his points about the fallibility of officials; not Rusk or the *Pueblo*)'
    units: '?'
- cite:
    id: cal.1968-02-16.elections-1968
    item: '[[w.schlesinger-journals]], 277–79 (Friday, Feb. 16, lunch with Rockefeller and Kissinger; Schlesinger''s speech on the disenfranchised young, Rockefeller: "I couldn''t agree more"; "You know, I have my roots in the New Deal"; not Romney, the primaries or the eighteen governors)'
    units: F
- variant:
    id: cal.1968-02-16.elections-1968
    unit: A
    witness: w.schlesinger-journals
    reads: 'Schlesinger: the lunch "took place at 13 West 54th Street in a high-ceilinged, second-floor apartment"'
    at: '277'
- cite:
    id: cal.1968-03-10.robert-kennedy-campaign
    item: '[[w.schlesinger-journals]], 279 (Sunday, Mar. 10, at the Galbraiths'' in Cambridge: Ethel Kennedy, who had just spoken to Robert Kennedy in California, transmits "the long awaited message": he would definitely run if McCarthy could be persuaded to withdraw; not Mar. 11)'
    units: A
- cite:
    id: cal.1968-03-12.elections-1968-2
    item: '[[w.schlesinger-journals]], 279 (McCarthy 42 percent of the popular vote and "at least 20 out of 24 delegates"; not the write-in or Kennedy''s word of Mar. 13)'
    units: '?'
- cite:
    id: cal.1968-03-12.robert-kennedy-campaign
    item: '[[w.schlesinger-journals]], 280, 286 (dinner at Ham Armstrong''s, "on the night of the New Hampshire primary" (286): Moyers to Schlesinger, Johnson "well sealed off from reality," the White House "impenetrable," "paranoid," four more years of Johnson "ruinous for the country"; later, Robert Kennedy at the 21 Club with vanden Heuvel and Tom Johnson, "a little subdued"; McCarthy''s success had boxed him in: "I don''t blame him at all"; Schlesinger''s suggestion that he endorse McCarthy; not the city, the United Jewish Appeal dinner or "no surprise")'
    units: '?'
- cite:
    id: cal.1968-03-13.elections-1968
    item: '[[w.schlesinger-journals]], 280–81 (the afternoon meeting at Stephen Smith''s apartment, some fourteen named; Edward Kennedy sets out the options; Sorensen proposes that Kennedy stay neutral between McCarthy and Johnson; in the evening, Kennedy''s Cronkite interview watched; O''Donnell to Schlesinger: "The right thing to do is for him to run and not worry about the consequences to himself," O''Donnell and Dutton finding the planning "hopelessly amateurish"; Kennedy, riding downtown, to decide "in the next thirty-six hours"; not Salinger''s or Marshall''s position, Johnson''s commission or the interview''s words)'
    units: B
- cite:
    id: cal.1968-03-13.robert-kennedy
    item: '[[w.schlesinger-journals]], 281–82 (Kennedy''s account to Schlesinger: friendly, "did not go very far"; Kennedy''s congratulations, his own situation reassessed; McCarthy would not get out, would serve one term only, Kennedy, "while I''m not making an offer," the logical successor; the day the editors'', "[the next day]," after the meeting at Smith''s; the journal gives none; not the airport, Washington or Wisconsin)'
    units: D-E
- cite:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    item: '[[w.schlesinger-journals]], 282–83 (a party in progress at Hickory Hill; Dutton and Sorensen dismayed by it; the serious talk with Kennedy, Walinsky, Lowenstein, Greenfield and Stevens, Schlesinger and vanden Heuvel stressing conciliation of McCarthy''s people; bed around 1:30; about four hours later Edward Kennedy back from McCarthy: "Very unsatisfactory," and to vanden Heuvel "Abigail said no"; an hour or so later Kennedy, in pajamas, to Schlesinger, "What do you think I should do?" and, on coming out for McCarthy, "I can''t do that. It would be too humiliating. Kennedys don''t act that way"; at the breakfast table Schlesinger and vanden Heuvel for McCarthy, and Kennedy: "I''m going ahead, and there is no point in talking about anything else"; not "long planned," the hours of five and seven, Dutton at breakfast or Green Bay)'
    units: E
- variant:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    unit: B
    witness: w.schlesinger-journals
    reads: 'Schlesinger: "Finally around 10:30 we settled down with Bobby for a serious talk"'
    at: '282'
- cite:
    id: cal.1968-03-16.robert-kennedy-campaign-2
    item: '[[w.schlesinger-journals]], 284 (the announcement "in the Caucus Room in the Old Senate Office Building—where JFK had announced at the same age, eight years earlier"; Schlesinger, Dutton and vanden Heuvel watch on television in Edward Kennedy''s office; not the words of the statement)'
    units: A
- cite:
    id: cal.1968-03-16.robert-kennedy
    item: '[[w.schlesinger-journals]], 284 (after the announcement Kennedy "went off to the St. Patrick''s parade in New York"; not Fifth Avenue or the crowd)'
    units: '?'
- cite:
    id: cal.1968-03-31.robert-kennedy
    item: '[[w.schlesinger-journals]], 285 (the night of Mar. 31, Schlesinger finds at the apartment Dutton, Sorensen, vanden Heuvel, Walinsky and others; Sorensen has written a telegram to Johnson requesting a meeting; Kennedy on the telephone with political figures around the country; Kennedy "supposed to arrive in New York that evening at 9:45"; not the landing, Burns or the telegram''s text or time)'
    units: B
- cite:
    id: cal.1968-04-03.robert-kennedy
    item: '[[w.schlesinger-journals]], 286 (Kennedy to Schlesinger by telephone that evening: the meeting "friendly enough," Johnson "planned for the time being to stay out of the presidential contest," Kennedy would appreciate being told if he changed his mind; not Sorensen, the fund-raising dinners or Johnson''s options)'
    units: '?'
- cite:
    id: cal.1968-04-03.elections-1968-7
    item: '[[w.schlesinger-journals]], 286–87 (David Karr''s account by telephone to Schlesinger, Apr. 4: an hour with Johnson "yesterday," "terrifying"; Johnson''s self-pity, the "partnership" with John Kennedy, "Then my partner died, and I took over the partnership"; bitter about Robert Kennedy, "On civil rights I was stronger than he was"; Robert Kennedy and the Bay of Pigs, where the credibility gap began; not Pearson or the hour)'
    units: '?'
- cite:
    id: cal.1968-06-06.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 291, 293 (Schlesinger among those waiting that evening at Butler Aviation for the plane bearing the body from Los Angeles; the family, then a special Mass at St. Patrick''s; not Rockefeller, Air Force One or LaGuardia)'
    units: '?'
- cite:
    id: cal.1968-06-08.robert-kennedy
    item: '[[w.schlesinger-journals]], 293–95 (Saturday morning, "the service"; Edward Kennedy''s eulogy "superbly"; Reuther to Schlesinger at Pennsylvania Station, waiting for the train: the poor and the non-white "will all opt out now"; by train to Washington, the tracks lined with people, some crying, the train behind schedule; on the train O''Donnell, "Yes, but what are they good for?" and Radziwill, "To think that a few days ago they were calling this man the most ruthless man in America"; Arlington after nightfall, the last words said over the casket; "from St. Patrick''s Cathedral to Arlington Cemetery" (295); not the requiem Mass, Johnson, or the grave''s place)'
    units: C
- cite:
    id: cal.1968-08-10.elections-1968-2
    item: '[[w.schlesinger-journals]], 296–97 (Aug. 8, a message from McGovern''s office that he had decided to announce for the presidency "on Saturday"; McGovern by telephone that night: Unruh, Mankiewicz and Salinger encouraged him; not his statement)'
    units: '?'
- cite:
    id: cal.1968-08-27.elections-1968-chicago-18
    item: '[[w.schlesinger-journals]], 297 (the Chicago trip, "back at a Democratic convention," after Robert Kennedy''s death, for the weekend, to help McGovern, before going with his wife to Hong Kong "on Tuesday"; the trip to Japan reinstated; not the button, the opening or Japan as the destination)'
    units: '?'
- cite:
    id: cal.1968-10-12.vietnam
    item: '[[w.schlesinger-journals]], 300 (Humphrey to Schlesinger, Oct. 14: Bundy''s "Saturday speech unveiling himself as a dove" had "legitimatized" the antibombing position; not the place or the speech''s terms)'
    units: '?'
- cite:
    id: cal.1969-01-14.program
    item: '[[w.schlesinger-journals]], 305 (Johnson''s "last State of the Union message tonight," Schlesinger watching; not the joint session or the words)'
    units: '?'
- cite:
    id: cal.1969-01-20.transition-and-staff
    item: '[[w.schlesinger-journals]], 306 (the journal of Jan. 22: "The Age of Nixon began two days ago"; the inaugural address "a collection of unimpeachable banalities," one notable line, "The American dream does not come to those who fall asleep"; nothing on law and order or the Communist conspiracy; not the oath, its lines quoted here, the Senate or Johnson)'
    units: A
- add:
    entry:
      id: cal.1968-01-09.robert-kennedy-campaign-decision
      when: Jan. 9
      date: '1968-01-09'
      thread: robert-kennedy-campaign-decision
      c: 'Orsini''s, Tuesday night. Robert Kennedy to Schlesinger: Jesse Unruh and other California politicians want him to enter the California primary and assure him he can win; he doubts their motives: they want it to help themselves, not him. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 273 (the journal''s Jan. 10: "last night (Tuesday)"). See [[cal.1968-01-09.robert-kennedy]]. Names: Kennedy, Unruh, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:unruh-jesse-m
      - name:schlesinger-arthur-m-jr
      - state:ca
- add:
    entry:
      id: cal.1968-01-19.robert-kennedy-campaign-decision
      when: Jan. 19
      date: '1968-01-19'
      thread: robert-kennedy-campaign-decision
      c: 'Schlesinger, at St. Paul''s School, telephones McGovern about Robert Kennedy''s running. McGovern, whom Kennedy had asked a month before to take soundings: he had talked with Gaylord Nelson, Church, Burdick, Governor Hughes of Iowa and others; "universal reluctance even to consider the possibility"; general agreement that Kennedy would run better, but "No one was ready to stick his neck out." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 275 (the journal''s Jan. 19: "this morning"; the soundings undated, "a month ago"; the first quotation is Schlesinger''s report of McGovern, the last McGovern''s words). See [[cal.1968-01-17.robert-kennedy]]. Names: Schlesinger, McGovern, Kennedy, Nelson, Church, Burdick, Hughes.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mcgovern-george
      - name:kennedy-robert-f
      - name:nelson-gaylord-a
      - name:church-frank
      - name:burdick-quentin-n
      - name:hughes-harold-e
      - state:ia
- add:
    entry:
      id: cal.1968-01-25.robert-kennedy-campaign-decision-2
      when: Jan. 25
      date: '1968-01-25'
      thread: robert-kennedy-campaign-decision
      c: 'Patrick Lucey of Wisconsin with Robert Kennedy, in the afternoon: Lucey advises him against running. By Kennedy''s word to Schlesinger at dinner that evening, in Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 276. See [[cal.1968-01-25.robert-kennedy-campaign-decision]]. Names: Lucey, Kennedy, Schlesinger.'
      tags:
      - name:lucey-patrick
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:wi
- add:
    entry:
      id: cal.1968-02-02.press-and-broadcasting
      when: Feb. 2
      date: '1968-02-02'
      thread: press-and-broadcasting
      c: Friday night, five minutes to eleven. McNamara, visiting his wife in the hospital, is called and told they want him on *Meet the Press* that Sunday and will announce it on the eleven o'clock news. By McNamara's account to Schlesinger, in Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 278–79 (the journal of Feb. 19: McNamara''s account at Hickory Hill, after the lunch of Friday, Feb. 16; "the Friday night preceding" the broadcast of Feb. 4; the caller not named). Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-03-17.elections-1968-mccarthy
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968-mccarthy
      c: 'A McCarthy fund-raising breakfast, Sunday morning. Schlesinger, who had agreed to speak a fortnight before: now that Kennedy has announced, he is for Kennedy, but for McCarthy in Ohio and Wisconsin, and glad to speak for him. About $8,000 raised. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 284. See [[cal.1968-03-16.robert-kennedy-campaign-2]]. Names: Schlesinger, Kennedy, McCarthy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:oh
      - state:wi
- add:
    entry:
      id: cal.1968-03-17.elections-1968-mccarthy-2
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968-mccarthy
      c: 'McCarthy, in an item in the Chicago *Sun-Times* read to Schlesinger by telephone that day by Richard Wade, attacks him sarcastically for abandoning his campaign. Schlesinger, in the journal: he was never in it, and has spoken to McCarthy only once in six months.'
      n: '[[w.schlesinger-journals]], 284. Check: the day (the item is read to Schlesinger on Mar. 17; the page does not date the remark). See [[cal.1968-03-17.elections-1968-mccarthy]]. Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
      - state:il
- add:
    entry:
      id: cal.1968-03-19.robert-kennedy-campaign
      when: Mar. 19
      date: '1968-03-19'
      thread: robert-kennedy-campaign
      c: 'Robert Kennedy telephones Schlesinger from Hickory Hill, about nine, for half an hour, Ethel placing the call: "Are you glad I''m doing this?" Schlesinger: yes, and he was wrong in telling him "not to run on Saturday morning." Kennedy: "Well, you were right earlier, and I was wrong then." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 285. See [[cal.1968-03-16.robert-kennedy-campaign-2]]. Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:va
- add:
    entry:
      id: cal.1968-04-03.robert-kennedy-campaign-2
      when: Apr. 3
      date: '1968-04-03'
      thread: robert-kennedy-campaign
      c: 'Ethel Kennedy telephones Schlesinger about seven in the evening and puts Robert Kennedy on, after his meeting with Johnson. Schlesinger: pace the campaign, do not exhaust himself in the first weeks; Kennedy: "I know the limits of my strength very well." He agrees on some sober, careful speeches and wants particularly one on how to avoid future Vietnams. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 286 (his account of the meeting is cited under [[cal.1968-04-03.robert-kennedy]]). Names: Kennedy, Johnson, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-05-03.students
      when: May 3
      date: '1968-05-03'
      thread: students
      c: 'The Theater of Ideas: Schlesinger in debate with Norman Mailer and Herbert Marcuse. The most ardent minority of the audience howls down speakers who say what they dislike, "which most of the time meant me." As it ends a man who gives his name as Jerry Bananas, later said to be an SDS leader, tells Schlesinger he will be executed. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 288 (the entry headed May 5). Names: Schlesinger, Mailer.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mailer-norman
- add:
    entry:
      id: cal.1968-05-25.elections-1968-mccarthy
      when: May 25
      date: '1968-05-25'
      thread: elections-1968-mccarthy
      c: Washington, the Americans for Democratic Action's convention, the Saturday banquet. McCarthy, coming in at the middle of the evening, walks along the head table shaking hands; at Schlesinger, "his lips tightened, his eyes grew cold," and he hurries by. His speech goes over well with the audience. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 289. Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-05-27.elections-1968-mccarthy
      when: May 27
      date: '1968-05-27'
      thread: elections-1968-mccarthy
      c: 'McCarthy, in Oregon, attacks Schlesinger on the ground that he "defected" from his campaign; Schlesinger: he was never a part of it. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 289–90. Check: the day (the journal of May 27: "is now attacking me in Oregon"; the page gives no day). See [[cal.1968-05-25.elections-1968-mccarthy]]. Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
      - state:or
- add:
    entry:
      id: cal.1968-07-16.elections-1968-humphrey
      when: July 16
      date: '1968-07-16'
      thread: elections-1968-humphrey
      c: Humphrey to Schlesinger, a letter of two and a half pages, single-spaced, "extremely egotistical, ungenerous, intemperate and, on occasion, even ugly in tone," in Schlesinger's words. David Ginsburg, with Schlesinger's leave, had shown Humphrey Schlesinger's letter explaining why he could not come out for him. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 296 (the journal of July 17: "yesterday I received"). Check: the day (the day of receipt; the page gives none for the letters'' dates). Names: Humphrey, Schlesinger, Ginsburg.'
