patch: 2026-11-12-b11-sjournals-3
by: Claude (batch 11 reader, Schlesinger Journals 1967 to Jan. 20, 1969)
ops:
- add:
    entry:
      id: cal.1967-05-03.defense
      when: May 3
      date: '1967-05-03'
      thread: defense
      also:
      - vietnam
      c: 'Schlesinger, on a lecture tour, told at the Syracuse airport late in the afternoon that McNamara has been calling, calls him back. McNamara comes out of a meeting: he wants to talk with him; when is he next in Washington? Not Saturday, May 6, a day McNamara is tied up with the Heineman Committee. McNamara: "There''s no point in your listening to me. I''ve been wrong from the start on Vietnam. The record shows that. I want to hear your ideas." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 262–63 (the journal of May 13: "On May 3"). Names: McNamara, Schlesinger.'
      tags:
      - name:mcnamara-robert-s
      - name:schlesinger-arthur-m-jr
      - state:ny
      - city:syracuse
- add:
    entry:
      id: cal.1967-09-23.democratic-party
      when: Sept. 23–24
      date: '1967-09-23'
      thread: democratic-party
      also:
      - war-opposition
      c: 'Washington, the national board of Americans for Democratic Action, "on the verge of a split" between the labor people, "irrevocably pro-Johnson," and most of the liberals, opposed to the widening of the war. Neither side wishes a showdown: the board votes down a "dump-Johnson" resolution, then "vigorously" attacks the war. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 263 (the journal of Sept. 26: "this weekend"). Names: Schlesinger, Johnson. Check: the day (the weekend of Sept. 23–24; the page gives no day for the vote).'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - state:dc
      - city:washington
- add:
    entry:
      id: cal.1967-11-04.robert-kennedy-campaign
      when: Nov. 4–5
      date: '1967-11-04'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Hickory Hill, Saturday night and the next morning. Robert Kennedy to Schlesinger, who had sent him a letter on his own change of views, on 1968: to challenge Johnson now "a great mistake," to be taken as evidence of "his ruthlessness, his ambition and of a personal vendetta"; McCarthy''s entry into the primaries will "help open things up"; he has "no alternative but to wait," hoping that as McCarthy beats Johnson in the primaries State leaders will ask him to run. Meanwhile "refurbishing his national contacts." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 264 (the journal of Nov. 7). See [[cal.1967-11-03.robert-kennedy-campaign]]. Names: Robert Kennedy, Schlesinger, Johnson, McCarthy. Check: the day (the editors'' bracket, "[Saturday]").'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:mccarthy-eugene-j
      - state:va
- cite:
    id: cal.1966-12-14.transition-and-staff
    item: '[[w.schlesinger-journals]], 257 (the journal of Jan. 4, 1967: in Washington on Dec. 14, when the resignation is announced, Schlesinger calls Moyers at the White House; the words)'
    units: A, B
- cite:
    id: cal.1967-04-18.democratic-party
    item: '[[w.schlesinger-journals]], 258–59 (the journal of Apr. 18: Schlesinger and Wechsler to Washington "last night" for a dinner with Humphrey, about eight to 12:30; Humphrey "generally defended the administration position," with his own preference for slowing down the war; "militant, aggressive Chinese communism"; "the need for a physical barrier across the northern part of South Vietnam," which Ky "is now backing"; his apologia on the Maddox photographs; not Rauh''s house, the number at table or "a great idea")'
    units: '?'
- check:
    id: cal.1967-04-18.democratic-party
    text: 'Check: the day: [[w.schlesinger-journals]], 258, in the journal of Apr. 18, has the dinner "last night," Apr. 17.'
- cite:
    id: cal.1967-09-23.robert-kennedy
    item: '[[w.schlesinger-journals]], 263 (the journal of Sept. 26: dinner at Hickory Hill "Saturday night," Sept. 23, Lowenstein with Jim Loeb and Jack Newfield: Johnson "could be beaten in a string of primaries"; Kennedy, Schlesinger thinks, attracted by his thesis that Johnson is "more unpopular than the war"; not the hour, "Kennedy must run" or Kennedy''s words)'
    units: B
- cite:
    id: cal.1967-10-17.democratic-party
    item: '[[w.schlesinger-journals]], 263–64 (the journal of Oct. 18: McGovern called Schlesinger "yesterday": McCarthy "had about decided to go," to enter the New Hampshire, Wisconsin, California and Massachusetts primaries against Johnson; McGovern''s call to Schlesinger, not to Kennedy; not Kennedy''s distress)'
    units: '?'
- edit:
    id: cal.1967-11-29.robert-kennedy-2
    base: ed5e3a55
    set:
      c: 'New York, the King Cole Bar, 11 p.m., the afternoon papers with McNamara leaving Defense for the World Bank. Robert Kennedy with Schlesinger, Salinger and others: Johnson sent McNamara''s name up without a word to him; McNamara heard it from a leak in London. Kennedy thinks he will refuse the Bank and quietly resign. Schlesinger: "Wouldn''t any self-respecting man have his resignation on the president''s desk half an hour" after the story? About 1 a.m., the *Times*: "McNamara Takes World Bank Post." On McCarthy, who had called on him and asked nothing: he should enter New Hampshire, say he does not expect to win, walk the streets "without entourage or fanfare" and run "against the organization"; Kennedy doubts Johnson can get more than 20,000 votes there; only New Hampshire and Wisconsin matter. Kennedy will "have to fish or cut bait within a couple of weeks after the New Hampshire primary."'
- also:
    id: cal.1967-11-29.robert-kennedy-2
    add:
    - robert-kennedy-campaign
- names:
    id: cal.1967-11-29.robert-kennedy-2
