- add:
    entry:
      id: cal.1968-10-14.elections-1968-humphrey-2
      when: Oct. 14
      date: '1968-10-14'
      thread: elections-1968-humphrey
      c: Humphrey telephones Schlesinger, ninety minutes after David Ginsburg's call, Schlesinger having told Ginsburg he would help "if he asks me directly." The tide of reaction, the need to rally the liberals; he means to go further on Vietnam, but Ben Read of the State Department has advised him to stay where he is for a few days; McGeorge Bundy's Saturday speech has "legitimatized" the antibombing position. Schlesinger will come out for him; Humphrey hopes he will talk to his "academic friends." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 300–01 (Ginsburg''s call "this morning," Humphrey having asked him "last night" whether Schlesinger would help; Humphrey had called Bundy "last night"; the journal''s "Reed"). See [[cal.1968-07-16.elections-1968-humphrey]]; [[cal.1968-10-12.vietnam]]. Names: Humphrey, Schlesinger, Ginsburg, Read, Bundy.'
      tags:
