    entry:
      id: cal.1968-08-08.elections-1968-5
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968
      c: 'McGovern, by telephone from South Dakota, late in the evening, to Schlesinger, back in New York: he will announce for the presidency Saturday. Unruh, Mankiewicz and Salinger had encouraged him to think he could get perhaps 100 votes in California; other prospects in Iowa, New York and, after the first ballot, Massachusetts; his South Dakota people urge him on; "why not?" By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 296–97 (the journal of Aug. 9: "On Thursday I flew back to New York"; a message from McGovern''s office on arrival). Names: McGovern, Schlesinger, Unruh, Mankiewicz, Salinger.'
