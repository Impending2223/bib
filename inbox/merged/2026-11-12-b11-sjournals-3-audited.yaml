      id: cal.1968-08-24.elections-1968-chicago-8
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      c: 'Chicago. Schlesinger, with Richard Wade, to see McGovern, "placid, modest and agreeable": he thinks he has 130 votes, not counting California (about 50) and New York. Ribicoff had called on his own initiative to ask how he could help; Mayor Cavanagh of Detroit to come out for him the next day; hope of Fulbright, Symington, Gaylord Nelson, Burdick, Bartlett and one or two others, Hartke and Clark. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 297 (the journal''s "Cavanaugh"). Check: the day (the entry is headed Aug. 24; the visit''s day is not stated). See [[cal.1968-08-24.elections-1968-chicago-2]]. Names: Schlesinger, McGovern, Ribicoff, Cavanagh, Fulbright, Symington, Nelson, Burdick, Bartlett, Hartke, Clark.'
