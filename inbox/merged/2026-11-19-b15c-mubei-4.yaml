      c: The general office of the Hebei 河北 provincial committee issues the fourth brief on grain work in the regions 《各地區糧食工作情況第四次簡報》. To fulfil the procurement the regions send large numbers of cadres to the villages; Cangzhou 滄州 prefecture alone sends out 3,638, who take zones and press the grain into store. Grain going into store increases, and so do the peasants' and grassroots cadres' feelings; they ask why the procurement has been raised twice.
      n: '[[w.yang-jisheng-mubei]], I, 546. Made public: 2008. To check: Hebei Provincial Committee general office 河北省委辦公廳, "Ge diqu liangshi gongzuo qingkuang di si ci jianbao" 《各地區糧食工作情況第四次簡報》, Oct. 14, 1961 (cited by [[w.yang-jisheng-mubei]], I, 546 n.37).'
