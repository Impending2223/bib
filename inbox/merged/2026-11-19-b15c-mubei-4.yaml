      c: 'The work group of the Hebei 河北 agriculture department 農業廳 reports to the provincial committee 省委 on a survey of ten production brigades in Cangzhou 滄州 prefecture. The brigades'' grain output averaged 5.75 million jin a year in 1950–52, 4.76 million in 1953–57 and 3.39 million in 1958–61, 41.4 percent below the first period. Grain per head: 683 jin in 1952, 421 in 1958, 492 in 1959, 269 in 1960, 238 in 1961, 65.2 percent below 1952.'
