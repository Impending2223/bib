      c: 'The Fengyang 鳳陽 county committee reports on the "five winds" 《關於五風情況》. From the Randeng 燃燈 reservoir: Ding Xueran 丁學然 of Huangzhuang 黃莊 team, who had secretly slaughtered a sow, was held at the site, driven at hard labor by day and shackled in a cell at night, and died there after a month; Song Weiqin 宋維勤 of Nanliujia 南劉家 team, who ran home from the reservoir, was seized, kept at labor with meals withheld by day and in a cell at night, and died; laborers who died of illness were not reported, the families not told, the dead buried at will.'
