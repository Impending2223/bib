      id: cal.1961-01-07.china-leadership-13
      when: Jan. 7
      date: '1961-01-07'
      thread: china-leadership
      c: Feng Yunting 封雲亭 writes Pei Yangshan 裴仰山, head of the Hebei 河北 supervisory committee, on Hengshui 衡水 county. The county's 1960 grain output is over 20 percent below the 1953–57 average yearly output; 5,795 draft animals died, cutting the herd 44.9 percent against 1956. By the county committee's own figures, which are held to be too low, the 1960 death rate is 19.2 per mille, about 9 above a normal year.
      n: '[[w.yang-jisheng-mubei]], I, 543. Made public: 2008. To check: Feng Yunting 封雲亭, letter to Secretary Pei 裴書記 (Pei Yangshan 裴仰山, head of the Hebei supervisory committee), Jan. 7, 1961; Pei''s comment of Jan. 10: this may be printed and sent to comrades of the Secretariat and the rectification office 此件可印發書記處、整辦室同志閱 (cited by [[w.yang-jisheng-mubei]], I, 543 n.27).'
