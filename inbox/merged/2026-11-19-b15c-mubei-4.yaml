      when: Jan. 15
      date: '1961-01-15'
      thread: china-leadership
      c: Zhao Yushu 趙玉書 makes a second supplementary examination 第二次補充檢查 at the Fengyang 鳳陽 county committee's five-level enlarged cadre meeting. It gives the case of the county committee member who was deputy secretary of the Xiaoxihe 小溪河 commune committee, Li 李. At the Randeng 燃燈 reservoir he set up a private "court," "cell" and "labor reform team" and held laborers at will; he had over 20 pairs of handcuffs made for so-called troublemakers, and held and cuffed over 70, of whom 28 were killed. At the site laborers were driven by day and shut up together at night, men and women; each ox was set to haul 480 loads; those short went to labor reform; the punishments were standing, binding, hanging and beating, and wire through the ears. Wang Zhanman 王占滿 of Daxihe 大溪河, not yet dead, was ordered buried; the laborers left him unburied, and he came to and crawled four days, 20 li, home.
      n: '[[w.yang-jisheng-mubei]], I, 280. Made public: 2008. To check: Zhao Yushu 趙玉書, second supplementary examination at the Fengyang County Committee''s five-level enlarged cadre meeting 鳳陽縣趙玉書同志在縣委五級幹部擴大會議上第二次補充檢查, Jan. 15, 1961 (cited by [[w.yang-jisheng-mubei]], I, 280 n.48; I, 280 n.49).'
