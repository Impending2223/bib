      c: Peking. China and Albania sign, under the loan agreement by which China gives Albania credit, several protocols, and exchange notes on China's supplying Albania with grain and other main foods. China agrees to give Albania complete sets of equipment and technical help for twenty-five projects in chemicals, metallurgy, power, building materials and light industry, and to supply tractors, other farm machinery, grain and other goods.
