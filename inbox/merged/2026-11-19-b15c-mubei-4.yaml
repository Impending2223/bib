      date: '1961-05-09'
      place: midu
      thread: china-leadership
      c: 'Yan Hongyan 閻紅彥, first secretary of the Yunnan 雲南 provincial committee 省委, writes Mao Zedong 毛澤東 from Midu 彌渡 county after an inquiry in Puer 普洱, Jinggu 景穀, Yangbi 漾濞 and Midu counties. He argues for going back on five questions: the size of the production team, the public mess halls, distribution to members, draft cattle and the ownership of large farm tools. One brigade of Puer''s Heping 和平 commune, Yalu 雅路, has 552 households and 2,696 people of seven nationalities over 80 li east to west and 60 north to south.'
