      when: Apr. 11
      date: '1962-04-11'
      place: guilin
      thread: china-leadership
      c: 'Deng Zihui 鄧子恢, in Guilin 桂林, Guangxi, hearing the reports of the prefectural officials, says that single households far from a village should contract output to the household, or be let go it alone: there is no need for scruples; do not fear being called go-it-alone or rightist; be realistic about everything. His paper of the day is on household contracting in Longsheng 龍勝 county.'
      n: '[[w.yang-jisheng-mubei]], I, 1125. Made public: 1996. To check: Deng Zihui 鄧子恢, "Guanyu Longsheng xian de baochan daohu wenti" 《關於龍勝縣的包產到戶問題》, Apr. 11, 1962, in [[w.weiyuanhui-deng-zihui-wenji-collected]], 544 (cited by [[w.yang-jisheng-mubei]], I, 1125 n.26).'
