      when: May 16
      date: '1961-05-16'
      thread: china-leadership
      c: The Northeast Bureau 東北局 of the Central Committee sends the three Northeast provinces its notice on stabilizing the workers' ranks 《東北局關於穩定工人隊伍的通知》. Workers, coal miners above all, are leaving their plants and mines in numbers that badly hurt output.
      n: '[[w.yang-jisheng-mubei]], I, 619. Made public: 2008. To check: Northeast Bureau 中共中央東北局, "Dongbeiju guanyu wending gongren duiwu de tongzhi" 《東北局關於穩定工人隊伍的通知》, May 16, 1961 (named in the text of [[w.yang-jisheng-mubei]], I, 619; no note). The page then gives, without a note, that Liaoning''s mines lost over 9,100 workers from the Spring Festival to the end of April, Heilongjiang''s 7,399 from January to Apr. 20, Tonghua mine over 700 in April, and Anshan steel''s transport department 142 from Mar. 29 to Apr. 27.'
