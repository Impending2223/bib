      id: cal.1961-02.china-leadership-9
      when: Feb., after the 1st
      date: 1961-02
      at: after 1961-02-01
      thread: china-leadership
      c: 'The Sichuan 四川 provincial committee, on seeing the Ministry of Health''s report, issues a notice on disease work. It tells the localities to treat edema, women''s and children''s diseases and add the four parasitic diseases and collective health work centered on the mess halls. Three measures: a shock campaign against edema, clearing the present patients with free treatment, nutrition and rest together; collective health work centered on the public mess halls; and, around edema, the prevention of hookworm, schistosomiasis, malaria, filariasis and seasonal infections.'
      n: '[[w.yang-jisheng-mubei]], I, 212. Made public: 2008. To check: Sichuan Provincial Committee 中共四川省委, notice on disease work after the Ministry of Health report (the text quotes it; no title or number given) (cited by [[w.yang-jisheng-mubei]], I, 212 n.t1). Check: the day.'
