      when: Apr. 17
      date: '1961-04-17'
      thread: china-leadership
      c: The Jilin 吉林 provincial committee 省委 issues its urgent circular on strictly stopping enterprises and institutions from seizing commune land 《嚴格制止各事業企業單位擅自佔用公社和耕地的緊急通報》. It encourages enterprises, institutions and schools to grow vegetables in spare time for full or part self-supply, but they may not hire workers or draw on commune labor, take commune farmland, or make equalizing transfers from the villages; tools, seed, animals and manure they must find themselves or trade at equal value.
      n: '[[w.yang-jisheng-mubei]], I, 620. Made public: 2008. To check: Jilin Provincial Committee 中共吉林省委, "Yange zhizhi ge shiye qiye danwei shanzi zhanyong gongshe gengdi de jinji tongbao" 《嚴格制止各事業企業單位擅自佔用公社和耕地的緊急通報》, Apr. 17, 1961 (named in the text of [[w.yang-jisheng-mubei]], I, 620; no note).'
