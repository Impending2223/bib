      thread: china-leadership
      place: canton
      c: Over 10,000 people have gathered outside the Canton 廣州 railway station, where the number of tickets bought to Pinghu 平湖, the last station that needs no border pass, has been 22 times the usual since mid-May. The crowd, waiting to buy tickets, begins to stir. Rumors say that Hong Kong gives three days' holiday for the Queen's birthday and opens the border.
