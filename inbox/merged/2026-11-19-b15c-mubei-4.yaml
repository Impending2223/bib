      id: cal.1961-12-13.china-leadership-7
      when: Dec. 13–19
      date: '1961-12-13'
      thread: china-leadership
      c: On the Northeast Bureau's 東北局 unified plan, Jilin 吉林 province, in its cities and the market towns along the railways, makes a large surprise sweep against theft and speculation. Over 20,000 cadres take part and inspect 12,487 key places. They find 9,905 thieves, speculators and suspects, hold 8,733 for study and detain 1,172, and deal with 7,713, of whom 39 are arrested, 79 sent to labor education, 143 to forced labor and 315 held administratively. In the seven days over 2,000 confess, and 21 gangs are named.
      n: '[[w.yang-jisheng-mubei]], I, 1054. Made public: 2008. To check: Cui Cifeng 崔次豐, summary talk at the symposium on the province''s unified action against theft and speculation, Jan. 10, 1962 (cited by [[w.yang-jisheng-mubei]], I, 1054 n.58).'
