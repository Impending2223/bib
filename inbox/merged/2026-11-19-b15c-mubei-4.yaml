      id: cal.1961-01-05.china-leadership-13
      when: Jan. 5
      date: '1961-01-05'
      thread: china-leadership
      c: At Wuwei 武威 station, once the grain is carried by the station's own trains, people go there in groups to steal. Five or six hundred come by day and over 200 young men at night, and take some 90 sacks of highland barley, about 18,000 jin, with coal. The guards of the artillery regiment at the station cannot stop them; some in the crowd throw stones, and some shout that the soldiers dare not fire. The guards set up a machine gun. By afternoon the crowd is about 1,000; Huang Jinzhong 黃進忠, a standing committee member of the county committee, draws two more platoons from the regiment and sends over ten department and bureau heads to the nearby teams. The Zhangye 張掖 prefectural committee 地委, learning of it, withdraws the two new platoons and forbids beating, abuse, detention and above all firing; those who came far and have no food are to be fed and persuaded to go back.
      n: '[[w.yang-jisheng-mubei]], I, 1045–1046. The words: 白天, 晚上, 下午 (I, 1045–1046). Made public: 2008. To check: Zhangye Prefectural Committee 張掖地委, report to the Gansu Provincial Committee, the evening of Jan. 7, 1961, Gan shou [61] 2060 (cited by [[w.yang-jisheng-mubei]], I, 1045 n.36).'
      src:
        c: c74e31f9
        rows:
        - 'w.yang-jisheng-mubei I, 1045–1046: all'
        - 'via w.yang-jisheng-mubei I, 1045 n.36: all'
