      id: cal.1961-02-10.china-leadership-9
      when: Feb. 10
      date: '1961-02-10'
      thread: china-leadership
      c: The Fengyang 鳳陽 county committee reports on its investigation of bad people in power at Xiaoxihe 小溪河 commune 《關於小溪河公社壞人當道情況所調查報告》. At Liwu 李武 brigade the team head Su 蘇, who embezzled the hospital's oil, would not call a doctor to Xu Kailan 徐開蘭, who had criticized him and had severe edema; when people came from the township to inspect the hospital, Su had Xu, not yet dead, carried out to be buried alive; Xu's child cried, and was led off with biscuits; Xu cried for gruel. At Shanhe 山河 brigade the deputy team head Miao 繆, taking laborers to the reservoir in spring 1960, hung and beat over 100 members, and 35 died. At Xinhua 新華 brigade the deputy team head Zhang 張 had Xu Shanyou 許山友 bound, tied behind and dragged by an ox to the reservoir, and he died on the fourth day; Zhang took revenge on Shi Qianshan 史前山, who had criticized him in 1957, sending two of his laborers to the reservoir and the railway, making his old mother and two children hand in 70 jin of wild vegetables a day, forbidding smoke from the house, and having the two children bound, hung and beaten for theft; they sickened and died, and the mother after them.
      n: '[[w.yang-jisheng-mubei]], I, 278–281. Made public: 2008. To check: Fengyang County Committee 中共鳳陽縣委, "Guanyu Xiaoxihe gongshe huairen dangdao qingkuang suo diaocha baogao" 《關於小溪河公社壞人當道情況所調查報告》, Feb. 10, 1961 (cited by [[w.yang-jisheng-mubei]], I, 279 n.45; I, 280 n.51; I, 281 n.52).'
