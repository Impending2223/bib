      when: May 12
      date: '1961-05-12'
      thread: china-leadership
      c: The Shandong 山東 provincial grain department 糧食廳 reports on the province's grain problem 《山東糧食問題(彙報材料)》. Shandong's 1960 output was 18.234 billion jin, of which 17.497 billion was weighed into store and 737 million came from members' private plots and "ten-side" land. To Apr. 20, 1961 the villages hold 2.22 billion jin of ration grain, 1.578 billion kept in the villages and 641 million resold by the state. From Apr. 21 to the wheat harvest, some tens of days, the mean ration is a little over 6 liang (3.75 on the decimal scale); those at 5 liang (3.125) or less are 30.9 percent of the rural population; counties under 5 liang are Jimo 即墨, Jiaoxian 膠縣, Pingyuan 平原 and Zaozhuang 棗莊; the figure includes sweet-potato chips.
