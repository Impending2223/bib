      id: cal.1961-08-26.china-leadership-3
      when: Aug. 26
      date: '1961-08-26'
      thread: china-leadership
      c: 'Li Xiannian 李先念 speaks to the national conference of heads of grain and commerce departments and bureaus. There is more money and fewer goods: purchasing power in 1961 is 67.5 billion yuan, the goods on hand 65.5 billion. Though goods are short, exports come first; everything that can be exported must be squeezed out, to pay for grain imports.'
      n: '[[w.yang-jisheng-mubei]], I, 957. Made public: 2008. To check: Li Xiannian 李先念, "Zai quanguo liangshi, shangye tingju zhang huiyi shang de jianghua" 《在全國糧食、商業廳局長會議上的講話》, Aug. 26, 1961 (cited by [[w.yang-jisheng-mubei]], I, 957 n.69). Names: Li Xiannian.'
