      thread: china-leadership
      c: The Jiangmen 江門 suburb submits its report on the four-level cadre meeting 《江門市郊區四級幹部會議情況報告》. By the preliminary count of the cadres at the meeting the suburb lost 723 people in three years, with death rates of 0.86 percent in 1958, 1 percent in 1959 and 1.25 percent in 1960; it still has 56 edema patients and 89 women patients. The report tells that in 1958 the suburb's Party committee, at a great production appraisal, paraded the peasants who still farmed alone, some of them lower-middle peasants, from team to team and had them struggled against; at Chen 陳 village, Baisha 白沙 brigade, the commune secretary had the single farmers kneel, heads up and backs straight, and struck two of them, saying the aim was to wreck the single farmers' homes and lives.
