      when: Nov. 9
      date: '1962-11-09'
      thread: china-leadership
      c: The Jilin 吉林 provincial committee 省委 sends the Center, the Northeast Bureau and the Premier its investigation report on workers' families in self-supplying farm work, which Zhou Enlai 周恩來 had asked for on his visit to Jilin in June. Only 6 to 10 percent of the family members can farm, and 80 percent of the small plots opened in the past two years are worked by the workers themselves. At the Tonghua 通化 mining bureau underground workers' hours used fell in the busy season to four and a half, and attendance in spring from 85 to 75 percent.
      n: '[[w.yang-jisheng-mubei]], I, 620. Made public: 2008. To check: Jilin Provincial Committee 中共吉林省委, "Guanyu zhigong jiashu canjia zijixing nongfuye shengchan de diaocha baogao" 《關於職工家屬參加自給性農副業生產的調查報告》, Nov. 9, 1962, Jilin Provincial Archives, fonds 1, file 100 (cited by [[w.yang-jisheng-mubei]], I, 620 n.4). Names: Zhou Enlai. Check: the file''s year, printed 1959 in the note.'
