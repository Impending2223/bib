      date: '1961-01-18'
      thread: china-leadership
      c: 'The disease-and-pest-elimination office 除害滅病辦公室 of the Sichuan 四川 provincial committee issues its work group''s report on the present prevention and treatment of edema 《工作組對目前防治腫病的情況反映》. Luxian 瀘縣 has 20,626 edema patients to Jan. 8, over 30 percent more than in the last ten days of December. Zizhong 資中 county''s patients in the last ten days of December are four times October''s. Changning 長寧 county first reported over 4,000 patients and on inspection has at least 8,000; Jiang''an 江安 reported 7,709 and has at least 20,000; in one public mess hall cadres reported 16 patients and there are 116. Luxian''s deaths are 7 percent of its population and continue: 281 in five days, Jan. 4 to 8.'
      n: '[[w.yang-jisheng-mubei]], I, 214. Made public: 2008. To check: Sichuan Provincial Committee disease-and-pest-elimination office, "Gongzuozu dui muqian fangzhi zhongbing de qingkuang fanying" 《工作組對目前防治腫病的情況反映》, Jan. 18, 1961, general office receipt no. 343 (cited by [[w.yang-jisheng-mubei]], I, 214 n.60).'
