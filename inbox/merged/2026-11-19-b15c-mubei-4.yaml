      date: '1962-01-20'
      thread: china-leadership
      c: The Jilin 吉林 provincial committee 省委 reports on the farm and side-line bases set up by factories and mines. By the end of 1961 twelve large enterprises had 30 bases on 21,705 mu, which yielded 1.274 million jin of feed and grain and 2.534 million of vegetables, and carried 4,632 pigs, 659 cattle, 1,066 sheep and over 38,600 chickens. The Jilin chemical industry company 吉林化學工業公司, once short of milk for its workers' health care, now supplies itself.
      n: '[[w.yang-jisheng-mubei]], I, 619. Made public: 2008. To check: Jilin Provincial Committee 中共吉林省委, "Guanyu changkuang qiye jianli nongfuye shengchan jidi qingkuang de baogao" 《關於廠礦企業建立農副業生產基地情況的報告》, Jan. 20, 1962 (cited by [[w.yang-jisheng-mubei]], I, 619 n.3).'
