      when: Jan.
      date: 1962-01
      thread: china-leadership
      c: At the Fujian 福建 group of the enlarged Central Work Conference 擴大的中央工作會議, Ye Fei 葉飛, the province's first secretary, takes the blame for the leap's grain. The 1958 estimate was reported as high as 17 billion jin, then cut to 13 billion and to 10.5 billion, with a "38th parallel" below which it could not be cut. The high estimate brought the high procurement of 1959, 3 billion jin, the highest ever, which he put to a show of hands over the objection of some comrades.
      n: '[[w.yang-jisheng-mubei]], I, 590–591. Made public: 2008. Check: the day.'
