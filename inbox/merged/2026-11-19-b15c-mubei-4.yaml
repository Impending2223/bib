- add:
    entry:
      id: cal.1961-05-28.china-leadership-6
      when: May 28
      date: '1961-05-28'
      thread: china-leadership
      c: 'A work group of the Zhejiang 浙江 provincial committee issues the draft of its report on some conditions and problems in rural work in Luqiao 路橋 town, Huangyan 黃岩 county 《黃岩縣路橋鎮農村工作中的一些情況和問題(初稿)》. By its survey of 1961, of the commune''s 31 brigades 11 are backward, 35.5 percent, among them Hongyang 洪洋, Zhangli 張李, Fanglin 方林, Yangjia 楊家, Yingjia 應家, Lijia 李家, Shangma 上馬 and Guxing 古興; 9 are advanced, 29 percent, among them Zhangyang 章楊, Yongyue 永躍 and Longtouwang 龍頭王; 11 are ordinary. In the backward brigades output and income have fallen sharply: in Fanglin the 1960 income was 14.9 yuan a head and the ration 255 jin, 96 percent of households owed the collective, 76 yuan each; in two years 12 children were born and over 60 died, 46 in 1960, 31 of them abnormally (17 of edema, 14 of emaciation). In ordinary Daijia 戴家 brigade 1960 output was 15.3 percent below 1958, income 8.5 percent, with 22 abnormal deaths; over 30 members were hung and beaten and 22 had meals withheld. In Zhangyang, the best, there were 6 edema patients and 8 women with amenorrhea and no abnormal death.'
      n: '[[w.yang-jisheng-mubei]], I, 482–483. Made public: 2008. To check: Zhejiang Provincial Committee work group 中共浙江省委工作組, "Huangyan xian Luqiao zhen nongcun gongzuo zhong de yixie qingkuang he wenti (chugao)" 《黃岩縣路橋鎮農村工作中的一些情況和問題(初稿)》, May 28, 1961 (cited by [[w.yang-jisheng-mubei]], I, 482 n.33).'
      src:
        c: 46a44988
        rows:
