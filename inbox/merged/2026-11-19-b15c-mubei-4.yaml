      when: Jan. 13
      date: '1961-01-13'
      thread: china-leadership
      c: 'The rural work department''s office of the Zhejiang 浙江 provincial committee issues no. 3 of its Situation Materials 《情況資料》, "Dali production team goes all out for substitute foods" 《大里生產隊大搞代食品》. Dali team of Qingshan 青山 commune, Anji 安吉 county, having met the 1960 state procurement, sold over 30,000 jin more of grain; with "the secretary acting, the cadres leading, the old peasants as teachers," it gathers in ten days over 92,000 jin of substitute-food material: kudzu, "langji" root, wild ramie root and "Jingang" thorn.'
