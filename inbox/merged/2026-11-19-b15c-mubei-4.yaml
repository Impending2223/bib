      id: cal.1961-05-07.china-leadership-9
      when: May 7
      date: '1961-05-07'
      thread: china-leadership
      c: The Grain Ministry 糧食部 issues its outline report on the grain problem 《糧食問題彙報提綱》. For the 1961–62 grain year the central stocks will fall 12 billion jin short, in trade grain, and the state means to import 10 billion jin to cover it. The Foreign Trade Ministry thinks 10 billion hard to get, with drought in Canada and Australia and foreign exchange short.
      n: '[[w.yang-jisheng-mubei]], I, 957. Made public: 2008. To check: Ministry of Grain 中華人民共和國糧食部, "Liangshi wenti huibao tigang" 《糧食問題彙報提綱》, May 7, 1961 (cited by [[w.yang-jisheng-mubei]], I, 957 n.68).'
