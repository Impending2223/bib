      c: 'The Chongqing 重慶 municipal committee opens its 20th enlarged plenary session 第二十次全委擴大會 (to May 8). By Li Jingquan''s 李井泉 wish it brings out a "Xiao, Li, Liao" anti-Party group 「蕭、李、廖」反黨集團: Xiao Zekuan 蕭澤寬, a standing committee member and head of the organization department in charge of Youth League work; Li Zhizhou 李止舟, deputy secretary-general and head of the municipal committee''s general office; and Liao Bokang 廖伯康. The provincial committee holds them the representatives in Sichuan of the "dark wind," the "reversal wind" and the "going-it-alone wind."'
