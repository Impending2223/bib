      c: The Jiangsu 江蘇 provincial committee reports on the present situation in the Lixiahe 裏下河 area of northern Jiangsu 《關於蘇北裏下河地區當前情況的報告》. Against 1957 the area's population is down 5.5 percent and its labor force 12 percent in 1961. For seven counties, Xinghua 興化, Gaoyou 高郵, Baoying 寶應, Jianhu 建湖, Funing 阜寧, Yancheng 鹽城 and Dongtai 東台, there are still over 151,200 patients in 1962, 4.5 percent of their population, and the number is rising.
