      c: The Hebei 河北 provincial committee holds a telephone conference. It requires "buying a bit more within policy and selling a bit less," and the whole province's whole-year procurement of 3.21 billion jin to be met without fail; the quota is divided among the prefectures.
      n: '[[w.yang-jisheng-mubei]], I, 545. Made public: 2008.'
