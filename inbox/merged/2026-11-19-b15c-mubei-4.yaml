      c: 'Ma Jiliang 馬吉良 of the Sichuan 四川 provincial committee''s work group in Changshou 長壽 county reports by telephone. Edema patients: 36,000 on Jan. 15, 1.57 times the last ten days of December, and 41,000 on the 22nd, 9.2 percent of the population; in Jiangnan 江南 district 25.5 percent. In the first half of January 1,700 die in the county. Cases occur of a wife killing her husband, a father his son, a brother his brother over food at home. At Yunji 雲集 commune 1,513 households, 37.8 percent, dig guanyin earth to eat; at Chengtuo 秤砣 commune 24 production teams live by it.'
