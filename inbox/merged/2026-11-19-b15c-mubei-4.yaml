    entry:
      id: cal.1962-01-16.china-leadership-9
      when: Jan. 16
      date: '1962-01-16'
      thread: china-leadership
      c: The provincial committee's inspection group 省委檢查組 reports on several serious problems of Rong 榮 county 《關於榮縣幾個嚴重問題的彙報》; the general office receives it as [62] no. 1313. Zhu Yufa 朱玉發 of Wuyi 五一 commune, Xinjin 新進 brigade, took 2.5 jin of broad beans in spring 1961 and was fined 120 yuan, his clothes, quilts, mats, sweet potatoes and grain coupons seized, and was stripped and struggled against; he also paid the collectors 1.5 jin of grain and 10 work points a day. The prefecture set the county 1.2 million yuan of "recovery," the county passed it to the districts and the districts raised it to the communes; in Letao 樂道, Chengjia 成佳, Longtan 龍潭 and Tangshan 唐山 districts the collectors took chickens, ducks, clothes and quilts. Tong Guangqian 童光前, who took a little firewood from the mess hall's pile, was ordered to pay 270 yuan and had two coffins, a ewe, a chicken and a duck taken. Funan 富南 commune's third brigade judged 254 of its 255 households to have stolen.
      n: '[[w.yang-jisheng-mubei]], I, 221. Made public: 2008. To check: Provincial committee inspection group 省委檢查組, "Guanyu Rongxian jige yanzhong wenti de huibao" 《關於榮縣幾個嚴重問題的彙報》, Jan. 16, 1962, Sichuan committee general office receipt [62] no. 1313 (cited by [[w.yang-jisheng-mubei]], I, 221 n.82).'
      src:
