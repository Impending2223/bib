      id: cal.1961-01-21.china-leadership-5
      when: Jan. 21
      date: '1961-01-21'
      thread: china-leadership
      c: Hu Kaiming 胡開明 of Zhangjiakou 張家口 writes Liu Zihou 劉子厚, the governor, who is at a meeting in Peking, on the people's living. The city lost 58,877 people last year, a death rate of 1.899 percent (1958, 1.319; 1959, 1.64); worst is Yu 蔚 county with 18,240 dead, 3.36 percent. The city has 86,236 patients, 2.8 percent. Since January the soup ration has been raised generally to 5 liang, and 95.9 percent of the mess halls eat substitute foods; many members cannot pass them. Last December 9,584 died in the city, 309.2 a day; in the first half of January 4,619.
      n: '[[w.yang-jisheng-mubei]], I, 543, 553–554. Made public: 2008. To check: Hu Kaiming 胡開明, letter to Liu Zihou 劉子厚, Jan. 21, 1961 (cited by [[w.yang-jisheng-mubei]], I, 543 n.29).'
