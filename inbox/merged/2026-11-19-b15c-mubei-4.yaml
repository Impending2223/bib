      date: '1961-03-07'
      thread: china-leadership
      c: 'The disease-and-pest-elimination office 除害滅病辦公室 of the Sichuan 四川 provincial committee reports on the work of preventing and treating edema 《防治腫病工作情況》. By March the province has set up 27,005 temporary edema hospitals and has 952,000 and more patients under treatment together. The report gives the conditions: Huangqi 黃旗 commune of Fuling 涪陵 county puts over 600 patients together, light and grave alike, on one pot of herbs; some temporary hospitals in Rong 榮 county have no medicine after ten days; some commune hospitals advance funds and cannot pay wages, 42 of Nanchong 南充 county''s 95; 70 to 80 percent of the rural medical staff are on edema and have no earnings; at Yongxing 永興 commune, Hechuan 合川 county, six burns and falls in half a month, three burned to death.'
      n: '[[w.yang-jisheng-mubei]], I, 215. Made public: 2008. To check: Sichuan Provincial Committee disease-and-pest-elimination office, "Fangzhi zhongbing gongzuo qingkuang" 《防治腫病工作情況》, Mar. 7, 1961 (cited by [[w.yang-jisheng-mubei]], I, 215 n.63; I, 215 n.64).'
