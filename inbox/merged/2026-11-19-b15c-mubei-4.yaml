    item: '[[w.yang-jisheng-mubei]], I, 623–624 (Jan. 10: Mao''s comment on the Liaoning report of how Jinzhou''s Factory 401 settled its workers'' grain troubles, "worth spreading, but some practical problems must be solved"; the report: education, debates in group meetings, three arrested, mess halls improved)'
