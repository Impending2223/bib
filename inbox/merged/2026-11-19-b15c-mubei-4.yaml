      c: 'Yao Kuijia 姚奎甲, first secretary of the Wuwei 無為 county committee, makes his examination 檢查 at the committee''s standing committee meeting. The book draws on it for the grain drive of the winter of 1959: with some mess halls cooking nothing for dozens of days, the committee still ordered grain into store at daily quotas; under-reporting would not do, over-reporting was welcome; Liudu 劉渡 commune reported 200,000 jin done in a day and, criticized, raised the daily amount step by step to 700,000 jin.'
