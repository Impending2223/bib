      when: Mar. 12
      date: '1961-03-12'
      thread: china-leadership
      c: An investigation group of the prefectural committee reports on Sijia 四甲 brigade, Gaoyao 高要 county, impure in its organization and with bad people in power 《高要縣四甲大隊組織不純、壞人當道的情況調查報告》. Of the brigade's 268 households all but the cadres' families had meals withheld or refused by the team head Huang Junzai 黃均仔; 184 died, 10 percent of the original population. Huang Longfu 黃龍富, who had edema and could not carry much, had two meals stopped at the Shuangjin 雙金 canal site in spring 1959, fainted and died on the spot; Huang Junzai answered that two of them made a pair; within two months Huang's son died too and his wife remarried.
      n: '[[w.yang-jisheng-mubei]], I, 413–414. Made public: 2008. To check: Prefectural committee investigation group 地委調查組, "Gaoyao xian Sijia dadui zuzhi bu chun, huairen dangdao de qingkuang diaocha baogao" 《高要縣四甲大隊組織不純、壞人當道的情況調查報告》, Mar. 12, 1961 (cited by [[w.yang-jisheng-mubei]], I, 414 n.17).'
