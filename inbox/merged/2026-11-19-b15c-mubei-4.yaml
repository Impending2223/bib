      id: cal.1962-04-28.china-leadership-11
      when: Apr. 28
      date: '1962-04-28'
      thread: china-leadership
      c: The rectification office and supervisory committee of the Hebei 河北 provincial committee issue their summary of the handling of cadres in the rural rectification campaign of winter 1960 to spring 1961 《關於1960年冬到1961年春農村整風整社運動的組織處理工作總結》. The campaign exposed 174,757 cadres who had erred, 13.9 percent of all cadres, and expected to deal with 37,412, 2.98 percent. Communes and brigades with serious "five winds" were taken to be held by landlords, rich peasants, counter-revolutionaries, bad elements, degenerates or dead bureaucrats; cadres who had committed the "five winds" were criticized and struggled against and gathered at county and commune for "training," in fact criticism; by an incomplete count of mid-April 1961, 6,763 were so "gathered."
      n: '[[w.yang-jisheng-mubei]], I, 548. Made public: 2008. To check: Rectification office and supervisory committee of the Hebei Provincial Committee 中共河北省委整風整社辦公室、監察委員會, "Guanyu 1960 nian dong dao 1961 nian chun nongcun zhengfeng zhengshe yundong de zuzhi chuli gongzuo zongjie" 《關於1960年冬到1961年春農村整風整社運動的組織處理工作總結》, Apr. 28, 1962 (cited by [[w.yang-jisheng-mubei]], I, 548 n.42).'
