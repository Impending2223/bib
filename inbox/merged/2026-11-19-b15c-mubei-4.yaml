      id: cal.1960-11-29.china-leadership-9
      when: Nov. 29
      date: '1960-11-29'
      thread: china-leadership
      c: Qiao Zhimin 喬志敏 reports on the rectification of Nanping 南屏 commune, Hechuan 合川 county. In Feb. and March 1960 the commune's first secretary, Tan 譚, told cadres of work-team-head rank and above to hang, beat and fine anyone caught stealing, and had six beaten at meetings in Zhongnan 中南 and Bailu 白鹿 districts as an example. Fines were 1 yuan for a broad bean plant or a corn ear and 5 yuan for a sweet potato. Of 159 cadres of production-team head rank and above, 89, 56 percent, had bound and hung members; 565 members were beaten, 478 fined, 588 households searched. The inspection corps finds 44 dead after hanging and beating and withheld meals, and 19 maimed. At Taiping 太平 district the deputy secretary, Tang 唐, in Feb. and March forced 178 households out of "backward" courtyards; the 66 who refused were struggled against, 19 of them criticized as a main target, 8 bound, and Zhong Xiangcheng 鍾相成 drowned himself on the spot.
      n: '[[w.yang-jisheng-mubei]], I, 224–225. Made public: 2008. To check: Qiao Zhimin 喬志敏, "Qiao Zhimin tongzhi guanyu Hechuan Nanping gongshe zhengdun qingkuang de baogao" 《喬志敏同志關於合川南屏公社整頓情況的報告》, Nov. 29 (the note prints 1961), circulated by the Provincial Committee general office secretariat Dec. 2, 1960 (cited by [[w.yang-jisheng-mubei]], I, 225 n.86; I, 225 n.87). Check: the note (I, 225 n.86) prints the report as of Nov. 29, 1961, circulated Dec. 2, 1960.'
