      when: Feb. 16
      date: '1961-02-16'
      thread: china-leadership
      c: The party group of the All-China Women's Federation 全國婦聯黨組 reports on first experience in treating prolapse of the womb and amenorrhea among rural women 《關於農村治療婦女子宮脫垂、閉經病初步經驗的報告》. Since the past winter, it says, party committees everywhere, while seizing on the people's living, have made the checking and treating of women's diseases one of the main parts of the work of eliminating pests and disease; the diseases are amenorrhea and prolapse.
      n: '[[w.yang-jisheng-mubei]], I, 967. Made public: 2008. To check: Party group of the All-China Women''s Federation 全國婦聯黨組, "Guanyu nongcun zhiliao funu zigong tuola, bijing bing chubu jingyan de baogao" 《關於農村治療婦女子宮脫垂、閉經病初步經驗的報告》, Feb. 16, 1961 (named in the text of [[w.yang-jisheng-mubei]], I, 967; no note).'
