      c: A work group of the Qinghai 青海 provincial committee 省委 goes to Huangzhong 湟中 county to check how the public security bureau is correcting itself. Li Zhanxiang 李占祥, a boy jailed for stealing lambs and cutting off a donkey's ear, is still held. Wang Zhao 王昭, the governor, hearing the report, says that a boy who lost seven of his family of eleven should not have been arrested; he is released.
      n: '[[w.yang-jisheng-mubei]], I, 595. Made public: 2009. To check: Yin Shusheng 尹曙生, "Teshu anjian de yuanshi jilu" 《特殊案件的原始記錄》, Yanhuang chunqiu 炎黃春秋 2009 no. 10 (named in the text of [[w.yang-jisheng-mubei]], I, 593 n.10, which gives it as the source of what follows). Check: the day. Check: Wang Zhao''s post: first secretary at I, 593, governor at I, 593 and 595.'
