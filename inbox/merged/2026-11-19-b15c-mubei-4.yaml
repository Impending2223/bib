      when: Apr.
      date: 1961-04
      thread: china-leadership
      c: Gu Mu 谷牧, deputy head of the State Economic Commission 國家經委, and several of its cadres inspect the Shijiazhuang 石家莊 steelworks, the Jingxi 京西 coal mine and the Longyan 龍煙 iron and steel company, and find workers leaving their plants. Longyan lost over 2,800 workers in 1960 and 327, 468 and 558 in January, February and March 1961, 423 in the first ten days of April; Shijiazhuang steel lost 845 from January to early April.
      n: '[[w.yang-jisheng-mubei]], I, 618–619. Made public: 2008. To check: Gu Mu 谷牧, "Guanyu xunsu kefu gongren sizi li chang xianxiang he gonggu gongren duiwu de yijian" 《關於迅速克服工人私自離廠現象和鞏固工人隊伍的意見》, forwarded by the Center as Zhongfa [61] 338 of Apr. 30, 1961 (cited by [[w.yang-jisheng-mubei]], I, 619 n.2). Check: the days.'
