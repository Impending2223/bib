      thread: china-leadership
      c: The State Council's finance and trade office 財貿辦公室 and the Central United Front Work Department 中央統一戰線工作部 report to the Center on the campaign against "back-door" sales. By the end of March, of 27 provinces, municipalities and regions (Tibet excepted), 21 had held mass campaigns, 3 had given education, and 3 had made the question part of rectification or the socialist education movement. The report says that in some places only those below are attacked and not those above, "the reform goes on while the leaving by the back door goes on," and some unfair "internal supply" has not been ended.
      n: '[[w.yang-jisheng-mubei]], I, 1030–1031. Made public: 2008. To check: Finance and Trade Office and United Front Work Department, report on the campaign against back-door sales, Apr. 16, 1962, forwarded by the Center as Zhongfa [62] 206 of May 9, 1962 (cited by [[w.yang-jisheng-mubei]], I, 1031 n.39).'
