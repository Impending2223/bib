      when: Jan. 23
      date: '1961-01-23'
      thread: china-leadership
      c: The provincial committee's Tianshui 天水 work group 工作組 and the Tianshui prefectural committee 地委 report jointly to the Gansu 甘肅 provincial committee 省委 on safeguarding rail transport. Order along the line is in great disorder, and thefts and robberies of trains grow. In Dec. 1960 the station inspection group checked 338 arriving trains and found 142 robbed; from Oct. 1960 to Jan. 22, 1961 there were 420 thefts from trains, 184 of them in the first 20 days of January. The thieves have gone from singles to bands, from small lots of grain to everything, from night and secrecy to open robbery by day.
      n: '[[w.yang-jisheng-mubei]], I, 1046. Made public: 2008. To check: Provincial Committee Tianshui Work Group and Tianshui Prefectural Committee, "Guanyu baowei tielu yunshu anquan gongzuo de baogao" 《關於保衛鐵路運輸安全工作的報告》, Jan. 23, 1961, Gan shou [61] 2381 (cited by [[w.yang-jisheng-mubei]], I, 1046 n.38).'
