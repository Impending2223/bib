      when: Mar. 17
      date: '1962-03-17'
      thread: china-leadership
      c: Chen Guodong 陳國棟, Minister of Grain, reports to Vice Premier Li Xiannian 李先念 on the figures of Guan Xuesi 管學思, deputy head of the Sichuan 四川 grain department. By incomplete count the province has 1.44 million edema patients, and 11 specially stricken counties have lost 145,800 people from last July to this March, 2.3 percent of their farm population. At the end of January Jiangbei 江北 county, 600,000 people, has 147,000 patients, 24.6 percent; last December it lost 7,225 in a month, 1.5 percent; in early March about 100 die a day, and corpses lie on the roads and in the river. In Daxing 大興 commune, Bishan 璧山 county, deaths in the last three months are 12 percent of the commune; in Xinglong 興隆 brigade, 231 households with 781 people, 13.8 percent, nine households have died out and nine have left 11 orphans.
      n: '[[w.yang-jisheng-mubei]], I, 209. Made public: 2008. To check: Chen Guodong 陳國棟, Minister of Grain, "Chen Guodong tongzhi gei Li Xiannian fu zongli de baogao" 《陳國棟同志給李先念副總理的報告》, Mar. 17, 1962 (cited by [[w.yang-jisheng-mubei]], I, 209 n.47). Names: Li Xiannian.'
