      when: Jan. 19
      date: '1961-01-19'
      place: anshan
      thread: china-leadership
      c: The Anshan 鞍山 city committee 市委 reports on a grain-centered education campaign among workers' families and on arranging the people's livelihood. Of the families, 25 to 30 percent hold firm, 60 to 65 percent waver or are unsettled, and about 10 percent, the loudest, press the workers to complain at the plant. The campaign has the families recall the hardships of the old society and holds debates on chosen families, among them a family of poor class background at the Anshan steel works 鞍山鋼鐵公司.
      n: '[[w.yang-jisheng-mubei]], I, 623–624. Made public: 2008. To check: Anshan City Committee 中共鞍山市委, "Guanyu zai zhigong jiashu zhong jinxing yi liangshi wei zhongxin de jiaoyu yundong he anpai hao qunzhong shenghuo de qingkuang baogao" 《關於在職工家屬中進行以糧食為中心的教育運動和安排好群眾生活的情況報告》, Jan. 19, 1961, Jilin Provincial Archives (cited by [[w.yang-jisheng-mubei]], I, 623 n.6; I, 624 n.10).'
