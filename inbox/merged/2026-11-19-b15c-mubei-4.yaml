      thread: china-leadership
      c: Xie Fuzhi 謝富治, minister of public security, speaking at the national political and legal work conference 全國政法工作會議, gives the figures for the wandering people. In 1960 they reached 6 million; from January to August 1961 the country took in 2.07 million, and from January to August 1962, 1.4 million; for the whole year of 1962 nearly 2 million are estimated.
      n: '[[w.yang-jisheng-mubei]], I, 1056. Made public: 2008. To check: Xie Fuzhi 謝富治, speech at the national political and legal work conference, Oct. 19, 1962 (named in the text of [[w.yang-jisheng-mubei]], I, 1056; no note). Names: Xie Fuzhi.'
