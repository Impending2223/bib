      when: Oct. 24
      date: '1961-10-24'
      thread: china-leadership
      c: The general office of the Hebei 河北 provincial committee reports deaths to the end of September 1961. In Wuqiao 吳橋, Nanpi 南皮, Qingyun 慶雲, Yanshan 鹽山, Ningjin 寧津, Huanghua 黃驊, Gucheng 故城, Jingxian 景縣 and Hejian 河間 the monthly death rate is over 9 (as printed, percent). In the whole of Cangzhou 滄州 prefecture 401 died in May, 682 in June, 839 in July, 1,184 in August, 2,054 in September and 1,414 in the first half of October.
      n: '[[w.yang-jisheng-mubei]], I, 546. Made public: 2008. Check: the unit of the death rate; the book prints "9%" for the counties'' monthly rate.'
