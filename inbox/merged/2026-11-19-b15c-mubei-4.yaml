    item: '[[w.yang-jisheng-mubei]], I, 664 (April 1961: Ye Jizhuang 葉季壯, minister of foreign trade, leads the government trade delegation to the Soviet Union; it signs the 1961 protocol on exchange of goods, an agreement on the 1960 trade arrears and one on a Soviet loan of sugar; at the Soviet Foreign Trade Ministry''s banquet Ye says the arrears are to be repaid over five years without interest and 500,000 tons of sugar lent without interest, repaid in kind)'
