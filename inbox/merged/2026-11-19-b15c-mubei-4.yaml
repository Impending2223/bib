      c: The Bao'an 寶安 county committee's summary report on its four-level cadre meeting 《寶安縣四級幹部會議總結報告》 is dated Jan. 3. It gives 1,569 edema patients in 1960 and deaths rising every year; of 240 brigades 63, 26 percent, had death rates of 1.5 percent and above in 1960, the highest at Guangming 光明 farm, 3.34 percent; edema patients numbered 2,786 in 1957 and 6,322 in 1960. At Xikeng 西坑 brigade, Shatoujiao 沙頭角 commune, the monthly grain ration fell from 40 jin in 1957 to 24 in 1960. The meeting also hears that a commune deputy secretary, Zheng 鄭, set up a labor-reform field at the Gaofeng 高峰 reservoir for laborers who ran home.
