      when: '1961'
      date: '1961'
      thread: china-leadership
      c: The Grain Ministry's Chen Guodong 陳國棟, Zhou Bopin 周伯萍 and the State Statistical Bureau's Jia Qiyun 賈啟允 are ordered to have each province fill in a table of changes in grain and population. When it is summed, the country's population has fallen by tens of millions. The paper goes to Zhou Enlai and Mao Zedong alone.
