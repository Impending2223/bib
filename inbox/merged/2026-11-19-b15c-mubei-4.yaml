      when: Jan. 12
      date: '1961-01-12'
      thread: china-leadership
      c: Zhang Guangqin 張廣欽 reports to the Sichuan 四川 provincial committee 省委 on disorder in rural security 《關於農村治安情況混亂的彙報》. In Luxian 瀘縣 county the worst teams and districts cannot even hold a meeting at night. In Yangjiu 楊九 commune there were 17 robberies and thefts in the five days of Jan. 6–10, among them the taking of six hens, twelve eggs and three sheep from a member's house on the night of the 10th; in Caoshi 曹市 commune, 104 since the end of Dec. 1960. In one week of spring 1961, 36 of the county's 69 communes had robberies or thefts.
