      id: cal.1962-01-06.china-leadership-7
      when: Jan. 6
      date: '1962-01-06'
      place: peking
      thread: china-leadership
      c: The Center forwards, as Zhongfa [62] 110 中發[62]110號, the Ministry of Construction Engineering's party group's investigation report on the problems of halted and slowed building projects. Work groups sent to Shenyang 瀋陽, Tianjin 天津, Taiyuan 太原, Xi'an 西安, Lanzhou 蘭州 and Changsha 長沙 in Sept. and Oct. 1961 found that by Sept. the six cities had halted 1,035 projects, 3.344 million square meters, about half those begun. Of these, 28.5 percent had only foundations laid; 38.6 percent had the main structure half done; 22.3 percent the main structure nearly done; 10.6 percent only fitting out left. Many foundations had sunk and columns tilted.
      n: '[[w.yang-jisheng-mubei]], I, 1036. Made public: 2008. To check: Pizhuan Jianzhu gongchengbu dangzu guanyu tingjian huanjian gongcheng zhong cunzai wenti de diaocha baogao 《批轉建築工程部黨組關於停建緩建工程中存在問題的調查報告》, Jan. 6, 1962, Zhongfa [62] 110 (cited by [[w.yang-jisheng-mubei]], I, 1036 n.44).'
