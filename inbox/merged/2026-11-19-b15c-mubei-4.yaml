      when: Sept. 17
      date: '1961-09-17'
      thread: china-leadership
      c: The general office of the Hebei 河北 provincial committee issues its paper on the study and discussion of the spirit of the committee's telephone conference by the prefectural committees 《各地委對省委電話會議精神研究討論的情況和意見》. Cangzhou 滄州 prefecture, given a procurement of 240 million jin, shares it among its counties; in some counties the peasants' mean ration is a little over 2 liang a day.
      n: '[[w.yang-jisheng-mubei]], I, 545. Made public: 2008. To check: Hebei Provincial Committee general office 省委辦公廳, "Ge diwei dui shengwei dianhua huiyi jingshen yanjiu taolun de qingkuang he yijian" 《各地委對省委電話會議精神研究討論的情況和意見》, Sept. 17, 1961 (cited by [[w.yang-jisheng-mubei]], I, 545 n.35).'
