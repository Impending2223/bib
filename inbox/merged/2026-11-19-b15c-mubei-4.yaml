      when: May
      date: 1961-05
      thread: china-leadership
      c: 'Lei Bingrang 雷秉讓, first secretary of the Yuzhong 榆中 county committee 縣委 in Gansu 甘肅, reports to the provincial committee 省委 on the mess-hall question. From the county''s own record: the halls of 1958 broke up after nine months, when the ration fell in April 1959; revived under pressure in Nov. 1959, they broke up again in Dec. 1960, with the Center''s twelve articles, after nine months. The halls had run a year and a half in all, and none was revived.'
      n: '[[w.yang-jisheng-mubei]], I, 741, 747. Made public: 2008. To check: Lei Bingrang 雷秉讓, "Shitang wenti de baogao" 《食堂問題的報告》, May 1961, Gansu Provincial Committee received no. Gan shou (61) 21697 (cited by [[w.yang-jisheng-mubei]], I, 741 n.6; I, 747 n.16, where the title reads "Shitang wenti diaocha baogao" 《食堂問題調查報告》). Check: the day.'
