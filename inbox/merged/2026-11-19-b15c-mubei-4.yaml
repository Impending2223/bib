      when: Feb. 15
      date: '1961-02-15'
      thread: china-leadership
      c: The Northeast Bureau's agricultural committee work group 東北局農委工作組 and the Heilongjiang 黑龍江 provincial committee's work group report on the pilot of rectification of the commune 整風整社 at Xiangyangchuan 向陽川 People's Commune, Fujin 富錦 county. The pilot began at the end of Oct. 1960, by a work group of the province, Hejiang 合江 prefecture and Fujin county. The report finds a third-category commune whose leadership was held by bad and degenerate elements, and says that a sharp class struggle has settled the contradiction with the enemy; the Bureau's group, on recheck, agrees.
      n: '[[w.yang-jisheng-mubei]], I, 1142–1143. Made public: 2008. To check: Northeast Bureau Agricultural Committee Work Group and Heilongjiang Provincial Committee Work Group, "Xiangyangchuan renmin gongshe zhengfeng zhengshe shidian gongzuo baogao" 《向陽川人民公社整風整社試點工作報告》, Feb. 15, 1961 (cited by [[w.yang-jisheng-mubei]], I, 1143 n.65).'
