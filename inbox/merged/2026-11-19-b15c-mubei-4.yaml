      id: cal.1961-09-20.china-leadership-9
      when: Sept. 20
      date: '1961-09-20'
      thread: china-leadership
      c: The Fuling 涪陵 group of the Sichuan 四川 provincial committee's inspection corps reports on the Ma'an 馬鞍 commune's disease control by self-help in production and saving against the famine 《馬鞍公社結合生產自救、節約渡荒開展防治病工作的調查報告》. The county's daily ration for members is 6 liang (3.75 on the decimal scale), and cadres often dock it. In one work team of Taiyi 太乙 brigade 5 of 6 households have been docked. Xia Daozhen 夏道珍, who took a little corn in the lean season, is docked 1,700 jin in all, 20 percent of every issue; the team head says a year not enough, two years, three. Zheng Derong 鄭得榮 of the third team of Dashi 大石 brigade, who watched a field from which over 100 ears were taken, is docked 96 jin. Dashi brigade has lost 51 people, 6.3 percent, from January to early September; over 90 percent of the women have stopped menstruating, and two children have been born this year, both cadres'.
      n: '[[w.yang-jisheng-mubei]], I, 228. Made public: 2008. To check: Provincial committee inspection corps, Fuling group 省委檢查團涪陵組, "Maan gongshe jiehe shengchan ziji, jieyue duhuang kaizhan fangzhi bing gongzuo de diaocha baogao" 《馬鞍公社結合生產自救、節約渡荒開展防治病工作的調查報告》, Sept. 20, 1961 (cited by [[w.yang-jisheng-mubei]], I, 228 n.94).'
