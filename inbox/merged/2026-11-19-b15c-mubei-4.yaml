      when: Jan. 11
      date: '1961-01-11'
      thread: china-leadership
      c: 'The Jiuquan 酒泉 city committee 市委 reports to the Gansu 甘肅 provincial committee, and again on the 14th, on the flour mill''s mistaken firing at people stealing grain. From Jan. 5 to 8 over 400 people in three days came in groups with ladders, sacks, clubs, knives and iron shovels to take grain from the flour mill: some climbed the wall, some dug through it, some stopped grain carts on the road at dark and slashed the sacks. Shots fired on the 5th scattered them, but on the next two days some came again. The city committee has examined the firing to the prefectural committee and the province.'
      n: '[[w.yang-jisheng-mubei]], I, 1046. Made public: 2008. To check: Jiuquan City Committee 中共酒泉市委, "Guanyu mianfenchang dui tou liang qunzhong mingqiang cuowu de jiancha baogao" 《關於麵粉廠對偷糧群眾鳴槍錯誤的檢查報告》, Jan. 11 and 14, 1961, Gan shou [61] 2231 and [61] 2189 (cited by [[w.yang-jisheng-mubei]], I, 1046 n.37).'
