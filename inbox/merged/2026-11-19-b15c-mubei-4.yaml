      c: 'The Center forwards the Hubei 湖北 provincial committee''s summary report on the second stage of rectification at Tonghaikou 通海口 commune, Mianyang 沔陽 county. Its comment: every commune where the five winds are serious but the enemy does not hold power should be put in order by Tonghaikou''s method of rectification.'
      n: '[[w.yang-jisheng-mubei]], I, 1141–1142. Made public: 2008. To check: Zhongyang pizhuan Hubei shengwei guanyu Mianyang Tonghaikou gongshe zhengfeng zhengshe dier jieduan zongjie baogao 《中央批轉湖北省委關於沔陽通海口公社整風整社第二階段總結報告》, Jan. 31, 1961 (cited by [[w.yang-jisheng-mubei]], I, 1141 n.64). See [[cal.1961-01-29.china-leadership]].'
