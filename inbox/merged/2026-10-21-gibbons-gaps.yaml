patch: gibbons-gaps
by: Claude (Gibbons, Parts II–III)
ops:
  - add:
      entry:
        id: cal.1961-11-02.vietnam
        when: Nov. 2
        date: '1961-11-02'
        thread: vietnam
        c: 'Mansfield to Kennedy: no combat troops to Vietnam. North Vietnamese first, then perhaps the Chinese; "a quicksand for us." More aid, the burden left to the South Vietnamese.'
        n: '[FRUS 1961–63, I, doc. 207](https://history.state.gov/historicaldocuments/frus1961-63v01/d207). [[w.gibbons-u-s-government-and]], II, 84–85; [[w.olson-mansfield-and-vietnam]]. See [[cal.1961-01-28.vietnam]]. Names: Mansfield, Kennedy.'
        tags: [name:mansfield-mike, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1963-09-12.vietnam
        when: Sept. 12
        date: '1963-09-12'
        thread: vietnam
        c: 'Church offers S. Res. 196, with Carlson and twenty-one others: aid to Saigon to end unless it abandons repression and regains its people''s support. The text drafted at State; the President''s conference of Sept. 11 for introducing it, hearings to wait.'
        n: '[109 Cong. Rec. 16,824](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt12/pdf/GPO-CRECB-1963-pt12-15-1.pdf) (1963). FRUS 1961–63, IV, docs. [84](https://history.state.gov/historicaldocuments/frus1961-63v04/d84) (Hilsman and Church, Sept. 10), [94](https://history.state.gov/historicaldocuments/frus1961-63v04/d94) (Sept. 11). [[w.gibbons-u-s-government-and]], II, 166–169. See [[cal.1963-09-06.vietnam]]. Names: Church, Carlson.'
        tags: [name:church-frank, name:carlson-frank]
  - add:
      entry:
        id: cal.1963-12-07.vietnam
        when: Dec. 7
        date: '1963-12-07'
        thread: vietnam
        c: 'Mansfield to Johnson, with copies of his memoranda to Kennedy. The war perhaps not to be won in the South alone. A truce; a "diplomatic offensive," France the key; Cambodia "the principal prototype" of a peace in Southeast Asia.'
        n: '[FRUS 1961–63, IV, doc. 355](https://history.state.gov/historicaldocuments/frus1961-63v04/d355). [[w.gibbons-u-s-government-and]], II, 215; III, 4. See [[cal.1963-11-24.vietnam]]. Names: Mansfield, Johnson, Kennedy.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1964-01-06.vietnam
        when: Jan. 6
        date: '1964-01-06'
        thread: vietnam
        c: 'Mansfield to Johnson again: "Neither do we want another Korea." Close to "the point of no return"; less talk of American responsibility, more of the Vietnamese.'
        n: '[FRUS 1964–68, I, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v01/d2) (Gibbons: Jan. 7). [[w.gibbons-u-s-government-and]], II, 215–216. See [[cal.1963-12-07.vietnam]]. Names: Mansfield, Johnson.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-02-19.vietnam
        when: Feb. 19
        date: '1964-02-19'
        thread: vietnam
        c: 'Mansfield in the Senate on de Gaulle''s neutralization: not to be lightly dismissed. No national interest to justify "primary American responsibility" in Vietnam.'
        n: '[110 Cong. Rec. 3114](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt3/pdf/GPO-CRECB-1964-pt3-4-1.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 219–220. See [[cal.1963-12-07.vietnam]]. Names: Mansfield, de Gaulle.'
        tags: [name:mansfield-mike, name:de-gaulle-charles]
  - add:
      entry:
        id: cal.1964-03-02.vietnam
        when: Mar. 2
        date: '1964-03-02'
        thread: vietnam
        c: 'Johnson telephones Fulbright, evening. He reads four courses: withdraw; neutralize; Marines "a la Goldwater"; go on training and supplying. Fulbright for the fourth.'
        n: '[Johnson and Fulbright, 8:50 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964), Conversations WH6403-02-2320, [2321](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-march-3-1964-0) (Miller Center). [[w.gibbons-u-s-government-and]], II, 222–223. Made public: [[w.kearns-lyndon-johnson-and-the]], 196–197 (1976), in part. See [[cal.1964-02-19.vietnam]]. Names: Johnson, Fulbright, Goldwater.'
        tags: [name:johnson-lyndon-b, name:fulbright-j-william, name:goldwater-barry-m]
  - add:
      entry:
        id: cal.1964-03-04.vietnam
        when: Mar. 4
        date: '1964-03-04'
        thread: vietnam
        c: 'Morse in the Senate: "We should never have gone in. We should never have stayed in. We should get out." No land war in Asia with American ground forces.'
        n: '[110 Cong. Rec. 4357–59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-1-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 223–224. See [[cal.1964-02-19.vietnam]]. Names: Morse.'
        tags: [name:morse-wayne]
  - add:
      entry:
        id: cal.1964-03-10.vietnam
        when: Mar. 10
        date: '1964-03-10'
        thread: vietnam
        c: 'Gruening in the Senate: not an American war. "Let us get out of Vietnam on as good terms as possible—but let us get out."'
        n: '[110 Cong. Rec. 4831](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-5-1.pdf) ff. (1964). [[w.gibbons-u-s-government-and]], II, 224–225. See [[cal.1964-03-04.vietnam]]. Names: Gruening.'
        tags: [name:gruening-ernest]
  - add:
      entry:
        id: cal.1964-03-11.vietnam
        when: Mar. 11
        date: '1964-03-11'
        thread: vietnam
        c: 'Dodd answers Gruening, "South Vietnam: Last Chance for Freedom in Asia." The war being lost; neutralization a "dishonest substitute for unconditional surrender"; carry it "to its source: North Vietnam."'
        n: '[110 Cong. Rec. 4986–92](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt4/pdf/GPO-CRECB-1964-pt4-6-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 225. See [[cal.1964-03-10.vietnam]]. Names: Dodd, Gruening.'
        tags: [name:dodd-thomas-j, name:gruening-ernest]
  - add:
      entry:
        id: cal.1964-06-10.vietnam
        when: June 10
        date: '1964-06-10'
        thread: vietnam
        c: 'The White House, 5:30 p.m.: Rusk, McNamara, McGeorge Bundy and the others on a congressional resolution. No early resolution, "unless and until we have a firm decision to take more drastic action," Bundy reports to Johnson.'
        n: 'FRUS 1964–68, I, docs. [210](https://history.state.gov/historicaldocuments/frus1964-68v01/d210), [211](https://history.state.gov/historicaldocuments/frus1964-68v01/d211) (Bundy''s paper), [212](https://history.state.gov/historicaldocuments/frus1964-68v01/d212). [[w.gibbons-u-s-government-and]], II, 266–268. See [[cal.1964-05-24.vietnam]]. Names: Rusk, McNamara, McGeorge Bundy, Johnson.'
        tags: [name:rusk-dean, name:mcnamara-robert-s, name:bundy-mcgeorge, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-06-15.vietnam
        when: June 15
        date: '1964-06-15'
        thread: vietnam
        c: 'The principals at State, 6 p.m., on whether to seek the resolution now. Agreed: not now. The steps open without one, and a campaign of public information.'
        n: 'FRUS 1964–68, I, docs. [214](https://history.state.gov/historicaldocuments/frus1964-68v01/d214), [215](https://history.state.gov/historicaldocuments/frus1964-68v01/d215). [[w.gibbons-u-s-government-and]], II, 268–274; III, 9. See [[cal.1964-06-10.vietnam]].'
  - add:
      entry:
        id: cal.1964-12-09.vietnam
        when: Dec. 9
        date: '1964-12-09'
        thread: vietnam
        c: 'Mansfield to Johnson: "further and further out on the sagging limb." No action beyond South Vietnam''s borders; a Saigon government to speak for "peaceful unification." Otherwise years of involvement, to be spelled out to the nation.'
        n: 'Johnson''s reply, Dec. 17: [FRUS 1964–68, I, doc. 449](https://history.state.gov/historicaldocuments/frus1964-68v01/d449). [[w.gibbons-u-s-government-and]], II, 377–379; III, 23. See [[cal.1964-12-01.vietnam]]. Names: Mansfield, Johnson.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-01-15.vietnam
        when: Jan. 15
        date: '1965-01-15'
        thread: vietnam
        c: 'McGovern in the Senate: the war not being won; to widen it "an act of folly." Pressure on the North by South Vietnamese infiltration, then negotiation.'
        n: '[111 Cong. Rec. 784–86](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt1/pdf/GPO-CRECB-1965-pt1-10-1.pdf) (1965). [[w.gibbons-u-s-government-and]], II, 395. See [[cal.1964-12-01.vietnam]]. Names: McGovern. Check: Gibbons prints vol. 110.'
        tags: [name:mcgovern-george]
  - add:
      entry:
        id: cal.1965-01-21.vietnam
        when: Jan. 21
        date: '1965-01-21'
        thread: vietnam
        c: 'Johnson with the congressional leaders of both parties, 10:07 a.m.–12:45 p.m., Russell and Fulbright not asked. A stable government in Saigon first. More American forces not needed "short of a decision to go to full-scale war."'
        n: '[FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30) (Gibbons: Jan. 22). [[w.gibbons-u-s-government-and]], III, 39–41. See [[cal.1964-12-01.vietnam]]. Names: Johnson, Russell, Fulbright.'
        tags: [name:johnson-lyndon-b, name:russell-richard-b, name:fulbright-j-william]
  - add:
      entry:
        id: cal.1965-02-08.vietnam
        when: Feb. 8
        date: '1965-02-08'
        thread: vietnam
        c: 'Mansfield to Johnson after the three NSC meetings: grave doubts of Khánh''s government; the South tired of the war; too far into the North, worse than Korea.'
        n: '[FRUS 1964–68, II, doc. 92](https://history.state.gov/historicaldocuments/frus1964-68v02/d92). [[w.gibbons-u-s-government-and]], III, 69. See [[cal.1965-02-07.vietnam]]. Names: Mansfield, Johnson, Nguyễn Khánh.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b, name:nguyen-khanh]
  - add:
      entry:
        id: cal.1965-02-09.vietnam
        when: Feb. 9
        date: '1965-02-09'
        thread: vietnam
        c: 'McGeorge Bundy answers Mansfield for Johnson, point by point. The UN: no expert sees "any prospect that it can act effectively."'
        n: '[FRUS 1964–68, II, doc. 94](https://history.state.gov/historicaldocuments/frus1964-68v02/d94). [[w.gibbons-u-s-government-and]], III, 69–70. See [[cal.1965-02-08.vietnam]]. Names: McGeorge Bundy, Mansfield, Johnson.'
        tags: [name:bundy-mcgeorge, name:mansfield-mike, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-02-10.vietnam-2
        when: Feb. 10
        date: '1965-02-10'
        thread: vietnam
        c: 'Evening, off the record: Johnson with nine of Congress, Kuchel the one Republican. Ball and McDonald brief. Fulbright asks of strikes on China; answered no. Mansfield''s memorandum: another reprisal will not cool the situation; expect the Viet Cong''s answer in the South.'
        n: 'FRUS 1964–68, II, docs. [100](https://history.state.gov/historicaldocuments/frus1964-68v02/d100), [101](https://history.state.gov/historicaldocuments/frus1964-68v02/d101); Bundy''s reply, Feb. 11, [107](https://history.state.gov/historicaldocuments/frus1964-68v02/d107). [[w.gibbons-u-s-government-and]], III, 79–82. See [[cal.1965-02-10.vietnam]]. Names: Johnson, Kuchel, Ball, McDonald, Fulbright, Mansfield.'
        tags: [name:johnson-lyndon-b, name:kuchel-thomas-h, name:ball-george-w, name:mcdonald-david-l, name:fulbright-j-william, name:mansfield-mike]
  - add:
      entry:
        id: cal.1965-02-17.vietnam-2
        when: Feb. 17
        date: '1965-02-17'
        thread: vietnam
        c: 'The Senate''s "Vietnam debate" opens. Church: the Saigon government losing "for lack of internal cohesion"; a negotiated, neutral Indochina. McGee: the domino theory valid; a line at the 17th parallel, graduated bombing of the North if it is crossed.'
        n: '[111 Cong. Rec. 2869](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-1-1.pdf) ff. (Church), 2884 ff. (McGee) (1965). [[w.gibbons-u-s-government-and]], III, 131–133. Names: Church, McGee.'
        tags: [name:church-frank, name:mcgee-gale-w]
  - add:
      entry:
        id: cal.1965-02-18.vietnam
        when: Feb. 18
        date: '1965-02-18'
        thread: vietnam
        c: 'Dirksen answers Church and McGovern: "Another round of negotiating like 1954 and 1962 and we shall find ourselves negotiated right out of Asia." Saltonstall and Smathers with him; Morse against.'
        n: '[111 Cong. Rec., Senate, Feb. 18, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-2-2.pdf). [[w.gibbons-u-s-government-and]], III, 133. See [[cal.1965-02-17.vietnam-2]]. Names: Dirksen, Church, McGovern, Saltonstall, Smathers, Morse. Check: the pages; Gibbons prints 2146 ff.'
        tags: [name:dirksen-everett, name:church-frank, name:mcgovern-george, name:saltonstall-leverett, name:smathers-george-a, name:morse-wayne]
  - add:
      entry:
        id: cal.1965-03-24.vietnam
        when: Mar. 24
        date: '1965-03-24'
        thread: vietnam
        c: 'Mansfield to Johnson, a letter: policy running opposite to all his memoranda. Ground forces held at two or three points on the sea, Saigon and Đà Nẵng; the Geneva conference reconvened, a cease-fire its one condition. He expects no answer.'
        n: '[FRUS 1964–68, II, doc. 215](https://history.state.gov/historicaldocuments/frus1964-68v02/d215). [[w.gibbons-u-s-government-and]], III, 205–208. See [[cal.1965-03-08.vietnam]]. Names: Mansfield, Johnson.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-04-02.vietnam
        when: Apr. 2
        date: '1965-04-02'
        thread: vietnam
        c: 'Taylor before Foreign Relations and Armed Services in executive session, then the House committee; guarded on troops. To the NSC: Fulbright worried of three or four divisions, and whether the resolution covers them. Johnson: no new resolution needed to send troops.'
        n: 'FRUS 1964–68, II, docs. [231](https://history.state.gov/historicaldocuments/frus1964-68v02/d231), [235](https://history.state.gov/historicaldocuments/frus1964-68v02/d235) (William Bundy to the congressional liaison, Apr. 3). [[w.gibbons-u-s-government-and]], III, 212–215. See [[cal.1965-03-08.vietnam]]. Names: Taylor, Fulbright, Johnson.'
        tags: [name:taylor-maxwell, name:fulbright-j-william, name:johnson-lyndon-b, name:bundy-william]
  - add:
      entry:
        id: cal.1965-04-12.vietnam
        when: Apr. 12
        date: '1965-04-12'
        thread: vietnam
        c: 'Johnson answers Mansfield''s letter of Mar. 24 and memorandum of Mar. 18: "more agreement than difference between us."'
        n: '[FRUS 1964–68, II, doc. 248](https://history.state.gov/historicaldocuments/frus1964-68v02/d248). [[w.gibbons-u-s-government-and]], III, 208. See [[cal.1965-03-24.vietnam]]. Names: Johnson, Mansfield.'
        tags: [name:johnson-lyndon-b, name:mansfield-mike]
  - add:
      entry:
        id: cal.1965-06-09.vietnam
        when: June 9
        date: '1965-06-09'
        thread: vietnam
        c: 'Mansfield to Johnson, asked the night before: no new resolution; a request on ground forces could "set off a wave of criticism." Three courses: all the South, upwards of a million men; the cities and provincial capitals, about 500,000; a position to negotiate from, 100,000.'
        n: '[FRUS 1964–68, II, doc. 341](https://history.state.gov/historicaldocuments/frus1964-68v02/d341). [[w.gibbons-u-s-government-and]], III, 280–282. See [[cal.1965-06-07.vietnam]]. Names: Mansfield, Johnson.'
        tags: [name:mansfield-mike, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-06-09.vietnam-2
        when: June 9
        date: '1965-06-09'
        thread: vietnam
        c: 'Javits in the Senate: no land war in Asia without the specific consent of Congress; the President should ask for it.'
        n: '[111 Cong. Rec. 12,983–87](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-1-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 282–283. See [[cal.1965-06-09.vietnam]]. Names: Javits.'
        tags: [name:javits-jacob-k]
  - add:
      entry:
        id: cal.1965-06-15.vietnam
        when: June 15
        date: '1965-06-15'
        thread: vietnam
        c: 'Fulbright in the Senate, at Johnson''s request of the day before: against withdrawal and against escalation. An end by negotiation "involving major concessions by both sides."'
        n: '[111 Cong. Rec. 13,656–58](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-5-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 303–306; [[w.woods-fulbright]]. See [[cal.1965-06-07.vietnam]]. Names: Fulbright, Johnson.'
        tags: [name:fulbright-j-william, name:johnson-lyndon-b]
