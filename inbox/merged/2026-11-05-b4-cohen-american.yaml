      when: May 11
      date: '1960-05-11'
      thread: elections-1960-primaries
      c: 'Chicago. Daley on Kennedy''s West Virginia victory: "another indication that Democratic primary voters had spoken
        in an emphatic manner"; people "vote for the individual and not for his religion or his geographical qualifications."
        No endorsement: "We''ll caucus in California."'
      n: '[[w.cohen-american-pharaoh]], 257–58. Names: Daley, John F. Kennedy.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
