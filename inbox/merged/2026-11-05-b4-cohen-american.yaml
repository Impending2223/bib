      c: 'Chicago. Morris J. Wexler, special prosecutor in Ward''s place, reports on the election of 1960: of precincts with
        "major mistakes" in both the presidential and State''s Attorney''s counts favoring one party, seven of seven favored
        the Democrats. By his estimate Adamowski may have lost as many as 10,000 votes.'
      n: '[[w.cohen-american-pharaoh]], 277. Wexler then charged 650 election officials; all the charges dismissed by Judge
        John Marshall Karns (277). Check: the days. Names: Ward, Adamowski.'
