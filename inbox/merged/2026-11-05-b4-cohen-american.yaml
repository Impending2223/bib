      when: Feb. 22
      date: '1960-02-22'
      thread: states-and-cities
      c: 'Chicago. Daley''s search committee, after twenty-eight days in executive session at the University Club, ninety
        candidates considered and fifty-three interviewed, names its chairman, Wilson, police commissioner; the idea McFetridge''s.
        Stratton: Wilson "has a good reputation." Adamowski, to Republican women: Daley holds him up "as a facade."'
      n: '[[w.cohen-american-pharaoh]], 255–56. Names: Stratton, Adamowski.'
      tags:
      - state:il
      - city:chicago
