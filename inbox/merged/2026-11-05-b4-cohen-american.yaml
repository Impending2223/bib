      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-chicago
      c: 'Chicago, election night. Daley to Robert Kennedy at about 1 a.m., by Theodore White''s account: Illinois will go
        Democratic. Daley to O''Donnell, by O''Donnell''s: "We''re trying to hold back our returns. Every time we announce
        two hundred more votes for Kennedy in Chicago, they come up out of nowhere downstate with another three hundred votes
        for Nixon."'
      n: '[[w.cohen-american-pharaoh]], 265. Turnout in Chicago 89.3 percent (264–65). To check: [[w.white-making-of-the-president]];
        [[w.odonnell-johnny-we-hardly-knew]] (cited by [[w.cohen-american-pharaoh]], 265). Names: Daley, Robert Kennedy, O''Donnell.'
      tags:
