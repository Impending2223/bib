- add:
    entry:
      id: cal.1966-11-08.elections-1966-3
      when: Nov. 8
      date: '1966-11-08'
      thread: elections-1966
      c: 'Illinois, Cook County. Douglas carries Chicago by 184,000 and loses the State to Percy by 400,000. Ogilvie, the
        sheriff, elected president of the county board; Republicans county treasurer and sheriff; Stevenson III, Daley''s
        choice, State treasurer. Pucinski re-elected by 4,700, 31,000 in 1964: "I''m the first to admit now I was dead wrong."
        Daley: "the good people of Chicago are still Democratic."'
      n: '[[w.cohen-american-pharaoh]], 426–27. Check: the counts. Names: Douglas, Percy, Ogilvie, Stevenson, Pucinski, Daley.'
      tags:
      - state:il
      - city:chicago
