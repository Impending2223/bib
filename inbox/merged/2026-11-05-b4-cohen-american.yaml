      date: 1960-10
      thread: governors
      also:
      - elections-1960
      c: 'Illinois. Stratton: "We are up against the slimiest, dirtiest machine in the history of Illinois"; Kerner would
        be Daley''s. Daley: 70 percent voted for his record in 1959.'
      n: '[[w.cohen-american-pharaoh]], 260. Check: the day. Names: Stratton, Kerner, Daley.'
      tags:
