      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, Kennedy''s suite at the Biltmore, after the nomination. Daley, with a few other backers, for Symington
        for second place, against Johnson: Johnson would make Illinois harder to carry. Kennedy, by the *Chicago Tribune*''s
        account: "Not you nor anybody else nominated us. We did it ourselves."'
      n: '[[w.cohen-american-pharaoh]], 259–60. Check: the day. Names: Daley, Symington, Lyndon Johnson, John F. Kennedy.'
      tags:
      - name:daley-richard-j
      - name:symington-william-s
