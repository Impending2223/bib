      date: '1960-07-07'
      thread: elections-1960-los-angeles
      c: Daley and his family leave Chicago for Los Angeles in a private car at the end of the Santa Fe Chief. He holds fifty
        of Illinois's sixty-nine delegates, uncommitted.
      n: '[[w.cohen-american-pharaoh]], 258. Names: Daley.'
