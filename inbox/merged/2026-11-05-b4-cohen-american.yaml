      when: Jan.
      date: 1960-01
      thread: states-and-cities
      c: Chicago. Daley announces O'Connor's resignation as police commissioner, for his gall bladder; a committee to find
        a successor under Orlando W. Wilson, dean of criminology at the University of California, McFetridge of the Chicago
        Federation of Labor among its members.
      n: '[[w.cohen-american-pharaoh]], 254–55. Check: the day; the committee sat twenty-eight days before Feb. 22 (255).
        Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
