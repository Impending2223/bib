- add:
    entry:
      id: cal.1968-11-05.elections-1968-3
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968
      c: 'Illinois, Cook County. Humphrey carries Chicago by 370,000, Nixon the State by 135,000. Simon, a downstate Democrat,
        elected lieutenant governor under Ogilvie; Hanrahan, Daley''s, State''s Attorney; the county board Democratic, 10
        to 4. Daley: Humphrey "didn''t get enough votes."'
      n: '[[w.cohen-american-pharaoh]], 484. Check: the counts. Names: Humphrey, Nixon, Ogilvie, Daley.'
      tags:
