      when: July 10
      date: '1960-07-10'
      thread: elections-1960-los-angeles
      c: 'Pasadena. Daley, called by Mrs. Roosevelt, hears her case for Stevenson; he cannot back him: Stevenson told him
        the spring before, at Libertyville, he would not run.'
      n: '[[w.cohen-american-pharaoh]], 258. Check: the day; Cohen and Taylor date it only to convention week. Names: Daley,
        Eleanor Roosevelt, Stevenson.'
