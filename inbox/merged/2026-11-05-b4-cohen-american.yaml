      when: Jan.
      date: 1960-01
      thread: states-and-cities
      also:
      - governors
      c: 'Chicago. Stratton, at a press conference in his Chicago office across from City Hall: he will take over the city''s
        police unless Daley "stops laughing and cleans up the mess himself — quickly"; Daley to give up the party''s chairmanship.'
      n: '[[w.cohen-american-pharaoh]], 254. Check: the day. Names: Stratton, Daley.'
      tags:
