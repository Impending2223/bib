      when: Apr. 6
      date: '1960-04-06'
      thread: elections-1960-primaries
      c: 'Chicago, the Blackstone. Truman and Daley at breakfast: Nixon, unopposed in Wisconsin, polled fewer votes than Kennedy
        or Humphrey. Daley on Kennedy''s religion: "The people were voting for the man."'
      n: '[[w.cohen-american-pharaoh]], 257. Names: Truman, Daley, Nixon, John F. Kennedy, Humphrey.'
      tags:
