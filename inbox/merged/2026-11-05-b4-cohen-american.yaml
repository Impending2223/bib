- add:
    entry:
      id: cal.1960-01.states-and-cities
      when: Jan.
      date: 1960-01
      thread: states-and-cities
      c: 'Chicago, the Summerdale scandal. Richard Morrison, a burglar of 23 in custody, in a confession of seventy-seven
        pages: twelve officers of the Summerdale district his partners for almost two years, the goods carried off in squad
        cars; four truckloads of stolen goods in their homes. Daley, back early from Florida: "the most shocking and disgraceful
        incident in the history of the Chicago Police Department." O''Connor, the commissioner, takes charge; 130 of the district''s
        police questioned.'
      n: '[[w.cohen-american-pharaoh]], 252–53. Check: the day. Names: Daley.'
      tags:
      - state:il
      - city:chicago
      - name:daley-richard-j
      src:
        c: 51d28df7
        rows:
        - 'w.cohen-american-pharaoh 252–53: all'
