      date: '1960-07-10'
      thread: elections-1960-los-angeles
      c: 'Los Angeles. Stevenson, after Illinois''s caucus, reaches Daley through Arvey and asks him to reconsider. Daley:
        he has no support in the delegation; "You''re lucky to have the two votes you''ve got."'
      n: '[[w.cohen-american-pharaoh]], 259. Check: the day. Names: Stevenson, Daley.'
