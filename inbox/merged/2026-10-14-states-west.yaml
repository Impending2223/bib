      c: Washington's House at the session's opening. Dissident Democrats and the Republicans elect Day speaker on the third ballot over O'Brien, speaker since 1955. *Thigpen v. Meyers*, 211 F. Supp. 826 (W.D. Wash., Dec. 1962), had found the legislative districts invidiously discriminatory and left the session to redistrict. The regular session and a special session of 23 days pass no plan; in May the district court holds the districts void.
