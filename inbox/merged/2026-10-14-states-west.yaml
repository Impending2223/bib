      c: Hawaii. Burns (D) governor over Quinn (R), the first governor of the State, 114,308 to 81,707, 58.3 percent.
      n: 'Votes: [Wikipedia, "1962 Hawaii gubernatorial election"](https://en.wikipedia.org/wiki/1962_Hawaii_gubernatorial_election); Check: [Haw. *Result of Votes Cast, General Election*, Nov. 6, 1962](https://archive.org/download/HI-hist/1962_General.pdf). [[w.boylan-john-a-burns]]; [[w.coffman-island-edge-of-america]]. See [[cal.1962-10-06.governors-hi]]. Names: Burns (K–J Cong. III.F).'
