      when: Oct. 25–Nov. 13
      date: '1965-10-25'
      thread: legislatures
      also:
      - states-and-cities
      c: 'Nevada''s legislature in special session, called by Sawyer at the order of the federal district court in *Dungan v. Sawyer*, 250 F. Supp. 480, brought by Assemblywoman Dungan of Clark County: the Senate, one member for each of the 17 counties, and the Assembly found invidiously discriminatory; fewer than 8 percent of the people elected a majority of the Senate. The 1965 regular session had passed only a resolution asking Congress for an amendment letting one house be apportioned on other factors. Plan adopted: 20 senators from 13 districts, Clark County 8; 40 assemblymen from 16 districts, Clark County 16.'
      n: '[Nev. *Political History of Nevada* (12th ed., 2016), 400](https://www.leg.state.nv.us/Division/Research/Publications/PHoN/PHoN.pdf#page=406)–401; the plan, 415–417. [[w.dixon-democratic-representation]]; [[w.elliott-history-of-nevada]]. See [[cal.1964-06-15.court]]. Names: Sawyer (K–J Cong. III.F); Dungan (K–J Cong. III.K).'
      tags:
      - state:nv
      - city:las-vegas
      - name:sawyer-grant
      - name:dungan-flora
