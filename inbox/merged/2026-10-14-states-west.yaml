      c: 'Hawaii''s primary, for governor. Republican: Governor Quinn 44,205, 57.1 percent; Kealoha, the lieutenant governor, 33,272. Democratic: Burns, once Delegate, 71,540, 90.2.'
      n: 'Votes: [Haw. *Result of Votes Cast, Primary Election*, Oct. 6, 1962, grand total](https://archive.org/download/HI-hist/1962_Primary.pdf#page=34). [[w.boylan-john-a-burns]]; [[w.coffman-island-edge-of-america]]. See [[cal.1961-01-06.elections-1960]]. Names: Burns (K–J Cong. III.F); Kealoha (K–J Cong. III.K).'
      tags:
      - state:hi
      - name:quinn-william-f
      - name:kealoha-james-k
