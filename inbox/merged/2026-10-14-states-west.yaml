      c: '*Burns v. Richardson*, [384 U.S. 73](https://tile.loc.gov/storage-services/service/ll/usrep/usrep384/usrep384073/usrep384073.pdf): Hawaii''s interim apportionment, the Senate by registered voters, 19 of 25 senators to Oahu, with the House as it is, to stand for the 1966 elections. Multi-member districts not void unless shown to cancel out the votes of racial or political groups; registered voters a permissible measure here, where they approximate citizen population. Brennan for the Court; Harlan and Stewart concur.'
      n: '[[w.dixon-democratic-representation]]; [[w.coffman-island-edge-of-america]]. See [[cal.1964-06-15.court]]. Names: Burns (K–J Cong. III.F); Brennan, Harlan, Stewart (K–J Cong. III.G).'
