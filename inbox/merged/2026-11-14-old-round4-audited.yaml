- edit:
    id: cal.1966-02-17.vietnam-hearings
    base: 5bd327cf
    set:
      when: Feb. 17
      date: '1966-02-17'
      c: 'The Foreign Relations Committee''s hearings: Taylor, Feb. 17, televised, for the administration: against Gavin''s enclaves; the Communists "have not forgotten that the Vietminh won more in Paris than in Dienbienphu." Case, a Republican for the war: "troubled by any suggestion that any question raised is weakening American efforts abroad." Morse: the people will repudiate the war; Taylor: "That, of course, is good news to Hanoi"; Morse: "the smear artist."'
      n: 'Daily Digest, [112 Cong. Rec. D57](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=55) (Feb. 17, 1966). Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam* (1966) (Check the pages; Gibbons cites 438, 454–55 and 530 for Taylor''s day, IV, 243 nn.88–90). [[w.gibbons-u-s-government-and]], IV, 242–43; [[w.woods-fulbright]], 406 (Taylor: the policy "the best that has been suggested"; Fulbright reads the letter of an "anonymous" observer, Pettit); [[w.taylor-swords-and-plowshares]], 365–66 (Taylor''s opening statement, the four components; cross-examined the rest of the day); [[w.zaroulis-who-spoke-up]], 72, 74–75 (Morse and Taylor, "good news to Hanoi"; Taylor on Gavin''s plan; Fulbright and Taylor on napalm and Tokyo; the days not given). [[w.mann-grand-delusion]], 494 (Taylor and Morse). See [[cal.1966-02-04.vietnam]]; [[cal.1966-02-08.vietnam-hearings]]. Names: Taylor, Gavin, Case, Morse. Check: Mann, 494, gives Morse''s words "I know that that is the smear ... that you militarists give."'
      tags:
      - name:taylor-maxwell
      - name:case-clifford-p
      - name:morse-wayne
      - name:gavin-james-m
    unset:
    - src
- edit:
    id: cal.1966-05-29.vietnam-struggle
    base: 0fb8f708
    set:
      when: May 29
      date: '1966-05-29'
      c: 'Self-immolations of the Buddhist struggle begin: a nun at Huế on May 29 the first (Check), others in the days after.'
      n: 'Lodge''s telegram 5124 from Saigon, May 30, quoted in FRUS 1964–68, IV, doc. [150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150), n. 3 (the "campaign of hunger strikes, letters in blood and suicide" by May 30; not the nun or the day). To check: a source for the nun''s act of May 29. Check: the day and the first. See [[cal.1966-03-10.vietnam]].'
      tags:
      - place:hue
    unset:
    - src
- edit:
    id: cal.1966-05-30.vietnam-struggle
    base: 2c8d8ee5
    set:
      c: 'Lodge, 5124: the "current cynical campaign of hunger strikes, letters in blood and suicide" aims to force concessions to Trí Quang, who "is not to be reasoned with"; Kỳ isolating the extremists; "we should persist."'
      n: 'Lodge''s telegram 5124 from Saigon, May 30, quoted in FRUS 1964–68, IV, doc. [150](https://history.state.gov/historicaldocuments/frus1964-68v04/d150), n. 3 (the "hunger strikes" wording). [[w.gibbons-u-s-government-and]], IV, 329–30. Made public: [[w.gibbons-u-s-government-and]], IV (1995). To check: Saigon to Washington 5124, May 30, 1966, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.51). Names: Lodge, Thích Trí Quang, Nguyễn Cao Kỳ. Check: Gibbons, IV, 329, quotes the telegram "huge strikes ... suicides"; FRUS has "hunger strikes, letters in blood and suicide."'
    unset:
    - src
