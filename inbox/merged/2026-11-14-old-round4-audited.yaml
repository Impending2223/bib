      c: 'New York, Cooke installed as Archbishop: the congregation in St. Patrick''s stands and cheers Johnson. He speaks with Jacqueline Kennedy; at the Archbishop''s residence sees Nelson and Happy Rockefeller, and speaks quietly to the Governor alone: seek the Republican nomination. Back at 6:30 p.m.'
      n: '[[w.califano-triumph-and-tragedy-of]], 271–72, 290 (the word to Rockefeller, Apr. 4); [[w.dallek-flawed-giant]], 545 (the brief conversation at the installation). See [[cal.1968-04-04.vietnam-paris]] (U Thant at the UN). Names: Johnson, Jacqueline Kennedy, Rockefeller, Margaretta Rockefeller.'
      tags:
