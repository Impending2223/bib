      n: 'H. Res. 1, 90th Cong. [113 Cong. Rec. 26–27](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt1/pdf/GPO-CRECB-1967-pt1-1-2.pdf) (1967); H.R. Rep. No. 27, 90th Cong., 1st Sess., 1–2 (1967), as given in *Powell v. McCormack*, [395 U.S. 486](https://tile.loc.gov/storage-services/service/ll/usrep/usrep395/usrep395486/usrep395486.pdf), 489–90 (1969) (K–J Cong. II.J.1). [[w.branch-at-canaans-edge]], 570; [[w.johnson-white-house-diary]], 471–72 (Powell "expelled" in her word, with "a committee which is supposed to spend four or five weeks judging his case"; he "stormed out onto the steps, surrounded by his supporters, some of whom wore black masks," and called the legislators "the biggest bunch of hypocrites ever elected"; not the votes). Order: at the oath, after the House convened and chose its Speaker ([[cal.1967-01-10.congress-4]]), roll calls 2–3 after the Speaker''s, 1. To check: [[w.hamilton-adam-clayton-powell-jr]]; [[w.haygood-king-of-the-cats]]; [[w.powell-adam-by-adam]]; [[w.congress-and-the-nation-1969]]; "Democrats Vote to Oust Powell As House Committee''s Chairman/ He May Be Kept from Seat Today," [*New York Times*, Jan. 10, 1967](https://timesmachine.nytimes.com/timesmachine/1967/01/10/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 570); "Powell Denied House Seat Pending Five-Week Inquiry/ Vote Is 364-64," [*New York Times*, Jan. 11, 1967](https://timesmachine.nytimes.com/timesmachine/1967/01/11/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 570); Jacobs, *The Powell Affair* (1973), 6–7 (cited by [[w.branch-at-canaans-edge]], 570). See [[cal.1967-01-03.congress]]. Names: Powell, Udall.'
