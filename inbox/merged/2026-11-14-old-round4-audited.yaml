- check:
    id: cal.1965-02-26.vietnam-3
    text: 'Check: one meeting with [[cal.1965-02-26.vietnam]]? The Daily Diary has Johnson with Rusk, Ball, McNamara and Thomas Mann, 7:05 to 8:35 p.m., the meeting at which the landing was decided, no other record of it found (FRUS 1964–68, II, doc. [170](https://history.state.gov/historicaldocuments/frus1964-68v02/d170), n. 2); Ball, 392, has the President''s meeting on his memorandum that Friday, long, with McNamara and Rusk, and names his memorandum, not the landing.'
- edit:
    id: cal.1965-08-03.voting-rights
    base: 14c892b5
    set:
      when: Aug. 3
      c: House adopts the conference report on the voting rights bill, S. 1564, [328–74](https://voteview.com/rollcall/RH0890107); recommittal lost, [118–284](https://voteview.com/rollcall/RH0890106). The House's ban on the poll tax dropped for a finding that it abridges the right to vote and a direction to the Attorney General to sue.
      n: '[111 Cong. Rec. 19,200–01](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-5-2.pdf#page=15) (1965) (Aug. 3, 1965). [[w.branch-at-canaans-edge]], 275 (the House''s vote); [[w.mann-walls-of-jericho]], 475 (328–74); [[w.kotz-judgment-days]], 331 (328–74); [[w.zelizer-fierce-urgency-of-now]], 219 (328–74); [[w.bernstein-guns-or-butter]], 240–41 (Dirksen and Celler''s language; the American flag provision kept; 328 to 74). See [[cal.1965-07-09.voting-rights]]. Check: the pages.'
    unset:
    - src
- add:
    entry:
      id: cal.1965-08-04.voting-rights-2
      when: Aug. 4
      date: '1965-08-04'
      thread: voting-rights
      c: Senate adopts the conference report on the voting rights bill, S. 1564, [79–18](https://voteview.com/rollcall/RS0890178), clearing it for the President.
      n: '[111 Cong. Rec. 19,378](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt14/pdf/GPO-CRECB-1965-pt14-6-1.pdf#page=71) (1965) (Aug. 4, 1965). [[w.branch-at-canaans-edge]], 275 (the Senate''s passage); [[w.mann-walls-of-jericho]], 475 (the next day, 79–18, after a perfunctory debate); [[w.kotz-judgment-days]], 331 (the Senate 79–18 the next day, Smathers for); [[w.zelizer-fierce-urgency-of-now]], 219 (79–18); [[w.bernstein-guns-or-butter]], 240–41 (the next day, 79 to 18). See [[cal.1965-08-03.voting-rights]].'
