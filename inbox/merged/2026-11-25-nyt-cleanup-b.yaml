    base: a1872a94
    set:
      n: '[[w.shesol-mutual-contempt]], 35; [[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease and might prove physically unfit; Johnson''s statement denying advance knowledge; not the words quoted, the *Times* or the day). W. H. Lawrence, "Johnson Backers Urge Health Test," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). Check: the words: the *Times* has no "today." Check: the day: [[w.salinger-with-kennedy]], 40, puts the Connally–Edwards press conference "on the first day of the convention" (July 11). Check: the *Times* dates it July 4. To check: India Edwards oral history, LBJ Library. Names: Connally, Kennedy, Johnson.'
