- add:
    entry:
      id: cal.1960-07-04.congo-4
      when: By July 4
      date: '1960-07-04'
      thread: congo
      c: Kasai. An order to arrest Joseph Ngalula, head of the dissident provincial government, reported. Ngalula of Kalonji's wing of the Congolese National Movement; Lumumba, head of the other, supports the Kasai officials acting against him.
      n: 'Harry Gilroy, "Congolese Police Kill 10 in Clash," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 8. Check: the day; the order "reported." See [[cal.1960-07-04.congo]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-07-04.labor-disputes
      when: July 4
      date: '1960-07-04'
      place: leopoldville
      thread: labor-disputes
      also:
      - congo
      c: Léopoldville. Workers of Otraco, the national transport organization, strike, not all of them having had the $2 bonus for independence; the police force them from the dock area.
      n: 'Harry Gilroy, "Congolese Police Kill 10 in Clash," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 8. See [[cal.1960-07-04.congo]].'
- add:
    entry:
      id: cal.1960-07-04.europe-and-the-alliance-federal-republic-2
      when: July 4
      date: '1960-07-04'
      place: bonn
      thread: europe-and-the-alliance-federal-republic
      also:
      - defense
      follows:
      - cal.1960-07-04.europe-and-the-alliance-federal-republic
      c: 'Brucker, six hours after his news conference, the Defense Ministry having protested sharply, by a statement through the United States Embassy: his references to Strauss''s interest in the Polaris "were by no means intended to indicate an interest on the part of the minister in acquiring this weapon system."'
      n: '"Brucker Discusses Missiles for Bonn," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 9. The order: "six hours later." See [[cal.1960-07-04.europe-and-the-alliance-federal-republic]]. Names: Brucker, Strauss.'
      tags:
      - name:brucker-wilber-m
      - name:strauss-franz-josef
- add:
    entry:
      id: cal.1960-07-02.elections-1960-nomination-15
      when: July 2
      date: '1960-07-02'
      thread: elections-1960-nomination
      c: Collins, the convention's permanent chairman, telegraphs Truman a second time, urging him to attend; no answer.
      n: '"Collins Pledges Fair Convention," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html). The order: the paper has it sent after Truman''s news conference. See [[cal.1960-07-03.elections-1960-nomination]]. Names: Collins, Truman.'
      follows:
      - cal.1960-07-02.elections-1960-2
      tags:
      - name:collins-leroy
      - name:truman-harry-s
- add:
    entry:
      id: cal.1960-07-03.soviet-union-4
      when: July 3
      date: '1960-07-03'
      place: ybbs-persenbeug
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: Photographers stage a sitdown strike at the Ybbs-Persenbeug dam, Khrushchev's first stop on the Austrian tour. Western photographers, barred from the restaurant where he lunches, sit in a row with their cameras before them as he nears the administration building; the organizer, a Viennese, tells them not to enter unless reporters are admitted. His demand succeeds.
      n: 'M. S. Handler, "Khrushchev Sees Hitlerite Threat from Bonn Regime," [*New York Times*, July 4, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/04/issue.html), at 1, 3. See [[cal.1960-07-03.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1960-06.elections-1960-kennedy
      when: June, about the 13th
      date: '1960-06'
      at: before 1960-06-13
      place: washington
      thread: elections-1960-kennedy
      c: 'Sorensen, asked by a reporter about Kennedy''s health and reports that he uses cortisone: "He is not on cortisone." Asked what other drug he might use: "I don''t know that he is on anything."'
      n: '"Use of Drug Denied," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). Check: the day. Names: Sorensen, Kennedy.'
      tags:
      - name:sorensen-theodore-c
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles-9
      when: July 4
      date: '1960-07-04'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Kennedy''s forces answer India Edwards: the Johnson side is using "despicable tactics," "a sure sign of the desperation of the opposition." Salinger, Kennedy''s press secretary: the range, depth and drive of his campaign, which has tired his staff and the newsmen with him, are evidence of his good health.'
      n: 'W. H. Lawrence, "Johnson Backers Urge Health Test," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). See [[cal.1960-07-04.elections-1960-2]]. Names: Salinger, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-04.japan-and-korea-far-east
      when: July 4
      date: '1960-07-04'
      place: nyc
      thread: japan-and-korea-far-east
      c: King Bhumibol and Queen Sirikit of Thailand land at La Guardia's Marine Terminal; the King asks to see all the bridges. They stay at the Waldorf Towers; the visit ends Thursday.
      n: Milton Esterow, "2 Kings Really Go at Governor's Party," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 10. See [[cal.1960-07-04.elections-1960-rockefeller]].
      tags:
      - state:ny
      - city:new-york
