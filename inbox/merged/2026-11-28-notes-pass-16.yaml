- edit:
    id: cal.1967-02-10.china-leadership
    base: 96b36af1
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 10, 1967. [[w.macfarquhar-maos-last-revolution]], 188–189, 191 (Mao, by Wang Li''s account angry after reading a transcript of the Jan. 4 attacks on Tao Zhu, faults Chen Boda and Jiang Qing; Chen offers a self-criticism and Mao stops him; the Group to criticize the two, with Zhang Chunqiao and Yao Wenyuan called back from Shanghai; more members to be called to such meetings); [[w.mao-zedong-zhuan]], VI, ch. 76 n.27 (Feb. 10 Mao at the enlarged Standing Committee meeting, as Wang Li later told, n.27: to Chen Boda, ''you, one standing member bringing down another''; to Jiang Qing, ''eyes high, hand low, ambition large, talent small; with Tao Zhu overthrown no one else was involved, it was you two alone''; ''I see it is as before, no reports to me, a blockade of me, the Premier excepted''; Chen Boda and Jiang Qing had named Tao Zhu in public among the masses without reporting to the Center; Mao ends by asking the Group to meet and criticize Chen and Jiang). [[w.yang-jisheng-tiandi-fanfu]], I, 386–387 (Mao, at an enlarged Standing Committee meeting, upbraids Chen Boda, "a standing member bringing down a standing member," and Jiang Qing, "your eyes higher than your hands"; he checked the record: only Chen spoke and Jiang broke in; the matter to be raised only here and in the Group; Ye Jianying tells the marshals and Li Fuchun the vice-premiers); [[w.jian-zhou-enlai]], 568 (Mao urges Jiang to criticize herself, "high aspirations but low capacity"; the Group "an independent kingdom that has ignored the Politburo and its Standing Committee"; no intention of "bringing down all cadres," "anarchism in action"; the Shanghai Commune "a huge matter ... not discussed in advance"; Chen puts it "days later" than Feb. 11); [[w.teiwes-tragedy-of-lin-biao]], 71, 78 n.42 (Mao''s rebuke of "one Standing Committee member [Chen] knocking over another [Tao]," Chen Boda and Jiang Qing to make self-criticisms; on the same occasion in early February he reportedly complains to Lin: "You kept me in the dark like you have always done in the past"); [[w.chen-yi-nianpu]], 1184 (Feb. 10, 1967; Mao announces that the enlarged Standing Committee will be enlarged further, with Chen Yi, Tan Zhenlin, Li Xiannian, Xu Xiangqian, Guan Feng, Qi Benyu 戚本禹, Xie Fuzhi, Xiao Hua, Yang Chengwu and Ye Qun 叶群, and Zhang Chunqiao and Yao Wenyuan when in Peking; Chen Yun, Zhu De and Nie Rongzhen not to be told); [[w.dikotter-cultural-revolution]], 135–136 n.18 (Mao, irritated with the Group, calls it politically inexperienced and arrogant, Chen Boda an "opportunist," and tells Jiang Qing she has great aspirations but not an ounce of talent: "You don''t report to me, you block me out!"); [[w.liu-jixian-ye-jianying-nianpu]], II, 958–959 (Feb. 10, 1967; Ye Jianying 叶剑英 at the enlarged Standing Committee Mao calls; Mao: the enlarged Standing Committee to be widened, Chen Yi 陈毅, Tan Zhenlin 谭震林, Li Xiannian 李先念, Xu Xiangqian 徐向前, Guan Feng 关锋, Qi Benyu 戚本禹, Xie Fuzhi 谢富治, Xiao Hua 萧华, Yang Chengwu 杨成武 and Ye Qun 叶群 added, Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元 when in Peking; Chen Yun 陈云, Zhu De 朱德 and Nie Rongzhen 聂荣臻 not to be told). Made public: 1993. Check: the day: Yang (I, 387) prints the meeting "12月10日", after Jiang Qing''s denunciation of Tao Zhu of Jan. 4, 1967, and before the Huairen Hall meeting of Feb. 11. To check: [[w.chen-boda-zuihou-koushu]], 326 (cited by [[w.macfarquhar-maos-last-revolution]], 188 n.36); [[w.li-xianchang-lishi]], 29–30 (cited by [[w.macfarquhar-maos-last-revolution]], 189 n.38); [[w.xuan-wenhua-dageming-jianshi]], 148 (cited by [[w.macfarquhar-maos-last-revolution]], 191 n.46a); [[w.li-wang-li-fansi-lu]], II, 974 (cited by [[w.macfarquhar-maos-last-revolution]], 191 n.46b); Interview 访问 with Wang Li 王力, Aug. 12, 1983 (record 谈话记录) (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.27); [[w.yanchi-tao-zhu-zai-wenhua]], 207–211, 214–216, 224–226, 229–234 (cited by [[w.teiwes-tragedy-of-lin-biao]], 71 n.29a); [[w.ye-yonglie-chen-boda]], 348–349, 366 (cited by [[w.teiwes-tragedy-of-lin-biao]], 71 n.29b); *Dangshi ziliao tongxun*, no. 10 (dated "1978" in the note; the bibliography lists no. 10 of 1987, Tan Zhongji''s article), on Mao''s complaint to Lin Biao in early February 1967, 5 (cited by [[w.teiwes-tragedy-of-lin-biao]], 78 n.42); [[w.xianzhi-mao-zedong-zhuan-1949]], 1480–1481 (cited by [[w.dikotter-cultural-revolution]], 136 n.18a); [[w.pu-weihua-zalan-jiu-shijie]], 447–448 (cited by [[w.dikotter-cultural-revolution]], 136 n.18b). Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Li Fuchun, Ye Jianying, Jiang Qing, Wang Li, Tao Zhu, Chen Yi, Tan Zhenlin, Xu Xiangqian, Li Xiannian, Xie Fuzhi, Guan Feng, Qi Benyu, Ye Qun, Zhang Chunqiao, Yao Wenyuan, Chen Yun, Zhu De, Xiao Hua, Yang Chengwu.'
- edit:
    id: cal.1967-02.china-leadership-8
    base: 15d970c2
    settles:
    - 'Check: the hour: Yang (I, 399) has the Military Commission leader''s call to Zhao Yongfu about 8 p.m. (晚八時許), after the General Staff''s call of 2 p.m. ([[cal.1967-02-23.china-leadership-5]]); MacFarquhar (180) has the congratulations immediately after the shooting.'
    set:
      n: '[[w.macfarquhar-maos-last-revolution]], 180 n.64; [[w.yang-jisheng-tiandi-fanfu]], I, 399 (about 8 p.m. a leader of the Military Commission rings Zhao Yongfu: "well fought, a very handsome battle," "the Military Commission backs you"; wipe out the counter-revolutionaries left; Zhao tells others it was Vice-Chairman Lin; it was Ye Jianying, as the *Ye Jianying nianpu*''s entry of Feb. 23, 1967 bears out); [[w.dikotter-cultural-revolution]], 135 n.17 (the deputy commander telegraphs his report to Ye Jianying, who compliments him; Lin Biao and Mao do not intervene); [[w.liu-jixian-ye-jianying-nianpu]], II, 961 (Feb. 23, 1967; Ye Jianying 叶剑英, by telephone, hears Zhao Yongfu 赵永夫, deputy commander of the Qinghai Military District 青海省军区, on the handling of the rebels who stormed the *Qinghai ribao* 青海日报, and approves what the troops did). Made public: 1988. Check: the hour: Yang (I, 399) has the Military Commission leader''s call to Zhao Yongfu about 8 p.m. (晚八時許), after the General Staff''s call of 2 p.m. ([[cal.1967-02-23.china-leadership-5]]); MacFarquhar (180 n.64) has the congratulations immediately after the shooting. To check: [[w.nianyi-da-dongluande-niandai]], 204 (cited by [[w.macfarquhar-maos-last-revolution]], 180 n.64b); Xian Henghan 冼恒漢, *Fengyu bashi zai* 《風雨八十載》 (electronic ed.) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 399 n.29); *Ye Jianying nianpu* 《葉劍英年譜》, Feb. 23, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 399 n.t1); Ding Shu, "L''Événement du 23 février au Qinghai," in Song Yongyi, *Les Massacres de la Révolution Culturelle* (2009), 67–88 (cited by [[w.dikotter-cultural-revolution]], 135 n.17a); Liu Guokai, *A Brief Analysis of the Cultural Revolution* (1987), 61 (cited by [[w.dikotter-cultural-revolution]], 135 n.17b). See [[cal.1967-02-23.china-leadership-4]].'
      src:
        c: 2deb1aa3
        rows:
        - 'w.macfarquhar-maos-last-revolution 180 n.64: 1'
        - 'w.yang-jisheng-tiandi-fanfu I, 399: ?'
        - 'via w.yang-jisheng-tiandi-fanfu I, 399 n.29: ?'
        - 'via w.yang-jisheng-tiandi-fanfu I, 399 n.t1: ?'
        - 'w.dikotter-cultural-revolution 135 n.17: ?'
        - 'via w.dikotter-cultural-revolution 135 n.17a: ?'
        - 'via w.dikotter-cultural-revolution 135 n.17b: ?'
        - 'w.liu-jixian-ye-jianying-nianpu II, 961: ?'
      time: 1967-02-23T12:00Z
      time_approx: true
      time_zone: Asia/Shanghai
      place: xining
