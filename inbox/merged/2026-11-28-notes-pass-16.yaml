      when: Apr. 10
      date: '1967-04-10'
      place: washington
      thread: railroads
      also:
      - congress
      follows:
      - cal.1967-04-10.railroads-2
      c: 'Johnson meets Democratic and Republican members of the House Interstate and Foreign Commerce and Senate Labor and Public Welfare committees. Edward Kennedy suggests he bring the union leaders to the White House, "publicly ask [them not to strike] and be turned down publicly." Johnson declines: "The President should not have to see each labor leader in the country."'
      n: '[[w.califano-triumph-and-tragedy-of]], 190. The order: after [[cal.1967-04-10.railroads-2]], [[w.califano-triumph-and-tragedy-of]], 190 ("LBJ then faced"). See [[cal.1967-01-28.railroads]]. Names: Johnson, Edward Kennedy.'
