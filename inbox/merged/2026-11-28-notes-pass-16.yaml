- add-words:
    id: cal.1967-01-07.elections-1968
    after: end
    words: 'Present, by White: Finch, Flanigan, Milbank, LaRue, O''Donnell, Safire and Evans. Nixon''s odds: Romney even money, himself and Percy two to one, Reagan four to one, Rockefeller none. A delegate count, 603, already drawn up. A Nixon for President Committee to be headed by Gaylord Parkinson. Nixon on Romney: "I want him to get the exposure ... we have to keep him out at the point."'
