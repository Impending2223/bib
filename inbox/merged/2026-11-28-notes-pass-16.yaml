      when: Apr. 10
      date: '1967-04-10'
      place: washington
      thread: railroads
      also:
      - congress
      c: 'The White House, morning. Johnson sets out the alternatives in the shopcraft dispute to the bipartisan leadership. Republican senators remind him of his promise of 1966 to recommend legislation for emergency strikes. Hickenlooper: "We must face up to the arrogance of labor!" Johnson: "If I had a solution, I would submit it." Ford: "Why wasn''t the crisis foreseen?"'
      n: '[[w.califano-triumph-and-tragedy-of]], 189–90. The words: "The following morning" (189), after the advisers'' meeting of the day before. See [[cal.1967-01-28.railroads]]. Names: Johnson, Hickenlooper, Ford.'
      tags:
