      n: '[[w.report-of-the-national]], [56–69](https://archive.org/details/reportofnation00unit/page/n84/mode/1up) (Bantam ed.). [[w.califano-triumph-and-tragedy-of]], 209 (the arrest of a cab driver, the rumor, the rioting; Hughes: "criminal insurrection"); [[w.branch-at-canaans-edge]], 630–31 (John Smith; 1,200 jailed, six hundred hurt, twenty-three dead); [[w.bernstein-guns-or-butter]], 418 (26 dead, 1,500 injured); [[w.zelizer-fierce-urgency-of-now]], 273 (the cab driver arrested; the residents of the project across the street); [[w.graham-uncertain-triumph]], 162 (Newark, July 12–17); [[w.white-making-of-the-president-1969]], 202 (July 12: a Negro taxi driver arrested and dragged to a police station; a crowd; a Molotov cocktail; the next night, Thursday, July 13, looting on a larger scale; not the precinct or the traffic stop). To check: [[w.hayden-rebellion-in-newark]]; [[w.mumford-newark]]; [[w.tuttle-how-newark-became-newark]]; [[w.mclaughlin-long-hot-summer-of]]; Kerner, *Report* (n.d.), 60–62 (cited by [[w.branch-at-canaans-edge]], 630); [*New York Times*, July 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/07/13/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 630); Kerner, *Report* (n.d.), 56–59 (cited by [[w.branch-at-canaans-edge]], 630); "Newark''s Mayor Calls in Guard as Riots Spread," [*New York Times*, July 14, 1967](https://timesmachine.nytimes.com/timesmachine/1967/07/14/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 630); [*New York Times*, July 15, 1967](https://timesmachine.nytimes.com/timesmachine/1967/07/15/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 630); [*New York Times*, July 19, 1967](https://timesmachine.nytimes.com/timesmachine/1967/07/19/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 630); Kerner, *Report* (n.d.), 66–69 (cited by [[w.branch-at-canaans-edge]], 630). The time is the first day''s, shortly after 9:30 p.m. ([[w.branch-at-canaans-edge]], 630).'
