        when: Feb. 16
        date: '1967-02-16'
        thread: vietnam-congress
        also: [war-opposition]
        c: 'Stennis in the Senate on the march of Women Strike for Peace on the Pentagon the day before: the demonstrators "badly misguided and uninformed"; the march "plays into the hands of and provides tremendous propaganda ammunition for our enemies." The war to be fought to win.'
        n: '[113 Cong. Rec. 3665](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt3/pdf/GPO-CRECB-1967-pt3-5-2.pdf#page=38) (Senate, Feb. 16, 1967). [[w.gibbons-u-s-government-and]], IV, 554. To check: *New York Times*, Feb. 16, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 554 n.93, for the march). Names: Stennis.'
        tags: [name:stennis-john-c]
        src:
          c: 1218097e
          rows:
