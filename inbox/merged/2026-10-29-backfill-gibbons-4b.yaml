        when: Oct. 12
        date: '1967-10-12'
        thread: vietnam-congress
        also: [republican-party-congress]
        c: 'Brooke, for the President''s policy after his trip in the spring, for reconsidering the bombing: he hopes for a halt; "If the President has any valid reasons as to why there should not be a cessation of bombing, I think he should make those reasons crystal clear to the American people." No more troops "until South Vietnam has made a total commitment."'
        n: '[[w.gibbons-u-s-government-and]], IV, 840. To check: *New York Times*, Oct. 13, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 840 n.127). Check: the day, by the *Times* of Oct. 13. Names: Brooke.'
