  - add:
      entry:
        id: cal.1967-08-10.vietnam-congress-2
        when: Aug. 10
        date: '1967-08-10'
        thread: vietnam-congress
        also: [republican-party-congress]
        c: 'Findley in the House: H. Res. 869, twenty-one Republicans with him, for hearings by the Foreign Affairs Committee on whether the Tonkin Gulf resolution "empowers the President to carry forward military operations of the current scope and magnitude in Southeast Asia," whether it needs changing, and whether "alternative legislative action is necessary."'
        n: '[113 Cong. Rec. 22281–82](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt17/pdf/GPO-CRECB-1967-pt17-1-2.pdf#page=51) (House, Aug. 10, 1967). [[w.gibbons-u-s-government-and]], IV, 803. Check: Gibbons counts twenty-four Republicans with him (IV, 803 n.13). Names: Findley.'
        tags: [name:findley-paul]
        src:
          c: bd7571b1
          rows:
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt17/pdf/GPO-CRECB-1967-pt17-1-2.pdf#page=51: all'
            - 'w.gibbons-u-s-government-and IV, 803: all'
            - 'via w.gibbons-u-s-government-and IV, 803 n.13: all'
  - add:
      entry:
        id: cal.1967-10-04.republican-party
        when: Oct. 4
        date: '1967-10-04'
        thread: republican-party
        also: [vietnam-congress]
        c: 'Hatfield puts in the Record the Ripon Society''s "The Realities of Vietnam: An Alternative for Republicans," from the *Ripon Forum* of September: less bombing of the North; American forces to defend the areas loyal to Saigon; a "confederal strategy," local autonomy by stages, the Viet Cong''s areas last. Hatfield: an alternative to "a course of action that the President, for too long, has told us has no alternative."'
        n: 'Hatfield, [113 Cong. Rec. 27916–33](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-1-2.pdf#page=88) (Senate, Oct. 4, 1967). [[w.gibbons-u-s-government-and]], IV, 834 n.111 (the plan). Check: Gibbons has Case put it in the Record, and the *Forum* publish it Oct. 3. Names: Hatfield.'
        tags: [name:hatfield-mark-o]
        src:
          c: 3d642233
          rows:
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-1-2.pdf#page=88: all'
            - 'w.gibbons-u-s-government-and IV, 834: A-C'
            - 'via w.gibbons-u-s-government-and IV, 834 n.111: all'
  - add:
      entry:
        id: cal.1967-10-06.vietnam-congress
        when: Oct. 6
        date: '1967-10-06'
        thread: vietnam-congress
        c: 'Symington in the Senate, answering Reston''s column of the morning: his proposal of a few days before, that as of a set date the United States offer to stop all air and sea action in North and South Vietnam, Saigon to offer to negotiate with anybody and amnesty to the Viet Cong, "in no way" a threat. Every military man and civilian he talked with in Vietnam thinks a halt would mean more American casualties.'
        n: '[113 Cong. Rec. 28090–91](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-3-1.pdf#page=7) (Senate, Oct. 6, 1967). [[w.gibbons-u-s-government-and]], IV, 831 (the proposal). Check: Gibbons dates the proposal Oct. 3 and cites these pages; the proposal itself not found in the Record. Names: Symington, Reston.'
        tags: [name:symington-william-s, name:reston-james]
        src:
          c: 7fdc3667
          rows:
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-3-1.pdf#page=7: all'
            - 'w.gibbons-u-s-government-and IV, 831: A'
            - 'via w.gibbons-u-s-government-and IV, 831 n.98: all'
  - add:
      entry:
        id: cal.1967-10-09.vietnam-congress-2
        when: Oct. 9
        date: '1967-10-09'
        thread: vietnam-congress
        also: [republican-party-congress]
        c: 'Hugh Scott in the Senate: no member''s view the Republican Party''s, and the party not united on Vietnam; "it is imperative that we not undermine the stature of the President as Commander in Chief and as the Nation''s chief diplomat." His position unchanged, the nine points of May with Javits and Percy; "disapproval of present action" no ground for attacks on the President. Kuchel and Tower praise it; Case and Percy question him.'
        n: '[113 Cong. Rec. 28203 ff.](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-4-2.pdf#page=1) (Senate, Oct. 9, 1967). [[w.gibbons-u-s-government-and]], IV, 833–34. Names: Scott, Javits, Percy, Kuchel, Tower, Case.'
