        date: '1967-03-03'
        thread: vietnam-congress
        also: [robert-kennedy]
        c: 'Smathers in the Senate on Robert Kennedy''s speech of Mar. 2: "well delivered, temperate, and, to some degree, constructive," but with no new word from Hanoi it holds out no reasonable expectation of results. Five pauses in the bombing brought no response; in the Tet truce Hanoi hurried in more men and supplies.'
        n: '[113 Cong. Rec. 5327](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-7-1.pdf#page=22) (Senate, Mar. 3, 1967). [[w.gibbons-u-s-government-and]], IV, 592 n.100 (the day and the page). Check: Gibbons has Smathers answer Javits; he answers "the junior Senator from New York." See [[cal.1967-03-02.robert-kennedy]]. Names: Smathers, Robert Kennedy.'
