        date: '1967-04-05'
        thread: vietnam-congress
        also: [king]
        c: 'Bingham, in the Record, on King''s speech of Apr. 4: "a tragic mistake," harmful to civil rights and to a negotiated peace; if all Negroes refused to serve they would be "stepping out of the mainstream of American life." After Hanoi''s rejection of U Thant''s proposals, it "can only be interpreted by Hanoi as approval of its intransigent stand."'
        n: 'Bingham, extension of remarks, [113 Cong. Rec. 8497](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt7/pdf/GPO-CRECB-1967-pt7-1-3.pdf#page=2) (Apr. 5, 1967). [[w.gibbons-u-s-government-and]], IV, 693–94 n.61. See [[cal.1967-04-04.king]]. Names: Bingham, Martin Luther King, U Thant.'
