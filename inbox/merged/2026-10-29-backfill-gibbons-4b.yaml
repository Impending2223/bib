            - 'via w.gibbons-u-s-government-and IV, 680 n.25b: all'
  - add:
      entry:
        id: cal.1967-05-24.vietnam-congress
        when: May 24
        date: '1967-05-24'
        thread: vietnam-congress
        c: 'Mansfield in the Senate, "The Security Council Should Debate Vietnam": North Vietnam, South Vietnam, the National Liberation Front and China may be invited though not members, under Article 32 of the Charter and the Council''s rule 39, as Communist China was in November 1950.'
        n: '[113 Cong. Rec. 13728](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-8-1.pdf#page=44) (Senate, May 24, 1967). [[w.gibbons-u-s-government-and]], IV, 680. See [[cal.1967-05-18.vietnam-congress-2]]. Names: Mansfield.'
