        when: Mar. 31
        date: '1967-03-31'
        thread: vietnam-congress
        c: 'Clark at the opening of the Americans for Democratic Action''s convention in Washington: on Apr. 15 the United States to stop the bombing of the North, halt offensive operations in the South and bring the South Vietnamese to do the same; U Thant, the Geneva co-chairmen and the Control Commission then to persuade Hanoi and the Viet Cong to stop fighting.'
        n: 'The *Washington Post*, Apr. 2, 1967, as Byrd put it in the Record, [113 Cong. Rec. 8024](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-6-1.pdf#page=22) (Senate, Apr. 3, 1967). [[w.gibbons-u-s-government-and]], IV, 677 n.16. Check: Gibbons dates the proposal Apr. 1; the *Post*, from the United Nations on Apr. 1, "yesterday." Names: Clark, U Thant.'
        tags: [name:clark-joseph-s, name:u-thant]
