  - add:
      entry:
        id: cal.1967-02-17.vietnam-congress
        when: Feb. 17
        date: '1967-02-17'
        thread: vietnam-congress
        also: [republican-party-congress]
        c: 'Tower''s report to Russell on his trip to Vietnam, excerpts in the Record: "We are winning, but we can win much more rapidly by an intensification of military pressure." Every major military target to be bombed, steel mills and power plants among them; Haiphong closed; no more truces until the North shows it will keep them. He had spoken of it with Johnson the evening before.'
        n: '[113 Cong. Rec. 3815](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt3/pdf/GPO-CRECB-1967-pt3-6-1.pdf#page=76) (Senate, Feb. 17, 1967). [[w.gibbons-u-s-government-and]], IV, 550 (the report). Names: Tower, Russell, Johnson.'
        tags: [name:tower-john-g, name:russell-richard-b, name:johnson-lyndon-b]
        src:
          c: 56fa9477
          rows:
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt3/pdf/GPO-CRECB-1967-pt3-6-1.pdf#page=76: all'
            - 'w.gibbons-u-s-government-and IV, 550: A-C'
            - 'via w.gibbons-u-s-government-and IV, 550 n.77: all'
  - add:
      entry:
        id: cal.1967-02-28.vietnam-congress
        when: Feb. 28
        date: '1967-02-28'
        thread: vietnam-congress
        also: [democratic-party]
        c: 'Eleven House Democrats, Brown, Burton, Conyers, Dow, Edwards, Fraser, Helstoski, Kastenmeier, Rees, Rosenthal and Ryan, against the war''s supplemental authorization and appropriation: the strategy of escalation has brought the war "no closer to settlement." Four initiatives: stop the bombing of the North "immediately and without preconditions"; free elections in the South, the National Liberation Front to take whatever part they give it; four-party talks for a cease-fire; an international conference to guarantee the settlement.'
        n: 'Fraser, Mar. 1, [113 Cong. Rec. 5103](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-5-3.pdf#page=4) (Extensions; the statement issued "yesterday"). [[w.gibbons-u-s-government-and]], IV, 598–99 n.122. Check: Gibbons has it issued "at the beginning of the debate on the bill" (the House''s, Mar. 2). See [[cal.1967-02-28.vietnam-supplemental]]. Names: George E. Brown Jr., Burton, Conyers, Dow, Edwards, Fraser, Helstoski, Kastenmeier, Rees, Rosenthal, Ryan.'
        tags: [name:brown-george-e-jr, name:burton-phillip, name:conyers-john-jr, name:dow-john-g, name:edwards-william-d, name:fraser-donald-m, name:helstoski-henry, name:kastenmeier-robert-w, name:rees-thomas-m, name:rosenthal-benjamin-s, name:ryan-william-f]
        src:
