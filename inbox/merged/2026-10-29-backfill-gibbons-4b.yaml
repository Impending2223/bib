  - add:
      entry:
        id: cal.1967-05-18.vietnam-congress-2
        when: May 18
        date: '1967-05-18'
        thread: vietnam-congress
        c: 'Mansfield in the Senate: the Security Council to take up the American resolution of January 1966, of which it is seized; to take it up a procedural motion, not open to a veto; all the parties then to be invited.'
        n: '[113 Cong. Rec. 13213–14](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-4-2.pdf#page=33) (Senate, May 18, 1967). [[w.gibbons-u-s-government-and]], IV, 680. See [[cal.1967-05-15.vietnam-congress]]. Names: Mansfield.'
