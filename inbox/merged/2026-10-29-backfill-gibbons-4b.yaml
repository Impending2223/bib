        date: '1967-03-01'
        thread: vietnam-congress
        also: [democratic-party]
        c: 'Ten other House Democrats, Addabbo, Bingham, Brasco, Cohelan, Farbstein, Gilbert, Ottinger, Scheuer, Tenzer and Yates, by Bingham in the House: they have made like proposals before, and agree with "the substance of these proposals."'
