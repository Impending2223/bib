        when: Oct. 12
        date: '1967-10-12'
        thread: vietnam-congress
        c: 'McGovern to Johnson: stop the bombing of the North, most of its military targets destroyed, its costs above its benefits; ask Moscow to "secure a pullback" of Hanoi''s divisions; clear and hold in place of search and destroy; the South Vietnamese to carry more of the fighting and explore talks with the National Liberation Front.'
        n: '[[w.gibbons-u-s-government-and]], IV, 848 n.150. Made public: [[w.gibbons-u-s-government-and]], IV (1995). To check: McGovern to Johnson, Oct. 12, 1967, McGovern Papers, Seeley G. Mudd Library, Princeton University (cited by [[w.gibbons-u-s-government-and]], IV, 848 n.150). Names: McGovern, Johnson.'
