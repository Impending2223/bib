  - add:
      entry:
        id: cal.1967-01-11.vietnam-congress
        when: Jan. 11
        date: '1967-01-11'
        thread: vietnam-congress
        c: 'The Foreign Relations Committee''s first meeting of the Congress, in executive session. Fulbright: hearings on "The Responsibilities of the U.S. as a World Power," to guard against "an accusation that he was starting another vendetta against the administration." Of the Tonkin Gulf resolution: "I am quite willing to say I was shortsighted. I had no idea that we were going to go this way."'
        n: 'Daily Digest, [113 Cong. Rec. D6](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=4) (the committee "in executive session to discuss several pending business items"). [[w.gibbons-u-s-government-and]], IV, 580. Made public: [[w.gibbons-u-s-government-and]], IV (1995). To check: the committee''s executive session transcript, Jan. 11, 1967 (cited by [[w.gibbons-u-s-government-and]], IV, 580 n.59). Names: Fulbright.'
        tags: [name:fulbright-j-william]
        src:
          c: ea7f0a0c
          rows:
            - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=4: A'
            - 'w.gibbons-u-s-government-and IV, 580: all'
            - 'via w.gibbons-u-s-government-and IV, 580 n.59: all'
  - add:
