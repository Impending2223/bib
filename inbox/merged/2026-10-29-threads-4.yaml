patch: threads-4
by: Claude (thread statements, stage 6, agent 4)
ops:
- edit:
    id: cal.thread.civil-disorders
    base: bcd563b7
    set:
      c: Riots in the cities, and the inquiries and bills that followed. Nashville; Tampa, Cincinnati, Atlanta, Buffalo; Newark and Plainfield; Cramer's anti-riot bill through the House; Detroit, the Guard and the paratroopers; H. Rap Brown at Cambridge; the address of July 27 and the Kerner Commission; Milwaukee; the Kerner report; Washington, Chicago and Baltimore after King's death; the Violence Commission; Glenville; Liberty City; the Walker report.
- edit:
    id: cal.thread.civil-rights-organizations
    base: 76bf7991
    set:
      c: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. *Bates*; SNCC founded at Raleigh; Farmer to CORE; Highlander; the Taconic meeting; Greenberg and Young; the Albany Movement; COFO revived; the Voter Education Project.'
      c2: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Lewis SNCC''s chairman; the Council for United Civil Rights Leadership; the leaders at the White House; the Freedom Vote; Freedom Day at Hattiesburg; Klunder killed at Cleveland; the Freedom Democratic Party; the moratorium; the compromise refused; Waveland; CORE at Durham; the Charlotte bombings; McKissick; SNCC against the war.'
      c3: 'The organizations of the movement as organizations: the NAACP and its Legal Defense Fund, the Urban League, CORE, SCLC, SNCC, COFO, the Freedom Democrats, and their councils; their leaders, foundings, splits and statements. Dahmer killed; Carmichael SNCC''s chairman; the White House conference; Meredith shot; CORE and "black power"; Wilkins against it; SNCC votes the whites out; the NAACP on Riverside; Brown for Carmichael; the four leaders on the riots; SCLC at Atlanta; Howard''s administration building held.'
- edit:
    id: cal.thread.confirmations
    base: c9a834c2
    set:
      c2: Nominations the Senate divided on by roll call. The satellite incorporators; Collins to the Community Relations Service; Coleman to the Fifth Circuit; Morrissey's nomination recommitted.
- edit:
    id: cal.thread.desegregation-schools
    base: 467d09b7
    set:
      c: Schools and universities desegregated under federal court orders, and the resistance to them; the boycotts, suits and State laws against segregated schools in the North and West. Georgia's school committee; Houston; New Orleans and Louisiana's acts; the University of Georgia; Georgia's open schools; Atlanta's high schools; Dallas; Perez excommunicated; Meredith at Oxford. Gallup on school integration.
      c2: Schools and universities desegregated under federal court orders, and the resistance to them; the boycotts, suits and State laws against segregated schools in the North and West. Gantt at Clemson; *Goss*; the schoolhouse door; Boston's Stay Out for Freedom; Alabama's schools in September; Prince Edward's Free Schools; the Chicago, New York, Cleveland and Milwaukee boycotts; Klunder killed; *Griffin*; *Lee v. Macon*; Sumter and St. Helena; the Racial Imbalance Act; Girard College; Chicago's grants deferred. Gallup on school integration.
      c3: Schools and universities desegregated under federal court orders, and the resistance to them; the boycotts, suits and State laws against segregated schools in the North and West. The Seattle boycott; Boston's State aid withheld; Oklahoma's separate schools repealed; Alabama's act against the guidelines; Grenada; Intermediate School 201; the guidelines in the House; Lurleen Wallace against the statewide order; the Racial Imbalance Act upheld; the track system struck in Washington; the East Los Angeles walkouts; *Green*; the busing provisos; Florida's separate-schools clause dropped. Gallup on school integration.
- edit:
    id: cal.thread.elections-1963
    base: 989e3ec4
    set:
      c: 'The off-year elections of 1963: the mayors and the governors. Boutwell over Connor in Birmingham; Daley over Adamowski; Bradley to the Los Angeles council; McKeldin in Baltimore; Breathitt over Chandler; Paul Johnson over Coleman; the Freedom Vote; Nov. 5: Breathitt and Paul Johnson governors, Tate, Shelley, Collins mayors; McKeithen in Louisiana.'
- edit:
    id: cal.thread.elections-1976
    base: 62e2e228
    set:
      c: 'The 1976 nominations: the primaries, Feb. 24 to June 8 (CQ''s returns), and the conventions; the rest of the year not yet written. Ford and Carter in New Hampshire; Jackson in Massachusetts; Carter over Wallace in Florida; Reagan in North Carolina; Carter over Udall in Wisconsin; Church and Brown in May; California, New Jersey and Ohio, June 8; New York, July 12; Kansas City, Aug. 16.'
- edit:
    id: cal.thread.europe-and-the-alliance
    base: bfb6f214
    set:
      c: 'Britain, Germany, France, Turkey and Greece, and the alliance: its forces and its nuclear arms. Macmillan at Camp David; de Gaulle''s visit; the Turkish coup; Herter''s NATO force; the Jupiters for Turkey; the Acheson directive; the Ottawa pledge; the Jupiters kept; Menderes hanged; Bermuda; Athens; the Declaration of Interdependence; the Jupiters to go; Skybolt cancelled; Nassau.'
      c2: 'Britain, Germany, France, Turkey and Greece, and the alliance: its forces and its nuclear arms. De Gaulle''s veto; the Élysée treaty; the MLF; the last Jupiters out; the Bundestag''s preamble; Kennedy in Europe; Erhard at the Ranch; France recognizes Peking; Wilson''s victory; the sterling crisis; the Atlantic Nuclear Force; Churchill''s funeral; de Gaulle on gold; McNamara''s select committee; Rhodesia.'
      c3: 'Britain, Germany, France, Turkey and Greece, and the alliance: its forces and its nuclear arms. Palomares; France out of NATO''s commands; Erhard''s offset and the Mansfield resolution; "peaceful engagement"; NATO to Brussels; Kiesinger; the trilateral talks; Adenauer''s funeral; the colonels in Athens; sterling devalued; the Harmel report; Constantine''s countercoup; Britain out of the Far East and the Gulf; the May strikes in France; Czechoslovakia invaded; the franc and the mark.'
- edit:
    id: cal.thread.foreign-aid
    base: fa1af520
    set:
      c: The aid program remade, and cut. The Mutual Security Act of 1960; Hardy refused the Peru records; Food for Peace given a director; the March message; AID created, long-term borrowing denied; the 1962 act and the Hickenlooper amendment; wheat for the UAR.
      c2: The aid program remade, and cut. The Clay report; the House's cut; the Gruening amendment; the Christmas Eve vote; the IDA bill; the Foreign Assistance Act of 1964; Food for Peace extended; the UAR sales ban; the Foreign Assistance Act of 1965.
      c3: The aid program remade, and cut. Food for Freedom proposed; the Asian Development Bank; food for India; the Foreign Assistance Act of 1966; the Food for Peace Act; the 1967 message; the Punta del Este pledge; the Foreign Assistance Act of 1967; the appropriation recommitted, then passed; "To Build the Peace"; the population committee; the Foreign Assistance Act of 1968, the request cut by almost $1 billion.
- edit:
    id: cal.thread.freedom-rides
    base: 2f27c7a2
    set:
      c: CORE's rides to test *Boynton*, May 1961, and the ICC order that came of them. The riders leave Washington; Anniston; Robert Kennedy to Greyhound; Montgomery and the First Baptist Church; Jackson and Parchman; the arrangement with Barnett; the petition to the ICC; Gallup on the marshals; the order, in force Nov. 1.
- edit:
    id: cal.thread.king
    base: f4a56efc
    set:
      c: Martin Luther King, Jr. The President, the Attorney General, the Bureau. The perjury indictment; "Heed Their Rising Voices"; the acquittal; Kennedy and King meet; Rich's and Reidsville; Montgomery's church besieged; the Second Emancipation Proclamation asked; Albany; Levison and the wiretap; the FBI's investigation opened.
      c2: Martin Luther King, Jr. The President, the Attorney General, the Bureau. Birmingham and the jail letter; the settlement; the leaders at the White House; O'Dell let go; the March; the wiretaps; *Sullivan*; St. Augustine; the Nobel Prize; Hoover's "most notorious liar"; King and Hoover meet; the FBI's tape; Selma and the march to Montgomery; Boston; Watts; Goldberg and the war.
      c3: 'Martin Luther King, Jr. The President, the Attorney General, the Bureau. Chicago: Lawndale, Soldier Field, the marches, the summit agreement. At Ribicoff''s hearings; against the war at Beverly Hills, Chicago and Riverside Church; *Walker*, five days in the Birmingham jail; "Where Do We Go From Here?"; before the Kerner Commission; the Poor People''s Campaign; the Memphis strike; Mason Temple; King killed; the riots; the funeral; Ray arrested; Resurrection City.'
- edit:
    id: cal.thread.oil
    base: 9836444e
    set:
      c: Oil imports, the import program, and the world's oil. Esso's cut and OPEC at Baghdad; Nixon at Centralia; the ceiling on demand; the East Coast's residual oil; Libya's first exports; the petroleum study ordered; Iraq's Law 80; OPEC at Geneva; the study's report; Kennedy to Udall; the ceiling on production; the world's output, year by year.
- edit:
    id: cal.thread.robert-kennedy
    base: f03050f4
    set:
      c: 'Robert F. Kennedy: his brother''s campaign manager, Attorney General, Senator from New York, candidate for the nomination. West Virginia; Johnson''s suite at Los Angeles; named Attorney General; the Cuba Study Group; the back channel through Bolshakov; the Freedom Rides; the organized-crime bills; Mongoose; around the world, Tokyo, Djakarta, Berlin; the steel price rise; the Levison wiretap; Oxford; the missile crisis; Hoffa''s Test Fleet trial; the prisoners ransomed.'
      c2: 'Robert F. Kennedy: his brother''s campaign manager, Attorney General, Senator from New York, candidate for the nomination. *Gray v. Sanders* argued; Birmingham; Baldwin; the King wiretaps; Valachi and organized crime; the Vietnam meetings; Nov. 22; Walton''s message through Bolshakov; Indonesia; Hoffa convicted; the vice presidency refused him; Senator from New York over Keating; a bombing pause urged; on nonproliferation; South America.'
      c3: 'Robert F. Kennedy: his brother''s campaign manager, Attorney General, Senator from New York, candidate for the nomination. Bedford-Stuyvesant; on the NLF; Delano; in South Africa; the Paris signal; against the bombing, Mar. 2; the hunger hearings at Jackson; no race "under any foreseeable circumstances"; the commission offer refused; the announcement, Mar. 16; Kennedy and Johnson at the White House; Indianapolis, Apr. 4; Indiana, Nebraska, Oregon; the debate with McCarthy; California, and the shooting at the Ambassador; the funeral.'
- edit:
    id: cal.thread.state-constitutions
    base: dd502811
    set:
      c: 'The States'' constitutions: conventions, revisions and amendments; the referenda and initiatives. Alabama''s amendment elections; Mississippi''s right-to-work amendment; Oklahoma''s initiatives refused; Mississippi''s "good moral character" amendment; Kentucky refuses a convention; Michigan''s convention called, elected, opened, adjourned; New York City''s charter; Illinois''s Judicial Article; the apportionment initiatives in Washington, Oregon, Colorado and California; Proposition 24.'
      c2: 'The States'' constitutions: conventions, revisions and amendments; the referenda and initiatives. Florida''s apportionment act; Michigan''s new constitution; Berkeley''s fair housing ordinance repealed; taxes refused in Nevada, North Dakota and Oregon; Cambridge''s charter amendment; the poll tax kept in Texas; Iowa''s Shaff plan; public accommodations at referendum in Kansas City and Maryland; Detroit''s and Akron''s housing measures; the poll tax repealed in Arkansas; Oregon''s death penalty abolished; Connecticut''s convention and constitution; Mississippi''s amendments; Wallace''s succession amendment blocked; New York''s convention called.'
      c3: 'The States'' constitutions: conventions, revisions and amendments; the referenda and initiatives. The Free Television Act struck; Oklahoma''s separate schools repealed; Maryland''s convention called; New York''s civilian review board abolished; Proposition 1-A; the poll tax repealed in Texas and Nevada; New Jersey''s apportionment article; Kentucky''s new constitution refused; conventions in New York, Maryland and Pennsylvania; New York''s and Maryland''s constitutions refused; Proposition P at San Francisco; Pennsylvania''s proposals approved; Florida''s new constitution; Illinois''s convention called; Maryland''s open-housing act refused; Virginia''s revision commission.'
- edit:
    id: cal.thread.transportation
    base: 50c065e9
    set:
      c2: Transportation and its safety. The mass transit bill; the freight-rate bill; Washington's subway; the supersonic transport; the subway bill recommitted; traffic deaths; BART's ground-breaking; the Urban Mass Transportation Act; the 1964 highway act; the Ribicoff hearings; the National Capital Transportation Act; high-speed rail; Nader.
      c3: Transportation and its safety. The department proposed; GM's detectives; the Panhandle freeway refused; uniform time; the auto and highway safety acts; the department created; Boyd the first Secretary; highway funds impounded; the SST's prototypes; New York's transportation bonds; Forward Thrust; mass transit to the department; the 1968 highway act.
- edit:
    id: cal.thread.vietnam-air-war
    base: f0d98085
    set:
      c: 'The bombing of North Vietnam, its targets and restrictions: the Chiefs'' programs, the estimates of its effects, the strikes. Westmoreland''s first B-52 request; the study of Hanoi''s hardening; the Chiefs'' program of November; the Chiefs "at a boiling point"; the Chiefs against the stand-down.'
      c3: 'The bombing of North Vietnam, its targets and restrictions: the Chiefs'' programs, the estimates of its effects, the strikes. SNIE 10-1-66; the mining of Haiphong weighed; the oil strikes, argued and approved; the JASON study; the ban round Hanoi; the Haiphong power plants; Kép and Hòa Lạc; the cutback of May 22; the *Turkestan* and the *Mikhail Frunze*; McNamara''s memorandum against the Chiefs'' program; the Stennis hearings; the Long Biên bridge; Phúc Yên; the Stennis report; the target list at the news conference.'
- edit:
    id: cal.thread.vietnam-operations
    base: 58be5b36
    set:
      c: 'The fighting in South Vietnam, its battles and large operations, each dated by the record of the field: the start, the main day, the end. Bình Giã; Ba Gia; Đồng Xoài; Starlite; Plei Me; Ia Drang, X-Ray and Albany; Harvest Moon; Crimp.'
      c3: 'The fighting in South Vietnam, its battles and large operations, each dated by the record of the field: the start, the main day, the end. Masher; A Shau; Hastings; Attleboro; Cedar Falls; Junction City, its battles and its end; the hill fights at Khe Sanh; Buffalo; Côn Thiên; Swift; Ông Thành; Lộc Ninh; Đắk Tô and Hill 875; Quyết Thắng and Toàn Thắng; Delaware; the fight north of Đông Hà; Khâm Đức; the August offensive; Meade River.'
