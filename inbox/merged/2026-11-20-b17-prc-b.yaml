      c: 'Ayub Khan''s visit to the Soviet Union, as Bhutto tells Zhou on Apr. 20. Ayub asks that the Sino-Soviet differences be narrowed; the Soviet side: a matter between the parties, the treaty in force. If the United States attacked China, the Soviet side says, it would carry out the treaty. On Apr. 7, on the way to Tashkent, Polyansky reads them Johnson''s speech of that day and finds good parts in it.'
