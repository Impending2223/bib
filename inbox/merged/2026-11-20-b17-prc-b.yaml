- primary:
    id: cal.1965-03-30.china-leadership
    text: >-
      "[Cable from the Chinese Delegation in Algeria to the Foreign Ministry, 'Main Points of Conversation with Ben Bella '](https://digitalarchive.umd.edu/document/165404)" (Mar. 30, 1965), PRC FMA 203-00651-03, 99–101, trans. Stephen Mercado, Wilson Center Digital Archive (Foreign Ministry telegram received, extra urgent, from the Algeria desk, incoming (65) Mao No. 60; the delegation's cable is dated Mar. 31, with authority to issue Apr. 1, and reports the conversation of the afternoon of Mar. 30. Ben Bella on Africa since the second non-aligned conference: American escalation in the Congo, Algeria's 12,000 to 13,000 arms sent through Sudan, Algeria's need of Soviet and Chinese aid, a new accord with France to replace Evian, due in May, and the Asian-African Conference still set for June 29. It says Zhou spoke on Southeast Asia, explained the Vietnam issue, exposed the "peace talks" plot and set out China's position on the United Nations).
    units: B
- primary:
    id: cal.1965-04-20.china-leadership
    text: >-
      "[Minutes of Conversation between Premier Zhou and Bhutto](https://digitalarchive.umd.edu/document/165417)" (Apr. 20, 1965), PRC FMA 203-00653-01, 6–11, trans. Stephen Mercado, Wilson Center Digital Archive (secret document 374, the Premier not having reviewed it; 2 p.m., the Chinese ambassador's villa at Bogor, with Chen Yi, Zhang Wenjin and Ambassador Yao; Ji Chaozhu interpreting and recording. Bhutto gives his account of Ayub Khan's visit to the Soviet Union: the Soviet side on the Sino-Soviet treaty, Soviet arms for India, Kashmir, the Vietnam war; he proposes Pakistan send only an observer to the next SEATO ministerial meeting, and Zhou advises against withdrawing now. Zhou says the Soviet aid to Vietnam has been little, old and slow, and that the United States has not decided to fight China. Printed and distributed May 7, 1965, in 73 copies; the Foreign Ministry's General Office received it May 6).
    units: A
- primary:
    id: cal.1961-04-24.china-leadership
    text: >-
      "[Transcript of Talks during Chairman Mao's reception of Prince Souvanna Phouma and Prince Souphanouvong](https://digitalarchive.umd.edu/document/120883)" (Apr. 24, 1961), PRC FMA 204-01438-01, 24–29, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive (secret, not reviewed; the Hangzhou Hotel, with Zhou and Chen Yi speaking; the record gives no hour and does not say when Zhou brought the princes, A and B; Souvanna says they asked Zhou to arrange the visit. Souvanna says he and his brother will give statements after the co-chairs' appeal and watch Vientiane's answer; Mao calls the statement very good, says the enemy wants peace only because of the nine months' offensive and will break agreements, and advises keeping guard, moving the capital to the Plain of Jars and weighing the elections).
    units: A, B, D, E, F, G
