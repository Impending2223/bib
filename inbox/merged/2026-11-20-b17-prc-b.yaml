      id: cal.1961-03-25.laos
      when: Mar. 25
      date: '1961-03-25'
      time_range:
      - 1961-03-24T23:00Z
      - 1961-03-25T05:00Z
      time_band: morning
      time_zone: Asia/Bangkok
      place: hanoi
      thread: laos
      also:
      - vietnam-hanoi
      - china
      - soviet-union
      c: 'He Wei, Hanoi, to the Foreign Ministry: that morning at the Foreign Ministry Nguyễn Chí Thanh told him and the Soviet ambassador that the war in Laos "develops quite well". Sala Phou Khoun taken, central Laos freed and Savannakhet threatened, but no attack yet on Luang Prabang or Vientiane, he says. A political campaign is to go with the offensive; he asks China and the Soviet Union for their views and for what they know of American policy.'
      n: '"[Cable from He Wei, ''Comrade Nguyễn Chí Thanh Talked about the Situation in Laos with Me and the Soviet Ambassador''](https://digitalarchive.umd.edu/document/120594)" (Mar. 25, 1961), PRC FMA 109-03034-05, trans. Qingfei Yin, Wilson Center Digital Archive. Headed "From DRV Station", expedient emergency, C 1113; the cable gives no hour for the meeting and names neither the Soviet ambassador nor the Foreign Ministry''s city. Names: Nguyễn Chí Thanh. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:drv
      - polity:ussr
      - name:nguyen-chi-thanh
      - vis:only:prc+drv+ussr
      - vis:frame:prc
- add:
    entry:
      id: cal.1961-05-05.laos
      when: May 5
      date: '1961-05-05'
      thread: laos
      also:
      - soviet-union
      - china
      c: Pushkin, Soviet deputy foreign minister, tells Liu Xiao, the Chinese ambassador, how Moscow means to go into the Geneva conference on Laos. Peking, Hanoi and Warsaw agree, he says, on using it to build up the Lao people's strength; the Lao government, army and elections are not its business, neutrality and the Control Commission's limits are. Moscow will press for seating the Patriotic Front and for Britain as co-chair; Sihanouk's refusal to attend is "childish" and will not delay it.
      n: '"[Record of Conversation between Soviet Union Deputy of Foreign Affairs Pushkin and Ambassador Liu Xiao](https://digitalarchive.umd.edu/document/120885)" (May 5, 1961), PRC FMA 109-03755-02, 112–119, obtained by Yiming Feng, trans. Jake Tompkins, Wilson Center Digital Archive. Ministry of Foreign Affairs document, top secret, No. 329; the record gives the time as 11:00 a.m. and gives no place. Pushkin adds that the Control Commission had met and would leave for Laos next day if its instructions were settled that day; of the British ambassador he says he "came to speak with me" "this afternoon", so the translation reads, of a talk the record puts at 11:00 a.m. The record names no city: Liu Xiao was ambassador at Moscow, but no place is set. Names: Pushkin. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:pushkin-georgiyi-maksimovich
      - vis:only:prc+ussr
      - ok:fields-place
- add:
