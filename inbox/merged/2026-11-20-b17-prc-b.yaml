- primary:
    id: cal.1961-08-13.china-leadership-5
    text: >-
      "[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou's account on Aug. 21 of the talk on the 13th: he and Liu Shaoqi asked Hồ whether he had taken the mediation between Albania and Moscow on his own initiative, and he said he had, with the CPSU's assent; they told him his intent was good, his method needed examination and mediation would be very hard. Phạm Văn Đồng arriving in the morning and Hồ in the afternoon, the day not given; the record gives no hour or place for the talk).
    units: A
- primary:
    id: cal.1965-02-10.china-leadership-5
    text: >-
      "[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 87, the Premier and Chen not having reviewed it; 3:20 p.m., on the way from the airport to the Diaoyutai State Guest House, Yan Mingfu interpreting. Kosygin says the Soviet Union will give Vietnam ground-to-air missiles, artillery and tanks free, with officers to instruct, cancel its loan interest, about fifty million new rubles, and give six fishing vessels; Zhou offers Chinese railways to carry them; both are for joint action and for keeping war from breaking out; they set talks on state relations for 9 a.m. next day. Part 2, Chen Yi with Andropov, is only a title in the file).
    units: A
- primary:
    id: cal.1965-03-31.china-leadership
    text: >-
      "[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 284, the Premier not having reviewed it; "Morning, 31 March 1965", Villa Joly, the Algerian Presidential Palace. Ben Bella explains why Algeria passed U Thant's proposal to China and gives his views on a cease-fire in Vietnam and on Africa; Zhou sets out four phases of possible American escalation in Vietnam and China's preparations, and says China would bear a war alone and not ask the Soviet Union to send troops; he says Kosygin, home from Vietnam, proposed talks with the United States, and speaks on the Soviet aid list, the Second Asian-African Conference and the United Nations: outside it China may criticize it, the criticism aimed at the United States, and it opposes the two great powers' control and France's five-power proposal).
    units: A, B, C, D, E
