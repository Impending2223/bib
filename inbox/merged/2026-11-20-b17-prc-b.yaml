    text: >-
      "[Record of Conversation between Premier Zhou and Premier Sabry](https://digitalarchive.umd.edu/document/165427)" (June 19, 1965), PRC FMA 107-01081-05, trans. Stephen Mercado, Wilson Center Digital Archive (Foreign Ministry file, secret document 618, received July 14, 1965, the Premier not having reviewed it; 9 to 10 p.m. at Sabry's residence, Cairo, with Zhang Hanfu, Qiao Guanhua and Chen Jiakang; the entry's time is the talk's. Zhou has the Council of the Revolution's statement at dinner just before; Sabry reports Bouteflika's word that Ben Bella is held and will be tried; Zhou ends that he may stay a few days longer, giving no reason. The record also has Sabry on Algerian oil and Egypt's food, and Zhou on Vietnam, Taylor and Johnson, and on rumors about Mao that he says Moscow's agency spread).
