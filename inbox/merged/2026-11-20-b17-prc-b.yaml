- edit:
    id: cal.1965-02-05.china-leadership
    base: 3fc3167f
    set:
      when: Feb. 5
      follows:
      - cal.1965-02-05.china-leadership-2
      c: 'Zhou''s first talk with Kosygin, chairman of the Soviet Council of Ministers, passing through Peking to Vietnam, on the road from the airport to the Diaoyutai guesthouse. Kosygin asks to call on Mao and Liu Shaoqi; he and Zhou are for joint action on Vietnam, Zhou saying the Americans must withdraw under the Geneva accords of 1954; Kosygin says the CPSU has a new attitude to the meeting of Mar. 1, and Zhou says to start again from scratch. Of the four talks of Feb. 5–6, by the Nianpu: both sides hold that Sino-Soviet relations should develop. Zhou''s six proposals: for the fifteenth anniversary of the Sino-Soviet treaty, to print each other''s messages and speeches in the papers, showing one attitude; develop trade, long-term cooperation on some items; finish earlier projects left unfinished; carry out the yearly cultural plan better; China to send students and take Soviet ones in turn; carry out the travel agreement. Kosygin agrees to all six.'
      n: '"[Record of the First Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin](https://digitalarchive.umd.edu/document/165488)" (Feb. 6, 1965 by the Archive; Feb. 5 by the record), PRC FMA 109-03957-04, 1–21, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 75, the Premier and Chen not having reviewed it; Part One, the first contact, on the way from the airport to the Diaoyutai State Guest House, Yan Mingfu interpreting; at the hotel, in notes written from memory, Kosygin says China seems to favor the Wilson government, which Zhou calls a Western rumor. Parts Two and Three, Chen Yi with Andropov and the other comrades, are in the record''s content summary only). [[w.zhou-enlai-waijiao-huodong]], 435 (Feb. 5–6, 1965; the four talks: the first on the road from the airport to the Diaoyutai guesthouse; the second at the banquet that evening; the third from 9 p.m. to 1:55 a.m. the next day; the fourth, Feb. 6, 9 a.m., on the road from the guesthouse to the airport); [[w.lengxi-shinian-lunzhan-1956-1966]], 913 (Kosygin flew from Moscow Feb. 5, two days in Peking, Zhou''s talks with him; to Vietnam Feb. 7, Wu says); [[w.zhou-enlai-nianpu-1949]], II, 706 (Feb. 5–6, 1965; the talks together: both sides for developing relations, the six proposals, Kosygin''s assent; it does not say in which talk). Made public: 1993. After the welcome at the airport, [[cal.1965-02-05.china-leadership-2]]: the record''s "on the way from the airport". No time set: the record''s heading gives 3 p.m., but its text has lunch "later" and the talks with Guevara "this afternoon", and the Waijiao has Kosygin at the airport at noon. Names: Zhou Enlai, Kosygin, Mao Zedong, Liu Shaoqi. Check: the hour. Check: in which talk Zhou made the six proposals.'
      src:
        c: bf3d2608
        rows:
        - 'https://digitalarchive.umd.edu/document/165488: A-D'
        - 'w.zhou-enlai-waijiao-huodong 435: A'
        - 'w.lengxi-shinian-lunzhan-1956-1966 913: A'
        - 'w.zhou-enlai-nianpu-1949 II, 706: E-L'
      tags:
      - name:zhou-enlai
      - name:kosygin-aleksei
      - name:mao-zedong
      - name:liu-shaoqi
      - polity:prc
      - polity:ussr
