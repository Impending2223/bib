- primary:
    id: cal.1964-05-05.china-leadership
    text: >-
      "[Cable from the Chinese Foreign Ministry, 'Premier Zhou Talked about the Relationship between China-Soviet Difference and the National Liberation Movement'](https://digitalarchive.umd.edu/document/121188)" (June 29, 1964), PRC FMA 109-02372-02, 9–12, trans. David Cowhig, Wilson Center Digital Archive (Diplomatic Circular 80: Zhou received a Kenyan government delegation "last month" and spoke on the Sino-Soviet dispute and the liberation movements; the day not given; see the circular's entry of June 29).
    units: A, B
- primary:
    id: cal.1965-06-15.china-leadership
    text: >-
      "[Record of Conversation between Premier Zhou and Premier Sabry](https://digitalarchive.umd.edu/document/165427)" (June 19, 1965), PRC FMA 107-01081-05, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Sabri, June 19: "Several days ago I saw him in Hangzhou," of Mao; not the day or the conference).
    units: A
- primary:
    id: cal.1961-08-03.soviet-union
    text: >-
      "[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Ung Văn Khiêm, Aug. 21: at the Moscow meeting of the Warsaw Pact's first secretaries Albania sent a Politburo member and was put out as not qualified, China, attending as an observer, protesting; the Soviet side had wished to expel the Albanian party, with the six other European members and Mongolia; not the days, Berlin or the speeches).
    units: B
- primary:
    id: cal.1965-02-07.vietnam
    text: >-
      "[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Kosygin, Feb. 10: on the 8th South Vietnamese planes crossed the line with Johnson's assent, the White House announcing it; Nguyễn Cao Kỳ flew one himself from Đà Nẵng and was lightly wounded, hit in four places; Peking knew of it only on the night of the 9th; Chấp Lễ not named).
    units: G
- primary:
    id: cal.1965-02-08.vietnam-force-levels
    text: >-
      "[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Kosygin, Feb. 10: the United States "transported Hawk ground-to-air rockets to Da Nang on the 8th"; Kosygin says Moscow had cabled him of it; the shipment, not Johnson's order).
    units: A
- primary:
    id: cal.1965-02-10.china-leadership-3
    text: >-
      "[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou to Kosygin, 3:20 p.m.: at "our mass meeting this morning" Liu Ningyi spoke of the United States letting the South Vietnamese army invade the North for the first time, giving the DRV the right to strike back; not the number or the leaders present).
    units: A
