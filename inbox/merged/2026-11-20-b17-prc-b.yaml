      id: cal.1965-03-03.china
      when: Mar. 3
      date: '1965-03-03'
      place: moscow
      thread: china
      also:
      - soviet-union
      - vietnam-hanoi
      c: 'The Chinese embassy in the Soviet Union to the Foreign Ministry: Vietnamese students of Moscow University tell Chinese students they will demonstrate again the next day against the American bombing of Vietnam, with or without Soviet consent, and ask Chinese and other students to join. They plan to send a message to the embassies, deliver it to the Soviet Foreign Ministry and the British embassy, march to the American embassy, then to the Vietnamese embassy to hear the ambassador. The embassy asks for instructions.'
      n: '"[Cable from the Chinese Embassy in the Soviet Union to the Ministry of Foreign Affairs, ''Chinese Students Intending to Participate in the Demonstrations Organized by the Vietnamese Students''](https://digitalarchive.umd.edu/document/119953)" (Mar. 3, 1965), PRC FMA 109-03984-02, 1–2, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive. Extra urgent, from the Moscow desk. The cable gives the students'' gathering as 3:00 p.m. the next day. Two handwritten notes on it agree to the actions discussed by telephone, one citing a call at 12:40 on Mar. 4. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - polity:drv
      - vis:only:prc
- add:
    entry:
      id: cal.1965-03-04.china-2
      when: Mar. 4
      date: '1965-03-04'
      time: 1965-03-04T12:30Z
      time_zone: Europe/Moscow
      place: moscow
      thread: china
      also:
      - soviet-union
      - vietnam-hanoi
      - vietnam
      c: 'Moscow, the American embassy, 3:30 p.m. Students of many countries at Moscow University, Chinese and Vietnamese among them, protest against the United States. The Chinese embassy reports to the Foreign Ministry by telephone: Soviet soldiers, mounted police, fire trucks and hoses ringed the embassy, and the police beat and arrested students; early count, one Chinese arrested, one badly hurt, one lightly, and four Vietnamese held, by the Vietnamese students'' account.'
      n: '"[Record of an Important Phone Call, ''The Soviet Police have Captured and Wounded Chinese and Vietnamese Students who were Protesting against the United States''](https://digitalarchive.umd.edu/document/119954)" (Mar. 4, 1965), PRC FMA 109-03984-02, 3–4, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive. The Ministry''s record of the call is logged at 11:30 p.m., Mar. 4, the receiver "Office Staff", the caller the embassy; it does not name the clock (Peking''s, by its sense: 6:30 p.m. at Moscow, the protesters "currently" still at the American embassy, the embassy''s cable of Mar. 5, 1:30 a.m., dating the whole incident 4 to 6 p.m.). The 3:30 p.m. is the embassy''s, of a Moscow act. It names the Chinese students Li Youfu, arrested, and Huang Zhaogeng, badly hurt. See [[cal.1965-03-04.china-3]]. Check: whether [[cal.1965-03-03.soviet-union]] is this demonstration. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1965-03-05.china-3
      when: Mar. 5
      date: '1965-03-05'
      time: 1965-03-05T10:00Z
      time_zone: Asia/Shanghai
      place: peking
      thread: china
      also:
      - soviet-union
      c: 'The Foreign Ministry''s Division of Soviet and East European Affairs to the Chinese embassy in the Soviet Union, extra urgent: find out for that evening''s Xinhua report how many students were hurt, Chinese and others, and how many gravely; which countries took part, and whether any came from the Soviet Union or Eastern Europe; and whether the Cuban ambassador or a stand-in spoke before the Vietnamese embassy. Estimates are wanted by 1:00 a.m.'
      n: '"[Cable from the Division of Soviet and East European Affairs to the Chinese Embassy in the Soviet Union](https://digitalarchive.umd.edu/document/119957)" (Mar. 5, 1965), PRC FMA 109-03984-02, 7–8, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive. Sent Mar. 5 at 6:00 p.m., logged at 6:10 p.m., security restricted to staff on duty. See [[cal.1965-03-04.china-2]]. Check: the cable does not say whose clock; taken as Peking''s. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc
- add:
    entry:
      id: cal.1965-03-05.china-4
      when: Mar. 5
      date: '1965-03-05'
      time: 1965-03-04T22:30Z
      time_zone: Europe/Moscow
      place: moscow
      thread: china
      also:
      - soviet-union
      - vietnam-hanoi
      c: 'The Chinese embassy in the Soviet Union to the Foreign Ministry, 1:30 a.m.: the Soviets arrested eight students at the American embassy demonstration, four of them Vietnamese and one Chinese, and freed them within two hours when the protesters demanded it; twelve Chinese students were hurt, seven needing hospital care. It has expressed its displeasure to the Soviet Foreign Ministry''s Far Eastern department through its attaché, Zhang Motang, and calls the police acts "barbaric". It proposes exposing at home the use of armed police against a student rally, and asks for instructions.'
      n: '"[Cable from the Chinese Embassy in the Soviet Union to the Ministry of Foreign Affairs, ''Soviet Suppression of Student Demonstrations''](https://digitalarchive.umd.edu/document/119958)" (Mar. 5, 1965), PRC FMA 109-03984-02, 9–10, obtained by You Lan, trans. Jake Tompkins, Wilson Center Digital Archive. Extremely urgent, from the Moscow desk, received (65) No. 225, with a handwritten note asking the Soviet and East European desk to act at once. It dates the whole incident 4 to 6 p.m. and names the injured Huang Zhaogeng, Lu Jiqing and Xu Zeguang; speakers at the Vietnamese embassy included the Vietnamese and Cuban ambassadors and, for China, Zhang Dequn. See [[cal.1965-03-04.china-2]]. Check: the cable does not say whose clock; taken as Moscow''s. Check: the arrests, eight in its sentence, seven in its list. Check: whether the protest through the attaché is the note of [[cal.1965-03-05.china-2]]. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - polity:drv
      - vis:only:prc
- add:
    entry:
      id: cal.1965-05-25.china
      when: May 25
      date: '1965-05-25'
      thread: china
      also:
      - soviet-union
      - testing
      c: 'The military attaché of the Chinese embassy in the Soviet Union to the Foreign Ministry and the General Staff''s Intelligence Department: reactions to China''s second test. Of Soviet officers and students, some praise it and some object to its cost; a political-instructor colonel tells Hungarian students the Soviet Union objects. Cuban and Polish students praise it; German and Mongolian students object, the Mongolian calling it a breach of the Partial Test Ban Treaty.'
      n: '"[Cable from the Military Attache of the Chinese Embassy in the Soviet Union, ''Reactions to China''s Second Nuclear Explosion''](https://digitalarchive.umd.edu/document/134747)" (May 25, 1965), PRC FMA 109-03637-03, 18–19, trans. Caixia Lu, Wilson Center Digital Archive. Urgent, from the Soviet desk, incoming (65) Chen (1354). Dated by its own date line, 25 May 1965; the Archive dates it May 15. The cable names no city. See [[cal.1965-05-14.china]]. Check: the date, May 25 (the cable) or May 15 (the Archive). Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-22.china-leadership-5
      when: Jan. 22
      date: '1960-01-22'
      time: 1960-01-22T09:00Z
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      also:
      - laos
      - soviet-union
      c: 'Chervonenko to Chen Yi, Wucheng Hall, Zhongnanhai, 5 p.m., a notice Moscow asked him to give: by secret Soviet materials the Western representatives in Vientiane, the United States first, are pressing Laos''s government and army to unite with the anti-communists behind one list of candidates and to change the electoral law before the elections; the Vietnamese are told too. Chen Yi: China and Vietnam will not send troops across the border; the Lao must rely on themselves; a missile base in Laos is unlikely. He will relay the news to Zhou at once.'
      n: '"[Transcript of Vice Premier Chen Yi''s Meeting with Soviet Ambassador S.V. Chervonenko](https://digitalarchive.umd.edu/document/120867)" (Jan. 22, 1960), PRC FMA 109-00934-01, 1–3, obtained by Feng Yiming, trans. Marian Rosenberg, Wilson Center Digital Archive. Top secret, for the highest levels only; the record gives the time as 5:00 p.m. and the place as Wucheng Hall, Zhongnanhai; present, Counselor Saffron for the Soviet side, Zhang Wentian, Yu Zhan and Ma Lie for China, Yan Mingfu interpreting. Chervonenko says he heard a presentation on China''s economy "this morning"; Chen Yi recalls Antonov''s warning of the Laos coup three days before it. Names: Chervonenko, Chen Yi, Zhou Enlai. Check: whether this and [[cal.1960-01-22.china-leadership-2]] (the Nianpu: Chervonenko to Chen Yi on the Sino-Indian dispute) were one sitting; the Nianpu gives no hour, the transcript no word on India. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
