patch: 2026-11-20-b17-prc-b
by: 'Claude (batch 17, reader 2: the PRC Foreign Ministry files, the rest, and the two Mao Zedong sixiang wansui excerpts), Nov. 20, 2026'
ops:
- add:
    entry:
      id: cal.1961-02-08.china-leadership-5
      when: Feb. 8
      date: '1961-02-08'
      time: 1961-02-08T08:00Z
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      also:
      - laos
      - soviet-union
      - vietnam-hanoi
      c: 'Chen Yi to Chervonenko on Laos, 4 p.m.: the reply China gave Hoàng Văn Hoan on Feb. 6. Hope lies in the front line, not in the conference, which cannot be refused; the Lao should mass their forces and destroy the enemy''s effective strength. He objects to Vietnamese troops sent to the Plain of Jars and Sam Neua: they should stay off the front and the war inside Laos.'
      n: '"[Transcript of Vice Premier Cheny Yi and Soviet Ambassador S.V. Chervonenko discussing the Laos Issue](https://digitalarchive.umd.edu/document/120874)" (Feb. 8, 1961), PRC FMA 109-03754-03, 72–82, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive. The record gives the time as 4:00 p.m. and the place as the State Council Foreign Affairs Office Reception Hall. Chen Yi''s figures, as he gives them: the Lao Patriotic Front 6,000 men and Kong Le 1,100, with 3,000 to 4,000 guerrillas, 11,100 in all; Phoumi and Boun Oum 48,000 in 31 battalions, 5,000 in 13 of them at the Plain of Jars; China has sent Hanoi arms for 10,000. He says the Vietnamese Politburo had told China it opposed sending troops to Laos, and that Zhang Hanfu gave Sudarikov China''s reply on Feb. 6. To check: Zhang Hanfu''s papers to Sudarikov of Feb. 6, 1961, and the two memoranda Chervonenko gave Chen Yi before Feb. 8 (named in the transcript). See [[cal.1961-02-06.china-leadership-8]]. Names: Chen Yi, Chervonenko. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:chen-yi
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
