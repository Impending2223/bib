      id: cal.1961-02-06.china-leadership-8
      when: Feb. 6
      date: '1961-02-06'
      thread: china-leadership
      also:
      - laos
      - vietnam-hanoi
      c: 'Chen Yi gives Hoàng Văn Hoan, of the Vietnamese Politburo, recuperating in China, the Central Committee''s reply to Hồ Chí Minh''s questions on Laos, as Chen Yi tells Chervonenko on Feb. 8: the Lao to put their hope in victory at the front, not in the conference, and to mass their forces; China against the Vietnamese troops sent to the Plain of Jars and Sam Neua; arms for 10,000 already sent to Hanoi, their carriage to the front for the Vietnamese army. Hoàng Văn Hoan agrees, by Chen Yi''s account, and will take it to Hồ.'
      n: '"[Transcript of Vice Premier Cheny Yi and Soviet Ambassador S.V. Chervonenko discussing the Laos Issue](https://digitalarchive.umd.edu/document/120874)" (Feb. 8, 1961), PRC FMA 109-03754-03, 72–82, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive (Chen Yi''s account: "the day before yesterday"; Hoàng Văn Hoan left "yesterday" and has reached Hanoi). The record gives no place or hour. Names: Chen Yi, Hồ Chí Minh. Check: the year the Archive posted the document.'
      tags:
