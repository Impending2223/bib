    text: >-
      "[Summary of Premier Zhou's Conversation with President Nasser](https://digitalarchive.umd.edu/document/165425)" (June 25, 1965), PRC FMA 107-01081-07, 110–111, trans. Stephen Mercado, Wilson Center Digital Archive (Foreign Ministry file, secret document 622, the Premier not having reviewed it; a meal "on the afternoon of 25 June" at Nasser's Alexandria apartment, recorded by Ji Chaozhu. Nasser reports the UAR foreign minister's count for and against holding the Asian-African Conference on schedule; Zhou advises against a new date if it is put off, and they agree Algiers stays the site; Nasser has Sukarno's word he will be in Cairo on the 26th; Zhou gives the two Vietnamese parties' terms for peace).
    units: A
