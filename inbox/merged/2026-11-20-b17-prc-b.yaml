      c: 'Zhang Hanfu gives Sudarikov China''s reply on Laos in writing, after the two Soviet memoranda Chervonenko had given Chen Yi, as Chen Yi and Chervonenko speak of it on Feb. 8: the two governments of one view.'
      n: '"[Transcript of Vice Premier Cheny Yi and Soviet Ambassador S.V. Chervonenko discussing the Laos Issue](https://digitalarchive.umd.edu/document/120874)" (Feb. 8, 1961), PRC FMA 109-03754-03, 72–82, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive (Chen Yi: on "the sixth" Zhang Hanfu "gave our response" to Sudarikov; Chervonenko: "the documents given to us by Comrade Zhang Hanfu on February 6th"). The record gives no place, hour or titles. Check: the year the Archive posted the document.'
