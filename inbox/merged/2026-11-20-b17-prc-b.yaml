      id: cal.1961-08-13.soviet-union
      when: Aug. 13
      date: '1961-08-13'
      thread: soviet-union
      also:
      - vietnam-hanoi
      c: 'The Albanian Party of Labor''s Central Committee cables the Vietnam Workers'' Party: it agrees to Hồ Chí Minh''s mediation with Moscow and will invite him to Tirana after mid-November, as Zhou tells Ung Văn Khiêm on Aug. 21, from what the Albanians had told China.'
      n: '"[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou''s account: the telegram "was sent on the 13th"; "according to what the Albanian Party has made known to us"). Names: Hồ Chí Minh, Zhou Enlai, Ung Văn Khiêm. Check: the year the Archive posted the document.'
      tags:
