# cal.1961-08-19.berlin-and-vienna: Fursenko and Naftali, 384
- add-words:
    id: cal.1961-08-19.berlin-and-vienna
    after: end
    words: 'The convoy is sixteen hundred troops.'
    item: '[[w.fursenko-khrushchevs-cold-war]], 384'
# cal.1962-05-06.laos: Fursenko and Naftali, 431-32; Lich su, III, 133
- add-words:
    id: cal.1962-05-06.laos
    after: end
    words: 'Phoumi had put six thousand men in a basin; once the Vietnamese and Pathet Lao force surrounds it, he and his generals flee, and American advisers rate the garrison''s effectiveness "nil." The retreat is "far outdistancing any pursuit."'
    item: '[[w.fursenko-khrushchevs-cold-war]], 431–32'
- add-words:
    id: cal.1962-05-06.laos
    after: end
    words: 'The Vietnamese official history has the Lao–Vietnamese force on May 8 taking Muong Sing and Nam Tha after a month''s attack, putting 16,000 of the other side out of action, and adding 800 square kilometers with 76,000 people to the liberated zone.'
    item: '[[w.lich-su-khang-chien-chong-my]], III, 133'
# cal.1961-08-19.berlin-and-vienna: Bernstein, 10; Robert Kennedy in His Own Words, 276
- add-words:
    id: cal.1961-08-19.berlin-and-vienna
    after: end
    words: 'Johnson speaks to a crowd of at least 380,000, pledging American support for the city.'
    item: '[[w.bernstein-guns-or-butter]], 10'
- add-words:
    id: cal.1961-08-19.berlin-and-vienna
    after: end
    words: 'Robert Kennedy recalls that the troops got through on a Saturday or a Sunday, the President very relieved.'
    item: '[[w.robert-kennedy-in-his]], 276'
- names:
    id: cal.1961-08-19.berlin-and-vienna
    add:
    - Robert Kennedy
    tags:
    - name:kennedy-robert-f
# cal.1961-08-29.laos: FRUS XXIV, doc. 172; McNamara, In Retrospect, ch. 2
- add-words:
    id: cal.1961-08-29.laos
    after: end
    words: 'U. Alexis Johnson: an expanded SEATO Plan 5 would go by stages, beginning with a cease-fire along the May 3 line, and would not start without assurances of help from Asian allies. Taylor: the 30,000-odd troop estimate is the initial cost, not the final bill. Rusk: 40,000 troops in Laos would almost all have to be supplied by the United States.'
    text: '[FRUS 1961–63, XXIV, doc. 172](https://history.state.gov/historicaldocuments/frus1961-63v24/d172)'
- add-words:
    id: cal.1961-08-29.laos
    after: end
    words: 'By McNamara''s memoir, Rusk''s plan is some 30,000 combat troops from the treaty''s signatories, and McNamara argues that with six divisions, about 90,000 men, going to Europe, war in Southeast Asia too is inconceivable short of total mobilization.'
    item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.10'
- names:
    id: cal.1961-08-29.laos
    add:
    - U. Alexis Johnson
    - Taylor
    tags:
    - name:johnson-u-alexis
    - name:taylor-maxwell
