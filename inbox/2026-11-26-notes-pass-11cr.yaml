# cal.1961-05-24.freedom-rides: Schlesinger, Robert Kennedy and His Times, 299
- add-words:
    id: cal.1961-05-24.freedom-rides
    after: end
    words: 'Kennedy later: Senator Eastland gave his word there would be no violence, and said the riders would be arrested as soon as they reached Jackson; Kennedy concurred. Farmer: "If we got any cooler we''d be in a deep freeze."'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 299'
- names:
    id: cal.1961-05-24.freedom-rides
    add:
    - Eastland
    - Farmer
    tags:
    - name:eastland-james-o
    - name:farmer-james
# cal.1961-12-05.africa: Schlesinger, RFK, 560
- add-words:
    id: cal.1961-12-05.africa
    after: end
    words: 'Robert Kennedy sits along the wall with the staff. Kennedy, by Schlesinger: "The Attorney General has not yet spoken but I can feel the cold wind of his disapproval on the back of my neck."'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 560'
# cal.1962-04-04.vietnam: Schlesinger, RFK, 709
- add-words:
    id: cal.1962-04-04.vietnam
    after: end
    words: 'By Schlesinger, Galbraith offers "phased withdrawal" as part of a larger deal with the Soviet Union, which might get Hanoi to call off the Viet Cong. Lemnitzer, the Chairman of the Joint Chiefs, denounces Galbraith for wishing the United States "to seek disengagement" from its commitment in Southeast Asia.'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 709'
- names:
    id: cal.1962-04-04.vietnam
    add:
    - Lemnitzer
    tags:
    - name:lemnitzer-lyman-l
# cal.1962-05-01.vietnam: Schlesinger, RFK, 709
- add-words:
    id: cal.1962-05-01.vietnam
    after: end
    words: 'Marguerite Higgins writes the Herald Tribune story.'
    item: '[[w.schlesinger-robert-kennedy-and-his]], 709'
- names:
    id: cal.1962-05-01.vietnam
    add:
    - Higgins
    tags:
    - name:higgins-marguerite
# cal.1961-04-20.cuba-bay-of-pigs: Wofford, 352; Schlesinger, Thousand Days, 337
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy asks, "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in." Kennedy: if the United States moves on Cuba, Khrushchev may move on Berlin.'
    item: '[[w.wofford-of-kennedys-and-kings]], 352'
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: Kennedy, by Nixon again: no move in Laos, 5,000 miles away, if none in Cuba, 90 miles away.
    item: '[[w.schlesinger-thousand-days-1965]], 337'
- names:
    id: cal.1961-04-20.cuba-bay-of-pigs
    add:
    - Khrushchev
    tags:
    - name:khrushchev-nikita-s
