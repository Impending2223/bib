- add-words:
    id: cal.1962-10-17.missile-crisis-2
    after: end
    words: 'Acheson answers that the Monroe Doctrine, the President''s word to Congress and the resolution of Oct. 3 gave warning, so a strike is no surprise attack.'
    item: '[[w.ball-past-has-another-pattern]], 291'
