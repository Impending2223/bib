# cal.1961-04-20.cuba-bay-of-pigs: Wofford, 352; Schlesinger, Thousand Days, 337
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy asks, "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in." Kennedy: if the United States moves on Cuba, Khrushchev may move on Berlin.'
    item: '[[w.wofford-of-kennedys-and-kings]], 352'
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy, by Nixon again: no move in Laos, 5,000 miles away, if none in Cuba, 90 miles away.'
    item: '[[w.schlesinger-thousand-days-1965]], 337'
- names:
    id: cal.1961-04-20.cuba-bay-of-pigs
    add:
    - Khrushchev
    tags:
    - name:khrushchev-nikita-s
# cal.1961-04-21.cuba-bay-of-pigs-3: Goodwin, Remembering America, 181
- add-words:
    id: cal.1961-04-21.cuba-bay-of-pigs-3
    after: end
    words: 'By Goodwin''s notes, Kennedy opens: the happiest people in government are those who "didn''t know anything about it." He will make a short opening statement and take no more questions on Cuba. He wants the blame kept from the CIA after James Reston''s story in the *New York Times* that the operation was not properly staffed and had no NSC meeting; the story to be leaked that the Joint Chiefs studied and approved it. He could fire Allen Dulles, but Dulles helps keep the Republicans off his back. If "we just sit tight for about three weeks, things will cool off."'
    item: '[[w.goodwin-remembering-america]], 181'
- names:
    id: cal.1961-04-21.cuba-bay-of-pigs-3
    add:
    - Reston
    - Dulles
    tags:
    - name:reston-james
    - name:dulles-allen-w
# cal.1961-08-17.latin-america: Goodwin, Remembering America, 196-202
- add-words:
    id: cal.1961-08-17.latin-america
    after: The Charter of Punta del Este signed.
    words: 'Guevara, who does not sign, calls the Alliance "an instrument of economic imperialism" doomed to failure; Dillon replies that the United States will never recognize the permanence of the Cuban regime.'
    item: '[[w.goodwin-remembering-america]], 196'
- add-words:
    id: cal.1961-08-17.latin-america
    after: end
    words: 'Goodwin tells him he has no authority to negotiate and will only listen and report. The talk lasts almost three hours, to about 6 a.m. Cuba would not attack Guantanamo and would discuss limiting the revolution''s activity "in other countries"; the United States would stop efforts to overthrow the Cuban government by force and lift the embargo. Guevara proposes starting with subordinate issues, such as the hijacking of airplanes to Cuba.'
    item: '[[w.goodwin-remembering-america]], 198–202'
- names:
    id: cal.1961-08-17.latin-america
    add:
    - Dillon
    tags:
    - name:dillon-c-douglas
# cal.1961-05.european-community: Ball, 209
- add-words:
    id: cal.1961-05.european-community
    after: end
    words: 'Ball recalls Macmillan telling Eisenhower in 1960 that, should France and Germany unite Western Europe, Britain "had no choice but to lead a peripheral alliance against them."'
    item: '[[w.ball-past-has-another-pattern]], 209'
- names:
    id: cal.1961-05.european-community
    add:
    - Macmillan
    - Eisenhower
    tags:
    - name:macmillan-harold
    - name:eisenhower-dwight-d
# cal.1962-10-17.missile-crisis-2: Thomas, 215; Ball, 291
- add-words:
    id: cal.1962-10-17.missile-crisis-2
    after: end
    words: 'Acheson, who joins the group, urges an immediate strike without warning. Robert Kennedy passes Sorensen a note: "I now know how Tojo felt when he was planning Pearl Harbor."'
    item: '[[w.thomas-robert-kennedy]], 215'
- add-words:
    id: cal.1962-10-17.missile-crisis-2
    after: end
    words: 'Acheson answers that the Monroe Doctrine, the President''s word to Congress and the resolution of Oct. 3 gave warning, so a strike is no surprise attack.'
    item: '[[w.ball-past-has-another-pattern]], 291'
- names:
    id: cal.1962-10-17.missile-crisis-2
    add:
    - Acheson
    - Sorensen
    tags:
    - name:acheson-dean-g
    - name:sorensen-theodore-c
# cal.1962-09-27.mississippi: Navasky, 209-17 (the Department's transcripts)
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 2:50 p.m. Kennedy proposes that the head marshal draw his gun and the rest keep their hands on their holsters, the state police to keep order. Barnett: "Isn''t it possible to have them all pull their guns?" Lieutenant Governor Johnson, on the line, says all must draw.'
    item: '[[w.navasky-kennedy-justice]], 209–10'
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 3:50 p.m. Barnett asks that it wait until Saturday; Johnson cannot rule out shooting; Kennedy: Meredith "won''t come." At 4:20 p.m. Barnett again promises no violence, the marshals due about five: "You understand we have had no agreement." Kennedy: "That''s correct."'
    item: '[[w.navasky-kennedy-justice]], 211–15'
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 5:35 p.m. Barnett will not guarantee order once Meredith is in; Kennedy says he had better call it off. At 6:35 p.m. Barnett, nervous, reports several thousand people in cars and trucks at Oxford; Kennedy: "I''ll send them back." Meredith''s party, seventy miles from Oxford, is turned around.'
    item: '[[w.navasky-kennedy-justice]], 209, 215–17'
- names:
    id: cal.1962-09-27.mississippi
    add:
    - Paul Johnson
    - Meredith
    tags:
    - name:johnson-paul-b-jr
    - name:meredith-james-h
# cal.1962-09-29.mississippi-ole-miss: Schlesinger, Journals, 168-71; Thomas, 198
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'In the President''s office Robert Kennedy, with O''Donnell and Burke Marshall present, bids him "Go get him Johnny boy." In the first call Kennedy tells Barnett he must carry out the law and wants his help; Barnett proposes that Tom Watkins come to Washington; Kennedy: the Court''s order gives Barnett until Tuesday.'
    item: '[[w.schlesinger-journals]], 168–69'
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'After it the President says Barnett thanked him for his help on the poultry problem: "You''ve been fighting a sofa pillow all week."'
    item: '[[w.schlesinger-journals]], 169'
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'In the second call Kennedy asks Barnett for positive assurances that he will keep order and prevent a mob; Barnett, by the President''s report: "Just tell ''em to cool off and you can sneak him in."'
    item: '[[w.schlesinger-journals]], 171'
- check:
    id: cal.1962-09-29.mississippi-ole-miss
    text: 'Check: Thomas, 198, has "soft pillow"; Schlesinger''s *Journals*, 169, "sofa pillow."'
- names:
    id: cal.1962-09-29.mississippi-ole-miss
    add:
    - Robert Kennedy
    - O'Donnell
    - Burke Marshall
    tags:
    - name:kennedy-robert-f
    - name:odonnell-kenneth-p
    - name:marshall-burke
