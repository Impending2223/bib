# cal.1961-04-20.cuba-bay-of-pigs: Wofford, 352; Schlesinger, Thousand Days, 337
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy asks, "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in." Kennedy: if the United States moves on Cuba, Khrushchev may move on Berlin.'
    item: '[[w.wofford-of-kennedys-and-kings]], 352'
- add-words:
    id: cal.1961-04-20.cuba-bay-of-pigs
    after: end
    words: 'Kennedy, by Nixon again: no move in Laos, 5,000 miles away, if none in Cuba, 90 miles away.'
    item: '[[w.schlesinger-thousand-days-1965]], 337'
- names:
    id: cal.1961-04-20.cuba-bay-of-pigs
    add:
    - Khrushchev
    tags:
