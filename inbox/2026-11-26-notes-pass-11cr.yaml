# cal.1962-09-27.mississippi: Navasky, 209-17 (the Department's transcripts)
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 2:50 p.m. Robert Kennedy proposes that the head marshal draw his gun and the rest keep their hands on their holsters, the state police to keep order. Barnett: "Isn''t it possible to have them all pull their guns?" Lieutenant Governor Johnson, on the line, says all must draw.'
    item: '[[w.navasky-kennedy-justice]], 209–10'
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 3:50 p.m. Barnett asks that it wait until Saturday; Johnson cannot rule out shooting; Robert Kennedy: Meredith "won''t come." At 4:20 p.m. Barnett again promises no violence, the marshals due about five: "You understand we have had no agreement." Robert Kennedy: "That''s correct."'
    item: '[[w.navasky-kennedy-justice]], 211–15'
- add-words:
    id: cal.1962-09-27.mississippi
    after: end
    words: 'At 5:35 p.m. Barnett will not guarantee order once Meredith is in; Robert Kennedy says he had better call it off. At 6:35 p.m. Barnett, nervous, reports several thousand people in cars and trucks at Oxford; Robert Kennedy: "I''ll send them back." Meredith''s party, seventy miles from Oxford, is turned around.'
    item: '[[w.navasky-kennedy-justice]], 209, 215–17'
- names:
    id: cal.1962-09-27.mississippi
    add:
    - Paul Johnson
    - Meredith
    tags:
    - name:johnson-paul-b-jr
    - name:meredith-james-h
# cal.1962-09-29.mississippi-ole-miss: Schlesinger, Journals, 168-71; Thomas, 198
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'In the President''s office Robert Kennedy, with O''Donnell and Burke Marshall present, bids the President "Go get him Johnny boy." In the first call the President tells Barnett he must carry out the law and wants his help; Barnett proposes that Tom Watkins come to Washington; the President: the Court''s order gives Barnett until Tuesday.'
    item: '[[w.schlesinger-journals]], 168–69'
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'After it the President says Barnett thanked him for his help on the poultry problem: "You''ve been fighting a sofa pillow all week."'
    item: '[[w.schlesinger-journals]], 169'
- add-words:
    id: cal.1962-09-29.mississippi-ole-miss
    after: end
    words: 'In the second call the President asks Barnett for positive assurances that he will keep order and prevent a mob; Barnett, by the President''s report: "Just tell ''em to cool off and you can sneak him in."'
    item: '[[w.schlesinger-journals]], 171'
- check:
    id: cal.1962-09-29.mississippi-ole-miss
    text: 'Check: Thomas, 198, has "soft pillow"; Schlesinger''s *Journals*, 169, "sofa pillow."'
