# cal.1961-10-21.defense: Fursenko and Naftali, 409-10; Kaplan, 162
- add-words:
    id: cal.1961-10-21.defense
    after: end
    words: 'McNamara was to give the speech; Kennedy has Gilpatric deliver it.'
    item: '[[w.fursenko-khrushchevs-cold-war]], 409'
- add-words:
    id: cal.1961-10-21.defense
    after: end
    words: 'Gilpatric: an enemy move that brought the American "nuclear retaliatory force of such lethal power" into play would be self-destruction; the delivery vehicles number in the tens of thousands, with more than one warhead each.'
    item: '[[w.fursenko-khrushchevs-cold-war]], 409–10'
- add-words:
    id: cal.1961-10-21.defense
    after: end
    words: 'He is confident Moscow will not "provoke a major nuclear conflict."'
    item: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 162'
- names:
