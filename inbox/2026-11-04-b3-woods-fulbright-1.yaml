      when: Sept. 2
      date: '1964-09-02'
      thread: poverty
      c: 'Fulbright to Shriver: cotton, cotton cloth and cotton clothing into the food stamp program; Fort Chaffee, used
        only for summer reserve training, a Job Corps center.'
