      c: 'McGovern in the Oval Office against escalation, by McGovern''s account. Johnson: "we''re dealing with a bunch
        of communist bastards." McGovern: Ho no stooge of China. Johnson: "Goddamn it, George, you and Fulbright and all
        you history teachers down there."'
      n: '[[w.woods-fulbright]], 364–65. Check: the day; Woods sets it after the raids of Feb. 7–8. To check: George McGovern,
        interview by Woods, June 27, 1991 (cited by [[w.woods-fulbright]], 365 n.15). Names: McGovern, Johnson, Fulbright,
        Hồ Chí Minh.'
      tags:
      - name:mcgovern-george
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:ho-chi-minh
