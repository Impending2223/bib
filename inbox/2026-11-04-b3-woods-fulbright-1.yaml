      thread: vietnam-congress
      c: 'Marcy to Fulbright: a Rand survey of Viet Cong defectors for the Pentagon, its findings against the official line,
        was rejected and made over to show the Viet Cong demoralized; McNamara quoted it at the NSC of May 10. May 16, Marcy
        proposes staff of the committee posted abroad to report to it, an alternative to State''s reporting.'
