      when: Apr. 30
      date: '1965-04-30'
      thread: latin-america-dominican-republic
      c: 'Johnson asks McNamara and Wheeler what they would need to take the republic: one or two divisions. By John Bartlow
        Martin''s account, Johnson: "What can we do in Vietnam if we can''t clean up the Dominican Republic?" Rusk, to reporters:
        play down "the ideological aspects of this thing."'
      n: '[[w.woods-fulbright]], 377. To check: [[w.martin-overtaken-by-events]], 661 (cited by [[w.woods-fulbright]], 377
        n.5); [[w.johnson-fulbright-the-dissenter]], 247 (cited by [[w.woods-fulbright]], 377 n.4). See [[cal.1965-04-28.latin-america]].
        Names: Johnson, McNamara, Wheeler, Martin, Rusk.'
