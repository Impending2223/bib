- add:
    entry:
      id: cal.1961-07-13.goldwater-2
      when: July 13
      date: '1961-07-13'
      thread: goldwater
      c: 'Goldwater in the Senate on Fulbright''s speech of June 29: "surprised, amazed, and alarmed"; "continued drifting
        in the wrong direction." The President should declare "total victory as our fundamental purpose."'
      n: 'The day: Fulbright''s answer, [107 Cong. Rec. 13246](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-5-2.pdf#page=44)
        (Senate, July 24, 1961). [[w.woods-fulbright]], 290 (the words). Check: Woods has it two weeks after the speech,
        the answer two days later. Check: Goldwater''s words in the Record of July 13, not read. To check: Boyd, "Senate
        Argues Foreign Policy," *Memphis Commercial Appeal*, Aug. 1961 (cited by [[w.woods-fulbright]], 290 n.56). See [[cal.1961-06-29.vietnam-congress]].
        Names: Goldwater, Fulbright.'
      tags:
      - name:goldwater-barry-m
      - name:fulbright-j-william
- src:
    id: cal.1961-07-13.goldwater-2
    rows:
    - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-5-2.pdf#page=44: A'
    - 'w.woods-fulbright 290: all'
    - 'via x.1961-08.boyd-senate-argues-foreign-policy: all'
- add:
    entry:
      id: cal.1961-07-21.right-and-the-military
      when: July 21
      date: '1961-07-21'
      thread: right-and-the-military
      c: 'The *Washington Post* and the *New York Times* print synopses of Fulbright''s memorandum. Thurmond, turned away
        at Fulbright''s office ("Tell him to go to hell"), writes demanding it within the hour. Fulbright: a private communication
        to the Secretary of Defense; "where it obtained the memorandum is a mystery to me."'
      n: '[[w.woods-fulbright]], 284–85. To check: Fulbright to Thurmond and Thurmond to Fulbright, July 21, 1961, Series
        4:19, Box 26:4, SPF (cited by [[w.woods-fulbright]], 285 n.30); Jack Yingling, interview by Woods, Oct. 12, 1988
        (cited by [[w.woods-fulbright]], 284 n.29). See [[cal.1961-06.right-and-the-military]]. Names: Fulbright, Thurmond.'
      tags:
      - name:fulbright-j-william
      - name:thurmond-strom
- src:
    id: cal.1961-07-21.right-and-the-military
    rows:
    - 'w.woods-fulbright 284–85: all'
    - 'via x.1961-07-21.fulbright-thurmond-letters: B-C'
    - 'via x.1988-10-12.woods-interview-yingling: B'
- add:
    entry:
      id: cal.1961-07-24.goldwater-2
      when: July 24
      date: '1961-07-24'
      thread: goldwater
      also:
      - right-and-the-military
      c: 'Fulbright answers Goldwater in the Senate: let those who call for total victory "spell out for us precisely how
        it might be achieved," and what they would do with it. By nuclear war, at the cost of "tens of millions of people
        on both sides"? The objective "to limit the world struggle for power and to bring it under civilized rules."'
      n: '[107 Cong. Rec. 13246–47](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt10/pdf/GPO-CRECB-1961-pt10-5-2.pdf#page=44)
        (Senate, July 24, 1961). [[w.woods-fulbright]], 290–91. See [[cal.1961-07-13.goldwater-2]]. Names: Fulbright, Goldwater.'
      tags:
      - name:fulbright-j-william
      - name:goldwater-barry-m
- src:
