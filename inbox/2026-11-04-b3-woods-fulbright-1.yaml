- add:
    entry:
      id: cal.1962-09-11.missile-crisis-2
      when: Sept. 11
      date: '1962-09-11'
      thread: missile-crisis
      also:
      - elections-1962
      c: 'Fulbright, campaigning for a fourth term, answers his Republican opponent, Kenneth Jones: the weapons in Cuba
        defensive; nothing gained by smashing that "poor, bedraggled country."'
      n: '[[w.woods-fulbright]], 270–71. Check: the day; Woods cites the *Arkansas Gazette* of Sept. 11. To check: "Jones
        Asks—and Fulbright Answers with Views on Cuba," *Arkansas Gazette*, Sept. 11, 1962 (cited by [[w.woods-fulbright]],
        271 n.28). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
