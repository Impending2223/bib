    - 'via x.1960-05-04.fulbright-to-gates: A'
    - 'via x.1960-04-24.mccormick-to-fulbright: A'
- add:
    entry:
      id: cal.1960-05.governors
      when: May
      date: '1960-05'
      thread: governors
      c: 'Bill Darby, for the Faubus men, complains that a former Fulbright aide works for Hardin. Erickson: Fulbright will
        stay out if Faubus promises not to run against him in 1962.'
      n: '[[w.woods-fulbright]], 294. Check: the day. To check: Erickson to Fulbright, May 21, 1960, Williams Papers (cited
        by [[w.woods-fulbright]], 294 n.73). Names: Fulbright, Faubus.'
      tags:
      - name:fulbright-j-william
      - name:faubus-orval-e
      - state:ar
- src:
