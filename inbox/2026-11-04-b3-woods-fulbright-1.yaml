- add:
    entry:
      id: cal.1961-10-02.right-and-the-military
      when: Oct. 2
      date: '1961-10-02'
      thread: right-and-the-military
      c: 'The John Birch Society''s *Bulletin* for October: Welch asks members to flood Congress with letters and wires
        against "Operation FIB (The Fulbright Intimidation Binge)."'
