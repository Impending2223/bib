      date: '1966-02-19'
      thread: vietnam-hearings
      c: 'Ridgway to Fulbright, having watched all the hearings on television: "conducted ... in the finest traditions of
        the Senate"; "a signal service to our people." The staff circulates it; the committee''s mail, by Marcy, 30 to 1
        against escalation.'
