    - 'w.woods-fulbright 290–91: all'
- add:
    entry:
      id: cal.1961-08-04.right-and-the-military
      when: Aug. 4
      date: '1961-08-04'
      thread: right-and-the-military
      c: Bridges, ranking Republican on Armed Services, finds Fulbright's memorandum "shocking" and will ask the committee
        to investigate. In the House, Sikes against efforts to "muzzle the military"; the memorandum known by the phrase
        from then on.
      n: '[[w.woods-fulbright]], 285. Check: the day; Woods cites the *Arkansas Gazette* of Aug. 4. To check: "Investigation
        Urged on Fulbright Memo," *Arkansas Gazette*, Aug. 4, 1961 (cited by [[w.woods-fulbright]], 285 n.33). See [[cal.1961-08-02.right-and-the-military]].
        Names: Bridges, Sikes, Fulbright.'
      tags:
      - name:bridges-henry-s
      - name:sikes-robert-l
      - name:fulbright-j-william
