      when: June 26
      date: '1961-06-26'
      thread: foreign-aid
      c: 'Fulbright to Kennedy, Marcy''s draft: "Were I to vote now ... I would vote to reduce the military program and
        to reorient the economic programs drastically," away from regimes such as Korea''s. He will support the bill all
        the same.'
      n: '[[w.woods-fulbright]], 313. Check: the letter''s day; Woods has it June 1961 and cites Marcy to Fulbright, June
        26. To check: Marcy to Fulbright, June 26, 1961, Marcy Papers, box 1, folder Misc. 1961–62 (cited by [[w.woods-fulbright]],
        313 n.32). Names: Fulbright, Kennedy, Marcy.'
