      when: Apr.
      date: '1962-04'
      thread: elections-1962
      c: 'Winston G. Chandler, segregationist member of the Pulaski County school board, at George Benson''s urging, announces
        against Fulbright: "he''s too liberal." On the muzzling memorandum: "He didn''t think people should be woke up in
        this country about the threats of communism."'
      n: '[[w.woods-fulbright]], 298. Check: the day. To check: "Chandler Says He''ll Oppose Fulbright: ''He''s Too Liberal,''"
        *Arkansas Gazette*, Apr. 1962 (cited by [[w.woods-fulbright]], 298 n.94). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
