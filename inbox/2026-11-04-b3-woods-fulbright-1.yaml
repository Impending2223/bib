      when: Oct. 1
      date: '1963-10-01'
      thread: civil-rights-bill
      c: 'Manatos to O''Brien: Fulbright has telephoned the White House after the Birmingham church bombing, offering to
        help pass a new, comprehensive civil rights bill.'
      n: '[[w.woods-fulbright]], 329. Check: the day of the call. To check: Mike Manatos to Larry O''Brien, Oct. 1, 1963,
