      when: Nov.
      date: '1961-11'
      thread: elections-1962
      also:
      - right-and-the-military
      c: 'Fulbright in Arkansas, some forty appearances: civilian control of the military, the ultras "soft." At Ozark,
        Ark., an overflow crowd of 400: "how many Communists do you know in your hometown?" A week later, a deer hunt on
        Hugh Brinkley''s plantation: back to "the fried chicken circuit."'
      n: '[[w.woods-fulbright]], 296. Check: the days. To check: "Back in Arkansas," *Newsweek*, Nov. 13, 1961, 24–25; Ernie
        Deane, "Fulbright Tosses Political Straw," *Arkansas Gazette*, Nov. 19, 1961 (cited by [[w.woods-fulbright]], 296
        nn.81–84). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
