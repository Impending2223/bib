      when: Mar., second week
      date: '1965-03'
      thread: vietnam-congress
      also:
      - soviet-union
      c: 'Lee Williams, at the Bulgarian embassy: "the Russians are terribly disturbed about our aggressive actions in Viet
        Nam." Fulbright two hours with Dobrynin at the Soviet embassy: the strikes on the North "causing deep embarrassment
        and concern" in the Kremlin; more Soviet arms aid at the least.'
      n: '[[w.woods-fulbright]], 367. Check: the days. Names: Fulbright, Dobrynin.'
      tags:
      - name:fulbright-j-william
      - name:dobrynin-anatoly
