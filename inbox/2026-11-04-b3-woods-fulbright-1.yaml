      when: Jan. 16
      date: '1965-01-16'
      thread: poverty
      c: 'Fulbright to the National Association of Secondary School Principals: the cold war "has encroached upon our sovereignty,"
        giving the Communists the major voice in the budget; "We can no longer afford to defer problems of slums and crime
        and poverty and inadequate education."'
      n: '[[w.woods-fulbright]], 326. Check: the day; Woods cites the *Arkansas Gazette* of Jan. 17. To check: "Fulbright
        Urges Priority Be Centered on Promoting Welfare of Americans," *Arkansas Gazette*, Jan. 17, 1965 (cited by [[w.woods-fulbright]],
        326 n.11). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
