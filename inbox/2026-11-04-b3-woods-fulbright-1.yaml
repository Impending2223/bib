    rows:
    - 'w.woods-fulbright 295: all'
    - 'via x.1961-08-08.kenworthy-alford-scores-memo: all'
- add:
    entry:
      id: cal.1961-08-13.right-and-the-military
      when: Aug. 13
      date: '1961-08-13'
      thread: right-and-the-military
      c: 'Thurman Sensing, vice-president of the Southern States Industrial Council, "Government by the People": Fulbright
        a liberal with no confidence in the people; that Americans need no teaching on the communist menace "the most incredible
        statement to be made by a prominent American in recent years."'
      n: '[[w.woods-fulbright]], 285. To check: Thurman Sensing, "Government by the People," Aug. 13, 1961, Series 4:19,
        Box 29:6, SPF (cited by [[w.woods-fulbright]], 285 n.34). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1961-08-13.right-and-the-military
    rows:
    - 'w.woods-fulbright 285: all'
    - 'via x.1961-08-13.sensing-government-by-the-people: all'
- add:
    entry:
      id: cal.1961-08.right-and-the-military-2
      when: Aug., late
      date: '1961-08'
      thread: right-and-the-military
      also:
      - elections-1962
      c: 'Faubus to reporters: "a man in uniform should be able to speak against what he is expected to shoot against."
        His weekly, the *Arkansas Statesman*, in back-to-back editorials: Fulbright "wanting to ditch" the Constitution.'
      n: '[[w.woods-fulbright]], 295. Check: the day; Woods cites the *Arkansas Gazette* of Aug. 28. To check: *Arkansas
        Gazette*, Aug. 28, 1961; Ernest Valachovic, "Faubus Weekly Steps Up Attack on Fulbright," *Arkansas Gazette*, Sept.
        10, 1961 (cited by [[w.woods-fulbright]], 295 nn.77–78). Names: Faubus, Fulbright.'
      tags:
      - name:faubus-orval-e
      - name:fulbright-j-william
      - state:ar
- src:
    id: cal.1961-08.right-and-the-military-2
    rows:
    - 'w.woods-fulbright 295: all'
    - 'via x.1961-08-28.arkansas-gazette-faubus: A'
    - 'via x.1961-09-10.valachovic-faubus-weekly: B'
- add:
    entry:
      id: cal.1961-09-06.right-and-the-military
      when: Sept. 6–7
      date: '1961-09-06'
      thread: right-and-the-military
      c: 'Senate Armed Services on S. Res. 191, Thurmond''s, a study of the use of officers and bases to alert the public
        to the cold war: McNamara, two days. He will not name the Defense Department''s reviewers of speeches. Thurmond
        on Walker''s rebuke; Byrd asks whether Walker commanded at Little Rock; Russell: "high-handed, arbitrary, and intimidating
        methods."'
      n: 'Daily Digest, [107 Cong. Rec. D533](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=531),
        [D540](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=538) (the sessions).
        [[w.woods-fulbright]], 287–88 (the questions). Check: Woods has McNamara produce here Kennedy''s letter claiming
        executive privilege, of Feb. 1962 ([[cal.1962-02-06.right-and-the-military]]), and has the subcommittee under Stennis
        sit. To check: "McNamara Backs Review of Military Leaders'' Speeches," *Arkansas Democrat*, Sept. 1961; Drew Pearson,
        "Drive on Fulbright Boomerangs," *Washington Post*, Sept. 18, 1961 (cited by [[w.woods-fulbright]], 287–88 nn.44,
        47). Names: McNamara, Thurmond, Walker, Harry F. Byrd, Russell.'
      tags:
      - name:mcnamara-robert-s
      - name:thurmond-strom
      - name:walker-edwin-a
      - name:byrd-harry-f
      - name:russell-richard-b
