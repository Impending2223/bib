      id: cal.1966-01-10.vietnam-congress-2
      when: Jan. 10
      date: '1966-01-10'
      thread: vietnam-congress
      also:
      - vietnam-pause
      c: 'Marcy''s memorandum for Fulbright, "Vietnam": "The present bombing pause and negotiation initiative offer the
        last clear chance to stop short of unlimited escalation"; go ahead, and the country must be ready to go "the whole
        way—even to the use of nuclear weapons." Withdraw, conditionally or not. Johnson and the party can win in 1968 only
        on a peace program.'
      n: '[[w.woods-fulbright]], 396. To check: Marcy, "Vietnam," Jan. 10, 1966, Marcy Papers, box 6, folder Jan., RG 46,
        National Archives (cited by [[w.woods-fulbright]], 396 n.11). See [[cal.1966-01-10.vietnam-congress]]. Names: Marcy,
        Fulbright, Johnson.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:johnson-lyndon-b
