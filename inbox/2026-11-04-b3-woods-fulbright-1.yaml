      when: Apr. 27
      date: '1965-04-27'
      thread: latin-america
      c: 'Fulbright to the School of Advanced International Studies: "true" social revolution "is almost always violent
        and usually it is extremely violent; its essence is the destruction of the social fabric and institutions of a society."'
      n: '[[w.woods-fulbright]], 386 n.41. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
