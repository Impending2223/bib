      id: cal.1965-07-27.vietnam-july-decision
      when: July 27
      date: '1965-07-27'
      thread: vietnam-july-decision
      also:
      - vietnam-congress
      c: 'The congressional leaders at the White House. Mansfield: "We owe this government nothing ... We are going deeper
        into war. Escalation begets escalation. The best hope for salvation is quick stalemate and negotiations." He will
        support the President "as a Senator and Majority Leader."'
      n: '[[w.woods-fulbright]], 374. Check: the hour; Woods has it the morning before the meeting in Mansfield''s office.
        To check: Congressional Leadership Meeting, July 27, 1965, Meeting Notes File, box 1, Johnson Papers (cited by [[w.woods-fulbright]],
        374 n.47). See [[cal.1965-07-27.vietnam-3]]. Names: Mansfield, Johnson.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
