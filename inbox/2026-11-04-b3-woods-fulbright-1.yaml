- add:
    entry:
      id: cal.1960-04-21.governors
      when: Apr. 21
      date: '1960-04-21'
      thread: governors
      c: 'Fulbright''s aides, Lee Williams and Erickson, through Bob Lowe of the *Arkansas Gazette*, seek candidates against
        Faubus. Four enter: Bruce Bennett, H. E. Williams, Joe Hardin, Hal Millsaps, the last "to help" Fulbright "by knocking
        off Faubus."'
      n: '[[w.woods-fulbright]], 294. Check: the day; Woods cites Williams to Erickson, Apr. 21, 1960, and Erickson to Fulbright,
        May 4. To check: Williams to Erickson, Apr. 21, 1960; Erickson to Fulbright, May 4, 1960, Williams Papers (cited
        by [[w.woods-fulbright]], 294 nn.71–72). Primary: [[cal.1960-07-26.governors-ar]]. Names: Faubus, Bennett, Fulbright.'
      tags:
      - name:faubus-orval-e
      - name:bennett-bruce
      - name:fulbright-j-william
      - state:ar
- src:
    id: cal.1960-04-21.governors
