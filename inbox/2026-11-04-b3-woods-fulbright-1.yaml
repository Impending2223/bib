- add:
    entry:
      id: cal.1966-01-31.vietnam-congress-4
      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'Fulbright on CBS, the evening the bombing resumes, to Martin Agronsky and Eric Sevareid: the war morally wrong
        and against the country''s interest; the administration a prisoner of the Munich analogy. He regrets his part in
        the Tonkin resolution.'
      n: '[[w.woods-fulbright]], 401–02. To check: [[w.berman-william-fulbright-and-the]], 55 (cited by [[w.woods-fulbright]],
        402 n.30). See [[cal.1966-01-31.vietnam-congress-2]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
