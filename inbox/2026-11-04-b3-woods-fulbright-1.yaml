      when: Aug. 10
      date: '1965-08-10'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'Brazil, the mission to Castello Branco''s government on Air Force One, Fulbright its head; Mann sent along "to
        try to convert Fulbright." Fulbright locks himself in the forward compartment. Valenti to Johnson: "In several encounters
        with the press he made not one miss-step." Aug. 11: Mann thinks the committee "split down the middle"; Fulbright
        would like a report against the intervention and cannot get one.'
      n: '[[w.woods-fulbright]], 383. Check: the days of the trip. To check: Valenti to Johnson, Aug. 10, 1965, WHCF, box
        7; Valenti to Johnson, Aug. 11, 1965, Confidential File, CO 37, Brazil, Johnson Papers; Thomas Mann, interview by
        Woods, May 10, 1991 (cited by [[w.woods-fulbright]], 383 nn.22–25). Names: Castello Branco, Mann, Fulbright, Valenti,
        Johnson.'
      tags:
      - name:castello-branco-humberto-de-alencar
      - name:mann-thomas-c
      - name:fulbright-j-william
      - name:valenti-jack
      - name:johnson-lyndon-b
