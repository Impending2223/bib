    entry:
      id: cal.1961-07-11.right-and-the-military
      when: July 11
      date: '1961-07-11'
      thread: right-and-the-military
      also:
      - south-asia
      c: The state dinner for Ayub Khan at Mount Vernon. On the yacht down the Potomac Fulbright tells McNamara of the "so-called
        defense seminars" in Fort Smith, Little Rock and Fayetteville, sponsored by high officers, and of his memorandum.
        McNamara interested.
      n: 'Toasts at the State Dinner at Mount Vernon, [1961 Pub. Papers 502](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=560)
        (July 11, 1961) (the dinner''s day). [[w.woods-fulbright]], 283–84 (Fulbright and McNamara). Woods dates it June
        11. To check: Holmes Alexander, "Sen. Fulbright''s Aide Wrote Controversial Memo," *Washington Star*, Aug. 14, 1961
        (cited by [[w.woods-fulbright]], 284 n.27). See [[cal.1961-06.right-and-the-military]]. Names: Ayub Khan, Fulbright,
        McNamara.'
      tags:
      - name:ayub-khan-mohammad
      - name:kennedy-john-f
      - name:fulbright-j-william
      - name:mcnamara-robert-s
