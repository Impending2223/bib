      id: cal.1965-11.vietnam-congress-4
      when: Nov.
      date: '1965-11'
      thread: vietnam-congress
      c: Fulbright, having read Bernard Fall's *Street Without Joy*, asks to meet him; Lowenstein of the staff takes a cab
        to Fall's Georgetown house. Lunch the next Monday, the start of Fulbright's study of the war.
      n: '[[w.woods-fulbright]], 391. Check: the days; Woods has a snowy afternoon in November, weeks before the New Zealand
        trip. To check: Pat Holt, interview by Woods, Oct. 7, 1988; James Lowenstein, interview by Woods, Oct. 3, 1991 (cited
        by [[w.woods-fulbright]], 391 n.57). See [[cal.1965-11.vietnam-congress-2]]. Names: Fulbright, Fall.'
