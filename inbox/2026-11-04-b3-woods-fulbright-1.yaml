        the seniority system, will be threatened."'
      n: '[[w.woods-fulbright]], 300. To check: Norvill Jones to Fulbright, June 12, 1963, Series 39:2, Box 9:5, SPF; WTOP
        editorial, June 12, 1963, Series 39:2, Box 9:5, SPF (cited by [[w.woods-fulbright]], 300–01 nn.101–102). Names:
