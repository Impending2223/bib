- add:
    entry:
      id: cal.1961-06.right-and-the-military
      when: June
      date: '1961-06'
      thread: right-and-the-military
      c: 'Yingling''s memorandum for Fulbright, after a month''s study: eleven Strategy for Survival programs run by military
        men with "extremely radical right-wing speakers and/or materials"; the administration''s program called steps toward
        communism. Fulbright''s postscript: revise the directive of 1958 to bar political activity by officers in their
        official capacity. June 28, to the President.'
      n: '[[w.woods-fulbright]], 282–83. To check: Fulbright to Kennedy, June 28, 1961, WHOF, box 639, Kennedy Papers (cited
        by [[w.woods-fulbright]], 283 n.25); Jack Yingling, interview by Woods, Oct. 12, 1988 (cited by [[w.woods-fulbright]],
        283 n.24). Placed in the record: [[cal.1961-08-02.right-and-the-military]]. Names: Fulbright, Kennedy.'
      tags:
      - name:fulbright-j-william
      - name:kennedy-john-f
