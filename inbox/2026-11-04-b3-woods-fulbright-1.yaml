    - 'via x.1960-06-24.marcy-to-johnson: B'
- add:
    entry:
      id: cal.1960-09.elections-1960-6
      when: Sept., early
      date: '1960-09'
      thread: elections-1960
      c: 'Kennedy in Arkansas: the State''s whole congressional delegation turns out for him, McClellan in the lead. In
        late August none had committed to the ticket.'
      n: '[[w.woods-fulbright]], 254. Check: the day. To check: Leslie Carpenter, "Possibility of ''Free Electors'' Bolt
        Diminishing," *Arkansas Gazette*, Aug. 28, 1960; *Hope Star*, Sept. 15, 1960 (cited by [[w.woods-fulbright]], 254
        n.27). Names: Kennedy, McClellan.'
      tags:
      - name:kennedy-john-f
      - name:mcclellan-john-l
      - state:ar
- src:
    id: cal.1960-09.elections-1960-6
    rows:
    - 'w.woods-fulbright 254: all'
    - 'via x.1960-08-28.carpenter-free-electors-bolt: B'
    - 'via x.1960-09-15.hope-star-kennedy: A'
- add:
    entry:
      id: cal.1960-10-11.elections-1960-2
      when: Oct. 11
      date: '1960-10-11'
      thread: elections-1960
      c: 'Marcy to Fulbright, back from the Middle East and campaigning for Kennedy on both coasts, Marcy writing the speeches:
        think first of the headlines. "FULBRIGHT CHARGES U.S. PRESTIGE AT ALL TIME LOW."'
      n: '[[w.woods-fulbright]], 254. To check: Marcy to Fulbright, Oct. 11, 1960, BCN 146, F4, SPF (cited by [[w.woods-fulbright]],
        254 n.28). Names: Marcy, Fulbright, Kennedy.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
- src:
    id: cal.1960-10-11.elections-1960-2
    rows:
    - 'w.woods-fulbright 254: all'
    - 'via x.1960-10-11.marcy-to-fulbright: all'
- add:
    entry:
      id: cal.1960-11.europe-and-the-alliance
      when: Nov.
      date: '1960-11'
      thread: europe-and-the-alliance
      also:
      - transition-and-staff-cabinet
      c: London, the NATO Parliamentarians' Conference, Fulbright and Johnson among the American delegates. Dinner with
        Macmillan. Flying home, Johnson assures Fulbright he will be Secretary of State.
      n: '[[w.woods-fulbright]], 256. Check: the days. Names: Fulbright, Johnson, Macmillan.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:macmillan-harold
