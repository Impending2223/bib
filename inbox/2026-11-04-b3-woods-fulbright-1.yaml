      when: July 29
      date: '1965-07-29'
      thread: vietnam-congress
      c: 'Fulbright to a constituent: "I am doing all that I can to influence the President not to expand this war and to
        find a way to the Conference table." Johnson "inherited the involvement."'
      n: '[[w.woods-fulbright]], 370. To check: Fulbright to the Rev. Daniel H. Evans, July 29, 1965, Series 48:1, Box 7:3,
        SPF (cited by [[w.woods-fulbright]], 370 n.35). Names: Fulbright, Johnson.'
      tags:
