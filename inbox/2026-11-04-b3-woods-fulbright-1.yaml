      when: June 27
      date: '1962-06-27'
      thread: congress
      c: The Senate funds Foreign Relations' study of nondiplomatic agents of foreign governments, Fulbright's asking. Walter
        Pincus, a reporter, and a lawyer, Tony Sifton, to do it; ten lobbyists chosen.
      n: '[[w.woods-fulbright]], 306. Check: the day; Woods has July 1962 and cites the Record of June 27, 11879, not read.
        To check: 108 Cong. Rec. 11879 (Senate, June 27, 1962); Rusk to Kennedy, July 2, 1962, NSF, box 66, Kennedy Papers
