      date: '1965-03-15'
      thread: vietnam-congress
      c: 'Bundy to Johnson, on critics in Congress: "They are quite free to oppose you if they choose, but they are not
        free to make statements that you regard as damaging and pretend that they are speaking as your friends and supporters."'
      n: '[[w.woods-fulbright]], 371. To check: Bundy to Johnson, Mar. 15, 1965, NSC File, Memos to the President, box 3,
