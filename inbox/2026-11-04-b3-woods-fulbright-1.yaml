      when: May 27
      date: '1961-05-27'
      thread: berlin-and-vienna
      c: 'Fulbright to Kennedy, before Vienna: "While I have no doubt of Khrushchev''s desire to ''do us in,'' preferably
        by peaceful means," he understands that "our mutually destructive capacities are so overwhelming that a military
        confrontation must be avoided."'
