      when: July 31
      date: '1962-07-31'
      thread: elections-1962
      c: 'Arkansas, Democratic primary for the Senate: Fulbright over Winston G. Chandler, by two to one. Kenneth G. Jones
        unopposed for the Republicans.'
      n: '[[w.woods-fulbright]], 299. Check: the count; Woods gives the margin only, and no day (the primary of [[cal.1962-07-31.governors-ar]]).
