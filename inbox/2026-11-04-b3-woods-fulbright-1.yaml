    rows:
    - 'w.woods-fulbright 367: all'
- add:
    entry:
      id: cal.1965-03-12.vietnam-congress-2
      when: Mar. 12
      date: '1965-03-12'
      thread: vietnam-congress
      c: 'Fulbright to Rusk, after Dobrynin: halt the bombing for Soviet pressure on Hanoi to stop the flow south; Britain
        and the Soviet Union to reconvene Geneva; elections throughout Vietnam; a united, independent Vietnam, Yugoslav-style.
        No large land army: "a bloody and interminable conflict in which the advantage would lie with the enemy."'
      n: '[[w.woods-fulbright]], 367. To check: Fulbright to Rusk, Mar. 12, 1965, Series 2:1, Box 4:2, SPF (cited by [[w.woods-fulbright]],
        367 n.25); [[w.berman-william-fulbright-and-the]], 36 (cited by [[w.woods-fulbright]], 367 n.26). See [[cal.1965-03.vietnam-congress-3]].
        Names: Fulbright, Rusk.'
      tags:
      - name:fulbright-j-william
      - name:rusk-dean
