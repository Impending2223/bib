    entry:
      id: cal.1962-10-05.cuba-2
      when: Oct. 5
      date: '1962-10-05'
      thread: cuba
      c: 'Fulbright to Will Clayton: Latin America unstable and dangerous, but "I have very little confidence in armed intervention
        ... it won''t work, just as it didn''t work in Mississippi."'
      n: '[[w.woods-fulbright]], 271. To check: Fulbright to Clayton, Oct. 5, 1962, Clayton Papers, Truman Library (cited
        by [[w.woods-fulbright]], 271 n.31). See [[cal.1962-09-26.missile-crisis]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
