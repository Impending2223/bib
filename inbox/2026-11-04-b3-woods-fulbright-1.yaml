- add:
    entry:
      id: cal.1962-09-14.missile-crisis
      when: Sept. 14
      date: '1962-09-14'
      thread: missile-crisis
      c: 'Holt, of Foreign Relations'' staff, cables Fulbright in Arkansas: the administration assures the Senate the new
        Soviet equipment in Cuba "of an essentially defensive nature," antiaircraft weapons. The menace Castro''s subversion;
        the exiles "highly irresponsible."'
      n: '[[w.woods-fulbright]], 271. To check: Holt to Fulbright, Sept. 14, 1962, Series 48:1, Box 4:3, SPF (cited by [[w.woods-fulbright]],
        271 n.29). Names: Fulbright, Castro.'
      tags:
      - name:fulbright-j-william
