    set:
      c: 'News conference. Kennedy gratified that Macmillan''s call for negotiations on entering the Common Market as a
        full member is well received by the Six and the Commission: "We welcome the prospect of Britain''s participation
        in the institutions of the Treaty of Rome." American economic interests, and those of friendly states, to be watched.
        Fulbright''s memorandum on the military: sent at the Secretary of Defense''s request; the military kept out of politics,
        "one of the wisest actions of our Constitutional Founders."'
      n: 'The President''s News Conference, [1961 Pub. Papers 553](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=611)
        (Aug. 10, 1961). [[w.woods-fulbright]], 286 (Fulbright''s memorandum). See [[cal.1961-08-05.european-community]];
        [[cal.1961-08-02.right-and-the-military]]. Names: Kennedy, Macmillan, Fulbright.'
