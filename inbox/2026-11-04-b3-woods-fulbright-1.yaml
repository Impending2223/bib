        check: UPI 40, July 30, 1963, Series 48:6, Box 26, SPF; Alan Otter, "White House Increases Activities That Would
        Aid Democrats in 1964," *Wall Street Journal*, May 28, 1963 (cited by [[w.woods-fulbright]], 310–11 nn.20–21). See
        [[cal.1963-06-18.congress]]. Names: Symington.'
