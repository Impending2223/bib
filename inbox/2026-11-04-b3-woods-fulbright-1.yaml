- add:
    entry:
      id: cal.1960-06-28.soviet-union-u2
      when: June 28
      date: '1960-06-28'
      thread: soviet-union-u2
      c: 'Fulbright submits Foreign Relations'' report, "Events Relating to the Summit Conference" (S. Rept. 1761), approved
        June 23, 14 to 1. To the Senate: the U-2 and its handling "the immediate cause of the collapse"; "we forced Khrushchev
        to wreck the conference by our own ineptness." George Washington and the cherry tree.'
      n: '[106 Cong. Rec. 14734–37](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt11/pdf/GPO-CRECB-1960-pt11-5-1.pdf#page=78)
        (Senate, June 28, 1960). [[w.woods-fulbright]], 252 (the speech). See [[cal.1960-05-27.soviet-union]]. Names: Fulbright,
        Khrushchev.'
      tags:
      - name:fulbright-j-william
      - name:khrushchev-nikita-s
