      when: Sept. 12
      date: '1963-09-12'
      thread: testing
      c: 'Fulbright on NBC''s *Today*, to Dave Garroway, against Russell''s reservations: any would mean renegotiating and
        kill the treaty. The Joint Chiefs, who testified for it, privately lobbying against it: let them say so publicly
        or stop undercutting their commander in chief.'
      n: '[[w.woods-fulbright]], 319–20. Check: the day; Woods cites UPI 41, Sept. 12. To check: UPI 41, Sept. 12, 1963,
        Series 48:1, Box 5:3, SPF (cited by [[w.woods-fulbright]], 320 n.53). See [[cal.1963-09-09.testing-2]]. Names: Fulbright,
        Russell.'
