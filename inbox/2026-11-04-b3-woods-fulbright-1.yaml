    - 'w.woods-fulbright 330: all'
    - 'via x.1964-03-18.fulbright-senate-civil-rights: all'
- add:
    entry:
      id: cal.1964-03.civil-rights-bill-4
      when: Mar., late
      date: '1964-03'
      thread: civil-rights-bill
      also:
      - vietnam-congress
      - latin-america-panama
      - elections-1964
      c: 'Fulbright at dinner with Johnson at the White House. Johnson: a vote for cloture, if not for the bill, of great
        value, and an answer to the foreign chanceries that think him a racist. Vietnam; secret talks with Panama; East-West
        trade; Cuba, where they differ. Johnson wants an overwhelming victory over Goldwater; Fulbright will help.'
      n: '[[w.woods-fulbright]], 334. Check: the day. To check: Rowland Evans and Robert Novak, "Fulbright''s Opportunity,"
        *Washington Post*, Apr. 14, 1964 (cited by [[w.woods-fulbright]], 334 n.35). See [[cal.1964-03-25.latin-america]].
        Names: Fulbright, Johnson, Goldwater.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
