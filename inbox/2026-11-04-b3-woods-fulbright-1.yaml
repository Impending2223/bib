      when: July 29
      date: '1963-07-29'
      thread: testing
      c: 'Harriman, back from Moscow, briefs Foreign Relations in closed session. Fulbright comes out arm in arm with him:
        the treaty has his full support.'
      n: '[[w.woods-fulbright]], 318. Check: the day; Woods cites the *Arkansas Gazette* of July 30. To check: "Fulbright
