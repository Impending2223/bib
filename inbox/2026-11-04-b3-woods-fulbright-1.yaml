      date: '1962-10'
      thread: latin-america
      also:
      - congress
      c: 'Santo Domingo. Pincus, for Foreign Relations, nights in the house of a member of the governing council, photographs
        its secret files on the sugar quota: among them Trujillo''s signed contract with Igor Cassini, who promised to win
        the quota back through the Kennedys.'
      n: '[[w.woods-fulbright]], 306–07. Check: the month; Woods has the fall of 1962. To check: Walter Pincus, interview
        by Woods, Mar. 11, 1990 (cited by [[w.woods-fulbright]], 307 n.9). Names: Trujillo.'
