      when: June 18
      date: '1963-06-18'
      thread: congress
      also:
      - middle-east
      c: 'Evening. Maurice Boukstein, counsel to the Jewish Agency-American Section, to Marcy by telephone: his clients
        will not appear unless unsworn, without a transcript, nothing made public. Marcy: then the committee will release
        what its investigators have. They will appear.'
      n: '[[w.woods-fulbright]], 310. To check: Marcy, memorandum of conversation, June 18, 1963, Marcy Papers, box 4, RG
        46, National Archives (cited by [[w.woods-fulbright]], 310 n.19). Names: Marcy.'
