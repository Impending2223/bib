      when: July 23
      date: '1964-07-23'
      thread: poverty
      c: 'Fulbright in the Senate for the antipoverty bill: for the children "who did not have the wisdom and foresight
        to be born of the right parents or in the right place." Opportunity, not charity; the charge of buying votes "hogwash."
        Sixty percent of Arkansas families under $4,000 a year in 1960.'
      n: '[[w.woods-fulbright]], 326. Check: the words, in the Record not read. To check: 110 Cong. Rec. 16764 (Senate,
        July 23, 1964) (cited by [[w.woods-fulbright]], 326 n.12). See [[cal.1964-07-23.poverty]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
