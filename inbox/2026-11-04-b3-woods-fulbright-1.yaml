    - 'via x.1960-05-04.erickson-to-fulbright: B'
- add:
    entry:
      id: cal.1960-05-04.right-and-the-military
      when: May 4
      date: '1960-05-04'
      thread: right-and-the-military
      c: 'Fulbright to Gates: stop the censorship of *Stars and Stripes*, whose command in Germany barred stories on Foreign
        Relations'' hearings critical of aid to Turkey. Gates''s answer unsatisfying.'
      n: '[[w.woods-fulbright]], 278. To check: James McCormick to Fulbright, Apr. 24, 1960; Fulbright to Gates, May 4,
        1960, SPF (cited by [[w.woods-fulbright]], 278 nn.9–10). Names: Fulbright, Gates.'
      tags:
      - name:fulbright-j-william
      - name:gates-thomas-s-jr
- src:
    id: cal.1960-05-04.right-and-the-military
    rows:
