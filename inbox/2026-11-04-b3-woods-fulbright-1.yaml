    rows:
    - 'w.woods-fulbright 327–28: all'
    - 'via x.1963-11-19.fulbright-senate-space: all'
- add:
    entry:
      id: cal.1964-03-18.civil-rights-bill
      when: Mar. 18
      date: '1964-03-18'
      thread: civil-rights-bill
      c: 'Fulbright''s turn in the filibuster: the North imposing on the South an ethic it will not keep itself; the race
        problem national. The South''s burden, after Woodward: "Each carries a catalog of things not to be mentioned." Racial
        problems yield "ultimately to the slow conversions of the human heart and mind."'
      n: '[[w.woods-fulbright]], 330. Check: the words, in the Record not read. To check: 110 Cong. Rec. 5639 (Senate, Mar.
        18, 1964) (cited by [[w.woods-fulbright]], 330 nn.20–21). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
