      when: July 31
      date: '1963-07-31'
      thread: congress
      also:
      - middle-east
      c: 'Foreign Relations'' hearings on the nondiplomatic agents: Isadore Hamlin, executive director, and Boukstein of
        the Jewish Agency-American Section, in closed session; no transcript released. The White House, through Symington,
        has had a majority keep them in executive session.'
      n: 'Daily Digest, [109 Cong. Rec. D368](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=366).
