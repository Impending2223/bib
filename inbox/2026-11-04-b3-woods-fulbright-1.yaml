      id: cal.1965-04-28.latin-america-dominican-republic-2
      when: Apr. 28
      date: '1965-04-28'
      thread: latin-america-dominican-republic
      c: 'Evening, the Cabinet Room: Johnson and his advisers with the congressional leaders. Rusk: the landing to protect
        American lives. Raborn: three of the rebels'' ringleaders "Castro-trained agents." Dirksen and McCormack for intervening.
        Fulbright: bring in the OAS. Will the troops stay? Johnson: that bridge not yet crossed.'
      n: '[[w.woods-fulbright]], 376. To check: Meeting with Congressional Leadership on Dominican Republic, Apr. 28, 1965,
        Meeting Notes File, box 1, Johnson Papers (cited by [[w.woods-fulbright]], 376 n.2). See [[cal.1965-04-28.latin-america]].
        Names: Johnson, Rusk, Raborn, Dirksen, McCormack, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:raborn-william-f-jr
      - name:dirksen-everett
      - name:mccormack-john-w
