      thread: elections-1962
      c: 'Kennedy at the Fort Smith airport, eight minutes: Fulbright "has worked for a strong United States in a peaceful
        world and also spoken for the interests of Arkansas." Fort Chaffee to be reopened.'
      n: 'Remarks at the Airport at Fort Smith, Arkansas, [1961 Pub. Papers 688](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=746)
