      id: cal.1965-09-14.latin-america-dominican-republic
      when: Sept. 14
      date: '1965-09-14'
      thread: latin-america-dominican-republic
      c: 'Bundy to Johnson: friendly newspapermen say Fulbright will indict the Dominican intervention tomorrow, hard on
        Bennett. Fulbright''s staff divided two days: Holt and Tillman, its drafter, for; Lee Williams and Marcy against.
        Fulbright: "All I want to know, Carl, is whether you think this is a fair statement." An advance copy to the White
        House, hours ahead.'
      n: '[[w.woods-fulbright]], 384. To check: Bundy to Johnson, Sept. 14, 1965, NSF, Memos to the President, Bundy, box
        4, Johnson Papers; Seth Tillman, interview by Woods, Oct. 6, 1988; Lee Williams, interview by Woods, June 20, 1989;
        Carl Marcy, oral history, 165–66 (cited by [[w.woods-fulbright]], 384 nn.28–32). See [[cal.1965-09-15.latin-america]].
        Names: Bundy, Johnson, Fulbright, Bennett, Marcy.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:bennett-w-tapley-jr
      - name:marcy-carl
