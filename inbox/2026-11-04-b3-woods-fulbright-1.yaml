        Kerr. Robert Kennedy: "if you do you will not get one damn thing out of us for patronage. ... We like you, Orval,
        but in Arkansas—not in the Senate." Kerr: "as isolated as a Baptist in Miami Beach."'
      n: '[[w.woods-fulbright]], 298. Check: the day; Woods has it shortly after Fort Smith. To check: "J. William Fulbright:
        Freedom''s Judas-Goat" (Liberty Lobby, 1965); "Kennedy Is Fearful of Fulbright''s Defeat," *Pontiac Press*, Dec.
        8, 1961 (cited by [[w.woods-fulbright]], 298 n.93). See [[cal.1961-10-29.elections-1962]]. Names: Kerr, Faubus,
        Kennedy, Robert Kennedy.'
