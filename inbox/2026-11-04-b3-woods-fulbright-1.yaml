        "soft on communism" issue to be taken from Goldwater. Fulbright: "I didn''t suspect that he was misleading us."'
      n: '[[w.woods-fulbright]], 348. To check: J. William Fulbright, interview by Charles Morrissey, "Modern Congress in
        American History," Library of Congress, 22 (cited by [[w.woods-fulbright]], 348 n.22); [[w.berman-william-fulbright-and-the]],
        22 (cited by [[w.woods-fulbright]], 348 n.21). Names: Fulbright, Johnson, Khánh, Ball, Goldwater.'
