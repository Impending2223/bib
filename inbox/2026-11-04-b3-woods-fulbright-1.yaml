# Batch 3 (Nov. 4, 2026), reader "advisers": Woods, *Fulbright: A Biography* (1995; w.woods-fulbright), the owner's
# copy (archive.org's scan, its OCR layer; printed page = PDF page - 26), read against the calendar from 1960 (p. 250)
# on. The calendar's cites held up (R33); new entries claimed in the ledger under this patch's name; the rest
# additive. The ids of b3-woods-2, -3 and -4 (Woods's 1998 book) are merged. The book-check:
# notes/book-checks/woods-fulbright.md. Witnesses: inbox/witnesses/ under this patch's name.
patch: b3-woods-fulbright-1
by: 'Claude (batch 3, advisers group; Woods, Fulbright: A Biography)'
ops:
- add:
    entry:
      id: cal.1960-01-14.elections-1960-2
      when: Jan. 14
      date: '1960-01-14'
      thread: elections-1960
      c: 'Fulbright to McCallum, his old tutor: Johnson "probably the best qualified man" but "from the wrong part of the
        country"; Kennedy able, young, unlikely to hold his lead; Humphrey anathema to the South; Symington the likeliest
        compromise.'
      n: '[[w.woods-fulbright]], 253. To check: Fulbright to McCallum, Jan. 14, 1960, BCN 105, F54, SPF (cited by [[w.woods-fulbright]],
        253 n.24). Names: Fulbright, Johnson, Kennedy, Humphrey, Symington.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - name:symington-william-s
- src:
    id: cal.1960-01-14.elections-1960-2
    rows:
    - 'w.woods-fulbright 253: all'
    - 'via x.1960-01-14.fulbright-to-mccallum: all'
- add:
    entry:
      id: cal.1960-05-11.soviet-union-u2-2
      when: May 11
      date: '1960-05-11'
      thread: soviet-union-u2
      c: 'Eisenhower''s news conference opens with a statement on the U-2: since the start of his administration he has
        directed the gathering of intelligence against surprise attack. "No one wants another Pearl Harbor." The flights
        "a distasteful but vital necessity."'
      n: 'The President''s News Conference, [1960–61 Pub. Papers 403](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=455)
        (May 11, 1960). [[w.woods-fulbright]], 251 (his responsibility taken publicly). See [[cal.1960-05-01.soviet-union]].
        Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- src:
    id: cal.1960-05-11.soviet-union-u2-2
    rows:
    - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=455: all'
    - 'w.woods-fulbright 251: A, C'
- add:
    entry:
      id: cal.1960-05-12.middle-east
      when: May 12
      date: '1960-05-12'
      thread: middle-east
      c: Fulbright leaves on a speaking tour of the Middle East, set for ten days.
      n: '[[w.woods-fulbright]], 251. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1960-05-12.middle-east
    rows:
    - 'w.woods-fulbright 251: all'
- add:
    entry:
      id: cal.1960-05-16.soviet-union-u2-4
      when: May 16
      date: '1960-05-16'
      thread: soviet-union-u2
      c: 'Herter telephones Fulbright in Cairo: join the delegation in Paris. Fulbright flies in on a jet sent for him;
        the summit already wrecked. He cancels the rest of the tour and flies home with Herter.'
      n: '[[w.woods-fulbright]], 251. To check: *Washington Evening Star*, May 22, 1960 (cited by [[w.woods-fulbright]],
        251 n.20). See [[cal.1960-05-12.middle-east]]. Names: Herter, Fulbright.'
      tags:
      - name:fulbright-j-william
      - name:herter-christian-a
- src:
    id: cal.1960-05-16.soviet-union-u2-4
    rows:
    - 'w.woods-fulbright 251: all'
    - 'via x.1960-05-22.washington-evening-star-fulbright: all'
- add:
    entry:
      id: cal.1960-05-21.soviet-union-u2
      when: May 21
      date: '1960-05-21'
      thread: soviet-union-u2
      c: 'Fulbright, the day after his return from Paris, to reporters: he will ask the Senate to let Foreign Relations
        look into the U-2 affair. "Good for the soul of the country to get an understanding of what happened."'
      n: '[[w.woods-fulbright]], 251. Check: the day; Woods cites the *Washington Post* of May 22. To check: Warren Duffee,
        "Fulbright Calls for U-2 Probe," *Washington Post*, May 22, 1960 (cited by [[w.woods-fulbright]], 251 n.21). Inquiry:
        [[cal.1960-05-27.soviet-union]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1960-05-21.soviet-union-u2
    rows:
    - 'w.woods-fulbright 251: all'
    - 'via x.1960-05-22.duffee-fulbright-calls-for-u2-probe: all'
- add:
    entry:
      id: cal.1960-05-23.republican-party
      when: May 23
      date: '1960-05-23'
      thread: republican-party
      also:
      - soviet-union-u2
      c: Dirksen answers Fulbright's call for an inquiry by blaming the summit's collapse on Stevenson, "soft on communism"
        for urging talks on Berlin.
      n: '[[w.woods-fulbright]], 251–52. Check: the day; Woods cites the *Arkansas Gazette* of May 24. To check: "GOP Charges
        Adlai Scuttled Summit," *Arkansas Gazette*, May 24, 1960 (cited by [[w.woods-fulbright]], 252 n.22). See [[cal.1960-05-21.soviet-union-u2]].
        Names: Dirksen, Stevenson, Fulbright.'
      tags:
      - name:dirksen-everett
      - name:stevenson-adlai-e
      - name:fulbright-j-william
