    - 'via x.1961-08-04.investigation-urged-on-fulbright-memo: all'
- add:
    entry:
      id: cal.1961-08.right-and-the-military
      when: Aug., early
      date: '1961-08'
      thread: right-and-the-military
      also:
      - elections-1962
      c: 'Representative Dale Alford of Arkansas: Fulbright''s memorandum "a clandestine assault on the very foundations
        of our system of government."'
      n: '[[w.woods-fulbright]], 295. Check: the day. To check: E. W. Kenworthy, "Alford Scores Fulbright''s Memo," *New
        York Times*, Aug. 8, 1961 (cited by [[w.woods-fulbright]], 295 n.76). Names: Alford, Fulbright.'
      tags:
      - name:alford-thomas-d
      - name:fulbright-j-william
      - state:ar
- src:
