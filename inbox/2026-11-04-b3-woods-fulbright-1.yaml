- add:
    entry:
      id: cal.1960-03.governors
      when: Mar., late
      date: '1960-03'
      thread: governors
      c: Fulbright and Harriman agree that McMath should be pressed to run against Faubus for governor; Truman, who thinks
        Faubus a disgrace to the party, to ask him. McMath declines.
      n: '[[w.woods-fulbright]], 293–94. Check: the day. To check: Fulbright to Truman, Mar. 31, 1960, PPNF, Truman Papers
        (cited by [[w.woods-fulbright]], 294 n.70). Names: Fulbright, Harriman, McMath, Faubus, Truman.'
      tags:
