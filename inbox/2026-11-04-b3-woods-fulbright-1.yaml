    id: cal.1961-09-20.right-and-the-military
    rows:
    - 'w.woods-fulbright 286–87: all'
    - 'via x.1961-09-20.muzzling-probe-set: A'
- add:
    entry:
      id: cal.1961-10-01.right-and-the-military
      when: Oct. 1
      date: '1961-10-01'
      thread: right-and-the-military
      also:
      - press-and-broadcasting
      c: 'E. W. Kenworthy, "Fulbright Becomes a National Issue," in the *New York Times Magazine*. Lee Williams to Fulbright,
        quoted: he has roused "practically every organized segment" of opinion against him, Birchers to farmers'' cooperatives.'
      n: '[[w.woods-fulbright]], 286, 291. To check: E. W. Kenworthy, "Fulbright Becomes a National Issue," *New York Times
        Magazine*, Oct. 1, 1961, 21, 89, 92, 96–97 (cited by [[w.woods-fulbright]], 286 n.39, 291 n.58). See [[cal.1961-07-24.goldwater-2]].
        Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
