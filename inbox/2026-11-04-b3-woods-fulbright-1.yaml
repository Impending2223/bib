- add:
    entry:
      id: cal.1961-04-21.right-and-the-military
      when: Apr. 21
      date: '1961-04-21'
      thread: right-and-the-military
      c: 'Willard Hawkins reports to Fulbright on three Strategy for Survival conferences just held in Little Rock, Fort
        Smith and Fayetteville, Ark.: 1,400, 1,000, some 100. Active-duty officers with the Freedom Forum; Benson and Ganus
        of Harding College. Ganus: Representative Trimble has voted "eighty-nine percent of the time to aid and abet the
        Communist Party."'
      n: '[[w.woods-fulbright]], 279. To check: Hawkins to Fulbright, Apr. 21, 1961, Series 4:19, Box 26:1, SPF (cited by
        [[w.woods-fulbright]], 279 n.13). Names: Fulbright, Trimble.'
      tags:
      - name:fulbright-j-william
      - name:trimble-james-w
      - state:ar
- src:
    id: cal.1961-04-21.right-and-the-military
    rows:
    - 'w.woods-fulbright 279: all'
    - 'via x.1961-04-21.hawkins-to-fulbright: all'
- add:
    entry:
      id: cal.1961-05-31.right-and-the-military
      when: May 31
      date: '1961-05-31'
      thread: right-and-the-military
      also:
      - defense
      c: 'A Defense Department directive: its officials'' public statements limited to defense matters.'
      n: '[[w.woods-fulbright]], 284. Check: the day; Woods has McNamara order it in May and cites the directive of May
        31. To check: Department of Defense Directive, May 31, 1961, Series 4:19, Box 26:5, SPF (cited by [[w.woods-fulbright]],
        284 n.28). Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
