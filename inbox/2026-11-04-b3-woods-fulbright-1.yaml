      date: '1962-09-21'
      thread: elections-1962
      c: 'Fulbright at the Hotel Milner-Noble in Jonesboro, Ark., an overflow crowd: "I''m for the right ''isms''": "cotton-ism,
        rice-ism, river-ism, poultry-ism ... capitalism and above all, Arkansas-ism." Hargis and Courtney send literature
        against him.'
      n: '[[w.woods-fulbright]], 299–300. Check: the day; Woods cites the *Arkansas Gazette* of Sept. 22. To check: Roy
