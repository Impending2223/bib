        to Holt. Feb. 15, the Fulbrights leave for the Interparliamentary Union's meeting in Bermuda, golf and sun.
      n: '[[w.woods-fulbright]], 297. Check: the day of the word; Woods has it in February. To check: Marcy to Holt, Feb.
