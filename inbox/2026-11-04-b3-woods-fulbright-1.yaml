    - 'w.woods-fulbright 256: all'
- add:
    entry:
      id: cal.1960-11.transition-and-staff-cabinet-2
      when: Nov., last week
      date: '1960-11'
      thread: transition-and-staff-cabinet
      c: 'Reuther in Washington, lobbying the President-elect''s circle against Fulbright for State: a "segregationist who
        would hurt our international relations."'
      n: '[[w.woods-fulbright]], 258. To check: *Kansas City Star*, Dec. 1, 1960 (cited by [[w.woods-fulbright]], 258 n.41).
        Names: Reuther, Fulbright.'
      tags:
      - name:reuther-walter
      - name:fulbright-j-william
- src:
    id: cal.1960-11.transition-and-staff-cabinet-2
    rows:
    - 'w.woods-fulbright 258: all'
    - 'via x.1960-12-01.kansas-city-star-reuther: all'
- add:
    entry:
      id: cal.1960-12-01.transition-and-staff-cabinet-2
      when: Dec. 1
      date: '1960-12-01'
      thread: transition-and-staff-cabinet
      also:
      - civil-rights-organizations
      c: 'The NAACP''s John A. Morsell, in a statement: Fulbright as Secretary of State "one of the most colossal blunders
        of any administration." He asks a national campaign against any signer of the Southern Manifesto in the Cabinet.'
      n: '[[w.woods-fulbright]], 257. To check: "NAACP Opposes Post for Senator," *Arkansas Democrat*, Dec. 1, 1960; Gloria
        Newton to Kennedy, Dec. 8, 1960, Fulbright Name File, Kennedy Papers (cited by [[w.woods-fulbright]], 258 n.38).
        See [[cal.1960-12-01.transition-and-staff-2]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1960-12-01.transition-and-staff-cabinet-2
    rows:
    - 'w.woods-fulbright 257: all'
    - 'via x.1960-12-01.naacp-opposes-post-for-senator: all'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet-7
      when: Dec.
      date: '1960-12'
      thread: transition-and-staff-cabinet
      c: 'Fulbright, by telephone, asks Russell, bound for Palm Beach, to tell Kennedy he does not want State: more use
        as chairman, and his successor in the Senate likely Faubus. By Holt''s recollection.'
      n: '[[w.woods-fulbright]], 256. Check: the day; Woods sets it after the London conference and before Christmas. To
        check: Pat M. Holt, oral history, 149–50, Senate Historical Office; Jack Yingling, interview by Woods, Oct. 12,
        1988 (cited by [[w.woods-fulbright]], 256 nn.31–32). Names: Fulbright, Russell, Kennedy, Faubus.'
      tags:
      - name:fulbright-j-william
      - name:russell-richard-b
      - name:faubus-orval-e
- src:
    id: cal.1960-12.transition-and-staff-cabinet-7
    rows:
    - 'w.woods-fulbright 256: all'
    - 'via x.undated.ritchie-holt-oral-history: all'
    - 'via x.1988-10-12.woods-interview-yingling: all'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet-8
      when: Dec.
      date: '1960-12'
      thread: transition-and-staff-cabinet
      c: 'Kennedy, at Palm Beach, telephones Fulbright at Little Rock: he will name Rusk. He asks Fulbright down to talk
        of appointments and policy.'
      n: '[[w.woods-fulbright]], 259. Check: the day. To check: Clara Buchanan, interview by Woods, June 7, 1989 (cited
        by [[w.woods-fulbright]], 259 n.46). See [[cal.1960-12-12.transition-and-staff-cabinet]]. Names: Kennedy, Fulbright,
        Rusk.'
      tags:
      - name:kennedy-john-f
      - name:fulbright-j-william
      - name:rusk-dean
- src:
    id: cal.1960-12.transition-and-staff-cabinet-8
    rows:
    - 'w.woods-fulbright 259: all'
    - 'via x.1989-06-07.woods-interview-buchanan: A'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-3
      when: Dec., last week
      date: '1960-12'
      thread: transition-and-staff
      c: 'Fulbright and Kennedy at golf: a summit with Khrushchev in 1961; a body to reach the young of the developing nations;
        fewer troops in Europe, for the gold. Kennedy commits the government to buy Reynolds Aluminum''s 1961 output. Fulbright
        urges Ball for Under Secretary, Reischauer for Tokyo.'
      n: '[[w.woods-fulbright]], 259, 261. Check: the day, and whether at Palm Beach; Woods has them corresponding, talking
        and at golf the last week of December and the first of January, and Kennedy''s father telling Fulbright at Palm
        Beach of the liberals'', the NAACP''s and the Zionists'' protests. To check: "During Talks with President-Elect
        Kennedy Fulbright Hits on Arkansas Topics," *Northwest Arkansas Times*, Dec. 30, 1960; Marcy to Fulbright, Dec.
        27, 1960, Series 48:7, Box 1:2, SPF (cited by [[w.woods-fulbright]], 261 nn.1, 3). See [[cal.1961-01.transition-and-staff]].
        Names: Fulbright, Kennedy, Khrushchev, Ball, Reischauer.'
      tags:
      - name:fulbright-j-william
      - name:kennedy-john-f
      - name:ball-george-w
      - name:reischauer-edwin-o
