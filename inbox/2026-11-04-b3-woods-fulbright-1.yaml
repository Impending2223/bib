    rows:
    - 'w.woods-fulbright 294: all'
    - 'via x.1960-05-21.erickson-to-fulbright: all'
- add:
    entry:
      id: cal.1960-06.governors
      when: June
      date: '1960-06'
      thread: governors
      c: Lee Williams, through McMath and Brooks Hays, raises tens of thousands of dollars in New York for the candidates
        against Faubus, running short before the primary of July 26.
      n: '[[w.woods-fulbright]], 294–95. To check: Williams to Fulbright, June 2 and 20, 1960; Williams to Marcy, June 20,
        1960, Williams Papers (cited by [[w.woods-fulbright]], 295 n.74). See [[cal.1960-04-21.governors]]. Names: McMath,
        Faubus.'
      tags:
      - name:mcmath-sidney-s
