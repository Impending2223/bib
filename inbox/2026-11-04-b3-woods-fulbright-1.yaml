- add:
    entry:
      id: cal.1962-10-21.missile-crisis-4
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      c: 'Late in the day the White House calls Fulbright, touring Arkansas: to Little Rock, an Air Force plane to bring
        him to Washington. From Little Rock he tells Tillman, of Foreign Relations'' staff, to draft him a memorandum. Tillman,
        from the papers and the Record: a force landed to take out the missiles, the Soviets let stand aside.'
      n: '[[w.woods-fulbright]], 271, 274. To check: Seth Tillman, interview by Woods, Oct. 6, 1988 (cited by [[w.woods-fulbright]],
        273–74 nn.37, 40). Meeting: [[cal.1962-10-22.missile-crisis-4]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1962-10-21.missile-crisis-4
    rows:
    - 'w.woods-fulbright 271, 274: all'
    - 'via x.1988-10-06.woods-interview-tillman: B-C'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-7
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - elections-1962
      c: 'Fulbright to reporters, on word that he urged an invasion: a Soviet ship running the blockade, or a boarding,
        would bring the two powers into direct conflict; his course the safer.'
      n: '[[w.woods-fulbright]], 273. Check: the day; Woods cites the *Arkansas Gazette* of Oct. 28. To check: Ned Curran,
        "Fulbright Switch? No Such Thing, Says the Senator," *Arkansas Gazette*, Oct. 28, 1962 (cited by [[w.woods-fulbright]],
        273 n.36). See [[cal.1962-10-22.missile-crisis-4]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
