- edit:
    id: cal.1965-06-17.vietnam-congress
    base: 1cb12ec3
    set:
      c: 'Johnson''s news conference, asked whether he will go back to Congress for another resolution: the Tonkin resolution
        "just an expression"; "the authority of the President is very clear and unquestioned without a resolution." On the
        Dominican Republic: "some 1,500 innocent people were murdered and shot, and their heads cut off" before the landing;
        the ambassador "talking to us from under a desk while bullets were going through his windows."'
      n: 'The President''s News Conference, [1965 Pub. Papers 669](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=143)
        (June 17, 1965). [[w.gibbons-u-s-government-and]], III, 283–84 (the resolution). [[w.woods-fulbright]], 381 (the
        Dominican Republic). Names: Johnson.'
      also:
      - latin-america-dominican-republic
