- add:
    entry:
      id: cal.1961-05-04.cuba-bay-of-pigs-2
      when: May 4
      date: '1961-05-04'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Rowland Evans, the *New York Herald Tribune*, the front page: Fulbright and the White House at "a highly sensitive
        stage."'
      n: '[[w.woods-fulbright]], 270. To check: Rowland Evans, "Why Fulbright''s Glaring at the White House," *New York
        Herald Tribune*, May 4, 1961 (cited by [[w.woods-fulbright]], 270 n.26). See [[cal.1961-05-02.cuba-bay-of-pigs]].
        Names: Evans, Fulbright.'
      tags:
      - name:evans-rowland-jr
      - name:fulbright-j-william
