      when: July
      date: '1965-07'
      thread: vietnam-congress
      c: 'Marcy to Fulbright, from his sources in the executive and Kenworthy of the *Times*: "We seem to be on the verge
        of another important decision regarding Vietnam, one on which the views of the Senate will not be sought until after
        the decision. There is now a last chance."'
      n: '[[w.woods-fulbright]], 373. Check: the day. To check: Marcy to Fulbright, July 1965, Marcy Papers, box 5, folder
        July (cited by [[w.woods-fulbright]], 373 n.43). Names: Marcy, Fulbright.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
