      date: '1965-08-01'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'The Fulbrights at dinner with the Johnsons, a Sunday. Johnson to Betty Fulbright: Rio next weekend, Air Force
        One, jewels cheap in Brazil. The next morning Fulbright asks Marcy along.'
      n: '[[w.woods-fulbright]], 382. Check: the day; Woods has Monday of the first week in August for the call to Marcy.
        To check: Carl Marcy, oral history, 162–63, Senate Historical Office (cited by [[w.woods-fulbright]], 382 n.21).
