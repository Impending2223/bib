    entry:
      id: cal.1961-05-04.cuba-bay-of-pigs-3
      when: May 4
      date: '1961-05-04'
      thread: cuba-bay-of-pigs
      c: Fulbright an hour with Kennedy, the evening; to reporters afterward, the two in accord.
      n: 'Kennedy at his news conference the next day: "Senator Fulbright and I spent an hour together last evening," [1961
        Pub. Papers 354](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=412) (May 5, 1961).
        [[w.woods-fulbright]], 270. Names: Fulbright, Kennedy.'
      tags:
      - name:fulbright-j-william
      - name:kennedy-john-f
