- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-2
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: Fulbright and Holt, flying home with Dillon from the Inter-American Development Bank's meeting at Rio, learn at
        an air base in Puerto Rico that the exiles have landed. From Kennedy's press conference they had thought it called
        off.
      n: '[[w.woods-fulbright]], 269. Check: the day. To check: Pat M. Holt, oral history, 153, Senate Historical Office
        (cited by [[w.woods-fulbright]], 269 n.22). Names: Fulbright, Dillon.'
      tags:
      - name:fulbright-j-william
      - name:dillon-c-douglas
