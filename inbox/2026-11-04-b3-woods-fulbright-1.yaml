      thread: voting-rights
      c: 'The "Old Dixie Study Group," Southern members of both houses, in the Rules Committee''s hearing room: Howard Smith
        on "The Lynching of Orderly Process"; Thurmond on filibustering''s physical trials, with the "leg-strap" device;
        Rivers, John Bell Williams and Dale Alford sing as the "White Citizens Council Quartet."'
      n: '[[w.woods-fulbright]], 301. To check: Old Dixie Study Group, Feb. 20, 1960, Civil Rights, Russell Papers (cited
        by [[w.woods-fulbright]], 301 n.104). See [[cal.1960-02.voting-rights]]. Names: Howard W. Smith, Thurmond, Rivers,
        Williams, Alford.'
