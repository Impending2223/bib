    - 'via x.1961-09.mcnamara-backs-review-arkansas-democrat: C'
    - 'via x.1961-09-18.pearson-drive-on-fulbright-boomerangs: D'
- add:
    entry:
      id: cal.1961-09-20.right-and-the-military
      when: Sept. 20
      date: '1961-09-20'
      thread: right-and-the-military
      c: 'The Senate approves Thurmond''s resolution: Armed Services to study censorship and the military''s anti-communist
        seminars, a "study and appraisal," not an investigation. Russell names a subcommittee: Stennis, Thurmond, Symington.'
      n: '[[w.woods-fulbright]], 286–87. Check: the day, against the Record; Woods cites the *Arkansas Democrat* of Sept.
        20. To check: "Muzzling Probe Set," *Arkansas Democrat*, Sept. 20, 1961 (cited by [[w.woods-fulbright]], 287 n.42).
        Hearings: [[cal.1962-01-23.right-and-the-military]]. Names: Thurmond, Russell, Stennis, Symington.'
      tags:
      - name:thurmond-strom
      - name:russell-richard-b
      - name:stennis-john-c
      - name:symington-william-s
