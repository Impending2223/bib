      when: Aug. 2
      date: '1961-08-02'
      thread: berlin-and-vienna
      c: 'The storm over Fulbright''s word on the refugees. Brandt: he must have been misquoted. Rusk: Berlin''s status
        not negotiable; no treaty recognizing the East German regime.'
      n: '[[w.woods-fulbright]], 316. Check: the days; Woods cites the *Arkansas Gazette* of Aug. 3. To check: "Fulbright
