      when: Mar. 14
      date: '1965-03-14'
      thread: vietnam-congress
      c: 'Fulbright on *Meet the Press*: the air raids necessary; the situation so critical that a debate in the committee
        or the Congress would be dangerous.'
      n: 'The program: the Library of Congress''s inventory of Spivak''s photographs, LOT 13025-805 (the guest). [[w.woods-fulbright]],
        366 (what he said). To check: *Meet the Press*, transcript, Mar. 14, 1965, vol. 9, no. 9, Merkle Press (cited by
        [[w.woods-fulbright]], 366 n.23). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
