      id: cal.1965-04-07.vietnam-2
      when: Apr. 7
      date: '1965-04-07'
      thread: vietnam
      c: 'Afternoon. Johnson asks Eugene Black of the World Bank to run the Mekong project; Black, too busy, gives in. Bundy:
        Black, Fulbright''s friend, will "neutralize Fulbright."'
      n: '[[w.woods-fulbright]], 368. To check: Kathleen J. Turner, *Lyndon Johnson''s Dual War* (1985), 127 (cited by [[w.woods-fulbright]],
        368 n.29). See [[cal.1965-04-07.vietnam-congress-2]]. Names: Johnson, Black, Bundy, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:black-eugene-r
