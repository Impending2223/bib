- add:
    entry:
      id: cal.1961-05-02.cuba-bay-of-pigs
      when: May 2
      date: '1961-05-02'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Lippmann''s column: Fulbright warned the President to contain Castro, not oust him. "Senator Fulbright was the
        only wise man in the lot." Krock writes the like in the *Times*.'
      n: '[[w.woods-fulbright]], 269–70. To check: Walter Lippmann, "Today and Tomorrow," *Washington Post*, May 2, 1961
        (cited by [[w.woods-fulbright]], 269 n.25). Check: Krock''s column and its day. Names: Lippmann, Fulbright, Castro,
        Krock.'
      tags:
      - name:lippmann-walter
      - name:fulbright-j-william
      - name:castro-fidel
      - name:krock-arthur
