    entry:
      id: cal.1965-07-13.vietnam-congress
      when: July 13
      date: '1965-07-13'
      thread: vietnam-congress
      also:
      - vietnam-july-decision
      c: 'Fulbright, after talks with Lippmann through early July, for an enclave strategy: American troops drawn back to
        strong points with their backs to the sea, denying Hanoi and the Viet Cong all of Vietnam, until they negotiate.'
      n: '[[w.woods-fulbright]], 373–74. Check: the day; Woods cites the *Arkansas Gazette* of July 14. To check: "Two Alternatives
        in Vietnam War," *Arkansas Gazette*, July 14, 1965 (cited by [[w.woods-fulbright]], 373 n.44). Names: Fulbright,
        Lippmann.'
      tags:
      - name:fulbright-j-william
      - name:lippmann-walter
