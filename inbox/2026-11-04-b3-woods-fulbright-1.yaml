- add:
    entry:
      id: cal.1963-12.assassination
      when: Dec., first week
      date: '1963-12'
      thread: assassination
      c: 'Fulbright to the Rockefeller Public Service Awards luncheon at the Shoreham: a strain of intolerance and violence;
        "the cruel bigotry of race that leads to such tragedies as the killing of Negro children in a church in Alabama."
        The assassination "vigilante justice." A standing ovation, McCloy and David Rockefeller among those rising.'
      n: '[[w.woods-fulbright]], 323. Check: the day; Woods cites the text in the Record of Dec. 6. To check: 109 Cong.
        Rec. 23726–28 (Senate, Dec. 6, 1963); Henry Wriston to Fulbright, Dec. 13, 1963, Series 48:1, Box 5:5, SPF (cited
        by [[w.woods-fulbright]], 323 nn.7–8). Names: Fulbright, McCloy, David Rockefeller.'
      tags:
      - name:fulbright-j-william
      - name:mccloy-john-j
      - name:rockefeller-david
