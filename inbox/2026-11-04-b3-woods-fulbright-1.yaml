      when: Oct. 3
      date: '1963-10-03'
      thread: assassination
      also:
      - elections-1964
      c: 'Kennedy dedicates Greers Ferry Dam at Heber Springs, Ark. Driving from Little Rock, Fulbright begs him to keep
        out of Dallas: "Dallas is a very dangerous place. I wouldn''t go there and don''t you go." Kennedy: he cannot seem
        to be running scared.'
      n: 'Remarks in Heber Springs, Arkansas, at the Dedication of Greers Ferry Dam, [1963 Pub. Papers 760](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=818)
        (Oct. 3, 1963) (the day). [[w.woods-fulbright]], 321–22 (Fulbright''s warning). Woods has it in early November.
        To check: Fred Livingston to Robert S. McCord, Mar. 31, 1969, Series 48:1, Box 9:3, SPF (cited by [[w.woods-fulbright]],
        322 n.2). Names: Kennedy, Fulbright.'
      tags:
