      when: Apr. 20
      date: '1965-04-20'
      thread: vietnam-congress
      c: 'Marcy to Fulbright, after Rusk brushes off his call for a pause: "I think the time has come for Mr. Rusk to go."
        Johnson "a babe in the woods in the field of foreign policy."'
      n: '[[w.woods-fulbright]], 369. To check: Marcy to Fulbright, Apr. 20, 1965, Marcy Papers, box 5, folder Apr. (cited
