      when: July 3
      date: '1961-07-03'
      thread: berlin-and-vienna
      c: 'Fulbright to Rusk, after a memorandum of Lippmann''s: answer Khrushchev''s ultimatum by making West Berlin a free
        city under the UN, without nuclear weapons, NATO and UN forces left in it, access guaranteed. No answer.'
      n: '[[w.woods-fulbright]], 315. To check: Walter Lippmann, memorandum on Berlin, June 7, 1961; Fulbright to Rusk,
        July 3, 1961, Series 48:16, SPF (cited by [[w.woods-fulbright]], 315 n.38). Names: Fulbright, Rusk, Lippmann, Khrushchev.'
      tags:
