      date: '1963-09-10'
      thread: congress
      c: 'Fulbright and Hickenlooper''s amendments to the Foreign Agents Registration Act: no political contributions by
        foreign governments or companies through their agents; full disclosure to Justice; agents to name their principals
        to members.'
      n: '[[w.woods-fulbright]], 311. Check: the day and the bill''s course; Woods has them carried in September. To check:
