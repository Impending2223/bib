        box 8, Johnson Papers; Marcy to Fulbright, May 12, 1966, Marcy Papers, box 6, folder May; Marcy to Fulbright, May
        16, 1966, Series 48:4, Box 19:1, SPF (cited by [[w.woods-fulbright]], 419–20 nn.15–16). See [[cal.1966-05-10.vietnam]].
