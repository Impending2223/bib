- add:
    entry:
      id: cal.1963-11-19.space
      when: Nov. 19
      date: '1963-11-19'
      thread: space
      c: 'Fulbright in the Senate against the moon race: its $35 billion would build ten TVAs. "At the risk of being considered
        something of a troglodyte, I cannot bring myself to believe that going to the moon is essential simply because it
        is new and creative and adventurous."'
      n: '[[w.woods-fulbright]], 327–28. Check: the day of the words; Woods cites the Record of Nov. 19, 1963, 22361, and
        of June 24, 1964, 14871–73, not read. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
