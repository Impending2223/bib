      when: Oct.
      date: '1962-10'
      thread: robert-kennedy
      also:
      - congress
      c: 'Fulbright, Aiken and Hickenlooper agree to press on: the administration to enforce the Foreign Agents Registration
        Act. Pincus, at Fulbright''s bidding, to Robert Kennedy, dressing for dinner: six months to indict Igor Cassini,
        or Foreign Relations will hold public hearings. Two days later Justice sends an agent to Santo Domingo; the documents
        refused him.'
      n: '[[w.woods-fulbright]], 307–08. Check: the day; Woods has it in the missile crisis. To check: Walter Pincus, interview
        by Woods, Mar. 11, 1990 (cited by [[w.woods-fulbright]], 308 n.10). See [[cal.1962-10.latin-america]]. Names: Fulbright,
        Aiken, Hickenlooper, Robert Kennedy.'
