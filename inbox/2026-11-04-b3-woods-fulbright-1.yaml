- add:
    entry:
      id: cal.1961-05-05.cuba-bay-of-pigs
      when: May 5
      date: '1961-05-05'
      thread: cuba-bay-of-pigs
      c: 'Kennedy''s news conference, asked whether Fulbright''s frank statements embarrass him: no; they have talked five
        times in four or five weeks. "I think his counsel is useful and I think that he should say what he thinks."'
      n: 'The President''s News Conference, [1961 Pub. Papers 354](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=412)
        (May 5, 1961). [[w.woods-fulbright]], 270. To check: Leslie Carpenter, "Fulbright Rates High in Councils at White
        House," *Arkansas Gazette*, May 21, 1961 (cited by [[w.woods-fulbright]], 270 n.27). See [[cal.1961-05-04.cuba-bay-of-pigs-3]].
        Names: Kennedy, Fulbright.'
      tags:
      - name:kennedy-john-f
      - name:fulbright-j-william
