- add:
    entry:
      id: cal.1960-07-05.elections-1960-2
      when: July 5
      date: '1960-07-05'
      thread: elections-1960
      c: 'Fulbright writes every delegate to the Democratic convention for Johnson: "the energy, experience and mature judgment
        which our candidate and our President must have." Marcy and Foreign Relations'' staff have drafted Johnson''s speeches
        on foreign policy.'
      n: '[[w.woods-fulbright]], 253. To check: Fulbright to the delegates, July 5, 1960, Marcy Papers, box 3 (cited by
        [[w.woods-fulbright]], 253 n.25); Marcy to Johnson, June 24, 1960, Marcy Papers, box 3 (cited by [[w.woods-fulbright]],
        253 n.26). See [[cal.1960-07-05.elections-1960]]. Names: Fulbright, Johnson, Marcy.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:marcy-carl
