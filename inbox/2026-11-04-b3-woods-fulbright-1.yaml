      date: '1961-03-17'
      thread: congress
      c: 'Marcy to Fulbright: the China, Spanish, Dominican and Vietnamese lobbies, often in the press, little known; the
        Foreign Agents Registration Act largely unenforced. Foreign Relations should look into them. "An investigation along
        these lines could be explosive in the extreme."'
      n: '[[w.woods-fulbright]], 305. To check: Marcy to Fulbright, Mar. 17, 1961, Marcy Papers, box 3 (cited by [[w.woods-fulbright]],
        305 n.3). Names: Marcy, Fulbright.'
