    rows:
    - 'w.woods-fulbright 401–02: all'
- add:
    entry:
      id: cal.1966-02-02.vietnam-hearings
      when: Feb. 2
      date: '1966-02-02'
      thread: vietnam-hearings
      also:
      - vietnam-congress
      c: Dirksen, at Johnson's behest, blocks Fulbright's request that Foreign Relations sit while the Senate sits. Fulbright
        and Marcy threaten evening hearings, in prime time; Dirksen backs down.
      n: '[[w.woods-fulbright]], 403. Check: the day; Woods cites the *Los Angeles Times* of Feb. 3. To check: "Senate Nears
