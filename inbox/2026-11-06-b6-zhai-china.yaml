      c: 'Peking, a mass rally against the bombing of the oil depots at Hanoi and Haiphong. Chen Yi: the Soviet Union seeks
        a relaxation of tensions in Europe so that the United States can "draw away forces to cope with the Vietnamese people."'
      n: '[[w.zhai-china-and-the-vietnam]], 165. To check: Chen Yi''s speech, quoted in [[w.zagoria-vietnam-triangle]], 144
