      c: 'New York, the Printing Week dinner. Goldberg, standing in for Rusk, on the quest for peace in Vietnam: 300 private
        talks for peace in 1965, 113 governments in their capitals. "There are a few voices that say America is engaged in
        a propaganda maneuver. When that voice comes from Peiping, it can be dismissed for what it is worth."'
      n: '"The Quest for Peace in Viet-Nam," [[w.department-of-state-bulletin]], [Feb. 7, 1966, 197–200](https://archive.org/details/departmentofstat541966unit/page/197/mode/1up).
        [[w.zhai-china-and-the-vietnam]], 166 n.46 (the quotation). Names: Goldberg, Rusk.'
      src:
        rows:
        - 'https://archive.org/details/departmentofstat541966unit/page/197/mode/1up: all'
        - 'w.zhai-china-and-the-vietnam 166 n.46: C'
        c: 5c1242f2
