      when: Mar.
      date: 1960-03
      thread: elections-1960
      c: 'Reedy to Johnson, a memorandum to read and destroy: a "hatchet job" on Kennedy, on the family name, Joseph Kennedy
        buying his son the White House. "Americans would bitterly resent the concept that the White House is a plaything to
        be handed out as a Christmas present." Johnson declines.'
      n: '[[w.shesol-mutual-contempt]], 30. To check: [[w.dallek-lone-star-rising]], 566 (cited by [[w.shesol-mutual-contempt]],
        30). Names: Reedy, Johnson, Kennedy, Joseph Kennedy. Check: the day.'
