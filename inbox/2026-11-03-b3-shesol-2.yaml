        lost, 51 to 12. Johnson to Reedy: "Screw ''em all, I''m sick and tired of this kind of nonsense."'
      n: '[[w.shesol-mutual-contempt]], 15. To check: [[w.dallek-lone-star-rising]], 562 (cited by [[w.shesol-mutual-contempt]],
