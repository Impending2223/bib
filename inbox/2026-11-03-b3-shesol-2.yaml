      when: July 12
      date: '1960-07-12'
      thread: elections-1960
      c: 'Tuesday evening, an elevator. Corcoran to Kennedy, apologizing for Johnson''s slurs on his father: "We''ve got to
        patch up this split between you and Lyndon"; the ticket would win the South. Kennedy: "Stop kidding, Tommy. Johnson
        will turn me down," but lets him try.'
      n: '[[w.shesol-mutual-contempt]], 44. To check: Corcoran, "Rendezvous with Democracy," c/12–14 (cited by [[w.shesol-mutual-contempt]],
        44). Names: Corcoran, Kennedy, Johnson.'
