        rows:
        - 'w.shesol-mutual-contempt 37–38: all'
        - 'via w.shesol-mutual-contempt 37 n.charged: A'
      tags:
      - 'name:kennedy-robert-f'
      - 'name:johnson-lyndon-b'
      - 'name:meany-george'
    section: '196007'
- add:
