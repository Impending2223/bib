      when: July 4
      date: '1960-07-04'
      thread: elections-1960
      c: 'Los Angeles. India Edwards, for Johnson, with Connally: Kennedy has Addison''s disease and "would not be alive today
        if it were not for cortisone"; a public evaluation of his fitness. By her account, Johnson lashes out at her. The
        *Times* puts it on page 19.'
      n: '[[w.shesol-mutual-contempt]], 35. To check: India Edwards oral history, LBJ Library; *New York Times*, July 5, 1960,
        19 (cited by [[w.shesol-mutual-contempt]], 35). Names: Connally, Kennedy, Johnson.'
      src:
        c: ed53a73a
        rows:
        - 'w.shesol-mutual-contempt 35: all'
        - 'via w.shesol-mutual-contempt 35 n.unspeakable: A-B'
      tags:
      - 'name:connally-john'
      - 'name:kennedy-john-f'
      - 'name:johnson-lyndon-b'
    section: '196007'
- add:
    entry:
      id: cal.1960-07-04.robert-kennedy
      when: July 4
      date: '1960-07-04'
      thread: elections-1960
      c: 'Robert Kennedy, at a press conference: his brother has no "ailment classically described as Addison''s disease";
        any statement to the contrary "malicious and false." A doctors'' report: health "excellent." "I am confident that
        Senator Johnson will repudiate the irresponsible statements."'
      n: '[[w.shesol-mutual-contempt]], 35–36. To check: Myer Feldman oral history, JFK Library; *New York Times*, July 5,
        1960 (cited by [[w.shesol-mutual-contempt]], 35–36). See [[cal.1960-07-04.elections-1960-2]]. Names: Robert Kennedy,
        Kennedy, Johnson. Check: the day; Shesol: "a quick press conference."'
      src:
        c: ab1fd14c
        rows:
        - 'w.shesol-mutual-contempt 35–36: all'
      tags:
      - 'name:kennedy-robert-f'
      - 'name:kennedy-john-f'
      - 'name:johnson-lyndon-b'
    section: '196007'
