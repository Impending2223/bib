      when: July 12
      date: '1960-07-12'
      thread: elections-1960
      c: 'Chasen''s, the Steelworkers'' buffet supper. O''Neill brings word from Johnson''s camp: if Kennedy wants Johnson,
        Johnson will not turn him down. Kennedy, on the sidewalk: "Of course I want Lyndon Johnson. ... I would never want
        to offer it to him and have him turn me down."'
      n: '[[w.shesol-mutual-contempt]], 44–45. To check: [[w.oneill-man-of-the-house-1987]], 93–95 (cited by [[w.shesol-mutual-contempt]],
        45). Names: O''Neill, Kennedy, Johnson.'
      src:
        c: d9185570
        rows:
