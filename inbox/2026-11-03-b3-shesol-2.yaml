      when: July 8
      date: '1960-07-08'
      thread: elections-1960
      c: 'Los Angeles, the afternoon. Robert Kennedy: Teamsters locals in the city ordered to "whoop up" Johnson''s campaign.
        Meany the same day at work on the delegates to keep Johnson off the ticket.'
      n: '[[w.shesol-mutual-contempt]], 37–38. To check: *New York Times*, July 9, 1960, 1, 8 (cited by [[w.shesol-mutual-contempt]],
        37). Names: Robert Kennedy, Johnson, Meany.'
