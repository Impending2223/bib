      when: June 29
      date: '1960-06-29'
      thread: elections-1960
      c: 'Sorensen to John and Robert Kennedy, a page, "Possible Vice Presidential Nominees": Johnson first, who "helps with
        farmers, Southerners and Texas," "easier to work with in this position than as majority leader"; Humphrey, Symington;
        Freeman and Jackson "too much like JFK." No answer.'
      n: '[[w.shesol-mutual-contempt]], 42. To check: Sorensen to John F. and Robert F. Kennedy, June 29, 1960, Sorensen Files,
        box 25, JFK Library (cited by [[w.shesol-mutual-contempt]], 42). Names: Sorensen, Kennedy, Robert Kennedy, Johnson,
        Humphrey, Symington, Freeman, Jackson.'
      src:
        c: 566154c6
        rows:
        - 'w.shesol-mutual-contempt 42: all'
        - 'via w.shesol-mutual-contempt 42 n.possible: all'
      tags:
