      when: July 8
      date: '1960-07-08'
      thread: elections-1960
      c: 'New York, Idlewild, at night, from Hyannis Port. Kennedy, asked would he consider Johnson for second place: "Certainly,
        although I don''t think he''s interested in that at the moment."'
