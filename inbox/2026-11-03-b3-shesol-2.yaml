      date: '1960-07-09'
      thread: elections-1960
      c: 'Los Angeles, the Biltmore, a late lunch. Robert Kennedy to Guthman, of Jackson for second place: "He''s my choice,
        and Jack likes him." Jackson to convince the Midwestern and Eastern leaders by Thursday.'
      n: '[[w.shesol-mutual-contempt]], 43. To check: [[w.guthman-we-band-of-brothers]], 74–76 (cited by [[w.shesol-mutual-contempt]],
