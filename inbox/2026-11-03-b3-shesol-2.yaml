      id: cal.1960-07-13.elections-1960-4
      when: July 13
      date: '1960-07-13'
      thread: elections-1960
      c: 'Wednesday night. Corcoran asks Johnson''s leave "to work out the option" with Kennedy. Johnson: "Only if Sam goes
        along with it." Rayburn: "No. I won''t go along with it. ... I wouldn''t trust Joe Kennedy across the street." By
        Johnson''s later account, at 1 a.m.: "Don''t accept." The next morning Rayburn a convert.'
      n: '[[w.shesol-mutual-contempt]], 45. To check: [[w.dallek-lone-star-rising]], 576; Johnson and Carl Vinson, telephone
        conversation, Dec. 2, 1963, LBJ Library (cited by [[w.shesol-mutual-contempt]], 45). See [[cal.1960-07-14.elections-1960]].
        Names: Corcoran, Johnson, Kennedy, Rayburn, Joseph Kennedy.'
      src:
        c: 26311bdf
        rows:
        - 'w.shesol-mutual-contempt 45: all'
        - 'via w.shesol-mutual-contempt 45 n.wont-go-along: B-D'
      tags:
