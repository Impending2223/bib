      when: July 13
      date: '1960-07-13'
      thread: elections-1960
      c: 'Wednesday morning, the day of the nomination. Robert Kennedy''s count, 740, twenty-one short: "If we don''t win
        tonight, we''re dead." To Washington''s delegates: his own preference for second place "is not going to determine
        who is selected."'
      n: '[[w.shesol-mutual-contempt]], 40, 43. Names: Robert Kennedy.'
      src:
        c: fe20c2e3
        rows:
