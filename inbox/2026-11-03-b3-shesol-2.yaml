      when: July 8
      date: '1960-07-08'
      thread: elections-1960
      c: 'Johnson, en route to Los Angeles, on Robert Kennedy''s prediction in the *Times* that the nomination would be settled
        by Monday noon: "Is this convention open or has the outcome been determined somewhere in a back room?" "There are
        countries in the world where such pure arrogance is customary in politics."'
      n: '[[w.shesol-mutual-contempt]], 37. To check: *New York Times*, July 8, 1960, 11 (cited by [[w.shesol-mutual-contempt]],
        37). Names: Johnson, Robert Kennedy.'
      src:
        c: d75be0e7
        rows:
        - 'w.shesol-mutual-contempt 37: all'
        - 'via w.shesol-mutual-contempt 37 n.specter: all'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:kennedy-robert-f'
    section: '196007'
