      thread: elections-1960
      c: 'Sunday night. Kennedy to Philip Graham, offhand: if Johnson would take the Vice Presidency, he might offer it.'
      n: '[[w.shesol-mutual-contempt]], 44. To check: [[w.white-making-of-the-president]], 199 (cited by [[w.shesol-mutual-contempt]],
