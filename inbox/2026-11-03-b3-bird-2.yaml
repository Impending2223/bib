# Batch 3 resumed (Nov. 4, 2026), reader "advisers": Bird, *The Color of Truth* (1998; w.bird-color-of-truth), read
# against the calendar for the first time (no earlier patch). The owner's copy, the scan's OCR text layer; printed page =
# PDF page - 3 to p. 224, the plates PDF 228-243, then PDF page - 19. New entries claimed in the ledger (b3-bird-2); cites
# and checks on the entries the calendar already holds; one edit (a card taken out of "To check:" where the book does not
# treat the matter). The book-check: notes/book-checks/bird-color-of-truth.md.
patch: b3-bird-2
by: Claude (batch 3 resumed, advisers group; Bird, The Color of Truth)
ops:
- add:
    entry:
      id: cal.1960-02.program
      when: Feb.
      date: 1960-02
      thread: program
      c: William Bundy, on leave from the CIA, staff director of the President's Commission on National Goals.
      n: '[[w.bird-color-of-truth]], 181. See [[cal.1960-02-07.program]]. Names: William Bundy.'
      tags:
      - name:bundy-william
- add:
    entry:
      id: cal.1960-06.elections-1960-13
      when: June
      date: 1960-06
      thread: elections-1960
      also:
      - program
      c: 'William Bundy briefs Kennedy on the Goals commission''s work: "a very brief two-minute session."'
      n: '[[w.bird-color-of-truth]], 182. See [[cal.1960-02-07.program]]. Names: William Bundy, Kennedy. Check: the day.'
      tags:
      - name:bundy-william
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-11.program
      when: Nov.
      date: 1960-11
      thread: program
      also:
      - transition-and-staff
      c: 'William Bundy sends the President-elect *Goals for Americans*, a note in his hand: "A really great campaign, Jack, and I am sure a great Administration!"'
      n: '[[w.bird-color-of-truth]], 182. See [[cal.1960-11-16.program]]. Names: William Bundy, Kennedy. Check: the day.'
      tags:
      - name:bundy-william
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-12.transition-and-staff-nsc
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-nsc
      c: 'Lippmann an hour with the President-elect, who leans to Fulbright for Secretary of State, Rusk and McGeorge Bundy his others. Lippmann, after: he "advocated his appointing Bundy and taking a chance
        on the fact that he was so young and not well known. Now I am beginning to hope it will be Fulbright."'
      n: '[[w.bird-color-of-truth]], 152 (early December; the letter a few days after). Names: Lippmann, Kennedy, Fulbright, Rusk, McGeorge Bundy. Check: the day.'
      tags:
      - name:lippmann-walter
      - name:kennedy-john-f
      - name:fulbright-j-william
      - name:rusk-dean
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1960-12.transition-and-staff-nsc-2
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-nsc
      c: 'The Carlyle, New York: Kennedy asks McGeorge Bundy whether he would be "interested" in the under secretaryship of State for political affairs; days later, by telephone, the job "doesn''t exist
        any more," Rusk to be Secretary, Bowles under secretary.'
      n: '[[w.bird-color-of-truth]], 152 (Bundy''s account). See [[cal.1961-01-01.transition-and-staff-nsc]]. Names: Kennedy, McGeorge Bundy, Rusk, Bowles. Check: the day.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:rusk-dean
      - name:bowles-chester
- add:
    entry:
      id: cal.1960-12-30.transition-and-staff-nsc
      when: Dec. 30
      date: '1960-12-30'
      thread: transition-and-staff-nsc
      c: McGeorge Bundy accepts the post of Special Assistant for National Security Affairs and leaves for Antigua.
      n: '[[w.bird-color-of-truth]], 153. See [[cal.1961-01-01.transition-and-staff-nsc]]. Names: McGeorge Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-01.defense
      when: Jan.
      date: 1961-01
      thread: defense
      c: 'Ellsberg, of RAND, briefs McGeorge Bundy on the Joint Chiefs'' war plans, the Joint Strategic Capabilities Plan: the swift destruction of every city of consequence in the Soviet Union, China and
        Eastern Europe.'
      n: '[[w.bird-color-of-truth]], 208 (late January). Names: Ellsberg, McGeorge Bundy. Check: the day.'
      tags:
      - name:ellsberg-daniel
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-07-06.berlin-and-vienna
      when: July 6
      date: '1961-07-06'
      thread: berlin-and-vienna
      c: Raskin, of the NSC staff, to McGeorge Bundy, on Germany.
      n: '[[w.bird-color-of-truth]], 212 n.* (in passing). Names: Raskin, McGeorge Bundy.'
      tags:
      - name:raskin-marcus
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-07-19.berlin-and-vienna-2
      when: July 19
      date: '1961-07-19'
      thread: berlin-and-vienna
      c: David Riesman and Erich Fromm, a letter to the *New York Times* on Germany, unpublished. In July they press Kaysen to change the policy on Germany.
      n: '[[w.bird-color-of-truth]], 212 n.*. Names: Kaysen. Check: the letter, unpublished; where Bird read it.'
      tags:
      - name:kaysen-carl
- add:
    entry:
      id: cal.1961-08-22.berlin-and-vienna-2
      when: Aug. 22
      date: '1961-08-22'
      thread: berlin-and-vienna
      c: 'Kaysen to McGeorge Bundy, "my instinctive reactions to the Berlin situation": a "cold war stance" has "significant defects"; "McCarthyism was not unconnected with the fact that we were literally
        at war with the Soviet Union in Korea"; the "only one of our past aims which we must continue to pursue is the freedom of West Berlin."'
      n: '[[w.bird-color-of-truth]], 212–13. Names: Kaysen, McGeorge Bundy.'
      tags:
      - name:kaysen-carl
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-09-01.berlin-and-vienna
      when: Sept. 1
      date: '1961-09-01'
      thread: berlin-and-vienna
      c: 'Harriman to Kennedy, a secret letter: "Since Potsdam, I have been satisfied that Germany would be divided for a long time."'
      n: '[[w.bird-color-of-truth]], 213. Names: Harriman, Kennedy.'
      tags:
      - name:harriman-w-averell
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-10.testing
      when: Autumn
      date: 1961-10
      thread: testing
      also:
      - defense
      c: 'The Foster Panel, a classified study group in the new Arms Control and Disarmament Agency: two hundred to five hundred strategic delivery vehicles enough to deter; a ceiling of one thousand a
        side to be proposed to the Soviets.'
      n: '[[w.bird-color-of-truth]], 215. See [[cal.1961-11-24.defense]]. Names: Foster. Check: the month; Bird gives the autumn.'
      tags:
      - name:foster-william-c
- add:
    entry:
      id: cal.1961-10.press-and-broadcasting
      when: Autumn
      date: 1961-10
      thread: press-and-broadcasting
      c: 'Lippmann, in public, of Kennedy''s policies: "It''s like the Eisenhower administration thirty years younger."'
      n: '[[w.bird-color-of-truth]], 216. Names: Lippmann, Kennedy. Check: the month and where; Bird gives the autumn.'
      tags:
      - name:lippmann-walter
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-04.democratic-party
      when: Spring
      date: 1962-04
      thread: democratic-party
      also:
      - republican-party
      c: '*The Liberal Papers*, essays edited by Raskin for Kastenmeier''s Liberal Project, published: 30,000 copies. Goldwater and Dirksen charge appeasement and unilateral disarmament; the Republican
        Party prepares a campaign brochure from it.'
      n: '[[w.bird-color-of-truth]], 218. Names: Raskin, Kastenmeier, Goldwater, Dirksen. Check: the month; Bird gives the spring.'
      tags:
      - name:raskin-marcus
      - name:kastenmeier-robert-w
      - name:goldwater-barry-m
      - name:dirksen-everett
- add:
    entry:
      id: cal.1962-05-10.laos
      when: May 10
      date: '1962-05-10'
      thread: laos
      c: 'Eisenhower to McGeorge Bundy and McCone: if troops go to Laos, "he would follow them up with whatever support was necessary to achieve the objectives of the mission, including—if necessary—the
        use of tactical nuclear weapons."'
      n: '[[w.bird-color-of-truth]], 217 n.* (Forrestal''s memorandum, May 11, 1962). To check: Forrestal, memorandum, May 11, 1962 (cited by [[w.bird-color-of-truth]], 217 n.*). Names: Eisenhower, McGeorge
        Bundy, McCone.'
      tags:
      - name:eisenhower-dwight-d
      - name:bundy-mcgeorge
      - name:mccone-john-a
- add:
    entry:
      id: cal.1962-07-25.cuba
      when: July 25
      date: '1962-07-25'
      thread: cuba
      c: 'Lansdale to McGeorge Bundy and the Special Group (Augmented): the Joint Chiefs have "fully met its responsibility, under the March guidelines," for "planning and undertaking preliminary actions
        for a decisive U.S. capability for intervention in Cuba."'
      n: '[[w.bird-color-of-truth]], 243. See [[cal.1962-02-20.cuba]]. Names: Lansdale, McGeorge Bundy.'
      tags:
      - name:lansdale-edward-g
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1962-09-14.cuba
      when: Sept. 14
      date: '1962-09-14'
      thread: cuba
      c: Kennedy with McNamara and the Joint Chiefs on a detailed plan for an aerial attack on Cuba.
      n: '[[w.bird-color-of-truth]], 244. Names: Kennedy, McNamara.'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1962-09-19.cuba
      when: Sept. 19
      date: '1962-09-19'
      thread: cuba
      c: 'McGeorge Bundy to Lansdale: "I think the attached is one of the military contingencies that ought to be worked out carefully in the light of its obvious political possibilities."'
      n: '[[w.bird-color-of-truth]], 244. Names: McGeorge Bundy, Lansdale.'
      tags:
      - name:bundy-mcgeorge
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1962-10-01.cuba
      when: Oct. 1
      date: '1962-10-01'
      thread: cuba
      also:
      - defense
      c: 'McNamara orders Dennison, commander in chief of the Atlantic Fleet, "to be prepared to institute a blockade of Cuba." That evening Dennison to his fleet commanders: "maximum readiness to execute
        CINCLANT OPLAN 312 [an air strike] by October 20." A large amphibious exercise announced as cover.'
      n: '[[w.bird-color-of-truth]], 244. Names: McNamara, Dennison.'
      tags:
      - name:mcnamara-robert-s
      - name:dennison-robert-l
- add:
    entry:
      id: cal.1962-10-05.cuba
      when: Oct. 5
      date: '1962-10-05'
      thread: cuba
      c: 'McGeorge Bundy to McCone: the policy "was not clear"; the choice, to "go in militarily (which seemed to him intolerable)" or another course.'
      n: '[[w.bird-color-of-truth]], 244. Names: McGeorge Bundy, McCone. Check: Bird''s quotation is cut; the second alternative not given.'
      tags:
      - name:bundy-mcgeorge
      - name:mccone-john-a
- add:
    entry:
      id: cal.1962-11.press-and-broadcasting
      when: Nov.
      date: 1962-11
      thread: press-and-broadcasting
      also:
      - transition-and-staff-nsc
      c: 'Chalmers Roberts in the *Washington Post*: "the one-time dean rates an A"; "Today Bundy is the linchpin of a tight little White House foreign policy shop."'
      n: '[[w.bird-color-of-truth]], 247 (early November). Names: Chalmers Roberts, McGeorge Bundy. Check: the day.'
      tags:
      - name:roberts-chalmers-m
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1963-10-05.vietnam-4
      when: Oct. 5
      date: '1963-10-05'
      thread: vietnam
      c: 'McGeorge Bundy to Lodge, eyes only, a personal message from the President with the instructions: "we should not open this next stage in the press"; the decisions "held most tightly here," so that
        his negotiations with Diệm "may be run on your terms."'
      n: '[FRUS 1961–63, IV, doc. 180](https://history.state.gov/historicaldocuments/frus1961-63v04/d180) (telegram 533, 5:38 p.m.). [[w.bird-color-of-truth]], 258 (the sanctions out of the newspapers).
        See [[cal.1963-10-05.vietnam-2]]. Names: McGeorge Bundy, Lodge, Kennedy, Ngô Đình Diệm.'
      tags:
      - name:bundy-mcgeorge
      - name:lodge-henry-cabot
      - name:kennedy-john-f
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-10-08.vietnam
      when: Oct. 8
      date: '1963-10-08'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'CINCPAC to McGeorge Bundy on the withdrawal of a thousand men: the "objective is to withdraw units rather than individuals to the extent practicable to gain maximum psychological impact"; the
        withdrawal, "if decreed," with "minimum impact on the combined US-RVN capabilities."'
      n: '[[w.bird-color-of-truth]], 259. See [[cal.1963-10-02.vietnam]]. Names: McGeorge Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1963-11-21.transition-and-staff-nsc
      when: Nov. 21
      date: '1963-11-21'
      thread: transition-and-staff-nsc
      c: 'McGeorge Bundy to Kennedy, a note: he declines the overture of Yale''s presidency.'
      n: '[[w.bird-color-of-truth]], 268. Names: McGeorge Bundy, Kennedy.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-21.vietnam-2
      when: Nov. 21
      date: '1963-11-21'
      thread: vietnam
      c: 'McGeorge Bundy to William Bundy, referring him to the draft NSAM on Vietnam: lip service to the withdrawal of a thousand men; the war in the Mekong Delta; a "detailed plan" for "sea-going" operations
        against the North.'
      n: '[[w.bird-color-of-truth]], 264. Names: McGeorge Bundy, William Bundy.'
      tags:
      - name:bundy-mcgeorge
      - name:bundy-william
- add:
    entry:
      id: cal.1963-11-22.transition-and-staff
      when: Nov. 22
      date: '1963-11-22'
      thread: transition-and-staff
      also:
      - confirmations
      c: William Bundy confirmed Assistant Secretary of Defense for International Security Affairs, by voice vote, 1 p.m., after a perfunctory hearing; Nitze gone to the Navy.
      n: '[[w.bird-color-of-truth]], 265. Names: William Bundy, Nitze. Check: the Record of the day.'
      tags:
      - name:bundy-william
      - name:nitze-paul
- add:
    entry:
      id: cal.1963-11-24.succession-2
      when: Nov. 24
      date: '1963-11-24'
      thread: succession
      c: 'The White House, the family''s quarters: McGeorge Bundy with Robert Kennedy and Mrs. Kennedy on the readings for the funeral, passages of the President''s speeches marked by Bundy and Sorensen;
        Sorensen chooses Ecclesiastes.'
      n: '[[w.bird-color-of-truth]], 267. Names: McGeorge Bundy, Robert Kennedy, Jacqueline Kennedy, Sorensen.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-robert-f
      - name:kennedy-jacqueline
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1964-01-03.vietnam
      when: Jan. 3
      date: '1964-01-03'
      thread: vietnam
      c: '"Operations Against North Vietnam," an interdepartmental report, thirteen pages: a year of covert operations by South Vietnamese commandos, the first phase from Feb. 1, "about 20 destructive undertakings."
        McGeorge Bundy passes it to Forrestal.'
      n: '[[w.bird-color-of-truth]], 271. Names: McGeorge Bundy, Forrestal.'
      tags:
      - name:bundy-mcgeorge
      - name:forrestal-michael-v
- add:
    entry:
      id: cal.1964-01-21.vietnam-2
      when: Jan. 21
      date: '1964-01-21'
      thread: vietnam
      c: 'Lodge: Minh''s junta unenthusiastic about covert attacks on the North.'
      n: '[[w.bird-color-of-truth]], 273. Names: Lodge, Dương Văn Minh.'
      tags:
      - name:lodge-henry-cabot
      - name:duong-van-minh
- add:
    entry:
      id: cal.1964-02-29.transition-and-staff
      when: Feb. 29
      date: '1964-02-29'
      thread: transition-and-staff
      c: William Bundy to succeed Hilsman as Assistant Secretary of State for the Far East, announced.
      n: '[[w.bird-color-of-truth]], 275. Names: William Bundy, Hilsman.'
      tags:
      - name:bundy-william
      - name:hilsman-roger
- add:
    entry:
      id: cal.1964-03-04.vietnam-4
      when: Mar. 4
      date: '1964-03-04'
      thread: vietnam
      c: 'Johnson to McGeorge Bundy: the Joint Chiefs "say get in or get out"; he told them he is a "trustee" President: "I got to win an election."'
      n: '[[w.bird-color-of-truth]], 276 n.*. See [[cal.1964-03-04.vietnam-2]]. Names: Johnson, McGeorge Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-06-01.vietnam-2
      when: June 1
      date: '1964-06-01'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson: 140 Americans killed by "hostile forces" in Vietnam since the beginning of 1961, 36 of them in the first five months of 1964; 87 more dead of other causes.'
      n: '[[w.bird-color-of-truth]], 277. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-24.vietnam-2
      when: July 24
      date: '1964-07-24'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson: eight airdrops of 34-A commando teams into North Vietnam since April, "only very moderately successful, and the casualty rates are high."'
      n: '[[w.bird-color-of-truth]], 286 n.*. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-31.vietnam
      when: July 31
      date: '1964-07-31'
      thread: vietnam
      c: 'William Bundy to McGeorge Bundy: the loss of South Vietnam "would have extremely serious consequences"; the bombing option not to appear "so unattractive that we are tying our hands if we should
        ever decide to do it."'
      n: '[[w.bird-color-of-truth]], 284–85. Names: William Bundy, McGeorge Bundy.'
      tags:
      - name:bundy-william
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-03.vietnam-5
      when: Aug. 3
      date: '1964-08-03'
      thread: vietnam
      c: 'Forrestal to McGeorge Bundy: "It seems likely that the North Vietnamese and perhaps the Chicoms have assumed that the destroyer was part of this operation," the raids of July 30 on Hòn Mê and
        Hòn Ngư.'
      n: '[[w.bird-color-of-truth]], 286. Names: Forrestal, McGeorge Bundy.'
      tags:
      - name:forrestal-michael-v
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-10.vietnam-3
      when: Aug. 10
      date: '1964-08-10'
      thread: vietnam
      c: Clifford, chairman of the Foreign Intelligence Advisory Board, telephones Johnson; Cline has told him he is "rather negative" on the second attack.
      n: '[[w.bird-color-of-truth]], 287. Names: Clifford, Johnson. Check: Bird infers that Clifford passed on Cline''s doubt.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-09-15.china
      when: Sept. 15
      date: '1964-09-15'
      thread: china
      c: 'McGeorge Bundy with Rusk, McNamara and McCone, for the President, on the Chinese bomb: among the choices, "unprovoked unilateral U.S. military action against Chinese nuclear installations"; all
        agree not "at this time."'
      n: '[[w.bird-color-of-truth]], 298. Names: McGeorge Bundy, Rusk, McNamara, McCone, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:mccone-john-a
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-10-01.vietnam-2
      when: Oct. 1
      date: '1964-10-01'
      thread: vietnam
      also:
      - intelligence
      c: 'A Special National Intelligence Estimate on South Vietnam: "increasing defeatism, paralysis of leadership, friction with Americans, exploration of possible lines of political accommodation with
        the other side."'
      n: '[[w.bird-color-of-truth]], 290.'
- add:
    entry:
      id: cal.1964-10-19.vietnam-2
      when: Oct. 19
      date: '1964-10-19'
      thread: vietnam
      c: 'William Bundy, "The Choices We Face in Southeast Asia," forty-two pages, answering Ball: a political solution explored, "all the apparent heresies" he could think of.'
      n: '[[w.bird-color-of-truth]], 291. Names: William Bundy, Ball.'
      tags:
      - name:bundy-william
      - name:ball-george-w
- add:
    entry:
      id: cal.1964-10-23.vietnam
      when: Oct. 23
      date: '1964-10-23'
      thread: vietnam
      c: 'Thomson to McGeorge Bundy: "I assume that we will have to choose roughly between escalation towards negotiation on the one hand, and a muddle-through towards negotiation on the other." Thomson
        for muddling through.'
      n: '[[w.bird-color-of-truth]], 292 n.* (Thomson Papers, box 11, Kennedy Library). To check: Thomson to Bundy, Oct. 23, 1964, Thomson Papers, box 11, Kennedy Library (cited by [[w.bird-color-of-truth]],
        292 n.*). Names: Thomson, McGeorge Bundy.'
      tags:
      - name:thomson-james-c-jr
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-11-23.vietnam-2
      when: Nov. 23
      date: '1964-11-23'
      thread: vietnam
      c: 'William Bundy''s long memorandum for a "mild" view, the United States able to live with a Communist outcome, to McNamara and Rusk. Summoned to Rusk''s office, the two together: "It won''t wash."'
      n: '[[w.bird-color-of-truth]], 294 (William Bundy''s account). Names: William Bundy, McNamara, Rusk.'
      tags:
      - name:bundy-william
      - name:mcnamara-robert-s
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-12.press-and-broadcasting
      when: Dec.
      date: 1964-12
      thread: press-and-broadcasting
      also:
      - transition-and-staff-nsc
      c: 'McGeorge Bundy asks Johnson''s leave to go on *Meet the Press*: "I admit that I enjoy this kind of thing." Johnson: "Not now."'
      n: '[[w.bird-color-of-truth]], 300 (early December). Names: McGeorge Bundy, Johnson. Check: the day.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-12.press-and-broadcasting-2
      when: Dec.
      date: 1964-12
      thread: press-and-broadcasting
      c: 'McGeorge Bundy to Johnson, angry at a *Newsweek* story, on his friendship with Bradlee: "Ben and I have known each other all our lives."'
      n: '[[w.bird-color-of-truth]], 300 (the same day as the request to go on *Meet the Press*). Names: McGeorge Bundy, Johnson, Bradlee. Check: the day.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:bradlee-benjamin-c
- add:
    entry:
      id: cal.1964-12.press-and-broadcasting-3
      when: Dec.
      date: 1964-12
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Joseph Kraft in *Harper''s*, December, "A Way Out in Viet-Nam": an "impossible war"; the Viet Cong to be invited into a coalition government. Bird: from Forrestal''s briefings.'
      n: '[[w.bird-color-of-truth]], 310. Names: Forrestal. Check: the day the issue appeared.'
      tags:
      - name:forrestal-michael-v
- add:
    entry:
      id: cal.1965-01.transition-and-staff-nsc
      when: Jan.
      date: 1965-01
      thread: transition-and-staff-nsc
      c: 'McGeorge Bundy to Johnson, asked who should succeed him: Moyers, Thomas Hughes or Abram Chayes to be groomed for it.'
      n: '[[w.bird-color-of-truth]], 301, 348 (the memorandum passed again in early 1966). Names: McGeorge Bundy, Johnson, Moyers, Hughes, Chayes. Check: the day.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:hughes-thomas-l
      - name:chayes-abram
- add:
    entry:
      id: cal.1965-01-06.vietnam-3
      when: Jan. 6
      date: '1965-01-06'
      thread: vietnam
      c: 'William Bundy to Rusk, "Notes on the South Vietnamese Situation and Alternatives," for his meeting with the President: the situation "likely to come apart more rapidly than we had anticipated
        in November"; the likeliest form, "a government or key groups starting to negotiate covertly with the Liberation Front or Hanoi."'
      n: '[FRUS 1964–68, II, doc. 15](https://history.state.gov/historicaldocuments/frus1964-68v02/d15). [[w.bird-color-of-truth]], 303. Names: William Bundy, Rusk, Johnson.'
      tags:
      - name:bundy-william
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-17.press-and-broadcasting
      when: Feb. 17
      date: '1965-02-17'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Lippmann writes a column: a land war in Asia would be "supreme folly." "While the warhawks would rejoice when it began, the people would weep before it ended."'
      n: '[[w.bird-color-of-truth]], 309. See [[cal.1965-02-17.vietnam-6]]. Names: Lippmann. Check: the day it ran.'
      tags:
      - name:lippmann-walter
- add:
    entry:
      id: cal.1965-03-08.press-and-broadcasting
      when: Mar. 8
      date: '1965-03-08'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: I. F. Stone, "Reply to the White Paper," from the Pentagon's figures and the White Paper's own appendix.
      n: '[[w.bird-color-of-truth]], 313. Check: where it appeared; Bird gives the day.'
- add:
    entry:
      id: cal.1965-03-10.vietnam-3
      when: Mar. 10
      date: '1965-03-10'
      thread: vietnam
      c: 'Camp David: Johnson with McGeorge Bundy, Rusk and McNamara. By Bundy''s notes: Rusk, soon a choice between escalation and negotiation; Johnson, any "honorable" settlement, but "We''ve not done
        anything yet"; "I did cross [that] bridge in my own mind in December"; "If you show me any reasonable out I''ll grab it"; "To give in = another Munich."'
      n: '[[w.bird-color-of-truth]], 311. Names: Johnson, McGeorge Bundy, Rusk, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-03-30.vietnam-2
      when: Mar. 30
      date: '1965-03-30'
      thread: vietnam
      also:
      - foreign-aid
      c: 'McGeorge Bundy to Johnson: a Southeast Asia Development Corporation, billions for the region''s development, North Vietnam to be invited in once the war is settled; a major dam.'
      n: '[[w.bird-color-of-truth]], 315. See [[cal.1965-04-01.vietnam-2]]. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-04-16.students
      when: Apr. 16
      date: '1965-04-16'
      thread: students
      c: 'McGeorge Bundy declines the Inter-University Committee''s invitation to debate at a national teach-in: their letter "a piece of propaganda"; "if your letter came to me for grading as a professor
        of government, I would not" pass it.'
      n: '[[w.bird-color-of-truth]], 318. See [[cal.1965-05-15.students]]. Names: McGeorge Bundy. Check: the last words; Bird''s quotation breaks off.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-04-20.students
      when: Apr. 20
      date: '1965-04-20'
      thread: students
      also:
      - vietnam
      c: 'McGeorge Bundy to Donald Graham, an editor of the *Harvard Crimson*, eleven pages, against his Harvard critics: the lessons of Munich.'
      n: '[[w.bird-color-of-truth]], 317. Names: McGeorge Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-04-29.latin-america-dominican-republic
      when: Apr. 29
      date: '1965-04-29'
      thread: latin-america-dominican-republic
      c: 'Goodwin to Johnson: "anything, including military intervention, should be done if essential to prevent another Castro-type takeover in the Caribbean."'
      n: '[[w.bird-color-of-truth]], 323. Names: Goodwin, Johnson.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-05-12.vietnam-mayflower
      when: May 12
      date: '1965-05-12'
      thread: vietnam-mayflower
      c: 'Ball to Thomas Hughes: "stunned" that Johnson has chosen a proposal to Moscow with "no carrots or concessions at all."'
      n: '[[w.bird-color-of-truth]], 328 (Hughes''s notes). Names: Ball, Hughes.'
      tags:
      - name:ball-george-w
      - name:hughes-thomas-l
- add:
    entry:
      id: cal.1965-06-19.vietnam-2
      when: June 19
      date: '1965-06-19'
      thread: vietnam
      c: 'William Bundy to several ambassadors in East Asia, "Top Secret, Personal and Confidential": the situation "very gloomy indeed"; three courses, wider air strikes, mining or blockading Haiphong
        and the North, and a third.'
      n: '[[w.bird-color-of-truth]], 334. Names: William Bundy. Check: the third course; Bird''s sentence breaks off.'
      tags:
      - name:bundy-william
- add:
    entry:
      id: cal.1965-06-27.vietnam-july-decision
      when: June 27
      date: '1965-06-27'
      thread: vietnam-july-decision
      c: 'McGeorge Bundy to Johnson, with Ball''s paper on the commitments to South Vietnam: "if and when we wish to shift our course and cut our losses in Vietnam we should do so because of a finding that
        the Vietnamese themselves are not meeting their obligations to themselves or to us."'
      n: '[FRUS 1964–68, III, doc. 24](https://history.state.gov/historicaldocuments/frus1964-68v03/d24). [[w.bird-color-of-truth]], 332. Names: McGeorge Bundy, Johnson, Ball.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:ball-george-w
- add:
    entry:
      id: cal.1965-07-03.press-and-broadcasting
      when: July 3
      date: '1965-07-03'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'The *Saturday Review*, an exchange of Archibald MacLeish and McGeorge Bundy: is the United States "no longer that idealistic nation of the First World War"? Bundy''s reply gentle.'
      n: '[[w.bird-color-of-truth]], 326. Names: McGeorge Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-11-13.transition-and-staff
      when: Nov. 13
      date: '1965-11-13'
      thread: transition-and-staff
      c: 'The Sheraton-Carlton, Washington: McGeorge Bundy at breakfast with John and Ellen McCloy on the Ford Foundation''s presidency.'
      n: '[[w.bird-color-of-truth]], 343. See [[cal.1965-11-07.transition-and-staff]]. Names: McGeorge Bundy, McCloy.'
      tags:
      - name:bundy-mcgeorge
      - name:mccloy-john-j
- add:
    entry:
      id: cal.1965-11-19.transition-and-staff
      when: Nov. 19
      date: '1965-11-19'
      thread: transition-and-staff
      c: 'McGeorge Bundy tells Johnson he will take the Ford Foundation; the next day they agree he will leave by the end of February. Bundy: "He was really mad."'
      n: '[[w.bird-color-of-truth]], 344. See [[cal.1965-11-07.transition-and-staff]]. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-02.transition-and-staff-nsc
      when: Feb.
      date: 1966-02
      thread: transition-and-staff-nsc
      c: Moyers asks William Bundy whether he would take the NSC post; he declines.
      n: '[[w.bird-color-of-truth]], 350 (early 1966, before Rostow''s appointment). See [[cal.1966-03-31.transition-and-staff]]. Names: Moyers, William Bundy. Check: the month.'
      tags:
      - name:moyers-bill
      - name:bundy-william
- add:
    entry:
      id: cal.1966-04-02.vietnam-struggle-4
      when: Apr. 2
      date: '1966-04-02'
      thread: vietnam-struggle
      c: 'A White House meeting: Johnson, the forces might leave Vietnam and "take a stand in Thailand."'
      n: '[[w.bird-color-of-truth]], 351. Names: Johnson. Check: Bird''s sentence may give the words to Rostow; William Bundy''s retort, "Walt, are you mad?"'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-05-23.vietnam
      when: May 23
      date: '1966-05-23'
      thread: vietnam
      c: 'William Bundy in Detroit, to business executives: "Today the military picture is an encouraging one."'
      n: '[[w.bird-color-of-truth]], 355. Names: William Bundy.'
      tags:
      - name:bundy-william
- add:
    entry:
      id: cal.1967-03-09.vietnam-order-of-battle
      when: Mar. 9
      date: '1967-03-09'
      thread: vietnam-order-of-battle
      c: 'Wheeler to Westmoreland, eyes only: a large upward revision of the enemy''s order of battle would have serious political consequences: "If these figures should reach the public domain."'
      n: '[[w.bird-color-of-truth]], 364. Names: Wheeler, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-07.civil-rights-organizations
      when: July
      date: 1967-07
      thread: civil-rights-organizations
      also:
      - states-and-cities
      c: 'The Ford Foundation, McGeorge Bundy announcing it, $175,000 to CORE''s Cleveland chapter, two weeks after CORE strikes "multiracial" from its constitution: to show that "a militant organization
        can work within the system."'
      n: '[[w.bird-color-of-truth]], 381 (renewed Aug. 1968). Names: McGeorge Bundy. Check: the day.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1967-11-11.vietnam-2
      when: Nov. 11
      date: '1967-11-11'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson, after the senior advisers'' meeting: drafting it, his "own mind stretched to some new thoughts"; the bombing no longer justified as interdiction and will not bring Hanoi
        to the table; but no to McNamara''s conclusion.'
      n: '[[w.bird-color-of-truth]], 364. See [[cal.1967-11-02.vietnam]]. Names: McGeorge Bundy, Johnson, McNamara.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-11-27.vietnam-2
      when: Nov. 27
      date: '1967-11-27'
      thread: vietnam
      also:
      - intelligence
      c: 'Hovey of the CIA station in Saigon cables a report: the enemy plans "a political and military offensive utilizing all VC assets" against "all major cities." Johnson reads it in mid-December.'
      n: '[[w.bird-color-of-truth]], 365. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-21.vietnam-205000
      when: Mar. 21
      date: '1968-03-21'
      thread: vietnam-205000
      c: 'McGeorge Bundy to Johnson, after the meeting of Mar. 20 on the draft of the address, its peace initiatives cut: the draft "will be profoundly discouraging to the American people."'
      n: '[[w.bird-color-of-truth]], 367. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-01.vietnam-4
      when: Apr. 1
      date: '1968-04-01'
      thread: vietnam
      also:
      - transition-and-staff
      c: Galbraith, in public, calls on William Bundy to resign, as closely identified with the policy of the war.
      n: '[[w.bird-color-of-truth]], 372. Names: Galbraith, William Bundy.'
      tags:
      - name:galbraith-john-kenneth
      - name:bundy-william
- add:
    entry:
      id: cal.1968-06.robert-kennedy-campaign
      when: June
      date: 1968-06
      thread: robert-kennedy-campaign
      c: 'After Robert Kennedy''s death, McGeorge Bundy arranges Ford Foundation fellowships, $131,000, for eight of the campaign''s staff: Mankiewicz $15,692, Walinsky $22,200 among them.'
      n: '[[w.bird-color-of-truth]], 387. Names: McGeorge Bundy, Mankiewicz, Walinsky. Check: the day.'
      tags:
      - name:bundy-mcgeorge
      - name:mankiewicz-frank
      - name:walinsky-adam
