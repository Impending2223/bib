- edit:
    id: cal.1967-06-07.middle-east
    base: 48bf15d0
    set:
      n: 'Security Council Resolution [234 (1967)](https://undocs.org/S/RES/234(1967)). Statement by the President Upon Establishing the National Security Council Special Committee on the Middle East, [1967
        Pub. Papers 599](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=667) (June 7, 1967). FRUS 1964–68, XIX, doc. [197](https://history.state.gov/historicaldocuments/frus1964-68v19/d197).
        [[w.drea-mcnamara-clifford-and-the-2011]], 444–445 (the Special Committee). To check: draft NSAM, June 6, 1967, NSC History of Middle East Crisis, NSF, LBJ Library (cited by [[w.drea-mcnamara-clifford-and-the-2011]],
        444 n.68). See [[cal.1967-06-05.middle-east]]. Drea, 444, dates Johnson''s decision to create the Special Committee June 6, its first meeting June 7 (445); the statement establishing it, June 7.
        Bird''s *Color of Truth* out of "To check": the book does not treat the Special Committee (read Nov. 4, 2026). Names: McGeorge Bundy, Johnson.'
