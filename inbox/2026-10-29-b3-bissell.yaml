    section: '196111'
- add:
    entry:
      id: cal.1962-01-18.cuba
      when: Jan. 18
      date: '1962-01-18'
      thread: cuba-bay-of-pigs
      c: 'Bissell''s answer to the Inspector General''s survey, "An Analysis of the Cuban Operation": a large majority of the survey''s conclusions "misleading or wrong"; the Agency''s command and organization what they should have been; its intelligence on the regime "essentially accurate"; the survey lays the blame on the Agency alone. By McCone''s direction, attached to the survey.'
      n: '[FRUS 1961–63, X–XII, microfiche supplement, doc. 278D](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d278d). [[w.bissell-reflections-of-a-cold]], 193 (McCone lets him answer in writing, the answer attached). To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, in [[w.bay-of-pigs-declassified]]. See [[cal.1961-06-13.cuba]]. Names: Bissell, McCone.'
      tags:
      - name:bissell-richard-m-jr
      - name:mccone-john-a
      src:
        c: 20ec6d9f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d278d: A-D'
        - 'w.bissell-reflections-of-a-cold 193: A, E'
    section: '196201'
- add:
    entry:
      id: cal.1962-01-30.defense
      when: Jan. 30
      date: '1962-01-30'
      thread: defense
      c: 'Lemnitzer to the Special Group (Counter-Insurgency), on the services'' training for counterguerrilla war: guerrilla warfare, counterinsurgency, combat in cities, riot control, civil affairs and military government "are not new to the Military Services"; they are "taking full advantage of the laboratory-type approach afforded by the current situation in Southeast Asia."'
      n: '[[w.bissell-reflections-of-a-cold]], 149–50 (the memorandum quoted). To check: Lemnitzer to the Special Group (CI), Jan. 30, 1962, National Security Files, Meetings and Memoranda, NSAM 124, Kennedy Library (cited by [[w.bissell-reflections-of-a-cold]], 150 n.10). See [[cal.1962-01-18.defense]]. Names: Lemnitzer.'
      tags:
      - name:lemnitzer-lyman-l
      src:
        c: ef63574f
        rows:
        - 'w.bissell-reflections-of-a-cold 149–50: all'
        - 'via w.bissell-reflections-of-a-cold 150 n.10a: all'
    section: '196201'
- add:
    entry:
      id: cal.1962-02.transition-and-staff
      when: Feb.
      date: 1962-02
      thread: transition-and-staff
      c: Bissell leaves the CIA. By his account he declined McCone's offer of the new deputy directorship for science and technology, which the Kennedys had approved. Helms deputy director for plans.
      n: '[[w.bissell-reflections-of-a-cold]], 202–3. See [[cal.1961-11-28.transition-and-staff]]. Names: Bissell, McCone, Helms. Check: the day: Bissell gives "February 1962."'
      tags:
