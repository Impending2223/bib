- add:
    entry:
      id: cal.1962-01-30.defense
      when: Jan. 30
      date: '1962-01-30'
      thread: defense
      c: 'Lemnitzer to the Special Group (Counter-Insurgency), on the services'' training for counterguerrilla war: guerrilla warfare, counterinsurgency, combat in cities, riot control, civil affairs and military government "are not new to the Military Services"; they are "taking full advantage of the laboratory-type approach afforded by the current situation in Southeast Asia."'
      n: '[[w.bissell-reflections-of-a-cold]], 149–50 (the memorandum quoted). To check: Lemnitzer to the Special Group (CI), Jan. 30, 1962, National Security Files, Meetings and Memoranda, NSAM 124, Kennedy Library (cited by [[w.bissell-reflections-of-a-cold]], 150 n.10). See [[cal.1962-01-18.defense]]. Names: Lemnitzer.'
      tags:
      - name:lemnitzer-lyman-l
      src:
