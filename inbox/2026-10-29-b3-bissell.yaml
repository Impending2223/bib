    section: '196105'
- add:
    entry:
      id: cal.1961-09.defense
      when: Sept.
      date: 1961-09
      thread: defense
      c: 'Joseph Alsop''s column: fewer than fifty Soviet missiles able to reach the United States, against almost 250 American able to reach the Soviet Union. The missile gap reversed, from the satellites'' photographs.'
      n: '[[w.bissell-reflections-of-a-cold]], 139. To check: Burrows, *Deep Black* (1986) (cited by [[w.bissell-reflections-of-a-cold]], 139 n.65), and the column. See [[cal.1960-08-19.space]]. Names: Joseph Alsop. Check: the day and the column.'
      tags:
      - name:alsop-joseph
      src:
        c: a2a8bc23
        rows:
        - 'w.bissell-reflections-of-a-cold 139: all'
    section: '196109'
- add:
    entry:
      id: cal.1961-11.cuba-bay-of-pigs
      when: Nov.
      date: 1961-11
      thread: cuba-bay-of-pigs
      c: Kirkpatrick, the CIA's Inspector General, meets McCone at the airport and hands him his survey of the Cuban operation directly. McCone, appalled at the breach and the contents, has a copy given Dulles; Bissell let answer it in writing, the answer attached. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 193. To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, in [[w.bay-of-pigs-declassified]]. Bibliography: [[cal.1962-01-18.cuba]] (the answer). See [[cal.1961-06-13.cuba]]. Names: McCone, Dulles, Bissell. Check: the month.'
      tags:
      - name:mccone-john-a
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      src:
        c: 847b0bff
        rows:
        - 'w.bissell-reflections-of-a-cold 193: all'
    section: '196111'
- add:
    entry:
      id: cal.1961-11.vietnam
      when: Nov.
      date: 1961-11
      thread: vietnam
      c: 'Kennedy to Galbraith, on taking a stand in Vietnam: "There are limits to the number of defeats I can defend in one twelve-month period. I''ve had the Bay of Pigs, pulling out of Laos, and I can''t accept a third." By Bissell, after Reeves.'
      n: '[[w.bissell-reflections-of-a-cold]], 151. To check: [[w.reeves-president-kennedy]], 261 (cited by [[w.bissell-reflections-of-a-cold]], 151 n.13). See [[cal.1961-11-11.vietnam]]. Names: Kennedy, Galbraith. Check: the month: "late 1961."'
      tags:
      - name:kennedy-john-f
      - name:galbraith-john-kenneth
      src:
        c: a10d2e18
        rows:
        - 'w.bissell-reflections-of-a-cold 151: all'
    section: '196111'
- add:
    entry:
      id: cal.1961-12.cuba
      when: Dec.
      date: 1961-12
      thread: cuba
      also:
      - cuba-bay-of-pigs
      c: 'The Philippines, a meeting of the CIA''s chiefs of station in the Far East, Bissell presiding, McCone come along: Bissell''s first account of the Bay of Pigs to them. Not that the air strikes alone would have won it. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 199. See [[cal.1961-11-28.transition-and-staff]]. Names: Bissell, McCone. Check: the month: Bissell gives "late autumn 1961."'
      tags:
      - name:bissell-richard-m-jr
      - name:mccone-john-a
      src:
        c: 5ebada76
        rows:
        - 'w.bissell-reflections-of-a-cold 199: all'
    section: '196112'
- add:
    entry:
      id: cal.1961-12.transition-and-staff
      when: Dec.
      date: 1961-12
      thread: transition-and-staff
      c: 'Bissell and McCone agree he will resign at the end of December. McCone''s wife dies; he calls from California: no move, he is unsure he can go on. Back in Washington in early January. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 203. See [[cal.1961-11-28.transition-and-staff]]. Names: Bissell, McCone. Check: the days.'
      tags:
      - name:bissell-richard-m-jr
      - name:mccone-john-a
      src:
        c: f3ac3dfb
        rows:
        - 'w.bissell-reflections-of-a-cold 203: all'
