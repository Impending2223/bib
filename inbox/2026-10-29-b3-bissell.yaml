      id: cal.1962-02.soviet-union-u2
      when: Feb.
      date: 1962-02
      thread: soviet-union-u2
      c: 'Powers home, a board of inquiry: Barrett Prettyman, a retired federal judge; John Bross of the CIA; General Harold Bull; Geary its technical adviser. Powers cleared. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 129. See [[cal.1962-02-10.berlin-and-vienna]]. Names: Powers. Check: the days.'
