- add:
    entry:
      id: cal.1961-05.laos
      when: May
      date: 1961-05
      thread: laos
      also:
      - vietnam
      c: 'Kennedy lets Harriman try for a cease-fire and a neutral Laos. Bissell protests to Rostow that every American asset there is being thrown away; Rostow: the President''s position, Laos cannot be won, the wrong place; the issue will be decided in Vietnam. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 148. See [[cal.1961-03-23.laos]]. Names: Kennedy, Harriman, Bissell, Rostow. Check: the month: Bissell gives "later."'
      tags:
