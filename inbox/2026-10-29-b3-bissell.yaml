- add:
    entry:
      id: cal.1960-04-27.soviet-union-u2
      when: Apr. 27–May 1
      date: '1960-04-27'
      thread: soviet-union-u2
      c: Powers flies from Turkey to Peshawar, Pakistan, for the mission, a Quickmove deployment; Beerli to Bodø, Norway, Apr. 28, to meet him. Weather puts the flight off day after day, the aircraft shuttled back and forth, the team waiting at Peshawar; by Beerli, security compromised. The go-ahead May 1. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 126. To check: [[w.powers-operation-overflight]], 74–75; Tamnes, *The United States and the Cold War in the High North* (1991), 135; Beerli, interview by Jonathan E. Lewis, Feb. 25, 1994 (cited by [[w.bissell-reflections-of-a-cold]], 126 nn.37–38). See [[cal.1960-04.soviet-union]]. Names: Powers.'
      tags:
      - name:powers-francis-gary
      - name:beerli-stanley-w
      src:
        c: 401b9f38
        rows:
        - 'w.bissell-reflections-of-a-cold 126: all'
        - 'via w.bissell-reflections-of-a-cold 126 n.37a: all'
        - 'via w.bissell-reflections-of-a-cold 126 n.37c: A-B'
    section: '196004'
- add:
    entry:
      id: cal.1960-05-01.soviet-union-u2
      when: May 1
      date: '1960-05-01'
      thread: soviet-union-u2
      c: 'At Bodø, Beerli waits five hours past Powers''s time, then flies to Oslo, the code call unmade. In Washington the project''s duty officer calls King, Bissell''s assistant: "Bill Bailey didn''t come home." Bissell, visiting Rostow, flies back to the project office. By Bissell''s account, after King''s.'
      n: '[[w.bissell-reflections-of-a-cold]], 126–28. To check: Robert King, interview by Jonathan E. Lewis, May 27, 1992 (cited by [[w.bissell-reflections-of-a-cold]], 128 n.42). See [[cal.1960-05-01.soviet-union]]. Names: Bissell, Rostow.'
      tags:
      - name:beerli-stanley-w
      - name:bissell-richard-m-jr
      - name:rostow-walt-w
      src:
        c: f2531472
        rows:
        - 'w.bissell-reflections-of-a-cold 126–28: all'
        - 'via w.bissell-reflections-of-a-cold 128 n.42a: B-C'
    section: '196005'
- add:
    entry:
      id: cal.1960-05-07.soviet-union-u2
      when: May 7–9
      date: '1960-05-07'
      thread: soviet-union-u2
      c: 'Powers alive, the cover story broken. Bissell for some hours with Herter, Dulles and others drafting a statement to be made by the President or in his name: deny knowing, and be said not to control his government, or own the flights. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 128. See [[cal.1960-05-09.soviet-union]]. Names: Bissell, Herter, Dulles. Check: the day: Bissell gives none; Khrushchev told the Supreme Soviet the pilot was alive May 7.'
      tags:
      - name:bissell-richard-m-jr
      - name:herter-christian-a
      - name:dulles-allen-w
      src:
        c: d3a459cf
        rows:
        - 'w.bissell-reflections-of-a-cold 128: all'
    section: '196005'
- add:
    entry:
      id: cal.1960-05-20.soviet-union-u2-2
      when: May 20
      date: '1960-05-20'
      thread: soviet-union-u2
      c: 'Eisenhower, going over Lodge''s speech for the UN: the only real mistake the government''s handling in the first days, "statements were made too soon"; the "administration and training of some of our intelligence units were weak."'
      n: '[[w.bissell-reflections-of-a-cold]], 130 (Goodpaster''s memorandum quoted). To check: Goodpaster, memorandum of a conference with the President, May 26, 1960, U-2 Incident, vol. 1, May 1960 (8), Box 25, Office of the Staff Secretary, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 130 n.44). See [[cal.1960-05-09.soviet-union]]. Names: Eisenhower, Lodge. Check: the day: the memorandum is dated May 26.'
      tags:
      - name:eisenhower-dwight-d
      - name:lodge-henry-cabot
      src:
        c: eecce8e0
        rows:
        - 'w.bissell-reflections-of-a-cold 130: all'
        - 'via w.bissell-reflections-of-a-cold 130 n.44b: all'
    section: '196005'
- add:
    entry:
      id: cal.1960-05-31.soviet-union-u2
      when: May 31
      date: '1960-05-31'
      thread: soviet-union-u2
      c: 'Gordon Gray alone with Eisenhower. The President: he had held the program "on a tight although informal basis," against leaks, with success; "the only thing to do now is to ride out the storm." No more overflights of the Soviet Union.'
      n: '[[w.bissell-reflections-of-a-cold]], 130 (Gray''s memorandum quoted). To check: Gordon Gray, memorandum of meeting with the President, June 1, 1960, 1960 Meetings with the President, vol. 1 (3), Box 4, Office of the Special Assistant for National Security Affairs, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 130 n.45). See [[cal.1960-05-09.soviet-union]]. Names: Gordon Gray, Eisenhower.'
      tags:
      - name:gray-gordon
      - name:eisenhower-dwight-d
      src:
        c: cbfb2228
        rows:
        - 'w.bissell-reflections-of-a-cold 130: all'
        - 'via w.bissell-reflections-of-a-cold 130 n.45a: A-B'
    section: '196005'
- add:
    entry:
      id: cal.1960-10-18.cuba-2
      when: Oct. 18
      date: '1960-10-18'
      thread: cuba
      c: 'The synopsis of State and intelligence material for the President: Castro has executed twenty men for counter-revolution, three Americans among them; a block-by-block spy system in Santiago; the city silent.'
      n: '[[w.bissell-reflections-of-a-cold]], 155 (the synopsis). To check: Synopsis of State and Intelligence Material Reported to the President, Oct. 18, 1960, Intelligence Briefing Notes, vol. 2 (6), Box 14, Office of the Staff Secretary, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 155 n.4). See [[cal.1960-10-19.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: abe4b54f
        rows:
        - 'w.bissell-reflections-of-a-cold 155: all'
        - 'via w.bissell-reflections-of-a-cold 155 n.4a: all'
    section: '196010'
- add:
    entry:
      id: cal.1960-11-14.elections-1960
      when: Nov. 14
      date: '1960-11-14'
      thread: elections-1960
      also:
      - cuba-bay-of-pigs
      c: 'Bissell to Edmond Thomas, on the election: "I am glad it came out as it did"; Kennedy surrounded by men with "a much livelier awareness than the Republicans of the extreme crisis"; the Democrats "far less inhibited." Not sure how long he wants to stay in the business.'
      n: '[[w.bissell-reflections-of-a-cold]], 159–60 (the letter quoted). To check: Bissell to Edmond G. Thomas, Nov. 14, 1960, Papers of Richard M. Bissell, Jr. (cited by [[w.bissell-reflections-of-a-cold]], 160 n.9). See [[cal.1960-10.elections-1960]]. Names: Bissell, Kennedy.'
      tags:
      - name:bissell-richard-m-jr
      - name:kennedy-john-f
      src:
        c: d16cbdfe
        rows:
        - 'w.bissell-reflections-of-a-cold 159–60: all'
        - 'via w.bissell-reflections-of-a-cold 160 n.9a: all'
    section: '196011'
- add:
    entry:
      id: cal.1960-11.cuba-bay-of-pigs-3
      when: Nov.
      date: 1960-11
      thread: cuba-bay-of-pigs
      c: 'From late November, Bissell asks the Air Force at least twice for officers to train the brigade''s air arm; no answer. Bissell to Hawkins, the brigade to be a landing force: under 500 men too few, another 1,000 to 1,500 needed. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 156–57, 176. See [[cal.1960-11-04.cuba]]. Names: Bissell, Hawkins. Check: the days.'
      tags:
      - name:bissell-richard-m-jr
      - name:hawkins-jack
      src:
        c: c3f2e2d2
        rows:
        - 'w.bissell-reflections-of-a-cold 156–57, 176: all'
    section: '196011'
- add:
    entry:
      id: cal.1960-12.cuba-bay-of-pigs-2
      when: Dec.
      date: 1960-12
      thread: cuba-bay-of-pigs
      c: The Special Group. Douglas, Deputy Secretary of Defense, relays the Air Force's concerns and questions the support already given the project. By mid-January the Air Force's men are withdrawn; the Air National Guard steps in. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 176. To check: [[w.currey-edward-lansdale]], 210–11 (cited by [[w.bissell-reflections-of-a-cold]], 176 n.28). See [[cal.1960-12-08.cuba]]. Names: Douglas. Check: the day.'
      tags:
      - name:douglas-james-h-jr
      src:
        c: 67415d84
        rows:
        - 'w.bissell-reflections-of-a-cold 176: all'
    section: '196012'
- add:
    entry:
      id: cal.1961-02.transition-and-staff
      when: Feb.
      date: 1961-02
      thread: transition-and-staff
      c: Bowles offers Bissell the post of Deputy Under Secretary for Political Affairs; Rusk agrees, Bissell not to be State's link to the CIA. Kennedy would rather he stayed Deputy Director for Plans; Bissell stays. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 192. See [[cal.1961-01-20.transition-and-staff]]. Names: Bowles, Bissell, Rusk, Kennedy. Check: the month: Bissell gives "early in 1961."'
      tags:
      - name:bowles-chester
      - name:bissell-richard-m-jr
      - name:rusk-dean
      - name:kennedy-john-f
      src:
        c: 1fb399c1
        rows:
        - 'w.bissell-reflections-of-a-cold 192: all'
    section: '196102'
- add:
    entry:
      id: cal.1961-01.laos
      when: Jan.
      date: 1961-01
      thread: laos
      c: 'Bissell in Vientiane, before the first weeks of the Kennedy administration. By his account: the Royal Army could never carry out the Chiefs'' plan to retake the Plaine des Jarres.'
      n: '[[w.bissell-reflections-of-a-cold]], 147–48. See [[cal.1961-01-19.laos]]. Names: Bissell. Check: the month: Bissell says only that he had "recently returned from Vientiane" when the plan was briefed.'
      tags:
      - name:bissell-richard-m-jr
      src:
        c: 35a3aff2
        rows:
        - 'w.bissell-reflections-of-a-cold 147–48: all'
    section: '196101'
- add:
    entry:
      id: cal.1961-03-10.cuba-2
      when: Mar. 10
      date: '1961-03-10'
      thread: cuba-bay-of-pigs
      c: 'A CIA information report: "many people in Camaguey believe that the Castro regime is tottering and that the situation can at any moment degenerate into bloody anarchy"; risings in Oriente; food short in a disgruntled militia.'
      n: '[[w.bissell-reflections-of-a-cold]], 180 (the report quoted). To check: Information Report, Mar. 10, 1961, CIA Directorate of Plans Files (cited by [[w.bissell-reflections-of-a-cold]], 181 n.32). See [[cal.1961-03-10.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 2883ee9a
        rows:
        - 'w.bissell-reflections-of-a-cold 180: all'
        - 'via w.bissell-reflections-of-a-cold 181 n.32a: all'
    section: '196103'
- add:
    entry:
      id: cal.1961-03-16.cuba-2
      when: Mar. 16
      date: '1961-03-16'
      thread: cuba-bay-of-pigs
      c: 'A CIA information report from Las Villas: "large numbers of militiamen have refused to fight"; "approximately 75 to 80 percent of the militia units will defect when it becomes evident that the real fight against Castro has begun."'
      n: '[[w.bissell-reflections-of-a-cold]], 180 (the report quoted). To check: Information Report, Mar. 16, 1961, CIA Directorate of Plans Files (cited by [[w.bissell-reflections-of-a-cold]], 181 n.32). See [[cal.1961-03-16.cuba]]. Names: Castro. Check: the day: Bissell gives "later in March"; his note dates the reports Mar. 10, Mar. 16 and Apr. 6.'
      tags:
      - name:castro-fidel
      src:
        c: d418d7c9
        rows:
        - 'w.bissell-reflections-of-a-cold 180: all'
        - 'via w.bissell-reflections-of-a-cold 181 n.32b: all'
    section: '196103'
- add:
    entry:
      id: cal.1961-04-06.cuba-2
      when: Apr. 6
      date: '1961-04-06'
      thread: cuba-bay-of-pigs
      c: 'A CIA information report: "The Castro regime is steadily losing popularity"; "All of Oriente province is seething with hate"; the army believed penetrated by the opposition, unwilling to fight in a showdown.'
      n: '[[w.bissell-reflections-of-a-cold]], 180–81 (the report quoted). To check: Information Report, Apr. 6, 1961, CIA Directorate of Plans Files (cited by [[w.bissell-reflections-of-a-cold]], 181 n.32). See [[cal.1961-04-06.cuba]]. Names: Castro. Check: the day: Bissell gives "the first week of April."'
      tags:
      - name:castro-fidel
      src:
        c: 1dc40684
        rows:
        - 'w.bissell-reflections-of-a-cold 180–81: all'
        - 'via w.bissell-reflections-of-a-cold 181 n.32c: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-5
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: Outside the Cabinet Room before a White House meeting on Cuba, David Gray tells Bissell that at the Chiefs' meeting the day before LeMay, sitting in for the Marine Commandant, and several of the Chiefs doubted that air cover was essential. Hawkins, told, "exceedingly angry." By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 175. See [[cal.1960-03-17.cuba]]. Names: David Gray, Bissell, LeMay, Hawkins. Check: the day.'
      tags:
      - name:gray-david-w
      - name:bissell-richard-m-jr
      - name:lemay-curtis-e
      - name:hawkins-jack
      src:
        c: d98d02cf
        rows:
        - 'w.bissell-reflections-of-a-cold 175: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-16.cuba-5
      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      c: 'CIA headquarters, about 10:30 p.m. Cabell and Bissell bring word that the strikes are off. Hawkins: "Goddamn it, this is criminal negligence"; Esterline: "the goddamnest thing I have ever heard of." Cabell: "you have to take your orders and do what you are told." By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 184–85. See [[cal.1961-04-16.cuba]]. Names: Cabell, Bissell, Hawkins, Esterline.'
      tags:
      - name:cabell-charles-p
      - name:bissell-richard-m-jr
      - name:hawkins-jack
      - name:esterline-j-d
      src:
        c: 453aa6ad
        rows:
        - 'w.bissell-reflections-of-a-cold 184–85: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-18.cuba-11
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'Rostow at the CIA''s headquarters through the day: the staff "pulling at Dickie''s coat, begging him to send in the army"; the cables worse and worse. Rostow calls O''Donnell: Bissell has a message for the President; at night he drives Bissell to the White House. By Bissell''s account, after Rostow''s.'
      n: '[[w.bissell-reflections-of-a-cold]], 188–89. To check: Rostow, interview by Jonathan E. Lewis (cited by [[w.bissell-reflections-of-a-cold]], 189 n.39). See [[cal.1961-04-18.cuba-9]]. Names: Rostow, Bissell, O''Donnell.'
      tags:
      - name:rostow-walt-w
      - name:bissell-richard-m-jr
      - name:odonnell-kenneth-p
      src:
        c: 731a441c
        rows:
        - 'w.bissell-reflections-of-a-cold 188–89: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-20.cuba-4
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba-bay-of-pigs
      c: 'The morning after, Lundahl in Bissell''s office; Kennedy calls a couple of times. Bissell to Lundahl: heads will roll, but the photo interpreters'' information "was absolutely right." Berle calls: "I voted for this operation; I still believe we should have tried." By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 190–91. To check: Arthur Lundahl, interview by Jonathan E. Lewis, Jan. 23, 1992 (cited by [[w.bissell-reflections-of-a-cold]], 191 n.42). See [[cal.1961-04-20.cuba]]. Names: Lundahl, Bissell, Kennedy, Berle. Check: the day: Bissell, "the morning after the debacle"; Berle''s call undated.'
      tags:
      - name:bissell-richard-m-jr
      - name:kennedy-john-f
      - name:berle-adolf-a
      src:
        c: 782b32fc
        rows:
        - 'w.bissell-reflections-of-a-cold 190–91: all'
        - 'via w.bissell-reflections-of-a-cold 191 n.42a: A-B'
    section: '196104'
- add:
    entry:
      id: cal.1961-04.defense
      when: Apr.
      date: 1961-04
      thread: defense
      also:
      - soviet-union-u2
      c: 'Bissell to Kelly Johnson of Lockheed on the A-12''s first flight put off again, from Aug. 30 to Dec. 1: "extremely shocking"; "I trust this is the last of such disappointments short of a severe earthquake in Burbank." By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 133 (the letter quoted). To check: Mclninch, "The Oxcart Story," *Studies in Intelligence* 26, no. 2 (1982), 32 (cited by [[w.bissell-reflections-of-a-cold]], 133 n.54). See [[cal.1960-06-02.defense]]. Names: Bissell. Check: the month: Bissell gives "spring 1961."'
      tags:
      - name:bissell-richard-m-jr
      src:
        c: 52ab55d2
        rows:
        - 'w.bissell-reflections-of-a-cold 133: all'
        - 'via w.bissell-reflections-of-a-cold 133 n.54a: all'
