- add:
    entry:
      id: cal.1961-11-23.cuba
      when: Nov. 23–26
      date: '1961-11-23'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Thanksgiving weekend. Bissell telephones Robert Kennedy at Hyannis Port two or three times: the CIA trying to meet all of Lansdale''s requests. Robert Kennedy neither objects nor approves; he urges more speed. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 202. See [[cal.1961-11-04.cuba]]. Names: Bissell, Robert Kennedy, Lansdale.'
      tags:
      - name:bissell-richard-m-jr
