      when: Oct.
      date: 1962-10
      thread: cuba
      c: 'As the missile crisis begins, Helms''s assistant for Cuba to Helms: in the past year policy makers "not only shied away from the military intervention aspect, but were generally apprehensive of sabotage proposals." By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 202 (the memorandum quoted). To check: [S. Rep. No. 94-465, 146 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=157) (cited by [[w.bissell-reflections-of-a-cold]], 202 n.59). See [[cal.1962-03-14.cuba]]. Names: Helms. Check: the day.'
