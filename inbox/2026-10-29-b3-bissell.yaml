- edit:
    id: cal.1960-08-25.congo
    base: 19abdd78
    set:
      c: 'Special Group, Aug. 25: Gray reports "extremely strong feelings" for "very straightforward action"; planning not to rule out "consideration" of any activity "which might contribute to getting rid of Lumumba." Dulles to the station in Léopoldville, Aug. 26: "his removal must be an urgent and prime objective." By Bissell''s account, Helms released the cable, Bissell on vacation.'
      n: '[FRUS 1964–68, XXIII, docs. 12](https://history.state.gov/historicaldocuments/frus1964-68v23/d12) (the minutes), [14](https://history.state.gov/historicaldocuments/frus1964-68v23/d14) (the cable, dated Aug. 27). [S. Rep. No. 94-465, 14–15 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25) (K–J Adm. II.H.3). [[w.bissell-reflections-of-a-cold]], 143–44 (the minutes and the cable quoted; Helms). See [[cal.1960-08-18.congo-2]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Gray, Dulles, Lumumba. Check: Bissell has the President himself express the "extremely strong feelings" at a meeting with the Special Group (143); by the minutes, Gray reports them.'
      src:
        c: 8cf45612
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v23/d12: all'
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=25: all'
        - 'w.bissell-reflections-of-a-cold 143–44: A-D'
        - 'via w.bissell-reflections-of-a-cold 144 n.3a: A-C'
