    section: '196203'
- add:
    entry:
      id: cal.1960-02.space
      when: Feb.
      date: 1960-02
      thread: space
      c: Discoverer X, the tenth Corona, fails to reach orbit. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 137. To check: Richelson, "The Keyhole Satellite Program," 7 J. Strategic Stud. 127 (1984); Brugioni, *Eyeball to Eyeball* (1991), 53; Burrows, *Deep Black* (1986), 90 (cited by [[w.bissell-reflections-of-a-cold]], 137 n.63). Bibliography: [[cal.1960-08-11.space]]. Check: the day.'
