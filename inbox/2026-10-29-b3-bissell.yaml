- add:
    entry:
      id: cal.1962-01-18.cuba
      when: Jan. 18
      date: '1962-01-18'
      thread: cuba-bay-of-pigs
      c: 'Bissell''s answer to the Inspector General''s survey, "An Analysis of the Cuban Operation": a large majority of the survey''s conclusions "misleading or wrong"; the Agency''s command and organization what they should have been; its intelligence on the regime "essentially accurate"; the survey lays the blame on the Agency alone. By McCone''s direction, attached to the survey.'
      n: '[FRUS 1961–63, X–XII, microfiche supplement, doc. 278D](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d278d). [[w.bissell-reflections-of-a-cold]], 193 (McCone lets him answer in writing, the answer attached). To check: Kirkpatrick, "Inspector General''s Survey of the Cuban Operation," Oct. 1961, in [[w.bay-of-pigs-declassified]]. See [[cal.1961-06-13.cuba]]. Names: Bissell, McCone.'
      tags:
      - name:bissell-richard-m-jr
      - name:mccone-john-a
      src:
