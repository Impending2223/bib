        - 'via w.bissell-reflections-of-a-cold 149 n.8a: A'
        - 'via w.bissell-reflections-of-a-cold 149 n.8b: A'
    section: '196102'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-2
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      also:
      - robert-kennedy
      c: 'Shortly before the landing, at the President''s request, Bissell briefs Robert Kennedy alone in his office: a very good chance of seizing and holding the beachhead. Robert Kennedy: "I hope you''re right." By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 182–83. See [[cal.1960-03-17.cuba]]. Names: Bissell, Robert Kennedy, Kennedy. Check: the day.'
      tags:
      - name:bissell-richard-m-jr
      - name:kennedy-robert-f
      - name:kennedy-john-f
      src:
        c: 247dd7ae
        rows:
        - 'w.bissell-reflections-of-a-cold 182–83: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04.cuba-bay-of-pigs-3
      when: Apr.
      date: 1961-04
      thread: cuba-bay-of-pigs
      c: 'About a week before the landing, Bissell asks Geary, the Air Force officer on his staff, to judge the air plan: "a barebones plan, ... a skeleton," workable, "but you had to have the whole thing." At Bissell''s asking, Geary repeats it to Burke. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 181–82. To check: Geary, interview by Jonathan E. Lewis, Feb. 27, 1994 (cited by [[w.bissell-reflections-of-a-cold]], 182 n.33). See [[cal.1960-03-17.cuba]]. Names: Bissell, Burke. Check: the day.'
      tags:
      - name:bissell-richard-m-jr
      - name:burke-arleigh-a
      src:
        c: faaf6050
        rows:
        - 'w.bissell-reflections-of-a-cold 181–82: all'
        - 'via w.bissell-reflections-of-a-cold 182 n.33a: A-B'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-18.cuba-9
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'The White House situation room, 7 a.m.: Dulles, Cabell and Bissell give Kennedy, Bundy, Rostow and the military aide the news from the beaches; no fallback raised. Rostow to spend the day at the CIA''s headquarters. By Bissell''s account, after Rostow''s.'
      n: '[[w.bissell-reflections-of-a-cold]], 188. To check: [[w.rostow-diffusion-of-power]], 209; Rostow, oral history interview by Richard Neustadt, Apr. 11, 1964, Kennedy Library (cited by [[w.bissell-reflections-of-a-cold]], 188 n.38). See [[cal.1961-04-18.cuba-4]]. Names: Dulles, Cabell, Bissell, Kennedy, McGeorge Bundy, Rostow.'
      tags:
      - name:dulles-allen-w
      - name:cabell-charles-p
      - name:bissell-richard-m-jr
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:rostow-walt-w
      src:
        c: 7ef6d4d6
        rows:
        - 'w.bissell-reflections-of-a-cold 188: all'
        - 'via w.bissell-reflections-of-a-cold 188 n.38a: A-B'
        - 'via w.bissell-reflections-of-a-cold 188 n.38b: A-B'
    section: '196104'
- add:
    entry:
      id: cal.1961-10.cuba-2
      when: Oct.
      date: 1961-10
      thread: cuba
      also:
      - robert-kennedy
      c: 'The Cabinet Room. By the testimony in 1975 of the assistant to the head of Task Force W, the President and the Attorney General chew Bissell out "for, as he put it, sitting on his ass and not doing anything about getting rid of Castro and the Castro regime"; Bissell has him draw up plans. Bissell, 1975: no memory of the meeting, but told, in essence, to "get off your ass about Cuba."'
      n: '[S. Rep. No. 94-465, 141 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=152). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.bissell-reflections-of-a-cold]], 201 (Bissell does not remember it). See [[cal.1961-08-31.cuba]]. Names: Kennedy, Robert Kennedy, Bissell, Castro. Check: the month: the assistant says "early in the fall of 1961."'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:bissell-richard-m-jr
      - name:castro-fidel
      src:
        c: 0c128980
        rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=152: all'
        - 'w.bissell-reflections-of-a-cold 201: B, D'
        - 'via w.bissell-reflections-of-a-cold 201 n.57a: B, D'
    section: '196110'
- add:
    entry:
      id: cal.1961-10-03.vietnam
      when: Oct. 3
      date: '1961-10-03'
      thread: vietnam
      c: 'William Bundy''s planning group at lunch: Rostow, Bissell, Amory, Nitze and others. Vietnam: on the present basis "we were doing badly," the outcome unfavorable without a major change; talking directly to the Soviets "pretty unanimously rejected"; going to the UN a real possibility. The talk helps set off Rostow''s proposal of SEATO forces.'
      n: '[FRUS 1961–63, I, doc. 144](https://history.state.gov/historicaldocuments/frus1961-63v01/d144) (Bundy''s memorandum, Oct. 5). Made public: FRUS 1961–63, I (1988). [[w.bissell-reflections-of-a-cold]], 150 (the lunches; the talks with the Soviets rejected). See [[cal.1961-01-28.vietnam]]. Names: William Bundy, Rostow, Bissell, Amory, Nitze.'
      tags:
      - name:bundy-william
