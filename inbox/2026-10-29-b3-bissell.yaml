    section: '196202'
- add:
    entry:
      id: cal.1962-03-01.transition-and-staff
      when: Mar. 1
      date: '1962-03-01'
      thread: transition-and-staff
      c: 'At the White House, Kennedy gives Bissell the National Security Medal, Bundy present: "In vital areas of scientific intelligence collection, his achievements have been unique."'
      n: '[[w.bissell-reflections-of-a-cold]], 203–4 (the citation). See [[cal.1961-11-28.transition-and-staff]]. Names: Kennedy, Bissell, McGeorge Bundy.'
      tags:
      - name:kennedy-john-f
