- add:
    entry:
      id: cal.1960-01-25.cuba
      when: Jan. 25
      date: '1960-01-25'
      thread: cuba
      c: 'Eisenhower with Herter, Rubottom, Bonsal, Persons and Goodpaster, 11:15 a.m., Bonsal called home. Eisenhower: Castro "begins to look like a mad man"; Bonsal: an extreme leftist, strongly anti-American. The best course the OAS''s restraint of Castro; Rubottom doubts the votes. Eisenhower, should things grow worse: "we could quarantine Cuba. If they (the Cuban people) are hungry, they will throw Castro out"; Bonsal against punishing the whole people. Eisenhower to make "a friendly but firm statement."'
      n: '[FRUS 1958–60, VI, doc. 436](https://history.state.gov/historicaldocuments/frus1958-60v06/d436) (Goodpaster''s memorandum, drafted Jan. 26). Made public: FRUS 1958–60, VI (1991). [[w.bissell-reflections-of-a-cold]], 152–53 (the "mad man"; the quarantine). The statement: [[cal.1960-01-26.cuba]]. See [[cal.1960-01-20.cuba]]. Names: Eisenhower, Herter, Rubottom, Bonsal, Persons, Goodpaster, Castro.'
      tags:
      - name:eisenhower-dwight-d
      - name:herter-christian-a
      - name:rubottom-roy-r-jr
      - name:bonsal-philip-w
      - name:persons-wilton-b
      - name:goodpaster-andrew-j
      - name:castro-fidel
      src:
        c: 1212b98d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d436: all'
        - 'w.bissell-reflections-of-a-cold 152–53: B, F'
        - 'via w.bissell-reflections-of-a-cold 153 n.1a: B, F'
    section: '196001'
- add:
    entry:
      id: cal.1960-02.soviet-union
      when: Feb.
      date: 1960-02
      thread: soviet-union
      also:
      - soviet-union-u2
      c: 'Eisenhower with his Board of Consultants on Foreign Intelligence Activities, by Goodpaster''s memorandum as Bissell gives it. The board: overflights to "be utilized to the maximum degree possible." Eisenhower: his "one tremendous asset in a summit meeting," his "reputation for honesty"; a plane lost "could be put on display in Moscow."'
      n: '[[w.bissell-reflections-of-a-cold]], 123. To check: Goodpaster, memorandum for the record, Feb. 8, 1960, Intelligence Matters (13), Box 15, Office of the Staff Secretary, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 123 n.32). Bibliography: [[cal.1960-05-01.soviet-union]]. Names: Eisenhower, Goodpaster. Check: the day: Bissell gives "February 1960"; the memorandum is dated Feb. 8.'
      tags:
      - name:eisenhower-dwight-d
      - name:goodpaster-andrew-j
      src:
        c: 3fe99f9b
        rows:
        - 'w.bissell-reflections-of-a-cold 123: all'
        - 'via w.bissell-reflections-of-a-cold 123 n.32a: all'
    section: '196002'
- add:
    entry:
      id: cal.1960-04.soviet-union
      when: Apr.
      date: 1960-04
      thread: soviet-union
      also:
      - soviet-union-u2
      c: A U-2 over the Soviet Union, tracked from early in its flight; the interceptions fail. Its photographs show an ICBM site going in at Plesetsk, some 600 miles north of Moscow. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 123–24. To check: [[w.beschloss-mayday]], 241–42 (cited by [[w.bissell-reflections-of-a-cold]], 124 n.34). Bibliography: [[cal.1960-05-01.soviet-union]]. Check: the day: Bissell gives "the beginning of April 1960."'
      src:
        c: c46eac0e
        rows:
        - 'w.bissell-reflections-of-a-cold 123–24: all'
        - 'via w.bissell-reflections-of-a-cold 124 n.34a: B'
    section: '196004'
- add:
    entry:
      id: cal.1960-05-18.soviet-union-u2
      when: May 18
      date: '1960-05-18'
      thread: soviet-union-u2
      c: 'The embassy in Kabul to Herter: the Afghan Foreign Minister protests the flight over Afghanistan, its details given him by the Soviets. Powers, four days at Peshawar, "entertained socially by his Pakistani officer opposite numbers, who knew all about his mission."'
      n: '[[w.bissell-reflections-of-a-cold]], 126 (the telegram quoted). To check: the embassy in Kabul to Herter, telegram, May 18, 1960, U-2 Incident, vol. 1, May 1960 (7), Box 25, Office of the Staff Secretary, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 126 n.39). See [[cal.1960-05-01.soviet-union]]. Names: Herter, Powers.'
      tags:
      - name:herter-christian-a
      - name:powers-francis-gary
      src:
        c: 2a4b6a5a
        rows:
        - 'w.bissell-reflections-of-a-cold 126: all'
        - 'via w.bissell-reflections-of-a-cold 126 n.39a: all'
    section: '196005'
- add:
    entry:
      id: cal.1960-06-02.defense
      when: June 2
      date: '1960-06-02'
      thread: defense
      also:
      - soviet-union-u2
      c: 'Goodpaster with Eisenhower on the A-12, the U-2''s successor: not to be pushed as a top priority; his advisers might conclude "it would be best to get out of it if we could." The program goes on.'
      n: '[[w.bissell-reflections-of-a-cold]], 131 (Goodpaster''s memorandum quoted). To check: Goodpaster, memorandum for the record, June 2, 1960, Intelligence Matters (15), Box 15, Office of the Staff Secretary, Eisenhower Library (cited by [[w.bissell-reflections-of-a-cold]], 131 n.47). See [[cal.1960-05-01.soviet-union]]. Names: Goodpaster, Eisenhower. Check: the day of the talk: Bissell, "a month after Powers was shot down."'
      tags:
      - name:goodpaster-andrew-j
      - name:eisenhower-dwight-d
      src:
        c: 7c4b1595
        rows:
        - 'w.bissell-reflections-of-a-cold 131: all'
        - 'via w.bissell-reflections-of-a-cold 131 n.47a: A-B'
    section: '196006'
- add:
    entry:
      id: cal.1960-11.cuba-bay-of-pigs
      when: Nov.
      date: 1960-11
      thread: cuba-bay-of-pigs
      also:
      - latin-america
      c: 'About 3:30 a.m., a cable from the CIA''s man in Guatemala: Ydígoras asks to borrow men of the brigade against a rising, an answer within the hour. Mann will not act before seeing Herter. About 5 a.m., on his own responsibility, Bissell cables yes: Civil Air Transport pilots if needed, no soldiers. By Bissell''s account.'
      n: '[[w.bissell-reflections-of-a-cold]], 158–59. See [[cal.1960-08-18.cuba]]. Names: Ydígoras, Mann, Herter, Bissell. Check: the day: Bissell gives "mid-November"; the rising, Nov. 13 ([[cal.1960-11-17.latin-america]]).'
      tags:
      - name:ydigoras-fuentes-miguel
      - name:mann-thomas-c
      - name:herter-christian-a
      - name:bissell-richard-m-jr
      src:
        c: a0441e53
        rows:
        - 'w.bissell-reflections-of-a-cold 158–59: all'
    section: '196011'
- add:
    entry:
      id: cal.1960-12-08.cuba-2
      when: Dec. 8
      date: '1960-12-08'
      thread: cuba
      also:
      - cuba-bay-of-pigs
      c: 'SNIE 85-3-60, Prospects for the Castro Regime, six months ahead: Castro "firmly in control"; the militia some 200,000, the army about 32,000; the Government, "for most practical purposes," Communist. Internal resistance risen but "still generally ineffective"; the guerrillas in the Escambray and Oriente contained; no shift of popular opinion away from Castro foreseen.'
      n: '[FRUS 1958–60, VI, doc. 620](https://history.state.gov/historicaldocuments/frus1958-60v06/d620). Made public: FRUS 1958–60, VI (1991). [[w.bissell-reflections-of-a-cold]], 160–61 (the estimate quoted). See [[cal.1960-01-20.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: a1255604
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v06/d620: all'
        - 'w.bissell-reflections-of-a-cold 160–61: A, D-F'
        - 'via w.bissell-reflections-of-a-cold 161 n.11a: A, D-F'
    section: '196012'
- add:
    entry:
      id: cal.1961-01-18.cuba-2
      when: Jan. 18
      date: '1961-01-18'
      thread: cuba-bay-of-pigs
      c: 'Willauer to Merchant, on the program of Dec. 6: the plan, updated, might not succeed; it would not be set off unless the Government were ready to do whatever else was needed, overtly or covertly, to guarantee success. The new administration to decide at once on American bases for the air strikes and supply, on moving the force from Guatemala to the United States, on recognizing a provisional government and how far that permits overt support. Failing the decisions, "open U.S. war with Cuba" or seven months'' overt training of an invasion force on American soil.'
      n: '[FRUS 1961–63, X–XII, microfiche supplement, doc. 239](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d239). [[w.bissell-reflections-of-a-cold]], 162 (the memorandum quoted). See [[cal.1960-12-08.cuba]]. Names: Willauer, Merchant.'
      tags:
      - name:willauer-whiting
      - name:merchant-livingston-t
      src:
        c: fee1251f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d239: all'
        - 'w.bissell-reflections-of-a-cold 162: all'
        - 'via w.bissell-reflections-of-a-cold 162 n.13a: all'
    section: '196101'
- add:
    entry:
      id: cal.1961-02.defense
      when: Feb.
      date: 1961-02
      thread: defense
      c: Kennedy approves Rostow's list of nineteen tasks under five heads; Bissell to head the task force on the first, the deterrence of guerrilla warfare. By Bissell's account.
      n: '[[w.bissell-reflections-of-a-cold]], 149. To check: [[w.rostow-diffusion-of-power]], 169; Rostow, oral history interview by Richard Neustadt, Apr. 11, 1964, Kennedy Library (cited by [[w.bissell-reflections-of-a-cold]], 149 n.8). See [[cal.1961-02-01.defense]]. Names: Kennedy, Rostow, Bissell. Check: the day.'
      tags:
      - name:kennedy-john-f
      - name:rostow-walt-w
      - name:bissell-richard-m-jr
      src:
