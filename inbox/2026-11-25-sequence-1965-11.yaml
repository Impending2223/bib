    why: 'Yang Shangkun''s diary, II, 685, joins the two in one sentence with a comma: "参加书记处会议到7时，彭真同志已通知我的工作的调动" (at the Secretariat meeting until 7; Peng Zhen has already told me of my transfer). No word puts the telling after the meeting; "已" (already) puts it at the meeting or before it, and Peng Zhen presided at that meeting (Peng Zhen nianpu, IV, 446).'
