      n: '[[w.zhou-enlai-nianpu-1949]], II, 766 (Nov. 22–23, 1965); [[w.zhou-enlai-waijiao-huodong]], 486 (Nov. 22–23, 1965; Nov. 22, 4:45 p.m., Beijing Hall, Great Hall of the People, the meeting and talks with Kawawa; Nov. 23, 10 a.m., alone, and 4:30 p.m., Building 18, Diaoyutai guesthouse; 5 p.m., with Song Qingling, Kawawa received); [[w.zhonghua-renmin-gongheguo-waijiao]], 71 (Nov. 22–24, 1965; Kawawa''s visit, Nov. 22–24; Song Qingling receives him; Zhou on the Afro-Asian conference, the Japan–ROK treaty, Vietnam and Indochina, Zimbabwe). The time is the first day''s. Made public: 1993. Names: Zhou Enlai, Kawawa, Song Qingling.'
