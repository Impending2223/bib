by: 'Claude (batch 9, group 3: Gifford, Longley, White 1960, Califano; the "already in" rows), Nov. 11-12, 2026'
ops:
- cite:
    id: cal.1960-04-05.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 43 (Rockefeller "completely ignored by Wisconsin voters in April"; not the vote or Humphrey)'
    units: '?'
- cite:
    id: cal.1960-05-20.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 43 (Rockefeller wins "an inconsequential number of write-in ballots" in Oregon; not the figures or the Democratic race)'
    units: '?'
- cite:
    id: cal.1960-07-24.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 76 (Rockefeller at the NAACP rally says he is willing to start a floor fight on the civil rights plank, seconded by Hugh Scott; not the church, King or Wilkins)'
    units: '?'
- to-check:
    id: cal.1960-07-24.elections-1960
    add: Rockefeller, governor's office press release, July 23, 1960, Rockefeller Archives, RG 15, Series 25, Box 6, Folder 109 (cited by [[w.gifford-center-cannot-hold]], 76 n.58)
- cite:
    id: cal.1960-08-02.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 79 (the Chicago Defender of Aug. 4 reports a new civil rights section to advise Kennedy and prepare position papers; staff of all races; not the director or the members)'
    units: '?'
- cite:
    id: cal.1960-10-19.king
    item: '[[w.gifford-center-cannot-hold]], 86 (King joins the sit-in at Rich''s in Atlanta, Oct. 19; arrested; refuses bail to stay with the students; not the trespass law, Hartsfield or DeKalb County)'
    units: '?'
- check:
    id: cal.1960-10-19.king
    text: 'Check: Gifford, 86, has the students released Oct. 24.'
- cite:
    id: cal.1960-10-25.king
    item: '[[w.gifford-center-cannot-hold]], 86–87 (the four-month sentence on the suspended sentence; Kennedy''s telephone call to Coretta King; the elder King''s pledge at the thanksgiving service at Ebenezer Baptist Church; not the days, the judge or Robert Kennedy''s call)'
    units: '?'
- cite:
    id: cal.1960-10-07.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 190 (Quemoy and Matsu in the second debate; Nixon attacks Kennedy''s argument that they are "not strategically defensible"; not the quotations)'
    units: '?'
- check:
    id: cal.1960-10-07.elections-1960
    text: 'Check: Gifford, 190, calls the second debate the one devoted to foreign policy; the entry has questions on any subject (the fourth debate, Oct. 21, foreign policy only).'
- cite:
    id: cal.1960-10-13.elections-1960
    item: '[[w.gifford-center-cannot-hold]], 190 (the third debate: Kennedy begins to hedge on Quemoy and Matsu, Nixon presses his position for their defense; not "trigger-happy")'
    units: '?'
- cite:
    id: cal.1960-10-21.elections-1960-2
    item: '[[w.gifford-center-cannot-hold]], 190 (the Nixon campaign''s polling service finds that by the end of the third debate Nixon has tied Quemoy and Matsu in voters'' minds to "stand[ing] up to the Russians"; not the figures)'
    units: '?'
- to-check:
    id: cal.1960-10-21.elections-1960-2
    add: Claude Robinson, polling data, Oct. 21, 1960, PPS 61, Nixon Library (cited by [[w.gifford-center-cannot-hold]], 190 n.62)
- cite:
    id: cal.1968-01-30.vietnam-tet-2
    item: '[[w.longley-lbjs-1968]], 55–56 (the Tuesday lunch of the national security team on the Pueblo and Khe Sanh; at 2:35 p.m. Rostow is told of heavy mortar attacks in Saigon near the presidential palace and the Embassy; Johnson: "This could be bad"; not the words of the report)'
    units: '?'
- variant:
    id: cal.1968-01-30.vietnam-tet-2
    unit: C
    witness: w.longley-lbjs-1968
    reads: '"This could be bad."'
    at: '56'
- cite:
    id: cal.1968-02-08.robert-kennedy
    item: '[[w.longley-lbjs-1968]], 66 (Kennedy tells one crowd the offensive "shattered the mask of official illusion with which we have concealed our true circumstances, even from ourselves," and that "total military victory is not within sight or around the corner"; not the place or the day)'
    units: '?'
- cite:
    id: cal.1968-08-21.soviet-union-czechoslovakia-2
    item: '[[w.longley-lbjs-1968]], 195 (Malik opposes putting the Czechoslovak crisis on the agenda; Ball: the invasion "an affront to all civilized sensibilities"; the Council votes 13–2 to debate; not the presiding officer, the messages or the other quotations)'
    units: '?'
- cite:
    id: cal.1968-08-20.soviet-union
    item: '[[w.longley-lbjs-1968]], 195 (Johnson to Clifford, "double-crossed" by the Soviets, especially Kosygin: "Maybe I was sucked in by honeyed messages about the summit from Kosygin"; Clifford: Kosygin perhaps not the central figure, an eleventh-hour decision; undated, from Clifford 561; not the hour or the place)'
    units: '?'
- cite:
    id: cal.1968-11-25.soviet-union
    item: '[[w.longley-lbjs-1968]], 203 (after the election Rusk queries Dobrynin on a summit in mid-December; at the end of November Thompson suggests Geneva before Christmas; Johnson proposes that Nixon send an observer; Nixon declines to go himself and names Robert D. Murphy; undated; not the paper to Nixon)'
    units: '?'
- cite:
    id: cal.1968-08-23.elections-1968-chicago-5
    item: '[[w.longley-lbjs-1968]], 216 (Yippies led by Hoffman and Rubin nominate the swine Pigasus at the Civic Center; police seize it and arrest several; Rubin: Pigasus to have Secret Service protection and a foreign-policy briefing at the White House; not the six arrested)'
    units: '?'
- check:
    id: cal.1968-08-23.elections-1968-chicago-5
    text: 'Check: Longley, 216, has it Friday night, Aug. 23; the entry, the morning.'
- cite:
    id: cal.1968-08-25.elections-1968-chicago-2
    item: '[[w.longley-lbjs-1968]], 217 (by Sunday evening the police refuse to let a flatbed into Lincoln Park for a scheduled concert; not the time)'
    units: '?'
- cite:
    id: cal.1968-08-25.elections-1968-chicago
    item: '[[w.longley-lbjs-1968]], 217 (Lincoln Park, Sunday: the police order the park vacated at 10:30 p.m. and clear it with clubs, journalists from Newsweek and Life among those struck; not the warning, the hour of leaving or the march)'
    units: '?'
- cite:
    id: cal.1968-08-21.elections-1968-chicago-2
    item: '[[w.longley-lbjs-1968]], 217 (Humphrey writes to the convention for abolishing the unit rule and breaks a promise to Connally, angering southerners and Daley; not the recipient or the day)'
    units: '?'
- cite:
    id: cal.1968-08-26.elections-1968-chicago-15
    item: '[[w.longley-lbjs-1968]], 217 (the floor fight on the unit rule; Connally: "Texas, voting under the unit rule, casts 104 votes no"; the convention abolishes it; not the hour or the voice vote)'
    units: '?'
- cite:
    id: cal.1968-08-26.elections-1968-2
    item: '[[w.longley-lbjs-1968]], 217–18 (a challenge to Connally''s Texas delegation on the floor, for want of Negroes and Mexican-Americans; the debate into the early morning; Connally''s supporters win 1,365 to 995; not the committee, Mississippi, Georgia or Alabama)'
    units: '?'
- cite:
    id: cal.1960-05-01.soviet-union
    item: '[[w.white-making-of-the-president]], 115–16 (Powers takes off from Peshawar for Norway; shot down over the Soviet Union near Sverdlovsk that afternoon, his parachute; "the first acknowledged American spy ever seized"; not the distance, the capture or NASA)'
    units: '?'
- cite:
    id: cal.1960-05-05.soviet-union
    item: '[[w.white-making-of-the-president]], 117 (May 5, Khrushchev "gloatingly" tells the Soviet Congress of the shooting down; not the words, NASA or State)'
    units: '?'
- cite:
    id: cal.1960-07-10.elections-1960-5
    item: '[[w.white-making-of-the-president]], 173 (Sunday before the convention opened: Kennedy "seemingly idly" tells Graham that if Johnson would accept the Vice Presidency he might offer it; not the night)'
    units: B
- cite:
    id: cal.1960-10-12.soviet-union
    item: '[[w.white-making-of-the-president]], 294–95 (Khrushchev announces on Oct. 13, his farewell to America and the United Nations shown at 6:45, that he will leave that evening and suspend his "colloquy" until the Americans have chosen a new leader; after 25 days in New York; not the shoe)'
    units: '?'
- cite:
    id: cal.1960-11-09.soviet-union
    item: '[[w.white-making-of-the-president]], 349 (at dinner that night Kennedy and the Bradlees discuss "quite warily and seriously the first note of congratulations from Mr. Khrushchev"; not its terms or Kennedy''s reply)'
    units: '?'
- cite:
    id: cal.1960-11-16.program
    item: '[[w.white-making-of-the-president]], 377 (the outgoing President leaves as his legacy "an official paper" that for the first time in American history "self-consciously attempted to define the National Goals"; not the day or the title)'
    units: '?'
- cite:
    id: cal.1965-02-18.voting-rights
    item: '[[w.califano-triumph-and-tragedy-of]], 55 (Feb. 26, "a young Selma black was shot and clubbed to death"; not Jackson''s name or Marion)'
    units: '?'
- check:
    id: cal.1965-02-18.voting-rights
    text: 'Check: Califano, 55, has a "young Selma black" shot and clubbed to death Feb. 26; the entry, shot by a trooper at Marion, dying at Selma Feb. 26.'
- cite:
    id: cal.1965-03-09.voting-rights
    item: '[[w.califano-triumph-and-tragedy-of]], 55–56 (Mar. 9, a white minister from Boston clubbed; dies two days later; not the name or the march)'
    units: '?'
- cite:
    id: cal.1966-09-21.transition-and-staff
    item: '[[w.califano-triumph-and-tragedy-of]], 160 (Ramsey Clark named Acting Attorney General when Katzenbach became Under Secretary of State, late September 1966; not the day)'
    units: '?'
- add:
    entry:
      id: cal.1968-01-28.opinion
      when: Jan. 28
      date: '1968-01-28'
      thread: opinion
      c: 'Johnson''s approval 48 percent, up ten points since October 1967. Speculation: his renewed "take charge attitude," hopes of progress in Vietnam, Democrats rallying to his side as the election nears.'
      n: '[[w.longley-lbjs-1968]], 30 ("By late January"; the poll not named). To check: Washington Post, Jan. 28, 1968 (cited by [[w.longley-lbjs-1968]], 30 n.59). Names: Johnson. Check: the day and the poll, from the Post of Jan. 28.'
      src:
        rows:
        - 'w.longley-lbjs-1968 30: all'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-25
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - elections-1968-johnson
      c: 'The convention opens. Watson, about 10:30, to CBS: asked whether he "controlled" the convention for Johnson, he denies it; no knowledge of the President''s even contacting people. Asked of rumors of a draft, he does not know whether anyone plans anything.'
      n: '[[w.longley-lbjs-1968]], 217. To check: Nelson, "Drafting Lyndon Johnson," 707 (cited by [[w.longley-lbjs-1968]], 217 n.42). See [[cal.1968-08-26.elections-1968-chicago]]. Names: Watson.'
      src:
        rows:
        - 'w.longley-lbjs-1968 217: all'
      tags:
      - name:watson-w-marvin
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1960-10-13.elections-1960-3
      when: Oct. 13
      date: '1960-10-13'
      thread: elections-1960
      c: 'The World Series ends: Mazeroski of the Pittsburgh Pirates, last half of the ninth, a home run over the left-field fence at 3:45 p.m.; Pirates 10 to 9, the series 4 to 3. Democratic politicians'' rule of thumb: no campaign starts until the Series is over.'
      n: '[[w.white-making-of-the-president]], 294. See [[cal.1960-10-12.soviet-union]].'
      src:
        rows:
        - 'w.white-making-of-the-president 294: all'
      tags: []
- add:
    entry:
      id: cal.1960-07-11.elections-1960-los-angeles-2
      when: July 11
      date: '1960-07-11'
      thread: elections-1960-los-angeles
      c: Los Angeles. Johnson, told of Kennedy's remark to Graham of the night before, answers "with a single earthy expletive," still in his prenomination anger.
      n: '[[w.white-making-of-the-president]], 173 ("by the next evening"). See [[cal.1960-07-10.elections-1960-5]]. Names: Johnson, Kennedy. Check: the day, from "the next evening."'
      src:
        rows:
        - 'w.white-making-of-the-president 173: all'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-01-03.elections-1968-wallace
      when: Jan. 3
      date: '1968-01-03'
      thread: elections-1968-wallace
      c: California. Wallace congratulates cheering supporters on the American Independent Party's qualifying for the State ballot, his third-party bid not yet announced.
      n: '[[w.califano-triumph-and-tragedy-of]], 258. See [[cal.1968-01.elections-1968]]. Names: Wallace. Check: [[cal.1968-01.elections-1968]] has the 66,059 not reached until the middle of the month.'
      src:
        rows:
        - 'w.califano-triumph-and-tragedy-of 258: all'
      tags:
      - name:wallace-george-c
      - state:ca
- add:
    entry:
      id: cal.1969-01-19.transition-and-staff-4
      when: Jan. 19, evening
      date: '1969-01-19'
      thread: transition-and-staff
      c: 'The White House, the last evening. Johnson to Califano, in the living-room corner by the elevator, on Nixon: "It''s too late to get them back," Nixon will call him "the socialist in the White House." Nixon in the McCarthy years; Helen Gahagan Douglas, "a fine person, and he destroyed her." Advice: invest in land; "This Nixon knows nothing about the economy and it''s going to go to hell"; pay $500 more in income tax: "He''s going to have to put some people in jail."'
      n: '[[w.califano-triumph-and-tragedy-of]], 337–38. See [[cal.1969-01-19.transition-and-staff]]. Names: Johnson, Califano, Nixon.'
      src:
        rows:
        - 'w.califano-triumph-and-tragedy-of 337–38: all'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1966-11-25.transportation-2
      when: Nov. 25
      date: '1966-11-25'
      thread: transportation
      c: 'Edelman, for Senator Robert Kennedy, telephones the Justice Department: Acting Attorney General Clark to be made aware of Kennedy''s memorandum on Penn-Central, familiar with Katzenbach''s attitude, and told the Senator "still favors the merger and feels that any delay will be harmful to the public interest."'
      n: '[[w.califano-triumph-and-tragedy-of]], 160 n.* (the footnote). To check: Harold Reis to Ramsey Clark, memorandum, Nov. 25, 1966, LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 160 n.22). See [[cal.1966-11-21.transportation]]. Names: Robert Kennedy, Clark, Katzenbach.'
      src:
        rows:
        - 'w.califano-triumph-and-tragedy-of 160: all'
      tags:
      - name:kennedy-robert-f
      - name:clark-ramsey
      - name:katzenbach-nicholas
