      when: Apr. 3
      date: '1968-04-03'
      thread: elections-1968
      also:
      - jobs-and-wages
      c: 'Meany, in public, all but endorses Humphrey: "In no other way can the American public be reassured of an effective
        spokesman and advocate for the programs needed to continue the social and economic progress of the last eight years."'
      n: '[[w.chester-american-melodrama]], 144. Names: Meany, Humphrey. Check: the day.'
      tags:
      - name:meany-george
      - name:humphrey-hubert-h
