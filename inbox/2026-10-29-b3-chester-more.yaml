      when: Apr. 4
      date: '1968-04-04'
      thread: elections-1968
      also:
      - jobs-and-wages
      c: 'Pittsburgh, the Steelworkers'' convention. Abel: "Go, Hubert, go—we are with you!" Humphrey attacks Nixon; "I''m
        getting interested." King shot that afternoon.'
      n: '[[w.chester-american-melodrama]], 144–45. Names: Abel, Humphrey, Nixon.'
      tags:
      - name:abel-i-w
      - name:humphrey-hubert-h
