      when: June
      date: '1968-06'
      thread: elections-1968
      c: 'New York, McCarthy, before going back on the road after the moratorium for Robert Kennedy: "It is now time for us
        to take our steel out of the land of thatched huts."'
      n: '[[w.chester-american-melodrama]], 404. Names: McCarthy, Robert Kennedy. Check: the day.'
