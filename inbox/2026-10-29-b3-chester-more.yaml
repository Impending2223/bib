      id: cal.1968-03-12.robert-kennedy-campaign
      when: Mar. 12
      date: '1968-03-12'
      thread: robert-kennedy-campaign
      c: 'New York, the night of New Hampshire''s vote. Robert Kennedy, after speaking at a United Jewish Appeal dinner, at
        "21" with Schlesinger and vanden Heuvel: the result no surprise, his decision now the more urgent.'
      n: '[[w.chester-american-melodrama]], 119. Names: Robert Kennedy, Schlesinger, vanden Heuvel.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:vanden-heuvel-william-j
      - state:ny
      src:
