      when: May
      date: '1968-05'
      thread: elections-1968
      c: 'Humphrey''s staff divided on Johnson: Harris and Mondale, his cochairmen, and most of the younger staff press him
        to show himself "his own man" on the war; John Loeb, the banker, urges him to resign the Vice Presidency.'
      n: '[[w.chester-american-melodrama]], 153. Names: Humphrey, Johnson, Fred Harris, Mondale. Check: the days.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
