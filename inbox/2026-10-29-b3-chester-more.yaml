      when: June 25
      date: '1968-06-25'
      thread: elections-1968
      c: Goodwin back at McCarthy's headquarters; the staff divided, Finney, Gans, Clark.
      n: '[[w.chester-american-melodrama]], 410. Names: Goodwin, McCarthy.'
      tags:
      - name:goodwin-richard-n
