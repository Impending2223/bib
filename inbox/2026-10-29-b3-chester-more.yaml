      id: cal.1967-12.robert-kennedy-campaign
      when: Dec.
      date: '1967-12'
      thread: robert-kennedy-campaign
      c: 'Boston, the first week of the month. O''Donnell, John Kennedy''s appointments secretary, to Pete Hamill: "Bob had
        better get out and run in sixty-eight or he can forget about seventy-two."'
      n: '[[w.chester-american-melodrama]], 115. Names: O''Donnell, Robert Kennedy. Check: the day.'
      tags:
      - name:odonnell-kenneth-p
      - name:kennedy-robert-f
      src:
        c: '534543a8'
        rows:
        - 'w.chester-american-melodrama 115: all'
