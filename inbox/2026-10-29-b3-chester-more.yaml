    entry:
      id: cal.1968-03-17.elections-1968
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968
      c: A suburb of Madison, the Shore Wood Village Democratic Club, in a private house. An alderman puts the President's
        case; Serwer of *The Progressive*, on leave to work for McCarthy, and professors of the University of Wisconsin answer
        him.
      n: '[[w.chester-american-melodrama]], 134–35. Names: McCarthy, Johnson.'
      tags:
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - state:wi
      src:
        c: '54c589b3'
        rows:
        - 'w.chester-american-melodrama 134–35: all'
