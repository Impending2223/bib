      date: '1968-04-02'
      thread: robert-kennedy-campaign
      c: 'Philadelphia, the day of Wisconsin''s vote. Robert Kennedy at the University of Pennsylvania, the basketball arena,
        his first Eastern college audience as a candidate: McCarthy buttons, jeers; he defends the draft.'
      n: '[[w.chester-american-melodrama]], 139. Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
