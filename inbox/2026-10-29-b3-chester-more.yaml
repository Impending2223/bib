      when: Jan. 31
      date: '1968-01-31'
      thread: robert-kennedy-campaign
      c: 'Howth, Ireland. Pete Hamill, hearing on the BBC Kennedy''s words at the Press Club breakfast of Jan. 30, writes
        Kennedy a long letter: a generation had looked to him to restore its faith in the country, and he had betrayed its
        trust.'
      n: '[[w.chester-american-melodrama]], 116. See [[cal.1968-01-30.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: '83e4c8f6'
        rows:
        - 'w.chester-american-melodrama 116: all'
- add:
    entry:
      id: cal.1968-02.elections-1968-2
      when: Feb.
      date: '1968-02'
      thread: elections-1968
      c: Manchester, N.H., the Wayfarer Hotel. Goodwin, after reading of the bombing of the temples in Huế, drives up from
        Boston to write for McCarthy, the first professional on his staff. "With these two typewriters we're going to overthrow
        the government."
      n: '[[w.chester-american-melodrama]], 93. Names: Goodwin, McCarthy. Check: the day.'
      tags:
      - name:goodwin-richard-n
      - name:mccarthy-eugene-j
      - state:nh
      src:
        c: '79a5f56f'
        rows:
        - 'w.chester-american-melodrama 93: all'
- add:
    entry:
      id: cal.1968-02.elections-1968-3
      when: Feb.
      date: '1968-02'
      thread: elections-1968
      c: 'New Hampshire. The Johnson write-in''s pledge cards, Boutin''s and Governor King''s: three serial-numbered parts,
        one for the voter, one for the local organization, one for the White House. McCarthy''s staff prints the card as a
        poster, "Whatever happened to the secret ballot?"; McCarthy, on his second visit early in the month: a brand on cattle
        in Texas.'
      n: '[[w.chester-american-melodrama]], 94–95. See [[cal.1968-03-06.elections-1968]]. Names: Boutin, John W. King, McCarthy,
        Johnson. Check: the day.'
      tags:
      - name:boutin-bernard-l
      - name:king-john-w
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - state:nh
      src:
        c: '1c64219a'
        rows:
        - 'w.chester-american-melodrama 94–95: all'
- add:
    entry:
      id: cal.1968-03-03.robert-kennedy-campaign
      when: Mar. 3–4
      date: '1968-03-03'
      thread: robert-kennedy-campaign
      c: 'Hickory Hill, Sunday evening, O''Donnell''s birthday: O''Donnell, Dutton and Sorensen with Robert Kennedy on running,
        late. Monday, his office, the Foreign Relations hearings on the television: calls to Edward Kennedy, Siegenthaler
        in Nashville, Burke Marshall in New York; Dutton argues for going in.'
      n: '[[w.chester-american-melodrama]], 117–18. Names: O''Donnell, Dutton, Sorensen, Robert Kennedy, Edward Kennedy, Burke
        Marshall.'
      tags:
      - name:odonnell-kenneth-p
      - name:dutton-frederick-g
      - name:sorensen-theodore-c
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - name:marshall-burke
      src:
        c: '90555874'
        rows:
        - 'w.chester-american-melodrama 117–18: all'
