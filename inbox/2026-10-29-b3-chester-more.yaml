      when: Mar. 17
      date: '1968-03-17'
      thread: republican-party
      also:
      - elections-1968
      c: New York, 812 Fifth Avenue. A delegation from Oregon urges Rockefeller to run, the State's filing time short.
      n: '[[w.chester-american-melodrama]], 221. See [[cal.1968-03-10.republican-party]]. Names: Rockefeller.'
