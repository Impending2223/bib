      when: Jan. 19
      date: '1968-01-19'
      thread: robert-kennedy-campaign
      c: 'New York, a cocktail party, the evening. Melina Mercouri to Robert Kennedy: "You don''t want to be the man of whom
        history will say, ''He waited too long!''"'
      n: '[[w.chester-american-melodrama]], 107–8. See [[cal.1968-01-19.robert-kennedy-campaign]]. Names: Mercouri, Robert
        Kennedy.'
      tags:
      - name:mercouri-melina
      - name:kennedy-robert-f
      - state:ny
