      when: Apr. 2
      date: '1968-04-02'
      thread: elections-1968
      c: Humphrey, after a short talk with Johnson, to New York, Gardner Cowles's dinner for *Look*'s advertisers at the Waldorf-Astoria;
        upstairs, with the Cowles brothers, Henry Ford II and Sidney Weinberg of Goldman, Sachs, on running and its money.
      n: '[[w.chester-american-melodrama]], 143. Names: Humphrey, Johnson, Cowles, Ford.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - name:cowles-gardner
      - name:ford-henry-ii
      - state:ny
