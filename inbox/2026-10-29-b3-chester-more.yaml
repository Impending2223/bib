    entry:
      id: cal.1963-05.republican-party-2
      when: May
      date: '1963-05'
      thread: republican-party
      c: Nixon announces his move to New York City, to join Mudge, Stern, Baldwin & Todd, in due course a partner. In the
        months after, he denies "any political motivation."
      n: '[[w.chester-american-melodrama]], 227. Names: Nixon. Check: the day.'
      tags:
      - name:nixon-richard-m
      - state:ny
      src:
        c: '3e03ce79'
        rows:
        - 'w.chester-american-melodrama 227: all'
- add:
    entry:
      id: cal.1967-07.democratic-party-2
      when: July
      date: '1967-07'
      thread: democratic-party
      c: 'Leningrad, by chance. Schlesinger to Hartke: "a few more years of LBJ would kill us all." Hartke: Johnson will not
        run in 1968, unable to face even the risk of defeat. Schlesinger''s telegram to Hartke, Apr. 1, 1968, on his prescience.'
      n: '[[w.chester-american-melodrama]], 65. Names: Schlesinger, Hartke, Johnson. Check: the day.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:hartke-rupert-v
      - name:johnson-lyndon-b
      src:
        c: '7d33ca70'
        rows:
        - 'w.chester-american-melodrama 65: all'
- add:
    entry:
      id: cal.1967-09.democratic-party
      when: Sept.–Oct.
      date: '1967-09'
      thread: democratic-party
      c: After Robert Kennedy's no at Hickory Hill, Lowenstein looks elsewhere for a candidate against Johnson. Representative
        Don Edwards and Church say no; Galbraith consults lawyers on his Canadian birth and declines; Gavin, in Boston, willing,
        but not as a Democrat.
      n: '[[w.chester-american-melodrama]], 65–66. See [[cal.1967-08-15.democratic-party]]. Names: Lowenstein, Robert Kennedy,
        Edwards, Church, Galbraith, Gavin, Johnson. Check: the days.'
      tags:
      - name:lowenstein-allard
      - name:kennedy-robert-f
      - name:edwards-william-d
      - name:church-frank
      - name:galbraith-john-kenneth
      - name:gavin-james-m
      - name:johnson-lyndon-b
      src:
        c: ae6d9bf0
        rows:
        - 'w.chester-american-melodrama 65–66: all'
- add:
    entry:
      id: cal.1967-12.elections-1968-3
      when: Dec.
      date: '1967-12'
      thread: elections-1968
      c: 'Seymour Hersh, formerly of the Associated Press at the Pentagon, among McCarthy''s first national appointments:
        his press relations.'
      n: '[[w.chester-american-melodrama]], 90–91. Names: Hersh, McCarthy. Check: the day.'
      tags:
      - name:hersh-seymour
      - name:mccarthy-eugene-j
