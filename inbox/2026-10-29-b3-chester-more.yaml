      when: Dec. 31
      date: '1967-12-31'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'The *Chicago Tribune*: Dick Gregory has notified Johnson that unless racial conditions in Chicago improve he will
        lead demonstrations "which would make it possible for the Democratic party to hold its convention over my dead body."'
      n: '[[w.chester-american-melodrama]], 516. Names: Gregory, Johnson. Check: the *Tribune* of Dec. 31, 1967.'
      tags:
      - name:gregory-dick
      - name:johnson-lyndon-b
      src:
        c: b9b0c1b5
        rows:
        - 'w.chester-american-melodrama 516: all'
