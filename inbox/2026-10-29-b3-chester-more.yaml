      when: June 14
      date: '1968-06-14'
      thread: elections-1968
      c: 'Moyers, Newsday''s publisher, on a New York radio station, on Humphrey and the Administration; by telephone to reporters,
        Humphrey will "emerge on his own within the next week or so" (the *New York Times*). A few days later Mondale: for
        Humphrey as the most liberal of the three.'
      n: '[[w.chester-american-melodrama]], 154. Names: Moyers, Humphrey, Mondale. Check: the day.'
      tags:
