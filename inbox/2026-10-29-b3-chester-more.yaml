      when: May 7
      date: '1968-05-07'
      thread: elections-1968
      c: 'Logansport, Ind., early morning. Branigin: "I feel we shouldn''t follow the course of appeasement, although I''m
        no saber rattler. I think President Johnson has done the right thing."'
      n: '[[w.chester-american-melodrama]], 168. Names: Branigin, Johnson. Check: the day.'
      tags:
      - name:branigin-roger-d
