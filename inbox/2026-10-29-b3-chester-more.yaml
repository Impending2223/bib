      date: '1968-05-31'
      thread: robert-kennedy-campaign
      c: San Francisco. Robert Kennedy on the cable cars; a speech on foreign affairs to the Commonwealth Club.
      n: '[[w.chester-american-melodrama]], 337. Names: Robert Kennedy. Check: the speech.'
