      when: May 25
      date: '1968-05-25'
      thread: robert-kennedy-campaign
      c: 'Sorensen''s strategy for Robert Kennedy: "reunite the liberals in June, reunite the Democrats in August, and reunite
        the country in November."'
      n: '[[w.chester-american-melodrama]], 351 ("ten days earlier" than June 4). Names: Sorensen, Robert Kennedy. Check:
