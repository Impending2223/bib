- add:
    entry:
      id: cal.1960-07-14.elections-1960-2
      when: July 14
      date: '1960-07-14'
      thread: elections-1960
      c: 'Suite 8315, the Biltmore, about 9:30 a.m.: Salter, Jackson''s assistant, gives Kennedy and Robert Kennedy four reasons
        for Jackson; two hours later Jackson and Salter with Kennedy, fifteen minutes, no decision. Nearly three hours after,
        Kennedy telephones Jackson: it will be Johnson; he asks Jackson to be national chairman. Jackson asks for time.'
      n: '[[w.guthman-we-band-of-brothers]], 79–80. See [[cal.1960-07-14.elections-1960]]. Names: Salter, Jackson, Kennedy,
        Robert Kennedy, Johnson.'
      tags:
      - name:salter-john
      - name:jackson-henry-m
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
