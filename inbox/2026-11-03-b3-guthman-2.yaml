      when: Mar.
      date: 1962-03
      thread: cuba
      c: Havana. The Bay of Pigs prisoners before a five-man tribunal on charges of treason, four days. One man praises Castro;
        the rest, more than a thousand, do not. Robert Kennedy and Goodwin ask Latin American governments to press Castro
        to spare them; Goulart, at Goodwin's asking, warns Castro.
      n: '[[w.guthman-we-band-of-brothers]], 129–30. The sentence: [[cal.1962-04-08.cuba]]. See [[cal.1961-04-15.cuba]]. Names:
        Castro, Robert Kennedy, Goodwin, Goulart. Check: the days.'
