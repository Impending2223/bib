      date: '1962-12-16'
      thread: cuba
      c: A $53 million letter of credit negotiated with the Royal Bank of Canada, underwritten by the Bank of America and
        Morgan Guaranty, against Castro's demand for cash if the goods fall short. Oberdorfer orders the first shipments of
        drugs and supplies to Florida, for the planes and the *African Pilot*.
      n: '[[w.guthman-we-band-of-brothers]], 134. See [[cal.1962-11-24.cuba]]. Names: Castro, Oberdorfer.'
