      c: The American Red Cross joins the ransom, to receive the goods and move them to Miami and Cuba. Industry told by Justice
        that firms meeting on costs, prices and shipping will not violate the antitrust laws; the Internal Revenue Service
        rules gifts deductible.
      n: '[[w.guthman-we-band-of-brothers]], 133–34. See [[cal.1962-11-24.cuba]]. Check: the day of Justice''s assurance and
        the Service''s ruling.'
