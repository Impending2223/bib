- add:
    entry:
      id: cal.1960-07-13.elections-1960-5
      when: July 13
      date: '1960-07-13'
      thread: elections-1960
      c: 'Los Angeles, the morning of the balloting. Johnson before the Washington delegation, asking its help to "stop Kennedy":
        doubts on Kennedy''s physical fitness and his liberal credentials; on Joseph Kennedy, "I was never any Chamberlain-umbrella-policy
        man. I never thought Hitler was right." Jackson''s men call Robert Kennedy, who tells the caucus Jackson is his personal
        choice for Vice President, the decision not his. Washington''s vote on the roll: Kennedy 14½, Stevenson 6½, Symington
        3, Johnson 2½, Rosellini ½.'
      n: '[[w.guthman-we-band-of-brothers]], 76–77 (Guthman reporting for the *Seattle Times*). See [[cal.1960-07-13.elections-1960]].
        Names: Johnson, Kennedy, Joseph P. Kennedy, Jackson, Robert Kennedy, Stevenson, Symington, Rosellini.'
      tags:
