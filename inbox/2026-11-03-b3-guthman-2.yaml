      c: After four flights, 426 men out, Castro demands the $2,925,000 pledged for the wounded by 3 p.m. or the rest stay.
        Nolan and Williams call Robert Kennedy and Katzenbach early in the morning. Kennedy calls Cardinal Cushing, who pledges
        $1 million, and General Clay, who raises the other $1,925,000 and signs a personal note for it.
      n: '[[w.guthman-we-band-of-brothers]], 136. See [[cal.1962-12-23.cuba]]. Names: Castro, Robert Kennedy, Katzenbach,
        Clay. Check: the day; Guthman: "It was Sunday" (Dec. 23), the money due at 3 p.m. "the next afternoon."'
