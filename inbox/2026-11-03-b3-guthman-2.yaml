      c: 'The press clamoring at Justice for an explanation of the agents'' calls on the reporters. Robert Kennedy: "I get
        some credit when FBI agents do something good, I''ll take the heat when they goof." A brief statement: he takes "full
        responsibility."'
      n: '[[w.guthman-we-band-of-brothers]], 233–34. See [[cal.1962-04-12.steel]]. Names: Robert Kennedy. Check: the statement''s
        text.'
