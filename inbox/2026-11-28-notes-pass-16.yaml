    - ok:note-substance
- add-words:
    id: cal.1967-09-01.china-leadership-3
    after: end
    words: 'By Yang, Jiang Qing: "to seize the handful in the army" is a wrong slogan, "we pull down our own Great Wall"; Chen Boda: her speech is the Group''s and the Center''s, "an important strategic speech at a turning point." Zhou''s seven points: the second year the year to win, the third to finish; most generals good; outsiders home; links-ups stopped; alliances and three-in-ones this year; production; the 1966 graduates paid as graduates from Sept. 1.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 546–47'
