    words: By Hopson, the British chargé, the ultimatum of Aug. 20 expires Aug. 22; at nightfall the crowd outside grows, 10,000 by the official Chinese report. At 10:30 p.m. it surges against the cordon of soldiers; the staff leave by the emergency exit.
    item: '[[w.macfarquhar-maos-last-revolution]], 225–26'
