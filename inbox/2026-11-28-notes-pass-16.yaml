- add-words:
    id: cal.1967-05-26.china-leadership-3
    after: end
    words: 'By MacFarquhar, Kang Sheng and Wang Li also speak to the Inner Mongolian rebels and officers: Kang, refrain for now from deciding "who deserved to die and who died in vain"; Wang, it is "inevitable that people will die in the course of a revolution."'
    item: '[[w.macfarquhar-maos-last-revolution]], 182'
