- add-words:
    id: cal.1967-07-10.king
    after: end
    words: 'Branch: Hoover''s liaison brings the White House a report that King and Carmichael oppose the war "to replenish their empty larders"; Johnson urges leaks against Carmichael, not King. Hoover: "I assume we have to do it, but I don''t like it."'
    item: '[[w.branch-at-canaans-edge]], 629'
