    after: end
    words: 'By the Deng nianpu, on the evening of July 17 Jiang Qing, Kang Sheng, Chen Boda, Qi Benyu and others at the Great Hall decide on the struggle; in the small hours of July 18 Qi Benyu calls some Zhongnanhai people there to arrange it face to face. Liu Shaoqi, before he is dragged to the meeting, says to Wang Guangmei: "Fortunately history is written by the people."'
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 657'
