    words: 'By Yang, at 3 a.m. Li Zuopeng, Wang Li and Liu Feng drive there from the Wuhan air force''s units; Zhou and Xie Fuzhi come with the Eighth Company. Zhou, unshaven, calls "where is Wang Li?" and embraces him: "support Comrade Wang Li!"'
