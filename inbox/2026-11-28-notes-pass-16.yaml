    words: By Cosmas, on May 5 the Joint Chiefs authorize CINCPAC to operate in the DMZ south of the demarcation line; Westmoreland has III MAF enter it and evacuate some 10,000 civilians. Four Marine and South Vietnamese operations, May 18–28, five battalions of each, kill more than 700 of the enemy; allied casualties are 163 killed and 1,012 wounded.
