- add-words:
    id: cal.1967-05-13.china-leadership-3
    after: end
    words: 'That evening at the Great Hall Zhou, Chen Boda, Xiao Hua and Zhang Xiuchuan wait; not knowing Mao''s and Lin''s mind, Zhou works on both sides for a joint performance. Told that Mao backs Liu Suyuan''s side, he stands on a chair: "do not storm the performance; to storm it again is to storm Chairman Mao''s revolutionary line!" and sends Chen Boda and Xiao Hua to the theater to stop it.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 429–30'
