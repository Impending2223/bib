    after: end
    words: 'A blood-letter from Peng Xiaomeng asks Mao to forgive the young who erred; it reaches him through Wang Dongxing''s son. On Apr. 22 Zhou, Jiang Qing and the whole Cultural Revolution Group receive some of the members. Jiang: "you are to go home today by the Chairman''s decision; you did well"; go on studying and join the Cultural Revolution. Each is given a book.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 285–86'
