    words: 'Võ Nguyên Giáp and Chen Yi take part. Zhou on the Soviet request to raise the monthly transit quota from 10,000 to 30,000 tons: it names no concrete items, so no reply yet; the Soviets want China''s ports for other ulterior motives too. On Cambodia: Sihanouk helps the NLF "a little"; a coup is not ruled out; Lon Nol is "not trustworthy." Ne Win, unlike Sihanouk, controls the armed forces. Zhou gives three prospects: the war goes on and widens; a coastal blockade; or the next dry season is decisive.'
