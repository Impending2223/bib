    id: cal.1967-04-23.china-leadership
    after: end
    words: 'Liang''s report of Apr. 20, to Chen Boda, Kang Sheng and others, was sent by Zhou on Apr. 21: by Apr. 19, 27,865 detained had been freed, 85 percent of the total.'
    item: '[[w.jianguo-yilai-mao-zedong]], XIX, 45–46'
