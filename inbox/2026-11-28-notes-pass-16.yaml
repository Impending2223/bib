    words: 'Califano: at the leaders'' meeting that morning Hickenlooper says "We must face up to the arrogance of labor!" and Ford asks why the crisis was not foreseen. To the committees, Edward Kennedy suggests Johnson ask the union leaders to the White House and be turned down publicly; Johnson declines.'
