    text: 'Check: Yang, I, 324, has the sayings of the three years (a year to open, two to see its shape, three to wind up) in July 1967, no day, from Li Zuopeng''s memoirs; and "a year to launch, a year to win, a year to sweep up" from a memoir cited as Wang Lide''s.'
