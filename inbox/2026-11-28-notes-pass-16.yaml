    words: Told of the attack on Mao's guesthouse, by Jian, Zhou reports at once to Lin Biao and Jiang Qing, who write Mao to suggest he leave Wuhan. By Yang, over a hundred men of the independent division and trucks of the Million Heroes, armed, burst into Wangjiadun airfield shouting "we want to see Premier Zhou"; by Wu Faxian, Liu Feng tells him of the trucks.
    item: '[[w.jian-zhou-enlai]], 576'
