    after: end
    words: 'Valenti takes notes; the meeting begins at 8:55 p.m., the Pope with Cardinal Cicognani and Archbishop Benelli, Marcinkus interpreting. The Pope: "you must understand I can never agree to war"; he suggests a halt in the bombing and a defensive war. Johnson refuses to extend the truce. The Pope objects to a sentence of the draft joint statement, "We will never surrender South Vietnam to aggression or attack."'
    item: '[[w.branch-at-canaans-edge]], 665–66'
