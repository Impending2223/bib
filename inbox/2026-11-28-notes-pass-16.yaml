    after: end
    words: 'Berman quotes Enthoven: "we can''t hurt them so badly as to destroy their society or, more to the point, their hope"; "Hanoi is betting that we''ll lose public support in the United States before we can build a nation in South Vietnam." 200,000 more men would add 400 to the enemy''s weekly losses: "In theory, we''d then wipe them out in 10 years."'
    item: '[[w.berman-lyndon-johnsons-war]], 36–37'
