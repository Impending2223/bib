    id: cal.1967-04-20.china-leadership
    after: end
    words: Xie Fuzhi is chairman. The old signboards of the municipal Party committee and people's government are smashed. Wu De, who keeps his No. 2 place, calls it "a mere formality." In his speech at the rally Xie lists, without naming him, the alleged crimes of Peng Zhen as "the chief of the old Peking committee."
    item: '[[w.macfarquhar-maos-last-revolution]], 172–73'
