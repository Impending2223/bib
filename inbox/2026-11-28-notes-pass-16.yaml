    words: 'Before leaving he again charges the Wuhan air force with Mao''s safety: its commander Fu Chuanzuo, called "He Long''s man," is passed over, and the deputy commander Liu Feng and the commissar Xiao Qian are put in charge.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 526'
