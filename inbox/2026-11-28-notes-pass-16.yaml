    words: The driver is John Smith, by Branch; after 9:30 p.m. he is seen dragged into the station, some 200 gather, Molotov cocktails break against the wall, and a delegation of citizens and police commanders refutes rumors of lynching. A rumor spreads that police beat him to death. Gov. Hughes calls the rioting a "criminal insurrection" and sends in the Guard.
