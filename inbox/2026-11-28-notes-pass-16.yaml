    id: cal.1967-03-19.china-leadership
    after: end
    words: 'The paper, by a reporter sent to Qiqihar: 5,100 and more wagons a day are needed, 1,700 to 1,800 loaded; 326 accidents by Mar. 15, half again last year''s; military delegates set up a three-in-one command on Mar. 18.'
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 519–20'
