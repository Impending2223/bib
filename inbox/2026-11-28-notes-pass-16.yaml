    words: By Teiwes, Mao approves the slogan "Drag out the small handful" in the army, coined by Guan Feng in January 1967, on the 24th or 25th and again on the 27th; Kang Sheng authorises Xinhua to use it on July 25. Mao and Lin Biao approve two letters, the harsh open letter of the 27th and a milder one dated the 26th to the Wuhan committee that speaks of "Comrade Chen Zaidao."
