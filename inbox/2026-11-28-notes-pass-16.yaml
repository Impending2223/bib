    words: 'Berman: he writes the next day that stopping the bombing would push the President off his "middle ground at home," citing a Gallup poll with 67 percent for continuing it: "If we shift unilaterally towards de-escalation, the Republicans will move in and crystallize a majority around a stronger policy."'
