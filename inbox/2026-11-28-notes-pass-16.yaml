    words: 'Zelizer: $2 billion in discretionary cuts too; with the excise increases the surcharge brings almost $7.4 billion. Johnson warns of "a ruinous spiral of inflation" and "brutally higher interest rates" if Congress does not act, and of the "clear and present dangers" of the deficit.'
