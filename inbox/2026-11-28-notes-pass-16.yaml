    after: The Senate's Subcommittee on Employment, Manpower and Poverty, Joseph Clark chairman, Robert Kennedy, Javits and Murphy with him, hears Marian Wright of the NAACP Legal Defense Fund on hunger in the Delta.
    words: 'Before it, Stennis renews his charge that Head Start is a "national scandal." Unita Blackwell: "We have children who have never had a glass of milk." Wright: "He is wrong"; "Starvation is a major, major problem now."'
    item: '[[w.branch-at-canaans-edge]], 597–98'
