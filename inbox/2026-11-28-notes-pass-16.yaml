    words: By Dikötter, half a million soldiers march across Tiananmen Square behind a huge silver plastic figure of Mao, followed by hundreds of thousands of citizens; the rostrum is packed with army men, the old marshals Chen Yi, Xu Xiangqian and Ye Jianying next to Mao.
