        RG 59, National Archives; Bundy to Gilpatric, Oct. 18, 1963, National Security Files, Kennedy Library (cited by [[w.gavin-gold-dollars-and-power]],
        109 nn.82, 84–85). See [[cal.1963-09-19.economy]]. Names: Gilpatric, Bundy.'
