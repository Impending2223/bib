      id: cal.1963-07-16.economy-2
      when: July 16
      date: '1963-07-16'
      thread: economy
      also:
      - defense
      c: 'McNamara to Kennedy, in answer to the memorandum of Apr. 20: Defense''s spending abroad about $2.7 billion a year
        through fiscal 1966 unless cut; the net adverse balance already down from $2,334 million to $1,477 million, fiscal
        1961–63; cuts proposed, the B-57 wing in Japan retired early among them; forces committed to NATO to be studied for
        redeployment home.'
      n: '[FRUS 1961–63, IX, doc. 28](https://history.state.gov/historicaldocuments/frus1961-63v09/d28). [[w.gavin-gold-dollars-and-power]],
