      - name:marshall-george-c
- add:
    entry:
      id: cal.1964-11-25.economy
      when: Nov. 25
      date: '1964-11-25'
      thread: economy
      also:
      - trade
      c: 'Kaysen sends Johnson the report of his Task Force on Foreign Economic Policy, told to disregard "narrow problems
        of feasibility in terms of domestic political tactics": freer trade, more aid; the dollar claims abroad to be funded
        in long-term loans; the gold exchange standard "will not without reform prove adequate."'
      n: '[FRUS 1964–68, VIII, doc. 18](https://history.state.gov/historicaldocuments/frus1964-68v08/d18). [[w.gavin-gold-dollars-and-power]],
        119–20. Names: Kaysen, Johnson.'
