      id: cal.1963-04-18.economy
      when: Apr. 18
      date: '1963-04-18'
      thread: economy
      c: 'Kennedy on the balance of payments, 10 a.m. to noon, Dillon, Ball, Roosa, McNamara, Heller and Tobin among those
        present. Dillon: real improvement by 1965, the opinion of the Brookings report, the Fund and the European central
        bankers. Ball: Treasury too hopeful; better to restrict foreign issues in American markets than "large troop redeployments"
        or "regressive taxes on tourism." Dillon: Ball''s proposal "reckless."'
      n: '[FRUS 1961–63, IX, doc. 24](https://history.state.gov/historicaldocuments/frus1961-63v09/d24) (memorandum for the
        record, Apr. 24). [[w.gavin-gold-dollars-and-power]], 101–3. To check: Ball, "The Possible Restriction of the Sale
        of Foreign Securities in United States Markets," Apr. 16, 1963, Ball Papers, Mudd Library, Princeton (cited by [[w.gavin-gold-dollars-and-power]],
        103 n.40). See [[cal.1963-02-26.economy]]. Names: Dillon, Ball, Roosa, McNamara, Heller, Tobin, Kennedy.'
