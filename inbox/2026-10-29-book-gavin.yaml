      when: Sept. 12
      date: '1962-09-12'
      thread: economy
      c: 'Dillon and Ball to Kennedy, with Leddy''s and Johnson''s report from Paris and London, the week of Sept. 3: a communiqué
        of the Ten for after the Bank and Fund meetings, approved by Giscard d''Estaing and Maudling; Giscard and Maudling
        agree on high-level secret talks among the United States, Britain, France, Germany and Italy on limiting the taking
        of American gold, "their ideas ... still unclear to us."'
      n: '[FRUS 1961–63, IX, doc. 59](https://history.state.gov/historicaldocuments/frus1961-63v09/d59). [[w.gavin-gold-dollars-and-power]],
