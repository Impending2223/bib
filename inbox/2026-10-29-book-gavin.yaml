    entry:
      id: cal.1963-09-19.economy
      when: Sept. 19
      date: '1963-09-19'
      thread: economy
      also:
      - defense
      - europe-and-the-alliance
      c: 'Kennedy with Rusk, McNamara, Ball, Gilpatric and Bundy, 4 p.m., on Defense''s further cuts in the balance of payments
        drain: approved, $190 million, the items Rusk opposed left out. Kennedy wants "a political base" so that the disapproved
        actions can be taken up again later.'
