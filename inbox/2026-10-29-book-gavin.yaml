      when: Dec. 15
      date: '1967-12-15'
      thread: economy-gold
      c: 'Ansiaux of Belgium to Martin by telephone, 10 a.m., for the Germans, Italians, Dutch and Swiss: they had meant to
        stop intervening in the London market, but will stay in the gold pool; they will ask gold for excessive dollars, and
        want the American program soon, "really very fundamental and substantial; not just a stop-gap measure." The day''s
        gold loss, $116 million.'
      n: '[FRUS 1964–68, VIII, doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v08/d158) (Rostow to Johnson,
        the note of the call attached). [[w.gavin-gold-dollars-and-power]], 172–73. See [[cal.1967-11-26.economy]]. Names:
        Martin.'
