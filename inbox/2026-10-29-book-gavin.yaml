      date: '1962-08-20'
      thread: economy
      c: 'Kennedy on the gold and dollar crisis, recorded, 4 p.m.: Martin, Dillon, Tobin, Ball, Roosa, Kaysen, Gordon, Sorensen,
        Leddy. Ball: "we''re not persuaded that it is at all vital to the United States" that the dollar be the principal
        reserve currency. Kennedy: "what is the national, narrow advantage?"; the standstill to be pursued, the Europeans
        to "go easy on the taking of gold," by Gavin''s transcription.'
