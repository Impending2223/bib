    entry:
      id: cal.1963-01-25.europe-and-the-alliance
      when: Jan. 25
      date: '1963-01-25'
      thread: europe-and-the-alliance
      also:
      - economy
      c: 'The ExComm, after Cuba, on Europe, 4 p.m. Kennedy: de Gaulle may deal with the Russians, break up NATO and push
        the United States out of Europe; "the French may suddenly decide to cash their dollar holdings"; the two old sanctions,
        aid and defense, wasting away; be ready to reduce the forces in Germany quickly. McNamara: disengage from Europe entirely,
        or tie closer to the European powers other than France.'
      n: '[FRUS 1961–63, XIII, doc. 169](https://history.state.gov/historicaldocuments/frus1961-63v13/d169). [[w.gavin-gold-dollars-and-power]],
        89, 94–95. Check: Gavin, 94 n.9, gives McNamara''s two courses to the meeting of Jan. 31, and 95 n.12 Dillon''s remarks
        to this one; FRUS prints McNamara''s here and Dillon''s on Jan. 31. See [[cal.1963-01-22.europe-and-the-alliance]].
        Names: Kennedy, de Gaulle, McNamara.'
      src:
        c: 07a73444
