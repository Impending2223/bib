      when: Aug. 28
      date: '1963-08-28'
      thread: economy
      c: 'Galbraith to Kennedy, two papers on the balance of payments: no mechanism to enforce action on the whole front;
        for "decisive reversal," a moratorium on long-term capital outflow, tariff action, military redeployment, restraint
        on tourist travel, aid tied more deeply to American goods.'
      n: '[FRUS 1961–63, IX, doc. 30](https://history.state.gov/historicaldocuments/frus1961-63v09/d30); [doc. 31](https://history.state.gov/historicaldocuments/frus1961-63v09/d31);
