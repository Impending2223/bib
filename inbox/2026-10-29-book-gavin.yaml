      date: '1967-12-22'
      thread: economy
      c: 'Califano to Johnson, abroad, by cable: Ackley''s memorandum on the program, the deficit for 1967 perhaps near 1960''s
        $3.9 billion; then, after the afternoon''s meeting, the program agreed but for details, a border tax with export rebates
        of 2 to 4 percent, a tourist package, Rusk and Fowler apart on how firmly to announce the tax.'
