      date: '1963-10-19'
      thread: defense
      also:
      - europe-and-the-alliance
      c: 'Gilpatric to the UPI editors and publishers: with bases at home able to deploy abroad, the United States "should
        be able to make useful reductions in its heavy overseas military expenditures without diminishing its effective military
        strength." Bundy had cleared the text, Oct. 18; State''s deletions refused.'
      n: '[[w.gavin-gold-dollars-and-power]], 109–10. To check: Remarks by Roswell Gilpatric, Annual UPI Editors and Publishers
