    entry:
      id: cal.1963-02-26.economy
      when: Feb. 26
      date: '1963-02-26'
      thread: economy
      c: 'Acheson with Kennedy and Bundy on the balance of payments, 11 a.m., on his report of Feb. 25: $10 billion of deficits
        to be financed over five years, most of the borrowing in France and Germany; time without "small expedients"; if the
        Europeans will not do their part, "careful plans for appropriate rearrangement of our own commitments." Kennedy: one
        company''s decision lays hands on $300 million of the gold reserve; tourists a billion-dollar drain.'
      n: '[FRUS 1961–63, IX, doc. 20](https://history.state.gov/historicaldocuments/frus1961-63v09/d20). [[w.gavin-gold-dollars-and-power]],
        97–100. To check: Acheson to Kennedy, with "Recommendations Relating to United States International Payments Problem,"
        Feb. 25, 1963, President''s Office Files, Kennedy Library (cited by [[w.gavin-gold-dollars-and-power]], 98 n.22).
        Check: Gavin, 99, dates the talk Feb. 27, the record''s date. See [[cal.1963-01-25.europe-and-the-alliance]]. Names:
        Acheson, Kennedy, Bundy.'
      src:
        c: 7ef68a54
        rows:
