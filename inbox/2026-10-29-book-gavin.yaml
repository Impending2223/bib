        State''s Topol 846 to Paris, Dec. 9, 1960, OSD Hist. (cited by [[w.watson-into-the-missile-age]], 586 n.244). Names:
        Herter.'
      c: 'NATO ministers at Paris. Herter offers five Polaris submarines to NATO by the end of 1963, and proposes a multilateral
        force of medium-range missiles, owned, financed and controlled in common, mixed-manned; the allies to buy about 100
        missiles. Herter on the American deficit, near $3.8 billion again: "some redeployment may become a necessity unless
        our balance of payments can be brought into a more reasonable equilibrium."'
