- add:
    entry:
      id: cal.1960-11-13.economy
      when: Nov. 13
      date: '1960-11-13'
      thread: economy
      also:
      - foreign-aid
      c: 'Herter to Eisenhower, Gates concurring: military aid to the Netherlands, Italy, Belgium and Japan to go on, tied
        to rises in their defense budgets; cutting it would suggest a "Fortress America." Anderson''s answer, undated: they
        can pay; the alliances "very weak reeds" if able allies will not, and then to be reappraised.'
      n: '[FRUS 1958–60, IV, doc. 267](https://history.state.gov/historicaldocuments/frus1958-60v04/d267); [doc. 268](https://history.state.gov/historicaldocuments/frus1958-60v04/d268).
        [[w.gavin-gold-dollars-and-power]], 48. See [[cal.1960-10-31.economy-2]]. Names: Herter, Gates, Eisenhower, Anderson.'
      src:
        c: 3942b5c2
        rows:
