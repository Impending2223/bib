- add:
    entry:
      id: cal.1962-08-09.economy
      when: Aug. 9
      date: '1962-08-09'
      thread: economy
      c: '"An Interim International Monetary Arrangement," for the President from State, the Treasury and the Council: a two-year
        standstill, the Paris Club''s ten and Switzerland not to turn into gold the dollars they hold; $10 billion to be found,
        $1 billion of it in American gold, $5 billion from the Fund, $2.5 billion in swaps and borrowing, $1.5 billion in
        forward operations. Heller to Kennedy, "Why we need an interim international monetary agreement": to counter speculation;
        to "eliminate the whims and prejudices of currency speculators and bankers from the making of U.S. policy."'
      n: '[FRUS 1961–63, IX, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v09/d57) (Heller). [[w.gavin-gold-dollars-and-power]],
        83–84. To check: "An Interim International Monetary Arrangement," Aug. 9, 1962, Acheson Papers, Truman Library (cited
        by [[w.gavin-gold-dollars-and-power]], 83 n.84). See [[cal.1962-07-24.economy]]. Names: Heller, Kennedy.'
      src:
