- add:
    entry:
      id: cal.1960-11-17.europe-and-the-alliance
      when: Nov. 17
      date: '1960-11-17'
      thread: europe-and-the-alliance
      also:
      - defense
      - economy
      c: 'Augusta. NSC, 467th meeting, on the medium-range missiles for NATO. Stans: the plan might bring a reconsideration
        of conventional forces and a better balance; Gates against any idea that conventional forces are needed for a limited
        war in Europe. Eisenhower: time to tell the Europeans, 225 million people, to do more so that some American troops
        can come home; "the U.S. believes that other NATO nations" should strengthen their conventional forces.'
      n: '[FRUS 1958–60, VII, pt. 1, doc. 273](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d273). [[w.gavin-gold-dollars-and-power]],
        54. See [[cal.1960-08-16.europe-and-the-alliance-2]]. Names: Stans, Gates, Eisenhower.'
      src:
        c: '12486438'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v07p1/d273: all'
        - 'w.gavin-gold-dollars-and-power 54: B-D, F'
        - 'via w.gavin-gold-dollars-and-power 54 n.59: B-D, F'
      tags:
      - name:stans-maurice-h
      - name:gates-thomas-s-jr
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-11-30.economy
      when: Nov. 30
      date: '1960-11-30'
      thread: economy
      also:
      - europe-and-the-alliance
      - foreign-aid
      c: 'Eisenhower with Anderson, Dillon, Stans and Persons, 9 a.m., on the mutual security budget for fiscal 1962. Eisenhower:
        Germany "living in the best of two worlds"; "one move we can make is to redeploy troops." Anderson: begin the process;
        $490 million of gold lost in November, "beginning to resemble a run on gold." Dillon: perhaps half the forces in Germany
        out within a few years, from 1962. Stans: redeployment to be taken up at the NATO meeting in December.'
      n: '[FRUS 1958–60, IV, doc. 270](https://history.state.gov/historicaldocuments/frus1958-60v04/d270). [[w.gavin-gold-dollars-and-power]],
        52 (the redeployment). See [[cal.1960-11-19.economy]]. Names: Eisenhower, Anderson, Dillon, Stans, Persons.'
      src:
        c: 6e25ca3f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v04/d270: all'
        - 'w.gavin-gold-dollars-and-power 52: B-C'
        - 'via w.gavin-gold-dollars-and-power 52 n.50: B-C'
      tags:
      - name:eisenhower-dwight-d
      - name:anderson-robert-b
      - name:dillon-c-douglas
      - name:stans-maurice-h
      - name:persons-wilton-b
- add:
    entry:
      id: cal.1960-12-27.economy
      when: Dec. 27
      date: '1960-12-27'
      thread: economy
      also:
      - transition-and-staff
      c: 'The task force on the balance of payments reports to the President-elect: a basic deficit and the flight of short-term
        capital; growth and exports the cure, not restrictions or cuts in aid and forces abroad; the surplus countries, Germany
        above all, to take more imports, give more aid and pay more for the common defense; the OECD the forum. A Secretary
        of the Treasury of "high respect and confidence in the international financial world" to be named early.'
      n: '[[w.gavin-gold-dollars-and-power]], 56–57, 62. To check: "Report to the Honorable John F. Kennedy by the Task Force
        on the Balance of Payments," Dec. 27, 1960, Acheson Papers, Truman Library (cited by [[w.gavin-gold-dollars-and-power]],
        56 n.66, 62 n.10). Check: the date: Gavin, 220 n.66, gives the file''s, Feb. 25, 1963; 221 n.10, Dec. 27, 1960. See
        [[cal.1960-11-14.transition-and-staff-2]]. Names: Kennedy.'
      src:
        c: 5a37aba0
        rows:
        - 'w.gavin-gold-dollars-and-power 56–57: A-D'
        - 'w.gavin-gold-dollars-and-power 62: E'
        - 'via w.gavin-gold-dollars-and-power 56 n.66: A-D'
        - 'via w.gavin-gold-dollars-and-power 62 n.10: E'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-02-17.economy
      when: Feb. 17
      date: '1961-02-17'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Brentano with Kennedy and Rusk, 11:30 a.m.: Berlin, Poland, the balance of payments. The points drafted for the
        President, Feb. 16: a short-term reserve problem and a long-term basic deficit, the deficit "only because the U.S.
        is carrying such heavy burdens of defense for the whole free world"; Bonn''s proposals touch only the first. The draft
        aide-mémoire: a sustained accumulation of reserves by any one country "disruptive to the international community."'
      n: '[FRUS 1961–63, XIV, doc. 5](https://history.state.gov/historicaldocuments/frus1961-63v14/d5) (the meeting; its pages
        on the balance of payments not printed). [[w.gavin-gold-dollars-and-power]], 65–66 (the points; the aide-mémoire).
        To check: Rusk to Kennedy, "German Balance of Payments Proposals and Your Meeting with German Foreign Minister von
        Brentano on February 17"; "Points which the President may wish to emphasize," Feb. 16, 1961; "Draft Aide Memoire for
        Brentano," Feb. 16, 1961, President''s Office Files, Kennedy Library (cited by [[w.gavin-gold-dollars-and-power]],
        65–66 nn.20–22). Names: Brentano, Kennedy, Rusk.'
      src:
        c: 6ff3ee03
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d5: A'
        - 'w.gavin-gold-dollars-and-power 65–66: B-D'
        - 'via w.gavin-gold-dollars-and-power 65 n.20: B-C'
        - 'via w.gavin-gold-dollars-and-power 65 n.21: B-C'
        - 'via w.gavin-gold-dollars-and-power 66 n.22: D'
      tags:
      - name:brentano-heinrich-von
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-08-17.economy
      when: Aug. 17
      date: '1961-08-17'
      thread: economy
      also:
      - berlin-and-vienna
      c: 'Heller to Kennedy, "Balance of Payments and Berlin": a "reverse lend-lease," Bonn to pay the added costs of the
        American buildup from its budget, first retiring its debt, then lending long; the money to buy German arms in the
        United States. Kennedy, in the margin: "this should be pursued now with Germans." Laid aside in September for the
        offset negotiations.'
      n: '[[w.gavin-gold-dollars-and-power]], 66–67. To check: Heller to Ball, Aug. 8, 1961; Heller to Kennedy, "Balance of
        Payments and Berlin," Aug. 17, 1961; Heller to Kennedy, Sept. 8, 1961, President''s Office Files, CEA, Kennedy Library
        (cited by [[w.gavin-gold-dollars-and-power]], 66 n.26, 67 nn.27–28). See [[cal.1961-07-25.berlin-and-vienna]]. Names:
        Heller, Kennedy.'
      src:
        c: 94e4a8a7
        rows:
        - 'w.gavin-gold-dollars-and-power 66–67: all'
        - 'via w.gavin-gold-dollars-and-power 66 n.26: A-B'
        - 'via w.gavin-gold-dollars-and-power 67 n.27a: A-C'
        - 'via w.gavin-gold-dollars-and-power 67 n.28: D'
      tags:
      - name:heller-walter-w
      - name:kennedy-john-f
- add:
