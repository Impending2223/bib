        [[w.gavin-gold-dollars-and-power]], 109. To check: Rusk to Kennedy, "Department of Defense Proposals for Further Reductions
        in Balance of Payments Drain," undated, FRUS 1961–63, IX, doc. [34](https://history.state.gov/historicaldocuments/frus1961-63v09/d34)
        (cited by [[w.gavin-gold-dollars-and-power]], 109 n.80). See [[cal.1963-07-16.economy-2]]. Names: Kennedy, Rusk, McNamara,
        Ball, Gilpatric, Bundy.'
