      when: Oct. 24
      date: '1961-10-24'
      thread: economy
      also:
      - europe-and-the-alliance
      - defense
      c: 'Gilpatric and Strauss sign a memorandum of understanding: a cooperative logistics system; German payments for arms
        and services large enough to offset the American forces'' spending in Germany, on the forces there or announced; the
        cost of any further deployment to be adjusted between the two.'
      n: '[FRUS 1961–63, IX, doc. 53](https://history.state.gov/historicaldocuments/frus1961-63v09/d53) (editorial note: the
        text). [[w.gavin-gold-dollars-and-power]], 67. See [[cal.1961-02-17.economy]]. Names: Gilpatric, Strauss.'
