    entry:
      id: cal.1963-10-27.europe-and-the-alliance
      when: Oct. 27
      date: '1963-10-27'
      thread: europe-and-the-alliance
      c: 'Rusk at Frankfurt, St. Paul''s Church, dedicating a memorial to Marshall: "We have six divisions in Germany. We
        intend to maintain these divisions here as long as there is need for them—and under present circumstances there is
        no doubt that they will continue to be needed." Big Lift a sign of mobility.'
      n: '[[w.department-of-state-bulletin]], [Nov. 11, 1963, 726, 729](https://archive.org/details/departmentofstat4963unit/page/729/mode/1up).
        [[w.gavin-gold-dollars-and-power]], 113. See [[cal.1963-10-24.europe-and-the-alliance]]. Names: Rusk, Marshall.'
