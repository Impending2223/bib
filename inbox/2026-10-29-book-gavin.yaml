      when: Aug. 7
      date: '1962-08-07'
      thread: economy
      c: 'Dillon to Kennedy, against the interim reserve plan: it reflects the State Department''s "reluctance to squarely
        tackle the more difficult but fundamentally necessary job of obtaining a more adequate sharing of the burden." Fowler''s
        paper with it: talks at the highest level, but on NATO''s costs, not on reserves.'
      n: '[[w.gavin-gold-dollars-and-power]], 84. To check: Dillon to Kennedy, Aug. 7, 1962; Fowler to Dillon, Aug. 7, 1962,
        Acheson Papers, Truman Library (cited by [[w.gavin-gold-dollars-and-power]], 84 nn.87–88). See [[cal.1962-07-24.economy]].
        Names: Dillon, Kennedy, Fowler.'
      src:
        c: 31124f1f
        rows:
