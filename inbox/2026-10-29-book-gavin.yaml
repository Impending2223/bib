- add:
    entry:
      id: cal.1962-07-20.economy
      when: July 20
      date: '1962-07-20'
      thread: economy
      also:
      - europe-and-the-alliance-france
      c: 'Giscard d''Estaing with Kennedy, 10 a.m., no record of it found; then with Ball at State, 6 p.m. Giscard: no unilateral
        change in the dollar''s parity; a secret approach among the United States, Britain, France, Germany and Italy under
        cover of the OECD, the creditors to abstain from buying gold and to hold their dollars for a time. Ball: minimum gold
        reserves, and a ratio of gold to dollars above them.'
      n: '[FRUS 1961–63, XIII, doc. 258](https://history.state.gov/historicaldocuments/frus1961-63v13/d258). [[w.gavin-gold-dollars-and-power]],
        78–80. To check: Ball to Kennedy, "Visit of French Finance Minister," July 18, 1962, National Security Files, Kennedy
        Library; memorandum of conversation (luncheon), July 21, 1962 (cited by [[w.gavin-gold-dollars-and-power]], 78 n.70,
        79 n.71). Names: Giscard d''Estaing, Kennedy, Ball.'
      src:
        c: ee97e176
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d258: all'
