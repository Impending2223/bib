      date: '1965-02-04'
      thread: europe-and-the-alliance-france
      also:
      - economy
      c: 'De Gaulle''s press conference at the Élysée: the gold exchange standard to give way to the gold standard; other
        countries invited to follow France and turn surplus dollars into gold. Ball to Dillon by telephone: "a lot of very
        angry Congressmen and Senators."'
