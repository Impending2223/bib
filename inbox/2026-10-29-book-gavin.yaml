      date: '1965-02-19'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Deming in Bonn, Feb. 19–20, and London, Feb. 22, after de Gaulle''s attack. Blessing: no change in German policy,
        Germany would not embarrass the United States; but the deficit must end, or within two years Europe might break into
        monetary groupings. The British: a strong American answer, else French ideas will lead at the Fund''s meeting in September.'
      n: '[[w.gavin-gold-dollars-and-power]], 124–25. To check: summaries of Deming''s conversations with German officials,
        Feb. 19–20, 1965, and with British officials, Feb. 22, 1965; Deming to Dillon and others, Mar. 9, 1965, National Security
        File, Agency File, Treasury, LBJ Library (cited by [[w.gavin-gold-dollars-and-power]], 125 nn.32–34). See [[cal.1965-02-04.europe-and-the-alliance-france]].
        Names: Deming, Blessing, de Gaulle.'
