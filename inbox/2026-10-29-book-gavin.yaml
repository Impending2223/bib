- add:
    entry:
      id: cal.1962-07-24.economy
      when: July 24
      date: '1962-07-24'
      thread: economy
      c: 'Ball to Kennedy, "A Fresh Approach to the Gold Problem": the problem political, not economic; Roosa''s "improvised
        expedients" a posture of weakness; a standstill on gold among the major countries, larger swaps, a European loan,
        drawings on the Fund, the reserve role shared; without it the United States "subject to the blackmail of any government
        that wants to employ its dollar reserves as political weapons against us." Tobin''s "A Gold Agreement Proposal," the
        same day: one ratio of gold to foreign exchange for all.'
      n: '[[w.gavin-gold-dollars-and-power]], 81–83. To check: Ball to Kennedy, "A Fresh Approach to the Gold Problem," July
        24, 1962, Ball Papers, Mudd Library, Princeton; Tobin, "A Gold Agreement Proposal," July 24, 1962, Acheson Papers,
        Truman Library (cited by [[w.gavin-gold-dollars-and-power]], 81 n.77, 82 nn.80, 83). See [[cal.1962-07-20.economy]].
        Names: Ball, Kennedy, Roosa, Tobin.'
      src:
        c: 7ec20087
        rows:
        - 'w.gavin-gold-dollars-and-power 81–82: A-D'
        - 'w.gavin-gold-dollars-and-power 82–83: E'
