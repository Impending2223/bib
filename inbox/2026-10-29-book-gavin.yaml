      when: Apr. 20
      date: '1963-04-20'
      thread: economy
      also:
      - defense
      c: 'Kennedy to the Cabinet Committee on the balance of payments, after the meeting of Apr. 18: McNamara to propose,
        by July 1, cuts that by the end of 1964 bring Defense''s spending abroad $300 to $400 million a year below fiscal
        1963; no rise in short-term rates before the tax bill passes; the Long Range International Payments Committee to look
        at larger quotas in the Fund.'
      n: '[FRUS 1961–63, IX, doc. 25](https://history.state.gov/historicaldocuments/frus1961-63v09/d25). [[w.gavin-gold-dollars-and-power]],
        103. See [[cal.1963-04-18.economy]]. Names: Kennedy, McNamara.'
