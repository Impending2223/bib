- add:
    entry:
      id: cal.1960-08-16.europe-and-the-alliance-2
      when: Aug. 16
      date: '1960-08-16'
      thread: europe-and-the-alliance
      also:
      - defense
      c: 'Bowie to Eisenhower on his ten-year study of NATO, Goodpaster present: Polaris submarines assigned to NATO, then
        a multilateral strike force, mixed-manned; the shield forces brought toward SHAPE''s 28 to 30 divisions, able to fight
        without nuclear weapons. Eisenhower: no war in Europe could be kept from becoming general; the gold outflow forbids
        taking on much of the cost of conventional forces.'
      n: '[FRUS 1958–60, VII, pt. 1, doc. 264](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d264). [[w.gavin-gold-dollars-and-power]],
        53–54. Names: Bowie, Goodpaster, Eisenhower.'
      src:
        c: 4c7af0d4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v07p1/d264: all'
        - 'w.gavin-gold-dollars-and-power 53–54: all'
        - 'via w.gavin-gold-dollars-and-power 53 n.55: all'
      tags:
      - name:bowie-robert-r
      - name:goodpaster-andrew-j
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-08-25.europe-and-the-alliance
      when: Aug. 25
      date: '1960-08-25'
      thread: europe-and-the-alliance
      also:
      - defense
      c: 'NSC, 457th meeting, on nuclear sharing in NATO. Eisenhower: Bowie''s ideas into the hopper, though he cannot agree
        with him on deterring small wars; he is so uncertain about nuclear sharing that he wants it restudied. A report on
        nuclear weapons in the NATO area, France''s capability among them, by Oct. 15.'
      n: '[FRUS 1958–60, VII, pt. 1, doc. 265](https://history.state.gov/historicaldocuments/frus1958-60v07p1/d265). [[w.gavin-gold-dollars-and-power]],
        54 (the meeting; Bowie''s ideas). See [[cal.1960-08-16.europe-and-the-alliance-2]]. Names: Eisenhower, Bowie.'
      src:
        c: 90c626f4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v07p1/d265: all'
        - 'w.gavin-gold-dollars-and-power 54: A-B'
        - 'via w.gavin-gold-dollars-and-power 54 n.58: A-B'
      tags:
      - name:eisenhower-dwight-d
      - name:bowie-robert-r
- add:
    entry:
      id: cal.1960-10-07.economy
      when: Oct. 7
      date: '1960-10-07'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Eisenhower to Adenauer, personal: the Federal Republic, now where the United States stood in 1948, takes in far
        more than it pays out; Bonn to lend long-term to the poor countries, find a way to finance the dollar cost of defense,
        open its market to American goods. He offers to send Anderson and Dillon to Bonn.'
      n: '[FRUS 1958–60, IX, doc. 261](https://history.state.gov/historicaldocuments/frus1958-60v09/d261). [[w.gavin-gold-dollars-and-power]],
        46. Reply: [[cal.1960-10-20.economy-2]]. Names: Eisenhower, Adenauer, Anderson, Dillon.'
      src:
        c: 062dd31d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d261: all'
        - 'w.gavin-gold-dollars-and-power 46: A-C'
        - 'via w.gavin-gold-dollars-and-power 46 n.32: A-C'
      tags:
      - name:eisenhower-dwight-d
      - name:adenauer-konrad
      - name:anderson-robert-b
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1960-10-20.economy-2
      when: Oct. 20
      date: '1960-10-20'
      thread: economy
      also:
      - europe-and-the-alliance
      c: 'Adenauer''s reply to Eisenhower, handed to Dowling by Brentano: Germany can do much for the poor countries; the
        stationing costs "a financial and political question of decisive importance" in an election year, judgment to wait
        for the talks; Anderson and Dillon welcome, after the American election if they prefer. Khrushchev has told the German
        ambassador he means to bring the German question to a decision in the coming year.'
      n: '[FRUS 1958–60, IX, doc. 262](https://history.state.gov/historicaldocuments/frus1958-60v09/d262). [[w.gavin-gold-dollars-and-power]],
        46–47. See [[cal.1960-10-07.economy]]. Names: Adenauer, Eisenhower, Dowling, Brentano, Anderson, Dillon, Khrushchev.'
      src:
        c: e00a2d10
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v09/d262: all'
        - 'w.gavin-gold-dollars-and-power 46–47: A, C'
        - 'via w.gavin-gold-dollars-and-power 47 n.34: A, C'
