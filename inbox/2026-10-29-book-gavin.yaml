      thread: economy
      c: 'Johnson to Fowler, "Forward Planning in International Finance": a small high-level study group, Treasury, State,
        the Council, the Federal Reserve, the White House, its chairman the Under Secretary for Monetary Affairs, to frame
        "a comprehensive U.S. position and negotiating strategy"; first question, how to reduce the country''s vulnerability
