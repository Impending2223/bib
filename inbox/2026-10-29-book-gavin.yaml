    entry:
      id: cal.1962-09-20.economy
      when: Sept. 20
      date: '1962-09-20'
      thread: economy
      c: 'Kennedy to the governors of the Bank and the Fund: the dollar "an international currency"; if it did not exist as
        a reserve currency "it would have to be invented"; the deficit not mismanagement but spending for the free world,
        $3 billion of it military abroad; the dollar to stay convertible into gold; the country "receptive to suggestions"
        for improving the payments system.'
      n: 'Remarks to the Board of Governors of the World Bank and the International Monetary Fund, [1962 Pub. Papers 691](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=751)
        (Sept. 20, 1962); [FRUS 1961–63, IX, doc. 62](https://history.state.gov/historicaldocuments/frus1961-63v09/d62) (editorial
        note). [[w.gavin-gold-dollars-and-power]], 87 (the drafts; Kaysen and Dillon). To check: Kaysen to Kennedy and Dillon
        to Kennedy, Sept. 18, 1962, FRUS 1961–63, IX, docs. [60](https://history.state.gov/historicaldocuments/frus1961-63v09/d60),
        [61](https://history.state.gov/historicaldocuments/frus1961-63v09/d61) (cited by [[w.gavin-gold-dollars-and-power]],
        87 nn.101–2). See [[cal.1962-09-12.economy]]. Names: Kennedy.'
      src:
        c: 4856a90a
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=751: all'
