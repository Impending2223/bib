      when: Jan. 31
      date: '1963-01-31'
      thread: europe-and-the-alliance
      also:
      - economy
      c: 'The ExComm reappraises policy toward Europe. Dillon: weak in the financial field, strong in the political and military;
        if France attacks the dollar, answer there; would withdrawing the forces, $750 million a year in Europe, "be the disaster
        some say it would." Kennedy: Congress "might well conclude that we should not help Europe if de Gaulle continues to
        act as he has been."'
      n: '[FRUS 1961–63, XIII, doc. 64](https://history.state.gov/historicaldocuments/frus1961-63v13/d64). [[w.gavin-gold-dollars-and-power]],
