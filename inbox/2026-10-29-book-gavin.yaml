      thread: economy
      c: 'Johnson to Califano, by cable, by Gavin''s account: "The world supply of gold is insufficient to make the present
        system workable"; the deficit comes of "so many extraneous situations: Vietnam, world wide defense, German installations,
        aid to underdeveloped countries, military aid abroad"; end them and "the risk of loss of gold would evaporate."'
