      when: Nov. 14
      date: '1960-11-14'
      thread: economy
      c: The Ford Motor Company offers $358 million for the shares of its British company it does not own. Anderson had warned
        that the purchase might bring exchange controls.
      n: '[FRUS 1958–60, IV, doc. 61](https://history.state.gov/historicaldocuments/frus1958-60v04/d61) (the offer, n. 8).
