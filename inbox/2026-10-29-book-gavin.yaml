- add:
    entry:
      id: cal.1960-10-31.economy-2
      when: Oct. 31
      date: '1960-10-31'
      thread: economy
      also:
      - foreign-aid
      - defense
      c: 'NSC, 465th meeting, on the five-year military assistance plan, $2.4 billion asked for fiscal 1962. Dillon: aid given
        in kind costs the balance of payments nothing. Anderson: "astounded"; with such a program he "could not assume responsibility
        for the security of the dollar"; the deficit running at $5 to $6 billion a year in the third quarter; 354,000 dependents
        in Europe. Eisenhower: better stop sending dependents abroad.'
      n: '[FRUS 1958–60, IV, doc. 266](https://history.state.gov/historicaldocuments/frus1958-60v04/d266). [[w.gavin-gold-dollars-and-power]],
        47–48. Names: Dillon, Anderson, Eisenhower.'
      src:
        c: 98cd6191
        rows:
