      when: Feb. 28
      date: '1963-02-28'
      thread: europe-and-the-alliance
      also:
      - defense
      - economy
      c: 'Kennedy with the Joint Chiefs on force strengths in Europe: "how much we can reduce our forces in Europe in the
        next twelve months," a plan by the NATO meeting at Ottawa in May. Wheeler: the Russians might seize Hamburg or Munich.
        Kennedy: de Gaulle "has money and not much else on his side"; the monetary position to be protected; Europe "probably
        about eighth on our list of dangers."'
      n: '[FRUS 1961–63, XIII, doc. 178](https://history.state.gov/historicaldocuments/frus1961-63v13/d178). [[w.gavin-gold-dollars-and-power]],
        105–6. See [[cal.1963-01-25.europe-and-the-alliance]]. Names: Kennedy, Wheeler, de Gaulle.'
