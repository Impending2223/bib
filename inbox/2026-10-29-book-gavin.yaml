- add:
    entry:
      id: cal.1962-05-11.europe-and-the-alliance-france
      when: May 11
      date: '1962-05-11'
      thread: europe-and-the-alliance-france
      also:
      - economy
      c: Kennedy with Malraux and Alphand, Bundy present, 4:30 p.m. If de Gaulle wants a Europe independent of the United
        States, "Americans would be glad to get out of Europe"; the forces there cost about $1.3 billion; the balance of payments
        has lost $12 billion, "and the drain on our gold continues."
      n: '[FRUS 1961–63, XIII, doc. 249](https://history.state.gov/historicaldocuments/frus1961-63v13/d249). [[w.gavin-gold-dollars-and-power]],
        74–75. Names: Kennedy, Malraux, Alphand, Bundy, de Gaulle.'
      src:
