        - 'via w.gavin-gold-dollars-and-power 82 n.80: D'
        - 'via w.gavin-gold-dollars-and-power 82 n.83: E'
      tags:
      - name:ball-george-w
      - name:kennedy-john-f
      - name:roosa-robert-v
      - name:tobin-james
