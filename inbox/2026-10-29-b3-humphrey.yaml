      when: May
      date: 1968-05
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'O''Donnell at breakfast in Humphrey''s apartment, sent by Robert Kennedy, by Humphrey''s account: Kennedy has nothing
        against Humphrey, only against Johnson; would Humphrey withdraw? No. Humphrey''s support if Kennedy is nominated;
        if Kennedy does badly in California, he will pull out and back Humphrey. They will talk after California.'
      n: '[[w.humphrey-education-of-a-public-1976]], 374–75. See [[cal.1968-04-27.elections-1968]]. Names: O''Donnell, Humphrey,
        Robert Kennedy, Johnson. Check the day.'
