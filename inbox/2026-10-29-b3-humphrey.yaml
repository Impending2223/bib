      date: '1963-11-26'
      thread: succession
      c: 'The Elms, after the Mundt vote, by Humphrey''s account. Johnson at dinner with Humphrey, Fortas, Valenti, Cliff
        Carter, Mrs. Johnson and Lynda; drafts of the next day''s address read aloud. Johnson: Humphrey and Fortas to make
        one of them. They work till 2 a.m.; Humphrey adds Roosevelt, youth employment, the UN and the Alliance for Progress,
        and "let us continue."'
