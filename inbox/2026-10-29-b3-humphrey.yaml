      when: May
      date: 1960-05
      thread: elections-1960
      c: 'Right after West Virginia, by Humphrey''s account. Kampelman brings Alex Rose and Arthur Goldberg to Humphrey''s
        office, for themselves and for Reuther and Dubinsky: to end the ill feeling with Kennedy; a Kennedy–Humphrey ticket
