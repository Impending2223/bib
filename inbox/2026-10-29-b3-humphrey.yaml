      date: '1964-08-26'
      thread: elections-1964
      c: 'The White House, about 5 p.m., by Humphrey''s account. Humphrey, flown from Atlantic City with Dodd as a cover,
        with Johnson in the Cabinet Room: the office "like a marriage with no chance of divorce"; "complete and unswerving
        loyalty"; out of the headlines. Humphrey: "You can trust me." Johnson telephones Muriel Humphrey: "We''re going to
        nominate your boy."'
