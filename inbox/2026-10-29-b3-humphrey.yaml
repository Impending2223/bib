      when: July
      date: 1960-07
      thread: elections-1960
      c: 'Los Angeles, the airport, Humphrey arriving for the convention, by his account. Through Kampelman, Goldberg, Rose,
        Reuther and Dubinsky had sent word of a bargain with Kennedy: second place Humphrey''s if he wants it. Humphrey, after
        flying home to talk with his wife: "it is all off." He tells the four so in person, and Meany.'
