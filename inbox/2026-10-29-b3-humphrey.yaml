      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      also:
      - vietnam-paris
      c: 'Chicago and Washington, by Humphrey''s account. Ginsberg, Humphrey''s man on the platform, agrees language on Vietnam
        with Charles Murphy for Johnson; Sorensen sounds the McCarthy people. Humphrey, at his office, takes the text down
        by telephone and reads it to Rusk ("We can live with this"), Rostow and Meany; none objects. "Go ahead."'
      n: '[[w.humphrey-education-of-a-public-1976]], 387–88, 491 n.4. See [[cal.1968-08-23.elections-1968-chicago]]. Names:
        Murphy, Sorensen, Humphrey, Rusk, Rostow, Meany, Johnson.'
