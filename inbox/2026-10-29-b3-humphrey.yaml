      when: Aug.
      date: 1968-08
      thread: elections-1968
      c: 'Early August, two weeks before the convention, by Humphrey''s account. McCarthy: he does not expect the nomination
        and can come out for Humphrey about the middle of September, not on the night of the nomination; his supporters would
        turn on him.'
      n: '[[w.humphrey-education-of-a-public-1976]], 376–77. See [[cal.1968-05-21.elections-1968]]. Names: McCarthy, Humphrey.
        Check the day.'
