      id: cal.1968-09-28.elections-1968
      when: Sept. 28
      date: '1968-09-28'
      thread: elections-1968
      c: 'Seattle, the civic auditorium, some fifteen thousand: about a hundred protesters in the balcony with a bullhorn
        keep Humphrey from speaking until the police remove them. At 2 a.m., to his staff, by his account: "I''m probably
        going to lose this election ... but win or lose, I''m going to speak my mind."'
      n: '[[w.humphrey-education-of-a-public-1976]], 399–400. See [[cal.1968-09-02.elections-1968]]. Names: Humphrey. Check
        the day: Humphrey puts it two nights before Salt Lake City.'
