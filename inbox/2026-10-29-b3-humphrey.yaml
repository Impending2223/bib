      when: June 5
      date: '1968-06-05'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Colorado Springs, the Air Force Academy, after midnight. Humphrey, by telephone to Salinger at the hospital, has
        a military plane fly a neurosurgeon from Massachusetts to Los Angeles. He will not give the morning''s commencement
        address, against Harold Brown and McConnell; his campaign stopped for a month. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 372–73. See [[cal.1968-06-05.robert-kennedy-2]]. Names: Humphrey, Salinger,
        Robert Kennedy, Harold Brown, McConnell.'
