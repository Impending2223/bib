      c: 'Seattle, then Salt Lake City, the speech on Vietnam, by Humphrey''s account. Ball''s draft; O''Brien''s telegram:
        "Ball speech a disaster"; Van Dyk to draft anew. At 2 p.m. Van Dyk, Sherman, Connell, Rowe, Berman, Harris, O''Brien.
        At night in Salt Lake City, Welsh, Bailey and Moss too, till 2 a.m.'
      n: '[[w.humphrey-education-of-a-public-1976]], 401–02, 493 n.10. See [[cal.1968-09-30.elections-1968]]. Names: Humphrey,
        Ball, O''Brien, Van Dyk, Sherman, Rowe, Harris, Moss. Check the day.'
