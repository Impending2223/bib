      when: Nov.
      date: 1960-11
      thread: transition-and-staff
      c: 'Kennedy, by telephone soon after the election, by Humphrey''s account: would Heller take a place on the Council
        of Economic Advisers? Humphrey sounds him: a member''s place not enough. Kennedy: "I''m ready to make him chairman."
        He offers it; Heller accepts.'
      n: '[[w.humphrey-education-of-a-public-1976]], 234–35. See [[cal.1960-06.elections-1960-5]]. Names: Kennedy, Heller,
