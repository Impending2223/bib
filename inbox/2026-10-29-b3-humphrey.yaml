      when: Nov. 2
      date: '1968-11-02'
      thread: elections-1968
      c: 'Washington, Humphrey''s half day there. Reporters guess at a secret meeting with Johnson and call the White House.
        Jim Jones meets Humphrey''s car: the President will not see him. Humphrey, furious, sends a message. By Humphrey''s
        account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 404–05 n. See [[cal.1968-11-01.elections-1968-chennault]]. Names: Humphrey,
