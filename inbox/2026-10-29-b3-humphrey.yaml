      c: 'Chicago, Humphrey''s press conference: the national committee''s new officers. Then home to Waverly, Minn., and
        two days of planning, by his account: O''Brien to manage the campaign, with Napolitan; Freeman, Kampelman, Connell,
        Kapenstein, Van Dyk, Sherman.'
