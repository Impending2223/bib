      c: 'Drew Pearson''s column: "President Johnson is sitting on a political H-Bomb"; did Robert Kennedy approve "an assassination plot which then possibly backfired against his late brother"? The story from Edmund Morgan, a Washington attorney, as his client Maheu told it.'
      n: '[FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315) (editorial note: the column of Mar. 7, 1967). [[w.jones-bay-of-pigs]], 170 n.44 (the column quoted, from Bohning; Morgan''s source). To check: [[w.bohning-castro-obsession]], 177 (cited by [[w.jones-bay-of-pigs]], 212 n.44); Edmund Morgan, testimony, Mar. 19, 1976, Church Committee (cited by [[w.jones-bay-of-pigs]], 212 n.44). See [[cal.1960-09.cuba]]. Names: Pearson, Johnson, Robert Kennedy, Maheu.'
      tags:
