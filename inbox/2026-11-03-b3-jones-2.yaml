      n: '[S. Rep. No. 94-465, 74–76 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=85). Made public: the Church Committee''s interim report, *Alleged Assassination Plots Involving Foreign Leaders*, Nov. 20, 1975; in part, Drew Pearson and Jack Anderson''s column, Mar. 7, 1967 (the day: [FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315), editorial note; Check: Anderson''s part). [[w.jones-bay-of-pigs]], 21, 23–24 (21: Bissell to Edwards, August; 23–24: the meeting at the Plaza, while Castro was at the UN). To check: [[w.thomas-very-best-men]]; [[w.bohning-castro-obsession]]; [[w.hersh-dark-side-of-camelot]]; [[w.wyden-bay-of-pigs]]; Osborn to the Director of Central Intelligence, Nov. 9, 1970, in the CIA''s "Family Jewels," May 16, 1973, 44 (cited by [[w.jones-bay-of-pigs]], 21 n.29); Rosselli, testimony, June 24, 1975, 9, 59, Church Committee (cited by [[w.jones-bay-of-pigs]], 24 n.37). Names: Maheu, Rosselli, Bissell, Edwards, Castro.'
