      date: '1965-08-30'
      thread: cuba
      c: 'Rusk to Bundy, for the President, on the CIA''s proposal: "strongly opposed to resumption of such operations at this time," with the Dominican Republic and Vietnam; the option to be kept open. The Inter-American Bureau''s study, for the operations, attached.'
      n: '[FRUS 1964–68, XXXII, doc. 306](https://history.state.gov/historicaldocuments/frus1964-68v32/d306). [[w.jones-bay-of-pigs]], 168 n.39 (by the autumn of 1965 the attempts to overthrow Castro called off; the memorandum cited). See [[cal.1965-06-02.cuba]]. Names: Rusk, Bundy.'
