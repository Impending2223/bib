      c: Johnson, after Pearson's column, and the same day he has the FBI's reports of the charge, directs Helms to investigate; Helms has the Inspector General, Earman, look into the CIA's plots.
      n: '[FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315) (editorial note, from S. Rep. No. 94-465, 179). [[w.jones-bay-of-pigs]], 170 n.44 (the FBI''s reports; Earman). Check: the day. To check: William Sullivan, testimony, Apr. 21, 1976, 22, Church Committee (cited by [[w.jones-bay-of-pigs]], 212 n.44). See [[cal.1967-03-07.cuba]]. Names: Johnson, Helms, Earman.'
