      when: Sept. 22
      date: '1965-09-22'
      thread: cuba
      c: 'Jessup to Johnson on Raborn''s request of June 2: the Inter-American Bureau for it, increased pressure the best protection in Latin America; Rusk against; Vance, Sept. 20, for himself and McNamara, with Rusk. Bundy "reluctantly" agrees with them.'
      n: '[FRUS 1964–68, XXXII, doc. 307](https://history.state.gov/historicaldocuments/frus1964-68v32/d307) (n. 1: Bundy''s covering memorandum). [[w.jones-bay-of-pigs]], 168 n.39 (the memorandum cited). See [[cal.1965-08-30.cuba]]. Names: Jessup, Raborn, Rusk, Vance, McNamara, Bundy, Johnson.'
