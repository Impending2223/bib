- add:
    entry:
      id: cal.1967-04-24.cuba
      when: Apr. 24
      date: '1967-04-24'
      thread: cuba
      c: 'Earman, the CIA''s Inspector General, begins sending Helms his report on the plots to kill Castro, 133 pages, in installments: the plots with the Mafia, the executive action program, AMLASH; nothing on a tie to Kennedy''s death. Helms has the copies and papers destroyed but the original.'
      n: '[FRUS 1964–68, XXXII, doc. 315](https://history.state.gov/historicaldocuments/frus1964-68v32/d315) (editorial note: Earman''s memorandum for the record, May 23, 1967; the report in RG 233, JFK Assassination Collection, National Archives). [[w.jones-bay-of-pigs]], 170 (submitted "two months later"; the copies destroyed; classified until 1994). Made public: 1994, in part (Jones, 170). Check: Jones has the report two months after Johnson''s order. To check: the Inspector General''s report, Apr. 24, 1967, RG 233, JFK Assassination Collection, Microfilm File 104-10184-10001, National Archives (cited by FRUS 1964–68, XXXII, doc. 315). See [[cal.1967-03.cuba]]. Names: Earman, Helms, Castro, Kennedy.'
      tags:
      - name:earman-j-s
      - name:helms-richard
      - name:castro-fidel
      - name:kennedy-john-f
