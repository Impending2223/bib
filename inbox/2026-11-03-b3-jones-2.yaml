- add:
    entry:
      id: cal.1966-03.cuba
      when: Mar.
      date: 1966-03
      thread: cuba
      c: 'Havana. Cubela tried for plotting to kill Castro: he confesses to treason and asks to be executed, never naming the help he had from the United States. Sentenced to death; Castro commutes the sentence to twenty-five years.'
      n: '[[w.jones-bay-of-pigs]], 168 n.38. Check: the days: Jones gives "less than a year" after June 1965; the note cites the press of Mar. 8–11, 1966. To check: *Washington Post*, Mar. 8, 11, 1966; Castro''s letter, quoted by Reuters, Mar. 8, 1966; JMWAVE to Raborn, Mar. 9, and Raborn to JMWAVE, Mar. 10, 12, 1966, box 104, RG 233, JFK Collection, National Archives; FRUS 1964–68, XXXII, 743, editorial note (cited by [[w.jones-bay-of-pigs]], 211 n.38). See [[cal.1965-06.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 285fcfd3
        rows:
        - 'w.jones-bay-of-pigs 168 n.38: all'
        - 'via x.1966-03-08.washington-post-on-cubela: all'
        - 'via x.1966-03-08.reuters-castro-letter-on-cubela: B'
    section: '196603'
