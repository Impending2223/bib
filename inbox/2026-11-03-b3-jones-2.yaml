      when: June 2
      date: '1965-06-02'
      thread: cuba
      c: 'Raborn, at the 303 Committee, asks to reactivate the paramilitary effort against Cuba on a highly selective basis: Castro supporting insurgents in fourteen Latin American countries; sabotage of ships in Cuban ports, raids on the coast, deception to keep Cuba''s defenses on alert.'
      n: '[FRUS 1964–68, XXXII, doc. 307](https://history.state.gov/historicaldocuments/frus1964-68v32/d307) (Jessup to Johnson, Sept. 22, giving the request). Check: the committee''s own record of June 2. See [[cal.1965-06.cuba]]. Names: Raborn, Castro.'
      tags:
      - name:raborn-william-f-jr
      - name:castro-fidel
      src:
        c: 506a6998
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d307: all'
