- add:
    entry:
      id: cal.1965-12.conservative-movement
      when: December
      date: 1965-12
      thread: conservative-movement
      c: 'Stigler, economist, in *New Guard*, "The Problem of the Negro": the Negro "on average ... lacks a desire to improve
        himself, and lacks a willingness to discipline himself to this end"; his want of work owed not to discrimination but
        to "his own inferiority as a worker."'
      n: '[[w.kabaservice-rule-and-ruin]], 153. To check: George Stigler, "The Problem of the Negro," *New Guard*, December
        1965 (cited by [[w.kabaservice-rule-and-ruin]], 153 n.132).'
      src:
        c: da9d2cb5
        rows:
        - 'w.kabaservice-rule-and-ruin 153: all'
        - 'via w.kabaservice-rule-and-ruin 153 n.132: all'
- add:
    entry:
      id: cal.1966-04-23.press-and-broadcasting
      when: Apr. 23
      date: '1966-04-23'
      thread: press-and-broadcasting
      also:
      - labor-disputes
      c: New York. The *Herald Tribune*'s last issue. Whitney and Thayer, his adviser, the paper losing some $5 million a
        year, had agreed to merge it with the *Journal-American* and the *World-Telegram & Sun* as the *World Journal Tribune*,
        the *Tribune* to go on as its morning paper. The press unions strike, 114 days, rather than allow automation or cuts
        in staff.
      n: '[[w.kabaservice-rule-and-ruin]], 165–66. To check: [[w.kluger-paper]], 714 (cited by [[w.kabaservice-rule-and-ruin]],
        166 n.22). Names: Whitney.'
      src:
        c: 08a0a0b4
        rows:
        - 'w.kabaservice-rule-and-ruin 165–66: all'
      tags:
      - state:ny
      - city:nyc
      - name:whitney-john-h
- add:
    entry:
      id: cal.1966-08-22.press-and-broadcasting
      when: Aug. 22
      date: '1966-08-22'
      thread: press-and-broadcasting
      also:
      - labor-disputes
      c: 'Whitney to Eisenhower, by letter, the *Herald Tribune* given up after the strike, most of its staff gone: "Labor
        is directly to blame, of course, but the leadership in labor relations exercised by the New York Times and the Daily
        News over the past fifteen years has been so weak that the blame is there, too."'
      n: '[[w.kabaservice-rule-and-ruin]], 166. To check: John Hay Whitney to Dwight D. Eisenhower, Aug. 22, 1966, Eisenhower
        Post-Presidential Papers, Eisenhower Library, SNF-20 (cited by [[w.kabaservice-rule-and-ruin]], 166 n.23). See [[cal.1966-04-23.press-and-broadcasting]].
        Names: Whitney, Eisenhower.'
      src:
        c: b359e9c7
        rows:
        - 'w.kabaservice-rule-and-ruin 166: all'
        - 'via w.kabaservice-rule-and-ruin 166 n.23: all'
      tags:
      - state:ny
      - city:nyc
      - name:whitney-john-h
      - name:eisenhower-dwight-d
