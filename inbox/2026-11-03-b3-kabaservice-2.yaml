      c: 'The *New York Times*, Reston, "New Haven: God and War at Yale": "The Strobe Talbotts at Yale, serious, patriotic,
        progressive Republican types," not marching against the war but dissenting; "the dissent of this clean-cut, solemn,
        middle-class crowd of campus leaders may be much more significant than the sign-carrying protesters on the front pages."'
      n: '[[w.kabaservice-rule-and-ruin]], 231 (the words; "in the spring of 1967"); the day and title by the note, 231 n.32.
        Names: Reston.'
