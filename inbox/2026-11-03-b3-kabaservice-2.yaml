      c: 'New Jersey. The *New York Times*, an editorial, "New Jersey Nonsense," on Dumont''s campaign against Genovese of
        Rutgers: "McCarthyism is a dead horse. If Mr. Dumont does not climb off it and start riding some live issues, his
        campaign will be a waste of time."'
      n: '[[w.kabaservice-rule-and-ruin]], 159. To check: "New Jersey Nonsense," *New York Times*, Aug. 9, 1965 (cited by
        [[w.kabaservice-rule-and-ruin]], 159 n.165). See [[cal.1965-06-01.governors-nj]]. Names: Dumont, Genovese.'
