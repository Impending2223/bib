      when: Nov. 8
      date: '1966-11-08'
      thread: vietnam-air-war
      c: 'Wheeler to McNamara, CM-1906-66, for the Joint Chiefs: the restricted areas round Hanoi and Haiphong reduced; new
        targets, three SAM sites, more oil stores, parts of a steel plant and a cement works, two power plants, four locks,
        parts of the ports of Cẩm Phả and Haiphong.'
      n: '[FRUS 1964–68, IV, doc. 295](https://history.state.gov/historicaldocuments/frus1964-68v04/d295). [[w.gibbons-u-s-government-and]],
        IV, 465. Made public: FRUS 1964–68, IV (1998). Names: Wheeler, McNamara.'
