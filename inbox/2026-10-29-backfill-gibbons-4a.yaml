      when: Nov. 5
      date: '1966-11-05'
      thread: vietnam-air-war
      c: 'The CIA to Rostow, "The Effectiveness of the Rolling Thunder Program in North Vietnam, 1 January–30 September 1966":
        the North''s war effort up despite the bombing, infiltration more than tripled, its aid five times the damage done;
        the people''s support and the regime''s will unshaken. Issued Dec. 7.'
      n: '[[w.gibbons-u-s-government-and]], IV, 465 n.87. Names: Rostow.'
      tags:
      - name:rostow-walt-w
      src:
