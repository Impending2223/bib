      - name:westmoreland-william
      - name:lodge-henry-cabot
      src:
        c: f7fc5903
        rows:
        - 'w.gibbons-u-s-government-and IV, 286: all'
- add:
    entry:
      id: cal.1966-04-09.vietnam-struggle
      when: Apr. 9
      date: '1966-04-09'
      thread: vietnam-struggle
      c: 'Westmoreland to Wheeler, MAC 2812: no direct military action against the dissidents; no plan, likely failure, a
        "martyr theme." A show of force with the economic and morale strain, and publicity for the Congress and the assembly.
        Sharp to Wheeler, Apr. 10: if politics fail, force; "Orientals being what they are we should not be impatient."'
      n: '[[w.gibbons-u-s-government-and]], IV, 286. To check: Wheeler to Westmoreland, JCS 1889-66, Apr. 8, 1966, and Westmoreland''s
        reply, MAC 2812, Apr. 9, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]],
        IV, 286 n.59); Sharp to Wheeler, Apr. 10, 1966, Westmoreland Papers, Message Files, Center of Military History (cited
        by [[w.gibbons-u-s-government-and]], IV, 286 n.60). Names: Westmoreland, Wheeler, Sharp.'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
      - name:sharp-u-s-grant
      src:
        c: 526978f8
        rows:
        - 'w.gibbons-u-s-government-and IV, 286: all'
        - 'via w.gibbons-u-s-government-and IV, 286 n.59: A-B'
        - 'via w.gibbons-u-s-government-and IV, 286 n.60: C'
- add:
    entry:
      id: cal.1966-04-09.vietnam-struggle-2
      when: Apr. 9
      date: '1966-04-09'
      thread: vietnam-struggle
      c: 'Rusk to Lodge, 3035, drafted himself: "the present government must govern until it can turn over to a new government
        arising from a broadly based constitutional process. It cannot turn over to a non-government."'
      n: '[[w.gibbons-u-s-government-and]], IV, 286. To check: Washington to Saigon 3035, Apr. 9, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 286 n.58). See [[cal.1966-04-08.vietnam-struggle]].
        Names: Rusk, Lodge.'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
      src:
        c: c891a488
        rows:
        - 'w.gibbons-u-s-government-and IV, 286: all'
        - 'via w.gibbons-u-s-government-and IV, 286 n.58: all'
- add:
    entry:
      id: cal.1966-04-09.vietnam
      when: Apr. 9
      date: '1966-04-09'
      thread: vietnam
      c: 'Rostow to Rusk and McNamara, "Breaking Tri Quang''s Momentum": "We are a nation that cannot use force to shoot people
        apparently demanding a constitution and free elections." Better a constitutional gathering weighted with provincial
        and municipal officials, the Directorate kept together, Kỳ probably replaced, then a curfew "backed, if necessary,
        by U.S. forces." "Some deal with Thi may be a critical element."'
      n: '[FRUS 1964–68, IV, doc. 118](https://history.state.gov/historicaldocuments/frus1964-68v04/d118). [[w.gibbons-u-s-government-and]],
        IV, 288–89. Made public: FRUS 1964–68, IV (1998). Names: Rostow, Rusk, McNamara, Thích Trí Quang, Nguyễn Cao Kỳ, Nguyễn
        Chánh Thi.'
      tags:
      - name:rostow-walt-w
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:thich-tri-quang
      - name:nguyen-cao-ky
      - name:nguyen-chanh-thi
