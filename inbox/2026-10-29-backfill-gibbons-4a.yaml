      when: Nov. 3
      date: '1965-11-03'
      thread: vietnam
      c: 'Lodge to Johnson, "my best attempt to peer into the future": the Viet Cong''s main force units being mastered; within
        six months some 300 more villages pacified, then "the light at the end of the tunnel growing brighter all the time."
        The three most embarrassing things: a cease-fire, an end to the bombing, recognition of the Viet Cong.'
      n: '[FRUS 1964–68, III, doc. 188](https://history.state.gov/historicaldocuments/frus1964-68v03/d188). [[w.gibbons-u-s-government-and]],
        IV, 82–83. Made public: FRUS 1964–68, III (1996). Check: FRUS prints the total "about 1,100" villages, Gibbons "about
        1,000." Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
