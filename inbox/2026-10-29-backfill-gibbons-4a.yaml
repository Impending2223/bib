      when: July 28
      date: '1966-07-28'
      thread: europe-and-the-alliance
      c: 'Rostow to Johnson on Greenhill, of Wilson''s advance party: as over Berlin in 1961–62, the British fear confrontation
        and look for a "political" solution. Rostow: "an attitude of mind which ... prefers that we take losses in the free
        world rather than the risks of sharp confrontation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 371–72 n.65. To check: Rostow to Johnson, July 28, 1966, on Greenhill, President''s
        Appointment File, Diary Backup, July 29, 1966, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 371 n.65).
        See [[cal.1966-07-04.europe-and-the-alliance]]. Names: Rostow, Johnson, Wilson.'
