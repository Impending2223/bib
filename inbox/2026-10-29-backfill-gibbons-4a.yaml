      when: May 2
      date: '1966-05-02'
      thread: vietnam
      c: 'Unger to William Bundy and Rostow, issues for Lodge''s consultation in Washington: the President to make clear that
        failing to hold the constitutional assembly''s elections "would seriously undermine support of our Vietnam policy";
        perhaps better to cede authority to the assembly once elected.'
      n: '[[w.gibbons-u-s-government-and]], IV, 301. To check: Unger to William Bundy and Rostow, May 2, 1966, Department
