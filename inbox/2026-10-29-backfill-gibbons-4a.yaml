      c: 'Sullivan from Vientiane to William Bundy, 703: Tiger Hound set up at his suggestion. Of Shining Brass, the cross-border
        teams: "essentially an Eagle Scout program devised by some extremely well motivated and brave young men"; "except
        for Max Taylor, nobody in the U.S. military establishment has ever seemed willing to tell them that the program is
        not militarily worth the price."'
      n: '[FRUS 1964–68, XXVIII, doc. 216](https://history.state.gov/historicaldocuments/frus1964-68v28/d216). [[w.gibbons-u-s-government-and]],
        IV, 192 (Shining Brass). Made public: FRUS 1964–68, XXVIII (1998). See [[cal.1965-12-06.laos]]. Names: Sullivan, William
        Bundy, Taylor.'
      tags:
      - name:sullivan-william-h
      - name:bundy-william
      - name:taylor-maxwell
      src:
        c: dcc1be64
        rows:
