      when: May 1
      date: '1966-05-01'
      thread: vietnam
      c: 'Rostow to Johnson: a presidential "fireside chat," "to rally the sound 60% of the country to sweat out the next
        stage."'
      n: '[[w.gibbons-u-s-government-and]], IV, 298 n.84. See [[cal.1966-04-21.vietnam-3]]. Names: Rostow, Johnson.'
