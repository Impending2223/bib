        - 'w.gibbons-u-s-government-and IV, 363: A-B'
        - 'via w.gibbons-u-s-government-and IV, 363 n.37: all'
- add:
    entry:
      id: cal.1966-03-30.vietnam-air-war
      when: Mar. 30
      date: '1966-03-30'
      thread: vietnam-air-war
      c: 'Unger to Rusk, "Increased Military Pressures Against North Viet-Nam": strike the infiltration first; new kinds of
        target one at a time, "we can influence their calculations by one strike practically as much as by 10"; heavier bombing
        presupposes readiness for Chinese and possibly Soviet "direct participation"; a list in ascending order of risk, the
        Haiphong oil fifth. No mining of Haiphong; no targets in crowded areas.'
      n: '[FRUS 1964–68, IV, doc. 106](https://history.state.gov/historicaldocuments/frus1964-68v04/d106). [[w.gibbons-u-s-government-and]],
        IV, 364–66. Made public: FRUS 1964–68, IV (1998). Names: Unger, Rusk.'
      tags:
      - name:unger-leonard
      - name:rusk-dean
      src:
