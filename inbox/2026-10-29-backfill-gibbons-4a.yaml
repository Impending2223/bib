      when: May 15
      date: '1966-05-15'
      thread: vietnam-struggle
      c: 'Đà Nẵng. Walt with Kỳ, by Porter''s report, 4612: Kỳ evasive, the move needed because the Struggle Movement had
        acted Saturday night; Walt believes the message from the Đà Nẵng garrison fabricated and finds no evidence.'
