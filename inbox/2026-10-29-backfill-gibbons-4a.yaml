      when: Jan. 29
      date: '1966-01-29'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy and Wheeler, 11:35 a.m. to 12:40 p.m.: Rusk, for Thompson, to "break
        the suspense"; Ball would like more time. McNamara: resume Monday, the targets south of Hanoi. Johnson: of five men
        he asked around the country, one said, "have you and Rusk gone crazy"; Fortas thinks the Communist world working to
        prolong the pause. A report to the Security Council, by Rusk, "would mute Morse."'
      n: '[FRUS 1964–68, IV, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v04/d53) (Valenti''s notes).
        [[w.gibbons-u-s-government-and]], IV, 155, 162. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-28.vietnam-pause]].
        Names: Johnson, Rusk, McNamara, McGeorge Bundy, Wheeler, Thompson, Ball, Fortas, Morse.'
