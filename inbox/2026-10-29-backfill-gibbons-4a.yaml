- add:
    entry:
      id: cal.1966-01-07.vietnam-pause
      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam-pause
      c: 'Fortas to Johnson: a formal note, perhaps to U Thant: withdrawal to begin on a cease-fire and end within, perhaps,
        three years; no bases in Southeast Asia; a cease-fire on terms a representative group of states accepts. "It is possible
        that we can deal with the long-range, with future problems, more advantageously if we are out of Viet Nam than if
        we are there."'
      n: '[FRUS 1964–68, IV, doc. 11](https://history.state.gov/historicaldocuments/frus1964-68v04/d11). [[w.gibbons-u-s-government-and]],
        IV, 123 n.31. To check: [[w.kalman-abe-fortas]]. Made public: FRUS 1964–68, IV (1998). Names: Fortas, Johnson, U Thant.'
      tags:
