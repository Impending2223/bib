      date: '1966-07-02'
      thread: europe-and-the-alliance
      also:
      - vietnam-air-war
      c: 'Johnson to Wilson, answering his message on his politics: "My problem is not merely political. I must also convince
        Hanoi that the will of the United States cannot be broken by debate or pressures"; "We must and will continue to apply
        hard military pressure." In Moscow, Wilson to "canvas all useful [negotiating] possibilities with Kosygin and his
        colleagues."'
      n: '[[w.gibbons-u-s-government-and]], IV, 371. To check: Johnson to Wilson, July 2, 1966, PRUS 001, 1701 Zulu, NSF Files
        of Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 371 n.62). See [[cal.1966-06-23.vietnam-air-war]].
        Names: Johnson, Wilson, Kosygin.'
