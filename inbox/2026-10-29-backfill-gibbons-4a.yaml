- add:
    entry:
      id: cal.1966-05-27.vietnam-2
      when: May 27
      date: '1966-05-27'
      thread: vietnam
      c: 'Jorden and Ginsburgh, for Rostow, apparently at Johnson''s request, five alternatives with their advantages and
        disadvantages: withdraw; withdraw to enclaves; the present course; major escalation; the maximum short of nuclear
        war, invading the North and hitting bases in China if used.'
      n: '[[w.gibbons-u-s-government-and]], IV, 326. To check: Jorden and Ginsburgh''s paper, May 27, 1966, NSF Memos to the
        President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 326 n.42). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: 20efa311
        rows:
        - 'w.gibbons-u-s-government-and IV, 326: all'
        - 'via w.gibbons-u-s-government-and IV, 326 n.42: all'
- add:
    entry:
      id: cal.1966-06-02.vietnam
      when: June 2
      date: '1966-06-02'
      thread: vietnam
      c: 'Rostow sends Johnson a shorter version of the five alternatives: in effect, "we need something more than our present
        course ... but less than a major escalation. I agree." Johnson gives a copy to Mansfield.'
      n: '[[w.gibbons-u-s-government-and]], IV, 326. To check: Rostow to Johnson, cover memorandum, June 2, 1966, NSF Memos
        to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 326 n.43). See [[cal.1966-05-27.vietnam-2]].
        Names: Rostow, Johnson, Mansfield.'
