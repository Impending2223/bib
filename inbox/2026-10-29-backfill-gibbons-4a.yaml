      c: 'Harriman to Rusk, a draft for the President, "Establishing a Dialogue with Hanoi," from Cooper''s paper of Aug.
        26: give Hanoi again the American reformulation of its Four Points; the Front''s role for the South Vietnamese to
        settle; the bombing and reinforcement stopped for Hanoi''s "undertaking" to stop infiltration. Johnson approves; U
        Thant passes it to Hanoi, which does not answer.'
