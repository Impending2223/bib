      date: '1966-06-28'
      thread: vietnam
      c: 'Canberra, at the SEATO Council. Rusk to Trần Văn Đỗ: "the situation has reached the point where North Vietnam cannot
        succeed. The question is whether Hanoi will make peace or the Chinese Communists will face the question of whether
        or not to intervene."'
