      when: Feb. 18
      date: '1966-02-18'
      thread: vietnam-congress
      c: 'Manatos to Johnson: Marcy says a majority of the Foreign Relations Committee want "''sense of committee'' language
        expressing fear of escalation"; "Apparently the 600,000-men figure is worrysome"; he "can''t tell" whether Taylor
        and Rusk have allayed the fears.'
