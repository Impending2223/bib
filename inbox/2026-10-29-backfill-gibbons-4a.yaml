- add:
    entry:
      id: cal.1966-09-19.vietnam-congress-2
      when: Sept. 19
      date: '1966-09-19'
      thread: vietnam-congress
      c: 'Marcy to Jones: such hearings too introspective, "a monkey picking fleas while the forest fire gradually hems him
        in"; "the Committee is doing the thinking which ought to be done downtown." Instead, Niebuhr''s suggestion, hearings
        in January on "American Responsibilities as a World Power."'
      n: '[[w.gibbons-u-s-government-and]], IV, 420–21. To check: Marcy to Jones, Sept. 19, 1966, National Archives, RG 46,
        Papers of the Committee on Foreign Relations, Marcy Chron Files (cited by [[w.gibbons-u-s-government-and]], IV, 420
        n.126). See [[cal.1966-09-12.vietnam-congress]]. Names: Marcy.'
      tags:
      - name:marcy-carl
      src:
        c: 830f4527
        rows:
        - 'w.gibbons-u-s-government-and IV, 420–21: all'
        - 'via w.gibbons-u-s-government-and IV, 420 n.126: all'
- add:
    entry:
      id: cal.1966-12-08.vietnam-congress
      when: Dec. 8
      date: '1966-12-08'
      thread: vietnam-congress
      c: 'Stennis, in Mississippi, back from Vietnam with the Preparedness Subcommittee: the United States not "significantly
        closer" to winning than a year ago; present policies will not bring "victory," and will cost $25 billion a year for
        ten years or more; "enough troops now," Haiphong closed.'
      n: '[[w.gibbons-u-s-government-and]], IV, 421. Check: the day (the *New York Times*, Dec. 9, 1966). See [[cal.1966-10-13.vietnam-congress]].
        Names: Stennis.'
      tags:
      - name:stennis-john-c
      - state:ms
