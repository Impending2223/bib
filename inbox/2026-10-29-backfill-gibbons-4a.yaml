- add:
    entry:
      id: cal.1966-06-01.vietnam-struggle-4
      when: June 1
      date: '1966-06-01'
      thread: vietnam-struggle
      c: 'Lodge''s weekly report, 5178: the attack on Thiện Minh perhaps the Communists'', moving in "as a last desperate
        means." The Buddhists "power-hungry," "out to make an effect on the American political scene"; "a plentiful supply
        of Buddhists—mystics and mental defectives—ready to burn themselves alive"; "our policy of working through the government
        ... is absolutely right."'
      n: '[[w.gibbons-u-s-government-and]], IV, 331. To check: Saigon to Washington 5178, June 1, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 331 n.57). See [[cal.1966-06-01.vietnam-struggle-2]].
        Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
        c: 06f8b74d
        rows:
        - 'w.gibbons-u-s-government-and IV, 331: all'
        - 'via w.gibbons-u-s-government-and IV, 331 n.57: all'
- add:
    entry:
      id: cal.1966-06-01.vietnam-struggle-5
      when: June 1
      date: '1966-06-01'
      thread: vietnam-struggle
      c: 'Word that Lâm, the new I Corps commander, will move at once to restore order at Huế after the consulate''s burning.
        State to Lodge, Flash, 3714: see Kỳ now; the agreement may be undone, and the burning of American property should
        not set the timing. That night Nhuận tells Trí Quang and the operation is called off.'
      n: '[[w.gibbons-u-s-government-and]], IV, 331–32. To check: Washington to Saigon 3714, June 1, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 332 n.60). See [[cal.1966-06-01.vietnam-struggle]].
        Names: Lodge, Nguyễn Cao Kỳ, Thích Trí Quang.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      - name:thich-tri-quang
      src:
        c: 90670ae7
        rows:
        - 'w.gibbons-u-s-government-and IV, 331–32: all'
        - 'via w.gibbons-u-s-government-and IV, 332 n.60: B'
- add:
    entry:
      id: cal.1966-06-03.vietnam-struggle
      when: June 3
      date: '1966-06-03'
      thread: vietnam-struggle
      c: 'Huế. Trí Quang''s news conference: Kỳ and Thiệu to resign; "the struggle movement will never tolerate a government
        which creates a civil war to oppress Buddhism and kill Buddhists."'
      n: '[[w.gibbons-u-s-government-and]], IV, 332. To check: Saigon to Washington 5252, June 3, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 332 n.62). Names: Thích Trí Quang, Nguyễn
        Cao Kỳ, Nguyễn Văn Thiệu.'
      tags:
      - name:thich-tri-quang
      - name:nguyen-cao-ky
      - name:nguyen-van-thieu
      src:
        c: e966baf2
        rows:
        - 'w.gibbons-u-s-government-and IV, 332: all'
        - 'via w.gibbons-u-s-government-and IV, 332 n.62: all'
- add:
    entry:
      id: cal.1966-06-26.vietnam-struggle
      when: June 26
      date: '1966-06-26'
      thread: vietnam-struggle
      c: 'Saigon. Trí Quang, fasting in a clinic, gives an American journalist a letter for Johnson, passed to the embassy:
        "my death is what the Americans are hoping for"; he will do as his forefathers did "when faced with a colonial policy
        like yours."'
      n: '[[w.gibbons-u-s-government-and]], IV, 332–33. To check: Saigon to Washington 5773, June 26, 1966, Department of
        State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 332 n.66). See [[cal.1966-06-08.vietnam]].
        Names: Thích Trí Quang, Johnson.'
      tags:
      - name:thich-tri-quang
      - name:johnson-lyndon-b
      src:
