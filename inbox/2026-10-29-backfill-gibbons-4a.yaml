      when: Aug. 8
      date: '1966-08-08'
      thread: vietnam-congress
      c: 'Mansfield in the Senate on Thanat Khoman''s all-Asian conference: "let it be called in Rangoon or Bangkok, in Manila
        or Phnom Penh or ... even in Peking"; Sihanouk''s suggestion of talks between Saigon and the Front "should be explored."
        Aiken: the Asian efforts to be "watched carefully and encouraged"; Cooper with them.'
      n: '[112 Cong. Rec. 18552–56](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt14/pdf/GPO-CRECB-1966-pt14-4-2.pdf#page=14)
