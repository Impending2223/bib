      when: Dec. 29
      date: '1965-12-29'
      thread: vietnam
      c: 'Westmoreland to Lodge, by Westmoreland''s notes, Lodge agreeing: unless every weapon is used, "an extended war of
        attrition," which can be won with fresh troops, firepower and mobility; but the people at home "would clamor for a
        quick victory."'
      n: '[[w.gibbons-u-s-government-and]], IV, 128–29. To check: Westmoreland, History File, notes for Dec. 29, 1965, CMH,
        Westmoreland Papers (cited by [[w.gibbons-u-s-government-and]], IV, 129 n.50). Check: the day (Gibbons: the day of
        the cable of Dec. 28; the notes are for Dec. 29). Names: Westmoreland, Lodge.'
      tags:
      - name:westmoreland-william
      - name:lodge-henry-cabot
      src:
