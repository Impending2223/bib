- add:
    entry:
      id: cal.1966-04-26.vietnam
      when: Apr. 26
      date: '1966-04-26'
      thread: vietnam
      c: 'Rusk and McNamara to Lodge, 3212, on the enemy''s growing use of Cambodia: no authority beyond attacking across
        the border in self-defense; offensive operations might make Cambodia a belligerent, and "the political consequences,
        foreign and domestic, ... would ... be serious and far-reaching."'
      n: '[[w.gibbons-u-s-government-and]], IV, 359–60 n.18. To check: Washington to Saigon 3212, Apr. 26, 1966, Department
        of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 360 n.18). See [[cal.1966-04-01.vietnam]].
        Names: Rusk, McNamara, Lodge.'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:lodge-henry-cabot
      src:
        c: a4348746
        rows:
        - 'w.gibbons-u-s-government-and IV, 359–60: all'
        - 'via w.gibbons-u-s-government-and IV, 360 n.18b: all'
- add:
    entry:
      id: cal.1966-06-14.vietnam
      when: June 14
      date: '1966-06-14'
      thread: vietnam
      c: 'Thomson of the NSC staff to Johnson, "Possible Approaches to the Cambodia Problem," as Johnson asked: more for the
        ICC, a presidential message to Sihanouk for renewed relations, unofficial visits, private diplomatic contacts; keep
        MACV and the Pentagon from public charges of "unproven Cambodian collusion." Johnson approves them all: "This is excellent.
        I''m proud."'
      n: '[FRUS 1964–68, XXVII, doc. 183](https://history.state.gov/historicaldocuments/frus1964-68v27/d183). [[w.gibbons-u-s-government-and]],
        IV, 360 n.18. Made public: FRUS 1964–68, XXVII (2000). Check: the day of Johnson''s approval (Rostow to Rusk, June
        21). Names: Thomson, Johnson.'
      tags:
      - name:thomson-james-c-jr
      - name:johnson-lyndon-b
      src:
        c: cc6ad99f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v27/d183: all'
        - 'w.gibbons-u-s-government-and IV, 360: all'
        - 'via w.gibbons-u-s-government-and IV, 360 n.18c: all'
- add:
    entry:
