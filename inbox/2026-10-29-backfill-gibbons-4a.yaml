    base: 27ee7e5b
    set:
      n: '[FRUS 1964–68, IV, doc. 312](https://history.state.gov/historicaldocuments/frus1964-68v04/d312) (editorial note).
        [[w.gibbons-u-s-government-and]], IV, 459 n.65, 467–68 (the strategy; the bombing). See [[cal.1966-11-11.vietnam]].
        Names: McNamara.'
      c: 'McNamara''s draft memorandum on force levels: 469,000 Americans in South Vietnam by June 30, 1968; a supplemental
        of $12.4 billion in January. Forces only to the level needed to neutralize the large enemy units: "we have no prospects
        of attriting the enemy force at a rate equal to or greater than his capability to infiltrate and recruit," at 470,000
        or 570,000; the bombing "yielding very small marginal returns, not worth the cost in pilot lives and aircraft."'
