- add:
    entry:
      id: cal.1965-12-03.vietnam
      when: Dec. 3
      date: '1965-12-03'
      thread: vietnam
      c: 'Unger for William Bundy, "Political Implications of U.S. Military Action to Seal off the Narrow Southern Neck of
        North Vietnam": a line at the 20th parallel, by air and sea; China would "have to move militarily ... with massive
        forces," the Russians come in; to be avoided unless "we are prepared for a war with Communist China (and the USSR?)."'
      n: '[[w.gibbons-u-s-government-and]], IV, 194–95 n.76. To check: Unger, "Political Implications of U.S. Military Action
        to Seal off the Narrow Southern Neck of North Vietnam in Order to Stop the Flow of Men and Materiel into South Vietnam,"
        Dec. 3, 1965, Department of State, Lot File 85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]],
        IV, 194 n.76). Names: Unger, William Bundy.'
      tags:
      - name:unger-leonard
      - name:bundy-william
      src:
