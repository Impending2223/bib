        - 'w.gibbons-u-s-government-and IV, 295: all'
        - 'via w.gibbons-u-s-government-and IV, 295 n.76: all'
- add:
    entry:
      id: cal.1966-04-19.vietnam
      when: Apr. 19
      date: '1966-04-19'
      thread: vietnam
      c: 'Komer, back from reviewing pacification, in a "special annex" for Johnson alone: "I think we have a Lodge problem
        on our hands"; Lodge distrusts the Buddhists and fears a neutralist regime; Porter, privately, unsure Lodge has the
        stomach for it: "start thinking now about a replacement."'
      n: '[[w.gibbons-u-s-government-and]], IV, 295 n.77. Names: Komer, Johnson, Lodge, Porter.'
      tags:
      - name:komer-robert-w
      - name:johnson-lyndon-b
