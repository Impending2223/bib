- add:
    entry:
      id: cal.1966-05-27.vietnam-struggle
      when: May 27
      date: '1966-05-27'
      thread: vietnam-struggle
      c: Thi meets Kỳ, after a preliminary talk with Westmoreland May 24; offered a post in the army, he agrees to help quell
        the disturbances. He later accepts Westmoreland's invitation to the United States for a medical checkup and leaves
        with his family.
      n: '[[w.gibbons-u-s-government-and]], IV, 326. To check: Saigon to Washington 5037, May 27, and 5073, May 28, 1966;
        MAC 4300, May 27, 1966, Department of State, Central File, Pol 27 Viet S; Westmoreland Papers, Message Files, Center
        of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 326 n.38). Names: Nguyễn Chánh Thi, Nguyễn Cao
