      c: 'Church to Goldberg, privately: try a cease-fire, its "serious practical disadvantages" notwithstanding, for "the
        alternative of a stalemated war of attrition makes it imperative." The elections will prove little, leaving the President
        "much more room for maneuver."'
      n: '[[w.gibbons-u-s-government-and]], IV, 447. Drafted, it seems, by Norvill Jones of the Foreign Relations staff. To
        check: Church to Goldberg, Nov. 1, 1966, National Archives, RG 46, Papers of the Senate Foreign Relations Committee
        (cited by [[w.gibbons-u-s-government-and]], IV, 447 n.33). Names: Church, Goldberg.'
