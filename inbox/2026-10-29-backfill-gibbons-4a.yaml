- add:
    entry:
      id: cal.1966-05-21.vietnam-struggle-4
      when: May 21
      date: '1966-05-21'
      thread: vietnam-struggle
      c: 'Wheeler to Westmoreland, CJCS 2840-66, a plan for more direct American involvement: Lodge and Westmoreland to tell
        both sides the United States "can no longer tolerate the situation" and bring them together; perhaps Harriman as the
        President''s envoy, with Wheeler; the Joint Chiefs considering cutting off aid and advisers in I Corps.'
      n: '[[w.gibbons-u-s-government-and]], IV, 323 n.29. Names: Wheeler, Westmoreland, Lodge, Harriman.'
