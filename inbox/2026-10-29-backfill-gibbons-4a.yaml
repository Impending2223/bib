      when: Nov. 6
      date: '1966-11-06'
      thread: vietnam
      c: 'Lodge, 10204: the crux is security, not organization; besides the ARVN''s taking up local security, 10 percent of
        the American Army to work with it on pacification on a "buddy system," as the Marines and the 1st and 25th Divisions
        do; "it might create a ''smell of victory.''"'
      n: '[[w.gibbons-u-s-government-and]], IV, 471. To check: Saigon to Washington 10204, Nov. 6, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 471 n.109). See [[cal.1966-11-04.vietnam]].
