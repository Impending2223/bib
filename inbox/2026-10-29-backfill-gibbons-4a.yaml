      when: Dec. 21
      date: '1965-12-21'
      thread: vietnam
      c: 'Rice from Hong Kong, 1179, on Sullivan''s landing at Vinh: most of the consulate''s China watchers and military
        officers expect a major Chinese military reaction. The problem is in the South: troops go through "a sea of people,"
        and "the waters close in after our passage."'
      n: '[[w.gibbons-u-s-government-and]], IV, 195–96. To check: Hong Kong to Washington 1179, Dec. 21, 1965, Department
        of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 195 n.78). See [[cal.1965-12-15.vietnam-3]].
        Names: Sullivan.'
