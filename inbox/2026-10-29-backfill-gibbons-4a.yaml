- add:
    entry:
      id: cal.1966-11-30.vietnam-3
      when: Nov. 30
      date: '1966-11-30'
      thread: vietnam
      c: 'Rostow to Johnson, Katzenbach and the Non-Group, "A Strategy for Vietnam, 1967": to force Hanoi in 1967 to end the
        war on our terms; the Non-Group to watch the plan''s execution; the war made "a bipartisan venture," the Republicans
        briefed; if not ended in 1967, a position for 1968: "don''t throw away a winning effort." Needed: Westmoreland''s
        resources for pacification, a managing ambassador, a tighter Washington.'
      n: '[FRUS 1964–68, IV, doc. 319](https://history.state.gov/historicaldocuments/frus1964-68v04/d319). [[w.gibbons-u-s-government-and]],
        IV, 484–85. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-11-18.vietnam]]. Names: Rostow, Johnson, Katzenbach,
        Westmoreland.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:westmoreland-william
      src:
        c: 77278c32
        rows:
