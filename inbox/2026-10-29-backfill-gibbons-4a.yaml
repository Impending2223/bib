- add:
    entry:
      id: cal.1966-03-30.vietnam-struggle-2
      when: Mar. 30
      date: '1966-03-30'
      thread: vietnam-struggle
      c: 'Lodge''s weekly telegram, 3589: Kỳ told him Mar. 29 that the Directorate wants to use force. "To me, as a typically
        impatient American ... most of the things he says come about a week too late"; "one always wonders whenever a Vietnamese
        says something intelligent and true, whether he is in any way able to do anything about it."'
      n: '[FRUS 1964–68, IV, doc. 105](https://history.state.gov/historicaldocuments/frus1964-68v04/d105). [[w.gibbons-u-s-government-and]],
        IV, 275. Made public: FRUS 1964–68, IV (1998). Names: Lodge, Nguyễn Cao Kỳ.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      src:
        c: a044d7c7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d105: all'
        - 'w.gibbons-u-s-government-and IV, 275: all'
        - 'via w.gibbons-u-s-government-and IV, 275 n.31: all'
- add:
    entry:
      id: cal.1966-03-30.vietnam-struggle-3
      when: Mar. 30
      date: '1966-03-30'
      thread: vietnam-struggle
      c: 'State to Lodge, 2893, drafted by Robert Miller of the Vietnam desk: the situation "going from bad to worse" with
        no sign the government knows how to deal with it. Urge it to identify and arrest Communist agitators at Huế and Đà
        Nẵng, discipline the soldiers in the movement, neutralize its broadcasting, or call the leaders to one room; a joint
        statement that anti-American words undermine the war.'
      n: '[[w.gibbons-u-s-government-and]], IV, 276. To check: Washington to Saigon 2893, Mar. 30, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 276 n.33). See [[cal.1966-03-30.vietnam-struggle]].
        Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      src:
        c: cc1926f6
        rows:
        - 'w.gibbons-u-s-government-and IV, 276: all'
        - 'via w.gibbons-u-s-government-and IV, 276 n.33: all'
- add:
    entry:
      id: cal.1966-03-31.vietnam-struggle
      when: Mar. 31
      date: '1966-03-31'
      thread: vietnam-struggle
      c: 'Lodge to Rusk, 3614: Trí Quang "refuses to listen"; he uses the anti-American theme deliberately, to bring down
        the government and control its successor. "He will have to be taken care of by Vietnamese, in a Vietnamese way," by
        compromise, "a gesture with a measure of force, or just plain force."'
      n: '[[w.gibbons-u-s-government-and]], IV, 276. Reply to: [[cal.1966-03-30.vietnam-struggle]]. To check: Saigon to Washington
        3614, Mar. 31, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 276 n.34).
        Names: Lodge, Rusk, Thích Trí Quang.'
      tags:
      - name:lodge-henry-cabot
      - name:rusk-dean
      - name:thich-tri-quang
      src:
        c: fce11c0c
        rows:
        - 'w.gibbons-u-s-government-and IV, 276: all'
        - 'via w.gibbons-u-s-government-and IV, 276 n.34: all'
- add:
    entry:
      id: cal.1966-04-02.vietnam-struggle
      when: Apr. 2
      date: '1966-04-02'
      thread: vietnam-struggle
      c: 'Lodge, 3672: "firm decisions and necessary action can no longer wait": announce the program for a constitution and
        elections, restore order at Huế and Đà Nẵng with Vietnamese forces, arrest the movement''s leaders. If asked, fly
        the troops in; Americans otherwise out of it. A contingency plan if the government falls.'
      n: '[[w.gibbons-u-s-government-and]], IV, 277–78. To check: Saigon to Washington 3672, Apr. 2, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 277 n.36). Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      src:
        c: 9452f1ab
        rows:
        - 'w.gibbons-u-s-government-and IV, 277–78: all'
        - 'via w.gibbons-u-s-government-and IV, 277 n.36: all'
- add:
    entry:
      id: cal.1966-04-02.vietnam-struggle-2
      when: Apr. 2
      date: '1966-04-02'
      thread: vietnam-struggle
      c: 'Rusk to Lodge, 2950, drafted himself after the lunch with Johnson: Trí Quang to be disabused of the idea that the
        United States is "stuck" with its commitment, a "satellite" whose men''s lives are at his disposal; "if the US is
        to persist in South Viet-Nam it must have something to support." Keep Thiệu and Kỳ; the President wants Lodge''s views
        on alternatives.'
      n: '[[w.gibbons-u-s-government-and]], IV, 278–79. To check: Washington to Saigon 2950, Apr. 2, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 278 n.39). See [[cal.1966-04-02.vietnam]]. Names:
        Rusk, Lodge, Thích Trí Quang, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Johnson.'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
