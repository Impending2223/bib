- add:
    entry:
      id: cal.1966-08-29.vietnam-congress
      when: Aug. 29
      date: '1966-08-29'
      thread: vietnam-congress
      c: 'Mansfield in the Senate on de Gaulle''s visit to Sihanouk: may it bring "a close-up review" of the war; a meeting
        of de Gaulle and Johnson, perhaps at Guadeloupe. On the Assembly elections: "I think they [the Viet Cong] should be
        allowed to vote to show how strong or weak they are." Fulbright: the administration''s peace offensive reduces to
        "the other side must stop doing what it is doing"; "it means surrender." Mansfield: not unconditional surrender.'
      n: '[112 Cong. Rec. 21057–60](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt16/pdf/GPO-CRECB-1966-pt16-1-2.pdf#page=22)
        (Aug. 29, 1966). [[w.gibbons-u-s-government-and]], IV, 393–94, 412–13 (the review; surrender; the vote, 412–13). Names:
        Mansfield, Johnson, Fulbright, de Gaulle.'
      tags:
