      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-force-levels
      c: 'JCSM-218-66: the Joint Chiefs propose the added forces be deployed by July 1967 rather than the end of 1966. McNamara
        accepts.'
      n: '[[w.gibbons-u-s-government-and]], IV, 182. To check: JCSM-218-66, Apr. 4, 1966, so cited, without its file (cited
