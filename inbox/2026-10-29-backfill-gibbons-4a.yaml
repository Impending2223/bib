      c: 'March on Washington for Peace in Vietnam, called by SANE: pickets around the White House, then a rally at the Washington
        Monument. Some 25,000 or more. Spock, Coretta King and Representative George E. Brown Jr. among the speakers. Oglesby,
        president of SDS, "Let Us Shape the Future": the war the work of "corporate liberalism." Check the count and the speakers.'
      n: 'Oglesby, ["Trapped in a System"](https://www.crmvet.org/docs/nor/sds/651127_sds_oglesby_trapped.pdf) (SDS, 1965).
        Brown''s speech: [112 Cong. Rec. 11881–82](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt9/pdf/GPO-CRECB-1966-pt9-7-3.pdf#page=4)
        (Extensions, May 31, 1966). [[w.gibbons-u-s-government-and]], IV, 93–94 (the march, SANE, Brown, Oglesby''s speech).
        To check: [[w.wells-war-within]]; [[w.sale-sds]]; [[w.miller-democracy-is-in-the]]; [[w.debenedetti-american-ordeal]];
        [[w.zaroulis-who-spoke-up]]. See [[cal.1965-11-02.students]]. Check: Gibbons gives "an estimated 20,000–35,000" and
        titles Oglesby''s speech "Liberation and the Corporate State." Names: Spock, Coretta King, George E. Brown Jr., Oglesby.'
      tags:
      - name:spock-benjamin
