      when: Sept. 2
      date: '1966-09-02'
      thread: vietnam
      c: 'Komer to McNamara on his chart and the CIA''s studies: "the southern VC are becoming the ''weak sisters'' in the
        enemy lineup"; if so, pacification "may not prove as slow and painful a task as many predict," and the civil programs,
        Chieu Hoi, refugees, police, cadres, should be stepped up.'
      n: '[[w.gibbons-u-s-government-and]], IV, 410. To check: Komer to McNamara, Sept. 2, 1966, Warnke Papers, McNaughton
        Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 410 n.82). See [[cal.1966-08-25.vietnam-2]]. Names:
        Komer, McNamara.'
      tags:
