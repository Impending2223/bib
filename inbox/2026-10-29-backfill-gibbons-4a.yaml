      when: Mar. 26
      date: '1966-03-26'
      thread: vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-189-66, on his requests of Mar. 21 and 23: armed reconnaissance of the northeast''s
        railways and roads, 600 to 900 sorties a month within the 8,100 authorized; the Haiphong cement plant and the Thai
        Nguyen steel works; and the oil stores.'
      n: '[FRUS 1964–68, IV, doc. 101](https://history.state.gov/historicaldocuments/frus1964-68v04/d101). [[w.gibbons-u-s-government-and]],
        IV, 363 (the oil). Made public: FRUS 1964–68, IV (1998). Names: McNamara.'
