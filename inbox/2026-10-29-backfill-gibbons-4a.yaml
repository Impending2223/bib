        - 'via w.gibbons-u-s-government-and IV, 326 n.43: A'
- add:
    entry:
      id: cal.1966-05-30.vietnam-struggle
      when: May 30
      date: '1966-05-30'
      thread: vietnam-struggle
      c: 'Lodge, 5124: the "cynical campaign of huge strikes, letters in blood and suicides" aims to force concessions to
        Trí Quang, who "is not to be reasoned with"; Kỳ isolating the extremists; "we should persist."'
      n: '[[w.gibbons-u-s-government-and]], IV, 329–30. To check: Saigon to Washington 5124, May 30, 1966, NSF Memos to the
