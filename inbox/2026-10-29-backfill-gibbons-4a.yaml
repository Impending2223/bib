      when: Aug. 30
      date: '1966-08-30'
      thread: vietnam-force-levels
      c: 'Rostow sends Johnson Taylor''s "thoughtful response": analyze the concept before approving it; the elite ARVN units
        into the American fighting, the rest of the ARVN to pacification. Johnson, in hand: Rostow to talk to McNamara, then
        ask Defense, State and Komer for an analysis.'
