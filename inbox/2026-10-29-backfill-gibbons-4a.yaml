      when: Jan. 29
      date: '1966-01-29'
      thread: vietnam-congress
      c: 'Stennis, in a speech: once committed, use the force to win: fewer limits on the bombing, more troops; "I would not
        be surprised if we were ultimately required to commit 600,000 men to the battle."'
      n: '[[w.gibbons-u-s-government-and]], IV, 142. To check: Stennis, speech of Jan. 29, 1966, reprinted in Senate Comm.
