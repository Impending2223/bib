      when: Feb. 11
      date: '1966-02-11'
      thread: vietnam
      c: 'McGeorge Bundy from Saigon to Johnson: "The general atmosphere here is enormously better than it was a year ago.
        There is a long and tough job ahead, but the Mansfield report is just plain wrong and we believe there can be a Humphrey
        report which proves it."'
      n: '[[w.gibbons-u-s-government-and]], IV, 235. To check: McGeorge Bundy to Johnson, from Saigon, Feb. 11, 1966, NSF
        Memos to the President—McGeorge Bundy, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 235 n.66). See
        [[cal.1966-02-10.vietnam]]. Names: McGeorge Bundy, Johnson, Mansfield, Humphrey.'
