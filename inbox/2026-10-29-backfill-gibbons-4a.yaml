- add:
    entry:
      id: cal.1966-10-05.vietnam
      when: Oct. 5
      date: '1966-10-05'
      thread: vietnam
      c: 'Komer to Johnson: "We''re doing much better than we think"; pushed on seven fronts in 1967, the enemy forced to
        negotiate or crippled; a "''win'' strategy without further major escalation against the North"; "an effective sub-cabinet
        level mechanism in Washington to monitor performance."'
      n: '[FRUS 1964–68, IV, doc. 262](https://history.state.gov/historicaldocuments/frus1964-68v04/d262). [[w.gibbons-u-s-government-and]],
        IV, 480, 484. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-09-30.vietnam-5]]. Names: Komer, Johnson.'
      tags:
