      id: cal.1965-12-02.vietnam
      when: Dec. 2
      date: '1965-12-02'
      thread: vietnam
      c: 'Lansdale to Lodge, "Role of S.L.O.": the Vietnamese ask his help; the Mission resents the role; his office without
        a defined mission. Many Americans think his task is to direct the pacification program "with no other resources than
        my wits and a title." Lodge in the margin: "My job."'
      n: '[[w.gibbons-u-s-government-and]], IV, 183–84. To check: Lansdale to Lodge, "Role of S.L.O.," Dec. 2, 1965, Lodge
        Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 183 n.34). Names: Lansdale,
        Lodge.'
      tags:
