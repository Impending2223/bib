      when: Aug. 25
      date: '1966-08-25'
      thread: vietnam-support
      c: Bertrand Russell writes Johnson, inviting him to testify before his International War Crimes Tribunal. No reply.
      n: '[[w.gibbons-u-s-government-and]], IV, 432–33. To check: Russell to Johnson, Aug. 25, 1966, Name File, Bertrand Russell,
