- add:
    entry:
      id: cal.1966-05-23.vietnam-struggle
      when: May 23
      date: '1966-05-23'
      thread: vietnam-struggle
      c: 'Huế. Trí Quang to an American consular officer, after Johnson''s news conference: "Why does Johnson stab us in the
        back" by such statements; the Americans "now firmly allied with Thieu and Ky to kill Buddhists"; "massive demonstrations"
        against them threatened. He speaks on Radio Huế the same day.'
