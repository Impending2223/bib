      when: May 11
      date: '1966-05-11'
      thread: vietnam
      c: 'William Bundy to Rusk on Myrdal''s proposal: "we let this one drop." Myrdal does not speak for Sweden; the plan
        would accept the Front as an entity of its own; a bombing halt a matter for Hanoi, not the Front.'
      n: '[[w.gibbons-u-s-government-and]], IV, 369 n.56. See [[cal.1966-05-08.vietnam]]. Names: William Bundy, Rusk.'
