      c: 'Bohlen, Paris 1022, on Sainteny, back from Hanoi for de Gaulle: Hanoi will fight to the end for the North, but would
        not wholly reject some negotiation, in secret; Phạm Văn Đồng, pressed for a quid pro quo for a halt to the bombing,
