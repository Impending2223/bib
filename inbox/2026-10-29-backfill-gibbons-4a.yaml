        - 'via w.gibbons-u-s-government-and IV, 382 n.94: all'
        - 'via w.gibbons-u-s-government-and IV, 469 n.97: all'
- add:
    entry:
      id: cal.1966-08.vietnam-air-war
      when: Aug.
      date: 1966-08
      thread: vietnam-air-war
      c: 'The JASON summer study for McNamara, 47 scientists, arranged with Zacharias, Wiesner, Kistiakowsky and Kaysen: the
        bombing of the North "had made and could only make a small contribution"; neither Hanoi''s will nor its infiltration
        much affected, nor would heavier bombing or mining change that. Instead, a barrier against infiltration south of the
        17th parallel.'
      n: '[[w.gibbons-u-s-government-and]], IV, 382–83. To check: JASON Division, Institute for Defense Analyses, summer study
        reports, August 1966, summarized in Pentagon Papers, Gravel ed., IV, 115 ff. (cited by [[w.gibbons-u-s-government-and]],
        IV, 382 n.95). Names: McNamara, Kaysen, Wiesner, Kistiakowsky.'
      tags:
      - name:mcnamara-robert-s
