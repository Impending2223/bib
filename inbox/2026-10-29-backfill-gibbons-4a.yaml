        rows:
        - 'w.gibbons-u-s-government-and IV, 194–95: all'
        - 'via w.gibbons-u-s-government-and IV, 194 n.76: all'
- add:
    entry:
      id: cal.1965-12-15.vietnam-3
      when: Dec. 15
      date: '1965-12-15'
      thread: vietnam
      also:
      - laos
      c: 'Sullivan from Vientiane, 651: air action and Shining Brass can only harass the trail; a picket across the Laotian
        panhandle would be bled. Instead land near Vinh with air and sea cover, hold a line to the Laotian border until Hanoi
        negotiates, tell the Chinese the forces go no farther: "we would have our equivalent—in spades."'
      n: '[FRUS 1964–68, XXVIII, doc. 211](https://history.state.gov/historicaldocuments/frus1964-68v28/d211). [[w.gibbons-u-s-government-and]],
        IV, 193–94. Made public: FRUS 1964–68, XXVIII (1998). Names: Sullivan.'
      tags:
      - name:sullivan-william-h
      src:
        c: 03087d55
        rows:
