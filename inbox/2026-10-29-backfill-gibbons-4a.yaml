- add:
    entry:
      id: cal.1966-09-28.vietnam
      when: Sept. 28
      date: '1966-09-28'
      thread: vietnam
      c: 'Rostow sends Johnson his and Komer''s paper of Sept. 20, "A Strategy for the Next Phase in Vietnam," William Bundy
        consulted: Hanoi cannot win; not bombing the whole infrastructure of the North, but "a palpable process of political
        and military disintegration of the Viet Cong," by amnesty, defections, Chieu Hoi, pacification, land reform.'
      n: '[FRUS 1964–68, IV, doc. 241](https://history.state.gov/historicaldocuments/frus1964-68v04/d241) (the paper). [[w.gibbons-u-s-government-and]],
        IV, 483–84. Made public: FRUS 1964–68, IV (1998). Names: Rostow, Johnson, Komer, William Bundy.'
      tags:
