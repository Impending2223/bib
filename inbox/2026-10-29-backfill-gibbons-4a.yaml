      id: cal.1966-01-29.vietnam-congress-3
      when: Jan. 29
      date: '1966-01-29'
      thread: vietnam-congress
      c: 'Morse in the Senate against the President''s answer to the fifteen Senators: S. Res. 217, the Foreign Relations
        Committee to investigate publicly all aspects of the policy in Vietnam; S. Con. Res. 75, to terminate the Southeast
        Asia Resolution.'
