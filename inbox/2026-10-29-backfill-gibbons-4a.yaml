    set:
      n: '[[w.gibbons-u-s-government-and]], IV, 551 n.79. To check: Rostow to Johnson, Nov. 28, 1966, C.F. ND 19/CO 312, LBJ
        Library (cited by [[w.gibbons-u-s-government-and]], IV, 551 n.79x). Names: Symington, Rostow, Nixon, Johnson.'
      c: 'Symington by telephone to Rostow, before going to Asia, by Rostow''s memorandum: "You and I have been hawks on Viet
        Nam since 1961. I am thinking of getting off the train soon"; with the restraints on air power "we can''t win"; in
        1968 Nixon "will become the biggest dove of all times."'
