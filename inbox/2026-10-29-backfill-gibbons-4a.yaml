      date: '1966-06-14'
      thread: vietnam-air-war
      also:
      - europe-and-the-alliance
      c: 'Johnson to Wilson, after Rusk''s private talk with him: "I see no way of avoiding such action," the corridor through
        Laos, the buildup, Cambodia, no interest in peace in Hanoi; "not ... an air assault on civilian centers." Not to "speak
        in terms of disassociation." A visit late in July.'
      n: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156). [[w.gibbons-u-s-government-and]],
        IV, 370. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-06-03.vietnam-air-war]]. Names: Johnson, Wilson, Rusk.'
