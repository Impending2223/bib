      id: cal.1966-03-24.vietnam-struggle
      when: Mar. 24
      date: '1966-03-24'
      thread: vietnam-struggle
      c: 'Lodge, on Westmoreland''s advice, telephones Kỳ the American casualties of Mar. 1–23, 228 killed and 850 wounded,
        not made public: "we were paying this price in blood, while all this disorder was going on in Hue and Danang."'
      n: '[[w.gibbons-u-s-government-and]], IV, 275. To check: Saigon to Washington 3483, Mar. 24, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 275 n.29). Names: Lodge, Westmoreland,
        Nguyễn Cao Kỳ.'
