      when: May 15
      date: '1966-05-15'
      thread: vietnam-struggle
      c: 'Trí Quang to Johnson, by the embassy, Saigon 4610: the Thiệu-Kỳ group has again brought troops to Đà Nẵng "to attack
        the soldiers and civilians of I Corps," encircling the main Buddhist places of worship; "I urgently appeal to your
        responsibility to intervene."'
