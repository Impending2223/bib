- add:
    entry:
      id: cal.1965-11-23.vietnam
      when: Nov. 23
      date: '1965-11-23'
      thread: vietnam
      also:
      - vietnam-air-war
      - vietnam-force-levels
      c: 'McNamara to Ball by telephone, 10:10 a.m.: the Chiefs "coming to a boiling point on bombing Haiphong." Wheeler has
        seen Johnson, who asked a joint recommendation; McNamara told Johnson he was not prepared to recommend it now, State
        "strongly opposed," McGeorge Bundy leaning against. Phase II: the troops shipped from January, a month at a time,
        without commitment; McNamara to stop in Saigon on his way home from Paris.'
      n: '[FRUS 1964–68, III, doc. 206](https://history.state.gov/historicaldocuments/frus1964-68v03/d206). [[w.gibbons-u-s-government-and]],
        IV, 105–106. Made public: FRUS 1964–68, III (1996). See [[cal.1965-11-10.vietnam-2]]. Names: McNamara, Ball, Wheeler,
        Johnson, McGeorge Bundy.'
      tags:
      - name:mcnamara-robert-s
