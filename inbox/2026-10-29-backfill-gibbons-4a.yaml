      when: Mar. 21
      date: '1966-03-21'
      thread: vietnam-congress
      also:
      - vietnam-supplemental
      c: 'Russell in the Senate on the supplemental appropriation: "I do not think we can afford to let this war drift on
        and on as it is now"; search-and-destroy might take 10 or 12 years. A change of policy "in the very near future,"
        or the war will force itself on every candidate. Close Haiphong. Symington agrees; McGovern doubts it would bring
        negotiations.'
      n: '[112 Cong. Rec. 6404](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-6-2.pdf#page=81)
