        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 316 n.6). See [[cal.1966-05-15.vietnam]].
        Names: Thích Trí Quang, Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
