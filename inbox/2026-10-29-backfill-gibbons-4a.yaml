      - name:nguyen-cao-ky
      - name:nguyen-van-thieu
      src:
        c: ef792fea
        rows:
        - 'w.gibbons-u-s-government-and IV, 319: all'
        - 'via w.gibbons-u-s-government-and IV, 319 n.18: all'
- add:
    entry:
      id: cal.1966-05-19.vietnam-struggle-2
      when: May 19
      date: '1966-05-19'
      thread: vietnam-struggle
      c: 'William Bundy to Porter, 3545, drafted by Unger: Thi a "key figure"; no objection to his reappointment to I Corps
        if the Directorate holds; "continuous and heavy pressure" for a Kỳ-Thi meeting. "If this requires Ky to make a forthcoming
        statement and Thi to swallow his resentment over dismissal, so be it."'
      n: '[[w.gibbons-u-s-government-and]], IV, 319–20. To check: Washington to Saigon 3545, May 19, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 319 n.19). See [[cal.1966-05-19.vietnam-struggle]].
        Names: William Bundy, Porter, Unger, Nguyễn Chánh Thi, Nguyễn Cao Kỳ.'
      tags:
      - name:bundy-william
      - name:porter-william-j
      - name:unger-leonard
      - name:nguyen-chanh-thi
      - name:nguyen-cao-ky
      src:
        c: 3faf91a0
        rows:
        - 'w.gibbons-u-s-government-and IV, 319–20: all'
        - 'via w.gibbons-u-s-government-and IV, 319 n.19: all'
- add:
    entry:
      id: cal.1966-05-20.vietnam-struggle-2
      when: May 20
      date: '1966-05-20'
      thread: vietnam-struggle
      c: 'Rusk to Lodge, drafted himself, 3568, after Johnson''s meetings that evening: "Cannot overemphasize the vulnerability
        of our position here"; a Kỳ-Thi meeting, or Porter as intermediary. Pass the word: "we support the government and
        must not have any coups or reckless adventures"; "all hands should stop maneuvering, get on with the war and give
        the constitutional process a chance."'
      n: '[[w.gibbons-u-s-government-and]], IV, 320. To check: Washington to Saigon 3568, May 20, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 320 n.21). Names: Rusk, Lodge, Johnson, Nguyễn
        Cao Kỳ, Nguyễn Chánh Thi, Porter.'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      - name:nguyen-cao-ky
      - name:nguyen-chanh-thi
      - name:porter-william-j
      src:
        c: c21f4e61
        rows:
        - 'w.gibbons-u-s-government-and IV, 320: all'
        - 'via w.gibbons-u-s-government-and IV, 320 n.21: all'
- add:
    entry:
      id: cal.1966-05-20.vietnam-struggle-3
      when: May 20
      date: '1966-05-20'
      thread: vietnam-struggle
      c: 'Wheeler to Westmoreland, CJCS 2837-66: the effect on the public, the press and Congress "far more adverse than heretofore";
        "I think I can feel the first gusts of the whirlwind generated by the wind sown by the Vietnamese"; "many people will
        never again believe that the effort and the sacrifices are worthwhile."'
      n: '[FRUS 1964–68, IV, doc. 143](https://history.state.gov/historicaldocuments/frus1964-68v04/d143). [[w.gibbons-u-s-government-and]],
        IV, 320–21. Made public: FRUS 1964–68, IV (1998). Names: Wheeler, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
      src:
        c: 2ba93b33
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d143: all'
        - 'w.gibbons-u-s-government-and IV, 320–21: all'
        - 'via w.gibbons-u-s-government-and IV, 320 n.22: all'
- add:
    entry:
      id: cal.1966-05-20.vietnam-struggle-4
      when: May 20
      date: '1966-05-20'
      thread: vietnam-struggle
      c: 'Huế. Trí Quang to an American at the consulate: negotiation with Kỳ and Thiệu "impossible"; they must step down,
        by a coup brought on by a public American threat to withhold aid; his choice to lead it already known, Trần Văn Đôn.'
      n: '[[w.gibbons-u-s-government-and]], IV, 321. To check: Saigon to Washington 4784, May 20, 1966, Department of State,
