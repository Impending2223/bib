      when: July 4
      date: '1966-07-04'
      thread: europe-and-the-alliance
      c: 'Bruce, London 53, after seeing Wilson: he "would and could avoid any embarrassment to the President"; "He is a politician,
        and, as such, highly sensitive to other statesmen''s concerns"; asked of his "disassociation," he will point to Hansard.
        He would like to come July 29.'
