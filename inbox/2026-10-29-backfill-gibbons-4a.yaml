- add:
    entry:
      id: cal.1966-02-04.vietnam-air-war-2
      when: Feb. 4
      date: '1966-02-04'
      thread: vietnam-air-war
      c: 'Meeker, the Legal Adviser, to Rusk on mining the North''s harbors: lawful as collective defense, but "the real difficulty
        ... lies in the consequences with respect to Soviet, Chinese, and neutral shipping"; with no finding of the Security
        Council or a regional organization, "probably ... insufficient in the eyes of an impartial tribunal" to justify acts
        against third countries'' shipping.'
      n: '[[w.gibbons-u-s-government-and]], IV, 365 n.43. Names: Meeker, Rusk.'
      tags:
      - name:meeker-leonard-c
      - name:rusk-dean
      src:
        c: c728ca5b
        rows:
        - 'w.gibbons-u-s-government-and IV, 365: all'
        - 'via w.gibbons-u-s-government-and IV, 365 n.43b: all'
- add:
    entry:
      id: cal.1966-03-10.vietnam-air-war
      when: Mar. 10
      date: '1966-03-10'
      thread: vietnam-air-war
      c: 'Unger to U. Alexis Johnson, "Proposed Mining of Haiphong Harbor": a major escalation, touching third countries''
        shipping, chiefly British; a Communist ship sunk would bring "direct confrontation" with Soviet and Chinese forces.'
      n: '[[w.gibbons-u-s-government-and]], IV, 365 n.43. Names: Unger, U. Alexis Johnson.'
      tags:
      - name:unger-leonard
      - name:johnson-u-alexis
      src:
        c: f4ef45a8
        rows:
        - 'w.gibbons-u-s-government-and IV, 365: all'
        - 'via w.gibbons-u-s-government-and IV, 365 n.43a: all'
- add:
    entry:
      id: cal.1966-03.vietnam-air-war
      when: Mar.
      date: 1966-03
      thread: vietnam-air-war
      c: 'CIA, "The Role of Air Strikes in Attaining Objectives in North Vietnam": "almost 80 percent" of the North''s modern
        industry and 75 percent of its people "effectively insulated from air attack"; "No target system can be reduced to
        its critical point under existing rules." Concentrated strikes on the will of the regime: the railways to China, the
        ports mined, the oil stores, the Haiphong cement plant.'
      n: '[[w.gibbons-u-s-government-and]], IV, 362–63. To check: CIA, SC No. 1826/66, "The Role of Air Strikes in Attaining
        Objectives in North Vietnam," March 1966, cited in Pentagon Papers, Gravel ed., IV, 71–72 (not in the Johnson Library)
        (cited by [[w.gibbons-u-s-government-and]], IV, 362 n.29).'
      src:
        c: 06a8e9b6
        rows:
