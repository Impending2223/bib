      date: '1966-08-12'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Len Jordan of Idaho, Republican, who has supported the war, in the Senate: "I believe we have waged war more vigorously
        than we have waged peace. The term ''escalation'' does not apply equally to the conflict and to our efforts to bring
        about a settlement."'
      n: '[112 Cong. Rec. 19177](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt14/pdf/GPO-CRECB-1966-pt14-8-1.pdf#page=5)
        (Aug. 12, 1966). [[w.gibbons-u-s-government-and]], IV, 392. Check: Gibbons cites p. 19188 and quotes "Our military
        efforts have been escalated, ... but our efforts for peace have not."'
      tags:
