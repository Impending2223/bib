      when: June 28
      date: '1966-06-28'
      thread: vietnam-force-levels
      c: 'Johnson to McNamara, drafted by Rostow: "I should like this schedule to be accelerated as much as possible so that
        General Westmoreland can feel assured that he has all the men he needs as soon as possible"; meet the Joint Chiefs
        and report what acceleration is possible this year.'
      n: '[[w.gibbons-u-s-government-and]], IV, 360. To check: Johnson to McNamara, June 28, 1966, NSF Memos to the President—Walt
