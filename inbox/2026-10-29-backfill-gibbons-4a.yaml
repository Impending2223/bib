      when: Nov. 12
      date: '1966-11-12'
      thread: vietnam
      c: 'Rusk, McNamara and Komer to Lodge, 83699, cleared by the White House: proceed with the dual plan; a few American
        troops on the buddy system "to guide and motivate," but "there should be no thought of US taking on substantial share
        of pacification."'
      n: '[FRUS 1964–68, IV, doc. 304](https://history.state.gov/historicaldocuments/frus1964-68v04/d304). [[w.gibbons-u-s-government-and]],
