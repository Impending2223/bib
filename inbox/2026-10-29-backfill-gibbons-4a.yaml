- add:
    entry:
      id: cal.1965-08-13.vietnam-support
      when: Aug. 13
      date: '1965-08-13'
      thread: vietnam-support
      c: 'Greenfield to Moyers, "Public Affairs Problems in the Vietnam Conflict": a "thorough review of military actions
        and techniques," artillery against occupied villages, bombing and napalm in populated areas. "We are not making progress
        if we kill 50 Viet Cong but provide them with 150 potential recruits in the process."'
      n: '[[w.gibbons-u-s-government-and]], IV, 70–71. To check: Greenfield to Moyers, "Public Affairs Problems in the Vietnam
        Conflict," Aug. 13 (printed 1967), NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 71 n.75). See [[cal.1965-08-10.vietnam-support]]. Check: Gibbons''s note dates the memorandum Aug. 13, 1967. Names:
        Greenfield, Moyers.'
      tags:
      - name:greenfield-james-l
      - name:moyers-bill
      src:
        c: bf1c4223
        rows:
        - 'w.gibbons-u-s-government-and IV, 70–71: all'
        - 'via w.gibbons-u-s-government-and IV, 71 n.75: all'
- add:
    entry:
      id: cal.1965-08-14.vietnam
      when: Aug. 14
      date: '1965-08-14'
      thread: vietnam
      c: 'Wheeler to Westmoreland, JCS 3041-65, on American troops in clearing villages: "I recall one of the concepts in
        your estimate of the situation was that US and GVN forces would be used against VC units, but that GVN forces would
        have to perform the pacification task." And air power against villages: is a clear line drawn between those the Viet
        Cong control and the others?'
      n: '[[w.gibbons-u-s-government-and]], IV, 71. To check: Wheeler to Westmoreland, JCS 3041-65, Aug. 14, 1965, CMH, Westmoreland
        Papers, History File (cited by [[w.gibbons-u-s-government-and]], IV, 71 n.76). Reply: [[cal.1965-08-18.vietnam-3]].
        Names: Wheeler, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
      src:
        c: d9de25dd
        rows:
        - 'w.gibbons-u-s-government-and IV, 71: all'
        - 'via w.gibbons-u-s-government-and IV, 71 n.76: all'
- add:
    entry:
      id: cal.1965-08-18.vietnam-3
      when: Aug. 18
      date: '1965-08-18'
      thread: vietnam
      c: 'Westmoreland to Wheeler, MAC 4171: American troops must be used in the populated areas; "The final battle is for
        the hamlets themselves." Villages in Viet Cong areas "fair game," their later pacification kept in mind. "Commanders
        must exercise restraint unnatural to war and judgment not often required of young men." To cut the bad publicity:
        the war explained at home, "some control over press and photographic coverage," the troops taught to spare noncombatants.'
      n: '[[w.gibbons-u-s-government-and]], IV, 71. To check: Westmoreland to Wheeler, MAC 4171 and 4382, Aug. 18 and 28,
        1965, CMH, Westmoreland Papers, Message Files (cited by [[w.gibbons-u-s-government-and]], IV, 71 n.77). See [[cal.1965-08-14.vietnam]].
        Check: Gibbons cites MAC 4171 and 4382, Aug. 18 and 28, for the reply. Names: Westmoreland, Wheeler.'
      tags:
      - name:westmoreland-william
      - name:wheeler-earle
      src:
        c: bd074d5b
        rows:
        - 'w.gibbons-u-s-government-and IV, 71: all'
        - 'via w.gibbons-u-s-government-and IV, 71 n.77: all'
- add:
    entry:
      id: cal.1965-09-07.vietnam
      when: Sept. 7
      date: '1965-09-07'
      thread: vietnam
      c: 'MACV Directive 525-3, on keeping down noncombatant casualties: "unnecessary force" in the areas the Viet Cong hold
        "will embitter the population, drive them into the arms of the VC." Strikes before ground attacks in populated areas,
        reconnaissance by fire into hamlets and ill-chosen harassing fire "counterproductive in the long run."'
      n: '[[w.gibbons-u-s-government-and]], IV, 71–72. To check: MACV Directive 525-3, Sept. 7, 1965, CMH, Westmoreland Papers,
        History File (cited by [[w.gibbons-u-s-government-and]], IV, 72 n.79). See [[cal.1965-08-18.vietnam-3]]. Names: Westmoreland.'
      tags:
      - name:westmoreland-william
      src:
        c: 183db948
        rows:
        - 'w.gibbons-u-s-government-and IV, 71–72: all'
        - 'via w.gibbons-u-s-government-and IV, 72 n.79: all'
- add:
    entry:
      id: cal.1965-08-26.vietnam
      when: Aug. 26
      date: '1965-08-26'
      thread: vietnam
      c: 'Lodge to Johnson, "a very private letter": against negotiations. The aim a "satisfactory outcome," the Communists
        ceasing to fight or the populous areas held; "if you make a ''settlement'' and diplomatic ''negotiations'' as a symbol
        of success, you are really reaching for the moon."'
      n: '[[w.gibbons-u-s-government-and]], IV, 75 n.89. Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
        c: c51bc7c3
        rows:
        - 'w.gibbons-u-s-government-and IV, 75: all'
        - 'via w.gibbons-u-s-government-and IV, 75 n.89: all'
- add:
    entry:
      id: cal.1965-10-11.vietnam
      when: Oct. 11
      date: '1965-10-11'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'The study asked Sept. 29 on Hanoi''s hardening, by Thompson, William Bundy, McNaughton and Taylor: the Viet Cong
        likely to break up their large units for hit-and-run strikes, terror and sabotage, against negotiations until it is
        clear "we will stay the course." The bombing of the North leveled off, its most sensitive targets spared to the new
        year; a pause to be considered. Taylor, separately: more bombing, few more troops; a guerrilla war might take a million
        men.'
      n: '[FRUS 1964–68, III, doc. 164](https://history.state.gov/historicaldocuments/frus1964-68v03/d164) (the group''s paper).
        [[w.gibbons-u-s-government-and]], IV, 78–79. To check: Taylor, "Possible Alternatives in Vietnam—The Future of Rolling
        Thunder," Oct. 11, 1965, State Department, Lot File 85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]],
        IV, 79 n.7). Made public: FRUS 1964–68, III (1996). See [[cal.1965-09-29.vietnam]]. Names: Thompson, William Bundy,
        McNaughton, Taylor.'
      tags:
      - name:thompson-llewellyn-e
      - name:bundy-william
      - name:mcnaughton-john-t
      - name:taylor-maxwell
      src:
