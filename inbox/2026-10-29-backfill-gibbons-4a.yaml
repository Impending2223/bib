- add:
    entry:
      id: cal.1965-08-10.vietnam-support
      when: Aug. 10
      date: '1965-08-10'
      thread: vietnam-support
      c: 'Moyers''s office, 5:30 to 6:30 p.m., on the war''s information problems. Greenfield: the reports of American soldiers
        burning villages cause "very serious problems here and abroad"; Sylvester: "unfriendly correspondents," Cẩm Nê "not
        typical"; Cooper: "at issue here is how the war should be fought." Zorthian to take charge of press and information
        at the Embassy.'
      n: '[FRUS 1964–68, III, doc. 117](https://history.state.gov/historicaldocuments/frus1964-68v03/d117). [[w.gibbons-u-s-government-and]],
        IV, 70. Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-03.vietnam-support]]. Check: Gibbons dates the meeting
        Sept. 12 in the text and Aug. 10 in the note. Names: Moyers, Greenfield, Sylvester, Cooper.'
      tags:
      - name:moyers-bill
      - name:greenfield-james-l
      - name:sylvester-arthur
      - name:cooper-chester-l
      - place:cam-ne
      src:
