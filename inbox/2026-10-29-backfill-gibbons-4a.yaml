      date: '1966-05-15'
      thread: vietnam-struggle
      c: 'State and Defense to Saigon, Flash, 3450, drafted by William Bundy: American advisers to be withdrawn from the South
        Vietnamese forces in I Corps, except units fighting the Communists; "we should not throw our weight in any way behind
        GVN effort that seems badly planned and ill-advised."'
      n: '[[w.gibbons-u-s-government-and]], IV, 317. To check: Washington to Saigon 3450, May 15, 1966, Department of State,
