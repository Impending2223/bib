        - 'w.gibbons-u-s-government-and IV, 263: all'
- add:
    entry:
      id: cal.1966-03-23.vietnam-congress
      when: Mar. 23
      date: '1966-03-23'
      thread: vietnam-congress
      c: 'Marcy to Fulbright, as the China hearings end, on the committee''s next course: subside to nonproliferation, disarmament,
        NATO; return to foreign aid; or go back to Vietnam with witnesses like Goldwater, LeMay and Nixon, "politically dangerous
        but it would keep the Committee in the midst of the crucial decisions." He favors the third. The committee holds no
        further hearings on Vietnam.'
      n: '[[w.gibbons-u-s-government-and]], IV, 265–66. To check: Marcy to Fulbright, Mar. 23, 1966, National Archives, RG
        46, Papers of the Committee on Foreign Relations, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], IV,
        265 n.143). See [[cal.1966-03-08.india-and-china]]. Names: Marcy, Fulbright, Goldwater, LeMay, Nixon.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:goldwater-barry-m
      - name:lemay-curtis-e
      - name:nixon-richard-m
