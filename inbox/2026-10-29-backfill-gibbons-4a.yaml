      id: cal.1966-07-23.vietnam
      when: July 23
      date: '1966-07-23'
      thread: vietnam
      also:
      - china
      c: 'Rice, from Hong Kong, 509: after the oil strikes China seems to have decided on more help for the North; "It would
        be dangerous to assume that we could carry measures against the DRV to the point which we could break the will of
        its regime without Communist China''s intervening."'
      n: '[[w.gibbons-u-s-government-and]], IV, 378. To check: Hong Kong to Washington 509, July 23, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 378 n.83).'
