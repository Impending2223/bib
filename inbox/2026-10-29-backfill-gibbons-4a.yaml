- add:
    entry:
      id: cal.1966-10-03.vietnam-asian-trip
      when: Oct. 3
      date: '1966-10-03'
      thread: vietnam-asian-trip
      c: 'Rostow to Johnson, the results wanted from Manila: the allies'' commitment reaffirmed; agreed terms for peace; Saigon''s
        approach to the Viet Cong, perhaps an amnesty; pacification and land reform; Cambodia''s integrity; regional development
        without a new bloc of the fighting allies.'
      n: '[[w.gibbons-u-s-government-and]], IV, 440 n.3. Names: Rostow, Johnson.'
      tags:
