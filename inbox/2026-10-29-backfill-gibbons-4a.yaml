      when: Sept. 15
      date: '1966-09-15'
      thread: vietnam
      also:
      - soviet-union
      c: 'The Negotiations Committee on the coming Johnson–Gromyko meeting. Thompson doubts Moscow will "talk seriously."
        Harriman: the first Soviet proposal of private talks on Vietnam, "a glimmer of light," not to be snuffed out. The
        committee with Harriman.'
      n: '[[w.gibbons-u-s-government-and]], IV, 442–43. To check: Memorandum of the meeting of the Negotiations Committee,
