      c: 'Lansdale sends Lodge and officials in Washington his paper "The Battleground in 1967." Porter to Lodge the same
        day: "full of conventional wisdom ... written for the record rather than to you."'
      n: '[[w.gibbons-u-s-government-and]], IV, 475 n.117. Rostow to Johnson, Nov. 17: "Ed Lansdale at his best." Names: Lansdale,
