      when: Feb. 10
      date: '1966-02-10'
      thread: vietnam-congress
      c: 'Marcy drafts for Fulbright four alternative amendments to the supplemental: the sense of Congress for continuous
        efforts toward negotiations; no substantial additional forces committed "without further action by the Congress";
        the act neither approval nor disapproval of past policy; nothing in it a wish to expand the hostilities.'
