        rows:
        - 'w.gibbons-u-s-government-and IV, 295: all'
        - 'via w.gibbons-u-s-government-and IV, 295 n.77b: all'
- add:
    entry:
      id: cal.1966-04-20.vietnam-struggle
      when: Apr. 20
      date: '1966-04-20'
      thread: vietnam-struggle
      c: 'State to Saigon, 3144, drafted by Miller: the "current breather" strained by fighting in I Corps, Saigon''s doubts
        about elections, a tortuous procedure for the electoral law; if the "fragile agreement" is not to come apart, the
        government must move fast, the Mission helping behind the scenes.'
      n: '[[w.gibbons-u-s-government-and]], IV, 295. To check: Washington to Saigon 3144, Apr. 20, 1966 (so cited, 1967),
        NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 295 n.78). Check: Gibbons dates
        the cable 1967. See [[cal.1966-04-16.vietnam-struggle]].'
      src:
        c: c713b5d2
        rows:
        - 'w.gibbons-u-s-government-and IV, 295: all'
        - 'via w.gibbons-u-s-government-and IV, 295 n.78: all'
- add:
    entry:
      id: cal.1966-04-14.vietnam
      when: Apr. 14
      date: '1966-04-14'
      thread: vietnam
      c: 'Rostow, "Headings for Decision and Action": a presidential statement tying aid to order and the war''s prosecution;
        experts, "in the most discreet way possible," for the constitution; intelligence on the convention''s people as for
        "a U.S. national political convention"; POL; and whether Saigon should open "a covert dialogue with the VC."'
      n: '[FRUS 1964–68, IV, doc. 121](https://history.state.gov/historicaldocuments/frus1964-68v04/d121). [[w.gibbons-u-s-government-and]],
        IV, 296. Made public: FRUS 1964–68, IV (1998). Names: Rostow.'
      tags:
      - name:rostow-walt-w
      src:
        c: e86fe09f
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d121: all'
        - 'w.gibbons-u-s-government-and IV, 296: all'
        - 'via w.gibbons-u-s-government-and IV, 296 n.80: all'
- add:
    entry:
      id: cal.1966-04-16.vietnam
      when: Apr. 16
      date: '1966-04-16'
      thread: vietnam
      c: 'Three papers for the review, apparently for its meeting: Carver''s "How We Should Move" and Unger''s "Scenario,"
        the commitment contingent on South Vietnam''s own effort, "the Eisenhower position"; McNaughton''s "Politics in Vietnam:
        A ''Worst'' Outcome": if neutralists take power and seek a coalition, "the United States has little choice but to
        get out of Vietnam."'
      n: '[[w.gibbons-u-s-government-and]], IV, 296–97. To check: Carver, "How We Should Move"; Unger, "Scenario"; McNaughton,
        "Politics in Vietnam: A ''Worst'' Outcome," Apr. 16, 1966, Warnke Papers, McNaughton Files, LBJ Library (cited by
        [[w.gibbons-u-s-government-and]], IV, 296 n.82). See [[cal.1966-04-09.vietnam-2]]. Names: Carver, Unger, McNaughton.'
      tags:
      - name:carver-george-a-jr
      - name:unger-leonard
      - name:mcnaughton-john-t
      src:
        c: 3b83ca9d
        rows:
        - 'w.gibbons-u-s-government-and IV, 296–97: all'
        - 'via w.gibbons-u-s-government-and IV, 296 n.82: all'
- add:
    entry:
      id: cal.1966-04-21.vietnam-3
      when: Apr. 21
      date: '1966-04-21'
      thread: vietnam
      c: 'Rostow to Johnson, "Vietnam—The Critical Issues": the enemy hopes American politics cannot stand a protracted war,
        "playing us as they did the French in 1953." Force a decision in Hanoi now: hurt it around Hanoi and Haiphong, block
        the roads from Laos, raise attrition until main forces disintegrate. A speech on the theme "We are all being tested
        by this crisis."'
      n: '[FRUS 1964–68, IV, doc. 125](https://history.state.gov/historicaldocuments/frus1964-68v04/d125). [[w.gibbons-u-s-government-and]],
        IV, 297–98. Made public: FRUS 1964–68, IV (1998). Names: Rostow, Johnson.'
      tags:
