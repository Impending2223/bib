      when: Feb. 23
      date: '1966-02-23'
      thread: vietnam-hearings
      c: 'Lodge to the President, Saigon 3075, after lunch with officers of the 1st Cavalry Division: no one there understands
        "why this public attack is going on"; "organized public criticism from Congress should cease"; "hard to explain why
        the very prominent and distinguished Americans responsible for this are not doing their talking and inquiring in private."'
      n: '[[w.gibbons-u-s-government-and]], IV, 248–49 n.100. To check: Saigon to Washington 3075, Feb. 23, 1966, Department
        of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 248 n.100). See [[cal.1966-02-22.vietnam-hearings]].
        Names: Lodge, Johnson.'
      tags:
