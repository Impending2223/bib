      when: Mar. 23
      date: '1966-03-23'
      thread: vietnam-struggle
      c: 'Lodge''s weekly telegram, 3467: last week bad and this week too; "I worry lest the Directorate may be coming apart";
        "everything you try to grab is like quicksilver." "What can be done without a civil government?" The Buddhists'' attitude
        "undoubtedly reflects Communist advice."'
