        - 'via w.gibbons-u-s-government-and IV, 330 n.53: all'
- add:
    entry:
      id: cal.1966-06-01.vietnam-struggle-3
      when: June 1
      date: '1966-06-01'
      thread: vietnam-struggle
      c: 'The Directorate and the Buddhist leaders meet to complete their agreement: by Thiệu''s account to Westmoreland,
        the Buddhists say "the people" want Kỳ and Thiệu out; by Kỳ''s to Habib, Tâm Châu, asked "Do you want me to go or
        not?", says it never was his intention. Thiệu to Westmoreland: if Thiện Minh and Trí Quang were killed "things would
        remain quiet."'
      n: '[[w.gibbons-u-s-government-and]], IV, 330. To check: Saigon to Washington 5195, June 1, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.54); Westmoreland to Wheeler, MAC
        4474, June 1, 1966, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]],
        IV, 330 n.54). Names: Nguyễn Văn Thiệu, Westmoreland, Nguyễn Cao Kỳ, Habib, Tâm Châu, Thích Trí Quang.'
      tags:
      - name:nguyen-van-thieu
      - name:westmoreland-william
