      when: Mar. 2
      date: '1966-03-02'
      thread: vietnam
      c: 'Lodge''s weekly telegram, 3159: Kỳ writing Robert Kennedy against his thesis; North Vietnamese prisoners "sure there
        would be no U.S. or GVN invasion." "Might it not be well to take some action which would make Hanoi think we were
        planning an invasion?"'
