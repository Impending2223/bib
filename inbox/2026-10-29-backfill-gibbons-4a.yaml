- add:
    entry:
      id: cal.1966-07-15.vietnam-support
      when: July 15
      date: '1966-07-15'
      thread: vietnam-support
      c: 'Kearney of the Legal Adviser''s office to Rusk on legal remedies against Russell''s mock "trial": better not to
        litigate "the truth of allegations concerning issues of such great national significance"; a suit would bring "very
        unfavorable publicity" and focus attention on Russell.'
      n: '[[w.gibbons-u-s-government-and]], IV, 433. To check: Kearney to Rusk, "Legal Remedies Available Against Persons
        Conducting a Mock ''Trial'' of United States Officials for ''War Crimes'' in Vietnam," July 15, 1966, Department of
        State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 433 n.172). Names: Rusk.'
      tags:
      - name:rusk-dean
      src:
        c: 189c5cfc
        rows:
        - 'w.gibbons-u-s-government-and IV, 433: all'
        - 'via w.gibbons-u-s-government-and IV, 433 n.172: all'
- add:
    entry:
      id: cal.1966-08-05.vietnam-support
      when: Aug. 5
      date: '1966-08-05'
      thread: vietnam-support
      c: 'Ball and Yarmolinsky, by telephone, on Russell''s tribunal. Yarmolinsky: it "could hurt us a good deal in Europe
        and also Asia"; counsel to file briefs. Ball would not "dignify" it: a "competing trial" through the International
        Commission of Jurists instead; he has spoken to McNamara and Helms.'
      n: '[[w.gibbons-u-s-government-and]], IV, 433. To check: Ball and Yarmolinsky, telephone, Aug. 5, 1966, Ball Telcons,
        LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 433 n.173). Names: Ball, Yarmolinsky, McNamara, Helms.'
      tags:
      - name:ball-george-w
      - name:yarmolinsky-adam
      - name:mcnamara-robert-s
      - name:helms-richard
      src:
        c: f0c026d2
        rows:
        - 'w.gibbons-u-s-government-and IV, 433: all'
        - 'via w.gibbons-u-s-government-and IV, 433 n.173: all'
