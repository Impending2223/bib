- add:
    entry:
      id: cal.1966-01-02.vietnam
      when: Jan. 2
      date: '1966-01-02'
      thread: vietnam
      c: 'Rusk to Lodge, drafted himself, Washington to Saigon 1865: the heart of the problem "Hanoi''s determination to grab
        South Viet-Nam by force"; "not too much interested in shadow boxing on side issues." Tempted, should talks come, by
        "a conference in absentia," the two co-chairmen alone at the table.'
      n: '[[w.gibbons-u-s-government-and]], IV, 131 n.55. Check: Gibbons dates the cable Jan. 1 and Jan. 2. Reply: [[cal.1966-01-04.vietnam]].
        Names: Rusk, Lodge.'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
      src:
        c: 0c845522
        rows:
        - 'w.gibbons-u-s-government-and IV, 131: all'
        - 'via w.gibbons-u-s-government-and IV, 131 n.55a: all'
- add:
    entry:
      id: cal.1966-01-04.vietnam
      when: Jan. 4
      date: '1966-01-04'
      thread: vietnam
      c: 'Lodge to Rusk, Saigon 2376: no good from a conference in absentia, nor from the ICC nations or a new Geneva conference;
        any talks between North and South, the United States joining on its own presence. "Much of this talk of negotiations
        reminds me of a man with smallpox trying to cure it by putting coldcream on his face"; the Communists to be punished
        in the North, beaten in the field and rooted out first.'
      n: '[[w.gibbons-u-s-government-and]], IV, 131 n.55. See [[cal.1966-01-02.vietnam]]. Names: Lodge, Rusk.'
      tags:
      - name:lodge-henry-cabot
      - name:rusk-dean
      src:
        c: c8272eac
        rows:
        - 'w.gibbons-u-s-government-and IV, 131: all'
        - 'via w.gibbons-u-s-government-and IV, 131 n.55b: all'
