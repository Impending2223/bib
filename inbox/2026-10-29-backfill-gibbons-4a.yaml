        rows:
        - 'w.gibbons-u-s-government-and IV, 410: all'
        - 'via w.gibbons-u-s-government-and IV, 410 n.82: all'
- add:
    entry:
      id: cal.1966-05-27.vietnam-3
      when: May 27
      date: '1966-05-27'
      thread: vietnam
      c: 'Lansdale to Lodge, "The SLO Role": one more service before his group disbands, to help the Vietnamese build "their
        own popular political institutions" from the Assembly''s election to a new government, by "influencing the growth
        of coalitions of political groups." No action by Lodge recorded.'
      n: '[[w.gibbons-u-s-government-and]], IV, 411 n.85. See [[cal.1966-05-27.vietnam-4]]. Names: Lansdale, Lodge.'
