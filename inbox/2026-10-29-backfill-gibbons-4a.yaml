      id: cal.1966-01-19.vietnam-2
      when: Jan. 19
      date: '1966-01-19'
      thread: vietnam
      c: 'Reischauer from Tokyo, 2515: with Sullivan against bombing population centers and against a line across the north
        of South Vietnam; with Rice that a landing at Vinh would mean "unacceptable risks." "The real need is for a political
        answer in the South."'
      n: '[[w.gibbons-u-s-government-and]], IV, 195 n.78. See [[cal.1965-12-21.vietnam]]. Names: Reischauer, Sullivan.'
