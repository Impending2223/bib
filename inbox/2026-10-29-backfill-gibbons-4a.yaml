      when: May 12
      date: '1966-05-12'
      thread: vietnam
      c: 'Meeker to Rusk and Ball: a third party, Austria, Ireland or Japan, to sound governments not at war; from their talks
        a supervised cease-fire and withdrawal, then a National Assembly elected in the South to draft a constitution.'
      n: '[[w.gibbons-u-s-government-and]], IV, 369 n.56. Names: Meeker, Rusk, Ball.'
