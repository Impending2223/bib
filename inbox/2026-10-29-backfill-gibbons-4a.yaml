        rows:
        - 'w.gibbons-u-s-government-and IV, 109–111: all'
        - 'via w.gibbons-u-s-government-and IV, 110 n.100: all'
- add:
    entry:
      id: cal.1965-11-17.vietnam-pause
      when: Nov. 17
      date: '1965-11-17'
      thread: vietnam-pause
      c: 'McGeorge Bundy to Johnson, 6:15 p.m., sending Ball''s memorandum on a pause: McNamara for it, Rusk against. "The
        man who has to present next year''s defense budget will want to have made a last full try." Bundy "marginally against":
        a pause may seem to admit "that our bombing is the cause of the trouble."'
      n: '[FRUS 1964–68, III, doc. 202](https://history.state.gov/historicaldocuments/frus1964-68v03/d202). [[w.gibbons-u-s-government-and]],
        IV, 114–15. Made public: FRUS 1964–68, III (1996). See [[cal.1965-11-11.vietnam-pause]]. Names: McGeorge Bundy, Johnson,
        Ball, McNamara, Rusk.'
      tags:
