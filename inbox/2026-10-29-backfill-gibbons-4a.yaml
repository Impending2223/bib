      date: '1966-03-08'
      thread: vietnam-supplemental
      c: 'The Foreign Relations Committee reports the supplemental aid bill, S. Rep. No. 89-1060: "little room for encouragement"
        that the aid will mold sound development; until the military situation improves, "little more than a holding operation";
        skeptical "until words are matched with measurable deeds." Church and Clark, supplemental views, for McGovern''s amendment.'
      n: '[[w.gibbons-u-s-government-and]], IV, 260, 262. To check: S. Rep. No. 89-1060 (1966), Senate Comm. on Foreign Relations
