      c: 'MACV to CINCPAC, 18244, on PROVN: "an excellent overall approach," to go to the National Security Council for concepts;
        but reduced "primarily to a conceptual document." On American involvement in the government: "great danger" it becomes
        "an American takeover."'
      n: '[[w.gibbons-u-s-government-and]], IV, 208. To check: MACV to CINCPAC, MACV 18244, May 27, 1966, Center of Military
        History; Pentagon Papers, Gravel ed., II, 576 (cited by [[w.gibbons-u-s-government-and]], IV, 208 n.130). See [[cal.1966-03-14.vietnam]].'
