        - 'via w.gibbons-u-s-government-and IV, 254 n.119b: all'
- add:
    entry:
      id: cal.1966-02-23.vietnam-congress
      when: Feb. 23
      date: '1966-02-23'
      thread: vietnam-congress
      c: 'Marcy to Fulbright, on what the committee concludes from the hearings, with suggested supplemental views for its
        report: a land war beyond 200,000 men not without Congress''s approval under art. I, § 8; avoid war with North Vietnam
        or China; the advisers too committed to judge; stay at the present strength and be willing to withdraw once a representative
        coalition government exists. Not used in the report.'
      n: '[[w.gibbons-u-s-government-and]], IV, 260–61 n.131. To check: Marcy to Fulbright, Feb. 23, 1966, with a suggested
        statement of supplemental views, National Archives, RG 46, Papers of the Committee on Foreign Relations, Marcy Chron
        File (cited by [[w.gibbons-u-s-government-and]], IV, 260 n.131). See [[cal.1966-02-18.vietnam-congress]]. Names: Marcy,
        Fulbright.'
      tags:
