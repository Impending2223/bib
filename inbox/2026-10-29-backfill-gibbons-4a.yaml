        - 'w.gibbons-u-s-government-and IV, 149–50: B-D'
        - 'via w.gibbons-u-s-government-and IV, 149 n.107: B-D'
        - 'via w.gibbons-u-s-government-and IV, 177 n.21: B-D'
- add:
    entry:
      id: cal.1966-01-24.vietnam-congress-2
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-congress
      c: 'Russell in the Senate, against involvement since 1954: "few problems have so much potential for disaster." "I believe
        we must decide whether or not we are willing to take the action necessary to win the war in Vietnam and bring a conclusion
        to our commitment. The only other alternative I can see is to pull out—and this the overwhelming majority of Americans
        are not prepared to do."'
      n: '[112 Cong. Rec. 965–66](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-9-2.pdf#page=19)
        (Senate, Jan. 24, 1966). [[w.gibbons-u-s-government-and]], IV, 141–42. Names: Russell.'
      tags:
      - name:russell-richard-b
      src:
        c: bebae960
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-9-2.pdf#page=19: all'
        - 'w.gibbons-u-s-government-and IV, 141–42: all'
        - 'via w.gibbons-u-s-government-and IV, 142 n.84: all'
- add:
    entry:
      id: cal.1966-01-27.vietnam-congress-2
      when: Jan. 27
      date: '1966-01-27'
      thread: vietnam-congress
      c: 'Symington in the Senate, back from Southeast Asia: "we will move forward or move out." If South Vietnam is not the
        place to defend the free world, retire "on the best terms possible," the price "not catastrophic"; if it is, the holding
        operations cannot go on indefinitely.'
      n: '[112 Cong. Rec. 1305](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-12-1.pdf#page=43)
        (Senate, Jan. 27, 1966). [[w.gibbons-u-s-government-and]], IV, 142–43. Check: Gibbons dates the speech Jan. 25. See
        [[cal.1966-01-04.vietnam-congress]]. Names: Symington.'
      tags:
      - name:symington-william-s
      src:
        c: 87f83cd9
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-12-1.pdf#page=43: all'
        - 'w.gibbons-u-s-government-and IV, 142–43: all'
        - 'via w.gibbons-u-s-government-and IV, 142 n.86a: all'
- add:
    entry:
