        rows:
        - 'w.gibbons-u-s-government-and IV, 279–80: all'
        - 'via w.gibbons-u-s-government-and IV, 279 n.44b: all'
- add:
    entry:
      id: cal.1966-04-08.vietnam-struggle
      when: Apr. 8
      date: '1966-04-08'
      thread: vietnam-struggle
      c: 'Lodge, 3817: the Buddhists'' demands "a naked grab for power"; concessions "a slippery slope." Kỳ has "failed to
        assert the authority of the government." Force now, "late"; Lodge prefers "selective application of force," Đà Nẵng
        and Huế cordoned off, while the assembly is prepared.'
      n: '[[w.gibbons-u-s-government-and]], IV, 285–86. To check: Saigon to Washington 3817, Apr. 8, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 285 n.57). Names: Lodge, Nguyễn Cao Kỳ.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      src:
        c: d28ee3f3
        rows:
        - 'w.gibbons-u-s-government-and IV, 285–86: all'
        - 'via w.gibbons-u-s-government-and IV, 285 n.57: all'
- add:
    entry:
      id: cal.1966-04-08.vietnam-struggle-2
      when: Apr. 8
      date: '1966-04-08'
      thread: vietnam-struggle
      c: Kỳ and Thiệu tell Westmoreland of "a real show of force in Danang" and ask American planes for two more battalions;
        Westmoreland refers them to Lodge, who must ask Washington. That night the government flies the battalions in its
        own aircraft.
      n: '[[w.gibbons-u-s-government-and]], IV, 286. See [[cal.1966-04-07.vietnam-struggle]]. Names: Nguyễn Cao Kỳ, Nguyễn
        Văn Thiệu, Westmoreland, Lodge.'
