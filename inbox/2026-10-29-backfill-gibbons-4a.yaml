        - 'w.gibbons-u-s-government-and IV, 288–89: all'
        - 'via w.gibbons-u-s-government-and IV, 288 n.65: all'
- add:
    entry:
      id: cal.1966-04-09.vietnam-2
      when: Apr. 9
      date: '1966-04-09'
      thread: vietnam
      c: 'Johnson''s senior advisers assign papers for a review of the options, Ball in charge: A, the status quo, Carver;
        B-O, an "optimistic" compromise, Unger; B-P, the "pessimistic," McNaughton; C, withdrawal, Ball.'
      n: '[[w.gibbons-u-s-government-and]], IV, 289. No notes of the meeting are known. Names: Ball, Carver, Unger, McNaughton.'
      tags:
      - name:ball-george-w
      - name:carver-george-a-jr
      - name:unger-leonard
      - name:mcnaughton-john-t
      src:
        c: f5a7c7ee
        rows:
        - 'w.gibbons-u-s-government-and IV, 289: all'
- add:
    entry:
      id: cal.1966-04-11.vietnam
      when: Apr. 11
      date: '1966-04-11'
      thread: vietnam
      c: 'Carver of the CIA, "Consequences of a Buddhist Political Victory in South Vietnam," asked for at the meeting of
        Apr. 8: a dangerous transition, held only by allied arms; but "the longer-term consequences ... could turn out very
        much to our advantage," a government with popular support. The Buddhists'' "long term political objectives are essentially
        similar to ours."'
      n: '[[w.gibbons-u-s-government-and]], IV, 287–88. To check: Carver, "Consequences of a Buddhist Political Victory in
        South Vietnam," Apr. 11, 1966, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 287 n.63). Names: Carver.'
      tags:
