- add:
    entry:
      id: cal.1966-02-01.vietnam-congress-2
      when: Feb. 1
      date: '1966-02-01'
      thread: vietnam-congress
      c: 'Hilsman before Zablocki''s subcommittee: the United States cannot desert South Vietnam, and he favored sending ground
        forces; but "if we over-Americanize the struggle ... the struggle itself will have been lost." Against bombing the
        North, for enclaves: "deescalate," "demilitarize," "de-Americanize"; a struggle of 10 to 15 years.'
      n: '[[w.gibbons-u-s-government-and]], IV, 226–27 n.42. To check: House Comm. on Foreign Affairs, Subcomm. on the Far
        East and the Pacific, *United States Policy Toward Asia: Hearings* (1966), 89th Cong., 2d Sess. (cited by [[w.gibbons-u-s-government-and]],
        IV, 226 n.42). See [[cal.1966-01-27.vietnam-congress-4]]. Names: Hilsman, Zablocki.'
      tags:
