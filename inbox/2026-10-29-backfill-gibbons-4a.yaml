- add:
    entry:
      id: cal.1965-11-11.vietnam-pause
      when: Nov. 11
      date: '1965-11-11'
      thread: vietnam-pause
      also:
      - vietnam-force-levels
      c: 'The Ranch, 2:30 to 3:45 p.m.: Johnson with Rusk, McNamara, Ball, McGeorge Bundy and Moyers. Bundy''s agenda: more
        deployments in 1966; a pause first; the bombing; Lodge''s or Goldberg''s view of negotiation; the purpose, a compromise
        "which would eventually turn Communist" or a non-Communist South Vietnam "by all necessary means." By Bundy''s notes,
        Johnson "60-40" for a pause "about Thanksgiving."'
      n: '[FRUS 1964–68, III, doc. 198](https://history.state.gov/historicaldocuments/frus1964-68v03/d198) (the editorial
        note, from the Daily Diary and the agenda). [[w.gibbons-u-s-government-and]], IV, 88–89. To check: McGeorge Bundy
        to Johnson, Nov. 11, 1965, NSF Memos to the President—McGeorge Bundy, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 88 n.32); McGeorge Bundy, handwritten notes, Notes on Vietnam, Papers of McGeorge Bundy, LBJ Library (cited by
        [[w.gibbons-u-s-government-and]], IV, 89 n.35). Made public: FRUS 1964–68, III (1996). See [[cal.1965-11-06.vietnam-pause]].
        Check: Gibbons has the meeting morning and afternoon, Rostow, Clifford and Moyers there for part. Names: Johnson,
        Rusk, McNamara, Ball, McGeorge Bundy, Moyers, Lodge, Goldberg.'
