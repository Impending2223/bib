      when: Mar. 2
      date: '1966-03-02'
      thread: vietnam
      c: 'Ball lunches with Lippmann and urges him to stop attacking the policy: with Johnson elected in 1960 a different
        course "highly likely," but with more than 200,000 men in South Vietnam "we had no option but to carry on the war
        until we had achieved our political objectives."'
      n: '[[w.gibbons-u-s-government-and]], IV, 258 n.127. Ball''s account. Names: Ball, Lippmann, Johnson.'
