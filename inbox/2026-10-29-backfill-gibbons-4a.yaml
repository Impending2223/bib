      date: '1966-09-28'
      thread: vietnam-congress
      c: 'Fulbright on the Manila meeting: little good from "such a cozy little group" of "our boys"; better a statement of
        willingness to withdraw and a bombing halt for a reasonable time, and the Front in the negotiations.'
