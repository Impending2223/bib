- add:
    entry:
      id: cal.1966-08-02.vietnam-2
      when: Aug. 2
      date: '1966-08-02'
      thread: vietnam
      also:
      - china
      c: 'Rostow to Johnson on intelligence of July 29 and Aug. 2 that Chinese ground forces may have entered North Vietnam:
        not conclusive, no cause for alarm; he has asked Clifford, chairman of the Foreign Intelligence Advisory Board, "quietly"
        to see whether the agencies are doing their utmost to find out.'
      n: '[[w.gibbons-u-s-government-and]], IV, 379. To check: Rostow to Johnson, Aug. 2, 1966, with intelligence reports
        of July 29 and Aug. 2, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 379 n.85). Names: Rostow, Johnson, Clifford.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
