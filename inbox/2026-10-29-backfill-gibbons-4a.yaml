      when: Mar. 1
      date: '1966-03-01'
      thread: vietnam-congress
      c: 'House. Cohelan presents a statement of 78 members, Democrats, nearly all liberals: they will vote for the authorization,
        which the troops require, but "reject any contention that approval of this legislation will constitute a mandate for
        unrestrained or indiscriminate enlargement of the military effort."'
      n: '[112 Cong. Rec. 4431](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-2.pdf#page=18)
        (House, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 259–60 n.129. See [[cal.1966-03-01.vietnam]].'
