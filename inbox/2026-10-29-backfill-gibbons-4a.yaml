        - 'via w.gibbons-u-s-government-and IV, 81 n.14: A'
- add:
    entry:
      id: cal.1965-10-23.vietnam-2
      when: Oct. 23
      date: '1965-10-23'
      thread: vietnam
      also:
      - vietnam-force-levels
      - vietnam-pause
      c: 'William Bundy, "Policy Choices and Decision-Making Procedures on Vietnam," to Rusk, McNamara, Ball, McGeorge Bundy
        and Thompson: DePuy''s case, presented to the Chiefs and the principals Oct. 18–22, for 115,000 more men in 1966,
        325,000 in all; pressure, "symbolized by General LeMay and the Ford/Adair line," to hit the North harder. Three choices:
        a month''s pause, then Phase II; Phase II with no pause; Phase I finished and a halt of perhaps three months.'
      n: '[FRUS 1964–68, III, doc. 181](https://history.state.gov/historicaldocuments/frus1964-68v03/d181). [[w.gibbons-u-s-government-and]],
        IV, 80–82. Made public: FRUS 1964–68, III (1996). Names: William Bundy, Rusk, McNamara, Ball, McGeorge Bundy, Thompson,
        DePuy, LeMay, Ford.'
      tags:
