- add:
    entry:
      id: cal.1966-02-07.vietnam
      when: Feb. 7
      date: '1966-02-07'
      thread: vietnam
      c: 'Honolulu. Johnson alone with Kỳ and Thiệu, by Moyers''s summary: the exchange rate to be studied; stabilization
        measures, Kỳ to announce some on his return; more for Chiêu Hồi, and "three or four" prominent Viet Cong brought over
        and used on the radio. Study the American critics, the *New York Times* and the Foreign Relations Committee: "You
        need to know what our pressures are just as we need to know what yours are." Kỳ to act "like a politician instead
        of just a general."'
      n: '[[w.gibbons-u-s-government-and]], IV, 230–31 n.52. To check: Moyers to U. Alexis Johnson, Feb. 16, 1966, on Johnson''s
        private meeting with Kỳ and Thiệu, Feb. 7, Department of State, Lot File 74 D 272 (cited by [[w.gibbons-u-s-government-and]],
        IV, 230 n.52). Check: the summary is Moyers''s to U. Alexis Johnson, Feb. 16. See [[cal.1966-02-06.vietnam]]. Names:
        Johnson, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Moyers.'
