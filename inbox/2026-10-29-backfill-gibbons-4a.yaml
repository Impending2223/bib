- add:
    entry:
      id: cal.1966-10-10.vietnam-2
      when: Oct. 10
      date: '1966-10-10'
      thread: vietnam
      c: 'Saigon. Lodge briefs McNamara: the "military war" a success, and by spring "a very different military situation
        indeed"; but in the "criminal" or "terrorist" war, the heart of the matter, little progress: roads open, population
        secure, the Viet Cong''s share hardly changed since Honolulu.'
      n: '[[w.gibbons-u-s-government-and]], IV, 450–51. To check: Saigon to Washington 8262, Oct. 12, 1966, with the text
        of Lodge''s statement at the briefing, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 451 n.40). See [[cal.1966-10-10.vietnam]]. Names: Lodge, McNamara.'
      tags:
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
      src:
        c: 4a812419
        rows:
        - 'w.gibbons-u-s-government-and IV, 450–51: all'
        - 'via w.gibbons-u-s-government-and IV, 451 n.40: all'
- add:
    entry:
      id: cal.1966-10-10.vietnam-3
      when: Oct. 10
      date: '1966-10-10'
      thread: vietnam
      c: 'Lodge with McNamara at his house, reading him a memorandum: "seek out and destroy" means many more casualties than
        "split up and keep off balance"; the war will be won by destroying the terrorist organization, not by killing; so
        fewer American troops in the "military" war, more in pacification, ten percent of the ARVN''s infantry strength assigned
        to its divisions on the "buddy" system.'
      n: '[[w.gibbons-u-s-government-and]], IV, 451–52. Lodge''s account; by his memoir, McNamara recalled the talk in 1968.
        To check: Lodge''s memorandum read to McNamara, Oct. 10, 1966, Lodge Papers, Vietnam Papers, Massachusetts Historical
        Society (cited by [[w.gibbons-u-s-government-and]], IV, 451 n.41). See [[cal.1966-10-10.vietnam-2]]. Names: Lodge,
        McNamara.'
      tags:
      - name:lodge-henry-cabot
      - name:mcnamara-robert-s
      src:
        c: 085e20b2
        rows:
        - 'w.gibbons-u-s-government-and IV, 451–52: all'
        - 'via w.gibbons-u-s-government-and IV, 451 n.41: all'
- add:
    entry:
      id: cal.1966-10-10.vietnam-force-levels
      when: Oct. 10
      date: '1966-10-10'
      thread: vietnam-force-levels
      also:
      - vietnam
      c: 'MACV''s briefing for McNamara on the barrier. Starbird outlines his task force''s plan; McNamara: "I do not know
        if this or any other barrier is practical." Westmoreland: Tiger Hound, mobile forces by the zone, and a "strong point
        obstacle system" of his own. McNamara: "an excellent plan"; "I keep looking back for five years, and as far as I am
        concerned it is a failure"; "a year from today there is going to be a barrier up there."'
      n: '[[w.gibbons-u-s-government-and]], IV, 456–57. To check: Transcript of the meeting of Oct. 10, 1966, MACV records,
        U.S. Army Military History Institute, Carlisle Barracks, Pa. (microfilm) (cited by [[w.gibbons-u-s-government-and]],
        IV, 457 n.60). See [[cal.1966-09-15.vietnam]]. Names: Starbird, McNamara, Westmoreland.'
      tags:
      - name:starbird-alfred-d
      - name:mcnamara-robert-s
      - name:westmoreland-william
      src:
        c: 4a81fb47
        rows:
        - 'w.gibbons-u-s-government-and IV, 456–57: all'
        - 'via w.gibbons-u-s-government-and IV, 457 n.60: all'
