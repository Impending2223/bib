- add:
    entry:
      id: cal.1966-01-18.vietnam
      when: Jan. 18
      date: '1966-01-18'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-41-66: the restrained strikes so far "will not achieve the primary military objective."
        On resuming, a "sharp blow," then uninterrupted pressure: the ports closed, the lines from China cut, the oil, the
        power and the large military installations struck, targets nearer Hanoi, Haiphong and China.'
