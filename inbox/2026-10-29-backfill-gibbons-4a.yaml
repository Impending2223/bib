      when: Mar. 17
      date: '1966-03-17'
      thread: vietnam-air-war
      c: 'Westmoreland, MACV 8328 and 8332: the enemy "building up organizationally and materially"; the most damage in and
        by the Laos panhandle before the monsoon "an objective of over-riding priority"; heavier strikes on the North''s lines
        of communication, the oil first.'
      n: '[[w.gibbons-u-s-government-and]], IV, 363. To check: MACV 8328, Mar. 17, 1966, summarized in Tab C of Unger to Rusk,
        Mar. 30, 1966, Department of State, Lot File 74 D 164 (cited by [[w.gibbons-u-s-government-and]], IV, 363 n.33); MAC
        8332, Mar. 17, 1966, summarized in Unger to Rusk, Mar. 30, 1966, Department of State, Lot File 74 D 164 (cited by
        [[w.gibbons-u-s-government-and]], IV, 363 n.34). Check: Gibbons has CINCPAC concurring; Bromley Smith to Johnson,
        Mar. 19 ([FRUS 1964–68, IV, doc. 98](https://history.state.gov/historicaldocuments/frus1964-68v04/d98)), has Sharp
        raising objections. Names: Westmoreland.'
