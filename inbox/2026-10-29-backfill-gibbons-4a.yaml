      date: '1966-02-16'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson, "Non-Military Organization for Vietnam—in Saigon and in Washington," written on the flight
        home: Lodge "the very model of a man who needs staff support"; Porter and Westmoreland the indispensable men. A Washington
        coordinator for the nonmilitary effort; candidates by Feb. 18.'
      n: '[FRUS 1964–68, IV, doc. 77](https://history.state.gov/historicaldocuments/frus1964-68v04/d77). [[w.gibbons-u-s-government-and]],
        IV, 188 n.50 (Lodge; the coordinator). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-17.vietnam]]. Names:
