      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam
      c: 'Westmoreland to Washington, MACV 0117: the programs of pacification, military and civilian, to be completely integrated,
        under a coordinating committee directed by Porter; Lansdale not the coordinator, his field "political action," "a
        very useful function for which General Lansdale has incomparable talents."'
      n: '[[w.gibbons-u-s-government-and]], IV, 185. To check: MACV 0117, Jan. 7, 1966, Westmoreland Papers, Message Files,
        Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 185 n.40). Check: the cable''s words and
