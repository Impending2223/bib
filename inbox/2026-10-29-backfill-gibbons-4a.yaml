- add:
    entry:
      id: cal.1965-08-31.war-opposition
      when: Aug. 31
      date: '1965-08-31'
      thread: war-opposition
      c: 'Lausche introduces S. 2482: obstructing the movement of the armed forces'' men or property a felony, up to ten years
        and $10,000. Into the Record, a leaflet handed out at the protests against the troop trains to the Oakland Army Terminal,
        the Progressive Labor Party and Students for a Democratic Society among its signers. Not enacted.'
      n: '[111 Cong. Rec. 22316–17](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt17/pdf/GPO-CRECB-1965-pt17-1-1.pdf#page=38)
        (Senate, Aug. 31, 1965). [[w.gibbons-u-s-government-and]], IV, 28 (the bill, the leaflet, the trains; not enacted).
        See [[cal.1965-08-10.war-opposition]]. Names: Lausche.'
      tags:
