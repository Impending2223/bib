- edit:
    id: cal.1965-12-17.vietnam
    base: b3fc9764
    set:
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy and Ball, 9:41 to 11:04 a.m., on a pause, Valenti taking notes. Johnson:
        "I''m willing to take any gamble on stopping the bombing if I think I''ve got some hope of something happening." McNamara:
        "We will increase bombing. It is inevitable," and perhaps "a cease-fire in place." Ball: the bombing hardens Hanoi
        and drives it toward China. Johnson: the Chiefs "go through the roof when we mention this pause"; "the weakest chink
        in our armor is public opinion." A pause suggested, Dec. 22 to Jan. 22.'
      n: 'FRUS 1964–68, III, doc. [231](https://history.state.gov/historicaldocuments/frus1964-68v03/d231) (Valenti''s notes).
        [[w.gibbons-u-s-government-and]], IV, 120–21. Bibliography: [[cal.1965-12-24.vietnam]]. Made public: FRUS 1964–68,
        III (1996). Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, Valenti.'
      when: Dec. 17
      tags:
