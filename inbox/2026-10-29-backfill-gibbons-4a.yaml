        rows:
        - 'w.gibbons-u-s-government-and IV, 371–72: all'
        - 'via w.gibbons-u-s-government-and IV, 371 n.65: all'
- add:
    entry:
      id: cal.1966-06-22.vietnam-2
      when: June 22
      date: '1966-06-22'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'NSC, 12:30 p.m., on the oil strikes. McNamara: truck traffic up 100 percent, infiltration 120; civilian dead 50
        to 300. Wheeler: "In a very real sense, this is a war of attrition"; next, mining Haiphong. Johnson: "I don''t get
        any alternatives"; "Are you more sure than MacArthur was?"; public approval "deteriorating." Taylor: mine Haiphong
        too. All for the strikes but Goldberg.'
      n: '[FRUS 1964–68, IV, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161). [[w.gibbons-u-s-government-and]],
        IV, 374–76 (but McNamara''s figures). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-06-17.vietnam-2]]. Bibliography:
        [[cal.1966-06-29.vietnam]]. Names: McNamara, Wheeler, Johnson, Taylor, Goldberg.'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:goldberg-arthur-j
      src:
        c: 65f28edf
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d161: all'
        - 'w.gibbons-u-s-government-and IV, 374–76: A, D-J'
        - 'via w.gibbons-u-s-government-and IV, 374 n.68: all'
- add:
    entry:
      id: cal.1966-07-16.vietnam
      when: July 16–17
      date: '1966-07-16'
      thread: vietnam
      c: 'Hanoi calls up part of its reserves. Hồ Chí Minh, July 17: "The war may last still 5, 10, 20 years or longer. Hanoi,
        Haiphong and other cities and enterprises may be destroyed, but the Vietnamese people will not be intimidated. Nothing
        is more precious than independence and freedom."'
      n: '[[w.gibbons-u-s-government-and]], IV, 378. Check: Gibbons dates the call-up July 16; the source, the *New York Times*
        of July 17. Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      src:
        c: 33c31034
        rows:
        - 'w.gibbons-u-s-government-and IV, 378: all'
        - 'via w.gibbons-u-s-government-and IV, 378 n.81: all'
- add:
