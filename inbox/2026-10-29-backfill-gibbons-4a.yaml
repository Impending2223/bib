- add:
    entry:
      id: cal.1966-05-31.vietnam-struggle
      when: May 31
      date: '1966-05-31'
      thread: vietnam-struggle
      c: 'Six Buddhist leaders of the Institute, Tâm Châu and Thiện Minh among them, with six of the Directorate, Kỳ, Thiệu,
        Có and Viên among them: ten civilians to be added to the Directorate and the elections held as planned; the Buddhists
        to call off the protests, and Trí Quang to accept it. Lodge: "sounds too good to be true."'
      n: '[[w.gibbons-u-s-government-and]], IV, 330. To check: Saigon to Washington 5163, June 1, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.52). Names: Tâm Châu, Nguyễn Cao
        Kỳ, Nguyễn Văn Thiệu, Cao Văn Viên, Thích Trí Quang, Lodge.'
