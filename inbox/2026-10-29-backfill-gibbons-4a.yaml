      when: Aug. 18
      date: '1966-08-18'
      thread: vietnam
      c: 'Kissinger to Lodge, after a second visit in July at Unger''s request: "Vietnam has become the hinge of our national
        effort"; "the process of prevailing will be slow." "I did not find any substantial change in the provinces with the
        possible exception of Binh Dinh"; in one province shown 70 percent pacified, 80 percent of the people taxed by the
        Viet Cong.'
      n: '[[w.gibbons-u-s-government-and]], IV, 384. To check: Kissinger to Lodge, Aug. 18, 1966, attached to Kissinger to
        William Bundy, Aug. 19, 1966, Department of State, Lot File 85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]],
        IV, 384 n.100). Names: Kissinger, Lodge, Unger.'
