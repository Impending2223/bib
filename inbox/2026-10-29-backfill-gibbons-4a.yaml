- add:
    entry:
      id: cal.1965-12-14.vietnam
      when: Dec. 14
      date: '1965-12-14'
      thread: vietnam
      c: 'SNIE 10-12-65, "Probable Communist Reactions to a U.S. Course of Action": the pressures so far, the buildup and
        the bombing, have not changed Hanoi''s determination; "in the long run it can still prevail." The air attacks, even
        increased, not "a conclusive factor within the next six to nine months"; Hanoi counting on heavy American casualties
        and opposition at home. A second-phase buildup will be matched.'
      n: '[[w.gibbons-u-s-government-and]], IV, 109–111. To check: SNIE 10-12-65, "Probable Communist Reactions to a U.S.
        Course of Action," Dec. 14, 1965, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 110 n.100). See [[cal.1965-12-07.vietnam]].'
      src:
