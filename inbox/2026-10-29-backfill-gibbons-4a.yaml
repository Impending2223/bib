      date: '1966-02-11'
      thread: vietnam-hearings
      c: News conference. No fault with any committee's hearings "as long as they are conducted in an atmosphere of objectivity,
        fairness, judiciousness," and he has seen none otherwise; of Gavin's and Kennan's testimony, "I don't see that they
        have done any harm to anybody."
