        - 'via w.gibbons-u-s-government-and IV, 465 n.87a: all'
- add:
    entry:
      id: cal.1966-10-31.vietnam-air-war
      when: Oct. 31
      date: '1966-10-31'
      thread: vietnam-air-war
      c: 'The Joint Staff''s "Evaluation of the Air Campaign Against North Vietnam and Laos": its aim "general harassment,"
        not victory or the destruction of the North; constraints on mining, airfields, industry and the Hanoi–Haiphong sanctuaries
        have denied "a clear cut in the throughput of supplies."'
      n: '[FRUS 1964–68, IV, doc. 287](https://history.state.gov/historicaldocuments/frus1964-68v04/d287) (the report; its
        summary not printed). [[w.gibbons-u-s-government-and]], IV, 466 n.87. Made public: FRUS 1964–68, IV (1998). Check:
        FRUS dates it October 1966.'
      src:
