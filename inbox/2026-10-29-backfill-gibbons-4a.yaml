      when: Dec. 2
      date: '1966-12-02'
      thread: vietnam
      c: 'Lodge to Westmoreland: organizing the ARVN as a conventional force a mistake. Westmoreland: Lodge has "misjudged
        the situation"; it is a matter of tactics, not organization; Lodge "inclined to over-simplify the military situation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 452 n.42. Westmoreland''s account, in his notes. Names: Lodge, Westmoreland.'
      tags:
