      date: '1965-10-26'
      thread: vietnam
      also:
      - vietnam-force-levels
      c: 'McGeorge Bundy circulates a draft joint State–Defense–White House message to Lodge and Westmoreland: DePuy''s Phase
        II gives American ground forces the dominant fighting role; "what began as a Vietnamese war with U.S. assistance may
        end as a U.S. war with only passive Vietnamese cooperation." The air war, and a pause before Phase II? Whether sent,
        not known.'
      n: '[FRUS 1964–68, III, doc. 183](https://history.state.gov/historicaldocuments/frus1964-68v03/d183). [[w.gibbons-u-s-government-and]],
