- add:
    entry:
      id: cal.1965-09-16.latin-america
      when: Sept. 16
      date: '1965-09-16'
      thread: latin-america
      also:
      - vietnam-congress
      c: 'Cater to Johnson, the day after Fulbright''s speech: his votes since 1961. A second memorandum: the speech''s "inexcusable
        sneer," that the United States is "much closer to being the most unrevolutionary nation on earth"; for Johnson''s
        remarks at the Smithson Bicentennial, a line on "a revolution not always supported by some who lament our lack of
