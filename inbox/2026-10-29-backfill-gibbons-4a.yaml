      when: Sept. 2
      date: '1966-09-02'
      thread: economy-investment-credit
      c: 'At Johnson''s request, his advisers sign a joint memorandum: suspend the investment credit, cut current spending,
        and cover any new money for the war by future taxes. Johnson agrees.'
