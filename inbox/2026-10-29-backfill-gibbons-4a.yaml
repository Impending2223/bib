      when: Feb. 3
      date: '1966-02-03'
      thread: vietnam-force-levels
      c: 'JCSM-76-66, the Joint Chiefs to McNamara, "Consequences of an Enclave Strategy," answering his request of Jan. 17
        and Gavin in *Harper''s*: by forfeiting the initiative and conceding land, the enclave strategy "in effect, abandons
        national objectives," leading to defeat or to abandoning Southeast Asia.'
      n: '[FRUS 1964–68, IV, doc. 61](https://history.state.gov/historicaldocuments/frus1964-68v04/d61). [[w.gibbons-u-s-government-and]],
        IV, 241. Made public: FRUS 1964–68, IV (1998). Names: McNamara, Gavin.'
