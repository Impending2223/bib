      id: cal.1966-05-10.vietnam-air-war
      when: May 10
      date: '1966-05-10'
      thread: vietnam-air-war
      c: 'Rostow to Johnson, "The Politics and Diplomacy of Bombing POL": Rusk believes the strikes "will greatly heighten
        international tensions," "debatable"; "Some of us believe systematic oil attacks could have a major effect." The polls:
        some 30 percent for a tougher policy, as many for a harder try for peace; "We need something new on the dove side
        to balance our account."'
      n: '[FRUS 1964–68, IV, doc. 133](https://history.state.gov/historicaldocuments/frus1964-68v04/d133). [[w.gibbons-u-s-government-and]],
        IV, 367 (Rusk; Rostow). Made public: FRUS 1964–68, IV (1998). Names: Rostow, Johnson, Rusk.'
