- add:
    entry:
      id: cal.1966-11-04.vietnam-force-levels
      when: Nov. 4
      date: '1966-11-04'
      thread: vietnam-force-levels
      c: 'The Joint Chiefs to McNamara, JCSM-702-66, Program Four: 504,000 Americans by the end of 1967, 522,000 by June 1968,
        564,000 by the end of 1968, the barrier''s forces apart; the expanded concept "should be carried out in its entirety,"
        mining the ports, a naval quarantine, raids into Cambodia and Laos.'
      n: '[[w.gibbons-u-s-government-and]], IV, 463–64. To check: JCSM-702-66, Nov. 4, 1966, summarized in Pentagon Papers,
        Gravel ed., IV, 361–62 (cited by [[w.gibbons-u-s-government-and]], IV, 463 n.77). See [[cal.1966-10-20.vietnam-force-levels]].
        Names: McNamara.'
