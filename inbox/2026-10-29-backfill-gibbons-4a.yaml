- add:
    entry:
      id: cal.1966-01-27.vietnam-congress-4
      when: Jan. 27
      date: '1966-01-27'
      thread: vietnam-congress
      c: 'Zablocki''s Subcommittee on the Far East and the Pacific of House Foreign Affairs, hearings on policy toward Asia,
        academic witnesses. Thomas Schelling of Harvard: the policy "an extraordinary demonstration of firmness combined with
        restraint"; the bombing may have shown China a kind of war its manpower would not decide; a defeat might breed isolationism.'
      n: '[[w.gibbons-u-s-government-and]], IV, 226–27 n.42. To check: House Comm. on Foreign Affairs, Subcomm. on the Far
        East and the Pacific, *United States Policy Toward Asia: Hearings* (1966), 89th Cong., 2d Sess. (cited by [[w.gibbons-u-s-government-and]],
        IV, 226 n.42). Names: Zablocki.'
