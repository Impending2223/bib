      id: cal.1965-12-18.vietnam-pause
      when: Dec. 18
      date: '1965-12-18'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Fortas and Clifford, 12:35 to 2:19 and 3:10
        to 5:10 p.m. Johnson, after Wheeler: the military "say a month''s pause would undo all we''ve done"; McNamara: "That''s
        baloney." Rusk: one chance in twenty of a settlement, and he would take it. McNamara: a military solution "one out
        of three or one in two"; "We have been too optimistic." Fortas and Clifford against. By Valenti''s account, Johnson:
        "We''ll take the pause."'
      n: '[FRUS 1964–68, III, doc. 235](https://history.state.gov/historicaldocuments/frus1964-68v03/d235) (Valenti''s notes).
        [[w.johnson-vantage-point]], 235–37. [[w.gibbons-u-s-government-and]], IV, 121–23. Made public: FRUS 1964–68, III
        (1996). See [[cal.1965-12-17.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, U. Alexis Johnson, Fortas,
        Clifford, Wheeler, Valenti.'
