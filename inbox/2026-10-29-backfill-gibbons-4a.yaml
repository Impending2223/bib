- add:
    entry:
      id: cal.1966-04-27.vietnam-struggle
      when: Apr. 27
      date: '1966-04-27'
      thread: vietnam-struggle
      c: 'State to Lodge, 3230, asking comment on Miller''s paper "Political Tactics in Vietnam Over Next Few Months": the
        government to stay, or be reappointed by the assembly, until a government forms under the constitution; anti-Communist
        parties or fronts to be encouraged before the elections, lest the Viet Cong gain "a foothold through apparently respectable
        groups."'
      n: '[[w.gibbons-u-s-government-and]], IV, 300. To check: Washington to Saigon 3230, Apr. 27, 1966, with Miller''s paper,
        "Political Tactics in Vietnam Over Next Few Months", Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]],
        IV, 300 n.88). Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      src:
        c: 108fcc55
        rows:
        - 'w.gibbons-u-s-government-and IV, 300: all'
        - 'via w.gibbons-u-s-government-and IV, 300 n.88: all'
- add:
    entry:
      id: cal.1966-04-27.vietnam-struggle-2
      when: Apr. 27
      date: '1966-04-27'
      thread: vietnam-struggle
      c: 'State to Saigon, 3229, drafted by Miller, on Lodge''s report of the Directorate: the military seem bent on controlling
        the election, "tame" candidates only; the Directorate must share the decisions with the electoral council; the United
        States "cannot let domestic and international support for its massive commitment ... be undermined indefinitely."'
      n: '[[w.gibbons-u-s-government-and]], IV, 300–01. To check: Washington to Saigon 3229, Apr. 27, 1966 (so cited, 1967),
        NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 301 n.90). Check: Gibbons dates
        the cable 1967. See [[cal.1966-04-27.vietnam-struggle]]. Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      src:
        c: 8c031107
        rows:
        - 'w.gibbons-u-s-government-and IV, 300–01: all'
        - 'via w.gibbons-u-s-government-and IV, 301 n.90: all'
