- add:
    entry:
      id: cal.1966-02-15.vietnam
      when: Feb. 15
      date: '1966-02-15'
      thread: vietnam
      c: 'McGeorge Bundy, flying home from Asia, outlines a memorandum to Johnson, Rusk and McNamara: "The change from 1965.
        Fantastic." The task "long and slow," but "enormously worth doing—and believed worth doing." He outlines too an answer
        to the "Lippmann thesis."'
      n: '[[w.gibbons-u-s-government-and]], IV, 235. To check: McGeorge Bundy, outline of a memorandum to Johnson, Rusk and
        McNamara, Feb. 15, 1966, Papers of McGeorge Bundy, Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 235 n.67). See [[cal.1966-02-11.vietnam]]. Names: McGeorge Bundy, Johnson, Rusk, McNamara, Lippmann.'
      tags:
