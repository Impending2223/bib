      id: cal.1966-01-08.vietnam-3
      when: Jan. 8–11
      date: '1966-01-08'
      thread: vietnam
      c: 'Airlie House, Warrenton, Va.: the Washington agencies with Porter, Lansdale and others from Saigon on pacification,
        Unger and Porter in the chair. The war grave, several years'' more fighting; the Kỳ government "fragile," failing
        its "revolutionary" billing. The four national priority areas; one management of the Mission''s pacification effort;
        pressure on the government where needed, "our already questionable chances of success" otherwise reduced.'
      n: '[FRUS 1964–68, IV, doc. 21](https://history.state.gov/historicaldocuments/frus1964-68v04/d21) (Porter and Unger''s
        report, Jan. 13). [[w.gibbons-u-s-government-and]], IV, 186–87. To check: Minutes of the Warrenton Meeting, Jan. 8–11,
        1966, Department of State, Lot File 69 D 67 (cited by [[w.gibbons-u-s-government-and]], IV, 186 n.42). Made public:
        FRUS 1964–68, IV (1998). Names: Porter, Lansdale, Unger, Nguyễn Cao Kỳ.'
      tags:
      - name:porter-william-j
