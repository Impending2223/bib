- add:
    entry:
      id: cal.1965-08-11.vietnam
      when: Aug. 11
      date: '1965-08-11'
      thread: vietnam
      c: 'Lodge to Johnson: a half hour with Eisenhower, at Johnson''s request. Eisenhower against "dribbling" forces in,
        for adequate forces at once; no announcement of the total. The South Vietnamese must have "heart," or after a success
        "they will slump right back."'
      n: '[FRUS 1964–68, III, doc. 118](https://history.state.gov/historicaldocuments/frus1964-68v03/d118). [[w.gibbons-u-s-government-and]],
        IV, 35–36 n.109 (the "heart"). Made public: FRUS 1964–68, III (1996). See [[cal.1965-08-03.vietnam]]. Names: Lodge,
        Eisenhower, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:eisenhower-dwight-d
      - name:johnson-lyndon-b
