- add:
    entry:
      id: cal.1965-12-04.vietnam-pause
      when: Dec. 4
      date: '1965-12-04'
      thread: vietnam-pause
      c: 'McGeorge Bundy to Johnson: a "favorable consensus" this morning for a pause, Rusk, McNamara, Vance, Ball, McNaughton,
        the Bundys and Thompson; "the best single way of keeping it clear that Johnson is for peace, while Ho is for war."
        By William Bundy''s notes, should Hanoi agree to negotiate, the pause "virtually compelled" to go on.'
      n: '[FRUS 1964–68, III, doc. 215](https://history.state.gov/historicaldocuments/frus1964-68v03/d215). [[w.gibbons-u-s-government-and]],
        IV, 117–18 (the meeting, by William Bundy''s notes, 117). To check: William Bundy, notes of the meeting of Dec. 4,
        1965, in William Bundy''s possession (William Bundy MS, ch. 33, pp. 20–21) (cited by [[w.gibbons-u-s-government-and]],
        IV, 117 n.16). Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-03.vietnam-pause]]. Names: McGeorge Bundy,
        Johnson, Rusk, McNamara, Vance, Ball, McNaughton, William Bundy, Thompson, Hồ Chí Minh.'
      tags:
