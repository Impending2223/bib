- add:
    entry:
      id: cal.1966-07-11.china
      when: July 11
      date: '1966-07-11'
      thread: china
      also:
      - vietnam-congress
      c: 'Rostow to Fulbright, after their talk at Moyers''s dinner some days before, Johnson calling the draft "excellent":
        no "natural historical force" makes China dominate Asia; an equilibrium of Japan, India and China, the United States
        and the Soviet Union to "remain Asia powers"; for the "foreseeable future," Chinese armies and bombs require that
        we "remain committed to non-Communist Asia."'
      n: '[[w.gibbons-u-s-government-and]], IV, 415–16. To check: Rostow to Johnson, July 11, 1966, with the draft of his
        letter to Fulbright of that date, Office of the President File, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 416 n.113). Names: Rostow, Fulbright, Moyers, Johnson.'
      tags:
