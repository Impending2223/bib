- edit:
    id: cal.1966-02-26.vietnam
    base: 004ebc69
    set:
      c: 'Saturday, the first meeting of the President''s Vietnam Group, 12:45 to 2:16 p.m., on the "other war" after Honolulu:
        a Washington "czar" for the nonmilitary programs to be picked within days (Komer). Asked about a resolution, Johnson:
        "nothing more need be done now"; Morse''s motion to repeal to come to a vote, Russell''s to reaffirm not. Moyers reads
        Harris''s figures, approval of the handling of the war down from 63 percent to 49: "First signs of American impatience
        with long war." Johnson: the extremes ten percent doves and sixteen percent hawks, the cost of living "a major element."'
      n: '[FRUS 1964–68, IV, doc. 85](https://history.state.gov/historicaldocuments/frus1964-68v04/d85) (Bromley Smith''s
        notes); [doc. 86](https://history.state.gov/historicaldocuments/frus1964-68v04/d86) (Valenti''s notes; Moyers). [[w.gibbons-u-s-government-and]],
        IV, 175, 232–33, 255. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-02-06.vietnam]]. Names: Johnson, Komer,
        Morse, Russell, Moyers, Harris.'
