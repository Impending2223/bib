- add:
    entry:
      id: cal.1965-11-10.vietnam-2
      when: Nov. 10
      date: '1965-11-10'
      thread: vietnam
      also:
      - vietnam-force-levels
      - vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-811-65, "Future Operations and Force Deployments with Respect to the War in Vietnam":
        Phase I "designed to stop losing the war," Phase II "the phase needed to start winning it." 113,000 more men for Vietnam,
        26,000 more elsewhere in the Western Pacific. "An immediate sharp blow" at the North''s oil and electric power, then
        heavier bombing, Hanoi and Haiphong included, and the harbors mined. American forces to find, fix and destroy; most
        of the South Vietnamese to pacification.'
      n: '[[w.gibbons-u-s-government-and]], IV, 103–104. To check: JCSM-811-65, "Future Operations and Force Deployments with
        Respect to the War in Vietnam," Nov. 10, 1965, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 103 n.79); JCSM-811-65, Nov. 10, 1965, C-16, NSF Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 104 n.80); JCSM-810-65, "Air Operations Against the North Vietnam POL System," Nov. 10, 1965, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 104 n.81). See [[cal.1965-08-27.vietnam]]. Names:
        McNamara.'
      tags:
      - name:mcnamara-robert-s
      src:
        c: fe81272f
        rows:
