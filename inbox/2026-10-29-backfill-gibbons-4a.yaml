      id: cal.1966-12-30.vietnam
      when: Dec. 30
      date: '1966-12-30'
      thread: vietnam
      c: 'Leonhart, Komer''s deputy, to Johnson, back from Vietnam: "The lack of progress in pacification remains the crux";
        military and civilians divided on the nature of the war; the Saigon government "an increasingly uncertain instrument,"
        to be moved by "graduated pressures."'
      n: '[FRUS 1964–68, IV, doc. 353](https://history.state.gov/historicaldocuments/frus1964-68v04/d353). [[w.gibbons-u-s-government-and]],
        IV, 487 n.19. Made public: FRUS 1964–68, IV (1998). Names: Leonhart, Komer, Johnson.'
      tags:
      - name:leonhart-william
      - name:komer-robert-w
      - name:johnson-lyndon-b
      src:
