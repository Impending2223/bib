- add:
    entry:
      id: cal.1966-12-11.vietnam
      when: Dec. 11
      date: '1966-12-11'
      thread: vietnam
      c: 'The Embassy''s "basic themes" for Saigon''s national reconciliation proclamation, 13123: the Viet Cong "welcomed
        as brothers"; "Ralliers will enjoy full civil rights, including the right to engage in politics," on the sole condition
        that they renounce arms.'
