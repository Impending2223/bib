      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam-support
      c: 'The Lawyers Committee on American Policy Towards Vietnam to Johnson, with a memorandum of law: the war contravenes
        the UN Charter, violates the Geneva accords, is not sanctioned by the SEATO treaty, and violates the Constitution,
        waged without a declaration of war. For a halt in the bombing, a cease-fire, negotiations with the NLF.'
      n: '[[w.gibbons-u-s-government-and]], IV, 246 n.96. To check: the letter and memorandum, [112 Cong. Rec. 4166–73](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt3/pdf/GPO-CRECB-1966-pt3-11-1.pdf#page=81)
        (Senate, Feb. 25, 1966) (cited by [[w.gibbons-u-s-government-and]], IV, 246 n.96). See [[cal.1965-11-23.vietnam-support]].
        Names: Johnson.'
      tags:
