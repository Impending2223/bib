      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam
      c: 'Valenti to Johnson, as the pause ends, on further "peace moves": among them, meet the South Vietnamese leaders and
        Westmoreland in Honolulu, appear with Kỳ, and stress "the political economic and social future of South Vietnam once
        the fighting has stopped."'
