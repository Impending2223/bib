      when: Dec. 2
      date: '1965-12-02'
      thread: vietnam-pause
      also:
      - vietnam-force-levels
      c: 'McNamara to McGeorge Bundy: more than military increases; "some form of political action:—a pause, or a ceasefire,
        or action by the United Nations." Bundy to Johnson in Texas, 8:34 p.m.: Westmoreland''s deployments accepted for planning;
        the December decisions to prove "we have done everything that we could to move toward peace."'
      n: '[FRUS 1964–68, III, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v03/d213) (Bundy''s telegram).
        [[w.gibbons-u-s-government-and]], IV, 116 (McNamara''s words, by Bundy''s notes). To check: McGeorge Bundy, notes,
        Dec. 2, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.11).
        Made public: FRUS 1964–68, III (1996). Names: McNamara, McGeorge Bundy, Johnson, Westmoreland.'
      tags:
