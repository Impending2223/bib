      when: Jan. 19
      date: '1966-01-19'
      thread: vietnam-congress
      c: 'Morse in the Senate, at length: the war to be taken to the United Nations. The troops the Philippines may send under
        American pressure, armed, equipped and paid by the United States, "not allied forces"; the Asian countries that send
        them for more aid "dependencies of the American Treasury."'
      n: '[112 Cong. Rec. 662–70](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-7-2.pdf#page=76)
        (Senate, Jan. 19, 1966). [[w.gibbons-u-s-government-and]], IV, 139. Names: Morse.'
