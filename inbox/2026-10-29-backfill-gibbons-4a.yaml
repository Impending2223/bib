    entry:
      id: cal.1966-09-16.vietnam-support
      when: Sept. 16
      date: '1966-09-16'
      thread: vietnam-support
      c: 'Ball to Johnson, "Bertrand Russell''s ''War Crimes Trials'''': the ambassadors in Ethiopia, India, Pakistan, Senegal,
        Tanzania and Zambia to tell those heads of state, sponsors of the Russell Foundation, how their names are "misused";
        Ball to see the British Home Secretary, and Fortas to ask Casals to withdraw.'
      n: '[[w.gibbons-u-s-government-and]], IV, 434. To check: Ball to Johnson, "Bertrand Russell''s ''War Crimes Trials,''"
        Sept. 16, 1966, Department of State, Lot File 74 D 164 (cited by [[w.gibbons-u-s-government-and]], IV, 434 n.176).
        See [[cal.1966-08-29.vietnam-support]]. Names: Ball, Johnson, Fortas.'
