      date: '1966-05-15'
      thread: vietnam-struggle
      c: 'Rusk to Porter, 3455, after the meeting: see Kỳ and Thiệu, have them reaffirm the Constitutional Assembly and say
        how they will achieve solidarity; the "central issue is whether South Vietnamese are going to have their own country
        to quarrel about."'
      n: '[[w.gibbons-u-s-government-and]], IV, 318. To check: Washington to Saigon 3455, May 15, 1966, Department of State,
