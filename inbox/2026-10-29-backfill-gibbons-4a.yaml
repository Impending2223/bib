      when: Dec. 15
      date: '1965-12-15'
      thread: vietnam
      c: 'Lodge to Lansdale, "Roles of Different U.S. Agencies in the Three Phases of Rural Construction": Lansdale the Mission''s
        "principal coordinator" and principal contact with the government in pacification and development. Pacification chiefly
        civilian: USOM and the CIA the operating agencies, MACV not one.'
      n: '[[w.gibbons-u-s-government-and]], IV, 184. To check: Lodge to Lansdale, "Roles of Different U.S. Agencies in the
        Three Phases of Rural Construction, that is, Military Clearing, Pacification and Development," Dec. 15, 1965, Lodge
        Papers, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 184 n.36). See [[cal.1965-12-02.vietnam]].
        Names: Lodge, Lansdale.'
