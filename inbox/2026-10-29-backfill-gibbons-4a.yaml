- add:
    entry:
      id: cal.1966-01-20.vietnam-pause-2
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-pause
      c: 'Meeker to Rusk, "Length of the Pause": more time needed; the pause not to end while contacts are in train, with
        Hanoi''s chargé in Moscow and through Souvanna Phouma at Vientiane, and Moscow not yet asked about Shelepin''s visit
        to Hanoi.'
      n: '[FRUS 1964–68, IV, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v04/d31). [[w.gibbons-u-s-government-and]],
