- add:
    entry:
      id: cal.1966-06-01.vietnam-struggle-2
      when: June 1
      date: '1966-06-01'
      thread: vietnam-struggle
      c: Saigon. A bomb in Thiện Minh's car injures him seriously. Trí Quang, in a message to Johnson, blames the United States
        for its support of Kỳ and Thiệu.
      n: '[[w.gibbons-u-s-government-and]], IV, 330. To check: Saigon to Washington 5224, June 2, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 330 n.53). Check: the day of Trí Quang''s
        message (Saigon 5224, June 2). Names: Thích Trí Quang, Johnson, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu.'
      tags:
