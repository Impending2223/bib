      when: Aug. 8
      date: '1966-08-08'
      thread: vietnam
      c: 'Saigon. The Army''s briefing on PROVN to the Mission Council, Tillson presenting: the military support of pacification,
        the South Vietnamese army''s want of it; not the report''s case against American operations. Lodge sums up the MACV
        concept: the war "a political struggle with violent military and terroristic overtones"; the South Vietnamese army''s
        chief mission pacification. Westmoreland: "a succinct summary."'
