      thread: vietnam
      also:
      - vietnam-pause
      - vietnam-force-levels
      c: 'McNamara''s draft memorandum for Johnson, from McNaughton''s office, "Courses of Action in Vietnam": the bombing
        and Phase I "make sense only if" in support of a long-run policy to contain China. Course C recommended: a "hard-line"
        pause, then evolving Rolling Thunder with Phase II. The odds "even" that early 1967 brings "stagnation at a higher
        level."'
      n: '[FRUS 1964–68, III, doc. 189](https://history.state.gov/historicaldocuments/frus1964-68v03/d189). [[w.gibbons-u-s-government-and]],
        IV, 84–85. Made public: FRUS 1964–68, III (1996). See [[cal.1965-10-23.vietnam-2]]. Names: McNamara, McNaughton, Johnson.'
