        rows:
        - 'w.gibbons-u-s-government-and IV, 272–73: all'
        - 'via w.gibbons-u-s-government-and IV, 273 n.22: all'
- add:
    entry:
      id: cal.1966-03-18.vietnam-struggle
      when: Mar. 18
      date: '1966-03-18'
      thread: vietnam-struggle
      c: 'State to Lodge, 2764, drafted by Unger: a confrontation between the government and the Buddhists would likely "end
        disastrously for present government." Either stand firm and offer talk of elections and civilian rule, splitting the
        responsible Buddhists from Trí Quang, or a constitutional convention in August or September. Thiệu and Kỳ to be told
        their judgment on removing Thi "was not correct."'
      n: '[[w.gibbons-u-s-government-and]], IV, 273–74. To check: Washington to Saigon 2764, Mar. 18, 1966, Department of
        State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 273 n.23). See [[cal.1966-03-17.vietnam-struggle-2]].
        Names: Lodge, Unger, Thích Trí Quang, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ, Nguyễn Chánh Thi.'
      tags:
      - name:lodge-henry-cabot
