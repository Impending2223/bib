- add:
    entry:
      id: cal.1966-01-27.vietnam-congress-3
      when: Jan. 27
      date: '1966-01-27'
      thread: vietnam-congress
      c: 'Tillman of the Foreign Relations staff to Fulbright, a policy memorandum: intervention hard where the nationalist
        movement is also the Communist one. The United States to commit itself to withdraw after several years and accept
        internationally supervised elections; the Soviet Union, as co-chairman, to be asked to reconvene the Geneva conference,
        its decisions accepted.'
      n: '[[w.gibbons-u-s-government-and]], IV, 223 n.32. See [[cal.1965-12-23.vietnam-congress]]. Names: Fulbright.'
      tags:
