      id: cal.1966-04-02.vietnam-struggle-3
      when: Apr. 2
      date: '1966-04-02'
      thread: vietnam-struggle
      c: 'State to Lodge, 2948, drafted by William Bundy, cleared by Rusk: Dương Văn Minh or Trần Văn Đôn might replace the
        I Corps commander.'
      n: '[[w.gibbons-u-s-government-and]], IV, 279. To check: Washington to Saigon 2948, Apr. 2, 1966, NSF Country File,
