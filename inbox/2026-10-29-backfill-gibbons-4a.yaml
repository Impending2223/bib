- add:
    entry:
      id: cal.1966-12-29.vietnam
      when: Dec. 29
      date: '1966-12-29'
      thread: vietnam
      c: 'William Bundy to Porter, after lunch with Lansdale in Washington: Lansdale fears Thiệu and Kỳ mean to take the presidency
        and the premiership between them, an "American-influenced continuation of the status quo," and a coup to follow; he
        wants "a hunting license" for a national political grouping. Bundy: his gift with the Vietnamese real, his reporting
        the question; "his job in Saigon will wind up in the near future unless he gets some fairly clear outlet."'
      n: '[[w.gibbons-u-s-government-and]], IV, 477–78. To check: William Bundy to Porter, Dec. 29, 1966, Department of State,
        Lot File 85 D 240 (William Bundy Papers) (cited by [[w.gibbons-u-s-government-and]], IV, 477 n.120). See [[cal.1966-12-07.vietnam]].
        Names: William Bundy, Porter, Lansdale, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
      - name:bundy-william
      - name:porter-william-j
      - name:lansdale-edward-g
