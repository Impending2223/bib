- add:
    entry:
      id: cal.1966-03-01.vietnam-congress-2
      when: Mar. 1
      date: '1966-03-01'
      thread: vietnam-congress
      c: 'The Senate''s debate on Morse''s amendment. Russell: "By instinct and inclination ... I am an isolationist," and
        "a congressional man," but the resolution was "a very great grant of power"; "I am going to throw the rope"; a vote
        against repeal reaffirms it. Javits: the resolution "not juridically necessary," the President''s power constitutional;
        if he abuses it, "deny him the money." Fulbright: the motion forces a reaffirmation "of policies which I do not wish
        to reaffirm." Mansfield moves to table: "We are in too deep now."'
      n: '[112 Cong. Rec. 4370–84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=48)
        (Senate, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 257–58. Check: each speaker''s page (Russell about 4370,
        Javits 4375, Mansfield 4377, Fulbright 4384). See [[cal.1966-03-01.vietnam]]. Names: Russell, Javits, Fulbright, Mansfield,
        Morse.'
      tags:
      - name:russell-richard-b
      - name:javits-jacob-k
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:morse-wayne
      src:
        c: 4f04e664
        rows:
