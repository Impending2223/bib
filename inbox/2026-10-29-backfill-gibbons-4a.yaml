- add:
    entry:
      id: cal.1965-08-03.vietnam
      when: Aug. 3
      date: '1965-08-03'
      thread: vietnam
      c: 'Gettysburg. Goodpaster briefs Eisenhower, an hour and a half, on the deployments, the plan for the troops'' use
        and the bombing. Eisenhower: no "driblets"; "swamp the enemy with overwhelming force." No figures announced: the buildup
        "sufficient to win."'
      n: '[FRUS 1964–68, III, doc. 104](https://history.state.gov/historicaldocuments/frus1964-68v03/d104) (Goodpaster''s
        memorandum for the record). [[w.gibbons-u-s-government-and]], IV, 35 n.109 (the briefing; overwhelming force, no "dribbling").
        Made public: FRUS 1964–68, III (1996). Names: Goodpaster, Eisenhower.'
      tags:
      - name:goodpaster-andrew-j
      - name:eisenhower-dwight-d
      src:
        c: 1df851f4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d104: all'
        - 'w.gibbons-u-s-government-and IV, 35: B-D'
        - 'via w.gibbons-u-s-government-and IV, 35 n.109b: B-D'
