      when: Dec. 27
      date: '1965-12-27'
      thread: vietnam-pause
      c: 'McNamara flies from Colorado to the Ranch: dinner with Johnson, then talk from 8:05 to 10:55 p.m., no record kept,
        by Shapley''s account. McGeorge Bundy''s memorandum the same day: Rusk "very resistant indeed" to using the pause,
        he, Thompson, U. Alexis Johnson and William Bundy for resuming now and a longer pause later.'
      n: '[[w.gibbons-u-s-government-and]], IV, 126–27. To check: [[w.shapley-promise-and-power]]; McGeorge Bundy to Johnson,
        Dec. 27, 1965, NSF Memos to the President—McGeorge Bundy, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 126 n.42). See [[cal.1965-12-27.vietnam]]. Names: McNamara, Johnson, McGeorge Bundy, Rusk, Thompson, U. Alexis
        Johnson, William Bundy.'
      tags:
