      id: cal.1965-11-24.vietnam-pause
      when: Nov. 24
      date: '1965-11-24'
      thread: vietnam-pause
      also:
      - soviet-union
      c: 'McGeorge Bundy and Dobrynin, 1 to 3 p.m.: a longer pause would help; with one of "12 to 20 days," intense Soviet
        diplomatic effort, but no assurance of results. By William Bundy''s account, "one of the critical factors" in the
        turn toward a pause.'
      n: '[FRUS 1964–68, XIV, doc. 141](https://history.state.gov/historicaldocuments/frus1964-68v14/d141). [[w.gibbons-u-s-government-and]],
        IV, 115. Made public: FRUS 1964–68, XIV (2001). Check: Gibbons has Dobrynin offer Soviet persuasion of Hanoi for a
        pause of two or three weeks. Names: McGeorge Bundy, Dobrynin, William Bundy.'
      tags:
      - name:bundy-mcgeorge
      - name:dobrynin-anatoly
      - name:bundy-william
