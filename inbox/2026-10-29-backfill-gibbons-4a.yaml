      when: Sept. 12
      date: '1966-09-12'
      thread: vietnam-congress
      c: 'Norvill Jones of the Foreign Relations staff to Marcy: hearings next year on the Senate''s and the committee''s
        part in foreign policy; "Vietnam, Thailand, the ''Johnson'' doctrine—all illustrate either distortion of Congressional
        intent or the Executive Branch''s taking a ''Senate be damned'' attitude."'
