- add:
    entry:
      id: cal.1966-10-03.vietnam-5
      when: Oct. 3
      date: '1966-10-03'
      thread: vietnam
      c: 'Lansdale to Lodge, "Future Plans": by "pouring in more and more thousands of Americans," the United States breaks
        the "prime rules for waging successful ''people''s war''," a paternalism fit for a protectorate; his office will stay
        on with a "clear-cut" assignment, to counsel Vietnamese leaders, commanders, religious and political groups, until
        the constitution''s government is in.'
      n: '[[w.gibbons-u-s-government-and]], IV, 473–75. To check: Lansdale to Lodge, "Future Plans," Oct. 3, 1966, Lodge Papers,
        Vietnam, Massachusetts Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 473 n.116). Names: Lansdale,
        Lodge.'
      tags:
