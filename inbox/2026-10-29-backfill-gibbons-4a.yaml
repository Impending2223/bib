      when: July 25
      date: '1966-07-25'
      thread: india-and-china-cultural-revolution
      also:
      - vietnam
      c: 'Rostow to Johnson on the Office of National Estimates'' memorandum on China after eight months of turmoil: Mao in
        control; the leadership''s stability shaken; the radical turn not to spread to foreign policy; "The internal crisis
        serves to reduce the chance of Chinese intervention in Vietnam."'
      n: '[FRUS 1964–68, XXX, doc. 171](https://history.state.gov/historicaldocuments/frus1964-68v30/d171). [[w.gibbons-u-s-government-and]],
        IV, 379 (the date; Vietnam). Made public: FRUS 1964–68, XXX (1998). Names: Rostow, Johnson, Mao Zedong.'
