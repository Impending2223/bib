- add:
    entry:
      id: cal.1966-05-13.vietnam-struggle
      when: May 13
      date: '1966-05-13'
      thread: vietnam-struggle
      c: 'Porter, for Lodge, 4554: after Kỳ''s reversal, the dangers of a clash between militant Buddhists and the Directorate,
        the Catholics and the Northerners, and of anti-American feeling "already real and present." No violent reoccupation
        of Đà Nẵng and Huế, but "a firm persistent and quiet effort ... to whittle away at the Buddhist machine."'
      n: '[[w.gibbons-u-s-government-and]], IV, 301–02. To check: Saigon to Washington 4554, May 13, 1966, Files of Robert
        W. Komer, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 302 n.93). See [[cal.1966-05-06.vietnam-struggle]].
        Names: Porter, Lodge, Nguyễn Cao Kỳ.'
      tags:
      - name:porter-william-j
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      src:
        c: 07979bf6
        rows:
        - 'w.gibbons-u-s-government-and IV, 301–02: all'
        - 'via w.gibbons-u-s-government-and IV, 302 n.93: all'
- add:
    entry:
      id: cal.1966-04-17.vietnam-congress
      when: Apr. 17
      date: '1966-04-17'
      thread: vietnam-congress
      c: 'Stennis, on ABC''s *Issues and Answers*: for the war and a stronger military effort, but if a freely elected government
        of South Vietnam asked the United States to leave, it would have to.'
      n: '[[w.gibbons-u-s-government-and]], IV, 303. Check: the program''s day (the *New York Times* reported it Apr. 18).
        Names: Stennis.'
      tags:
      - name:stennis-john-c
      src:
        c: aae6c4f5
        rows:
        - 'w.gibbons-u-s-government-and IV, 303: all'
        - 'via w.gibbons-u-s-government-and IV, 303 n.99: all'
- add:
    entry:
      id: cal.1966-04-13.vietnam-congress
      when: Apr. 13
      date: '1966-04-13'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Cooper in the Senate, twice in Vietnam in four months: "we cannot defend people who are not willing to defend themselves.
        And a government which cannot gain the support and confidence of the people cannot act for the people."'
      n: '[112 Cong. Rec. 8114](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt6/pdf/GPO-CRECB-1966-pt6-9-1.pdf#page=53)
        (Senate, Apr. 13, 1966). [[w.gibbons-u-s-government-and]], IV, 303–04. Check: the words on the page. Names: John Sherman
        Cooper.'
      tags:
      - name:cooper-john-sherman
      src:
        c: e725fd5d
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt6/pdf/GPO-CRECB-1966-pt6-9-1.pdf#page=53: all'
        - 'w.gibbons-u-s-government-and IV, 303–04: all'
        - 'via w.gibbons-u-s-government-and IV, 304 n.100: all'
- add:
    entry:
      id: cal.1966-04-14.vietnam-congress
      when: Apr. 14
      date: '1966-04-14'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Javits in the Senate: an election in South Vietnam as soon as possible; if a government came to power against the
        war, redeploy the troops to other Asian countries, ready against China. Voluntary withdrawal would be disastrous,
        "but it is no disgrace if conditions make" it necessary.'
      n: '[112 Cong. Rec. 8153](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt6/pdf/GPO-CRECB-1966-pt6-10-1.pdf#page=7)
        (Senate, Apr. 14, 1966). [[w.gibbons-u-s-government-and]], IV, 304. Names: Javits.'
      tags:
      - name:javits-jacob-k
      src:
        c: 090c1970
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt6/pdf/GPO-CRECB-1966-pt6-10-1.pdf#page=7: all'
        - 'w.gibbons-u-s-government-and IV, 304: all'
        - 'via w.gibbons-u-s-government-and IV, 304 n.101: all'
- add:
    entry:
      id: cal.1966-05-05.vietnam-congress
      when: May 5
      date: '1966-05-05'
      thread: vietnam-congress
      c: 'Ribicoff in the Senate: an election run by the Kỳ government would be boycotted by the Buddhists and others, and
        the United States might end as its guarantor; a resolution in a special session of the UN General Assembly asking
        UN observers for the elections.'
      n: '[112 Cong. Rec. 9922–25](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt8/pdf/GPO-CRECB-1966-pt8-3-1.pdf#page=51)
        (Senate, May 5, 1966). [[w.gibbons-u-s-government-and]], IV, 304. Names: Ribicoff, Nguyễn Cao Kỳ.'
