        - 'via w.gibbons-u-s-government-and IV, 323 n.29: all'
- add:
    entry:
      id: cal.1966-05-22.vietnam-struggle
      when: May 22
      date: '1966-05-22'
      thread: vietnam-struggle
      c: 'Westmoreland to Wheeler, MAC 4070 and 4081: serious, but "blown out of proportion" by reporters "attempting to make
        a name for themselves"; the government making "positive headway," a Kỳ-Thi meeting planned. He rejects Wheeler''s
        plan; he and Lodge will tell both sides of the "irreparable harm."'
      n: '[[w.gibbons-u-s-government-and]], IV, 321, 323 n.29. Reply to: [[cal.1966-05-21.vietnam-struggle-4]]. To check:
        Westmoreland, MAC 4070 and 4081, May 22, 1966, Westmoreland Papers, Message Files, Center of Military History (cited
        by [[w.gibbons-u-s-government-and]], IV, 321 n.23). Names: Westmoreland, Wheeler, Lodge.'
