      date: '1966-04-27'
      thread: vietnam
      c: 'Taylor to Johnson, "Assessment and Use of Negotiation Blue Chips": talks are not peace, as at Panmunjom; keep the
        pressure on until a settlement; give up the bombing, the chief chip, only for an equal gain, a cessation of Viet Cong
        incidents and operations, which can be verified, as infiltration cannot.'
      n: '[FRUS 1964–68, IV, doc. 127](https://history.state.gov/historicaldocuments/frus1964-68v04/d127). [[w.gibbons-u-s-government-and]],
        IV, 369 n.56 (the trade). Made public: FRUS 1964–68, IV (1998). Names: Taylor, Johnson.'
