      when: Mar. 11
      date: '1966-03-11'
      thread: vietnam-struggle
      c: 'Johnson with his advisers, 12:35 to 1:30 p.m. McNamara: Thi removed, "Under control"; "I believe he will come out."
        Johnson: "Do our people want him to leave?" McNamara: "I do." Taylor: "He''s a bad character and good riddance." Wheeler:
        "a conniver."'
