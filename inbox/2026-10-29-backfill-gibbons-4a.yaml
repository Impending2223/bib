      when: Aug. 7
      date: '1966-08-07'
      thread: vietnam
      c: 'Komer, "Giving a New Thrust to Pacification: Analysis, Concept, and Management": his preference, pacification, military
        and most civil, under the American military, with a civil-military staff under a civilian deputy to Westmoreland.'
      n: '[[w.gibbons-u-s-government-and]], IV, 382 n.94, 468–69. To check: Komer, "Giving a New Thrust to Pacification: Analysis,
        Concept, and Management," Aug. 7, 1966, Office Files of Robert Komer, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 469 n.97). See [[cal.1966-07.vietnam]]. Names: Komer, Westmoreland.'
