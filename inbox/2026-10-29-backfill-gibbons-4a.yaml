- add:
    entry:
      id: cal.1966-03-16.vietnam-struggle-2
      when: Mar. 16
      date: '1966-03-16'
      thread: vietnam-struggle
      c: 'Lodge to the President, Saigon 3352: the Buddhists read the new situation in I Corps as a chance to make the government
        "a creature subject to their will" or replace it. "I have a card to play in my relations with the two Buddhist leaders,
        Tri Quang and Tam Chau, and am studying how best to do it."'
      n: '[[w.gibbons-u-s-government-and]], IV, 270. To check: Saigon to Washington 3352, Mar. 16, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 270 n.14). See [[cal.1966-03-12.vietnam-struggle]].
        Names: Lodge, Thích Trí Quang, Tâm Châu.'
      tags:
      - name:lodge-henry-cabot
      - name:thich-tri-quang
      - name:tam-chau
      src:
        c: 1daf800e
        rows:
        - 'w.gibbons-u-s-government-and IV, 270: all'
        - 'via w.gibbons-u-s-government-and IV, 270 n.14: all'
- add:
    entry:
      id: cal.1966-03-17.vietnam-struggle-2
      when: Mar. 17
      date: '1966-03-17'
      thread: vietnam-struggle
      c: 'State to Lodge, 2745, on Thiệu''s and Kỳ''s two plans, a Democracy Building Council of 100 or a Constituent Assembly
        in August or September: either acceptable, though both "take us more rapidly than we had envisaged down road with
        many pitfalls"; the Assembly better, buying "more time for careful preparation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 272–73. To check: Washington to Saigon 2745, Mar. 17, 1966, Department of
        State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 273 n.22). See [[cal.1966-03-17.vietnam-struggle]].
        Names: Lodge, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
