- add:
    entry:
      id: cal.1966-10-25.opinion
      when: Oct. 25
      date: '1966-10-25'
      thread: opinion
      c: 'Harris, in the *Washington Post*: for escalation 44 percent, de-escalation 56 (September 52 and 48, July 60 and
        40). The best outcome: both sides withdraw under UN supervision 48 percent; total military victory 38; American troops
        out 8; a neutralist government 6.'
      n: '[[w.gibbons-u-s-government-and]], IV, 430. To check: *Washington Post*, Oct. 25, 1966 (the Harris Survey) (cited
        by [[w.gibbons-u-s-government-and]], IV, 430 n.160). See [[cal.1966-07-11.opinion]]. Names: Harris.'
      tags:
      - name:harris-louis
      src:
        c: cc538a7d
        rows:
        - 'w.gibbons-u-s-government-and IV, 430: all'
        - 'via w.gibbons-u-s-government-and IV, 430 n.160: all'
