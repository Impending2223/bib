      when: Mar. 8
      date: '1966-03-08'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'MacArthur to Rusk: Mathias, a Republican for the war, says the White House briefing''s denial of large troop increases,
        with 20,000 more announced days later, "had created considerable disillusionment on Capitol Hill" and raised "the
        question of the credibility of the Administration."'
      n: '[[w.gibbons-u-s-government-and]], IV, 236. To check: MacArthur to Rusk, Mar. 8, 1966, Department of State, Central
        File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 236 n.71). Check: the day Mathias spoke. See [[cal.1966-02-24.vietnam-congress]].
        Names: MacArthur, Rusk, Mathias.'
