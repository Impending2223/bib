      when: Dec. 17
      date: '1965-12-17'
      thread: vietnam-congress
      also:
      - vietnam-pause
      c: 'Meeker sends McGeorge Bundy two draft joint resolutions: Congress to approve the offer of unconditional negotiations
        and the United States "prepared ... to take all necessary military action, as the President determines"; the Reserves
        to be called and tours extended; a pause assumed in effect while Congress considers. An earlier draft, of Dec. 6,
        had authorized action against North Vietnam itself.'
      n: '[[w.gibbons-u-s-government-and]], IV, 119 n.22. See [[cal.1965-12-09.vietnam-congress]]. Names: Meeker, McGeorge
        Bundy.'
