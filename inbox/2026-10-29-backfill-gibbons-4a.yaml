        [[w.gibbons-u-s-government-and]], IV, 271. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-03-10.vietnam]]. Names:
        Johnson, McNamara, Nguyễn Chánh Thi, Taylor, Wheeler.'
