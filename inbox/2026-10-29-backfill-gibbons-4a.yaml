- add:
    entry:
      id: cal.1966-01-24.vietnam-force-levels
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-force-levels
      also:
      - vietnam-air-war
      c: 'McNamara to Johnson, "The Military Outlook in South Vietnam": the enemy matching the buildup. American forces to
        75 battalions, 378,800 men, by the end of 1966, more if CINCPAC''s estimates are accepted; attack sorties on the North
        4,000 a month. Even so, a standoff at a higher level likely by early 1967.'
      n: '[FRUS 1964–68, IV, doc. 36](https://history.state.gov/historicaldocuments/frus1964-68v04/d36). [[w.gibbons-u-s-government-and]],
        IV, 149–50, 177–78. Made public: FRUS 1964–68, IV (1998). See [[cal.1965-12-07.vietnam]]. Check: Gibbons gives 367,800
        men (IV, 177). Names: McNamara, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      src:
        c: 23fb2a94
        rows:
