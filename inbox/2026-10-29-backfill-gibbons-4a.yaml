      date: '1966-08-06'
      thread: soviet-union
      also:
      - vietnam-air-war
      c: 'Hughes of INR to Rostow, on Kosygin''s speech, the Supreme Soviet''s declaration and the protest on Haiphong: "no
        qualitative change in the Soviet policy lines": aid to the North, likely more; pressure on Washington to desist; no
        move toward a settlement until Hanoi "gives the green light"; contacts kept on space, nonproliferation, fisheries.'
      n: '[FRUS 1964–68, XIV, doc. 170](https://history.state.gov/historicaldocuments/frus1964-68v14/d170). [[w.gibbons-u-s-government-and]],
        IV, 378 (the policy lines). Made public: FRUS 1964–68, XIV (2001). Names: Hughes, Rostow, Kosygin.'
