      when: Oct. 18
      date: '1965-10-18'
      thread: war-opposition
      c: 'Meeker, the Legal Adviser, to Ball, "American Student Activities Directed Against United States Policy on Vietnam":
        the Logan Act not to be invoked. No conviction under it ever; broadened, it "would almost certainly be declared unconstitutional."
        Untested, it has "a certain value": it has "apparently prevented" King from writing to foreign governments. Criticism
        best met "with informed and reasoned answers."'
      n: '[[w.gibbons-u-s-government-and]], IV, 95 n.52. Names: Meeker, Ball, Martin Luther King.'
      tags:
