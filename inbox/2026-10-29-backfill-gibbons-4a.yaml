      c: 'Dodd in the Senate: the Internal Security Subcommittee staff''s study, "The Anti-Vietnam Agitation and the Teach-in
        Movement," sent to every Senator. Control of the movement passed to "Communists and extremist elements," above all
        for the protests of Oct. 15–16.'
      n: '[111 Cong. Rec. 27113](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-7-1.pdf#page=43)
        (Senate, Oct. 15, 1965). [[w.gibbons-u-s-government-and]], IV, 91. To check: Senate Subcomm. on Internal Security,
        staff study, *The Anti-Vietnam Agitation and the Teach-in Movement*, committee print, reprinted as S. Doc. 89-72 (cited
        by [[w.gibbons-u-s-government-and]], IV, 91 n.39). See [[cal.1965-10-15.students]]. Names: Dodd.'
      tags:
      - name:dodd-thomas-j
      src:
