      when: June 10
      date: '1966-06-10'
      thread: vietnam
      c: 'Lodge to Johnson, 5437: Hanoi "genuinely disturbed by the vigor of our bombing"; no public talk of negotiations.
        "The situation calls for silence and action, the action to consist of steady bombing on the one hand, and a discreet
        willingness to get into very secret talks on the other."'
      n: '[[w.gibbons-u-s-government-and]], IV, 369 n.56. Names: Lodge, Johnson.'
