- add:
    entry:
      id: cal.1966-04-05.vietnam-struggle-2
      when: Apr. 5
      date: '1966-04-05'
      thread: vietnam-struggle
      c: 'Night. The Buddhist leaders, Trí Quang excepted, with Kỳ at his house: a constitutional assembly within six months,
        Kỳ to stay through the transition; by Lodge''s report, "they have no confidence in anyone else."'
      n: '[[w.gibbons-u-s-government-and]], IV, 282. To check: Saigon to Washington 3761, Apr. 6, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 282 n.46). See [[cal.1966-04-05.vietnam-struggle]].
        Names: Thích Trí Quang, Nguyễn Cao Kỳ, Lodge.'
      tags:
      - name:thich-tri-quang
      - name:nguyen-cao-ky
      - name:lodge-henry-cabot
      src:
        c: 952643b0
        rows:
        - 'w.gibbons-u-s-government-and IV, 282: all'
        - 'via w.gibbons-u-s-government-and IV, 282 n.46: all'
- add:
    entry:
      id: cal.1966-04-05.vietnam-struggle-3
      when: Apr. 5
      date: '1966-04-05'
      thread: vietnam-struggle
      c: 'William Bundy to Rusk: "the worst possible outcomes have been avoided, but ... Ky essentially capitulated" to the
        Buddhists and General Chuẩn; "we may save Thieu, but Ky looks pretty far gone." A reshuffled Directorate, Chiểu moving
        up, "would not be too bad."'
      n: '[FRUS 1964–68, IV, doc. 113](https://history.state.gov/historicaldocuments/frus1964-68v04/d113) (the covering note).
        [[w.gibbons-u-s-government-and]], IV, 282. Made public: FRUS 1964–68, IV (1998). Names: William Bundy, Rusk, Nguyễn
        Cao Kỳ, Nguyễn Văn Thiệu.'
      tags:
      - name:bundy-william
      - name:rusk-dean
      - name:nguyen-cao-ky
      - name:nguyen-van-thieu
      src:
        c: a6b48d54
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d113: A'
        - 'w.gibbons-u-s-government-and IV, 282: all'
        - 'via w.gibbons-u-s-government-and IV, 282 n.47: all'
- add:
    entry:
      id: cal.1966-04-05.vietnam
      when: Apr. 5
      date: '1966-04-05'
      thread: vietnam
      c: 'Rostow to Johnson: if the Vietnamese work out a civil constitution-drafting group, "Then will be the time to pour
        it on." Heavier attrition, the supply routes, oil and "precision target systems"; "It is not, Mr. President, that
        I''m bloody-minded or a hawk." Get the urban leaders "into a hall and around tables."'
      n: '[FRUS 1964–68, IV, doc. 115](https://history.state.gov/historicaldocuments/frus1964-68v04/d115). [[w.gibbons-u-s-government-and]],
        IV, 282. Made public: FRUS 1964–68, IV (1998). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: c99e2d68
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d115: all'
        - 'w.gibbons-u-s-government-and IV, 282: all'
        - 'via w.gibbons-u-s-government-and IV, 282 n.48: all'
- add:
    entry:
      id: cal.1966-04-06.vietnam-struggle-2
      when: Apr. 6
      date: '1966-04-06'
      thread: vietnam-struggle
      c: 'Morning. Kỳ to Lodge, 3756: Có negotiating at Đà Nẵng; the dissidents given till midnight, then troops move. "Are
        you agreed with this procedure?" Lodge: the government must reestablish its authority; if talks fail, "the time of
        testing could not be avoided."'
      n: '[[w.gibbons-u-s-government-and]], IV, 283. To check: Saigon to Washington 3756, Apr. 6, 1966, NSF Country File,
        Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 283 n.49). Names: Nguyễn Cao Kỳ, Lodge.'
      tags:
      - name:nguyen-cao-ky
      - name:lodge-henry-cabot
      src:
        c: a4ec3395
        rows:
        - 'w.gibbons-u-s-government-and IV, 283: all'
        - 'via w.gibbons-u-s-government-and IV, 283 n.49: all'
- add:
    entry:
      id: cal.1966-04-07.vietnam-struggle
      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam-struggle
      c: 'Lodge with Kỳ: Tâm Châu''s four demands, no punishment of those in the movement, release of the detained, the troops
        withdrawn, the assembly convened (by Kỳ''s reading "within the next two or three days"). Kỳ: "If we take no action
        now, we will have lost Central Vietnam"; two more battalions to Đà Nẵng that night.'
      n: '[[w.gibbons-u-s-government-and]], IV, 284–85. To check: Lodge''s cable on his meeting with Kỳ, Apr. 7, 1966, with
        Tâm Châu''s statement, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]],
        IV, 285 n.56). Names: Lodge, Nguyễn Cao Kỳ, Tâm Châu.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      - name:tam-chau
      src:
        c: dcbfdc11
        rows:
        - 'w.gibbons-u-s-government-and IV, 284–85: all'
        - 'via w.gibbons-u-s-government-and IV, 285 n.56: all'
- add:
    entry:
      id: cal.1966-04-07.vietnam
      when: Apr. 7
      date: '1966-04-07'
      thread: vietnam
      c: 'Whiting of State''s intelligence bureau, back from eighteen days in South Vietnam, by Thomson''s summary for Rostow:
        "Ky will have to go"; he "derives his status only from the U.S. hand on his back"; the Vietnamese "don''t feel that
        they own their country." Rostow sends it to Johnson Apr. 8.'
      n: '[[w.gibbons-u-s-government-and]], IV, 279–80 n.44. To check: Thomson to Rostow, Apr. 7, 1966, on Whiting''s account
        of his trip, NSF Memos to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 279
        n.44). Names: Thomson, Rostow, Nguyễn Cao Kỳ, Johnson.'
      tags:
      - name:thomson-james-c-jr
      - name:rostow-walt-w
      - name:nguyen-cao-ky
      - name:johnson-lyndon-b
      src:
