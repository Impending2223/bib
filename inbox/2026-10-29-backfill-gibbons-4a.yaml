      id: cal.1966-02-21.vietnam-congress-2
      when: Feb. 21
      date: '1966-02-21'
      thread: vietnam-congress
      c: 'Meeker to Ball, for the meeting of Feb. 22: a draft resolution on the lines of the Tonkin resolution, with paragraphs
        "designed to have a reassuring and unifying effect": support for the President''s efforts toward "a just and lasting
        peace," and "close consultation" between Congress and the Executive on major decisions on the war and on a settlement.'
      n: '[[w.gibbons-u-s-government-and]], IV, 254 n.119. See [[cal.1966-02-22.vietnam-congress]]. Names: Meeker, Ball.'
      tags:
