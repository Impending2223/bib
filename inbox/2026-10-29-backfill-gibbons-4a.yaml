- add:
    entry:
      id: cal.1965-09-23.vietnam-congress
      when: Sept. 23
      date: '1965-09-23'
      thread: vietnam-congress
      c: 'Foreign Relations, in executive session, on U. Alexis Johnson''s appointment as Deputy Under Secretary for Political
        Affairs. Fulbright asks how the war can ever be resolved; Johnson: by "simply fading away," perhaps within the year,
        a return to the principles of the 1954 settlement "the best possible outcome." A Communist victory would bring "an
        enormous increase in prestige" to every Communist party.'
      n: '[[w.gibbons-u-s-government-and]], IV, 92. To check: Senate Comm. on Foreign Relations, *Executive Sessions of the
        Senate Foreign Relations Committee (Historical Series)*, XVII: 1965, 1152–53, (1990) (cited by [[w.gibbons-u-s-government-and]],
        IV, 92 n.44); Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical
        Series)*, XVII: 1965, 1155, (1990) (cited by [[w.gibbons-u-s-government-and]], IV, 92 n.45). Made public: the Historical
        Series, 1990. Names: U. Alexis Johnson, Fulbright.'
      tags:
      - name:johnson-u-alexis
      - name:fulbright-j-william
      src:
        c: 881cb5d9
        rows:
        - 'w.gibbons-u-s-government-and IV, 92: all'
