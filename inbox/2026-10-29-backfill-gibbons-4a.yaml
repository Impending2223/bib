        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 325 n.36); Saigon to Washington 4899,
        May 23, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 325
        n.36). See [[cal.1966-05-21.vietnam-struggle]]. Names: Thích Trí Quang, Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
