      when: Apr. 19
      date: '1966-04-19'
      thread: vietnam-congress
      c: 'Rusk before the Foreign Relations Committee on the foreign aid bill. Fulbright, on aid and commitments: his testimony
        of January "frightened me more than any other single thing which happened recently"; "We no longer have a declaration
        of war in order to wage a major war ... we ease into these situations."'
