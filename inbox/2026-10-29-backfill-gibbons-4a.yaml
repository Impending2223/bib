- add:
    entry:
      id: cal.1966-02-28.opinion
      when: Feb. 28
      date: '1966-02-28'
      thread: opinion
      c: 'Harris, early February, in the *Washington Post*: by 2 to 1 the war must be seen through. Disagree, carry the war
        more to the North, 16 percent; agree, but increase the military effort, 33; agree, but do more to negotiate, 34; disagree,
        pull out, 9; not sure, 8. Johnson''s handling of the war approved by 49 percent, down from 63 in January.'
      n: '[[w.gibbons-u-s-government-and]], IV, 174–75. Moyers had read the figures to Johnson''s meeting of Feb. 26: [[cal.1966-02-26.vietnam]].
        To check: *Washington Post*, Feb. 28, 1966 (the Harris Survey) (cited by [[w.gibbons-u-s-government-and]], IV, 174
        n.13). Check: the day of the approval figures'' release. Names: Harris, Johnson.'
      tags:
      - name:harris-louis
      - name:johnson-lyndon-b
      src:
        c: 031906c5
        rows:
        - 'w.gibbons-u-s-government-and IV, 174–75: all'
        - 'via w.gibbons-u-s-government-and IV, 174 n.13: A-B'
- add:
    entry:
      id: cal.1966-03-07.opinion
      when: Mar. 7
      date: '1966-03-07'
      thread: opinion
      c: 'Harris, in the *Washington Post*: a naval blockade of North Vietnam''s ports sanctioned by 2 to 1; bombing Hanoi
        opposed by 4 to 3, the North''s population centers by 5 to 1, the Chinese mainland by 7 to 1; atomic ground weapons
        opposed by 9 to 1, atom bombs on China by 11 to 1.'
      n: '[[w.gibbons-u-s-government-and]], IV, 176 n.19. Names: Harris.'
      tags:
      - name:harris-louis
      src:
        c: 6b0c3732
        rows:
        - 'w.gibbons-u-s-government-and IV, 176: all'
        - 'via w.gibbons-u-s-government-and IV, 176 n.19: all'
- add:
    entry:
      id: cal.1966-03-15.opinion
      when: Mar. 15
      date: '1966-03-15'
      thread: opinion
      c: 'Stanford''s Institute of Political Studies releases a National Opinion Research Center poll of late February and
        early March: willing to negotiate with the Viet Cong, 88 percent; free elections even if the Viet Cong might win,
        54; a coalition government including the Viet Cong, 52; a truce negotiated by the UN, 70. Continue the present situation
        43 percent, fight a major war 23, withdraw 19.'
      n: '[[w.gibbons-u-s-government-and]], IV, 175 n.17, 175–76. To check: Sidney Verba et al., "Public Opinion and the War
        in Vietnam," 61 Am. Pol. Sci. Rev. 317 (1967).'
      src:
        c: 179307c3
        rows:
        - 'w.gibbons-u-s-government-and IV, 175–76: all'
        - 'via w.gibbons-u-s-government-and IV, 175 n.17: all'
- add:
    entry:
      id: cal.1966-03-30.vietnam-congress
      when: Mar. 30
      date: '1966-03-30'
      thread: vietnam-congress
      c: 'McNamara before House Foreign Affairs on the foreign aid bill: the Communists'' maneuver battalions in the South
        105 at the end of 1965, against 65–72 in July; 155 by the end of 1966, a growth twice that of the American and South
        Vietnamese forces.'
      n: '[[w.gibbons-u-s-government-and]], IV, 172. To check: House Comm. on Foreign Affairs, *Foreign Assistance Act of
        1966*, Hearings, 89th Cong., 2d sess. (1966), 325 (cited by [[w.gibbons-u-s-government-and]], IV, 172 n.5). Names:
        McNamara.'
      tags:
      - name:mcnamara-robert-s
      src:
        c: a13eaa67
        rows:
        - 'w.gibbons-u-s-government-and IV, 172: all'
        - 'via w.gibbons-u-s-government-and IV, 172 n.5: all'
- add:
    entry:
      id: cal.1966-02-09.vietnam-force-levels
      when: Feb. 9
      date: '1966-02-09'
      thread: vietnam-force-levels
      c: 'McNamara to Defense and Joint Chiefs officials on Honolulu: "simply not possible yet to decide" the deployments
        or a call-up of the Reserves; they are to "assume and act" to deploy up to 260,000 through Mar. 31, toward 102 maneuver
        battalions and 429,000 Americans by the year''s end. A call-up politically "extremely delicate." Gen. Harold Johnson
        for a call-up.'
      n: '[[w.gibbons-u-s-government-and]], IV, 181–82. To check: Memorandum of the meeting of Feb. 9, 1966, of the Secretary
        of Defense with Defense Department and military officials, printed in Pentagon Papers, Gravel ed., IV, 312–14 (cited
        by [[w.gibbons-u-s-government-and]], IV, 181 n.30). Names: McNamara, Harold K. Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-harold-k
      src:
        c: b80b219a
        rows:
        - 'w.gibbons-u-s-government-and IV, 181–82: all'
        - 'via w.gibbons-u-s-government-and IV, 181 n.30: all'
- add:
    entry:
      id: cal.1966-02-10.vietnam-force-levels
      when: Feb. 10
      date: '1966-02-10'
      thread: vietnam-force-levels
      c: 'McNamara and McNaughton''s "Honolulu Sheet," the program for 1966: American maneuver battalions from 35 to 79, men
        from 184,300 to 429,000; battalion-months of offensive operations from 40 to 75 a month; attack sorties on the infiltration
        routes from 5,400 to 9,000. Goals: the population in secure areas from 50 percent to 60; enemy base areas destroyed
        40–50 percent; the enemy attrited as fast as he can put men in the field.'
      n: '[FRUS 1964–68, IV, doc. 70](https://history.state.gov/historicaldocuments/frus1964-68v04/d70). [[w.gibbons-u-s-government-and]],
        IV, 180–81. Made public: FRUS 1964–68, IV (1998). Check: Gibbons gives 429,000 as 20,000 below Westmoreland''s latest
        request; the paper, 30,000 below MACV''s. See [[cal.1966-02-09.vietnam-force-levels]]. Names: McNamara, McNaughton.'
      tags:
      - name:mcnamara-robert-s
      - name:mcnaughton-john-t
      src:
        c: 85a58f84
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d70: all'
        - 'w.gibbons-u-s-government-and IV, 180–81: all'
        - 'via w.gibbons-u-s-government-and IV, 180 n.29: all'
