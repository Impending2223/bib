      when: Nov. 27
      date: '1965-11-27'
      thread: vietnam-pause
      c: 'McGeorge Bundy to Johnson, 12:30 p.m., "Once more on the pause": he and McNamara sense "your mind is settling against
        a pause"; a "very hard-nosed" one would strengthen Johnson "as a determined man of peace facing a very tough course
        in 1966." Quiet Soviet support likely; Wilson''s coming "Vietnam gambit" spiked.'
      n: '[FRUS 1964–68, III, doc. 208](https://history.state.gov/historicaldocuments/frus1964-68v03/d208). [[w.gibbons-u-s-government-and]],
        IV, 115–16. Made public: FRUS 1964–68, III (1996). See [[cal.1965-11-24.vietnam-pause]]. Names: McGeorge Bundy, Johnson,
        McNamara, Wilson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
