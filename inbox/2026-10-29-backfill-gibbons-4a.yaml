      c: 'Owen of the Policy Planning Council to Katzenbach, "New Planning Venture": a closely held interagency study of "radical
        military alternatives" to the present conduct of the war, Rostow, McNaughton, FitzGerald and Unger agreeing.'
      n: '[[w.gibbons-u-s-government-and]], IV, 494. To check: Owen to Katzenbach, "New Planning Venture," Dec. 6, 1966, Department
