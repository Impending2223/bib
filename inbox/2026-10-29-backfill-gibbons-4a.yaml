- add:
    entry:
      id: cal.1966-08-29.vietnam-force-levels
      when: Aug. 29
      date: '1966-08-29'
      thread: vietnam-force-levels
      c: 'Rostow sends Johnson Westmoreland''s concept of operations, from Nov. 1 "a general offensive with maximum practical
        support to area and population security": it "underlines the need to mount a maximum political campaign, overt and
        covert, designed to defect VC and start Saigon VC negotiations" after the Sept. 11 election. Johnson, in hand: "Let''s
        get Komer to pick up and spark the inspirations."'
      n: '[FRUS 1964–68, IV, doc. 220](https://history.state.gov/historicaldocuments/frus1964-68v04/d220). [[w.gibbons-u-s-government-and]],
        IV, 404–05. To check: Johnson''s handwritten note on Rostow''s memorandum of Aug. 29, 1966, NSF Country File, Vietnam,
        LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 405 n.76). Made public: FRUS 1964–68, IV (1998). Check:
        the day of Johnson''s note. See [[cal.1966-08-24.vietnam-force-levels]]. Names: Rostow, Johnson, Westmoreland, Komer.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:komer-robert-w
      src:
        c: a2261467
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d220: A'
