- add:
    entry:
      id: cal.1966-01-31.vietnam-congress-2
      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam-congress
      c: 'Mansfield, after the White House meeting on foreign aid, to a White House assistant, pleased to see Johnson talking
        with Fulbright there: much could be done "if you were to have Fulbright in for breakfast—just the two of you"; Fulbright
        wants to assure Johnson of his wish to cooperate. Johnson does not act on it.'
      n: '[[w.gibbons-u-s-government-and]], IV, 170. To check: White House staff memorandum to Johnson on a talk with Mansfield
        after the meeting of Jan. 31, 1966, WHCF, Mansfield, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 170
        n.169). Check: the assistant and the memorandum''s day. Names: Mansfield, Johnson, Fulbright.'
      tags:
