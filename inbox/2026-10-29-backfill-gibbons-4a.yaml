      when: Dec. 17
      date: '1965-12-17'
      thread: vietnam
      c: 'Westmoreland, at CINCPAC''s headquarters in Hawaii, to Lodge, HWA 3420, sending the text his chief of staff, Rosson,
        drafted: against Lodge''s directive of Dec. 15, by Rosson "extremely injurious to the U.S. effort in Vietnam." It
        would move MACV''s pacification personnel to USOM and the CIA.'
      n: '[[w.gibbons-u-s-government-and]], IV, 184. To check: Rosson to Westmoreland, MAC 6481, Dec. 16, 1965, Westmoreland
        Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 184 n.37); Westmoreland
        to Lodge, HWA 3420, Dec. 17, 1965, Westmoreland Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]],
