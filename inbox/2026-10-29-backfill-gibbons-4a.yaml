        - 'w.gibbons-u-s-government-and IV, 257–58: all'
- add:
    entry:
      id: cal.1966-03-01.vietnam-congress-3
      when: Mar. 1
      date: '1966-03-01'
      thread: vietnam-congress
      c: 'Nelson and McGovern, critics of the war, vote to table and for the bill: Nelson, withdrawing the commitment not
        in the national interest, nor should it be broadened; McGovern, "since we have sent 300,000 men to southeast Asia,
        we have no practical alternative." McCarthy, against tabling, would have voted against repeal too: such resolutions
        "should not be approved in the future," the Senate no "kind of garden club."'
      n: '[112 Cong. Rec. 4404, 4409, 4412](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82)
        (Senate, Mar. 1, 1966). [[w.gibbons-u-s-government-and]], IV, 258–59. Check: Nelson''s page. See [[cal.1966-03-01.vietnam-congress-2]].
        Names: Nelson, McGovern, McCarthy.'
      tags:
