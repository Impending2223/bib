        - 'via w.gibbons-u-s-government-and IV, 295 n.77a: all'
- add:
    entry:
      id: cal.1966-06-22.vietnam
      when: June 22
      date: '1966-06-22'
      thread: vietnam
      c: 'Porter to Komer by back channel, Saigon 3959: told of Komer''s concern over rumors of his leaving, Lodge says he
        will not desert the ship before the November elections, but "any man got stale after too long out here" and he would
        be "most interested" in another diplomatic post. "In sum, situation under control and options open." Komer sends it
        to Johnson.'
      n: '[[w.gibbons-u-s-government-and]], IV, 295 n.77. See [[cal.1966-04-19.vietnam]]. Names: Porter, Komer, Lodge, Johnson.'
      tags:
      - name:porter-william-j
      - name:komer-robert-w
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
