      when: Mar. 9
      date: '1966-03-09'
      thread: vietnam-struggle
      c: 'State to Lodge, Flash, 2653: Lodge''s report "taken us completely by surprise"; deep concern over anything that
        "would weaken or bring down the present government." Let the generals give Thi a "Dutch uncle" talk instead, and prepare
        the Buddhists and students. "Realize this is uniquely problem which must be decided in Saigon."'
      n: '[[w.gibbons-u-s-government-and]], IV, 269. To check: Washington to Saigon 2653, Mar. 9, 1966, Westmoreland Papers,
        History File, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 269 n.9). See [[cal.1966-03-10.vietnam]].
        Names: Lodge, Nguyễn Chánh Thi.'
      tags:
