- add:
    entry:
      id: cal.1966-01.vietnam
      when: Jan.
      date: 1966-01
      thread: vietnam
      c: 'Krulak, with Greene''s and Sharp''s approval, gives McNamara in person his paper "A Strategic Appraisal, Vietnam":
        attrition "the route to defeat"; the people "the prize." Protect the people, strike main forces only when the odds
        are overwhelming; mine the ports, destroy the rail lines, power and fuel; pacification and land reform. McNamara sends
        him to Harriman, who asks, "Do you want a war with the Soviet Union or the Chinese?"'
      n: '[[w.gibbons-u-s-government-and]], IV, 198–99. To check: [[w.krulak-first-to-fight]]; [[w.sheehan-bright-shining-lie]];
        Krulak, "A Strategic Appraisal, Vietnam," December 1965, copy provided to Gibbons by Krulak (cited by [[w.gibbons-u-s-government-and]],
        IV, 198 n.88). See [[cal.1966-08-01.vietnam]]. Names: Krulak, Greene, Sharp, McNamara, Harriman.'
      tags:
      - name:krulak-victor-h
      - name:greene-wallace-m-jr
      - name:sharp-u-s-grant
      - name:mcnamara-robert-s
      - name:harriman-w-averell
      src:
        c: c4db04e6
        rows:
        - 'w.gibbons-u-s-government-and IV, 198–99: all'
        - 'via w.gibbons-u-s-government-and IV, 198 n.88: A-C'
- add:
    entry:
      id: cal.1966-03-14.vietnam
      when: Mar. 14
      date: '1966-03-14'
      thread: vietnam
      c: 'The Army''s Special Study Group, commissioned by Harold Johnson in July 1965, completes PROVN, "A Program for the
        Pacification and Long-Term Development of South Vietnam": the government controls under 10 percent of the territory
        and 25 percent of the people; American operations "inconsistent with" winning popular allegiance. Rural construction
        "the major US-GVN effort," the government reformed, with American intervention where needed. Its classification raised
        to top secret.'
      n: '[[w.gibbons-u-s-government-and]], IV, 201–08. To check: "A Program for the Pacification and Long-Term Development
        of South Vietnam" (PROVN), Mar. 14, 1966, Westmoreland Papers, Center of Military History (cited by [[w.gibbons-u-s-government-and]],
        IV, 204 n.111). Names: Harold K. Johnson.'
      tags:
      - name:johnson-harold-k
      src:
        c: 8f51f8fc
        rows:
        - 'w.gibbons-u-s-government-and IV, 201–08: all'
        - 'via w.gibbons-u-s-government-and IV, 204 n.111: all'
