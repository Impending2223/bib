- add:
    entry:
      id: cal.1966-08-24.vietnam-2
      when: Aug. 24
      date: '1966-08-24'
      thread: vietnam
      c: 'Lodge to Johnson, 4323, on a cordon and search at Hoa Loi, Bình Dương, 2,500 people: American and ARVN troops seal
        the hamlet overnight; the villagers fed, doctored and questioned one by one; the ARVN does the searching; 160 men
        taken for interrogation; the troops gone at dark. "The Americans did the nice human things."'
      n: '[[w.gibbons-u-s-government-and]], IV, 406–07 n.80. To check: Saigon to Washington 4323, Aug. 24, 1966, Department
        of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 406 n.80). Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
