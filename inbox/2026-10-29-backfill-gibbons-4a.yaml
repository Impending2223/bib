- add:
    entry:
      id: cal.1965-12-06.vietnam-pause
      when: Dec. 6
      date: '1965-12-06'
      thread: vietnam-pause
      c: '3 p.m.: Rusk, McNamara, Ball, Vance, U. Alexis Johnson, McNaughton, William Bundy, Wheeler, Raborn and Clifford,
        McGeorge Bundy''s notes. Clifford "wonders where the Hell we are going—further & further in"; air power and defensive
        positions, without "600,000 ground troops in jungle war"? Wheeler against a pause: "you could shake GVN to its toenails."'
      n: '[FRUS 1964–68, III, doc. 218](https://history.state.gov/historicaldocuments/frus1964-68v03/d218). [[w.gibbons-u-s-government-and]],
        IV, 117–18. Made public: FRUS 1964–68, III (1996). See [[cal.1965-12-04.vietnam-pause]]. Names: Rusk, McNamara, Ball,
        Vance, U. Alexis Johnson, McNaughton, William Bundy, Wheeler, Raborn, Clifford, McGeorge Bundy.'
