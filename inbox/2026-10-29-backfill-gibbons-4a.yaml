- add:
    entry:
      id: cal.1966-12-24.vietnam-air-war
      when: Dec. 24
      date: '1966-12-24'
      thread: vietnam-air-war
      c: 'Sharp to Wheeler, back channel, on the ban within ten miles of Hanoi: "We were just starting to put some real pressure
        on Hanoi"; "Hanoi has been successful once again in getting the pressure removed"; "This war is a dirty business,
        like all wars"; "Let''s roll up our sleeves and get on with this war. We have the power, I would like authority to
        use it."'
      n: '[FRUS 1964–68, IV, doc. 350](https://history.state.gov/historicaldocuments/frus1964-68v04/d350). [[w.gibbons-u-s-government-and]],
        IV, 498–99. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-12-23.vietnam]]. Names: Sharp, Wheeler.'
      tags:
      - name:sharp-u-s-grant
      - name:wheeler-earle
