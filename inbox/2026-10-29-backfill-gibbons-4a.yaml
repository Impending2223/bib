      id: cal.1966-04-25.vietnam-2
      when: Apr. 25
      date: '1966-04-25'
      thread: vietnam
      c: State's interdepartmental Political Development Working Group, Unger chairman, Colby of the CIA among its members,
        first meets, on the constitutional assembly; it meets until December.
      n: '[[w.gibbons-u-s-government-and]], IV, 300 n.89. Check: Gibbons dates its first meeting Apr. 26 (IV, 411). Names:
        Unger, Colby.'
