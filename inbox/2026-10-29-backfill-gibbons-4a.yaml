- add:
    entry:
      id: cal.1965-12-18.vietnam-congress
      when: Dec. 18
      date: '1965-12-18'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, the conclusions of his report on his Asian trip: if the objectives stay as they are, "the
        war in Viet Nam is just beginning for the United States"; a doubling and redoubling of American forces in a year or
        two; "an open-ended military situation." "This is a conflict in which all the choices open to us are bad choices."'
      n: '[FRUS 1964–68, III, doc. 233](https://history.state.gov/historicaldocuments/frus1964-68v03/d233). [[w.gibbons-u-s-government-and]],
        IV, 136 (the report). Made public: S. Doc. 93-11 (1973). Names: Mansfield, Johnson.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      src:
        c: 5ecefca4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d233: all'
        - 'w.gibbons-u-s-government-and IV, 136: C-D'
        - 'via w.gibbons-u-s-government-and IV, 136 n.67: C-D'
- add:
    entry:
      id: cal.1966-01-05.vietnam
      when: Jan. 5
      date: '1966-01-05'
      thread: vietnam
      also:
      - vietnam-pause
      c: 'Lodge''s weekly telegram to Johnson, Saigon 2399: the pause hurting South Vietnam, the bombing to be resumed. The
        public to be taught that "this Chinese Communist Imperialism" is "something with which we are going to have to live
        year in and year out"; then "it will stand casualties better."'
      n: '[FRUS 1964–68, IV, doc. 6](https://history.state.gov/historicaldocuments/frus1964-68v04/d6). [[w.gibbons-u-s-government-and]],
        IV, 134. Made public: FRUS 1964–68, IV (1998). Names: Lodge, Johnson.'
