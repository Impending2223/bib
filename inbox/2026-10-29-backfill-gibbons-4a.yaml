        - 'w.gibbons-u-s-government-and IV, 484–85: all'
        - 'via w.gibbons-u-s-government-and IV, 484 n.17: all'
- add:
    entry:
      id: cal.1966-11-29.vietnam
      when: Nov. 29
      date: '1966-11-29'
      thread: vietnam
      c: 'Komer sends McNamara his "Vietnam Prognosis for 1967–68": past the turning point of losing, perhaps past the crossover
        point; "we''re beginning to ''win'' the war," which "is a far cry from saying ... we''re going to win it"; a bandwagon
        by the end of 1967 or in 1968. The same day, "A Strategic Plan for 1967 in Vietnam."'
      n: '[FRUS 1964–68, IV, doc. 318](https://history.state.gov/historicaldocuments/frus1964-68v04/d318) (the letter). [[w.gibbons-u-s-government-and]],
        IV, 485–87. To check: Komer, "A Strategic Plan for 1967 in Vietnam," Nov. 29, 1966, NSF Files of Robert W. Komer,
        LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 487 n.20). Made public: FRUS 1964–68, IV (1998). Names:
        Komer, McNamara.'
      tags:
      - name:komer-robert-w
      - name:mcnamara-robert-s
      src:
        c: 8c6217e4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d318: A'
