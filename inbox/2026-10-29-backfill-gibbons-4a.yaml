- add:
    entry:
      id: cal.1966-05-21.vietnam-struggle-2
      when: May 21
      date: '1966-05-21'
      thread: vietnam-struggle
      c: 'Trí Quang, through the consulate at Huế, to Johnson, after an attack on a pagoda at Đà Nẵng: end American aid to
        Kỳ and Thiệu, and forbid the use against the Buddhists of tanks and aircraft given to fight the Communists.'
      n: '[[w.gibbons-u-s-government-and]], IV, 321. To check: Saigon to Washington 4820, May 21, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 321 n.25). See [[cal.1966-05-15.vietnam-struggle]].
        Names: Thích Trí Quang, Johnson, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu.'
      tags:
