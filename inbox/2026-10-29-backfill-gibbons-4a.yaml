- add:
    entry:
      id: cal.1965-10-22.vietnam-pause
      when: Oct. 22
      date: '1965-10-22'
      thread: vietnam-pause
      c: 'William Bundy''s draft, at Ball''s direction, "Elements of Second Pause Scenario": a pause to test Hanoi''s willingness
        to reduce its support of the Viet Cong and negotiate without conditions; to show again a readiness for "reciprocal
        actions"; to satisfy opinion that "we have indeed exhausted for the time being all possibilities" before Phase II
        or more bombing.'
      n: '[FRUS 1964–68, III, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v03/d178). [[w.gibbons-u-s-government-and]],
        IV, 81 n.14 (Ball''s direction). Made public: FRUS 1964–68, III (1996). Names: William Bundy, Ball.'
      tags:
