      when: June 23
      date: '1966-06-23'
      thread: vietnam
      c: 'Harriman''s postscript to his memorandum of a talk with McNamara: McNamara for getting "in direct touch" with the
        North Vietnamese and the National Liberation Front.'
      n: '[[w.gibbons-u-s-government-and]], IV, 354. Harriman''s account. To check: Harriman, "Postscript to Memorandum of
        Conversation with Secretary McNamara," June 23, 1966, Harriman Papers, Vietnam Subject File, Library of Congress (cited
