      when: Nov. 10
      date: '1965-11-10'
      thread: vietnam
      c: 'Rusk to Lodge, a personal letter on his 1377: no sign Hanoi will negotiate seriously. The war must not seem to go
        on "because the South Vietnamese authorities with whom we are dealing are afraid of peace"; "contrary to our most
        fundamental policy to permit negotiations to accomplish what we have resisted by force."'
      n: '[FRUS 1964–68, III, doc. 197](https://history.state.gov/historicaldocuments/frus1964-68v03/d197). [[w.gibbons-u-s-government-and]],
        IV, 81 n.15. Made public: FRUS 1964–68, III (1996). See [[cal.1965-10-21.vietnam]]. Names: Rusk, Lodge.'
      tags:
