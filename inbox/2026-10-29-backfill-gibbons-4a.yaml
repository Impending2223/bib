        rows:
        - 'w.gibbons-u-s-government-and IV, 406–07: all'
        - 'via w.gibbons-u-s-government-and IV, 406 n.80b: all'
- add:
    entry:
      id: cal.1966-08-23.vietnam-2
      when: Aug. 23
      date: '1966-08-23'
      thread: vietnam
      c: 'Lansdale sends Lodge Rufus Phillips''s report of Aug. 21: on Aug. 18 a Viet Cong company "practically annihilated"
        the Popular Forces of An Phú, three miles from Saigon, in the Hop Tac area; "we are losing the struggle that really
        counts—the political war for the people."'
      n: '[[w.gibbons-u-s-government-and]], IV, 407 n.80. See [[cal.1966-08-24.vietnam-2]]. Names: Lansdale, Lodge, Phillips.'
      tags:
      - name:lansdale-edward-g
      - name:lodge-henry-cabot
      - name:phillips-rufus
      src:
        c: f0a45daf
        rows:
        - 'w.gibbons-u-s-government-and IV, 407: all'
        - 'via w.gibbons-u-s-government-and IV, 407 n.80c: all'
- add:
    entry:
      id: cal.1966-08-10.vietnam-3
      when: Aug. 10
      date: '1966-08-10'
      thread: vietnam
      c: 'Lodge''s weekly telegram to Johnson, "Smell of victory": "We are not losing; we cannot lose ... never have things
        been going so well"; victory needs no defining, only "the ''smell of victory''"; open roads from Cà Mau to Quảng Trị
        would mean more than battles won. "There is something tremendously effective about sheer mass": "more" coming in "quicker."
        Westmoreland to leave nearly all search and destroy to American forces. Bowles, visiting, "impressed with our entire
        operation." For the election, things to "put the people in a good humor."'
      n: '[FRUS 1964–68, IV, doc. 208](https://history.state.gov/historicaldocuments/frus1964-68v04/d208). [[w.gibbons-u-s-government-and]],
        IV, 407–09, 411. Made public: FRUS 1964–68, IV (1998). Check: FRUS numbers it Saigon 2375, Gibbons 3129. Names: Lodge,
        Johnson, Westmoreland, Bowles.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:bowles-chester
      src:
        c: '52132537'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d208: A-C'
        - 'w.gibbons-u-s-government-and IV, 407–09, 411: all'
        - 'via w.gibbons-u-s-government-and IV, 407 n.81: all'
