      when: Mar. 17
      date: '1966-03-17'
      thread: vietnam-congress
      c: 'Zablocki''s report on his trip to Vietnam, a House Foreign Affairs committee print: heavier bombing of the North,
        petroleum, airfields and power plants; and more on the "psychological aspects": "A sense of national identity, an
        allegiance to the central government, and a greater will to fight needs to be instilled."'
      n: '[[w.gibbons-u-s-government-and]], IV, 226–27 n.42. To check: House Comm. on Foreign Affairs, Committee Print, Mar.
