      id: cal.1966-05-05.vietnam-air-war
      when: May 5
      date: '1966-05-05'
      thread: vietnam-air-war
      c: 'Ball, eight pages against striking the oil at Haiphong: no great effect on Hanoi''s will, its oil or its men and
        supplies moving south; the risk of further escalation and of China''s entry; the Soviet Union, the North''s supplier,
        less likely to help end the war and likelier to give more.'
      n: '[[w.gibbons-u-s-government-and]], IV, 367 n.48. From a draft of Apr. 28 by D. K. Myers. Names: Ball.'
      tags:
      - name:ball-george-w
