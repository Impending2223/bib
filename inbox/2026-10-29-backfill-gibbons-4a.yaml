        rows:
        - 'w.gibbons-u-s-government-and IV, 318–19: all'
        - 'via w.gibbons-u-s-government-and IV, 319 n.14: all'
- add:
    entry:
      id: cal.1966-05-19.vietnam-struggle
      when: May 19
      date: '1966-05-19'
      thread: vietnam-struggle
      c: 'Rusk to Porter, 3524: Đà Nẵng retaken, bring all I Corps under the government without a full clash with the 1st
        Division; Kỳ and Thiệu to reach an agreement ending "divisions in their country which we can no longer accept."'
      n: '[[w.gibbons-u-s-government-and]], IV, 319. To check: Washington to Saigon 3524, May 19, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 319 n.18). Names: Rusk, Porter, Nguyễn
        Cao Kỳ, Nguyễn Văn Thiệu.'
      tags:
      - name:rusk-dean
