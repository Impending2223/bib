      when: Feb. 3
      date: '1966-02-03'
      thread: vietnam
      c: 'Kohler from Moscow to Thompson, on a landing at Vinh: the Soviets would feel compelled to counter it, with aircraft,
        heavy equipment and men to run their weapons, and to back a Chinese attempt to repulse it; it would mean "an early
        showdown with the Chinese."'
      n: '[[w.gibbons-u-s-government-and]], IV, 196. To check: Kohler to Thompson, Feb. 3, 1966 (excerpts, attached to Thompson
        to Rice, Feb. 9, 1966), Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]],
