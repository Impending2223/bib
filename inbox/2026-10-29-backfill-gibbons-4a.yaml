      id: cal.1966-02-17.vietnam-hearings-2
      when: Feb. 17
      date: '1966-02-17'
      thread: vietnam-hearings
      c: 'Reedy to Johnson: the hearings deepen the divisions and force people to choose sides; the unanimity of the President''s
        advisers looks to the public like a President hearing only men too deep in to disagree. Gavin and Kennan, moderates
        made "the darlings of the ''doves''": invite them for "a quiet, but lengthy and thorough, luncheon conference." Johnson
        does not.'
      n: '[[w.gibbons-u-s-government-and]], IV, 249–50. To check: Reedy to Johnson, Feb. 17, 1966, WHCF, Ex/CO 312, LBJ Library
        (cited by [[w.gibbons-u-s-government-and]], IV, 249 n.106). Names: Reedy, Johnson, Gavin, Kennan.'
      tags:
