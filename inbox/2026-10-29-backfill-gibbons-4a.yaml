      date: '1966-11-18'
      thread: vietnam
      c: 'Komer to Vance and Katzenbach, with the Rostow–Komer paper: "As the evil promoter of our non-club," a menu for the
        first "non-session": whether the group can orchestrate the Vietnam effort, and a strategic plan for 1967.'
      n: '[[w.gibbons-u-s-government-and]], IV, 484 n.15. See [[cal.1966-11-15.vietnam]]. Names: Komer, Vance, Katzenbach.'
