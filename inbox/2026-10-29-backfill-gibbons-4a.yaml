      id: cal.1966-05-08.vietnam
      when: May 8
      date: '1966-05-08'
      thread: vietnam
      c: 'Rostow to Johnson on a talk with Gunnar Myrdal: a meeting of the four parties, the United States, both Vietnams
        and the Front, to trade a bombing halt for an end to infiltration and free elections in the South; Sweden, Myrdal
        "absolutely confident," would send troops to monitor. Rostow: with the oil strikes, "a pretty good package"; first
        get Kỳ aboard.'
      n: '[[w.gibbons-u-s-government-and]], IV, 369 n.56. Names: Rostow, Johnson, Nguyễn Cao Kỳ.'
      tags:
