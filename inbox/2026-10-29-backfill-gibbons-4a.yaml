- add:
    entry:
      id: cal.1966-03-25.vietnam-struggle
      when: Mar. 25
      date: '1966-03-25'
      thread: vietnam-struggle
      c: Kỳ announces a Constituent Assembly, renamed the Constitutional Preparatory Commission, to finish in two months,
        and elections by the end of the year. The protests grow.
      n: '[[w.gibbons-u-s-government-and]], IV, 275. See [[cal.1966-03-22.vietnam-struggle-2]]. Names: Nguyễn Cao Kỳ.'
