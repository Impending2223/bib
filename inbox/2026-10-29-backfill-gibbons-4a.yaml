- add:
    entry:
      id: cal.1966-01-25.vietnam-air-war
      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam-air-war
      c: 'SEACOORD, the ambassadors and commanders in Southeast Asia, from Bangkok: the enemy expected to turn from the highlands
        to the area south of the demilitarized zone, hoping for "an equivalent of Dienbienphu." Bomb new targets, the port
        of Haiphong, POL and power plants; raise enemy casualties beyond his replacements, and his will may break.'
      n: '[[w.gibbons-u-s-government-and]], IV, 188 n.51.'
      src:
        c: '67834238'
        rows:
        - 'w.gibbons-u-s-government-and IV, 188: all'
        - 'via w.gibbons-u-s-government-and IV, 188 n.51: all'
- add:
    entry:
      id: cal.1966-02-04.vietnam-air-war
      when: Feb. 4
      date: '1966-02-04'
      thread: vietnam-air-war
      c: 'SNIE 10-1-66, on heavier bombing of the North: it would greatly complicate the North''s war effort, but with a determined
        effort Hanoi could still move "substantially greater amounts than in 1965"; it would "almost certainly set a limit"
        to the growth of the main forces in the South, where, not to be estimated.'
      n: '[FRUS 1964–68, IV, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v04/d66). [[w.gibbons-u-s-government-and]],
        IV, 188–89. Made public: FRUS 1964–68, IV (1998).'
      src:
        c: 19eb3067
        rows:
