- add:
    entry:
      id: cal.1966-03-29.vietnam-air-war
      when: Mar. 29
      date: '1966-03-29'
      thread: vietnam-air-war
      c: 'Taylor to Johnson: "the time has now come to raise significantly the level of pressure on North Viet-Nam by attacking
        POL stocks, interdicting effectively the two railways linking Hanoi with China and mining Haiphong"; Hanoi must get
        "a gloomy composite" from the air war and the ground war both. Westmoreland should have an early answer.'
      n: '[FRUS 1964–68, IV, doc. 104](https://history.state.gov/historicaldocuments/frus1964-68v04/d104). [[w.gibbons-u-s-government-and]],
        IV, 363. Made public: FRUS 1964–68, IV (1998). Names: Taylor, Johnson, Westmoreland.'
      tags:
      - name:taylor-maxwell
      - name:johnson-lyndon-b
      - name:westmoreland-william
      src:
