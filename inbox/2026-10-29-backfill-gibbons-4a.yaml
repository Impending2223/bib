- add:
    entry:
      id: cal.1966-01-07.vietnam-2
      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam
      c: 'Rusk to Lodge, Washington to Saigon 1935, "Literally Eyes Only for the Ambassador," drafted himself: the additions
        to the defense budget for Vietnam over the next 18 months some $120,000 a Viet Cong; aid to Greece $50,000 a guerrilla.
        "Does the prospect of $120,000 per guerrilla suggest any new lines of thinking about techniques in getting at the
        fellows? At that rate, they could enjoy the Riviera for many years."'
      n: '[[w.gibbons-u-s-government-and]], IV, 171–72. To check: Washington to Saigon 1935, Jan. 7, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 172 n.2). Names: Rusk, Lodge.'
      tags:
      - name:rusk-dean
      - name:lodge-henry-cabot
      src:
        c: 83ec34b8
        rows:
        - 'w.gibbons-u-s-government-and IV, 171–72: all'
        - 'via w.gibbons-u-s-government-and IV, 172 n.2: all'
- add:
    entry:
      id: cal.1966-01-07.vietnam-3
      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam
      c: 'Thomson and Ropa of the NSC staff to McGeorge Bundy, "The New Year in Asia": South Vietnam under the Directorate
        seven months more stable than at any time since early 1963, in part from the American commitment; Kỳ''s government
        "notably unsuccessful in developing significant popular enthusiasm or positive political support," its reforms "only
        marginal headway." Pacification "very little tangible progress" in 1965.'
