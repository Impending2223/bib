- add:
    entry:
      id: cal.1966-06-25.vietnam
      when: June 25
      date: '1966-06-25'
      thread: vietnam
      c: 'Rostow to Johnson: "you can smell it all over: Hanoi''s operation, backed by the Chicoms, is no longer being regarded
        as the wave of the future out there. U.S. power is beginning to be felt. We''re not in; but we''re moving."'
      n: '[[w.gibbons-u-s-government-and]], IV, 354. To check: Rostow to Johnson, June 25, 1966, NSF Memos to the President—Walt
        Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 354 n.4). Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: dcdbc918
        rows:
        - 'w.gibbons-u-s-government-and IV, 354: all'
        - 'via w.gibbons-u-s-government-and IV, 354 n.4: all'
- add:
    entry:
      id: cal.1966-06-29.vietnam-3
      when: June 29
      date: '1966-06-29'
      thread: vietnam
      c: 'Lodge to the President, 5830: the war going "plenty well enough" for pacification to start; "if we persist, we are
        going to succeed." The only real danger "if the American people were to lose heart, and choose to ''bring the boys
        home.'' This would indeed be the first domino to fall."'
      n: '[[w.gibbons-u-s-government-and]], IV, 354. To check: Saigon to Washington 5830, June 29, 1966, Department of State,
        Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 354 n.5). Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
        c: 0ed5038d
        rows:
        - 'w.gibbons-u-s-government-and IV, 354: all'
        - 'via w.gibbons-u-s-government-and IV, 354 n.5: all'
- add:
    entry:
      id: cal.1966-07-01.vietnam
      when: July 1
      date: '1966-07-01'
      thread: vietnam
      c: 'Komer to Johnson on his second trip, June 23–29, "both an optimist and a realist": Westmoreland''s spoiling attacks
        going well, the civil effort off the ground, the government with "a new wind." But "we have not really extended our
        control significantly outside the main towns"; until pacification rolls, "we cannot assure a victory."'
      n: '[FRUS 1964–68, IV, doc. 171](https://history.state.gov/historicaldocuments/frus1964-68v04/d171). [[w.gibbons-u-s-government-and]],
        IV, 354–55. Made public: FRUS 1964–68, IV (1998). Names: Komer, Johnson, Westmoreland.'
      tags:
      - name:komer-robert-w
      - name:johnson-lyndon-b
      - name:westmoreland-william
      src:
        c: '10489380'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d171: all'
        - 'w.gibbons-u-s-government-and IV, 354–55: all'
        - 'via w.gibbons-u-s-government-and IV, 354 n.6: all'
- add:
    entry:
      id: cal.1966-06-30.vietnam
      when: June 30
      date: '1966-06-30'
      thread: vietnam
      c: 'Rostow to Johnson, flying back from Omaha: the speech "a personal breakthrough against the background of your decision
        to go for POL"; six themes to "drive home," "Repetition is the heart of both politics and teaching." Johnson agrees;
        Rostow has Rusk and McNamara see them "driven home systematically."'
      n: '[[w.gibbons-u-s-government-and]], IV, 357–58. To check: Rostow to Johnson, on the flight back from Omaha, NSF Memos
        to the President—Walt Rostow, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 357 n.11). Check: Gibbons
        dates the Omaha speech July 7; the Public Papers, June 30. See [[cal.1966-06-29.vietnam]]. Names: Rostow, Johnson,
        Rusk, McNamara.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
