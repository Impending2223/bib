- add:
    entry:
      id: cal.1966-05-21.vietnam-struggle-3
      when: May 21
      date: '1966-05-21'
      thread: vietnam-struggle
      c: 'State to Lodge, 3575, drafted by William Bundy and Unger, after Johnson''s meeting with Bundy and Rostow at 4:35
        p.m.: "We regard situation as extremely critical"; to the American public it seems "getting out of hand with U.S.
        in helpless position." Kỳ to meet Thi and the dissident generals; the Directorate perhaps broadened with Thi, Đôn,
        Quát or Minh. "Whether we ought to move more forcefully and drastically to assert our power."'
      n: '[[w.gibbons-u-s-government-and]], IV, 322–23. To check: Washington to Saigon 3575, May 21, 1966, Department of State,
        Central Files, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 322 n.27). Names: Lodge, William Bundy,
        Unger, Johnson, Rostow, Nguyễn Cao Kỳ, Nguyễn Chánh Thi, Trần Văn Đôn, Phan Huy Quát, Dương Văn Minh.'
      tags:
