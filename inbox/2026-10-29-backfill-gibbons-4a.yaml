- add:
    entry:
      id: cal.1965-12-21.vietnam-pause-2
      when: Dec. 21
      date: '1965-12-21'
      thread: vietnam-pause
      c: 'Lodge to Wheeler, outside State''s channels, against the pause: it "rests on some fundamental misconceptions as
        to the real nature of communist governments"; the war to be ended "by the application of U.S. influence and U.S. force";
        the bombing to stop only for withdrawal of the North''s units, an end of infiltration and inspection first on any
        agenda.'
      n: '[[w.gibbons-u-s-government-and]], IV, 124. To check: Lodge to Wheeler, Dec. 21, 1965, Lodge Papers, Massachusetts
        Historical Society (cited by [[w.gibbons-u-s-government-and]], IV, 124 n.35). Names: Lodge, Wheeler.'
      tags:
      - name:lodge-henry-cabot
      - name:wheeler-earle
      src:
