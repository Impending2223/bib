        - 'w.gibbons-u-s-government-and IV, 487: all'
        - 'via w.gibbons-u-s-government-and IV, 487 n.19a: all'
- add:
    entry:
      id: cal.1966-12-12.vietnam
      when: Dec. 12
      date: '1966-12-12'
      thread: vietnam
      c: 'Katzenbach, "Strategic Concept for Vietnam: An Analysis," drafted by Holbrooke: two wars, the conventional one American,
        the unconventional one the ARVN''s, which "had never escaped from its conventional warfare mold"; American leadership
        has done "little to reorient" it; the slow pacification will tempt Americans to take it over.'
      n: '[[w.gibbons-u-s-government-and]], IV, 490–91. To check: Katzenbach, "Strategic Concept for Vietnam: An Analysis,"
        Dec. 12, 1966, excerpts in Pentagon Papers, Gravel ed., IV, 396–400 (cited by [[w.gibbons-u-s-government-and]], IV,
        490 n.26). See [[cal.1966-12-10.vietnam]]. Names: Katzenbach, Holbrooke.'
      tags:
      - name:katzenbach-nicholas
      - name:holbrooke-richard-c
      src:
        c: 8dd897e4
        rows:
        - 'w.gibbons-u-s-government-and IV, 490–91: all'
        - 'via w.gibbons-u-s-government-and IV, 490 n.26: all'
- add:
    entry:
      id: cal.1966-12-21.vietnam-2
      when: Dec. 21
      date: '1966-12-21'
      thread: vietnam
      c: 'William Bundy''s draft, "1967 and Beyond in Vietnam": a major gain in 1967 not better than one in three; a sharp
        debate in 1968 would weaken any administration; the need to negotiate "acute," but would a settlement raise an "irreducible"
        20 percent chance of Communist takeover to 30? While negotiating, no politically sensitive targets, Hanoi and Haiphong
        above all.'
      n: '[FRUS 1964–68, IV, doc. 347](https://history.state.gov/historicaldocuments/frus1964-68v04/d347). [[w.gibbons-u-s-government-and]],
        IV, 491–92. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-12-10.vietnam]]. Names: William Bundy.'
      tags:
      - name:bundy-william
      src:
        c: b41d50b4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d347: all'
        - 'w.gibbons-u-s-government-and IV, 491–92: all'
        - 'via w.gibbons-u-s-government-and IV, 491 n.27: all'
- add:
    entry:
      id: cal.1966-12-16.vietnam
      when: Dec. 16
      date: '1966-12-16'
      thread: vietnam
      c: 'An unsigned memorandum in State''s files, "Fifteen Brief and Purposely Contentious Points": no viable government
        in Saigon before 1968; if not withdrawing by mid-1968, "the consequences could be politically fatal"; to get out is
        unacceptable, so negotiate, taking "the initiative with Hanoi"; the Front in the government and eventual unification
        acceptable.'
      n: '[[w.gibbons-u-s-government-and]], IV, 492 n.28.'
      src:
        c: 4f657a0a
        rows:
        - 'w.gibbons-u-s-government-and IV, 492: all'
        - 'via w.gibbons-u-s-government-and IV, 492 n.28: all'
- add:
    entry:
      id: cal.1966-12-27.vietnam
      when: Dec. 27
      date: '1966-12-27'
      thread: vietnam
      c: 'The Joint Chiefs on the draft NSAM, JCSM-792-66: the national objective a South Vietnam "free of Communist subversion,"
        calling for more military and political effort; contact with the Viet Cong "a major shift in U.S. policy," a sign
        of weakness.'
      n: '[[w.gibbons-u-s-government-and]], IV, 493. To check: JCSM-792-66, "Draft NSAM," Dec. 27, 1966, cited in Pentagon
        Papers, Gravel ed., IV, 394–96 (cited by [[w.gibbons-u-s-government-and]], IV, 493 n.31). See [[cal.1966-12-10.vietnam]].'
      src:
        c: a5f77967
        rows:
