      c: 'The National Student Association''s congress, the student governments of some 300 colleges: a resolution, adopted
        "overwhelmingly," to stop the bombing of the North and other offensive action and to negotiate, the Viet Cong represented.
        The American Friends of Vietnam, monitored from the NSC staff, had worked to blunt it.'
