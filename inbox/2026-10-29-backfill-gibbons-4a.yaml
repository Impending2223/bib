      - name:mcnamara-robert-s
      src:
        c: 156a31b2
        rows:
        - 'w.gibbons-u-s-government-and IV, 357–58: all'
        - 'via w.gibbons-u-s-government-and IV, 357 n.11: A-B'
- add:
    entry:
      id: cal.1966-08-04.vietnam-support
      when: Aug. 4
      date: '1966-08-04'
      thread: vietnam-support
      c: 'McPherson to Moyers, after a vacation in Rhode Island among Republicans of means: "Nobody was affirmative about
        Vietnam. It is an extremely unpopular war"; all wanted peaceful overtures, "for cooperation with the Russians, chiefly";
        the internationalist middle class''s support "vital, and we don''t have much of it right now."'
      n: '[[w.gibbons-u-s-government-and]], IV, 357 n.9. Moyers sent a summary to Johnson the same day. Names: McPherson,
        Moyers, Johnson.'
      tags:
      - name:mcpherson-harry
      - name:moyers-bill
      - name:johnson-lyndon-b
      src:
        c: 2e24026e
        rows:
        - 'w.gibbons-u-s-government-and IV, 357: all'
        - 'via w.gibbons-u-s-government-and IV, 357 n.9: all'
- add:
    entry:
      id: cal.1966-06-08.vietnam-2
      when: June 8
      date: '1966-06-08'
      thread: vietnam
      c: 'Lodge''s weekly telegram, 5378: he had hoped for decisive military results within a year, but MACV "does not think
        that it can do anything decisive in a year"; some 20,000 North Vietnamese troops have come in since January, "and,
        as far as I can learn, we can''t find them." Intensified bombing of the North "the most effective step we could take
        to get Hanoi to the negotiating table or—better still—to start ''fading away.''"'
      n: '[FRUS 1964–68, IV, doc. 153](https://history.state.gov/historicaldocuments/frus1964-68v04/d153). [[w.gibbons-u-s-government-and]],
        IV, 358, 367–68. Made public: FRUS 1964–68, IV (1998). Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      src:
        c: 27675cce
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d153: all'
        - 'w.gibbons-u-s-government-and IV, 358: A-B'
        - 'w.gibbons-u-s-government-and IV, 367–68: C'
        - 'via w.gibbons-u-s-government-and IV, 358 n.14: A-B'
        - 'via w.gibbons-u-s-government-and IV, 367 n.53: C'
- add:
    entry:
      id: cal.1966-06-05.vietnam-2
      when: June 5
      date: '1966-06-05'
      thread: vietnam
      c: 'Westmoreland to Sharp, MAC 4612: the enemy in the South up to 267,000, mostly North Vietnamese regulars; his main
        effort in Kontum, Pleiku and Darlac by the sanctuaries, where he can win "strategic success." The answer: press toward
        the Laotian and Cambodian borders and strike before he is ready.'
      n: '[[w.gibbons-u-s-government-and]], IV, 359. To check: Westmoreland to Sharp, MAC 4612, June 5, 1966, Westmoreland
        Papers, Message Files, Center of Military History (cited by [[w.gibbons-u-s-government-and]], IV, 359 n.16). Names:
        Westmoreland, Sharp.'
      tags:
