- add:
    entry:
      id: cal.1965-09-01.vietnam-2
      when: Sept. 1
      date: '1965-09-01'
      thread: vietnam
      c: 'MACV''s "Concept of Operations in the Republic of Vietnam": the aim to end the war by convincing the Viet Cong and
        Hanoi "that military victory is impossible," forcing an agreement. Three phases: the enemy''s offensive stopped by
        Dec. 31, 1965; the offensive resumed and pacification begun, to June 30, 1966; the remaining units and bases destroyed,
        to July 1 or Dec. 31, 1967. The war to keep "primarily a Vietnamese character."'
      n: '[[w.gibbons-u-s-government-and]], IV, 44–45. To check: MACV, "Concept of Operations in the Republic of Vietnam,"
        Sept. 1, 1965, National Archives, Westmoreland-CBS Papers (cited by [[w.gibbons-u-s-government-and]], IV, 44 n.5).
        See [[cal.1965-08-27.vietnam]]. Names: Westmoreland.'
      tags:
      - name:westmoreland-william
      src:
        c: c27cfed3
        rows:
        - 'w.gibbons-u-s-government-and IV, 44–45: all'
        - 'via w.gibbons-u-s-government-and IV, 44 n.5a: all'
- add:
    entry:
      id: cal.1965-09-30.vietnam
      when: Sept. 30
      date: '1965-09-30'
      thread: vietnam
      c: 'Lodge to Johnson, Saigon 1100: military progress "considerably ahead" of civil and political; the Viet Cong''s small
        groups, beyond the reach of the offensives, to be overcome only by a population "organized on a precinct basis." His
        working paper of Sept. 27 to the Mission: an ideology, hamlet committees, a census, identity cards, a curfew, local
        elections last.'
      n: '[FRUS 1964–68, III, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v03/d156). [[w.gibbons-u-s-government-and]],
        IV, 58–59 n.42. Made public: FRUS 1964–68, III (1996). Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
      src:
        c: 0e155970
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d156: all'
        - 'w.gibbons-u-s-government-and IV, 59: all'
        - 'via w.gibbons-u-s-government-and IV, 59 n.42a: all'
- add:
    entry:
      id: cal.1965-10-21.vietnam
      when: Oct. 21
      date: '1965-10-21'
      thread: vietnam
      c: 'Lodge to Johnson and Rusk, Saigon 1377, "If Hanoi decides to negotiate": Thiệu, Oct. 13, and Kỳ, Oct. 19, find South
        Vietnam "absolutely unready" for political warfare with the Communists, and Lodge agrees. A "satisfactory outcome,"
        the Mission Council''s of Oct. 19: the Delta and the coastal strip pacified, the cities and provincial capitals held,
        the roads open; the Viet Cong disarmed, North Vietnam''s infiltration and direction stopped, the hard core gone north.'
      n: '[FRUS 1964–68, III, doc. 176](https://history.state.gov/historicaldocuments/frus1964-68v03/d176). [[w.gibbons-u-s-government-and]],
        IV, 59 n.42 (the satisfactory outcome). Made public: FRUS 1964–68, III (1996). Names: Lodge, Johnson, Rusk, Nguyễn
        Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
      - name:lodge-henry-cabot
