      when: Feb. 2
      date: '1966-02-02'
      thread: republican-party-congress
      also:
      - vietnam-congress
      c: 'The *New York Times* reports the Republican leaders'' line on the war: the Democrats'' divisions and a widening
        land war "a winning political issue"; direct criticism of Johnson''s policy and the old "hard line" on the war''s
        conduct played down, the political and constitutional responsibility left "squarely on the President."'
