      thread: vietnam-support
      c: 'McPherson to Alford of Virginia, who with McDougal of Yale has agreed to enlist scholars: send the President a letter
        supporting the administration; "desirable, though not essential, to reject the position expressed in the Lawyers''
        Committee letter." Quickly, before the Foreign Relations hearings.'
