      id: cal.1966-06-14.vietnam-2
      when: June 14
      date: '1966-06-14'
      thread: vietnam
      c: 'Goldberg''s draft for Johnson, "New Peace Moves on Vietnam," after talks with Ball, William Bundy and Sisco: a mutual
        cessation of hostilities and a Geneva conference to revive the agreements of 1954 and 1962, "any interested belligerent
        group, including the National Liberation Front" there; American withdrawal under new, supervised agreements. "Our
        own elections are drawing near."'
      n: '[[w.gibbons-u-s-government-and]], IV, 368 n.56. See [[cal.1966-05-13.vietnam]]. Names: Goldberg, Johnson, Ball,
        William Bundy, Sisco.'
