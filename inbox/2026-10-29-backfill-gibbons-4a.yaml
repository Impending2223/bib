      when: Mar. 22
      date: '1966-03-22'
      thread: vietnam-struggle
      c: 'Rusk to Lodge, 2793, "literally eyes only," drafted himself: the "fact and appearance of solidarity" among the South
        Vietnamese groups; "another round of dissension, turmoil and disunity would be more than the flesh and spirit can
        bear."'
      n: '[[w.gibbons-u-s-government-and]], IV, 274. To check: Washington to Saigon 2793, Mar. 22, 1966, Department of State,
