- add:
    entry:
      id: cal.1966-06-29.vietnam-4
      when: June 29
      date: '1966-06-29'
      thread: vietnam
      c: 'Sullivan to Ball, "Proposal for an ''Asian Peace Offensive''": Hanoi "hurting badly," but needs a guarantor, and
        would turn from China to the Soviet Union; propose UN membership for both Vietnams, both Koreas, and "dual reception"
        for the two Chinas, the war to be settled through the UN. The price, perhaps, UN membership for East Germany.'
      n: '[FRUS 1964–68, IV, doc. 165](https://history.state.gov/historicaldocuments/frus1964-68v04/d165). [[w.gibbons-u-s-government-and]],
        IV, 389–90. Made public: FRUS 1964–68, IV (1998). Names: Sullivan, Ball.'
