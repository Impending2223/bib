- add:
    entry:
      id: cal.1966-05-16.vietnam-congress
      when: May 16
      date: '1966-05-16'
      thread: vietnam-congress
      c: 'Senators on the fighting at Đà Nẵng, as the *New York Times* reports them: Symington never so discouraged, the situation
        "less clear than it has ever been for me"; Jackson, his colleagues "simply throwing their hands in the air in frustration";
        Mansfield, after the leaders'' meeting with the President, "the prospects of civil war are real and imminent"; Cooper,
        "I don''t see how we can long make the fight for them."'
      n: '[[w.gibbons-u-s-government-and]], IV, 318–19. Check: each Senator''s day and words (the *New York Times*, May 17,
        1966). See [[cal.1966-05-15.vietnam]]. Names: Symington, Jackson, Mansfield, John Sherman Cooper.'
