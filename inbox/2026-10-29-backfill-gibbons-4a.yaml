      when: Oct. 15
      date: '1966-10-15'
      thread: vietnam
      c: 'Carver to Helms on McNamara''s report: agreed on the bombing''s effects and on holding Rolling Thunder level, but
        "a bombing program directed both against closing the port of Haiphong and continuously cutting the rail lines to China
        could have a significant impact"; pacification beginning to work, "at least fair prospects" in two years.'
      n: '[FRUS 1964–68, IV, doc. 270](https://history.state.gov/historicaldocuments/frus1964-68v04/d270). [[w.gibbons-u-s-government-and]],
        IV, 462. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-10-14.vietnam]]. Names: Carver, Helms, McNamara.'
      tags:
