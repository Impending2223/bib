- add:
    entry:
      id: cal.1966-05-16.vietnam-struggle
      when: May 16
      date: '1966-05-16'
      thread: vietnam-struggle
      c: 'The Mission to Washington, 4636: agreed, no weight behind a badly planned effort, but "we should not hasten to pull
        the rug from under GVN effort however misguided"; if Kỳ falls, the army may be damaged and the government that emerges
        "the worst sort of jury-rigged affair imaginable."'
      n: '[[w.gibbons-u-s-government-and]], IV, 317. Reply to: [[cal.1966-05-15.vietnam-struggle-3]]. To check: Saigon to
        Washington 4636, May 16, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]],
        IV, 317 n.9). Names: Nguyễn Cao Kỳ.'
