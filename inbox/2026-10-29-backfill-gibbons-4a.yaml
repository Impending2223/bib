      date: '1966-03-12'
      thread: vietnam-struggle
      c: 'Westmoreland to Walt, MAC 2019: information on "insurrectionist elements" in the protests to be passed to Kỳ, chiefly
        through the CIA, toward their leaders'' arrest; American forces to be used only against the Communists.'
