      date: '1966-05-16'
      thread: vietnam-struggle
      c: 'Rusk to Saigon, 3470: emphasize privately to all the leaders "that the American people are becoming fed up with
        the games they are playing" while asked to bear such burdens "to assure that they have a country to quarrel about."'
      n: '[[w.gibbons-u-s-government-and]], IV, 318. To check: Washington to Saigon 3470, May 16, 1966, Department of State,
