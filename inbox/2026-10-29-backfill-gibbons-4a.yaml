        rows:
        - 'w.gibbons-u-s-government-and IV, 379: all'
        - 'via w.gibbons-u-s-government-and IV, 379 n.85: all'
- add:
    entry:
      id: cal.1966-08-04.vietnam
      when: Aug. 4
      date: '1966-08-04'
      thread: vietnam
      also:
      - china
      c: 'SNIE 13-66, "Current Chinese Communist Intentions in the Vietnam Situation": no change in China''s basic policy
        from the oil strikes; more manpower for logistics and engineering, perhaps infantry for the first time against an
        invasion; Peking "would almost certainly intervene if North Vietnam were invaded or if the collapse of the Communist
        regime seemed likely." Some 25,000 to 40,000 Chinese military personnel in the North.'
      n: '[FRUS 1964–68, IV, doc. 201](https://history.state.gov/historicaldocuments/frus1964-68v04/d201) (the conclusions).
        [[w.gibbons-u-s-government-and]], IV, 379. Made public: FRUS 1964–68, IV (1998).'
      src:
        c: 561eff96
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d201: A-C'
        - 'w.gibbons-u-s-government-and IV, 379: all'
        - 'via w.gibbons-u-s-government-and IV, 379 n.86: all'
- add:
    entry:
      id: cal.1966-08-31.vietnam-2
      when: Aug. 31
      date: '1966-08-31'
      thread: vietnam
      c: 'Lodge to Johnson, 4923: Westmoreland believes the crossover point, the enemy killed faster than replaced, has been
        reached. Pacification given "the highest priority which it has ever had." With Sir Robert Thompson: "to lift helicopters
        into a jungle valley and win a battle, is certainly not the initiative required in counterinsurgency"; that comes
        with "''clear and hold'' operations."'
      n: '[[w.gibbons-u-s-government-and]], IV, 380 n.90, 404 n.72, 406. To check: Saigon to Washington 4923, Aug. 31, 1966,
        Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 406 n.80; IV, 404
        n.72). Check: Gibbons: against his own staff''s evidence of late July. See [[cal.1966-07-24.vietnam]]. Names: Lodge,
        Westmoreland.'
      tags:
      - name:lodge-henry-cabot
      - name:westmoreland-william
      src:
        c: 8d49c9f0
        rows:
        - 'w.gibbons-u-s-government-and IV, 380: A'
        - 'w.gibbons-u-s-government-and IV, 406: B'
        - 'w.gibbons-u-s-government-and IV, 404: C-D'
        - 'via w.gibbons-u-s-government-and IV, 380 n.90: A'
        - 'via w.gibbons-u-s-government-and IV, 406 n.80a: B'
        - 'via w.gibbons-u-s-government-and IV, 404 n.72b: C-D'
- add:
    entry:
      id: cal.1966-07.vietnam
      when: July
      date: 1966-07
      thread: vietnam
      c: 'Saigon. The Mission''s Priorities Task Force, set up by Porter in April at Komer''s urging, reports: "decisive military
        victory for either side is not likely"; the government''s control of the countryside "not now being extended through
        pacification to any significant degree"; no strong government in two years.'
      n: '[[w.gibbons-u-s-government-and]], IV, 381–82. To check: Priorities Task Force Report Summary, July 1966, printed
        in Pentagon Papers, Gravel ed., II, 580, 582 (cited by [[w.gibbons-u-s-government-and]], IV, 381 n.93). Names: Porter,
        Komer.'
      tags:
      - name:porter-william-j
      - name:komer-robert-w
      src:
        c: f3cf6652
        rows:
        - 'w.gibbons-u-s-government-and IV, 381–82: all'
        - 'via w.gibbons-u-s-government-and IV, 381 n.93: all'
