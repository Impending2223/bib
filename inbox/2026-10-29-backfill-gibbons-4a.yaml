      when: Apr. 20
      date: '1966-04-20'
      thread: vietnam-congress
      c: 'Pell in the Senate, with Mansfield for a conference in Asia among the parties: "if conditions should arise that
        a government comes to power which asks us to leave, let us have the good sense to follow that advice," not prop up
        a government or "organize a counter coup."'
      n: '[112 Cong. Rec. 8611](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt7/pdf/GPO-CRECB-1966-pt7-2-2.pdf#page=49)
        (Senate, Apr. 20, 1966). [[w.gibbons-u-s-government-and]], IV, 305. See [[cal.1966-04-18.vietnam-congress]]. Names:
