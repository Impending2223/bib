      when: May 15
      date: '1966-05-15'
      thread: vietnam-struggle
      c: 'State to Trí Quang, 3453: the government of the United States follows the events "with fullest attention," fully
        supports the elections for a Constitutional Assembly, and will use its influence to persuade all groups to resolve
        their difficulties.'
      n: '[[w.gibbons-u-s-government-and]], IV, 316–17. Reply to: [[cal.1966-05-15.vietnam-struggle]]. To check: Washington
