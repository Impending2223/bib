- add:
    entry:
      id: cal.1965-10-18.vietnam-congress
      when: Oct. 18
      date: '1965-10-18'
      thread: vietnam-congress
      also:
      - war-opposition
      - republican-party-congress
      c: 'The Senate on the weekend''s demonstrations. Kuchel, applauding the Justice Department''s inquiry: "what has gone
        on sows the seeds of treason." Mansfield: the protesters "furnish fodder to Hanoi, to Peiping, and to the Vietcong."
        Russell: "Every protest will cause the Communists to believe they can win"; "Our flag is committed." Lausche: "Long-whiskered
        beatniks." Dirksen: "craven souls." Saltonstall with them. Proxmire: "If these peace marchers want peace," let them
        address the Communists.'
      n: '[111 Cong. Rec. 27251–55](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt20/pdf/GPO-CRECB-1965-pt20-8-2.pdf#page=11)
        (Senate, Oct. 18, 1965). [[w.gibbons-u-s-government-and]], IV, 89–90. See [[cal.1965-10-17.students]]. Names: Kuchel,
        Mansfield, Russell, Lausche, Dirksen, Saltonstall, Proxmire.'
