      thread: vietnam-support
      c: 'State''s activities report to the White House: the heads of state of Ethiopia, Senegal, Tanzania and Zambia have
        withdrawn as sponsors of the Russell Foundation; India and Pakistan disavow the tribunal.'
      n: '[[w.gibbons-u-s-government-and]], IV, 434. To check: State Department Activities Report, Nov. 14, 1966, Department
