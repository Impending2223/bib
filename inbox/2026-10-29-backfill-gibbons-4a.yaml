      c: 'Lodge to Johnson: "offensive operations" to be defined as "split up the Viet Cong and keep him off balance," not
        "seek out and destroy": fewer men for the "military" war, fewer American casualties, more pacification.'
      n: '[FRUS 1964–68, IV, doc. 294](https://history.state.gov/historicaldocuments/frus1964-68v04/d294). [[w.gibbons-u-s-government-and]],
