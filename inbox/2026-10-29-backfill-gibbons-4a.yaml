      when: Aug. 6
      date: '1966-08-06'
      thread: vietnam
      c: 'Lodge, 2818, answering State''s 21944: a test in one province of incentives for high-level defections from the Front,
        "substantial cash awards to families," recognized status, no Chieu Hoi centers or prisons. Lansdale, through an intermediary,
        has met the uncle of Nguyễn Hữu Thọ, the Front''s chairman, said to want him to defect.'
      n: '[FRUS 1964–68, IV, doc. 204](https://history.state.gov/historicaldocuments/frus1964-68v04/d204). [[w.gibbons-u-s-government-and]],
