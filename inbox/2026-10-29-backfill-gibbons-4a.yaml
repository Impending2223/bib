- add:
    entry:
      id: cal.1966-11-09.vietnam-air-war
      when: Nov. 9
      date: '1966-11-09'
      thread: vietnam-air-war
      c: 'Rostow to Johnson, in Texas, with the Chiefs'' proposals: "We must begin now to lean more heavily on the North";
        the cost to Hanoi, Moscow and Eastern Europe "may add to their interest in a negotiated settlement." But with George
        Brown going to Moscow, the program "goes too far at this time"; the SAM sites, a power plant or two, an oil store
        instead.'
      n: '[FRUS 1964–68, IV, doc. 296](https://history.state.gov/historicaldocuments/frus1964-68v04/d296). [[w.gibbons-u-s-government-and]],
        IV, 465–66. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-11-08.vietnam-air-war]]. Names: Rostow, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
