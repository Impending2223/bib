      when: Feb. 18
      date: '1966-02-18'
      thread: vietnam-hearings
      c: 'Rusk before the Foreign Relations Committee, televised, the hearings'' last day; McNamara has declined to testify
        in public. The commitment: the SEATO treaty, art. IV, ratified 82–1. Case: the Tonkin resolution "not a power of attorney
        irrevocably delegating all of the congressional authority to the President." Fulbright: more a civil war than aggression,
        not worth "a vast escalation"; Rusk: "is it just possible that there is something wrong with them?"'
      n: 'Daily Digest, [112 Cong. Rec. D59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=57).
        [[w.gibbons-u-s-government-and]], IV, 243–48. To check: Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance,
        Fiscal Year 1966—Vietnam: Hearings* (1966), 563–76, 618, 650 ff. (cited by [[w.gibbons-u-s-government-and]], IV, 244–47
        nn.92, 95, 97). See [[cal.1966-02-17.vietnam-hearings]]. Names: Rusk, McNamara, Case, Fulbright.'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
