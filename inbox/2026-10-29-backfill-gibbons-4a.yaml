- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-2
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'Lodge with Kỳ, 1 p.m., 3698: the Directorate''s resolutions of Apr. 3, a political convention and force at Đà Nẵng,
        the city declared held by the Communists; a National Political Congress to be formed. Kỳ asks American aircraft to
        lift the troops; Lodge approves.'
      n: '[FRUS 1964–68, IV, doc. 110](https://history.state.gov/historicaldocuments/frus1964-68v04/d110). [[w.gibbons-u-s-government-and]],
        IV, 279. Made public: FRUS 1964–68, IV (1998). Names: Lodge, Nguyễn Cao Kỳ.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-cao-ky
      src:
        c: ce78ec1a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d110: all'
        - 'w.gibbons-u-s-government-and IV, 279: all'
        - 'via w.gibbons-u-s-government-and IV, 279 n.42: all'
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-3
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'Johnson with Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy and Fortas, 7:10 to 8:35 p.m. Westmoreland
        sees "prospect of success in Danang"; Johnson, McNamara and Rusk do not. Johnson: "appeasement never wins"; "rather
        have someone we can control"; "Ky is gone, the last gasp"; "We need a Garcia-Godoy type—with an advisor by his side."
        McNamara: "We need a Bunker in Vietnam."'
      n: '[FRUS 1964–68, IV, doc. 112](https://history.state.gov/historicaldocuments/frus1964-68v04/d112) (Valenti''s notes).
        [[w.gibbons-u-s-government-and]], IV, 279–81. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-04-04.vietnam-struggle]].
        Names: Johnson, Humphrey, Rusk, McNamara, Rostow, Taylor, William Bundy, Fortas, Westmoreland, Nguyễn Cao Kỳ.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:taylor-maxwell
      - name:bundy-william
      - name:fortas-abe
      - name:westmoreland-william
      - name:nguyen-cao-ky
      src:
        c: 2ee377c9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d112: all'
        - 'w.gibbons-u-s-government-and IV, 279–81: all'
        - 'via w.gibbons-u-s-government-and IV, 279 n.44: all'
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-4
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'State to Lodge, 2966, the second cable approved at the meeting: a political answer "as quickly and peacefully as
        possible"; much more contact with the government and the opposition; Lodge or Negroponte to see Trí Quang; a "prompt
        solution" for Thi''s future. Kỳ''s successor from the Directorate, Chiểu for choice; "We are at a loss here to suggest
        any civilian."'
      n: '[[w.gibbons-u-s-government-and]], IV, 281. To check: Washington to Saigon 2964 and 2966, Apr. 4, 1966, Department
        of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], IV, 281 n.45). See [[cal.1966-04-04.vietnam-struggle-3]].
        Names: Lodge, Thích Trí Quang, Nguyễn Chánh Thi, Nguyễn Cao Kỳ.'
      tags:
      - name:lodge-henry-cabot
      - name:thich-tri-quang
      - name:nguyen-chanh-thi
      - name:nguyen-cao-ky
      src:
        c: f5d527d4
        rows:
        - 'w.gibbons-u-s-government-and IV, 281: all'
        - 'via w.gibbons-u-s-government-and IV, 281 n.45: all'
- add:
    entry:
      id: cal.1966-04-04.vietnam-struggle-5
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam-struggle
      c: 'Lodge, 3699, on the cables of Apr. 2: Trí Quang''s acts "totally consistent with Communist aims"; the movement in
        power "could lead Vietnam into unknown waters, not excluding French-backed neutralism and Hanoi take-over." If Kỳ
        goes, Phan Xuân Chiểu of the Directorate; or Minh or Đôn.'
      n: '[[w.gibbons-u-s-government-and]], IV, 279. Reply to: [[cal.1966-04-02.vietnam-struggle-2]]. To check: Saigon to
        Washington 3699, Apr. 4, 1966, Department of State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]],
        IV, 279 n.41). Names: Lodge, Thích Trí Quang, Nguyễn Cao Kỳ, Dương Văn Minh, Trần Văn Đôn.'
      tags:
