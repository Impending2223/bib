- add:
    entry:
      id: cal.1966-04-04.vietnam
      when: Apr. 4
      date: '1966-04-04'
      thread: vietnam
      c: 'McNaughton, "Some Thoughts About Vietnam": Cuba and Berlin came out well; in Vietnam none of the three conditions
        holds. "The situation in Vietnam is bad and not getting better"; the riots "reveal a rottenness in the fabric that
        may not be curable." Even with full deployments, "a continued stalemate at a higher level" in 1967; several divisions
        for years even if the war is won.'
      n: '[[w.gibbons-u-s-government-and]], IV, 291–92. To check: McNaughton, "Some Thoughts About Vietnam," Apr. 4, 1966,
        Department of State, Lot File 70 D 207 (cited by [[w.gibbons-u-s-government-and]], IV, 291 n.68). Names: McNaughton.'
      tags:
      - name:mcnaughton-john-t
      src:
        c: 6283b0e1
        rows:
        - 'w.gibbons-u-s-government-and IV, 291–92: all'
        - 'via w.gibbons-u-s-government-and IV, 291 n.68: all'
- add:
    entry:
      id: cal.1966-04-05.vietnam-2
      when: Apr. 5
      date: '1966-04-05'
      thread: vietnam
      c: 'McNaughton''s "Possible ''Fall Back'' Plan": change the aim to forcing a compromise between Saigon and the Viet
        Cong; "we are on a losing wicket"; a private presidential decision to use the troubles in I Corps "as the vehicle
        for disengagement," in secrecy; an ultimatum, shape up or we ship out; re-educate opinion that the United States has
        "more than delivered the goods in blood and treasure."'
      n: '[[w.gibbons-u-s-government-and]], IV, 292–93. To check: McNaughton, "Possible ''Fall Back'' Plan," Apr. 5, 1966,
        Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 292 n.69). Check: the
        summary''s date (Gibbons: drafted Apr. 5, filed with the B-P draft of Apr. 15). Names: McNaughton.'
      tags:
      - name:mcnaughton-john-t
      src:
        c: dcae6693
        rows:
        - 'w.gibbons-u-s-government-and IV, 292–93: all'
        - 'via w.gibbons-u-s-government-and IV, 292 n.69b: all'
- add:
    entry:
      id: cal.1966-04-15.vietnam
      when: Apr. 15
      date: '1966-04-15'
      thread: vietnam
      c: 'McNaughton''s first rough draft of Course B-P, "maintain present course but accept ''soft'' compromise": diplomatic
        probing for a settlement while the military pressure rises.'
      n: '[[w.gibbons-u-s-government-and]], IV, 292. To check: McNaughton, "Course B-P," first rough draft, Apr. 15, 1966,
        Warnke Papers, McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 292 n.69). See [[cal.1966-04-05.vietnam-2]].
        Names: McNaughton.'
      tags:
      - name:mcnaughton-john-t
      src:
        c: 9ab39079
        rows:
        - 'w.gibbons-u-s-government-and IV, 292: all'
        - 'via w.gibbons-u-s-government-and IV, 292 n.69a: all'
- add:
    entry:
      id: cal.1966-04-21.vietnam-2
      when: Apr. 21
      date: '1966-04-21'
      thread: vietnam
      c: 'Ball, "Cutting our Losses," option C: the South Vietnamese divisions "too old, too deep, and too fundamental." Make
        it plain that the United States has met its obligations and "it is the South Vietnamese people who have failed, not
        us"; pending a stable government, no more forces, fewer air attacks on the North, the ground war at the minimum. To
        fight on with "the present mushy political base" is "both dangerous and futile."'
      n: '[[w.gibbons-u-s-government-and]], IV, 293–94. To check: Ball, "Cutting our Losses," Apr. 21, 1966, Warnke Papers,
        McNaughton Files, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 293 n.70). See [[cal.1966-04-09.vietnam-2]].
        Names: Ball.'
      tags:
      - name:ball-george-w
      src:
        c: fb37cba2
        rows:
        - 'w.gibbons-u-s-government-and IV, 293–94: all'
        - 'via w.gibbons-u-s-government-and IV, 293 n.70: all'
- add:
    entry:
      id: cal.1966-04-12.vietnam-2
      when: Apr. 12
      date: '1966-04-12'
      thread: vietnam
      c: 'Taylor to Johnson, "Current Situation in South Viet-Nam": Kỳ has not shown himself capable of "the ''whiff of grapeshot''";
        he is expendable, but Trí Quang must not overthrow the Directorate. Use force within the law, contain Đà Nẵng and
        Huế, buy off Thi. "I feel it in my bones" that overreaction is more dangerous than restraint; reject "take over or
        get out."'
      n: '[FRUS 1964–68, IV, doc. 119](https://history.state.gov/historicaldocuments/frus1964-68v04/d119). [[w.gibbons-u-s-government-and]],
        IV, 294. Made public: FRUS 1964–68, IV (1998). Names: Taylor, Johnson, Nguyễn Cao Kỳ, Thích Trí Quang, Nguyễn Chánh
        Thi.'
      tags:
      - name:taylor-maxwell
      - name:johnson-lyndon-b
      - name:nguyen-cao-ky
      - name:thich-tri-quang
      - name:nguyen-chanh-thi
      src:
        c: c476d4a4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d119: all'
        - 'w.gibbons-u-s-government-and IV, 294: all'
        - 'via w.gibbons-u-s-government-and IV, 294 n.71: all'
- add:
    entry:
      id: cal.1966-04-16.vietnam-struggle
      when: Apr. 16
      date: '1966-04-16'
      thread: vietnam-struggle
      c: 'Lodge, 4033, after the Congress: no campaign against Đà Nẵng and Huế, but "clever police-type" steps "to shrink,
        whittle and subdivide" the leaders; Thi a post in the government, away from I Corps; "little or no change in the Directorate";
        a strong pro-government party before the year''s end.'
      n: '[FRUS 1964–68, IV, doc. 123](https://history.state.gov/historicaldocuments/frus1964-68v04/d123). [[w.gibbons-u-s-government-and]],
        IV, 295. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-04-12.vietnam-struggle]]. Names: Lodge, Nguyễn Chánh
        Thi.'
      tags:
      - name:lodge-henry-cabot
      - name:nguyen-chanh-thi
      src:
        c: 77a4d273
        rows:
