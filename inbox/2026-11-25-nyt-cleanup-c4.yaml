      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 226 (Dec. 8–9); [[w.schattenberg-brezhnev]], 271–72 (on Novotný''s invitation, "a hunting holiday"; the night''s talk with Dubček; by Brezhnev''s own account, 272 nn.36–39). Made public: 2016. Check: "Novotny Deposed as Party Leader; Slovak Gets Post" (UPI), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 6: an unofficial vote of the ten-member Politburo "last month," 8 to 2, for Novotný''s removal from both posts; Brezhnev flew to Prague to save his place as party leader and forced a 5-to-5 deadlock "at a later meeting of the Central Committee." To check: remarks by Brezhnev to the top officials of the CPCz in Prague, Dec. 9, 1967, in J. Navratil ed., *The Prague Spring 1968* (2006), 18–20; Politburo resolution "O poezdke t. Brezhneva L.I. v Chekhoslovakiyu," in N. G. Tomilina et al. eds., *Chekhoslovatskiy krizis 1967–1969 gg. v dokumentakh TsK KPSS* (2010), 47 (cited by [[w.schattenberg-brezhnev]], 272 nn.36–37). Names: Brezhnev. Check: The record gives the movements only.'
    settles:
    - 'Check: UPI (*New York Times*, Jan. 6, 1968, 6): an unofficial vote of the ten-member Politburo "last month," 8 to 2, for Novotný''s removal from both posts; Brezhnev flew to Prague to save his place as party leader and forced a 5-to-5 deadlock "at a later meeting of the Central Committee.".'
