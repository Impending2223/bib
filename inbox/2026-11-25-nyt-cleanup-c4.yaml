n at Hanoi to the Foreign Ministry, Sept. 22, 1960, Archives diplomatiques (cited by [[w.asselin-hanois-road-to-the]], 83 n.65); the British consulate general at Hanoi to the Foreign Office, Sept. 26, 1960, FO 371/152747 (cited by [[w.asselin-hanois-road-to-the]], 85 n.87, for the North first); *Third National Congress of the Viet Nam Workers'' Party: Documents*, I, 222 (cited by [[w.asselin-hanois-road-to-the]], 86 n.88, for the two tasks); Lê Duẩn''s political report to the congress, Sept. 5, 1960, *Văn kiện Đảng toàn tập*, 21:495–656 (cited by [[w.nguyen-hanois-war]], 52 n.4, for the two tasks); Vietnam Workers'' Party, Third National Congress of the Viet Nam Workers'' Party (Hanoi: Foreign Languages Publishing House, 1960), vol. 1, 62, and vol. 2, 31–3, 62 (cited by [[w.moyar-triumph-forsaken]], 103 n.44); BBC, Summary of World Broadcasts, SWB/FE/435/C/5 (cited by [[w.moyar-triumph-forsaken]], 103 n.44); [[w.lich-su-quan-doi]], 115 (cited by [[w.guan-vietnamese-communists-relations-with]], 160 n.27); FO 371/152747, DV 1016/36, 24 September 1960, from Hanoi to Foreign Office (cited by [[w.guan-vietnamese-communists-relations-with]], 161 n.32a); Speeches of Li Fuchun and Mukhitdinov to the Third Congress, SWB/FE/435/C/10-11 (cited by [[w.guan-vietnamese-communists-relations-with]], 161 n.32b); [[w.faligot-chinese-secret-service]] (cited by [[w.guan-vietnamese-communists-relations-with]], 163 n.37). Names: Lê Duẩn, Hồ Chí Minh.'
