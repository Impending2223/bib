      n: '[[w.cosmas-joint-chiefs-of-staff]], 83–84. Check: Moscow''s account (Tass, the captain''s report), as in Raymond H. Anderson, "U.S. Raid Damaged Ship, Moscow Says," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3: the *Pereyaslavl-Zalessky* damaged, not missed: seven bombs within 10 to 20 meters, an eighth, delayed-action, on a loaded barge two meters off her port side, exploding 25 minutes later; the State Department and the Pentagon, Jan. 5: American planes may have "inadvertently" damaged her, in raids about 3 p.m. Haiphong time. To check: JCS 6402 to CINCPAC, 032158Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); JCS 6700 to CINCPAC, 062148Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); JCS 6818 to CINCPAC, 092026Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); CINCPAC to CJCS, 090735Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); USUN to State, 232344Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); Memo, NMCC to SecDef, 8 Jan 68, "Alleged Bombing of Soviet Merchant Ship of 4 January 1968", OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44); Telecon Item, JCS 010/68 to CINCPAC, 141720Z Jan 68, OCJCS File 091 Vietnam Jan 68 (cited by [[w.cosmas-joint-chiefs-of-staff]], 84 n.44). Names: Wheeler, Sharp.'
