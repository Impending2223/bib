      n: 'James Reston, "Capital Considers a Tougher Policy on Castro Regime," [*New York Times*, Feb. 18, 1960](https://timesmachine.nytimes.com/timesmachine/1960/02/18/issue.html), at 1. Check: the day of each meeting. See [[cal.1960-02-13.cuba]]. Names: Rubottom.'
