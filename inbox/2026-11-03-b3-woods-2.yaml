# Batch 3 resumed (Nov. 4, 2026), reader "advisers": Woods, *J. William Fulbright, Vietnam, and the Search for a Cold
# War Foreign Policy* (Cambridge, 1998; w.woods-j-william-fulbright-vietnam), read in part against the calendar (no
# earlier patch). The owner's copy, a born-digital text layer; printed page = PDF page - 8. The calendar's cites of
# Woods are to the 1995 biography (w.woods-fulbright), a different book: none held up here. The book-check:
# notes/book-checks/woods-j-william-fulbright-vietnam.md (what remains unread).
patch: b3-woods-2
by: Claude (batch 3 resumed, advisers group; Woods, J. William Fulbright, Vietnam)
ops:
- add:
    entry:
      id: cal.1960-03-01.voting-rights
      when: Mar. 1
      date: '1960-03-01'
      thread: voting-rights
      c: 'Fulbright in the Senate, a review of federal and Arkansas law: enough already to protect every citizen''s vote. "The Negroes of my State vote freely and without coercion."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 48. See [[cal.1960-02.voting-rights]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1960-04-05.voting-rights
      when: Apr. 5
      date: '1960-04-05'
      thread: voting-rights
      c: 'Fulbright in the Senate: the civil rights bill''s proposals much like the punitive measures of Reconstruction.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 49. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1961-03-23.cuba-bay-of-pigs
      when: Mar. 23
      date: '1961-03-23'
      thread: cuba-bay-of-pigs
      c: 'The White House, a reception for thirty-three members of Congress: Kennedy asks Fulbright where he will spend Easter; Delray Beach, near Palm Beach.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 27–28. See [[cal.1961-03-30.cuba]]. Names: Kennedy, Fulbright.'
      tags:
      - name:kennedy-john-f
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1961-04-19.right-and-the-military
      when: Apr. 19
      date: '1961-04-19'
      thread: right-and-the-military
      c: 'Marcy passes Fulbright a letter from a contact in Defense: an Air Force reserve officer''s account of a showing of the filmstrip *Communism on the Map*.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 36. See [[cal.1961-08-02.right-and-the-military]]. Names: Marcy, Fulbright.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1961-07-29.right-and-the-military
      when: July 29
      date: '1961-07-29'
      thread: right-and-the-military
      c: 'Thurmond in the Senate: "a concerted attack under way against the anti-Communist indoctrination of the American people and our troops in uniform," begun by the Communist Party.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 43. See [[cal.1961-08-02.right-and-the-military]]. Names: Thurmond.'
      tags:
      - name:thurmond-strom
- add:
    entry:
      id: cal.1963-09-09.testing-2
      when: Sept. 9
      date: '1963-09-09'
      thread: testing
      c: Fulbright opens the Senate's debate on the test ban treaty; the polls a bare majority for it, his mail four to one against.
      n: '[[w.woods-j-william-fulbright-vietnam]], 54. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1964-03-15.vietnam-2
      when: Mar. 15
      date: '1964-03-15'
      thread: vietnam
      c: 'Lunch at the White House, the day after McNamara''s return from Saigon: Fulbright, Johnson and Rusk hear him: the Viet Cong control half or more of the land in twenty-two of the forty-four provinces;
        apathy; desertions.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 68. Names: Fulbright, Johnson, Rusk, McNamara.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-06-28.vietnam-congress
      when: June 28
      date: '1965-06-28'
      thread: vietnam-congress
      c: 'The White House, a walk in the Rose Garden: Johnson to Fulbright, more troops and equipment to go to Vietnam to hold the line.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 93. See [[cal.1965-06-15.vietnam]]. Names: Johnson, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-07-01.vietnam-congress-2
      when: July 1
      date: '1966-07-01'
      thread: vietnam-congress
      c: 'Fulbright in the Senate against the strikes on Hanoi and Haiphong of June 29–30: a long step toward "ultimate war."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 134. See [[cal.1966-07-01.vietnam-congress]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-08.congo
      when: July 8
      date: '1967-07-08'
      thread: congo
      c: 'Rusk to Russell and Fulbright by telephone, before the C-130s leave for the Congo: the impression given, to rescue Americans.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 153. See [[cal.1967-07-06.congo]]. Names: Rusk, Russell, Fulbright.'
      tags:
      - name:rusk-dean
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-09.congo
      when: July 9
      date: '1967-07-09'
      thread: congo
      c: 'Rusk again to Russell and Fulbright: the planes to move Mobutu''s troops "around the Congo to deal with revolutionary elements."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 153. Names: Rusk, Russell, Fulbright.'
      tags:
      - name:rusk-dean
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-06-07.elections-1968-2
      when: June 7
      date: '1968-06-07'
      thread: elections-1968
      c: 'McCarthy to Marcy by telephone: he will not withdraw.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 176. Names: McCarthy, Marcy.'
      tags:
      - name:mccarthy-eugene-j
      - name:marcy-carl
- add:
    entry:
      id: cal.1968-08-20.elections-1968-6
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: 'Fulbright before the Democratic platform committee in Washington: the war in Vietnam a national tragedy.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 178. See [[cal.1968-08-19.elections-1968-chicago-6]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
