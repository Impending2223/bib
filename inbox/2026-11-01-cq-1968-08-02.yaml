- edit:
    id: cal.1968-07-26.elections-1968-2
    base: dd43144a
    set:
      c: 'Edward Kennedy, a statement through a spokesman in Boston: it is "impossible" for him to run for Vice President this year; his reasons "purely personal"; his decision "final, firm, and not subject to further consideration."'
      n: '[[w.cq-weekly-report]], Aug. 2, 1968, 2069. To check: [[w.clymer-edward-m-kennedy]]. See [[cal.1968-06-05.robert-kennedy]]. Names: Edward Kennedy.'
- edit:
    id: cal.1968-07-30.elections-1968
    base: 29dbe002
    set:
      c: 'McCarthy''s news conference: Dzu''s trial and sentence "inexcusable," to be "immediately repudiated by the United States"; Humphrey, who said July 29 he knew of it only from the papers, "should further inform himself." His trip to Paris put off until after the Republican convention. Humphrey''s release of his delegates "an opening toward a freer and more open convention"; he has none to release: "Mine are pledged to me by law." In Newark and East Brunswick, N.J.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2107–08 (all but the delegates); [[w.cq-weekly-report]], Aug. 2, 1968, 2071 (Humphrey''s release of his delegates). Names: McCarthy, Humphrey, Trương Đình Dzu.'
- edit:
    id: cal.1968-07-24.elections-1968-3
    base: 1a1bdd34
    set:
      c: 'Daley endorses Edward Kennedy for Vice President; no choice yet for President. At his news conference: security forces adequate for the convention.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1995 (the endorsement); [[w.cq-weekly-report]], Aug. 2, 1968, 2069 (the news conference, security). Check: CQ adds a police spokesman''s "substantial number" of the city''s 11,900 police for the convention, and some 5,500 Guardsmen at "drills" in five armories (2069). Names: Daley, Kennedy.'
