      when: July 16
      date: '1968-07-16'
      thread: program
      c: 'Johnson on the postal commission''s report: "a sobering judgment"; the Postmaster General and the Budget Director to review it. Steed, of House Appropriations: "Congress will think for a long time before it turns the Post Office over to a corporation."'
      n: 'Statement by the President on the Report of the President''s Commission on Postal Organization, [1968–69 Pub. Papers 814](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=124) (July 16, 1968). [[w.cq-weekly-report]], Aug. 2, 1968, 2078 (Steed). See [[cal.1968-07-16.program]]. Names: Johnson, Steed.'
