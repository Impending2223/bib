      thread: conservation
      c: 'The Senate passes S. 3206 by voice vote: the Interior Secretary to contract to pay the federal share of waste treatment works in installments over as much as 30 years; federal standards for marine sanitation devices, from S. 2525; water pollution research extended a year. Muskie its floor manager; Proxmire on federal backing for tax-exempt securities.'
