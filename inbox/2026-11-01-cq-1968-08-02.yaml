      c: 'Chicago. Reuther and Fitzsimmons announce the Alliance for Labor Action, the Auto Workers, 1.6 million, and the Teamsters, 1.9 million: organizing, farm workers first, a strike fund, a guaranteed income, national health insurance; candidates backed "on a nonpartisan basis." Reuther: "a most historic agreement."'
      n: '[[w.cq-weekly-report]], Aug. 2, 1968, 2077–78. Names: Reuther.'
      tags:
      - name:reuther-walter
