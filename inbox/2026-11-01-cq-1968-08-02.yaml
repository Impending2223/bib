      c: 'The House passes H.R. 5117, the first stage of the Palmetto Bend reclamation project in Texas, [296–103](https://voteview.com/rollcall/RH0900385): a dam on the Navidad, $34,077,000. Aspinall: no appropriation for it "this year or next year or until the fiscal situation clears up."'
