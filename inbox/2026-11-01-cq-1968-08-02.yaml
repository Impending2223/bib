      when: July 16
      date: '1968-07-16'
      thread: program
      c: 'The President''s Commission on Postal Organization, Kappel chairman, reports: a government-owned corporation to run the mails, self-supporting, a nine-man board setting rates; postmasters and rural carriers out of patronage; savings of at least 20 percent, over $1 billion, in a few years.'
      n: '[[w.cq-weekly-report]], Aug. 2, 1968, 2078. See [[cal.1967-04-08.program]]. Names: Kappel.'
      tags:
      - name:kappel-frederick-r
- add:
    entry:
