      c: The Soviet ambassador Shcherbakov, at Moscow's request, tells Phạm Văn Đồng of Gromyko's talks with Johnson and Rusk during the U.N. session. By Shcherbakov's record Phạm welcomes the Soviet contacts with the U.S. but warns against illusions about American peace moves, rejects the reciprocity in Goldberg's statement, and denies Rusk's claim of contact with the DRV; he says Hanoi has no internal report of the Bình Định battle that the party paper described.
