      c: Moscow. Nasser, President of the United Arab Republic. Brezhnev, with Podgorny and Kosygin, meets him July 4, 2 to 5; negotiates with the UAR delegation in the Kremlin July 5, 10 to 12 and 6 to 10 p.m., Kosygin, Podgorny, Ponomarev, Gromyko and Grechko with him; July 6 from 11 a.m.; a talk July 10 at the Lenin Hills house. By the Soviet minutes of the July 6 session Nasser asks for ties like a socialist state's and recalls his offer of a defense agreement, which he says he did not mean at once; Brezhnev answers that a treaty would aggravate the Middle East and add nothing, and says the USSR sent 575 heavy aircraft with arms in 1967. The Soviets offer Grad-type rockets and armored personnel carriers, and discuss Arafat's visit to Moscow and the Egyptian army's lack of a political staff.
