- edit:
    id: cal.1965-07-13.china-leadership-2
    base: 4f467da1
    set:
      c: 'Zhou receives Lê Thanh Nghị, Vietnam''s deputy premier. Sympathy for Vietnam''s sacrifices in the war against American aggression; recites two lines of Mao''s poem "Returning to Shaoshan": "Where there is sacrifice there is high resolve; we dare make sun and moon shine in a new sky." By the Vietnamese report he also says the Soviet leaders are not sincere about aid, China will write Moscow listing conditions for a joint statement, and Mao advises asking for MiG-17s and 100,000 tons of explosives.'
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "China," Zhou Enlai''s points 1–9, "whom we met when our delegation was returning from the Soviet Union and the Eastern European countries"). [[w.zhou-enlai-nianpu-1949]], II, 743 (July 13, 1965); [[w.zhou-enlai-waijiao-huodong]], 467 (July 13, 1965; morning; Zhou receives Lê Thanh Nghị, Politburo member and deputy prime minister). Names: Zhou Enlai, Lê Thanh Nghị. Check: the report gives no day for Zhou''s talk; July 13 is the Nianpu''s.'
