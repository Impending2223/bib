      c: The Hungarian ambassador to the DPRK, József Kovács, reports what the Romanian and East German ambassadors told him of China's ambassador Hao Deqing's talk (a Soviet request for a base at Kunming, a surprise attack from Indochina to Korea, an agreement with the DPRK to open fire at Panmunjom) and what the Cuban ambassador says of a Chinese plan. He saw new anti-tank obstacles in the northern DMZ on May 12–14 and hears the Koreans are massing troops. He thinks the Chinese account may be disinformation.
      place: pyongyang
      n: '"[Hungarian Embassy in the DPRK, Report, 30 May 1965. Subject: On China''s war plans.](https://digitalarchive.umd.edu/document/121766)" (May 30, 1965), Hungarian National Archives (MOL), XIX-J-1-j China, 1965, 71. doboz, IV-40, 003661/RT/1965, trans. Balázs Szalontai, Wilson Center Digital Archive. It answers the ambassador''s ciphered telegrams of Apr. 24 and 26; the addressee is not given on the translation. Check: the year the Archive posted the document; its page gives none.'
