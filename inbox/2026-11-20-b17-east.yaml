      n: '"[Report from the Hungarian Embassy in Cario on Kosygin''s visit in the UAR](https://digitalarchive.umd.edu/document/122514)" (May 26, 1966), MOL XIX-J-1j SZU/IV-10/003348/1966 104.d., trans. András Bocz, Wilson Center Digital Archive. The report gives the visit''s dates and places (Cairo, Aswan, Alexandria) and not the day of each session; the place is the arrival''s, in Cairo. To check: the Soviet and Egyptian press and communiqué. Names: Kosygin, Nasser, Gromyko. Check: the day of each talk.'
