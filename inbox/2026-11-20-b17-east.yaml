      c: Kosygin visits the UAR, May 10–18, on Nasser's invitation, with Gromyko, the energy minister, the chairman of the foreign economic relations council and a deputy defense minister; three sessions of official talks, a joint communiqué on Vietnam, Palestine and disarmament. By the Soviet ambassador's account to the Hungarians, Kosygin asks the UAR for a firmer line on Vietnam, tells Nasser Israel cannot make a bomb, and the Soviet Union agrees to cut the military debt by about half.
