- edit:
    id: cal.1966-12-15.soviet-union-leadership
    base: ca49bbb5
    set:
      c: Moscow. Brezhnev in talks with a North Vietnamese delegation, Dec. 15, 4 to 8 p.m., Suslov, Podgorny, Kosygin, Andropov and Gromyko with him; and Dec. 16, 5 to 9 p.m., Kosygin and Andropov with him. By the Soviet record of Dec. 15 Lê Đức Thọ, for the DRV Politburo, reports four American strategic defeats in the South, the fighting in Tây Ninh, and the Polish channel to Lodge with its seven American points, ended by the bombing of Hanoi; Brezhnev tells him the CPSU plenum has voted all-round aid. By the record of Dec. 16 Lê Đức Thọ says the Politburo means to fight and negotiate together once the U.S. ends the bombing unconditionally and finally, with the four or five points as the DRV's terms; the Chinese and Koreans have been told, and he asks the Soviets to let the Americans know through some channel.
      n: '"[Record of a Conversation between CPSU CC General Secretary Cde. L. I. Brezhnev and Cde. Le Duc Tho, member of the Politburo and Secretary of the VWP CC](https://digitalarchive.umd.edu/document/177815)" (Dec. 15, 1966), RGANI, f. 80, op. 1, d. 521, ll. 29–80, trans. Gary Goldberg, contributed by Sergey Radchenko, Wilson Center Digital Archive (the first meeting; the record was not examined by the participants). "[Second Meeting: Record of a Conversation between CPSU CC General Secretary Cde. L. I. Brezhnev and Cde. Le Duc Tho, memeber of the Politburo and Secretary of the VWP CC](https://digitalarchive.umd.edu/document/177816)" (Dec. 16, 1966), RGANI, f. 80, op. 1, d. 521, ll. 29–80, trans. Gary Goldberg, contributed by Sergey Radchenko, Wilson Center Digital Archive (the second meeting). [[w.brezhnev-rabochie-i-dnevnikovye]], II, 162 (Dec. 15–16). Names: Brezhnev, Kosygin, Andropov. Check: the year the Archive posted the two records; the workbooks'' 2016 may be later.'
