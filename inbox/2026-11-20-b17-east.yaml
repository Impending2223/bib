      c: 'The Hungarian chargé in Cairo, Lajos Benczekovits, reports to the Foreign Ministry on Kosygin''s visit: a large and enthusiastic welcome, Nasser beside him throughout, which was not so for Khrushchev; he calls it a highly significant political event. The matters not made public, he says, come from the Soviet ambassador, and the private talks of Kosygin and Nasser, with Marshal Amer, are unknown to him.'
