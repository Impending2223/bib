      c: In Hungary, Deputy Premier Fock tells the DRV ambassador Hoàng Bảo Sơn that the Party and government are pleased with the talks and the aid agreement; military aid may rise by about two million rubles, long-term aid can be taken up in September or at the year's end, and two Politburo members will visit Hanoi, after Sept. 2 if Hanoi wishes.
