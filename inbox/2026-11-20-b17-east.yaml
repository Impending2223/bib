      c: 'Lê Thanh Nghị, Politburo member and deputy premier, reports to the Party on his delegation''s talks in eight socialist countries (24 copies; a handwritten note: an official copy of about twenty pages to be typed). All the leaders, he writes, agreed with the Party''s assessments and promised support; the Chinese pressed for sacrifice, aid by sea and a harder line on Moscow, the Soviets for a campaign to isolate the U.S. but little on a settlement, the North Koreans without reserve.'
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the opening and closing sections). The Archive prints the translation of a draft with handwritten additions and deletions; the original scan is in the Archive. Check: the day; the Archive gives the year alone, and the report names Zhou Enlai''s talk of July 13 as the last on the trip.'
