      c: 'In the Soviet Union, Lê Thanh Nghị''s delegation meets Brezhnev and Kosygin. By the Vietnamese report Brezhnev says the Presidium is unanimous in support, urges the Vietnamese to master the Soviet missiles to protect Hanoi, and says the USSR refused to carry an American letter on a week''s bombing halt; Kosygin calls Peng Zhen''s speech in Indonesia "a tremendous betrayal" and promises more guns and ammunition. A point struck from the report: Brezhnev asks about sending Soviet volunteers.'
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "Soviet Union," Brezhnev''s points 1–13, Kosygin''s 1–11). A handwritten note on the draft drops the original point 4, on volunteers and military specialists, to which Lê Thanh Nghị says he replied only that he would put the question to the Politburo. See [[cal.1965.vietnam-hanoi]]. To check: [[w.brezhnev-rabochie-i-dnevnikovye]]. Names: Brezhnev, Kosygin, Peng Zhen. Check: the day; the report dates none of its meetings.'
      src:
        c: f738ce3f
        rows:
        - 'https://digitalarchive.umd.edu/document/134601: all'
      tags:
      - polity:ussr
