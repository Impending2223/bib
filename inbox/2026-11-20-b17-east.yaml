      c: 'Pitsunda. Khrushchev and Hồ Chí Minh meet again, at Hồ''s request. By the Soviet record Hồ is to pass Albania''s chargé three terms (the four submarines returned, no Soviet base demanded, a delegation with authority), and Khrushchev says Shehu or Hoxha must come. Hồ reports on the South''s peasants and on Laos (the Pathet Lao''s army, 10,000 or 20,000); Khrushchev: arm Souvanna Phouma first, not Souphanouvong; his visit to the DRV is put off.'
      place: pitsunda
      n: '"[Record of Conversations between Cde. N. S. Khrushchev, First Secretary of the CPSU CC, and Ho Chi Minh, Chairman of the CC of the VWP](https://digitalarchive.umd.edu/document/300879)" (Aug. 17 and 19, 1961), RGANI, f. 52, op. 1, d. 555, ll. 125–150, trans. Gary Goldberg, Wilson Center Digital Archive. The second talk in the document, headed Pitsunda, Aug. 19; recorded by M. Podolsky and Yu. Pankov. See [[cal.1961-08-17.soviet-union-leadership]]. Names: Khrushchev, Hồ Chí Minh, Souvanna Phouma, Souphanouvong.'
