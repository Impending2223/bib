      c: In Poland, Ochab, for Gomułka, who is ill, tells Lê Thanh Nghị's delegation that Poland stands with Vietnam, asks what Poland can do to start talks, and asks what the Vietnamese make of a Chinese article saying the 17th Parallel no longer exists. By the Vietnamese report he is careful not to criticize China as Kirilenko did.
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "Poland"). See [[cal.1965.vietnam-hanoi]]. Names: Ochab, Gomułka, Kirilenko. Check: the day; the report dates none of its meetings.'
