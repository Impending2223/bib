      c: The Kremlin. Khrushchev receives Phạm Văn Đồng again; Orlov and Tovmasyan sit in, and Lê Thanh Nghị with Phạm. By the Soviet record Phạm reports on the plenums coming, on the South (a map of the liberation forces; an uprising and a neutral government when the moment comes) and on Laos (DRV aid to Souvanna Phouma and the Pathet Lao; he asks the USSR to take a share). Khrushchev agrees to study a share; on China he says the communes are given up in all but name; he hands over the draft CPSU program.
      place: moscow
      n: '"[Record of Conversation between N.S. Khrushchev and Pham Van Dong](https://digitalarchive.umd.edu/document/300878)" (July 3, 1961), RGANI, f. 52, op. 1, d. 555, ll. 111–124, trans. Gary Goldberg, Wilson Center Digital Archive. Secret no. 1; recorded by A. I. Glukhov, typed July 4, 1961; a handwritten line says Khrushchev did not review the record. Names: Khrushchev, Phạm Văn Đồng. Check: the year the Archive posted the document; its page gives none.'
