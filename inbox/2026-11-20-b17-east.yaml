- edit:
    id: cal.1964-10-09.china-leadership
    base: bf51ff16
    set:
      c: 'Mao, Diaoyutai guesthouse, afternoon: receives an Albanian Party and government delegation under Balluku; Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing present. Revisionists and imperialists both split, a revolutionary situation favorable to China; Europe to be drawn against the U.S., Japan too. Khrushchev bullies the weak and fears the strong. For Sino-Soviet border talks, China wants a reasonable frontier and a treaty. By the Albanian record Mao also asks whether Khrushchev could seize Xinjiang, Heilongjiang and Inner Mongolia, and says articles against the revisionists begin the next day; Peng Zhen: the radio broadcasts them that night.'
      src:
        c: 11e440dd
        rows:
        - 'w.zedong-mao-zedong-nianpu V, Oct. 9, 1964: A-F'
        - 'w.zhou-enlai-waijiao-huodong 422: A-B'
        - 'w.shaoqi-liu-shaoqi-nianpu-chronology II, 606: A, B'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 359: A-B'
        - 'w.lengxi-shinian-lunzhan-1956-1966 825–826: A, C'
        - 'w.deng-xiaoping-nianpu-1904 III, 1830: A-B'
        - 'https://digitalarchive.umd.edu/document/300025: A, C-H'
      n: '"[Conversation between Comrade Beqir Balluku and Comrade Mao Zedong on 9 October 1964](https://digitalarchive.umd.edu/document/300025)" (Oct. 9, 1964), Arkivi Qendror Shtetëror (Central State Archives, Tirana, Albania), Fondi 14/AP, Marrëdhëniet me Partinë Komuniste të Kinës, V. 1964, Dos. 38, Fl. 1–7, trans. Elidor Mëhilli, Wilson Center Digital Archive (the Albanian record of the talk: it names Mao, Zhou Enlai, Peng Zhen and Deng Xiaoping as speaking and gives no hour). [[w.zedong-mao-zedong-nianpu]], V, Oct. 9, 1964. [[w.zhou-enlai-waijiao-huodong]], 422 (Oct. 9, 1964; 晚6时; Zhou with Mao and Liu Shaoqi, Diaoyutai Building 12); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 606 (Oct. 9, 1964; Liu, with Mao, Dong Biwu, Zhu De, Zhou Enlai and Deng Xiaoping, receives Beqir Balluku, Politburo member, First Vice-Chairman of the Council of Ministers and Minister of Defense of Albania); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 359 (Sept. 26–Oct. 13, 1964; Balluku''s delegation; Mao, Liu Shaoqi, Zhu De, Zhou and other leaders receive it, the day not given); [[w.lengxi-shinian-lunzhan-1956-1966]], 825–826 (Oct. 9, Balluku''s delegation; Mao: Khrushchev''s peak the 22nd Congress, since then downhill; his collapse may come from the meeting; the opposite camp divides); [[w.deng-xiaoping-nianpu-1904]], III, 1830 (Oct. 9, 1964; Deng with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Peng Zhen and He Long accompanies Mao in meeting Baluku''s party). Made public: 1993. Names: Mao Zedong, Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping, Peng Zhen, He Long, Luo Ruiqing, Khrushchev, Balluku.'
