- edit:
    id: cal.1965-06-03.china-leadership-4
    base: fd03b406
    set:
      c: Liu Shaoqi receives Lê Thanh Nghị (黎清毅), Politburo member of the Vietnam Workers' Party and Deputy Premier; he says the Chinese people will do their utmost to support the fraternal Vietnamese people's just struggle against the Americans and for national salvation. By the Vietnamese report he also says China cannot supply trucks, steel or explosives in quantity, so the Vietnamese should ask the Soviet Union and Eastern Europe for them, and tells them to build small dispersed plants in the mountains.
      n: '"[Lê Thanh Nghị, ''Report on Meetings with Party Leaders of Eight Socialist Countries''](https://digitalarchive.umd.edu/document/134601)" (1965), 8058 – "Báo cáo của Phó Thủ tướng Lê Thanh Nghị về việc gặp các đồng chí lãnh đạo của Đảng và Nhà nước 8 nước xã hội chủ nghĩa năm 1965," Phủ Thủ tướng, Vietnam National Archives Center 3 (Hanoi), trans. Merle Pribbenow, obtained by Pierre Asselin, Wilson Center Digital Archive (the section "China," Liu Shaoqi''s points 1–4). [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 621 (June 3, 1965). Made public: 1996. Names: Liu Shaoqi. Check: the Vietnamese form of 黎清毅 (Lê Thanh Nghị). Check: the report does not date the talk; the Nianpu''s June 3 is taken.'
