- edit:
    id: cal.1966-03-12.china-leadership-2
    base: d6062565
    kind: correct
    set:
      c: 'Zhou Enlai writes Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian and Kang Sheng: he goes this noon to Tianjin for the North China Bureau meeting on five questions (war preparation,
        the small Third Front, drought, passing the grain test, study of Mao''s works), about five days; he plans a month of investigation and study in Hebei and Peking. He leaves arrangements
        on foreign affairs, defence, the Military Commission, the Secretariat and the State Council, and reports to Mao.'
      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 20 (Mar. 12, 1966); [[w.peng-zhen-nianpu-1902]], IV, 473 (Mar. 12, 1966; Zhou''s letter to Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian
        and Kang Sheng: to Tianjin at noon for the North China Bureau''s meeting, five days, on war readiness, the small third front, drought, grain and Mao''s works, then a month''s
        inquiry in Hebei and Peking; while Liu, Chen Yi and others are abroad, foreign and defense work in Peng Zhen''s charge; "when I am needed in Peking, let Comrade Peng Zhen telephone
        me"). Made public: 2012 ([[w.peng-zhen-nianpu-1902]]). Split under R25b and R17: the nianpu (III, 20) gives the departure its own hour, 十二时半; it is now an entry. Names: Zhou
        Enlai, Liu Shaoqi, Peng Zhen, Chen Yi, Li Xiannian, Kang Sheng, Mao Zedong.'
