- edit:
    id: cal.1966-06-10.china-leadership-2
    base: d5d2038d
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 10, 1966 (晚上, at Hangzhou, the enlarged Standing Committee meeting; 不一定派工作组; on the timing of work groups the nianpu has Mao again under
        June 12, afternoon); [[w.deng-xiaoping-nianpu-1904]], III, 1918–1919 (June 10–22, 1966; Deng at the enlarged Politburo Standing Committee meeting Mao holds, which studies questions
        of the ''cultural revolution'' but gives no concrete view on how to carry on the movement; on work teams Mao says they need not be sent, let go, do not fear disorder, let it
        be a free-for-all and send them once the situation is clear; Deng and Liu Shaoqi ask Mao to return to Peking to preside over the work, and Mao entrusts Liu and Deng to deal with
        the movement''s questions as occasion allows); [[w.mao-zedong-zhuan]], VI, ch. 74 n.47 (the book has Mao calling the heads of the great regions to Hangzhou for this talk: hands
        off, no fear of disorder, the poster has lit the fire, the left active and the right resisting but not prevailing, a wide blow first and sorting later, a left core to be built
        in the movement regardless of rank or name; no work teams necessarily; the diary of Wang Renzhong, June 11, n.47; evening not given). [[w.yang-jisheng-tiandi-fanfu]], I, 197,
        186 (June 10 6月10日, at the Hangzhou enlarged Standing Committee meeting, Mao: on the cultural revolution let go, do not fear disorder, work groups not necessarily to be sent
        (I, 197); the fuller words, the Peking University poster that lit the fire and the activists to rely on, the page also sets at the meeting the leaders flew to on June 9 (I, 186));
        [[w.jian-zhou-enlai]], 545–546 (Mao: no fear of chaos, mobilize the masses all out; work teams probably not needed "until the dust has settled"; Liu asks him again to return
        to Peking, and he says "no"; not the day); [[w.pu-weihua-zalan-jiu-shijie]], 255, 255 n.111 (Mao at the enlarged Standing Committee at Hangzhou: students from all over the country
        who want to come to Peking should be allowed, free of charge; "let them make a racket in Peking" (Wang Nianyi, 77)). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003),
        by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). The order: after [[cal.1966-06-10.china-leadership]], the printed order alone ([[w.zedong-mao-zedong-nianpu]],
        V, June 10, 1966). To check: Wang Renzhong 王任重, diary 日记, June 11, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.47); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 641
        (cited by [[w.jian-zhou-enlai]], 546 n.5b). Names: Mao Zedong.'
      time_range:
      - 1966-06-10T11:00Z
      - 1966-06-10T14:00Z
      time_band: evening
      time_zone: Asia/Shanghai
      range_basis: record
