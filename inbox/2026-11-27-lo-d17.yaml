- edit:
    id: cal.1966-04-14.china-leadership-2
    base: 596cf089
    kind: correct
    set:
      c: 'Mao revises, again and again to month''s end, the Center''s notice withdrawing the Five-Man Group''s Outline, from drafts of Zhou Enlai, Deng Xiaoping and Peng Zhen.{1} The
        text becomes the May 16 Circular.{3} The drafting group is Chen Boda head, with Kang Sheng, Jiang Qing, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Wu Lengxi, Yin Da, Mu Xin
        and Chen Yading; each draft goes to Hangzhou, is revised by Mao and sent back, seven times from Apr. 14 to the month''s end.{4} His first note that morning, to Zhou, Deng, Peng
        Zhen and Kang Sheng: "some revisions, please consider."{5}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Apr. 14, 17–30, 1966 (the entry "4月14日、17日至月底"). [[w.jianguo-yilai-mao-zedong]], XVIII, 246–253 (Apr. 14, 1966; Mao''s notes of the morning
        of Apr. 14: to Zhou Enlai, Deng Xiaoping, Peng Zhen and Kang Sheng, "some revisions, please consider"; at 9 a.m., to Zhou, Deng and Peng 彭真, their letter of Apr. 12 with its
        enclosure received, Kang and Chen and the drafting group to go to Shanghai, then to him the night of the 16th or the morning of the 17th, the three to come on the 16th, whether
        the Center bureaus send men theirs to decide; his insertions, items 5–11 (on no equality between proletariat and bourgeoisie; the bourgeois representatives in Party, government
        and army, some trusted and groomed as successors "like Khrushchev," sleeping beside us); note 1: the notice adopted May 16 by the enlarged Politburo, printed in *Renmin ribao*
        May 17, 1967; note 2: Deng then with Mao at Hangzhou); [[w.macfarquhar-origins-of-the-cultural]], III, 458 (Mao revises the condemnation seven times; it goes out as the May 16
        notification); [[w.mao-zedong-zhuan]], VI, ch. 74 (the notice drafted by Chen Boda is sent Apr. 14 to Mao at Hangzhou; Mao revises it three times, on the 14th and 17th, and makes
        small changes in the draft on the 27th; the passages he adds; it becomes the Circular of May 16). [[w.peng-zhen-nianpu-1902]], IV, 481 (Apr. 14, 1966, morning; Mao makes "some
        changes" in Chen Boda''s draft of the 12th, "to Enlai, Xiaoping, Peng Zhen and Kang Sheng" to weigh); [[w.pu-weihua-zalan-jiu-shijie]], 69 (Mao, not content with a technical
        notice, wants a political one; Kang Sheng, Chen Boda and the drafting group to go to Shanghai and draft it with Jiang Qing and Zhang Chunqiao; the group, Chen Boda its head,
        Kang Sheng, Jiang Qing, Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu, Wu Lengxi, Yin Da, Mu Xin and Chen Yading; each draft sent to Hangzhou, revised by Mao and sent back, seven
        times from Apr. 14 to the month''s end); [[w.pu-weihua-zalan-jiu-shijie]], 69; [[w.jianguo-yilai-mao-zedong]], XVIII, 246–47. Made public: 1989 ([[w.jin-1949-1989-niande-zhongguo]]).
        To check: Central Committee, draft notice withdrawing the Five-Man Group''s Outline (draft of Apr. 12, 1966), sent from Peking by Zhou Enlai, Deng Xiaoping and Peng Zhen with
        their letter of Apr. 12 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 252 n.2); [[w.jin-1949-1989-niande-zhongguo]], 623–5 (cited by [[w.macfarquhar-origins-of-the-cultural]],
        III, 458 n.154). See [[cal.1966-02-12.china-leadership-2]]. Split under R25b and R17: the Mao nianpu (V, Apr. 14) gives the note to Jiang Qing its own hour, 8:30 a.m.; it is
        now an entry, and the letter of 9 a.m. is another. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Peng Zhen, Jiang Qing, Kang Sheng, Chen Boda, Zhang Chunqiao, Wang Li, Guan Feng,
        Qi Benyu, Wu Lengxi, Yin Da, Mu Xin, Chen Yading.'
