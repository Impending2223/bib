    base: '20243140'
    set:
      n: '[[w.garrow-bearing-the-cross]], 475–78; [[w.branch-at-canaans-edge]], 476–78 (twenty-one marchers; troopers shove them from the pavement; the night rally at Centenary Methodist,
        Memphis, McKissick and Evers; the Lorraine Motel debate; Wilkins: "Dr. King, I''m really sorry for you"); [[w.kotz-judgment-days]], 360 (McKissick, Carmichael, Evers, Wilkins
        and Young; King: "We are going to put President Johnson on the spot"); [[w.young-easy-burden]], 394. To check: [Manifesto of the James Meredith March for Freedom in Mississippi](https://okra.stanford.edu/link/document660608-001),
        June 7–8, 1966; King, [Address at Meredith March rally](https://okra.stanford.edu/link/document660607-002), June 7 (King Papers Project); *Memphis Commercial Appeal*, June 8,
        1966, at 1; *Washington Post*, June 8, 1966, at A1; [*New York Times*, June 8, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/08/issue.html), at 1 (cited by [[w.garrow-bearing-the-cross]],
        475 n.1); Wilkins to Convention Delegates, July 5, 1966, NAACP Papers, III-B-374, Library of Congress (cited by [[w.garrow-bearing-the-cross]], 477 n.2); *Washington Post*, June
        8, 1966, at A1, 12; [*New York Times*, June 9, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/09/issue.html), at 1, 32; *Memphis Commercial Appeal*, June 9, 1966,
        at 1; James Draper to Roger Wilkins et al., "Memphis," June 8, 1966, Community Relations Service FOIA (cited by [[w.garrow-bearing-the-cross]], 478 n.3); Int. James Lawson, Nov.
        14, 1983 (Branch) (cited by [[w.branch-at-canaans-edge]], 476); Sellers, River (cited by [[w.branch-at-canaans-edge]], 477); p161 (cited by [[w.branch-at-canaans-edge]], 477);
        "Troopers Shove Group Resuming Meredith March," [*New York Times*, June 8, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/08/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]],
        477); [[w.carmichael-ready-for-revolution]], 503 (cited by [[w.branch-at-canaans-edge]], 477); [*New York Times*, June 8, 1966](https://timesmachine.nytimes.com/timesmachine/1966/06/08/issue.html),
        at 1 (cited by [[w.branch-at-canaans-edge]], 477); *Jet*, June 23, 1966, at 16–20 (cited by [[w.branch-at-canaans-edge]], 477); Lewis, *King* (1978), 319–20 (cited by [[w.branch-at-canaans-edge]],
        477); King speech at Meredith rally, June 7, 1966, A/KS (cited by [[w.branch-at-canaans-edge]], 477); [[w.dittmer-local-people]], 392–93 (cited by [[w.branch-at-canaans-edge]],
