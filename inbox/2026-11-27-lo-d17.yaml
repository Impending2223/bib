- edit:
    id: cal.1966-03-18.china-leadership
    base: 0ee1154b
    kind: correct
    settles:
    - 'Check: the Peng Zhen chronology, IV, 473, gives no part of the day'
    set:
      c: 'Hangzhou. Mao presides over the enlarged Standing Committee meeting and speaks.{1} On the Party''s past: it has lived through many dangers; its heirs must change as well as
        inherit.{2} On the academic criticism: a batch, Jian Bozan, Hou Wailu and others, should be brought down, and that is not too many;{3} the Party has many hesitaters.{4} Mao Zedong
        Thought as "highest and liveliest," "peak": not to be said.{5} The 23rd Congress: not to go, no greetings telegram, simply tell them; Nov. 7 greetings stay; the mass bodies (women''s,
        youth, student, trade-union federations, peace congress) case by case.{6} To Wu Lengxi at the close: the *Renmin ribao* printed muck, promoted ghost plays and praised Hai Rui;{7}
        learn from it.{8} Mao does not read the *Renmin ribao*, as Chiang Kai-shek did not read his *Zhongyang ribao*: nothing in it; its editors print a third or a quarter Marxism;
        Wu Lengxi half a Marxist; no paper is without errors.{10}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Mar. 18, 1966. [[w.lengxi-shinian-lunzhan-1956-1966]], 937–939 (the afternoon of Mar. 18, at the Liu villa on the southwest shore of West
        Lake; Liu and Zhou present, Deng away; Peng Zhen, Kang Sheng, Chen Boda and Wu sitting in; the bureaus'' secretaries not at this session; Mao: going to the 23rd Congress would
        put China among the middle parties; no greetings telegram, only a notice; Albania, Korea and Vietnam may be told; the Nov. 7 greetings as before; the mass organizations case
        by case; Peng Zhen to have the Liaison Department tell the Soviet ambassador; the last Standing Committee Wu attended); [[w.macfarquhar-origins-of-the-cultural]], III, 456 (Mao
        calls the *People''s Daily* semi-Marxist); [[w.mao-zedong-zhuan]], VI, ch. 74 nn.28–31 (Mar. 18: on ''highest and liveliest'' in speaking of Mao Zedong Thought, ''don''t put
        it that way'', and no ''peak'', n.28; and, n.29, that a batch more should be brought down, Jian Bozan 翦伯赞, Hou Wailu 侯外庐 and the like, ''not too many''; at a small meeting during
        the Hangzhou meeting, the day not given, Mao reproaches the *Renmin ribao* for much muck, for backing ghost plays and for praising Hai Rui, and Wu Lengxi 吴冷西, its head, as half
        a Marxist, n.31; Wang Renzhong''s diary has him on Cao Cao 曹操 and Sima Yi 司马懿, who decided on the moment, n.30). [[w.peng-zhen-nianpu-1902]], IV, 473 (Mar. 17–20, 1966; the 18th''s
        session; Peng Zhen there; Mao: not "highest and most living" Mao Zedong Thought, nor "the summit"; he said at the end of the work conference last autumn that some in Peking would
        rebel, then rebel, would the whole army follow?; on academic criticism: Jian Bozan, Hou Wailu 侯外庐 and their like better overthrown, bourgeois, the emperors-and-ministers school);
        [[w.jian-zhou-enlai]], 534 (Mao rejects the leaders'' decision: the Soviets meet amid great troubles at home and abroad; "We should not go there. We should not leave them with
        any illusions. There is no need for us to even send them a congratulatory telegram. We only need to tell them that we are not coming"; not the day); [[w.pu-weihua-zalan-jiu-shijie]],
        65 (at a small meeting, the day not given: the *Renmin ribao* printed much muck, promoted ghost plays and praised Hai Rui; like Chiang Kai-shek with his *Zhongyang ribao*, Mao
        does not read it, nothing in it; its *Xueshu yanjiu* was his idea; Wu Lengxi half a Marxist; its editors print only a third or a quarter Marxism; no paper is without errors;
        to learn from them, correct them); [[w.peng-zhen-nianpu-1902]], IV, 475 (Mar. 18, 1966: 上午, Peng at the enlarged Standing Committee meeting; 下午, a talk with Chen Boda; 晚, a meeting
        at Mao''s); [[w.liu-jixian-ye-jianying-nianpu]], II, 935 (Mar. 18–20, 1966; Mao''s enlarged Politburo Standing Committee at Hangzhou 杭州: the academic and educational worlds "in
        fact held by the bourgeoisie and petty bourgeoisie"; planning powers to go down, the Center to manage the general, not the particular); [[w.pu-weihua-zalan-jiu-shijie]], 65.
        Made public: 1997 ([[w.macfarquhar-origins-of-the-cultural]]). The Peng Zhen chronology gives the enlarged meeting the morning (IV, 475); Wu Lengxi (937) dates the Liu villa
        session to the afternoon, and that session is its own entry. Check: Wu Lengxi (937–39) puts Mao''s words on the 23rd Congress at that afternoon session; the Mao nianpu gives
        them under the day''s meeting. To check: Mao Zedong 毛泽东, speech at the enlarged meeting of the Politburo Standing Committee 中共中央政治局常委扩大会议 (record 讲话记录), Mar. 18, 1966 (cited
        by [[w.mao-zedong-zhuan]], VI, ch. 74 n.28); Mao Zedong 毛泽东, interjections at the Hangzhou meeting 杭州会议 (record 插话记录), Mar. 18, 19 and 20 (the note prints 1965) (cited by [[w.mao-zedong-zhuan]],
        VI, ch. 74 n.29); [[w.lengxi-yi-mao-zhuxi-remembering]], 152 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.31); [[w.yan-mingfu-huiyilu]], II, 885–887 (cited by [[w.jian-zhou-enlai]],
        534 n.68c). Split under R25b and R17: Wu Lengxi (937) dates the Liu villa session of the 18th to the afternoon; it is now an entry. Names: Mao Zedong, Wu Lengxi, Jian Bozan,
        Hou Wailu, Peng Zhen, Kang Sheng, Chen Boda, Chiang Kai-shek.'
      src:
        c: 8e9a7490
        rows:
        - 'w.zedong-mao-zedong-nianpu V, Mar. 18, 1966: 1, 2, 3, 4, 5, 6, 7, 8'
        - 'w.lengxi-shinian-lunzhan-1956-1966 937–939: 1, 6'
        - 'w.macfarquhar-origins-of-the-cultural III, 456: 7'
        - 'w.mao-zedong-zhuan VI, ch. 74 nn.28–31: 3, 5'
        - 'via w.mao-zedong-zhuan VI, ch.74 n.28: 5'
        - 'via w.mao-zedong-zhuan VI, ch.74 n.29: 3'
        - 'w.peng-zhen-nianpu-1902 IV, 473: 3, 5'
        - 'w.jian-zhou-enlai 534: ?'
        - 'w.liu-jixian-ye-jianying-nianpu II, 935: ?'
        - 'w.pu-weihua-zalan-jiu-shijie 65: 8, 10'
        - 'w.peng-zhen-nianpu-1902 IV, 475: 1'
