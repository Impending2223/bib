- edit:
    id: cal.1966-06-16.china-leadership
    base: fcfdf326
    kind: correct
    set:
      c: 'Mao, Changsha, late at night, on the Foreign Ministry''s plan for Zhou Enlai''s party and government delegation to Romania (talks on the international situation, Sino-Soviet
        relations, Sino-Romanian relations): "agreed in principle; Liu and Deng to settle it."{1} He had agreed by telephone, June 6, to the trip of a week from June 16.{2}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, June 6 and June 16, 1966 (the entries of those dates); [[w.zhou-enlai-nianpu-1949-2020]], III, 37 (June 16–24, 1966; the delegation to Romania);
        [[w.jianguo-yilai-mao-zedong]], XVIII, 275 (June 16, 1966; Mao''s note, 11 p.m. June 16, "Proposed to agree; Liu and Deng to settle it," on the Foreign Ministry''s report of
        that day with the plan of activities and talks); [[w.jian-zhou-enlai]], 546 (back in Peking Zhou prepares the twice-postponed visit to Romania and Albania, glad to be away; Mao
        approves his plan). Made public: 2013. To check: Foreign Ministry, report of June 16, 1966 on the activities and talks of Zhou Enlai''s party and government delegation to Romania
        (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 275 n.1). The Mao nianpu (V, June 16) gives the note on the Romanian trip at 11 p.m., at Changsha; the talk on the train at Nanchang
        is its own entry, already in the calendar. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping.'
      time: 1966-06-16T15:00Z
      time_zone: Asia/Shanghai
