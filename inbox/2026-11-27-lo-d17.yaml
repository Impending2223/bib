      c: 'Hangzhou, the Liu villa on the southwest shore of West Lake. Mao holds a Standing Committee meeting in the afternoon: Liu Shaoqi and Zhou Enlai there, Deng away; Peng Zhen,
        Kang Sheng, Chen Boda and Wu Lengxi sitting in; the bureaus'' secretaries not at this session. All agree with Mao; Peng Zhen explains that the second telephone report to him
        was only another idea for his reference, the Standing Committee in Peking having no settled view. Decided: the Party sends no delegation to the 23rd Congress; Peng Zhen to have
        the Liaison Department tell the Soviet embassy.'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 937–939 (3月18日下午, 刘庄别墅; Liu and Zhou at the meeting, Deng away on inspection; Peng Zhen, Kang Sheng, Chen Boda and Wu sitting in; the
        bureaus'' secretaries not at it; at the small session all agree with Mao; Peng Zhen explains that the second telephone report was another idea for the Chairman''s reference;
        the decision: no delegation, Peng Zhen to have the Liaison Department tell the Soviet embassy). Made public: 1999. Check: the part of the day. The Peng Zhen chronology has Peng
        talk with Chen Boda in the afternoon and go to a meeting at Mao''s in the evening ([[w.peng-zhen-nianpu-1902]], IV, 475). See [[cal.1966-03-18.china-leadership]]. Names: Mao
        Zedong, Liu Shaoqi, Zhou Enlai, Peng Zhen, Kang Sheng, Chen Boda, Wu Lengxi.'
