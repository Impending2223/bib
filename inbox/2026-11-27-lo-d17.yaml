- edit:
    id: cal.1966-03-01.vietnam
    base: 4cfd8133
    kind: correct
    set:
      c: 'The war''s supplemental authorization.{1} The Senate tables Morse''s amendment to repeal the Southeast Asia resolution of Aug. 1964, [92–5](https://voteview.com/rollcall/RS0890270):
        Morse, Gruening, Fulbright, McCarthy, Young of Ohio the five.{2} Gruening''s, to keep draftees from Southeast Asia''s combat areas without Congress''s consent, tabled [94–2](https://voteview.com/rollcall/RS0890271).{3}
        The authorization, $4.8 billion for aircraft, missiles, and construction, passes, [93–2](https://voteview.com/rollcall/RS0890272).{4}'
      n: 'The vote to table: [112 Cong. Rec. 4404](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82) (1966) (Senate, Mar. 1, 1966). [[w.mann-grand-delusion]],
        504–05 (Johnson to Mansfield; the votes); [[w.branch-at-canaans-edge]], 451; [[w.woods-fulbright]], 410 ($4.8 billion; two weeks before the Senate, thirty-five Senators speaking
        against the war or its tactics). [[w.rusk-as-i-saw-it-1990]], 501, 546 (only five against tabling). The Senate sat from noon to 6:33 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=1),
        [D74](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=72). Check: the pages of the other votes. [FRUS 1964–68, IV, doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v04/d87)
        (Johnson to Mansfield by telephone, 9:42 a.m.: the motion to table must not "imply any dilution" of the resolution). [[w.gibbons-u-s-government-and]], IV, 251–59. Check: Branch
        dates the vote Mar. 2. After the debate on Morse''s amendment (the Record) and Ball''s lunch with the four Senators, before the vote by Gibbons''s account. After [[cal.1966-03-01.vietnam-congress|Fulbright''s
        speech]] too: the Record prints it at 4379–84 and the vote to table at 4403–04. To check: [[w.berman-william-fulbright-and-the]]; [[w.evans-lyndon-b-johnson]], 597 (cited by
        [[w.branch-at-canaans-edge]], 451). See [[cal.1966-01-19.vietnam]]; [[cal.1966-02-04.vietnam]]. Split under R25b and R17: the Record prints the House''s vote (4474, Roll No.
        26) apart from the Senate''s; it is now an entry. Names: Morse, Gruening, Fulbright, McCarthy, Young.'
      src:
        c: 868da31d
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf#page=82: 1, 2, 3, 4'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d87: 1, 2, 3, 4'
        - 'w.gibbons-u-s-government-and IV, 251–59: 1, 2, 3, 4'
        - 'via w.gibbons-u-s-government-and IV, 258 n.126: 2'
        - 'https://voteview.com/rollcall/RS0890270: 2'
        - 'https://voteview.com/rollcall/RS0890271: 3'
        - 'https://voteview.com/rollcall/RS0890272: 4'
        - 'w.mann-grand-delusion 504–05: 2, 4'
        - 'via w.mann-grand-delusion 505 n.22: 2'
        - 'w.rusk-as-i-saw-it-1990 501: 2'
        - 'w.rusk-as-i-saw-it-1990 546: 2'
