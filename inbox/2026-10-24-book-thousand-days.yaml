- add:
    entry:
      id: cal.1960-11-14.transition-and-staff-2
      when: Nov. 14
      date: '1960-11-14'
      thread: transition-and-staff
      c: 'Palm Beach, at breakfast. Sharon hands Kennedy the foreign policy report Stevenson undertook, drafted by Ball: first the gold drain, the NATO deterrent, disarmament, Berlin, the OECD; then trade, aid, arms control; task forces for Latin America and Africa proposed. Kennedy reads the first part: "Just what I needed."'
      n: '[[w.schlesinger-thousand-days-1965]], 155–57, from Sharon''s report to Stevenson. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Stevenson, Ball.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:ball-george-w
- add:
    entry:
      id: cal.1960-11-21.transition-and-staff
      when: Nov. 21
      date: '1960-11-21'
      thread: transition-and-staff
      c: 'Palm Beach. Clifford and Neustadt report on the transition to the President-elect and his staff. Neustadt, seen alone after dinner: few imperatives in the Presidency; gives him *Presidential Power*. Kennedy, before dinner: "People, people, people! I don''t know any people."'
      n: '[[w.schlesinger-thousand-days-1965]], 125–27; the remark as Neustadt recalls it. See [[cal.1960-11-09.transition-and-staff]]. Names: Clifford, Neustadt, Kennedy.'
      tags:
      - name:clifford-clark
      - name:neustadt-richard-e
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-11-22.transition-and-staff
      when: Nov. 22
      date: '1960-11-22'
      thread: transition-and-staff
      c: 'Gore to Kennedy: the Treasury the key to his presidency. Against Dillon or another conservative Republican there: "a signal that you had given up the goals of a truly Democratic Administration."'
      n: '[[w.schlesinger-thousand-days-1965]], 134–35. See [[cal.1960-11-09.transition-and-staff]]. Names: Gore, Kennedy, Dillon.'
      tags:
      - name:gore-albert-sr
      - name:kennedy-john-f
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1960-11-23.transition-and-staff
      when: Nov. 23
      date: '1960-11-23'
      thread: transition-and-staff
      c: 'Kennedy by telephone to Sharon: task forces on Latin America, Africa, USIA and foreign economic policy, not to be coordinated with Nitze. A longer list, dictated Nov. 18 as a letter to Sharon, not sent.'
      n: '[[w.schlesinger-thousand-days-1965]], 157–60. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Nitze.'
      tags:
      - name:kennedy-john-f
      - name:nitze-paul
- add:
    entry:
      id: cal.1960-12-01.transition-and-staff-2
      when: Dec. 1
      date: '1960-12-01'
      thread: transition-and-staff-cabinet
      c: Schlesinger with the President-elect at noon, his Senate office, then Georgetown, by Schlesinger's account. Hodges and Ribicoff settled; Udall and Goldberg nearly. Fulbright the likeliest for State. Kennedy asks after Stevenson for Attorney General; Blair sounds Stevenson out that night, who prefers the UN. Lovett to lunch.
      n: '[[w.schlesinger-thousand-days-1965]], 129–31, 135, 139. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-12-01.transition-and-staff]]. Names: Schlesinger, Kennedy, Hodges, Ribicoff, Udall, Goldberg, Fulbright, Stevenson, Blair, Lovett.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:hodges-luther-h
      - name:ribicoff-abraham
      - name:udall-stewart-l
      - name:goldberg-arthur-j
      - name:fulbright-j-william
      - name:stevenson-adlai-e
      - name:blair-william-m-jr
      - name:lovett-robert-a
- add:
    entry:
      id: cal.1960-12-08.transition-and-staff
      when: Dec. 8
      date: '1960-12-08'
      thread: transition-and-staff-cabinet
      c: Rusk and Kennedy meet for the first time. Kennedy speaks of Rusk's *Foreign Affairs* article, "The President," and not of the post; Rusk leaves thinking it came to nothing.
      n: '[[w.schlesinger-thousand-days-1965]], 140–41. See [[cal.1960-12-01.transition-and-staff]]. Names: Rusk, Kennedy.'
      tags:
      - name:rusk-dean
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-12-09.transition-and-staff
      when: Dec. 9
      date: '1960-12-09'
      thread: transition-and-staff-cabinet
      c: Kennedy offers Rusk the State Department, the day after their first meeting.
      n: '[[w.schlesinger-thousand-days-1965]], 141. See [[cal.1960-12-08.transition-and-staff]]. Names: Kennedy, Rusk.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1960-12-15.transition-and-staff
      when: Dec. 15
      date: '1960-12-15'
      thread: transition-and-staff
      also:
      - robert-kennedy
      c: 'Robert Kennedy at lunch with Schlesinger, the day before his own appointment is announced: the White House staff to be widened beyond the Senate and campaign men; Dutton recruited. Proposes Schlesinger as a Special Assistant, "a sort of roving reporter and trouble-shooter."'
      n: '[[w.schlesinger-thousand-days-1965]], 142–43. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1960-11-09.transition-and-staff]]. Names: Robert Kennedy, Schlesinger, Dutton.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:dutton-frederick-g
- add:
    entry:
      id: cal.1961-01-09.transition-and-staff
      when: Jan. 9
      date: '1961-01-09'
      thread: transition-and-staff
      c: 'Cambridge. The President-elect to the Massachusetts Legislature and the Harvard Overseers. At Schlesinger''s house: Bundy settles his post as Special Assistant for National Security Affairs; Chayes takes the Legal Adviser''s; Wiesner on science adviser; the tax task force reports. Seaborg offered the AEC by telephone. Schlesinger to the White House, unannounced till Bowles is confirmed.'
      n: '[[w.schlesinger-thousand-days-1965]], 162. See [[cal.1960-11-09.transition-and-staff]]. Names: Kennedy, Bundy, Chayes, Wiesner, Seaborg, Schlesinger, Bowles. Check: the address''s text.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:chayes-abram
      - name:wiesner-jerome-b
      - name:seaborg-glenn-t
      - name:schlesinger-arthur-m-jr
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-01-21.farm
      when: Jan. 21
      date: '1961-01-21'
      thread: farm
      c: 'Executive Order 10914, the first: the federal surplus food given some four million needy people doubled.'
      n: '[Executive Order 10914](https://www.presidency.ucsb.edu/documents/executive-order-10914-providing-for-expanded-program-food-distribution-needy-families) (Jan. 21, 1961). [[w.schlesinger-thousand-days-1965]], 166. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-01-24.foreign-aid
      when: Jan. 24
      date: '1961-01-24'
      thread: foreign-aid
      c: 'Food for Peace given a director in the Executive Office: Executive Order 10915 and a memorandum to the agencies on his duties. McGovern the director.'
      n: '[Executive Order 10915](https://www.presidency.ucsb.edu/documents/executive-order-10915-amending-prior-executive-orders-provide-for-the-responsibilities-the); Memorandum to Federal Agencies on the Duties of the Director of the Food-for-Peace Program, [1961 Pub. Papers 6](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=64) (Jan. 24, 1961). [[w.schlesinger-thousand-days-1965]], 168–70. Names: McGovern.'
      tags:
      - name:kennedy-john-f
      - name:mcgovern-george
- add:
    entry:
      id: cal.1961-03-10.latin-america
      when: Mar. 10
      date: '1961-03-10'
      thread: latin-america
      c: 'Schlesinger reports to Kennedy on his mission with McGovern, Feb. 12–Mar. 3: Argentina, Brazil, Bolivia, Peru, Venezuela. Latin America bound to modernize; a middle-class revolution or a "workers-and-peasants" one; the landed oligarchy the barrier to the first.'
      n: '[FRUS 1961–63, XII, doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v12/d7). Made public: FRUS 1961–63, XII. [[w.schlesinger-thousand-days-1965]], 175–86 (the mission). The Alliance proposed: [[cal.1961-03-13.latin-america]]. Names: Schlesinger, McGovern, Kennedy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mcgovern-george
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-14.latin-america
      when: Apr. 14
      date: '1961-04-14'
      thread: latin-america
      c: 'Kennedy to the OAS Council at the Pan American Union: the Alliance for Progress to be speeded, through the institutions already in being. Schlesinger''s draft; Kennedy cuts its two passages against Castro.'
      n: 'Remarks at the Protocolary Session of the Council of the Organization of American States, [1961 Pub. Papers 276](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=334) (Apr. 14, 1961). [[w.schlesinger-thousand-days-1965]], 265–66 (the drafting). See [[cal.1961-03-13.latin-america]]. Names: Kennedy, Schlesinger, Castro.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-03-28.cuba
      when: Mar. 28
      date: '1961-03-28'
      thread: cuba-bay-of-pigs
      c: 'Kennedy and Schlesinger on his draft White Paper; "snide" cut. Asked about the invasion: "I think about it as little as possible." The weak point, Kennedy says, the theory of a rising against Castro. Schlesinger to ask a *Herald Tribune* reporter back from Cuba how Cubans would take a landing.'
      n: '[[w.schlesinger-thousand-days-1965]], 245–48, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). The White Paper: [[cal.1961-04-03.cuba]]. See [[cal.1961-03-16.cuba]]. Names: Kennedy, Schlesinger, Castro.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-03-31.cuba-2
      when: Mar. 31
      date: '1961-03-31'
      thread: cuba-bay-of-pigs
      c: 'Bowles to Rusk: the invasion "profoundly disturbing"; if Rusk disagrees, leave to take the case to the President. Rusk, thinking the project cut down to an infiltration, files the memorandum.'
      n: '[FRUS 1961–63, X, doc. 75](https://history.state.gov/historicaldocuments/frus1961-63v10/d75). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 250–51 (what Rusk did with it). See [[cal.1961-03-29.cuba]]. Names: Bowles, Rusk.'
      tags:
      - name:bowles-chester
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-04-04.cuba-2
      when: Apr. 4
      date: '1961-04-04'
      thread: cuba-bay-of-pigs
      c: 'Berle, Bonsal and Schlesinger with Miró Cardona, the afternoon: the Council''s draft program speaks to the investor and the dispossessed owner, not the worker, the farmer or the Negro; the Council to move from Miami to New York. Miró agrees.'
      n: '[[w.schlesinger-thousand-days-1965]], 259–60. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-20.cuba]]. Names: Berle, Bonsal, Schlesinger, Miró Cardona.'
      tags:
      - name:berle-adolf-a
      - name:bonsal-philip-w
      - name:schlesinger-arthur-m-jr
      - name:miro-cardona-jose
- add:
    entry:
      id: cal.1961-04-07.cuba-2
      when: Apr. 7
      date: '1961-04-07'
      thread: cuba-bay-of-pigs
      c: 'Goodwin to Rusk, the morning, against the operation. Rusk: "Maybe we''ve been oversold on the fact that we can''t say no to this." Kennedy, seen by Schlesinger that afternoon, has decided: the operation pared to a mass infiltration; "If we have to get rid of these 800 men, it is much better to dump them in Cuba than in the United States."'
      n: '[[w.schlesinger-thousand-days-1965]], 256–58, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Goodwin, Rusk, Kennedy, Schlesinger.'
      tags:
      - name:goodwin-richard-n
      - name:rusk-dean
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1961-04-08.cuba
      when: Apr. 8
      date: '1961-04-08'
      thread: cuba-bay-of-pigs
      c: 'Barnes and Schlesinger brief Stevenson for the UN debate on Cuba, by Schlesinger''s account too vaguely: Stevenson left thinking nothing would happen during the debate.'
      n: '[[w.schlesinger-thousand-days-1965]], 271. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Barnes, Schlesinger, Stevenson.'
      tags:
      - name:barnes-c-tracy
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1961-04-10.cuba
      when: Apr. 10
      date: '1961-04-10'
      thread: cuba-bay-of-pigs
      c: 'Schlesinger to Kennedy: the political, diplomatic and economic planning behind the operational. The Cuban leaders to be convinced that no American troops will be sent in any circumstances; recognition only when they have a better than even chance on their own.'
      n: '[FRUS 1961–63, X, doc. 86](https://history.state.gov/historicaldocuments/frus1961-63v10/d86). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 253, 262. See [[cal.1961-04-05.cuba]]. Names: Schlesinger, Kennedy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-11.cuba
      when: Apr. 11
      date: '1961-04-11'
      thread: cuba-bay-of-pigs
      also:
      - robert-kennedy
      c: 'At a birthday party for his wife, Robert Kennedy to Schlesinger: "You may be right or you may be wrong, but the President has made his mind up. Don''t push it any further."'
      n: '[[w.schlesinger-thousand-days-1965]], 259. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Robert Kennedy, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1961-04-12.cuba-3
      when: Apr. 12
      date: '1961-04-12'
      thread: cuba-bay-of-pigs
      also:
      - soviet-union
      c: 'Kornienko of the Soviet Embassy calls on Schlesinger: puzzled by American policy on Cuba; might not Castro try negotiation? Schlesinger: the Communists'' monopoly of political action the issue. Reported to Kennedy and Rusk.'
      n: '[[w.schlesinger-thousand-days-1965]], 262–64. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-05.cuba]]. Names: Kornienko, Schlesinger, Castro, Kennedy, Rusk.'
      tags:
      - name:kornienko-georgi-m
      - name:schlesinger-arthur-m-jr
      - name:castro-fidel
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-04-13.cuba
      when: Apr. 13
      date: '1961-04-13'
      thread: cuba-bay-of-pigs
      c: 'New York, the Century. Berle and Schlesinger tell Miró Cardona no American troops will be sent and recognition will not be automatic. Miró: everyone knows the United States is behind it; "This help must come"; 10,000 Cubans will join the landing. He later said Berle promised 10,000 American troops; Schlesinger''s notes have arms for the Cubans who rose.'
      n: '[FRUS 1961–63, X, doc. 101](https://history.state.gov/historicaldocuments/frus1961-63v10/d101) (Schlesinger to Kennedy, Apr. 14). Made public: FRUS 1961–63, X (1997). [[w.schlesinger-thousand-days-1965]], 264–65. See [[cal.1961-04-12.cuba-2]]. Names: Berle, Schlesinger, Miró Cardona.'
      tags:
      - name:berle-adolf-a
      - name:schlesinger-arthur-m-jr
      - name:miro-cardona-jose
- add:
    entry:
      id: cal.1961-04-14.cuba
      when: Apr. 14
      date: '1961-04-14'
      thread: cuba-bay-of-pigs
      c: 'Kennedy, given Schlesinger''s account of Miró, calls Bissell: Miró to go ahead on the understanding of no American military intervention, or the operation is cancelled. Barnes to New York; Miró assents.'
      n: '[FRUS 1961–63, X, doc. 101](https://history.state.gov/historicaldocuments/frus1961-63v10/d101), the memorandum; Kennedy''s note on it, [[w.schlesinger-thousand-days-1965]], 265 n. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-13.cuba]]. Names: Kennedy, Schlesinger, Bissell, Barnes, Miró Cardona.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:bissell-richard-m-jr
      - name:barnes-c-tracy
      - name:miro-cardona-jose
- add:
    entry:
      id: cal.1961-04-18.cuba-3
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'Lunch with Reston and Schlesinger. Kennedy: "I probably made a mistake in keeping Allen Dulles on"; his brother wasted at Justice, "Bobby should be in CIA"; defeat "an incident, not a disaster"; no Marines.'
      n: '[[w.schlesinger-thousand-days-1965]], 275–76, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-15.cuba]]. Names: Kennedy, Reston, Schlesinger, Dulles.'
      tags:
      - name:kennedy-john-f
      - name:reston-james
      - name:schlesinger-arthur-m-jr
      - name:dulles-allen-w
- add:
    entry:
      id: cal.1961-04-19.cuba-3
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: 'Berle and Schlesinger fly to the Opa-Locka airbase, Fla., where the Revolutionary Council is held under guard; Varona and Ray indict the CIA. Told the beachhead is lost, they fly the Council to Washington. Kennedy receives its members at the White House till six: no intervention; "you are all free men."'
      n: '[[w.schlesinger-thousand-days-1965]], 279–85, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-04-15.cuba]]. Names: Berle, Schlesinger, Varona, Ray, Kennedy.'
      tags:
      - name:berle-adolf-a
      - name:schlesinger-arthur-m-jr
      - name:varona-manuel-antonio-de
      - name:ray-manuel-antonio
      - name:kennedy-john-f
      - name:miro-cardona-jose
- add:
    entry:
      id: cal.1961-07-17.transition-and-staff
      when: July 17
      date: '1961-07-17'
      thread: transition-and-staff
      c: 'The *New York Times*, front page: Kennedy to ask for Bowles''s resignation today. Kennedy, flying back from the Cape: a management problem become "a symbolic question." Sees Rusk, then Bowles. Bowles stays.'
      n: '[[w.schlesinger-thousand-days-1965]], 437–42. See [[cal.1961-01-20.transition-and-staff]]. Names: Bowles, Kennedy, Rusk.'
      tags:
      - name:bowles-chester
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-07-19.transition-and-staff
      when: July 19
      date: '1961-07-19'
      thread: transition-and-staff
      c: 'Press conference: he has never asked for Bowles''s resignation, nor has Bowles offered it; "I have a high regard for Mr. Bowles."'
      n: 'The President''s News Conference, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571), 518–19 (July 19, 1961). [[w.schlesinger-thousand-days-1965]], 442. See [[cal.1961-07-17.transition-and-staff]]. Names: Kennedy, Bowles.'
      tags:
      - name:kennedy-john-f
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-07-05.berlin-and-vienna
      when: July 5
      date: '1961-07-05'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Kornienko of the Soviet Embassy to Schlesinger on Berlin: "you don''t believe that we are sincere" about keeping West Berlin as it is; if the Soviet guarantees will not do, "why don''t you propose your own guarantees?"'
      n: '[[w.schlesinger-thousand-days-1965]], 385. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kornienko, Schlesinger.'
      tags:
      - name:kornienko-georgi-m
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1961-07-07.berlin-and-vienna
      when: July 7
      date: '1961-07-07'
      thread: berlin-and-vienna
      c: 'Schlesinger to Kennedy: Acheson''s paper avoids the political issues. Kennedy agrees and asks for an unsigned paper for Hyannis Port; Schlesinger, Chayes and Kissinger write it that afternoon: the political aim, the range of harassments short of blockade, what nuclear war would mean, the allies, the UN.'
      n: '[FRUS 1961–63, XIV, doc. 57](https://history.state.gov/historicaldocuments/frus1961-63v14/d57). [[w.schlesinger-thousand-days-1965]], 385–88 (the unsigned paper). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Schlesinger, Kennedy, Acheson, Chayes, Kissinger.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:acheson-dean-g
      - name:chayes-abram
      - name:kissinger-henry-a
- add:
    entry:
      id: cal.1961-07-08.berlin-and-vienna
      when: July 8
      date: '1961-07-08'
      thread: berlin-and-vienna
      c: 'Hyannis Port. Kennedy with Rusk, McNamara and Taylor on Berlin. Within ten days: from Rusk a political prospectus; from McNamara a defense plan not resting mainly on nuclear weapons at the outset; from Kohler''s task force a check list of actions. By Schlesinger''s account Acheson asked for a political program too.'
      n: '[FRUS 1961–63, XIV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v14/d63) (Taylor''s list of the actions agreed, July 12). [[w.schlesinger-thousand-days-1965]], 388–89. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Taylor, Kohler, Schlesinger, Acheson.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:kohler-foy-d
      - name:schlesinger-arthur-m-jr
      - name:acheson-dean-g
- add:
    entry:
      id: cal.1961-07-13.berlin-and-vienna
      when: July 13
      date: '1961-07-13'
      thread: berlin-and-vienna
      c: 'The NSC on Berlin. Rusk, from Acheson''s paper: no good position now to negotiate; a declaration of national emergency would have "a dangerous sound of mobilization." Acheson for decisive action, the Vice President agreeing. No decision.'
      n: 'FRUS 1961–63, XIV, docs. [66](https://history.state.gov/historicaldocuments/frus1961-63v14/d66) (Bundy), [67](https://history.state.gov/historicaldocuments/frus1961-63v14/d67). [[w.schlesinger-thousand-days-1965]], 389–90. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Rusk, Acheson, Johnson.'
      tags:
      - name:rusk-dean
      - name:acheson-dean-g
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-08-14.berlin-and-vienna
      when: Aug. 14
      date: '1961-08-14'
      thread: berlin-and-vienna
      c: 'Bundy to Kennedy: his staff unanimous for a clear initiative for negotiation within a week or ten days; State''s professionals more cautious, held to the four powers'' planning.'
      n: '[FRUS 1961–63, XIV, doc. 108](https://history.state.gov/historicaldocuments/frus1961-63v14/d108). [[w.schlesinger-thousand-days-1965]], 398. See [[cal.1961-08-13.berlin-and-vienna]]. Names: Bundy, Kennedy.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-08-21.berlin-and-vienna
      when: Aug. 21
      date: '1961-08-21'
      thread: berlin-and-vienna
      c: 'Kennedy to Rusk: "I want to take a stronger lead on Berlin negotiations." An invitation to negotiate before Sept. 1; the allies to come along or stay behind; no veto for any other power.'
      n: '[FRUS 1961–63, XIV, doc. 122](https://history.state.gov/historicaldocuments/frus1961-63v14/d122). [[w.schlesinger-thousand-days-1965]], 398–99. See [[cal.1961-08-13.berlin-and-vienna]]. Names: Kennedy, Rusk.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-07-20.testing
      when: July 20
      date: '1961-07-20'
      thread: testing
      c: Bundy, Sorensen and Schlesinger with Kennedy on Murrow's and Schlesinger's proposals for the test ban. The Geneva talks to go on, Dean back to them, the neutral states canvassed. Kennedy not convinced resumed testing would gain more than it cost.
      n: '[[w.schlesinger-thousand-days-1965]], 455–56. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-09-01.testing]]. Names: Bundy, Sorensen, Schlesinger, Kennedy, Murrow, Dean.'
      tags:
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:murrow-edward-r
      - name:dean-arthur-h
- add:
    entry:
      id: cal.1961-08-05.china
      when: Aug. 5
      date: '1961-08-05'
      thread: china
      also:
      - testing
      c: 'Hyannis Port, on the boat. Stevenson, Cleveland and Schlesinger with Kennedy on the General Assembly. General and complete disarmament the American goal, on Cleveland''s formula. Peking to be kept out this year: "If we can buy twelve months, it will be more than worth it."'
      n: '[[w.schlesinger-thousand-days-1965]], 478–80. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Stevenson, Cleveland, Schlesinger, Kennedy.'
      tags:
      - name:stevenson-adlai-e
      - name:cleveland-j-harlan
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-09-05.china
      when: Sept. 5
      date: '1961-09-05'
      thread: china
      also:
      - testing
      c: 'Kennedy with Rusk, Stevenson, Cleveland, Bundy, Sorensen and Schlesinger on his address to the General Assembly. On resuming tests: "They had spit in our eye three times." Stevenson may tell delegations a "two China" study is not excluded; Peking kept out at least a year: "Whatever is required is OK by me."'
      n: '[[w.schlesinger-thousand-days-1965]], 482–83. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-08-05.china]]. Names: Kennedy, Rusk, Stevenson, Cleveland, Bundy, Sorensen, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:stevenson-adlai-e
      - name:cleveland-j-harlan
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1961-11-24.defense
      when: Nov. 24
      date: '1961-11-24'
      thread: defense
      c: 'Hyannis Port, the defense budget meeting. Civil defense: Kaysen and Schlesinger against the family shelter; Kennedy decides for public community shelters. Robert Kennedy: "we can just station Father McHugh with a machine gun at every shelter."'
      n: '[[w.schlesinger-thousand-days-1965]], 747–49. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Kaysen, Schlesinger, Kennedy, Robert Kennedy. Check: the day, "the Friday after Thanksgiving" here, "over Thanksgiving" in [[w.schlesinger-robert-kennedy-and-his]], 429.'
      tags:
      - name:kaysen-carl
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-04-17.steel
      when: Apr. 17
      date: '1962-04-17'
      thread: steel
      c: 'Blough at the White House again, a week after his first call. Kennedy to Schlesinger at dinner: "I told him that his men could keep their horses for the spring plowing."'
      n: '[[w.schlesinger-thousand-days-1965]], 637. See [[cal.1962-04-10.steel]]. Names: Blough, Kennedy, Schlesinger.'
      tags:
      - name:blough-roger-m
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-3
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'The Oval Office, 11 a.m. Kennedy with Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger and Hilsman on the diplomacy of the crisis; Stevenson''s speech to the Security Council gone over, a threat of an American strike cut. Schlesinger sent to help Stevenson. Robert Kennedy: "We will have to make a deal at the end, but we must stand absolutely firm now."'
      n: '[Meeting on Diplomatic Plans for the Crisis, 11:00 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-diplomatic-plans-crisis), Tape 32 (Miller Center). [[w.schlesinger-thousand-days-1965]], 811. See [[cal.1962-10-16.missile-crisis]]. Names: John F. Kennedy, Rusk, Robert Kennedy, Ball, Bundy, U. Alexis Johnson, Schlesinger, Hilsman, Stevenson.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:kennedy-robert-f
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:johnson-u-alexis
      - name:schlesinger-arthur-m-jr
      - name:hilsman-roger
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-4
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'Kennedy shows the congressional leaders the U-2 photographs and his course. Russell: the quarantine too slow and too risky, invade; Fulbright with him.'
      n: '[Meeting with the Congressional Leadership on the Cuban Missile Crisis, 5:30 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/meeting-congressional-leadership-cuban-missile-crisis), Tapes 33 and 33A (Miller Center). [[w.schlesinger-thousand-days-1965]], 812. See [[cal.1962-10-16.missile-crisis]]. Names: Kennedy, Russell, Fulbright. Check: the hour; Schlesinger gives five o''clock.'
      tags:
      - name:kennedy-john-f
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-4
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      c: 'Stevenson to the Security Council from 4 p.m., his text finished as he speaks; the OAS resolution handed to him in the course of it. Kennedy wires him: "It has given our cause a great start."'
      n: '[[w.schlesinger-thousand-days-1965]], 813–14. See [[cal.1962-10-16.missile-crisis]]. Names: Stevenson, Kennedy. Check: the speech''s text.'
      tags:
      - name:stevenson-adlai-e
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-12-03.missile-crisis
      when: Dec. 3
      date: '1962-12-03'
      thread: missile-crisis
      c: 'Salinger''s statement at noon, approved by Stevenson: the President''s full confidence in him; nothing of the Executive Committee to be disclosed. Stevenson tells Schlesinger he will go if wanted; Kennedy to Schlesinger: "Of course I don''t want Stevenson to resign."'
      n: '[[w.schlesinger-thousand-days-1965]], 835–37. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-12.missile-crisis]]. Names: Salinger, Stevenson, Schlesinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-12-05.missile-crisis
      when: Dec. 5
      date: '1962-12-05'
      thread: missile-crisis
      c: 'Kennedy''s letter to Stevenson, released: his confidence; Stevenson''s work at the UN of "inestimable" importance. Drafted for Stevenson alone, it named Bartlett; the references cut for the press.'
      n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 569](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d569). [[w.schlesinger-thousand-days-1965]], 837–38. See [[cal.1962-12-03.missile-crisis]]. Names: Kennedy, Stevenson, Bartlett.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:bartlett-charles
- add:
    entry:
      id: cal.1963-05-01.poverty
      when: May 1
      date: '1963-05-01'
      thread: poverty
      c: 'Heller to Kennedy, from Lampman''s figures: the economy lifting fewer out of poverty; the poor about as many as in 1957; one-fifth of the nation below $3,000 a family or $1,500 alone.'
      n: '[[w.schlesinger-thousand-days-1965]], 1011. Names: Heller, Kennedy. Check: the memorandum (Kennedy Library).'
      tags:
      - name:heller-walter-w
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-12.elections-1964
      when: Nov. 12
      date: '1963-11-12'
      thread: elections-1964
      c: 'The first strategy meeting for 1964: Robert Kennedy, O''Brien, O''Donnell, Sorensen, two of the National Committee, Stephen Smith, Scammon. The South and its delegates, the suburbs, the campaign''s organization. Johnson absent; his renomination assumed.'
      n: '[[w.schlesinger-thousand-days-1965]], 1018. Made public: [[w.schlesinger-thousand-days-1965]] (1965). Names: Robert Kennedy, O''Brien, O''Donnell, Sorensen, Smith, Scammon, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - name:sorensen-theodore-c
      - name:smith-stephen-e
      - name:scammon-richard-m
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-11-19.poverty
      when: Nov. 19
      date: '1963-11-19'
      thread: poverty
      c: 'Kennedy to Heller on the poverty program: the middle class may feel threatened, something to be done for the suburbs; the Council to go full speed ahead for 1964.'
      n: '[[w.schlesinger-thousand-days-1965]], 1012. See [[cal.1963-05-01.poverty]]. Names: Kennedy, Heller.'
      tags:
      - name:kennedy-john-f
      - name:heller-walter-w
