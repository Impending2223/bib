    id: cal.1963-01-29.china-leadership-3
    after: end
    words: 'Peng Zhen: more kinds, sizes and materials are development, not adjustment; lowering high targets is adjustment, after the earlier serious disproportion; coal from 130 million tons in 1957 to 250 million in three to five years would be great development; the three years of the leap had results but were not normal.'
