- add:
    entry:
      id: cal.1965-04-23.soviet-union
      when: 'Apr. 23'
      date: '1965-04-23'
      thread: soviet-union
      also: [china, vietnam-diplomacy]
      c: 'Zhegalin, the Soviet ambassador, gives Ceaușescu three letters for the CPSU Presidium: the CPSU''s to the Chinese and Vietnamese parties, the Chinese reply, and one telling what passed. He says Soviet arms aid to Vietnam runs to hundreds of millions of rubles, and invites 3–5 Romanians, and 5–6 officers, to the 20th anniversary of the victory over Germany. Ceaușescu: the Political Bureau will study them.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception of Soviet Ambassador I. K. Zhegalin by Comrade Nicolae Ceausescu](https://digitalarchive.umd.edu/document/122553)" (Apr. 23, 1965), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 50/1965, f. 2–3, trans. Larry L. Watts, Wilson Center Digital Archive. To check: the CPSU''s letter to the Chinese Communist Party and the Workers'' Party of Vietnam, and the Chinese reply, named in the transcript. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:ussr
      - name:ceausescu-nicolae
      - vis:only:romania+ussr
- add:
    entry:
      id: cal.1965-05-28.vietnam-hanoi-3
      when: 'May 28'
      date: '1965-05-28'
      place: bucharest
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Hoang Tu, the DRV''s ambassador, briefs Ceaușescu: by his account the American plans have failed and the National Liberation Front holds most of the South; the DRV cannot accept peace proposals now. He adds what the Workers'' Party delegation discussed with the CPSU at Moscow. Ceaușescu replies.'
      n: '"[Note of Conversation on Occasion of the Reception of the Ambassador of the Democratic Republic of Vietnam in Bucharest, Hoang Tu](https://digitalarchive.umd.edu/document/122554)" (May 28, 1965), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 23/1965, f. 4–7, trans. Larry L. Watts, Wilson Center Digital Archive. Names: Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1965-07-24.vietnam-hanoi
      when: 'July 24'
      date: '1965-07-24'
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Ceaușescu and Maurer receive the Workers'' Party of Vietnam''s delegation to the RCP congress, Lê Đức Thọ, Tran Quang Huy and Ambassador Hoang Tu. Thọ: the Americans want talks from a position of force; the Vietnamese oppose negotiations and sign only when sure of winning, as at Geneva in 1954 after Dien Bien Phu.'
      n: '"[Transcript of the Reception of a Workers Party of Vietnam Delegation at the Central Committee of the Romanian Communist Party](https://digitalarchive.umd.edu/document/122556)" (July 24, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive''s file note gives the excerpt as Document 279 in Budura (2005), 762. Made public: 2005 (an excerpt, Document 279 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 762). Names: Ceaușescu, Maurer, Lê Đức Thọ. Check: the place; the transcript names none.'
      tags:
