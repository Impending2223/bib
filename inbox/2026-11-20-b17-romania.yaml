- add:
    entry:
      id: cal.1966-10-03.vietnam-hanoi
      when: 'Oct. 3'
      date: '1966-10-03'
      time: 1966-10-03T03:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, soviet-union, china]
      c: 'Hanoi. Maurer and Niculescu-Mizil talk with Phạm Văn Đồng, Nguyễn Duy Trinh and Xuân Thủy, from 1000 hrs and again from 1500. Maurer reports Romania''s talks with NATO states'' leaders, where Hanoi''s refusal to talk is the question put to him, and the divergences with the Soviet Union, among them the gold sent to Russia in 1917; he says the fighting must go on until the Vietnamese people''s right to decide is assured. Đồng: the DRV combines the fight with political and diplomatic work.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Sittings of 1000–1300 and 1500–1800 hrs; the time is the first sitting''s. The Archive dates the transcript Oct. 3; the file note reads Oct. 2–3, 1966. Names: Maurer, Phạm Văn Đồng, Nguyễn Duy Trinh, Xuân Thủy. Check: the days; the Archive''s file note reads Oct. 2–3, and the Romanians'' talks at Peking are dated Oct. 4 at 1630 hrs, which a sitting at Hanoi from 1500 hrs the same day would overlap. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:maurer-ion-gheorghe
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - name:xuan-thuy
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-10-04.vietnam-hanoi
      when: 'Oct. 4'
      date: '1966-10-04'
      time: 1966-10-04T08:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, soviet-union, china]
      c: 'Hanoi. The closing sitting, from 1500 hrs to 1700. Maurer: nothing to add; the two sides'' views are as one and the contacts should go on; he will tell the Chinese and the Soviets in brief. Talk of the Polish and Hungarian proposals, U Thant''s and the French precedent in the military case; Đồng: agreement, and other delegations come in November.'
      n: '"[Transcript of Discussions Held by Comrades Ion Gheorghe Maurer and Paul Niculescu-Mizil With the Delegation in The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122581)" (Oct. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, 127/1966, dosar nr. 3345, 31.XII.1966, f. 1–110, trans. Larry L. Watts, Wilson Center Digital Archive. Sitting of 1500–1700 hrs, dated Oct. 4 in the transcript. See [[cal.1966-10-03.vietnam-hanoi]]. Names: Maurer, Phạm Văn Đồng. Check: the days; the Archive''s file note reads Oct. 2–3, and the Romanians'' talks at Peking are dated Oct. 4 at 1630 hrs, which a sitting at Hanoi from 1500 hrs the same day would overlap. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:maurer-ion-gheorghe
      - name:pham-van-dong
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-10-05.soviet-union-leadership
      when: 'Oct. 5'
      date: '1966-10-05'
      time: 1966-10-05T16:30Z
      time_zone: 'Europe/Moscow'
      place: moscow
      thread: soviet-union-leadership
      also: [vietnam-diplomacy, vietnam-hanoi]
      c: 'Moscow. Maurer and Niculescu-Mizil, back from Vietnam, brief Kosygin, Andropov and Kuznetsov from 1930 hrs: the Hanoi talks, and the Vietnamese view that conditions for negotiating are not ripe. Kosygin answers with irony and asks whether Maurer contradicted Zhou Enlai; the two go over Vietnam''s supply, which passes through China.'
      n: '"[Transcript of Discussions with Representatives of the Chinese People''s Republic and The Communist Party of the Soviet Union on the Return of the Romanian Delegation from Vietnam (Moscow)](https://digitalarchive.umd.edu/document/122584)" (Oct. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, Dosar 129/1966, file 22–32, trans. Larry L. Watts, Wilson Center Digital Archive. Moscow, October 5, 1966; the Archive''s heading reads October 4–5. See [[cal.1966-10-04.vietnam-hanoi]]. Names: Maurer, Kosygin, Andropov, Kuznetsov, Zhou Enlai. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:ussr
      - name:maurer-ion-gheorghe
      - name:kosygin-aleksei
      - name:andropov-yuriy-vladimirovich
      - name:kuznetsov-vasily-v
      - name:zhou-enlai
      - vis:only:romania+ussr
- add:
    entry:
      id: cal.1966-10-11.vietnam-diplomacy
      when: 'Oct. 11'
      date: '1966-10-11'
      time: 1966-10-11T16:00Z
      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi, soviet-union, china]
      c: 'The RCP Executive Committee, Ceaușescu presiding, hears Niculescu-Mizil on the Maurer–Niculescu-Mizil visit to Hanoi, Peking and Moscow. By his report the Vietnamese agreed with Romania''s position but held conditions for talks not ripe, and Zhou Enlai and Kosygin differed in what they said. Ceaușescu: put the halting of the bombing at the center; the Committee approves the delegation''s work unanimously.'
      n: '"[Protocol No. 34 of the Romanian Executive Political Committee Meeting](https://digitalarchive.umd.edu/document/122589)" (Oct. 11, 1966), Document 10 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), pp. 191–201; Arhiva Comitetului Executiv al CC al PCR, dosar nr. 2689, 5.XI.1966, trans. Larry L. Watts, Wilson Center Digital Archive. Protocol no. 34; the meeting began at 1800 hrs. Made public: 2008 (Document 10 in Niculescu-Mizil, *România și războiul americano-vietnamez*, 191–201). See [[cal.1966-10-05.soviet-union-leadership]]. Names: Ceaușescu, Maurer, Zhou Enlai, Kosygin.'
