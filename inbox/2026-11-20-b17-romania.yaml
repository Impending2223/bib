- add:
    entry:
      id: cal.1966-05-25.vietnam-diplomacy
      when: 'May 25'
      date: '1966-05-25'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi, china, soviet-union]
      c: 'Niculescu-Mizil, on the party leadership''s instructions, has Hoa Tu Truc, the DRV''s chargé, tell the Workers'' Party of Vietnam: Zhou Enlai heard at Peking the two parties'' call for a common show of socialist solidarity on Vietnam and agreed to discuss it at his Romanian visit; the Soviets, told at the Ceaușescu–Brezhnev meetings, agreed with the idea. The Foreign Ministry cables Moanga at Hanoi.'
      n: '"[Telegram from Romanian Ministry of Foreign Affairs to the Romanian Ambassador to The Democratic Republic of Vietnam](https://digitalarchive.umd.edu/document/122572)" (May 25, 1966), Document 3 in Niculescu-Mizil, România şi războiul americano-vietnamez (2008), pp. 183–184; AMAE, Cabinetul Corneliu Manescu, M 25 5 1966, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2008 (Document 3 in Niculescu-Mizil, *România și războiul americano-vietnamez*, 183–84). See [[cal.1966-05-10.vietnam-hanoi]]. Names: Zhou Enlai, Ceaușescu, Brezhnev. Check: the place; the cable names none.'
      tags:
      - polity:romania
      - polity:drv
      - name:zhou-enlai
      - name:ceausescu-nicolae
