- add:
    entry:
      id: cal.1966-05.vietnam-diplomacy
      when: 'May, before the 10th'
      date: '1966-05'
      at: 'before 1966-05-10'
      place: washington
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Rusk and Balaceanu, Romania''s ambassador, talk on Vietnam at a Washington reception for the diplomatic corps, as Romanian cables of May 10 report. Rusk: the U.S. neither wants to stay nor to widen the war and will not let Hanoi take the South by arms; if Hanoi slows its troops'' flow, matching steps toward talks. Balaceanu: the U.S. should address Hanoi and the Front; Romania will not mediate.'
      n: '"[Telegram of the Ministry of Foreign Affairs to the Ambassador of Romania in Hanoi, Regarding the Conversation of Petre Balaceanu, Ambassador of Romania in Washington, with Dean Rusk](https://digitalarchive.umd.edu/document/122569)" (May 10, 1966), Document 2 in Paul Niculescu-Mizil, România şi războiul americano-vietnamez, Bucharest, Editura Roza Vânturilor, 2008, pp. 181–183; AMAE, Telegram no. 123156 (to Hanoi from Dr VI) 1966 May 10, trans. Larry L. Watts, Wilson Center Digital Archive. The same account is in the cable to the embassy at Peking, [May 10, 1966](https://digitalarchive.umd.edu/document/122570) (''recently'', no day given). Made public: 2005 (the cable to Peking, Document 292 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 786–87); 2008 (the cable to Hanoi, Document 2 in Niculescu-Mizil, *România și războiul americano-vietnamez*, 181–83). Names: Rusk, Balaceanu, Mănescu. Check: the day; both cables say only ''recently''.'
      tags:
      - polity:us
      - polity:romania
      - name:rusk-dean
      - name:balaceanu-petre
      - name:manescu-corneliu
      - vis:only:us+romania
- add:
    entry:
      id: cal.1966-05-06.vietnam-hanoi
      when: 'May 6'
      date: '1966-05-06'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy]
      c: 'Hanoi. The Romanian party-government delegation under Bodnăraş, with Niculescu-Mizil, holds its first meeting with Phạm Văn Đồng, Nguyễn Duy Trinh, Lê Thanh Nghị, Hoàng Văn Hoan and others. Đồng thanks Romania for its aid and its decision to support an office of the National Liberation Front at Bucharest, and presents the war and the DRV''s four points. Bodnăraş thanks him.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 1st Meeting, Friday, May 6, 1966; the transcript, with its two restricted meetings, is dated May 20, 1966. Names: Bodnăraş, Phạm Văn Đồng, Nguyễn Duy Trinh. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-07.vietnam-hanoi-2
      when: 'May 7'
      date: '1966-05-07'
      time: 1966-05-07T02:00Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The second and third meetings. Bodnăraş sets out the RCP''s course: its own road, independence within the CMEA and the Warsaw Pact, relations with all the socialist countries. In a pause between sittings he puts to Đồng the idea of a common show of solidarity by all the socialist countries on Vietnam; Đồng: the idea is just, the Vietnamese will reflect.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 2nd Meeting, Saturday, May 7, 1966, 0900 hours; 3rd Meeting the same day; the Note of Conversation, in a pause of the afternoon sitting. The time is the first sitting''s. See [[cal.1966-05-06.vietnam-hanoi]]. Names: Bodnăraş, Phạm Văn Đồng. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:bodnaras-emil
      - name:pham-van-dong
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-09.vietnam-hanoi
      when: 'May 9'
      date: '1966-05-09'
      time: 1966-05-09T02:30Z
      time_zone: 'Asia/Bangkok'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The fourth meeting, then the first restricted meeting of Bodnăraş and Niculescu-Mizil with Đồng, Nguyễn Duy Trinh and Lê Thanh Nghị. Đồng, after consulting several Political Bureau members: the DRV agrees in principle to a joint action of the socialist countries, but only with the Soviet and Chinese parties in it.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. 4th Meeting, Monday, May 9, 1966, 0930 hours; Note of the First Restricted Meeting, May 9. The time is the first meeting''s. See [[cal.1966-05-07.vietnam-hanoi-2]]. Names: Bodnăraş, Phạm Văn Đồng, Nguyễn Duy Trinh. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
