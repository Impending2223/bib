- add:
    entry:
      id: cal.1966-01-03.vietnam-diplomacy-2
      when: 'Jan. 3'
      date: '1966-01-03'
      time_range:
      - 1966-01-03T10:00Z
      - 1966-01-03T12:00Z
      time_band: 'workday midday'
      range_basis: record
      time_zone: 'Europe/Bucharest'
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Lê Thanh Nghị, DRV Vice-Premier, tells Ceaușescu and Maurer that the DRV will strike back in the South, answer the bombing of the North and press the political and diplomatic struggle abroad, where he asks the Soviet Union and the other socialist countries for their part. Ceaușescu fears public polemics may start again; Nghị shares the worry. Ceaușescu on the Americans'' peace talk: it must be unmasked.'
      n: '"[Transcript of Discussions of a Governmental Economic Delegation from the Democratic Republic of Vietnam with Nicolae Ceausescu and Ion Gheorghe Maurer](https://digitalarchive.umd.edu/document/122558)" (Jan. 3, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 1/1966, nr. 1, 15/01/1966, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive calls it a lunchtime conversation; the transcript marks the later part ''(during lunch)''. The hour is not given, and the midday band is taken from the lunch. Names: Ceaușescu, Maurer. Check: the place; the transcript names none. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:romania
      - polity:drv
      - name:ceausescu-nicolae
      - name:maurer-ion-gheorghe
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-01-05.vietnam-diplomacy
      when: 'Jan. 5'
      date: '1966-01-05'
      thread: vietnam-diplomacy
      also: [china, soviet-union]
      c: 'Gomułka, for the Polish party''s Central Committee, writes Ceaușescu: the Poles have proposed to the Chinese party a conference of the Warsaw Pact parties and the Asian socialist parties on coordinating aid to the DRV and the National Liberation Front, with a copy of their letter, and ask the RCP to examine and support it.'
      n: '"[Letter from the Central Committee of the Polish United Workers Party to Comrade Nicolae Ceausescu, General Secretary of the Central Committee of the Romanian Communist Party](https://digitalarchive.umd.edu/document/122560)" (Jan. 5, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 5/P Ceausescu, January 5, 1966, f. 6–7, trans. Larry L. Watts, Wilson Center Digital Archive. The enclosed copy is of the Polish letter to the Chinese Communist Party of Dec. 28, 1965 (as Ceaușescu''s reply dates it). Names: Gomułka, Ceaușescu. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
      - polity:poland
      - polity:romania
      - name:gomulka-wladyslaw
      - name:ceausescu-nicolae
      - vis:only:poland+romania
      - ok:fields-place
