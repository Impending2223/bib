      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-10.vietnam-diplomacy
      when: 'May 10'
      date: '1966-05-10'
      place: bucharest
      thread: vietnam-diplomacy
      also: [china, vietnam-hanoi]
      c: 'Mezincescu, Deputy Foreign Minister, receives Zeng Yongquan, the Chinese ambassador, and gives him Rusk''s talk with Romania''s ambassador at Washington, in the two sides'' exchange of information on matters of common interest. The ambassador thanks him. The Foreign Ministry cables the embassy at Peking.'
      n: '"[Telegram from the Ministry of Foreign Affairs Regarding the Conversation of Petre Balaceanu with Dean Rusk Referring to the War in Vietnam](https://digitalarchive.umd.edu/document/122570)" (May 10, 1966), Document 292 in Budura, Relaţiile Româno-Chineze, 1880–1974: Documente (2005) pp. 786–7; AMAE, fond Telegrame, Pekin, vol. I, 1966, f. 141–3, trans. Larry L. Watts, Wilson Center Digital Archive. Made public: 2005 (Document 292 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 786–87). See [[cal.1966-05.vietnam-diplomacy]].'
      tags:
      - polity:romania
      - polity:prc
      - vis:only:romania+prc
- add:
    entry:
      id: cal.1966-05-10.vietnam-diplomacy-2
      when: 'May 10'
      date: '1966-05-10'
      time: 1966-05-10T07:30Z
      time_zone: 'Europe/Bucharest'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Mezincescu gives Hoa Tu Truc, the DRV''s chargé, Rusk''s talk with Romania''s ambassador at Washington, at the Vietnamese side''s earlier request for news of American thinking; the chargé calls such news useful to the DRV''s line. The Foreign Ministry cables Moanga at Hanoi: if the Vietnamese raise it before the delegation leaves, show no knowledge.'
      n: '"[Telegram of the Ministry of Foreign Affairs to the Ambassador of Romania in Hanoi, Regarding the Conversation of Petre Balaceanu, Ambassador of Romania in Washington, with Dean Rusk](https://digitalarchive.umd.edu/document/122569)" (May 10, 1966), Document 2 in Paul Niculescu-Mizil, România şi războiul americano-vietnamez, Bucharest, Editura Roza Vânturilor, 2008, pp. 181–183; AMAE, Telegram no. 123156 (to Hanoi from Dr VI) 1966 May 10, trans. Larry L. Watts, Wilson Center Digital Archive. At 0930 Bucharest time, Foreign Ministry telegram no. 123156. Made public: 2008 (Document 2 in Niculescu-Mizil, *România și războiul americano-vietnamez*, 181–83). See [[cal.1966-05.vietnam-diplomacy]].'
      tags:
      - polity:romania
      - polity:drv
      - vis:only:romania+drv
- add:
    entry:
      id: cal.1966-05-10.vietnam-hanoi
      when: 'May 10'
      date: '1966-05-10'
      place: hanoi
      thread: vietnam-hanoi
      also: [vietnam-diplomacy, china, soviet-union]
      c: 'Hanoi. The second restricted meeting. Đồng, having studied the Romanian proposal with Hồ Chí Minh, Lê Duẩn and others: the DRV agrees to it and will take part, on the same condition. He sets out its position toward the Soviet Union, with which it can now argue its differences, and toward China, whose aid it values.'
      n: '"[Transcript of Discussions Held On the Occasion of the Visit to the Democratic Republic of Vietnam of the Party and Government Delegation from the Socialist Republic of Romania](https://digitalarchive.umd.edu/document/122568)" (May 20, 1966), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 70/1966, f. 1–146, trans. Larry L. Watts, Wilson Center Digital Archive. Note on the Second Restricted Meeting of May 10, 1966. See [[cal.1966-05-09.vietnam-hanoi]]. To check: the DRV''s side of the Hanoi talks of May 6–10, in a Vietnamese record. Names: Bodnăraş, Phạm Văn Đồng, Hồ Chí Minh, Lê Duẩn. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
