- add:
    entry:
      id: cal.1965-10-03.vietnam-diplomacy
      when: 'Oct. 3'
      date: '1965-10-03'
      place: bucharest
      thread: vietnam-diplomacy
      c: 'Maurer, receiving Crawford, the U.S. ambassador, on his leaving Bucharest, speaks ''as a man'' and not as Premier, as Bodnăraş later tells the Chinese: what the Americans do in Vietnam is a wild adventure, peaceful coexistence cannot hold with it, and opposition to it will stiffen. Crawford says he will report it home.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965. Made public: 2005 (an excerpt, Document 279 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 762). Names: Maurer, Bodnăraş.'
      tags:
      - polity:romania
      - polity:us
      - polity:prc
      - name:maurer-ion-gheorghe
      - name:bodnaras-emil
      - vis:only:romania+us
      - vis:from:prc:1965-10-28
- add:
    entry:
      id: cal.1965-10-13.europe-and-the-alliance
      when: 'Oct. 13'
      date: '1965-10-13'
      thread: europe-and-the-alliance
      also: [soviet-union]
      c: 'Bhutto, Pakistan''s foreign minister, at his own insistence meets Mănescu and asks Romania for its good offices in the Kashmir dispute with India, giving Pakistan''s reservations on the Soviet offer of mediation, as Bodnăraş later tells the Chinese. The Romanian Permanent Presidium later decides not to accept.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965. Made public: 2005 (an excerpt, Document 279 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 762). Names: Mănescu, Bhutto, Bodnăraş. Check: the place.'
      tags:
      - polity:romania
      - polity:pakistan
      - polity:prc
      - name:manescu-corneliu
      - name:bhutto-zulfikar-ali
      - name:bodnaras-emil
      - vis:only:romania+pakistan
      - vis:from:prc:1965-10-28
- add:
    entry:
      id: cal.1965-10-14.vietnam-diplomacy
      when: 'Oct. 14'
      date: '1965-10-14'
      place: washington
      thread: vietnam-diplomacy
      also: [soviet-union, china]
      c: 'Rusk meets part of the Romanian delegation under Mănescu at the State Department, three and a half hours, as Bodnăraş later tells the Chinese. Rusk, by that account: the U.S. sees Hanoi perhaps moving toward talks, will not leave South Vietnam to force, and asks Romania not to block any signal from the Vietnamese; he calls the Soviet line reasonable and the Chinese the hardliners'' only inspiration. Mănescu: the Vietnamese alone must decide.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian account only, in Bodnăraş''s briefing of Liu Fang, Oct. 28, 1965. Made public: 2005 (an excerpt, Document 279 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 762). Names: Rusk, Mănescu, Balaceanu, Bodnăraş. Check: the U.S. record of the meeting.'
