- add:
    entry:
      id: cal.1967-01-22.vietnam-diplomacy
      when: 'Jan. 22'
      date: '1967-01-22'
      thread: vietnam-diplomacy
      c: 'On the train home from the hunting trip for the heads of the diplomatic missions at Bucharest, Davis, the U.S. ambassador, talks with Stoica and Mănescu on Vietnam and other matters, as Davis tells Ceaușescu on Jan. 31. Mănescu asks whether Washington rightly understands Romanian policy; Davis reports the talk there, as Mănescu asked.'
      n: '"[Transcript of the Discussions on the Occasion of the Reception by Comrade Nicolae Ceausescu of United States Ambassador in Bucharest, Richard H. Davis](https://digitalarchive.umd.edu/document/122593)" (Feb. 1, 1967), ANR, Fond CC al PCR, Secţia Relaţii Externe, dosar 2/1967, f. 1–20, trans. Larry L. Watts, Wilson Center Digital Archive. The Romanian record of Davis''s account, in the transcript of Jan. 31, 1967. Names: Mănescu, Ceaușescu. Check: the day of Davis''s report to Washington. Check: the year the document was first printed or posted; the Archive page gives none.'
      tags:
