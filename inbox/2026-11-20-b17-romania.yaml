- add:
    entry:
      id: cal.1965-10-28.china-2
      when: 'Oct. 28'
      date: '1965-10-28'
      place: bucharest
      thread: china
      also: [vietnam-diplomacy]
      c: 'Bodnăraş, for the Permanent Presidium, briefs Liu Fang, the Chinese ambassador, on Maurer''s talk with Crawford, Mănescu''s meeting with Rusk and Bhutto''s request for good offices on Kashmir, which the Presidium declined. Liu thanks him and says Rusk''s words show the real American intent.'
      n: '"[Note of the Audience of Liu Fang, Ambassador of the Chinese People''s Republic in Bucharest, with Emil Bodnaras, First Vice-President of the Council of Ministers of the S. R. of Romania](https://digitalarchive.umd.edu/document/122557)" (Oct. 28, 1965), ANR, fond C.C. al P.C.R., Secţia Relaţii Externe, dosar 4/1965, f. 215–237, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive''s file note gives the excerpt as Document 279 in Budura (2005), 762. Made public: 2005 (an excerpt, Document 279 in Budura, *Relațiile Româno-Chineze, 1880–1974: Documente*, 762). See [[cal.1965-10-03.vietnam-diplomacy]], [[cal.1965-10-13.europe-and-the-alliance]], [[cal.1965-10-14.vietnam-diplomacy]]. Names: Bodnăraş, Maurer, Mănescu, Rusk, Bhutto. Check: the note speaks of the briefing as ''yesterday'' in Liu''s reply and in Bodnăraş''s addition; whether it ran over two days.'
