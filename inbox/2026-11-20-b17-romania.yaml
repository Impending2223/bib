- add:
    entry:
      id: cal.1966-11-21.vietnam-diplomacy
      when: 'Nov. 21'
      date: '1966-11-21'
      place: bucharest
      thread: vietnam-diplomacy
      also: [vietnam-hanoi]
      c: 'Ceaușescu, Maurer, Bodnăraş and Niculescu-Mizil meet Nguyễn Duy Trinh, DRV Vice-Premier and foreign minister, and Ambassador Hoang Tu, on Trinh''s short stop at Bucharest after the Albanian and Bulgarian party congresses. Ceaușescu: Romania backs the DRV''s position and more aid, and wants a view on talks and on the congresses'' lessons. Trinh and Ceaușescu agree that the military and the political struggle go together.'
      n: '"[Transcript of Interviews at the Central Committee of Romanian Communist Party With the Delegation of the Vietnamese Worker''s Party](https://digitalarchive.umd.edu/document/122590)" (Nov. 23, 1966), Stenograma intrevederii la CC al PCR cu delegatia Partidelor celor ce muncesc din Vietnam [Transcript of Meetings at the RCP CC with the Workers Party of Vietnam Delegation], November 21, 1966, Fond CC al PCR, Secţia Relaţii Externe, 150/1966, nr. 2925, 14/XII/1966, trans. Larry L. Watts, Wilson Center Digital Archive. The Archive dates the transcript Nov. 23, 1966; the text gives Nov. 21, and ends with a dinner proposed for 1530 hrs. See [[cal.1966-10-11.vietnam-diplomacy]]. Names: Ceaușescu, Maurer, Bodnăraş, Nguyễn Duy Trinh. Check: the day, Nov. 21 in the text and Nov. 23 in the Archive''s heading and the transcript''s close. Check: the year the document was first printed or posted; the Archive page gives none.'
