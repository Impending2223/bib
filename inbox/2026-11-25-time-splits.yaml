      c: 'Zorin summons Kohler, 10:30 p.m.: the convoy refused the established procedures and was held; Moscow cannot accept his protest.'
      n: '[FRUS 1961–63, XV, doc. 226](https://history.state.gov/historicaldocuments/frus1961-63v15/d226) (Kohler to the Department, Oct. 12, 3 a.m.: "10:30 pm local time"). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Zorin, Kohler.'
