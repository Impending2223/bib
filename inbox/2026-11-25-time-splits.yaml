      - soviet-union
      c: 'Kennedy with Rusk, McNamara, Taylor and Thompson, 12:30 p.m.: Rusk would assemble the tripartite Free Style forces and ask the British and French to send convoys; Kennedy doubts more convoys should be blocked.'
      n: '[FRUS 1961–63, XV, doc. 221](https://history.state.gov/historicaldocuments/frus1961-63v15/d221) (memorandum of conference, 12:30 p.m.). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Taylor, Thompson.'
