      c: 'Rusk summons Dobrynin, 9 a.m.: eighteen American vehicles held at Babelsberg, the convoy held at Marienborn the day before; a unilateral change of established procedures, by force.'
      n: '[FRUS 1961–63, XV, doc. 220](https://history.state.gov/historicaldocuments/frus1961-63v15/d220) (the Department to Moscow, 10:07 a.m.: the Secretary summoned Dobrynin at 9:00 a.m.). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Rusk, Dobrynin.'
