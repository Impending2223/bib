- edit:
    id: cal.1966-11-24.china-leadership
    base: a18ef5ec
    kind: correct
    set:
      c: 'Mao reads Jiang Qing''s draft speech of Nov. 24 for the coming arts-and-literature rally and adds a paragraph: new literature and art have grown against the old; even Peking opera, hardest to reform, has new works; thirty years ago Lu Xun was the bold banner-bearer of the cultural revolution.{1}'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, late Nov. 1966 (the entry "11月下旬"). [[w.jianguo-yilai-mao-zedong]], XVIII, 396–399 (Nov. 24, 1966; Mao''s notes, "changed a little, for the Group''s comrades'' reference," on the draft Jiang Qing sent Nov. 24, and "back to Jiang Qing; some more changes, rather sounder," one o''clock (一时), Nov. 28, on the draft of Nov. 27, printed from the manuscripts and his revised copy; note 2: he softened her lines to the First Peking Opera Troupe and added that she worked "on the basis of others'' first creations"; note 4: he struck "loyal to Chairman Mao"; she spoke Nov. 28). Made public: 2013. To check: Jiang Qing, draft speech for the rally of the arts world, sent to Mao Nov. 24 and Nov. 27, 1966 (given Nov. 28) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 397 n.1). Split under R25b and R17: the acts moved out of this entry are entries of their own. Names: Mao Zedong, Jiang Qing, Lu Xun.'
      src:
        rows:
        - 'w.zedong-mao-zedong-nianpu VI, late Nov. 1966: ?'
        - 'w.jianguo-yilai-mao-zedong XVIII, 396–399: 1'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 397 n.1: 1'
      when: Nov. 24
- add:
    entry:
      id: cal.1966-11-28.china-leadership-7
      when: Nov. 28
      date: '1966-11-28'
      thread: china-leadership
      c: 'Mao, 1 a.m., on Jiang Qing 江青''s draft of the 27th: a paragraph added where she speaks of work groups: the trouble is their policy, not their form; units without groups relied on old leaders.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, late Nov. 1966 (the entry "11月下旬"). [[w.jianguo-yilai-mao-zedong]], XVIII, 396–399 (Nov. 24, 1966; Mao''s notes, "changed a little, for the Group''s comrades'' reference," on the draft Jiang Qing sent Nov. 24, and "back to Jiang Qing; some more changes, rather sounder," one o''clock (一时), Nov. 28, on the draft of Nov. 27, printed from the manuscripts and his revised copy; note 2: he softened her lines to the First Peking Opera Troupe and added that she worked "on the basis of others'' first creations"; note 4: he struck "loyal to Chairman Mao"; she spoke Nov. 28). Made public: 2013. To check: Jiang Qing, draft speech for the rally of the arts world, sent to Mao Nov. 24 and Nov. 27, 1966 (given Nov. 28) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 397 n.1). See [[cal.1966-11-24.china-leadership]]. Names: Mao Zedong, Jiang Qing.'
      time: 1966-11-27T17:00Z
      time_zone: Asia/Shanghai
      tags:
      - name:mao-zedong
      - name:jiang-qing
      - polity:prc
      - vis:only:prc
