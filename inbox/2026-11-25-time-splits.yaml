      c: 'Mao reads Jiang Qing''s draft speech of Nov. 24 for the coming arts-and-literature rally and adds a paragraph: new literature and art have grown against the old; even Peking opera, hardest to reform, has new works; thirty years ago Lu Xun was the bold banner-bearer of the cultural revolution.{1}'
