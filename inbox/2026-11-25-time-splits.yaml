      c: 'Herrick, commanding the patrol, 1:27 p.m., Washington time: many reported contacts and torpedoes "doubtful," "freak weather effects," "over-eager sonarmen"; no visual sightings; a "complete evaluation" asked before further action.'
      n: '[FRUS 1964–68, I, doc. 276](https://history.state.gov/historicaldocuments/frus1964-68v01/d276) (editorial note, after the chronology of Aug. 28: "At 1:27 p.m., the Maddox reported"; the report in message 041727Z, received at the National Military Command Center an hour and a half to two hours later). Works read for this part of the entry it was split from: [[w.marolda-united-states-navy-and]], 440 (the lunch at 1 p.m., Herrick''s doubts); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the Maddox''s doubts); [[w.gibbons-u-s-government-and]], II, 290 (Herrick''s doubts at 1:27 p.m.); [[w.mcnamara-in-retrospect]], ch. 5 at nn.5–10 (Herrick''s message); [[w.johnson-vantage-point]], 114–17; [[w.branch-pillar-of-fire]], 434–36; [[w.bernstein-guns-or-butter]], 336–37; [[w.logevall-choosing-war]], 198–99 (Herrick''s cable, "freak weather effects" and "overeager sonarmen"; not "complete evaluation"); [[w.lich-su-khang-chien-chong-my]], III, 365–66 (Herrick''s cable, the torpedo contacts "doubtful"). To check: Msg, CTG72.1 041754Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 440 n.9); Herrick''s message of 1:27 p.m., Aug. 4, 1964, NSF, Country File, Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], II, 290 n.34). See [[cal.1964-08-04.vietnam]]. Names: Herrick.'
      time: 1964-08-04T17:27Z
      time_zone: America/New_York
      tags:
      - name:herrick-john-j
      - place:gulf-of-tonkin
- add:
