    set:
      c: 'Morning, Shanghai. Mao hears Yang Chengwu relay Zhou Enlai''s 8:20 telephone call from Wuhan: report of Wuhan events to be oblique, no names; protect Chen Zaidao and others. Mao: Wuhan is to be treated as an error; if he has resolve, we cannot get out and Zhou cannot get in, yet he has not ordered that none pass; agrees to protect Chen.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 22, 1967. Made public: 2013. Split under R25b and R17: the acts moved out of this entry are entries of their own. Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Zhang Chunqiao, Yu Lijin, Wang Dongxing, Chen Zaidao, Xie Fuzhi, Wang Li.'
