tment official''s phrase "neutral in thought, word, and deed," and Rusk on television "to try to clarify the word"; not the hot line or the hour of 7:57). To check: [[w.oren-six-days-of-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.quandt-peace-process]]; [[w.six-day-war]]; [[w.segev-1967]]; [[w.shlaim-iron-wall]]; [[w.shlaim-lion-of-jordan]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.klinghoffer-vietnam-jews-and-the]]; the NSC Histories "Mid-East Crisis: Summary" and "The President in the Middle East Crisis, May 12–June 19, 1967," NSF, LBJ Library; Califano to Johnson, June 5, 1967, 5:10 p.m., Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 428). See [[cal.1967-05-16.middle-east]]; [[cal.1963-08-30.testing]]. Split under R25b and R17: the Miller Center''s catalogue and FRUS XIX, doc. 155, give McNamara''s call on the hot line its own hour, 7:57 a.m., and Dallek (428) puts McCloskey''s words in the afternoon; each is now an entry. Check: whose morning, Cairo''s or Israel''s clock, an hour apart; the range takes both.'
