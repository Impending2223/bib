      c: Egypt accepts the cease-fire the night of June 8. June 9, Israel attacks Syria on the Golan Heights; Nasser resigns, and withdraws the resignation June 10.{1}
      n: 'FRUS 1964–68, XIX, docs. [243](https://history.state.gov/historicaldocuments/frus1964-68v19/d243), [244](https://history.state.gov/historicaldocuments/frus1964-68v19/d244), [246](https://history.state.gov/historicaldocuments/frus1964-68v19/d246), [247](https://history.state.gov/historicaldocuments/frus1964-68v19/d247), [252](https://history.state.gov/historicaldocuments/frus1964-68v19/d252), [255](https://history.state.gov/historicaldocuments/frus1964-68v19/d255). [[w.dobrynin-in-confidence]], 165–66 (the hot line, the fleet, the break, the cease-fire; not the words quoted, nor the men with Johnson); [[w.dallek-flawed-giant]], 431 (Syria agrees to halt June 9, Israel fights on, to June 10; Johnson orders the Sixth Fleet east; Israel agrees to a cease-fire on all fronts; not the hot-line text or the others at the table). Made public: Helms''s account of the morning of June 10, in Saunders''s memorandum of Oct. 22, 1968, FRUS 1964–68, XIX (2004). See [[cal.1967-06-05.middle-east]]. Split under R25b and R17: FRUS XIX, doc. 243, gives Kosygin''s message on the hot line its own hour, 8:48 a.m., June 10 (already the entry [[cal.1967-06-10.middle-east-six-day-war]]); the Soviet break with Israel, the cease-fire on the Syrian front and Resolution 236 are now entries of their own. Names: Nasser.'
      src:
        rows:
        - 'w.dallek-flawed-giant 431: ?'
      tags:
      - name:nasser-gamal-abdel
      when: June 9–10
    unset:
    - also
