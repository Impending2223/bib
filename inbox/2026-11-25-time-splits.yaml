      c: 'Salinger, a statement at the Benson Hotel, 10:30 a.m.: Harris "confirmed the total inaccuracy" of the spots; "I state categorically that Mr. Finney''s 11th hour emergence in this campaign ... has more the purpose of advancing Mr. Humphrey''s campaign than that of Senator McCarthy."'
      n: '[[w.palermo-in-his-own-right]], 215–16; 215 n.130 (the place and the hour: "Statement by Pierre Salinger, Benson Hotel, May 27, 1968, 10:30 a.m."). To check: Salinger''s statement, May 27, 1968, 10:30 a.m., RFK Papers, PCP, Press Division, Box 15, JFK Library (cited by [[w.palermo-in-his-own-right]], 215 n.130). Salinger "followed up" vanden Heuvel''s telegram (215). See [[cal.1968-05-27.robert-kennedy]]. Names: Salinger, Humphrey, McCarthy.'
