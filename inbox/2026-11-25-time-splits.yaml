      date: '1964-08-04'
      place: washington
      thread: vietnam-tonkin
      c: 'The National Security Council, 6:15 to 6:40 p.m.: McNamara reports the attacks on the two destroyers continuing; Rusk: an immediate and direct reaction is necessary; air strikes agreed on two bases in the north of North Vietnam and two base complexes in the south.'
      n: '[FRUS 1964–68, I, doc. 278](https://history.state.gov/historicaldocuments/frus1964-68v01/d278) (summary notes of the 538th meeting, 6:15–6:40 p.m.). Works read for this part of the entry it was split from ("The NSC and the congressional leaders; strikes ordered"): [[w.marolda-united-states-navy-and]], 443–44; [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the NSC; the strikes); [[w.cosmas-joint-chiefs-of-staff-2012]], 106–108; [[w.gibbons-u-s-government-and]], II, 289–97; [[w.moyar-triumph-forsaken]], 311–13; [[w.mcnamara-in-retrospect]], ch. 5 at nn.5–10 (the NSC at 6:15 p.m., the strike authorized); [[w.branch-pillar-of-fire]], 434–36; [[w.bernstein-guns-or-butter]], 336–37; [[w.dallek-flawed-giant]], 150–53 (the NSC in the evening); [[w.johnson-vantage-point]], 114–17. To check: Notes of the NSC meeting, Aug. 4, 1964, NSF, NSC Meetings File, LBJ Library (cited by [[w.dallek-flawed-giant]], 152 n.81); Msg, JCS 042119Z Aug 1964 (cited by [[w.marolda-united-states-navy-and]], 443 n.21). Check: the strike execute message, JCS 7720, went to CINCPAC at 5:19 p.m. (doc. 276); McNamara (ch. 5) has the Ticonderoga''s order at 7:22 p.m.; Branch (436) the strikes authorized at 7:22 p.m. See [[cal.1964-08-04.vietnam]]. Names: McNamara, Rusk.'
      time: 1964-08-04T22:15Z
      time_zone: America/New_York
      tags:
