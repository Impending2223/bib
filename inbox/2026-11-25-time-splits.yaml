      n: 'Radio and Television Report to the American People Following Renewed Aggression in the Gulf of Tonkin, [1963–64 Pub. Papers 927](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=167) (Aug. 4, 1964) (the note: began speaking at 11:36 p.m., eastern daylight time; from the Fish Room); [FRUS 1964–68, I, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v01/d286) (editorial note: 11:36 p.m.). Works read for this part of the entry it was split from: [[w.marolda-united-states-navy-and]], 446 (the address, 11:36 p.m.); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 521–22 (the address after 11:30 p.m.); [[w.cosmas-joint-chiefs-of-staff-2012]], 106–108; [[w.gibbons-u-s-government-and]], II, 289–97 (the address at 11:37 p.m.); [[w.bernstein-guns-or-butter]], 336–37; [[w.dallek-flawed-giant]], 150–53 (the address that night); [[w.johnson-vantage-point]], 114–17; [[w.johnson-white-house-diary]], 187–89 (after 11 p.m. on the air: "limited and fitting," "We still seek no wider war"; not the hour); [[w.goodwin-remembering-america]], 357–58 (Goodwin called to the Fish Room after 11 p.m.; "limited and fitting," "We still seek no wider war"; not the hour). To check: Joint Staff, JCS, Tonkin Gulf Composite Diary (cited by [[w.marolda-united-states-navy-and]], 446 n.26b). Check: Branch has the address at 11:34 p.m. (436); Logevall, 199, and Gibbons put it at 11:37 p.m. See [[cal.1964-08-04.vietnam]]. Names: Johnson.'
      time: 1964-08-05T03:36Z
