      n: '[FRUS 1964–68, XIX, doc. 150](https://history.state.gov/historicaldocuments/frus1964-68v19/d150); [doc. 152](https://history.state.gov/historicaldocuments/frus1964-68v19/d152); [doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v19/d155); [doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v19/d156); [doc. 157](https://history.state.gov/historicaldocuments/frus1964-68v19/d157); [doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v19/d159). [Johnson and McNamara, 7:57 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-june-5-1967), Conversation WH6706-01-11903 (Miller Center). [[w.drea-mcnamara-clifford-and-the-2011]], 441–42 (the Egyptian airfields struck; the hot line, McNamara''s call, the reply; nineteen messages and a duplicate to June 10; the war); [[w.johnson-vantage-point]], 297–99 (the attack, the hot line, the spokesman''s words); [[w.dallek-flawed-giant]], 427–28 (the war, the neutrality statement); [[w.mcnamara-in-retrospect]], ch. 10 (at the Pentagon from 7 a.m.; within the hour the War Room''s general: Kosygin on the hot line; McNamara has it patched to the Situation Room and calls the President). [[w.rusk-as-i-saw-it-1990]], 386 (the attack; the hot line); [[w.califano-triumph-and-tragedy-of]], 204–05 (McCloskey: "neutral in thought, word, and deed"; Ginsburg and Fortas on the Neutrality Act; Christian and Rusk to back away); [[w.dallek-flawed-giant]], 427–28 (June 5, the Israelis begin a six-day war, defeating Egyptian, Jordanian and Syrian forces; Johnson at a newspaper photograph of himself: "There''s a picture of a sad man"; that afternoon a State Department spokesman: the United States "neutral in thought, word and deed"; not the air strikes, the hot line or McCloskey by name); [[w.johnson-white-house-diary]], 520–22 (two calls in the night, about 4:30 and an hour later; Johnson: "We have a war on our hands—in the Middle East"; a State Department official''s phrase "neutral in thought, word, and deed," and Rusk on television "to try to clarify the word"; not the hot line or the hour of 7:57). To check: [[w.oren-six-days-of-war]]; [[w.quandt-lyndon-johnson-and-the]]; [[w.quandt-peace-process]]; [[w.six-day-war]]; [[w.segev-1967]]; [[w.shlaim-iron-wall]]; [[w.shlaim-lion-of-jordan]]; [[w.spiegel-other-arab-israeli-conflict]]; [[w.little-making-of-a-special]]; [[w.ben-zvi-lyndon-b-johnson-and]]; [[w.klinghoffer-vietnam-jews-and-the]]; the NSC Histories "Mid-East Crisis: Summary" and "The President in the Middle East Crisis, May 12–June 19, 1967," NSF, LBJ Library; Califano to Johnson, June 5, 1967, 5:10 p.m., Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 428). See [[cal.1967-05-16.middle-east]]; [[cal.1963-08-30.testing]]. Split under R25b and R17: the acts moved out of this entry are entries of their own. Names: McNamara, Kosygin, McCloskey, Johnson. Check: whose morning, Cairo''s or Israel''s clock, an hour apart; the range takes both.'
