      c: 'Kohler to Zorin in Moscow, 8 p.m.: the detention of the convoy at Babelsberg; he asks that Khrushchev be told. Zorin: the convoys had refused the usual inspection.'
      n: '[FRUS 1961–63, XV, doc. 223](https://history.state.gov/historicaldocuments/frus1961-63v15/d223) (Kohler to the Department, midnight Moscow time: "2000 local time"). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Kohler, Zorin, Khrushchev.'
      time: 1963-10-11T17:00Z
