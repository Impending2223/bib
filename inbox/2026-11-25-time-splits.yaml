      c: 'An American convoy of eighteen vehicles held at Marienborn, Oct. 10, and again at Babelsberg, Oct. 11: its men will not dismount.{1} Through, Oct. 12.{6}'
      n: '[FRUS 1961–63, XV, doc. 220](https://history.state.gov/historicaldocuments/frus1961-63v15/d220); [doc. 228](https://history.state.gov/historicaldocuments/frus1961-63v15/d228). [[w.rusk-as-i-saw-it-1990]], 227; [[w.sorensen-kennedy]], 600 (the squabble in the fall of 1963 over dismounting). Check: Rusk puts the harassment over the tailgates in September 1963 (227). Split under R25b and R17: the talks and the meeting of Oct. 11 are entries of their own. See [[cal.1963-06-26.berlin-and-vienna]].'
