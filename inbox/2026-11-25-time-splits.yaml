- edit:
    id: cal.1967-07-25.china-leadership
    base: 4ba3eb8e
    kind: correct
    set:
      c: 'Afternoon. Mao reads the Wuhan Military Region committee''s draft "Notice of the PLA Wuhan Forces" (July 24) and drafts the Center''s reply to it: their stand and policy now right, the notice to be published;{1} erring cadres, Chen Zaidao too, whom the masses want brought down, may stand and join the revolution if they mend and are forgiven;{2} work on the troops and the Million Heroes; the left to take no revenge; watch for bad men. The notice is posted July 26 and printed July 29.{3}'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 25, 1967; [[w.jianguo-yilai-mao-zedong]], XIX, 127–131 (July 25, 1967; Mao''s note of 5 p.m. July 25 and his draft reply of the Center to the Wuhan Military Region''s telegram of 8:10 p.m. July 24 with its notice; his note of 10 p.m. to Lin Biao on the draft letter ''To the revolutionary masses of Wuhan and the commanders and fighters'', which he adds a paragraph to, that the Center issued July 27); [[w.mao-zedong-zhuan]], VI, ch. 76 nn.56, 57 (July 25 Mao drafts the reply of the Center to the Party committee of the Wuhan Military Region, n.56: ''for cadres who have made serious errors, including you and comrade Chen Zaidao whom the broad revolutionary masses want to overthrow, if they no longer hold to the errors, correct them in earnest and are understood by the masses, they may still stand up and join the revolutionary ranks''; Chen Zaidao writes in his memoirs that without Mao''s word ''comrade'' Lin Biao and the rest could have done for them easily, n.57). [[w.teiwes-tragedy-of-lin-biao]], 84 n.57 (Mao approves the slogan "Drag out the small handful" on the 24th or 25th, and again on the 27th; Guan Feng coined it in January 1967); [[w.teiwes-tragedy-of-lin-biao]], 84 n.55 (Mao and Lin approve two letters, the harsh open letter of the 27th and a milder one, dated the 26th, to the Party committee of the Wuhan Military Region, which speaks of "Comrade Chen Zaidao"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: Wuhan Military Region Party Committee Standing Committee, telegram of 8:10 p.m. July 24, 1967 to Mao Zedong, Lin Biao, Zhou Enlai and the Center''s bodies, sending the ''Notice of the PLA Wuhan forces'' on the ''July 20 incident'' for examination: the incident stirred up by a very few in the army and the ''Million Heroes'' (Baiwan xiongshi 百万雄师), Chen Zaidao its ringleader; the region''s leaders made errors of direction and line; posted July 26, printed in the Renmin ribao July 29 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 128 n.3); Draft Letter to the revolutionary masses of Wuhan and the broad commanders and fighters (Gei Wuhanshi geming qunzhong he guangda zhizhanyuan de yi feng xin 给武汉市革命群众和广大指战员的一封信), forwarded by Lin Biao July 24, 1967; issued by the Center, State Council, Military Commission and Cultural Revolution Group July 27 (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 130 n.1); Mao Zedong 毛泽东, reply telegram of the Center to the Party committee of the Wuhan Military Region 武汉军区党委, drafted for the Central Committee (manuscript 手稿), July 25, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.56); Chen Zaidao 陈再道, remark on the word "comrade" in Mao''s telegram of July 25, 1967, in [[w.chen-zaidao-huiyilu]], II, 363 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.57); Shen Tao-sheng, "The ''Gang of Four'' and Lin Piao," *Renmin ribao*, May 18, 1978, translated in FBIS, May 24, 1978, E6 (cited by [[w.teiwes-tragedy-of-lin-biao]], 84 n.57a); [[w.zhonggong-dangshi-jiaoxue-cankao]], XXV, 505, 524 (cited by [[w.teiwes-tragedy-of-lin-biao]], 84 n.57b). Split under R25b and R17: the acts moved out of this entry are entries of their own. Names: Mao Zedong, Chen Zaidao, Lin Biao.'
      src:
        rows:
        - 'w.zedong-mao-zedong-nianpu VI, July 25, 1967: 1, 2, 3'
        - 'w.jianguo-yilai-mao-zedong XIX, 127–131: 1, 2, 3'
        - 'via w.jianguo-yilai-mao-zedong XIX, 128 n.3: 1, 2, 3'
        - 'via w.jianguo-yilai-mao-zedong XIX, 130 n.1: 1, 2, 3'
        - 'w.mao-zedong-zhuan VI, ch. 76 nn.56, 57: 2'
        - 'w.teiwes-tragedy-of-lin-biao 84 n.57: ?'
        - 'via x.1978-05-18.shen-tao-sheng-gang-of-four-and-lin-piao-renmin-ribao: ?'
        - 'w.teiwes-tragedy-of-lin-biao 84 n.55: ?'
