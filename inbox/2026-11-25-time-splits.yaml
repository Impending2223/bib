      n: '[[w.howard-then-the-burnings-began]], 82–85; [[w.peirce-great-plains-states-of]], 217 (the riots, three days). The hours (Howard, 84–85): Saturday evening, July 2, the youths gather; 12:49 a.m., a woman calls the police; 1 a.m., the property violence begins. The time is the first day''s. Check: Omaha''s clock in July 1966 (daylight time or not); the range takes both readings. Split under R25b and R17: Howard (85) gives the call for the Guard and the Guard''s march their own hours, 12:30 and 1:10 a.m., July 5; they, the mayor''s order and his meeting at the YMCA are now entries.'
      src:
        rows:
        - 'w.howard-then-the-burnings-began 82–85: 1'
        - 'w.peirce-great-plains-states-of 217: 1'
      tags:
