      c: 'Morning, Shanghai, the Hongqiao Guesthouse. Mao hears Yang Chengwu relay Zhou Enlai''s telephone call from Wuhan. Mao: Wuhan is to be treated as an error; if he has resolve, we cannot get out and Zhou cannot get in, yet he has not ordered that none pass; agrees to protect Chen Zaidao and others.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 22, 1967 (上午, in the morning, at the Hongqiao Guesthouse, 虹桥宾馆). Made public: 2013. Split under R25b and R17: the nianpu gives Zhou''s call its own hour, 8:20 (八时二十分), and Mao''s later talks of the day theirs, 11 a.m., 1:30 and 2:40 p.m.; each is now an entry. Names: Mao Zedong, Yang Chengwu, Zhou Enlai, Chen Zaidao.'
