      when: Nov.
      date: 1960-11
      thread: china-leadership
      c: The Institute of Entomology of the Academy of Sciences 中國科學院昆蟲研究所 proposes eating insects. In two weeks it has gathered over 1,200 jin of edible kinds, high in protein and oil, and made soy sauce, paste, floss and cooking oil from them, and cakes and biscuits; it names thirteen kinds and gives simple ways of roasting, frying, grinding to flour, pressing oil, and making sauce and cakes.
      n: '[[w.yang-jisheng-mubei]], II, 960–961. Made public: 2008. To check: Institute of Entomology, Chinese Academy of Sciences, proposal on eating insects, Nov. 1960 (named by [[w.yang-jisheng-mubei]], II, 960–961; the table''s source line, II, 961; no note). Check: the day.'
