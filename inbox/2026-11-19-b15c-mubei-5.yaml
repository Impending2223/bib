      id: cal.1960-09-18.china-leadership-5
      when: Sept. 18
      date: '1960-09-18'
      thread: china-leadership
      c: 'Wang Yanchun 王延春, secretary of the Hubei 湖北 provincial committee''s secretariat, writes the first secretary Wang Renzhong 王任重 and the governor Zhang Tixue 張體學 on Tonghaikou 通海口 commune, Mianyang 沔陽 county: the "communist wind," blind orders on production, grain and private plots are worst there. Units from province down to team have levelled and transferred, from land, grain and houses to sickles and baskets; most teams reckon the loss at about 50 yuan a head, some at over 100, a member''s pay for one to two years. The cadres run production by telephone, one order for the whole commune, which the masses call "one cut."'
      n: '[[w.yang-jisheng-mubei]], II, 805. Made public: 2008. To check: Wang Yanchun 王延春, letter to Wang Renzhong 王任重 and Zhang Tixue 張體學 on Tonghaikou commune, Sept. 18 (named by [[w.yang-jisheng-mubei]], II, 805; no note). Check: the year; the book gives Sept. 18 after its report of Nov. 3, 1960.'
