- cite:
    id: cal.1961-11-12.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1110 (the Center decides on Nov. 12 to call the five-level cadre conference, to unify thought and overcome the difficulties; the report is then drafted under Liu Shaoqi and Deng Xiaoping)'
    units: D
- cite:
    id: cal.1962-01-10.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1111 n.2 (Liu sends the first draft on Jan. 8 and 9, the second draft''s first two parts at 11 p.m. on the 9th; Mao reads through the night and at 10 a.m. on the 10th proposes putting the report back three days, for talk on the rural basic accounting unit and other questions; he then changes his mind, leaves the third part unread, and has the report printed for three days'' group discussion before the Politburo takes it up)'
    units: A-C
- cite:
    id: cal.1962-01-11.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1111 n.3 (the conference opens Jan. 11, with 7,118 attending; planned at four levels, it is widened at Mao''s suggestion to five by adding the county heads and those of equal rank in factories and mines)'
    units: A-B
- cite:
    id: cal.1962-01-18.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1112–1113 n.6 (Peng Zhen on Jan. 18: the Secretariat is first to answer for the errors, and the Chairman, Liu Shaoqi and the Standing Committee too if they should; the transition in three to five years and the mess halls were Mao''s approvals; Deng Xiaoping breaks in with Mao''s saying that the report makes him a sage and that no sage exists; Peng: Mao''s prestige is Everest or Taishan, and those who fear to criticize fall at once)'
    units: F-I
- cite:
    id: cal.1962-01-24.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1113 (the second draft is out on Jan. 22; on the 24th Mao, having read it, approves its direction)'
    units: A
- cite:
    id: cal.1962-01-25.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1113 (on Jan. 25 Liu presides at Huairen Hall over the enlarged Politburo, which passes the report)'
    units: A-B
- cite:
    id: cal.1962-01-26.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1113 (on the afternoon of Jan. 26 Mao decides that the report goes out as a written paper and that Liu gives an oral report at the session of the 27th; Liu writes the outline overnight, and Mao and the other Standing Committee members read and agree it before the session)'
    units: B-C
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1113–1115 n.9 (2 p.m., Mao presiding; Liu speaks three hours: the successes and the faults no longer one finger to nine but three to seven, in some regions the faults the larger; the peasants'' phrase, three parts natural calamity, seven parts man-made; the Center first to answer, then the provincial committees; the three red banners to be tried by practice; Mao puts in that quite a few have had edema)'
    units: A-F
- cite:
    id: cal.1962-01-29.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1115–1116 n.11–13 (on the afternoon of Jan. 29, after Mao has said ''vent by day, see plays at night, two dry meals and one thin'' and the conference is held on, Lin Biao speaks, with Mao presiding: the Three Red Banners right, the difficulties the result of not following Mao''s instructions; Mao says it is a very good speech on the Party''s line and military policy and asks for it to be collated in a week or half a month)'
    units: B-D, G-H
- cite:
    id: cal.1962-03-20.china-leadership-6
    item: '[[w.yang-jisheng-mubei]], II, 1116 n.14 (on Mar. 20 Mao writes to Tian Jiaying and Luo Ruiqing of the collated speech: read through, a very good, weighty piece, read with great pleasure)'
    units: B
- cite:
    id: cal.1962-01-30.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1116–1117 n.15 (the book puts Mao''s speech to the conference on the morning of Jan. 30; it does not take up the famine but democratic centralism, with no high centralism without high democracy, or Yugoslavia''s course)'
    units: B-C
- variant:
    id: cal.1962-01-30.china-leadership
    unit: A
    witness: w.yang-jisheng-mubei
    reads: Mao speaks to the conference on the morning (上午) of Jan. 30
    at: II, 1116
- cite:
    id: cal.1962-02-26.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 1118–1119 n.17 (Chen Yun''s talk of Feb. 26 gathers the grim situation in five points: the great fall in farm output; capital construction beyond the state''s means; too many notes printed, inflation; city notes flowing to the countryside and speculation; falling living standards in the cities)'
    units: A
- cite:
    id: cal.1962-02-21.china-leadership-4
    item: '[[w.yang-jisheng-mubei]], II, 1119 n.18 (Liu at the Xilou meeting: the Seven Thousand conference was not frank enough on the difficulties; the present is a period of recovery but an abnormal, almost emergency one, to be met by extraordinary means)'
    units: D
- cite:
    id: cal.1962-03-17.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1118–1119 n.17–18 (on Mar. 14 Liu, Zhou and Deng fly to Wuhan; Mao agrees with the majority of the Standing Committee and approves Chen Yun as head of the Finance and Economics Group, but will not have the situation seen as all black, says the deficit is false, and asks for another discussion)'
    units: B
- cite:
    id: cal.1962-05-11.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 917 n.146 (in his speech of May 11 Deng says that for the places that have rehabilitated, the number is known: 400,000 in Henan, and in fact more; in the whole country perhaps 10 million; the number was cut from his Selected Works)'
    units: B
- src:
    id: cal.1962-05-11.china-leadership-3
    rows:
    - 'via w.yang-jisheng-mubei II, 917 n.146: B'
- cite:
    id: cal.1962-05-11.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 1121 n.21 (Deng at the May conference: one package settlement, all hats off)'
    units: C
- src:
    id: cal.1962-05-11.china-leadership-3
    rows:
    - 'via w.yang-jisheng-mubei II, 1121 n.21: C'
- cite:
    id: cal.1962-06-16.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1126 (Peng Dehuai sends the Center and Mao an appeal of about 80,000 characters on June 16)'
    units: A
- cite:
    id: cal.1962-02-27.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1126–1127 n.32 (Wang Jiaxiang''s letter of Feb. 1962 to Zhou, Deng and Chen Yi, sent as an internal communication: a mild foreign policy; no open split with the Soviet Union; a milder line to the United States, no Korean-style war; the Sino-Indian deadlock to be broken; support to revolutions to be ''seeking truth from facts'' and within China''s means, armed struggle not the only road)'
    units: A, D, F
- src:
    id: cal.1962-02-27.china-leadership-2
    rows:
    - 'via w.yang-jisheng-mubei II, 1127 n.32: A, D, F'
- cite:
    id: cal.1962-03-06.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1126 n.30–31 (at the Canton meeting of Mar. 1962 Zhou and Chen Yi speak of respect for intellectuals, Chen Yi proposing to take the bourgeois intellectuals'' hat off and give the working people''s intellectuals their crown; Lu Dingyi strongly opposed it and in 1979 owned his view had been ''left'')'
    units: B
- cite:
    id: cal.1962-08-05.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1128–1129 n.35 (Aug. 5: some comrades judge the situation too dark; with household contracting, in six months the countryside''s class divisions show badly, with sales of land, purchases, usury, second wives; the Jan. 1959 reversal on Peng: most of the anti-Right struggle of 1959 was mistaken)'
    units: D-G
- cite:
    id: cal.1962-08-06.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1128 n.34 (on Aug. 6, without consulting anyone, Mao speaks on class, the situation and contradictions: socialism or capitalism, the cooperatives or contracting households; the conference turns to the ''dark wind,'' the ''go-it-alone wind'' and the ''wind of reversing verdicts'')'
    units: E-F
- cite:
    id: cal.1962-08-09.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1128–1129 n.35 (Aug. 9: ''You press me; you have talked of the dark for years''; and on where go-it-alone comes from: the Party holds many petty bourgeois, rich-peasant sons, men gone bad, concubines, branch secretaries treating the masses as slaves)'
    units: D-F
- cite:
    id: cal.1962-08-11.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1128 n.35 (Aug. 11: those who do not back the general line and the red banners paint the situation black)'
    units: B
- cite:
    id: cal.1962-08-15.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1128–1129 n.35 (Aug. 15: some have no drive left; they drive the go-it-alone drive, the dark drive, the drive to talk of faults; with talk of the bright side, the successes and the collective economy they would have none)'
    units: B
- cite:
    id: cal.1962-08-20.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1129 n.35 (Aug. 20: two years and more of talk of difficulty and darkness; to speak of the bright is no longer lawful)'
    units: B
- cite:
    id: cal.1962-08-22.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1130 (Peng writes a second time to Mao and the Center on Aug. 22, two days before the conference ends, again denying the anti-Party group and the plot with foreigners; it is taken for a new attack)'
    units: A
- cite:
    id: cal.1962-09-03.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1130 n.38 (on Sept. 3, at the preparatory meeting for the Tenth Plenum, Mao calls a small meeting and has Peng''s two letters taken to the groups for discussion, which runs to the plenum''s end; Huang Kecheng, Zhang Wentian, Zhou Xiaozhou, Tan Zheng, Deng Hua, Gan Siqi and Hong Xuezhi are criticized and make self-criticisms)'
    units: A
- cite:
    id: cal.1962-09-08.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 1131 (on Sept. 8 at the Southwest group Yan Hongyan first raises the novel *Liu Zhidan*, saying it uses Liu to propagate Gao Gang; Kang Sheng follows, asking why Gao should be propagated now; their words go out in bulletin no. 72)'
    units: A
- cite:
    id: cal.1962-09-24.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 1131 n.44 (on Sept. 27 the plenum decides to set up a commission to examine Xi Zhongxun, Jia Tuofu, Liu Jingfan and others, with Kang Sheng at its head; at Mao''s speech of Sept. 24 Kang passes a note that using a novel for anti-Party acts is a great invention, and Mao reads it out)'
    units: A-B
- cite:
    id: cal.1962-09-24.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1130 n.38–39 (the Central Committee sets up a case group under He Long to examine Peng Dehuai, Huang Kecheng and Zhang Wentian)'
    units: A
