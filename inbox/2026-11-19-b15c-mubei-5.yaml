      when: Dec. 15
      date: '1960-12-15'
      thread: china-leadership
      c: 'The Liaoning 遼寧 provincial, city and county committees'' work group completes its summary of the rectification and commune pilot at Fanhe 泛河 commune, Tieling 鐵嶺 county 鐵嶺縣泛河公社整風整社試點工作總結. In the grain drive of 1959 the commune ordered that whoever hid a grain hid a bullet and was a counterrevolutionary; its Party secretary Xu 徐 laid a rope on the table before the branch secretaries of the Yangweilou 楊威樓 district. 67 of the commune''s cadres beat people, 88 were beaten, 112 "debated." The summary records the blind commanding of 1958–60: seedlings spaced by a measuring stick, a member who spaced them wider "debated" until he owned to sabotage. The Liaoning committee sends it to the Northeast Bureau 東北局 on Dec. 25.'
      n: '[[w.yang-jisheng-mubei]], II, 790–791 n.39; [[w.yang-jisheng-mubei]], II, 951 n.58. Made public: 2008. To check: Liaoning provincial, city and county committees'' work group 省、市、縣委工作組, "Tieling xian Fanhe gongshe zhengfeng zhengshe shidian gongzuo zongjie" 《鐵嶺縣泛河公社整風整社試點工作總結》, Dec. 15, 1960, sent by the Liaoning Provincial Committee to the Northeast Bureau Dec. 25, 1960 (cited by [[w.yang-jisheng-mubei]], II, 791 n.39; II, 951 n.58).'
