      id: cal.1960-01-08.china-leadership-4
      when: Jan. 8
      date: '1960-01-08'
      thread: china-leadership
      c: The Mianyang 綿陽 prefectural committee, Sichuan 四川, reports on remaking the backward communes and teams in the socialist education movement 關於在社會主義教育運動中改造落後社、隊的情況報告. It holds that Xinglong 興隆 commune of Mianzhu 綿竹 county, the county's richest in land and water, lost 30.8 percent of its grain, 51 percent of its pigs and 12 percent of its oxen under the Rightist opportunists led by its Party secretary Ding Renfa 丁仁發, and that members' attendance was only 50 percent; and that at Suhe 蘇河 commune of Qingchuan 青川 county capitalist tendencies left fields waste and output down year on year. The struggle against the Right is to put another layer of steel round the iron people's commune and more oil in the Leap's cart.
      n: '[[w.yang-jisheng-mubei]], II, 917 n.144. Made public: 2008. To check: Mianyang Prefectural Committee of the CCP 中共綿陽地委, "Guanyu zai shehuizhuyi jiaoyu yundong zhong gaizao luohou she, dui de qingkuang baogao" 《關於在社會主義教育運動中改造落後社、隊的情況報告》, Jan. 8, 1960, First Prefectural Committee Secretaries'' Document no. 25 第一次地委書記文件之25 (cited by [[w.yang-jisheng-mubei]], II, 917 n.144).'
      src:
