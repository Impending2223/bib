      c: Li Xiannian 李先念, Vice-Premier, tells the national telephone conference 全國電話會議 to press the purchase of non-staple foods. Of the eggs bought, 80 percent go to export and 20 percent are sold at home, and of the home share the first claim is the foreigners in China, the second the bourgeois intellectuals. He puts it that under the dictatorship of the proletariat the proletariat eats no eggs, and under the worker-peasant alliance neither workers nor peasants do.
      n: '[[w.yang-jisheng-mubei]], II, 958–959. Made public: 2008. To check: Li Xiannian, speech to the national telephone conference, Apr. 19, 1960 (named by [[w.yang-jisheng-mubei]], II, 958; no note). Names: Li Xiannian.'
