      id: cal.1960-11-09.china-leadership-8
      when: Nov. 9
      date: '1960-11-09'
      thread: china-leadership
      c: 'The party group of the Academy of Sciences 中國科學院黨組 writes the Center and Mao Zedong 毛澤東 with its proposal to make grain substitutes on a large scale 關於大辦糧食代用品的建議. After the Center''s instruction to support agriculture, it has worked in recent months on substitutes, and offers those it takes to be nourishing, harmless, plentiful in material and simple to make: acorn flour, maize-root and wheat-root flour, leaf protein, "artificial meat essence" (a yeast), chlorella and scenedesmus. It counts over 8 billion jin of acorns a year, of which a fifth made into flour would give 600 to 700 million jin, and several billion jin of flour from a fifth of the maize and wheat roots.'
      n: '[[w.yang-jisheng-mubei]], II, 959–960; [[w.yang-jisheng-mubei]], II, 945. Made public: 2008. To check: Party group of the Chinese Academy of Sciences 中國科學院黨組, "Guanyu daban liangshi daiyongpin de jianyi" 《關於大辦糧食代用品的建議》, Nov. 9, 1960 (named by [[w.yang-jisheng-mubei]], II, 959; no note). Names: Mao Zedong. See [[cal.1960-11-03.china-leadership-7]].'
      src:
