      thread: china-leadership
      c: 'The Jilin 吉林 provincial committee forwards the report of the party group of the provincial people''s procuratorate on the arrests made in the whole province in 1959 關於1959年全省批捕人犯情況的報告. The report finds that after years of suppression the contest of enemy and us has eased: counterrevolutionaries remain but are fewer, weaker and more split and isolated.'
