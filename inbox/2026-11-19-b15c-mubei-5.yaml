      id: cal.1960-04-08.china-leadership-7
      when: Apr. 8
      date: '1960-04-08'
      thread: china-leadership
      c: Xinhua 新華社 carries its composite report "The development of urban people's communes in our country" 《我國城市人民公社的發展》, the last of a series that began on Apr. 1 on the communes of Zhengzhou 鄭州, Harbin 哈爾濱, Peking 北京 and Chongqing 重慶. It says 20 million of the cities' people have joined communes, which have set up over 56,000 industrial units.
      n: '[[w.yang-jisheng-mubei]], II, 733–734. To check: Xinhua News Agency 新華社, "Woguo chengshi renmin gongshe de fazhan" 《我國城市人民公社的發展》, Apr. 8, 1960, and its series of Apr. 1–8 (named by [[w.yang-jisheng-mubei]], II, 733–734; no note). The joint talk of the secretaries of five big cities at the National People''s Congress, in the same passage, the book does not date: see [[cal.1960-04-24.china-leadership-4]].'
