      id: cal.1960-11-03.china-leadership-12
      when: Nov. 3
      date: '1960-11-03'
      thread: china-leadership
      c: The Mianyang 沔陽 county committee, Hubei 湖北, sums up its first stage of carrying out policy 沔陽縣貫徹政策第一階段的總結. Since the second half of 1958 the "communist wind" has been dealt with every year and has never stopped; it has grown worse. At first only the county, the communes and the teams levelled and transferred; later the province and the prefecture did too, and member from member. First they took the big things, land, houses, funds, grain; then, in the masses' words, whatever money, goods, houses or grain they saw. The teams became "a broken pot." The summary also quotes the big-character posters the masses put up against blind commanding once the Center had begun to criticize it.
      n: '[[w.yang-jisheng-mubei]], II, 805 n.56; [[w.yang-jisheng-mubei]], II, 791 n.40. Made public: 1992. To check: Mianyang County Committee of the CCP 中共沔陽縣委, "Mianyang xian guanche zhengce diyi jieduan de zongjie" 《沔陽縣貫徹政策第一階段的總結》, Nov. 3, 1960, in Huang Daoxia 黃道霞 et al. (eds.), *Jianguo yilai nongye hezuohua shiliao huibian* 建國以來農業合作化史料彙編, 620 (cited by [[w.yang-jisheng-mubei]], II, 805 n.56; and, as "Mianyang xian guanche zhengce diyi jieduan baogao" 《沔陽縣貫徹政策第一階段報告》, Nov. 1960, II, 791 n.40). Check: the compilation''s year, printed 1972 at II, 805 n.56 and 1992 at II, 791 n.40, 1992 taken; and the two titles, taken for one paper.'
