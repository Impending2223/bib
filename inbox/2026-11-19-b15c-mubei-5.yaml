      c: Li Xiannian 李先念 reports to the national conference of finance and trade secretaries 全國財貿書記會議. For the nine months from this October to next June only 64.8 billion jin of the sales quota is left, 7.2 billion a month, against 88.6 billion, 9.8 billion a month, sold in the same months of the year before, and the peasants' ration quota is left still less. If monthly sales are not cut 2.6 billion jin below last year's, the plan to add 3.3 billion jin to the state's stock this year cannot be met.
