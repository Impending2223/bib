    entry:
      id: cal.1962-02-28.china-leadership-4
      when: Feb. 28
      date: '1962-02-28'
      thread: china-leadership
      c: The Gansu 甘肅 provincial committee's general office 省委辦公廳 compiles the opinions on the Center, the responsible comrades of the Center and its departments that provincial-level party cadres of grade 19 and above have voiced in studying the documents of the enlarged Central Work Conference. A Party-school cadre calls it stiff thinking to insist that successes are chief when 500 of 600 million seek their food; another says the Center's guiding ideas are in question, since the trouble is wide and long; one says Mao, like Stalin, may in his late years have erred in subjectivism; a printing-works man feels the Center is held faultless and the lower levels blamed; a bureau head reports that the common people curse Mao.
      n: '[[w.yang-jisheng-mubei]], II, 1116–1118 n.16. Made public: 2008. To check: Gansu Provincial Committee general office, compilation of Feb. 28, 1962, "Gansu sheng de shengji danwei shijiu ji yishang de dangyuan ganbu xuexi taolun kuoda Zhongyang gongzuo huiyi wenjian zhong dui Zhongyang ... tichu de yijian" 《甘肅省的省級單位十九級以上的黨員幹部學習討論擴大中央工作會議文件中對中央、中央有關負責同志和中央有關部門提出的意見》 (cited by [[w.yang-jisheng-mubei]], II, 1118 n.16). Names: Mao Zedong.'
