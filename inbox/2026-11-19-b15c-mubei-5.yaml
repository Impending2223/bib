      c: The Jilin 吉林 provincial committee replies to the report of the party group of the provincial political and legal committee 省政法委黨組. The power to approve arrests in the areas where the democratic revolution was not carried through 民主革命不徹底地區 goes down to the county committees and the provincial and prefectural committees' work groups, to sharpen the blows.
