      when: July 18
      date: '1960-07-18'
      thread: china-leadership
      c: The party group of the Jilin 吉林 political and legal committee 中共吉林省政法委黨組 reports to the provincial committee on adjusting the 1960 arrest and execution quotas 關於調整1960年捕人、殺人控制數字的報告. The quotas were 5,000 arrests and 80 executions; by the end of June 2,575 were arrested (714 counterrevolutionaries, 1,861 other offenders), 51.5 percent, and 53 executed, 66.25 percent. With the rectification of backward areas, the three antis and the city surveys, many enemies will be exposed; it asks to raise arrests to 6,500–7,000 and executions to 160.
      n: '[[w.yang-jisheng-mubei]], II, 1054 n.60. Made public: 2008. To check: Party group of the Jilin Political and Legal Committee 中共吉林省政法委黨組, "Guanyu tiaozheng 1960 nian bu ren, sha ren kongzhi shuzi de baogao" 《關於調整1960年捕人、殺人控制數字的報告》, July 18, 1960 (cited by [[w.yang-jisheng-mubei]], II, 1054 n.60). Check: the Jilin Provincial Committee''s reply of the same day, II, 1053 n.55, taken for a separate act.'
      src:
