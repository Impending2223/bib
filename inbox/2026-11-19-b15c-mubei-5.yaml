      id: cal.1961-06-03.china-leadership-7
      when: June 3
      date: '1961-06-03'
      thread: china-leadership
      c: 'The urban people''s commune office of the party group of the All-China Federation of Trade Unions 全國總工會黨組城市人民公社工作辦公室 prints, from the State Statistical Bureau''s figures, "The development of the people''s communes in the large and middle cities of the nation in 1960" 《1960年全國大中城市人民公社發展情況》 as the Central Work Conference''s document 2. At the end of Aug. 1960 there were 1,077 urban communes with 56.93 million people, 76 percent of the cities'' population; at the year''s end 1,032, with 60.65 million, 81 percent: 417 built on state mines and factories, 97 on offices and schools, 484 on street residents.'
      n: '[[w.yang-jisheng-mubei]], II, 734 n.53. Made public: 2008. To check: urban people''s commune office of the All-China Federation of Trade Unions party group, "1960 nian quanguo da zhong chengshi renmin gongshe fazhan qingkuang" 《1960年全國大中城市人民公社發展情況》, from State Statistical Bureau figures, printed June 3, 1961, Central Work Conference document (2) 中央工作會議文件(二) (cited by [[w.yang-jisheng-mubei]], II, 734 n.53). Check: the three kinds of commune sum to 998, the year''s total printed 1,032.'
