      c: 'The Center 中共中央 forwards the report of the party group of the All-China Federation of Trade Unions 全國總工會黨組 on the present development of the urban people''s communes and several questions 關於當前城市人民公社發展情況和幾個問題的報告, as Zhongfa [60] 522 中發[60]522號. It draws experience on five matters: purifying the cadre ranks and keeping the Party''s absolute leadership; joining government and commune, and policy toward the bourgeoisie; production and livelihood; production co-operation and the use of materials around the state mines and factories; union work under the new conditions. The Center asks every region to act on it.'
