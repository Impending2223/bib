      thread: china-leadership
      c: The Northwest Bureau 中共中央西北局 forwards, as Xibei fa [60] 16 西北局發[60]16號, a paper on the severe handling of acts that violate and wreck the grain policy in Shaanxi 陝西, Gansu 甘肅, Xinjiang 新疆 and other provinces and regions. The book takes from it the count, for Xingping 興平 county, Baoji 寶雞 city and the Yanta 雁塔 district of Xi'an 西安, of 116 "reactionary slogans" and letters in 1960, half of them on the grain question.
      n: '[[w.yang-jisheng-mubei]], II, 1040 n.2. Made public: 2008. To check: Northwest Bureau of the CCP 中共中央西北局, "Zhonggong Zhongyang Xibei ju pizhuan guanyu Shaanxi, Gansu, Xinjiang deng sheng qu yansu chuli weifan he pohuai liangshi zhengce de xingwei" 《中共中央西北局批轉關於陝西、甘肅、新疆等省區嚴肅處理違反和破壞糧食政策的行為》, Dec. 19, 1960, Xibei fa [60] 16 (cited by [[w.yang-jisheng-mubei]], II, 1040 n.2).'
