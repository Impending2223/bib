      id: cal.1960-04-18.china-leadership-12
      when: Apr. 18
      date: '1960-04-18'
      thread: china-leadership
      c: 'The Center 中共中央 forwards the Shanghai 上海 municipal committee''s report on work in the lanes and its plan to set up urban people''s communes 關於里弄工作情況和建立城市人民公社打算的報告, as Zhongfa [60] 354 中發[60]354號. The report: housewives and idle labor are not yet organized for work, the families of the bourgeoisie and the bourgeois intellectuals have still to be remade, part of the individual economy is not yet collective; the communes are to rest on the lane rectification of 1958. The Center''s comment backs Shanghai''s active attitude and adds four rules on those families: not to be hurried into the communes, not to be urged to give up houses and furniture, not to be urged into the mess halls, not to be urged to invest in commune industry.'
      n: '[[w.yang-jisheng-mubei]], II, 732–733 n.50. Made public: 2008. To check: Central Committee, forwarding Shanghai Municipal Committee 上海市委, "Guanyu lilong gongzuo qingkuang he jianli chengshi renmin gongshe dasuan de baogao" 《關於里弄工作情況和建立城市人民公社打算的報告》, Apr. 18, 1960, Zhongfa [60] 354 (cited by [[w.yang-jisheng-mubei]], II, 733 n.50).'
