      n: '[[w.kotz-judgment-days]], 39 (the call by its note; the lobbying of Daley and McCormack). After [[cal.1963-12-03.civil-rights-bill|the leaders'' breakfast]], at which the leaders offered the cotton bill: the breakfast "began promptly the next morning at 8:45" ([[w.whalen-longest-debate]], 81). To check: Johnson and Daley, Dec. 3, 1963, 10:00 a.m., Tape K6312.02, PNO 14, LBJ Library; Kenneth O''Donnell, oral history, 71, LBJ Library (cited by [[w.kotz-judgment-days]], 39 nn.71–72). See [[cal.1963-12-03.civil-rights-bill]]. Names: Johnson, Daley, McCormack.'
