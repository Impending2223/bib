patch: 2026-11-25-sequence-1963-12
by: 'Claude (Sonnet, sequence pass: R25c on December 1963), Nov. 25, 2026; audited and corrected by Claude (Opus, R25c, R33b), Nov. 25, 2026; notes/sequence/1963-12.md, notes/sequence/audit-1963-12.md'
ops:
- add:
    entry:
      id: cal.1963-12-05.latin-america-2
      when: Dec. 5
      date: '1963-12-05'
      thread: latin-america
      also: [robert-kennedy]
      time_range: ['1963-12-06T00:00Z', '1963-12-06T03:00Z']
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      follows: [cal.1963-12-05.latin-america]
      c: 'Evening. Schlesinger to Robert Kennedy on the Latin American post: good for the Alliance, perhaps not for his own future. Kennedy agrees on Mann, but can take no other assignment for eleven months: Justice until the civil rights bill passes, in March or April, then the campaign. Word to go to Johnson that no appointment to the post be made without consulting President Kennedy''s Latin American executors, himself, Shriver, Goodwin and Schlesinger. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 213 ("In the evening I brought the matter up with Bobby"). After [[cal.1963-12-05.latin-america|the talk with Moyers]]: the matter is the one Schlesinger had raised with Moyers that day (213). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1963-12-05.latin-america]]. Names: Schlesinger, Robert Kennedy, Mann, Johnson, Shriver, Goodwin.'
      tags: [name:schlesinger-arthur-m-jr, name:kennedy-robert-f, name:mann-thomas-c, name:johnson-lyndon-b, name:shriver-r-sargent, name:goodwin-richard-n]
- follows:
    id: cal.1963-12-17.succession-2
    remove:
    - cal.1963-12-17.latin-america
    why: 'The call is "after his address to the UN at noon" (its own words): Johnson asks Ball for reactions to "our speech today" (Taking Charge, 105; the Miller Center''s summary: Bunker''s appointment to the OAS and the press reaction to the speech). Nothing in the call or its sources bears on the Chamizal vote, whose hour within the Senate''s sitting (noon to 5:47 p.m.) is not given; the call''s own hour, 6:05 p.m., already places it after the sitting.'
- edit:
    id: cal.1963-12-17.succession-2
    base: ac9456b7
    set:
      n: '[Johnson and George Ball, 6:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-ball-december-17-1963), Tape K6312.09 (Miller Center). [[w.taking-charge]], 105. After [[cal.1963-12-17.succession|the address to the UN]]: "At noon, LBJ addressed the United Nations in New York ... Now he tries to generate some favorable press coverage" ([[w.taking-charge]], 105). Names: Johnson, Ball, Stevenson.'
