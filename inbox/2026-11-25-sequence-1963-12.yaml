    base: effbde9a
    set:
      n: '[[w.schlesinger-journals]], 213. After [[cal.1963-12-05.robert-kennedy|the flight to Boston and the talk on the way back]]: Schlesinger flew to Boston with Robert Kennedy "this morning" and talked with him "on the way back" (211–12); the luncheon with Moyers, in Washington, follows (213). Made public: [[w.schlesinger-journals]] (2007). Names: Moyers, Schlesinger, Mann, Robert Kennedy, Johnson, Dulles.'
- cite:
    id: cal.1963-12-05.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 212 (the journal of Dec. 5: on the flight back from Boston, "a revolt of the FBI since his brother''s death")'
