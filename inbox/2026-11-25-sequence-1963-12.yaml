    base: d475b8ec
    set:
      n: '[[w.johnson-white-house-diary]], 25–27 (Lady Bird Johnson''s account; the guests are hers, among them Von Braun, Kleberg, Ransom and Dobie); [[w.salinger-with-kennedy]], 336 (the barbecue in the gym of Stonewall High School for Erhard; Van Cliburn plays Chopin to some six hundred; then Johnson over the loudspeaker calls Salinger to the piano, Erhard shakes his hand, and Johnson: "I don''t know what I would have done without him, night and day, over this past month"). After [[cal.1963-12-29.europe-and-the-alliance-2|Fredericksburg]]: "We returned ... to find that the guests were already arriving in the gymnasium. They had been invited for one o''clock" ([[w.johnson-white-house-diary]], 25). Check: the day: [[w.salinger-with-kennedy]], 335, puts Erhard''s visit to the Ranch "shortly before Christmas in 1963.". See [[cal.1963-12-29.europe-and-the-alliance]]. Names: Johnson, Erhard, Rusk, Van Cliburn.'
