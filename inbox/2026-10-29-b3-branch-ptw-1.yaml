        (Gary Thomas Rowe) (cited by [[w.branch-parting-the-waters]], 420 n.4); SAC Birmingham to Director, "Urgent" teletype,
        May 14, 1961, 9:12 p.m., FBI file 149-1684 (cited by [[w.branch-parting-the-waters]], 420 n.6). See [[cal.1961-05-04.freedom-rides]].'
