        tape BB0225, Pacifica Radio Archive; Burke Marshall to Hoover, Sept. 26, 1961, "Intimidation of Negro Applicants for
        Registration in Amite County, Mississippi", records of the Civil Rights Division, Department of Justice (cited by
        [[w.branch-parting-the-waters]], 510 n.3). See [[cal.1961-09-25.mississippi]]. Names: Burke Marshall, Hoover, Doar,
