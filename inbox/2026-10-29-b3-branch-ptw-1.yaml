      c: 'James Gray, chairman of the Georgia Democratic Party, owner of the *Albany Herald* and the town''s television station,
        on television: a "cell of professional agitators" whose rebellion "smacks more of Lenin and Stalin than of George
        Washington"; King has "learned that martyrdom can be a highly productive practice for the acquisition of a buck."
        Segregation "peaceful and rewarding": "What we need is tolerance, not tantrum."'
      n: '[[w.branch-parting-the-waters]], 553–54. To check: New York Times, Dec. 18, 1961, 31 (cited by [[w.branch-parting-the-waters]],
        554 n.1); Atlanta Journal, Dec. 18, 1961, 10 (cited by [[w.branch-parting-the-waters]], 554 n.2). See [[cal.1961-12-15.albany]].
        Names: Martin Luther King.'
