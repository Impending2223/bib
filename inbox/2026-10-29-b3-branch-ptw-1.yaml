      thread: mississippi
      c: 'Doar''s third request to the FBI on Lee''s killing: reinterview the witnesses, ask Sheriff Caston about the tire
        iron, get the minutes of the coroner''s jury. Louis Allen, the Negro witness, then tells the agents that he saw no
        tire iron and that Hurst shot Lee in a rage. No federal case follows.'
