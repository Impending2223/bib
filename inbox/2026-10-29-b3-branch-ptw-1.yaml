      c: 'Robert Kennedy, White and Marshall at the Justice Department through the morning: Albany "number one" on his agenda,
        advice ready if either side asks. Within an hour of the truce Kennedy telephones Mayor Kelley to congratulate the
        city on preventing violence, by Kelley''s announcement.'
