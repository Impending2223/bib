      c: 'Mayor Kelley rides out to a Baker County plantation to find Vandiver at a bird hunt: the National Guard for Albany,
        and undercover revenue agents among the white groups in the outlying counties. Vandiver agrees. Kelley and Burke Marshall
        by telephone: no violence, no federal intervention. That night some 150 Guardsmen wait in the armory. By Kelley''s
        account.'
      n: '[[w.branch-parting-the-waters]], 541–42. See [[cal.1961-12-10.albany]]. Names: Vandiver, Burke Marshall.'
