patch: 2026-11-12-b11-sjournals-2
by: Claude (batch 11 reader, Schlesinger, Journals 1952–2000, Jan. 1965–Dec. 1966)
ops:
- add:
    entry:
      id: cal.1965-01-19.transition-and-staff
      when: Jan. 19
      date: '1965-01-19'
      thread: transition-and-staff
      c: A dance given by Mary Lasker and Abe Fortas after the Inaugural Concert, by Schlesinger's journal. Johnson there, "lowering and somber." Humphrey, the Vice President-elect, dances; "everyone else stopped, formed a circle around him and applauded."
      n: '[[w.schlesinger-journals]], 235–36 (the entry of Jan. 20: "last night"). Made public: [[w.schlesinger-journals]] (2007). Names: Fortas, Johnson, Humphrey, Schlesinger.'
      tags:
      - name:fortas-abe
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1965-01-19.transition-and-staff-2
      when: Jan. 19
      date: '1965-01-19'
      thread: transition-and-staff
      c: Goodwin shows Schlesinger the inaugural address. By Goodwin's account, day not given, Stevenson submitted "the only usable draft" and "conceived the device of the perspective on the earth created by the rocket traveling to Mars."
      n: '[[w.schlesinger-journals]], 237 (the entry of Jan. 20: "showed it to me yesterday"; Stevenson''s draft "according to Dick," the day of that account not given). Made public: [[w.schlesinger-journals]] (2007). Names: Goodwin, Schlesinger, Stevenson.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1965-01-19.robert-kennedy
      when: Jan. 19
      date: '1965-01-19'
      thread: robert-kennedy
      c: 'Robert Kennedy to Schlesinger, in Schlesinger''s office after Galbraith''s luncheon at the Jockey Club: he "thanked heaven every day that the vice presidency had fallen through; it would have been a miserable and hopeless relationship, and nothing but trouble could have come from it." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 237 (the entry of Jan. 20: the luncheon "yesterday"; "After lunch, Bobby came over to my office"). Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Galbraith, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:galbraith-john-kenneth
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1965-05-22.latin-america
      when: May 22
      date: '1965-05-22'
      thread: latin-america
      c: 'The White House, Saturday morning, and lunch with Bundy and Goodwin. Schlesinger urges that Johnson see Betancourt, in town: if not the President, then "Mac or Bill or Dick." Bundy calls Johnson and suggests it; Johnson "was cold to the idea." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 237–38 (the entry headed May 25, a Tuesday: "Saturday morning"). Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Bundy, Goodwin, Betancourt, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
      - name:betancourt-romulo
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1965-07-15.transition-and-staff-2
      when: July 15
      date: '1965-07-15'
      thread: transition-and-staff
      c: Andrews Field, afternoon. Air Force One comes in from London with Stevenson's casket. Schlesinger drives out with Ed and Mary Louise Day. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 238 (the entry of July 16: "the next afternoon" after Wednesday, July 14). Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-02-27.vietnam-rfk-front
      when: Feb. 27
      date: '1966-02-27'
      thread: vietnam-rfk-front
      also:
      - robert-kennedy
      c: Hickory Hill, Sunday morning, before *Face the Nation*. Fred Dutton and Schlesinger go out "to run through possible questions." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11). Made public: [[w.schlesinger-journals]] (2007). Names: Dutton, Schlesinger.'
      tags:
      - name:dutton-frederick-g
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-02-27.vietnam-rfk-front-2
      when: Feb. 27
      date: '1966-02-27'
      thread: vietnam-rfk-front
      also:
      - robert-kennedy
      c: Hickory Hill, before lunch. "We all watched" Humphrey on *Issues and Answers*, an hour after Robert Kennedy on *Face the Nation*, "except Bobby, who was both so irritated and upset by Hubert's performance that, after a few minutes, he went silently away." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 246 (the entry of Mar. 11). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1966-02-27.vietnam]]. Names: Humphrey, Robert Kennedy, Schlesinger.'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-03-12.war-opposition
      when: Mar. 12
      date: '1966-03-12'
      thread: war-opposition
      also:
      - press-and-broadcasting
      - vietnam
      c: The Gridiron Club's dinner, by Schlesinger's journal. The show "contained a vicious attack on Fulbright and ended with a hymn of reverence to Rusk"; Rusk, introduced, receives "a standing ovation." Schlesinger, with Herblock and "perhaps 10 percent of the audience," stays seated.
      n: '[[w.schlesinger-journals]], 247 (the entry of Mar. 13: "Last night"). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1966-03-12.press-and-broadcasting]]. Names: Rusk, Fulbright, Schlesinger.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1966-03-12.war-opposition-2
      when: Mar. 12
      date: '1966-03-12'
      thread: war-opposition
      also:
      - press-and-broadcasting
      - vietnam
      c: 'The Cowles party after the Gridiron dinner. Johnson takes Schlesinger''s hand: "Well, Arthur, I noticed that you had a little trouble with your chair when there was that ovation with Dean." To Chalmers Roberts of the *Post*, standing by: "Don''t print anything about that. It is very important to maintain the unity of the Democratic party—from Rusk to Schlesinger." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 247 (the entry of Mar. 13: "Last night"). Made public: [[w.schlesinger-journals]] (2007). See [[cal.1966-03-12.war-opposition]]. Names: Johnson, Schlesinger, Roberts, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - name:roberts-chalmers-m
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-06-14.vietnam-3
      when: June 14
      date: '1966-06-14'
      thread: vietnam
      c: 'Washington, dinner at Jane McBaine''s. Rostow, by Schlesinger''s journal, draws an analogy between Johnson and Lincoln, casting the opposition to the war as the Copperheads: "if LBJ only kept up the military momentum, he would be in the clear in another few months."'
      n: '[[w.schlesinger-journals]], 250–51 (the entry of July 28: "I last saw him at dinner at Jane McBaine''s in Washington on June 14"). Made public: [[w.schlesinger-journals]] (2007). Names: Rostow, Johnson, Schlesinger.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1966-07-22.war-opposition-2
      when: July 22
      date: '1966-07-22'
      thread: war-opposition
      also:
      - elections-1968
      c: 'Dinner at George Stevens''s. Harriman, leaving, asks Schlesinger, who has said he will spend the weekend with Galbraith, McGovern and Harris, "What are you up to?" Schlesinger: "We are planning a coup d''etat." Harriman: "Count me in." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 249–50 (the entry of July 28: "dinner at George Stevens''s on July 22"). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Galbraith, McGovern.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
      - name:galbraith-john-kenneth
      - name:mcgovern-george
- add:
    entry:
      id: cal.1966-08-13.robert-kennedy
      when: Aug. 13–14
      date: '1966-08-13'
      thread: robert-kennedy
      also:
      - vietnam
      c: Hyannis Port, the weekend, with Schlesinger. Robert Kennedy, "electrified by the news that North Korea has issued a declaration of independence against both Russia and China," takes it to reinforce his conviction that communism will take "increasingly nationalistic forms," especially in the underdeveloped world, and that, "if we had only left North Vietnam alone, it would be defying China too." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 252–53 (the entry of Aug. 14: "Just back from another Hyannis Port weekend"). Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Schlesinger. Check: the day.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - polity:dprk
      - polity:ussr
      - polity:prc
- add:
    entry:
      id: cal.1966-11-14.democratic-party
      when: Nov. 14
      date: '1966-11-14'
      thread: democratic-party
      c: 'Hickory Hill, a large party for Averell Harriman''s 75th birthday. Schlesinger gives a toast. Humphrey gives the best speech, by Schlesinger''s journal: "witty, charming, relaxed and brief."'
      n: '[[w.schlesinger-journals]], 254 (the entry of Nov. 16: "on November 14th"). Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Humphrey, Schlesinger.'
      tags:
      - name:harriman-w-averell
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
- cite:
    id: cal.1965-01-20.transition-and-staff
    item: '[[w.schlesinger-journals]], 237 (the entry of Jan. 20: "I have just heard the inaugural address"; "The first half is much as it was when Dick Goodwin showed it to me yesterday. The last part is new and good"; "On the whole, a fine address"; credit "first to Dick and then to Adlai Stevenson"; not the oath, the covenant or the Great Society; Goodwin''s showing of the draft, Jan. 19)'
    units: '?'
- cite:
    id: cal.1965-07-14.transition-and-staff
    item: '[[w.schlesinger-journals]], 238 (the entry of July 16: Goodwin called Schlesinger from the White House "a minute or two after one o''clock on Wednesday, July 14," to say Stevenson had died in London; walking along Grosvenor Street toward Hyde Park he "felt faint, clutched an iron railing nearby and then pitched over, obviously felled by a massive heart attack or stroke"; not the Goldberg appointment)'
    units: '?'
- cite:
    id: cal.1965-07-16.transition-and-staff
    item: '[[w.schlesinger-journals]], 239 (the entry of July 16: Carl McGowan "suggested" in "his remarks at the National Cathedral" that Stevenson "was not a perfect man"; not the attendance, Johnson or Fulbright)'
    units: '?'
- cite:
    id: cal.1966-01-06.vietnam
    item: '[[w.schlesinger-journals]], 243–44 (the entry of Jan. 21: Schlesinger "assembled Carl Kaysen, Dick Goodwin and Ken Galbraith for a dinner at 3132 O Street with Bob McNamara" on the evening of Jan. 6; McNamara "defined his objective in South Vietnam as ''withdrawal with honor''"; "Our impression was that he feared the resumption of bombing might well put us on the slippery slide"; not who asked for the dinner, Johnson''s knowledge or the word Georgetown)'
    units: B, C
- cite:
    id: cal.1966-02-27.robert-kennedy
    item: '[[w.schlesinger-journals]], 245 (the entry of Mar. 11: Kennedy''s statements, "especially on Face the Nation, February 27"; the Viet Cong a seat "as an independent body," acceptance of an interim government with Viet Cong participation or a coalition from free elections; not the words quoted on assassins and murderers)'
    units: '?'
- cite:
    id: cal.1966-02-27.vietnam
    item: '[[w.schlesinger-journals]], 246 (the entry of Mar. 11: "An hour after Bobby, Hubert went on the air on Issues and Answers"; not the words quoted)'
    units: '?'
- cite:
    id: cal.1966-03-12.press-and-broadcasting
    item: '[[w.schlesinger-journals]], 247 (the entry of Mar. 13: "Last night the Gridiron" dinner, so Mar. 12; Russell Long and John Lindsay named, the show''s attack on Fulbright and "hymn of reverence to Rusk"; not the Nixon skit)'
    units: A
- cite:
    id: cal.1966-07-20.robert-kennedy
    item: '[[w.schlesinger-journals]], 249 (the entry of July 28: "We discussed this with RFK at dinner in New York on July 20"; Goodwin''s and Schlesinger''s thoughts of a committee against the widening of the war; Kennedy: a movement "would have to tie itself to an issue or to a man," the issue "too complicated and ambiguous"; Johnson "could always justify each specific step"; Goodwin''s point on a Kennedy movement; Galbraith is not named at the dinner)'
    units: B, C, D, E
- cite:
    id: cal.1966-07-23.democratic-party
    item: '[[w.schlesinger-journals]], 249–50 (the entry of July 28: "the weekend of July 24, which I spent at Ken Galbraith''s in Newfane, Vermont, with George McGovern and Seymour Harris"; Schlesinger thinks "for the first time" of Kennedy "going for the nomination in 1968"; McGovern "would be all for it" and thinks Johnson "might conceivably be bluffed out of trying for renomination"; Galbraith''s own words not given)'
    units: B, C
- cite:
    id: cal.1966-10-30.robert-kennedy
    item: '[[w.schlesinger-journals]], 253–54 (the entry of Oct. 30: the Dillons'' dinner; Kennedy, from Connecticut, arrives about 10:30 with Goodwin; "we talked until 2:30" at P.J. Clarke''s; the 80 percent for Johnson and 20 for him; "rueful about his own vogue"; the Warren Report; also Johnson on their day of campaigning, undated, and the Manchester book, not in the entry)'
    units: A, B, C, D, E
- cite:
    id: cal.1966-10.assassination
    item: '[[w.schlesinger-journals]], 253–54 (the entry of Oct. 30, the day: the night at the Dillons'' and P.J. Clarke''s, "until 2:30"; the Warren Report; Schlesinger''s words, not Kennedy''s: "poor job"; see the variant)'
    units: A
- variant:
    id: cal.1966-10.assassination
    unit: B
    witness: w.schlesinger-journals
    reads: 'Schlesinger''s own words, not Kennedy''s: "It is evident that he believes that it was a poor job and will not endorse it, but that he is unwilling to criticize it and thereby reopen the whole tragic business"'
    at: '254'
