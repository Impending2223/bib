      when: Mar. 26
      date: '1963-03-26'
      thread: mississippi
      also:
      - civil-rights-the-executive
      c: 'Robert Kennedy to Hannah: he still opposes the Commission''s hearings in Mississippi, the contempt case against Barnett pending. Five days after the President''s press conference: the hearings should not be put off longer.'
      n: '[[w.dittmer-local-people]], 196. To check: Robert Kennedy to Hannah, Mar. 26, 1963, Marshall Papers, box 30, JFK Library (cited by [[w.dittmer-local-people]], 196 n.5). See [[cal.1962-12-15.mississippi]]. Names: Robert Kennedy, Hannah, Barnett.'
