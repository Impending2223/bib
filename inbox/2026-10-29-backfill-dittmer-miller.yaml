- add:
    entry:
      id: cal.1963-04-03.mississippi
      when: Apr. 3
      date: '1963-04-03'
      thread: mississippi
      c: 'John Doar agrees with Greenwood''s officials: the eight SNCC workers to be released, their sentences stayed until a full hearing in late October; the Department to withdraw its application for a preliminary injunction. Doar tells Wiley Branton at 6:30 the next morning.'
      n: '[[w.dittmer-local-people]], 155. To check: Wiley Branton, "Field Report," Apr. 7, 1963, VEP Papers, reel 175 (cited by [[w.dittmer-local-people]], 155 n.30). See [[cal.1963-03-30.mississippi]]. Names: Doar.'
      tags:
