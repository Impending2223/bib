      when: Mar. 29
      date: '1963-03-29'
      thread: mississippi
      also:
      - civil-rights-the-executive
      c: 'Burke Marshall to Robert Kennedy: "we may at some point have to face resignations" from four members of the Civil Rights Commission, Hannah and Hesburgh among them. Kennedy''s note back: "Can''t we find something that would be worthwhile for the Civil Rts Commission to do? ... I don''t want them to resign."'
