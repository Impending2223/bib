      - state:ms
      src:
        c: 79d0683e
        rows:
        - 'w.dittmer-local-people 155: all'
        - 'via w.dittmer-local-people 155 n.30: all'
- add:
    entry:
      id: cal.1962-12-15.mississippi
      when: Dec. 15
      date: '1962-12-15'
      thread: mississippi
      also:
      - civil-rights-the-executive
      c: 'Robert Kennedy to Hannah: the Civil Rights Commission''s hearings in Mississippi, already put off from October and December, to be put off again. If Barnett''s and Paul Johnson''s contempt case goes to a jury, "the claim will be made that the Civil Rights Commission is working with the Department of Justice publicly to prejudice the State of Mississippi and its officials in the minds of the jury." A report "could be prepared, without any need for public hearings in the state."'
      n: '[[w.dittmer-local-people]], 195 (the letter; Hannah''s reply, Jan. 2: "this decision is difficult for us"). To check: Robert Kennedy to Hannah, Dec. 15, 1962, and Hannah to Kennedy, Jan. 2, 1963, Marshall Papers, box 30, JFK Library (cited by [[w.dittmer-local-people]], 195 n.3). Names: Robert Kennedy, Hannah, Barnett, Paul Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:hannah-john-a
      - name:barnett-ross-r
      - name:johnson-paul-b-jr
      - state:ms
      src:
        c: 2590c272
        rows:
        - 'w.dittmer-local-people 195: all'
        - 'via w.dittmer-local-people 195 n.3a: all'
