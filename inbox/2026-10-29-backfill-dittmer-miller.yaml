      when: Sept. 23
      date: '1964-09-23'
      thread: mississippi
      c: 'Lee White to Valenti: the President to avoid the three bombed-out women of McComb in Washington, Aylene Quin, Mattie Dillon and Ora Bryant; Burke Marshall and Louis Martin "both agree that there is no political benefit in meeting these people." Marshall sees them: "the FBI is investigating the bombings."'
