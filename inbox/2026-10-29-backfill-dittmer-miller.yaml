- add:
    entry:
      id: cal.1963-08-27.vietnam-saigon
      when: Aug. 27
      date: '1963-08-27'
      thread: vietnam-saigon
      c: 'Lodge''s first meeting with Nhu, an hour. Nhu: statements from Washington "must stop"; the generals themselves demanded the action taken. Lodge: Nhu "ruthless, not wholly rational by our standards," interested above all in the survival of himself and his family.'
      n: '[FRUS 1961–63, III, doc. 298](https://history.state.gov/historicaldocuments/frus1961-63v03/d298) (Lodge, Aug. 27). [[w.miller-misalliance]], 293–94 (the meeting; Lodge''s judgment of Nhu). See [[cal.1963-08-24.vietnam]]. Names: Lodge, Nhu.'
