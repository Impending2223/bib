- add:
    entry:
      id: cal.1961-05.freedom-rides
      when: May
      date: 1961-05
      thread: freedom-rides
      also:
      - mississippi
      - robert-kennedy
      c: 'Robert Kennedy and Barnett, through Eastland, former Governor Coleman and Mayor Thompson of Jackson: the State to protect the riders; the Administration not to interfere when the Jackson police arrest them in the white waiting room. By Robert Kennedy''s account (1964) he spoke with Eastland "seven or eight or twelve times each day." Coleman to Marshall: Barnett not to be trusted.'
      n: '[[w.dittmer-local-people]], 93. To check: Robert F. Kennedy, recorded interview by Anthony Lewis, Dec. 4, 1964, 573–74, and Burke Marshall, recorded interview by John Oberdorfer, 1970, 37–41, JFK Library Oral History Program; *New Orleans Times-Picayune*, June 11, 1961; *Newsweek*, June 26, 1961, 16 (cited by [[w.dittmer-local-people]], 93 n.7). See [[cal.1961-05-04.freedom-rides]]. Names: Robert Kennedy, Barnett, Eastland, Coleman, Thompson, Marshall. Check: the days.'
      tags:
      - name:kennedy-robert-f
      - name:barnett-ross-r
      - name:eastland-james-o
      - name:coleman-j-p
      - name:thompson-allen-c
      - name:marshall-burke
      - state:ms
      src:
        c: 0a56c4dc
        rows:
        - 'w.dittmer-local-people 93: all'
        - 'via w.dittmer-local-people 93 n.7a: A-B'
        - 'via w.dittmer-local-people 93 n.7b: A, C'
        - 'via w.dittmer-local-people 93 n.7c: A'
- add:
