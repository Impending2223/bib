- add:
    entry:
      id: cal.1963-09-18.vietnam
      when: Sept. 18
      date: '1963-09-18'
      thread: vietnam
      c: 'Joseph Alsop''s column in the *Washington Post*, "Very Ugly Stuff": by Nhu''s account, Maneli, the Polish commissioner of the ICC, has brought him a message from Hanoi begging for talks on a cease-fire, and he has turned it down.'
      n: '[[w.miller-misalliance]], 305–07 (Maneli''s channel; his meeting with Nhu, Sept. 2; the column, its account Nhu''s; Warsaw''s order to deny it). To check: [[w.maneli-war-of-the-vanquished]]; [[w.gnoinska-poland-and-vietnam-1963]]; the column (cited by [[w.miller-misalliance]], 306 n.95). See [[cal.1963-09-02.vietnam-saigon]]. Names: Alsop, Nhu, Maneli. Check: the column''s words.'
      tags:
      - name:alsop-joseph
      - name:ngo-dinh-nhu
      - name:maneli-mieczyslaw
      src:
        c: 574e793b
        rows:
        - 'w.miller-misalliance 305–07: all'
        - 'via w.miller-misalliance 306 n.95: all'
- add:
    entry:
      id: cal.1963-11-01.vietnam-saigon
      when: Nov. 1
      date: '1963-11-01'
      thread: vietnam-saigon
      c: 'Gia Long Palace, the morning: Diệm with Felt and Lodge, then with Lodge alone, fifteen minutes. The bonzes, he says, have told the UN commission they were "intoxicated" by Americans; the names to go to the embassy. The universities to reopen "little by little" when the commission has gone. Lodge to ask Colby and Nolting about Nhu. "Tell President Kennedy that I take all his suggestions very seriously and wish to carry them out but it is a question of timing."'
      n: '[FRUS 1961–63, IV, doc. 262](https://history.state.gov/historicaldocuments/frus1961-63v04/d262) (Lodge, 3 p.m.; received in Washington after the coup had begun); doc. [261](https://history.state.gov/historicaldocuments/frus1961-63v04/d261) (Felt''s call). [[w.miller-misalliance]], 317 (the meeting; the appeal to Kennedy; Lodge: "If the U.S. wants to make a package deal, I would think we were in position to do it"). See [[cal.1963-10-27.vietnam]]. Names: Diệm, Felt, Lodge, Colby, Nolting, Kennedy.'
      tags:
      - name:ngo-dinh-diem
      - name:felt-harry-d
      - name:lodge-henry-cabot
      - name:colby-william-e
      - name:nolting-frederick-e-jr
      - name:kennedy-john-f
