      c: 'Amite County. John Doar of the Civil Rights Division, the evening before he returns to Washington, with Moses and E. W. Steptoe on the dangers to Negroes working in the registration drive: Steptoe names Representative E. H. Hurst a threat, Herbert Lee a likely target.'
