      when: July 14
      date: '1961-07-14'
      thread: mississippi
      also:
      - voting-rights
      c: 'Burke Marshall to Byron White, on SNCC''s coming project in McComb: "economic and other types of reprisals" may be used against Negroes trying to register in Pike County; if so, "we will have to move immediately to prevent the reprisals through court orders which may have to be enforced by federal marshals."'
      n: '[[w.dittmer-local-people]], 108–09. To check: Marshall to White, July 14, 1961, Marshall Papers, box 1, JFK Library (cited by [[w.dittmer-local-people]], 109 n.37). Names: Marshall, Byron White.'
      tags:
