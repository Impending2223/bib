- add:
    entry:
      id: cal.1961-11-15.vietnam
      when: Nov. 15
      date: '1961-11-15'
      thread: vietnam
      c: 'NSC, 10 a.m., on Rusk''s draft memorandum on South Vietnam. Kennedy fears being involved on two fronts at once; Vietnam not Korea, its issue obscure; he could make "a rather strong case against intervening in an area 10,000 miles away against 16,000 guerrillas with a native army of 200,000." McNamara: action would become clear if American forces went in, against the sources of Viet Cong power, those in North Vietnam among them.'
      n: '[FRUS 1961–63, I, doc. 254](https://history.state.gov/historicaldocuments/frus1961-63v01/d254) (notes, probably by Burris). [[w.miller-misalliance]], 229 (Kennedy against the troops; the rest of the partnership endorsed). See [[cal.1961-11-11.vietnam]]. Names: Kennedy, Rusk, McNamara.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      src:
        c: 5a08b928
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d254: all'
        - 'w.miller-misalliance 229: D'
