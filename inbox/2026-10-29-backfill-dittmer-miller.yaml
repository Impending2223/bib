      id: cal.1966-02-14.mississippi
      when: Feb. 14
      date: '1966-02-14'
      thread: mississippi
      also:
      - poverty
      c: 'Katzenbach to the President: the occupation of the Greenville Air Force Base "potentially explosive"; in the Delta "many thousands of poor Negro workers are losing their jobs, and, in many instances, their homes as well." Surplus food, crash employment programs, as many poverty programs as can be funded; otherwise "a real possibility that Mississippi will be the Selma, Alabama of 1966."'
      n: '[[w.dittmer-local-people]], 367–68. To check: Katzenbach, "Memorandum for the President: Civil Rights, Mississippi," Feb. 14, 1966, LBJ Library (cited by [[w.dittmer-local-people]], 368 n.12). See [[cal.1966-01-31.mississippi]]. Names: Katzenbach.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - state:ms
      src:
        c: a0972a43
        rows:
        - 'w.dittmer-local-people 367–68: all'
        - 'via w.dittmer-local-people 368 n.12: all'
