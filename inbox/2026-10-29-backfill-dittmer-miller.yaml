        - 'via w.miller-misalliance 274 n.93: all'
- add:
    entry:
      id: cal.1963-08-26.vietnam-saigon
      when: Aug. 26
      date: '1963-08-26'
      thread: vietnam-saigon
      c: 'Saigon. Lodge, the morning, with Harkins, Trueheart, Mecklin and the station chief: the American official hand not to show; Harkins to take no initiative with the generals. Conein to Trần Thiện Khiêm, about 12:45 p.m., with the points of the American position; the generals in accord, Khiêm replies; Đôn not to be told yet. Another officer to Nguyễn Khánh at Pleiku.'
      n: 'FRUS 1961–63, III, docs. [290](https://history.state.gov/historicaldocuments/frus1961-63v03/d290); [291](https://history.state.gov/historicaldocuments/frus1961-63v03/d291) (the station, Aug. 26). [[w.miller-misalliance]], 291 (Lodge to go "straight to the generals"; Conein to Khiêm, Aug. 26). See [[cal.1963-08-24.vietnam]]. Names: Lodge, Harkins, Trueheart, Mecklin, Conein, Trần Thiện Khiêm, Trần Văn Đôn, Nguyễn Khánh.'
      tags:
