      when: Aug. 13–15
      date: '1968-08-13'
      thread: soviet-union-leadership
      also: *id001
      c: Crimea. Brezhnev discusses Czechoslovakia with the Politburo and Kádár, Aug. 13–15.
      n: '[[w.schattenberg-brezhnev]], 279 (n.124). To check: Shelest, *Da ne sudimy budete*, 390; A. Pikhoya, *Moskva, Kreml'', vlast''*, 79 (cited by [[w.schattenberg-brezhnev]], 279 n.124). Made public: 2021 at the latest. Names: Brezhnev, Kádár. Check: the days; the place.'
