    item: '[[w.schattenberg-brezhnev]], 218 (n.140–41) (The plenum of the Central Committee. Brezhnev warns that something is going massively awry in meat production: six billion rubles in subsidies, and hardly any meat in the shops. If the party neglects the question and does not react in time, "harsher measures" will have to correct it)'
    units: '?'
