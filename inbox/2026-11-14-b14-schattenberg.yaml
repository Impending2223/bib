    item: '[[w.schattenberg-brezhnev]], 275 (n.72–73) (The plenum of the Central Committee, called by Brezhnev on the spur of the moment; some fifty members absent. It hears the account of the Warsaw meeting and approves the course. Brezhnev: before the most extreme measures, all political means, with the brother parties, to help the Czechoslovak party and people protect the achievements of socialism)'
