    entry:
      id: cal.1962-12.soviet-union-leadership
      when: Dec.
      date: 1962-12
      thread: soviet-union-leadership
      c: The Manege exhibition. Brezhnev goes with Khrushchev; faced with the abstract paintings Khrushchev flies into a rage and curses the artists.
      n: '[[w.schattenberg-brezhnev]], 251 (n.63). To check: Yu. Gerchuk, *Krovoizliyanie v MOSKh ili Khrushchev v Manezhe* (2008) (cited by [[w.schattenberg-brezhnev]], 251 n.63). Names: Brezhnev, Khrushchev. Check: the day.'
