- cite:
    id: cal.1968-08-17.soviet-union-leadership-2
    item: '[[w.schattenberg-brezhnev]], 281 (n.139–40) (The Politburo, with the group of five, decides on the invasion of Czechoslovakia, and to call the decisive conference in Moscow; the Central Committee''s decisions and instructions for carrying it out)'
