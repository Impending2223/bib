      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1960-05-07.soviet-union-leadership
      when: May 7
      date: '1960-05-07'
      thread: soviet-union-leadership
      c: The Supreme Soviet elects Brezhnev chairman of the Presidium of the Supreme Soviet, in Voroshilov's place; Voroshilov had been asked to request release on "health grounds." He gives up his post as Central Committee secretary; he is a full member of the Presidium, sits on the Defense Council and continues to oversee rocketry.
      n: '[[w.schattenberg-brezhnev]], 153 (n.291–94). To check: RGANI, f. 80, op. 1, d. 1200, l. 49; Fursenko, *Prezidium TsK KPSS*, I, 441, III, 127 (cited by [[w.schattenberg-brezhnev]], 153 nn.291, 293). See [[cal.1960-05-04.soviet-union]]. Names: Brezhnev, Voroshilov.'
      tags:
      - name:brezhnev-leonid
      - name:voroshilov-kliment-e
      - polity:ussr
- add:
    entry:
      id: cal.1960-10-24.soviet-union-leadership
      when: Oct. 24
      date: '1960-10-24'
      thread: soviet-union-leadership
      also:
      - space
      c: 'Baikonur. A rocket explodes: 126 dead, Nedelin, the commander, among them. Brezhnev heads the commission of inquiry and goes to the site at once; on his return he reports to Khrushchev an unforeseen accident from a tragic chain of events, and advises that no one be held responsible and rocket building go on. The engineer Yangel, blaming himself, is given a better apartment in Moscow.'
      n: '[[w.schattenberg-brezhnev]], 152 (nn.286–89). To check: B. Chertok, *Raketen und Menschen*, 380, 382; S. Khrushchev, *Geburt einer Supermacht*, 364–65 (cited by [[w.schattenberg-brezhnev]], 152 nn.286–89). Made public: 2021 at the latest. Names: Nedelin, Brezhnev, Khrushchev, Yangel. Check: the days of Brezhnev''s trip and report.'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - polity:ussr
- add:
    entry:
      id: cal.1960-12-17.soviet-union-leadership
      when: Dec. 17
      date: '1960-12-17'
      thread: soviet-union-leadership
      c: Brezhnev presents Culture Minister Furtseva with a medal.
      n: '[[w.schattenberg-brezhnev]], 155 (the photograph, Figure 17). To check: GARF, f. R-7523, op. 78, d. 37b (album of photographs of Brezhnev''s presenting government awards, May 28, 1960–Mar. 9, 1962) (cited by [[w.schattenberg-brezhnev]], 156 n.305). Names: Brezhnev, Furtseva.'
      tags:
      - name:brezhnev-leonid
      - name:furtseva-yekaterina-a
      - polity:ussr
- add:
    entry:
      id: cal.1961-02-09.soviet-union-leadership
      when: Feb. 9
      date: '1961-02-09'
      thread: soviet-union-leadership
      also:
      - africa
      c: 'Brezhnev, off on his first foreign tour, to Africa for ten days. His plane comes under fire from French fighter jets before it reaches Algeria. France: warning shots, the plane off its course; the Soviet Union and Morocco suspect deliberate sabotage.'
      n: '[[w.schattenberg-brezhnev]], 159 (the incident; n.330), 153–54 (the departure by the Presidium''s custom; *Izvestiya*, Feb. 9, 1961, "Schastlivogo puti," 154 n.296). To check: GARF, f. R-7523, op. 78, d. 76 (press survey of the trip to Guinea, Ghana and Morocco), l. 3, 5, 10 (cited by [[w.schattenberg-brezhnev]], 159 n.330). Names: Brezhnev. Check: the work puts the tour "in the January" at 161 and "early 1961" at 159; "before it reached Algeria" for a tour begun in Morocco.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - polity:fr
      - polity:morocco
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      c: Morocco. Brezhnev, welcomed by *Pravda* as a "symbol of freedom," talks with the heir Hassan on Soviet successes; Morocco accepts Soviet aid and weapons. King Mohammed V promises to push for the closing of the American air base and to let arms pass to the Algerian rebels. Brezhnev ends the tour with a second visit to the king.
      n: '[[w.schattenberg-brezhnev]], 159 (nn.330–32), 160 (n.343). To check: GARF, f. R-7523, op. 78, d. 76, l. 9, 12; W. Murphy, *Brezhnev*, 168 (cited by [[w.schattenberg-brezhnev]], 159 nn.331–32). Names: Brezhnev, Hassan, Mohammed V. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:hassan-ii
      - polity:ussr
      - polity:morocco
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership-2
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      - congo
      c: 'Guinea. Brezhnev speaks to 20,000 in Conakry and tours the country five days, in Labé and Kankan: no distinction by skin colour; the Soviet Union on the side of the oppressed. Sékou Touré awards him a medal as a "Fighter for Independence." A five-year trade agreement. A joint communiqué condemns Lumumba''s murder as the colonial powers'' treachery, calls for the withdrawal of Belgian troops and an end to the Algerian war.'
      n: '[[w.schattenberg-brezhnev]], 159–60 (nn.333–38). To check: GARF, f. R-7523, op. 78, d. 76, l. 15, 17 f., 21; d. 77, l. 3, 10 f., 14 f. (cited by [[w.schattenberg-brezhnev]], 159–60 nn.333–35). Names: Brezhnev, Sékou Touré, Lumumba. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:lumumba-patrice
      - polity:ussr
      - polity:guinea
- add:
    entry:
      id: cal.1961-02.soviet-union-leadership-3
      when: Feb., after the 9th
      date: 1961-02
      thread: soviet-union-leadership
      also:
      - africa
      c: Ghana. Brezhnev meets Nkrumah, who proves the most open to the Soviet overtures and accepts a return invitation for the summer of 1961. Brezhnev promises 80 million dollars in loans and technological and military help.
      n: '[[w.schattenberg-brezhnev]], 160 (nn.340–42). To check: GARF, f. R-7523, op. 78, d. 76; d. 77 (cited by [[w.schattenberg-brezhnev]], 160 nn.340–42). Names: Brezhnev, Nkrumah. Check: the days.'
      tags:
      - name:brezhnev-leonid
      - name:nkrumah-kwame
      - polity:ussr
      - polity:ghana
