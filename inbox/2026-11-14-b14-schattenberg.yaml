      when: June 16
      date: '1961-06-16'
      thread: soviet-union-leadership
      also:
      - space
      c: Khrushchev, Brezhnev and Keldysh, president of the Academy of Sciences, honoured as Heroes of Socialist Labour for the successful spaceflight; the photograph shows Khrushchev and Brezhnev close, grinning, Keldysh between.
      n: '[[w.schattenberg-brezhnev]], 156 (nn.308–09). To check: Fursenko, *Prezidium TsK KPSS*, III, 509; GARF, f. R-7523, op. 78, d. 37b, l. 66 (cited by [[w.schattenberg-brezhnev]], 156 nn.308–09). Names: Khrushchev, Brezhnev, Keldysh. Check: the work puts the honour June 16, 1961 and for "the successful spaceflight" (Gagarin, Apr. 12).'
