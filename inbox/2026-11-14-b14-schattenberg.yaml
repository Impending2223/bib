    item: '[[w.schattenberg-brezhnev]], 173–74 (the vote; the unedited minutes against the printed, 173 n.16, 174 n.21) (The plenum of the Central Committee, the Kremlin''s Sverdlov Hall, from 6 p.m., 329 members. Brezhnev opens and gives the floor to Suslov, who repeats the accusations against Khrushchev. On Brezhnev''s proposal, no discussion. Khrushchev, released "due to advanced age" and the "state of his health," does not speak. The posts of first secretary and chairman of the Council of Ministers never again to be held by one man. Brezhnev first secretary, on Podgorny''s proposal; Kosygin, on Brezhnev''s, by the unedited minutes: the printed ones say the proposal came from the floor. Brezhnev misspeaks, "elected" for "recommended"; Lesechko asks why no second secretary is chosen; Brezhnev cuts him off)'
