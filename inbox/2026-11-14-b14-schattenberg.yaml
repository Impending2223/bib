    item: '[[w.schattenberg-brezhnev]], 167 (Khrushchev, at the Presidium of Sept. 17, says he will dismantle the Presidium on his return from holiday; to Shelest, 167: the Presidium "a bunch of old men"; the work''s note names Khrushchev''s son''s book, 167 n.414, not a protocol; not the Timiryazev Academy, the plant, the congress or Mikoyan''s trip)'
