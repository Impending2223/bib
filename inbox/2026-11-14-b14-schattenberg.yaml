- add:
    entry:
      id: cal.1964-10.soviet-union-leadership
      when: Oct.
      date: 1964-10
      thread: soviet-union-leadership
      c: 'The new leaders go to the allied capitals after the first telephone calls: Suslov to Bulgaria, Podgorny to the GDR and Hungary, Brezhnev and Kosygin to Poland, Czechoslovakia and Romania. Brezhnev''s notes of the talks with the party leaders are dated Oct. 29.'
      n: '[[w.schattenberg-brezhnev]], 270 (the notes, 270 n.16). To check: RGANI, f. 80, op. 1, d. 329, l. 16 and Brezhnev''s handwritten notes of Oct. 29, 1964 (cited by [[w.schattenberg-brezhnev]], 270 n.16). See [[cal.1964-10-22.soviet-union-leadership]]. Names: Suslov, Podgorny, Brezhnev, Kosygin. Check: the days of each visit.'
      tags:
      - name:suslov-mikhail-a
      - name:podgorny-nikolai-v
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - polity:ussr
- add:
    entry:
      id: cal.1965-03.soviet-union-leadership
      when: Mar.
      date: 1965-03
      thread: soviet-union-leadership
      c: 'Kosygin to a Gosplan meeting: the idea long and doggedly promoted that the automobile industry need not be developed; managers of large enterprises denied the right to a car, forced to use trucks illegally for business travel. "Is that correct?"'
      n: '[[w.schattenberg-brezhnev]], 224–25 (the passage quoted, 225). To check: RGAE, f. 4372, op. 66, d. 3, l. 176 (cited by [[w.schattenberg-brezhnev]], 224 n.206). Names: Kosygin. Check: the day.'
      tags:
      - name:kosygin-aleksei
      - polity:ussr
- add:
    entry:
      id: cal.1965-03-25.soviet-union-leadership
      when: Mar. 25
      date: '1965-03-25'
      thread: soviet-union-leadership
      c: The commission drafting the plenum's resolution on agriculture. Brezhnev moderates, gives no opinion of his own and asks the others. The first speaker would cut the resolution's second page; Brezhnev asks, cheerfully, what everyone thinks. A lively debate on its structure and how much criticism of agriculture it should hold.
      n: '[[w.schattenberg-brezhnev]], 178–79 (the day, 178 n.59). To check: RGANI, f. 2, op. 1, d. 773, l. 23 (cited by [[w.schattenberg-brezhnev]], 178 n.59). Made public: 2021 at the latest. Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-03-26.soviet-union-leadership
      when: Mar. 26
      date: '1965-03-26'
      thread: soviet-union-leadership
      c: 'The plenum of the Central Committee on agriculture, its fifth session. Brezhnev, without naming Khrushchev, attacks the "great shortcomings and mistakes" in the management of agriculture. Farms to be paid enough to cover costs and pay wages; decisions on profitability, not "subjectivism"; more tractors and repair shops, the harvest in twenty days. Lysenko''s era ended: no more charlatans, campaigns or coercion. Prices of consumer goods in the country to match the cities''. In closing he warns that the line on aligning farmers'' and workers'' living standards must be explained with care.'
      n: '[[w.schattenberg-brezhnev]], 211–12 (the speech, nn.68–74), 212 (the closing words, n.75). To check: RGANI, f. 2, op. 1, d. 780 (stenogram of the first and second sessions, Mar. 24, 1965), l. 6–54; d. 782 (fifth session), l. 75 f.; d. 785 (fifth session, Mar. 26, 1965), l. 110 (cited by [[w.schattenberg-brezhnev]], 211–12 nn.68–75, 175 n.29). Names: Brezhnev, Khrushchev. Check: the first day (the stenogram of the first sessions is dated Mar. 24, 1965).'
      tags:
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - polity:ussr
