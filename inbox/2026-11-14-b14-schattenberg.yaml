      when: Aug.
      date: 1966-08
      thread: soviet-union-leadership
      c: 'The Soviet government under Kosygin agrees with Fiat to build a car factory at Togliatti on the Volga: 600,000 vehicles a year.'
      n: '[[w.schattenberg-brezhnev]], 225 (n.205, 211). To check: S. Zhuravlev et al., *Avtovaz mezhdu proshlym i budushchim* (2006), 33, 46 (cited by [[w.schattenberg-brezhnev]], 225 nn.205, 211). Names: Kosygin. Check: the day.'
