      when: Apr. 15
      date: '1968-04-15'
      thread: soviet-union-leadership
      c: Brezhnev and Andropov advocate annulling the citizenship of the civil-rights activists Gabay and Marchenko. No host country is found.
      n: '[[w.schattenberg-brezhnev]], 253 (n.89). To check: RGANI, f. 89, perechen'' 18, document 47, l. 1–2 (cited by [[w.schattenberg-brezhnev]], 253 n.89). Made public: 2021 at the latest. Names: Brezhnev, Andropov, Gabay, Marchenko.'
