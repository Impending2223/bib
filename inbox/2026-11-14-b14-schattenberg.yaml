      when: Sept. 22
      date: '1962-09-22'
      thread: soviet-union-leadership
      c: Brezhnev pins a medal on Mzhavanadze, the head of the Georgian party; Georgadze, the secretary of the Presidium of the Supreme Soviet, between them.
      n: '[[w.schattenberg-brezhnev]], 155 (the photograph, Figure 18). Names: Brezhnev, Mzhavanadze.'
