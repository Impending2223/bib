      c: 'The Politburo, "Questions of Czechoslovakia." Brezhnev: one question only: have they exhausted all political means before taking the most extreme measures?'
      n: '[[w.schattenberg-brezhnev]], 276 (n.74–77). To check: Politburo resolution "Voprosy Chekhoslovakii," July 19, 1968, in Tomilina ed., *Chekhoslovatskiy krizis* (2010), 137–38; A. Pikhoya, *Moskva, Kreml'', vlast''*, 70 (cited by [[w.schattenberg-brezhnev]], 276 nn.74, 77, 83). Made public: 2021 at the latest. Names: Brezhnev.'
