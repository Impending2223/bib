    item: '[[w.schattenberg-brezhnev]], 174, 178, 183 (the stenogram of Nov. 16, 174 n.25, 178 nn.50, 54–55) (The plenum of the Central Committee, Brezhnev''s first. It undoes the division of the oblast and rayon party committees. On Brezhnev''s proposal Shelest and Shelepin full members of the Presidium, Demichev a candidate; Semichastny a candidate of the Central Committee. Brezhnev releases Kozlov from the Presidium with wishes for his recovery; of Shelest he says nothing more is needed than that he is a deserving, excellent leader. The party''s chief task, careful selection and appointment of cadres, to be run on collective lines)'
    units: '?'
- to-check:
    id: cal.1964-11-16.soviet-union-leadership-2
    add: '*Nikita Khrushchev. 1964* (2007), 362–68; RGANI, f. 2, op. 1, d. 754 (Protocol no. 10) (cited by [[w.schattenberg-brezhnev]], 174 n.25, 178 n.54, 183 n.91).'
- check:
    id: cal.1964-11-16.soviet-union-leadership-2
    text: 'Check: the day: the work dates the stenogram Nov. 16 and the plenum "one month later" than Oct. 14.'
