    item: '[[w.schattenberg-brezhnev]], 275 (n.60) (Moscow. Brezhnev consults the group of five. He sanctions manoeuvres in Czechoslovakia, recorded in his notebook as "Operation ''Tumour''"; he and the Politburo begin to look for people to replace Dubček)'
