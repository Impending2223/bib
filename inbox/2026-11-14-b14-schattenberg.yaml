- add:
    entry:
      id: cal.1968-08-13.soviet-union-leadership-2
      when: Aug. 13
      date: '1968-08-13'
      thread: soviet-union-leadership
      also: *id001
      c: 'Brezhnev''s eighty-minute telephone call to Dubček, evening, as to a friend ("Sasha"); Dubček keeps to "Comrade Brezhnev." Brezhnev: the cadre issues can be settled in the Presidium today, not at an extraordinary plenum; does Dubček stand personally behind the obligation of Čierna? Dubček: only a plenum can decide; he is considering giving up his post. Brezhnev: then the Presidium has no power, and the conversation was not to be taken seriously.'
      n: '[[w.schattenberg-brezhnev]], 279–80 (n.124–32). To check: telephone conversation of Brezhnev and Dubček, Aug. 13, 1968, in S. Karner et al. eds., *Prager Frühling* (2008), II, doc. 57, 329–43 (cited by [[w.schattenberg-brezhnev]], 279–80 nn.125, 127–32). Names: Brezhnev, Dubček.'
      tags:
      - name:brezhnev-leonid
      - name:dubcek-alexander
      - polity:czechoslovakia
