    item: '[[w.schattenberg-brezhnev]], 175 (Ustinov, Kulakov), 221–22 (the speeches, the debate) (The plenum of the Central Committee. Kosygin gives the main speech, on the economy: the planning body relieved of detailed planning, directors responsible for production, wages and bonuses by performance; the People''s Economic Councils replaced by ministries at Moscow and republic level. Brezhnev''s analysis of the economy, in broad strokes; its most critical sections not released for publication. Ustinov elected a secretary of the Central Committee for armament, Kulakov for agriculture. Debate of three days)'
