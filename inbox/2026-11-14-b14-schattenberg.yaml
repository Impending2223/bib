    item: '[[w.schattenberg-brezhnev]], 274 (n.56–57) (Moscow. The Soviet and Czechoslovak leaderships in talks. Brezhnev: no intention to interfere, only well-meant advice; Moscow alarmed that the Czechoslovak leadership lets the enemies of the party do as they please. The first hint that its affairs have implications beyond Czechoslovakia: not every issue is purely domestic)'
