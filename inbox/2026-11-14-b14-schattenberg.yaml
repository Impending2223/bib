    entry:
      id: cal.1965-09-16.soviet-union-leadership
      when: Sept. 16
      date: '1965-09-16'
      thread: soviet-union-leadership
      c: 'Brezhnev sends the draft of his speech for the coming plenum to all members of the Central Committee: "I request comments. I continue to work on it."'
      n: '[[w.schattenberg-brezhnev]], 181 (the covering words, 181 n.75). To check: RGANI, f. 2, op. 1, d. 790, l. 1 (cited by [[w.schattenberg-brezhnev]], 181 n.75). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
