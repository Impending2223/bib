    add: RGANI, f. 2, op. 3, d. 121 (Protocol no. 9, Oct. 30–31, 1968), l. 26; d. 125 (third session, Oct. 31, 1968), l. 127; d. 130 (fourth session), l. 2–25, Brezhnev, "O vneshnepoliticheskoy deyatel'nosti" (cited by [[w.schattenberg-brezhnev]], 213–14 nn.82, 86, 91, 283 n.156).
- check:
    id: cal.1968-10-30.soviet-union-leadership-2
    text: 'Check: the work gives the "Brezhnev doctrine" words (283) as from Pravda, September 1968 (n.161 names S. Kovalev, Sept. 26) and from this plenum; which of them is at 283.'
