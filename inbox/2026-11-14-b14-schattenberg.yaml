    entry:
      id: cal.1965-09.soviet-union-leadership
      when: Sept.
      date: 1965-09
      thread: soviet-union-leadership
      c: On the KGB's report on the writers Sinyavsky and Daniel, who had published parodies of the Soviet Union in the West, the Presidium calls for a public trial, to send a message at home and abroad. The trial, February 1966; sentences of seven and five years.
      n: '[[w.schattenberg-brezhnev]], 251 (the trial and sentences, 251). To check: V. Semichastny, *Bespokoynoye serdtse*, 252–53; *Kul''tura i vlast'' ot Stalina do Gorbacheva. Apparat TsK KPSS i kul''tura 1965–1972 gg.* (2009), 35, 126 (cited by [[w.schattenberg-brezhnev]], 251 n.60). Made public: 2021 at the latest. Names: Semichastny, Sinyavsky, Daniel. Check: the day.'
      tags:
      - polity:ussr
      - vis:only:ussr
