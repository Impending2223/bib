      when: Oct. 15
      date: '1967-10-15'
      thread: soviet-union-leadership
      c: Volgograd. Brezhnev opens the memorial on Mamayev Kurgan, with The Motherland Calls, the statue. His speech joins the glory of the heroes to the duty of those who follow, the defeat of fascism to the party's leadership.
      n: '[[w.schattenberg-brezhnev]], 261–62 (n.167). To check: Brezhnev''s speech at the opening of the memorial site, Volgograd, Oct. 15, 1967 (cited by [[w.schattenberg-brezhnev]], 262 n.167). Names: Brezhnev.'
