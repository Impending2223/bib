    item: '[[w.schattenberg-brezhnev]], 157 (nn.314–20) (The constitutional commission. Brezhnev, heading its subcommittee on state administration, the soviets and societal organizations, presents the reform: the local soviets self-governing, presidiums elected in place of executive committees, referenda, discussion of laws by the people, their right to propose laws)'
