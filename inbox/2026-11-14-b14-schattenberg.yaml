- check:
    id: cal.1968-08-17.soviet-union-leadership-2
    text: 'Check: the work says the decision was to invade "the following day"; the invasion came the night of Aug. 20–21 ([[cal.1968-08-20.soviet-union]]). The work gives, undated, Brezhnev''s remark to Aleksandrov-Agentov, "If we lose Czechoslovakia," he would resign (281 n.139).'
- cite:
    id: cal.1968-10-30.soviet-union-leadership-2
    item: '[[w.schattenberg-brezhnev]], 213–14 (n.81–91), 283 (n.156, 161) (The plenum of the Central Committee on agriculture. Brezhnev: in 1966–67 the developing countries had asked for 500 million pud of grain, a third filled, to the cost of Soviet influence; he orders these passages kept out of the printed minutes sent to the secretaries. Shelest cautiously voices doubts whether the aid to the kolkhozes should be cut. Brezhnev: nobody should try their patience; the villages must have the support. He gives the report on foreign policy)'
    units: '?'
