- add:
    entry:
      id: cal.1968-07-24.crime-and-hijacking-guns
      when: July 24
      date: '1968-07-24'
      thread: crime-and-hijacking-guns
      c: 'The Senate Judiciary Committee approves a gun bill, S. 3633, 13–3: provisions like the House''s. Not to reach the floor before the conventions'' recess.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1939.'
- add:
    entry:
      id: cal.1968-07-19.crime-and-hijacking-guns
      when: July 19
      date: '1968-07-19'
      thread: crime-and-hijacking-guns
      c: The House on the gun bill, H.R. 17735, in committee of the whole. Bingham's amendment, registration of all firearms, refused by teller vote, 68–172; McClory's, of handguns only, 89–168.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1939. Names: Bingham, McClory.'
      tags:
      - name:bingham-jonathan-b
      - name:mcclory-robert
- add:
    entry:
      id: cal.1968-07-23.crime-and-hijacking-guns
      when: July 23
      date: '1968-07-23'
      thread: crime-and-hijacking-guns
      c: The House on the gun bill, H.R. 17735. McClory's amendment, federal licensing of gun owners, refused by teller vote, 84–179. Horton's, no importation of military surplus firearms, adopted, 65–62; Dingell against.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1939, 1941. Names: McClory, Horton, Dingell.'
      tags:
      - name:mcclory-robert
      - name:horton-frank-j
      - name:dingell-john-d
- add:
    entry:
      id: cal.1968-07-15.school-aid
      when: July 15
      date: '1968-07-15'
      thread: school-aid
      c: 'The House passes the Vocational Education Amendments, H.R. 18366, 390–0: $1,317,250,000 for fiscal 1969 and 1970, $565 million a year for the basic programs after. The Senate, the same day, puts its bill, S. 3770, in its place.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1941–42. Names: Perkins.'
      tags:
      - name:perkins-carl-d
- add:
    entry:
      id: cal.1968-07-17.school-aid
      when: July 17
      date: '1968-07-17'
      thread: school-aid
      also:
      - poverty
      c: 'The Senate passes the vocational education bill, H.R. 18366 with S. 3770''s text, 88–0: $2,707,152,000 through fiscal 1972. Dominick''s and Murphy''s amendment moving Head Start from the Office of Economic Opportunity to the Office of Education, 60–29; Clark against, with the administration. Ellender''s $50 million a year more for school lunches for needy children, 57–31, in place of Javits''s; the amendment as changed, 85–0.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1941–42. Names: Dominick, Murphy, Clark, Ellender, Javits.'
      tags:
      - name:dominick-peter-h
      - name:murphy-george
      - name:clark-joseph-s
      - name:ellender-allen-j
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1968-07-18.cities-and-housing
      when: July 18
      date: '1968-07-18'
      thread: cities-and-housing
      also:
      - space
      c: 'The Senate passes the independent offices and HUD appropriation, H.R. 17023, 74–0: $15,505,214,000 in new budget authority; $1 billion for model cities and $65 million in rent supplement contracts, the full requests. Allott''s cut of $250 million from model cities refused, 21–54; Williams''s $300 million from NASA''s research, 34–52; Stephen Young''s cut in civil defense, 27–54. The $100,000 for the Commission on Executive, Legislative and Judicial Salaries kept, 46–41, Harry Byrd Jr. against.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1944–46, 2009. Names: Allott, Williams, Stephen Young, Harry F. Byrd Jr., Magnuson.'
      tags:
      - name:allott-gordon-l
      - name:williams-john-j
      - name:young-stephen-m
      - name:byrd-harry-f-jr
      - name:magnuson-warren-g
- add:
    entry:
      id: cal.1968-07-11.conservation
      when: July 11
      date: '1968-07-11'
      thread: conservation
      c: 'Interior appropriation for fiscal 1969, H.R. 17354, cleared: $1,415,789,300 for the Interior Department and related agencies. The conference report filed July 10.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1951–52.'
- add:
    entry:
      id: cal.1968-07-17.congress
      when: July 17
      date: '1968-07-17'
      thread: congress
      c: 'Legislative Branch appropriation for fiscal 1969, H.R. 18038, cleared: $298,678,396, $17,194,137 under the request. The conference report adopted by the House July 16, the Senate July 17; $400,000 for the inauguration of 1969.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1953–55. Names: Gross.'
      tags:
      - name:gross-h-r
- add:
    entry:
      id: cal.1968-07-12.health
      when: July 12
      date: '1968-07-12'
      thread: health
      c: 'The House passes H.R. 15758, 327–1: the regional medical programs for heart disease, cancer and stroke and the health services for migrant workers extended two years; the first grants to build and staff facilities for alcoholics; the narcotic addict program extended. Paul Jones the one vote against.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1955. Names: Jones.'
      tags:
      - name:jones-paul-c
- add:
    entry:
      id: cal.1968-07-17.congress-2
      when: July 17
      date: '1968-07-17'
      thread: congress
      c: 'Passports good for five years, S. 1418, cleared: the Senate takes the House''s amendment, a fee of $12. The House had passed it July 15, 324–71, Hays managing. UPI, July 17: diplomatic passports for members of Congress abroad on official business, the price of a vote on the bill.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1955–57. Names: Hays.'
      tags:
      - name:hays-wayne-l
- add:
    entry:
      id: cal.1968-07-11.transportation
      when: July 11
      date: '1968-07-11'
      thread: transportation
      c: 'Aircraft noise abatement, H.R. 3400, cleared by the Senate by voice vote: the Federal Aviation Administration to set standards for aircraft noise and sonic boom in certifying aircraft. Case''s and Proxmire''s amendment, a two-year study of the sonic boom and no supersonic civil flights over the country meanwhile, refused, 12–55.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1956–57. Names: Case, Proxmire.'
      tags:
      - name:case-clifford-p
      - name:proxmire-william
- add:
    entry:
      id: cal.1968-07-19.transportation
      when: July 19
      date: '1968-07-19'
      thread: transportation
      c: 'The High Speed Ground Transportation Act extended two years, H.R. 16024, cleared by the Senate: $16.2 million for fiscal 1969, $21.2 million for 1970. Passed by the House July 12.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1957.'
- add:
    entry:
      id: cal.1968-07-15.conservation-2
      when: July 15
      date: '1968-07-15'
      thread: conservation
      c: 'The House passes the national trails system bill, H.R. 4865, 378–18, and puts its text in the Senate''s, S. 827. The House passes the Redwood National Park bill, S. 2515, 388–15: 28,400 acres; the Senate''s of 1967, 61,654; the administration''s, 37,000. To conference. The House passes the Oahe irrigation project, S. 6, 264–128.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1957, 1960, 1962. Names: Aspinall.'
      tags:
      - name:aspinall-wayne-n
- add:
    entry:
      id: cal.1968-07-17.consumers
      when: July 17
      date: '1968-07-17'
      thread: consumers
      c: 'Cleared: S.J. Res. 160, a study of institutional investors by the Securities and Exchange Commission, $875,000, due Sept. 1, 1969; and S. 1299, the Federal Reserve Board''s power over margin requirements extended to the over-the-counter market. The Senate takes the House''s amendments to each by voice vote.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1958–59.'
- add:
    entry:
      id: cal.1968-07-22.conservation
      when: July 22
      date: '1968-07-22'
      thread: conservation
      c: 'The Oahe unit, first stage, on the Missouri in South Dakota, S. 6, cleared: the Senate takes the House''s version by voice vote. Estimated federal cost $191,670,000; no funds yet.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1960.'
      tags:
      - state:sd
- add:
    entry:
      id: cal.1968-07-18.crime-and-hijacking
      when: July 18
      date: '1968-07-18'
      thread: crime-and-hijacking
      c: 'Juvenile Delinquency Prevention and Control Act, H.R. 12120, cleared: three years, $150 million, grants to the States.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1960.'
- add:
    entry:
      id: cal.1968-06-28.latin-america
      when: June 28
      date: '1968-06-28'
      thread: latin-america
      also:
      - trade
      c: 'The Senate consents to the International Coffee Agreement of 1968, 51–8: the agreement of 1962, due to expire Sept. 30, extended five years.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1961.'
- add:
    entry:
      id: cal.1968-07-11.defense
      when: July 11
      date: '1968-07-11'
      thread: defense
      c: 'Military construction authorization, H.R. 16703, cleared: both Houses adopt the conference report by voice vote. $1,800,151,000, with $17,307,000 for deficiencies.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1961–62. See [[cal.1968-06-24.defense]].'
- add:
    entry:
      id: cal.1968-07-20.conservation
      when: July 20
      date: '1968-07-20'
      thread: conservation
      c: 'The Senate passes the public works and Atomic Energy Commission appropriation, H.R. 17903, 67–3: $4,727,622,500. Cooper''s cut of $3,750,000 for the Tennessee Valley Authority''s land buying refused, 28–43.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 2011. Names: Cooper.'
      tags:
      - name:cooper-john-sherman
- add:
    entry:
      id: cal.1968-07-22.congress
      when: July 22
      date: '1968-07-22'
      thread: congress
      c: The House on the District of Columbia's bills. Judges of the District's courts raised $4,000 a year, H.R. 15678, 340–44; Hall's motion to recommit the medical facilities bill, S. 1228, $40 million in grants and $40.5 million in loans to ten hospitals, refused, 108–290; school fares on the private buses, H.R. 18248, 205–184.
      n: '[[w.cq-weekly-report]], July 26, 1968, 2012–13. Names: Hall.'
      tags:
      - name:hall-durward-g
- add:
    entry:
      id: cal.1968-07-18.defense
      when: July 18
      date: '1968-07-18'
      thread: defense
      c: 'The House Appropriations Committee, Mahon chairman, reports the defense appropriation for fiscal 1969, H.R. 18785: $72,239,700,000, $4,834,300,000 under the request of $77,074,000,000; nothing cut from Southeast Asia''s programs; the cuts under the Revenue and Expenditure Control Act.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1963–65. Names: Mahon.'
      tags:
      - name:mahon-george-h
- add:
    entry:
      id: cal.1968-07-17.consumers-2
      when: July 17
      date: '1968-07-17'
      thread: consumers
      c: 'The Senate Commerce Committee reports the Consumer Sales Protection Act, S. 1599: a door-to-door sale of $60 or more may be canceled.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1965. Names: Magnuson. Check: the sum and the days allowed.'
      tags:
      - name:magnuson-warren-g
- add:
    entry:
      id: cal.1968-06-28.antisubversion
      when: June 28
      date: '1968-06-28'
      thread: antisubversion
      c: 'The House Rules Committee, Colmer chairman, reports H. Res. 148: the Un-American Activities Committee renamed the Committee on Internal Security, its field "Communist and other subversive activities."'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1966. Names: Colmer.'
      tags:
      - name:colmer-william-m
- add:
    entry:
      id: cal.1968-07-16.labor
      when: July 16
      date: '1968-07-16'
      thread: labor
      c: 'The House Education and Labor Committee reports the Occupational Safety and Health Act, H.R. 17748, a substitute: the Secretary of Labor''s power to set standards limited. All its Republicans but Bell and Reid sign minority views.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1967, 1974. Names: Bell, Reid.'
      tags:
      - name:bell-alphonzo
      - name:reid-ogden-r
- add:
    entry:
      id: cal.1968-07-17.testing-npt
      when: July 17
      date: '1968-07-17'
      thread: testing-npt
      c: 'The Senate Foreign Relations Committee ends its hearings on the nonproliferation treaty. Teller: leave "purely defensive" nuclear systems, antimissile defenses for Japan, India and Pakistan, free of the treaty. Findley, of the House Republican task force on the alliance: the treaty unamended will "seriously" weaken the Atlantic alliance.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1968. Names: Teller, Findley, Fulbright.'
      tags:
      - name:teller-edward
      - name:findley-paul
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-07-22.press-and-broadcasting
      when: July 22
      date: '1968-07-22'
      thread: press-and-broadcasting
      c: 'Fascell''s subcommittee of House Foreign Affairs opens hearings on "public diplomacy," relations among nations outside governmental channels: "We want to know what is happening to America''s image abroad."'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1968. Names: Fascell.'
      tags:
      - name:fascell-dante-b
- add:
    entry:
      id: cal.1968-07-22.court-fortas
      when: July 22
      date: '1968-07-22'
      thread: court-fortas
      c: 'The Judiciary Committee on Thornberry, his rulings, and the Justice Department''s study of Fortas''s opinions put in the record by Hart July 20: Ervin, the department "propagandizing the Committee." Hicks of the Liberty Lobby and Clancy of Citizens for Decent Literature against Fortas.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 2005. See [[cal.1968-07-16.court-fortas]]. Names: Thornberry, Hart, Ervin, Fortas.'
      tags:
      - name:thornberry-william-h
      - name:hart-philip-a
      - name:ervin-sam-j-jr
      - name:fortas-abe
- add:
    entry:
      id: cal.1968-07-20.court-fortas
      when: July 20
      date: '1968-07-20'
      thread: court-fortas
      c: 'A Saturday sitting of the Judiciary Committee: Ervin questions Thornberry on his rulings; he declines to comment. Eastland releases Fortas''s letter: as Chief Justice he would inform the public better about the Court.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 2005. See [[cal.1968-07-16.court-fortas]]. Names: Ervin, Thornberry, Eastland, Fortas.'
      tags:
      - name:ervin-sam-j-jr
      - name:thornberry-william-h
      - name:eastland-james-o
      - name:fortas-abe
- add:
    entry:
      id: cal.1968-07-22.open-housing
      when: July 22
      date: '1968-07-22'
      thread: open-housing
      c: 'The Justice Department''s first suits under the open housing title of the Civil Rights Act of 1968, in New Orleans: a "pattern or practice" of discrimination by the builders of three subdivisions in Baton Rouge.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 2005.'
      tags:
      - state:la
- add:
    entry:
      id: cal.1968-05-13.labor
      when: May 13
      date: '1968-05-13'
      thread: labor
      c: 'The National Association of Manufacturers, in NAM Reports, on the Labor Department''s booklet for the job safety bill, its pictures of fatal accidents: "blatant propaganda," the pictures "years out of date."'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1974.'
- add:
    entry:
      id: cal.1968-06-25.labor
      when: June 25
      date: '1968-06-25'
      thread: labor
      c: 'Esther Peterson, Assistant Secretary of Labor, at a news conference: some of the booklet''s pictures old; the odds against the job safety bill this year.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1974. Names: Peterson.'
      tags:
      - name:peterson-esther
- add:
    entry:
      id: cal.1968-07-10.labor
      when: July 10
      date: '1968-07-10'
      thread: labor
      c: Johnson makes the job safety bill one of his "must" bills for the session.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1974. Names: Johnson. Check: the statement; CQ''s p. 1772 gives it.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-07-15.king-poor-peoples
      when: July 15
      date: '1968-07-15'
      thread: king-poor-peoples
      c: Some 70 Quakers and others of the Poor People's Campaign give a loaf of bread to each member of the House, for lifting the $225 million ceiling on food stamps.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975.'
- add:
    entry:
      id: cal.1968-07-16.king-poor-peoples
      when: July 16
      date: '1968-07-16'
      thread: king-poor-peoples
      c: 'Abernathy, at a news conference in Washington: a "Poor People''s Embassy," a lobby for the poor of all races and regions. He praises Rockefeller, no endorsement before the conventions.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975, 1988. Names: Abernathy, Rockefeller.'
      tags:
      - name:abernathy-ralph-david
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-07-19.king-poor-peoples
      when: July 19
      date: '1968-07-19'
      thread: king-poor-peoples
      c: The Poor People's Campaign's Washington headquarters closed.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975.'
- add:
    entry:
      id: cal.1968-07-10.republican-party-congress
      when: July 10
      date: '1968-07-10'
      thread: republican-party-congress
      also:
      - cities-and-housing
      c: 'Goodell, Curtis, Widnall and Taft, with CORE behind them, introduce H.R. 18460: community development corporations owned by the residents to finance businesses in the ghettos and poor rural areas, local development banks, a U.S. Community Development Bank; 36 cosponsors, all Republicans. July 11, a news conference with Innis of CORE: about $1 billion a year for two years.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975. Names: Goodell, Curtis, Widnall, Taft.'
      tags:
      - name:goodell-charles-e
      - name:curtis-thomas-b
      - name:widnall-william-b
      - name:taft-robert-jr
- add:
    entry:
      id: cal.1968-07-03.civil-rights-organizations
      when: July 3–7
      date: '1968-07-03'
      thread: civil-rights-organizations
      c: Columbus, Ohio. CORE's 26th convention; recessed July 7 with no new constitution and no successor to McKissick. Dissidents led by Carson of Brooklyn walk out. Resolutions for a black nation of the twelve Southeastern States, and a homeland in South West Africa and South Africa, tabled.
      n: '[[w.cq-weekly-report]], July 26, 1968, 1975. Names: McKissick.'
      tags:
      - name:mckissick-floyd-b
- add:
    entry:
      id: cal.1968-07-18.cities-and-housing-2
      when: July 18
      date: '1968-07-18'
      thread: cities-and-housing
      c: 'The National Commission on Urban Problems releases Hauser''s and Hodge''s projection: from 1960 to 1985 the central cities lose 2.4 million whites and gain 10 million nonwhites; the suburbs gain 53.9 million whites. Douglas, at a news conference, for himself: federal water, sewer and highway grants conditional on nonwhites in the suburbs.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1976. Names: Douglas.'
      tags:
      - name:douglas-paul-h
- add:
    entry:
      id: cal.1968-07-21.economy
      when: July 21
      date: '1968-07-21'
      thread: economy
      c: 'The Cabinet Committee on Price Stability, Okun chairman, to several hundred business and labor leaders: "utmost restraint" in wages and prices for the rest of 1968; no mandatory controls. Wage settlements up 5.8 percent in the first quarter, prices about 4.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1976. Names: Okun.'
      tags:
      - name:okun-arthur-m
- add:
    entry:
      id: cal.1968-07-21.economy-2
      when: July 21
      date: '1968-07-21'
      thread: economy
      c: 'The Federal Reserve''s study group, Mitchell chairman, three years on the discount window: a "basic borrowing privilege," the discount rate, now 5½ percent, changed as often as weekly.'
      n: '[[w.cq-weekly-report]], July 26, 1968, 1976. Names: Mitchell.'
      tags:
      - name:mitchell-george-w
- add:
    entry:
      id: cal.1968-07-14.vietnam
      when: July 14
      date: '1968-07-14'
      thread: vietnam
      c: 'Clifford arrives in Saigon, his first visit as Secretary: more of the fighting to the South Vietnamese; M-16 rifles for all their forces.'
