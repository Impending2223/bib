          - 'via x.1968-03-01.ginsburgh-to-rostow-on-mining: all'
  - add:
      entry:
        id: cal.1968-03-06.vietnam-2
        when: Mar. 6
        date: '1968-03-06'
        thread: vietnam
        also:
        - vietnam-205000
        c: 'Rostow to Johnson: "We are clearly in the midst of an unresolved critical battle"; the enemy losing about 1,000 killed a day against 241 in 1967, unable to keep it up more than a few months. The reserve call-up may not wait, "but the best time to mine the ports ... would be at the height of battle. Not since the Civil War has quite so much hinged for our country on immediate battlefield events."'
        n: '[[w.berman-lyndon-johnsons-war]], 182. To check: Rostow to Johnson, Mar. 6, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 182). Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 194e9bdd
          rows:
          - 'w.berman-lyndon-johnsons-war 182: all'
          - 'via x.1968-03-06.rostow-to-johnson-assessment: all'
  - add:
      entry:
        id: cal.1968-03-12.vietnam-2
        when: Mar. 12
        date: '1968-03-12'
        thread: vietnam
        c: 'Fortas to Johnson, "after a week of exercise, sleep and relaxation": stop trying to convince Hanoi to negotiate, "They know how to reach me"; unless "we ''win'' in Vietnam, our total national personality will ... change and for the worse"; bring the war "home to North Vietnam," short of an invasion, all-out air strikes on Hanoi and every target.'
        n: '[[w.berman-lyndon-johnsons-war]], 185. To check: Fortas to Johnson, Mar. 12, 1968, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 185 n.6). Names: Fortas, Johnson.'
        tags:
        - name:fortas-abe
        - name:johnson-lyndon-b
        src:
          c: 9e73f59e
          rows:
          - 'w.berman-lyndon-johnsons-war 185: all'
          - 'via x.1968-03-12.fortas-to-johnson: all'
  - add:
      entry:
        id: cal.1968-03-14.vietnam-205000-2
        when: Mar. 14
        date: '1968-03-14'
        thread: vietnam-205000
        c: 'Hoopes, Under Secretary of the Air Force, to Clifford: "repeated miscalculations as to the force and time required to ''defeat the aggression,'' pacify the countryside, and make the GVN and the ARVN viable without massive US support. Each fresh increment of American power has been justified as the last one needed to do the job."'
        n: '[[w.berman-lyndon-johnsons-war]], 201, 220–29 (app. B, the memorandum in full). See [[cal.1968-02-13.vietnam-205000]]. Names: Hoopes, Clifford.'
        tags:
        - name:hoopes-townsend-w
        - name:clifford-clark
        src:
          c: b86870cf
          rows:
          - 'w.berman-lyndon-johnsons-war 201, 220–29: all'
          - 'via x.1968-03-14.hoopes-to-clifford: all'
  - add:
      entry:
        id: cal.1968-03-18.vietnam-205000
        when: Mar. 18
        date: '1968-03-18'
        thread: vietnam-205000
        also:
        - elections-1968
        c: 'McPherson to Johnson: "I think the course we seem to be taking now will lead either to Kennedy''s nomination or Nixon''s election, or both"; Johnson "the most conservative of the six"; escalate to 750,000 or a million, or de-escalate, "I pray we choose the latter."'
        n: '[[w.berman-lyndon-johnsons-war]], 187. To check: McPherson to Johnson, Mar. 18, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 187). Names: McPherson, Johnson, Robert Kennedy, Nixon.'
        tags:
        - name:mcpherson-harry
        - name:johnson-lyndon-b
        - name:kennedy-robert-f
        - name:nixon-richard-m
        src:
          c: b7a888df
          rows:
          - 'w.berman-lyndon-johnsons-war 187: all'
          - 'via x.1968-03-18.mcpherson-to-johnson: all'
  - add:
      entry:
        id: cal.1968-03-18.vietnam-205000-2
        when: Mar. 18
        date: '1968-03-18'
        thread: vietnam-205000
        c: 'The Joint Chiefs, by the minutes: Harold Johnson, "We''ll find ourselves where we are today even if we build up forces one year from today"; McConnell for hot pursuit into Laos and Cambodia; Moorer for loosening the restraints on Hanoi and Haiphong; Chapman for "preparing forces to invade North Vietnam"; Wheeler, Saigon "the only city that has to be defended at all costs"; Harold Johnson for "an Inchon landing" thirty miles north of the DMZ.'
        n: '[[w.berman-lyndon-johnsons-war]], 188. To check: the minutes, Mar. 18, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 188). Names: Harold K. Johnson, McConnell, Moorer, Chapman, Wheeler.'
        tags:
        - name:johnson-harold-k
        - name:mcconnell-john-p
        - name:moorer-thomas
        - name:chapman-leonard-f-jr
        - name:wheeler-earle
        src:
          c: 2ac6bf6b
          rows:
          - 'w.berman-lyndon-johnsons-war 188: all'
          - 'via x.1968-03-18.minutes-of-the-joint-chiefs-meeting: all'
  - add:
      entry:
        id: cal.1968-03.vietnam-205000-4
        when: Mar.
        date: 1968-03
        thread: vietnam-205000
        also:
        - economy-surcharge
        c: 'McGeorge Bundy to Johnson, after the briefing papers: "the really tough problem you have is the interlock between the bad turn in the war, the critical need for a tax increase, and the crisis of public confidence at home"; no reserves for Vietnam, "No good military case for them exists"; many "have begun to think that Vietnam really is a bottomless pit."'
        n: '[[w.berman-lyndon-johnsons-war]], 193–94. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 193–94). Check: the day. Names: McGeorge Bundy, Johnson.'
        tags:
        - name:bundy-mcgeorge
        - name:johnson-lyndon-b
        src:
          c: dd012d4b
          rows:
          - 'w.berman-lyndon-johnsons-war 193–94: all'
          - 'via x.1968-03.mcgeorge-bundy-to-johnson-taxes-and-reserves: all'
  - add:
      entry:
        id: cal.1968-03-27.vietnam-205000-5
        when: Mar. 27
        date: '1968-03-27'
        thread: vietnam-205000
        c: 'McGeorge Bundy to Johnson on the senior advisers'' meeting: "we did not receive an unduly gloomy briefing. I do think we were given too rosy a picture in November."'
        n: '[[w.berman-lyndon-johnsons-war]], 198. To check: Bundy to Johnson, Mar. 27, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 198). See [[cal.1968-03-25.vietnam]]. Names: McGeorge Bundy, Johnson.'
