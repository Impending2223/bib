      units: B
  - add:
      entry:
        id: cal.1967-01-09.vietnam
        when: Jan. 9
        date: '1967-01-09'
        thread: vietnam
        c: 'The CIA''s Office of National Estimates on South Vietnam: its political health "precarious," pacification "spotty," the South Vietnamese forces'' fighting "generally poor." "There is no evidence of a diminution of Communist will to continue the war"; the Communists able to fight on for at least another year, "and they are probably determined to do so."'
        n: '[[w.berman-lyndon-johnsons-war]], 27–28. To check: the report, Jan. 9, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 27–28).'
        tags: []
        src:
          c: 08925f39
          rows:
          - 'w.berman-lyndon-johnsons-war 27–28: all'
          - 'via x.1967-01-09.cia-office-of-national-estimates-report: all'
  - add:
      entry:
        id: cal.1967-01-11.vietnam-order-of-battle
        when: Jan. 11
        date: '1967-01-11'
        thread: vietnam-order-of-battle
        c: 'Carver to Helms: MACV''s order of battle "far too low and should be raised, perhaps doubled"; a more realistic level would let the intelligence community better judge "what we are up against."'
        n: '[[w.berman-lyndon-johnsons-war]], 28. To check: Carver to Helms, Jan. 11, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 28). See [[cal.1966-11-22.vietnam-order-of-battle]]. Names: Carver, Helms.'
        tags:
        - name:carver-george-a-jr
        - name:helms-richard
        src:
          c: bc3d158f
          rows:
          - 'w.berman-lyndon-johnsons-war 28: all'
          - 'via x.1967-01-11.carver-to-helms-order-of-battle: all'
  - add:
      entry:
        id: cal.1967-01-19.vietnam-order-of-battle
        when: Jan. 19
        date: '1967-01-19'
        thread: vietnam-order-of-battle
        c: Wheeler calls the intelligence agencies that collect and analyze the order of battle to a meeting at Honolulu, to standardize the figures for the order of battle, infiltration and the estimates.
        n: '[[w.berman-lyndon-johnsons-war]], 29. Check: Berman names no document. See [[cal.1966-11-22.vietnam-order-of-battle]]. Names: Wheeler.'
        tags:
        - name:wheeler-earle
        src:
          c: 507800ad
          rows:
          - 'w.berman-lyndon-johnsons-war 29: all'
          - 'via x.1967-01-19.wheeler-instruction-honolulu-order-of-battle-meeting: all'
  - add:
      entry:
        id: cal.1967-01-20.vietnam-order-of-battle
        when: Jan. 20
        date: '1967-01-20'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson: "a debate continues on the absolute size of the enemy order of battle"; whatever the size, the official figures show for the first time a net decline in Viet Cong main forces and North Vietnamese units, in the fourth quarter of 1966, "the first reversal of the upward trend since 1960."'
        n: '[[w.berman-lyndon-johnsons-war]], 29–30. To check: Rostow to Johnson, Jan. 20, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 29–30). See [[cal.1966-11-22.vietnam-order-of-battle]]. Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: defc58af
          rows:
          - 'w.berman-lyndon-johnsons-war 29–30: all'
          - 'via x.1967-01-20.rostow-to-johnson-order-of-battle: all'
  - add:
      entry:
        id: cal.1967-02.vietnam-order-of-battle
        when: Feb.
        date: 1967-02
        thread: vietnam-order-of-battle
        c: 'Honolulu. The order-of-battle conference: MACV, the CIA and the other agencies agree that MACV''s order of battle will be raised a good deal, the irregular and political categories being much larger than MACV''s figures; the new estimates given high priority.'
        n: '[[w.berman-lyndon-johnsons-war]], 30. Check: the days. See [[cal.1967-01-19.vietnam-order-of-battle]].'
        tags: []
        src:
          c: 970bd502
          rows:
          - 'w.berman-lyndon-johnsons-war 30: all'
  - add:
      entry:
        id: cal.1967-03.vietnam-order-of-battle
        when: Mar.
        date: 1967-03
        thread: vietnam-order-of-battle
        c: 'Wheeler to Sharp and Westmoreland: "increasingly concerned over the contradictory order of battle (OB) and infiltration statistics" circulating in Washington; members of Congress, the White House and the press beginning to notice.'
        n: '[[w.berman-lyndon-johnsons-war]], 30. Check: the day; Berman''s note (208 n.2) gives Wheeler to Westmoreland, Mar. 9, 1967, CBS–Westmoreland Joint Exhibit 231. See [[cal.1967-01-19.vietnam-order-of-battle]]. Names: Wheeler, Sharp, Westmoreland.'
        tags:
        - name:wheeler-earle
        - name:sharp-u-s-grant
        - name:westmoreland-william
        src:
          c: 06bdd706
          rows:
          - 'w.berman-lyndon-johnsons-war 30: all'
          - 'via x.1967-03-09.wheeler-to-westmoreland-jx-231: all'
  - add:
      entry:
        id: cal.1967-03-11.vietnam-order-of-battle
        when: Mar. 11
        date: '1967-03-11'
        thread: vietnam-order-of-battle
        c: 'Wheeler to Westmoreland, on MACV''s new figures for enemy-initiated attacks of battalion size and larger: if they reach the public "they would, literally, blow the lid off of Washington"; not to be released. To Sharp and Westmoreland: the enemy''s combat capability rising through 1966 and 1967, January''s level some two and a half times that of early 1966; "I cannot go to the President" and say that "we are not sure who has the initiative"; new reporting procedures, before Johnson meets Lodge and Westmoreland.'
        n: '[[w.berman-lyndon-johnsons-war]], 30–31. To check: Wheeler to Westmoreland and Sharp, "VC/NVA battalion and larger attacks," Mar. 11, 1967, CBS–Westmoreland Joint Exhibit 233 (cited by [[w.berman-lyndon-johnsons-war]], 31 n.2). Check: Berman does not say whether the two messages were one. See [[cal.1967-01-19.vietnam-order-of-battle]]. Names: Wheeler, Westmoreland, Sharp, Johnson, Lodge.'
        tags:
        - name:wheeler-earle
        - name:westmoreland-william
        - name:sharp-u-s-grant
        - name:johnson-lyndon-b
        - name:lodge-henry-cabot
        src:
          c: bfdb1f2a
          rows:
          - 'w.berman-lyndon-johnsons-war 30–31: all'
          - 'via x.1967-03-11.wheeler-to-westmoreland-and-sharp-vc-nva-battalion-attacks: all'
  - add:
      entry:
        id: cal.1967-03-13.vietnam
        when: Mar. 13
        date: '1967-03-13'
        thread: vietnam
        c: 'Lodge to Rusk, before Guam: "I fully concur in the need to accelerate our present rate of progress and to dramatize what has been and should be achieved to meet the heavy pressures I know the president and you are under at home."'
        n: '[[w.berman-lyndon-johnsons-war]], 31. To check: Lodge to Rusk, Mar. 13, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 31 n.3). Names: Lodge, Rusk.'
        tags:
        - name:lodge-henry-cabot
        - name:rusk-dean
        src:
          c: 33953ebc
          rows:
          - 'w.berman-lyndon-johnsons-war 31: all'
          - 'via x.1967-03-13.lodge-to-rusk-accelerate-progress: all'
  - add:
      entry:
        id: cal.1967-03-18.vietnam-2
        when: Mar. 18
        date: '1967-03-18'
        thread: vietnam
        c: 'Rostow to Johnson, before Guam: "If victory is not in sight, it is on the way."'
        n: '[[w.berman-lyndon-johnsons-war]], 31. To check: Rostow to Johnson, Mar. 18, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 31); Rostow to Johnson, "Major themes for Thieu and Ky," Mar. 18, 1967 (cited by [[w.berman-lyndon-johnsons-war]], 33 n.6). Check: whether the two are one. Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 5ddb09ed
          rows:
          - 'w.berman-lyndon-johnsons-war 31: all'
          - 'via x.1967-03-18.rostow-to-johnson-victory-on-the-way: all'
  - add:
      entry:
        id: cal.1967-03-20.vietnam-2
        when: Mar. 20
        date: '1967-03-20'
        thread: vietnam
        c: 'Guam. Rostow''s points for Johnson''s evening meeting with Thiệu and Kỳ: "You are counting on these two great patriots to do the job"; everything depends "on unity among the Vietnamese military"; "You have put a half million men in Southeast Asia. You intend to see this through"; "We do not intend to give away the fruits of our effort at the conference table."'
        n: '[[w.berman-lyndon-johnsons-war]], 32–33. To check: Rostow to Johnson, "Four major points to be made in private session with Thieu and Ky," Mar. 20, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 33 n.6). See [[cal.1967-03-20.vietnam]]. Names: Rostow, Johnson, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:nguyen-van-thieu
        - name:nguyen-cao-ky
        src:
          c: bdd04df4
          rows:
          - 'w.berman-lyndon-johnsons-war 32–33: all'
          - 'via x.1967-03-20.rostow-to-johnson-four-major-points: all'
  - add:
      entry:
        id: cal.1967-03-22.vietnam-order-of-battle
        when: Mar. 22
        date: '1967-03-22'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson: Westmoreland''s presentation at Guam "designed to be conservative and non-promissory"; his 7,000 a month infiltration an upper figure, the year''s maximum of confirmed, probable and possible averaged and projected, ignoring the fall since early 1966. Chieu Hoi returnees over 1,000 a week for five weeks: sustained six months, "I find it hard to believe that the VC infrastructure can hold up."'
        n: '[[w.berman-lyndon-johnsons-war]], 33–34. To check: Rostow to Johnson, Mar. 22, 1967, LBJ Library; "North Vietnamese Infiltration Into South Vietnam," Mar. 17, 1967, CBS Subpoena Case #8, Document #1 (both cited by [[w.berman-lyndon-johnsons-war]], 34 n.8). See [[cal.1967-03-20.vietnam]]. Names: Rostow, Johnson, Westmoreland.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:westmoreland-william
        src:
          c: 4810ae8d
          rows:
