        id: cal.1967-10-07.vietnam-2
        when: Oct. 7
        date: '1967-10-07'
        thread: vietnam
        also:
        - vietnam-order-of-battle
        c: 'Rusk to Bunker: Saigon 7867 "presents powerful evidence of solid progress," and critics will attack its credibility; Washington and Saigon must agree on the order of battle and recruitment before the figures are used more widely; "surfacing ''balance sheets'' and ''crossover-points'' at this time would not be useful."'
        n: '[[w.berman-lyndon-johnsons-war]], 85–86. To check: Rusk to Bunker, Oct. 7, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 86 n.14). See [[cal.1967-10-07.vietnam]]. Names: Rusk, Bunker.'
        tags:
