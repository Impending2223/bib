        id: cal.1968-02.vietnam-khe-sanh-3
        when: Feb.
        date: 1968-02
        thread: vietnam-khe-sanh
        c: 'Taylor to Johnson on Khe Sanh: "Whatever the past value of the position, it is a positive liability now"; the enemy free to arrange "a set-piece attack on ground and in weather favorable to him." The Chiefs should instruct Westmoreland to pull out.'
        n: '[[w.berman-lyndon-johnsons-war]], 167–68. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 168). Check: the day. Names: Taylor, Johnson, Westmoreland.'
        tags:
        - name:taylor-maxwell
        - name:johnson-lyndon-b
