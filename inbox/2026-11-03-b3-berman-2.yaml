  - add:
      entry:
        id: cal.1967-11-13.vietnam-2
        when: Nov. 13
        date: '1967-11-13'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Bunker, at a press conference after seeing Johnson: "In my view we are making steady progress in Vietnam, not only militarily, but in other ways as well," the constitutional process and pacification; "There is every prospect, too, that the progress will accelerate."'
        n: '[[w.berman-lyndon-johnsons-war]], 115 (no source named). See [[cal.1967-11-13.vietnam]]. Names: Bunker, Johnson.'
        tags:
        - name:bunker-ellsworth
        - name:johnson-lyndon-b
        src:
          c: ad3aa9f2
          rows:
          - 'w.berman-lyndon-johnsons-war 115: all'
          - 'via x.1967-11-13.bunker-press-conference: all'
  - add:
      entry:
        id: cal.1967-11-17.vietnam-3
        when: Nov. 17
        date: '1967-11-17'
        thread: vietnam
        c: 'Westmoreland to the Joint Chiefs: the guerrillas seriously attrited, recruiting down from 7,000 a month a year ago to 3,500; "I know of no better way to prolong the war than to stop the bombing of the north"; Holloway: "By when?" Westmoreland: "In approximately two years or less the Vietnamese Armed Forces should be ready to take over an increasing share of the war," and American forces begin phasing down.'
        n: '[[w.berman-lyndon-johnsons-war]], 116–17. To check: Westmoreland''s remarks to the Joint Chiefs, Nov. 17, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 117 n.2). Check: the day; the text puts the meeting the day after *Meet the Press*, Nov. 19. Names: Westmoreland.'
        tags:
        - name:westmoreland-william
        src:
          c: af8fc60b
          rows:
          - 'w.berman-lyndon-johnsons-war 116–17: all'
          - 'via x.1967-11-17.westmoreland-remarks-to-the-joint-chiefs: all'
  - add:
      entry:
        id: cal.1967-11-19.vietnam-2
        when: Nov. 19
        date: '1967-11-19'
        thread: vietnam
        c: Rostow to Johnson, buoyed "by Westmoreland's vision of a U.S. troop withdrawal within two years as the ARVN build up."
        n: '[[w.berman-lyndon-johnsons-war]], 117. To check: Rostow to Johnson, Nov. 19, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 117 n.3). See [[cal.1967-11-17.vietnam-3]]. Names: Rostow, Johnson, Westmoreland.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:westmoreland-william
        src:
          c: 872fe447
          rows:
          - 'w.berman-lyndon-johnsons-war 117: all'
          - 'via x.1967-11-19.rostow-to-johnson: all'
  - add:
      entry:
        id: cal.1967-11-21.vietnam-order-of-battle
        when: Nov. 21
        date: '1967-11-21'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson, the issues ahead, among them "How we present order of battle statistics": MACV completing a retroactive estimate, "including previous understatement of guerilla forces"; the press "will latch on to previous underestimate and revive credibility gap talk"; Westmoreland to present the new figures in a year-end review in Saigon, "removing emphasis from statistics themselves."'
        n: '[[w.berman-lyndon-johnsons-war]], 119. To check: Rostow to Johnson, Nov. 21, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 119). See [[cal.1967-11-13.vietnam-order-of-battle]]. Names: Rostow, Johnson, Westmoreland.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:westmoreland-william
        src:
          c: cb83ef08
          rows:
          - 'w.berman-lyndon-johnsons-war 119: all'
          - 'via x.1967-11-21.rostow-to-johnson-issues-in-the-weeks-ahead: all'
  - add:
