        id: cal.1968-02.vietnam-order-of-battle-3
        when: Feb.
        date: 1968-02
        thread: vietnam-order-of-battle
        c: 'Westmoreland to Wheeler and Sharp on the enemy''s high casualties at Tet: "The enemy committed virtually every VC unit in the country regardless of combat effectiveness," with "do-or-die orders"; "a country-wide series of ''Loc Ninhs''"; guerrillas, porters and such among the dead, "but the percentage will probably be small."'
        n: '[[w.berman-lyndon-johnsons-war]], 162–63. To check: the cable, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 162–63). Check: the day. Names: Westmoreland, Wheeler, Sharp.'
        tags:
        - name:westmoreland-william
        - name:wheeler-earle
        - name:sharp-u-s-grant
        src:
          c: 27c02b32
          rows:
          - 'w.berman-lyndon-johnsons-war 162–63: all'
          - 'via x.1968-02.westmoreland-to-wheeler-and-sharp-on-casualties: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-tet-4
        when: Feb.
        date: 1968-02
        thread: vietnam-tet
        c: 'DePuy to Wheeler on the enemy''s manpower: "It seems that [the enemy] is pushing all his chips into the middle of the table. Ours are there also"; "Vietnam will never be the same again."'
        n: '[[w.berman-lyndon-johnsons-war]], 163. To check: DePuy to Wheeler, February 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 163). Check: the day. Names: DePuy, Wheeler.'
        tags:
        - name:depuy-william-e
        - name:wheeler-earle
        src:
          c: 012ccca8
          rows:
          - 'w.berman-lyndon-johnsons-war 163: all'
          - 'via x.1968-02.depuy-to-wheeler: all'
  - add:
      entry:
        id: cal.1968-02-21.vietnam-order-of-battle
        when: Feb. 21
        date: '1968-02-21'
        thread: vietnam-order-of-battle
        c: 'The CIA''s Directorate of Intelligence on the Communist units at Tet: on MACV''s estimates the enemy committed over half its regular force; were the 32,500 killed and 5,500 detained all regulars, it lost more than 65 percent of the forces committed; but guerrillas and recruited laborers and civilians "almost certainly" a larger part of the casualties.'
        n: '[[w.berman-lyndon-johnsons-war]], 164. To check: the memorandum, Feb. 21, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 164).'
        tags: []
        src:
