  - add:
      entry:
        id: cal.1967-05-16.vietnam-program-5
        when: May 16
        date: '1967-05-16'
        thread: vietnam-program-5
        c: 'McNaughton to McNamara, against more troops "unless the situation changes substantially for the worse": the United States has "enough troops to do the job we should be doing"; the enemy avoids contact at will, and "his intention is a stalemate; he can get it at whatever level we choose to deploy."'
        n: '[[w.berman-lyndon-johnsons-war]], 43. To check: McNaughton to McNamara, May 16, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 43 n.1). See [[cal.1967-03-18.vietnam]]. Names: McNaughton, McNamara.'
