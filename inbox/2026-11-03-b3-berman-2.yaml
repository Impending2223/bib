          - 'w.berman-lyndon-johnsons-war 103–4: all'
          - 'via x.1967-11-04.rostow-to-johnson-mcnamara-and-bundy-positions: all'
  - add:
      entry:
        id: cal.1967-11-09.vietnam-2
        when: Nov. 9
        date: '1967-11-09'
        thread: vietnam
        c: 'Fortas to Johnson on McNamara''s memorandum: "an invitation to slaughter," resting "almost entirely, upon an assessment of U.S. public opinion"; "a step in the process of withdrawal"; negotiation "a propaganda symbol that we should keep alive"; "Perhaps a new and fresh look, including new people—civilian as well as military—might be warranted."'
        n: '[[w.berman-lyndon-johnsons-war]], 106. To check: Fortas to Johnson, Nov. 9, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 106 n.12). See [[cal.1967-11-01.vietnam]]. Names: Fortas, Johnson, McNamara.'
        tags:
        - name:fortas-abe
        - name:johnson-lyndon-b
        - name:mcnamara-robert-s
        src:
          c: f44daec9
          rows:
          - 'w.berman-lyndon-johnsons-war 106: all'
          - 'via x.1967-11-09.fortas-to-johnson: all'
  - add:
      entry:
        id: cal.1967-11.vietnam-6
        when: Nov.
        date: 1967-11
        thread: vietnam
        also:
        - vietnam-order-of-battle
        c: 'A special Cabinet meeting on the new figures from Bunker and Westmoreland. Johnson: keep them "all off the record for now." Helms: "We can''t let the press in on this"; "The war is in no sense over. There won''t be any collapse"; "the war is going in our favor." Johnson: "our curve is better than the first hundred days of President Kennedy." Rostow: statistics "can and do confirm progress."'
        n: '[[w.berman-lyndon-johnsons-war]], 110–11. Check: the day. See [[cal.1967-11-14.vietnam-order-of-battle]]. Names: Johnson, Helms, Rostow, Bunker, Westmoreland, Kennedy.'
        tags:
        - name:johnson-lyndon-b
        - name:helms-richard
        - name:rostow-walt-w
        - name:bunker-ellsworth
        - name:westmoreland-william
        - name:kennedy-john-f
