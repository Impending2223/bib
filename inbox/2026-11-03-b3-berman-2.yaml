          rows:
          - 'w.berman-lyndon-johnsons-war 164: all'
          - 'via x.1968-02-21.cia-directorate-of-intelligence-memorandum-tet-units: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-205000
        when: Feb.
        date: 1968-02
        thread: vietnam-205000
        c: 'Rostow to Johnson, for calling the reserves: "Only you can make the political assessment of what it would cost to call up the reserves, but that would be the most impressive demonstration to Hanoi and its friends"; "we are calling up reserves to make sure no one gets the idea that we can''t handle our other world commitments."'
        n: '[[w.berman-lyndon-johnsons-war]], 166–67. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 166–67). Check: the day. See [[cal.1968-02-12.vietnam-tet]]. Names: Rostow, Johnson.'
