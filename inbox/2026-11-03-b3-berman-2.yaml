        when: Oct. 13
        date: '1967-10-13'
        thread: vietnam-order-of-battle
        c: 'Carver to Goulding, Assistant Secretary of Defense for Public Affairs: the CIA has substantive and procedural problems with MACV''s proposed briefing and cannot support it; "The whole proposed treatment of the old irregular and new guerrilla figure will be torn apart by the Saigon press corps."'
        n: '[[w.berman-lyndon-johnsons-war]], 86–87. To check: Carver to Goulding, Oct. 13, 1967, CBS–Westmoreland Joint Exhibit 266 (cited by [[w.berman-lyndon-johnsons-war]], 87 n.16). See [[cal.1967-10-11.vietnam-order-of-battle]]. Names: Carver, Goulding.'
        tags:
        - name:carver-george-a-jr
        - name:goulding-phil-g
        src:
          c: 06611823
          rows:
          - 'w.berman-lyndon-johnsons-war 86–87: all'
          - 'via x.1967-10-13.carver-to-goulding-je-266: all'
  - add:
      entry:
        id: cal.1967-10-14.vietnam-order-of-battle
        when: Oct. 14
        date: '1967-10-14'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson, on MACV''s latest estimates: the Viet Cong and North Vietnamese regulars at a peak of 127,000 in September 1966, 118,000 now; the guerrillas down by more; incidents averaging 2,845 a month in November 1965-January 1966, 1,769 in June-August 1967; "a war which has reached a peak and is beginning to decelerate slowly."'
        n: '[[w.berman-lyndon-johnsons-war]], 87. To check: Rostow to Johnson, Oct. 14, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 87 n.17); Rostow, "Vietnam Data and Progress Indicators," Oct. 13, 1967 (cited by [[w.berman-lyndon-johnsons-war]], 86 n.15). Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 72d22434
          rows:
          - 'w.berman-lyndon-johnsons-war 87: all'
          - 'via x.1967-10-14.rostow-to-johnson: all'
  - add:
      entry:
        id: cal.1967-10-14.vietnam
        when: Oct. 14
        date: '1967-10-14'
        thread: vietnam
        also:
        - vietnam-support
        c: 'Fortas to Johnson, in a long handwritten note, "Vietnam": "we must get off the defensive in the propaganda battle"; "We can''t sustain a shooting war on a non-emotional basis"; the reasons to shift from helping South Vietnam to combating "conquest by infiltration and subversion"; "This country has never left the field of battle in abject surrender of cause for which it fought."'
        n: '[[w.berman-lyndon-johnsons-war]], 87–88. To check: Fortas to Johnson, Oct. 14, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 88 n.18). Names: Fortas, Johnson.'
        tags:
        - name:fortas-abe
        - name:johnson-lyndon-b
        src:
          c: aaa63427
          rows:
          - 'w.berman-lyndon-johnsons-war 87–88: all'
          - 'via x.1967-10-14.fortas-to-johnson-vietnam: all'
  - add:
      entry:
        id: cal.1967-11-02.vietnam-3
        when: Nov. 2
        date: '1967-11-02'
        thread: vietnam
        c: 'Rostow to Johnson, 8:15 a.m.: a summary of the senior advisers'' discussion the night before, Wheeler''s and Carver''s briefings, and suggestions for the morning''s meeting, the questions to be put to each. Tom Johnson to keep a tally on each man and each question.'
        n: '[FRUS 1964–68, V, doc. 376](https://history.state.gov/historicaldocuments/frus1964-68v05/d376). [[w.berman-lyndon-johnsons-war]], 98 (the "thinking agenda"; the tally sheet). See [[cal.1967-11-02.vietnam]]. Names: Rostow, Johnson, Wheeler, Carver, Tom Johnson.'
