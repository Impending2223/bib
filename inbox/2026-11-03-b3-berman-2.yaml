        c: 'Johnson with White House correspondents, 4:30 to 6:02 p.m., on Khe Sanh: "I asked the JCS to give me a letter saying that they were ready for the offensive at Khesanh." When reporters write that he had the Chiefs'' letters, he denies it.'
        n: '[FRUS 1964–68, VI, doc. 47](https://history.state.gov/historicaldocuments/frus1964-68v06/d47). [[w.berman-lyndon-johnsons-war]], 142. See [[cal.1968-01-29.vietnam-khe-sanh]]. Names: Johnson.'
