  - cite:
      id: cal.1966-10-20.vietnam-asian-trip
      item: '[[w.berman-lyndon-johnsons-war]], 17 (the demonstrations at Melbourne and Sydney)'
      units: A
  - primary:
      id: cal.1966-10-23.vietnam-asian-trip
      text: Notes of meeting, 9:15–10:15 p.m., [FRUS 1964–68, IV, doc. 280](https://history.state.gov/historicaldocuments/frus1964-68v04/d280) (Rostow's).
      units: B-C
  - cite:
      id: cal.1966-10-23.vietnam-asian-trip
      item: '[[w.berman-lyndon-johnsons-war]], 17–19 (the arrival; the meeting by its notes: Kỳ, the Viet Cong "will very soon collapse"; Westmoreland, "By every index, things were improving," the allies to add 35 percent to their forces, about 22,000 more South Vietnamese by the end of 1967, "light at the end of the tunnel," no unilateral end to the bombing; Johnson: "Don''t let the newspapermen divide us")'
      units: B-C
  - src:
