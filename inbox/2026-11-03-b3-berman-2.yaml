        when: Aug. 25
        date: '1967-08-25'
        thread: vietnam-order-of-battle
        c: 'Westmoreland to Wheeler and Sharp: the latest draft of SNIE 14.3-67 puts the enemy at 461,000, with the self-defense, secret self-defense and assault youth; "This command cannot support these latest NIE figures with the intelligence at hand." He asks a team of the Washington agencies to come to Vietnam "as soon as possible to develop a common and valid set of enemy strength statistics."'
        n: '[[w.berman-lyndon-johnsons-war]], 75. To check: Westmoreland to Wheeler and Sharp, Aug. 25, 1967, Joint Exhibit 255; Westmoreland to Wheeler, Aug. 26, 1967 (both cited by [[w.berman-lyndon-johnsons-war]], 75 n.15). See [[cal.1967-06.vietnam-order-of-battle]]. Names: Westmoreland, Wheeler, Sharp.'
