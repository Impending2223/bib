      item: '[[w.berman-lyndon-johnsons-war]], 119–20 (at the Pentagon: 242,000, about 55,000 under the 297,000 used before; "what I have on this strength is armed strength"; the new figures not to be compared with the old; the *Times*, Nov. 23: "Sure of Victory")'
      units: A
  - src:
