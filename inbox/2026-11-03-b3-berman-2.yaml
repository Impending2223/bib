  - cite:
      id: cal.1965-11-14.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 12 (the 1st Cavalry Division against North Vietnamese regiments; about 1,200 of the enemy killed and 200 Americans, the whole battle)'
      units: A
  - cite:
      id: cal.1965-12-18.vietnam-pause
      item: '[[w.berman-lyndon-johnsons-war]], 12 (Johnson: "Then, no matter what we do in the military field there is no sure victory?" McNamara: "That''s right. We have been too optimistic.")'
      units: F
  - cite:
      id: cal.1965-12-24.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 12 (the pause, 37 days, pressed by McNamara)'
      units: C
  - cite:
      id: cal.1966-10-14.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 13–16 (the memorandum: "no reasonable way to bring the war to an end soon"; 470,000; the barrier, 10,000 to 20,000 men, $1 billion; the sorties; pacification "thoroughly stalled"; Wheeler''s reply)'
      units: A, E-G, I
  - src:
      id: cal.1966-10-14.vietnam
