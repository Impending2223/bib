        id: cal.1967-06-10.vietnam-order-of-battle
        when: June 10
        date: '1967-06-10'
        thread: vietnam-order-of-battle
        c: 'Sharp to Westmoreland, on the revised estimates of the Viet Cong''s irregular forces in the draft SNIE: "Continued close coordination would be essential in order to avoid public disclosure of this sensitive and potentially explosive subject."'
        n: '[[w.berman-lyndon-johnsons-war]], 50. To check: Sharp to Westmoreland, June 10, 1967, CBS–Westmoreland Joint Exhibit 242 (cited by [[w.berman-lyndon-johnsons-war]], 50 n.6). See [[cal.1967-01-19.vietnam-order-of-battle]]. Names: Sharp, Westmoreland.'
