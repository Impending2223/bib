        when: Feb. 11
        date: '1968-02-11'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson with MACV''s order of battle for December-January: "no significant change" in the confirmed strength of the main and local forces; the changes in combat and administrative support "of a bookkeeping character which do not really reflect changes in the enemy''s combat potential."'
        n: '[[w.berman-lyndon-johnsons-war]], 163. To check: Rostow to Johnson, Feb. 11, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 163). Names: Rostow, Johnson.'
