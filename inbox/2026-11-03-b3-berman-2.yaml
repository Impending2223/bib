        c: Enthoven to McNamara, "Force levels and enemy attention."
        n: '[[w.berman-lyndon-johnsons-war]], 36–37. Check: what it says; Berman quotes it with the memorandum of May 1 without telling the two apart (209 n.11). See [[cal.1967-05-01.vietnam-program-5-2]]. Names: Enthoven, McNamara.'
