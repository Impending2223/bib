        date: 1967-08
        thread: vietnam-air-war
        c: 'Acheson to Anthony Eden: "Bob McNamara told me all about the situation a week ago. This report [to Congress] is the truth, but not the whole truth. Rather, a loyal lieutenant putting the best face on a poor situation"; "We have now run out of targets"; "LBJ has not HST''s courage to say no to political pressures."'
        n: '[[w.berman-lyndon-johnsons-war]], 72–73. To check: [[w.isaacson-wise-men]], 683 (cited by [[w.berman-lyndon-johnsons-war]], 73 n.11). Check: the day. See [[cal.1967-08-25.vietnam-air-war]]. Names: Acheson, Eden, McNamara, Johnson, Truman.'
