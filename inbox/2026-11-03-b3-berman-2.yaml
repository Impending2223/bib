        c: 'Westmoreland to McConnell and Sharp: "The Washington representatives agree with MACV that the NIE should not quantify the categories of self defense, secret self defense and other similar VC organizations"; "I am satisfied that this is a good estimate and the best that can be derived from available intelligence."'
        n: '[[w.berman-lyndon-johnsons-war]], 82. To check: Westmoreland to McConnell and Sharp, Sept. 14, 1967, Exhibit 1508A (cited by [[w.berman-lyndon-johnsons-war]], 82 n.8). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Westmoreland, McConnell, Sharp.'
