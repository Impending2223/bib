      units: A
  - cite:
      id: cal.1967-11-16.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 117–18 ("Nobody really believes that the war can be won with bombs in the North"; Hanoi uses time as the Russians used terrain against Napoleon; "Can the tortoise of progress in Vietnam stay ahead of the hare of dissent at home?")'
      units: A
