          rows:
          - 'w.berman-lyndon-johnsons-war 169–70: all'
          - 'via x.1968-02-23.taylor-to-johnson-questions-for-wheeler: all'
  - add:
      entry:
        id: cal.1968-02-24.vietnam-205000
        when: Feb. 24
        date: '1968-02-24'
        thread: vietnam-205000
        c: 'Rostow to Johnson: the enemy will go "with all their capital soon" and try "to lock us into a negotiation at their peak position"; with Taylor he agrees "with Napoleon that Providence is on the other side with the last reserves"; move the ready forces to Westmoreland and call the reserves; "We face the decisive battle of the war."'
        n: '[[w.berman-lyndon-johnsons-war]], 170. To check: Rostow to Johnson, Feb. 24, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 170). Names: Rostow, Johnson, Taylor, Westmoreland.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:taylor-maxwell
        - name:westmoreland-william
        src:
          c: f3a48985
          rows:
          - 'w.berman-lyndon-johnsons-war 170: all'
          - 'via x.1968-02-24.rostow-to-johnson: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-tet-5
        when: Feb.
        date: 1968-02
        thread: vietnam-tet
        also:
        - elections-1968
        c: 'Rostow to Johnson, on Tet and the polls: the assumption "that peace requires only that the right button can be found"; the serious opposition "will not call for a pull-out" but "promise to do it better"; answer plainly "that there can be no peace because the enemy still wants war."'
        n: '[[w.berman-lyndon-johnsons-war]], 159. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 159). Check: the day. Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 7192566d
          rows:
          - 'w.berman-lyndon-johnsons-war 159: all'
          - 'via x.1968-02.rostow-to-johnson-tet-and-the-polls: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-tet-6
        when: Feb.
        date: 1968-02
        thread: vietnam-tet
        c: 'Johnson to his advisers: "it looks as if all of you have counseled, advised, consulted and then—as usual—placed the monkey on my back again"; lay out what to do "in the minimum time to meet a crisis request from Vietnam"; tell the allies "we could lose Southeast Asia without their help."'
        n: '[[w.berman-lyndon-johnsons-war]], 159–60 (no source named). Check: the day. Names: Johnson.'
        tags:
        - name:johnson-lyndon-b
        src:
          c: 2872cb15
          rows:
          - 'w.berman-lyndon-johnsons-war 159–60: all'
  - add:
      entry:
        id: cal.1968-02-27.vietnam-205000
        when: Feb. 27
        date: '1968-02-27'
        thread: vietnam-205000
        c: 'Johnson''s advisers, he at the ranch, on the still-secret request for 206,000, by McPherson''s notes. Clifford: say we will put in 500,000 to a million men. McNamara: "I do not understand what the strategy is to putting in 205,000 men." Bundy: contingency plans to "withdraw with best possible face." Clifford: "How do we avoid creating feeling that we are pounding troops down rathole?" McNamara''s grave doubts.'
        n: '[[w.berman-lyndon-johnsons-war]], 172–74. To check: McPherson''s notes of the meeting, Feb. 27, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 172–74). See [[cal.1968-02-27.vietnam]]. Names: Johnson, McPherson, Clifford, McNamara, William Bundy, Rusk, Rostow, Katzenbach, Habib.'
        tags:
        - name:johnson-lyndon-b
        - name:mcpherson-harry
        - name:clifford-clark
        - name:mcnamara-robert-s
        - name:bundy-william
        - name:rusk-dean
        - name:rostow-walt-w
        - name:katzenbach-nicholas
        - name:habib-philip-c
        src:
          c: 3329c685
          rows:
          - 'w.berman-lyndon-johnsons-war 172–74: all'
          - 'via x.1968-02-27.mcpherson-notes-of-the-advisers-meeting: all'
  - add:
      entry:
        id: cal.1968-02-28.vietnam
        when: Feb. 28
        date: '1968-02-28'
        thread: vietnam
        c: 'The Cabinet, Johnson back from the ranch: "The big problem is the impression we make with the public"; careful with statements like Westmoreland''s "light at the end of the tunnel"; "we, the President and the Cabinet, are called murderers and they never say anything about Mr. Ho"; "like the country lawyer who made the greatest speech of his life but they electrocuted the client."'
        n: '[[w.berman-lyndon-johnsons-war]], 174. To check: notes of the Cabinet meeting, Feb. 28, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 174). Names: Johnson, Westmoreland, Hồ Chí Minh.'
        tags:
        - name:johnson-lyndon-b
        - name:westmoreland-william
        - name:ho-chi-minh
        src:
          c: 2d7545e4
          rows:
          - 'w.berman-lyndon-johnsons-war 174: all'
          - 'via x.1968-02-28.notes-of-the-cabinet-meeting: all'
  - cite:
      id: cal.1968-01-23.vietnam-congress
      item: '[[w.berman-lyndon-johnsons-war]], 141 ("a great similarity between what is happening at Khe Sanh and what happened at Dien Bien Phu"; the sand table in the Situation Room)'
  - cite:
      id: cal.1968-01-29.vietnam-khe-sanh
      item: '[[w.berman-lyndon-johnsons-war]], 141 (each to give "his views concerning the validity of the strategy"; the Chiefs agreed "that everything which had been asked for had been granted")'
  - cite:
      id: cal.1968-01-30.vietnam-congress
      item: '[[w.berman-lyndon-johnsons-war]], 139, 143 (Byrd: "Are we prepared for this attack?"; Johnson: "I have it in writing that they are prepared"; Wheeler: 39,968 friendly against 38,590 enemy, "40 B-52 sorties and 500 tactical air sorties" a day; "This is ''68")'
  - cite:
      id: cal.1968-01-31.vietnam-tet-2
      item: '[[w.berman-lyndon-johnsons-war]], 147–48 (the Chiefs "I almost had to have them sign up in blood"; Wheeler on the attackers in civilian and police clothes; Berman has it in the evening)'
  - cite:
      id: cal.1968-02-01.vietnam-khe-sanh
      item: '[[w.berman-lyndon-johnsons-war]], 149 (Wheeler: "whether tactical nuclear weapons should be used"; Westmoreland: "should not be required in the present situation," but nuclear weapons or chemical agents "active candidates" if it changed)'
  - cite:
      id: cal.1968-02-16.transition-and-staff
      item: '[[w.berman-lyndon-johnsons-war]], 149 (Johnson denies nuclear weapons considered: "against the national interest to carry on discussions about the employment of nuclear weapons with respect to Khesanh")'
  - cite:
      id: cal.1968-02-02.vietnam-tet
      item: '[[w.berman-lyndon-johnsons-war]], 147 ("a few bandits can do that in any city")'
  - cite:
      id: cal.1968-02-06.vietnam-tet
      item: '[[w.berman-lyndon-johnsons-war]], 152–54 (Byrd''s four points; Johnson: "I don''t agree with any of that"; Long: "you would have been impeached"; "Anybody can kick a barn down")'
  - cite:
      id: cal.1968-02-06.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 154–56 (dated Feb. 5: the circles to three miles around Hanoi and a mile and a half around Haiphong; Rusk against, McNamara: "the price is high and the gain is low," Wheeler: "I am fed up to the teeth," Clifford for; McNamara: not "a ''last-gasp'' action")'
  - cite:
      id: cal.1968-02-07.vietnam-khe-sanh
      item: '[[w.berman-lyndon-johnsons-war]], 156–59 ("Go in and get those MIGs at Phuc Yen"; the allies unable to send more; 6,400 military beds; Wheeler: "this is not a situation to take lightly")'
  - cite:
      id: cal.1968-02-08.vietnam-tet
      item: '[[w.berman-lyndon-johnsons-war]], 146–47 (Hanoi could hope for "political and psychological gains of such dimensions" as to negotiate "with a greatly strengthened hand")'
  - cite:
      id: cal.1968-02-09.vietnam-tet
      item: '[[w.berman-lyndon-johnsons-war]], 160–62 (dated Feb. 8: ARVN about 360,000; a declaration of war, Rusk against; Clifford: "a very strong contradiction in what we are saying and doing"; Wheeler: the North''s battalions from 78 to 105 since December)'
  - cite:
      id: cal.1968-02-10.vietnam-tet-2
      item: '[[w.berman-lyndon-johnsons-war]], 162 (Rusk: where the 15,000 came from; Clifford: "There may be a feint and a surprise coming up for us")'
  - cite:
      id: cal.1968-02-12.vietnam-tet
      item: '[[w.berman-lyndon-johnsons-war]], 164–66 ("a new ball game"; "I need these 525,000 troops now"; six battalions, 10,500; Wheeler: Westmoreland "does not know how sacrosanct" the 525,000; the Chiefs against, Johnson for sending them)'
  - cite:
      id: cal.1968-02.vietnam-tet-3
      item: '[[w.berman-lyndon-johnsons-war]], 151 (Aiken; Buchwald''s Custer)'
  - cite:
      id: cal.1968-02-27.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 170–72 ("how narrow the margin was between victory and defeat"; 206,000 in three parts, 108,000 by May 1, 42,000 by Sept. 1, 55,000 by Dec. 31; "1968 will be the pivotal year")'
  - cite:
      id: cal.1968-02-27.press-and-broadcasting
      item: '[[w.berman-lyndon-johnsons-war]], 175 ("mired in stalemate"; Johnson: "Cronkite was it")'
