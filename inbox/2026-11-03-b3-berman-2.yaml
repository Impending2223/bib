      entry:
        id: cal.1967-10-11.vietnam-order-of-battle
        when: Oct. 11
        date: '1967-10-11'
        thread: vietnam-order-of-battle
        c: 'Paul Walsh, the CIA''s acting deputy director for economic research, to Carver, on MACV''s proposed press briefing on the new order of battle: "one of the greatest snow jobs since Potemkin constructed his village"; its judgments cannot be substantiated and will bring "even graver credibility problems"; the militia and self-defense forces consigned "into the realm of fellow-travelers and sympathizers."'
        n: '[[w.berman-lyndon-johnsons-war]], 86. To check: Walsh to Carver, Oct. 11, 1967, CBS–Westmoreland Joint Exhibit 265A (cited by [[w.berman-lyndon-johnsons-war]], 86 n.15). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Walsh, Carver.'
        tags:
        - name:walsh-paul-v
        - name:carver-george-a-jr
        src:
