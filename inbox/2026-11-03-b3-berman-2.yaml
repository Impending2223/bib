          rows:
          - 'w.berman-lyndon-johnsons-war 166–67: all'
          - 'via x.1968-02.rostow-to-johnson-on-the-reserves: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-205000-2
        when: Feb.
        date: 1968-02
        thread: vietnam-205000
        also:
        - republican-party
        c: 'Eisenhower, by a message to Johnson, for calling the reserves: 10,500 more suggests "we cannot hit the enemy when he concentrates, for example, around Khe Sanh"; "Has Westmoreland really been given the forces he is asking for," and enough for "a ''corps of maneuver''"; a small force "sounds as though we have been on a shoestring."'
        n: '[[w.berman-lyndon-johnsons-war]], 167. To check: the message, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 167). Check: the day. See [[cal.1968-02-12.vietnam-tet]]. Names: Eisenhower, Johnson, Westmoreland.'
