      item: '[[w.berman-lyndon-johnsons-war]], 9–10 (the party; Thiệu and Kỳ at the head of a delegation of 28; Westmoreland to go from 184,000 to 429,000 by the year''s end, the "coonskin" nailed "to the wall" by December; "one aces")'
      units: C
