          - 'via x.1968-02-11.rostow-to-johnson-order-of-battle: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-order-of-battle
        when: Feb.
        date: 1968-02
        thread: vietnam-order-of-battle
        c: 'Sam Adams to Carver, asking a transfer from SAVA: "I feel we (the CIA in general and SAVA in particular) have basically misinformed policy-makers of the strength of the enemy"; MACV''s order of battle "a monument of deceit"; "We have occasionally protested, but neither long enough, nor loud enough."'
        n: '[[w.berman-lyndon-johnsons-war]], 163–64. To check: Adams to Carver, February 1968, CBS–Westmoreland trial document (cited by [[w.berman-lyndon-johnsons-war]], 164 n.7). Check: the day. Names: Adams, Carver.'
        tags:
        - name:adams-samuel-a
        - name:carver-george-a-jr
        src:
          c: 4b4eeeb2
          rows:
          - 'w.berman-lyndon-johnsons-war 163–64: all'
          - 'via x.1968-02.adams-to-carver: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-order-of-battle-2
        when: Feb.
        date: 1968-02
        thread: vietnam-order-of-battle
        c: 'Carver, sharing Adams''s view, recommends reopening the order-of-battle debate: the exclusions an error, many of the forces at Tet suspected drawn from the secret self-defense, the assault youth and other elements written out of the count.'
        n: '[[w.berman-lyndon-johnsons-war]], 164. Check: the day and the paper. See [[cal.1968-02.vietnam-order-of-battle]]. Names: Carver, Adams.'
        tags:
        - name:carver-george-a-jr
        - name:adams-samuel-a
        src:
          c: dfce283c
          rows:
          - 'w.berman-lyndon-johnsons-war 164: all'
  - add:
