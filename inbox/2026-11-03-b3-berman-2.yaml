        n: 'FRUS 1964–68, III, docs. [189](https://history.state.gov/historicaldocuments/frus1964-68v03/d189) (McNamara''s draft of Nov. 3), [198](https://history.state.gov/historicaldocuments/frus1964-68v03/d198) (editorial note). [[w.drea-mcnamara-clifford-and-the-2011]], 119 (McNamara in Saigon, Nov. 28–29); [[w.staaveren-u-s-air-force]], 97 (McNamara in Saigon, Nov. 28–29); [[w.gibbons-u-s-government-and]], IV, 105–107; [[w.herring-lbj-and-vietnam]], 67 (McNamara to the officials in Saigon in November: "show me one area in this country ... that we have pacified"; not Wheeler); [[w.westmoreland-soldier-reports]], 154 (McNamara from Europe to Saigon near the end of November; the build-up, nine North Vietnamese regiments possible). [[w.macv-command-history-1965]], 44–45 (Westmoreland''s briefing: a further division for the coastal plain of II Corps, another near Saigon, a brigade for An Khê). To check: SECDEF Briefing, COMUSMACV, Nov. 28, 1965 (cited by [[w.macv-command-history-1965]], 45 n.98); [[w.pentagon-papers]]; [[w.mcnamara-in-retrospect]]; Westmoreland, history notes, Nov. 28–29, 1965, CMH; COMUSMACV briefing for the Secretary of Defense, Nov. 28, 1965, SecDef Subject Decimal files, Acc 70A-1265 (cited by [[w.drea-mcnamara-clifford-and-the-2011]], 119 n.22); MACJ03, Memorandum for the Record, "Summary of Major Points Covered During 28-29 November 1965 Meetings with Secretary of Defense," Dec. 1, 1965, COMUSMACV records (microfilm), U.S. Army Military History Institute (cited by [[w.gibbons-u-s-government-and]], IV, 107 n.92). See [[cal.1965-07-28.vietnam]]; [[cal.1965-11-14.vietnam]]. Names: McNamara, Wheeler.'
