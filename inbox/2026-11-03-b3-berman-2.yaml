        date: '1968-03-01'
        thread: vietnam-205000
        also:
        - vietnam-air-war
        c: 'Ginsburgh to Rostow: "Mining is the best way of satisfying that part of the US public opposed to sending more of our boys to South Vietnam, without increasing pressure on North Vietnam."'
        n: '[[w.berman-lyndon-johnsons-war]], 182. To check: Ginsburgh to Rostow, Mar. 1, 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 182). Names: Ginsburgh, Rostow.'
