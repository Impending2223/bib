        c: 'The Joint Chiefs, by Wheeler''s summary: a team to MACV "to arrive at acceptable force figures and to coordinate the plan for release of information to the public"; "The JCS fully appreciate the public release problem and view it as the major problem. While concerned about the figures, they consider them of lesser importance."'
        n: '[[w.berman-lyndon-johnsons-war]], 75. To check: Wheeler, "Summary of meeting of Joint Chiefs of Staff," Aug. 25, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 75 n.16). See [[cal.1967-06.vietnam-order-of-battle]]. Names: Wheeler.'
