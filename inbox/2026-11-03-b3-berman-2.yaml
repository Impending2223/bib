  - add:
      entry:
        id: cal.1967-11-02.vietnam-4
        when: Nov. 2
        date: '1967-11-02'
        thread: vietnam
        c: 'Bunker''s twenty-seventh weekly telegram to Johnson, Saigon 10206, after the inauguration: "the rebirth of a nation"; a functioning constitutional government being established, "a new feeling of confidence and pride" among the Vietnamese.'
        n: '[FRUS 1964–68, V, doc. 379](https://history.state.gov/historicaldocuments/frus1964-68v05/d379). [[w.berman-lyndon-johnsons-war]], 105. Names: Bunker, Johnson.'
