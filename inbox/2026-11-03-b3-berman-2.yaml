        date: '1967-08-18'
        thread: vietnam-order-of-battle
        c: 'Ginsburgh to Rostow, two memoranda: "Increased estimates on Communist strengths in SVN to be published soon"; and "Recommend that you make the following points with Mr. Helms: Now is the time to ''bite the bullet.'' The intelligence community should not attempt to sneak up on the new estimate by adding periodic increments into current figures."'
        n: '[[w.berman-lyndon-johnsons-war]], 74, 210 n.12. To check: Ginsburgh to Rostow, Aug. 18 (two) and Aug. 23, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 74 n.12). See [[cal.1967-06.vietnam-order-of-battle]]. Names: Ginsburgh, Rostow, Helms.'
