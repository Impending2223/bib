patch: b3-berman-2
by: batch-3 reader, westy group (Berman, Lyndon Johnson's War)
ops:
  - add:
      entry:
        id: cal.1966-02-01.vietnam
        when: Feb. 1
        date: '1966-02-01'
        thread: vietnam
        c: 'Lodge''s weekly telegram to Johnson, Saigon 2761: the bombing''s resumption "renewed confidence in Vietnam." Pitt in the Commons, 1805, on the war with France: "We have gained everything that we would have lost if we had not fought this war"; "even truer of our war in Vietnam."'
        n: '[FRUS 1964–68, IV, doc. 60](https://history.state.gov/historicaldocuments/frus1964-68v04/d60). [[w.berman-lyndon-johnsons-war]], 3 (Pitt). Names: Lodge, Johnson.'
        tags:
        - name:lodge-henry-cabot
        - name:johnson-lyndon-b
        src:
          c: 90a621cd
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d60: all'
          - 'w.berman-lyndon-johnsons-war 3: B-C'
          - 'via x.1966-02-01.lodge-weekly-telegram-saigon-2761: B-C'
  - add:
      entry:
        id: cal.1966-11-21.vietnam-order-of-battle
        when: Nov. 21
        date: '1966-11-21'
        thread: vietnam-order-of-battle
        c: 'Ginsburgh, the NSC staff''s liaison with the Joint Chiefs, to Rostow: by the latest figures the communists "ought to be in really serious trouble"; in September he had put the war''s end between June 1969 and 1972; if the trends hold, "I do not see how they can possibly hold out beyond the summer of 1969."'
        n: '[[w.berman-lyndon-johnsons-war]], 20–21. To check: Ginsburgh to Rostow, Nov. 21, 1966, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 20–21). Names: Ginsburgh, Rostow.'
        tags:
        - name:ginsburgh-robert-n
        - name:rostow-walt-w
        src:
          c: 4ebcfce4
          rows:
          - 'w.berman-lyndon-johnsons-war 20–21: all'
          - 'via x.1966-11-21.ginsburgh-to-rostow: all'
  - add:
      entry:
        id: cal.1966-11-22.vietnam-order-of-battle
        when: Nov. 22
        date: '1966-11-22'
        thread: vietnam-order-of-battle
        c: 'Carver, the CIA Director''s special assistant for Vietnamese affairs, to Komer, after Adams''s count from captured documents: a reappraisal under way indicates that MACV''s estimates of the Viet Cong''s irregular forces "may have drastically underestimated their growth, possibly by as much as 200,000 persons."'
        n: '[[w.berman-lyndon-johnsons-war]], 20. To check: Carver to Komer, Nov. 22, 1966, CBS–Westmoreland Joint Exhibit 221 (cited by [[w.berman-lyndon-johnsons-war]], 20 n.12). Names: Carver, Komer, Adams.'
        tags:
        - name:carver-george-a-jr
        - name:komer-robert-w
        - name:adams-samuel-a
        src:
          c: 4bab2730
          rows:
          - 'w.berman-lyndon-johnsons-war 20: all'
          - 'via x.1966-11-22.carver-to-komer: all'
  - add:
      entry:
        id: cal.1967-01-02.vietnam
        when: Jan. 2
        date: '1967-01-02'
        thread: vietnam
        also:
        - vietnam-order-of-battle
        c: 'Westmoreland''s year-end assessment of the enemy situation and strategy, to Sharp and Wheeler, MACJ00 00160: the enemy''s strength up some 42,000 in 1966, a "proportional counter-buildup" to the growth of the American and allied forces; its sources conscription in the South and infiltration through the DMZ, "but principally through Laos and the Cambodian extension"; infiltration about 8,400 men a month, recruiting about 3,500. The enemy''s strength 300,575.'
        n: '[FRUS 1964–68, V, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v05/d2). [[w.berman-lyndon-johnsons-war]], 22. Names: Westmoreland, Sharp, Wheeler.'
        tags:
        - name:westmoreland-william
        - name:sharp-u-s-grant
        - name:wheeler-earle
        src:
          c: 80afcef0
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d2: A-C'
          - 'w.berman-lyndon-johnsons-war 22: all'
          - 'via x.1967-01-02.westmoreland-year-end-assessment-macj00-00160: all'
  - add:
      entry:
        id: cal.1967-01-03.vietnam-order-of-battle
        when: Jan. 3
        date: '1967-01-03'
        thread: vietnam-order-of-battle
        c: 'Rostow to Johnson: "I do not for one minute believe the infiltration rate is 8400 per month"; a MACV "balancing figure" for "an inflated order of battle," MACV "excessively conservative" as insurance and against pressure to put more forces into pacification.'
        n: '[[w.berman-lyndon-johnsons-war]], 22. To check: Rostow to Johnson, Jan. 3, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 22). See [[cal.1967-01-02.vietnam]]. Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: cc150804
          rows:
          - 'w.berman-lyndon-johnsons-war 22: all'
          - 'via x.1967-01-03.rostow-to-johnson-infiltration-rate: all'
  - add:
      entry:
        id: cal.1967-01-03.vietnam-2
        when: Jan. 3
        date: '1967-01-03'
        thread: vietnam
        c: 'Sharp to Westmoreland and Wheeler on MACV''s operational concept for 1967: adequate to the threat, but not "too great a measure of our effort to anti-infiltration"; a barrier "virtually impossible" with the ground forces at hand or planned; air and naval interdiction to go on and, if possible, grow. "We must be prepared to accept heavier casualties in our initial operations."'
        n: '[[w.berman-lyndon-johnsons-war]], 22–23. To check: Sharp to Westmoreland and Wheeler, "Operational concept for Vietnam," Jan. 3, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 23 n.14). See [[cal.1967-01-02.vietnam]]. Names: Sharp, Westmoreland, Wheeler.'
        tags:
        - name:sharp-u-s-grant
        - name:westmoreland-william
        - name:wheeler-earle
        src:
          c: 288005f1
          rows:
          - 'w.berman-lyndon-johnsons-war 22–23: all'
          - 'via x.1967-01-03.sharp-to-westmoreland-and-wheeler-operational-concept: all'
  - add:
      entry:
        id: cal.1967-01.vietnam-air-war
        when: Jan., early
        date: 1967-01
        thread: vietnam-air-war
        c: Johnson asks Rostow to explore a secret committee on the effects of the bombing of the North. Rostow takes it to Clifford.
        n: '[FRUS 1964–68, V, doc. 22](https://history.state.gov/historicaldocuments/frus1964-68v05/d22). [[w.berman-lyndon-johnsons-war]], 24. Check: the day. Names: Johnson, Rostow, Clifford.'
        tags:
        - name:johnson-lyndon-b
        - name:rostow-walt-w
        - name:clifford-clark
        src:
          c: 93b56cef
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d22: all'
          - 'w.berman-lyndon-johnsons-war 24: all'
          - 'via x.1967-01-19.rostow-to-johnson-bombing-committee: all'
  - add:
      entry:
        id: cal.1967-01-19.vietnam-air-war
        when: Jan. 19
        date: '1967-01-19'
        thread: vietnam-air-war
        c: 'Rostow to Johnson, 2 p.m., on his talk the evening before with Clifford about a committee on the bombing. Clifford: "There is no substitute, in a matter of this kind, for the President''s personal, lonely judgment"; to ask outside advice would show "that the President was uncertain"; if anything, a very small group, three men, no report. Rostow agrees: a committee "would be unsettling and possibly explosive, if made public," as though Johnson lacked confidence in the Joint Chiefs'' and McNamara''s advice.'
        n: '[FRUS 1964–68, V, doc. 22](https://history.state.gov/historicaldocuments/frus1964-68v05/d22). [[w.berman-lyndon-johnsons-war]], 24–25 (Clifford''s words; Rostow''s). Check: Berman (24) has Clifford write to Rostow; the memorandum reports a talk. See [[cal.1967-01.vietnam-air-war]]. Names: Rostow, Johnson, Clifford, McNamara.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:mcnamara-robert-s
        - name:clifford-clark
        src:
          c: acedf7b0
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d22: all'
          - 'w.berman-lyndon-johnsons-war 24–25: B-C, E'
          - 'via x.1967-01-19.rostow-to-johnson-bombing-committee: all'
          - 'via x.1967-01-18.clifford-to-rostow-on-a-bombing-committee: B-D'
  - cite:
