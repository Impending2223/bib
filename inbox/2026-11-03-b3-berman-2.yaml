        date: '1968-03-31'
        thread: vietnam-205000
        also:
        - elections-1968
        c: 'Johnson to McPherson by telephone, before the address: "Do you think it is a good speech?"; "Do you think Hanoi will talk?"; "I''m going to have a little ending of my own to add to yours." McPherson: "I''m very sorry." Johnson: "so long, pardner."'
        n: '[[w.berman-lyndon-johnsons-war]], 200. To check: [[w.oberdorfer-tet]], 317 (cited by [[w.berman-lyndon-johnsons-war]], 200 n.18). See [[cal.1968-03-31.elections-1968]]. Names: Johnson, McPherson.'
