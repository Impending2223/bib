        date: '1967-08-20'
        thread: vietnam-order-of-battle
        c: 'Abrams to Wheeler, Sharp and Westmoreland, against surfacing an estimate with the self-defense and secret self-defense forces: "We have been projecting an image of success over the recent months"; released, a figure of 426,000–531,000 would be read as an increase of 120,000–130,000, and "All available caveats and explanations will not prevent the press from drawing an erroneous and gloomy conclusion."'
        n: '[[w.berman-lyndon-johnsons-war]], 74. To check: Abrams to Wheeler, Sharp and Westmoreland, Aug. 20, 1967, CBS–Westmoreland Joint Exhibit 252 (cited by [[w.berman-lyndon-johnsons-war]], 74 n.13). See [[cal.1967-06.vietnam-order-of-battle]]. Names: Abrams, Wheeler, Sharp, Westmoreland.'
