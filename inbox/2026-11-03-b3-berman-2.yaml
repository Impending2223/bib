        when: Feb. 8
        date: '1968-02-08'
        thread: vietnam
        c: 'Johnson sends Rusk, McNamara, Clifford and the Joint Chiefs John Stuart Mill: "War is an ugly thing, but not the ugliest"; a man who cares for nothing more than his personal safety "is a miserable creature who has no chance of being free."'
        n: '[[w.berman-lyndon-johnsons-war]], 139 (the chapter''s epigraph). Names: Johnson, Rusk, McNamara, Clifford.'
