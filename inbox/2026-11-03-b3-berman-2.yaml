        when: Sept. 15
        date: '1967-09-15'
        thread: vietnam-order-of-battle
        c: 'Carver to Helms: the irregulars, self-defense, secret self-defense and assault youth, not to be quantified but treated in narrative in the estimate and in MACV''s order of battle; Washington and Saigon on one wavelength, "something that will greatly benefit all aspects of our common endeavor."'
        n: '[[w.berman-lyndon-johnsons-war]], 82. To check: Carver to Helms, Sept. 15, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 82 n.9). See [[cal.1967-09-09.vietnam-order-of-battle]]. Names: Carver, Helms.'
