          rows:
          - 'w.berman-lyndon-johnsons-war 167–68: all'
          - 'via x.1968-02.taylor-to-johnson-on-khe-sanh: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-khe-sanh-4
        when: Feb.
        date: 1968-02
        thread: vietnam-khe-sanh
        c: 'Rostow to Johnson: Khe Sanh "probably can be held but that it will be at a heavy price"; he would "feel greatly relieved" if the Chiefs sent Westmoreland "guidance which would provide Westmoreland with a way out of Khe Sanh."'
        n: '[[w.berman-lyndon-johnsons-war]], 168. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 168). Check: the day. See [[cal.1968-02.vietnam-khe-sanh-3]]. Names: Rostow, Johnson, Westmoreland.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:westmoreland-william
        src:
          c: 8b3cc206
          rows:
          - 'w.berman-lyndon-johnsons-war 168: all'
          - 'via x.1968-02.rostow-to-johnson-on-khe-sanh: all'
  - add:
      entry:
        id: cal.1968-02.vietnam-khe-sanh-5
        when: Feb.
        date: 1968-02
        thread: vietnam-khe-sanh
        c: 'Johnson''s message for Westmoreland, drafted by Clifford at his instruction: "freedom of action to conduct his military operations as he thinks wise"; his interest "should not be interpreted, however, as a directive from the Commander in Chief to defend Khe Sanh under all circumstances"; "If General Westmoreland wishes to defend Khe Sanh he will be supported; if he wishes to avoid a major engagement in a fixed position ... he will also be supported."'
        n: '[[w.berman-lyndon-johnsons-war]], 168–69. To check: the message, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 168–69). Check: the day and whether it was sent. See [[cal.1968-02.vietnam-khe-sanh-4]]. Names: Johnson, Westmoreland, Clifford.'
        tags:
        - name:johnson-lyndon-b
        - name:westmoreland-william
        - name:clifford-clark
        src:
          c: 6ce27485
          rows:
          - 'w.berman-lyndon-johnsons-war 168–69: all'
          - 'via x.1968-02.johnson-to-westmoreland-on-khe-sanh-clifford-draft: all'
  - add:
      entry:
        id: cal.1968-02-23.vietnam-205000
        when: Feb. 23
        date: '1968-02-23'
        thread: vietnam-205000
        c: 'Taylor to Johnson, as Wheeler leaves for Vietnam: questions for Westmoreland and his staff, "What enemy units have been identified in the attacks on the cities? What uncommitted units are available for a second cycle? What grounds are there for the allegation of an ''intelligence failure''?"'
        n: '[[w.berman-lyndon-johnsons-war]], 169–70. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 169–70). Check: the day; Berman has it written in anticipation of the visit. Names: Taylor, Johnson, Wheeler, Westmoreland.'
        tags:
        - name:taylor-maxwell
        - name:johnson-lyndon-b
        - name:wheeler-earle
        - name:westmoreland-william
        src:
