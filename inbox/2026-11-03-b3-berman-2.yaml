      text: 'Check: Rostow''s notes (FRUS 1964–68, IV, doc. 280) and Berman (18) give the 35 percent as the increase Westmoreland would like in the forces of all the allies; the notes date the meeting 9:15–10:15 p.m.'
  - cite:
