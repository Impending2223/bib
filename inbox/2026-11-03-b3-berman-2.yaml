        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Johnson with correspondents, privately: his reports show "that the guerrilla infra-structure is on the verge of collapse"; if there is a stalemate, "then every single one of our men we have out there is wrong"; "this is one where I do not want to win the argument and lose the sale."'
        n: '[[w.berman-lyndon-johnsons-war]], 74–75. To check: "Notes from meeting with correspondents," Aug. 24, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 75 n.14). Names: Johnson.'
