        when: May
        date: 1967-05
        thread: vietnam-order-of-battle
        c: 'Saigon. Kelly Robinson, of MACV''s intelligence staff, briefs Westmoreland, back from Washington: some MACV analysts put the political cadres, the self-defense militia and the like higher than the figures Westmoreland had given Johnson. By Robinson''s account Westmoreland is shocked: "What am I going to tell the press?"; "What am I going to tell the President?"'
        n: '[[w.berman-lyndon-johnsons-war]], 38 (by Robinson''s account; no source named). Check: the day. See [[cal.1967-04-27.vietnam-program-5]]. Names: Westmoreland, Johnson.'
