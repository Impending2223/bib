        date: '1968-02-01'
        thread: vietnam
        c: 'The Presidential Prayer Breakfast, the Shoreham. Johnson: "The nights are very long. The winds are very chill"; "in these long nights your President prays."'
        n: '[Remarks at the Presidential Prayer Breakfast, 1968–69 Pub. Papers 121](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=199) (Feb. 1, 1968). [[w.berman-lyndon-johnsons-war]], 149 (and his late prayers at St. Dominic''s). Names: Johnson.'
