        c: 'Westmoreland to Wheeler and Sharp: "I do not concur in the inclusion of strength figures for the self-defense and secret self-defense. It distorts the situation and makes no sense. No amount of caveats will prevent the erroneous conclusion that will result."'
        n: '[[w.berman-lyndon-johnsons-war]], 74. To check: Westmoreland to Wheeler and Sharp, Aug. 20, 1967, CBS–Westmoreland Joint Exhibit 253 (cited by [[w.berman-lyndon-johnsons-war]], 74 n.13). See [[cal.1967-06.vietnam-order-of-battle]]. Names: Westmoreland, Wheeler, Sharp.'
