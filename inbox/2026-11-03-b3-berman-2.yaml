  - cite:
      id: cal.1968-03-31.elections-1968
      item: '[[w.berman-lyndon-johnsons-war]], 200–201 (the partial halt; "I shall not seek, and I will not accept"; Harris, approval 57 percent in April, 43 in March)'
  - cite:
      id: cal.1967-08-19.vietnam-pennsylvania
      item: '[[w.berman-lyndon-johnsons-war]], 184 ("In war, politics stops at the water''s edge"; he had supported Eisenhower 79 percent of the time)'
  - cite:
      id: cal.1967-11-04.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 184 ("Gallup and Harris say anyone could beat us"; the new Marine commander: "I''m going to take that man''s blood pressure and make sure he''s loyal")'
