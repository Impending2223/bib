        date: '1967-08-29'
        thread: vietnam-order-of-battle
        c: 'Bunker to Rostow, eyes only, CAS 273, for himself and Komer: a "potentially serious problem created by new NIE now on verge of completion"; the CIA''s experts would make the enemy 430,000–490,000 against MACV''s range centering on 298,000, chiefly by adding some 120,000 self-defense and secret self-defense forces. "The credibility gap created would be enormous."'
        n: '[FRUS 1964–68, V, doc. 297](https://history.state.gov/historicaldocuments/frus1964-68v05/d297). [[w.berman-lyndon-johnsons-war]], 75. See [[cal.1967-06.vietnam-order-of-battle]]. Names: Bunker, Rostow, Komer.'
