          - 'via x.1967-11-02.bunker-twenty-seventh-weekly-saigon-10206: all'
  - add:
      entry:
        id: cal.1967-11-04.vietnam-2
        when: Nov. 4
        date: '1967-11-04'
        thread: vietnam
        c: 'Rostow to Johnson, 10:15 a.m., the McNamara and McGeorge Bundy positions compared, as asked: McNamara for an announced stabilization, Bundy for no change from San Antonio; McNamara for a unilateral stand-down, Bundy against any unconditional or long pause and any headline-making intensification; neither for more troops than approved.'
        n: '[FRUS 1964–68, V, doc. 385](https://history.state.gov/historicaldocuments/frus1964-68v05/d385). [[w.berman-lyndon-johnsons-war]], 103–4 ("Literally Eyes Only for The President"). See [[cal.1967-11-01.vietnam]]. Names: Rostow, Johnson, McNamara, McGeorge Bundy.'
        tags:
