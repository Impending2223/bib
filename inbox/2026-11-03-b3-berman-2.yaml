          rows:
          - 'w.berman-lyndon-johnsons-war 85–86: all'
          - 'via x.1967-10-07.rusk-to-bunker-on-saigon-7867: all'
  - add:
      entry:
        id: cal.1967-10.opinion
        when: Oct.
        date: 1967-10
        thread: opinion
        c: 'Harris: support for the war at a new low, 58 percent, from 72 in July and 61 in late August.'
        n: '[[w.berman-lyndon-johnsons-war]], 86. Check: the day and the question; Berman names no source.'
        tags: []
        src:
          c: ecf67e45
          rows:
          - 'w.berman-lyndon-johnsons-war 86: all'
