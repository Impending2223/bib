        when: Feb.
        date: 1968-02
        thread: vietnam-khe-sanh
        c: 'Tom Johnson to Johnson, at his asking, after reviewing the notes of the last two weeks'' meetings: nowhere "I do not want any Damn Dien Bien Phu"; never that he had "made each chief sign a paper stating that he believed Khe Sanh could be defended."'
        n: '[[w.berman-lyndon-johnsons-war]], 142–43. To check: Tom Johnson to Johnson, February 1968, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 143 n.3). Check: the day. See [[cal.1968-02-02.vietnam-khe-sanh]]. Names: Tom Johnson, Johnson.'
