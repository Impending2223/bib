        when: Mar.
        date: 1968-03
        thread: vietnam-order-of-battle
        c: 'Carver to Johnson, at his request, on the North Vietnamese in the South: "a dramatic increase in the movement of regular North Vietnamese Army units"; over 70,000 on Nov. 1, today "may be over 100,000," despite the casualties.'
        n: '[[w.berman-lyndon-johnsons-war]], 201–2. To check: Carver''s report, March 1968, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 201). Check: the day. Names: Carver, Johnson.'
        tags:
        - name:carver-george-a-jr
        - name:johnson-lyndon-b
        src:
          c: ad826a71
          rows:
          - 'w.berman-lyndon-johnsons-war 201–2: all'
          - 'via x.1968-03.carver-to-johnson-north-vietnamese-strength: all'
  - add:
      entry:
        id: cal.1967-08-07.vietnam-3
        when: Aug. 7
        date: '1967-08-07'
        thread: vietnam
        also:
        - labor
        c: 'Johnson with labor leaders in the State Department dining room: "Some people say that we should turn the bombers loose. But I can''t do that. Some people say to pull out. But I can''t do that either"; "I wish somebody would stop saying what President Johnson should do and spend a little time trying to get Ho to do something. Don''t put all the heat on me."'
        n: '[[w.berman-lyndon-johnsons-war]], 183. To check: notes of the meeting, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 183). Names: Johnson, Westmoreland, Hồ Chí Minh.'
        tags:
        - name:johnson-lyndon-b
        - name:westmoreland-william
        - name:ho-chi-minh
        src:
          c: 4a594861
          rows:
          - 'w.berman-lyndon-johnsons-war 183: all'
          - 'via x.1967-08-07.notes-of-the-meeting-with-labor-leaders: all'
  - cite:
      id: cal.1968-03-04.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 179–80 (22,000 more, three tactical fighter squadrons, 262,000 reserves; Clifford: "We are not convinced that our present policy will bring us to that objective"; "We seem to have a sinkhole")'
  - cite:
      id: cal.1968-03-10.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 184 (Smith and Sheehan, with Frankel and Dale; "a bottomless pit"; "all we thought we had constructed was built on sand")'
  - cite:
      id: cal.1968-03-14.vietnam-205000
      item: '[[w.berman-lyndon-johnsons-war]], 186–87 (summoned the day after New Hampshire: "you are being led down the garden path"; the Wise Men to be called again)'
  - cite:
      id: cal.1968-03-15.vietnam-205000-2
      item: '[[w.berman-lyndon-johnsons-war]], 187–88 ("a new and fresh move toward a political solution"; Johnson to his aides: "I''m not going to stop the bombing")'
  - cite:
      id: cal.1968-03-18.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 189–90 ("as Chamberlain found out"; "we will win peace on the battlefield")'
  - cite:
      id: cal.1968-03-19.vietnam-205000
      item: '[[w.berman-lyndon-johnsons-war]], 189 (Clifford: "Do we have anything to offer except new war?"; Johnson: "Let''s make it troops and war")'
  - cite:
      id: cal.1968-03-22.vietnam-205000-2
      item: '[[w.berman-lyndon-johnsons-war]], 190 ("If we get tagged as mindless hawks, we can lose both the election and the war"; "A full halt in the bombing ... the indispensable missing ingredient")'
  - cite:
      id: cal.1968-03-22.vietnam-205000
      item: '[[w.berman-lyndon-johnsons-war]], 192–93 (the draft; Clifford: the people "do not see victory ahead"; Clifford for a halt above the twentieth parallel; Fortas: "Hamlet without the prince")'
  - cite:
      id: cal.1968-03-23.vietnam-abrams
      item: '[[w.berman-lyndon-johnsons-war]], 191 (announced at the news conference; Wheeler had told him in November he was "the obvious candidate")'
  - cite:
      id: cal.1968-03-25.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 194–99 (Habib, Carver and DePuy; Habib: "Stop bombing and negotiate"; Goldberg: "who the hell are we fighting?"; Mar. 26, Bundy''s summary, Acheson: "we can no longer do the job we set out to do"; Ball, Vance, Dillon; Bradley, Taylor, Murphy, Fortas against)'
  - cite:
      id: cal.1968-03.vietnam-205000-3
      item: '[[w.berman-lyndon-johnsons-war]], 198 ("Your whole group must have been brainwashed")'
  - cite:
      id: cal.1968-03-27.vietnam-205000-3
