  - add:
      entry:
        id: cal.1967-06.vietnam-order-of-battle
        when: June, mid-
        date: 1967-06
        thread: vietnam-order-of-battle
        c: 'The CIA''s first draft of SNIE 14.3-67, "Capabilities of the Vietnamese Communists for Fighting in South Vietnam": the enemy between 460,000 and 570,000, "the higher figure is closer to the actual total." Against MACV: North Vietnamese troops 53,000 in both; Viet Cong main and local forces 63,000 in both; guerrillas 60,000–120,000 and militia 125,000, against MACV''s irregulars, 100,000–120,000; administrative services 75,000–100,000 against 23,000; political cadres at least 80,000 against 40,000. Totals 456,000–541,000 against 279,000–299,000.'
        n: '[[w.berman-lyndon-johnsons-war]], 49–50. Check: the day; Berman gives the range as 460,000–570,000 and the table''s totals as 456,000–541,000. See [[cal.1967-01-19.vietnam-order-of-battle]].'
        tags: []
        src:
          c: bb16dcd9
          rows:
          - 'w.berman-lyndon-johnsons-war 49–50: all'
          - 'via x.1967-06.draft-snie-14-3-67: all'
  - add:
      entry:
        id: cal.1967-06.vietnam
        when: June, early
        date: 1967-06
        thread: vietnam
        c: 'Komer to Johnson, after a month in Vietnam: "we are gaining momentum"; by the end of the winter "we have gained the upper hand"; "The real question is not whether we need more US troops to ''win'' the war in the south, but rather how fast we want to win it." A 50-50 chance of a "clear upper hand" by mid-1968 without large additions, "if everything else breaks our way."'
        n: '[[w.berman-lyndon-johnsons-war]], 50–51. To check: Komer to Johnson, June 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 50–51). Check: the day. Names: Komer, Johnson.'
        tags:
        - name:komer-robert-w
        - name:johnson-lyndon-b
        src:
          c: a9ee960b
          rows:
          - 'w.berman-lyndon-johnsons-war 50–51: all'
          - 'via x.1967-06.komer-to-johnson-after-a-month-in-vietnam: all'
  - add:
      entry:
        id: cal.1967-07.vietnam-5
        when: July
        date: 1967-07
        thread: vietnam
        c: 'Bunker to Johnson, eyes only, on McNamara''s coming visit: "It gives all of us here new encouragement and enthusiasm"; "We are making progress"; "Please be assured you can count on us."'
        n: '[[w.berman-lyndon-johnsons-war]], 53. To check: Bunker to the White House, "Eyes only the president," July 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 53 n.8). Check: the day; the note dates it July 14, the text before McNamara''s arrival of July 7. See [[cal.1967-06-12.vietnam]]. Names: Bunker, Johnson, McNamara.'
        tags:
        - name:bunker-ellsworth
        - name:johnson-lyndon-b
        - name:mcnamara-robert-s
        src:
          c: 067e7a73
          rows:
          - 'w.berman-lyndon-johnsons-war 53: all'
          - 'via x.1967-07-14.bunker-to-the-white-house-eyes-only-the-president: all'
  - add:
      entry:
        id: cal.1967-07-22.vietnam-2
        when: July 22
        date: '1967-07-22'
        thread: vietnam
        also:
        - vietnam-order-of-battle
        c: 'Rostow to Johnson: the most observable trend the "slow decline of the Viet Cong manpower pool," main forces stagnant or smaller, the infrastructure impaired; from "literally hundreds" of provincial intelligence reports, strain in morale and manpower, "but no definitive break in the resilient Viet Cong structure."'
        n: '[[w.berman-lyndon-johnsons-war]], 56–57. To check: Rostow to Johnson, July 22, 1967, CBS Subpoena Case #19, Document 20 (cited by [[w.berman-lyndon-johnsons-war]], 57 n.5). Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 5f8ee4e4
          rows:
          - 'w.berman-lyndon-johnsons-war 56–57: all'
          - 'via x.1967-07-22.rostow-to-johnson-cbs-19-20: all'
  - add:
      entry:
        id: cal.1967-07-25.vietnam-2
        when: July 25
        date: '1967-07-25'
        thread: vietnam
        c: 'Johnson with his advisers, Wheeler among them, by the meeting''s notes: "What is the answer to the stalemate issue?" Wheeler: there is none. Johnson: "That''s not a good enough answer"; he had called it "pure communist propaganda"; "We should have some colorful general like MacArthur with his shirt neck open"; Rostow to get "a colorful general to go to Saigon and argue with them." South Vietnam''s people "about 15 million," Wheeler says, the Viet Cong "about 4 million"; Johnson: "we could whip ''em."'
        n: '[[w.berman-lyndon-johnsons-war]], 59. To check: meeting notes, July 25, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 59 n.10). Check: the day; the text does not date the meeting. Names: Johnson, Wheeler, Rostow.'
        tags:
        - name:johnson-lyndon-b
        - name:wheeler-earle
        - name:rostow-walt-w
        src:
          c: 1cb5584f
          rows:
          - 'w.berman-lyndon-johnsons-war 59: all'
          - 'via x.1967-07-25.meeting-notes-the-stalemate-issue: all'
  - add:
      entry:
        id: cal.1967-07-26.vietnam
        when: July 26
        date: '1967-07-26'
        thread: vietnam
        c: 'Bunker''s thirteenth weekly telegram to Johnson, Saigon 1954. "I do not believe, however, that there is any evidence that things are in a ''stalemate'' here"; "we are moving steadily ahead"; the press here needs "more intensive work in educating." Rostow, covering it July 27: "the most solid piece of analysis in a single place of progress in Vietnam."'
        n: '[FRUS 1964–68, V, doc. 256](https://history.state.gov/historicaldocuments/frus1964-68v05/d256) (in part; not the passages quoted). [[w.berman-lyndon-johnsons-war]], 57. To check: Bunker to Johnson, July 26, 1967, CBS Subpoena Case #10, Document 63; Rostow to Johnson, July 27, 1967 (both cited by [[w.berman-lyndon-johnsons-war]], 57 n.6). Names: Bunker, Johnson, Rostow.'
        tags:
        - name:bunker-ellsworth
        - name:johnson-lyndon-b
        - name:rostow-walt-w
        src:
          c: 9814c16b
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v05/d256: A'
          - 'w.berman-lyndon-johnsons-war 57: all'
          - 'via x.1967-07-26.bunker-thirteenth-weekly-saigon-1954: all'
          - 'via x.1967-07-27.rostow-to-johnson-re-saigon-1954: E'
  - add:
      entry:
        id: cal.1967-08-02.vietnam
        when: Aug. 2
        date: '1967-08-02'
        thread: vietnam
        c: 'Westmoreland to Wheeler, Harold K. Johnson and Sharp, on public support: "we must make haste carefully in order to avoid charges that the military establishment is conducting an organized propaganda campaign"; the impression of stalemate false, "Every indicator belies either stalemate or loss of initiative"; "While we work on the nerve ends here we hope that careful attention will be paid to the roots there."'
        n: '[[w.berman-lyndon-johnsons-war]], 57–58. To check: Westmoreland to Wheeler, Harold K. Johnson and Sharp, Aug. 2, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 58 n.7). Names: Westmoreland, Wheeler, Harold K. Johnson, Sharp.'
        tags:
        - name:westmoreland-william
        - name:wheeler-earle
        - name:johnson-harold-k
        - name:sharp-u-s-grant
        src:
          c: 0db79016
          rows:
          - 'w.berman-lyndon-johnsons-war 57–58: all'
          - 'via x.1967-08-02.westmoreland-to-wheeler-johnson-and-sharp: all'
  - add:
      entry:
        id: cal.1967-08-04.vietnam
        when: Aug. 4
        date: '1967-08-04'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Johnson with Peter Lisagor of the *Chicago Daily News*, privately: "We''ve begun to turn defeat into victory. I''m not distressed. There is no truth in the stalemate theory. The McNamara report this time was the best of his nine."'
        n: '[[w.berman-lyndon-johnsons-war]], 55. To check: notes of meeting with Peter Lisagor, Aug. 4, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 55 n.2). See [[cal.1967-07-12.vietnam-program-5]]. Names: Johnson, McNamara.'
        tags:
        - name:johnson-lyndon-b
        - name:mcnamara-robert-s
        src:
          c: 1e3d6594
          rows:
          - 'w.berman-lyndon-johnsons-war 55: all'
          - 'via x.1967-08-04.notes-of-meeting-with-peter-lisagor: all'
  - add:
      entry:
        id: cal.1967-08-07.vietnam-2
        when: Aug. 7
        date: '1967-08-07'
        thread: vietnam
        also:
        - vietnam-air-war
        c: 'Rostow to Johnson: "All the evidence we have indicates bombing North Viet Nam (and Laos) helps cut down the level of infiltration"; the Viet Cong have "severe manpower problems in the south"; Hanoi "does not now expect to win the war in the south on the battlefield," hoping instead for "a break in the will of the U.S."'
        n: '[[w.berman-lyndon-johnsons-war]], 57. To check: Rostow to Johnson, Aug. 7, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 57). Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: 77e53687
          rows:
          - 'w.berman-lyndon-johnsons-war 57: all'
          - 'via x.1967-08-07.rostow-to-johnson-bombing-and-infiltration: all'
  - add:
      entry:
        id: cal.1967-08-08.vietnam-2
        when: Aug. 8
        date: '1967-08-08'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Wheeler to Westmoreland and Sharp, on Apple''s unnamed source in the *Times* the day before ("Every time Westy makes a speech about how good the South Vietnam army is, I want to ask him why he keeps calling for more Americans"): "regrettable that a senior officer felt compelled to respond" and "tragic that he was disloyal to his commander."'
        n: '[[w.berman-lyndon-johnsons-war]], 58–59. To check: Wheeler to Westmoreland and Sharp, Aug. 8, 1967, Exhibit 1607 A (cited by [[w.berman-lyndon-johnsons-war]], 59 n.9). See [[cal.1967-08-07.vietnam]]. Names: Wheeler, Westmoreland, Sharp.'
        tags:
        - name:wheeler-earle
        - name:westmoreland-william
        - name:sharp-u-s-grant
        src:
          c: a9dfd652
          rows:
          - 'w.berman-lyndon-johnsons-war 58–59: all'
          - 'via x.1967-08-08.wheeler-to-westmoreland-and-sharp-exhibit-1607a: all'
  - add:
      entry:
        id: cal.1967-08-08.vietnam-congress-2
        when: Aug. 8
        date: '1967-08-08'
        thread: vietnam-congress
        also:
        - economy-surcharge
        - vietnam-air-war
        c: 'Johnson with Democratic congressmen, for the tax bill, by Tom Johnson''s notes: "There is no stalemate"; "The kill ratio is 10 to 1." Wolff of New York: "Nobody sees the light at the end of the tunnel"; he cites Ford on the bombing. Johnson: "We are taking out half of the infiltration with our bombing, some reports show"; doing what Ford asks would mean "a war with China tonight"; "I believe in civilian government"; of 242 targets the Chiefs proposed, all but the 39 in the buffer zone along China''s border authorized; "The generals are ready to bomb there but I''m not"; Hanoi bombed within half a mile of Hồ''s house.'
        n: '[[w.berman-lyndon-johnsons-war]], 60, 71. To check: Tom Johnson''s notes of the meeting of Aug. 8, 1967, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 71). See [[cal.1967-08-08.vietnam-congress]]. Names: Johnson, Wolff, Ford, Hồ Chí Minh.'
        tags:
        - name:johnson-lyndon-b
        - name:wolff-lester-l
        - name:ford-gerald-r
        - name:ho-chi-minh
        src:
          c: c90e5e39
          rows:
          - 'w.berman-lyndon-johnsons-war 60, 71: all'
          - 'via x.1967-08-08.tom-johnsons-notes-of-the-meeting: all'
  - add:
      entry:
        id: cal.1967-08-08.vietnam-3
        when: Aug. 8
        date: '1967-08-08'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Russell Baker''s "Observer" column in the *Times*, on the Clifford-Taylor mission: back with the report that the administration''s conduct of the war "was just right," the Asian statesmen applauding "with cries of ''Jim Dandy!''"'
        n: '[[w.berman-lyndon-johnsons-war]], 56. To check: Russell Baker, "Observer: Let''s Hear It for a Really Swell Policy," *New York Times*, Aug. 8, 1967 (cited by [[w.berman-lyndon-johnsons-war]], 56 n.3). See [[cal.1967-08-05.vietnam]]. Names: Clifford, Taylor.'
        tags:
        - name:clifford-clark
        - name:taylor-maxwell
        src:
          c: b89b32b4
          rows:
          - 'w.berman-lyndon-johnsons-war 56: all'
          - 'via x.1967-08-08.russell-baker-observer-lets-hear-it: all'
  - add:
      entry:
        id: cal.1967-08-11.vietnam-2
        when: Aug. 11
        date: '1967-08-11'
        thread: vietnam
        c: 'Rostow to Johnson: General Harold Johnson "comes back with the most optimistic reports"; have him report in person, then perhaps "unleash him on the White House Press Corps." Johnson writes on it: "Bring him in Saturday if George OK''s."'
        n: '[[w.berman-lyndon-johnsons-war]], 58. To check: Rostow to Johnson, Aug. 11, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 58 n.8). Names: Rostow, Johnson, Harold K. Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        - name:johnson-harold-k
        src:
          c: b2d8c2e9
          rows:
          - 'w.berman-lyndon-johnsons-war 58: all'
          - 'via x.1967-08-11.rostow-to-johnson-harold-johnson: all'
  - add:
      entry:
        id: cal.1967-08-12.vietnam-2
        when: Aug. 12
        date: '1967-08-12'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Westmoreland to Wheeler and Sharp, on the quotation in Apple''s article: "inconceivable to me that any general officer in Vietnam would make such a statement"; Apple "pessimistic and suspicious," "still is convinced that we are not honest about casualties"; "He is probably bucking for a Pulitzer Prize."'
        n: '[[w.berman-lyndon-johnsons-war]], 59. To check: Westmoreland to Wheeler and Sharp, Aug. 12, 1967, Exhibit 1605 A (cited by [[w.berman-lyndon-johnsons-war]], 59 n.9). See [[cal.1967-08-08.vietnam-2]]. Names: Westmoreland, Wheeler, Sharp.'
