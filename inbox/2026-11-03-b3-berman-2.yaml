        id: cal.1968-02.vietnam-205000-3
        when: Feb.
        date: 1968-02
        thread: vietnam-205000
        c: 'Taylor to Johnson, for the Joint Chiefs'' call-up: a surprise in Korea or elsewhere likely enough "that it is an act of prudence to move additional ground forces to the area as rapidly as possible"; a reminder "that, while we are not technically at war, we are in a situation of similar emergency."'
        n: '[[w.berman-lyndon-johnsons-war]], 167. To check: the memorandum, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 167). Check: the day. Names: Taylor, Johnson.'
