        when: May 5
        date: '1967-05-05'
        thread: vietnam-air-war
        also:
        - vietnam-program-5
        c: 'Wheeler to Johnson, CM-3218-67, answering McGeorge Bundy''s memorandum at Johnson''s asking through McNamara: the bombing makes the North "pay a price for its continued aggression"; "the Haiphong port is the single most vulnerable and important point in the lines of communications system of North Vietnam," its general cargo at record levels in the first quarter. Proposed: actions against the port; covert operations in Laos; seeding the clouds over Laos for rain, with a warning that a leak might raise the question of "a new form of warfare akin to biological and nuclear warfare."'
        n: '[[w.berman-lyndon-johnsons-war]], 41–42. To check: Wheeler to Johnson, CM-3218-67, May 5, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 42 n.15). See [[cal.1967-05-03.vietnam-program-5]]. Names: Wheeler, Johnson, McGeorge Bundy, McNamara.'
