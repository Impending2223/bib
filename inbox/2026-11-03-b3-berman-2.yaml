        when: Nov. 24
        date: '1967-11-24'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Hedrick Smith in the *Times*, "Accounts by Bunker and Westmoreland Stirring Unease": "For the last 10 days or so, the American people have heard the most optimistic reports in years about the progress of the war in Vietnam from the ranking American officials in the field."'
        n: '[[w.berman-lyndon-johnsons-war]], 118. To check: the article (quoted by [[w.berman-lyndon-johnsons-war]], 118). Names: Bunker, Westmoreland.'
        tags:
        - name:bunker-ellsworth
        - name:westmoreland-william
        src:
          c: 75932e0a
          rows:
          - 'w.berman-lyndon-johnsons-war 118: all'
          - 'via x.1967-11-24.hedrick-smith-accounts-by-bunker-and-westmoreland: all'
  - add:
      entry:
        id: cal.1967-11-26.vietnam
        when: Nov. 26
        date: '1967-11-26'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Ward Just in the *Washington Post*: the high-level review of the war "ended up being a high-level campaign to convince the American people that the war was being won," the end, in Westmoreland''s words, coming "into view."'
        n: '[[w.berman-lyndon-johnsons-war]], 118. To check: the article (quoted by [[w.berman-lyndon-johnsons-war]], 118). Names: Westmoreland.'
        tags:
        - name:westmoreland-william
        src:
          c: 46035bae
          rows:
          - 'w.berman-lyndon-johnsons-war 118: all'
          - 'via x.1967-11-26.ward-just-washington-post: all'
  - add:
      entry:
        id: cal.1967-11-26.vietnam-2
        when: Nov. 26
        date: '1967-11-26'
        thread: vietnam
        c: 'Westmoreland to Abrams, what he had told the President, the television programs, the Press Club and the Pentagon: the enemy ground down, the South Vietnamese forces stronger, "conceivably in two years or less" able to take more of the war, the United States then phasing down; it portrays "some light at the end of the tunnel" and "straddles the presidential election of November 1968."'
        n: '[[w.berman-lyndon-johnsons-war]], 120. To check: Westmoreland to Abrams, Nov. 26, 1967, CBS–Westmoreland Joint Exhibit 285 (cited by [[w.berman-lyndon-johnsons-war]], 120 n.6). See [[cal.1967-11-21.vietnam-2]]. Names: Westmoreland, Abrams.'
        tags:
        - name:westmoreland-william
        - name:abrams-creighton
        src:
          c: d50ff8af
          rows:
          - 'w.berman-lyndon-johnsons-war 120: all'
          - 'via x.1967-11-26.westmoreland-to-abrams-je-285: all'
  - add:
