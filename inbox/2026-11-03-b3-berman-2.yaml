  - cite:
      id: cal.1967-11-29.defense
      item: '[[w.berman-lyndon-johnsons-war]], 120–21 (Harris at the time: McNamara 42 percent positive, 45 negative; Westmoreland 68 and 16; civilians to let the military run the war, 53 to 36)'
      units: A
  - cite:
      id: cal.1967-11-20.elections-1968
      item: '[[w.berman-lyndon-johnsons-war]], 122 (an evening alone with Johnson, by Westmoreland''s account: "What would my men in Vietnam think" if he did not run; his health "not good")'
  - cite:
      id: cal.1967-12-21.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 124 ("The enemy is building his forces in the south. We must try very hard to be ready. We may face dark days ahead")'
  - cite:
      id: cal.1967-12-23.vietnam
      item: '[[w.berman-lyndon-johnsons-war]], 123–24 (his second visit in fourteen months; "We''re not going to yield. And we''re not going to shimmy"; the Distinguished Service Medal for Westmoreland; Apple: "the President''s lavish embrace")'
  - add:
      entry:
        id: cal.1968-01-12.vietnam-khe-sanh
        when: Jan. 12
        date: '1968-01-12'
        thread: vietnam-khe-sanh
        c: 'Westmoreland to Wheeler, against giving up Khe Sanh: "critical to us from a tactical standpoint as a launch base for Special Operations Group teams and as flank security for the strong point obstacle system"; "even more critical from a psychological viewpoint"; "withdrawal would be a tremendous step backwards."'
        n: '[FRUS 1964–68, VI, doc. 12](https://history.state.gov/historicaldocuments/frus1964-68v06/d12) (quoted in Wheeler, CM-2908-68, Jan. 13). [[w.berman-lyndon-johnsons-war]], 140. See [[cal.1968-01-13.vietnam-khe-sanh]]. Names: Westmoreland, Wheeler.'
        tags:
        - name:westmoreland-william
        - name:wheeler-earle
        src:
          c: 3ca9333f
          rows:
          - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d12: all'
          - 'w.berman-lyndon-johnsons-war 140: all'
          - 'via x.1968-01-12.westmoreland-to-wheeler-on-khe-sanh: all'
  - add:
      entry:
        id: cal.1968-01-31.vietnam-tet-4
        when: Jan. 31
        date: '1968-01-31'
        thread: vietnam-tet
        c: 'The Cabinet, after Tet. Johnson: the Pope "said ''I want to do something, anything for peace—can''t you give us one extra day of the holiday truce?''"; "we did give the Pope his extra day. Now it''s hard not to regret the number of boys who were killed"; Pueblo, Khe Sanh and Saigon "all as part of the Communist effort." He reads Bunker''s Paine: "These are the times that try men''s souls."'
        n: '[[w.berman-lyndon-johnsons-war]], 148. To check: notes of the Cabinet meeting, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 148). Check: the day; Berman puts it after the meeting with the congressional leaders. See [[cal.1968-01-31.vietnam-tet]]. Names: Johnson, Paul VI, Bunker, Westmoreland.'
        tags:
        - name:johnson-lyndon-b
        - name:paul-vi
        - name:bunker-ellsworth
        - name:westmoreland-william
        src:
          c: 2c0f269e
          rows:
          - 'w.berman-lyndon-johnsons-war 148: all'
          - 'via x.1968-01-31.notes-of-the-cabinet-meeting: all'
