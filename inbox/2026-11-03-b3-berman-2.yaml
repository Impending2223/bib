        id: cal.1967-11-28.republican-party
        when: Nov. 28
        date: '1967-11-28'
        thread: republican-party
        also:
        - vietnam
        c: Eisenhower, publicly, for a limited invasion of North Vietnam.
        n: '[[w.berman-lyndon-johnsons-war]], 119. Check: the words and the occasion; Berman names no source. Names: Eisenhower.'
        tags:
        - name:eisenhower-dwight-d
        src:
          c: 8220c0bc
          rows:
          - 'w.berman-lyndon-johnsons-war 119: all'
  - add:
      entry:
        id: cal.1967-12-21.vietnam-2
        when: Dec. 21
        date: '1967-12-21'
        thread: vietnam
        c: 'Canberra. Johnson and Thiệu in private, two hours, after Thiệu''s public refusal to talk with the NLF ("Thieu, Disputing Johnson, Rejects Talks with Foe," the *Times*, Dec. 21). Their communiqué: national reconciliation; the government willing to talk with anyone, but not usefully with members of an organization committed to its destruction.'
        n: '[[w.berman-lyndon-johnsons-war]], 123. See [[cal.1967-12-19.vietnam]]. Names: Johnson, Nguyễn Văn Thiệu.'
        tags:
        - name:johnson-lyndon-b
        - name:nguyen-van-thieu
        src:
          c: a985dc4e
          rows:
          - 'w.berman-lyndon-johnsons-war 123: all'
  - add:
      entry:
        id: cal.1967-12-23.vietnam-2
        when: Dec. 23
        date: '1967-12-23'
        thread: vietnam
        also:
        - vietnam-prisoners
        c: 'The Vatican, the Pope''s library. Johnson with Paul VI: Hanoi believes "the U.S. will tire and fail just like France did"; "My right hand keeps the pressure steady and with my left hand we seek negotiations." He asks the Pope to persuade Thiệu to talk informally with the NLF, and to send a representative to the prisoners North and South; the Pope: "I think I can do something," and asks the Christmas truce extended. An aide-mémoire: no halt, for every past cessation "has been used by the other side to accelerate the movement of supplies and men." Johnson gives him a bust of himself.'
        n: '[[w.berman-lyndon-johnsons-war]], 114, 124–25, 137. To check: transcript of the meeting with the Pope, Dec. 23, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 137 n.11). Check: Berman''s epigraph dates the meeting Dec. 22, the text the day before Christmas. See [[cal.1967-12-19.vietnam]]. Names: Johnson, Paul VI, Nguyễn Văn Thiệu.'
        tags:
        - name:johnson-lyndon-b
        - name:paul-vi
        - name:nguyen-van-thieu
        src:
          c: de1eac73
          rows:
          - 'w.berman-lyndon-johnsons-war 114, 124–25, 137: all'
          - 'via x.1967-12-23.meeting-of-the-pope-and-the: all'
  - add:
      entry:
        id: cal.1967-12.vietnam-2
        when: Dec.
        date: 1967-12
        thread: vietnam
        c: 'Bunker''s last weekly telegram of 1967: Johnson''s visit to Cam Ranh on Dec. 23 "an encouragement to all of us"; his session with Thiệu and the other leaders at Canberra "served to reassure the Vietnamese of our commitment here."'
        n: '[[w.berman-lyndon-johnsons-war]], 138. To check: the telegram, LBJ Library (quoted by [[w.berman-lyndon-johnsons-war]], 138). Check: the day. See [[cal.1967-12-19.vietnam]]. Names: Bunker, Johnson, Nguyễn Văn Thiệu.'
        tags:
        - name:bunker-ellsworth
        - name:johnson-lyndon-b
        - name:nguyen-van-thieu
        src:
          c: 85cd9214
          rows:
          - 'w.berman-lyndon-johnsons-war 138: all'
          - 'via x.1967-12.bunker-last-weekly-of-1967: all'
  - cite:
