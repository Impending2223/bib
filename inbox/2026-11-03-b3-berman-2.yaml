        when: Oct. 10
        date: '1967-10-10'
        thread: vietnam
        also:
        - vietnam-support
        c: 'McPherson to Johnson, 5:10 p.m., on presenting the case for the war: "Bob McNamara thinks he and Secretary Rusk have pretty much lost their credibility on the subject, and I''m afraid I agree."'
        n: '[FRUS 1964–68, V, doc. 352](https://history.state.gov/historicaldocuments/frus1964-68v05/d352). [[w.berman-lyndon-johnsons-war]], 86. Names: McPherson, Johnson, McNamara, Rusk.'
