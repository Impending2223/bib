          - 'via x.1967-09-15.carver-to-helms: all'
  - add:
      entry:
        id: cal.1967-09-20.vietnam
        when: Sept. 20
        date: '1967-09-20'
        thread: vietnam
        c: 'Rostow to Johnson: the enemy''s battlefield and terror initiatives peaked in 1966, "now there is sliding even on the battalion levels"; "Hanoi''s leaders are elderly men. They are living on their French Indo-Chinese memories"; "now they are just hoping we cave in"; a growing manpower shortage.'
        n: '[[w.berman-lyndon-johnsons-war]], 83. To check: Rostow to Johnson, Sept. 20, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 83 n.10). Names: Rostow, Johnson.'
        tags:
        - name:rostow-walt-w
        - name:johnson-lyndon-b
        src:
          c: fd56ddd1
          rows:
          - 'w.berman-lyndon-johnsons-war 83: all'
          - 'via x.1967-09-20.rostow-to-johnson: all'
  - add:
      entry:
        id: cal.1967-09-20.vietnam-2
        when: Sept. 20
        date: '1967-09-20'
        thread: vietnam
        also:
        - press-and-broadcasting
        c: 'Johnson with an Australian broadcasting group at the White House: "we may have made two mistakes in Vietnam": too moderate, "too restrained in our bombing policy—too gradual across the board"; and "we may have helped to create mistrust or misinterpretation of our peace proposals," crawling "too often." "Eisenhower may be right."'
        n: '[[w.berman-lyndon-johnsons-war]], 84. To check: notes of the President''s meeting, Sept. 20, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 84 n.12). Check: the day; the text has the meeting in mid-September. Names: Johnson, Eisenhower.'
        tags:
        - name:johnson-lyndon-b
        - name:eisenhower-dwight-d
        src:
          c: 5ab144a1
          rows:
          - 'w.berman-lyndon-johnsons-war 84: all'
          - 'via x.1967-09-20.notes-of-the-presidents-meeting-australian-broadcasters: all'
  - add:
      entry:
        id: cal.1967-09-26.vietnam-2
        when: Sept. 26
        date: '1967-09-26'
        thread: vietnam
        also:
        - vietnam-support
        c: 'Habib to Harold Kaplan, "Statistical Defense of Progress in the War": "Our problem is not that the public has not been exposed to this kind of material before. The problem is that they do not accept this evidence as sufficient"; the figures do not answer the casualties, the corruption, how much longer.'
        n: '[[w.berman-lyndon-johnsons-war]], 85. To check: Habib to Kaplan, Sept. 26, 1967, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 85 n.13). See [[cal.1967-09-27.vietnam-support]]. Names: Habib.'
        tags:
        - name:habib-philip-c
        src:
          c: dee47c8f
          rows:
          - 'w.berman-lyndon-johnsons-war 85: all'
          - 'via x.1967-09-26.habib-to-kaplan-statistical-defense-of-progress: all'
  - add:
      entry:
        id: cal.1967-10-07.vietnam
        when: Oct. 7
        date: '1967-10-07'
        thread: vietnam
        also:
        - vietnam-support
        c: Saigon 7867, Locke to Johnson, "Measurements of Progress in South Vietnam," a long report "to demonstrate to the press and the public that we are making solid progress and are not in a stalemate."
        n: '[[w.berman-lyndon-johnsons-war]], 85. To check: Locke to Johnson, Oct. 7, 1967, Saigon 7867, LBJ Library (cited by [[w.berman-lyndon-johnsons-war]], 86 n.14). See [[cal.1967-09-27.vietnam-support]]. Names: Locke, Johnson.'
