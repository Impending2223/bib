      c: Fengyang 鳳陽 county, Anhui 安徽, Yinjian 殷澗 commune, Baiyun 白雲 brigade, Zhaoyao 趙窰 team. Zhao Xiaoguo 趙小鍋, 17, steals sweet potatoes from hunger and is beaten senseless by the team cadre Han 韓. He steals two jin more; Han smashes four of his fingers, and he dies within two days. Han withholds meals from Zhao's brother, 7, for five days for the theft, and he starves. Han has beaten 23.
      n: '[[w.yang-jisheng-mubei]], I, 277 n.41. Made public: 2008. To check: Chen Zhenya 陳振亞, "The report on the Fengyang problem" 《關於鳳陽問題的報告》, Feb. 1, 1961 (cited by [[w.yang-jisheng-mubei]], I, 277 n.41).'
