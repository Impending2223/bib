      n: '[[w.yang-jisheng-mubei]], I, 223 n.84. Made public: 2008. To check: Wenjiang Work Corps of the Sichuan Provincial Committee''s rectification, report on the grave violations of law and discipline exposed at the Jintang county five-level cadre meeting, Jan. 16, 1961 (cited by [[w.yang-jisheng-mubei]], I, 223 n.84).'
