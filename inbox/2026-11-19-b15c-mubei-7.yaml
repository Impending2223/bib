      c: Guan 灌 county, Sichuan 四川, Chongyi 崇義 commune. Zhou Yuguang 周玉光, a woman of 39, a well-off middle peasant, digs up the body of a child of two, Du Zhitian's 杜之田, dead two days, cuts off the head and limbs, throws the entrails in the river and takes the trunk home to cook and eat.
      n: '[[w.yang-jisheng-mubei]], I, 210–211 n.51. The words: 下午 (I, 211). Made public: 2008. To check: Guan County Committee office, "Report to the Wenjiang prefectural committee office on two abnormal deaths" 《關於兩起不正常的死亡事件給溫江地委辦公室的報告》, Mar. 26, 1960 (cited by [[w.yang-jisheng-mubei]], I, 211 n.51).'
