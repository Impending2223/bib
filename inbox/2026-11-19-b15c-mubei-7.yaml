      c: Dayi 大邑 county, Sichuan 四川, Anren 安仁 district. Liu Yuanfang 劉元芳, a woman of 30, takes her daughter Li Shuiqing 李水清, 8, and son Li Yongan 李永安, 9, to the Qingshui 清水 river at Guanyintang 觀音堂 and drowns them. She says the mess hall had withheld her family's meal for pea pods the children took, and a team head had struck and spat on her.
      n: '[[w.yang-jisheng-mubei]], I, 210 n.50. Made public: 2008. To check: Wenjiang Prefectural Committee office, record of a telephone call from the Dayi County Committee office, Apr. 25, 1960 (cited by [[w.yang-jisheng-mubei]], I, 210 n.50).'
