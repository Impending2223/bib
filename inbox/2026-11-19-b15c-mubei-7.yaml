      c: Bo 亳 county, Anhui 安徽, Wuma 五馬 commune, Wulou 王樓 village. The brigade decides to make an example. Cadres seize the former wife of Wang 王, who has often eaten human flesh, with a basin of cooked flesh just ladled out, and hold a mass struggle meeting. A man says he will taste it, takes a piece, and the crowd snatches the whole basin. The meeting breaks up. The account is Wang Tizhong's 王體忠, whose wife took a piece.
