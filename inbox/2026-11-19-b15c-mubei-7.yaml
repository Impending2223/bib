      c: Guan 灌 county, Sichuan 四川, Puyang 蒲陽 commune, 8th district, 3rd team. Pan Suhua 潘素華, a woman of 41, whose husband Tang Qianwu 唐前武 drowned the night before, opens his grave at night, cuts off the head and limbs, takes the trunk and entrails home, cooks and eats them, and sells part as bear bones. The mess-hall manager Huang Rongtai 黃榮太 finds hands, limbs, entrails and bones in her house.
      n: '[[w.yang-jisheng-mubei]], I, 210–211 n.51. The words: 當晚乘夜靜更深 (I, 210). The husband drowned on the evening of Mar. 16, was found the next morning and buried that day (I, 210). Made public: 2008. To check: Guan County Committee office, "Report to the Wenjiang prefectural committee office on two abnormal deaths" 《關於兩起不正常的死亡事件給溫江地委辦公室的報告》, Mar. 26, 1960 (cited by [[w.yang-jisheng-mubei]], I, 211 n.51).'
