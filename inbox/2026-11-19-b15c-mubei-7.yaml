      c: Guangshan 光山 county, Henan 河南, Huaidian 槐店 commune, Dashu 大樹 brigade, Chenwan 陳灣 team. Cadres find Li Chenmin 李陳民, 54, cooking at home and beat him on a charge of grain of unknown source. He dies the next day.
      n: '[[w.yang-jisheng-mubei]], I, 42–43 n.14. The words: 糧食來源不明 (I, 42). Made public: 2008. To check: Qiao Peihua 喬培華, "Xinyang shijian" 《信陽事件》, unpublished typescript, July 19, 2000, pp. 70–72 (cited by [[w.yang-jisheng-mubei]], I, 43 n.14).'
