    entry:
      id: cal.1966.vietnam-hanoi
      when: 1966, early
      date: '1966'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Central Office''s Military Party Committee resolves on building the armed forces in 1966: mend and raise the units held, take in well the new force sent from the North; among the main force stress regiments more than divisions; build up the arms, above all sappers and engineers for the roads; the regional troops and militia raised in quality.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 219. Made public: 2013. Check: the day; the history says "đầu năm 1966".'
      tags:
      - polity:drv
      - vis:only:drv
      at: before 1966-01
- add:
    entry:
      id: cal.1966-01.vietnam-hanoi
      when: Jan.
      date: 1966-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 5 sets up the front command for northern Bình Định: Giáp Văn Cương, commander of the 3d Division, commander; Trần Quang Khanh, Bình Định''s provincial secretary, political commissar.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 104. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-01-08.vietnam-hanoi
      when: Jan. 8–19
      date: '1966-01-08'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Củ Chi. Twelve days of fighting against the 1st Division''s brigades and the 173d Airborne: 200 actions, nearly 1,000 Americans and Saigon troops killed or wounded, 84 aircraft shot down (most UH-1s), 77 vehicles destroyed or damaged (56 M113s), two 105 mm guns. The Americans end the sweep Jan. 19 and move the brigades to Đồng Dù.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 86–88 (the sweep began at first light Jan. 8, after air and artillery and hundreds of helicopters landed troops at Mỹ Hưng and Nhuận Đức). See [[cal.1966-01-08.vietnam-operations]]. Check: the units; the history names the sweep "Cái bẫy" (Crimp) and gives its own count.'
      tags:
      - polity:drv
      - polity:us
      place: cu-chi
- add:
    entry:
      id: cal.1966-01-20.vietnam-hanoi-3
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gò Nổi, rubber lot 6. That night Battalion Quyết Thắng of the Saigon Military Region, following the Americans out of the Củ Chi sweep, raids an American battalion bivouacked in the open.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 88. Check: the result; the history gives none.'
      tags:
      - polity:drv
      - polity:us
      place: cu-chi
- add:
    entry:
      id: cal.1966-01-24.vietnam-hanoi-2
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      - vietnam-pause
      c: 'Hồ Chí Minh''s letter to the heads of the socialist states, the states of the 1954 Geneva Agreement and the non-aligned states: the Americans say they respect Geneva, but it bars foreign troops, so they must withdraw theirs and their allies'' from the South. The Americans'' fourteen points are an attempt to hold the South, keep their puppet regime and divide the country; the "peace offensive" hides escalation.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 392 (*Toàn tập*, quoted); on the pause and the fourteen points, [[w.lich-su-khang-chien-chong-my]], IV, 391–93. The Secretariat''s cable of the same day, [[cal.1966-01-24.vietnam-hanoi]]; the American side, [[cal.1966-01-24.vietnam]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      place: hanoi
- add:
    entry:
      id: cal.1966-01-28.vietnam-hanoi-3
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Chợ Cát, Hoài Nhơn, north Bình Định. American, Saigon and Korean troops under Kinnard, the 1st Cavalry's commander, open the sweep from Bồng Sơn; a Saigon airborne battalion takes Bình Đê pass. Battalion 7 and the guerrillas fight at Gia Hựu and Chương Hòa all morning. The fighting runs to Mar. 6.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 105–06. See [[cal.1966-01-24.vietnam]]. Check: the dates; the history gives Jan. 28 to Mar. 6, the calendar''s Masher begins Jan. 25.'
      tags:
      - polity:drv
      - polity:us
      place: bong-son
