      date: '1966-06-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Long. Local forces attack five posts around the town, two Saigon companies in the open north of the airfield put out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 162.'
      tags:
      - polity:drv
      - polity:us
      place: binh-long
