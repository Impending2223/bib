      also:
      - vietnam-operations
      c: Bàu Đa Dội, Long Nguyên, Bến Cát. Regiment 2 of the 9th Division attacks the 2d Brigade, 1st Infantry Division, in a day-long fight under heavy air and artillery; at 5 p.m. it holds the field, a company destroyed, another battalion hurt. The brigade leaves Dầu Tiếng.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 62–63. Check: the hour is the battle''s end.'
