    entry:
      id: cal.1966-04-14.vietnam-hanoi-3
      when: Apr. 14
      date: '1966-04-14'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: B-52 flights bomb the area of the Mụ Giạ pass and Route 12 in west Quảng Bình, to cut the transport line over the border into Strategic Route 559. The same is done Apr. 27.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 389. Check: the day; the calendar has the first B-52 strike on the North Apr. 12 on the Mu Gia pass, [[cal.1966-04-12.vietnam]].'
      tags:
      - polity:drv
      - polity:us
      place: quang-binh
- add:
    entry:
      id: cal.1966-06.vietnam-hanoi-4
      when: June
      date: 1966-06
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The General Staff decides to organize the North's whole air-defense main force into five divisions, four to guard the key areas and one to be mobile.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 395. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-06-29.vietnam-hanoi-2
      when: June 29
      date: '1966-06-29'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hundreds of American sorties bomb 52 points from Đồng Hới to Quảng Ninh, among them the Đức Giang fuel depot at Hanoi and the Thượng Lý depot at Haiphong. From Jun. 29 the raids go on at Đức Giang, Đông Anh and Thượng Lý; Jul. 19 they hit the Cầu Giẽ and Vạn Điểm bridges and the Đông Anh oil depot; Jul. 20 Battalion 72 of Missile Regiment 285, at Vô Tranh, shoots down an EB-66.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 206, 397–98. Check: the units and the days of the second and third actions; the history runs them together. See [[cal.1966-06-29.vietnam]].'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
      place: hanoi
- add:
    entry:
      id: cal.1966-08-02.vietnam-hanoi
      when: Aug. 2
      date: '1966-08-02'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Haiphong. In two fights Haiphong's air defense shoots down five aircraft in five minutes, the 252d Antiaircraft Regiment, Lâm Văn Kiếm commanding, four of them. From Jul. 17 to Aug. 17 the North's force shoots down 138 aircraft.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 399. Check: the clock; the history gives only the five minutes.'
      tags:
      - polity:drv
      - polity:us
      place: haiphong
- add:
    entry:
      id: cal.1967-04-20.vietnam-hanoi
      when: Apr. 20
      date: '1967-04-20'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Haiphong. American A-4, A-6, F-4 and F-8s from the southeast bomb the antiaircraft positions, the Cửa Cấm power plant, the enamel, iron and cement works, the Hạ Lý bridge and some quarters of Hồng Bàng and Ngô Quyền; the city''s air defense shoots down five aircraft. Hồ Chí Minh writes a letter of praise: no one to grow proud, "fight well, win more".'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 407–08. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      place: haiphong
- add:
    entry:
      id: cal.1967-04-24.vietnam-hanoi
      when: Apr. 24
      date: '1967-04-24'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Haiphong. Five American aircraft bomb the port and are shot down by the air defense; the attacks on Hanoi and Haiphong run on from this day.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 408. See [[cal.1967-04-24.vietnam-air-war]].'
      tags:
      - polity:drv
      - polity:us
      place: haiphong
- add:
    entry:
      id: cal.1967-05-05.vietnam-hanoi
      when: May 5
      date: '1967-05-05'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hanoi. The three forces guarding the capital's sky meet hundreds of American sorties and shoot down eight aircraft; the May raids aim at the Long Biên bridge and the Yên Phụ power plant.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 409.'
      tags:
      - polity:drv
      - polity:us
      place: hanoi
- add:
    entry:
      id: cal.1967-05-12.vietnam-hanoi
      when: May 12
      date: '1967-05-12'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hòa Lạc, west of Hanoi. The Vietnamese air force goes up and burns three F-4Ds; Colonel Norman Gaddis is taken. May 14 Hanoi's air defense shoots down five more.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 409. See [[cal.1967-04-24.vietnam-air-war]]. Check: the date of Gaddis''s capture, which the American record read does not give.'
      tags:
      - polity:drv
      - polity:us
      place: hoa-lac
- add:
    entry:
      id: cal.1967-05-19.vietnam-hanoi
      when: May 19
      date: '1967-05-19'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hồ Chí Minh's birthday. He sends eight baskets of flowers to the units with the best record in May. That morning the missile and antiaircraft units shoot down seven American aircraft; by the day's end Hanoi's defense has shot down ten, most falling where they were hit. After this day Hồ signs an order awarding the capital's forces the Independence Order, First Class, and writes a letter of praise.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 410. See [[cal.1967-05-19.vietnam-air-war]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      - ok:fields-time
      place: hanoi
- add:
    entry:
      id: cal.1967-06-16.vietnam-hanoi
      when: June 16
      date: '1967-06-16'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hàm Rồng, Thanh Hóa. The women militia platoon of Hoa Lộc, Hậu Lộc, with the antiaircraft gunners, shoot down an A-4D with infantry rifles. Oct. 14 and 24 the old men's militia platoon of Hoàng Trường, Hoàng Hóa, with rifles, burn two aircraft.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 416. Check: the place of the second action; the history names the commune. Two actions in a run.'
      tags:
      - polity:drv
      - polity:us
      place: thanh-hoa
- add:
    entry:
      id: cal.1967-08-11.vietnam-hanoi
      when: Aug. 11–23
      date: '1967-08-11'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hanoi. From noon Aug. 11 the Americans send seven carrier air wings in force against the capital and its surroundings; on Aug. 11, 12, 22 and 23 Antiaircraft Regiments 232, 212, 230 and 234, with the militia and self-defense forces, shoot down 22 aircraft. The Air Force's intelligence had seen the carriers move south in the first days of August.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 412–13. See [[cal.1967-08-11.vietnam]]. Check: the units against the days.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-time
      place: hanoi
- add:
    entry:
      id: cal.1967-09.vietnam-hanoi-2
      when: Sept.
      date: 1967-09
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Haiphong. The Americans put a large force on the city's roads and waterways to cut it off and stop supplies by sea from the socialist countries; the fighting is hard in the second half of September and early October. In September the city's three forces shoot down 31 aircraft, a record month for any province.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 413–14. Check: the days.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-at
      place: haiphong
- add:
    entry:
      id: cal.1967-10-24.vietnam-hanoi
      when: Oct. 24–28
      date: '1967-10-24'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Hanoi. Nearly 500 sorties by turns hit the Long Biên bridge, the Yên Phụ power plant, the airfields and air-defense sites in and outside the city. The night of Oct. 25 Nội Bài airfield is bombed; 1,600 people of Kim Anh and Đa Phúc districts fill the craters with the air defense.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 414. See [[cal.1967-10-24.vietnam-air-war]], [[cal.1967-10-25.vietnam-air-war]]. Check: the number of aircraft shot down, which the passage read does not give.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-time
      place: hanoi
- add:
    entry:
      id: cal.1968-05-31.vietnam-hanoi
      when: May 31
      date: '1968-05-31'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Cồn Cỏ island. The island's antiaircraft gunners hold their positions and fight the attacking aircraft.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 278. Check: the result; the passage read gives no count for the day. In May the missile regiment 238 shot down seven aircraft in succession (V, 278).'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1968-07.vietnam-hanoi
      when: July
      date: 1968-07
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Office's Military Party Committee re-forms the Saigon Party Committee, Võ Văn Kiệt secretary; the Southern Command hands all the inner-city districts to Sub-region 6.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 240. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1968-07-23.vietnam-hanoi
      when: July 23
      date: '1968-07-23'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Giồng Trôm, Bến Tre. After 5,000 rounds on Long Mỹ and Lương Phú, 20 warships bring the American 3d Brigade ashore; the province forces sink many boats. About 7 a.m., after B-52 carpet bombing, 14 helicopters land two companies of the 10th Regiment at Gò Trụ. Jul. 24 the rescue ships come to tow the damaged and 12 more are sunk.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 255–56. Check: the clock, whose it is; the history gives about 5 a.m. for the first landing and about 7 a.m. for the second.'
      tags:
      - polity:drv
      - polity:us
      place: ben-tre
      time: 1968-07-22T21:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1968-07-24.vietnam-hanoi-2
      when: July 24
      date: '1968-07-24'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Đồng Lộc junction, Hà Tĩnh. Ten girls of a women's youth-volunteer squad, Võ Thị Tần, Hồ Thị Cúc, Nguyễn Thị Nhỏ, Nguyễn Thị Xuân, Trần Thị Hường, Vũ Thị Hà, Võ Thị Hợi, Trần Thị Rạng, Dương Thị Xuân and Hà Thị Xanh, die keeping the road open under the bombing. The history says the Assembly and the State Council gave the squad the title Hero of the People's Armed Forces.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 283. From April to the year''s end the Americans dropped about 37,000 high-explosive and 5,000 magnetic bombs on the Đồng Lộc and Thượng Gia junctions (V, 277). Check: the clock, whose it is; the manner of death, which the passage read does not give; the year the title was given.'
      tags:
      - polity:drv
      - polity:us
      place: dong-loc
      time: 1968-07-24T09:00Z
      time_zone: Asia/Bangkok
