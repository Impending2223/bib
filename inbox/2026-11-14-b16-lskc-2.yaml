      date: 1966-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 5 sets up the front command for northern Bình Định: Giáp Văn Cương, commander of the 3d Division, commander; Trần Quang Khanh, Bình Định''s provincial secretary, political commissar.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 104. Made public: 2013. Check: the day.'
