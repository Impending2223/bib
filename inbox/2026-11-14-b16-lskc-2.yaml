    entry:
      id: cal.1967-04-13.vietnam-hanoi-2
      when: Apr. 13
      date: '1967-04-13'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Tĩnh Gia, Thanh Hóa. The coastal artillery group of Regiment 204 hits an enemy ship off the district's coast.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 418.'
      tags:
      - polity:drv
      place: thanh-hoa
- add:
    entry:
      id: cal.1967-05.vietnam-hanoi-2
      when: May
      date: 1967-05
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Center reorganizes the command for Huế, the key city of the Trị–Thiên front: the provincial committees and provincial commands dissolved, the district committees under the Regional Committee; groups on each direction, 4 for Phú Lộc and north of Hải Vân, 5 for Huế and its three outer districts, 6 for Phong Điền and Quảng Điền, 7 for Triệu Phong and Hải Lăng, under the Trị–Thiên Military Region; Group 31 under B5 for the zone from Route 9 to the demarcation line.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 69–70. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1967-06.vietnam-hanoi
      when: June
      date: 1967-06
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo decides to prepare a decisive blow, while the Americans are in a dilemma and wholly taken up with their election: to destroy campaign-level and strategic units, Americans and Saigon''s alike, and force an American defeat in the field.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 30–31. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      place: hanoi
- add:
    entry:
      id: cal.1967-07.vietnam-hanoi
      when: July–Aug.
      date: 1967-07
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The General Staff's Operations Department begins drawing the strategic plan for 1968 on the Politburo's resolution of June and the Military Committee's directive. Văn Tiến Dũng, the Chief of Staff, has the planning group, under Lê Ngọc Hiền, look for a way of fighting other than the traditional.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 31–32. Made public: 2013. Names: Văn Tiến Dũng. Check: the days.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:van-tien-dung
      - ok:fields-place
- add:
    entry:
      id: cal.1967-10-20.vietnam-hanoi
      when: Oct. 20–24
      date: '1967-10-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Politburo meets on the strategic plan for the winter, spring and summer of 1967–68, Trường Chinh presiding; Lê Duẩn and Võ Nguyên Giáp away for treatment abroad. Oct. 20, the intelligence and Operations reports; Oct. 21, Văn Tiến Dũng for the Military Committee on the plan to turn the main strategic attack into the cities, with a general offensive and uprising; the fronts report their plans; Oct. 23–24, the Politburo debates the chances of taking the cities and of an uprising. It adopts the line to prepare a general offensive and uprising, to be set off the same day and hour at Đà Nẵng and Saigon if it can be, the cities to be taken and if possible Thiệu, Kỳ or Westmoreland; a second front and a Provisional Revolutionary Government to follow; agrees to join the Lao in attacking Nậm Bạc. Trường Chinh asks that "three degrees of victory" be put as "cases." The question of the uprising is left for the next meeting.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 34–39. Made public: 2013. Names: Trường Chinh, Phạm Văn Đồng, Nguyễn Duy Trinh, Văn Tiến Dũng, Lê Đức Thọ, Lê Duẩn, Võ Nguyên Giáp, Thiệu, Kỳ, Westmoreland. Check: the place; the history does not name it. The time is the first day''s.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:truong-chinh
      - name:pham-van-dong
      - name:nguyen-duy-trinh
      - name:van-tien-dung
      - name:le-duc-tho
      - name:le-duan
      - name:vo-nguyen-giap
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      - name:westmoreland-william
      place: hanoi
- add:
    entry:
      id: cal.1967-10-27.vietnam-hanoi
      when: Oct. 27
      date: '1967-10-27'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Bình Long–Phước Long campaign opens: a battalion of Regiment 88 attacks the Phước Quả post. Oct. 28 night, Regiment 3 of the 9th Division attacks the Lộc Ninh district post, and sappers of the 9th and 7th Divisions raid the town hall of Lộc Ninh and Bình Long, collapsing two buildings and spoiling four guns.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 17–18. Check: the clock; the history does not say whose.'
      tags:
      - polity:drv
      - polity:us
      place: phuoc-long
      time: 1967-10-26T17:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1967-10-30.vietnam-hanoi
      when: Oct. 30
      date: '1967-10-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lộc Ninh. Regiment 2 of the 9th Division and Regiment 141 of the 7th Division, with artillery, attack by surprise the American mechanized battalion and the Saigon 2d Battalion, 9th Regiment, landed by helicopter Oct. 29–30 east of the airfield, at Mang Cải and at the Special Forces training school.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 18–19. Check: the clock; the history does not say whose.'
      tags:
      - polity:drv
      - polity:us
      place: loc-ninh
      time: 1967-10-30T12:30Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1967-11-01.vietnam-hanoi
      when: Nov. 1
      date: '1967-11-01'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lộc Ninh. That night the rocket regiment 96 and the 9th Division's mortars shell the airfield and the training school; Regiment 165 of the 7th Division and Battalion 3 of Regiment 3 attack the force at Mang Cải. Nov. 2 an American battalion lands by helicopter on hill 124, east of the junction of Routes 13 and 14.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 19. See [[cal.1967-10-29.vietnam-operations]].'
      tags:
      - polity:drv
      - polity:us
      place: loc-ninh
      time_range:
      - 1967-11-01T14:00Z
      - 1967-11-01T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-11-03.vietnam-hanoi
      when: Nov. 3
      date: '1967-11-03'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Đắk Tô I campaign opens, in the Western Highlands, under Major General Hoàng Minh Thảo, commander of the front, and Colonel Trần Thế Môn, commissar. Squad 7, Company 11, Battalion 6 (Tây Ninh) fights two American companies at the campaign's first strongpoint on the Ngọc Bờ Biêng saddle; Nov. 4 bombed with gasoline and chemicals; Nov. 5 the second strongpoint at Ngọc Tang lost to a company.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 22–23. See [[cal.1967-11-19.vietnam-operations]]. Names: Hoàng Minh Thảo.'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
- add:
    entry:
      id: cal.1967-11-06.vietnam-hanoi
      when: Nov. 6–7
      date: '1967-11-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đắk Tô. Regiments 320 and 66 of the 1st Division, drawn by the strongpoints, destroy or badly hurt three American companies around the hill area, shoot down two helicopters and put 300 out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 24. See [[cal.1967-11-03.vietnam-hanoi]].'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
- add:
    entry:
      id: cal.1967-11-11.vietnam-hanoi
      when: Nov. 11
      date: '1967-11-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Đắk Tô. Regiments 320 and 66 attack together by moving attack and destroy four companies of the 173d Airborne Brigade and the 1st Brigade, 4th Division: over 400 out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 24. The history says the units fought on the whole line Nov. 8–27 (V, 25).'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
- add:
    entry:
      id: cal.1967-11-17.vietnam-hanoi
      when: Nov. 17–20
      date: '1967-11-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Hill 875. Nov. 17 two battalions of the 173d climb it; Nov. 18 B-52s in turn; Nov. 19, with the Americans held at the foot by Company 7, Regiment 174, Đàm Văn Ngụy commanding, destroys the 2d Battalion by moving attack joined with strongpoints; Nov. 20 more killed and 12 aircraft shot down. Fighting goes on to Nov. 29, when both sides leave the field.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 26–28. See [[cal.1967-11-19.vietnam-operations]].'
      tags:
      - polity:drv
      - polity:us
      place: dak-to
- add:
    entry:
      id: cal.1967-11-23.vietnam-hanoi
      when: Nov. 23
      date: '1967-11-23'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tân Khai. That night Regiment 141 attacks and destroys an American company and 18 vehicles; Nov. 24 an American unit and a Saigon ranger company with armor counterattack and Regiment 141 destroys some of them.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 20.'
      tags:
      - polity:drv
