      when: May
      date: 1966-05
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Central Office's Military Party Committee sets up the Rừng Sác Special Military Zone, a mixed force of about a regiment, to block the Lòng Tàu river's neck, the main route of American supply into Saigon.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 222. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-06.vietnam-hanoi-2
      when: June, mid
      date: 1966-06
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: The Politburo and the Central Military Party Committee direct the battlefields to use the rainy season to prepare and build force and open a round of military action in all three strategic zones by the six modes, to beat the enemy's sweeps and pacification and spoil his preparations for the dry season.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 155. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      place: hanoi
      at: before 1966-06-11
- add:
    entry:
      id: cal.1966-06.vietnam-hanoi
      when: June
      date: 1966-06
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Central Military Party Committee decides to set up the Route 9–North Quảng Trị Front, B5, to open a new strategic direction against the weak side of the enemy: force the enemy to scatter into the mountains, destroy strategic forces with the North''s main force, help the Trị–Thiên delta, and block a land spread of the war into Military Region 4. At first Military Region 4''s Party committee and command run it, Colonel Nam Long commander, Colonel Quách Sỹ Kha commissar.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 190–91, 196. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-06-06.vietnam-hanoi-3
      when: June 6
      date: '1966-06-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Long. Local forces attack five posts around the town, two Saigon companies in the open north of the airfield put out of action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 162.'
      tags:
      - polity:drv
      - polity:us
      place: binh-long
- add:
    entry:
      id: cal.1966-06-08.vietnam-hanoi
      when: June 8
      date: '1966-06-08'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Tàu Ô bridge and Cần Đâm, Route 13. Regiment 2 of the 9th Division ambushes a convoy of the American 1st Division''s 3d Brigade with two mechanized troops: 40 vehicles destroyed or damaged (12 M41 tanks, 19 M113s), nearly 500 out of action, eight aircraft shot down. Regiment 2 withdraws at 6 p.m.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 162–63. Check: the clock; the history gives "khoảng 13 giờ".'
      tags:
      - polity:drv
      - polity:us
      place: tau-o
      time: 1966-06-08T05:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1966-06-13.vietnam-hanoi
      when: June 13
      date: '1966-06-13'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Office's command forms the 7th Infantry Division of Regiments 52, 141 and 165, at the Phước Long base.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 219. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      place: phuoc-long
- add:
    entry:
      id: cal.1966-06-29.vietnam-hanoi
      when: June 29
      date: '1966-06-29'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cầu Nhi, Route 1 north of Huế. Battalion 2 and the 6th Regiment's engineers and fire units ambush a convoy of 26 GMC trucks and 2 M113s sent to Route 9; in about 15 minutes all 28 vehicles burn and a Saigon marine battalion is nearly destroyed.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 190. Check: the place and the units.'
      tags:
      - polity:drv
      - polity:us
      place: hue
- add:
    entry:
      id: cal.1966-06-30.vietnam-hanoi-3
      when: June 30
      date: '1966-06-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cần Lê and Trảng Ba Nghì, Route 13 near Lộc Ninh. Regiment 1 of the 9th Division, commander Bùi Thanh Vân, ambushes a convoy from Hớn Quản under eight gunships: 43 vehicles destroyed, mostly tanks and M113s, nearly 300 Americans out of action; firing stops at 7 p.m.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 163–64. Check: the clock; the history says only that the firing stopped at 7 p.m.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-time
      place: loc-ninh
- add:
    entry:
      id: cal.1966-08.vietnam-hanoi
      when: Aug.
      date: 1966-08
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Office and the Military Party Committee call the second conference on political work in the South's liberation armed forces.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 224. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-09.vietnam-hanoi
      when: Sept.
      date: 1966-09
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Central Military Party Committee authorizes Military Region 4 to form a forward Party committee and command, Front X, for the Route 9–North Quảng Trị Front: Colonel Nam Long commander, Colonel Quách Sỹ Kha commissar, Colonel Chu Phương Đới (324th Division) and Colonel Nguyễn Tiến Lợi deputies; Trương Chí Công and Hồ Sỹ Thản added to the front''s Party committee.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 196–97. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-10.vietnam-hanoi
      when: Oct.
      date: 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo, judges that the Americans will push the war in 1967 and 1968, 1967 the year of weight for both sides, and sets the task: in the South beat the second strategic counteroffensive, keep the initiative, build toward a general offensive and general uprising; in the North build, fight, keep the corridors open, be ready for a landing in southern Military Region 4 and Middle and Lower Laos. Fight and talk: add the diplomatic struggle to the military and political. It adopts the Central Military Party Committee''s six modes of fighting.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 232–34. See [[cal.1966-02.vietnam-hanoi]]. Made public: 2013. Check: the days; the history says "tháng 10-1966".'
      tags:
      - polity:drv
      - vis:only:drv
      place: hanoi
- add:
    entry:
      id: cal.1966-10.vietnam-hanoi-2
      when: Oct.
      date: 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Central Office''s third all-South conference on guerrilla war sums up the guerrilla movement: from small wearing-down to larger destruction of units; guerrillas with simple arms shoot down thousands of aircraft and destroy thousands of vehicles; "belts to kill the Americans"; blockade of big posts and cutting of roads over wide areas for long periods; the movement entering the contested zones.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 235. Made public: 2013. Check: the days.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-10-18.vietnam-hanoi
      when: Oct. 18–Dec. 6
      date: '1966-10-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Western Highlands' Sa Thầy campaign, in step with Eastern Nam Bộ, beats Operation Paul Revere IV of the American 4th Division.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 249. Check: the units and the days of fighting; the history gives the campaign''s span.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1966-10-20.vietnam-hanoi
      when: Oct. 20
      date: '1966-10-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Presidium of the Liberation Front''s Central Committee appeals: the Americans plan a new counteroffensive in the coming dry season to pacify the people and force talks on terms of surrender; the South to make a supreme effort, break the Americans'' and puppets'' new plan and win a great victory in the winter–spring of 1966–67.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 241 (the appeal, quoted). Check: how it was issued and published.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1967-01.vietnam-hanoi
      when: Jan.
      date: 1967-01
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Lê Duẩn''s letter to the Saigon–Gia Định Zone Committee: at a given stage the revolutionary war, military and political, will grow into a general offensive and general uprising to beat the enemy''s military and political force in all the areas he holds, the main direction the cities, and take power whole for the people. In the war''s last stage, hard military and political blows in the cities, against one of the enemy''s props, will decide the defeat of the American policy of aggression.'
      n: 'Lê Duẩn, *Thư vào Nam* (Nxb. Sự thật, Hà Nội, 1985), 163–64, quoted in [[w.lich-su-khang-chien-chong-my]], V, 32–33. Made public: 1985. Names: Lê Duẩn. Check: the day; the history gives the month. The letter is the history''s source for the idea of the 1968 plan.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:le-duan
      - ok:fields-place
- add:
    entry:
      id: cal.1967-02.vietnam-hanoi-2
      when: Feb.
      date: 1967-02
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Central Military Party Committee''s directive to the air and coastal defense forces of the North: beat the escalation by air and sea; guarding the roads is among the armed forces'' chief tasks in beating the bombing war.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 402. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1967-03.vietnam-hanoi-2
      when: Mar.
      date: 1967-03
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Defense Ministry dissolves the Air Defense Command and forms three arms commands in its place: radar, air force, missiles.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 402. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1967-03.vietnam-hanoi-3
      when: Mar.
      date: 1967-03
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Defense Ministry shifts the Navy's main work to the defense of the Haiphong coast and the northeast sea.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 417. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1967-03-20.vietnam-hanoi-2
      when: Mar. 20–21
      date: '1967-03-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam-air-war
      c: 'Dốc Miếu, hill 241 and Cồn Tiên, south of the Bến Hải. Regiment 164, towed guns of Military Region 4 firing from the north bank, opens on the Marines'' base at Dốc Miếu after the Americans lift in 149 loads of troops and five heavy guns by helicopter: 2,000 105 and 130 mm rounds. A Vĩnh Linh mortar company on the south bank adds hundreds; rockets and mortars put 1,000 rounds on hill 241. The night of Mar. 20 Battalion 4 of Regiment 84 crosses the river, marches 20 kilometers to the sand at Cường Gián and fires hundreds of H12 rockets at the Marines at Đông Hà; south-bank guns shell Tân Lâm, Cam Lộ and Cửa Việt. At dawn Mar. 21 the guns hit the trucks of troops sent to relieve the base. Hundreds of Americans out of action. The first time the North''s forces fight openly in the South''s battle.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 404–06. Hồ Chí Minh had wired the regiment before the battle: "the first battle you must win" (IV, 404). Names: Hồ Chí Minh. Check: the date of Hồ''s wire; the history says only "before going in". The time is the first day''s, the history''s "chiều ngày 20-3-1967".'
      tags:
      - polity:drv
      - polity:us
      - name:ho-chi-minh
      place: ben-hai-river
      time_range:
      - 1967-03-20T04:00Z
      - 1967-03-20T10:00Z
      time_band: afternoon
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1967-04-27.vietnam-hanoi
      when: Apr. 27
      date: '1967-04-27'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: That night artillery fires together on Cồn Tiên, Dốc Miếu, Dốc Sỏi, Gio Linh, Đông Hà and Cửa Việt, hurting many, destroying vehicles and burning some fuel and ammunition stores.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 406.'
      tags:
      - polity:drv
      - polity:us
      place: gio-linh
      time_range:
      - 1967-04-27T14:00Z
      - 1967-04-27T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
