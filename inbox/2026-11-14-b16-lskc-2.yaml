    entry:
      id: cal.1968-08-13.vietnam-hanoi
      when: Aug. 13
      date: '1968-08-13'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Lộ Tẻ airfield, Cần Thơ. Battalion 307 with a Region sapper unit takes the field by surprise with grenades and charges: nearly 60 aircraft of all kinds destroyed or damaged.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 250.'
      tags:
      - polity:drv
      - polity:us
      place: can-tho
      time_range:
      - 1968-08-13T14:00Z
      - 1968-08-13T16:00Z
