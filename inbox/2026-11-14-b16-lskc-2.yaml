      id: cal.1965-12-08.vietnam-hanoi
      when: Dec. 8–10
      date: '1965-12-08'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Việt An. After twelve days of siege the ARVN 5th Task Force and two armored squadrons open Operation Liên Kết 18 to relieve the post; Dec. 9 the Saigon force is beaten and the American command lands five Marine battalions on the shore and in the hills, Dec. 9 and 10, at An Lý, Châu Xuân, Cẩm La, La Ngà and Chiêm Sơn.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 63. See [[cal.1965-11-16.vietnam-hanoi]]. Check: the first landing days; the history gives 9, 10, 12 and 15.'
      tags:
      - polity:drv
      - polity:us
      place: viet-an
