      - vietnam-operations
      c: Cát Sơn, Bình Định. The Liberation Army attacks the Americans.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 52. Check: the force and the result; the history gives neither.'
      tags:
      - polity:drv
      - polity:us
