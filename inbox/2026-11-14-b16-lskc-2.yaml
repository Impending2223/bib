      - vietnam
      - vietnam-operations
      c: The Politburo and the Central Military Party Committee direct the battlefields to use part of the main and regional forces to beat the enemy's sweeps and pacification and hold the bases and the posture.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 154. Made public: 2013. Check: the day.'
