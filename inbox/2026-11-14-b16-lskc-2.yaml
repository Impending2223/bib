      c: Việt An, Quảng Tín, at the junction of Route 16 and the Quế Sơn road, 12 kilometers east of Hiệp Đức. Regiment 1 of Military Region 5 begins to surround the post. The siege runs twelve days and the post is not relieved.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 63.'
