      when: Nov. 28–29
      date: '1967-11-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bù Đốp. The night of Nov. 28 Regiment 2 of the 9th Division attacks the district post. Nov. 29 the Americans land the 1st Battalion, 28th Infantry, two Saigon battalions, a battery and a mechanized company to the southeast and north of it. At 9 p.m. the 9th Division's rocket regiment fires on them and Regiments 1 and 2 attack from north and east.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 20. Check: the clock; the history does not say whose.'
