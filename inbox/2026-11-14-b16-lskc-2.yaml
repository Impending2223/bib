      - vietnam-operations
      c: Gò Đậu, Thủ Dầu Một. Forty-five men of B16 with provincial sappers and the 9th Division's sappers enter the Saigon armored regiment's base in four columns, with inside help.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 97. Check: the result and the clock; the history gives neither whose clock nor what was taken.'
      tags:
      - polity:drv
      place: go-dau
      time: 1966-03-23T11:00Z
      time_zone: Asia/Ho_Chi_Minh
