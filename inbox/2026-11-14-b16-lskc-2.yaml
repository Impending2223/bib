      place: can-tho
- add:
    entry:
      id: cal.1966-02.vietnam-hanoi
      when: Feb.
      date: 1966-02
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Central Military Party Committee meets on the situation in the South and resolves on the military task: raise action by the main force and by militia and guerrillas, to destroy and break up a large part of the American and Saigon forces, a few regiments and some American battalions; the forest and mountain theaters the ground for destroying the enemy, the Western Highlands and the Eastern Nam Bộ first; Region 5 pushed; Trị–Thiên made an important strategic direction. It sets six strategic modes of fighting: main-force campaigns; guerrilla war; attacks on bases, depots, airfields, ports and headquarters; cutting the enemy''s roads and waterways; action in the towns, from small attacks with political struggle to large attacks with uprising; and combat joined to political struggle and troop proselytizing, the Saigon army''s above all, on a strategic scale.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 76, 91–92. Made public: 2013. Check: the day; the history gives only "tháng 2-1966".'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-02-24.vietnam-hanoi
      when: Feb. 24
      date: '1966-02-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Nhà Đỏ and Bông Trang, north of Saigon. The 9th Division fires mortars and recoilless guns on the American 1st Brigade''s clusters, then storms in from three sides; fighting to 6:30 a.m.: two infantry battalions and two armored squadrons hurt, the brigade''s command post destroyed. The best result of the dry season in Eastern Nam Bộ. Operation Rolling Stone, from Feb. 22, is beaten; Mar. 5 Regiment 2 hurts another battalion at Bà Nghĩa on Route 16.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 93–94. Check: the clock; the history does not say whose.'
      tags:
      - polity:drv
      - polity:us
      place: nha-do
      time: 1966-02-23T17:20Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1966-03-04.vietnam-hanoi
      when: Mar. 4–6
      date: '1966-03-04'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: West Sơn Tịnh, Quảng Ngãi. After an hour of bombing the Americans land the 1st Battalion, 2d Marines and the 2d Battalion, 7th Marines west of hill 62 and Gò Cát market at 8 a.m.; the fight runs to 5 a.m. Mar. 5. Mar. 5 two columns from Khánh Mỹ and Cà Ty hill attack hill 62 and Hòa Vinh, and Regiment 1 is ordered out at 3:30 p.m. Mar. 6 the Americans end the largest search operation they have made in Quảng Ngãi and leave west Sơn Tịnh.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 114–16.'
      tags:
      - polity:drv
      - polity:us
      place: quang-ngai-province
      time: 1966-03-04T00:00Z
      time_zone: Asia/Ho_Chi_Minh
