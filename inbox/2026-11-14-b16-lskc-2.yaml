- add:
    entry:
      id: cal.1964.vietnam-hanoi-3
      when: 1964, early
      date: '1964'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The all-North people's air defense conference meets. It takes up the three-force people's air defense system and the plan to evacuate and disperse the people and the factories from the places the enemy is likely to bomb.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 344. Made public: 2013. Check: the day and the place; the history says only "early 1964".'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1964-01
- add:
    entry:
      id: cal.1964-07.vietnam-hanoi
      when: July
      date: 1964-07
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Navy goes on combat readiness: it steps up patrols of the coastal waters and sets up a forward command in the sea area of Military Region IV.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 344. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1964.vietnam-hanoi
      when: 1964, late
      date: '1964'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: The Politburo and the Central Military Party Committee decide to open the Western Highlands Front, to draw an American force into the forests and mountains if one comes south. The Route 9–north Quảng Trị front is not opened yet, so as not to provoke the Americans into making the war a limited one too soon.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 34. Made public: 2013. Check: the day; the history says "cuối năm 1964".'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1964-09
- add:
    entry:
      id: cal.1964.vietnam-hanoi-2
      when: 1964, late
      date: '1964'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The northern main-force regiments are ordered secretly into the South's battlefields.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 34. Made public: 2013. Check: the day; the regiments are not named.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1964-09
- add:
    entry:
      id: cal.1965-01.vietnam-hanoi-2
      when: Jan.
      date: 1965-01
      thread: vietnam-hanoi
      c: 'The National Defense Council, Hồ Chí Minh presiding, sets the course of defense work in the North: defense, order and combat readiness raised; armed forces of main force, regional troops, militia, self-defense and reserves built strong enough to beat the Americans; economy and defense joined, the country''s economic and defense potential enlarged. The State decides to form some modern-equipped corps and new service arms.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378. Made public: 2013. Names: Hồ Chí Minh. Check: the day; "tháng 1-1965" only.'
      tags:
      - polity:drv
      - vis:only:drv
      - name:ho-chi-minh
      - ok:fields-place
- add:
    entry:
      id: cal.1965-04-10.vietnam-hanoi
      when: Apr. 10
      date: '1965-04-10'
      thread: vietnam-hanoi
      also:
      - vietnam-congress
      c: 'The National Assembly''s resolution: in wartime its Standing Committee to decide the state plan, approve the budget and its accounts, fix taxes, approve the boundaries of provinces, and call the Assembly when it cannot meet in regular session.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 348. To check: the resolution''s text, *Công báo* or the Assembly''s records.'
      tags:
      - polity:drv
      place: hanoi
- add:
    entry:
      id: cal.1965-04-10.vietnam-hanoi-2
      when: Apr. 10
      date: '1965-04-10'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh, at the Assembly, restates the Government''s position: defend independence, sovereignty, unity and territorial integrity. "Nước Việt Nam là một, dân tộc Việt Nam là một" (Vietnam is one, the Vietnamese people are one).'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 323 (from Hồ Chí Minh, *Toàn tập*, XIV, 532). See [[cal.1965-04-10.vietnam-hanoi]]. The history sets it after the Government''s four points of Apr. 8 ([[w.lich-su-khang-chien-chong-my]], V, 322–23); see [[cal.1965-04-08.vietnam-hanoi-3]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      place: hanoi
- add:
    entry:
      id: cal.1965-04-20.vietnam-hanoi
      when: Apr. 20
      date: '1965-04-20'
      thread: vietnam-hanoi
      c: 'The National Assembly, the Third Assembly''s second session, passes amendments to the Military Service Law: service with the colors lengthened as the fighting requires.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378.'
      tags:
      - polity:drv
      place: hanoi
- add:
    entry:
      id: cal.1965-04-21.vietnam-hanoi
      when: Apr. 21
      date: '1965-04-21'
      thread: vietnam-hanoi
      c: The National Assembly's Standing Committee decides a partial mobilization, its decision no. 102-NQ/TVQH.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 378–79 (the decision named in Hồ Chí Minh''s order of May 5). See [[cal.1965-04-20.vietnam-hanoi]].'
      tags:
      - polity:drv
      place: hanoi
- add:
    entry:
      id: cal.1965-04-25.vietnam-hanoi
      when: Apr. 25
      date: '1965-04-25'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Thanh Hóa forms the first province's anti-American shock youth team, 1,200 men.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 424. Check: the place; the history names the province only.'
      tags:
      - polity:drv
      place: thanh-hoa
- add:
    entry:
      id: cal.1965-04-26.vietnam-hanoi
      when: Apr. 26
      date: '1965-04-26'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Central Military Party Committee forms a Transport Department under the army's General Logistics Department; military transport in the North reorganized and enlarged.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 430. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-04-30.vietnam-hanoi
      when: Apr. 30
      date: '1965-04-30'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Prime Minister''s directive to the Ministries of Transport, Defense and Labor and the provincial chairmen of Zone 4: restore the bridges, roads and ferry landings destroyed, and prepare materials, techniques and labor against further raids.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 422. To check: the directive, Prime Minister''s Office, Apr. 30, 1965.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-02.vietnam-hanoi
      when: May 2–6
      date: '1965-05-02'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Lò Gò, northwest Tây Ninh. The first congress of heroes and emulation fighters of the southern liberation armed forces. The Liberation Front''s Central Committee launches the emulation drive "Quyết chiến, quyết thắng giặc Mỹ" (resolved to fight and beat the Americans); Nguyễn Chí Thanh, of the Politburo, deputy secretary of the Central Military Party Committee: fight the Americans and the way to beat them will be found.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 45. Names: Nguyễn Chí Thanh.'
      tags:
      - polity:drv
      - name:nguyen-chi-thanh
      place: lo-go
- add:
    entry:
      id: cal.1965-05-05.vietnam-hanoi-2
      when: May 5
      date: '1965-05-05'
      thread: vietnam-hanoi
      c: 'Hồ Chí Minh signs order no. 47-LCT, the partial mobilization: part of the reserve officers, noncommissioned officers and men, and part of the army''s reservists not yet served, called up. The Government Council to plan it, defense raised as far as needed, the economy kept to the state plan.'
      n: '*Lệnh của Chủ tịch nước Việt Nam Dân chủ Cộng hòa*, no. 47-LCT, Hanoi, May 5, 1965, printed in [[w.lich-su-khang-chien-chong-my]], IV, 379. See [[cal.1965-04-21.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - polity:drv
      - name:ho-chi-minh
      place: hanoi
- add:
    entry:
      id: cal.1965-05-16.vietnam-hanoi
      when: May 16
      date: '1965-05-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Liberation Army raids Biên Hòa airfield. The Americans admit 11 B-57s and 4 jets destroyed, 25 other aircraft heavily damaged, 21 American dead and 64 wounded.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 45. The calendar holds the same day''s explosions at Biên Hòa, [[cal.1965-05-16.vietnam-operations]]. Check: whether this is the explosion the American record calls accidental; the history says a raid and gives the American admission without a source.'
      tags:
      - polity:drv
      - polity:us
      place: bien-hoa
- add:
    entry:
      id: cal.1965-05-26.vietnam-hanoi
      when: May 26
      date: '1965-05-26'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'Núi Thành, west of Chu Lai. Company 2 of Battalion 70, Quảng Nam, with a sapper team, storms the American Marine company on hills 49 and 50: 140 out of action, all arms taken, the first American company destroyed in the war. Ordered by Military Region 5''s directive of May 10.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 46–48 (the directive of May 10, 1965, from the Region 5 archive; the attack began 0:30, after the wire was cut on hill 49; hill 50 held by hand-to-hand fighting, 20 minutes). Check: the clock; the history does not say whose, and Marine records give the Americans'' losses.'
      tags:
      - polity:drv
      - polity:us
      place: nui-thanh
      time: 1965-05-25T16:30Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-06-21.vietnam-hanoi
      when: June 21
      date: '1965-06-21'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Prime Minister's directive no. 71-TTg formally sets up the youth shock force against the Americans, its units held centrally, the young of the North sent to the transport front on the main routes.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 423.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-06-30.vietnam-hanoi
      when: June 30
      date: '1965-06-30'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Government Council''s decision on transport: every branch and level to take it as the central task of the Party and the Government.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 423.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-07.vietnam-hanoi
      when: July, mid
      date: 1965-07
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Secretariat decides how to assign cadres to transport.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 423 ("trung tuần tháng 7-1965"). Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1965-07-11
- add:
    entry:
      id: cal.1965-07.vietnam-hanoi-2
      when: July
      date: 1965-07
      thread: vietnam-hanoi
      c: 'The cadre conference the Secretariat called meets on turning the leadership of the two strategic tasks: Party committees at every level to change how they think and work to meet the new situation.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 347. Made public: 2013. Check: the days.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-08.vietnam-hanoi
      when: Aug.
      date: 1965-08
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'COSVN''s Standing Committee, its resolution: destroy and break up the Saigon army on a large scale, its main force above all; ring the American bases, destroying and wearing down the Americans.'
      n: '*Nghị quyết Thường vụ Trung ương Cục*, August 1965 (a copy in the Military History Institute), quoted in [[w.lich-su-khang-chien-chong-my]], IV, 61 and n.2. Made public: 2013. Check: the day; the history gives the month.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-08-03.vietnam-hanoi
      when: Aug. 3
      date: '1965-08-03'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Liberation Front's Central Committee declares the 14 million people of the South will fight to the end whether the Americans send 50,000 or 500,000, and drive them out.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 43 n.1 ("Tuyên bố của Ủy ban Trung ương Mặt trận Dân tộc giải phóng miền Nam Việt Nam, ngày 3-8-1965"). Check: where it was issued and how it was published.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-08-05.vietnam-hanoi-2
      when: Aug. 5
      date: '1965-08-05'
      thread: vietnam-hanoi
      c: 'The Prime Minister''s directive on education: the schools turned to serve the political task, each in its own work, as the new situation requires.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 365.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-08-10.vietnam-hanoi
      when: Aug. 10
      date: '1965-08-10'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Xích Thổ and Đồng Giao, Ninh Bình. Missile units with antiaircraft artillery fight American aircraft and shoot down several.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 388 (Forward Group 2). Check: the number of aircraft; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-08-13.vietnam-hanoi
      when: Aug. 13
      date: '1965-08-13'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Xích Thổ and Đồng Giao, Ninh Bình. Missile units with antiaircraft artillery fight American aircraft again.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 388 (Forward Group 2). See [[cal.1965-08-10.vietnam-hanoi]]. Check: the number of aircraft; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-08-24.vietnam-hanoi
      when: Aug. 24
      date: '1965-08-24'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Xích Thổ and Đồng Giao, Ninh Bình. Missile units with antiaircraft artillery fight American aircraft a third time.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 388 (Forward Group 2). See [[cal.1965-08-10.vietnam-hanoi]]. Check: the number of aircraft; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-09-02.vietnam-hanoi
      when: Sept. 2
      date: '1965-09-02'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Liberation Army's 3d and 9th Infantry Divisions formed, in the South.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 37 n.1 (five divisions formed in 1965; the southern main force, eleven regiments and fifteen battalions in 1964, five divisions and eleven regiments by the year''s end, 37). Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-09-18.vietnam-hanoi
      when: Sept. 18
      date: '1965-09-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thuận Ninh, Bình Định. The Liberation Army attacks the Americans.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 52. Check: the force and the result; the history gives neither.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1965-09-20.vietnam-hanoi
      when: Sept. 20
      date: '1965-09-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Liberation Army's 2d Infantry Division formed, in the South.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 37 n.1. See [[cal.1965-09-02.vietnam-hanoi]]. Made public: 2013.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-10.vietnam-hanoi
      when: Oct.
      date: 1965-10
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'The Politburo''s resolution on securing transport in the new situation: the whole people roused to keep the roads open; the professional transport forces the core, the army''s engineers, logistics, transport and air defense the shock troops.'
      n: '*Nghị quyết Về công tác bảo đảm giao thông vận tải trong tình hình mới*, October 1965, quoted in [[w.lich-su-khang-chien-chong-my]], IV, 424. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-10.vietnam-hanoi-2
      when: Oct.
      date: 1965-10
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: The Government Council sets up the Central Transport Coordination Board, Phạm Hùng, of the Politburo, Deputy Prime Minister, at its head.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 426. Names: Phạm Hùng. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
