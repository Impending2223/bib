      c: The Americans end the first push on Chợ Cát, held by Regiment 22 and the guerrillas, after sappers drop a span of the Bồng Sơn bridge the night of Feb. 4, cutting Route 1.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 107. Check: the units; the history also lists night raids Feb. 2 on Hòa Hội helicopter field and the Koreans at Phù Ly bridge, and Feb. 3 on about ten guns at Đèo Nhông and Phù Mỹ.'
