      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cẩm Khê market, Quảng Tín. Regiment 1''s Battalions 90 and 70 attack the Americans packed into the market, Battalion 60 blocking from the north; they are beaten off the retreat road to Tam Kỳ. The fight ends at 3 p.m. Dec. 18. Lê Hữu Trữ, the regiment commander: "hold the Americans by the belt."'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 63–64. See [[cal.1965-12-08.vietnam-hanoi]]. Check: the first day; the history gives landings on Dec. 12 and 15.'
