      c: An Lão valley, Bình Định. Three American air-cavalry battalions and a Saigon airborne battalion land by helicopter, the first Cánh Trắng (White Wing) operation. Feb. 11, guerrillas shoot down eight helicopters.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 108.'
