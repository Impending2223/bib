      c: Cánh Trắng II, Kim Sơn valley, Hoài Ân. A battalion lands at Đá Tượng stream and Battalion 1 of Regiment 1 stops it. Feb. 16 Regiment 12 destroys nearly two companies at Lộc Giang; Feb. 17 nearly a company at Suối Sùng; Feb. 18 Regiment 2 stops a battalion at Đồi Tranh, 150 killed; Feb. 19 a company at height 275.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 109–10. Check: the units and the days of each action; the history gives them in a run.'
