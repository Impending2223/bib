      date: '1966-06-08'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Tàu Ô bridge and Cần Đâm, Route 13. Regiment 2 of the 9th Division ambushes a convoy of the American 1st Division''s 3d Brigade with two mechanized troops: 40 vehicles destroyed or damaged (12 M41 tanks, 19 M113s), nearly 500 out of action, eight aircraft shot down. Regiment 2 withdraws at 6 p.m.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 162–63. Check: the clock; the history gives "khoảng 13 giờ".'
      tags:
      - polity:drv
      - polity:us
      place: tau-o
      time: 1966-06-08T05:00Z
      time_zone: Asia/Ho_Chi_Minh
