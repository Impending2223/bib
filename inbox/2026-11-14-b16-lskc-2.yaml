      when: Oct. 14
      date: '1965-10-14'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cát Hiệp, Bình Định. The Liberation Army attacks the Americans.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 52. See [[cal.1965-10-10.vietnam-hanoi]]. Check: the force and the result; the history gives neither.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1965-10-24.vietnam-hanoi
      when: Oct. 24
      date: '1965-10-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Liberation Army artillery fires on the airfields at Đà Nẵng and Chu Lai: 163 aircraft of all kinds destroyed or damaged, many Americans killed.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 52. Check: the date, the count and the units; the calendar holds an attack on the Marines'' air installations at Đà Nẵng and Chu Lai on Oct. 27, [[cal.1965-10-27.vietnam-operations]].'
