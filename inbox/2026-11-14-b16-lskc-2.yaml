      when: Dec. 2
      date: '1967-12-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Tàu Ô bridge, on the Hớn Quản road. That night Battalion 2 of Regiment 141 attacks the American cluster: a company and 14 vehicles destroyed.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 21.'
      tags:
      - polity:drv
      - polity:us
