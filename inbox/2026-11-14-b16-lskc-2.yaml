      id: cal.1965-05-22.vietnam-hanoi
      when: May 22
      date: '1965-05-22'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: American aircraft bomb two Vietnamese–Soviet fishing boats 15 kilometers off the coast at Hải Thịnh, Hải Hậu, Nam Định; one catches fire.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 384. Check: the place; the history names the commune, not the boats.'
