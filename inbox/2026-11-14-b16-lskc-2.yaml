      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Central Office's Military Party Committee sets up the Rừng Sác Special Military Zone, a mixed force of about a regiment, to block the Lòng Tàu river's neck, the main route of American supply into Saigon.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 222. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
