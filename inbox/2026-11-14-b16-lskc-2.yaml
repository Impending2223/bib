      when: Mar. 16
      date: '1966-03-16'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bầu Sắn, in Silver City. The Liberation Army hits the Americans massed there: three companies out of action, five helicopters shot down.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 96–97. The operation Silver City, Mar. 7–24, [[w.lich-su-khang-chien-chong-my]], IV, 96. Check: the units.'
      tags:
      - polity:drv
      - polity:us
