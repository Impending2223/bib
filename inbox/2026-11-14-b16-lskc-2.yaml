      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 9 artillery fires mortars at Trà Nóc airfield: 65 aircraft damaged.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 99.'
