      when: Apr. 1
      date: '1966-04-01'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rừng Lá, north of Bình Giã. Regiment 3 attacks the American 173d Airborne Brigade and badly hurts a battalion.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 95.'
      tags:
      - polity:drv
      - polity:us
      place: binh-gia
- add:
    entry:
      id: cal.1966-04.vietnam-hanoi-2
      when: Apr.
      date: 1966-04
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Politburo and the Central Military Party Committee meet on the dry season''s results and decide to split Trị–Thiên from Region 5: a Trị–Thiên Regional Committee over Quảng Trị, Thừa Thiên and Huế, under the Central Committee and Politburo, the Military Committee directing it; Trị–Thiên Military Region under it, Major General Trần Văn Quang, alternate member of the Central Committee, secretary and commander. Its task: destroy most of the Saigon army, some of the Americans, prepare the cities for a general offensive and uprising, cut the enemy''s roads, build ours, and be ready for an American spread of the war onto Laos.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 185–88. Made public: 2013. Names: Trần Văn Quang. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
