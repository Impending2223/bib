      date: 1966-06
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: The Politburo and the Central Military Party Committee direct the battlefields to use the rainy season to prepare and build force and open a round of military action in all three strategic zones by the six modes, to beat the enemy's sweeps and pacification and spoil his preparations for the dry season.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 155. Made public: 2013. Check: the day.'
