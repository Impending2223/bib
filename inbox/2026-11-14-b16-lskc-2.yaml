- add:
    entry:
      id: cal.1966-06-29.vietnam-hanoi
      when: June 29
      date: '1966-06-29'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cầu Nhi, Route 1 north of Huế. Battalion 2 and the 6th Regiment's engineers and fire units ambush a convoy of 26 GMC trucks and 2 M113s sent to Route 9; in about 15 minutes all 28 vehicles burn and a Saigon marine battalion is nearly destroyed.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 190. Check: the place and the units.'
      tags:
      - polity:drv
      - polity:us
      place: hue
- add:
    entry:
      id: cal.1966-06-30.vietnam-hanoi-3
      when: June 30
      date: '1966-06-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cần Lê and Trảng Ba Nghì, Route 13 near Lộc Ninh. Regiment 1 of the 9th Division, commander Bùi Thanh Vân, ambushes a convoy from Hớn Quản under eight gunships: 43 vehicles destroyed, mostly tanks and M113s, nearly 300 Americans out of action; firing stops at 7 p.m.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 163–64. Check: the clock; the history says only that the firing stopped at 7 p.m.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-time
      place: loc-ninh
- add:
    entry:
      id: cal.1966-08.vietnam-hanoi
      when: Aug.
      date: 1966-08
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Central Office and the Military Party Committee call the second conference on political work in the South's liberation armed forces.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 224. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-09.vietnam-hanoi
      when: Sept.
      date: 1966-09
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Central Military Party Committee authorizes Military Region 4 to form a forward Party committee and command, Front X, for the Route 9–North Quảng Trị Front: Colonel Nam Long commander, Colonel Quách Sỹ Kha commissar, Colonel Chu Phương Đới (324th Division) and Colonel Nguyễn Tiến Lợi deputies; Trương Chí Công and Hồ Sỹ Thản added to the front''s Party committee.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 196–97. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-10.vietnam-hanoi
      when: Oct.
      date: 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Politburo, in Hanoi, judges that the Americans will push the war in 1967 and 1968, 1967 the year of weight for both sides, and sets the task: in the South beat the second strategic counteroffensive, keep the initiative, build toward a general offensive and general uprising; in the North build, fight, keep the corridors open, be ready for a landing in southern Military Region 4 and Middle and Lower Laos. Fight and talk: add the diplomatic struggle to the military and political. It adopts the Central Military Party Committee''s six modes of fighting.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 232–34. See [[cal.1966-02.vietnam-hanoi]]. Made public: 2013. Check: the days and the place; the history says "tháng 10-1966".'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-10.vietnam-hanoi-2
      when: Oct.
      date: 1966-10
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Central Office''s third all-South conference on guerrilla war sums up the guerrilla movement: from small wearing-down to larger destruction of units; guerrillas with simple arms shoot down thousands of aircraft and destroy thousands of vehicles; "belts to kill the Americans"; blockade of big posts and cutting of roads over wide areas for long periods; the movement entering the contested zones.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 235. Made public: 2013. Check: the days.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1966-10-18.vietnam-hanoi
      when: Oct. 18–Dec. 6
      date: '1966-10-18'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Western Highlands' Sa Thầy campaign, in step with Eastern Nam Bộ, beats Operation Paul Revere IV of the American 4th Division.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 249. Check: the units and the days of fighting; the history gives the campaign''s span.'
      tags:
      - polity:drv
      - polity:us
- add:
    entry:
      id: cal.1966-10-20.vietnam-hanoi
      when: Oct. 20
      date: '1966-10-20'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Presidium of the Liberation Front''s Central Committee appeals: the Americans plan a new counteroffensive in the coming dry season to pacify the people and force talks on terms of surrender; the South to make a supreme effort, break the Americans'' and puppets'' new plan and win a great victory in the winter–spring of 1966–67.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 241 (the appeal, quoted). Check: how it was issued and published.'
      tags:
      - polity:drv
