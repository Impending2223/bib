    entry:
      id: cal.1968-08-17.vietnam-hanoi-2
      when: Aug. 17
      date: '1968-08-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Trà Phí, Tây Ninh–Bình Long campaign. The night of Aug. 17 Regiment 3 (less a battalion) of the 9th Division raids the Trà Phí strongpoint cluster: about 400 Americans out of action, 31 vehicles and six guns destroyed or damaged. At the same time sappers raid Bà Đen mountain base, kill a ranger company and wreck the signal center. The campaign opens, the history says, Aug. 17.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 233. See [[cal.1968-08-18.vietnam-operations]].'
      tags:
      - polity:drv
      - polity:us
      place: tra-phi
      time_range:
      - 1968-08-17T14:00Z
      - 1968-08-17T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-08-19.vietnam-hanoi
      when: Aug. 19
      date: '1968-08-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 22, Tây Ninh. Regiment 33 of the 5th Division, in the best of three actions in a row, destroys a mechanized infantry battalion and 57 armored vehicles.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 233–34. Check: the regiment; the sentence names it only by the earlier passage.'
      tags:
      - polity:drv
      - polity:us
      place: tay-ninh
- add:
    entry:
      id: cal.1968-08-21.vietnam-hanoi
      when: Aug. 21
      date: '1968-08-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Trà Phí, second raid. Regiment 3 of the 9th Division puts a mechanized infantry battalion out of action, destroys or damages 96 vehicles and 14 guns, and shoots down four helicopters.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 234.'
      tags:
      - polity:drv
      - polity:us
      place: tra-phi
      time_range:
      - 1968-08-21T14:00Z
      - 1968-08-21T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-08-21.vietnam-hanoi-2
      when: Aug. 21
      date: '1968-08-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Chà Là, first raid. Regiment 5 of the 5th Division kills and wounds hundreds, burns or damages 140 vehicles and 13 guns, downs one aircraft.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 234.'
      tags:
      - polity:drv
      - polity:us
      place: cha-la
      time_range:
      - 1968-08-21T14:00Z
      - 1968-08-21T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-08-22.vietnam-hanoi
      when: Aug. 22
      date: '1968-08-22'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Ông Hùng stream, Tây Ninh. The night of Aug. 22–23 Battalion 2 of Regiment 33, 5th Division, attacks an American vehicle park: 60 vehicles destroyed, four aircraft shot down, hundreds out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 234.'
      tags:
      - polity:drv
      - polity:us
      place: tay-ninh
      time_range:
      - 1968-08-22T14:00Z
      - 1968-08-22T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-08-21.vietnam-hanoi-3
      when: Aug. 21–22
      date: '1968-08-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: A rocket-launcher section of Sub-region 6 fires several volleys at Independence Palace on Aug. 21 and 22. The Rừng Sác sappers' Group 10 burns or sinks five military freighters of about 7,000 tons on the Lòng Tàu river and at Cát Lái port. Oct. 10 and Dec. 4 the same sappers sink two Caltex tankers of 30 million liters each at Nhà Bè.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 241. Check: the tonnage, which is the history''s. Three actions in one entry; the history joins them.'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1968-08-22.vietnam-hanoi-2
      when: Aug. 22
      date: '1968-08-22'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đà Nẵng. The Lê Độ commando team attacks the Đà Nẵng special zone, the radio station, the five-way police post, the Mỹ Khê district office and the Thanh Khê council; Battalion 484 takes Hòa Vang district seat and targets in the center of Cẩm Lệ. Some foreign agencies called it the fiercest of some 50 attacks that month. In Quảng Nam the same night sapper Battalions 406, 409 and 10 attack a cluster of 10 battalion headquarters; Aug. 23 a battalion of the 2d Division destroys an enemy battalion.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 266–67. Check: the places of the Quảng Nam attack and the fate of the Aug. 23 battalion, which the passage read does not give.'
      tags:
      - polity:drv
      - polity:us
      place: da-nang
      time_range:
      - 1968-08-22T14:00Z
      - 1968-08-22T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-08.vietnam-hanoi-3
      when: Aug., late
      date: 1968-08
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Trị–Thiên Regional Committee decides not to go on with the general attack and uprising on the city: step up the wearing down and destruction of the enemy piece by piece, rebuild the base and the three linked zones, join armed and political struggle, legal and half-legal, put the force in new positions in the mountains, grow cassava, 15 million plants, against hunger, and hunt the aircraft.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 274. Made public: 2013. Check: the days.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1968-08-21
- add:
    entry:
      id: cal.1968-08.vietnam-hanoi-4
      when: Aug., mid
      date: 1968-08
      thread: vietnam-hanoi
      also:
      - vietnam
      c: The Saigon Party Committee, at its rear base at Ba Thu, holds its first conference of cadres to settle how to act in the third wave.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 240. Made public: 2013. Check: the day and the conference''s decisions, which the passage read does not give.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
      at: before 1968-08-11
- add:
    entry:
      id: cal.1968-08-31.vietnam-hanoi
      when: Aug. 31
      date: '1968-08-31'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The campaign command ends the first phase of the Tây Ninh–Bình Long campaign on both directions; Sept. 1–10 the units regroup in a "buffer round"; Sept. 10 the second phase opens as intended.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 235–36.'
      tags:
      - polity:drv
      - ok:fields-place
      time_range:
      - 1968-08-31T14:00Z
      - 1968-08-31T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1968-09-12.vietnam-hanoi-2
      when: Sept. 12
      date: '1968-09-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Lâm Vồ, second raid. Regiment 2 of the 9th Division badly hurts a mixed mechanized infantry battalion, destroys or damages 58 vehicles (39 armored) and 14 mortars, and downs seven aircraft. The same day on Route 22 Regiment 88 of the 5th Division, by ambush and counterattack, puts about 350 out of action, 46 vehicles and six helicopters. On Route 26 Sept. 16 Regiment 174 ambushes a mechanized infantry unit on the move: over 200 killed or wounded, 26 vehicles burned, five gunships.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 236. Check: the units and the days; three actions in a run, Sept. 12 twice and Sept. 16.'
      tags:
      - polity:drv
      - polity:us
      place: lam-vo
- add:
    entry:
      id: cal.1968-09-28.vietnam-hanoi
      when: Sept. 28
      date: '1968-09-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Tây Ninh–Bình Long campaign ends after 43 days and nights from Aug. 17: the 5th, 7th and 9th Divisions and the provinces'' troops fought 315 actions (53 of battalion size, 16 of regiment size), put 13 battalions and 55 companies out of action and badly hurt 7 mechanized battalions of the American 1st and 25th Divisions: 18,406 out of action, 1,507 vehicles, 112 aircraft and 107 guns destroyed.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 239. Check: the figures, which are the history''s; the date of the end is the third wave''s, ordered Aug. 17 to Sept. 28 (V, 229).'
      tags:
      - polity:drv
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1968-10-28.vietnam-hanoi
      when: Oct. 28
      date: '1968-10-28'
      thread: vietnam-hanoi
      also:
      - vietnam-support
      c: 'The Central Military Party Committee and the Defense Ministry form Command 500, Major General Nguyễn Đôn commander and Major General Lê Quang Đạo commissar, to lead and command transport and keep the traffic open in the west of Military Region 4: the rivers and Routes 8, 12 and others.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 281. Made public: 2013. Check: the place; the history gives none.'
      tags:
      - polity:drv
      - vis:only:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-03-01.vietnam-diplomacy
      when: Mar. 1–9
      date: '1965-03-01'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      - laos
      - china
      c: The Indochinese People's Conference meets at Phnom Penh, on the initiative of Vietnam and Cambodia, to unite the peoples of the three countries against the Americans; it stresses the need to strengthen the sincere and lasting solidarity of the Indochinese peoples.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 293. See [[cal.1965-02-23.china-2]], [[cal.1965-03-13.china-leadership-3]].'
      tags:
      - polity:drv
      - polity:cambodia
      place: phnom-penh
- add:
    entry:
      id: cal.1965-03-22.vietnam-diplomacy
      when: Mar. 22
      date: '1965-03-22'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: 'The Liberation Front''s Central Committee issues its five-point statement: the Americans out; a South Vietnam independent, democratic, peaceful and neutral, moving toward unity; the South''s people and the Liberation Army to drive out the Americans, to free the South and defend the North; the South to take aid, arms included, from friends everywhere; all the people united and armed. Twenty-seven Communist and workers'' parties, 22 governments, 22 international bodies and 446 national bodies of 92 countries support it, the history says.'
      n: '[[w.lich-su-khang-chien-chong-my]], V, 321–22. Check: how and where it was issued, and the count of its supporters; the history gives neither.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1966-01-03.vietnam-diplomacy
      when: Jan. 3–15
      date: '1966-01-03'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: The Asian, African and Latin American peoples' solidarity conference meets at Havana. It supports Vietnam and condemns the Americans and the Saigon regime; the DRV's and the Liberation Front's delegations speak and are backed by nearly all.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 297. Check: the delegations'' speakers and the conference''s resolution; the passage read gives neither.'
      tags:
      - polity:drv
      - polity:cuba
      place: havana
- add:
    entry:
      id: cal.1966-11-15.vietnam-diplomacy
      when: Nov. 15
      date: '1966-11-15'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: The International War Crimes Tribunal, on the idea of the British scholar Bertrand Russell, is set up to try the American war crimes in Vietnam.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 447. Check: the place; the history prints the formal first session as May 2–13, 1966 at Stockholm, which cannot precede its founding on Nov. 15, 1966 as printed.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1967-11-20.vietnam-diplomacy
      when: Nov. 20–Dec. 1
      date: '1967-11-20'
      thread: vietnam-diplomacy
      also:
      - vietnam-hanoi
      c: 'The Russell Tribunal sits in Copenhagen for its second session. Its finding, the history says: the American government guilty of aggression against Vietnam, and Australia, New Zealand and South Korea its accomplices in savage crimes.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 447. Check: the place, which the history gives as Copenhagen, Denmark; whether the finding was read at this session.'
      tags:
      - polity:drv
      place: copenhagen
- add:
    entry:
      id: cal.1967-12.vietnam-prisoners
      when: Dec.
      date: 1967-12
      thread: vietnam-prisoners
      also:
      - vietnam-hanoi
      - vietnam-diplomacy
      c: The DRV Government announces the release of three American prisoners for Christmas to rejoin their families. Some high American officials take it for a sign Hanoi has given up hope of winning the South soon, and of the chance of direct talks, "some kind of Panmunjom stage".
      n: '[[w.lich-su-khang-chien-chong-my]], V, 329. Check: the day and the names of the three; the history gives neither.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1968-01-30.vietnam-tet-17
      when: Jan. 30
      date: '1968-01-30'
      thread: vietnam-tet
      also:
      - vietnam-hanoi
      c: Buôn Ma Thuột, Đắk Lắk. The attack on the town opens at 12:45 a.m. Jan. 30. Jan. 31 at noon the Saigon 23d Division sends the 2d Battalion, 45th Regiment, to the town's relief.
      n: '[[w.lich-su-khang-chien-chong-my]], V, 127–28. Check: the clock, whose it is.'
      tags:
      - polity:drv
      - polity:us
      place: ban-me-thuot
      time: 1968-01-29T16:45Z
      time_zone: Asia/Ho_Chi_Minh
