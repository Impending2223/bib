      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Củ Chi. Twelve days of fighting against the 1st Division''s brigades and the 173d Airborne: 200 actions, nearly 1,000 Americans and Saigon troops killed or wounded, 84 aircraft shot down (most UH-1s), 77 vehicles destroyed or damaged (56 M113s), two 105 mm guns. The Americans end the sweep Jan. 19 and move the brigades to Đồng Dù.'
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 86–88 (the sweep began at first light Jan. 8, after air and artillery and hundreds of helicopters landed troops at Mỹ Hưng and Nhuận Đức). See [[cal.1966-01-08.vietnam-operations]]. Check: the units; the history names the sweep "Cái bẫy" (Crimp) and gives its own count.'
      tags:
      - polity:drv
      - polity:us
      place: cu-chi
