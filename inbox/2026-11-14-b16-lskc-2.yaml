      id: cal.1966-01-08.vietnam-hanoi-2
      when: Jan. 8
      date: '1966-01-08'
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Off Sầm Sơn, Thanh Hóa. A Saigon commando ship enters the waters; Phan Như Cẩn of the 919th Air Group, with his crew, flies an AN-2 and bombs it sunk. Returning, the plane has a fault and he lands it on the beach, crew and plane safe. The history calls it the Air Force's first victorious air–sea action.
      n: '[[w.lich-su-khang-chien-chong-my]], IV, 396. Check: the hour; the history says only "đêm 8-1-1966".'
      tags:
      - polity:drv
      place: thanh-hoa
      time_range:
      - 1966-01-08T15:00Z
      - 1966-01-08T17:00Z
      time_band: night
      time_zone: Asia/Bangkok
