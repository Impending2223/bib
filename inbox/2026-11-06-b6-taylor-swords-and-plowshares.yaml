- add:
    entry:
      id: cal.1963-11-13.europe-and-the-alliance
      when: Nov. 13
      date: '1963-11-13'
      thread: europe-and-the-alliance
      c: 'The White House. Kennedy welcomes the Black Watch: "the history of Scotland captured me at a very young age." Major Wingate Gray presents him an officer''s dirk. The pipers serenade the President on the South Portico, his son with the drum major''s bearskin; Taylor behind him, by his account the last time in attendance on him.'
      n: 'Remarks of Welcome to the Members of the Black Watch Regiment, [1963 Pub. Papers 843](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=901) (Nov. 13, 1963). [[w.taylor-swords-and-plowshares]], 302 (the serenade, the son, Taylor behind the President). Names: Kennedy, Taylor.'
