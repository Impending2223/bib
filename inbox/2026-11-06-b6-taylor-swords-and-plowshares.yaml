      id: cal.1962-09.south-asia-2
      when: Sept.
      date: 1962-09
      thread: south-asia
      c: Ayub Khan in Washington. One afternoon, at Kennedy's request, Taylor takes him by helicopter to Glen Ora, the Kennedys' farm in Virginia, to call on Jacqueline Kennedy and see the saddle horse he had given her; Ayub, in white wool chaps over his striped trousers, rides off with her.
      n: '[[w.taylor-swords-and-plowshares]], 259 (Taylor''s account; a social errand, by his telling, chosen to talk with Ayub). Check: the day. See [[cal.1962-09.south-asia]]. Names: Ayub Khan, John F. Kennedy, Taylor, Jacqueline Kennedy.'
