      id: cal.1962-10-22.missile-crisis-32
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      c: 'The night after the President''s address, Taylor sleeps in his Pentagon office, the only time in the crisis: Khrushchev may hold "some card up his sleeve"; a move to hide the missiles feared.'
      n: '[[w.taylor-swords-and-plowshares]], 274 (Taylor''s account). See [[cal.1962-10-22.missile-crisis]]. Names: Taylor, Khrushchev.'
