      when: July 5
      date: '1960-07-05'
      place: boston
      thread: crime-and-hijacking
      c: 'Bernard Goldfine begins ninety days in the Federal penitentiary at Danbury for contempt of court in a tax case; his secretary, Mildred Paperman, also jailed.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1 ("Goldfine and Aide Begin Jail Terms," Boston, July 5, AP).'
