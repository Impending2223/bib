      thread: white-house
      c: 'Hagerty, to reporters: the President has no interest in the Democrats'' "troubles"; "They seem to be having their problems, or fun, or troubles—that''s their business"; no comment on Truman''s charge of a rigged convention. The President to hold a news conference July 6, his first in about two months; from Chicago he will return to Newport or Washington.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Nixon in Long White House Visit Talks Politics with Eisenhower," Washington, July 5; page not shown). Names: Hagerty, Eisenhower, Truman.'
