      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 13 (MacGregor; McCandlish Phillips, "Thai King Plays for Two Hours at Encore Jam Session"; page not shown). Names: Goodman.'
      tags: [ok:name-untagged, name:goodman-benny, state:ny, city:new-york]
