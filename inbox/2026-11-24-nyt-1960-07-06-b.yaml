      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Twenty Puerto Rican delegates under José A. Benítez arrive in Los Angeles, the majority for Kennedy; a rival delegation, backed by Muñoz Marín, expected; Gravel, Credentials chairman, says theirs is the only contest pending.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Sitton, "Democratic Unity Is Thought Likely": "last night"). Names: Kennedy, Muñoz Marín.'
