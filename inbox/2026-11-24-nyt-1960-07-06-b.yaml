      when: July 5
      date: '1960-07-05'
      place: independence-mo
      thread: elections-1960-nomination
      c: 'Truman, no comment on Johnson''s announcement; "I have no second choice, I am for Stuart Symington." By telephone, has not made up his mind on going to Los Angeles.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Truman Declines Comment," Independence, Mo., July 5, AP; "Truman Reported Going to Party''s Convention," Los Angeles, July 5). Names: Truman, Johnson, Symington.'
      tags: [name:truman-harry-s, name:johnson-lyndon-b, name:symington-william-s, state:mo]
- add:
    entry:
