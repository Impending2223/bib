      when: June 29
      date: '1960-06-29'
      thread: elections-1960-nomination
      c: 'Truman telegraphs Governor Blair of Missouri he will not attend the convention and resigns as a delegate.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Truman Reported Going to Party''s Convention": "last Wednesday"). Names: Truman.'
      tags: [ok:fields-place, ok:name-untagged, name:truman-harry-s, state:mo]
