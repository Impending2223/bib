      place: rabat
      thread: africa-algeria-morocco
      c: 'Morocco''s General Union of Moroccan Labor, founded by Douiri, Minister of the National Economy, receives automatic recognition; a setback for the Left-led Moroccan Federation of Labor.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 6 ("Morocco Approves Rightist Labor Body," Rabat, July 5).'
