- primary:
    id: cal.1960-07-06.cuba-2
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3 (Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," Havana, Wednesday, July 6: the machinery for "forced expropriation" established "early today"; the eight-article law authorizing Castro and Dorticós to nationalize American property by resolution, payment in thirty-year bonds at no more than 2 percent, from a dollar surplus on sugar sales above 3,000,000 tons at 5.75 cents or more)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-05.cuba-5
      when: 'By July 5'
      date: '1960-07-05'
      thread: cuba
      c: 'Cuba''s Ambassadors to Italy and El Salvador, Manuel Piedra de la Concha and Francisco Pividal, have resigned in protest against the regime''s policies, it is understood.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 3 (Tad Szulc, "Former Premier Defects in Cuba," Havana, July 6: Piedra de la Concha in Rome, Pividal in Havana). Check: the day.'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.south-asia-2
      when: July 5
      date: '1960-07-05'
      place: new-delhi
      thread: south-asia
      also: [foreign-aid]
      c: 'India''s Government publishes a report on the third five-year plan, to begin next April: $4,620,000,000 in foreign exchange needed, the plan''s investment $23,625,000,000.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 9 ("Indian 5-Year Plan Needs 4.6 Billion in Foreign Aid," New Delhi, July 5).'
- add:
    entry:
      id: cal.1960-07-05.south-asia-3
      when: 'By July 5'
      date: '1960-07-05'
      thread: south-asia
      also: [labor-disputes]
      c: 'India''s Government alerts Army and territorial units to take over essential services should 2,200,000 central Government employees strike as called for Monday, July 11; the Cabinet met twice the week before.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 8 ("India on Strike Alert," New Delhi, July 5). Check: the day.'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-2
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Robert Kennedy, of the rule against vote switches after a roll call proposed by Johnson''s and Symington''s backers: "We''ll fight it if they try it." Of Johnson''s announcement: no difference; his brother will still win on an early ballot.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 20 (W. H. Lawrence, "Democratic Hopefuls Face Early Test on Voting Rule," Los Angeles, July 5). Names: Robert Kennedy, Johnson, Symington.'
      tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:symington-william-s]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-3
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Butler suggests a change to recognize states wishing to switch their votes in alphabetical order; Collins has asked the Rules Committee to clarify vote-switching.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Collins.'
      tags: [ok:name-untagged, name:collins-leroy]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-4
      when: July 5
      date: '1960-07-05'
      place: des-moines
      thread: elections-1960-los-angeles
      c: 'Loveless, Rules Committee chairman: the balloting rules "free and open by anyone''s standards"; not approached by any candidate about the rules.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Loveless Statement," Des Moines, July 5, UPI). Names: Loveless.'
      tags: [name:loveless-herschel-c, state:ia]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-2
      when: July 5
      date: '1960-07-05'
      thread: elections-1960-nomination
      c: 'Charles H. Brown, Symington''s campaign manager, telegraphs every Symington delegate to stand firm: "Symington''s chances are better than ever."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Symington.'
      tags: [ok:fields-place, ok:name-untagged, name:symington-william-s]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-3
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-nomination
      c: 'James E. Doyle, director of the Stevenson draft, at a news conference in Los Angeles; neither Kennedy nor Johnson can reach 761 on the first or second ballot; Stevenson''s first-ballot strength scattered from Alaska to West Virginia; warns Brown against delivering California to Kennedy.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test," with photograph). Names: Stevenson, Kennedy, Johnson, Brown.'
      tags: [ok:name-untagged, name:stevenson-adlai-e, name:kennedy-john-f, name:johnson-lyndon-b, name:brown-edmund-g]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-4
      when: July 5
      date: '1960-07-05'
      thread: elections-1960-nomination
      c: 'Ellington of Tennessee, for Johnson, welcomes his formal candidacy: "a man that I believe can be elected in November."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Ellington, Johnson.'
      tags: [ok:fields-place, name:ellington-buford, name:johnson-lyndon-b, state:tn]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-5
      when: July 5
      date: '1960-07-05'
      place: independence-mo
      thread: elections-1960-nomination
      c: 'Truman, no comment on Johnson''s announcement; "I have no second choice, I am for Stuart Symington." By telephone, has not made up his mind on going to Los Angeles.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Truman Declines Comment," Independence, Mo., July 5, AP; "Truman Reported Going to Party''s Convention," Los Angeles, July 5). Names: Truman, Johnson, Symington.'
      tags: [name:truman-harry-s, name:johnson-lyndon-b, name:symington-william-s, state:mo]
- add:
    entry:
      id: cal.1960-06-29.elections-1960-nomination
      when: June 29
      date: '1960-06-29'
      thread: elections-1960-nomination
      c: 'Truman telegraphs Governor Blair of Missouri he will not attend the convention and resigns as a delegate.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Truman Reported Going to Party''s Convention": "last Wednesday"). Names: Truman.'
      tags: [ok:fields-place, ok:name-untagged, name:truman-harry-s, state:mo]
- add:
    entry:
      id: cal.1960-07-05.states-and-cities-2
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: states-and-cities
      also: [crime-and-hijacking]
      c: 'New York. A Buildings Department clerk suspended on charges of falsifying records for a contractor seeking favors from Borough President Maniscalco of Staten Island; his supervisor, accused of ordering the alterations, to face departmental trial; Commissioner Reidy sends Hogan the contractor''s sworn statements.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 34 (John Sibley, "Maniscalco Case Brings New Trial": "yesterday").'
      tags: [state:ny, city:new-york]
- add:
    entry:
      id: cal.1960-07-05.crime-and-hijacking
      when: July 5
      date: '1960-07-05'
      place: boston
      thread: crime-and-hijacking
      c: 'Bernard Goldfine begins ninety days in the Federal penitentiary at Danbury for contempt of court in a tax case; his secretary, Mildred Paperman, also jailed.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1 ("Goldfine and Aide Begin Jail Terms," Boston, July 5, AP).'
      tags: [state:ma]
- add:
    entry:
      id: cal.1960-07-05.japan-and-korea-far-east
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: japan-and-korea-far-east
      c: 'King Bhumibol and Queen Sirikit of Thailand in a twenty-minute parade up Broadway to City Hall, some 750,000 along the route by the police estimate; received by Mayor and Mrs. Wagner. At a Waldorf-Astoria luncheon Wagner gives the King the Medal of the City; the King gives the city a model of the royal barge.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 13 (Greg MacGregor, "Thai Rulers Honored in Parade": the parade "ended at 12:25 P.M. at City Hall"). Names: Wagner.'
      tags: [ok:name-untagged, name:wagner-robert-f-jr, state:ny, city:new-york]
      time: 1960-07-05T16:05Z
      time_approx: true
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-05.japan-and-korea-far-east-2
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: japan-and-korea-far-east
      c: 'King Bhumibol, at a morning news conference: aware of the Communist threat to Thailand, some infiltration, political and economic; Thailand needs money for roads and communications.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 13 (MacGregor, "Thailand Rulers Hailed in Parade": "During a morning press conference").'
      tags: [ok:name-untagged, state:ny, city:new-york]
      time_range:
      - 1960-07-05T10:00Z
      - 1960-07-05T16:00Z
      time_band: morning
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-05.japan-and-korea-far-east-3
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: japan-and-korea-far-east
      c: 'King Bhumibol plays some two hours at a private jam session given by Benny Goodman on the roof garden of the Manhattan House, East Sixty-sixth Street; forty guests, the Goodman trio among the players; Goodman gives him a saxophone.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (McCandlish Phillips, "Thai King Plays for Two Hours at Encore Jam Session": "At 5:40 P.M." he had been playing "for two hours"; page not shown); at 13 (MacGregor). Names: Goodman.'
      tags: [ok:name-untagged, name:goodman-benny, state:ny, city:new-york]
      time: 1960-07-05T21:40Z
      time_approx: true
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-05.japan
      when: July 5
      date: '1960-07-05'
      thread: japan
      also: [labor-disputes]
      c: 'Kyushu. Sixty hurt, twelve of them police, in a stone-throwing fight between rival coal mine unions.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 13 ("60 Hurt in Kyushu Mine Fight," Tokyo, July 5, AP).'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.africa-algeria-morocco
      when: July 5
      date: '1960-07-05'
      place: rabat
      thread: africa-algeria-morocco
      c: 'Morocco''s General Union of Moroccan Labor, founded by Douiri, Minister of the National Economy, receives automatic recognition; a setback for the Left-led Moroccan Federation of Labor.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 6 ("Morocco Approves Rightist Labor Body," Rabat, July 5).'
- add:
    entry:
      id: cal.1960-07-05.soviet-union-2
      when: July 5
      date: '1960-07-05'
      place: the-hague
      thread: soviet-union
      also: [intelligence]
      c: 'The Netherlands orders Pjotr Smirnoff, a Soviet spy suspect arrested June 20, expelled; Beerman, Minister of Justice, announces it.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 6 ("Dutch Expelling Spy Suspect," The Hague, July 5, AP).'
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-6
      when: July 5
      date: '1960-07-05'
      place: harrisburg
      thread: elections-1960-nomination
      c: 'Symington, beside Governor Lawrence of Pennsylvania, neutral, in a "courtesy call": no sign of rigging; Northern states will not support Johnson; his own greatest strength "in the South and among Negroes."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Symington Sees Gov. Lawrence; Doubts Convention Is Rigged," Harrisburg, July 5, AP). Names: Symington, Lawrence, Johnson.'
      tags: [name:symington-william-s, name:lawrence-david-l, name:johnson-lyndon-b, state:pa]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-5
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Democratic quarters in Los Angeles report Truman will come to the convention, late Friday or early Saturday.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Truman Reported Going to Party''s Convention," Los Angeles, July 5). Names: Truman.'
      tags: [name:truman-harry-s]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-7
      when: July 5
      date: '1960-07-05'
      place: trenton
      thread: elections-1960-nomination
      c: 'Meyner, at a news conference, will go to the convention as a serious favorite son; hopes New Jersey''s delegation will not choose before it meets; declines comment on Vincent J. Murphy''s first-ballot vote for Kennedy.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Meyner Maintains Favorite-Son Role," Trenton, July 5). Names: Kennedy.'
      tags: [ok:name-untagged, name:kennedy-john-f, state:nj]
- add:
    entry:
      id: cal.1960-07-05.labor
      when: 'By July 5'
      date: '1960-07-05'
      thread: labor
      also: [elections-1960-nomination]
      c: 'Vincent J. Murphy, secretary-treasurer of New Jersey''s A.F.L.-C.I.O. and a delegate at large, will vote for Kennedy on the first ballot; Meyner''s favorite-son role "an empty gesture."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Meyner Maintains Favorite-Son Role"). Check: the day. Names: Kennedy, Meyner.'
      tags: [ok:fields-place, ok:name-untagged, name:kennedy-john-f, state:nj]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-8
      when: July 5
      date: '1960-07-05'
      place: columbus
      thread: elections-1960-nomination
      c: 'John W. Brown, Republican State Representative, once Ohio''s interim Governor, accuses DiSalle of backing Kennedy for the promise of a Cabinet post; Truman recognizes DiSalle "among the riggers."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Di Salle Is Challenged," Columbus, Ohio, July 5, UPI). Names: DiSalle, Kennedy, Truman.'
      tags: [name:disalle-michael-v, name:kennedy-john-f, name:truman-harry-s, state:oh]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-9
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: elections-1960-nomination
      c: 'Stanley H. Lowell, Wagner''s former administrative assistant, a Manhattan delegate first committed to Humphrey, will do "whatever is possible" to nominate Stevenson; Kennedy his second choice. A complimentary vote for Humphrey, then to Kennedy should Johnson make headway on the early ballots.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Backing for Stevenson": "yesterday"). Names: Wagner, Humphrey, Stevenson, Kennedy, Johnson.'
      tags: [name:wagner-robert-f-jr, name:humphrey-hubert-h, name:stevenson-adlai-e, name:kennedy-john-f, name:johnson-lyndon-b, state:ny, city:new-york]
- add:
    entry:
      id: cal.1960-07-06.elections-1960-nomination
      when: July 6
      date: '1960-07-06'
      place: nyc
      thread: elections-1960-nomination
      c: 'A motorcade of Stevenson supporters leaves Washington Square for Los Angeles at 7 p.m.; Mrs. Roosevelt and Finletter to speak.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Backing for Stevenson": "tonight"). Check: that it left. Names: Eleanor Roosevelt, Finletter, Stevenson.'
      tags: [name:roosevelt-eleanor, name:finletter-thomas-k, name:stevenson-adlai-e, state:ny, city:new-york]
      time: 1960-07-06T23:00Z
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-05.democratic-party
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: democratic-party
      also: [elections-1960-los-angeles]
      c: 'Butler, at a news conference: party unity good; challenges only to individual Southerners, Price Daniel perhaps, met by a loyalty pledge; Daniel has told him he will sign.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Claude Sitton, "Democratic Unity Is Thought Likely," Los Angeles, July 5). Names: Daniel.'
      tags: [ok:name-untagged, name:daniel-price]
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles-6
      when: July 4
      date: '1960-07-04'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Twenty Puerto Rican delegates under José A. Benítez arrive in Los Angeles, the majority for Kennedy; a second delegation, backed by Governor Muñoz Marín, expected later in the week.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Sitton, "Democratic Unity Is Thought Likely": "last night"). Names: Kennedy, Muñoz Marín.'
      tags: [name:kennedy-john-f, name:munoz-marin-luis]
      time_range:
      - 1960-07-05T05:00Z
      - 1960-07-05T07:00Z
      time_band: night
      time_zone: America/Los_Angeles
- add:
    entry:
      id: cal.1960-07-05.democratic-party-2
      when: July 5
      date: '1960-07-05'
      place: mexico-city
      thread: democratic-party
      also: [elections-1960-los-angeles]
      c: 'Edwin W. Pauley, Los Angeles oil man and a delegate: if Butler planned to fix the convention, he had tickets enough; his own vote undecided; Kennedy will have to win on the first ballot. Butler, at Los Angeles, no comment.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Pauley Criticizes Butler on Tickets," Mexico City, July 5, AP). Names: Kennedy.'
      tags: [ok:name-untagged, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-07-05.medicare
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: medicare
      also: [elections-1960-los-angeles]
      c: 'The Platform Committee, after Dr. Edward Annis''s testimony for the A.M.A. against medical care through Social Security: members charge "A.M.A. brass hats" are backing the Republicans, Monroe Sweet of Oregon the A.M.A.''s "threats against the Democratic party." James B. Carey, of the A.F.L.-C.I.O., charges Annis with distorting labor''s views on medical care for the aged.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Leo Egan, "Democrats Hear Ideas for Planks," Los Angeles, July 5). Names: Annis.'
      tags: [ok:name-untagged, name:annis-edward-r]
- add:
    entry:
      id: cal.1960-07-05.conservative-movement
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: conservative-movement
      c: 'Americans for Constitutional Action makes public its index of voting records: Johnson 10 percent, Kennedy 11, Morse 5, Symington 4; Byrd 92, Goldwater 98, John J. Williams 99. Moreell, its president, in a statement mailed to 60,000, against the advance toward the "collectivist state."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 21 ("Conservative Unit Classifies Senators," Washington, July 5, AP, UPI). Names: Johnson, Kennedy, Morse, Symington, Byrd, Goldwater, Williams.'
      tags: [ok:name-untagged, name:johnson-lyndon-b, name:kennedy-john-f, name:morse-wayne, name:symington-william-s, name:byrd-harry-f, name:goldwater-barry-m, name:williams-john-j]
- add:
    entry:
      id: cal.1960-07-05.defense
      when: July 5
      date: '1960-07-05'
      place: ogden
      thread: defense
      c: 'The Air Force''s Minuteman test train leaves Ogden on its second seven-day run over Western railroads.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 21 ("Missile Train in Test," Ogden, Utah, July 5, AP).'
      tags: [state:ut]
- add:
    entry:
      id: cal.1960-07-05.defense-2
      when: 'By July 5'
      date: '1960-07-05'
      place: washington
      thread: defense
      c: 'Gates directs the Air Force to give him this week a detailed progress statement on reported delays at the Atlas sites, apparently Offutt and Warren among them.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("ICBM Sites Studied," Washington, July 5, AP: a spokesman; page not shown). Check: the day. Names: Gates.'
      tags: [name:gates-thomas-s-jr]
- add:
    entry:
      id: cal.1960-07-05.labor-disputes
      when: July 5
      date: '1960-07-05'
      place: rome
      thread: labor-disputes
      also: [europe-and-the-alliance]
      c: 'Italian gas workers strike in Florence and Rome, the first of a four-day strike in the major cities.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Rome in Stew With Gas Off," Rome, July 5, AP; page not shown).'
- add:
    entry:
      id: cal.1960-07-05.latin-america
      when: July 5
      date: '1960-07-05'
      place: london
      thread: latin-america
      also: [cuba]
      c: 'Frondizi tells Macmillan, in ninety minutes with their foreign ministers, that he urged Castro, in vain, to drop his Leftist policies; Cuba has broken no international law, no basis for action against it.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Frondizi Plea to Castro Reported," London, July 5, AP: "informed sources"; page not shown). Names: Frondizi, Macmillan, Castro.'
      tags: [name:frondizi-arturo, name:macmillan-harold, name:castro-fidel]
