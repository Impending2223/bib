      thread: medicare
      also: [elections-1960-los-angeles]
      c: 'Dr. Edward Annis, for the A.M.A., urges the Democratic platform committee against Social Security medical care for the aged, "socialism"; members charge threats against the party; Carey, of the A.F.L.-C.I.O., charges distortion.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Leo Egan, "Democrats Hear Ideas for Planks," Los Angeles, July 5).'
