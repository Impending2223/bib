      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Claude Sitton, "Democratic Unity Is Thought Likely," Los Angeles, July 5). Names: Daniel.'
