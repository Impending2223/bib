      c: 'Vincent J. Murphy, secretary-treasurer of New Jersey''s A.F.L.-C.I.O. and a delegate at large, will vote for Kennedy on the first ballot; Meyner''s favorite-son role "an empty" one.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Meyner Maintains Favorite-Son Role"). Check: the day. Names: Kennedy, Meyner.'
