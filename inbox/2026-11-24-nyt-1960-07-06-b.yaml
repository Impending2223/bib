      place: harrisburg
      thread: elections-1960-nomination
      c: 'Symington, beside Governor Lawrence of Pennsylvania, neutral, in a "courtesy call": no sign of rigging; Northern states will not support Johnson; his strength in the South and among Negroes.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Symington Sees Gov. Lawrence; Doubts Convention Is Rigged," Harrisburg, July 5, AP). Names: Symington, Lawrence, Johnson.'
