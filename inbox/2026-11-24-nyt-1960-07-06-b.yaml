      when: July 5
      date: '1960-07-05'
      place: washington
      thread: conservative-movement
      c: 'Americans for Constitutional Action makes public its index of voting records: Johnson 10 percent, Kennedy 11, Morse 5, Symington 4; Byrd 92, Goldwater 98, John J. Williams 99. Moreell, its president, in a statement mailed to 60,000, against the advance toward the "collectivist state."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 21 ("Conservative Unit Classifies Senators," Washington, July 5, AP, UPI). Names: Johnson, Kennedy, Morse, Symington, Byrd, Goldwater, Williams.'
