      also: [elections-1960-los-angeles]
      c: 'Pauley, Los Angeles oil man and a delegate: Butler can fix the convention with its tickets; still uncommitted; Kennedy must win on the first ballot.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Pauley Criticizes Butler on Tickets," Mexico City, July 5, AP). Names: Kennedy.'
      tags: [ok:name-untagged, name:kennedy-john-f]
