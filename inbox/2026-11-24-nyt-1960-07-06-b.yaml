      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Backing for Stevenson": "yesterday"). Names: Humphrey, Stevenson, Kennedy, Johnson.'
