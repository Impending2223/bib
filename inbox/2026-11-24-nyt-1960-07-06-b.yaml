      c: 'The Netherlands orders Pjotr Smirnoff, a Soviet spy suspect arrested June 20, expelled; Beerman, Minister of Justice, announces it.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 6 ("Dutch Expelling Spy Suspect," The Hague, July 5, AP).'
- add:
