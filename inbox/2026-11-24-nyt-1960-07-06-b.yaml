      place: trenton
      thread: elections-1960-nomination
      c: 'Meyner, at a news conference, will go to the convention as a serious favorite son; hopes New Jersey''s delegation will not choose before it meets; declines comment on Vincent J. Murphy''s first-ballot vote for Kennedy.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 18 ("Meyner Maintains Favorite-Son Role," Trenton, July 5). Names: Kennedy.'
