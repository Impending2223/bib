- primary:
    id: cal.1960-07-06.cuba-2
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3 (Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," Havana, Wednesday, July 6: the machinery for "forced expropriation" established "early today"; the eight-article law authorizing Castro and Dorticós to nationalize American property by resolution, payment in thirty-year bonds at no more than 2 percent, from a dollar surplus on sugar sales above 3,000,000 tons at 5.75 cents or more)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-05.cuba-5
      when: 'By July 5'
      date: '1960-07-05'
      thread: cuba
      c: 'Cuba''s Ambassadors to Italy and El Salvador, Manuel Piedra de la Concha and Francisco Pividal, resign in protest against the regime''s policies, it is understood; the Foreign Ministry announces them "removed" with García Mador, at the United Nations office in Geneva.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 3 (Tad Szulc, "Former Premier Defects in Cuba," Havana, July 6). Check: the day.'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.south-asia-2
      when: July 5
      date: '1960-07-05'
      place: new-delhi
      thread: south-asia
      also: [foreign-aid]
      c: 'India''s Government publishes a report on the third five-year plan, to begin next April: $4,620,000,000 in foreign exchange needed, the plan''s investment $23,625,000,000.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 9 ("Indian 5-Year Plan Needs 4.6 Billion in Foreign Aid," New Delhi, July 5).'
- add:
    entry:
      id: cal.1960-07-05.south-asia-3
      when: 'By July 5'
      date: '1960-07-05'
      thread: south-asia
      also: [labor-disputes]
      c: 'India''s Government alerts Army and territorial units to take over essential services should 2,200,000 central Government employees strike as called for Monday, July 11; the Cabinet met twice the week before.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 8 ("India on Strike Alert," New Delhi, July 5). Check: the day.'
      tags: [ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-2
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Robert Kennedy, of the rule against vote switches after a roll call proposed by Johnson''s and Symington''s backers: "We''ll fight it if they try it"; it will make no difference.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 20 (W. H. Lawrence, "Democratic Hopefuls Face Early Test on Voting Rule," Los Angeles, July 5). Names: Robert Kennedy, Johnson, Symington.'
      tags: [name:kennedy-robert-f, name:johnson-lyndon-b, name:symington-william-s]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-3
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Butler suggests a change to recognize states wishing to switch their votes in alphabetical order; Collins has asked the Rules Committee to clarify vote-switching.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Collins.'
      tags: [ok:name-untagged, name:collins-leroy]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-4
      when: July 5
      date: '1960-07-05'
      place: des-moines
      thread: elections-1960-los-angeles
      c: 'Loveless, Rules Committee chairman: the balloting rules "free and open by anyone''s standards"; not approached by any candidate about the rules.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Loveless Statement," Des Moines, July 5, UPI).'
      tags: [ok:name-untagged, state:ia]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-2
      when: July 5
      date: '1960-07-05'
      thread: elections-1960-nomination
      c: 'Charles H. Brown, Symington''s campaign manager, telegraphs every Symington delegate to stand firm: "Symington''s chances are better than ever."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Symington.'
      tags: [ok:fields-place, ok:name-untagged, name:symington-william-s]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-3
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-nomination
      c: 'James E. Doyle, director of the Stevenson draft, at a news conference in Los Angeles; neither Kennedy nor Johnson can reach 761 on the first or second ballot; Stevenson''s first-ballot strength scattered from Alaska to West Virginia; warns Brown against delivering California to Kennedy.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test," with photograph). Names: Stevenson, Kennedy, Johnson, Brown.'
      tags: [ok:name-untagged, name:stevenson-adlai-e, name:kennedy-john-f, name:johnson-lyndon-b, name:brown-edmund-g]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination-4
      when: July 5
      date: '1960-07-05'
      thread: elections-1960-nomination
      c: 'Ellington of Tennessee, for Johnson, welcomes his formal candidacy: "a man that I believe can be elected in November."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 (Lawrence, "Democratic Hopefuls Face Early Test"). Names: Johnson.'
      tags: [ok:fields-place, ok:name-untagged, name:johnson-lyndon-b, state:tn]
- add:
    entry:
