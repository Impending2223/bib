      c: 'Kyushu. Sixty hurt, twelve of them police, in a stone-throwing fight between rival coal mine unions.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 13 ("60 Hurt in Kyushu Mine Fight," Tokyo, July 5, AP).'
