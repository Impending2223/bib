- edit:
    id: cal.1966-01-03.vietnam
    base: 4f617438
    set:
      c: 'The fourteen points, Rusk''s paper of Dec. 27, given to the press by Humphrey on his return: the Geneva agreements of 1954 and 1962 "an adequate basis for peace"; a conference, or "unconditional discussions," welcome; Hanoi''s four points open to discussion; no American bases; no troops kept "after peace is assured"; the Viet Cong''s representation no "insurmountable problem"; the bombing could stop "as a step toward peace." Jan. 4, Goldberg''s letter to U Thant. Jan. 5, Humphrey reports his trip to the NSC.'
      n: 'FRUS 1964–68, III, doc. [247](https://history.state.gov/historicaldocuments/frus1964-68v03/d247); IV, docs. [2](https://history.state.gov/historicaldocuments/frus1964-68v04/d2), [3](https://history.state.gov/historicaldocuments/frus1964-68v04/d3), [7](https://history.state.gov/historicaldocuments/frus1964-68v04/d7). The points: [[w.department-of-state-bulletin]], [Feb. 14, 1966, 225](https://archive.org/details/departmentofstat541966unit/page/225/mode/1up) (the Department''s press release 4, Jan. 7). [[w.current-documents-1966]], 740–746; [[w.gibbons-u-s-government-and]], IV, 130–31 (the fourteen points), 133 (Humphrey to the NSC). See [[cal.1965-12-24.vietnam]]; [[cal.1965-12-28.vietnam]]. Gibbons has Rusk offering the fourteen points at a news conference Dec. 29 (IV, 130, citing the *Bulletin* of Jan. 17 and Feb. 14, 1966); the issue of Jan. 17 prints, at 86, Rusk on Canadian television, released Dec. 30, and that of Feb. 14 the points as the Department''s release of Jan. 7. Names: Rusk, Humphrey, Goldberg, U Thant.'
      src:
        c: c8f093f4
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d247: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v04/d2: all'
