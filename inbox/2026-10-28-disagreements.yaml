- edit:
    id: cal.1960-04-26.vietnam
    base: e17ffbd9
    set:
      n: 'FRUS 1958–60, I, docs. [142](https://history.state.gov/historicaldocuments/frus1958-60v01/d142), [149](https://history.state.gov/historicaldocuments/frus1958-60v01/d149) (Fishel to Diệm), [150](https://history.state.gov/historicaldocuments/frus1958-60v01/d150). [[w.miller-misalliance]], 206; [[w.gibbons-u-s-government-and]], I, 339–41 (the meeting and the petition). Miller, 206, dates the letter Apr. 19, the day of doc. 142, which reports a draft to be handed Diệm at a meeting set for Apr. 25; FRUS''s editors date the statement Apr. 26, after the meeting at the Caravelle (doc. 142 n. 3). To check: [[w.catton-diems-final-failure]]; [[w.jacobs-cold-war-mandarin]]. Names: Trần Văn Văn, Phan Khắc Sửu, Ngô Đình Diệm.'
