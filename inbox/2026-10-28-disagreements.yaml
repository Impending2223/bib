- edit:
    id: cal.1968-09-07.vietnam
    base: 33680b6e
    set:
      c: 'Paris. Harriman and Vance meet Lê Đức Thọ and Xuân Thủy in private, the first of such meetings; what is said to stay secret. Most of the three hours Thọ''s "endless harangue" on the war.'
      n: 'FRUS 1964–68, VII, doc. [7](https://history.state.gov/historicaldocuments/frus1964-68v07/d7). [[w.nguyen-hanois-war]], 121–29 (Hanoi''s side of the private talks, to the halt), 122 (this meeting). Made public: FRUS 1964–68, VII (2003). Nguyen, 122, dates the meeting Sept. 8, by Hanoi''s record, and gives Thọ''s lecture "nearly an hour"; Harriman and Vance''s telegram, sent Sept. 7: "this morning September 7," three hours. See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy.'
- edit:
    id: cal.1968-11-01.vietnam
    base: f4f4b77f
    set:
      c: 'The Accelerated Pacification Campaign opens, to run to Jan. 31: about 1,000 contested hamlets to be brought under the Saigon government; the attack on the Viet Cong infrastructure, the Phoenix program, pressed. Abrams in command; Colby, Komer''s deputy, to head CORDS. Dec. 16, the CIA stations assessment of Phoenix: "encouraging progress," but no significant reduction yet in the Communists'' ability to carry on.'
      n: 'FRUS 1964–68, VII, doc. [44](https://history.state.gov/historicaldocuments/frus1964-68v07/d44) (Bunker, Oct. 2: Thiệu''s first phase, 1,000 hamlets by Tet); doc. [91](https://history.state.gov/historicaldocuments/frus1964-68v07/d91) (Bunker, Oct. 19: 1,000 contested hamlets, November–January); doc. [256](https://history.state.gov/historicaldocuments/frus1964-68v07/d256). [[w.vietnam-victory-in-vietnam]], 237–38 (Hanoi''s account: a trial in Vĩnh Long and Trà Vinh showed its weakness in the countryside); [[w.cosmas-joint-chiefs-of-staff]], 247. Made public: FRUS 1964–68, VII (2003). Cosmas, 247, gives "more than 1,200 hamlets," contested or Viet Cong-controlled; his dates, Nov. 1–Jan. 31, the entry''s. To check: [[w.hunt-pacification]]; [[w.sorley-better-war]]; [[w.colby-lost-victory]]; [[w.andrade-ashes-to-ashes]]. Names: Abrams, Colby, Komer.'
      src:
