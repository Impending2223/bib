- edit:
    id: cal.1965-02-10.vietnam
    base: 01a18ffd
    set:
      n: 'FRUS 1964–68, II, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97), [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106). [[w.gibbons-u-s-government-and]], III, 77–83; [[w.frankum-like-rolling-thunder]], 17–18; [[w.drea-mcnamara-clifford-and-the-2011]], 56; [[w.cosmas-joint-chiefs-of-staff-2012]], 216–217; [[w.staaveren-gradual-failure]], 21–22. Frankum, 18, has the South Vietnamese strike another barracks, his target 32, not Chấp Lễ; Staaveren, 21–22, their target the Vu Con barracks, Chấp Lễ an alternate. Target 32 is the Vu Con barracks (FRUS 1964–68, II, doc. 78 n. 4); FRUS''s editors, from Vance''s chronology, have American and South Vietnamese planes strike Chấp Lễ (doc. 106). See [[cal.1965-02-07.vietnam]]. Names: Humphrey, Ball, McNamara, Thompson, Kosygin.'
