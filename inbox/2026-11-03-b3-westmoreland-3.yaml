patch: b3-westmoreland-3
by: 'batch-3 reader, westy group (Westmoreland, A Soldier Reports), third run: the witnesses'
ops:
- add:
    entry:
      id: cal.1966-02.war-opposition
      when: Feb.
      date: 1966-02
      thread: war-opposition
      also:
      - vietnam-force-levels
      c: 'Gavin, in a letter in *Harper''s*: to secure all of South Vietnam would take far more forces than are there and heavier bombing of the North, which might bring the Chinese in. Better to hold a series of coastal enclaves with the forces already there, stop the bombing, and seek a settlement by diplomacy. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 129. To check: Gavin''s letter, *Harper''s*, Feb. 1966 (cited by [[w.westmoreland-soldier-reports]], 129). Check: the issue''s pages and the letter''s words. Gavin before the Foreign Relations Committee: [[cal.1966-02-08.vietnam-hearings]]. Names: Gavin.'
      tags:
      - name:gavin-james-m
      src:
        c: b22b821b
        rows:
        - 'w.westmoreland-soldier-reports 129: all'
        - 'via x.1966-02.gavin-letter-harpers: A-B'
- add:
    entry:
      id: cal.1966-02-06.vietnam-2
      when: Feb. 6–8
      date: '1966-02-06'
      thread: vietnam
      c: 'Honolulu. Westmoreland''s televised press conference: "The nature of the enemy is such that we cannot expect him to be defeated by a single battle or series of battles. He will have to be ferreted out over a period of time, which will involve many campaigns, many operations." Johnson, concerned beforehand at what he might say, telephones him afterward, pleased. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 159–60. Check: the day. See [[cal.1966-02-06.vietnam]]. Names: Westmoreland, Johnson.'
      tags:
      - name:westmoreland-william
      - name:johnson-lyndon-b
      src:
        c: 6972a383
        rows:
        - 'w.westmoreland-soldier-reports 159–60: all'
        - 'via x.1966-02.westmoreland-honolulu-press-conference: B'
- add:
    entry:
      id: cal.1966-02-07.vietnam-2
      when: Feb. 7
      date: '1966-02-07'
      thread: vietnam
      c: 'Honolulu, Johnson''s suite, three hours before the official dinner: Johnson with Westmoreland, McNamara, Rusk, Lodge, Thiệu, Kỳ and Nguyễn Hữu Có, the Defense Minister. Westmoreland reviews his concept for the war; pressed by Johnson for how long it will last, he will say no more than "several years." By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 159–60. Check: the day; Westmoreland gives the second evening of Johnson''s stay. See [[cal.1966-02-06.vietnam]]. Names: Johnson, Westmoreland, McNamara, Rusk, Lodge, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:lodge-henry-cabot
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
      src:
        c: db99ea5e
        rows:
        - 'w.westmoreland-soldier-reports 159–60: all'
- add:
    entry:
      id: cal.1968-01-31.vietnam-tet-5
      when: Jan. 31
      date: '1968-01-31'
      thread: vietnam-tet
      c: 'Saigon, the embassy, after the raid: Westmoreland''s press conference on the scene, at Zorthian''s request. None of the Viet Cong inside the chancery; the damage to the building superficial; the enemy, coming into the open, exposing himself to tremendous casualties and inviting defeat. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 325. To check: [[w.oberdorfer-tet]] (quoted by [[w.westmoreland-soldier-reports]], 325, on the reporters: "seemed to give the lie to the rosy projections and victory claims"). See [[cal.1968-01-31.vietnam-tet]]. Names: Westmoreland, Zorthian.'
      tags:
      - name:westmoreland-william
      - name:zorthian-barry
      src:
        c: 9447e9e5
        rows:
        - 'w.westmoreland-soldier-reports 325: all'
        - 'via x.1968-01-31.westmoreland-press-conference-embassy: A-C'
- add:
    entry:
      id: cal.1967-04-24.vietnam-3
      when: Apr. 24
      date: '1967-04-24'
      thread: vietnam
      c: 'New York, that afternoon, after the Associated Press luncheon: Westmoreland to the Council on Foreign Relations, McGeorge Bundy and Forrestal in the audience. The war''s facets political, sociological, psychological, economic and military; the war fundamentally political. By Westmoreland''s account.'
      n: '[[w.westmoreland-soldier-reports]], 226. See [[cal.1967-04-24.vietnam]]. Names: Westmoreland, McGeorge Bundy, Forrestal.'
      tags:
      - name:westmoreland-william
      - name:bundy-mcgeorge
      - name:forrestal-michael-v
      src:
        c: 3f7b1f64
        rows:
        - 'w.westmoreland-soldier-reports 226: all'
        - 'via x.1967-04-24.westmoreland-speech-council-on-foreign-relations: A'
