      when: Aug. 17
      date: '1965-08-17'
      thread: civil-disorders-watts
      c: Governor Brown lifts the Los Angeles curfew, Tuesday.
      n: '[[w.bernstein-guns-or-butter]], 386 ("Governor Brown lifted the curfew on Tuesday"; the Tuesday after Sunday, Aug. 15). See [[cal.1965-08-11.states-and-cities]]. Names: Brown.'
      tags:
      - name:brown-edmund-g
      - state:ca
      - city:los-angeles
