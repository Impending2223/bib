      c: 'White House Theater, 2 p.m. Johnson on television, on the petition a majority of the House has signed: "we near victory in the final battle of the American Revolution."'
      n: 'Televised Statement by the President Concerning the Signing of the D.C. Home Rule Petition by a Majority of House Members, [1965 Pub. Papers 966](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=440) (Sept. 3, 1965). The words: 2 p.m. (Pub. Papers 966 note: "spoke at 2 p.m. in the White House Theater"). The order: after [[cal.1965-09-03.states-and-cities]], the statement itself ("A majority ... has signed a petition"). See [[cal.1965-09-03.states-and-cities]]. Names: Johnson.'
      tags:
