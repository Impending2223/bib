    id: cal.1965-08-30.steel
    base: 23d0944f
    set:
      c: Steel.{1} With the Steelworkers' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor.{2} In the Cabinet Room at 1 p.m., before photographers, Johnson asks for "a noninflationary settlement," tells them to remember "our boys in Vietnam," and sends them to Room 275 of the Executive Office Building, his suite as Vice President.{5} Aug. 26, he had telephoned both.{4}
      n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 26, 1965). [[w.dallek-flawed-giant]], 305 (both sides at the White House); [[w.califano-triumph-and-tragedy-of]], 90–91 (the breakfast at 8 with Morse, Collins, Simkin; the parties at 1 p.m., "our boys in Vietnam"; Room 275 of the Executive Office Building; the back channel through Goldberg and Clifford; Eisenhower; Abel alone with Johnson); [[w.bernstein-guns-or-butter]], 361 (the ultimatum; Room 275); [[w.califano-triumph-and-tragedy-of]], 90. To check: [[w.sheahan-wage-price-guideposts]]; handwritten notes of the meeting of Aug. 30, 1965, Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 305). See [[cal.1963-04-11.steel]]. Names: Johnson, Abel, R. Conrad Cooper, Wirtz, Connor.'
      src:
        c: df56e99b
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426: 1, 2'
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408: 4'
        - 'w.dallek-flawed-giant 305: 2'
        - 'via w.dallek-flawed-giant 305 n.28: 2'
        - 'w.califano-triumph-and-tragedy-of 90–91: 2'
        - 'via w.califano-triumph-and-tragedy-of 90 n.15: 2'
        - 'w.bernstein-guns-or-butter 361: 5'
        - 'w.califano-triumph-and-tragedy-of 90: 5'
    kind: correct
