      time_band: afternoon
      time_range:
      - 1965-11-24T04:00Z
      - 1965-11-24T10:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 24, 1965. Made public: 2013. The words: 下午 (the Mao nianpu, Nov. 24, 1965), at the Jinjiang Hotel; the nianpu adds that after the talk Mao gave Strong and the others a dinner (谈话后，毛泽东设宴款待斯特朗等). Names: Mao Zedong, Jiang Qing, Liao Chengzhi, Wu Lengxi, Anna Louise Strong, George Hatem, Khrushchev, Frank Coe, Israel Epstein, Sidney Rittenberg.'
- edit:
    id: cal.1965-11-27.china-leadership-3
    base: d754c2a4
    set:
      time: 1965-11-27T02:00Z
      time_approx: true
      time_zone: Asia/Shanghai
      n: '[[w.yang-shangkun-riji]], II, 692 (Nov. 27, 1965). The words: 今天按旧历是朱德同志80岁生日，去玉泉山时在他家中坐了一下，未说什么，彼此心照而已 (II, 692). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). The hour: the diary has the family walk at Yuquanshan at 10 (今天星期日，10时同全家去玉泉山散步), and the call on Zhu De "when going to Yuquanshan" (去玉泉山时在他家中坐了一下) (II, 692); about 10. Names: Yang Shangkun, Zhu De.'
