      c: Los Angeles. At 11 a.m. Saturday a hundred engine companies are fighting fires, often under sniper fire.
      n: '[[w.bernstein-guns-or-butter]], 385 ("At 11 a.m. on Saturday"). The words: 11 a.m. (385). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
