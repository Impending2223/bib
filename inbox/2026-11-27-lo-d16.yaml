      n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 13, 1965). Made public: 1997. The order: after [[cal.1965-11-13.china-leadership]], the printed order alone ([[w.zhou-enlai-nianpu-1949]], II, 763). The words: 晚 (II, 764), in the order of the day''s items (the report to the planning meeting, then the evening). Names: Zhou Enlai, Yu Qiuli.'
