      c: 'Johnson to Morse: he wants an independent judgment whether presidential intervention could help in the steel dispute. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89 ("Johnson told Morse that he wanted some independent judgment"); [[w.califano-triumph-and-tragedy-of]], 89 n.12 (the day: "PDD, August 28, 1965"). Check: the day; Califano''s text gives none, its note the President''s Daily Diary of Aug. 28. To check: President''s Daily Diary, Aug. 28, 1965 (cited by [[w.califano-triumph-and-tragedy-of]], 89 n.12). See [[cal.1965-08-27.steel]]. Names: Johnson, Morse.'
