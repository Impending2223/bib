      c: Los Angeles. The first Guard contingent, 1,336 troops, is in the area at 10 p.m.; a second wave of 1,000 joins at midnight.
      n: '[[w.bernstein-guns-or-butter]], 385 (Friday night: "at 10 p.m."; "at midnight"). The time is the first contingent''s, Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
