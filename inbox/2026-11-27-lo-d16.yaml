      c: The White House. Abel's and Cooper's negotiators, at Johnson's request, agree to put off the shutdown eight days and to go on bargaining in Washington, a few hours after arriving.
      n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965: "In response to my request, the union and company representatives have agreed to postpone the imminent shutdown for 8 days. During this period they will continue their negotiations in Washington"; the request "This morning"). [[w.califano-triumph-and-tragedy-of]], 91 ("A few hours after arriving at the White House, the parties agreed to extend the strike deadline for eight days"); [[w.bernstein-guns-or-butter]], 361 (the deadline extended eight days). The order: after [[cal.1965-08-30.steel]], [[w.califano-triumph-and-tragedy-of]], 90–91 (the meeting at 1 p.m., then the agreement "A few hours after arriving"). See [[cal.1965-08-30.steel]]. Names: Abel, R. Conrad Cooper, Johnson.'
      tags:
      - name:abel-i-w
      - name:cooper-r-conrad
      - name:johnson-lyndon-b
      - ok:fields-time
