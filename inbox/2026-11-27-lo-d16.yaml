      c: Damascus 大马士革. At noon, at the presidential palace, Chen Yi calls on Amin al-Hafiz 阿明·哈菲兹, chairman of the Presidential Council.
      n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 49 (Sept. 5–6, 1965); [[w.chen-yi-nianpu]], 1118 (Sept. 5, 1965, 中午, calls on Amin al-Hafiz 阿明·哈菲兹 at the presidential palace). The words: 中午 (1118). The order: after [[cal.1965-09-05.china-leadership-8]], [[w.chen-yi-nianpu]], 1118 (in 在这以前, before this, Nur al-Din al-Atasi and Muraywid had called on him at the hotel). See [[cal.1965-09-05.china-leadership]]. Names: Chen Yi, Amin al-Hafiz.'
