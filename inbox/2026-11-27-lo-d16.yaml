- edit:
    id: cal.1965-12.china-leadership-3
    base: 1834306b
    set:
      when: Dec. 26
      n: '[[w.macfarquhar-maos-last-revolution]], 18–19; [[w.yang-jisheng-tiandi-fanfu]], I, 119 (Dec. 26 and 27: the Shanghai committee reports to Peng Zhen that Yao Wenyuan''s article was published on Mao''s instruction at the September work conference; Peng gives no view; Yao''s article too to be "divided in two"; Wu Han''s case to be discussed as academic; Shanghai should not have put the *Jiefangjun bao*''s note first; Wu Han a leftist in the democratic revolution and against the rightists, Deng Tuo a leftist, "I told him to write" the Xiang Yangsheng article); [[w.peng-zhen-nianpu-1902]], IV, 456 (Dec. 26, 1965; Peng Zhen arrives at Shanghai; to Zhang Chunqiao: Wu Han a leftist in the democratic revolution and in the anti-rightist struggle, has written a self-examination since Yao''s article, to be published; Deng Tuo a leftist, his article as Xiang Yangsheng discussed by the municipal Secretariat); [[w.pu-weihua-zalan-jiu-shijie]], 78 (by Zhang Chunqiao''s account: Peng Zhen at Shanghai Dec. 26, 1965, to pull the criticism right: Yao''s article too to be "divided in two"; the Shanghai papers wrong to put the *Jiefangjun bao*''s note first). Made public: 2006. To check: [[w.pixian-chen-pixian-huiyilu]], 36 (cited by [[w.macfarquhar-maos-last-revolution]], 19 n.16). The day: the Peng Zhen nianpu has Peng arrive at Shanghai Dec. 26 and speak to Zhang that day ([[w.peng-zhen-nianpu-1902]], IV, 456, "12月26日 抵达上海，对张春桥说"). Yang has the Shanghai committee''s report to Peng on Dec. 26 and 27 ([[w.yang-jisheng-tiandi-fanfu]], I, 119); MacFarquhar (18) places the meeting after Peng''s December instruction to Deng Tuo. Names: Peng Zhen, Zhang Chunqiao.'
