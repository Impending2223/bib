      id: cal.1965-08-12.civil-disorders-watts-2
      when: Aug. 12
      date: '1965-08-12'
      thread: civil-disorders-watts
      c: Los Angeles and Sacramento. Police Chief Parker telephones General Roderic Hill, commander of the California National Guard, that troops might be needed. Hill names a liaison officer in Los Angeles, alerts the 40th Armored Division and informs Lieutenant Governor Anderson.
      n: '[[w.bernstein-guns-or-butter]], 384 (Thursday, "At 5 p.m."). The words: 5 p.m. (384). The time is Los Angeles''s clock, Parker''s end. The order: after [[cal.1965-08-12.civil-disorders-watts-3]], [[w.bernstein-guns-or-butter]], 383–84 (the account runs by the clock through these pages; at the meeting a boy says the rioters will strike "that evening"; then "At 5 p.m."). See [[cal.1965-08-11.states-and-cities]]. Names: Parker, Anderson.'
      tags:
      - name:parker-william-h
      - name:anderson-glenn-m
      - state:ca
      - city:los-angeles
      place:
      - los-angeles
      - sacramento
      time: 1965-08-13T00:00Z
      time_zone: America/Los_Angeles
      follows:
