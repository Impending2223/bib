      when: Aug. 13
      date: '1965-08-13'
      thread: civil-disorders-watts
      c: Athens. Governor Brown, reached by telephone in the afternoon, is briefed, orders the Guard called at once, asks for a study of a curfew, and says he will come home as soon as possible.
      n: '[[w.bernstein-guns-or-butter]], 384 ("That afternoon the governor was reached by phone in Athens"). The words: afternoon (384); the afternoon is taken as California''s, the clock of the book''s account of the day. The order: after [[cal.1965-08-13.civil-disorders-watts-3]], [[w.bernstein-guns-or-butter]], 384 (the officers'' agreement, then "That afternoon"). See [[cal.1965-08-11.states-and-cities]]. Names: Brown.'
