    base: 23d0944f
    set:
      c: 'Steel.{1} With the Steelworkers'' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor: a shutdown put off eight days, the bargaining moved to Washington.{2} In the Cabinet Room at 1 p.m., before photographers, Johnson asks for "a noninflationary settlement," tells them to remember "our boys in Vietnam," and sends them to Room 275 of the Executive Office Building, his suite as Vice President.{5} Aug. 26, he had telephoned both.{4}'
      n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965); The President''s News Conference, [1965 Pub. Papers 934](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408) (Aug. 26, 1965). [[w.dallek-flawed-giant]], 305 (both sides at the White House; the shutdown put off eight days); [[w.califano-triumph-and-tragedy-of]], 90–91 (the breakfast at 8 with Morse, Collins, Simkin; the parties at 1 p.m., "our boys in Vietnam"; Room 275 of the Executive Office Building; the back channel through Goldberg and Clifford; Eisenhower; the eight days'' postponement; Abel alone with Johnson); [[w.bernstein-guns-or-butter]], 361 (the ultimatum; the deadline put off eight days); [[w.califano-triumph-and-tragedy-of]], 90. To check: [[w.sheahan-wage-price-guideposts]]; handwritten notes of the meeting of Aug. 30, 1965, Diary Backup, LBJ Library (cited by [[w.dallek-flawed-giant]], 305). See [[cal.1963-04-11.steel]]. Names: Johnson, Abel, R. Conrad Cooper, Wirtz, Connor.'
      src:
        c: 092d3b75
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426: 1, 2'
        - 'https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=408: 4'
