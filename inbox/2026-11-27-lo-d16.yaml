      c: 'Jackson Hole, Wyo., in the middle of the American Forestry Association''s dinner. Johnson telephones Mrs. Johnson: Dr. Hurst with him, X-rays, it sounds like gallstones; he will keep his appointments but make no more, and no statement yet; Dr. Cain to come to the White House, more tests next day.'
      n: '[[w.johnson-white-house-diary]], 318 (Mrs. Johnson''s account: "In the middle of the dinner" she is called to the telephone). The words: In the middle of the dinner (318); the evening is the dinner''s, Jackson Hole''s clock. Made public: 1970. The order: after [[cal.1965-09-07.conservation]], the line''s own words (in the middle of the dinner). See [[cal.1965-09-07.succession]]. Names: Johnson, Lady Bird Johnson, Hurst.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:hurst-e-h
