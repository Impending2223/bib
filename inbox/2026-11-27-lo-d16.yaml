- edit:
    id: cal.1965-11-14.china-leadership
    base: 8d6de691
    set:
      time_band: predawn
      time_range:
      - 1965-11-13T16:00Z
      - 1965-11-13T22:00Z
      time_zone: Asia/Shanghai
      n: '[[w.zhou-enlai-nianpu-1949]], II, 764 (Nov. 14, 1965). See [[cal.1965-11-13.china-leadership-3]]. The words: 十四日凌晨 (II, 764), the small hours of the 14th; the line''s "at dawn" is the band''s: the nianpu gives no hour. The order: the night''s approval of the 13th, then 海战结束后 (after the fight) Zhou sends Chen Yi to the front. Names: Zhou Enlai, Chen Yi.'
- edit:
    id: cal.1965-11-24.china-leadership
    base: 77b0c4b0
