      when: Aug. 12
      date: '1965-08-12'
      thread: civil-disorders-watts
      c: Watts, Los Angeles. Thursday night, to 4 a.m. Friday, 500 police cannot restrain mobs that smash windows with rocks and loot stores. The first store fire has broken out; shortly before midnight rock-throwing and looting begin outside the police perimeter.
      n: '[[w.bernstein-guns-or-butter]], 384 (Thursday night "continuing until 4 a.m. Friday"; the perimeter line; the first store fire). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
      tags:
      - state:ca
      - city:los-angeles
      - ok:fields-time
      place: los-angeles
      time_range:
      - 1965-08-13T05:00Z
      - 1965-08-13T11:00Z
      time_zone: America/Los_Angeles
