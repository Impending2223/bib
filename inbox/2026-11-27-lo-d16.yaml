      when: Aug. 13
      date: '1965-08-13'
      thread: civil-disorders-watts
      c: Watts, Los Angeles. Early in the afternoon rioters set systematic fire to two blocks of 103rd Street and snipers drive off firemen; by late afternoon gangs have spread the riot 50 or 60 blocks to the north.
      n: '[[w.bernstein-guns-or-butter]], 385 (Friday: "Early Friday afternoon"; "By late afternoon"). The words: early afternoon, late afternoon (385). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
      tags:
