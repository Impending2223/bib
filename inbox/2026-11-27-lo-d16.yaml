      c: Watts. The first death, a bystander caught in an exchange of gunfire, between 6 and 7 p.m.
      n: '[[w.bernstein-guns-or-butter]], 385 ("between 6:00 and 7:00"; Friday). The words: between 6:00 and 7:00 (385). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
