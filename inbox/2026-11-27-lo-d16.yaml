      c: White House Theater, 9 p.m. On television, Johnson, Abel and Cooper beside him, announces the shutdown put off eight days; the talks to resume at 10 p.m.
      n: 'Televised Statement by the President Announcing Postponement of a Shutdown in the Steel Industry, [1965 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=426) (Aug. 30, 1965). [[w.califano-triumph-and-tragedy-of]], 91 (the postponement announced "at precisely 9 p.m." so the networks could carry it live; Abel and Cooper flanking Johnson; the negotiations resuming at 10 p.m.). The words: 9 p.m. (Pub. Papers 952 note: "read the statement at 9 p.m. in the White House Theater"). The order: after [[cal.1965-08-30.steel]], [[w.califano-triumph-and-tragedy-of]], 91 (the parties agree "A few hours after arriving" at the White House, then the announcement). See [[cal.1965-08-30.steel]]. Names: Johnson, Abel, R. Conrad Cooper.'
      tags:
      - name:johnson-lyndon-b
      - name:abel-i-w
      - name:cooper-r-conrad
