      when: Aug. 12
      date: '1965-08-12'
      thread: civil-disorders-watts
      c: Los Angeles and Sacramento. Police Chief Parker telephones General Roderic Hill, commander of the California National Guard, that troops might be needed. Hill names a liaison officer in Los Angeles, alerts the 40th Armored Division and informs Lieutenant Governor Anderson.
      n: '[[w.bernstein-guns-or-butter]], 384 (Thursday, "At 5 p.m."). The words: 5 p.m. (384). The time is Los Angeles''s clock, Parker''s end. See [[cal.1965-08-11.states-and-cities]]. Names: Parker, Anderson.'
      tags:
      - name:parker-william-h
      - name:anderson-glenn-m
      - state:ca
      - city:los-angeles
      place:
      - los-angeles
      - sacramento
      time: 1965-08-13T00:00Z
      time_zone: America/Los_Angeles
- add:
    entry:
      id: cal.1965-08-12.civil-disorders-watts-3
      when: Aug. 12
      date: '1965-08-12'
      thread: civil-disorders-watts
      c: Los Angeles. The Human Relations Commission holds a meeting with neighborhood groups and community leaders; the theme, that residents stay indoors; Mrs. Frye calls for peace. A black high school boy at the microphone says rioters will attack nearby white areas. At the close black leaders propose that white officers be withdrawn and black policemen in civilian clothes and unmarked cars replace them. The police reject it; the rioting resumes.
      n: '[[w.bernstein-guns-or-butter]], 383–84 (Thursday; the meeting; the proposal; the police''s rejection). See [[cal.1965-08-11.states-and-cities]].'
      tags:
      - state:ca
      - city:los-angeles
      place: los-angeles
