      n: '[[w.johnson-white-house-diary]], 315 (Mrs. Johnson''s account: "About 4 I got word from him to turn on my TV"; her call; Cooper and Abel). The words: About 4 (315), the word from Johnson, the Ranch''s clock; the broadcast was at 6:30 p.m. Washington time. Made public: 1970. The order: after [[cal.1965-09-03.steel]], the line''s own words (she watches the announcement). See [[cal.1965-09-03.steel]]. Names: Lady Bird Johnson, Johnson, Abel, R. Conrad Cooper.'
