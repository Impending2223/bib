      id: cal.1965-08-14.civil-disorders-watts-3
      when: Aug. 14
      date: '1965-08-14'
      thread: civil-disorders-watts
      c: Los Angeles. The curfew goes into effect, 8 p.m. Saturday; anyone on the street is arrested. At midnight 13,900 Guardsmen, 934 city police and 719 sheriff's deputies are on duty. Except for a block of stores burned on Broadway between 46th and 48th Streets, the night is quiet.
      n: '[[w.bernstein-guns-or-butter]], 385 (the curfew "at 8 p.m. on Saturday"; the totals "At midnight Saturday"). The words: 8 p.m. (385). The time is the curfew''s, Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
      tags:
      - state:ca
      - city:los-angeles
      - ok:fields-time
      place: los-angeles
      time: 1965-08-15T03:00Z
      time_zone: America/Los_Angeles
