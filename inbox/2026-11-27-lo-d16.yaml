      time: 1965-08-28T00:55Z
      time_approx: true
      time_zone: America/New_York
      c: 'Califano wires Johnson, at the Ranch for his birthday: Simkin''s action endangers the administration''s aims; Johnson should send personal emissaries to Pittsburgh to set the parties straight. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89 (Simkin''s action "so dangerous to our objectives that I wired him there"; the emissaries to Pittsburgh); 89 n.9 gives the memo, Califano to Johnson, Aug. 27, 1965, 8:55 p.m. The time is that memo''s, in Washington''s clock. Check: that the memo of 8:55 p.m. is the wire the text describes. To check: Califano to Johnson, Aug. 27, 1965, 8:55 p.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 89 n.9). The order: after [[cal.1965-08-27.transition-and-staff]], [[w.obrien-no-final-victories]], 199 (the talk with O''Brien on a Friday afternoon, before Johnson leaves for the Ranch); after [[cal.1965-08-27.steel]], [[w.califano-triumph-and-tragedy-of]], 89 (Simkin''s suggestion, then "I wired him there"). See [[cal.1965-08-27.steel]]. Names: Califano, Johnson, Simkin.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:simkin-william-e
- add:
    entry:
      id: cal.1965-08-27.steel-3
      when: Aug. 27
      date: '1965-08-27'
      place:
      - lbj-ranch
      - washington
      thread: steel
      follows:
      - cal.1965-08-27.steel-2
      c: 'Johnson telephones Califano from the Ranch: send Senator Wayne Morse and LeRoy Collins to Pittsburgh to mediate. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89 ("Johnson called me from the ranch"; Morse and Collins to mediate; Morse a surprise choice). The order: after [[cal.1965-08-27.steel-2]], [[w.califano-triumph-and-tragedy-of]], 89 (the wire, then the call). See [[cal.1965-08-27.steel]]. Names: Johnson, Califano, Morse, Collins.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:morse-wayne
      - name:collins-leroy
