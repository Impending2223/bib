      id: cal.1965-08-13.civil-disorders-watts-7
      when: Aug. 13
      date: '1965-08-13'
      thread: civil-disorders-watts
      c: Watts, Los Angeles. By 8 a.m. many fires have been set and looting is rampant, especially in the Watts business district. Ambulance drivers and firemen refuse to enter the riot area without an armed escort.
      n: '[[w.bernstein-guns-or-butter]], 384 (Friday, "By 8 a.m."). The words: By 8 a.m. (384); the hour is the latest the book gives, so the time is marked approximate. The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
      tags:
      - state:ca
      - city:los-angeles
      place: los-angeles
      time: 1965-08-13T15:00Z
      time_approx: true
      time_zone: America/Los_Angeles
