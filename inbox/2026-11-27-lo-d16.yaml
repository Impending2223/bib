      - 1965-09-04T17:00Z
      time_zone: Asia/Karachi
      c: 'Karachi 卡拉奇. At a press conference Chen Yi says China fully sympathizes with and supports the Kashmiri people''s just struggle against India''s brutal rule, strongly condemns India''s breaking of the cease-fire line and widening of the conflict, and firmly supports Pakistan''s just counteraction. The Kashmir question should be settled by the Kashmiris'' wishes, by the pledge India and Pakistan gave them. On Vietnam: the "Vietnam question" is the U.S. aggression; any mediation that does not weigh right and wrong serves the U.S.'
      n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 48–49 (Sept. 4, 1965); [[w.chen-yi-nianpu]], 1117–1118 (Sept. 4, 1965, 晚上, the press conference, after the Chinese ambassador''s banquet; the Vietnam passage runs onto 1118). The words: 晚上 (1117). The order: after [[cal.1965-09-04.china-leadership-8]], the printed order alone ([[w.chen-yi-nianpu]], 1117). See [[cal.1965-09-04.china-leadership-2]]. Names: Chen Yi.'
      tags:
      - polity:prc
      - polity:pakistan
      - polity:india
      - name:chen-yi
