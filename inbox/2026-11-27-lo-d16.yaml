      time: 1965-08-28T00:55Z
      time_zone: America/New_York
      c: 'Califano wires Johnson, at the Ranch for his birthday: Simkin''s action endangers the administration''s aims; Johnson should send personal emissaries to Pittsburgh to set the parties straight. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89 (Simkin''s action "so dangerous to our objectives that I wired him there"; the emissaries to Pittsburgh); [[w.califano-triumph-and-tragedy-of]], 89 n.9 (the note to the wire''s sentence: "JAC memo to LBJ, August 27, 1965, 8:55 p.m."). The time is that memo''s, Washington''s clock. To check: President''s Daily Diary, Aug. 27, 1965; Califano to Johnson, Aug. 27, 1965, 8:55 p.m., LBJ Library (both cited by [[w.califano-triumph-and-tragedy-of]], 89 n.9). The order: after [[cal.1965-08-27.transition-and-staff]], [[w.obrien-no-final-victories]], 199 (the talk with O''Brien "one Friday afternoon in late August, just before he was to leave for a weekend at the LBJ Ranch"); after [[cal.1965-08-27.steel]], [[w.califano-triumph-and-tragedy-of]], 89 (Simkin''s suggestion, then "I wired him there"). See [[cal.1965-08-27.steel]]. Names: Califano, Johnson, Simkin.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
      - name:simkin-william-e
- add:
    entry:
      id: cal.1965-08-28.steel-2
      when: Aug. 28
      date: '1965-08-28'
      place:
      - lbj-ranch
      - washington
      thread: steel
      c: 'Johnson telephones Califano from the Ranch: send Senator Wayne Morse and LeRoy Collins to Pittsburgh to mediate. By Califano''s account.'
      n: '[[w.califano-triumph-and-tragedy-of]], 89 ("Johnson called me from the ranch"; Morse and Collins to mediate; Morse a surprise choice); [[w.califano-triumph-and-tragedy-of]], 89 n.10 (the day: "PDD, August 28, 1965"). Check: the day; Califano''s text gives none, its note the President''s Daily Diary of Aug. 28. To check: President''s Daily Diary, Aug. 28, 1965 (cited by [[w.califano-triumph-and-tragedy-of]], 89 n.10). See [[cal.1965-08-27.steel]]. Names: Johnson, Califano, Morse, Collins.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:morse-wayne
      - name:collins-leroy
      - ok:fields-place
