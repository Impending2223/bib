      c: Los Angeles. An Emergency Control Center opens at police headquarters, 7:30 p.m.
      n: '[[w.bernstein-guns-or-butter]], 384 ("opened at 7:30"; Thursday). The words: 7:30 (384). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]].'
