      when: Aug. 13
      date: '1965-08-13'
      thread: civil-disorders-watts
      c: Sacramento. Lieutenant Governor Anderson, reluctant to act in Governor Brown's absence, meets Guard officers; they agree that 2,000 troops be assembled at armories by 5 p.m.
      n: '[[w.bernstein-guns-or-butter]], 384 (Friday; the officers'' agreement). The order: after [[cal.1965-08-13.civil-disorders-watts-2]], [[w.bernstein-guns-or-butter]], 384 (Parker''s call at 10:50, then Anderson''s meeting). See [[cal.1965-08-11.states-and-cities]]. Names: Anderson, Brown.'
