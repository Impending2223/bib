      n: '[[w.anderson-confronting-the-color-line]], 161–62; [[w.ralph-northern-protest]], 37 (Gregory leading; thousands of whites; the marchers arrested); [[w.cohen-american-pharaoh]], 341–42 (two thousand whites, eggs, tomatoes and rocks; sixty-five marchers arrested, Gregory among them; Daley: "People in their homes have a right to privacy"). Check: Ralph dates the hecklers'' attack the night of Aug. 2 (37). Check: Cohen and Taylor date the riot in Bridgeport Aug. 2 (341). To check: *Chicago Sun-Times*, 4 August 1965 (cited by [[w.anderson-confronting-the-color-line]], 162 n.32). See [[cal.1965-07-29.desegregation-schools]]. The time is the march''s: the marches to Daley''s home "took place at night," the one of Aug. 1 "until 3:00 a.m." ([[w.anderson-confronting-the-color-line]], 161); Gregory''s were "a series of evening marches into Bridgeport" ([[w.cohen-american-pharaoh]], 341). The range runs from the evening''s start to that hour; no source gives the march''s start. Names: Daley, Raby.'
