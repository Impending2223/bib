      c: 'Illinois Representative Shipley''s secretary telephones the White House Usher''s Office, 7:45 a.m.: the discharge petition one name short of a majority, he is flying in from his district to sign. The usher tells Johnson.'
      n: '[[w.califano-triumph-and-tragedy-of]], 229 ("one vote short, at 7:45 a.m. on September 3, 1965"; Shipley "flying in from his district to sign the discharge petition"; the usher "notified the President"). The words: 7:45 a.m. (229). To check: White House Usher memo to LBJ, Sept. 3, 1965, 7:45 a.m., LBJ Library (cited by [[w.califano-triumph-and-tragedy-of]], 229 n.2). See [[cal.1965-09-03.states-and-cities]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
