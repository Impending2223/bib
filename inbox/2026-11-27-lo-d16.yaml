      when: Aug. 13
      date: '1965-08-13'
      thread: civil-disorders-watts
      c: Los Angeles and Sacramento. Parker concludes that the situation is out of control and telephones the governor's office at Sacramento, 10:50, for 1,000 National Guard troops.
      n: '[[w.bernstein-guns-or-butter]], 384 ("At 10:50 Chief Parker ... called the governor''s office in Sacramento"; Friday). The words: 10:50 (384). The time is Los Angeles''s clock. See [[cal.1965-08-11.states-and-cities]]. Names: Parker.'
      tags:
      - name:parker-william-h
      - state:ca
