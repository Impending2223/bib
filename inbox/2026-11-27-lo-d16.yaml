      n: '[[w.shulimson-u-s-marines-in]], 98–104 (103: the 5th ARVN Regiment out of Thăng Bình on Dec. 8; "At 1330" the rangers ambushed by the 70th VC Battalion, overrun in the first fifteen minutes); [[w.vietnam-victory-in-vietnam]], 160 (the 5th Regimental Task Force beaten off at Đồng Dương); [[w.lich-su-khang-chien-chong-my]], IV, 63 (Liên Kết 18, opened to relieve the Việt An post; the Marines landed Dec. 9 and 10). [[w.macv-command-history-1965]], 164–65 (the operation from Dec. 8; the 11th Rangers overrun). The time is the ambush''s, 1330, Saigon''s clock (Shulimson, 103).'
