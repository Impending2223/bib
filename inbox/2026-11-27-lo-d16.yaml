      when: Aug. 17
      date: '1965-08-17'
      thread: civil-disorders-watts
      c: Los Angeles. Governor Brown lifts the curfew, Tuesday.
      n: '[[w.bernstein-guns-or-butter]], 386 ("Governor Brown lifted the curfew on Tuesday"; Tuesday after Sunday, Aug. 15). See [[cal.1965-08-11.states-and-cities]]. Names: Brown.'
      tags:
      - name:brown-edmund-g
      - state:ca
      - city:los-angeles
      place: los-angeles
