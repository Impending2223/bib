      c: Damascus 大马士革. Chen Yi holds talks with Nur al-Din al-Atasi, vice-chairman of the Presidential Council, Munif al-Razzaz, the Arab Baath Socialist Party's secretary-general, and Foreign Minister Hasan Murawid. The talks with al-Atasi go on Sept. 6.
      n: '[[w.zhonghua-renmin-gongheguo-waijiao]], 49 (Sept. 5–6, 1965); [[w.chen-yi-nianpu]], 1118 (Sept. 5, 1965, 晚上, the talks with al-Atasi 努尔丁·阿塔西, al-Razzaz 穆尼夫·拉泽兹 and Muraywid 哈桑·穆拉维德), 1119 (Sept. 6, 晚上, 同努尔丁·阿塔西继续举行会谈). The words: 晚上 (1118). The time is the first day''s. The order: after [[cal.1965-09-05.china-leadership-10]], the printed order alone ([[w.chen-yi-nianpu]], 1118). See [[cal.1965-09-05.china-leadership]]. Names: Chen Yi, Nur al-Din al-Atasi, Hasan Murawid.'
