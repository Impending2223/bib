    text: >-
      "[Record of Conversation between Premier Zhou Enlai and Comrade Foreign Minister Ung Van Khiem](https://digitalarchive.umd.edu/document/176892)" (Aug. 21, 1961), PRC FMA 109-03747-02, 85–94, trans. Stephen Mercado, Wilson Center Digital Archive (Zhou's account on Aug. 21 of the talk on the 13th: he and Liu Shaoqi asked Hồ whether he had taken the mediation between Albania and Moscow on his own initiative, and he said he had, with the CPSU's assent; they told him his heart was good and his method wrong. Phạm Văn Đồng had arrived that morning and Hồ that afternoon; the record gives no hour for the talk).
