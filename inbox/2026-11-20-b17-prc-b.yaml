patch: 2026-11-20-b17-prc-b
by: 'Claude (batch 17, reader 2: the PRC Foreign Ministry files, the rest, and the two Mao Zedong sixiang wansui excerpts), Nov. 20, 2026'
ops:
- add:
    entry:
      id: cal.1961-02-08.china-leadership-5
      when: Feb. 8
      date: '1961-02-08'
      time: 1961-02-08T08:00Z
      time_zone: Asia/Shanghai
      place: peking
      thread: china-leadership
      also:
      - laos
      - soviet-union
      - vietnam-hanoi
      c: 'Chen Yi to Chervonenko on Laos, 4 p.m.: the reply China gave Hoàng Văn Hoan on Feb. 6. Hope lies in the front line, not in the conference, which cannot be refused; the Lao should mass their forces and destroy the enemy''s effective strength. He objects to Vietnamese troops sent to the Plain of Jars and Sam Neua: they should stay off the front and the war inside Laos.'
      n: '"[Transcript of Vice Premier Cheny Yi and Soviet Ambassador S.V. Chervonenko discussing the Laos Issue](https://digitalarchive.umd.edu/document/120874)" (Feb. 8, 1961), PRC FMA 109-03754-03, 72–82, obtained by Yiming Feng, trans. Marian Rosenberg, Wilson Center Digital Archive. The record gives the time as 4:00 p.m. and the place as the State Council Foreign Affairs Office Reception Hall. Chen Yi''s figures, as he gives them: the Lao Patriotic Front 6,000 men and Kong Le 1,100, with 3,000 to 4,000 guerrillas, 11,100 in all; Phoumi and Boun Oum 48,000 in 31 battalions, 13 of them at the Plain of Jars; China has sent Hanoi arms for 10,000. He says the Vietnamese Politburo had told China it opposed sending troops to Laos, and that Zhang Hanfu gave Sudarikov China''s reply on Feb. 6. Names: Chen Yi, Chervonenko. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:chen-yi
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1961-03-25.laos
      when: Mar. 25
      date: '1961-03-25'
      time_range:
      - 1961-03-24T23:00Z
      - 1961-03-25T05:00Z
      time_band: morning
      time_zone: Asia/Bangkok
      place: hanoi
      thread: laos
      also:
      - vietnam-hanoi
      - china
      - soviet-union
      c: 'He Wei, Hanoi, to the Foreign Ministry: that morning at the Foreign Ministry Nguyễn Chí Thanh told him and the Soviet ambassador that the war in Laos "develops quite well". Sala Phou Khoun taken, central Laos freed and Savannakhet threatened, but no attack yet on Luang Prabang or Vientiane, he says. A political campaign is to go with the offensive; he asks China and the Soviet Union for their views and for what they know of American policy.'
      n: '"[Cable from He Wei, ''Comrade Nguyễn Chí Thanh Talked about the Situation in Laos with Me and the Soviet Ambassador''](https://digitalarchive.umd.edu/document/120594)" (Mar. 25, 1961), PRC FMA 109-03034-05, trans. Qingfei Yin, Wilson Center Digital Archive. Headed "From DRV Station", expedient emergency, C 1113; the cable gives no hour for the meeting and names neither the Soviet ambassador nor the Foreign Ministry''s city. Names: Nguyễn Chí Thanh. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:drv
      - polity:ussr
      - name:nguyen-chi-thanh
      - vis:only:prc+drv+ussr
      - vis:frame:prc
- add:
    entry:
      id: cal.1961-05-05.laos
      when: May 5
      date: '1961-05-05'
      thread: laos
      also:
      - soviet-union
      - china
      c: Pushkin, Soviet deputy foreign minister, tells Liu Xiao, the Chinese ambassador, how Moscow means to go into the Geneva conference on Laos. Peking, Hanoi and Warsaw agree, he says, on using it to build up the Lao people's strength; the Lao government, army and elections are not its business, neutrality and the Control Commission's limits are. Moscow will press for seating the Patriotic Front and for Britain as co-chair; Sihanouk's refusal to attend is "childish" and will not delay it.
      n: '"[Record of Conversation between Soviet Union Deputy of Foreign Affairs Pushkin and Ambassador Liu Xiao](https://digitalarchive.umd.edu/document/120885)" (May 5, 1961), PRC FMA 109-03755-02, 112–119, obtained by Yiming Feng, trans. Jake Tompkins, Wilson Center Digital Archive. Ministry of Foreign Affairs document, top secret, No. 329; the record gives the time as 11:00 a.m. and gives no place. Pushkin adds that the Control Commission had met and would leave for Laos next day if its instructions were settled that day, and that the British ambassador had called on him that afternoon. Names: Pushkin. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:pushkin-georgiyi-maksimovich
      - vis:only:prc+ussr
      - ok:fields-place
- add:
    entry:
      id: cal.1964-06-29.china-leadership-8
      when: June 29
      date: '1964-06-29'
      thread: china-leadership
      also:
      - china
      - soviet-union
      - africa
      c: 'Foreign Ministry, Circular No. 80 to embassies and agencies abroad: a summary, not reviewed by Zhou, of what he told a Kenyan government delegation in May on the Sino-Soviet dispute. By the summary Zhou says the dispute will not hurt the anti-imperialist struggle but strengthen it, and that the Soviet leaders fear revolution. A world war is unlikely, he says; China would respond at once if the United States attacked the Soviet Union, and a United States that invaded China could not get out.'
      n: '"[Cable from the Chinese Foreign Ministry, ''Premier Zhou Talked about the Relationship between China-Soviet Difference and the National Liberation Movement''](https://digitalarchive.umd.edu/document/121188)" (June 29, 1964), PRC FMA 109-02372-02, 9–12, trans. David Cowhig, Wilson Center Digital Archive. Outgoing (64) Si-889, Diplomatic Circular #80, not to be sent to Vientiane or Chuanxiong. The circular says the talk was "last month". See [[cal.1964-05-05.china-leadership]]. Names: Zhou Enlai. Check: the day of the talk, in the delegation''s stay of May 3–11. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:kenya
      - name:zhou-enlai
      - vis:only:prc+kenya
      - vis:frame:prc
- add:
    entry:
      id: cal.1964-10-17.china
      when: Oct. 17
      date: '1964-10-17'
      thread: china
      also:
      - testing
      c: 'The Chinese embassy in North Korea to the Foreign Ministry: reactions to the first test. Vice Premier Jeong Il-Yong calls it a great contribution to world peace and the world revolution; officials of the State Security and Social Security ministries congratulate the embassy''s people, and the Korean Central News Agency carries the news. The Vietnamese ambassador and the diplomatic corps come to congratulate Ambassador Hao Deqing and present flowers.'
      n: '"[Cable from the Chinese Embassy in North Korea, ''Reactions to China''s Nuclear Test''](https://digitalarchive.umd.edu/document/134751)" (Oct. 17, 1964), PRC FMA 113-00395-08, 58–59, trans. Caixia Lu, Wilson Center Digital Archive. Received at the Foreign Ministry''s North Korea desk, incoming (64) You (709). Jeong spoke to a Chinese coal-industry delegation, the cable says, on the morning of the 17th; Vietnamese trainees heard the broadcast at midnight on the 16th. See [[cal.1964-10-16.testing]]. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:dprk
      - polity:drv
      - vis:only:prc
      - ok:fields-place
