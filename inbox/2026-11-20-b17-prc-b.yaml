    id: cal.1965-02-05.china-leadership
    text: >-
      "[Record of the First Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin](https://digitalarchive.umd.edu/document/165488)" (Feb. 6, 1965 by the Archive; Feb. 5 by the record), PRC FMA 109-03957-04, 1–21, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 75, the Premier and Chen not having reviewed it; the first contact, 3 p.m. on Feb. 5, on the way from the airport to the Diaoyutai State Guest House, Yan Mingfu interpreting. Kosygin asks to call on Mao and Liu; he and Zhou agree on joint action for Vietnam, Zhou saying the Americans must withdraw under the 1954 Geneva accords; Zhou blames the Americans for Laos; Kosygin says the CPSU has a new attitude to the Mar. 1 meeting, and Zhou says to start afresh; at the hotel, in notes written from memory, Kosygin asks whether China favors the Wilson government. Part Two, Chen Yi with Andropov, and Part Three are not printed in the file).
    units: A
- primary:
    id: cal.1965-02-10.china-leadership-5
    text: >-
      "[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 87, the Premier and Chen not having reviewed it; 3:20 p.m., on the way from the airport to the Diaoyutai State Guest House, Yan Mingfu interpreting. Kosygin says the Soviet Union will give Vietnam ground-to-air missiles, artillery and tanks free, with officers to instruct, cancel its loan interest, about fifty million new rubles, and give six fishing vessels; Zhou offers Chinese railways to carry them; both are for joint action and for keeping war from breaking out; they set talks on state relations for 9 a.m. next day. Part 2, Chen Yi with Andropov, is only a title in the file).
    units: A
- primary:
    id: cal.1965-03-31.china-leadership
    text: >-
      "[Record of the Second Meeting between Premier Zhou and President Ben Bella](https://digitalarchive.umd.edu/document/165405)" (Mar. 31, 1965), PRC FMA 203-00651-02, 55–85, trans. Stephen Mercado, Wilson Center Digital Archive (top secret document 284, the Premier not having reviewed it; "Morning, 31 March 1965", Villa Joly, the Algerian Presidential Palace. Ben Bella explains why Algeria passed U Thant's proposal to China and gives his views on a cease-fire in Vietnam and on Africa; Zhou on Vietnam, the Soviet Union's stand, the Second Asian-African Conference and the United Nations: outside it China may criticize it, the criticism aimed at the United States, and it opposes the two great powers' control and France's five-power proposal).
    units: A, B, C, D, E
