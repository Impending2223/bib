      c: Kuznetsov, Soviet first deputy foreign minister, tells the Chinese side that Johnson and Wilson both want to visit the Soviet Union and that Kosygin will also visit the United States and Britain, the dates not fixed.
      n: '"[Record of the First Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin](https://digitalarchive.umd.edu/document/165488)" (Feb. 6, 1965), PRC FMA 109-03957-04, 1–21, trans. Stephen Mercado, Wilson Center Digital Archive. Part Three, among the record''s list of other comrades'' conversations; the file prints it only in the list of contents, and names no Chinese listener or hour. See [[cal.1965-02-05.china-leadership-8]]. Names: Kuznetsov. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:kuznetsov-vasily-v
      - vis:only:prc+ussr
