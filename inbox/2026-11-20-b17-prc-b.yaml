      n: '"[Record of the Fifth Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin (1)](https://digitalarchive.umd.edu/document/165487)" (Feb. 10, 1965), PRC FMA 109-03957-06, 121–135, trans. Stephen Mercado, Wilson Center Digital Archive. Top secret document 87, Part 2, "Summary of Conversation of Vice Premier Chen and Andropov", the Premier and Chen not having reviewed it; the file prints the part''s title and none of its text. The record gives the time as 3:20 p.m. and the place as the way from the airport to the Diaoyutai State Guest House. See [[cal.1965-02-10.china-leadership-5]]. Names: Chen Yi, Andropov. Check: the year the Archive posted the document.'
