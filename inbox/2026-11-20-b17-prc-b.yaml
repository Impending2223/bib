      c: Chen Yi and Andropov talk on the way from the airport to the Diaoyutai guesthouse. By the record's summary Andropov says the Soviet delegation's visit to Vietnam is to strengthen party and state ties and settle technical military aid, and that China and the Soviet Union should talk on supporting the Vietnamese people. He says the CPSU has a new view of the Mar. 1 meeting and the Chinese comrades should change theirs, and that the delegation returns through Peking after four days in Vietnam.
      n: '"[Record of the First Contact between Premier Zhou and Vice Premier Chen Yi and Kosygin](https://digitalarchive.umd.edu/document/165488)" (Feb. 6, 1965), PRC FMA 109-03957-04, 1–21, trans. Stephen Mercado, Wilson Center Digital Archive. The Archive dates the record Feb. 6; the record itself gives Feb. 5, 3 p.m., on the way from the airport to the Diaoyutai State Guest House. Top secret document 75, Part Two, the Premier and Chen not having reviewed it; the file prints this part only as an item in the record''s list of contents, not its text. See [[cal.1965-02-05.china-leadership]]. Names: Chen Yi, Andropov. Check: the year the Archive posted the document.'
      tags:
      - polity:prc
      - polity:ussr
      - name:chen-yi
      - name:andropov-yuriy-vladimirovich
      - vis:only:prc+ussr
