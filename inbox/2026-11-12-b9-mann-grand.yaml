      c: 'Johnson, doubting reprisals for Biên Hòa, has Moyers ask Louis Harris "if a failure to respond to this attack immediately will be taken by the voters as a sign of weakness by the administration."
        Harris: "That is the sort of thing people would expect from Barry Goldwater and probably the main reason they are voting for him."'
      n: '[[w.mann-grand-delusion]], 379. Check: the day; Mann places it after the attack of Nov. 1 and before Johnson''s refusal to retaliate. See [[cal.1964-11-01.vietnam]]. Names: Johnson, Moyers, Harris,
