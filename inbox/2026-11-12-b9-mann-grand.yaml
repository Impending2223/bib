      c: 'CBS Radio Network. Nixon: "As long as there is a chance for an honorable peace through the Paris talks, candidates should offer nothing in the political arena that would risk undercutting our
        negotiators. I hope President Johnson can honorably end this war. I hope it can be done quickly." The pledge made "when the Paris talks began last April": "I would do nothing that might interfere";
        "tonight, I reaffirm that pledge and commitment."'
      n: '[[w.mann-grand-delusion]], 621. See [[cal.1968-10-26.elections-1968-2]]. Names: Nixon, Johnson.'
