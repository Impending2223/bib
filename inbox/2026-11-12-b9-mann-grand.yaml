patch: 2026-11-12-b9-mann-grand
by: 'Claude (batch 9: Mann, A Grand Delusion, the "already in" rows read by the card), Nov. 12, 2026'
ops:
- cite:
    id: cal.1960-04-26.vietnam
    item: '[[w.mann-grand-delusion]], 219 (a group of noncommunist leaders, some former ministers, meet in Saigon in April 1960 and issue a manifesto against Diem''s repression; not the number, the Caravelle,
      the names, the day or the other complaints)'
    units: '?'
- cite:
    id: cal.1960-09-16.vietnam
    item: '[[w.mann-grand-delusion]], 218 (Durbrow, Sept. 1960: "it may become necessary for [the] US Government to begin consideration [of] alternative courses of action and leaders" should Diem not enact
      reforms; not the day, the danger or the steps to save the government)'
    units: C
- cite:
    id: cal.1960-10-14.vietnam
    item: '[[w.mann-grand-delusion]], 219 (October: Durbrow, with Washington''s leave, talks frankly with Diem on reform; the changes spelled out are a minister of national defense and a chain of command,
      an end to favoritism in promotions, decentralization, the Can Lao Party reformed or dissolved, a freer press, local elections; Diem noncommittal, not rejecting them; not the day, Nhu''s and Tuyến''s
      going abroad, the cabinet, the Assembly or the Civil Guard)'
    units: '?'
- cite:
    id: cal.1960-11-11.vietnam
    item: '[[w.mann-grand-delusion]], 219 (mid-November: junior officers storm the palace; Diem promises political reforms and free elections; troops loyal to him intervene and the coup is put down; not
      the day, the paratroops or Thi, the surrender of Nov. 12 or Cambodia)'
    units: C
- cite:
    id: cal.1960-12-04.vietnam
    item: '[[w.mann-grand-delusion]], 220 (Durbrow''s cable of Dec. 4: "we may well be forced, in the not too distant future, to undertake [the] difficult task of identifying and supporting alternate leadership";
      he urges holding the 20,000 more troops Diem wants until Diem eases "his heavy-handed methods of operation"; not the Viet Cong or "widespread popular dissatisfaction")'
    units: D
- cite:
    id: cal.1960-12-20.vietnam
    item: '[[w.mann-grand-delusion]], 220 (the NLF as of the end of 1960: the political successor to the Vietminh, with Communists, religious groups and parties among its members, and broad appeals for
      independence, social justice and reform; not the congress, Tây Ninh, the day, the manifesto or the program)'
    units: '?'
- cite:
    id: cal.1961-01-19.laos
    item: '[[w.mann-grand-delusion]], 228–29 (the meeting of Jan. 19: Herter, the outgoing Secretary of State, argues the United States duty-bound to intervene if Laos asks under SEATO, "the cork in the
      bottle"; Eisenhower "felt we should intervene," by Kennedy''s record that day; Clifford, present, recalls Eisenhower willing "as a last desperate hope, to intervene unilaterally"; not the order of
      the meeting or the Cuba talk)'
    units: '?'
- cite:
    id: cal.1961-03-23.laos
    item: '[[w.mann-grand-delusion]], 229 (Mar. 23: Kennedy on national television, pointing to large maps of the region: "The security of all Southeast Asia will be endangered if Laos loses its neutral
      independence"; in late March the Seventh Fleet on alert for possible deployment off Thailand; not a press conference, the Pathet Lao''s advance, the Marines or SEATO)'
    units: '?'
- cite:
    id: cal.1961-05-11.vietnam
    item: '[[w.mann-grand-delusion]], 233 (May 11: Kennedy approves a large part of the task force report: the special forces training team, a larger MAAG, a study of raising South Vietnam''s army to 200,000,
      and "size and composition of forces" for "a possible commitment" of U.S. troops; not NSAM 52 by name or Nolting)'
    units: '?'
- cite:
    id: cal.1961-05-09.vietnam
    item: '[[w.mann-grand-delusion]], 236 (Johnson leaves Washington May 9 on a two-week trip to the Far East and arrives in Saigon the evening of May 11; not "the Churchill of Asia")'
    units: A
- cite:
    id: cal.1961-05-12.vietnam
    item: '[[w.mann-grand-delusion]], 236–37 (the morning of May 12: Johnson with Diem, Kennedy''s four-page letter reviewed "point by point"; Diem agrees to a MAAG increase and accepts more aid for his
      army and civil guard; reticent on U.S. combat troops, "no appetite," by Young''s cable; not the hour, the figures, the memorandum or "only in case of overt aggression")'
    units: '?'
- cite:
    id: cal.1961-11-03.vietnam
    item: '[[w.mann-grand-delusion]], 244–45 (Taylor presents the mission''s recommendations Nov. 3: joint planning, three new helicopter squadrons and light aircraft, "a radical increase" of U.S. trainers
      at every level, more special forces, and eight to ten thousand American soldiers thinly disguised as a flood relief force)'
    units: A
- cite:
    id: cal.1961-11-08.vietnam
    item: '[[w.mann-grand-delusion]], 248 (McNamara to Kennedy, in a memorandum Mann dates Nov. 5: the fall of South Vietnam would be a serious blow, "the introduction of U.S. forces on a substantial scale"
      needed, as many as 220,000 men at the upper limit, an initial force of under ten thousand "will not convince the other side"; not Gilpatric or the Chiefs)'
    units: '?'
- check:
    id: cal.1961-11-08.vietnam
    text: 'Check: Mann, 248, dates McNamara''s memorandum to Kennedy Nov. 5; the entry has Nov. 8.'
- cite:
    id: cal.1961-11-15.vietnam
    item: '[[w.mann-grand-delusion]], 250–51 (the NSC of Nov. 15: Kennedy wary of "becoming involved simultaneously on two fronts on opposite sides of the world"; Korea "a clear case of aggression," Vietnam
      "more obscure and less flagrant"; the contrast with Berlin might make leading Democrats in Congress wary; McNamara would urge action "if SEATO did not exist"; Lemnitzer on Cuba; not the hour, Rusk''s
      draft, the 10,000 miles or the guerrillas)'
    units: B, C
- cite:
    id: cal.1961-11-22.vietnam
    item: '[[w.mann-grand-delusion]], 251–52 (a week after the NSC meeting, NSAM 111: more helicopters and aircraft manned by U.S. uniformed personnel, air reconnaissance, air-ground support, the civil
      guard and self-defense corps, intelligence, economic aid; Diem to "put the nation on a wartime footing"; the large infusion of troops Taylor, Rostow and McNamara urged not authorized; not airlift
      or "advisers with the units")'
    units: A, C
- cite:
    id: cal.1963-05-12.vietnam
    item: '[[w.mann-grand-delusion]], 284 (Nhu to the *Washington Post*, a front-page story of May 12: "South Vietnam would like to see half of the 12,000 to 13,000 American military stationed here leave
      the country")'
    units: A
- cite:
    id: cal.1963-09-02.vietnam
    item: '[[w.mann-grand-delusion]], 288–89 (Kennedy to Cronkite of CBS, from Hyannis Port, Sept. 2: "In the final analysis, it is their war"; "I don''t agree with those who say we should withdraw ...
      That would be a great mistake"; not the first half-hour newscast, success "with changes in policy" or the Southern States)'
    units: B, D
- cite:
    id: cal.1963-09-09.vietnam
    item: '[[w.mann-grand-delusion]], 290–91 (Kennedy to Huntley and Brinkley of NBC, Sept. 9: the domino theory, "I believe it"; on cutting aid, "it is possible you could have some effect upon the government
      structure there" but "you might have a situation which could bring about a collapse"; not the first half-hour newscast or "helpful at this time")'
    units: B
- cite:
    id: cal.1963-09-10.vietnam
    item: '[[w.mann-grand-delusion]], 291 (Krulak and Mendenhall brief Kennedy Sept. 10: Krulak, "The shooting war is going ahead at an impressive pace"; Mendenhall, the civil government in Saigon "virtually
      broken down"; Kennedy: "The two of you did visit the same country, didn''t you?")'
    units: A, B, C
- cite:
    id: cal.1963-09-11.vietnam
    item: '[[w.mann-grand-delusion]], 291 (Lodge to Rusk, Sept. 11: "The ship of state here is slowly sinking"; sanctions to "force a drastic change in government"; not "worsening rapidly," the words of
      unit B or the study of suspending aid)'
    units: '?'
- cite:
    id: cal.1963-09-17.vietnam
    item: '[[w.mann-grand-delusion]], 294 (Kennedy to Lodge, "eyes only," Sept. 17: "There is increasing concern here with strictly military aspects of the problem," and the need "to make [an] effective
      case with Congress for continued prosecution of the effort"; not the meeting''s approval of pressures, the "no good opportunity" line or Lodge''s comment asked)'
    units: '?'
- cite:
    id: cal.1963-11-24.vietnam
    item: '[[w.mann-grand-delusion]], 305 (Johnson to his national security team, by McCone''s notes: "no more divisions of opinion, no more bickering," anyone not conforming "should be removed"; he had
      strongly opposed the American role in Diem''s overthrow; to Lodge, "This is the only war we have"; Mann has the meeting Nov. 25; not Lodge''s hopes or McCone''s doubts)'
    units: '?'
- check:
    id: cal.1963-11-24.vietnam
    text: 'Check: Mann, 305, has Johnson''s meeting with his national security team and Lodge, McCone''s notes and "This is the only war we have" on Nov. 25; the entry has Nov. 24.'
- cite:
    id: cal.1964-03-17.vietnam
    item: '[[w.mann-grand-delusion]], 318 (Johnson approves McNamara''s plan Mar. 17; Taylor cautions that the Joint Chiefs feared "it may not be sufficient to save the situation"; not the NSC, NSAM 288
      or the statement)'
    units: '?'
- cite:
    id: cal.1964-08-10.vietnam-commitments
    item: '[[w.mann-grand-delusion]], 370 (Aug. 10: Johnson to his national security advisers, by Bundy''s summary: "if we should do nothing further, we could find ourselves even worse off than before";
      "Instead of letting the other side have the ball, we should be prepared to take it"; not the hour, the participants, Rusk on 34-A or "maximum results and minimum danger")'
    units: '?'
- cite:
    id: cal.1964-11-01.vietnam
    item: '[[w.mann-grand-delusion]], 378–79 (the Viet Cong mortar attack on Biên Hòa two days before the election: four U.S. servicemen killed, thirty wounded, twenty-seven American aircraft destroyed
      or damaged; Taylor and the Joint Chiefs urge "an appropriate act of reprisal"; Johnson refuses; not the hour, an airfield in the North, 48 hours or Nov. 1–2)'
    units: '?'
- cite:
    id: cal.1965-02-13.vietnam
    item: '[[w.mann-grand-delusion]], 403–04 (Feb. 13: Ball, acting Secretary of State, informs Saigon that the President approved "a program of measured and limited air action" south of the 19th Parallel,
      jointly with the South Vietnamese "until further notice," strikes on two or three targets "about once or twice a week"; the case to the Security Council, Hanoi the "aggressor," the United States "ready
      and eager" for "talks")'
    units: B
- cite:
    id: cal.1965-03-02.vietnam
    item: '[[w.mann-grand-delusion]], 408 (Mar. 2: 104 U.S. Air Force B-57s, F-100s and F-105s with 19 South Vietnamese Skyraiders against the Xom Bang ammunition depot and the Quang Khe naval base; six
      U.S. planes downed; no public announcement in Washington)'
    units: A
- cite:
    id: cal.1965-06-07.vietnam
    item: '[[w.mann-grand-delusion]], 441 (June 7: Westmoreland to the Pentagon, "the conflict in Southeast Asia is in the process of moving to a higher level"; the South Vietnamese army could not cope;
      about 46,000 troops at once and 35,000 to follow; not the Joint Chiefs, Sharp or the units asked)'
    units: '?'
- cite:
    id: cal.1965-07-01.vietnam
    item: '[[w.mann-grand-delusion]], 447–48 (July 1: Ball''s memorandum, "Should we limit our liabilities in South Viet-Nam," for "a compromise settlement"; McNamara''s, to "expand substantially the US
      military pressure against the Viet Cong"; Rusk''s, "The integrity of the U.S. commitment is the principal pillar of peace throughout the world"; not the figures, Bundy''s middle way or Hanoi''s taking
      the South by force)'
    units: '?'
- cite:
    id: cal.1965-07-16.vietnam-force-levels
    item: '[[w.mann-grand-delusion]], 448 (McNamara''s meetings with Westmoreland, July 16–17; Westmoreland wants 175,000 men in December and another 100,000 the following year; not the battalions)'
    units: A
- cite:
    id: cal.1965-07-20.vietnam
    item: '[[w.mann-grand-delusion]], 448 (McNamara''s report to Johnson: by October 175,000 men in all, perhaps 100,000 more early in 1966; a call-up of 235,000 reserve and National Guard troops and the
      regular forces up 375,000; not the battalions, Lodge or Wheeler, or the supplemental)'
    units: B, C
- check:
    id: cal.1965-07-20.vietnam
    text: 'Check: Mann, 448, has McNamara return to Washington on July 21 and report to Johnson then; the entry has July 20.'
- cite:
    id: cal.1965-07-21.vietnam
    item: '[[w.mann-grand-delusion]], 449–50 (the morning meeting in the Cabinet Room and the 2:30 p.m. session: Johnson''s questions; McNamara and Wheeler; Ball, "We can''t win," "a perilous voyage," "if
      the decision is to go ahead, I''m committed"; Rusk, McNamara, Bundy, Lodge and Wheeler for going ahead; not a "compromise")'
    units: '?'
- cite:
    id: cal.1965-07-21.vietnam-congress
    item: '[[w.mann-grand-delusion]], 452 (Mansfield in the Senate, July 21: "We are in, not for a summer of pain and difficulty, but for an ordeal of indefinite duration and increasing sacrifice which
      will persist until the problem can be resolved at the conference table"; once again a reconvening of the 1961 Geneva Conference; not "4 or 5 or even 10 years")'
    units: B
- cite:
    id: cal.1965-07-22.vietnam
    item: '[[w.mann-grand-delusion]], 451 (July 22: McNamara reports the 1966 bill at some $12 billion; Johnson: "Do you think the Congress and the people will go along with 600,000 people and billions
      of dollars 10,000 miles away?"; Resor on the polls; not the participants named)'
    units: '?'
- cite:
    id: cal.1965-07-23.vietnam-congress
    item: '[[w.mann-grand-delusion]], 452 (Mansfield to Johnson, dated July 23 in Mann''s n. 43: "up to 200,000 and even the figure 300,000 is being brewed about"; "a figure of one million, if this situation
      continues to develop as it has, could be considered conservative"; not "a new resolution")'
    units: B
- cite:
    id: cal.1965-07-23.vietnam-diplomacy
    item: '[[w.mann-grand-delusion]], 452 (Goldberg urges Johnson to take the issue to the United Nations; undated; not the resolution or Cleveland)'
    units: '?'
- cite:
    id: cal.1965-07-24.vietnam-july-decision
    item: '[[w.mann-grand-delusion]], 453 (Clifford accompanies Johnson to Camp David on Saturday, July 24; not the Cliffords and McNamaras, the other guests or the dinner)'
    units: '?'
- cite:
    id: cal.1965-07-25.vietnam
    item: '[[w.mann-grand-delusion]], 453–54 (Sunday, July 25, late afternoon, the Aspen Cabin: Johnson with Clifford, McNamara, Goldberg and aides; Clifford: "We must not create an impression that we have
      decided to replace the South Vietnamese and win a ground war in Vietnam," "I hate this war. I do not believe we can win"; McNamara answers; Johnson ends the discussion)'
    units: A, B
- cite:
    id: cal.1965-12-21.vietnam-pause
    item: '[[w.mann-grand-delusion]], 476 (Dec. 21, Johnson to his Vietnam advisers: "It''s more a sign of weakness than anything else"; "if we suffer a severe reverse as a result of this, we''d never explain
      it"; Westmoreland, Lodge and the Joint Chiefs opposed, Rusk wary; not the participants, the hour or the proposals)'
    units: '?'
- cite:
    id: cal.1965-12-24.vietnam
    item: '[[w.mann-grand-delusion]], 476 (6 p.m. Dec. 24: Johnson halts the bombing; U.S. forces not to fire except in self-defense until midnight the next day; Mann has the pause run on into January;
      not the announcement of Dec. 23, Saigon time, the B-52s or the Viet Cong clause)'
    units: '?'
- cite:
    id: cal.1966-01-12.program
    item: '[[w.mann-grand-delusion]], 476–77 (State of the Union, Jan. 12: "For twenty days now, we and our Vietnamese allies have dropped no bombs in North Vietnam"; emissaries to forty countries; "no
      arbitrary limits to our search for peace"; any conference table, "four points or fourteen or forty")'
    units: O
- cite:
    id: cal.1966-01-19.vietnam
    item: '[[w.mann-grand-delusion]], 479 (Jan. 19: Johnson asks $12.7 billion in supplemental funds for the fiscal year ending June 1966; Aiken: "This $13 billion is only the first drop in the bucket";
      not the breakdown, AID, "until the aggression ends" or the added costs)'
    units: '?'
- cite:
    id: cal.1966-02-28.opinion
    item: '[[w.mann-grand-delusion]], 497 (Harris in the *Washington Post*, Feb. 28: approval of Johnson''s handling of Vietnam 63 percent in January, 49 in late February; 9 percent for withdrawal; 33 to
      increase the military effort for a clear victory; 34 to do more to bring about negotiations; 16 for carrying the war more into North Vietnam; not "2 to 1" or "not sure")'
    units: B, C, D, E, G
- cite:
    id: cal.1966-06-29.vietnam-2
    item: '[[w.mann-grand-delusion]], 516–17 (Lewandowski''s initiative of June: Hanoi open to a "political compromise," a role for the Viet Cong in the negotiations, a "suspension" of U.S. air strikes
      as an opening to talks; not the day, D''Orlandi, a "very specific peace offer" or the withdrawal calendar)'
    units: '?'
- cite:
    id: cal.1966-12-02.vietnam-marigold
    item: '[[w.mann-grand-delusion]], 517 (two bombing attacks near Hanoi in early December, as the talks with the Poles turned serious; the Poles and the North Vietnamese took them as proof that the Americans
      were not serious; not the days or targets)'
    units: '?'
- cite:
    id: cal.1966-12-13.vietnam-air-war
    item: '[[w.mann-grand-delusion]], 517 (the strikes of Dec. 13, "fierce," near Hanoi; Johnson continues and intensifies the bombing against the advice of McNamara and others, on optimistic reports from
      Saigon; the Poles end the talks; not Dec. 14, the weather or Rapacki''s words)'
    units: '?'
- cite:
    id: cal.1967-01-06.vietnam-congress
    item: '[[w.mann-grand-delusion]], 519 (Jan. 6: Johnson seeks Mansfield''s counsel when Hanoi appears to soften its conditions; Mansfield''s memorandum after their telephone call: Hanoi saying "we are
      not going to say ''Uncle'' to you no matter what you do in the way of bombardment," and, the U.S. course unchanged, "it would not appear to me to be prudent to expect useful negotiations to come from
      the current Hanoi signals"; not Salisbury)'
    units: B
- cite:
    id: cal.1967-01-09.vietnam-congress
    item: '[[w.mann-grand-delusion]], 519 (Jan. 9: Johnson to Mansfield, "It is not yet clear whether they are signaling us on their terms for negotiations ... We don''t rule out that there may be something
      serious here"; not Rostow''s draft, Rusk or "honest self-determination")'
    units: '?'
- cite:
    id: cal.1967-01-10.vietnam-sunflower
    item: '[[w.mann-grand-delusion]], 522 (the message through the Soviet embassy to North Vietnam''s Moscow ambassador, "the January 6 message": "The U.S. Government places the highest priority in finding
      a mutually agreeable, completely secure arrangement for exchanging communications with the government of the DRV"; not Guthrie or Lê Trang)'
    units: '?'
- check:
    id: cal.1967-01-10.vietnam-sunflower
    text: 'Check: Mann, 522, calls it "the January 6 message," put to North Vietnam''s ambassador in Moscow through the Soviet embassy; the entry has it given to Lê Trang on Jan. 10.'
- cite:
    id: cal.1967-01-17.vietnam-sunflower
    item: '[[w.mann-grand-delusion]], 522 (the reply: what the United States meant by "completely secure arrangements" and what kind of settlement was contemplated; not the day or Guthrie)'
    units: '?'
- cite:
    id: cal.1967-01-27.vietnam
    item: '[[w.mann-grand-delusion]], 522 (North Vietnam''s Jan. 27 reply: "The United States must end immediately and unconditionally the bombing and all other acts of war against the Democratic Republic
      of Vietnam"; not Lê Trang, Guthrie or "exchange views")'
    units: '?'
- cite:
    id: cal.1967-01-10.program
    item: '[[w.mann-grand-delusion]], 521 (State of the Union, Jan. 10: "This is a time of testing for our nation"; "We face more cost, more loss, and more agony"; "General Westmoreland reports that the
      enemy can no longer succeed on the battlefield")'
    units: R
- cite:
    id: cal.1967-11-21.vietnam-2
    item: '[[w.mann-grand-delusion]], 570 (Westmoreland to the National Press Club: the war had reached the point "when the end begins to come into view"; to other groups he guessed troops could begin coming
      home within two years; not "within two years or less" at the Club, the President''s meeting or the targets)'
    units: '?'
- check:
    id: cal.1967-11-21.vietnam-2
    text: 'Check: Mann, 570, has Westmoreland''s speech to the National Press Club on Nov. 19; the entry has Nov. 21.'
- cite:
    id: cal.1968-03-15.vietnam-205000-2
    item: '[[w.mann-grand-delusion]], 596 (Goldberg advises against escalation and proposes "a total bombing halt," further than Rusk; undated; not the San Antonio formula, the time needed or the forwarding
      to the Ranch)'
    units: '?'
- cite:
    id: cal.1968-03-19.vietnam-205000
    item: '[[w.mann-grand-delusion]], 597 (Mar. 19: Johnson to Rusk, Clifford and Rostow: stopping the bombs would make "the hawks furious"; Rusk: the "element of hope has been taken away by the Tet offensive";
      not the lunch, the hour, Goldberg''s proposal or Clifford''s "fruitless")'
    units: '?'
- cite:
    id: cal.1968-08-19.vietnam-paris
    item: '[[w.mann-grand-delusion]], 612 (Aug. 19, to the Veterans of Foreign Wars: Johnson renounces the bombing halt imposed Mar. 31, "We are not going to stop the bombing just to give them a chance
      to step up their bloodbath"; not Detroit or the words of unit B)'
    units: '?'
- cite:
    id: cal.1968-08-26.elections-1968-chicago
    item: '[[w.mann-grand-delusion]], 612 (Johnson to Humphrey on the plank: "this plank just undercuts our whole policy and, by God, the Democratic party ought not to be doing that to me"; Rusk and Rostow
      had assented; Boggs threatened to oppose; undated; not Watson or the telephone)'
    units: E
- cite:
    id: cal.1968-11-03.elections-1968-chennault
    item: '[[w.mann-grand-delusion]], 621 (days after Johnson learns of the Chennault contacts, Nixon phones Johnson to argue his innocence and then Senator Smathers, pleading with him to reassure Johnson;
      not the day, Los Angeles, *Meet the Press*, the words or Finch)'
    units: '?'
- cite:
    id: cal.1968-10-26.elections-1968-2
    item: '[[w.mann-grand-delusion]], 620–21 (Nixon''s statement on the talks: "flurry of meetings in the White House and elsewhere on Vietnam"; he has been told "this spurt of activity is a cynical, last-minute
      attempt by President Johnson to salvage the candidacy of Mr. Humphrey. This I do not believe")'
    units: A, B
- check:
    id: cal.1968-10-26.elections-1968-2
    text: 'Check: Mann, 620, dates the statement Oct. 25, as Longley does.'
- cite:
    id: cal.1968-10-27.elections-1968
    item: '[[w.mann-grand-delusion]], 621 (two days after Nixon''s statement, in New York, Johnson praises Humphrey and calls Nixon "a man from the past" who "distorts the history of his time in office,"
      recalling Cuba "lost to Communism" and Dien Bien Phu; not the council or the lunch)'
    units: '?'
- add:
    entry:
      id: cal.1964-07.elections-1964-san-francisco-6
      when: July, mid
      date: 1964-07
      thread: elections-1964-san-francisco
      also:
      - vietnam
      c: 'The Republican platform on Vietnam: Johnson "encouraged an increase of aggression in South Vietnam by appearing to set limits on America''s willingness to act." The party to "move decisively to
        assure victory in South Vietnam while confining the conflict as closely as possible."'
      n: '[[w.mann-grand-delusion]], 343. Check: the day; Mann gives only "mid-July" for the convention. To check: the platform, Republican National Convention, 1964 (quoted by [[w.mann-grand-delusion]],
        343). See [[cal.1964-07-14.elections-1964]].'
      tags: []
- add:
    entry:
      id: cal.1964-07-16.elections-1964-san-francisco-2
      when: July 16
      date: '1964-07-16'
      thread: elections-1964-san-francisco
      also:
      - goldwater
      c: 'The Cow Palace. Goldwater''s acceptance, on Vietnam: "Yesterday it was Korea; tonight it is Vietnam. ... We are at war in Vietnam." The President "refuses to say, refuses to say, mind you, whether
        or not the objective over there is victory"; his secretary of defense "continues to mislead and misinform the American people."'
      n: '[[w.mann-grand-delusion]], 343. Check: the day; Mann gives only "mid-July"; the day is from [[cal.1964-07-16.elections-1964-2]]. To check: the acceptance address, July 16, 1964 (quoted by [[w.mann-grand-delusion]],
        343). Names: Goldwater, Johnson, McNamara.'
      tags:
      - name:goldwater-barry-m
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-07.economy
      when: July, mid
      date: 1966-07
      thread: economy
      also:
      - vietnam
      c: 'Johnson tells the congressional leaders of his dilemma: an extra $5 billion to $10 billion needed to fight the war in fiscal 1967.'
      n: '[[w.mann-grand-delusion]], 511. Check: the day; Mann gives only "mid-July." See [[cal.1966-07-19.economy]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-07-25.vietnam-july-decision
      when: July 25
      date: '1965-07-25'
      thread: vietnam-july-decision
      c: 'Evening. State sends a secret cable to key American embassies: Johnson, though he has reached no final decision, says "it now appears certain that it will be necessary to increase United States
        armed forces in South Vietnam by a number which may equal or exceed the 80,000 already there."'
      n: '[[w.mann-grand-delusion]], 454 (the cable "later that evening," the Camp David Sunday; not its number or sender). To check: [[w.vandemark-into-the-quagmire]], 206 (cited by [[w.mann-grand-delusion]],
        454 n.48). See [[cal.1965-07-25.vietnam]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
