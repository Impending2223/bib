    entry:
      id: cal.1965-06-23.robert-kennedy
      when: June 23
      date: '1965-06-23'
      thread: robert-kennedy
      also:
      - testing
      c: Robert Kennedy in the Senate on the spread of nuclear weapons, "the most vital issue now facing this Nation and the world," not Vietnam, the Dominican Republic, or Berlin. Negotiations now on a nonproliferation treaty; nuclear-free zones; the test ban extended to underground tests; American and Soviet nuclear forces halted and cut back; the IAEA strengthened.
      n: '[111 Cong. Rec. 14566–76 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-2-2.pdf#page=29). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1965-01-21.testing]]. Names: Robert Kennedy (K–J Adm. III.A).'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1965-11-10.robert-kennedy
      when: Nov. 10–30
      date: '1965-11-10'
      thread: robert-kennedy
      also:
      - latin-america
      c: 'Robert Kennedy in South America, three weeks: Peru, Chile, Argentina, Brazil. Check the end date. Aug. 27, Johnson to Mann: his own Latin American plans to be announced quickly, "before Bobby is on every front page."'
      n: '[FRUS 1964–68, XXXI, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v31/d31) (Aug. 27). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1965-05-06.robert-kennedy]]. Made public, the call to Mann: FRUS 1964–68, XXXI (2004). Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
      tags:
      - name:kennedy-robert-f
