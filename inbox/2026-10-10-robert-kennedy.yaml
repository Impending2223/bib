- add:
    entry:
      id: cal.1961-05-06.robert-kennedy
      when: May 6
      date: '1961-05-06'
      thread: robert-kennedy
      also:
      - desegregation-schools
      c: 'Robert Kennedy at the University of Georgia Law School''s Law Day exercises, Athens. On Prince Edward County, which had closed its schools: "if the orders of the court are circumvented, the Department of Justice will act. We will not stand by or be aloof. We will move." "I happen to believe that the 1954 decision was right."'
      n: '[Address at the Law Day Exercises of the University of Georgia Law School](https://www.justice.gov/ag/rfkspeeches/1961/05-06-1961.pdf) (May 6, 1961). *Robert Kennedy in His Own Words*; Schlesinger, *Robert Kennedy and His Times*; Thomas, *Robert Kennedy: His Life* (K–J Adm. II.G.1). Navasky, *Kennedy Justice* (K–J Adm. II.C). Guthman, *We Band of Brothers* (K–J Adm. II.G.6). Shesol, *Mutual Contempt* (K–J Adm. II.A). Names: Robert Kennedy (K–J Adm. III.A).'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1961-12-19.robert-kennedy
      when: Dec. 19
      date: '1961-12-19'
      thread: robert-kennedy
      also:
      - right-and-the-military
      c: 'Walter and Victor Reuther and Joseph Rauh to Robert Kennedy, a memorandum, "The Radical Right in America Today": a right "bounded on the left by Senator Goldwater and on the right by Robert Welch"; the Attorney General''s list of subversive organizations; the FCC to look into free broadcast time given the right; tax exemptions revoked, which "might scare off a substantial part of the big money." Dec. 20, at the IRS, after the President''s press conference of Nov. 29: eighteen organizations listed for audit, the Ideological Organizations Project. May 15, 1962, the Commissioner informs Robert Kennedy.'
      n: '[Reuther Memorandum, 19 December 1961](https://www.jfklibrary.org/asset-viewer/archives/rfkag-063-016) (requests for it, 1963), Attorney General''s papers, Kennedy Library. [The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-199) (Nov. 29, 1961). [S. Rep. No. 94-755, Book III, 891–93 (1976)](https://www.intelligence.senate.gov/sites/default/files/94755_III.pdf#page=896) (K–J Adm. II.H.3). Paul Matzko, *The Radio Right: How a Band of Broadcasters Took on the Federal Government and Built the Modern Conservative Movement* (2020). Made public: the memorandum, in Donald Janson & Bernard Eismann, *The Far Right* (1963); the audits, by the staff of the Joint Committee on Internal Revenue Taxation, June 5, 1975, and the Church Committee, Book III (1976). Names: Walter Reuther (K–J Cong. III.I); Victor Reuther (K–J Cong. III.K); Rauh (K–J Cong. III.H); Robert Kennedy (K–J Adm. III.A); Goldwater (Opp. III.B); Welch (Opp. III.F).'
      tags:
      - name:kennedy-robert-f
      - name:reuther-walter
      - name:reuther-victor-g
      - name:rauh-joseph-l-jr
      - name:goldwater-barry-m
      - name:welch-robert
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-01-19.robert-kennedy
      when: Jan. 19
      date: '1962-01-19'
      thread: robert-kennedy
      also:
      - cuba
      c: 'Mongoose. Robert Kennedy to its principals, in his office: a solution of the Cuban problem "the top priority in the United States Government—all else is secondary—no time, money, effort, or manpower is to be spared." The President, the day before: "the final chapter on Cuba has not been written." Lansdale''s thirty-two tasks to be done. Oct. 16, 2:30 p.m., he tells them of the President''s "general dissatisfaction" with Mongoose; he will meet them every morning at 9:30.'
      n: '[FRUS 1961–63, X, doc. 292](https://history.state.gov/historicaldocuments/frus1961-63v10/d292) (Helms to McCone), [doc. 293](https://history.state.gov/historicaldocuments/frus1961-63v10/d293) (Lansdale, Jan. 20); [FRUS 1961–63, XI, doc. 19](https://history.state.gov/historicaldocuments/frus1961-63v11/d19). [S. Rep. No. 94-465, 141 (1975)](https://www.intelligence.senate.gov/sites/default/files/94465.pdf#page=152) (K–J Adm. II.H.3). See [[cal.1961-11-30.cuba]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy (K–J Adm. III.A); Lansdale (K–J Adm. III.F).'
      tags:
      - name:kennedy-robert-f
      - name:lansdale-edward-g
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-02-06.robert-kennedy
      when: Feb. 6–24
      date: '1962-02-06'
      thread: robert-kennedy
      c: Robert Kennedy abroad. Tokyo, Nihon University, Feb. 6; Djakarta, the University of Indonesia, Feb. 14, and Jogjakarta, Feb. 15; Saigon, Feb. 18; West Berlin, from the steps of the City Hall and at the Free University, Feb. 22; Bonn, Feb. 24.
      n: '["The Goals of Government," Nihon University](https://www.justice.gov/ag/rfkspeeches/1962/02-06-1962.pdf) (Feb. 6, 1962); ["The United States and the New Forces of the World," University of Indonesia](https://www.justice.gov/ag/rfkspeeches/1962/02-14-1962.pdf) (Feb. 14, 1962); [University of Gadja Mada](https://www.justice.gov/ag/rfkspeeches/1962/02-15-1962.pdf) (Feb. 15, 1962); [Berlin City Hall](https://www.justice.gov/ag/rfkspeeches/1962/02-22-1962a.pdf), [Free University of Berlin](https://www.justice.gov/ag/rfkspeeches/1962/02-22-1962b.pdf) (Feb. 22, 1962); ["The New Frontier and the New Europe," Bonn](https://www.justice.gov/ag/rfkspeeches/1962/02-24-1962.pdf) (Feb. 24, 1962). Robert F. Kennedy, *Just Friends and Brave Enemies* (1962). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1961-05-06.robert-kennedy]]. Names: Robert Kennedy (K–J Adm. III.A).'
      tags:
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1962-05-07.robert-kennedy
      when: May 7
      date: '1962-05-07'
      thread: robert-kennedy
      also:
      - cuba
      - crime-and-hijacking
      c: 'Robert Kennedy, at his request, briefed by Lawrence Houston, the CIA''s General Counsel, and Sheffield Edwards, its Director of Security, on the Agency''s use of Giancana and Rosselli, through Maheu, to kill Castro: described as ended in May 1961. In April Harvey had given Rosselli poison pills. Kennedy, by Houston''s account: if the Agency was "going to get involved with Mafia personnel again he wanted to be informed first." May 9, he tells Hoover.'
      n: '[S. Rep. No. 94-465, 131–34 (1975)](https://www.intelligence.senate.gov/sites/default/files/94465.pdf#page=142) (K–J Adm. II.H.3). Thomas, *The Very Best Men*; Powers, *The Man Who Kept the Secrets* (K–J Adm. II.E). Thomas, *Robert Kennedy: His Life* (K–J Adm. II.G.1). See [[cal.1962-03-22.transition-and-staff]]. Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Robert Kennedy (K–J Adm. III.A); Houston (K–J Cong. III.K); Giancana, Harvey, Hoover (K–J Adm. III.I); Castro (K–J Adm. III.J).'
      tags:
      - name:kennedy-robert-f
      - name:houston-lawrence
      - name:edwards-sheffield
      - name:giancana-sam
      - name:castro-fidel
      - name:harvey-william-k
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1962-10-22.robert-kennedy
      when: Oct. 22–Dec. 23
      date: '1962-10-22'
      thread: robert-kennedy
      also:
      - crime-and-hijacking
      c: Nashville. Hoffa on trial under the Taft-Hartley Act, the Test Fleet case. Edward Partin, a Teamsters official from Baton Rouge, in Hoffa's hotel suite and company throughout, reports to Walter Sheridan, Robert Kennedy's investigator, on attempts to reach the jurors. Dec. 23, the jury hung.
      n: '*Hoffa v. United States*, [385 U.S. 293](https://tile.loc.gov/storage-services/service/ll/usrep/usrep385/usrep385293/usrep385293.pdf), 294–96 (1966). Sheridan, *The Fall and Rise of Jimmy Hoffa*; Navasky, *Kennedy Justice*; Goldfarb, *Perfect Villains, Imperfect Heroes* (K–J Adm. II.E). Sloane, *Hoffa* (K–J Cong. II.I.4). Kennedy, *The Enemy Within* (K–J Adm. II.G.1). See [[cal.1961-09-13.crime-and-hijacking]]. Made public: Partin''s part, at the Chattanooga trial, 1964. Names: Hoffa (K–J Cong. III.I); Partin, Sheridan (K–J Cong. III.K); Robert Kennedy (K–J Adm. III.A).'
      tags:
      - name:kennedy-robert-f
      - name:hoffa-james-r
      - name:partin-edward-grady
      - name:sheridan-walter
- add:
    entry:
      id: cal.1963-09-06.robert-kennedy
      when: Sept. 6
      date: '1963-09-06'
      thread: robert-kennedy
      also:
      - vietnam
      c: Meeting with the President on Vietnam, 10:30 a.m. Robert Kennedy asks whether the war can be won with Diệm and Nhu; if not, "why do we not grasp the nettle now." Diệm to be told he must do what is asked, or the effort will be cut.
      n: '[FRUS 1961–63, IV, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v04/d66). Kaiser, *American Tragedy* (Viet. II.B.8). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1963-08-24.vietnam]]. Made public: FRUS 1961–63, IV (1991). Names: Robert Kennedy (K–J Adm. III.A); Diệm, Nhu (Viet. III.G).'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - name:ngo-dinh-diem
      - name:ngo-dinh-nhu
- add:
    entry:
      id: cal.1963-09-25.robert-kennedy
      when: Sept. 25
      date: '1963-09-25'
      thread: robert-kennedy
      also:
      - crime-and-hijacking
      c: Robert Kennedy opens McClellan's hearings on organized crime. Valachi "for the first time an insider" to break "the underworld's code of silence"; "a private government of organized crime." Racketeering figures indicted, first half of 1963, 171, against 24 three years before. He asks immunity for witnesses and a revised wiretap law. Valachi before the cameras from Sept. 27.
      n: '[Statement by Attorney General Robert F. Kennedy to the Permanent Subcommittee on Investigations](https://www.justice.gov/ag/rfkspeeches/1963/09-25-1963.pdf) (Sept. 25, 1963). *Organized Crime and Illicit Traffic in Narcotics* (K–J Cong. II.J.3). Goldfarb, *Perfect Villains, Imperfect Heroes* (K–J Adm. II.E). See [[cal.1961-09-13.crime-and-hijacking]]. Names: Robert Kennedy (K–J Adm. III.A); McClellan (K–J Cong. III.B); Valachi (K–J Cong. III.K).'
      tags:
      - name:kennedy-robert-f
      - name:mcclellan-john-l
      - name:valachi-joseph
- add:
    entry:
      id: cal.1963-10-29.robert-kennedy
      when: Oct. 29
      date: '1963-10-29'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Meeting with the President on the generals'' plot. Robert Kennedy: Vietnam not Iraq or South America, where a coup is done quickly; to back one is to put the country''s future in the hands of a man little known; Diệm will not quit; the reporting thin. "My view is the minority view."'
      n: '[Kennedy, Johnson, Robert Kennedy and others, 4:25 p.m.](https://prde.upress.virginia.edu/conversations/4022297), JFK Meeting Tape 118_A54.3a-b (PRDE). [FRUS 1961–63, IV, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v04/d234). See [[cal.1963-09-06.robert-kennedy]]. Made public: FRUS 1961–63, IV (1991). Names: Robert Kennedy (K–J Adm. III.A); Diệm (Viet. III.G).'
      tags:
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-12.robert-kennedy
      when: Dec.
      date: 1963-12
      thread: robert-kennedy
      also:
      - soviet-union
      c: 'William Walton, painter and friend of the Kennedys, in Moscow on a cultural visit put off by the assassination, sees Bolshakov at Robert Kennedy''s request. By Bolshakov''s report, the message: Robert Kennedy and Mrs. Kennedy believed there had been a conspiracy in the President''s death; Robert Kennedy shared his brother''s approach to the Soviet Union. Check the date.'
      n: 'Fursenko & Naftali, *"One Hell of a Gamble"* (K–J Adm. II.D). See [[cal.1961-05-09.berlin-and-vienna]]. Made public: Fursenko & Naftali (1997). Names: Walton (K–J Cong. III.K); Bolshakov (K–J Adm. III.J); Robert Kennedy, Jacqueline Kennedy (K–J Adm. III.A).'
      tags:
      - name:kennedy-robert-f
      - name:walton-william
      - name:bolshakov-georgi
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-01-17.robert-kennedy
      when: Jan. 17–24
      date: '1964-01-17'
      thread: robert-kennedy
      also:
      - india-and-china
      c: 'Robert Kennedy, sent by Johnson, on Indonesia''s confrontation of Malaysia. Tokyo, Jan. 17–18, with Sukarno; Kuala Lumpur and Manila; Djakarta, Jan. 23: Sukarno agrees to order a cease-fire, and to a meeting of the foreign ministers of Indonesia, Malaysia, and the Philippines at Bangkok, Feb. 5–6. Then Bangkok and London.'
      n: 'FRUS 1964–68, XXVI, docs. [15](https://history.state.gov/historicaldocuments/frus1964-68v26/d15), [16](https://history.state.gov/historicaldocuments/frus1964-68v26/d16), [23](https://history.state.gov/historicaldocuments/frus1964-68v26/d23). Jones, *Conflict and Confrontation in South East Asia* (Viet. II.F.17). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:sukarno
- add:
    entry:
      id: cal.1964-02-29.robert-kennedy
      when: Feb. 29–May 14
      date: '1964-02-29'
      thread: robert-kennedy
      c: 'Robert Kennedy recorded for the Kennedy Library''s oral history by John Bartlow Martin: Feb. 29 and Mar. 1, Apr. 13, Apr. 30, May 14. Later sessions: Anthony Lewis, with Burke Marshall, from Dec. 4; Schlesinger, Feb. 27, 1965. Check the December dates.'
      n: '[Robert F. Kennedy oral history interview, Feb. 29 and Mar. 1, 1964](https://www.jfklibrary.org/asset-viewer/archives/jfkoh-rfk-01) (JFKOH-RFK-01), and JFKOH-RFK-02 to -04, Kennedy Library. *Robert Kennedy in His Own Words* (K–J Adm. II.G.1). Made public: *Robert Kennedy in His Own Words* (Edwin O. Guthman & Jeffrey Shulman eds., 1988). Names: Robert Kennedy (K–J Adm. III.A); Marshall (K–J Adm. III.I); Schlesinger (K–J Adm. III.B).'
      tags:
      - name:kennedy-robert-f
      - name:marshall-burke
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1964-06-11.robert-kennedy
      when: June 11
      date: '1964-06-11'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Robert Kennedy to Johnson: "if you wished me to go to Viet Nam in any capacity I would be glad to do so." Johnson by telephone that evening thanks him and asks his help in choosing an ambassador; June 12, Kennedy proposes Terry Sanford. May 28, he had urged a group on Vietnam like the ExComm.'
      n: '[Johnson and Robert Kennedy, 6:11 p.m.](https://prde.upress.virginia.edu/conversations/9070076), Tape WH6406.06, Citation #3699 (PRDE); [June 12, 7:26 p.m.](https://prde.upress.virginia.edu/conversations/9070091), Tape WH6406.08, Citation #3731 (PRDE); [May 28, 11:45 a.m.](https://prde.upress.virginia.edu/conversations/9060295), Tape WH6405.11, Citations #3539 and #3540 (PRDE). Kennedy to Johnson, June 11, 1964, LBJ Library (Check the file). *Taking Charge* (K–J Adm. II.J). Shesol, *Mutual Contempt* (K–J Adm. II.A). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D); Sanford (K–J Cong. III.F).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:sanford-terry
- add:
    entry:
      id: cal.1964-06-26.robert-kennedy
      when: June 26–July 1
      date: '1964-06-26'
      thread: robert-kennedy
      also:
      - europe-and-the-alliance
      c: 'Robert Kennedy in West Berlin: the President John F. Kennedy Lecture at the Free University; a plaque unveiled in John-F.-Kennedy-Platz. June 27, Heidelberg. Then Poland. Leaving, July 1: "to facilitate the reconciliation of Eastern and Western Europe in association with the United States," the "bridges" of reconciliation Johnson had called for. July 2, by telephone with Johnson: Kennedy misquoted in *Newsweek*; Johnson on the press''s efforts to divide them.'
      n: '[The President John F. Kennedy Lecture, Free University of Berlin](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964b.pdf); [Remarks at the Unveiling of a Plaque in President John F. Kennedy Platz](https://www.justice.gov/ag/rfkspeeches/1964/06-26-1964c.pdf) (June 26, 1964); [Address at Heidelberg University](https://www.justice.gov/ag/rfkspeeches/1964/06-27-1964.pdf) (June 27, 1964); [Statement on Departure from Poland](https://www.justice.gov/ag/rfkspeeches/1964/07-01-1964.pdf) (July 1, 1964). [Johnson and Robert Kennedy, 11:19 a.m.](https://prde.upress.virginia.edu/conversations/9080124), Tape WH6407.01, Citation #4117 (PRDE), July 2. Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). See [[cal.1962-02-06.robert-kennedy]]. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-21.robert-kennedy
      when: July 21
      date: '1964-07-21'
      thread: robert-kennedy
      also:
      - states-and-cities
      - mississippi
      c: 'Johnson and Robert Kennedy, five calls. Noon: protection for King, to speak in Greenwood, Mississippi; Hoover and the Justice Department; the Harlem riots and an FBI inquiry, Johnson reading his statement. 1 p.m.: whether Hoover himself should go to New York; Kennedy doubts it, New York more like the Georgia killing than Mississippi. Evening: two lawyers of the Lawyers'' Committee for Civil Rights missing in Mississippi, seen at 8:25, found by 9:31; Goldwater''s request to see Johnson.'
      n: '[Johnson and Robert Kennedy, 12:25 p.m.](https://prde.upress.virginia.edu/conversations/4000560), Conversation WH6407-11-4288 (PRDE); [1:00 p.m.](https://prde.upress.virginia.edu/conversations/4000563), Conversation WH6407-11-4294 (PRDE); [8:00 p.m.](https://prde.upress.virginia.edu/conversations/4000565), Conversation WH6407-12-4299 (PRDE); [8:25 p.m.](https://prde.upress.virginia.edu/conversations/4000566), Conversation WH6407-12-4300 (PRDE); [9:31 p.m.](https://prde.upress.virginia.edu/conversations/4000568), Conversation WH6407-12-4303 (PRDE). [Statement by the President on the Riots in New York City](https://www.presidency.ucsb.edu/documents/statement-the-president-the-riots-new-york-city) (July 21, 1964). *Taking Charge* (K–J Adm. II.J). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-07-18.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Johnson (K–J Adm. III.D); Robert Kennedy (K–J Adm. III.A); King (K–J Cong. III.H); Hoover (K–J Adm. III.I); Goldwater (Opp. III.B).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:hoover-j-edgar
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-27.robert-kennedy
      when: July 27
      date: '1964-07-27'
      thread: robert-kennedy
      also:
      - states-and-cities
      c: After Harlem and Rochester, Robert Kennedy by telephone proposes that Johnson and federal officials meet the mayors of cities with troubled young people, on schooling and the poverty program. Johnson agrees, and asks to see him the next day.
      n: '[Johnson and Robert Kennedy, 5:00 p.m.](https://prde.upress.virginia.edu/conversations/4000673), Conversation WH6407-15-4349 (PRDE). See [[cal.1964-07-21.robert-kennedy]]; [[cal.1964-07-24.states-and-cities]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Johnson (K–J Adm. III.D).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-11-03.robert-kennedy
      when: Nov. 3
      date: '1964-11-03'
      thread: robert-kennedy
      also:
      - elections-1964
      c: 'Robert Kennedy elected Senator from New York, 3,823,749 to Keating''s 3,104,056, 53.5 percent. Johnson and Kennedy by telephone, 11:55 p.m.: Kennedy thanks him for his help; Johnson: nothing will divide them.'
      n: '[Johnson and Robert Kennedy, 11:55 p.m.](https://prde.upress.virginia.edu/conversations/4019845), Conversation WH6411-02-6142 (PRDE). [*Statistics of the Presidential and Congressional Election of November 3, 1964*](https://clerk.house.gov/member_info/electionInfo/1964election.pdf) (Clerk of the House, 1965). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1964-08-25.elections-1964]]; [[cal.1964-11-03.elections-1964-2]]. Made public: the recordings, opened by the LBJ Library. Check the year. Names: Robert Kennedy (K–J Adm. III.A); Keating (Opp. III.B); Johnson (K–J Adm. III.D).'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:keating-kenneth-b
- add:
    entry:
      id: cal.1965-05-06.robert-kennedy
      when: May 6
      date: '1965-05-06'
      thread: robert-kennedy
      also:
      - vietnam
      - latin-america
      c: 'Robert Kennedy votes for the $700 million for Vietnam, on the understanding Stennis gave the day before: "It is not a blank check." Three courses open in Vietnam. On the Dominican Republic the same day: the object "not to drive the genuine democrats in the Dominican revolution into association with the Communists."'
      n: '[111 Cong. Rec. 9760–62 (1965)](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-7-2.pdf#page=33). Schlesinger, *Robert Kennedy and His Times* (K–J Adm. II.G.1). Shesol, *Mutual Contempt* (K–J Adm. II.A). See [[cal.1965-05-04.vietnam]]; [[cal.1965-04-28.latin-america]]. Names: Robert Kennedy (K–J Adm. III.A); Stennis (K–J Cong. III.B).'
      tags:
      - name:kennedy-robert-f
      - name:stennis-john-c
