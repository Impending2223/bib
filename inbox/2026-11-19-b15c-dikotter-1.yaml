      c: A municipal unit in Linxia 臨夏, south of Lanzhou 兰州, draws up a list of some fifty cases of cannibalism found in the city. Of the seventy-six victims twelve were killed and eaten, sixteen eaten after death and forty-eight exhumed and eaten.
