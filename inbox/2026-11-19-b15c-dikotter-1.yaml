      c: An inspection team is due at Meitan 湄潭 county. The local leaders hurry day and night to bury the corpses in mass graves by the side of the road; sick villagers and neglected children are locked up under guard of the militia; the trees stripped of bark are torn out, roots and all.
      n: '[[w.dikotter-maos-great-famine]], 314 n.21. Made public: 2010. To check: Chishui county file, May 9, 1960 (cited by the book for Meitan; as printed), 1-A11-9, pp. 5–9 (cited by [[w.dikotter-maos-great-famine]], 314 n.21). Check: the day; the book dates the visit April 1960; the file cited is a Chishui file, as printed.'
