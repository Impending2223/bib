- add:
    entry:
      id: cal.1961-12.china-leadership-8
      when: Dec.
      date: 1961-12
      thread: china-leadership
      also:
      - china
      c: Li Fuchun 李富春, the state planner, announces that 12.3 million people have been moved from the cities to the countryside, and that another 7.8 million are targeted for 1962.
      n: '[[w.dikotter-maos-great-famine]], 238–239 n.42. Made public: 2010. To check: Li Fuchun, announcement on the people moved from the cities, file of Dec. 12, 1961, Hunan Provincial Archives, 186-1-587, p. 5 (cited by [[w.dikotter-maos-great-famine]], 239 n.42). Names: Li Fuchun 李富春. Check: the day; the book says the end of the year, the file cited is of Dec. 12.'
      src:
        c: 3ef713b0
        rows:
        - 'w.dikotter-maos-great-famine 238, 239: all'
        - 'via w.dikotter-maos-great-famine 239 n.42: all'
      tags:
