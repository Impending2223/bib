        rows:
        - 'w.dikotter-maos-great-famine 289: all'
        - 'via w.dikotter-maos-great-famine 289 n.8: all'
      tags:
      - polity:prc
      - vis:only:prc
- add:
    entry:
      id: cal.1960-12.china-leadership-19
      when: Dec.
      date: 1960-12
      thread: china-leadership
      also:
      - china
      c: The Jiabiangou camp in Gansu is closed down, in the wake of Zhang Zhongliang's fall from power. Another 640 prisoners died in November and December.
      n: '[[w.dikotter-maos-great-famine]], 289 n.8. Made public: 2010. To check: Gansu file on the Jiabiangou camp, Feb. 3, 1961, Gansu Provincial Archives, 91-18-200, pp. 291–292 (cited by [[w.dikotter-maos-great-famine]], 289 n.8). See [[cal.1960-09.china-leadership-4]]. Check: the day; the book says the camp closed after the November and December deaths.'
      src:
        c: 1426610e
        rows:
