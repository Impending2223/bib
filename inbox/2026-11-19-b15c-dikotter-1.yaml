- add:
    entry:
      id: cal.1961-04.china-leadership-16
      when: Apr., after the 24th
      date: 1961-04
      at: after 1961-04-24
      thread: china-leadership
      also:
      - china
      c: Liu Shaoqi, in a village where he stops on his way home, finds the number of deaths covered up by the local leaders and clashes with the local boss, who tries to steer his party away from the villagers. He seeks out Duan Shucheng, a cadre dismissed as a rightist in 1959, who tells him how the brigade won its red flag in the Great Leap and how its leaders persecuted all dissent. In 1960 a crop of 360 tonnes was reported as 600; after requisitions the villagers had 180 kilos each for the year.
      n: '[[w.dikotter-maos-great-famine]], 119 n.17a–c. Made public: 2010. To check: Liu Shaoqi, conversations of Apr. 25, 28 and 30, 1961, Hunan Provincial Archives, 141-1-1873, pp. 106–150 (cited by [[w.dikotter-maos-great-famine]], 119 n.17a–c). Names: Liu Shaoqi 刘少奇. Check: the day, and the village; the book names neither and the note gives the three conversations in one file.'
      src:
        c: d0109990
        rows:
        - 'w.dikotter-maos-great-famine 119: all'
        - 'via w.dikotter-maos-great-famine 119 n.17a: all'
        - 'via w.dikotter-maos-great-famine 119 n.17b: all'
        - 'via w.dikotter-maos-great-famine 119 n.17c: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1960-05.china-leadership-15
      when: May
      date: 1960-05
      thread: china-leadership
      also:
      - china
      c: The Ministry of the Interior reports that in Shandong the custody and deportation stations confiscate the food coupons, rations and train tickets of drifters and migrants, string them up and beat them black and blue, and molest the women.
      n: '[[w.dikotter-maos-great-famine]], 237 n.34. Made public: 2010. To check: Neibu cankao (Internal Reference), May 1, 1960, p. 30, the Ministry of the Interior''s report on the custody and deportation stations of Shandong (cited by [[w.dikotter-maos-great-famine]], 237 n.34). Check: the day; the book says May 1960, the note gives the Neibu cankao of May 1.'
      src:
