      c: 'Wang Renzhong 王任重, at a meeting of the leaders of all the southern provinces, says that extraordinary difficulties demand extraordinary measures: grain can go only to the cities, and the villages in the grip of famine must fend for themselves. Some of the parts must be sacrificed to keep the whole.'
