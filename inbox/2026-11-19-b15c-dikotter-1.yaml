      c: 'Xie Fuzhi 谢富治, Minister of Public Security, explains to his staff the policy: arrest fewer, kill fewer, supervise fewer; 4,000 are to be killed in 1960. He puts the prisoners in the reform-through-labour camps, Tibet excluded, at 1.8 million, in 1,077 factories, mines and quarries and on 440 farms, those in the re-education camps at 440,000, and the camps'' yield at 3 billion yuan a year, besides 750,000 tonnes of produce from the farms.'
      n: '[[w.dikotter-maos-great-famine]], 288 n.4, 289 n.12–13, 290 n.17. Made public: 2010. To check: Papers from the tenth national conference on "national security" (as the note gives it), Zhongfa [60] 318, Apr. 8, 1960, Gansu Provincial Archives, 91-18-179, pp. 11–12 and 26 (cited by [[w.dikotter-maos-great-famine]], 288 n.4; 289 n.12–14; 290 n.17). Names: Xie Fuzhi 谢富治. Check: the day; the book dates the explanation April 1960, the file cited is of Apr. 8.'
