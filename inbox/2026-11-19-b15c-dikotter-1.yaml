      id: cal.1961-07-17.china-leadership-10
      when: July 17
      date: '1961-07-17'
      place: beidaihe
      thread: china-leadership
      c: 'Beidaihe 北戴河. Li Fuchun 李富春, at a meeting of the party planners, gives a trenchant assessment of the economy: tens of millions of farmers in Shandong, Henan and Gansu live on a handful of grain a day, and the famine has little to do with natural calamities. He calls the Leap too high, too big, too equal, too dispersed, too chaotic, too fast and too given to transfers of resources, and proposes lower targets. Mao endorses the report.'
      n: '[[w.dikotter-maos-great-famine]], 121, 122 n.23. Made public: 2010. To check: Li Fuchun, speech of July 17, 1961 to the planners at Beidaihe, Hunan Provincial Archives, 186-1-584, pp. 7 and 13 (cited by [[w.dikotter-maos-great-famine]], 122 n.23). Names: Li Fuchun 李富春, Mao Zedong. Check: the day; the book says July 1961, the file cited is of July 17. The words: "Chairman Mao''s directives are entirely correct, but we, including the central organs, have made mistakes in executing them" (122).'
      src:
        c: 0d57007d
        rows:
        - 'w.dikotter-maos-great-famine 121, 122: all'
        - 'via w.dikotter-maos-great-famine 122 n.23: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:li-fuchun
      - name:mao-zedong
- add:
    entry:
      id: cal.1961-08.china-leadership-6
      when: Aug.
      date: 1961-08
      thread: china-leadership
      also:
      - china
      c: 'Four officials follow Li Fuchun''s report with biting assessments: Li Yiqing, a senior party secretary, that in 1958 over 140,000 tonnes of farming tools went into the backyard furnaces of Henan; Wu Jingtian, vice-minister of railways, that one locomotive in five is out of use for engine damage; Peng De, vice-minister of transportation, that fewer than two vehicles in three work; Xu Chi, vice-minister of metallurgy, that the Angang steelworks stopped for weeks in the summer for want of coal.'
      n: '[[w.dikotter-maos-great-famine]], 122 n.24, 144 n.70. Made public: 2010. To check: Documents from the Beidaihe conference, Aug. 11, 1961 (the Hunan file), Hunan Provincial Archives, 186-1-584, pp. 38–48, 125, 134 and 152 (cited by [[w.dikotter-maos-great-famine]], 122 n.24; 144 n.70). Check: the meeting and the days: the book places the assessments after Li Fuchun''s report at the meeting at Lushan, in summer 1961 (144), and the file it cites is of the Beidaihe conference, Aug. 11.'
