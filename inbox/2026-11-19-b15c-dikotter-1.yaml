      c: Provincial leaders are warned by telephone that exports fall short and that the balance of payments is heading for a deficit of 2 billion yuan. The Soviet debt is to be paid within two years, by exporting as much grain, cotton and edible oils as possible.
      n: '[[w.dikotter-maos-great-famine]], 105 n.8. Made public: 2010. To check: Telephone warning to provincial leaders on exports and the Soviet debt, Aug. 5, 1960, Gansu Provincial Archives, 91-9-91, pp. 7–11 (cited by [[w.dikotter-maos-great-famine]], 105 n.8). Check: who gave the warning; the book does not say.'
