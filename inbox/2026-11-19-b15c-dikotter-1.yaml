- add:
    entry:
      id: cal.1960-09.china-leadership-4
      when: Sept.
      date: 1960-09
      thread: china-leadership
      also:
      - china
      c: The inmates of the Jiabiangou labour camp in Gansu are moved to another farm. Of the 2,300 prisoners who arrived in December 1957, a thousand have died.
      n: '[[w.dikotter-maos-great-famine]], 289 n.8. Made public: 2010. To check: Gansu file on the Jiabiangou camp, Feb. 3, 1961, Gansu Provincial Archives, 91-18-200, pp. 291–292 (cited by [[w.dikotter-maos-great-famine]], 289 n.8).'
      src:
