      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960
      c: New York, the Statler Hilton, 9:52 p.m. Eisenhower to the Golden Jubilee Dinner of the National Conference of Catholic
        Charities, on the evening of the first debate. By White's account the President resents the debate's being set against
        it.
      n: 'Address at the Golden Jubilee Dinner of the National Conference of Catholic Charities, New York City, [1960–61 Pub.
        Papers 728](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=780) (Sept. 26, 1960).
        [[w.white-making-of-the-president]], 309 (the address on national television; the President''s irritation, by the
        White House staff''s account). Names: Eisenhower.'
      time: 1960-09-27T01:52Z
