      thread: press-and-broadcasting
      also:
      - laos
      c: 'The Oval Office, the end of the day, by White''s account. Kennedy to White: the election a "miracle"; Nixon''s campaign
        speeches, read lately, appalling in style, talking down to the people; the feed grain bill through the House by seven
        votes; the real problem "out there," Laos, the Congo, Africa; China''s mind on Formosa; none of Africa''s new states
        yet a Communist gain; the problem, "inertia."'
      n: '[[w.white-making-of-the-president]], 376–77. Names: Kennedy, White, Nixon. Check: the day; White gives a Thursday
        in "early winter of 1961"; the Laos meeting with Felt ([[cal.1961-03-09.laos]]), the House''s feed grain vote and
        Nkrumah''s visit the day before ([[cal.1961-03-08.africa]]) are of Mar. 9.'
