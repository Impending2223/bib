- add:
    entry:
      id: cal.1961-03-09.cities-and-housing
      when: Mar. 9
      date: '1961-03-09'
      thread: cities-and-housing
      c: Message on housing and community development. FHA no-down-payment, 40-year mortgages opened to any family, on trial;
        the limit on the Housing Act of 1949's public housing lifted, about 100,000 more low-rent units; $2.5 billion over
        four years for urban renewal; $100 million to start on open land; $50 million more for public facilities loans; planning
        grants to $100 million; a Cabinet department of housing and urban affairs.
      n: 'Special Message to the Congress on Housing and Community Development, [1961 Pub. Papers 162](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=220)
        (Mar. 9, 1961). [[w.white-making-of-the-president]], 375 (the first response to it that day). Names: Kennedy.'
      src:
        c: 56fc7fcc
        rows:
