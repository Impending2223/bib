- add:
    entry:
      id: cal.1960-06.elections-1960-12
      when: June
      date: 1960-06
      thread: elections-1960
      c: 'Robert D. Novak, *Wall Street Journal*, on Symington''s campaign: "one island of tranquility"; "a somnambulistic
        air." His California stumping: off from Santa Monica in Ed Pauley''s plane at 11 a.m., Pomona''s sidewalks almost
        empty, a press conference at San Francisco canceled for rest.'
      n: '[[w.white-making-of-the-president]], 126–27 (the column quoted). To check: Robert D. Novak, *Wall Street Journal*,
        June 1960 (cited by [[w.white-making-of-the-president]], 126). Names: Novak, Symington. Check: the day.'
      src:
        c: 4d3a18bb
        rows:
        - 'w.white-making-of-the-president 126–27: all'
        - 'via w.white-making-of-the-president 126 n.text: all'
      tags:
      - name:novak-robert-d
      - name:symington-william-s
- add:
    entry:
      id: cal.1960-09-10.elections-1960
      when: Sept. 10–11
      date: '1960-09-10'
      thread: elections-1960
      c: 'Los Angeles, the Ambassador Hotel, the week end. Kennedy, having decided on the Pacific coast to accept the Houston
        ministers'' invitation, drafts his statement with Sorensen. Sorensen to a friend: "We can win or lose the election
        right there in Houston on Monday night."'
      n: '[[w.white-making-of-the-president]], 259–60. The statement: [[cal.1960-09-12.elections-1960]]. Names: Kennedy, Sorensen.'
      src:
        c: a58e77ba
        rows:
        - 'w.white-making-of-the-president 259–60: all'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1960-09-25.elections-1960-4
      when: Sept. 25–26
      date: '1960-09-25'
      thread: elections-1960
      c: 'Chicago. Sorensen, Goodwin and Feldman at the Knickerbocker from Sunday, twenty-four hours: fifteen pages on twelve
        or thirteen subjects, the facts and the likely questions. Monday at the Ambassador East: four hours of questions with
        Kennedy, who throws out their opening and dictates his own; lunch with Sorensen, Robert Kennedy and Louis Harris;
        at five the questions again, from fact cards.'
      n: '[[w.white-making-of-the-president]], 283–85. The debate: [[cal.1960-09-26.elections-1960]]. Names: Sorensen, Goodwin,
        Feldman, Kennedy, Robert Kennedy, Harris.'
      src:
        c: 31e8e31e
        rows:
        - 'w.white-making-of-the-president 283–85: all'
      tags:
      - name:sorensen-theodore-c
      - name:goodwin-richard-n
      - name:feldman-myer
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:harris-louis
- add:
    entry:
      id: cal.1960-09-26.elections-1960-4
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960
      c: 'Chicago, the Pick-Congress. Nixon, arrived late Sunday, speaks to the Carpenters in the morning; from 12:30 he sees
        one visitor, his wife with him, his television advisers unable to reach him. Lodge, by report, telephones: erase the
        "assassin image." An adviser briefs him in the car to WBBM: come out swinging. At the studio he strikes his knee on
        the car door.'
      n: '[[w.white-making-of-the-president]], 285–86. The debate: [[cal.1960-09-26.elections-1960]]. See [[cal.1960-09-25.elections-1960-3]].
        Names: Nixon, Lodge.'
      src:
        c: 5d8df02d
        rows:
        - 'w.white-making-of-the-president 285–86: all'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
