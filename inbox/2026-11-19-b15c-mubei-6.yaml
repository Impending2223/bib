      when: Mar. 5
      date: '1960-03-05'
      thread: china-leadership
      c: 'The Heilongjiang 黑龍江 committee 省委 reports to the Center 中共中央 on the mess halls: most are run very well, generally with vegetable plots, most raising pigs, some chickens.'
      n: '[[w.yang-jisheng-mubei]], II, 1084 n.18. Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Heilongjiang Provincial Committee Rural Work Department, telephone report of Mar. 5, 1960 on the state of the rural public mess halls (cited by [[w.jianguo-yilai-mao-zedong]], XV, 101 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 68 (the note the book cites). See [[cal.1960-03.china-leadership-3]]. Check: the book calls it the provincial committee''s report; the Mao wengao note names it the rural work department''s telephone report.'
      src:
