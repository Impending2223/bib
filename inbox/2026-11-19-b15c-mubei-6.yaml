      when: Oct.
      date: 1964-10
      thread: china-leadership
      c: 'The Center 中共中央 reorganizes the Guizhou 貴州 provincial committee 省委: Li Dazhang 李大章 is made acting first secretary, Qian Ying 錢瑛 acting second, Chen Gang 陳剛 acting third.'
      n: '[[w.yang-jisheng-mubei]], II, 1136–1137 n.53 (Liu Shaoqi''s report at Kunming on Aug. 24 had named Zhou Lin 周林, the first secretary, in criticism). Made public: 2008. To check: Gao Hua 高華, "Zai Guizhou ''siqing yundong'' de beihou: dui yi pian dangdaishi huiyi wenben de jiedu" 《在貴州「四清運動」的背後：對一篇當代史回憶文本的解讀》 (the revised full text), *Lingdaozhe* 《領導者》, Jan. 2006 (no. 12) (cited by [[w.yang-jisheng-mubei]], II, 1137 n.53). See [[cal.1964-08-24.china-leadership]]. Names: Liu Shaoqi.'
