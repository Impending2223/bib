    item: '[[w.yang-jisheng-mubei]], II, 1134, 1137 n.54 (Wang Guangmei goes under Liu Shaoqi''s wish, as Dong Pu and deputy head of the work team in the name of a secretary of the Hebei public security department, to Taoyuan brigade, Funing county; the book gives five months; she finds the Party branch "basically not Communist" and the branch secretary Wu Chen a "bad element"; at II, 1137 the book dates her going Nov. 1963)'
    units: A
- cite:
    id: cal.1964-08-19.china-leadership-4
    item: '[[w.yang-jisheng-mubei]], II, 1137 n.55 (Liu Shaoqi''s letter to Mao and the Central Committee: Chen Boda urges sending Wang Guangmei''s report to all Party committees and work teams; she revised the Hebei committee''s record twice and he once; the Center has drafted a comment, to be reviewed and, if agreed, issued; the book prints the year as 1963)'
    units: A, F, G, H
- check:
    id: cal.1964-08-19.china-leadership-4
    text: 'Check: the year; [[w.yang-jisheng-mubei]], II, 1137, prints Aug. 19, 1963 for Liu''s letter and Mao''s reply of Aug. 27, and dates Wang Guangmei''s five months at Taoyuan from Nov. 1963; the letter forwards her report of July 5, 1964.'
- cite:
