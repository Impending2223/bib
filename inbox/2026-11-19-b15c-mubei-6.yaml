      c: The Center 中共中央 issues an urgent instruction, the first of two in the year, requiring as a political task that the year's plan of 18.6 million tons of steel be met.
      n: '[[w.yang-jisheng-mubei]], II, 1031 (no note). Made public: 2008. To check: Central Committee, urgent instruction of Aug. 1960 on the steel output (named by [[w.yang-jisheng-mubei]], II, 1031; no note). See [[cal.1960-12-03.china-leadership-4]] (the second). Check: the day; the Secretariat took up on Aug. 4 a draft directive on a campaign centered on grain and steel ([[cal.1960-08-04.china-leadership]]), which may be it.'
