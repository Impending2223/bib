    text: 'Check: [[w.yang-jisheng-mubei]], II, 1146, dates the scene with the two constitutions Jan. 28, 1965, "still at this meeting" on the four cleans, a fortnight after the conference (Dec. 15 to Jan. 14, [[cal.1964-12-15.china-leadership]]) closed, and has Deng Xiaoping chair the meeting.'
