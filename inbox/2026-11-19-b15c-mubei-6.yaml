      when: Mar.
      date: 1960-03
      thread: china-leadership
      c: The Hunan 湖南 committee 省委, first secretary Zhang Pinghua 張平化, reports to Mao 毛澤東 and the Center 中共中央 the many gains in building water works and remaking fields. It says the people's welfare and health are generally fairly good.
      n: '[[w.yang-jisheng-mubei]], II, 1084 n.16. Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Hunan Provincial Committee, comprehensive report on thirteen aspects of agricultural production, 1960 (cited by [[w.jianguo-yilai-mao-zedong]], XV, 78 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 64–65 (the note the book cites). See [[cal.1960-03-15.china-leadership-2]]. Names: Mao Zedong.'
