    item: '[[w.yang-jisheng-mubei]], II, 1137 (the book traces "in 1964 left in form, right in essence" in Mao''s poster of Aug. 5, 1966 to Liu''s conduct of the four cleans in 1964)'
    units: C
- cite:
    id: cal.1960-04-16.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1150 (April 1960, for Lenin''s ninetieth anniversary the Center has three articles published, the *Hongqi* editors'' "Long Live Leninism," the *Renmin ribao* editorial "Forward along the path of the great Lenin," and Lu Dingyi''s report "Unite under Lenin''s revolutionary banner," setting out the Center''s views on peaceful coexistence and transition, revolution, war and peace and the nature of imperialism, aimed in fact at the Soviet party)'
    units: A
- cite:
    id: cal.1960-04-22.china-leadership-4
    item: '[[w.yang-jisheng-mubei]], II, 1150 (Lu Dingyi''s report at the meeting for Lenin''s anniversary, one of the three articles of April 1960)'
    units: B
- cite:
    id: cal.1960-05-21.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1150 (in the second half of May Mao in talk with Kim Il Sung says outright that the Chinese party does not approve of peaceful coexistence and peaceful transition, charges the Soviet and East European parties with dropping the class view, names Khrushchev, criticizes the "spirit of Camp David" and says accounts will be settled later; the book does not say where, and gives no day)'
    units: B
- cite:
    id: cal.1960-05-28.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1150 (in the second half of May Mao in talk with Jespersen, chairman of the Danish Communist Party, states that the Chinese party does not approve of peaceful coexistence and peaceful transition; the book gives no day)'
    units: B
- cite:
    id: cal.1962-01-27.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1125–1126 n.29 (Liu''s oral report held a passage on Peng Dehuai of about 1,100 characters, cut from his *Selected Works*: the struggle against Peng at Lushan was wholly necessary, not because of his letter, some of whose particulars fit the facts, but because for long he had had a small clique in the Party, a remnant of the Gao–Rao group and its main member, with an international background, its anti-Party acts tied to subversion by certain foreigners in China, and plotting to usurp the Party)'
    units: C
- cite:
    id: cal.1964-12-28.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1146 n.69 (at the conference on the four cleans Mao comes into a meeting Deng Xiaoping chairs, the state Constitution 憲法 in one hand and the Party Constitution 黨章 in the other: one does not let him attend a meeting, one does not let him speak, why take away the rights the two give him? Deng had told him beforehand he need not attend, being unwell; in Chen Boda''s account to his son Chen Xiaonong, Liu Shaoqi had broken in on Mao''s speech at the meeting on the 23 Articles the day before and gone on speaking; the book dates the scene Jan. 28, 1965)'
    units: F
