- add:
    entry:
      id: cal.1960-03-05.china-leadership-9
      when: Mar. 5
      date: '1960-03-05'
      thread: china-leadership
      c: 'The Henan 河南 committee 省委, first secretary Wu Zhipu 吳芝圃, reports to Mao 毛澤東: 88 percent of the province''s people are in the mess halls, and the halls run well are 66 percent of the whole. It says the province''s measures, secretaries of three levels eating in the halls and keeping "test fields," have made the socialist mess-hall front firm.'
      n: '[[w.yang-jisheng-mubei]], II, 1084 n.19. Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Henan Provincial Committee Secretariat office, telephone report of Mar. 5, 1960, "The state of the rural public mess halls in Henan" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 87 n.3); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 74–75 (the note the book cites). See [[cal.1960-03-15.china-leadership-2]]. Names: Mao Zedong. Check: [[cal.1960-03-15.china-leadership-2]] gives the Henan paper as 336,000 halls and 99 percent of the villagers; the book''s 88 percent is of the whole province''s people.'
      src:
        c: '30709913'
        rows:
        - 'w.yang-jisheng-mubei II, 1084: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1960-03-07.china-leadership-7
      when: Mar. 7
      date: '1960-03-07'
      thread: china-leadership
      c: 'The Central Committee General Office 中共中央辦公廳 issues *Qingkuang jianbao* 情況簡報 no. 117, with a report compiled from the reports of eight provinces and cities, Henan 河南, Hebei 河北, Shanxi 山西, Shandong 山東, Gansu 甘肅, Liaoning 遼寧, Jilin 吉林 and Heilongjiang 黑龍江: most of the mess halls are now run well.'
      n: '[[w.yang-jisheng-mubei]], II, 1084–1085 n.20. Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Central Committee General Office, *Qingkuang jianbao* no. 117, Mar. 7, 1960, "The state of the rural public mess halls in eight provinces" (cited by [[w.jianguo-yilai-mao-zedong]], XV, 86 n.2); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 73 (the note the book cites). See [[cal.1960-03-18.china-leadership-5]]. Check: the day: the book says only that the General Office compiled the report "in the meantime" (March); Mar. 7 is the day the Mao wengao''s reader''s row gives the *Qingkuang jianbao*.'
      src:
