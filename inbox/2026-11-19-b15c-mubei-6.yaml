- cite:
    id: cal.1960-12-30.china-leadership-6
    item: '[[w.yang-jisheng-mubei]], II, 806–807 n.62 (Mao''s insertion of Dec. 30 at the Central Work Conference''s report meeting: it was the Center''s own thinking that was confused, with the Zhengzhou and Shanghai papers against the winds and the great drives for steel, county and commune industry, transport and culture raising them again; the "man-made disaster" 人禍 is not the enemy''s but our own; this year''s levelling is worse than 1958''s, a whole year, not four or five months; industry above the county has drawn 50 million laborers, 24 million in 1957, 44 million in 1958, 6 million more in 1959–60, 26 million over 1957)'
    units: E, G
