    entry:
      id: cal.1964.china-leadership-29
      when: 1964, after Aug. 1
      date: '1964'
      thread: china-leadership
      at: after 1964-08-01
      c: Mao 毛澤東, at a meeting at his residence, stresses that Wang Guangmei's 王光美 report is not to be issued. Li Xuefeng 李雪峰 is present; Mao says Li Xuefeng does not approve the report, that the white areas had talent, and that the correct representative of work in the white areas is Li Xuefeng.
      n: '[[w.yang-jisheng-mubei]], II, 1135 n.50–51 (Wang Li''s account, the book quotes it; n.50, the author''s own: Mao had once named Liu Shaoqi the correct representative of white-area work). Made public: 2008. To check: Wang Li 王力, *Wang Li yigao* 《王力遺稿》 (Hong Kong: Beixing chubanshe, 2001), 573 (cited by [[w.yang-jisheng-mubei]], II, 1135 n.51). See [[cal.1964-08-01.china-leadership]]. Names: Mao Zedong. Check: the month and day; Wang Li''s account puts the meeting after Liu Shaoqi''s report of Aug. 1 was edited for issue and withdrawn ("afterward"), and gives no date; the Center issued the Taoyuan report on Sept. 1 ([[cal.1964-09-01.china-leadership]]) on Mao''s comment of Aug. 27.'
      src:
        c: a59c0c04
        rows:
        - 'w.yang-jisheng-mubei II, 1135: all'
        - 'via w.yang-jisheng-mubei II, 1135 n.51: all'
      tags:
