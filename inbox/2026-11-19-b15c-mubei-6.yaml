    id: cal.1964-11-12.china-leadership-2
    text: 'Check: [[w.yang-jisheng-mubei]], II, 1136, calls the instruction of Nov. 12, 1964 the "Later Ten Points" (後十條), the name of the paper of Sept. 1963 ([[cal.1963-09.china-leadership-3]]).'
- cite:
    id: cal.1964-12-15.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1144 (the Central Work Conference, Dec. 15, 1964 to Jan. 14, 1965, held to discuss the four cleans and draw up the 23 Articles)'
    units: A
- cite:
    id: cal.1964-12-20.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1144–1145 n.67 (Liu: the main contradiction is between the four cleans and the four uncleans, the nature of it the people''s and the enemy''s interwoven; Mao: the landlords and rich peasants are the backstage bosses, the four-unclean cadres the men in power, the urgent thing the cadres, to rouse the masses to rectify the Party; Liu: each contradiction is to be met by its facts, not all raised to the enemy''s; Mao: this is a socialist education movement, not a "four cleans, four uncleans" movement, the point being to rectify the Party''s men in power taking the capitalist road; Liu asks which ministry''s head is such a one, coal or metallurgy; Mao: Zhang Linzhi 張霖之 is; the book takes the scene from Wang Guangmei''s and Liu Yuan''s book)'
    units: D, F
