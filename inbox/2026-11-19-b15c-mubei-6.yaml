      id: cal.1960-11-04.china-leadership-6
      when: Nov. 4
      date: '1960-11-04'
      thread: china-leadership
      also:
      - economy
      c: 'Sun Haiguang 孫海光 and Qiu Lu 丘路 report on an inspection of the supply of subsidiary foods in Suzhou 蘇州. Every cadre of the commerce bureau''s vegetable, fish and food companies buys by the back door: 339,000-odd jin of vegetables sold so, Jan.–Aug.; 114 cadres of the fish company bought 4,693 jin of fresh fish, 41 jin each, Jan.–Sept.; 28,000-odd jin of meat went to staff and the back door while the public was owed 580,000 meat coupons. In the first half of 1960 the finance and trade departments swapped 50,000-odd jin of meat and 38,000-odd of fish with Wuxi, Inner Mongolia and the Northeast, with banquets, 76 in 1959 and 36 so far in 1960.'
      n: '[[w.yang-jisheng-mubei]], I, 386–387 (no note). Made public: 2008. To check: Sun Haiguang 孫海光 and Qiu Lu 丘路, "Guanyu Suzhou shi fushipin shichang gongying qingkuang de jiancha baogao" 《關於蘇州市副食品市場供應情況的檢查報告》, Nov. 4, 1960 (named by [[w.yang-jisheng-mubei]], I, 386; no note).'
      src:
