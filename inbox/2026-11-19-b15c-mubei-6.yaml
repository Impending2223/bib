      id: cal.1964-10.china-leadership-9
      when: Oct.
      date: 1964-10
      thread: china-leadership
      c: In Guizhou 貴州, from October and for two months, the struggle to seize power runs through the province, prefectures, autonomous prefectures, cities and counties. The leading groups from the provincial committee to the prefectural and county committees and every organ and unit of county rank are taken over wholesale. Many cadres are suspended or dismissed, some expelled from the Party and from office, some arrested and jailed.
      n: '[[w.yang-jisheng-mubei]], II, 1136–1137 n.53. Made public: 2008. To check: Gao Hua 高華, "Zai Guizhou ''siqing yundong'' de beihou: dui yi pian dangdaishi huiyi wenben de jiedu" 《在貴州「四清運動」的背後：對一篇當代史回憶文本的解讀》 (the revised full text), *Lingdaozhe* 《領導者》, Jan. 2006 (no. 12) (cited by [[w.yang-jisheng-mubei]], II, 1137 n.53). See [[cal.1964-10.china-leadership-8]].'
