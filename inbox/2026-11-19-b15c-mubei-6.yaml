    item: '[[w.yang-jisheng-mubei]], II, 1145–1146 n.68 (a few tables paid for from his royalties; the dinner, the children not invited as they have done no work for the revolution; Mao criticizes the formulations of the socialist education movement, "four cleans, four uncleans, the crossing of contradictions in and outside the Party," as not Marxist, charges some central organs with "independent kingdoms," and speaks of the danger of revisionism in the Party)'
    units: B, E, F, G
