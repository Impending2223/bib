      when: 1964, after Aug. 1
      date: '1964'
      thread: china-leadership
      at: after 1964-08-01
      c: 'Jiang Qing 江青 goes weeping to Mao 毛澤東: after Stalin''s death Khrushchev gave a secret report; Mao is not yet dead and Liu Shaoqi has given a public one.'
      n: '[[w.yang-jisheng-mubei]], II, 1135 n.51 (Wang Li''s account). Made public: 2008. To check: Wang Li 王力, *Wang Li yigao* 《王力遺稿》 (Hong Kong: Beixing chubanshe, 2001), 573 (cited by [[w.yang-jisheng-mubei]], II, 1135 n.51). See [[cal.1964-08-01.china-leadership]]. Names: Jiang Qing, Mao Zedong, Liu Shaoqi. Check: the month and day; the account gives only "after Liu Shaoqi''s report of Aug. 1".'
