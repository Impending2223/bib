    item: '[[w.yang-jisheng-mubei]], II, 1031 (at the end of Aug. the State Planning Commission''s party group reports the 1961 targets to the State Council, and Zhou Enlai adds "filling out" 充實, making the eight characters "adjust, consolidate, fill out, raise"; the Center''s comment of Sept. 30 on the control figures puts the four terms in a Central document for the first time)'
    units: A, C
- cite:
    id: cal.1960-09-30.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1031 (the Center''s comment forwarding the Commission''s report on the control figures for 1961: "adjustment, consolidation, filling out and raising," the first time in a Central document, not yet a policy for a period)'
    units: A
- cite:
    id: cal.1960-12-03.china-leadership-4
    item: '[[w.yang-jisheng-mubei]], II, 1031 (the book dates the Center''s two urgent instructions on the year''s steel plan of 18.6 million tons, as a political task, to Aug. and Dec.; no day for the second)'
    units: A
- cite:
    id: cal.1961-01-14.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1032 (the Ninth Plenum in mid-Jan. announces the policy of adjusting, consolidating, filling out and raising to the whole Party and country, with building cut and the pace adjusted, "on the basis of victories already won")'
    units: H
