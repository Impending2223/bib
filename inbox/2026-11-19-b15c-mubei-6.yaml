- cite:
    id: cal.1962-08-12.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1129 n.36 (Mao''s comment of Aug. 12 on a document, sharply criticizing Deng Zihui: he has wavered, his view of the situation nearly all dark, and he vigorously promotes household contracting; this goes with his holding back from cooperatives before 1955, ordering the cutting of some hundreds of thousands and having no regard for them, and before that urging the "four great freedoms"; he has not linked it to his own bourgeois-democratic standpoint of 1950–55)'
    units: A
- cite:
    id: cal.1962-09-27.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 731 (the Tenth Plenum, Sept. 27: the draft work regulations of the people''s communes make the production team, not the brigade, the basic accounting unit; members'' income by distribution, the public welfare fund to help hard-pressed households; three-level ownership, each level accounting for itself)'
    units: G
- cite:
    id: cal.1964-08-01.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1134–1135 n.49 (Liu Shaoqi''s report to the leading cadres of the central Party, government and army organs at the Great Hall: the Politburo members in Peking and the marshals on the platform, Zhou Enlai leading Liu to the centre; Liu speaks pacing, away from the microphone, on the need for cadres to squat at points, "whoever will not go down is to be driven down," and tells them to learn from Wang Guangmei, in Li Xin''s account)'
    units: A
