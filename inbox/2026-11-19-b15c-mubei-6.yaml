    item: '[[w.yang-jisheng-mubei]], II, 1135–1136 (Liu issues, in the Center''s name, the comment forwarding Li Xuefeng''s letter to him, agreeing that the question of opposing "fear of the left, not of the right" be raised in time, and that committees of prefectures, counties, districts, communes, brigades, factories and mines that are "rotten" be subject to the seizure of power; the book dates it Oct. 12)'
    units: A, B
- cite:
    id: cal.1964-10-24.china-leadership-3
    item: '[[w.yang-jisheng-mubei]], II, 1136 (Liu drafts the Center''s instruction on seizing power in the socialist education movement and forwards the Tianjin committee''s report on the Xiaozhan area, where the Xiaozhan work team under Chen Boda says the power built by three counterrevolutionary cliques is a "counterrevolutionary two-faced regime"; Liu affirms the Xiaozhan seizure)'
    units: A
- cite:
    id: cal.1964-11-12.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1136 (Liu drafts the Center''s instruction of Nov. 12 on letting the poor and lower-middle peasant associations exercise power where the problems are grave, the old leading group set aside; the book calls it the "Later Ten Points" 後十條)'
    units: A
