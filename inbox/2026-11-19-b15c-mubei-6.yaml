    id: cal.1961-09-15.china-leadership-2
    item: '[[w.yang-jisheng-mubei]], II, 1032 (the Center''s Directive on Current Industrial Problems of Sept. 15, after the work conference at Lushan of late Aug. to early Sept.: the eight-character policy not carried out for over a year; targets to be cut to a sure level, a full retreat)'
    units: A
- cite:
    id: cal.1961-09-15.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1033 n.40 (at the conference, during Zhou Enlai''s speech, Mao breaks in that the mistakes are only that little, nothing grave, and then that now "we have retreated to the valley floor," with the situation rising day by day; the book gives no day for Zhou''s speech)'
    units: C
- cite:
    id: cal.1961-06-12.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 918 n.147 (after Lushan the mistake was to pass the resolution on Peng, Huang, Zhang and Zhou below the county; it should have stopped at the county, with the Zhengzhou minutes and the Shanghai eighteen questions still carried out below and the left still opposed; fighting the right made a false picture; good people who spoke the truth were made right opportunists, even counterrevolutionaries)'
    units: C
