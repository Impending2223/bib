    item: '[[w.yang-jisheng-mubei]], II, 1135 n.52 (on Sept. 1, at Liu Shaoqi''s urging, the Center sends the Taoyuan experience to all localities as Zhongfa [64] 527, its comment stressing its "general significance")'
