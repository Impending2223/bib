    id: cal.1964-08-24.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1136–1137 n.53 (Liu reports at Kunming on Aug. 24 to the secretaries of prefectural, city and autonomous-prefecture committees of Yunnan and Guizhou on the socialist education movement, Wang Guangmei also reporting on the Taoyuan experience; Liu names Zhou Lin, first secretary of the Guizhou committee, in criticism)'
    units: A
