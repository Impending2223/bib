    item: '[[w.yang-jisheng-mubei]], II, 1137 n.55 (Mao''s comment of Aug. 27: first to be printed for the comrades at the meeting for discussion; if all agree, to be sent throughout the country; "I agree with the views of Chen Boda and Comrade Shaoqi")'
    units: B, C, D
