    id: cal.1964-08-01.china-leadership
    item: '[[w.yang-jisheng-mubei]], II, 1135 n.51 (in Wang Li''s account Liu says Mao''s works too are not to be taken dogmatically and the investigation meeting is out of date: no one who does not squat at a point can be a Central Committee member or enter the Secretariat or Politburo)'
    units: A
