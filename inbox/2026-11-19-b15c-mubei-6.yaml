      id: cal.1960-02-27.china-leadership-6
      when: Feb. 27
      date: '1960-02-27'
      thread: china-leadership
      c: 'The Shandong 山東 committee 省委, first secretary Shu Tong 舒同, reports to the Center 中共中央 on the arrangement of members'' livelihood 社員的生活安排: notable results. It grants dropsy and deaths from hunger in the province and finds the present situation "infinitely good," listing several great signs of it.'
      n: '[[w.yang-jisheng-mubei]], II, 1084 n.17. Made public: 2008. Printed for internal circulation: [[w.zedong-jianguo-yilai-mao-zedong]], vol. 9 (1996). To check: Shandong Provincial Committee, report of Feb. 27, 1960 to the Center and the Shanghai Bureau on members'' living arrangements (cited by [[w.jianguo-yilai-mao-zedong]], XV, 80 n.1); [[w.zedong-jianguo-yilai-mao-zedong]], 9, 62–63 (the note the book cites). See [[cal.1960-03-15.china-leadership-2]]. Check: the book gives the report''s days as Feb. 27 and Mar. 21; the entry takes Feb. 27, the day the Mao wengao note gives; Mar. 21 is the day of the six-level conference''s bulletin no. 1 ([[cal.1960-03-22.china-leadership-5]]).'
      src:
        c: 743562ea
        rows:
        - 'w.yang-jisheng-mubei II, 1084: all'
