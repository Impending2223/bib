patch: threads-3
by: Claude (thread statements, stage 6, agent 3)
ops:
  - edit:
      id: cal.thread.africa
      base: 4567c101
      set:
        c: "Africa apart from the Congo. Sharpeville and the Security Council; the colonial declaration; Williams's \"Africa for the Africans\"; Angola at the UN; Mohamed V dies; Nkrumah and the Volta dam; Bizerte; the Moroccan bases; Évian, Algeria independent; Ben Bella at the White House and in Havana; the General Assembly's sanctions on South Africa."
        c2: "Africa apart from the Congo. Olympio killed; NSAM 221 on Algeria; the Addis Ababa conference; Portugal's territories at the Security Council; the arms embargo on South Africa; the Algerian–Moroccan war; the Moroccan bases handed over; Zanzibar; Wheelus; Rivonia; Ben Bella deposed; Rhodesia's declaration."
        c3: "Africa apart from the Congo. Nigeria's coups; Nkrumah overthrown; the *Joanna V*; Robert Kennedy in South Africa; South West Africa at the Court and the UN; the Korry report; the *Tiger* talks and the mandatory sanctions; Rhodesia's sanctions by executive order; Biafra's secession; Humphrey's tour; the appeal on Nigeria; the Addis Ababa talks."
  - edit:
      id: cal.thread.black-nationalism
      base: cfec7516
      set:
        c: "Malcolm X and the Nation of Islam, and Black Power. \"Message to the Grass Roots\"; the \"chickens\" remark and the suspension; the break, the Muslim Mosque; \"The Ballot or the Bullet\"; the Organization of Afro-American Unity; the assassination."
        c3: "Malcolm X and the Nation of Islam, and Black Power. CORE's \"black power\"; the Black Panther Party founded; Ali refuses induction; the Panthers at Sacramento; the Black Power conference at Newark; the Mulford Act; the FBI's counterintelligence program, widened; Newton's arrest, trial and conviction; Glenville; Smith and Carlos at Mexico City."
  - edit:
      id: cal.thread.consumers
      base: 1f5f353d
      set:
        c: "Consumer protection: credit, food, products, securities. The message of Feb. 16, 1967; Betty Furness; truth in lending through the Senate; the Product Safety Commission; the Flammable Fabrics amendments; the Wholesome Meat Act; the message of Feb. 6, 1968; the Consumer Credit Protection Act; the Williams Act; pipeline safety, poultry, radiation."
  - edit:
      id: cal.thread.court
      base: 27d426e6
      set:
        c: "The Supreme Court: its Terms, its new Justices, and Congress's answers. *Raines*; *Elkins*; *Gomillion*; *Boynton*; *Monroe v. Pape*; *Mapp*; *Baker v. Carr*, argued, reargued, decided; White for Whittaker; *Engel v. Vitale*; Goldberg for Frankfurter."
        c2: "The Supreme Court: its Terms, its new Justices, and Congress's answers. *Gideon*; *Gray v. Sanders*; the sit-in cases; *Schempp*; *Wesberry*; *New York Times v. Sullivan*; *Reynolds v. Sims*; the Tuck bill and the Dirksen rider; *Heart of Atlanta*; *Griswold*; Fortas for Goldberg; Dirksen's apportionment amendment."
        c3: "The Supreme Court: its Terms, its new Justices, and Congress's answers. *South Carolina v. Katzenbach*; *Harper*; *Miranda*; *Katzenbach v. Morgan*; *Reitman v. Mulkey*; *Loving*; Marshall for Tom Clark; Dirksen's convention; *Terry*; *Jones v. Mayer*; Warren's retirement; Fortas for Chief Justice, cloture refused."
  - edit:
      id: cal.thread.cuba-bay-of-pigs
      base: 87db7ca1
      set:
        c: "The invasion of Cuba by the CIA's exile brigade, from Eisenhower's covert program to the collapse on the beach and after. The program of Mar. 17, 1960; Retalhuleu; the President-elect briefed; the Chiefs on Trinidad; Trinidad to Zapata; Schlesinger's and Fulbright's dissents; \"no intervention\"; the strike of Apr. 15, the second cancelled; the landing; Khrushchev's message; the beachhead lost; Nixon with Kennedy."
  - edit:
      id: cal.thread.japan
      base: 7480a1e0
      set:
        c: "The alliance with Japan, and the Ryukyus. The security treaty signed; the Diet's vote and the riots; Hagerty mobbed, Eisenhower's visit cancelled; his Far East tour; the Senate's consent; Kishi stabbed, Ikeda in; Akihito at the White House; Reischauer to Tokyo; Ikeda in Washington; the Ryukyus task force; the Joint Committee at Hakone; the Ryukyus order."
  - edit:
      id: cal.thread.jobs-and-wages
      base: 5df8b72c
      set:
        c: "Unemployment, depressed areas, and wages. The area redevelopment veto; the federal pay veto; the minimum wage held over; the recovery message; area redevelopment; the minimum wage; Missouri's fair employment act; federal employees' unions; manpower training; public works acceleration."
        c2: "Unemployment, depressed areas, and wages. Youth employment; area redevelopment's defeat; the Jefferson Bank; the Sheraton-Palace and Auto Row; the 1964 Manpower Report; the Appalachian act; Indiana's right-to-work law repealed; the area-development message; the labor message; 14(b) repealed by the House; the public works act; cloture on 14(b) refused."
        c3: "Unemployment, depressed areas, and wages. 14(b) refused again; *Motorola*; the equal employment bill; the Fair Labor Standards Amendments of 1966; New York's Taylor Law; the Appalachian amendments; the Age Discrimination in Employment Act; the manpower message, JOBS; the coal mine safety bill; Farmington."
  - edit:
      id: cal.thread.labor-disputes
      base: 6611515d
      set:
        c3: "Strikes and lockouts: the emergency boards, the injunctions, the settlements. The transit strike settled; Delano to Sacramento, Schenley; the Texas melon strike; the airline strike; the railroad shopcraft strike and the Special Board; New York's teachers; the sanitation strikes in New York and Memphis; Florida's teachers; Ocean Hill–Brownsville's three strikes; the longshoremen's Board of Inquiry and strike; San Francisco State's teachers."
  - edit:
      id: cal.thread.missile-crisis
      base: cd886fe0
      set:
        c: "The Soviet missiles in Cuba, from the decision to the aftermath. The Presidium's plan; McCone's warning; Keating's charges; the Cuba resolution; the U-2's find; the ExComm; the address and the quarantine; the letters; Black Saturday; the withdrawal; the IL-28s; the Stevenson story."
        c2: "The Soviet missiles in Cuba, from the decision to the aftermath. The joint letter to U Thant; Keating's caves; McNamara's photographs; the Soviet troops."
  - edit:
      id: cal.thread.program
      base: 54825652
      set:
        c: "The President's program as a whole: the State of the Union messages and the agenda they set; what falls under no field's thread. Eisenhower's State of the Union, 1960; the national goals commission; the legislative program message; Eisenhower's last State of the Union; the Address to the Joint Session; Fulbright–Hays; the State of the Union, 1962."
        c2: "The President's program as a whole: the State of the Union messages and the agenda they set; what falls under no field's thread. The State of the Union, 1963; the State of the Union, 1964; the consumer message; the Great Society, Ann Arbor; the acceptance; the State of the Union, 1965; the arts and humanities foundation; the second-year program."
        c3: "The President's program as a whole: the State of the Union messages and the agenda they set; what falls under no field's thread. The State of the Union, 1966; the consumer message; Long's campaign fund; Fair Packaging; the State of the Union, 1967; the postal commission; the campaign fund held until Congress sets guidelines; the election reform message; the State of the Union, 1968; the last State of the Union."
  - edit:
      id: cal.thread.steel
      base: a56533f4
      set:
        c: "Steel prices and the guideposts. The 1959 strike settled; the letter of September 1961; the early settlement; Blough's price rise; \"a tiny handful\"; the FBI's questioning of reporters; the rescission; Robert Kennedy's notes."
        c2: "Steel prices and the guideposts. Wheeling's selective increases; Abel at the White House; the 1965 settlement; Bethlehem's price rise."
  - edit:
      id: cal.thread.testing
      base: 2020df6b
      set:
        c: "Arms control and nuclear testing. The threshold proposal; France's first test; the Ten-Nation Committee; the Antarctic Treaty; the Soviet resumption; American tests underground; ACDA; the fifty megatons; atmospheric tests resumed; the Eighteen-Nation Committee; Starfish Prime; Khrushchev's inspection offer."
        c2: "Arms control and nuclear testing. Cousins's report from Khrushchev; NSAM 239; American University; the hot line; Moscow; the treaty, the hearings, the Senate's consent; the Geneva proposals; the cut in fissionable material; China's test; the Gilpatric committee on proliferation; NSAM 335."
        c3: "Arms control and nuclear testing. China's third test; nonproliferation with Gromyko; China's hydrogen bomb; the nonproliferation drafts at Geneva; Boxcar; the treaty commended, signed, sent to the Senate; Kosygin on strategic arms; MIRV tested; the talks put off by Czechoslovakia; France's hydrogen bomb; the Senate's delay; Johnson to Nixon on the talks."
  - edit:
      id: cal.thread.vietnam-congress
      base: d86eecef
      set:
        c: "The war as Congress met it: hearings and reports, the votes on its money, the briefings at the White House, the members' speeches and statements, their letters, memoranda and talks with the President. Mansfield's report on aid; his and Fulbright's letters on the MAAG; Findley and Dodd for combat forces; Fulbright's \"dangerous doctrine\"; Nolting and Harriman before Foreign Relations; Morse's doubts; Mansfield at Michigan State; his trip to Saigon and his report."
        c2: "The war as Congress met it: hearings and reports, the votes on its money, the briefings at the White House, the members' speeches and statements, their letters, memoranda and talks with the President. Mansfield's \"Observations\"; Church on aid to Diệm; McGovern's \"Vietnam Mess\"; Russell's \"We should get out\"; Mansfield on neutralization; Laird on carrying the war north; the Southeast Asia resolution; Church and McGovern for negotiation; the $700 million; Fulbright's memorandum against a wider war; the July decision told to the leaders; Mansfield's report on his Asian trip."
        c3: "The war as Congress met it: hearings and reports, the votes on its money, the briefings at the White House, the members' speeches and statements, their letters, memoranda and talks with the President. The fifteen Senators against resuming the bombing; the supplemental and Morse's amendment on the Tonkin resolution; Fulbright's \"arrogance of power\"; the Armory speech; Fulbright's meeting of sixteen Senators; the hearings on a world power's responsibilities; the House Democrats' letters; Church's \"Plea for Realism\"; Rusk asked to testify in public; Mansfield's resolution for the Security Council; the Tonkin incidents reexamined; the 132 members' resolution for a review."
  - edit:
      id: cal.thread.vietnam-force-levels
      base: bdbfffbf
      set:
        c: "The decisions on American troop strength in Vietnam. The letter to Diệm on raising the army; Kennedy to Krock; Ball's \"three hundred thousand men\"; McNamara's order at Honolulu, the advisers out by the end of 1965; the October conference."
        c2: "The decisions on American troop strength in Vietnam. The May conference, the thousand; the White House statement of Oct. 2 and NSAM 263; Harkins's first 300; the Model Plan superseded; Taylor's 4,200 more advisers; the Marines for Đà Nẵng; NSAM 328; Honolulu, 82,000; Westmoreland's forty-four battalions; Ball's memorandum; the July decision, the 125,000 of July 28; McNamara's 74 battalions."
        c3: "The decisions on American troop strength in Vietnam. McNamara's \"Military Outlook\"; the Honolulu Sheet; CINCPAC's request for 1967; the barrier; Program Four, the Chiefs' 504,000 cut to 469,000; Program 5, Westmoreland's request, the 525,000; Wheeler's report after Tet, the 205,000; Clifford's group; the Wise Men; the address of Mar. 31; the reserves called."
  - edit:
      id: cal.thread.women
      base: 8034fa79
      set:
        c: "The status of women in law and policy. The equal rights amendment in the Senate; the President's Commission; the Attorney General's opinion on appointments by sex, and the directive."
        c2: "The status of women in law and policy. *The Feminine Mystique*; the Equal Pay Act; *American Women*; \"sex\" in Title VII; the equal rights amendment reported."
