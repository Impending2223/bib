      c: 'Missouri, for the Senate: Eagleton over Long, 205,078 to 186,286, 36.4 percent, W. True Davis 162,261, 28.8 percent, three others; the third Senator denied renomination in 1968. Long charged by *Life* with taking fees from Morris Shenker, Hoffa''s lawyer. Republican: Thomas Curtis over Morris D. Duncan, 174,131 to 21,912, 87.8 percent, Forest Nave Jr. 2,207, 1.1 percent. For governor: Hearnes over Robert B. Curtis, 451,905 to 39,870, 85.1 percent, Milton Morris 39,050, 7.4 percent; Republican, Roos over Harry C. Timmerman, 156,126 to 37,944, 76.5 percent, Harvey F. Euge 10,019, 4.9 percent.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2110. Check: the counts, "substantially complete" and "almost complete"; the State''s canvass. Names: Eagleton, Long, Davis, Curtis, Hearnes, Roos.'
