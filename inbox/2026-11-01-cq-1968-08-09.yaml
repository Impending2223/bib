- add:
    entry:
      id: cal.1968-07-17.electoral-college
      when: July 17
      date: '1968-07-17'
      thread: electoral-college
      c: 'Virginia. A three-judge federal court dismisses, unanimously, the suit brought Mar. 21 by voters of the State''s ten districts against the unit rule for presidential electors; a district system asked. J. Harvie Williams of the American Good Government Society its organizer. Judge Albert V. Bryan, for the court: the unit rule "exceptionable in many aspects" but nothing in it "offensive to the Constitution."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2111. To check: the opinion (F. Supp.).'
      tags:
      - state:va
- add:
    entry:
      id: cal.1968-07-21.elections-1968-8
      when: July 21
      date: '1968-07-21'
      thread: elections-1968
      c: Washington. Humphrey at a $500-a-plate dinner for his campaign, some 2,500 there; more than $1 million raised, by his aides' count.
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2107. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-07-24.civil-rights-organizations
      when: July 24
      date: '1968-07-24'
      thread: civil-rights-organizations
      also:
      - cities-and-housing
      c: 'CORE''s plan for capital owned in the ghettos, in two Senate bills: S. 3875, sixteen Democrats, Fred Harris and Gaylord Nelson among them; S. 3876, fourteen Republicans, Javits and Percy among them. In the House, 36 Republicans, the party''s leaders among them.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142. Names: Harris, Nelson, Javits, Percy.'
      tags:
      - name:harris-fred-r
      - name:nelson-gaylord-a
      - name:javits-jacob-k
      - name:percy-charles-h
- add:
    entry:
      id: cal.1968-07-24.consumers
      when: July 24
      date: '1968-07-24'
      thread: consumers
      c: 'House Merchant Marine and Fisheries opens hearings on the Recreational Boat Safety Act, H.R. 15223, asked in the consumer message of Feb. 6. Garmatz, the chairman, doubts action before adjournment. Trimble, for the Coast Guard: standards for builders, grants for the States'' programs. July 30, the Boating Industry Association against the "''blank check'' regulatory authority."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2118. Names: Garmatz.'
      tags:
      - name:garmatz-edward-a
- add:
    entry:
      id: cal.1968-07-26.farm
      when: July 26
      date: '1968-07-26'
      thread: farm
      also:
      - middle-east
      c: 'Cleared, against the administration: H.R. 10915, the quota for extra-long staple cotton withheld from a country that breaks relations with the United States (Egypt, the Sudan), its share to American growers. The House takes the Senate''s substitute by voice vote; the Senate passed it July 22.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2115–16.'
- add:
    entry:
      id: cal.1968-07-26.vietnam-saigon
      when: July 26
      date: '1968-07-26'
      thread: vietnam-saigon
      c: Saigon. Trương Đình Dzu, runner-up in the presidential election of 1967, sentenced to five years for urging talks with the NLF, under a law of 1965 against acts or words "tending to undermine the anti-Communist spirit."
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106, 2119. Check: CQ gives "five years hard labor" (2106) and "five years'' imprisonment" (2119). Names: Trương Đình Dzu.'
      tags:
      - name:truong-dinh-dzu
- add:
    entry:
      id: cal.1968-07-28.civil-disorders-kerner
      when: July 28
      date: '1968-07-28'
      thread: civil-disorders-kerner
      c: 'Three studies made for the Kerner Commission, released, not endorsed by it. In six cities that rioted in 1967, 18 percent of the Negroes of the riot areas took part, most of them employed adults: the "riffraff theory" wrong. 35 percent approve, or partly, of Carmichael''s "stand." A third say a job denied them for race. Ginsburg, its executive director: "the most authoritative presentation of data that is available so far."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2120. Names: Carmichael, Ginsburg.'
      tags:
      - name:carmichael-stokely
      - name:ginsburg-david
- add:
    entry:
      id: cal.1968-07-28.states-and-cities
      when: July 28
      date: '1968-07-28'
      thread: states-and-cities
      also:
      - cities-and-housing
      c: 'The Advisory Commission on Intergovernmental Relations, *Urban and Rural America: Policies for Future Growth*, before the National Association of Counties'' convention: urban growth to "an appropriate executive agency"; incentives for industry, federal contracts placed to that end, public assistance alike from State to State, family planning.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2120.'
- add:
    entry:
      id: cal.1968-07-29.elections-1968-miami
      when: July 29
      date: '1968-07-29'
      thread: elections-1968-miami
      c: Miami Beach. The Platform Committee's hearings open, Dirksen in the chair; to Aug. 2. Some 250 witnesses in all, before the full committee, its seven subcommittees and the session of July 22 in Washington.
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2097. Names: Dirksen.'
      tags:
      - name:dirksen-everett
      - state:fl
- add:
    entry:
      id: cal.1968-07-29.conservation
      when: July 29–31
      date: '1968-07-29'
      thread: conservation
      c: 'Senate Public Works'' Subcommittee on Air and Water Pollution, Muskie, on the criteria for air quality under the acts of 1963 and 1967. Muskie: "sufficient evidence to indicate a cause for concern."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2117–18. Names: Muskie.'
      tags:
      - name:muskie-edmund-s
- add:
    entry:
      id: cal.1968-07-30.vietnam-paris-3
      when: July 30
      date: '1968-07-30'
      thread: vietnam-paris
      c: 'Rusk''s news conference: no stop to the bombing until North Vietnam says what it will do in return; the lull in the South no sign of restraint in answer to the limit on bombing.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2119. Names: Rusk.'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-07-30.economy
      when: July 30
      date: '1968-07-30'
      thread: economy
      c: 'Treasury and the Budget Bureau, a joint statement: the deficit for fiscal 1968, $25.4 billion; $8.8 billion in 1967. Receipts $153.5 billion, $2.3 billion under January''s estimate; outlays $178.9 billion, $3.3 billion over; defense $77.8 billion, $3.6 billion over. The surcharge''s late passage cost $2.7 billion.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2120.'
- add:
    entry:
      id: cal.1968-07-30.elections-1968-miami
      when: July 30
      date: '1968-07-30'
      thread: elections-1968-miami
      c: The Republican National Committee's Contests Committee, seven members, upholds the seating of Gross in Iowa's delegation. The State convention, Apr. 17, had named Mrs. Joy Rohm a delegate at large, then put Gross in her place on a motion to suspend the rules.
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142. Names: Gross.'
      tags:
      - name:gross-h-r
      - state:ia
- add:
    entry:
      id: cal.1968-07-30.elections-1968
      when: July 30
      date: '1968-07-30'
      thread: elections-1968
      also:
      - vietnam-saigon
      c: 'McCarthy''s news conference: Dzu''s trial and sentence "inexcusable," to be "immediately repudiated by the United States"; Humphrey, who said July 29 he knew of it only from the papers, "should further inform himself." His trip to Paris put off until after the Republican convention. In Newark and East Brunswick, N.J.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2107–08. Names: McCarthy, Humphrey, Trương Đình Dzu.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:truong-dinh-dzu
      - state:nj
- add:
    entry:
      id: cal.1968-07-30.jobs-and-wages
      when: July 30
      date: '1968-07-30'
      thread: jobs-and-wages
      c: 'H. Con. Res. 705, the sense of Congress that veterans of the Vietnam war''s years be given preference in employment, federal and private, completed: the House takes the Senate''s amendments by voice vote. No force of law.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116.'
- add:
    entry:
      id: cal.1968-07-30.congress
      when: July 30–Aug. 2
      date: '1968-07-30'
      thread: congress
      c: 'The three new Democrats on Ways and Means leave their other committees: Burleson, July 30, House Administration, its chairman, Foreign Affairs, and the joint committees on the Library, its chairman, and Printing; Corman, Aug. 1, Judiciary; Green, Aug. 1, Post Office and Science and Astronautics. July 31, Friedel to the joint committees, H. Res. 1278; Aug. 2, Tiernan to Post Office, H. Res. 1282.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2118. Names: Burleson, Corman, Friedel, Tiernan.'
      tags:
      - name:burleson-omar-t
      - name:corman-james-c
      - name:friedel-samuel-n
      - name:tiernan-robert-o
- add:
    entry:
      id: cal.1968-07-31.elections-1968-miami-2
      when: July 31
      date: '1968-07-31'
      thread: elections-1968-miami
      c: 'The Republican National Committee upholds the Contests Committee: Gross seated, not Mrs. Rohm.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142. Names: Gross.'
      tags:
      - name:gross-h-r
      - state:ia
- add:
    entry:
      id: cal.1968-07-31.elections-1968
      when: July 31
      date: '1968-07-31'
      thread: elections-1968
      also:
      - vietnam
      c: 'Humphrey, a speech prepared for the National Association of Counties: free elections in South Vietnam, "elections in which every group willing to do so can play its full part"; the results accepted "whatever they may be."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-07-31.elections-1968-2
      when: July 31
      date: '1968-07-31'
      thread: elections-1968
      also:
      - vietnam
      - elections-1968-chicago
      - mississippi
      c: 'McCarthy in New York: Humphrey''s free elections "unrealistic"; a coalition government with the NLF, negotiated, before any election. For the Loyal Democrats of Mississippi''s challenge to the regular delegation: the test in Chicago, Aug. 25. With the city''s political leaders.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2107–08. Names: McCarthy, Humphrey.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - state:ms
      - city:nyc
- add:
    entry:
      id: cal.1968-07-31.draft
      when: July 31
      date: '1968-07-31'
      thread: draft
      also:
      - elections-1968
      c: Hershey's speech, taken by some reporters for an endorsement of Wallace; he denies endorsing anyone.
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2106. Names: Hershey, Wallace.'
      tags:
      - name:hershey-lewis-b
      - name:wallace-george-c
- add:
    entry:
      id: cal.1968-07-31.foreign-aid
      when: July 31
      date: '1968-07-31'
      thread: foreign-aid
      c: 'The Senate''s amendments to the foreign aid bill, H.R. 15263, before passage. Taken: Javits''s National Foreign Assistance Review Committee; Morse''s, the $10 million for Latin American coastal patrols against Cuba struck; Dominick''s, no gold for the dollars of a country 90 days in arrears, 42–33; Fannin and Murphy''s, $122 million in carryover funds held until $90,965,000 for impacted schools is released, 37–36; Monroney''s, $5 million from military aid to the United Nations development program. Refused: Moss, Mondale and Cooper''s $50 million for farm supplies, 16–61; Javits''s surveys of investment, 12–65; Morse''s cut of $20 million in the Alliance for Progress, 31–43; Clark''s restorations, $317,575,000, 13–62; Jack Miller''s, tabled, 61–13.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2114. Check: the roll calls on Voteview. Names: Javits, Morse, Dominick, Fannin, Murphy, Monroney, Moss, Mondale, Cooper, Clark, Miller.'
      tags:
      - name:javits-jacob-k
      - name:morse-wayne
      - name:dominick-peter-h
      - name:fannin-paul-j
      - name:murphy-george
      - name:monroney-almer-s
      - name:moss-frank-e
      - name:mondale-walter-f
      - name:cooper-john-sherman
      - name:clark-joseph-s
      - name:miller-jack-r
- add:
    entry:
      id: cal.1968-07-31.vietnam-paris
      when: July 31
      date: '1968-07-31'
      thread: vietnam-paris
      c: 'Paris, the fifteenth meeting: Hanoi''s delegates call Rusk''s conditions of July 30 for a halt in the bombing an "extremely absurd demand."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2119. Names: Rusk.'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-07-31.civil-rights-the-executive
      when: July 31
      date: '1968-07-31'
      thread: civil-rights-the-executive
      also:
      - poverty
      c: 'Johnson on the report of the Census Bureau and the Bureau of Labor Statistics on the condition of Negroes, presented at the Cabinet: the gap narrowing; the average Negro family''s income 59 percent of the white family''s.'
      n: 'Statement by the President Following the Presentation at a Cabinet Meeting of a Report on the Social and Economic Conditions of American Negroes, [1968–69 Pub. Papers 854](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=164) (July 31, 1968). [[w.cq-weekly-report]], Aug. 9, 1968, 2125. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-07-31.congress
      when: July 31
      date: '1968-07-31'
      thread: congress
      c: 'Cleared: S. 2060, $500,000 a year for five more years, to June 30, 1974, for grants to collect and publish the documents of American history. The House passes it by voice vote; the Senate, May 3.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116.'
- add:
    entry:
      id: cal.1968-08-01.elections-1968-miami
      when: Aug. 1
      date: '1968-08-01'
      thread: elections-1968-miami
      also:
      - vietnam
      c: 'Miami Beach. The Platform Committee''s last open session, Dirksen presiding. Romney: North and South Vietnam, Laos and Cambodia neutralized under guarantee; the NLF''s members in South Vietnam''s politics. Samuel C. Jackson: a unit of the National Committee to make the delegations "fully representative of the black population of each state." Jack McDonald, Young Republicans: a youth plank, the vote at 18, a volunteer army. Executive session from the afternoon; Dirksen: its suite searched for eavesdropping devices.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Dirksen, Romney, Jackson.'
      tags:
      - name:dirksen-everett
      - name:romney-george-w
      - name:jackson-samuel-c
      - state:fl
- add:
    entry:
      id: cal.1968-08-01.elections-1968-miami-2
      when: Aug. 1
      date: '1968-08-01'
      thread: elections-1968-miami
      also:
      - vietnam
      c: 'Nixon''s statement on Vietnam for the Platform Committee, released by Klein, 9:37 a.m., his first major statement on the war since the Paris talks began: "a new strategy," on "the economic, political, diplomatic and psychological fronts," not further escalation; small units, the Viet Cong''s infrastructure, police, intelligence, local forces; "more effectively with fewer men and at less cost."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Nixon, Klein.'
      tags:
      - name:nixon-richard-m
      - name:klein-herbert-g
- add:
    entry:
      id: cal.1968-08-01.elections-1968-miami-3
      when: Aug. 1
      date: '1968-08-01'
      thread: elections-1968-miami
      also:
      - cities-and-housing
      c: 'Nixon''s statement on the cities, released by Klein, 2:46 p.m.: federal tax and credit incentives for private enterprise to rebuild the inner cities; jobs; aid to Negro enterprises; "more black ownership, more black control over the destinies of black people."'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Nixon, Klein.'
      tags:
      - name:nixon-richard-m
      - name:klein-herbert-g
- add:
    entry:
      id: cal.1968-08-01.opinion
      when: Aug. 1
      date: '1968-08-01'
      thread: opinion
      also:
      - elections-1968-polls
      c: 'Harris, July 25–29, in the morning papers, released early (UPI): Humphrey 41 percent, Nixon 36, Wallace 16; Rockefeller 40, Humphrey 34, Wallace 20; McCarthy 43, Nixon 35, Wallace 15; Rockefeller 40, McCarthy 34, Wallace 19.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102, 2107. Check: CQ''s Scoreboard heads it July 29, its release date by CQ''s note (2107); the chronology, released Aug. 1 (2102). Names: Humphrey, Nixon, Wallace, Rockefeller, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:nixon-richard-m
      - name:wallace-george-c
      - name:rockefeller-nelson
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-01.opinion-2
      when: Aug. 1
      date: '1968-08-01'
      thread: opinion
      also:
      - elections-1968-polls
      c: 'New York. Gallup and Harris, a joint statement: no disparity in their polls. Rockefeller "has now moved to an open lead over both possible Democratic candidates"; Nixon against Humphrey and Wallace, close. From Harris, July 13–16; Gallup, July 20–23; Crossley, for Rockefeller, July 21–26; Harris, July 25–29.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2102. Names: Gallup, Harris, Rockefeller, Nixon, Humphrey, Wallace.'
      tags:
      - name:gallup-george-h
      - name:harris-louis
      - name:rockefeller-nelson
      - name:nixon-richard-m
      - name:humphrey-hubert-h
      - name:wallace-george-c
      - city:nyc
- add:
    entry:
      id: cal.1968-08-01.transportation
      when: Aug. 1
      date: '1968-08-01'
      thread: transportation
      c: 'Cleared: the Transportation Department''s appropriation for fiscal 1969, H.R. 18188, $1,634,266,000 in new authority, $297,766,000 under the request. 2,629 new posts in the FAA, 2,399 for air traffic control, exempt from the surcharge act''s cut in employment. Nothing for the SST in fiscal 1969; $30 million rescinded. Both houses take the conference report by voice vote.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2112, 2114.'
- add:
    entry:
      id: cal.1968-08-01.transportation-2
      when: Aug. 1
      date: '1968-08-01'
      thread: transportation
      c: 'House Government Operations'' Subcommittee on Government Activities, Brooks, on air traffic congestion. Thomas, the FAA''s acting administrator: the worst in the "Golden Triangle," New York, Washington and Chicago. Crooker, the CAB: the Board might divert flights. Kenneth T. Lyons, for the controllers'' union: five near-misses a day at National Airport. Brooks: the government will act if the industry does not.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2117. Names: Brooks, Thomas, Crooker.'
      tags:
      - name:brooks-jack-b
      - name:thomas-david-d
      - name:crooker-john-h-jr
- add:
    entry:
      id: cal.1968-08-01.economy-surcharge
      when: Aug. 1
      date: '1968-08-01'
      thread: economy-surcharge
      c: 'The House adopts the conference report on H.R. 15387, 345–24: assault on a postal employee a federal crime; the postal field service exempt from the surcharge act''s cut in employment. Watson had said 83,238 jobs would go; his letter, read by Dulski: the cuts in service canceled "upon enactment." Ford for relief government-wide. The Senate adopted it July 30.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2116. Names: Watson, Dulski, Ford.'
