      c: 'The Rules Committee, closed: a mild rule against discrimination in choosing delegates. The National Committee''s members not to be delegates at large ex officio; an amendment for delegates by the States'' Republican Representatives narrowly lost. Guam two seats on the National Committee and three delegates from 1972; the State chairmen members of the National Committee.'
      n: '[[w.cq-weekly-report]], Aug. 9, 1968, 2142.'
