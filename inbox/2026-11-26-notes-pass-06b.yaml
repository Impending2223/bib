    after: end
    words: Other delegations in Moscow for the celebrations include Zhivkov, Kádár, Ulbricht, Gomułka and Tsedenbal as first secretaries, Maurer for Romania, Kim Il, Phạm Văn Đồng and Guevara; Albania sends none.
