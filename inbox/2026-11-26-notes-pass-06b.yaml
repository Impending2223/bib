    item: '[[w.peng-zhen-nianpu-1902]], IV, 367 (Oct. 29, 1964; Mao proposes at the Standing Committee that all twelve socialist states send delegations; Deng and Peng Zhen to go to Korea and tell Kim Il Sung)'
    on: 'propose that the twelve socialist states all send ... Zhou to tell Lin Biao.'
- add-words:
    id: cal.1964-11-05.china-leadership-5
    after: end
    words: Kang Sheng and Wu Xiuquan go with Zhou and He Long, in a delegation of fifty to sixty; Chen Yi does not. The Vietnamese delegation under Phạm Văn Đồng arrives on the same plane.
