- add-words:
    id: cal.1964-12-28.china-leadership
    after: end
    words: By Yang Jisheng's account Deng Xiaoping, taking it for a routine briefing, had told Mao he need not attend; by Chen Boda's later account Liu had cut in on Mao's speech the day before and talked on.
