- add-words:
    id: cal.1964-08-01.china-leadership
    after: end
    words: 'Liu: the movement a greater revolution than land reform, wider and deeper; leading cadres at every level to go to farms and factories and squat at points.'
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 597–598'
- add-words:
    id: cal.1964-08-01.china-leadership
    after: end
    words: 'In the historian Li Xin''s account the Politburo members and marshals in Peking are on the platform and Zhou leads Liu to the center; Liu paces, hands behind his back, tells them to learn from Wang Guangmei and go down, "whoever does not go down, drive him down."'
