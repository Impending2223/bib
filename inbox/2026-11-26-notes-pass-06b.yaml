- add-words:
    id: cal.1964-12-28.china-leadership
    after: end
    words: Of Liu's part, Mao tells Snow in Dec. 1970 that Liu opposed the "capitalist roader" point at the meeting; Hu Qiaomu says Liu only spoke of overlapping contradictions.
