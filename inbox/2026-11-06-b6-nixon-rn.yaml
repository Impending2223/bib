      when: Aug. 9
      date: '1968-08-09'
      thread: elections-1968-nixon
      also:
      - elections-1968-miami
      c: Romney to Nixon, a note, with his press release on the "vice presidency insurrection," by Romney's later letter.
      n: '[[w.nixon-rn]], 314 (Romney''s letter quoted). See [[cal.1968-08-08.elections-1968-miami]]. Names: Romney, Nixon.'
      tags:
      - name:romney-george-w
      - name:nixon-richard-m
