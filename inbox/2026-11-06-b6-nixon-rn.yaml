        - 'via x.1968-08.romney-to-nixon-after-the-convention: all'
- add:
    entry:
      id: cal.1968-11-06.elections-1968-4
      when: Nov. 6, the early hours
      date: '1968-11-06'
      thread: elections-1968
      c: 'New York, the Waldorf-Astoria, by Nixon''s account. Nixon, sure of Illinois, to Harlow: get O''Brien on the telephone:
        "Tell O''Brien to tell Hubert to quit playing games. We''ve won Illinois." Harlow reaches O''Brien''s suite; O''Brien
        not there, or will not take the call.'
      n: '[[w.nixon-rn]], 333. See [[cal.1968-11-05.elections-1968]]. Names: Nixon, Harlow, O''Brien, Humphrey.'
      tags:
      - name:nixon-richard-m
      - name:harlow-bryce-n
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      src:
        c: cc91d71b
        rows:
        - 'w.nixon-rn 333: all'
- add:
    entry:
      id: cal.1968-11-06.elections-1968-5
      when: Nov. 6, just before 3 a.m.
      date: '1968-11-06'
      thread: elections-1968
      time: 1968-11-06T08:00Z
      time_approx: true
      c: 'New York, the Waldorf-Astoria, by Nixon''s account. Nixon, sure of California, Illinois, Ohio and Missouri, reviews
        the totals with Finch, Chotiner, Mitchell and Haldeman: "Any objections?" None. He telephones Agnew and Rockefeller:
        victory a matter of time.'
      n: '[[w.nixon-rn]], 333 ("Just before 3 A.M."). See [[cal.1968-11-05.elections-1968]]. Check: the hours of the calls;
        White''s are given in [[cal.1968-11-06.elections-1968]]. Names: Nixon, Finch, Chotiner, Mitchell, Haldeman, Agnew,
        Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:finch-robert-h
      - name:chotiner-murray-m
      - name:mitchell-john-n
      - name:haldeman-h-r
      - name:agnew-spiro-t
      - name:rockefeller-nelson
      src:
        c: e3d719e5
        rows:
        - 'w.nixon-rn 333: all'
- add:
    entry:
      id: cal.1968-11-06.elections-1968-6
      when: Nov. 6, 8:30 a.m.
      date: '1968-11-06'
      thread: elections-1968
      also:
      - transition-and-staff
      time: 1968-11-06T13:30Z
      c: 'New York, the Waldorf-Astoria, by Nixon''s account. Chapin: ABC has projected Illinois for Nixon. Nixon to Mitchell:
        "we had better get down to Florida and get this thing planned out." Mitchell: "Mr. President, I think I''d better
        go up to be with Martha."'
      n: '[[w.nixon-rn]], 333–34. See [[cal.1968-11-05.elections-1968]]. Names: Nixon, Chapin, Mitchell.'
      tags:
      - name:nixon-richard-m
      - name:chapin-dwight-l
      - name:mitchell-john-n
      src:
        c: ff64afd1
        rows:
        - 'w.nixon-rn 333–34: all'
- add:
    entry:
      id: cal.1969-01-19.transition-and-staff-2
      when: Jan. 19, the evening
      date: '1969-01-19'
      thread: transition-and-staff
      c: Washington, the eve of the inauguration, by Nixon's account. Flown down from New York in the plane the President
        sent, Nixon spends the evening on the last touches to his inaugural address.
      n: '[[w.nixon-rn]], 362. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: 69b5627a
        rows:
        - 'w.nixon-rn 362: all'
- add:
    entry:
      id: cal.1969-01-19.transition-and-staff-3
      when: Jan. 19, about 8 p.m.
      date: '1969-01-19'
      thread: transition-and-staff
      time: 1969-01-20T01:00Z
      time_approx: true
      c: 'Eisenhower telephones Nixon from Walter Reed: "I want to wish you the best on what I am sure will be a great day
        tomorrow ... This is the last time that I can call you Dick. From now on it will always be Mr. President."'
      n: '[[w.nixon-rn]], 362 ("about eight o''clock"). See [[cal.1969-01-19.transition-and-staff-2]]. Names: Eisenhower,
        Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      src:
        c: f659e8f3
        rows:
        - 'w.nixon-rn 362: all'
