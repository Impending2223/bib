      when: Aug. 1–4, the last few days before the convention
      date: '1968-08-01'
      thread: elections-1968-nixon
      also:
      - elections-1968-miami
      c: Montauk Point, N.Y., by Nixon's account. Nixon works on his acceptance speech.
      n: '[[w.nixon-rn]], 309. The speech: [[cal.1968-08-08.elections-1968-miami]]. See [[cal.1968-08.elections-1968-miami-2]].
        Check: the days. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: 8cf3eca1
        rows:
        - 'w.nixon-rn 309: all'
