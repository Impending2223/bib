- add:
    entry:
      id: cal.1968-08.elections-1968-nixon
      when: Aug., a few days after the convention
      date: 1968-08
      thread: elections-1968-nixon
      c: 'Romney to Nixon, by letter, on the floor challenge to Agnew: "it was like a good big burp! It relieved the tension
        and united your support."'
      n: '[[w.nixon-rn]], 314 (the letter quoted). See [[cal.1968-08-09.elections-1968-nixon]]. Check: the day. Names: Romney,
        Nixon, Agnew.'
      tags:
      - name:romney-george-w
      - name:nixon-richard-m
      - name:agnew-spiro-t
      src:
        c: 99ad286d
        rows:
