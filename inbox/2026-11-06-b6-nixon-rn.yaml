patch: 2026-11-06-b6-nixon-rn
by: Claude (batch 6 reader, Nixon, RN)
ops:
- add:
    entry:
      id: cal.1961-01-20.transition-and-staff-2
      when: Jan. 20
      date: '1961-01-20'
      thread: transition-and-staff
      c: 'The F Street Club, after the inauguration. Admiral and Mrs. Lewis Strauss give a farewell luncheon for the Eisenhowers,
        the Nixons among the guests. Eisenhower to Nixon at parting: come up to Gettysburg "very soon."'
      n: '[[w.nixon-rn]], 227. Names: Strauss, Eisenhower, Nixon.'
      tags:
      - name:strauss-lewis-l
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      src:
        c: ab2b7bf1
        rows:
        - 'w.nixon-rn 227: all'
- add:
    entry:
      id: cal.1961-09-25.elections-1962
      when: Sept. 25
      date: '1961-09-25'
      thread: elections-1962
      c: 'Nixon''s house, after dinner, by Nixon''s account. Nixon to his wife and daughters: he is now thinking of running
        for governor. Pat Nixon against: "If you run this time, I''m not going to be out campaigning with you"; Tricia for.
        Upstairs he begins notes announcing he will not run; half an hour later his wife: "you must do whatever you think
        is right." He starts the notes again: he will run.'
      n: '[[w.nixon-rn]], 239–40. The announcement: [[cal.1961-09-27.elections-1962]]. See [[cal.1961-08.elections-1962]].
        Names: Nixon, Pat Nixon.'
      tags:
      - name:nixon-richard-m
      - name:nixon-pat
      src:
        c: af639b0d
        rows:
        - 'w.nixon-rn 239–40: all'
- add:
    entry:
      id: cal.1962-11.republican-party-4
      when: Nov., late, the Thanksgiving holidays
      date: 1962-11
      thread: republican-party
      c: Nassau, after some days in Miami with Rebozo, Nixon's wife and daughters joining them for Thanksgiving. Elmer Bobst,
        of Warner-Lambert, urges Nixon to leave California for New York. By Nixon's account, the move would rule him out for
        1964 and for any office in New York; his family for it.
      n: '[[w.nixon-rn]], 247–48. The move: [[cal.1963-05.republican-party-2]]. Check: the days. Names: Nixon, Rebozo.'
      tags:
      - name:nixon-richard-m
      - name:rebozo-charles-g
      src:
        c: a9c794b1
        rows:
        - 'w.nixon-rn 247–48: all'
- add:
    entry:
      id: cal.1963-07-01.republican-party
      when: July 1–2, one afternoon
      date: '1963-07-01'
      thread: republican-party
      also:
      - europe-and-the-alliance-kennedy-in-europe
      c: 'Rome, the Nixons'' hotel, by Nixon''s account. Kennedy, on his state visit, telephones Nixon, on a six-week tour
        from June 12: he had heard they were in Rome and wanted to say hello. Pleasantries; their last talk.'
      n: '[[w.nixon-rn]], 248, 250. See [[cal.1963-07-01.europe-and-the-alliance-kennedy-in-europe]]. Check: the day. Names:
        Kennedy, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
      src:
        c: 3835cae9
        rows:
        - 'w.nixon-rn 248, 250: all'
- add:
    entry:
      id: cal.1963-11-23.assassination-5
      when: Nov. 23
      date: '1963-11-23'
      thread: assassination
      also:
      - republican-party
      c: 'New York, written through the night, by Nixon''s account. Nixon to Jacqueline Kennedy, by letter: "While the hand
        of fate made Jack and me political opponents I always cherished the fact that we were personal friends from the time
        we came to the Congress together in 1947"; the nation "forever grateful for your service as First Lady."'
      n: '[[w.nixon-rn]], 253 (the letter printed, dated Nov. 23). Her reply: [[cal.1963-12.republican-party-2]]. Names: Nixon,
        Jacqueline Kennedy.'
      tags:
      - name:nixon-richard-m
      - name:kennedy-jacqueline
      src:
        c: 374e67ec
        rows:
        - 'w.nixon-rn 253: all'
        - 'via x.1963-11-23.nixon-to-jacqueline-kennedy: all'
- add:
    entry:
      id: cal.1963-12.republican-party-2
      when: Dec., a few weeks later
      date: 1963-12
      thread: republican-party
      also:
      - assassination
      c: 'Jacqueline Kennedy to Nixon, in her hand: "You two young men—colleagues in Congress—adversaries in 1960—and now
        look what has happened"; for him "all the question comes up again"; if it does not work out, "please be consoled by
        what you already have—your life and your family."'
      n: '[[w.nixon-rn]], 254–55 (the letter in facsimile). See [[cal.1963-11-23.assassination-5]]. Check: the day. Names:
        Jacqueline Kennedy, Nixon.'
      tags:
      - name:kennedy-jacqueline
      - name:nixon-richard-m
      src:
        c: 1774c49c
        rows:
        - 'w.nixon-rn 254–55: all'
        - 'via x.1963-12.jacqueline-kennedy-to-nixon: all'
- add:
    entry:
      id: cal.1964-08-12.elections-1964-goldwater
      when: Aug. 12
      date: '1964-08-12'
      thread: elections-1964-goldwater
      follows:
      - cal.1964-08-12.elections-1964
      c: 'The drive back from Hershey to Gettysburg, after the meeting, as Nixon heard later. Eisenhower: "before we had this
        meeting I thought that Goldwater was just stubborn. Now I am convinced that he is just plain dumb."'
      n: '[[w.nixon-rn]], 262 ("I learned later"; at second hand). See [[cal.1964-08-12.elections-1964]]. Names: Eisenhower,
        Goldwater.'
      tags:
      - name:eisenhower-dwight-d
      - name:goldwater-barry-m
      src:
        c: 6f2f4338
        rows:
        - 'w.nixon-rn 262: all'
- add:
    entry:
      id: cal.1965-01-09.republican-party
      when: Jan. 9
      date: '1965-01-09'
      thread: republican-party
      c: Nixon's study, after a family party for his fifty-second birthday, by Nixon's account. His "New Year's Resolutions
        for 1965," among them "Set great goals," "Begin writing book," "Articles or speeches on provocative new international
        and national issues." For the first time in seven years, he writes, he begins to think seriously of running for President
        again.
      n: '[[w.nixon-rn]], 265. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: 83302ffe
        rows:
        - 'w.nixon-rn 265: all'
- add:
    entry:
      id: cal.1966-11-08.elections-1966-4
      when: Nov. 8–9, election night
      date: '1966-11-08'
      thread: elections-1966
      c: 'New York, after the last returns, by Nixon''s account. A victory supper at El Morocco. His forecast of six months
        before: 40 House seats, 3 in the Senate, 6 governorships, 700 seats in the legislatures; the night''s, by his count,
        47, 3, 8 and 540.'
      n: '[[w.nixon-rn]], 277. See [[cal.1966-11-08.elections-1966]]. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: 6bd4c54d
        rows:
        - 'w.nixon-rn 277: all'
- add:
    entry:
      id: cal.1967-01-01.elections-1968-nixon
      when: Jan. 1
      date: '1967-01-01'
      thread: elections-1968-nixon
      c: Nixon's law firm merges with Caldwell, Trimble & Mitchell, municipal bond lawyers. Nixon and John Mitchell; within
        a few months, by Nixon's account, he turns to Mitchell for counsel on politics.
      n: '[[w.nixon-rn]], 279. Names: Nixon, Mitchell.'
      tags:
      - name:nixon-richard-m
      - name:mitchell-john-n
      src:
        c: 4d720781
        rows:
        - 'w.nixon-rn 279: all'
- add:
    entry:
      id: cal.1967-03.europe-and-the-alliance-2
      when: Mar.
      date: 1967-03
      thread: europe-and-the-alliance
      also:
      - elections-1968-nixon
      c: 'Rome, on Nixon''s trip from Mar. 5, by Nixon''s account. Saragat and Fanfani: the Soviets determined to keep the
        war in Vietnam going; the chief Communist threat in Europe. Fanfani: "NATO is what really counts." Brosio, NATO''s
        Secretary General: the Russians "cannot be trusted." A Belgian on détente: "It is like the Virgin Birth. I accept
        it, but I don''t believe it."'
      n: '[[w.nixon-rn]], 280–81. See [[cal.1967-03.europe-and-the-alliance]]. Check: the days. Names: Nixon, Saragat, Fanfani,
        Brosio.'
      tags:
      - name:nixon-richard-m
      - name:saragat-giuseppe
      - name:fanfani-amintore
      - name:brosio-manlio-g
      src:
        c: b6913b12
        rows:
        - 'w.nixon-rn 280–81: all'
- add:
    entry:
      id: cal.1967-03.europe-and-the-alliance-3
      when: Mar.
      date: 1967-03
      thread: europe-and-the-alliance
      c: Poland refuses Nixon a visa for his trip; Romania grants one, to Nixon's surprise.
      n: '[[w.nixon-rn]], 281. See [[cal.1967-03.europe-and-the-alliance]]. Check: the day. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: 55c8b44e
        rows:
        - 'w.nixon-rn 281: all'
- add:
    entry:
      id: cal.1967-04.japan
      when: Apr.
      date: 1967-04
      thread: japan
      also:
      - elections-1968-nixon
      c: 'Japan, on Nixon''s Asian trip, by Nixon''s account. Nixon with Satō, Kishi and other Japanese officials: the United
        States must stay in Asia and help defend South Vietnam; Japan''s leadership limited by the memory of the war; regional
        cooperation against the Communist challenge.'
      n: '[[w.nixon-rn]], 282. See [[cal.1967-04.china]]. Check: the day. Names: Nixon, Satō, Kishi.'
      tags:
      - name:nixon-richard-m
      - name:sato-eisaku
      - name:kishi-nobusuke
      src:
        c: e071895f
        rows:
        - 'w.nixon-rn 282: all'
- add:
    entry:
      id: cal.1967-06-24.elections-1968-nixon
      when: June 24
      date: '1967-06-24'
      thread: elections-1968-nixon
      c: Nixon back in New York from Africa and the Middle East, the last of his four trips of the year. By his account, the
        primaries now the only way to shed his "loser image."
      n: '[[w.nixon-rn]], 280, 285. See [[cal.1967-06.middle-east-six-day-war-aftermath]]. Names: Nixon.'
      tags:
      - name:nixon-richard-m
      src:
        c: cc025df3
        rows:
        - 'w.nixon-rn 280, 285: all'
- add:
    entry:
      id: cal.1968-04.elections-1968-nixon-2
      when: Apr., a few days after the 19th
      date: 1968-04
      thread: elections-1968-nixon
      c: 'Eisenhower to Nixon, by letter, on his speech to the editors: "superb"; the question-and-answer format "gives you
        opportunity for spontaneity, humor, and hard-hitting observations"; the refrain now "Of course, Nixon is well prepared
        for the presidency, now we must see if we can elect him."'
      n: '[[w.nixon-rn]], 302 (the letter quoted). See [[cal.1968-04-19.elections-1968]]. Check: the day. Names: Eisenhower,
        Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      src:
        c: 6471e3a5
        rows:
        - 'w.nixon-rn 302: all'
        - 'via x.1968-04.eisenhower-to-nixon-on-the-asne-speech: all'
- add:
