    text: 'Check: the day. [[w.drea-mcnamara-clifford-and-the-2011]], 61, has Rolling Thunder strike north of the 20th parallel for the first time on May 22 ([[cal.1965-05-22.vietnam-air-war-2]]); the tree, on [[w.staaveren-gradual-failure]], 137, has the first such strike called off for weather May 20 and flown May 22; Cosmas''s own note (366 n.16) cites the NMCC OPSUM of May 22.'
