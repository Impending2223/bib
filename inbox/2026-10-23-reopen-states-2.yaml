patch: reopen-states-2
by: Claude (the reopened-sources agent, States and cities, second run), Oct. 23, 2026
ops:
  - add:
      entry:
        id: cal.1960-01-29.state-and-city-finance-ky
        when: Jan. 29
        date: '1960-01-29'
        thread: state-and-city-finance
        c: 'Kentucky''s sales tax. The House passes HB 75 by committee substitute, 84–9: a 3 percent sales and use tax, the "Veterans'' Bonus Sales and Use Tax Law," and bonds for the veterans'' bonus.'
        n: 'Ky. *House Journal*, 1960, [218](https://archive.org/details/jhouseky1960v1/page/218/mode/1up) (the roll call); Ky. *Senate Journal*, 1960, [143](https://archive.org/details/jsencoky1960/page/143/mode/1up) (the bill as the House sent it, Article I), [xxxvi](https://archive.org/details/jsencoky1960/page/n1581/mode/1up) (the index: "Provides three per cent sales tax and sale of bonds to finance Veterans'' bonus"). 1960 Ky. Acts ch. 5, Art. I (the history of [KRS 139.200](https://apps.legislature.ky.gov/law/statutes/statute.aspx?id=58186)). Check: the day Combs approved it; the Journals do not record it.'
        tags: [state:ky]
  - add:
      entry:
        id: cal.1960-02-03.state-and-city-finance-ky
        when: Feb. 3
        date: '1960-02-03'
        thread: state-and-city-finance
        c: 'Kentucky. The Senate passes HB 75, the sales tax, 28–8.'
        n: 'Ky. *Senate Journal*, 1960, [205](https://archive.org/details/jsencoky1960/page/205/mode/1up); enrolled and signed by the presiding officers Feb. 4, and ordered delivered to the Governor: [213](https://archive.org/details/jsencoky1960/page/213/mode/1up); Ky. *House Journal*, 1960, [241](https://archive.org/details/jhouseky1960v1/page/241/mode/1up). See [[cal.1960-01-29.state-and-city-finance-ky]].'
        tags: [state:ky]
  - edit:
      id: cal.1966-05-09.legislatures-mn
      base: 76c1df72
      set:
        when: May 11
        date: '1966-05-11'
        c: 'Minnesota. Rolvaag vetoes S.F. 2, the special session''s reapportionment bill: "it does not provide a fair and adequate system of legislative districting."'
        n: '[Message of Governor Karl F. Rolvaag Vetoing Senate File 2, Extra Session, 1966 Legislature](https://www.leg.mn.gov/archive/vetoes/1966_sp1veto_SF2.pdf) (May 11, 1966); Minn. Legis. Ref. Library, [Bills Vetoed, 1966](https://www.lrl.mn.gov/vetoes/vetodetails.aspx?year=1966). Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993). Check: the session''s call (it met Apr. 25: the message). See [[cal.1966-01-14.legislatures-mn]]. Names: Rolvaag.'
  - edit:
      id: cal.1966-05-24.legislatures-mn
      base: 9f9c520f
      set:
        when: May 20
        date: '1966-05-20'
        c: 'Minnesota. Rolvaag approves S.F. 6, the special session''s third reapportionment bill: 67 legislative districts, 67 senators, 135 representatives.'
        n: '[Minn. Laws 1966, Ex. Sess., ch. 1](https://www.revisor.mn.gov/laws/1966/1/Session+Law/Chapter/1/pdf/), §§ 1–2; "Approved May 20, 1966," [36](https://www.revisor.mn.gov/laws/1966/1/Session+Law/Chapter/1/pdf/#page=24). Nelson, ["Legislative Redistricting, 1959–1993"](https://www.mnhs.org/mnopedia/search/index/event/legislative-redistricting-1959-1993), gives May 24. See [[cal.1966-01-14.legislatures-mn]]. Names: Rolvaag.'
  - add:
      entry:
        id: cal.1962-08-14.governors-ak
        when: Aug. 14
        date: '1962-08-14'
        thread: governors
        also: [elections-1962]
        c: 'Alaska''s primary, every party on one ballot. Democratic, for governor: Governor Egan 13,698, 62.3 percent of the party''s vote; Byer 5,275, 24.0; two others 13.7. Republican: Stepovich 6,415, 38.1; Pollock 5,247, 31.2; three others 30.7.'
        n: 'Votes: [Alaska, *Official Returns, Primary Election (August 14, 1962)*, 6](https://www.elections.alaska.gov/Core/Archive/62PRIM/62prim.pdf#page=7) (statewide totals; persons voting 41,140). [[w.naske-alaska]]. Names: Egan. Check: whether Stepovich is Mike Stepovich, governor of the Territory, and Pollock Howard W. Pollock.'
        tags: [state:ak, name:egan-william-a]
  - add:
      entry:
        id: cal.1966-08-23.governors-ak
        when: Aug. 23
        date: '1966-08-23'
        thread: governors
        also: [elections-1966]
        c: 'Alaska''s primary. Democratic, for governor: Governor Egan 19,801, 61.0 percent of the party''s vote; Kay 12,660, 39.0. Republican: Hickel 10,580, 55.3; Kendall 4,511, 23.6; Stepovich 4,039, 21.1.'
        n: 'Votes: [Alaska, *Official Returns by Election Precinct, Primary Election (August 23, 1966)*, 6](https://www.elections.alaska.gov/Core/Archive/66PRIM/66prim.pdf#page=8) (statewide totals; persons voting 53,667). [[w.naske-alaska]]. See [[cal.1962-08-14.governors-ak]]. Names: Egan, Hickel. Check: whether Stepovich is Mike Stepovich.'
        tags: [state:ak, name:egan-william-a, name:hickel-walter-j]
  - edit:
      id: cal.1966-11-08.governors-ak
      base: a6344606
      set:
        n: 'Votes: [Alaska, *Official Returns by Election Precinct, General Election, November 8, 1966*, 6](https://www.elections.alaska.gov/Core/Archive/66GENR/66genr.pdf#page=8) (statewide totals: Egan and Wade 32,065, Hickel and Miller 33,145, Grasse and Saupe 1,084; persons voting 67,361), and [Wikipedia, "1966 Alaska gubernatorial election"](https://en.wikipedia.org/wiki/1966_Alaska_gubernatorial_election), alike. [[w.naske-alaska]]. See [[cal.1966-08-23.governors-ak]]. Names: Hickel, Egan.'
  - edit:
      id: cal.1968-08-27.elections-1968-ak
      base: 31a5e77d
      set:
        n: 'Votes: [Alaska, *Official Returns by Election Precincts, Primary Election, August 27, 1968*, 7](https://www.elections.alaska.gov/Core/Archive/68PRIM/68prim.pdf#page=6) (statewide totals; persons voting 54,589), and [Wikipedia, "1968 United States Senate election in Alaska"](https://en.wikipedia.org/wiki/1968_United_States_Senate_election_in_Alaska), alike. [[w.gruening-many-battles]]; [[w.gravel-political-odyssey]]; [[w.naske-alaska]]. See [[cal.1966-11-08.governors-ak]]. Names: Gravel, Gruening, Rasmuson, Stevens.'
