patch: 2026-11-24-nyt-1960-07-06
by: 'Claude (reader, New York Times, July 6, 1960, from the owner''s screenshots of Nov. 23, Drive folder "1970-07-06", the paper''s own date July 6, 1960; inventory notes/nyt/1960-07-06.md), Nov. 24, 2026'
ops:
- primary:
    id: cal.1960-07-05.elections-1960
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 18 (John D. Morris, "Johnson Enters Race Officially; Sees 500 Votes," Washington, July 5: the New Senate Office Building''s auditorium, Rayburn there; a fifteen-minute statement, fifteen minutes of questions; more than 500 first-ballot votes, Kennedy fewer than 600; Rayburn to nominate him, Dodd and Inouye to second; the transcript, at 18; Truman, Independence, July 5: "I have no second choice")'
    units: '?'
- primary:
    id: cal.1960-07-05.china
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (Hong Kong, July 5: the Foreign Ministry''s announcement, by Hsinhua; Ghana the second African state to recognize Peking, after Guinea; page not shown)'
    units: '?'
- primary:
    id: cal.1960-06-28.specials
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Burdick Lead Grows," Bismarck, July 5, AP: unofficial, forty-six counties canvassed, Burdick 104,492, Davis 103,382, a lead of 1,110; the State Canvassing Board to certify by July 18)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-05.cuba
      when: July 5
      date: '1960-07-05'
      place: havana
      thread: cuba
      also: [oil]
      c: 'The United States'' note, delivered by Bonsal to the Cuban Foreign Ministry: the seizure of the Texaco and Esso refineries arbitrary, inequitable, without authority under Cuban law, contrary to Cuba''s commitments; "a violation of accepted standards of ethics and morality"; it asks the seizure rescinded. More than $50,000,000 owed the companies.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2 (William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," Washington, July 5; the text, at 2: Guevara''s reading of the Mineral Fuel Law of 1938 answered by Law Decree 1758 of Nov. 2, 1954). Names: Bonsal, Guevara.'
      tags: [name:bonsal-philip-w, name:guevara-ernesto]
- add:
    entry:
      id: cal.1960-07-05.cuba-2
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: cuba
      c: 'Agriculture halts new imports of Cuban sugar pending the President''s action under the new act. State: the National Advisory Committee on Inter-American Affairs to meet July 6 and 7, Dillon presiding; Cuba to head the agenda.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2 (Jorden, "U.S. Files Protest": the White House on the signing''s delay, pending a review; the committee''s members). Law: [[cal.1960-07-06.cuba-2]]. Names: Dillon.'
      tags: [name:dillon-c-douglas]
- add:
    entry:
      id: cal.1960-07-05.cuba-3
      when: July 5
      date: '1960-07-05'
      place: havana
      thread: cuba
      c: 'Miró Cardona, ambassador-designate to the United States, the revolution''s first Prime Minister, resigns by letter to Dorticós, the "ideological divergencies" past reconciling, and takes asylum in the Argentine Embassy, 7:35 a.m. The Foreign Ministry: he and three other ambassadors "removed."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3 (Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," "Former Premier Defects in Cuba," Havana, July 6: Piedra de la Concha, Pividal and García Mador the others; Rojas Santamarina in the embassy since June 28; "Once a Castro Backer," Man in the News). Names: Miró Cardona, Dorticós.'
      tags: [name:miro-cardona-jose, name:dorticos-torrado-osvaldo]
      time: 1960-07-05T12:35Z
      time_zone: America/Havana
- add:
    entry:
      id: cal.1960-07-05.cuba-4
      when: July 5
      date: '1960-07-05'
      place: london
      thread: cuba
      also: [europe-and-the-alliance-britain]
      c: 'The Foreign Office discloses Britain''s "strong" note on the seizure of Shell''s refinery, delivered by Fordham, the ambassador: "deepest concern and displeasure"; the refinery to be restored "on a normal footing." No reply. In the Lords, Morrison of Lambeth asks of force; Lansdowne declines to answer.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (Walter H. Waggoner, "Britain Protests Shell Plant Loss," London, July 5: Shell''s arrears from Cuba, $17,000,000; page not shown). Check: the note''s day.'
      tags: [ok:name-untagged]
- add:
    entry:
      id: cal.1960-07-05.soviet-union
      when: July 5
      date: '1960-07-05'
      thread: soviet-union
      c: 'Khrushchev, at the Kaprun dam, to correspondents: "Life is short ... I want to see the Red Flag fly over the whole world in my lifetime." By Bad Gastein to Villach.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 15 (M. S. Handler, "Khrushchev Looks to Reds'' Triumph," "Khrushchev Sees Reds Triumphing," the dateline printed "Villach, Austria, June 5," for July 5: Furtseva with him; the *Salzburger Nachrichten*''s charge). Names: Khrushchev.'
      tags: [name:khrushchev-nikita-s, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.testing
      when: July 5
      date: '1960-07-05'
      place: geneva
      thread: testing
      c: 'Geneva, the test-ban talks'' 224th session. Tsarapkin accepts Wright''s plan of July 1 for the control organization: a directorate of six, the chief administrator and his principal deputy neutrals, two from each side. Wadsworth: sympathetic, approval within days.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 6 ("Minor Gains Made at Test-Ban Talks," Geneva, July 5; Thomas J. Hamilton, "U.S. Said to Drop Plan for Session of U.N. Arms Body," United Nations, July 5, at 1, 6). Names: Tsarapkin, Wadsworth.'
      tags: [ok:name-untagged]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      also: [medicare]
      c: 'Los Angeles. The Platform Committee opens four days of hearings, Bowles in the chair. Annis, for the American Medical Association, against medical care through Social Security; the plank "socialism." Butler: the convention not rigged.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 20 (Leo Egan, "Democrats Hear Ideas for Planks," at 20: Carey of the AFL-CIO; Sweetland; Bishop Gerald Kennedy for the National Council of Churches; W. H. Lawrence, "Democratic Hopefuls Face Early Test on Voting Rule," at 1, 20; Claude Sitton, "Democratic Unity Is Thought Likely," at 20: Butler''s news conference; Connor elected national committeeman). Names: Bowles, Annis, Butler.'
      tags: [name:bowles-chester, name:annis-edward-r, ok:name-untagged, ok:fields-time]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nixon
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: elections-1960-nixon
      also: [white-house]
      c: Nixon with Eisenhower, the morning, more than an hour, after Anderson; Republican politics only, by Hagerty. Eisenhower signs a batch of secondary bills; to Newport Thursday; to Chicago July 26 to address the convention.
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Nixon in Long White House Visit Talks Politics With Eisenhower," Washington, July 5: Hagerty on Truman''s charge, no comment; the news conference set for July 6; page not shown). Names: Nixon, Eisenhower, Anderson, Hagerty.'
      tags: [name:nixon-richard-m, name:eisenhower-dwight-d, name:anderson-robert-b, name:hagerty-james-c]
      time_band: morning
      time_range:
        - 1960-07-05T12:00Z
        - 1960-07-05T15:59Z
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nixon-2
      when: July 5
      date: '1960-07-05'
      thread: elections-1960-nixon
      c: 'Nixon, by telegram to Bernard Abrams, national commander of the Jewish War Veterans, repudiates the support George Lincoln Rockwell, of the American Nazi party, reportedly voiced for him: "I completely repudiate him and the evil he represents."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Nixon Hits Rockwell," Washington, July 5, AP; page not shown). Names: Nixon.'
      tags: [name:nixon-richard-m, ok:name-untagged, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.voting-rights
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: voting-rights
      c: 'Eisenhower signs the Stella, Mo., school bill, the vehicle of the Senate''s civil rights debate: the district pays $1,500 for the use of the Fort Crowder barracks.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Stella Bill Signed," Washington, July 5, AP; page not shown). To check: the act''s Statutes at Large cite. See [[cal.1960-02-15.voting-rights]]. Names: Eisenhower.'
      tags: [name:eisenhower-dwight-d, state:mo]
- add:
    entry:
      id: cal.1960-07-05.desegregation-schools
      when: July 5
      date: '1960-07-05'
      thread: desegregation-schools
      c: 'Davis, after meeting Gremillion and the Orleans Parish School Board: New Orleans'' schools "will continue to operate on a segregated basis," despite Judge Wright''s order of May to integrate the first grades in September.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Gov. Davis Is Firm," Baton Rouge, July 5, AP; page not shown). Names: Davis.'
      tags: [name:davis-jimmie-h, state:la, city:baton-rouge, ok:name-untagged, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-nomination
      when: July 5
      date: '1960-07-05'
      place: nyc
      thread: elections-1960-nomination
      c: 'Wagner, chairman of the New York delegation, at a City Hall news conference: the delegation not rigged, no unit rule; he would "like to see young men get a chance." Some thirty for Stevenson picket City Hall.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("Wagner Denies State Delegation Is Rigged to Favor Kennedy": more than 100 of the 114 votes said to be Kennedy''s; Ira Lesser leading the pickets; page not shown). See [[cal.1960-07-02.elections-1960-2]]. Names: Wagner, Truman, Stevenson.'
      tags: [name:wagner-robert-f-jr, name:truman-harry-s, name:stevenson-adlai-e]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-rockefeller
      when: July 5
      date: '1960-07-05'
      place: san-francisco
      thread: elections-1960-rockefeller
      c: William M. Brinton, leader of California's pro-Rockefeller forces, announces a national campaign to draft Rockefeller, from July 6, in at least nineteen other States.
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20 ("Drive for Rockefeller Set," San Francisco, July 5, AP: "tonight"). Names: Rockefeller.'
      tags: [name:rockefeller-nelson, ok:name-untagged, ok:fields-time]
- add:
    entry:
      id: cal.1960-07-05.soviet-union-u2
      when: July 5
      date: '1960-07-05'
      place: london
      thread: soviet-union-u2
      also: [europe-and-the-alliance-britain]
      c: 'Macmillan, in the Commons, on Noel-Baker''s question: no American U-2 flights from British bases without his knowledge; declines to say whether any were approved or made.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) ("U-2 an Issue in Britain," London, July 5, AP: a report to a Senate committee of flights from Lakenheath; page not shown). To check: Hansard, H.C. Deb., July 5, 1960. Names: Macmillan.'
      tags: [name:macmillan-harold, ok:name-untagged]
- add:
    entry:
      id: cal.1960-07-05.europe-and-the-alliance-france
      when: July 5
      date: '1960-07-05'
      thread: europe-and-the-alliance-france
      c: 'Abbas, by the Tunis and Moroccan radios, after the communique of July 4: "Sooner or later real negotiation will impose itself"; the war can still be long; the talks at Melun "positive."'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (Thomas F. Brady, "Algerian Deems Talks Inevitable," Tunis, July 5: "tonight," recorded at his villa; page not shown). Names: Abbas.'
      tags: [name:abbas-ferhat, ok:fields-time, ok:fields-place]
- add:
    entry:
      id: cal.1960-07-05.cyprus
      when: July 5
      date: '1960-07-05'
      place: nicosia
      thread: cyprus
      c: 'Cyprus''s Council of Ministers sets the elections: the House of Representatives July 31, the Greek and Turkish Communal Chambers Aug. 7. AKEL promised five of the thirty-five Greek seats. Britain to keep two bases, ninety-nine square miles.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (Lawrence Fellows, "Cyprus Will Vote July 31 and Aug. 7," Nicosia, July 5; "Britain Keeps 99 Miles," London, July 5, AP; page not shown). Names: Makarios.'
      tags: [name:makarios-iii]
- add:
    entry:
      id: cal.1960-07-05.europe-and-the-alliance-britain
      when: July 5
      date: '1960-07-05'
      place: london
      thread: europe-and-the-alliance-britain
      also: [european-community]
      c: 'Maudling, President of the Board of Trade, to the Conservative House of Commons committees: no move to join the Common Market; wait and see, build up the Free Trade Association.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html) (Drew Middleton, "Maudling Wary on European Tie," London, July 5: "tonight"; page not shown). Names: Maudling.'
      tags: [name:maudling-reginald, ok:fields-time]
- add:
    entry:
      id: cal.1960-07-05.foreign-aid
      when: July 5
      date: '1960-07-05'
      place: bonn
      thread: foreign-aid
      also: [europe-and-the-alliance-federal-republic]
      c: 'Bonn, the Development Assistance Group''s meeting opens, van Scherpenberg in the chair. Upton, Assistant Secretary of the Treasury: West Germany not pulling its weight in aid; Britain, Canada and France agree.'
      n: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 8 (Sydney Gruson, "Bonn Called Lax on Aid Programs," Bonn, July 5: Bonn''s five-year $500,000,000 plan; the meeting through Thursday).'
      tags: [ok:name-untagged]
