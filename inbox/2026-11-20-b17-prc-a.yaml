        c: 'Mao to Sihanouk, per the Chinese record: Hồ Chí Minh sends greetings, would invite him to visit the DRV, and asks that Cambodia and the DRV establish diplomatic relations.'
        n: '"[Memorandum of Chairman Mao''s Conversation with Sihanouk on 17 December 1960](https://digitalarchive.umd.edu/document/120870)" (Dec. 17, 1960), PRC FMA 106-00274-01, 1–7, trans. Jake Tompkins, Wilson Center Digital Archive. The words: 5:00 p.m., the reception''s start (1). See [[cal.1960-12-17.china-leadership]]. Names: Mao Zedong, Sihanouk, Hồ Chí Minh. Check: the year the Archive posted it.'
