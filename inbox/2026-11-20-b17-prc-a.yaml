        c: 'Sihanouk to Mao, per the Chinese record: Cambodia keeps no diplomatic relations with a divided country; consulates, as in New Delhi, instead. He cannot visit the DRV now; he returns to Phnom Penh Dec. 26.'
        n: '"[Memorandum of Chairman Mao''s Conversation with Sihanouk on 17 December 1960](https://digitalarchive.umd.edu/document/120870)" (Dec. 17, 1960), PRC FMA 106-00274-01, 1–7, trans. Jake Tompkins, Wilson Center Digital Archive. See [[cal.1960-12-17.china-leadership]]. Names: Mao Zedong, Sihanouk. Check: the year the Archive posted it.'
