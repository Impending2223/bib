        c: 'A PRC summary of the 1963 trade negotiations with the DPRK and the DRV, the author not named in the Archive''s text: both were held earlier than in other years, with the DPRK''s Ri Ju Yon in Peking at the end of October and the DRV''s delegation at the end of November, and each ended in signed treaties and protocols. By its account China met most requests under Zhou Enlai''s instructions, supplying key materials such as coal and covering trade gaps with loans of 10 million rubles. It counts the long-term agreement with the DPRK a blow to revisionism and draws lessons: take the initiative, prepare early, keep to the Center''s policy while reckoning costs.'
        n: '"[Summary of Trade Negotiations with Korea and Vietnam for 1963](https://digitalarchive.umd.edu/document/121759)" (Jan. 30, 1963), PRC FMA 106-01008-18, 48–53, trans. Jeffrey Wang and Charles Kraus, Wilson Center Digital Archive. See [[cal.1962-11-05.china-leadership-3]]; [[cal.1962-12-05.china-leadership-2]]. Names: Zhou Enlai. Check: the year the Archive posted it.'
