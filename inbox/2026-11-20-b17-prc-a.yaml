  - add:
      entry:
        id: cal.1964-01-30.vietnam-diplomacy
        when: Jan. 30
        date: '1964-01-30'
        thread: vietnam-diplomacy
        also:
        - china
        - vietnam-hanoi
        c: 'The Chinese Embassy in Vietnam to the Foreign Cultural Liaison Committee, expedited: at the embassy''s dinner for musicians visiting China, Ninh Văn Phan of the Vietnamese cultural liaison committee tells the chargé Du that its director, Phạm Ngọc Thạch, will go to the Soviet Union in February on the 1964 cultural plan and stop at Peking on the way back for the supplementary plan. The plan, five or six times last year''s, awaits Phạm Hùng, and the DRV, Ninh says, will mainly learn from China and keep only ceremonial contacts with Eastern Europe, whose culture he calls full of revisionism.'
        n: '"[Cable from the Chinese Embassy in Vietnam, ''Phạm Ngọc Thạch Will Visit the Soviet Union and China to Discuss Cultural Cooperation''](https://digitalarchive.umd.edu/document/120604)" (Jan. 30, 1964), PRC FMA 106-01174-04, trans. Qingfei Yin, Wilson Center Digital Archive. Check: the Archive''s English calls Phạm Hùng "Prime Minister"; the Chinese text, 范雄副总理, has vice premier. Check: the year the Archive posted it.'
