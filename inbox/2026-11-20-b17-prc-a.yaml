  - edit:
      id: cal.1965-06-15.china-leadership-2
      base: 49d2aab5
      set:
        c: Zhou, Hangzhou, talks with Hồ Chí Minh and tells him how the second Asian-African conference stands. Per the Chinese record, with Chen Yi present, Zhou tells Hồ the Standing Committee has decided against inviting the Saigon or Seoul regimes or Tshombe, Algeria having told the Front's representative the same of Saigon, and the Front's own invitation undecided. He argues against Soviet and "Malaysian" attendance, the Soviet Union being no Asian or African state and its Asian republics at most observers, and sets out three formulas for Laos. He asks that Phạm Văn Đồng give a vivid speech for the Viet Cong and Nguyễn Văn Hiếu work outside the hall; Hồ asks what if the states divide, and Zhou says the Jakarta rule of consensus governs, India's proposal of a majority vote not accepted.
        n: '"[Record of Conversation between Premier Zhou Enlai and Chairman Ho Chi Minh](https://digitalarchive.umd.edu/document/165383)" (June 15, 1965), PRC FMA 106-00861-02, 11–22, trans. Stephen Mercado, Wilson Center Digital Archive. [[w.zhou-enlai-nianpu-1949]], II, 737 (June 15, 1965); [[w.zhou-enlai-waijiao-huodong]], 462 (June 15, 1965; Hangzhou, talks with Chairman Hồ Chí Minh on the Asian–African conference question). Made public: 1993. The record is the International Liaison Department''s file (65) no. 159; its note says the embassy in Vietnam sent it and the department received it July 18. Names: Zhou Enlai, Hồ Chí Minh.'
        src:
          c: c4139e30
          rows:
