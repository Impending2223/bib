  - edit:
      id: cal.1962-09-30.china-leadership-4
      base: 3372d0f3
      set:
        c: Peking. Zhou Enlai receives the delegation of the National Liberation Front of South Vietnam, headed by Nguyễn Văn Hiếu. Per the Chinese record, with Liao Chengzhi present and Ambassador Trần Tử Bình with the delegation, Zhou asks of its route, Indonesia, then Fuzhou, Guangzhou and Shanghai, and says China's delegation at the Moscow disarmament conference kept a low profile and let the document's tone fall too low. He asks whether a committee to support the Front should be formed or the Afro-Asian People's Solidarity Organization and the Chinese peace committee used, offers medicines, and proposes also tendering donations to Ngô Đình Diệm through the Red Cross, to be refused and passed on to the Front. Nguyễn Văn Hiếu says China needs no new body.
        n: '"[Record of Talks from the Premier''s Meeting with the Delegation of the National Front for the Liberation of Southern Vietnam](https://digitalarchive.umd.edu/document/165384)" (Sept. 30, 1962), PRC FMA 106-00995-02, trans. Stephen Mercado, Wilson Center Digital Archive. [[w.zhou-enlai-waijiao-huodong]], 336 (Sept. 30, 1962; 下午). The time is "afternoon" (the record); the covering note of Oct. 11, 1962 forwards it. Names: Zhou Enlai.'
