  - add:
      entry:
        id: cal.1964-01-14.china
        when: Jan. 14
        date: '1964-01-14'
        thread: china
        also:
        - vietnam-diplomacy
        c: 'The Foreign Cultural Liaison Committee to the embassy''s cultural office in Vietnam, secret, in answer to Counselor Du''s query on the year''s priorities: more cultural cooperation with the DRV, on a larger scale than before, because it stands at the front against imperialism and resists Soviet pressure. It also asks help in the DRV''s self-reliance in culture, work among the leading figures of culture, especially the left, Vietnamese plays and writings recommended for China, and reports on the struggle with revisionism.'
        n: '"[Cable from the Foreign Cultural Liaison Committee, ''Preliminary Consideration on Policy to Vietnam in the Year 1964''](https://digitalarchive.umd.edu/document/120603)" (Jan. 14, 1964), PRC FMA 106-01174-03, trans. Qingfei Yin, Wilson Center Digital Archive. The words: 对外文委 (the Committee); 告64年对越南开展工作的初步考虑 (the title). The Archive notes the copies went to Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Chen Yi and others, printed Jan. 17. Names: Zhou Enlai. Check: the year the Archive posted it.'
        src:
