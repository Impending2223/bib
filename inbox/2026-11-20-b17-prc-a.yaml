        c: 'The Foreign Cultural Liaison Committee''s Foreign Visitors Office, in a top-secret briefing to the Party Center and others: the DRV''s Deputy Minister of Culture, Lê Kiêm, passing through Peking from Moscow, attends the National Day dinner and ceremony. He tells the Chinese that Vietnam is left in a difficult situation when the Chinese and Soviet parties differ, that the DRV has decided against showing the Soviet film Clear Sky publicly, and asks to borrow films China bought from capitalist states.'
        n: '"[Report from the Foreign Visitors Office of the Foreign Cultural Liaison Committee, ''The Two Major Parties of China and the Soviet Union Have Some Different Opinions, and Vietnam Faces Difficulties''](https://digitalarchive.umd.edu/document/120600)" (Oct. 4, 1961), PRC FMA 106-00661-01, trans. Qingfei Yin, Wilson Center Digital Archive. Check: the name Lê Kiêm as the Archive prints it. Check: the year the Archive posted it.'
