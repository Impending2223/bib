  - edit:
      id: cal.1963-06-03.china-leadership-3
      base: 73c5a8b8
      set:
        c: Zhou Enlai with Cambodia's Ambassador, Sirik Matak, on treating the Cambodian Queen further by Chinese medicine, internal and external, and Chinese and Western medicine combined. Per the Chinese record, Sirik Matak thanks China for Liu Shaoqi's visit to Cambodia and for the doctors, and asks that the cotton mill given as aid become an oil mill; Zhou says the foreign economic relations bureau will examine it. Zhou says Cambodia's guarding of the visit struck at the Chiang Kai-shek clique's sabotage plots; Sirik Matak says Chinese information helped crack the case and the suspects are still held.
        n: '"[Record of Conversation from Premier Zhou Enlai''s Reception of Ambassador to Cambodia Sisowath Sirik Matak](https://digitalarchive.umd.edu/document/165600)" (June 3, 1963), PRC FMA 106-00821-04, trans. Stephen Mercado, Wilson Center Digital Archive. [[w.zhou-enlai-nianpu-1949]], II, 558 (June 3, 1963); [[w.zhou-enlai-waijiao-huodong]], 361 (June 3, 1963; 下午2时, 中南海西花厅). Made public: 1993. Check: the ambassador''s name in Roman letters (西里克·马塔克). Names: Zhou Enlai.'
