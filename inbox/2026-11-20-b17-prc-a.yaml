        c: 'The Chinese Embassy in Vietnam to the Foreign Ministry, urgent: Lê Duẩn, Vice Premier Phạm Hùng and Vice Minister of Foreign Trade Lý Ban meet the Chinese shipping representative and experts at Haiphong, congratulate them on the nuclear test and give an informal dinner. Lê Duẩn says, per the cable, that the test encourages Vietnam''s struggle; that Khrushchev''s fall, credit for which goes to China and the Chinese party, is the first step in the fight against revisionism; and that he argued with Khrushchev in Moscow over why China could not have nuclear weapons.'
        n: '"[Cable from the Chinese Embassy in Vietnam, ''Reactions to China''s Testing of an Atomic Bomb (6)''](https://digitalarchive.umd.edu/document/134738)" (Oct. 20, 1964), PRC FMA 106-00778-02, 19–20, trans. Caixia Lu, Wilson Center Digital Archive. Names: Lê Duẩn, Khrushchev. Check: the day of the meeting; the cable is of the 20th. Check: the year the Archive posted it.'
