  - primary:
      id: cal.1960-12-20.china-leadership
      text: '"[Summary of Talks between Prime Minister Zhou Enlai and Norodom Sihanouk while Driving to Nanjing on December 20th](https://digitalarchive.umd.edu/document/120871)" (Dec. 29, 1960), PRC FMA 106-00274-03, 10–11, trans. Marian Rosenberg, Wilson Center Digital Archive.'
      units: B, C, D
  - variant:
      id: cal.1960-12-20.china-leadership
      unit: D
      witness: x.1960-12-29.zhou-sihanouk-train-talk-summary-prc-fma-106-00274-03
      reads: 'Zhou tells Sihanouk China''s statement of Dec. 19 backs the DRV''s proposal for a new Geneva Conference; Sihanouk says Cambodia will first state it will attend, and would have Thailand and South Vietnam invited; Zhou: then India and Burma too, Canada and Poland if wider, Cambodia to propose it, and Cambodia''s Foreign Ministry to hand the statement to Saigon'
      at: PRC FMA 106-00274-03, 10
  - variant:
      id: cal.1960-12-20.china-leadership
      unit: A
      witness: x.1960-12-29.zhou-sihanouk-train-talk-summary-prc-fma-106-00274-03
      reads: '"the special train to Nanjing"; the summary names neither Chen Yi nor the hour'
      at: PRC FMA 106-00274-03, 10
  - add:
      entry:
        id: cal.1960-11-23.vietnam-diplomacy
        when: Nov. 23
        date: '1960-11-23'
        thread: vietnam-diplomacy
        also:
        - laos
        - china-leadership
        c: 'The DRV Foreign Ministry gives the PRC a copy of the Vietnamese Workers'' Party Central Committee''s position on Sihanouk''s proposal to neutralize Cambodia and Laos, as the Chinese Foreign Ministry reports it: support for the proposal; caution on any union of the two states; strong opposition to American interference; a joint statement of the DRV, the USSR and China to go to Sihanouk before he visits the USSR. The Politburo has commissioned Phạm Văn Đồng to send an envoy to Moscow and Peking.'
        n: '"[Cable from the Chinese Foreign Ministry, ''Report on the Matter of the Proposal by the Central Committee of the Vietnamese Workers'' Party to Neutralize Cambodia and Laos by the Ministry of Foreign Affairs of the People''s Republic of China''](https://digitalarchive.umd.edu/document/120869)" (Nov. 26, 1960), PRC FMA 106-00553-04, 12–14, trans. Marian Rosenberg, Wilson Center Digital Archive. Names: Sihanouk, Phạm Văn Đồng. Check: the year the Archive posted it.'
        src:
          c: 3965e628
          rows:
          - 'https://digitalarchive.umd.edu/document/120869: all'
