        c: 'The DRV''s ambassador to China calls on Sihanouk, as Sihanouk tells Mao next day: the DRV has given the Lao Patriotic Front no aid and abides by the Geneva agreements; calling its acts in Laos interference is wrong. Sihanouk tells him that is good.'
        n: '"[Memorandum of Chairman Mao''s Conversation with Sihanouk on 17 December 1960](https://digitalarchive.umd.edu/document/120870)" (Dec. 17, 1960), PRC FMA 106-00274-01, 1–7, trans. Jake Tompkins, Wilson Center Digital Archive. The words: "last night" (Sihanouk, Dec. 17). See [[cal.1960-12-17.china-leadership]]. Names: Sihanouk. Check: the year the Archive posted it.'
