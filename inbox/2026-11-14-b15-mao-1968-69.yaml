patch: 2026-11-14-b15-mao-1968-69
by: 'Claude (batch 15, reader 5: *Mao Zedong nianpu 1949–1976*, VI, 1968–69, from the owner''s Drive epub of the 2013 set), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1968-01-06.china-leadership
      when: Jan. 6
      date: '1968-01-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads Yao Wenyuan''s drafts of the Xinhua report and the *Renmin ribao* and *Jiefangjun bao* editorial on the founding of Jiangxi''s revolutionary committee. Strikes from both the slogan that each of his sentences is truth, one worth ten thousand; notes that a few improper phrases are out. Both printed Jan. 7.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 6, 1968. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-01-16.china-leadership
      when: Jan. 16
      date: '1968-01-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: a Peking University history student writes of the 1932 "Wu Hao" notice, printed in Shanghai and Tianjin papers, in which Zhou Enlai (as Wu Hao) and others seemed to leave the Party. Mao''s note: long since settled, a Kuomintang slander.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 16, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the date the chronology gives is the reading, not the student''s letter; the *Guowen zhoubao*, *Shen bao* and *Shishi xinbao* notices of 1932 not seen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-04.china-leadership
      when: Feb. 4
      date: '1968-02-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai, Kang Sheng, Jiang Qing, Yang Chengwu and Xie Fuzhi send him the Railway Ministry''s military control commission on the stoppage of rail traffic in the Xuzhou area, with a proposal that the Jinan Military Region move mobile forces to close on the saboteurs from both sides along the line. Mao: fully agreed; back to Zhou, and tell Lin Biao. The Center, State Council, Military Commission and Cultural Revolution Group order of Feb. 6 follows.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 4, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kang Sheng, Jiang Qing, Xie Fuzhi, Lin Biao, Yang Chengwu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:kang-sheng
      - name:jiang-qing
      - name:xie-fuzhi
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-02-07.china-leadership
      when: Feb. 7
      date: '1968-02-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Mao with Ho Chi Minh, Peking (Great Hall of the People); Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing and Ye Qun present. On the war: the Americans cannot win; in the south go for more countryside and the enemy''s field forces, leave the big cities for later; he suggests organizing several field armies, each to fight three or four battles a year and destroy whole units. Offered as advice for the Vietnam Workers'' Party to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1968. Made public: 2013. Names: Mao Zedong, Ho Chi Minh, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Ye Qun. Check: the Vietnamese record.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:ho-chi-minh
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:ye-qun
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1968-03-07.china-leadership
      when: Mar. 7
      date: '1968-03-07'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'Mao, Peking: the Air Force''s report of Feb. 13 to the General Staff proposes that the aircraft given to Vietnam, used for a time in China, carry Mao quotations and cockpit badges like the Chinese. Mao: don''t; the effect would be bad; different countries, different ways. Back to Yang Chengwu.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 7, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Yang Chengwu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-17.china-leadership
      when: Mar. 17
      date: '1968-03-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Kang Sheng, Chen Boda, Jiang Qing and Yao Wenyuan report on answers to the New Zealand Communist Party''s general secretary, Wilcox (visited Mar. 1967; Nov. 1967 through the Australian CP (M-L)''s Hill): foreign propaganda too many adjectives, heedless of its audience, and charged with great-power chauvinism over Mao Zedong Thought. Mao: foreign and domestic propaganda to be reformed firmly and by steps; he has said so often.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 17, 1968. Made public: 2013. Names: Mao Zedong, Kang Sheng, Chen Boda, Jiang Qing, Yao Wenyuan, Wilcox, Hill (Australia).'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:kang-sheng
      - name:chen-boda
      - name:jiang-qing
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-22.china-leadership
      when: Mar. 22
      date: '1968-03-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: The Center, the State Council, the Military Commission and the Cultural Revolution Group order Yang Chengwu, Yu Lijin and Fu Chongbi removed from their posts; Huang Yongsheng chief of the General Staff, Wen Yucheng also commander of the Peking Garrison. Lin Biao announces the "errors" and the decision to officers of regiment level and above at the Great Hall, Mar. 24.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 22, 1968. Made public: 2013. Names: Lin Biao, Huang Yongsheng, Yang Chengwu, Yu Lijin, Fu Chongbi, Wen Yucheng. Check: the chronology''s note 2 (Lin Biao and Jiang Qing framing them; rehabilitated 1974, 1979) is the editors''.'
      tags:
      - polity:prc
      - name:lin-biao
      - name:huang-yongsheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-25.china-leadership
      when: Mar. 25
      date: '1968-03-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: approves Lin Biao''s new Military Commission Office Group: Huang Yongsheng head, Wu Faxian deputy, Ye Qun, Li Zuopeng, Qiu Huizuo. The same day he and Lin Biao receive more than 10,000 officers of regiment level and above at the Great Hall.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Mar.–31, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Huang Yongsheng, Wu Faxian, Ye Qun, Li Zuopeng, Qiu Huizuo.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:huang-yongsheng
      - name:wu-faxian
      - name:ye-qun
