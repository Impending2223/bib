    text: 'Check: Mao Zedong nianpu, VI, Dec. 19, 1968, gives the day, Dec. 19, and the senders, Mao, Lin Biao and Zhou Enlai, to Nguyen Huu Tho for the NLF''s eighth anniversary; see [[cal.1968-12-19.china-leadership]].'
