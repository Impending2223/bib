    entry:
      id: cal.1968-08-23.china-leadership
      when: Aug. 23
      date: '1968-08-23'
      thread: china-leadership
      also:
      - soviet-union
      - soviet-union-czechoslovakia
      c: At Mao's direction *Renmin ribao* prints a commentator's article condemning in strong terms the Soviet armed occupation of Czechoslovakia.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 23, 1968. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1968-08-25.china-leadership
      when: Aug. 25
      date: '1968-08-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Mao approves the Center, State Council, Military Commission and Cultural Revolution Group's notice on sending workers' propaganda teams into the schools, drafted by Yao Wenyuan. He adds that the workers drawn should be about a tenth of the local industrial workers, "or fewer". Issued the same day; teams follow in colleges and in middle and primary schools of counties and towns.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 25, 1968. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
