      when: Dec. 27
      date: '1968-12-27'
      thread: china-leadership
      also:
      - testing
      c: China explodes a new hydrogen bomb in the western part of the country.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 27, 1968. See [[cal.1968-12-27.china-leadership]]. Check: the Xinhua communique and the American detection.'
      tags:
      - polity:prc
