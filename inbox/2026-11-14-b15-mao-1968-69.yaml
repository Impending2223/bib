    entry:
      id: cal.1968-09-17.china-leadership
      when: Sept. 17
      date: '1968-09-17'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Lin Biao and Zhou Enlai reply by telegram to Hoxha and Shehu, who had congratulated China on the 29 revolutionary committees: China firmly supports Albania''s withdrawal from the Warsaw Pact and the peoples of Eastern Europe against the Soviet-controlled Pact, and of Western Europe against NATO.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 17, 1968. Names: Mao Zedong, Lin Biao, Zhou Enlai, Enver Hoxha, Mehmet Shehu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
