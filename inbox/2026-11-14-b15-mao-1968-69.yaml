      when: Jan. 3
      date: '1969-01-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads the Military Commission Office Group''s papers on Xu Xiangqian''s recent conduct; his note to Huang Yongsheng: all old comrades tied to the "February countercurrent", and their families, are not to be criticized; relations to be mended.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 3, 1969. Made public: 2013. Names: Mao Zedong, Xu Xiangqian, Huang Yongsheng.'
