      when: Sept. 29
      date: '1968-09-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the draft of Lin Biao''s speech for the National Day, sent by Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing. Mao strikes its last sentence on the workers'' teams in the schools, as the great feat of the history of communism since the 1848 Manifesto.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 29, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
