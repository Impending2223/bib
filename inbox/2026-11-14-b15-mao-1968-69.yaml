      when: Sept. 25
      date: '1968-09-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: strikes slogan 11 from the thirty slogans for the National Day issued in the Center''s and the Group''s name, "Salute the Cultural Revolution Group of great achievements": a body should not praise itself in its own slogans.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 25, 1968. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-09-26.china-leadership
      when: Sept. 26
      date: '1968-09-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao receives army cadres in training at Peking, then talks with Wu Faxian, Ye Qun and Lu Yang: those who made mistakes were not taught; re-educate them. Asks if Chen Zaidao is there; told he is still isolated; "why isolate him" (criticize, struggle, but no "jet plane"); asks where Xu Xiangqian, Nie Rongzhen and Ye Jianying are.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 26, 1968. Made public: 2013. Names: Mao Zedong, Wu Faxian, Ye Qun, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Lu Yang, Chen Zaidao.'
      tags:
      - polity:prc
