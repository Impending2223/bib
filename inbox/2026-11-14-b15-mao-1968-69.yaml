      - name:huang-yongsheng
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1968-11-28.china-leadership
      when: Nov. 28
      date: '1968-11-28'
      thread: china-leadership
      c: Mao receives Hill, chairman of the Communist Party of Australia (M-L), Hall 118, evening; Zhou Enlai, Chen Boda, Kang Sheng and Yao Wenyuan present. Will imperialism fight a world war or not yet? After 1945 the defeated stay tied to the victors; only the US and USSR can fight, and Britain, France, Germany, Japan and Italy are the unwilling "second intermediate zone"; the US has 200,000 in Europe and is overextended; Khrushchev's "war not inevitable" is dropped.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 28, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Yao Wenyuan, Hill.'
      tags:
      - polity:prc
      - polity:australia
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:yao-wenyuan
      - vis:only:prc+australia
- add:
    entry:
      id: cal.1968-11-30.china-leadership
      when: Nov. 30
      date: '1968-11-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Yao Wenyuan''s request to print the editor''s note and reports on the rural cooperative medical system (Leyuan commune, Changyang, Hubei; Huangcun and Liangxiang communes, Peking). Mao: approved; the discussion should also take up whether urban primary and middle schools can be run jointly by factories and street committees; Shanghai and Peking can supply material.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 30, 1968. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-01.china-leadership
      when: Dec. 1
      date: '1968-12-01'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Peking''s committee reports the Xinhua Printing Works''s way of giving enemies a way out. Mao to Lin Biao, Zhou Enlai and the Group: send around; counterrevolutionaries and offenders treated by policy, a small blow and wide education, evidence and inquiry, no forced confessions; free the good people who erred when aware.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 1, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-14.china-leadership
      when: Dec. 14
      date: '1968-12-14'
      thread: china-leadership
      c: 'Mao, Peking: the National Defense Science Commission asks to fire the first full-range Dongfeng-3 ground-to-ground missile. The Military Commission Office Group''s report of Dec. 12 and Zhou Enlai''s note of Dec. 14 favor the test. Mao: "as proposed".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 14, 1968. Made public: 2013. To check: the National Defense Science Commission''s report on the Dongfeng-3 test and the Military Commission Office Group''s report of Dec. 12 (cited by [[w.zedong-mao-zedong-nianpu]], VI, Dec. 14, 1968). Names: Mao Zedong, Zhou Enlai, Wang Bingzhang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-12-19.china-leadership
      when: Dec. 19
      date: '1968-12-19'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Mao, Lin Biao and Zhou Enlai telegraph Nguyen Huu Tho, chairman of the NLF''s Central Committee, on its eighth anniversary: the war proves American imperialism a paper tiger, its two hands of military adventure and political fraud; China supports the Vietnamese to the end.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 19, 1968. See [[cal.1968-12.china]] (a month only). Names: Mao Zedong, Lin Biao, Zhou Enlai, Nguyen Huu Tho.'
      tags:
      - polity:prc
      - polity:nlf
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:nguyen-huu-tho
- add:
    entry:
      id: cal.1968-12-21.china-leadership
      when: Dec. 21
      date: '1968-12-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Yao Wenyuan''s draft Center–Group notice on keeping to policy in the struggle with the enemy; Mao revises: enemies named by the Center''s fixed terms (traitors, spies, unrepentant capitalist roaders, unreformed landlords, rich peasants and others), not vague words that blur the two kinds of contradiction. His added passage on those who made capitalist-roader errors; "for discussion".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 21, 1968. Made public: 2013. To check: the Center and Group''s notice on policy in the struggle with the enemy, draft of Dec. 17 (cited by [[w.zedong-mao-zedong-nianpu]], VI, Dec. 21, 1968). Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
