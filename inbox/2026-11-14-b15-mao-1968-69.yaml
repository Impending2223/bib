      - name:zhou-enlai
      - name:kang-sheng
      - name:jiang-qing
      - name:yao-wenyuan
      - vis:only:prc+italy
- add:
    entry:
      id: cal.1968-08-17.china-leadership
      when: Aug. 17
      date: '1968-08-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, hears Lin Biao, Huang Yongsheng, Wu Faxian and Wen Yucheng: Tsinghua''s sides have united; the schools to be held to the end of "struggle, criticize, reform"; send workers (a tenth of Peking''s 800,000 at most) with army men, since students fear workers, not the army ("five nots"); war preparation.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 17, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Huang Yongsheng, Wu Faxian, Wen Yucheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:huang-yongsheng
      - name:wu-faxian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-19.china-leadership
      when: Aug. 19
      date: '1968-08-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with the Cultural Revolution Group: the workers'' and army propaganda teams in the schools; struggle, criticism, reform still rests on activists, but the army and workers must go in where the schools only fight each other; Shanghai''s 1.2 million workers to take over all schools and arts bodies, stay, and form worker-army-student three-in-one.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 19, 1968. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-22.china-leadership
      when: Aug. 22
      date: '1968-08-22'
      thread: china-leadership
      also:
      - soviet-union
      - soviet-union-czechoslovakia
      c: 'Mao, Great Hall, with the Cultural Revolution Group and Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying, on the Soviet occupation of Czechoslovakia: imperialists and revisionists both oppose it; Czechoslovakia depends on Soviet oil, grain and ore; Daqing could be lost to an invader, so the oil of Sichuan and western Hubei to be tried at once (Li Xiannian and Li Fuchun); China sides with peoples.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22, 1968. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying, Li Fuchun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-yi
      - name:li-xiannian
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:ye-jianying
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-22.china-leadership-2
      when: Aug. 22–24
      date: '1968-08-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Yao Wenyuan''s article for the guidance of current politics, three drafts; Aug. 22 retitled "The working class must lead everything", *Hongqi* to be a fortnightly with a Yao commentary each issue, printed first in *Hongqi* under Yao''s name, then by the papers and radio, after reading at the Group. Printed Aug. 25 in *Hongqi*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 22–24, 1968. See [[cal.1968-08-22.china-leadership]]. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
