- add:
    entry:
      id: cal.1968-10-12.china-leadership
      when: Oct. 12
      date: '1968-10-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, evening, with Lin Biao and the Cultural Revolution Group on his speech for the Twelfth Plenum: was the Eleventh Plenum right, or mainly right; was the Cultural Revolution needed; had the Center, the provinces, the Red Guards and the army supporters done well; cadres have been too much struck; Deng Xiaoping can do some work; defection and surrender to be told apart.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 12, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-13.china-leadership
      when: Oct. 13
      date: '1968-10-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao opens the Twelfth Plenum of the Eighth Central Committee (enlarged), Peking, Oct. 13–31, and speaks. Zhou Enlai gives the attendance and the agenda: preparing the Ninth Congress, amending the Party constitution, the domestic and international situation, the investigation report on the Liu Shaoqi case. Mao: two views, that the Eleventh Plenum''s resolution was basically right and that it was not; a show of hands is not agreement.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 13, 1968. Made public: 2013. To check: the plenum''s records; Mao''s speeches (the *wengao*). Names: Mao Zedong, Zhou Enlai, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-13.china-leadership-2
      when: Oct. 13
      date: '1968-10-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Kang Sheng, Zhang Chunqiao and Yao Wenyuan''s draft Party constitution, twice discussed in the Group: to be printed for the plenum as a basis. In chapter I he strikes the three adverbs from the clause on Mao as carrying on Marxism-Leninism, and puts "Marxism, Leninism" before "Mao Zedong Thought" twice; changes in chapter IV on the central organs.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 13, 1968. See [[cal.1968-10-13.china-leadership]]. Made public: 2013. To check: the draft Party constitution of Oct. 12 (*Zhongguo gongchandang zhangcheng (caoan)*), Kang Sheng, Zhang Chunqiao and Yao Wenyuan''s covering report, and Mao''s revised text (the *wengao*; cited by [[w.zedong-mao-zedong-nianpu]], VI, Oct. 13, 1968). Names: Mao Zedong, Kang Sheng, Zhang Chunqiao, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:kang-sheng
      - name:zhang-chunqiao
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-23.china-leadership
      when: Oct. 23
      date: '1968-10-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: approves Zhou Enlai''s draft decision of the Twelfth Plenum on electing delegates to the Ninth Congress; on Oct. 22 the Group cut Tianjin''s quota from 40 to 30, the ten put in the Center''s own quota so that famous senior intellectual Party members come from it and the provinces send the barefoot doctors, rural teachers and Red Guard members. Oct. 21 he had called Zhou and others to Hall 118 on the quotas.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 23, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-26.china-leadership
      when: Oct. 26
      date: '1968-10-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing''s draft decision on the draft Party constitution and the text of Oct. 25: "revised, to be discussed". He changes "Chairman Mao" to "Comrade Mao Zedong" throughout; strikes Deng Xiaoping''s name from the criticism of the revisionist line of Party building by Liu Shaoqi and Deng; strikes the clause calling the Party Mao''s creation and "great, glorious and correct".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1968. Made public: 2013. To check: the decision on the draft constitution and the draft of Oct. 25 (the *wengao*; cited by [[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1968). Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Liu Shaoqi, Deng Xiaoping.'
      tags:
