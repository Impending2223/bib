      when: Jan., middle
      date: 1969-01
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai''s report of Jan. 17 includes a letter in the State Council office''s digest proposing Jiang Qing for the Politburo Standing Committee and head of the Organization Department. Mao: "in name only", neither fit. Also: Li Na and Mao Yuanxin should not be delegates (to the Ninth Congress).'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Jan. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Jiang Qing, Li Na, Mao Yuanxin.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-28.china-leadership
      when: Jan. 28
      date: '1969-01-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: approves the Center''s forwarding of the Capital Workers'' and PLA Mao Zedong Thought Propaganda Team at Tsinghua''s report on re-educating intellectuals and "giving a way out": most intellectuals wish to make revolution; capitalist-roader errors forgiven when aware; bourgeois authorities criticized, then given a way out; counterrevolutionaries judged case by case. Issued Jan. 29.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 28, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-28.china-leadership-2
      when: Jan. 28
      date: '1969-01-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, hears the Military Commission Office Group. The Cultural Revolution is about policy: landlords and bourgeoisie, tens of millions, and intellectuals, millions, cannot be destroyed in the body, only won, taught and divided; Tsinghua''s five points are good; the 4,300 km of defense works built, more than half useless in a war of air attack and landing.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 28, 1969. See [[cal.1969-01-28.china-leadership]]. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-01-31.china-leadership
      when: Jan. 31
      date: '1969-01-31'
      thread: china-leadership
      c: 'Mao, Peking: reads the funeral report for Li Zongren (died Jan. 30 in Peking; had written Mao and Zhou that he was right to come home in 1965), as Zhou Enlai revised it: Zhou, not Fu Zuoyi, to preside over the last viewing. Mao: "as proposed".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Zongren, Fu Zuoyi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-02.china-leadership
      when: Feb. 2
      date: '1969-02-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing send an agenda for preparing the Ninth Congress (arrival of delegates, approval of delegates, views on the draft constitution, the economic plan, the situation, the central organs after the Congress, propaganda) and a notice to delegates, and ask that Mao and Lin Biao meet the Group in a day or two. Mao: talk in a day or two; the other paper issued.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 2, 1969. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-07.china-leadership
      when: Feb. 7
      date: '1969-02-07'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group: study the course of the "three supports, two militaries" since Feb. 1967, and what has changed since propaganda teams went into schools, factories and offices; no "activists'' congresses" and no side-taking; students started the movement, then turned to civil war and no longer listened; in Wuhan in 1967 they had lost the main direction.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 7, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-02-19.china-leadership
      when: Feb. 19
      date: '1969-02-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying: approves the old men''s visits to factories for investigation; Group members to go down as well; reform in many fields, nobody knows how to do socialism; on Chen Yi''s report of people jailed in factories: only murder, arson, poison are crimes, a few reactionary slogans are not.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Feb. 19, 1969. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian, Nie Rongzhen, Ye Jianying.'
      tags:
      - polity:prc
