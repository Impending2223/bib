      when: May 21
      date: '1968-05-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing''s draft of the statement by Peking worker, poor-peasant, Red Guard committees supporting the French workers and students. Strikes the passage on the world revolutionary era under Mao Zedong Thought and the closing "long live" slogan: "drop the boasting". Printed May 22 in *Renmin ribao*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 21, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
