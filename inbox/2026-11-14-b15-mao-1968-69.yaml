      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-28.china-leadership
      when: Oct. 28–30
      date: '1968-10-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the draft communique of the Twelfth Plenum, Oct. 28 (print for discussion) and Oct. 30 (a little revised). Strikes the claim that Mao Zedong Thought''s mass spread is a great Cultural Revolution achievement, the "new stage of Marxism-Leninism" and "sole" guiding thought: "not fit here".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 28–30, 1968. Made public: 2013. To check: the communique of the Twelfth Plenum, drafts of Oct. 28 and 30 (the *wengao*; cited by [[w.zedong-mao-zedong-nianpu]], VI, Oct. 28 and 30, 1968). Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1968-10-31.china-leadership
      when: Oct. 31
      date: '1968-10-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao closes the Twelfth Plenum, 5:15 p.m., Great Hall. It adopts the communique; approves the report on the "traitor, hidden enemy, scab" Liu Shaoqi (Jiang Qing, Kang Sheng, Xie Fuzhi); expels Liu from the Party for ever and strips all his posts; decides to convene the Ninth Congress; adopts the decision on its delegates and the draft constitution. Mao speaks: on the "February countercurrent", a big thing and not so big, a natural matter of differing views. Earlier that afternoon at 4 p.m. he met Lin Biao and Zhou in Fujian Hall on how to convey the plenum.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1968. Made public: 2013. To check: the plenum''s communique, the report on Liu Shaoqi''s case, the resolution expelling him, and Mao''s closing speech (cited by [[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1968). Names: Mao Zedong, Lin Biao, Zhou Enlai, Liu Shaoqi, Jiang Qing, Kang Sheng, Xie Fuzhi. Check: the chronology''s note 39 on the report resting on false evidence is the editors''.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:liu-shaoqi
      - name:jiang-qing
      - name:kang-sheng
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-01.china-leadership
      when: Nov. 1
      date: '1968-11-01'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      - vietnam-paris
      c: 'Mao, Hall 118, afternoon, with Lin Biao and the Cultural Revolution Group, on Johnson''s broadcast of Oct. 31 halting all bombing and attack on the whole DRV: no comment from China until the Vietnamese statement; print Vietnam''s first and Johnson''s second, with the Vietnamese headline. The war a stalemate, neither side near a decisive win; the American commissions on 17 countries show shortages and deficits.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 1, 1968. See [[cal.1968-10-31.vietnam]], [[cal.1968-11-01.vietnam-air-war]]. Made public: 2013. Names: Mao Zedong, Lin Biao, Lyndon B. Johnson.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:johnson-lyndon-b
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-02.china-leadership
      when: Nov. 2
      date: '1968-11-02'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: '*Renmin ribao* prints the communique of the Twelfth Plenum, with Mao''s words on the Cultural Revolution as completely necessary and very timely. The same day Mao revises Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing''s decision and the draft Party constitution of Nov. 1: "these contradictions can only be solved by the Marxist theory and practice of continuous revolution", noting that Trotsky and Qu Qiubai also spoke of it. Issued to the Party Nov. 3.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 2, 1968. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Trotsky, Qu Qiubai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:jiang-qing
- add:
    entry:
      id: cal.1968-11-04.china-leadership
      when: Nov. 4
      date: '1968-11-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, with the Cultural Revolution Group on history: a line or view to be repeated and told to the masses, not a few; the movement hurt some and felled a batch. On conveying the plenum: the matter is the "February countercurrent"; of those men, "one criticize, two protect, three watch".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 4, 1968. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-10.china-leadership
      when: Nov. 10
      date: '1968-11-10'
      thread: china-leadership
      also:
      - south-asia
      c: 'Mao receives the Pakistani armed forces friendship delegation under President Yahya Khan, Great Hall, evening; Zhou Enlai, Kang Sheng, Huang Yongsheng and Wu Faxian present. China suffered mainly under British imperialism; Britain''s mission 18 years only a chargé; Nixon wants to bring China into the UN "family": China keeps no rules of bodies the US controls but keeps the rules between states. Pakistan''s economy also discussed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 10, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kang Sheng, Huang Yongsheng, Wu Faxian, Nixon, Yahya Khan.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:mao-zedong
      - name:zhou-enlai
      - name:kang-sheng
      - name:huang-yongsheng
      - name:wu-faxian
      - name:nixon-richard-m
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1968-11-14.china-leadership
      when: Nov. 14
      date: '1968-11-14'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      - vietnam-paris
      c: 'Mao, Hall 118, afternoon, with Lin Biao and the Cultural Revolution Group on the situation in Vietnam, after Zhou Enlai''s account of his talks with Pham Van Dong: fighting is hard, talking hard; the US may leave in three cases (trouble at home, the Mediterranean, Europe); Nixon says its stand is too scattered; the State Department has 21 faults and difficulties.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 14, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Pham Van Dong, Nixon.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:pham-van-dong
      - name:nixon-richard-m
      - vis:only:prc
- add:
    entry:
      id: cal.1968-11-17.china-leadership
      when: Nov. 17
      date: '1968-11-17'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      - vietnam-paris
      c: Mao receives Pham Van Dong and party, Great Hall (Hall 118), on negotiating with the United States; Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng and Wen Yucheng present. With no big battles lately it is hard to talk the Americans out, though they want talks; their weight lies in three regions, America, Europe and Asia, stretched thin, and Americans fight only after others have; Vietnam need not look only at its own troubles, it has outlasted Japan, France and the US.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 17, 1968. Made public: 2013. Names: Mao Zedong, Pham Van Dong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wen Yucheng.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
