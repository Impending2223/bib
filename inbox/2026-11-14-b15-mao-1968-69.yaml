      when: Oct. 1
      date: '1968-10-01'
      thread: china-leadership
      c: Peking, Tiananmen, 10 a.m. Mao with Lin Biao, Zhou Enlai and others at the National Day rally for the nineteenth anniversary; reviews the parade; in the rest room meets the Albanian party's Politburo member Balluku and a Pakistani friendship delegation; at night the fireworks, and he receives provincial revolutionary committee heads, workers' delegates and the Ecuadorian CP (M-L)'s first and second secretaries.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1968. Names: Mao Zedong, Lin Biao, Zhou Enlai, Balluku, Said.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
- add:
    entry:
