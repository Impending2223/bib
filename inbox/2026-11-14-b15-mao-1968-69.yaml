    entry:
      id: cal.1968-12-27.china-leadership
      when: Dec. 27
      date: '1968-12-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai''s request of Dec. 26 to abolish the Supreme People''s Procuratorate, the Ministry of the Interior and the Interior Office, and cut the Public Security Ministry and Supreme People''s Court to a few men, sending many to farm labor, the first such cut of a central body. Mao: "as proposed".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 27, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
