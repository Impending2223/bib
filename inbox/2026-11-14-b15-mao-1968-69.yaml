      - name:mao-zedong
      - name:zhou-enlai
      - name:kang-sheng
      - name:jiang-qing
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1968-08-08.china-leadership
      when: Aug. 8
      date: '1968-08-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with the Cultural Revolution Group and Wu De: on the workers'' teams in the schools. Don''t rush to declare positions; urge union of the two sides; students hold no industry, farms, transport or troops, "they only make a noise"; the "five great leaders" distrusted by workers, peasants, soldiers and students.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 8, 1968. Made public: 2013. Names: Mao Zedong, Wu De.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-08-13.china-leadership
      when: Aug. 13
      date: '1968-08-13'
      thread: china-leadership
      c: Mao receives the Italian Communist Party (Marxist-Leninist) delegation, Politburo members Becchi and Dini (the chronology's "Beiqi", "Dini"), Great Hall; Zhou Enlai, Kang Sheng, Jiang Qing and Yao Wenyuan present. Revisionism exists in China too; mass movements alone clean it out; the bourgeoisie influences communist parties whether they stand for election or not.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 13, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kang Sheng, Jiang Qing, Yao Wenyuan, Becchi, Dini. Check: the Italian spellings.'
      tags:
      - polity:prc
      - polity:italy
