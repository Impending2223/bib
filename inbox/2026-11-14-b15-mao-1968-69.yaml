      when: Jan. 4
      date: '1969-01-04'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao sees Xu Shiyou on the factionalism of the Zhejiang garrison in the "three supports, two militaries"; has Wang Dongxing tell Zhou Enlai and Kang Sheng to see Xu again that night and fix the means. Zhou reports that evening an eleven-man list to come to Peking Jan. 5 or 6 for a meeting to settle Zhejiang. Mao: "as proposed".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Jan. 4, 1969. Made public: 2013. Names: Mao Zedong, Xu Shiyou, Zhou Enlai, Kang Sheng, Wang Dongxing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xu-shiyou
      - name:zhou-enlai
      - name:kang-sheng
      - vis:only:prc
