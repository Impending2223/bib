    entry:
      id: cal.1968-05-24.china-leadership
      when: May 24
      date: '1968-05-24'
      thread: china-leadership
      also:
      - africa
      c: Mao receives the joint friendship delegation of Guinea and Mali, Great Hall; Lin Biao, Zhou Enlai, Chen Yi and Li Xiannian present. China an old country made new but young in work; the two states' political independence and union; learn the techniques yourselves (survey, design, building, running) and China will train your technicians.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 24, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Yi, Li Xiannian.'
