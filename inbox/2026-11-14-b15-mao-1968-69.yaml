      when: Oct. 9
      date: '1968-10-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: strikes Xiao Li and Mao Yuanxin from Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing''s draft list for the enlarged Twelfth Plenum; neither to attend. That evening in Hall 118 he meets Lin Biao and Zhou on adding ten Central Committee members; Oct. 11 Zhou reports Mao Yuanxin out (Yang Chunfu for Liaoning) and Mao rules Xiao Li not even a staff member.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 9, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Xiao Li, Mao Yuanxin, Yang Chunfu.'
      tags:
      - polity:prc
