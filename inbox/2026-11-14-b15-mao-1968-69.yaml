    entry:
      id: cal.1968-09-20.china-leadership
      when: Sept. 20
      date: '1968-09-20'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing report the plan for the Twelfth Plenum of the Eighth Central Committee, enlarged to about 300, with a Central Revolutionary Committee as a provisional supreme organ before the Ninth Congress. Mao: Lin Biao first, then himself; no Central Revolutionary Committee for now; the plenum not much enlarged, a hundred-odd enough.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 20, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing.'
      tags:
