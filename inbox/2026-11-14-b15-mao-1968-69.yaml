      when: Sept. 6
      date: '1968-09-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the *Renmin ribao* and *Jiefangjun bao* editorial for the setting up of revolutionary committees in every province, city and region but Taiwan: "Long live the all-round victory of the Great Proletarian Cultural Revolution". Printed Sept. 7; Sept. 7 he agrees to Zhou Enlai''s rally of 100,000 at the Workers'' Stadium, held that afternoon.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 6, 1968. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
