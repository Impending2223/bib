      when: Oct. 1
      date: '1968-10-01'
      thread: china-leadership
      c: 'Mao to Balluku, Tiananmen rest room: in Feb. 1967 things were still disorderly; now the working class rules the main cities, the peasants most of the countryside; the students, the vanguard until the first half of 1968, are now behind.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1968. See [[cal.1968-10-01.china-leadership]]. See [[cal.1968-10-01.china-leadership]]. Made public: 2013. Names: Mao Zedong, Balluku.'
