    entry:
      id: cal.1969-05-01.china-leadership
      when: May 1
      date: '1969-05-01'
      thread: china-leadership
      c: Mao at the Tiananmen rostrum, 8 p.m., for the fireworks with other leaders, Congress delegates and some foreign envoys. He tells the envoys China will improve and extend relations with all states; ambassadors begin to be sent out again to restore the missions' work.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 1, 1969. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1969-05-03.china-leadership
      when: May 3
      date: '1969-05-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao in a talk, on the cleaning of class ranks and the "May 16" investigation: other than killers, arsonists and poisoners none killed, most not arrested; the poison he means is food poison, not political.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 3, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-05.china-leadership
      when: May 5
      date: '1969-05-05'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Wang Dongxing forwards Deng Xiaoping''s letter of May 3: the Ninth Congress is over, he waits for the Party''s decision on his case. Mao to Lin Biao, Zhou Enlai and the Politburo members in Peking: "read".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 5, 1969. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Lin Biao, Zhou Enlai, Wang Dongxing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:lin-biao
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-19.china-leadership
      when: May 19
      date: '1969-05-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, afternoon, with Li Xiannian, Ye Jianying and others: Zhou Enlai''s account of the Center''s means for Inner Mongolia, Shandong and Guizhou, where factionalism and a widened cleaning of class ranks continue. He condemns the chiefs of those regions for broadening, acting alone, favoring one side; at least half of the special case groups'' material cannot be believed; at Peking University men were beaten crippled ("kill the monkey, slaughter the ox, stew the sheep") for criticizing leaders. Asks whether Tao Zhu''s illness is better: he may not be refused treatment for his errors.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Xiannian, Ye Jianying, Tao Zhu, Hou Hanqing, Niu Huilin, Yang Keming.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:li-xiannian
      - name:ye-jianying
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-19.china-leadership-2
      when: May 19
      date: '1969-05-19'
      thread: china-leadership
      c: 'Mao talks with the geologist Li Siguang, the waiting room of the Great Hall: from the origin of the stars to the origin of life; he doubts Schmidt on the solar system and rates Kant and Laplace; asks Li for his books and for scientific material gathered at home and abroad, in Chinese, as he reads no English.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1969. See [[cal.1969-05-19.china-leadership]]. Made public: 2013. Names: Mao Zedong, Li Siguang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-19.china-leadership-3
      when: May 19–20
      date: '1969-05-19'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao reads Zhou Enlai's draft of the Chinese government's statement on the Sino-Soviet boundary, answering the Soviet government's statement of Mar. 29, and returns it as usable. He adds to the last paragraph the lines of not attacking, but of striking back if attacked; the statement states China's position, puts blame on the Soviet side, and proposes that the two sides agree through diplomatic channels the date and place of boundary talks. Issued May 24.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19–20, 1969. See [[cal.1969-05-19.china-leadership]]. Made public: 2013. To check: the government statement of May 24, 1969 and Zhou Enlai''s covering note (cited by [[w.zedong-mao-zedong-nianpu]], VI, May 19 or 20, 1969). Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05.china-leadership
      when: May, middle
      date: 1969-05
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Zhou Enlai''s draft reply to the Soviet Foreign Ministry''s note of May 4, which charged Chinese border provocation at the Tasti River in Yumin county, Xinjiang, and threatened measures; the reply tells of Soviet intrusion into the Barluk range and air space May 2–3. Mao: if anything new happens in May, add it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-May 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the day within the middle ten days.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-23.china-leadership
      when: May 23
      date: '1969-05-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the Center''s covering note to the opinion of Guizhou''s revolutionary committee and military district on carrying out the Ninth Congress, and the district''s five measures to settle Guizhou: end factionalism and strengthen unity for third-front building. Issued May 24.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 23, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-25.china-leadership
      when: May 25
      date: '1969-05-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the Center''s reply to the Shandong revolutionary committee''s report of May 24 from Wang Xiaoyu, Yang Dezhi and Yuan Shengping, which confesses the error of the "against restoration" campaign (*fan fujiu*) and gives ten remedies: the error one of direction.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 25, 1969. Made public: 2013. Names: Mao Zedong, Wang Xiaoyu (the chronology''s Wang Xiaoyu is 王效禹), Yang Dezhi, Yuan Shengping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-26.china-leadership
      when: May 26
      date: '1969-05-26'
      thread: china-leadership
      c: 'Mao, Hall 118, afternoon, chairs the Politburo Standing Committee and hears the Military Commission''s Office Group. It decides: a new Commission general office and a small General Political Department; the provincial districts and revolutionary committees to see to city air defense; no more army quota, the room kept to expand the navy, air force and Second Artillery; the defense industries and the Third, Fourth, Fifth and Sixth Ministries of Machine Building under the army. Other matters: local forces, field army rotations, senior transfers, graduates'' placement, the Selected Works''s fifth and sixth volumes.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 26, 1969. Made public: 2013. Names: Mao Zedong, Huang Yongsheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:huang-yongsheng
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-27.china-leadership
      when: May 27
      date: '1969-05-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves Zhou Enlai, Chen Boda and Kang Sheng''s draft Center instruction on the Hubei revolutionary committee''s report of May 25, which confesses the "against restoration" campaign at Wuhan: it aimed at the committees, the army and the cadres, and set the three representative congresses above everything, against the unity of the three-in-one and unified leadership. Eight remedies.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 27, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1969-05-29.china-leadership
      when: May 29
      date: '1969-05-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, afternoon: Zhou Enlai''s plan to reorganize the State Council''s working group, merge, cut and abolish its ministries and set up revolutionary committees, and to reform the Party''s central organs; Mao: as discussed, but the group''s membership to await Ji Dengkui and Li Desheng, whose duties are settled first. That evening he leaves Peking by train for Wuhan (arrives May 31), Changsha, Nanchang, Hangzhou.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 29, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Ji Dengkui, Li Desheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-02.china-leadership
      when: June 2
      date: '1969-06-02'
      thread: china-leadership
      c: 'Zhou Enlai notes on Chen Yi''s report of June 1 that the International Problems Study Group (Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen) has three tasks from Mao: stay in factories, schools, communes; study the international situation by reading and discussion and give views; study defense in the same way. They are not to return to their posts and are free of administration some days a week, to study world affairs and help Mao on strategy.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 2, 1969. Made public: 2013. Names: Zhou Enlai, Chen Yi, Ye Jianying, Xu Xiangqian, Nie Rongzhen, Mao Zedong, Xiong Xianghui, Yao Guang.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-yi
      - name:ye-jianying
      - name:xu-xiangqian
      - name:nie-rongzhen
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-11.china-leadership
      when: June 11
      date: '1969-06-11'
      thread: china-leadership
      also:
      - soviet-union
      c: The Chinese Foreign Ministry sends the Soviet ambassador a note of strong protest at a Soviet incursion into the western Barluk area of Yumin county, Xinjiang, and new bloodshed.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 11, 1969. Check: whether the chronology''s day is the date of the note or of the incident.'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1969-06-11.china-leadership-2
      when: June 11 or 12
      date: '1969-06-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads the Center''s "Some points on propaganda of Chairman Mao''s image" and approves: in the Cultural Revolution waste and ostentation, expensive statues of porcelain, plaster and plastic, bad portraits, ever larger badges, posters everywhere, "treasure-book" stands, "loyalty" rooms and dances. Issued after.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 11 or 12, 1969. See [[cal.1969-06-11.china-leadership]]. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-14.china-leadership
      when: June 14
      date: '1969-06-14'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Mao, Peking: approves the Foreign Ministry''s proposal that China recognize the Provisional Revolutionary Government of the Republic of South Vietnam, and Zhou Enlai''s telegram of congratulation as premier to its president, Huynh Tan Phat.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 14, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Huynh Tan Phat (Huang Jinfa in the Chinese). Check: the day of recognition and publication.'
      tags:
      - polity:prc
      - polity:nlf
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc+nlf
- add:
    entry:
      id: cal.1969-06-26.china-leadership
      when: June 26
      date: '1969-06-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao on his train at Wuhan hears Hubei''s revolutionary committee and the Wuhan Military Region (Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming): do the work of a third of the people first, no loud methods; politics must not be stiff; prepare for failure; the army men sent to support workers and peasants to learn political work. Leaves for Changsha.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 26, 1969. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Zhang Tixue, Fang Ming.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-28.china-leadership
      when: June 28
      date: '1969-06-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao at Changsha hears Li Yuan and Hua Guofeng of Hunan''s revolutionary committee: teach and unite the majority; unsettled factions give no unity; liberated cadres may be moved; on the basic accounting unit of the communes he asks what they think; Shimen''s report that the unit must not be changed lightly. Leaves for Nanchang the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 28, 1969. Made public: 2013. Names: Mao Zedong, Hua Guofeng, Li Yuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06-30.china-leadership
      when: June 30
      date: '1969-06-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao at Nanchang hears Cheng Shiqing, Yang Dongliang and Chen Changfeng of Jiangxi''s revolutionary committee and military district: Aug. 1 stays the Army''s day, since the Nanchang rising was the first shot; the Jiangxi daily cannot be renamed Jinggangshan, which belongs to the whole country; 95 percent of cadres freed, good. Arrives Hangzhou the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 30, 1969. Made public: 2013. Names: Mao Zedong, Cheng Shiqing, Yang Dongliang, Chen Changfeng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-06.china-leadership
      when: June, late
      date: 1969-06
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the editorial for the Party''s forty-eighth anniversary, "Long live the Communist Party of China" (*Renmin ribao*, *Jiefangjun bao*, *Hongqi*): "printed as it stands", after he adds "a preliminary" prosperity and changes "strong country" to "country": no more of such boasting. Printed July 1.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, late June 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-03.china-leadership
      when: July 3
      date: '1969-07-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hangzhou, afternoon: approves in principle Zhou Enlai''s plan to cut the Party and State central organs: the Cultural Revolution Group kept, with the General Office, Organization and Liaison Departments; the Propaganda and Investigation Departments and the Control Commission dropped, merged or sent down; the State Council''s working group of Zhou, Xie Fuzhi, Li Xiannian, Ji Dengkui, Li Desheng, Li Fuchun, Yu Qiuli, Su Yu and Su Jing, with Zhou head and Li Xiannian and Ji deputies; 62 ministries to 21.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 3, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Xie Fuzhi, Li Xiannian, Li Fuchun, Ji Dengkui, Li Desheng, Yu Qiuli, Su Yu, Su Jing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:xie-fuzhi
      - name:li-xiannian
      - name:li-fuchun
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-08.china-leadership
      when: July 8
      date: '1969-07-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao at Hangzhou hears Zhejiang''s committee and district chiefs Nan Ping and Chen Liyun: Nan Ping tells him Nanjing''s Party meeting does not let democracy speak and he left; Mao sends him back, take care, and yield to the majority if unconvinced. On Chen''s merging of communes and production teams: careful, rich with rich and poor with poor, not rich with poor; the team stays the base.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 8, 1969. Made public: 2013. Names: Mao Zedong, Nan Ping, Chen Liyun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-13.china-leadership
      when: July 13
      date: '1969-07-13'
      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Mao, 1 p.m.: approves Zhou Enlai''s speech for that night''s banquet for General Nur Khan, member of Pakistan''s presidential executive committee, which attacks the Soviet "Asian collective security" scheme as a step to a new anti-China military pact of social-imperialism.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 13, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Nur Khan.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc+pakistan
- add:
    entry:
      id: cal.1969-07-21.china-leadership
      when: July 21
      date: '1969-07-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the Military Commission Office Group proposes a leading group of 15 for the PLA daily, with Xiao Li to head. Mao: "Xiao Li has been sent down, she should not hold the post".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 21, 1969. Made public: 2013. Names: Mao Zedong, Xiao Li.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-07-23.china-leadership
      when: July 23
      date: '1969-07-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the Center''s notice of July 23 on Shanxi (the "July 23" Notice) at the request of Shanxi''s revolutionary committee: all organizations to obey the Center''s earlier bans on beating, smashing and looting; those who take ground by arms or hold out, the Army to surround, press politically, disarm; no assaults on army arms; runaways pursued.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 23, 1969. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1969-08-21.china-leadership
      when: Aug. 21 or 22
      date: '1969-08-21'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads the Military Commission Office Group''s draft instruction of Aug. 16 on strengthening discipline in the army, against anarchism, bourgeois factionalism, and the doctrine of many centers; discipline training; punish the incorrigible. Mao: approved.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 21 or 22, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-22.china-leadership
      when: Aug. 22 or after
      date: '1969-08-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: approves the Center''s order of nine points on stabilizing the border regions, sent by Zhou Enlai, Chen Boda and Kang Sheng after the July 23 Notice: watch the enemy and be ready to destroy invaders; against splitting and factionalism; border troops to hold their posts; groups organized by trade and system.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, late Aug. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-27.china-leadership
      when: Aug. 27
      date: '1969-08-27'
      thread: china-leadership
      also:
      - soviet-union
      c: The Center and the Military Commission forward the Office Group's report on strengthening civil air defense, setting up a national leading group and provincial ones. Aug. 28, with Mao's approval, the national group is made with Zhou Enlai as head; digging of shelters follows.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 27, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-08-31.china-leadership
      when: Aug. 31
      date: '1969-08-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Jiang Qing''s letter of Aug. 28 asks to rename the model opera *Taking Tiger Mountain by Strategy* (*Zhiqu Weihushan*) *Zhiqu Feigushan* and its hero Yang Zirong Liang Zhitong, as the author wrote of himself, true persons and facts. Mao: too much trouble; at least for now do not change the opera''s name or leading characters or place names; criticism of the novel''s author put off. Also approves 10,000 delegates for the twentieth National Day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 31, 1969. Made public: 2013. Names: Mao Zedong, Jiang Qing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:jiang-qing
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-01.china-leadership
      when: Sept. 1
      date: '1969-09-01'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Mao, Lin Biao and Zhou Enlai telegraph Ho Chi Minh and other Vietnamese leaders on the DRV''s twenty-fourth anniversary: Nixon''s two-handed counterrevolution, political fraud and "de-Americanizing" the war to hold the South for ever; China counts supporting Vietnam an internationalist duty.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Ho Chi Minh, Nixon.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-09-03.china-leadership
      when: Sept. 3
      date: '1969-09-03'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: Ho Chi Minh dies in Hanoi. The Chinese Central Committee, the NPC Standing Committee and the State Council wire condolences to the Vietnam Workers' Party Central Committee, the National Assembly Standing Committee and the government; that night Zhou Enlai leaves Peking at the head of a Party delegation for the funeral at Hanoi, back Sept. 5.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 3, 1969. Names: Zhou Enlai, Ho Chi Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1969-09-11.china-leadership
      when: Sept. 11
      date: '1969-09-11'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Peking airport VIP lounge. Zhou Enlai with Kosygin, who passes through on his way home from Ho Chi Minh''s funeral. Zhou: theoretical and principled disputes should not hinder state relations; talks can find a way on the boundary; until then three interim measures: keep the border as it is, avoid armed clashes, disengage forces in disputed places. Kosygin adds a fourth: border authorities may consult beforehand. Agreed on the four; each to send a delegation for boundary talks soon.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969. Made public: 2013. To check: the record of the talk (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 11, 1969, as the Chinese government''s account). Names: Zhou Enlai, Kosygin. Check: Soviet records of the talk; Mao''s presence in the decision not recorded here.'
      tags:
      - polity:prc
      - polity:ussr
      - name:zhou-enlai
      - name:kosygin-aleksei
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-09.china-leadership
      when: Sept., middle
      date: 1969-09
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: the Politburo''s draft slogans for the twentieth anniversary of the PRC: "added a line" for approval: peoples of the world unite against aggressive war launched by any imperialism or social-imperialism, above all atomic war; if it comes, to end it by revolutionary war, and prepare from now. Printed Sept. 17 in *Renmin ribao*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Sept. 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-17.china-leadership
      when: Sept. 17
      date: '1969-09-17'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: approves Zhou Enlai''s letter to Kosygin, settled by the Politburo, as sent Sept. 18: restates the four interim measures of the airport talk of Sept. 11 and adds a fifth, that they do not prejudice either side''s position on the boundary or the ownership of the disputed areas. Zhou: once sent, see Kosygin''s answer, then decide the date of a government statement.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 17, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:kosygin-aleksei
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-09-18.china-leadership
      when: Sept. 18
      date: '1969-09-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao on his southern tour: at Hangzhou he asks about the arts; the actors say the Yue opera has been altered until it is neither Peking nor Yue; Mao does not approve changing Yue opera into what it is not; when told Jiang Qing made the model operas, he says no, the plays existed and were improved by the workers of the arts. At Shanghai, Sept. 19, he tells Zhang Chunqiao and Wang Hongwen that no provincial leaders need come to Peking for National Day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 18, 1969. Made public: 2013. Names: Mao Zedong, Jiang Qing, Zhang Chunqiao, Wang Hongwen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:jiang-qing
      - name:zhang-chunqiao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-19.china-leadership
      when: Sept. 19
      date: '1969-09-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao at Nanjing, evening, hears Xu Shiyou and Du Ping on war preparation: for the National Day neither local nor army leaders to go to Peking, lest the enemy strike at the center. Sept. 21, with Xu, Du and Zhang Caiqian: Du to Peking for a five-day Military Commission meeting and straight back; each at his post.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 19, 1969. Made public: 2013. Names: Mao Zedong, Xu Shiyou, Du Ping, Zhang Caiqian.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xu-shiyou
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-22.china-leadership
      when: Sept. 22
      date: '1969-09-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: Mao, at midday on his train near Jinan, hears Yang Dezhi, Yuan Shengping and Wang Xiaoyu on mass organizations, words not weapons, production and policies; back at Peking Sept. 23 morning.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 22, 1969. Made public: 2013. Names: Mao Zedong, Yang Dezhi, Yuan Shengping, Wang Xiaoyu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-09-23.china-leadership
      when: Sept. 23
      date: '1969-09-23'
      thread: china-leadership
      also:
      - testing
      c: China fires an underground nuclear test; Sept. 29 a hydrogen bomb is exploded in the air over the western region.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 23, 1969. Check: two events in one note; the days, the Xinhua communiques.'
      tags:
      - polity:prc
- add:
    entry:
      id: cal.1969-09-24.china-leadership
      when: Sept. 24
      date: '1969-09-24'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Zhou Enlai''s eleventh draft of the Chinese government statement. Moscow having given no answer to the letter of Sept. 18, kept secret, the Soviet statement of June 13 must be answered publicly and China''s whole case on the boundary and the clashes stated: history''s rights and wrongs, the unequal treaties as the basis, "disputed areas", the interim measures.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969. Made public: 2013. To check: the government statement of Oct. 7, 1969 and Zhou Enlai''s covering report of Sept. 24 (cited by [[w.zedong-mao-zedong-nianpu]], VI, Sept. 24, 1969). Names: Mao Zedong, Zhou Enlai. Check: Mao''s note not given in the chronology.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-01.china-leadership
      when: Oct. 1
      date: '1969-10-01'
      thread: china-leadership
      also:
      - korea-leadership
      c: 'Peking, Tiananmen, 10 a.m. Mao with Lin Biao, Zhou Enlai and others at the rally for the PRC''s twentieth anniversary; reviews the parade. In the rest room with Lin he receives Choe Yong-gon of the Korean Workers'' Party: Sino-Korean friendship; on Moscow, we do not want a war, we need not abuse Soviet revisionism daily; their daily abuse failed; the split pleases the US; the border has been quiet for a dozen days. He also meets Pham Van Dong, Nouhak Phoumsavanh of the Lao People''s Party, Albania''s Toska, Italy''s Dinucci, Sweden''s Bylin and Ceylon''s Shanmugathasan.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 1, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Pham Van Dong, Choe Yong-gon, Nouhak Phoumsavanh, Toska, Dinucci, Bylin, Shanmugathasan.'
      tags:
      - polity:prc
      - polity:dprk
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:pham-van-dong
- add:
    entry:
      id: cal.1969-10-03.china-leadership
      when: Oct. 3
      date: '1969-10-03'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao, Hall 118, afternoon, calls Zhou Enlai and others to discuss the boundary talks with the Soviet Union.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 3, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-06.china-leadership
      when: Oct. 6
      date: '1969-10-06'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: approves Zhou Enlai''s reply to Kosygin''s letter of Sept. 26 and the fifteenth draft of the government statement. The reply restates the five interim measures, to be taken up first once talks open, and names Qiao Guanhua head of China''s delegation. The statement, handed over Oct. 7 and printed Oct. 8, repeats China''s stand on the boundary and condemns new Soviet bloodshed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 6, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin, Qiao Guanhua.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:kosygin-aleksei
      - name:qiao-guanhua
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-10-14.china-leadership
      when: Oct. 14
      date: '1969-10-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - soviet-union
      c: 'Mao, 6 p.m., Hall 118, with Zhou Enlai and others; the Politburo meets at 8:30. He circles the request of Zhou, Chen Boda and Kang Sheng for a special case group of seven (Yang Chengwu, Yu Lijin, Fu Chongbi, Xiao Hua, Wang Li, Guan Feng, Qi Benyu). Oct. 17: Zhou and the Politburo tell the old comrades, by Mao''s decision, to leave Peking about Oct. 20 for war preparation, each to a place Mao names: Dong Biwu, Zhu De, Ye Jianying to Guangdong; Chen Yun, Deng Xiaoping, Wang Zhen to Jiangxi; Chen Yi to Shijiazhuang; Nie Rongzhen to Handan; Xu Xiangqian to Kaifeng. Mao leaves Peking by train.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 14, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Dong Biwu, Zhu De, Ye Jianying, Deng Xiaoping, Chen Yi, Nie Rongzhen, Xu Xiangqian, Yang Chengwu, Yu Lijin, Fu Chongbi, Xiao Hua, Wang Li, Guan Feng, Qi Benyu, Chen Yun, Wang Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:dong-biwu
      - name:zhu-de
      - name:ye-jianying
      - name:deng-xiaoping
      - name:chen-yi
      - name:nie-rongzhen
      - name:xu-xiangqian
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-15.china-leadership
      when: Oct. 15
      date: '1969-10-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, on his train at Wuchang, hears Hubei''s Zeng Siyu and Liu Feng: not yet fit to form a provincial committee, the organs smaller than the old committee''s layers; clean class ranks not by arrests at one blow, struggle, criticize and reform unit by unit; Zhao Xiu and the other old committee cadres freed was good; speed the Jianghan oilfield, the Jiaozuo–Zhicheng railway, coal drilling; the army must prepare to fight.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 15, 1969. Made public: 2013. Names: Mao Zedong, Zeng Siyu, Liu Feng, Zhao Xiu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-18.china-leadership
      when: Oct. 18
      date: '1969-10-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Lin Biao, convalescing at Suzhou, dictates without Mao''s approval an emergency order to raise war readiness and guard against surprise attack: a command staff to take wartime posts at once. His secretary telephones it to Huang Yongsheng, chief of staff, in Peking; that night Huang and others issue it to the whole army as "Vice-Chairman Lin''s instruction (the first order)" and the army goes on alert. Oct. 19 Mao reads Zhou Enlai''s urgent circulation of the telephone record, tells Wang Dongxing to burn it, and burns the copy himself.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. Made public: 2013. Names: Lin Biao, Huang Yongsheng, Mao Zedong, Zhou Enlai, Wang Dongxing.'
      tags:
      - polity:prc
      - name:lin-biao
      - name:huang-yongsheng
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-18.china-leadership-2
      when: Oct. 18
      date: '1969-10-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Zhou Enlai''s report: the day before, with Mao''s assent, he proposed a communique that Sino-Soviet boundary talks will be held; that night the Soviet chargé gave another text that widened the scope; China will tell him Oct. 18 afternoon that its draft follows the scope confirmed by Kosygin and it will publish its own. Mao: agreed. Printed Oct. 19 in *Renmin ribao*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 18, 1969. See [[cal.1969-10-18.china-leadership]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kosygin.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:kosygin-aleksei
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-10-20.china-leadership
      when: Oct. 20
      date: '1969-10-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Sino-Soviet boundary talks open in Peking: the Soviet side refuses to discuss the interim measures agreed Sept. 11 and denies any "disputed areas" on the boundary; the delegations (Qiao Guanhua and V. V. Kuznetsov) diverge widely, and the talks go on by fits and starts.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 20, 1969. Made public: 2013. Names: Qiao Guanhua, Kuznetsov. Check: the day of opening and whether the opening was announced.'
      tags:
      - polity:prc
      - polity:ussr
      - name:qiao-guanhua
      - name:kuznetsov-vasily-v
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-26.china-leadership
      when: Oct. 26
      date: '1969-10-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: reads the Chinese delegation''s speech for the fourth plenary meeting of the boundary talks. Zhou Enlai: the Soviet side showed stubbornness in the third session Oct. 23 and in the heads'' meeting Oct. 24, and a rebuttal is wanted. Mao: read; "keep attacking, persistently".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-10-31.china-leadership
      when: Oct. 31
      date: '1969-10-31'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads the records of the boundary talks of Oct. 27 and 29; and Zhou Enlai''s report on the Politburo''s hearing on Sichuan: since the Ninth Congress an "against restoration" movement there like those of Shandong, Guizhou and Hubei, aimed at the army, the workers'' representatives placed over the revolutionary committee, factionalism and armed fighting; the Center must take it up; call Sichuan''s Party, government and army chiefs to Peking, bring unity, then widen. Mao: agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 31, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-11-12.china-leadership
      when: Nov. 12
      date: '1969-11-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Liu Shaoqi dies at Kaifeng, Henan, 6:45 a.m., aged 71: chairman of the PRC and formerly vice-chairman of the Central Committee.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 12, 1969. Made public: 2013. Names: Liu Shaoqi. Check: the chronology gives no word on how and when the Center was told, or on whether Mao was; the date of its being made public.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1969-11-19.china-leadership
      when: Nov. 19
      date: '1969-11-19'
      thread: china-leadership
      also:
      - soviet-union
      - south-asia
      c: 'Mao, Peking: Zhou Enlai''s report of Nov. 16 with Qiao Guanhua''s draft speech at the boundary talks (the two premiers'' understanding the base of talks; disengagement in disputed areas a guarantee of keeping the status quo; talks free of threat) and of President Yahya Khan''s talk with Zhang Tong, China''s ambassador in Pakistan, conveying a message from Nixon. Zhou: Nixon''s and Kissinger''s moves are to be noted; the reply to Yahya after consultation with the Foreign Ministry. Dec. 2 Zhou receives the Pakistani ambassador.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Nov. 19, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Qiao Guanhua, Nixon, Kissinger, Yahya Khan, Zhang Tong. Check: the American record of the message by Yahya; the day of the talk with Zhang.'
      tags:
      - polity:prc
      - polity:pakistan
      - polity:us
      - name:mao-zedong
      - name:zhou-enlai
      - name:qiao-guanhua
      - name:nixon-richard-m
      - name:kissinger-henry-a
      - vis:only:prc+pakistan+us
- add:
    entry:
      id: cal.1969-12.china-leadership
      when: Dec., early
      date: 1969-12
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Qiao Guanhua''s draft reply to Kuznetsov''s letter of Nov. 19, which proposed fixing the boundary''s course at once: the urgent matter is to carry out the four interim measures of Sept. 11 and the later addition, and first agree on the status quo and avoiding armed clashes, so that the question be settled peacefully free of threat. Mao: as proposed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, early Dec. 1969. Made public: 2013. Names: Mao Zedong, Qiao Guanhua, Kuznetsov.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:qiao-guanhua
      - name:kuznetsov-vasily-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-12.china-leadership-2
      when: Dec., early
      date: 1969-12
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Zhou Enlai''s report of Dec. 4 on freeing two Americans, Baldwin and Conrad, held since Feb. 16 for sailing a yacht into Chinese waters off Zhuhai. Oct. 27 the American consul general in Hong Kong, Martin, had written to Guangdong''s Liu Xingyuan about them; the Foreign Ministry''s Nov. 7 report took it for a probe of China''s reaction and proposed freeing them in early December with a message to the American ambassador in Warsaw. After the Politburo members in Peking considered it, Zhou proposes to agree. Mao: agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, early Dec. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Baldwin, Conrad, Martin (consul general), Liu Xingyuan. Check: Zhou''s report is cut off in the chronology after "to agree"; the American record.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-11.china-leadership
      when: Dec. 11
      date: '1969-12-11'
      thread: china-leadership
      also:
      - china
      c: 'Warsaw. Lei Yang, Chinese chargé, receives Stoessel in the Chinese embassy; Stoessel reads a prepared text proposing formal talks of the two governments'' representatives between Jan. 12 and 16, 1970, or soon after, on agenda, subjects and any proposals. Zhou Enlai reports Dec. 12 and proposes to wait and see the reaction before answering. Mao: as proposed. Dec. 29 Zhou writes that the answer should come early in January, with talks resumed Feb. 20; Mao: agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 11, 1969. See [[cal.1968-11-29.china]] (the earlier Feb. 20 date). Made public: 2013. Names: Lei Yang, Stoessel, Zhou Enlai, Mao Zedong. Check: the American record of Dec. 11.'
      tags:
      - polity:prc
      - polity:us
      - name:lei-yang
      - name:stoessel-walter-j-jr
      - name:zhou-enlai
      - name:mao-zedong
      - vis:only:prc+us
- add:
    entry:
      id: cal.1969-12.china-leadership-3
      when: Dec., middle
      date: 1969-12
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, Peking: Zhou Enlai''s report on the recess of the boundary talks because the Soviet chief of delegation asked to go home for a meeting: China will issue a short item after they leave, and refused to issue it jointly. Mao: as proposed. Dec. 15 *Renmin ribao* prints that Kuznetsov has gone home and the talks are in recess.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, mid-Dec. 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kuznetsov.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:zhou-enlai
      - name:kuznetsov-vasily-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1969-12-18.china-leadership
      when: Dec. 18
      date: '1969-12-18'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'The Center, with Mao''s approval, instructs on strengthening work in Tibet''s Ali district: its Party, government and army work entrusted to Xinjiang''s revolutionary committee and military district, though still part of Tibet; to build the planned power station; improve transport and supplies; train local cadres.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 18, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-19.china-leadership
      when: Dec. 19
      date: '1969-12-19'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: Mao, Lin Biao and Zhou Enlai telegraph Nguyen Huu Tho, president of the NLF's presidium, on its ninth anniversary, praising the southern Vietnamese people's long, hard struggle, which has put the US in isolation and difficulty.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 19, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Nguyen Huu Tho.'
      tags:
      - polity:prc
      - polity:nlf
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:nguyen-huu-tho
- add:
    entry:
      id: cal.1969-12-25.china-leadership
      when: Dec. 25
      date: '1969-12-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: approves the Center''s notice forwarding Hunan''s revolutionary committee''s self-criticism for circulating Mao''s instructions without leave: contrary to the Center''s notices, the printing, copying and spread of the talks, inspection tours and instructions of Mao and Lin Biao, of Center members'' speeches, and of their biographies, poems, pictures and photographs is forbidden.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-25.china-leadership-2
      when: Dec. 25
      date: '1969-12-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the Center''s covering note for the Sichuan revolutionary committee and Chengdu district''s report of Dec. 24 on Sichuan: self-criticism for factionalism, the "against restoration" campaign, ten remedies. Zhang Guohua is made head of the core group, Liang Xingchu and Li Dazhang deputies. Issued Dec. 27.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 25, 1969. See [[cal.1969-12-25.china-leadership]]. Made public: 2013. Names: Mao Zedong, Zhang Guohua, Liang Xingchu, Li Dazhang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-12-29.china-leadership
      when: Dec. 29
      date: '1969-12-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves Zhou Enlai''s draft Center decision of Dec. 29 putting Inner Mongolia under full military control by sectors, the Peking Military Region to set up a forward command post: the Baotou, Bayannur, Xilin Gol, Ulanqab, Hohhot and Yekezhao areas to the 63rd, 65th, 69th and 27th Armies.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Dec. 29, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
