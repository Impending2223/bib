      when: Aug. 26
      date: '1968-08-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the Military Commission Office Group proposes military control of some military schools. Mao: send workers with the military control men into all military schools; "break the intellectuals'' monopoly". Sept. 2: the Commission and the Group''s notice quotes it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 26, 1968. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
