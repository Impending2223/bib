      when: Sept. 1
      date: '1968-09-01'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - vietnam
      c: 'Mao, Lin Biao and Zhou Enlai telegraph Ho Chi Minh and others on the DRV''s twenty-third anniversary: the Vietnamese victory a contribution to peoples against American imperialism; seven hundred million Chinese will support the war to the end.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 1, 1968. Names: Mao Zedong, Lin Biao, Zhou Enlai, Ho Chi Minh.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:ho-chi-minh
