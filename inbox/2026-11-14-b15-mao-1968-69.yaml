- add:
    entry:
      id: cal.1968-10-05.china-leadership
      when: Oct. 5
      date: '1968-10-05'
      thread: china-leadership
      c: 'Mao receives the Albanian party and government delegation under Balluku, Great Hall, evening; Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan and Huang Yongsheng present. On cleaning up class ranks: the defeated class still struggles; Kuomintang remnants got into the central and local organs, now cleaned out by the Party, government, army and people themselves; half a year to a year more of class cleaning and Party rectification, then ten to twenty years'' quiet.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Oct. 5, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Zhang Chunqiao, Yao Wenyuan, Huang Yongsheng, Balluku.'
