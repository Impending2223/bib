- add:
    entry:
      id: cal.1968-05-11.china-leadership
      when: May 11
      date: '1968-05-11'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Great Hall (Hall 118), evening, with Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Xie Fuzhi and others: against the "jet-plane" struggle sessions (Ji Dengkui in Henan, more than a hundred) and forced confessions; the 16 Points define a counterrevolutionary by acts of murder, arson, poison, sabotage; the bad are few. To Chen Boda: stay out of Fujian, do not act alone, and talk with the Group before seeing students.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 11, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Xie Fuzhi, Ji Dengkui, Chen Zaidao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-16.china-leadership
      when: May 16
      date: '1968-05-16'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: a defense-industry report asks him to receive delegates at a Seventh Ministry conference in "Peking, the center of world revolution". Mao underlines the phrase: Chinese should not say it, the wrong thought of "me as the core"; Kang Sheng to raise it at the Group. May 18: the Center and the Cultural Revolution Group forbid the phrase in print, documents and speeches, above all to foreign guests.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 16, 1968. Made public: 2013. Names: Mao Zedong, Kang Sheng.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-19.china-leadership
      when: May 19
      date: '1968-05-19'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads Yao Wenyuan''s Xinhua report on the Peking Xinhua Printing Works'' military control committee''s way of dealing with enemies in the plant, and proposes it for all China: read it to the Group, revise, add a comment. "Best of its kind I have seen." Sent May 25 to the whole country; the campaign to clean up class ranks follows.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 19, 1968. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-20.china-leadership
      when: May 20
      date: '1968-05-20'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, with the Cultural Revolution Group and Dong Biwu, Li Fuchun, Li Xiannian, Chen Yi, Ye Jianying, Nie Rongzhen, Xu Xiangqian: old cadres cannot all be overthrown (Ye Jianying, Su Yu, Wang Shusheng, Zhong Qiguang, Song Shilun; Yang Yong, Yao Yilin, Huang Zhen, Geng Biao, Peng Shaohui); Deng Xiaoping''s errors an internal matter; do not fear the masses; the army cannot resist "wrong leadership". On France: a strike of two million, 16 of 18 universities taken; "world revolution should go back to France".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 20, 1968. Made public: 2013. Names: Mao Zedong, Dong Biwu, Li Fuchun, Li Xiannian, Chen Yi, Ye Jianying, Nie Rongzhen, Xu Xiangqian, Deng Xiaoping, Su Yu, Wang Shusheng, Zhong Qiguang, Song Shilun, Yang Yong, Yao Yilin, Huang Zhen, Geng Biao, Peng Shaohui, Chen Zaidao.'
