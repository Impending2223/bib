      when: June 30
      date: '1968-06-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with the Cultural Revolution Group and others: allow people to make mistakes and correct them; on Deng Xiaoping his view as before, no belief that he colluded with the enemy; go to the masses, do not act the lord; "three-anti elements" he does not accept.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 30, 1968. Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-03.china-leadership
      when: July 3
      date: '1968-07-03'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - vietnam-hanoi
      c: 'Mao approves the Center, State Council, Military Commission and Cultural Revolution Group''s notice on Guangxi (the "July 3" Notice): stop armed fighting, take down fortifications, restore the railway at Liuzhou, return aid goods for Vietnam and army arms seized, send outsiders home, punish proven murderers and saboteurs. Issued the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 3, 1968. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1968-07-12.china-leadership
      when: July 12
      date: '1968-07-12'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with Lin Biao, Great Hall, with the Cultural Revolution Group: on stopping armed fighting, talk to both sides until they give up their guns; universities to be kept, drawing students from workers after three or four years'' work and shortening the course (as at the Shanghai machine tool plant). Printed July 22 in the *Renmin ribao* editor''s note.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 12, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-17.china-leadership
      when: July 17
      date: '1968-07-17'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao calls Zhou Enlai and others to Hall 118: the Group to take up four questions, the international and domestic situation, the Ninth Congress and the Twelfth Plenum. July 21: he initials Zhou''s report of the Group''s discussion of July 18.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 17, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-24.china-leadership
      when: July 24
      date: '1968-07-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao approves the Center, State Council, Military Commission and Cultural Revolution Group''s notice on Shaanxi (the "July 24" Notice): reaffirms the July 3 Notice; disband armed teams, remove fortifications and checkpoints, restore transport and post, punish proven killers and their backers. Issued the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 24, 1968. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
- add:
    entry:
      id: cal.1968-07-27.china-leadership
      when: July 27
      date: '1968-07-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'At Mao''s decision the Capital Workers'' Mao Zedong Thought Propaganda Team goes into Tsinghua University to enforce policy, collect arms and clear barricades; some 28,000–29,000 workers. Kuai Dafu and others order armed "counterattack": five workers killed, several hundred wounded. Mao, hearing, is very angry. Xie Fuzhi and Wu De sent to Tsinghua the next day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 27, 1968. Made public: 2013. Names: Mao Zedong, Xie Fuzhi, Kuai Dafu, Wu De.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xie-fuzhi
      - vis:only:prc
- add:
    entry:
      id: cal.1968-07-28.china-leadership
      when: July 28
      date: '1968-07-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, 3:30–8:30 a.m., receives Nie Yuanzi (Peking University), Kuai Dafu (Tsinghua), Tan Houlan (Peking Normal), Han Aijing (Peking Aeronautics), Wang Dabin (Peking Geology); Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Xie Fuzhi, Huang Yongsheng, Wu Faxian, Ye Qun, Wen Yucheng, Wu De present. On a "black hand" behind the workers: it is he. The students no longer fight, criticize or reform; four ways offered: military control, split in two, "struggle, criticize, leave", fight on. Workers will intervene.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, July 28, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan, Xie Fuzhi, Huang Yongsheng, Wu Faxian, Ye Qun, Nie Yuanzi, Kuai Dafu, Tan Houlan, Han Aijing, Wang Dabin, Wen Yucheng, Wu De.'
      tags:
