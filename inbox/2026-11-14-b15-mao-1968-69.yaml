      when: Sept. 30
      date: '1968-09-30'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: reads a *Renmin ribao* item on the Liuhe May Seventh cadre school in Qing''an county, Heilongjiang; to Yao Wenyuan: print it; the mass sending of cadres to labor an excellent chance to learn again; all but the old and ill, and cadres in office by turns; Group to decide. Printed Oct. 5.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 30, 1968. Made public: 2013. Names: Mao Zedong, Yao Wenyuan.'
