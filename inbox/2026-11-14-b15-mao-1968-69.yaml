- add:
    entry:
      id: cal.1968-05-28.china-leadership
      when: May 28
      date: '1968-05-28'
      thread: china-leadership
      also:
      - south-asia
      c: 'Mao receives Nepal''s Deputy Prime Minister and Foreign Minister Bista, Great Hall; Lin Biao, Zhou Enlai and Chen Yi present. On aid: judge by deeds, whether it helps or undermines; aid with political and economic conditions harms; on India: its people good, its government unfriendly, relations still exist.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 28, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Chen Yi, Bista.'
      tags:
      - polity:prc
