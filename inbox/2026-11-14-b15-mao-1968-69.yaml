      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-28.china-leadership
      when: Mar. 28
      date: '1968-03-28'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with Lin Biao and Zhou Enlai, Zhongnanhai (swimming pool), with Huang Yongsheng, Wu Faxian and Wen Yucheng: his own secretaries only handle papers, staffs must be small; the Military Commission is the Office Group, its standing committee need not meet, the Office Group to add Liu Xianquan and answer to Lin directly, the political work group may go; small transfers of commanders first, large later; Nie Fengzhi not suspended, to study as Chen Zaidao does.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 28, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Huang Yongsheng, Wu Faxian, Wen Yucheng, Liu Xianquan, Nie Fengzhi, Chen Zaidao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:huang-yongsheng
      - name:wu-faxian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-27.china-leadership
      when: Mar. 27
      date: '1968-03-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: revises the Center''s telegram of congratulation to the Communist Party of Burma on twenty years of armed struggle, drafted by the International Liaison Department. Victory of Marxism-Leninism united with Burma''s conditions, not of Mao Zedong Thought; the Cultural Revolution''s meaning for other peoples "in some respects" only. Note: never again in any foreign document or article push Mao Zedong Thought on others. Next day, on Kang Sheng''s self-criticism: noted; Kang, Chen Boda and Yao Wenyuan to hold a meeting or two on foreign publications.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 27, 1968. Made public: 2013. Names: Mao Zedong, Kang Sheng, Chen Boda, Yao Wenyuan.'
      tags:
      - polity:prc
      - polity:burma
      - name:mao-zedong
      - name:kang-sheng
      - name:chen-boda
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-27.china-leadership-2
      when: Mar. 27
      date: '1968-03-27'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with Xu Xiangqian and other marshals, Great Hall: on the Military Commission''s eight orders of 1967, wise after the event; without them it would not have done, but the arrests that followed were too many, as in Sichuan and Wuhan.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 27, 1968. See [[cal.1968-03-27.china-leadership]]. Made public: 2013. Names: Mao Zedong, Xu Xiangqian.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:xu-xiangqian
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-29.china-leadership
      when: Mar. 29
      date: '1968-03-29'
      thread: china-leadership
      c: 'Mao, Peking: Kang Sheng asks whether to print the Burmese Communist Party''s statement for the twentieth anniversary of its armed struggle, which speaks of Mao Zedong Thought. Mao: his people to decide, he will not read it; a foreign party''s internal affairs are its own, China to watch its own propaganda. *Renmin ribao* prints the statement as it stands the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 29, 1968. Made public: 2013. Names: Mao Zedong, Kang Sheng.'
      tags:
      - polity:prc
      - polity:burma
      - name:mao-zedong
      - name:kang-sheng
      - vis:only:prc
- add:
    entry:
      id: cal.1968-03-25.china-leadership-2
      when: Mar. 25–28
      date: '1968-03-25'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Chen Boda and Yao Wenyuan''s editorial "Revolutionary committees are good": Mar. 25, wait a few days and revise; Mar. 28, strikes the phrase calling the three-in-one committee Mao''s creative development of Marxist-Leninist teaching on the state, "a creation of the working class and the masses"; printed Mar. 30 in *Renmin ribao* and *Jiefangjun bao* and in *Hongqi*.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Mar. 25–28, 1968. See [[cal.1968-03-25.china-leadership]]. Made public: 2013. Names: Mao Zedong, Chen Boda, Yao Wenyuan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - name:yao-wenyuan
      - vis:only:prc
- add:
    entry:
      id: cal.1968-04-06.china-leadership
      when: Apr. 6
      date: '1968-04-06'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the Hunan revolutionary committee''s preparatory group asks the Center to approve its founding, naming Yang Chengwu and Zhang Pinghua as the capitalist roaders'' agents; Zhou Enlai asks whether to keep Zhang''s name. Mao strikes the names of Yang and Zhang, to "leave room": naming can come later. The Center''s reply goes out the same day.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 6, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Yang Chengwu, Zhang Pinghua.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1968-04-16.china-leadership
      when: Apr. 16
      date: '1968-04-16'
      thread: china-leadership
      also:
      - king
      - china
      - civil-disorders-king
      c: 'Mao, Peking: reads and lightly revises the draft statement supporting the American Black struggle, sends it to Lin Biao for the Cultural Revolution Group''s meeting to read and pass. Printed Apr. 17 in *Renmin ribao*: King, the non-violent, murdered by American imperialism; the struggle a class struggle, part of the world revolution and a support to the Vietnamese people; China supports it.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 16, 1968. Names: Mao Zedong, Lin Biao, Martin Luther King, Jr..'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:king-martin-luther-jr
