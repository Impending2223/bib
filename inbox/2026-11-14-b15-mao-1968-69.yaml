      id: cal.1968-05-08.china-leadership
      when: May 8
      date: '1968-05-08'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao with the Cultural Revolution Group''s members, Peking: wants Chen Yi, Li Xiannian, Nie Rongzhen, Ye Jianying, Liu Bocheng, Xu Xiangqian and other vice premiers and marshals called in to talk. On the cadres attacked: 95 percent good; no forced confessions, weigh evidence; the Yan''an rule of no killing, few arrests; the "Wu Hao notice" a fake; purges kept within 5 percent.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 8, 1968. Made public: 2013. Names: Mao Zedong, Chen Yi, Li Xiannian, Nie Rongzhen, Ye Jianying, Liu Bocheng, Xu Xiangqian, Liu Bocheng.'
      tags:
      - polity:prc
      - name:mao-zedong
