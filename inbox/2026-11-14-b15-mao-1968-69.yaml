      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Great Hall, evening, with the Cultural Revolution Group and some army leaders: on student disorders, "no suppression, no management, no fear of disorder"; Nie Yuanzi and Kuai Dafu have few followers, Nie only a deputy chairman of Peking''s committee; Guangxi''s armed fighting at Liuzhou and Nanning, with outsiders in it, 18 million rounds seized.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 3, 1968. Made public: 2013. Names: Mao Zedong, Nie Yuanzi, Kuai Dafu, Han Aijing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1968-06-21.china-leadership
      when: June 21
      date: '1968-06-21'
      thread: china-leadership
      also:
      - africa
      c: 'Mao receives Tanzania''s President Nyerere, Great Hall; Lin Biao, Zhou Enlai, Kang Sheng, Huang Yongsheng, Chen Yi and Li Xiannian present. On the Cultural Revolution: Peking''s students and workers upset the world but order held; Kuomintang men kept after 1949 for lack of teachers; the bad few, the good many. De Gaulle''s repression disliked, his resistance to the United States approved.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, June 21, 1968. Made public: 2013. Names: Mao Zedong, Lin Biao, Zhou Enlai, Kang Sheng, Huang Yongsheng, Chen Yi, Li Xiannian, Julius Nyerere.'
