    entry:
      id: cal.1968-08-03.china-leadership
      when: Aug. 3
      date: '1968-08-03'
      thread: china-leadership
      also:
      - africa
      c: Mao receives Guinea's military delegation under Col. Diabi (deputy chief of staff), Great Hall; Zhou Enlai, Chen Boda, Huang Yongsheng and Wang Xinting present. The Cultural Revolution not for export; China's experience partly useful; African coups like the warlord wars, with imperialists behind; be independent of every state.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 3, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Huang Yongsheng, Diabi, Wang Xinting.'
      tags:
      - polity:prc
      - polity:guinea
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:huang-yongsheng
      - vis:only:prc+guinea
- add:
    entry:
      id: cal.1968-08-05.china-leadership
      when: Aug. 5
      date: '1968-08-05'
      thread: china-leadership
      also:
      - south-asia
      c: 'Mao receives Pakistan''s Foreign Minister Arshad Husain and wife, Great Hall; Zhou Enlai, Kang Sheng, Jiang Qing and Han Nianlong present. China, India and Pakistan discussed. Disarmament: "general expansion of arms"; China''s UN seat: the UN has branded China an aggressor; in Vietnam the Americans are not the aggressors in the UN''s eyes, Ho Chi Minh is.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Aug. 5, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kang Sheng, Jiang Qing, Arshad Husain, Han Nianlong.'
      tags:
