      - name:lin-biao
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc
- add:
    entry:
      id: cal.1968-05-29.china-leadership
      when: May 29
      date: '1968-05-29'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: the Foreign Ministry proposes more propaganda of Mao''s thought and support for revolutionary masses in Western Europe and North America. Mao: first, do not impose on others; second, do not say foreign people''s movements come from China''s influence, which the reactionaries can use. The Center and the Group print his note June 8.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, May 29, 1968. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
