      when: Sept. 9
      date: '1968-09-09'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Peking: Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing propose publishing the Selected Works''s seventh volume before the Ninth Congress (articles from the Tenth Plenum of 1962 to the Twelfth Plenum), edited by Kang, Jiang and Yao Wenyuan. Mao: "to be discussed".'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 9, 1968. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Jiang Qing, Yao Wenyuan.'
      tags:
