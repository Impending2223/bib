    entry:
      id: cal.1969-04-13.china-leadership
      when: Apr. 13
      date: '1969-04-13'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, afternoon, with the Cultural Revolution Group, the Office Group and the Congress convenors on the next day''s speeches: Zhou Enlai, Chen Boda, Kang Sheng and Huang Yongsheng, then Wang Hongwen for the workers, Chen Yonggui for the peasants, Wei Fengying for women, Sun Yuguo for the army, Ji Dengkui for cadres; old comrades still sit in front; the Cultural Revolution brought both anarchy and killers who used it; the former are not the main thing.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 13, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng, Wang Hongwen, Chen Yonggui, Wei Fengying, Sun Yuguo, Ji Dengkui.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-boda
      - name:kang-sheng
      - name:huang-yongsheng
      - vis:only:prc
- add:
    entry:
      id: cal.1969-04-14.china-leadership
      when: Apr. 14
      date: '1969-04-14'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      - soviet-union
      c: 'Mao at the Ninth Congress plenary, afternoon: it passes the political report and the Party constitution (the constitution drops members'' rights and writes Lin Biao in as Mao''s successor) and gives both to the secretariat for editing before publication. Mao in his speech praises the frontier troops at Zhenbao, with poor arms and brave, and says the "superstition" has been broken.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969. Made public: 2013. To check: the Congress''s records. To check: the Ninth Congress''s political report and constitution as adopted (cited by [[w.zedong-mao-zedong-nianpu]], VI, Apr. 14, 1969). Names: Mao Zedong, Lin Biao. Check: the chronology''s note, with the editors, on the successor clause is the editors''.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - vis:only:prc
- add:
    entry:
      id: cal.1969-04-15.china-leadership
      when: Apr. 15–18
      date: '1969-04-15'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, Hall 118, afternoon, with the Congress presidium''s secretariat on the election of the Ninth Central Committee: sends the draft rules to the presidium; Apr. 16 the presidium passes them. Apr. 16–18 Zhou''s reports of the delegations'' nominations (421 names by the 45 delegations, perhaps 450, against 60 old Central Committee and Group members, 62 revolutionary cadres, 190 PLA, 107 workers, peasants and intellectuals) are circled.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 15–18, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1969-04-22.china-leadership
      when: Apr. 22
      date: '1969-04-22'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, Hall 118: with Zhou Enlai and others, the preliminary list of the Ninth Central Committee (170 members, 109 alternates, 279). Apr. 20 he had called the Group on the consultation list; Apr. 23 he circles Zhou''s account of the list and the 14 men (Dong Biwu, Xu Shiyou and others) to meet him.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 22, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Dong Biwu, Xu Shiyou.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:dong-biwu
      - name:xu-shiyou
      - vis:only:prc
- add:
    entry:
      id: cal.1969-04-23.china-leadership
      when: Apr. 23
      date: '1969-04-23'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao chairs the enlarged presidium of the Ninth Congress and speaks on the preliminary list of Central Committee members and alternates, which it adopts: many good not on it, not all on it good; the majority new, only 53 of the Eighth''s old members, under a fifth; workers and peasants raised in number, who must not leave production or the masses, or in a year they collapse.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 23, 1969. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1969-04-24.china-leadership
      when: Apr. 24
      date: '1969-04-24'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: The Ninth Congress closes, 4–9:50 p.m. Lin Biao presides. The 1,510 delegates elect 170 members and 109 alternates to the Central Committee, of whom only 53 are of the Eighth; a large number of the Lin Biao and Jiang Qing circles enter it. Mao sees Zhou Enlai and others in Hall 118 at 10 p.m., and again Apr. 25.
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 24, 1969. Names: Mao Zedong, Lin Biao, Zhou Enlai, Jiang Qing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:lin-biao
      - name:zhou-enlai
      - name:jiang-qing
- add:
    entry:
      id: cal.1969-04-26.china-leadership
      when: Apr. 26
      date: '1969-04-26'
      thread: china-leadership
      also:
      - india-and-china-cultural-revolution
      c: 'Mao, evening, with Zhou Enlai and others: the preparatory meeting of the First Plenum of the Ninth Central Committee to be held Apr. 27, naming candidates for the new Politburo and its Standing Committee by secret ballot; the seven briefing proofs (show delegations'' unhappiness that Cultural Revolution Group members did not get unanimous votes, while Wang Jiaxiang and Hu Yaobang got one each) not to be printed lest they press the Committee. Apr. 27: the preparatory meeting nominates; Mao also adds Li Desheng to the Military Commission list.'
      n: '[[w.zedong-mao-zedong-nianpu]], VI, Apr. 26, 1969. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Jiang Qing, Chen Boda, Kang Sheng, Yao Wenyuan, Zhang Chunqiao, Wang Jiaxiang, Hu Yaobang, Li Desheng.'
      tags:
      - polity:prc
