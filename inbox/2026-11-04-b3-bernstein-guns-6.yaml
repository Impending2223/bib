- add:
    entry:
      id: cal.1965-03-23.voting-rights-3
      when: Mar. 23
      date: '1965-03-23'
      thread: voting-rights
      c: 'Senate Judiciary opens hearings on S. 1564, Katzenbach the witness, to Apr. 5; he testifies three days. Ervin: the
        bill an ex post facto law presuming "rascality"; Congress no power over the States'' qualifications for voting; the
        50 percent formulas reach counties with no discrimination, Aroostook County, Me., several in Alaska, 28 in eastern
        North Carolina. Katzenbach: no "punishment"; the Fifteenth Amendment supersedes Article I, Section 2.'
      n: '[Daily Digest, D123](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=121)
        (Mar. 23, 1965) (the hearing and its witness). [[w.bernstein-guns-or-butter]], 237. To check: Voting Rights, Hearings
        Before the Senate Committee on the Judiciary, 89th Cong., 1st sess. (1965), pts. 1 and 2 (cited by [[w.bernstein-guns-or-butter]],
        237 n.6). Check: the days of Ervin''s exchanges. See [[cal.1965-03-17.voting-rights]]. Names: Katzenbach, Ervin.'
      tags:
      - name:katzenbach-nicholas
      - name:ervin-sam-j-jr
      src:
        c: f32e5a87
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=121: A'
        - 'w.bernstein-guns-or-butter 237: all'
        - 'via x.1965-03-23.voting-rights-senate-judiciary-hearings: all'
- add:
    entry:
      id: cal.1965-04-09.voting-rights-2
      when: Apr. 9
      date: '1965-04-09'
      thread: voting-rights
      c: 'House Judiciary''s Subcommittee No. 5, its hearings held Mar. 18 to Apr. 1, reports H.R. 6400 amended, 10 to 1:
        a flat ban on the poll tax in State and local elections; a new Title I of the Civil Rights Act of 1964 for State and
        local elections; a sixth-grade education in English a "rebuttable presumption" of literacy; a finding that a poll
        tax violates the Fourteenth and Fifteenth Amendments.'
      n: '[[w.bernstein-guns-or-butter]], 240. To check: Voting Rights, Hearings Before Subcommittee No. 5 of the House Committee
        on the Judiciary, 89th Cong., 1st sess. (1965) (cited by [[w.bernstein-guns-or-butter]], 240 n.6). See [[cal.1965-03-18.voting-rights]].'
      src:
