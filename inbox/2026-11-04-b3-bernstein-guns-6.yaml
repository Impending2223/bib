        origins system ... he has gotten ... for the first time in our history a limit on all immigration." The Western Hemisphere''s
        average 125,014 a year, 33,496 from Canada, 43,565 from Mexico; "existing restrictions on non-quota immigration in
        reality control immigration from the Western Hemisphere adequately."'
      n: '[[w.bernstein-guns-or-butter]], 255–56 (Schlei''s words; by Bernstein''s reading, this memorandum). To check: Schlei
