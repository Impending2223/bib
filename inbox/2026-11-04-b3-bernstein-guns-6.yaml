      thread: jobs-and-wages-14b
      also:
      - labor
      c: 'Thompson''s Special Subcommittee on Labor opens hearings on H.R. 77 and like bills to repeal 14(b), Wirtz the first
        witness: "right-to-work" nothing to do with the right to a job; repeal would not make the union shop mandatory; the
        State laws breed unfair competition for lower wages. To June 8. For repeal, the AFL-CIO, the Teamsters, the civil
        rights movement, the Central Conference of American Rabbis; against, Reed E. Larson of the National Right to Work
        Committee, the employers'' organizations and the Farm Bureau.'
