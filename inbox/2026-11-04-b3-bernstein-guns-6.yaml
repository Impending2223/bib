      when: Mar., early
      date: 1965-03
      thread: voting-rights
      c: Johnson decides for federal control of registration in all elections, State and local as well as federal, on the
        Fifteenth Amendment, not a constitutional amendment or a federal registrar for federal elections alone.
      n: '[[w.bernstein-guns-or-butter]], 224–25. To check: Katzenbach to Johnson, Legislation to Overcome Voter Apathy and
        Discrimination, n.d., White Papers, LBJ Library; Issues to be Resolved on the Voting Legislation, n.d., Legislative
        Background, Voting Rights Act of 1965, LBJ Library; White to Johnson, Mar. 4, 1965, M. L. King, Jr., File, LBJ Library
        (cited by [[w.bernstein-guns-or-butter]], 224–25 n.4). Check: the day. See [[cal.1965-01-08.voting-rights]]. Names:
        Johnson.'
