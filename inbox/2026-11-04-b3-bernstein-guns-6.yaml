- add:
    entry:
      id: cal.1965-02-15.voting-rights
      when: Feb. 15
      date: '1965-02-15'
      thread: voting-rights
      c: 'Morrisson to Schlei, of the Justice Department, on the meeting with Scammon, former Director of the Census and chairman
        of the President''s Committee on Registration and Voting Participation: abolishing the literacy tests "a difficult
        political judgment"; "many honest and fair-minded men who feel that a literacy requirement is reasonable and beneficial."
        Four of his committee voted against abolition. In Hawaii the 1964 referendum to end the test fails, 72,500 to 77,200,
        48.4 percent.'
      n: '[[w.bernstein-guns-or-butter]], 225 (the figures as Bernstein rounds them). To check: Morrisson to Schlei, Meeting
        with Richard Scammon, Feb. 15, 1965, Legislative Background, Voting Rights Act of 1965, LBJ Library (cited by [[w.bernstein-guns-or-butter]],
        225 n.4). Check: Hawaii''s returns. See [[cal.1964-12-14.voting-rights]]. Names: Schlei, Scammon.'
      tags:
      - name:schlei-norbert-a
      - name:scammon-richard-m
      src:
        c: cd635893
        rows:
        - 'w.bernstein-guns-or-butter 225: all'
        - 'via x.1965-02-15.morrisson-to-schlei-meeting-with-richard-scammon: A-B'
