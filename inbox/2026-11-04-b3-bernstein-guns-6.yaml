      when: Mar. 23
      date: '1965-03-23'
      thread: voting-rights
      c: 'Cox to Katzenbach, on the bill''s 50 percent formulas: it "goes far to demonstrate the lack of any but a coincidental
        relationship between racial discrimination and the facts. ... One might equally well make the Act applicable to any
        State whose name begins with Vi or Mi or Lo or Al or Ge or So." He proposes language; the administration and Dirksen
        agree on three amendments.'
      n: '[[w.bernstein-guns-or-butter]], 237–38. To check: Cox to Katzenbach, Mar. 23, 1965, Legislative Background, Voting
        Rights Act of 1965, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 238 n.6). Check: the day of the three amendments.
        See [[cal.1965-03-17.voting-rights]]. Names: Cox, Katzenbach, Dirksen.'
      tags:
