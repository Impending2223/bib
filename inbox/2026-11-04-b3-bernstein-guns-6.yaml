- add:
    entry:
      id: cal.1965-03-18.voting-rights-selma-4
      when: Mar. 18
      date: '1965-03-18'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Johnson in his office with Moyers, Katzenbach, Ramsey Clark, Burke Marshall and Ellington of the Office of Emergency
        Preparedness, Vance consulted, on troops for the march: an "adequate" level, "if you haven''t enough you will wish
        you had"; "I want professionals there, not drugstore cowboys." Vance: a military police battalion near Selma, another
        near Birmingham, the Alabama Guard federalized, General Henry V. Graham to command. Katzenbach: the Governor must
        say he cannot keep order. Ellington telephones Wallace, who agrees to ask for federal help.'
      n: '[[w.bernstein-guns-or-butter]], 231–32 (by Valenti''s notes). To check: Valenti''s Notes, Meeting in the President''s
        Office, Mar. 18, 1965, Legislative Background, Voting Rights Act of 1965, LBJ Library (cited by [[w.bernstein-guns-or-butter]],
        232 n.5). Check: Bernstein''s text gives "late Tuesday afternoon" (Mar. 16); the note cites the notes of Mar. 18.
        See [[cal.1965-03-07.voting-rights]]. Names: Johnson, Moyers, Katzenbach, Ramsey Clark, Burke Marshall, Ellington,
        Vance, Wallace.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:katzenbach-nicholas
      - name:clark-ramsey
      - name:marshall-burke
      - name:ellington-buford
      - name:vance-cyrus
      - name:wallace-george-c
      src:
        c: 3fcce3f6
        rows:
        - 'w.bernstein-guns-or-butter 231–32: all'
        - 'via x.1965-03-18.valentis-notes-meeting-in-the-presidents-office: all'
- add:
    entry:
      id: cal.1965-03-19.voting-rights-selma-2
      when: Mar. 19
      date: '1965-03-19'
      thread: voting-rights-selma
      also:
      - civil-rights-the-executive
      c: 'Moyers telephones Johnson at the Ranch the substance of a long memorandum, by Bernstein''s reading the FBI''s: King
        has told Rustin and Wachtel of a rift with SNCC, Forman having called for the government''s violent overthrow; SNCC,
        King understands, would provoke a riot at Montgomery to "get a martyr in Alabama." Rustin: King to "divorce himself
        from SNCC publicly" after the march. The Bureau expects more than 5,000 by Mar. 21; King, 9,000 leaving Selma, 25,000
        entering Montgomery.'
      n: '[[w.bernstein-guns-or-butter]], 233. To check: Moyers to Johnson, Mar. 19, 1965, Legislative Background, Voting
        Rights Act of 1965, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 233 n.5). See [[cal.1965-03-07.voting-rights]].
        Names: Moyers, Johnson, Martin Luther King, Rustin, Forman.'
      tags:
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:king-martin-luther-jr
      - name:rustin-bayard
      - name:forman-james
      src:
        c: f299d959
        rows:
        - 'w.bernstein-guns-or-butter 233: all'
        - 'via x.1965-03-19.moyers-to-lbj-with-7-00: all'
