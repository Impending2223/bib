- add:
    entry:
      id: cal.1961-01-17.vietnam
      when: Jan. 17
      date: '1961-01-17'
      thread: vietnam
      c: 'Lansdale to Gates, on his trip: Vietnam "in a critical condition," to be treated "as a combat area of the cold war, as an area requiring emergency treatment." Unless the Vietnamese mobilize and Washington reorients its support, "the free Vietnamese and their government probably will be able to do no more than postpone eventual defeat."'
      n: '[FRUS 1961–63, I, doc. 2](https://history.state.gov/historicaldocuments/frus1961-63v01/d2) (editorial note, quoting the first). [[w.marolda-united-states-navy-and]], 98–99 (the second, "postpone eventual defeat"). To check: [[w.united-states-vietnam-relations]], bk. 11, 1–12 (the memorandum, as FRUS cites it). See [[cal.1961-01-02.vietnam]]. Names: Lansdale, Gates.'
      src:
        c: '450be825'
        rows:
