      c: 'Eisenhower for Nixon in Cleveland and Pittsburgh. Cleveland, the Public Square: "this young genius" and the Joint
        Chiefs; "the White House is one place where we should not depend upon, and cannot afford, on-the-job training of the
        occupant." Pittsburgh: "the juggling of promises by the inexperienced"; "a time for woodshed honesty."'
