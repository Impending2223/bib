      c: 'Senate. Scott (R-Pa.), on Kennedy''s remarks in Oregon as the Portland *Oregonian* reported them: for the President
        to apologize to Khrushchev "would be appeasement." Kennedy reads the recording of his answers to students at a school
        there: "I do not think that the timing of the U-2 incident is defensible"; an apology "might have been possible to
        do"; "If he had merely asked that the United States should express regret then that would have been a reasonable term."
        Scott: "If I have been unfair, the Senator from Massachusetts has my apology."'
