      date: 1963-03
      thread: jobs-and-wages
      c: After the floods of Mar. 11–12 in the Cumberlands, Governor Combs meets federal officials on disaster relief. Whisman's
        last item on the agenda, an Appalachian regional commission; McDermott agrees, and next day tells Combs the President
        does too.
      n: '[[w.sundquist-politics-and-policy]], 101–02. Check: the day. See [[cal.1963-01.jobs-and-wages]]. Names: Combs,
        McDermott.'
