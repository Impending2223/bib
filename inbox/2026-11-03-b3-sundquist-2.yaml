- add:
    entry:
      id: cal.1961-06-08.economy
      when: June 8
      date: '1961-06-08'
      thread: economy
      also:
      - congress
      c: 'Mills opens the House debate on the tax rate extension bill, H.R. 7446. A tax cut must wait for a surplus, as
        George Humphrey told Ways and Means: "the time to reduce taxes as such is when you can foresee a surplus out of
        which those tax reductions can be made; and that you do not as a general principle reduce taxes in order to increase
        deficit spending."'
      n: 'Mills, [107 Cong. Rec. 9778](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-1-1.pdf#page=10)
        (June 8, 1961). [[w.sundquist-politics-and-policy]], 42. Names: Mills, Humphrey.'
      tags:
      - name:mills-wilbur-d
      - name:humphrey-george-m
      src:
        c: d1e77b0e
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt8/pdf/GPO-CRECB-1961-pt8-1-1.pdf#page=10: all'
        - 'w.sundquist-politics-and-policy 42: all'
        - 'via w.sundquist-politics-and-policy 42 n.92: all'
