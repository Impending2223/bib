      id: cal.1962-06-14.economy
      when: June 14
      date: '1962-06-14'
      thread: economy
      also:
      - republican-party-congress
      c: 'Capehart in the Senate: cut taxes $10 billion and spending $15 billion before the session ends. "The administration
        has proposed a tax cut only. But any reduction in income without a corresponding reduction in expenditures is unrealistic."'
      n: 'Capehart, [108 Cong. Rec. 10539](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt8/pdf/GPO-CRECB-1962-pt8-4-2.pdf#page=11)
        (June 14, 1962). [[w.sundquist-politics-and-policy]], 43 n.94. Names: Capehart.'
      tags:
