      when: June 6
      date: '1962-06-06'
      thread: economy
      also:
      - republican-party-congress
      c: 'Morton in the Senate: with a tax cut promised for 1963, the administration should lay aside the tax bill before
        the Finance Committee. Carlson agrees: "We need a reduction in Federal spending and at the same time a reduction
        in taxes."'
      n: 'Morton, Carlson, [108 Cong. Rec. 9847](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-13-2.pdf#page=18)
        (June 6, 1962). [[w.sundquist-politics-and-policy]], 43 n.94 (Carlson). Names: Morton, Carlson.'
      tags:
