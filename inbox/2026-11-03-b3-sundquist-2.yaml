- add:
    entry:
      id: cal.1964-01-21.poverty
      when: Jan. 21
      date: '1964-01-21'
      thread: poverty
      c: 'The staff''s outline of the community action program: in each community a single body to coordinate public and
        private efforts; a comprehensive plan, some action meanwhile. Of $500 million, $50 million for planning, $275 million
        for new programs, $173 million to add to federal programs. Wirtz answers it by memorandum: poverty is lack of income;
        begin with jobs.'
      n: '[[w.sundquist-politics-and-policy]], 141. See [[cal.1963-12.poverty]]. Names: Wirtz.'
      tags:
      - name:wirtz-w-willard
      src:
        c: d3cc274b
        rows:
        - 'w.sundquist-politics-and-policy 141: all'
