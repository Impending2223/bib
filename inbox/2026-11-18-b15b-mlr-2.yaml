      thread: china-leadership
      also:
      - china
      c: 'Tan Zhenlin, passing on the spirit of the Politburo session to the Party leadership of the Ministry of Aquatic Products, ends: forward in defense of the Party center, of Mao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Lin Biao; topple and wipe out whoever dares oppose them.'
