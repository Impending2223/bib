      also:
      - china
      at: before 1966-06-21
      c: 'Peking, the Great Hall of the People. Liu Shaoqi, at Deng Xiaoping''s arrangement, briefs senior "democratic personages" on the Cultural Revolution and the purge of the four. Seen as a class matter, he says, their action appears normal, not strange: their class made them do it.'
      n: '[[w.macfarquhar-maos-last-revolution]], 46–47. Made public: 2006. To check: [[w.chedi-cuihui-shiqi-nian]], 71 (cited by [[w.macfarquhar-maos-last-revolution]], 46 n.60); [[w.chedi-cuihui-shiqi-nian]], 67 (cited by [[w.macfarquhar-maos-last-revolution]], 47 n.61); [[w.chedi-cuihui-shiqi-nian]], 68 (cited by [[w.macfarquhar-maos-last-revolution]], 47 n.62). Names: Liu Shaoqi, Deng Xiaoping. Check: the day.'
