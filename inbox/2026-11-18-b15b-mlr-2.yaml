      id: cal.1968.china-leadership-3
      when: '1968'
      date: '1968'
      thread: china-leadership
      also:
      - china
      c: Deng Xiaoping, in a letter to the CC, admits "political responsibility" for handling the bugging devices Yang Shangkun installed in an untimely and sloppy fashion.
      n: '[[w.macfarquhar-maos-last-revolution]], 37. Made public: 2006. To check: [[w.canyue-cailiao]], X, 18 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.22). Names: Deng Xiaoping. Check: the day.'
      tags:
      - polity:prc
