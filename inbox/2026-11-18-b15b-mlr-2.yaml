      date: 1965-11
      thread: china-leadership
      also:
      - china
      at: after 1965-11-10
      c: Peng Zhen forbids the *People's Daily* and the other national, provincial and municipal papers to reprint Yao Wenyuan's article.
      n: '[[w.macfarquhar-maos-last-revolution]], 18. Made public: 2006. See [[cal.1965-11-10.china-leadership]]. Names: Peng Zhen, Yao Wenyuan. Check: the day.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:yao-wenyuan
