- add:
    entry:
      id: cal.1965-11.china-leadership-6
      when: Nov., after the 10th
      date: 1965-11
      thread: china-leadership
      also:
      - china
      at: after 1965-11-10
      c: 'Peking. The *Wenhui bao*''s chief correspondent in the capital rings the editor-in-chief of Peng Zhen''s *Beijing Daily* for reactions to Yao Wenyuan''s article. The editor asks Peng''s right-hand man for propaganda what to say. Answer: tell him what the weather is like today.'
      n: '[[w.macfarquhar-maos-last-revolution]], 18. Made public: 2006. To check: [[w.fangeming-xiuzhengzhuyi-fenzi-fan]], 18 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.11). See [[cal.1965-11-10.china-leadership]]. Names: Peng Zhen, Yao Wenyuan. Check: the day.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:yao-wenyuan
      - vis:only:prc
      src:
        c: 519be173
        rows:
        - 'w.macfarquhar-maos-last-revolution 18: all'
- add:
    entry:
      id: cal.1965-11-28.china-leadership-3
      when: By Nov. 28
      date: '1965-11-28'
      thread: china-leadership
      also:
      - china
      c: Besides the Shanghai papers, only six provincial Party organs in eastern China have reprinted Yao Wenyuan's article.
      n: '[[w.macfarquhar-maos-last-revolution]], 18. To check: [[w.qian-wenge-mantan]], item no. 1 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.12). See [[cal.1965-11-10.china-leadership]]. Names: Yao Wenyuan. Check: the days of the reprints.'
      tags:
      - polity:prc
      - name:yao-wenyuan
      src:
        c: dab01812
        rows:
        - 'w.macfarquhar-maos-last-revolution 18: all'
- add:
    entry:
      id: cal.1965-11-29.china-leadership-2
      when: Nov. 29
      date: '1965-11-29'
      thread: china-leadership
      also:
      - china
      c: 'Peking. Knowing Mao is behind Yao Wenyuan''s article, Peng Zhen lets the *Beijing Daily* reprint it. Deng Tuo, the municipal secretary for culture and education, writes the editorial note: an open academic debate on the nature of Wu Han''s play.'
      n: '[[w.macfarquhar-maos-last-revolution]], 18. To check: [[w.pixian-chen-pixian-huiyilu]], 34 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.14); Peng Zhen, speech to a conference of cultural bureau chiefs, Sept. 23, 1965, in [[w.zhen-peng-zhen-wenxuan-1941]], 355–357, 355–357 (cited by [[w.macfarquhar-maos-last-revolution]], 18 n.15). See [[cal.1965-11-26.china-leadership-3]], [[cal.1965-11-30.china-leadership-2]]. Names: Peng Zhen, Yao Wenyuan. Check: MacFarquhar (18) has Peng add the challenging comment that "people are all equal before the truth", undated.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:yao-wenyuan
      src:
        c: 66bebe20
        rows:
        - 'w.macfarquhar-maos-last-revolution 18: all'
- add:
