      date: 1966-05
      thread: china-leadership
      also:
      - china
      at: after 1966-05-04
      c: 'Peking. Kang Sheng to the enlarged Politburo meeting, on behalf also of Lin Biao: the "really soul-stirring" passage of the Notification is in its last section.'
      n: '[[w.macfarquhar-maos-last-revolution]], 47. Made public: 2006. To check: [[w.nianyi-da-dongluande-niandai]], 10 (cited by [[w.macfarquhar-maos-last-revolution]], 47 n.65). See [[cal.1966-05-16.china-leadership]]. Names: Kang Sheng, Lin Biao. Check: the day; MacFarquhar (47) has Kang say it "on one of the first days of the session".'
