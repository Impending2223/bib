      id: cal.1966.china-leadership
      when: 1966, early
      date: '1966'
      thread: china-leadership
      also:
      - china
      c: 'Ye Qun finds out who wrote the anonymous letters to her calling her a woman of easy virtue and Lin Biao a cuckold: Yan Weibing, the wife of Lu Dingyi. She decides to make a case of it.'
      n: '[[w.macfarquhar-maos-last-revolution]], 35. Made public: 2006. To check: [[w.xingxing-sese-de-anjian]], 18–33 (cited by [[w.macfarquhar-maos-last-revolution]], 35 n.15). Names: Ye Qun, Lin Biao, Lu Dingyi. Check: the day.'
