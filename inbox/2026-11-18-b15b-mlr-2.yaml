- add:
    entry:
      id: cal.1960.china-leadership-2
      when: '1960'
      date: '1960'
      thread: china-leadership
      also:
      - china
      c: Formal regulations are put in place, with Mao's approval, on when meetings may be tape-recorded and when not.
      n: '[[w.macfarquhar-maos-last-revolution]], 36. Made public: 2006. To check: [[w.zilong-ye-zilong-huiyilu]], 225 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.19); Hongying (Red Eagle) (Beijing), Sept. 14, 1967, 2 (cited by [[w.macfarquhar-maos-last-revolution]], 36 n.20). Names: Mao Zedong. Check: the day; MacFarquhar (36) also has Mao grumble in the winter of 1959–60 about the General Office''s "excessive" use of tape recorders.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 6a07f9f0
        rows:
        - 'w.macfarquhar-maos-last-revolution 36: all'
- add:
    entry:
      id: cal.1961.china-leadership-8
      when: '1961'
      date: '1961'
      thread: china-leadership
      also:
      - china
      c: Mao, finding that his flirtations with a female attendant have been taped, is livid. Several of Yang Shangkun's subordinates are blamed, demoted or sent away from the General Office. At Mao's insistence all existing tapes are destroyed, after a team of secretaries under Deng Xiaoping has transcribed part of them.
      n: '[[w.macfarquhar-maos-last-revolution]], 36–37. Made public: 2006. To check: [[w.shangkun-yang-shangkun-riji-2]], I, 716 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21a); [[w.zilong-ye-zilong-huiyilu]], 223–231 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21b); Su Shaozhi, interview by Michael Schoenhals, April 1992 (cited by [[w.macfarquhar-maos-last-revolution]], 37 n.21c). Names: Mao Zedong, Deng Xiaoping. Check: the day.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: 3b8b2d12
        rows:
        - 'w.macfarquhar-maos-last-revolution 36–37: all'
- add:
