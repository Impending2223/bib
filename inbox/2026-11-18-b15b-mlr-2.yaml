      when: Dec.
      date: 1965-12
      thread: china-leadership
      also:
      - china
      c: Peng Zhen instructs Deng Tuo to organize a group to write articles proving that Wu Han's errors are academic, not political.
      n: '[[w.macfarquhar-maos-last-revolution]], 18. Made public: 2006. See [[cal.1965-11-29.china-leadership]]. Names: Peng Zhen. Check: the day.'
      tags:
      - polity:prc
      - name:peng-zhen
      - vis:only:prc
