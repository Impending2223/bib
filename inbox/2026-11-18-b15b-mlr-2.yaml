      date: '1966-02-12'
      thread: china-leadership
      also:
      - china
      c: Peng Zhen's group sends the printed February Outline back to Peking with a short preamble, the one part not shown to Mao. The Standing Committee members there again endorse it.
      n: '[[w.macfarquhar-maos-last-revolution]], 30. Made public: 2006. See [[cal.1966-02-12.china-leadership-2]]. Names: Peng Zhen, Mao Zedong. Check: the day of the endorsement.'
