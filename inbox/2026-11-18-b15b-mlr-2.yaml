- add:
    entry:
      id: cal.1966-05.china-leadership-2
      when: May, before the 16th
      date: 1966-05
      thread: china-leadership
      also:
      - china
      at: before 1966-05-16
      c: Mao tells Chen Boda and Kang Sheng that the passages he has added to the draft Notification are meant to be "inflammatory".
