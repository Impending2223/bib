      when: Nov. 11
      date: '1965-11-11'
      thread: china-leadership
      also:
      - china
      c: Shanghai. The Party committee's organ, the *Liberation Daily*, reprints Yao Wenyuan's article of Nov. 10.
      n: '[[w.macfarquhar-maos-last-revolution]], 18. See [[cal.1965-11-10.china-leadership]]. Names: Yao Wenyuan.'
