      date: 1966-06
      thread: china-leadership
      also:
      - china
      at: before 1966-06-11
      c: 'Liu Shaoqi, in private conversation with a fellow Hunanese, an old white-area cadre with whom he worked in the 1930s, criticizes the force of the purges and the PLA''s role: it is not protecting the healthy progress of the movement or the old cadres, but standing by with folded arms until leaders collapse.'
      n: '[[w.macfarquhar-maos-last-revolution]], 63. Made public: 2006. To check: [[w.macfarquhar-origins-of-the-cultural]], I, 334–335 n.59 (cited by [[w.macfarquhar-maos-last-revolution]], 63 n.57); Gao Wenhua, "Buchong wo he Liu Shaoqi zai Zhongnanhai mimou de zuixing" (Additions to the Crimes Plotted by Myself and Liu Shaoqi in Zhongnanhai), written deposition submitted to the Ministry of Foreign Trade, Feb. 12, 1971, 3 (cited by [[w.macfarquhar-maos-last-revolution]], 63 n.58). Names: Liu Shaoqi. Check: the day.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: 5bba0426
        rows:
        - 'w.macfarquhar-maos-last-revolution 63: all'
