      id: cal.1966-02-20.china-leadership-2
      when: Feb. 20
      date: '1966-02-20'
      thread: china-leadership
      also:
      - china
      c: Peng Zhen visits Sichuan, to Feb. 28 by one chronology; back in Peking Mar. 6 by another. He meets Li Jingquan.
      n: '[[w.macfarquhar-maos-last-revolution]], 49. Made public: 2006. To check: [[w.chang-mao]], 528 (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73a); [[w.dongbing-zuichude-kangzheng]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73b); [[w.peng-zhen-zuie-shi]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73c); [[w.dadao-li-jingquan]] (cited by [[w.macfarquhar-maos-last-revolution]], 49 n.73d). Names: Peng Zhen, Li Jingquan. Check: MacFarquhar (49 n.73): *Peng Zhen zuie shi* has Peng in Sichuan Feb. 20–28 and meeting Li Jingquan; *Dadao Li Jingquan* has him arrive in "late February" and return Mar. 6; neither mentions a meeting with Peng Dehuai, as Chang and Halliday (528) have it.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:li-jingquan
      - vis:only:prc
      src:
        c: 6ed2ea00
        rows:
