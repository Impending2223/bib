patch: 2026-11-18-b15b-mlr-2
by: 'Claude (batch 15, second wave: MacFarquhar and Schoenhals, *Mao''s Last Revolution*, run 2: the leftovers of pp. 1–65 and pp. 66 onward, with their notes), Nov. 18, 2026'
ops:
- add:
    entry:
      id: cal.1964-12.china-leadership
      when: Dec.
      date: 1964-12
      thread: china-leadership
      also:
      - china
      c: Peking. At a top-level conference Mao challenges Liu Shaoqi's handling of the rural socialist education movement, and accuses Liu and Deng Xiaoping of trying to stop him speaking by leaving him out. He produces his Party card and a copy of the constitution to show he has the right to be there and be heard.
      n: '[[w.macfarquhar-maos-last-revolution]], 13. Made public: 2006. See [[cal.1964-12-15.china-leadership]]. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping. Check: the day; MacFarquhar (13) has "by the end of 1964" and "a top-level conference"; the Central Work Conference opened Dec. 15.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
      src:
        c: 5c961b43
        rows:
        - 'w.macfarquhar-maos-last-revolution 13: all'
- add:
    entry:
      id: cal.1965-01.china-leadership-3
      when: Jan.
      date: 1965-01
      thread: china-leadership
      also:
      - china
      c: 'Lin Biao''s instructions on PLA work go to Mao and Liu Shaoqi. Mao writes on them: agree entirely. Liu: approve entirely.'
      n: '[[w.macfarquhar-maos-last-revolution]], 21. Made public: 2006. To check: [[w.zhonggong-dangshi-jiaoxue-cankao]], XXIV, 554–557 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.28). Names: Lin Biao, Mao Zedong, Liu Shaoqi. Check: the day; MacFarquhar (21) says "when shown", and that the instructions were circulated in January 1965.'
      tags:
      - polity:prc
      - name:lin-biao
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
      src:
        c: bab2e4bf
        rows:
        - 'w.macfarquhar-maos-last-revolution 21: all'
- add:
    entry:
      id: cal.1965-01.china-leadership-4
      when: Jan.
      date: 1965-01
      thread: china-leadership
      also:
      - china
      c: Luo Ruiqing edits Lin Biao's instructions on PLA work for circulation, adding that even where necessary there must be no indiscriminate assaults on military training and production. By one biographer's count he alters them in seventy-eight places. The instructions are circulated.
      n: '[[w.macfarquhar-maos-last-revolution]], 21. Made public: 2006. To check: [[w.yao-san-ci-da-nan]], 238–246 (cited by [[w.macfarquhar-maos-last-revolution]], 21 n.29). Names: Luo Ruiqing, Lin Biao. Check: the day.'
      tags:
      - polity:prc
      - name:luo-ruiqing
      - name:lin-biao
      - vis:only:prc
      src:
        c: e5b8b2ba
        rows:
        - 'w.macfarquhar-maos-last-revolution 21: all'
- add:
    entry:
      id: cal.1965.china-leadership
      when: 1965, mid-year
      date: '1965'
      thread: china-leadership
      also:
      - china
      c: 'Lin Biao begins a secret dossier on Luo Ruiqing: his "sinister designs" and his "arrogant and imperious" attitude to giving prominence to politics. Li Zuopeng, the navy''s political commissar, and a few other senior officers are ready to testify to Luo''s "erroneous opinions".'
      n: '[[w.macfarquhar-maos-last-revolution]], 21–22. Made public: 2006. To check: [[w.nianyi-da-dongluande-niandai-revised]], 86–87 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.31); [[w.yao-san-ci-da-nan]], 266–273 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.32a); [[w.yao-luo-ruiqing-zhuanlue-xia]], 179 (cited by [[w.macfarquhar-maos-last-revolution]], 22 n.32b). See [[cal.1965-12-01.china-leadership]]. Names: Lin Biao, Luo Ruiqing, Li Zuopeng. Check: the day.'
      tags:
      - polity:prc
      - name:lin-biao
      - name:luo-ruiqing
      - name:li-zuopeng
      - vis:only:prc
      src:
        c: 018c3f6b
        rows:
        - 'w.macfarquhar-maos-last-revolution 21–22: all'
- add:
    entry:
      id: cal.1965-11.china-leadership-4
      when: Nov., after the 10th
      date: 1965-11
      thread: china-leadership
      also:
      - china
      at: after 1965-11-10
      c: Mao leaves Peking by train for Shanghai. He spends the next eight months alternating between Shanghai and a few other cities of the lower Yangtze, Hangzhou and Wuhan among them. He will not set foot in Peking again until mid-July.
      n: '[[w.macfarquhar-maos-last-revolution]], 19. Made public: 2006. To check: [[w.mao-zedong-yu-zhejiang]], 165–169 (cited by [[w.macfarquhar-maos-last-revolution]], 19 n.17); [[w.jianshe-wenge-shiqi-mao-zedong]], no. 1 (2005), 24–30; no. 2 (2005), 44–49 (cited by [[w.macfarquhar-maos-last-revolution]], 19 n.18). See [[cal.1965-11-10.china-leadership]]. Names: Mao Zedong. Check: the day.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
      src:
        c: 777b4d17
        rows:
        - 'w.macfarquhar-maos-last-revolution 19: all'
