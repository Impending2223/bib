- add:
    entry:
      id: cal.1965-12.china-leadership-3
      when: Dec.
      date: 1965-12
      thread: china-leadership
      also:
      - china
      c: Shanghai. Peng Zhen meets Zhang Chunqiao. Zhang assures him it is all a scholarly discussion and proposes how it should proceed. Peng approves, and promises Zhang a Peking duck dinner in the capital when the debate has run its course.
      n: '[[w.macfarquhar-maos-last-revolution]], 18–19. Made public: 2006. To check: [[w.pixian-chen-pixian-huiyilu]], 36 (cited by [[w.macfarquhar-maos-last-revolution]], 19 n.16). Names: Peng Zhen, Zhang Chunqiao. Check: the day; MacFarquhar (18) places the meeting after Peng''s December instruction to Deng Tuo.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:zhang-chunqiao
      - vis:only:prc
      src:
        c: 14dddd79
        rows:
        - 'w.macfarquhar-maos-last-revolution 18–19: all'
- add:
    entry:
      id: cal.1965-12.china-leadership-4
      when: Late 1965 or early 1966
      date: 1965-12
      thread: china-leadership
      also:
      - china
      c: 'Shanghai. Zhang Chunqiao, in a small room of their hotel, meets members of the U.S. Progressive Labor Party who have come secretly to China. By one visitor''s later account: the CCP has been wrong and may be again; Mao is ready to go back to the mountains and start the revolution again; fellow Communists should criticize the CCP sharply. They talk for hours.'
      n: '[[w.macfarquhar-maos-last-revolution]], 16. Made public: 2006. To check: Email from Jake Rosen, a founding member of the U.S. Progressive Labor Party, to MacFarquhar, June 2005 (cited by [[w.macfarquhar-maos-last-revolution]], 16 n.7). Names: Zhang Chunqiao, Mao Zedong. Check: the date; the visitor''s email of June 2005 (16 n.7) says "late 1965 or early 1966".'
      tags:
      - polity:prc
      - name:zhang-chunqiao
      - name:mao-zedong
      - vis:only:prc+us
      src:
        c: 51a9bfc9
        rows:
        - 'w.macfarquhar-maos-last-revolution 16: all'
