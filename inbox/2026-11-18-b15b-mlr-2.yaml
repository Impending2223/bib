      at: before 1966-04-21
      c: '*Hongqi* (No. 6) runs a commentator''s article: the participation of the worker-peasant-soldier masses in academic criticism is a major epoch-making event.'
      n: '[[w.macfarquhar-maos-last-revolution]], 53. To check: Gong nong bing qun zhong canjia xueshu pipan shi hua shidaide da shi (The Participation of the Worker-Peasant-Soldier Masses in Academic Criticism Is a Major Epoch-making Event), Hongqi (Red Flag), no. 6 (1966), 20–22, 20–22 (cited by [[w.macfarquhar-maos-last-revolution]], 53 n.7). See [[cal.1966-04-18.china-leadership]]. Check: the day.'
