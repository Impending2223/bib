- edit:
    id: cal.1963-12-02.civil-rights-bill
    base: 2cebf224
    set:
      c: 'Johnson to Bolling, evening, in confidence: the discharge petition: "I think it''s got to go." Bolling counts about 160 Democrats, the Republicans "up in the air." Johnson: a vote against signing a vote against civil rights. Whitney Young with Johnson the same day.'
- edit:
    id: cal.1963-12-13.economy
    base: 62f1d925
    set:
      c: 'Johnson to Byrd: "I''m working in [sic] my budget every night"; "You can tell your grandchildren you were the senator who finally got a President to cut his budget"; the amendments voted before the recess. Byrd, "tired of this talking": "Right."'
