    set:
      n: 'Washington''s reading of Hanoi''s statements after it: [FRUS 1964–68, I, doc. 48](https://history.state.gov/historicaldocuments/frus1964-68v01/d48) (State''s intelligence bureau, Feb. 15, 1964). [[w.vietnam-victory-in-vietnam]], 124–26, 460 n.10; [[w.asselin-hanois-road-to-the]], 162–68 (the plenum; the decisive victory in a short time, the main forces, the North''s aid, complete units to go south); [[w.nguyen-hanois-war]], 63–68. Made public: the plenum''s communiqué on the world situation, Jan. 20, 1964, the resolution on the South kept secret (Asselin, 164; Nguyen, 66); Lê Duẩn''s speech at the plenum, *Học Tập*, February 1964 (Nguyen, 66); the history''s Hanoi edition, 1988 (Check: an earlier printing). Check: Asselin, 162 n.139, has the plenum open Nov. 22, the day not certain, and still sitting Dec. 25 (163); Nguyen, 64, 66, has it in December.'
