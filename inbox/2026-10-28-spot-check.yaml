- edit:
    id: cal.1961-04-21.king
    base: 4a27d433
    set:
      c: 'King at the White House to see Wofford; Kennedy stops by, five minutes. No word of civil rights, King recalls: the Bay of Pigs two days past. His letter of Mar. 16 asking a conference unanswered but for O''Donnell''s advice to try again in late April. A brief talk with Robert Kennedy at Justice the week before, on the bus terminals.'
