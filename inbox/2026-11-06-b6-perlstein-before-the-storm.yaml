- add:
    entry:
      id: cal.1963-05-29.elections-1964
      when: May 29
      date: '1963-05-29'
      thread: elections-1964
      c: 'Kennedy''s forty-sixth birthday, an impromptu party of the White House staff, Salinger presiding. His gifts: boxing gloves for the showdown with Wallace; a model space capsule to be passed to Goldwater, its card wishing him a good trip.'
      n: '[[w.perlstein-before-the-storm]], 207. To check: [[w.carter-politics-of-rage-1995]], 133 (cited by [[w.perlstein-before-the-storm]], 207 n.1). Names: Kennedy, Salinger, Wallace, Goldwater.'
      src:
        c: dca80cf9
        rows:
        - 'w.perlstein-before-the-storm 207: all'
      tags:
      - 'name:kennedy-john-f'
      - 'name:salinger-pierre'
      - 'name:wallace-george-c'
      - 'name:goldwater-barry-m'
- add:
    entry:
      id: cal.1964-07.elections-1964-san-francisco-5
      when: July
      date: 1964-07
      thread: elections-1964-san-francisco
      c: 'Laird''s draft of the Republican platform, written to Goldwater''s views, ready before the platform committee''s debate the week before the convention.'
      n: '[[w.perlstein-before-the-storm]], 367. To check: [[w.kessel-goldwater-coalition]], 107 (cited by [[w.perlstein-before-the-storm]], 367 n.1). Check: the day; Perlstein gives none. Names: Laird, Goldwater.'
      src:
        c: 196bf56f
        rows:
        - 'w.perlstein-before-the-storm 367: all'
      tags:
      - 'name:laird-melvin-r'
      - 'name:goldwater-barry-m'
- add:
    entry:
      id: cal.1964-07-11.elections-1964-san-francisco
      when: July 11
      date: '1964-07-11'
      thread: elections-1964-san-francisco
      c: 'San Francisco, Goldwater''s quarters on the seventeenth floor. Goldwater, Baroody, Karl Hess and the rest of the brain trust on the acceptance speech: Hess''s conciliatory draft rejected; Goldwater gives Jaffa the new draft.'
      n: '[[w.perlstein-before-the-storm]], 390. To check: [[w.edwards-goldwater]], 266–69; [[w.goldwater-goldwater]], 185; [[w.shadegg-what-happened-to-goldwater]], 166 (cited by [[w.perlstein-before-the-storm]], 390 n.1). Check: the day; Perlstein gives "the previous Saturday." Names: Goldwater, Baroody, Karl Hess, Jaffa.'
      src:
        c: e5c75f65
        rows:
        - 'w.perlstein-before-the-storm 390: all'
      tags:
      - 'name:goldwater-barry-m'
      - 'name:baroody-william-j-jr'
      - 'name:hess-karl'
      - 'name:jaffa-harry-v'
- add:
    entry:
      id: cal.1964-07-16.elections-1964-san-francisco
      when: July 16
      date: '1964-07-16'
      thread: elections-1964-san-francisco
      c: 'Before dawn, the acceptance speech''s final text approved, after days of work in Baroody''s room. Jaffa''s line on extremism, from his memorandum to the platform committee, kept against half the group: Goldwater orders it underlined twice.'
      n: '[[w.perlstein-before-the-storm]], 390. To check: [[w.edwards-goldwater]], 266–69; [[w.goldwater-goldwater]], 185; [[w.shadegg-what-happened-to-goldwater]], 166 (cited by [[w.perlstein-before-the-storm]], 390 n.1). See [[cal.1964-07-11.elections-1964-san-francisco]]. Names: Baroody, Jaffa, Goldwater.'
      src:
        c: 14dc5fa4
        rows:
        - 'w.perlstein-before-the-storm 390: all'
      tags:
      - 'name:baroody-william-j-jr'
      - 'name:jaffa-harry-v'
      - 'name:goldwater-barry-m'
