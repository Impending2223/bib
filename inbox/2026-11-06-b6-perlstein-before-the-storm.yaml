      when: Feb.
      date: 1961-02
      thread: goldwater
      c: Goldwater organizes a congressional wing of the Air National Guard, the 9999th Air Reserve Squadron.
      n: '[[w.perlstein-before-the-storm]], 138. Check: the month; Perlstein gives "that winter" of 1961. Names: Goldwater.'
