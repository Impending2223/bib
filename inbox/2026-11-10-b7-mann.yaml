      c: 'Los Angeles, after the offer. O''Donnell to Kennedy on choosing Johnson: "the worst mistake you ever made," going
        "against all the people who supported you." Kennedy: "I''m forty-three years old, and I''m ... not going to die
        in office"; with Johnson Vice President, Mansfield leader in the Senate, "somebody I can trust and depend on"; the
        offer, accepted or not, to keep Johnson and Rayburn friendly until Congress adjourns. By O''Donnell''s account.'
      n: '[[w.mann-walls-of-jericho]], 276–77. To check: [[w.odonnell-johnny-we-hardly-knew]], 217–18 (cited by [[w.mann-walls-of-jericho]],
        276–77). See [[cal.1960-07-14.elections-1960]]. Names: O''Donnell, Kennedy, Johnson, Mansfield, Rayburn.'
