    entry:
      id: cal.1968-07-16.elections-1968-humphrey
      when: July 16
      date: '1968-07-16'
      thread: elections-1968-humphrey
      c: Humphrey to Schlesinger, a letter of two and a half pages, single-spaced, "extremely egotistical, ungenerous, intemperate
        and, on occasion, even ugly in tone," in Schlesinger's words. It answers Schlesinger's letter explaining why he cannot
        come out for Humphrey, which David Ginsburg had shown Humphrey with Schlesinger's leave. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 296 (the journal of July 17: "yesterday I received"). Check: the day (the day of receipt;
        the page gives none for the letters'' dates). Names: Humphrey, Schlesinger, Ginsburg.'
      tags:
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
      - name:ginsburg-david
- add:
    entry:
      id: cal.1968-07-17.elections-1968-6
      when: July 17
      date: '1968-07-17'
      thread: elections-1968
      c: 'The Century, lunch, Kissinger with Schlesinger and Stephen Schlesinger. Kissinger on his first meeting with Johnson,
        over the Hanoi negotiations: he said they should not bomb Hanoi while he was passing messages to the North Vietnamese;
        others objected that it would endanger American security. His answer: "I cannot believe that the security of the United
        States will be endangered if for a little while we do not bomb within ten miles of the capital of a fifth-rate agricultural
        power." Johnson: "OK, we will do it the professor''s way." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 296 (the meeting itself undated; the page gives Johnson''s further words). Names: Kissinger,
        Johnson, Schlesinger.'
      tags:
      - name:kissinger-henry-a
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - city:nyc
- add:
    entry:
      id: cal.1968-08-08.elections-1968-5
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968
      c: 'McGovern, by telephone from South Dakota, late in the evening, to Schlesinger, back in New York: he will announce
        for the presidency Saturday. Unruh, Mankiewicz and Salinger had encouraged him to think he could get perhaps 100 votes
        in California; other prospects in Iowa, New York and, after the first ballot, Massachusetts; his South Dakota people
        urge him on; "why not?" By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 296–97 (the journal of Aug. 9: "On Thursday I flew back to New York"). Names: McGovern,
        Schlesinger, Unruh, Mankiewicz, Salinger.'
      tags:
      - name:mcgovern-george
      - name:schlesinger-arthur-m-jr
      - name:unruh-jesse-m
      - name:mankiewicz-frank
      - name:salinger-pierre
      - state:sd
      - state:ny
- add:
    entry:
      id: cal.1968-08-24.elections-1968-chicago-8
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      c: 'Chicago. Schlesinger, with Richard Wade, to see McGovern, "placid, modest and agreeable": he thinks he has 130 votes,
        not counting California (about 50) and New York. Ribicoff had called on his own initiative to ask how he could help;
        Mayor Cavanaugh of Detroit is to come out for him the next day; hope of Fulbright, Symington, Gaylord Nelson, Burdick
        and one or two others. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 297. Check: the day (the entry is headed Aug. 24; the visit''s day is not stated). Names:
        Schlesinger, McGovern, Ribicoff, Fulbright, Symington, Nelson, Burdick.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mcgovern-george
      - name:ribicoff-abraham
      - name:fulbright-j-william
      - name:symington-william-s
      - name:nelson-gaylord-a
      - name:burdick-quentin-n
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-25.elections-1968-chicago-kennedy
      when: Aug. 25
      date: '1968-08-25'
      thread: elections-1968-chicago-kennedy
      c: 'Chicago, Sunday afternoon. California delegates to Schlesinger: Edward Kennedy could get the nomination only if
        he came in as an active candidate against Humphrey. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 298. Names: Kennedy, Humphrey, Schlesinger.'
      tags:
      - name:kennedy-edward-m
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
      - state:ca
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-kennedy
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago-kennedy
      c: 'Chicago, after dinner, by telephone. Edward Kennedy to Schlesinger: "I have a gut feeling that this is not the year,
        that it is too early for me"; he expects Humphrey to win on the first ballot; "We''ve called off" DiSalle, who had
        planned to nominate him; "I don''t plan to do a thing. If the convention wants me, they will be doing this on their
        own." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 298–99. Check: the day (the call follows the paragraph on "Monday morning"; the page
        gives no day). Names: Kennedy, Schlesinger, Humphrey, DiSalle.'
      tags:
      - name:kennedy-edward-m
      - name:schlesinger-arthur-m-jr
      - name:humphrey-hubert-h
      - name:disalle-michael-v
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-10-14.elections-1968-humphrey
      when: Oct. 14
      date: '1968-10-14'
      thread: elections-1968-humphrey
      c: 'David Ginsburg telephones Schlesinger, in the morning: Humphrey had asked him the night before whether Schlesinger
        would do anything for him in the election. "I will if he asks me directly." Ginsburg: "I will see that he does so."
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 300. See [[cal.1968-07-16.elections-1968-humphrey]]. Names: Ginsburg, Humphrey, Schlesinger.'
      tags:
      - name:ginsburg-david
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-10-14.elections-1968-humphrey-2
      when: Oct. 14
      date: '1968-10-14'
      thread: elections-1968-humphrey
      c: 'Humphrey telephones Schlesinger, ninety minutes after Ginsburg''s call: the tide of reaction, the need to rally
        the liberals. On Vietnam he means to go further, but a State Department official has advised him to stay where he
        is for a few days; McGeorge Bundy''s Saturday speech has "legitimatized" the antibombing position, and he called Bundy
        the night before. He hopes Schlesinger will talk to his "academic friends." Schlesinger will come out for him, and
        has not written speeches since 1963. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 300–01. See [[cal.1968-10-14.elections-1968-humphrey]]. Names: Humphrey, Schlesinger,
        Bundy.'
      tags:
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1968-12.transition-and-staff-3
      when: Dec.
      date: 1968-12
      thread: transition-and-staff
      c: 'Princeton, a few words between Schlesinger and Kissinger. Asked whether Nixon is turning out as he expected, Kissinger,
        "enigmatically": he has been reassured on certain things that worried him but is meeting "other and unexpected qualities
        which might create problems." Told Schlesinger is glad he has been appointed: "I hope you will feel equally glad about
        it a year from now." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 302 (the journal of Dec. 11: "last week"). Check: the day ("last week"; the page gives
        none). Names: Kissinger, Nixon, Schlesinger.'
      tags:
      - name:kissinger-henry-a
      - name:nixon-richard-m
      - name:schlesinger-arthur-m-jr
      - state:nj
- add:
    entry:
      id: cal.1969-01-14.press-and-broadcasting
      when: Jan. 14
      date: '1969-01-14'
      thread: press-and-broadcasting
      c: 'A National Education Television commentary on Johnson''s last State of the Union message, that night: Moyers, Valenti,
        Eric Goldman, Sorensen (in Kansas City) and Schlesinger. Schlesinger writes that he felt "nothing at all except disappointment
        over the flatness of the speech." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 305. See [[cal.1969-01-14.program]]. Names: Moyers, Valenti, Goldman, Sorensen, Schlesinger,
        Johnson.'
      tags:
      - name:moyers-bill
      - name:valenti-jack
      - name:goldman-eric-f
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1969-01-14.transition-and-staff-2
      when: Jan. 14
      date: '1969-01-14'
      thread: transition-and-staff
      c: 'The Algonquin, a drink after the panel. Moyers to Schlesinger on writing about Johnson: no one would believe it;
        "He is a sick man." Moyers and Goodwin had become so concerned that they decided to read up on mental illness, Goodwin
        on paranoia, Moyers on the manic-depressive cycle. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 305–06 (the reading undated). See [[cal.1969-01-14.press-and-broadcasting]]. Names:
        Moyers, Goodwin, Johnson, Schlesinger.'
      tags:
      - name:moyers-bill
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-04-25.republican-party
      when: Apr. 25
      date: '1967-04-25'
      thread: republican-party
      c: 'A *Newsweek* party. Rockefeller to Grace Kennan McClatchy, whom Schlesinger introduces as George Kennan''s daughter:
        is her father "really sure that this woman who says she is Svetlana Stalin is Svetlana Stalin"? Her father had met
        her only once, in the thirties; Rockefeller offers a theory that she may be a double agent sent to the United States.
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 262. Names: Rockefeller, Kennan, Schlesinger.'
      tags:
      - name:rockefeller-nelson
      - name:kennan-george-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1967-05-03.defense
      when: May 3
      date: '1967-05-03'
      thread: defense
      c: 'Syracuse airport, late afternoon, by telephone. McNamara, who has come out of a meeting to take Schlesinger''s call,
        wants to talk with him; he cannot see him Saturday, May 6, the day of the Heineman Committee. McNamara: "There''s
        no point in your listening to me. I''ve been wrong from the start on Vietnam. The record shows that. I want to hear
        your ideas." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 262–63 (the journal of May 13: "On May 3"). Names: McNamara, Schlesinger.'
      tags:
      - name:mcnamara-robert-s
      - name:schlesinger-arthur-m-jr
      - state:ny
- add:
    entry:
      id: cal.1967-05-07.students
      when: May 7
      date: '1967-05-07'
      thread: students
      c: 'Cambridge, Dana Street. Schlesinger with Students for a Democratic Society leaders, a meeting arranged by Chrissie.
        Their interest: local organization of labor and the poor, Harvard matters. On American society, "the big corporations
        run everything"; they acknowledge "a growing sense within the New Left of the inevitability of violence—defensive,
        of course." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 260–61 (the journal of May 13: "Sunday, the 7th"). Names: Schlesinger.'
      tags:
      - name:schlesinger-arthur-m-jr
      - state:ma
- add:
    entry:
      id: cal.1967-09-23.democratic-party
      when: Sept. 23–24
      date: '1967-09-23'
      thread: democratic-party
      c: 'Washington, the national board of Americans for Democratic Action, "on the verge of a split" between the pro-Johnson
        labor members and the liberals opposed to the war. Neither side wishes a showdown: the board votes down a "dump-Johnson"
        resolution, then attacks the war "vigorously." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 263 (the journal of Sept. 26: "this weekend"). Check: the day (the weekend of Sept.
        23–24; the page gives no day for the vote). Names: Schlesinger, Johnson.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-17.democratic-party-2
      when: Oct. 17
      date: '1967-10-17'
      thread: democratic-party
      c: 'McGovern to Schlesinger, by telephone: McCarthy has "about decided to go," to enter the New Hampshire, Wisconsin,
        California and Massachusetts primaries against Johnson. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 263–64 (the journal of Oct. 18: "yesterday"). See [[cal.1967-10-17.democratic-party]]
        (McGovern''s call to Robert Kennedy that day). Names: McGovern, McCarthy, Johnson, Schlesinger.'
      tags:
      - name:mcgovern-george
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - state:nh
      - state:wi
      - state:ca
      - state:ma
- add:
    entry:
      id: cal.1967-11-04.robert-kennedy-campaign
      when: Nov. 4–5
      date: '1967-11-04'
      thread: robert-kennedy-campaign
      c: 'Hickory Hill, Saturday night and the next morning. Robert Kennedy to Schlesinger, who had written him of a change
        in his own views: a challenge to Johnson now would be taken, Schlesinger writes, as evidence of "his ruthlessness,
        his ambition and of a personal vendetta"; McCarthy''s entry will help open things up; he can only wait, hoping that
        as McCarthy beats Johnson in primaries State leaders will come to him and ask him to run. He is "refurbishing his
        national contacts." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 264 (the journal of Nov. 7). Check: the day (the editors'' bracket, "[Saturday]"). See
        [[cal.1967-11-03.robert-kennedy-campaign]]. Names: Kennedy, Schlesinger, Johnson, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:mccarthy-eugene-j
      - state:va
- add:
    entry:
      id: cal.1967-11-29.robert-kennedy-campaign
      when: Nov. 29
      date: '1967-11-29'
      thread: robert-kennedy-campaign
      c: 'New York, the King Cole Bar, 11 p.m. Robert Kennedy on McCarthy, who had come to see him "the other day" and stayed
        seven minutes without asking a question: McCarthy should enter New Hampshire, say he does not expect to win, walk
        the streets without entourage, run against the organization, and not talk much of Vietnam. Kennedy doubts Johnson
        can get more than 20,000 votes there and thinks McCarthy has a good chance of winning. Only New Hampshire and Wisconsin
        matter; he will have to "fish or cut bait" within a couple of weeks after New Hampshire. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 265–66. See [[cal.1967-11-29.robert-kennedy-2]]. Names: Kennedy, McCarthy, Johnson,
        Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - state:nh
      - state:wi
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-12-01.republican-party
      when: Dec. 1
      date: '1967-12-01'
      thread: republican-party
      c: 'The Century, lunch, Kissinger and Lippmann with Schlesinger, the talk implicitly on Rockefeller. Kissinger: he brings
        in a group of experts each week to brief Rockefeller; Rockefeller''s views on Vietnam are identical with his own;
        he opposes further escalation and doubts the administration on negotiation; from his dealings with Johnson over a
        Hanoi peace feeler he has come away with the conviction that Johnson''s resistance to negotiation "verges on a sort
        of madness"; practically anyone would be better than Johnson. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 266–67. Names: Kissinger, Lippmann, Rockefeller, Johnson, Schlesinger.'
      tags:
      - name:kissinger-henry-a
      - name:lippmann-walter
      - name:rockefeller-nelson
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1967-11-26.democratic-party
      when: Nov. 26
      date: '1967-11-26'
      thread: democratic-party
      c: 'P. J. Clarke''s, Sunday night, the evening of Goodwin''s return from England and Morocco. Goodwin to Schlesinger,
        "without especially documenting": Johnson is governed by motives so personal and irrational that his continuation
        in office would be disastrous. He tells of a White House evening when Johnson said the *New York Times* and the *Washington
        Post* were run by Communists, meaning it literally. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 267 (the journal of Dec. 1: "Sunday night"; the White House evening undated). See [[cal.1967-11-26.robert-kennedy]].
        Names: Goodwin, Johnson, Schlesinger.'
      tags:
      - name:goodwin-richard-n
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-17.elections-1968-mccarthy-2
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968-mccarthy
      c: 'McCarthy, in an item in the Chicago *Sun-Times* read to Schlesinger by telephone that day by Richard Wade, attacks
        him sarcastically for abandoning his campaign. Schlesinger: he was never in it and has spoken to McCarthy only once
        in six months. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 284. Check: the day (the item is read to Schlesinger on Mar. 17; the page does not date
        the remark). See [[cal.1968-03-17.elections-1968-mccarthy]]. Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
      - state:il
- add:
    entry:
      id: cal.1968-05-27.elections-1968-mccarthy
      when: May 27
      date: '1968-05-27'
      thread: elections-1968-mccarthy
      c: 'McCarthy, in Oregon, attacks Schlesinger on the ground that he "defected" from his campaign; Schlesinger: he was
        never a part of it. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 289–90. Check: the day (the journal of May 27: "is now attacking me in Oregon"; the
        page gives no day). Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
      - state:or
