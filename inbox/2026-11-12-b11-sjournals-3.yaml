patch: 2026-11-12-b11-sjournals-3
by: Claude (batch 11 reader, Schlesinger Journals 1967 to Jan. 20, 1969)
ops:
- cite:
    id: cal.1967-04-18.democratic-party
    item: '[[w.schlesinger-journals]], 258–59 (the dinner with Humphrey, Schlesinger and Wechsler, "last night," in Washington;
      Humphrey for the war, on "militant, aggressive Chinese communism" and a "physical barrier across the northern part of
      South Vietnam," Ky now backing it; not Rauh''s house, the number at table or "a great idea")'
    units: '?'
- check:
    id: cal.1967-04-18.democratic-party
    text: 'Check: the day: [[w.schlesinger-journals]], 258, in an entry headed Apr. 18, has the dinner "last night," Apr.
      17.'
- cite:
    id: cal.1967-09-23.robert-kennedy
    item: '[[w.schlesinger-journals]], 263 (the dinner at Hickory Hill Saturday night, Lowenstein with Loeb and Newfield:
      Johnson could be beaten "in a string of primaries"; Kennedy attracted, Schlesinger writes, by his thesis; not the hour
      or Kennedy''s words)'
    units: B
- cite:
    id: cal.1967-11-29.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 264–65 (around eleven at the King Cole Bar, with Salinger, the vanden Heuvels and Tom
      Johnson; the McNamara leak from London; "Wouldn''t any self-respecting man ... have his resignation on the President''s
      desk half an hour after he heard the London bulletin?"; the *Times* headline when they broke up around one; not the
      afternoon papers)'
    units: B, C, D, F
- cite:
    id: cal.1967-12-10.robert-kennedy
    item: '[[w.schlesinger-journals]], 268–70 (a Sunday luncheon at vanden Heuvel''s; those present; Schlesinger and Goodwin
      for running in 1968; Edward Kennedy and Sorensen for waiting, 1972; "He would die and make Hubert President rather than
      let me get it"; "he supposed he would do nothing, and nothing would happen"; no final decisions for a few more weeks;
      not the city)'
    units: B, C, D, E, F, G
- cite:
    id: cal.1968-01-17.robert-kennedy
    item: '[[w.schlesinger-journals]], 273–75 (Wednesday, Jan. 17, Lippmann''s apartment, Kennedy and Schlesinger; the California
      primary and Johnson''s stopping the bombing; Lippmann: "whether you did everything you could do to avert this catastrophe";
      not the city or Kennedy''s having no support)'
    units: C, D
- cite:
    id: cal.1968-01-25.robert-kennedy-campaign-decision
    item: '[[w.schlesinger-journals]], 275–76 (dinner at La Caravelle with Ethel Kennedy and Schlesinger and his wife; his
      brother Ted "the strongest opponent of his moving"; Ethel for it; not the Schmidts, the quotation, Schlesinger''s stand
      at the table or the *Pueblo* reserves)'
    units: B
- cite:
    id: cal.1968-02-16.elections-1968
    item: '[[w.schlesinger-journals]], 277–79 (Friday, Feb. 16, lunch with Rockefeller and Kissinger; Schlesinger''s speech
      on the disenfranchised young, Rockefeller: "I couldn''t agree more"; "You know, I have my roots in the New Deal"; not
      Romney, the primaries or the eighteen governors)'
    units: F
- variant:
    id: cal.1968-02-16.elections-1968
    unit: A
    witness: w.schlesinger-journals
    reads: 'Schlesinger: the lunch "took place at 13 West 54th Street in a high-ceilinged, second-floor apartment"'
    at: '277'
- cite:
    id: cal.1968-03-10.robert-kennedy-campaign
    item: '[[w.schlesinger-journals]], 279 (Sunday, Mar. 10, at the Galbraiths'' in Cambridge: Ethel Kennedy, who had just
      spoken to Robert Kennedy in California, transmits "the long awaited message": he would definitely run if McCarthy could
      be persuaded to withdraw; not Mar. 11)'
    units: A
- cite:
    id: cal.1968-03-12.robert-kennedy-campaign
    item: '[[w.schlesinger-journals]], 280 (Tuesday night, after dinner at Armstrong''s, Robert Kennedy at the 21 Club with
      vanden Heuvel and Tom Johnson, "a little subdued"; McCarthy''s success had boxed him in: "I don''t blame him at all";
      Schlesinger''s suggestion that he endorse McCarthy; not the United Jewish Appeal dinner or "no surprise")'
    units: '?'
- cite:
    id: cal.1968-03-13.elections-1968
    item: '[[w.schlesinger-journals]], 280–81 (the afternoon meeting at Stephen Smith''s apartment, some fourteen named; Edward
      Kennedy sets out the options; Sorensen proposes that Kennedy stay neutral between McCarthy and Johnson; the Cronkite
      interview watched; not Salinger''s or Marshall''s position, Johnson''s commission or the Cronkite interview''s words)'
    units: B
- cite:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    item: '[[w.schlesinger-journals]], 282–83 (a party in progress at Hickory Hill; Dutton and Sorensen dismayed by it; the
      serious talk with Kennedy, Walinsky, Lowenstein, Greenfield and Stevens, Schlesinger and vanden Heuvel stressing conciliation
      of McCarthy''s people; Edward Kennedy back from McCarthy: "Very unsatisfactory," and to vanden Heuvel "Abigail said
      no"; at breakfast Schlesinger and vanden Heuvel propose that Kennedy come out for McCarthy, which both Kennedys and
      Sorensen thought preferable; not "long planned," the hour of Edward Kennedy''s return or his coming from Green Bay)'
    units: E
- variant:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    unit: B
    witness: w.schlesinger-journals
    reads: 'Schlesinger: "Finally around 10:30 we settled down with Bobby for a serious talk"'
    at: '282'
- variant:
    id: cal.1968-03-15.robert-kennedy-campaign-2
    unit: H
    witness: w.schlesinger-journals
    reads: 'Schlesinger: Kennedy, to Edward Kennedy, Sorensen, vanden Heuvel and Schlesinger at the breakfast table: "Look,
      fellows, I can''t do that. I can''t come out for McCarthy. Let''s not talk about that anymore. I''m going ahead, and
      there is no point in talking about anything else."'
    at: '283'
- cite:
    id: cal.1968-03-16.robert-kennedy-campaign-2
    item: '[[w.schlesinger-journals]], 284 (the announcement "in the Caucus Room in the Old Senate Office Building—where JFK
      had announced at the same age, eight years earlier"; Schlesinger, Dutton and vanden Heuvel watch on television in Edward
      Kennedy''s office; not the words of the statement)'
    units: A
- cite:
    id: cal.1968-03-31.robert-kennedy
    item: '[[w.schlesinger-journals]], 285 (the night of Mar. 31, Schlesinger finds at the apartment Dutton, Sorensen, vanden
      Heuvel, Walinsky and others; Sorensen has written a telegram to Johnson requesting a meeting; Kennedy on the telephone
      with political figures around the country; Kennedy "supposed to arrive in New York that evening at 9:45"; not the landing,
      Burns or the telegram''s text or time)'
    units: '?'
- cite:
    id: cal.1968-04-03.robert-kennedy
    item: '[[w.schlesinger-journals]], 286 (Kennedy to Schlesinger by telephone that evening: the meeting "friendly enough,"
      Johnson "planned for the time being to stay out of the presidential contest," Kennedy would appreciate being told if
      he changed his mind; not Sorensen, the fund-raising dinners or Johnson''s options)'
    units: '?'
- cite:
    id: cal.1968-06-06.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 291, 293 (Schlesinger among those waiting that evening at Butler Aviation for the plane
      bearing the body from Los Angeles; the family, then a special Mass at St. Patrick''s; not Rockefeller, Air Force One
      or LaGuardia)'
    units: '?'
- cite:
    id: cal.1968-06-08.robert-kennedy
    item: '[[w.schlesinger-journals]], 294 (Saturday morning, "the service"; Edward Kennedy''s eulogy "superbly"; by bus to
      Penn Station and by train to Washington, the tracks lined with people, some crying, in the hot sun, the train behind
      schedule; Arlington after nightfall, the last words said over the casket; not St. Patrick''s, Johnson, or the grave''s
      place)'
    units: C
- cite:
    id: cal.1968-08-10.elections-1968-2
    item: '[[w.schlesinger-journals]], 296–97 (Aug. 8, a message from McGovern''s office that he had decided to announce for
      the presidency "on Saturday"; McGovern by telephone that night: Unruh, Mankiewicz and Salinger encouraged him; not his
      statement)'
    units: '?'
- cite:
    id: cal.1968-08-27.elections-1968-chicago-18
    item: '[[w.schlesinger-journals]], 297 (the Chicago trip, "back at a Democratic convention," after Robert Kennedy''s death,
      for the weekend, to help McGovern, before going with his wife to Hong Kong "on Tuesday"; the trip to Japan reinstated;
      not the button, the opening or Japan as the destination)'
    units: '?'
- add:
    entry:
      id: cal.1968-01-09.robert-kennedy-campaign-decision
      when: Jan. 9
      date: '1968-01-09'
      thread: robert-kennedy-campaign-decision
      c: 'New York, Orsini''s, late Tuesday night. Robert Kennedy to Schlesinger, joining him after dinner with Roger Stevens:
        Jesse Unruh and other California politicians want him to enter the California primary and assure him he can win; he
        is skeptical of their motives, they want it to help themselves, not him. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 273 (the journal''s Jan. 10: "last night (Tuesday)"). See [[cal.1968-01-09.robert-kennedy]].
        Names: Kennedy, Unruh, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:unruh-jesse-m
      - name:schlesinger-arthur-m-jr
      - state:ca
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-01-19.robert-kennedy-campaign-decision
      when: Jan. 19
      date: '1968-01-19'
      thread: robert-kennedy-campaign-decision
      c: 'Schlesinger, at St. Paul''s School, telephones McGovern about Robert Kennedy''s running. McGovern, whom Kennedy
        had asked a month before to take soundings: he had talked with Gaylord Nelson, Church, Burdick, Governor Hughes of
        Iowa and others; "universal reluctance even to consider the possibility"; all agree Kennedy would run better, but
        "No one was ready to stick his neck out." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 275 (the journal''s Jan. 19: "this morning"; the soundings undated, "a month ago"; the
        quotation is Schlesinger''s paraphrase of McGovern except the last sentence). See [[cal.1968-01-17.robert-kennedy]].
        Names: Schlesinger, McGovern, Kennedy, Nelson, Church, Burdick, Hughes.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mcgovern-george
      - name:kennedy-robert-f
      - name:nelson-gaylord-a
      - name:church-frank
      - name:burdick-quentin-n
      - name:hughes-harold-e
- add:
    entry:
      id: cal.1968-01-25.robert-kennedy-campaign-decision-2
      when: Jan. 25
      date: '1968-01-25'
      thread: robert-kennedy-campaign-decision
      c: 'Patrick Lucey of Wisconsin with Robert Kennedy, in the afternoon: Lucey advises him against running. By Kennedy''s
        word to Schlesinger at dinner that evening, in Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 276. See [[cal.1968-01-25.robert-kennedy-campaign-decision]]. Names: Lucey, Kennedy,
        Schlesinger.'
      tags:
      - name:lucey-patrick
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:wi
- add:
    entry:
      id: cal.1968-02-16.defense-clifford
      when: Feb. 16–17
      date: '1968-02-16'
      thread: defense-clifford
      c: 'Hickory Hill, a party before Ethel Kennedy''s telethon. McNamara, "gray and desperately tired," to Schlesinger:
        he cannot wait for March 1; for his *Meet the Press* of Feb. 4 he was called "at five minutes to eleven on the Friday
        night preceding," in the hospital where he was visiting his wife, told they wanted him to do it and would announce
        it on the eleven o''clock news; acutely nervous until the broadcast, not wanting to say what he did not believe on
        Vietnam nor to let the administration down. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 278–79. Check: the day (the entry of Feb. 19 puts the party after the lunch of Friday,
        Feb. 16, and gives no day). Names: McNamara, Schlesinger.'
      tags:
      - name:mcnamara-robert-s
      - name:schlesinger-arthur-m-jr
      - state:va
- add:
    entry:
      id: cal.1968-03-12.elections-1968-johnson
      when: Mar. 12
      date: '1968-03-12'
      thread: elections-1968-johnson
      c: 'Dinner at Ham Armstrong''s. Moyers to Schlesinger: Johnson now "well sealed off from reality," the White House atmosphere
        "impenetrable"; he explains away all criticism as personal or political antagonism; Moyers uses the word "paranoid";
        four more years of Johnson would be ruinous. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 280. Check: the day (the editors'' bracket, "[Tuesday]"). See [[cal.1968-03-12.robert-kennedy-campaign]],
        whose note has these remarks from [[w.schlesinger-robert-kennedy-and-his]], 848–49 ("on the way"); the journal has
        them at the dinner, Moyers and Schlesinger in talk. Names: Moyers, Johnson, Schlesinger.'
      tags:
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-03-13.robert-kennedy-campaign-decision-2
      when: Mar. 13
      date: '1968-03-13'
      thread: robert-kennedy-campaign-decision
      c: 'New York, Stephen Smith''s apartment, evening, after the meeting of the afternoon. Kenneth O''Donnell to Schlesinger,
        with Dutton, both dissatisfied: "What Bobby has to decide is who is first. Personally I think Uncle Sam is first and
        RFK second." "The right thing to do is for him to run and not worry about the consequences to himself." O''Donnell
        and Dutton: the planning that evening "hopelessly amateurish," weeks and months behind. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 281. See [[cal.1968-03-13.elections-1968]]. Names: O''Donnell, Dutton, Kennedy, Schlesinger,
        Smith.'
      tags:
      - name:odonnell-kenneth-p
      - name:dutton-frederick-g
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:smith-stephen-e
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-13.robert-kennedy-campaign-decision-3
      when: Mar. 13
      date: '1968-03-13'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy to Schlesinger, after the evening at Stephen Smith''s: "Are you happy about this?"; and "But you
        have some reservations, don''t you?" Schlesinger says he has none and that Kennedy must decide soon; Kennedy: within
        the next thirty-six hours. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 281. See [[cal.1968-03-13.robert-kennedy-campaign-decision]]. Names: Kennedy, Schlesinger,
        Smith.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:smith-stephen-e
- add:
    entry:
      id: cal.1968-03-14.robert-kennedy-campaign-decision
      when: Mar. 14
      date: '1968-03-14'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy sees McCarthy. Friendly, "did not go very far": Kennedy congratulates him and says he is reassessing
        his own situation; McCarthy: Kennedy has a perfect right to go ahead, he does not intend to get out himself; he repeats
        that he would serve one term only, and, "while I''m not making an offer," Kennedy might be the logical successor.
        By Kennedy''s account to Schlesinger, in the journal.'
      n: '[[w.schlesinger-journals]], 281–82. Check: the day (the editors'' bracket, "[the next day]," after the meeting at
        Smith''s of Mar. 13; the page gives no day, place or hour). Names: Kennedy, McCarthy, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-03-16.robert-kennedy-campaign-decision
      when: Mar. 16
      date: '1968-03-16'
      thread: robert-kennedy-campaign-decision
      c: 'Hickory Hill, early morning, after Edward Kennedy''s report on his talk with McCarthy. Robert Kennedy, in pajamas,
        to Schlesinger: "What do you think I should do?" Schlesinger: if McCarthy will not collaborate and a Kennedy–McCarthy
        contest splits the anti-Johnson vote in a State and elects a Johnson delegation, some will be slow to forgive him;
        why not come out for McCarthy? Kennedy: "I can''t do that. It would be too humiliating. Kennedys don''t act that way."
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 283. Check: the hour (four hours after bed at 1:30, then "an hour or so later"; the
        page gives none). See [[cal.1968-03-15.robert-kennedy-campaign-2]]. Names: Kennedy, Schlesinger, McCarthy, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:mccarthy-eugene-j
      - name:johnson-lyndon-b
      - name:kennedy-edward-m
      - state:va
- add:
    entry:
      id: cal.1968-03-17.elections-1968-mccarthy
      when: Mar. 17
      date: '1968-03-17'
      thread: elections-1968-mccarthy
      c: 'A McCarthy fund-raising breakfast, Sunday morning. Schlesinger, who had agreed to speak a fortnight before: now
        that Kennedy has announced, he is for Kennedy, but for McCarthy in Ohio and Wisconsin, and glad to speak for him.
        About $8,000 raised. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 284. See [[cal.1968-03-16.robert-kennedy-campaign-2]]. Names: Schlesinger, Kennedy,
        McCarthy.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:oh
      - state:wi
- add:
    entry:
      id: cal.1968-03-19.robert-kennedy-campaign
      when: Mar. 19
      date: '1968-03-19'
      thread: robert-kennedy-campaign
      c: 'Robert Kennedy telephones Schlesinger from Hickory Hill, about nine, for half an hour, Ethel placing the call: "Are
        you glad I''m doing this?" Schlesinger: yes, and he was wrong in telling him "not to run on Saturday morning." Kennedy:
        "Well, you were right earlier, and I was wrong then." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 285. See [[cal.1968-03-16.robert-kennedy-campaign-2]]. Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:va
- add:
    entry:
      id: cal.1968-04-02.robert-kennedy-campaign-3
      when: Apr. 2
      date: '1968-04-02'
      thread: robert-kennedy-campaign
      c: 'Dinner at Diana Vreeland''s, Schlesinger, Jacqueline Kennedy and Paul Mathias of *Paris-Match*, watching the Wisconsin
        returns. Jacqueline Kennedy, aside, to Schlesinger on Robert Kennedy: "Do you know what I think will happen to Bobby
        if he is elected President?" "The same thing that happened to Jack. ... There is so much hatred in this country, and
        more people hate Bobby than hate Jack. That''s why I don''t want him to be President." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 285–86. See [[cal.1968-04-02.robert-kennedy]]. Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-jacqueline
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:wi
- add:
    entry:
      id: cal.1968-04-03.robert-kennedy-campaign-2
      when: Apr. 3
      date: '1968-04-03'
      thread: robert-kennedy-campaign
      c: 'Ethel Kennedy telephones Schlesinger about seven in the evening and puts Robert Kennedy on. His meeting with Johnson
        "friendly enough." Schlesinger: pace the campaign, do not exhaust himself in the first weeks; Kennedy: "I know the
        limits of my strength very well." He agrees on some sober speeches and wants particularly one on how to avoid future
        Vietnams. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 286. See [[cal.1968-04-03.robert-kennedy]]. Names: Kennedy, Johnson, Schlesinger.'
      tags:
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-04-03.elections-1968-johnson
      when: Apr. 3
      date: '1968-04-03'
      thread: elections-1968-johnson
      c: 'Johnson with David Karr, an hour: "terrifying," by Karr''s account to Schlesinger the next day. Johnson, full of
        self-pity over the Kennedy attitude toward him: "Then my partner died, and I took over the partnership." Bitter about
        Robert Kennedy: "On civil rights I was stronger than he was"; the credibility gap began in the Kennedy administration,
        with the Bay of Pigs. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 286–87 (the journal of Apr. 4: "yesterday"). See [[cal.1968-04-03.elections-1968-7]]
        (Johnson with Pearson the same day; its note has Karr''s account from [[w.schlesinger-robert-kennedy-and-his]], 869).
        Names: Johnson, Kennedy, Schlesinger.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-05-03.students
      when: May 3
      date: '1968-05-03'
      thread: students
      c: 'The Theater of Ideas: Schlesinger in debate with Norman Mailer and Herbert Marcuse. The most ardent minority of
        the audience howls down speakers who say what they dislike, "which most of the time meant me." As it ends a man who
        gives his name as Jerry Bananas, later said to be an SDS leader, tells Schlesinger he will be executed. By Schlesinger''s
        journal.'
      n: '[[w.schlesinger-journals]], 288 (the entry headed May 5). Names: Schlesinger, Mailer.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:mailer-norman
- add:
    entry:
      id: cal.1968-05-25.elections-1968-mccarthy
      when: May 25
      date: '1968-05-25'
      thread: elections-1968-mccarthy
      c: Washington, the Americans for Democratic Action's convention, the Saturday banquet. McCarthy, coming in at the middle
        of the evening, walks along the head table shaking hands; at Schlesinger, "his lips tightened, his eyes grew cold,"
        and he hurries by. His speech goes over well with the audience. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 289. Names: McCarthy, Schlesinger.'
      tags:
      - name:mccarthy-eugene-j
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-campaign
      when: June 8
      date: '1968-06-08'
      thread: robert-kennedy-campaign
      c: 'Pennsylvania Station, waiting to board the funeral train. Walter Reuther to Schlesinger, on the poor and the non-white
        after Robert Kennedy''s death: "I''m afraid they will all opt out now. They will be like the college kids before New
        Hampshire—completely skeptical about any possibility of change within the system." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 293. See [[cal.1968-06-08.robert-kennedy]]. Names: Reuther, Kennedy, Schlesinger.'
      tags:
      - name:reuther-walter
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-campaign-2
      when: June 8
      date: '1968-06-08'
      thread: robert-kennedy-campaign
      c: 'The funeral train, New York to Washington. Schlesinger to Kenneth O''Donnell, of the crowds along the tracks: "What
        marvelous crowds!" O''Donnell: "Yes, but what are they good for?" Stash Radziwill: "To think that a few days ago they
        were calling this man the most ruthless man in America." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 294. See [[cal.1968-06-08.robert-kennedy]]. Names: Schlesinger, O''Donnell, Kennedy.'
      tags:
      - name:odonnell-kenneth-p
      - name:schlesinger-arthur-m-jr
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-07-08.democratic-party
      when: July 8
      date: '1968-07-08'
      thread: democratic-party
      c: Hyannis Port, before dinner, a drink with Jacqueline Kennedy. Asked about Edward Kennedy's return to politics, she
        rejects it at once; Schlesinger takes it that she thinks he will be killed too if he takes a prominent role. By Schlesinger's
        journal.
      n: '[[w.schlesinger-journals]], 295. Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-jacqueline
      - name:kennedy-edward-m
      - name:schlesinger-arthur-m-jr
      - state:ma
- add:
    entry:
      id: cal.1968-07-09.robert-kennedy
      when: July 9
      date: '1968-07-09'
      thread: robert-kennedy
      c: Hyannis Port, Tuesday morning. Ethel Kennedy asks Schlesinger whether he will write Robert Kennedy's biography; he
        sees that he should and thinks he will, after another volume of *The Age of Roosevelt*. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 295. Names: Kennedy, Schlesinger.'
      tags:
