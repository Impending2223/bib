      when: May 16
      date: '1961-05-16'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: '10 a.m., Menshikov reads the President Khrushchev''s letter of May 12, a reply to Feb. 22: a general exchange of
        views. Kennedy: Vienna, June 3 and 4, if it goes ahead; "if we cannot accomplish anything concrete on a nuclear test
        ban, it would be doubtful that we could make progress on disarmament."'
      n: '[FRUS 1961–63, V, doc. 69](https://history.state.gov/historicaldocuments/frus1961-63v05/d69). [[w.fursenko-one-hell-of-a]],
        116. See [[cal.1961-04-01.soviet-union]]. Names: Menshikov, Khrushchev, Kennedy.'
