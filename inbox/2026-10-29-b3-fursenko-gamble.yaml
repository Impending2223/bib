      when: Aug.
      date: '1962-08'
      thread: soviet-union
      also:
      - robert-kennedy
      - berlin-and-vienna
      - testing
      c: 'Early in the month, the Presidium''s answer through Bolshakov: "N. S. Khrushchev is satisfied with the president''s
        order to curtail U.S. planes'' inspections of Soviet ships in open waters"; what does Kennedy mean by "placing the
        Berlin question on ice"? Later, for "John F. Kennedy personally": "we must work harder to achieve a test ban."'
      n: '[[w.fursenko-one-hell-of-a]], 194. To check: instructions to Dobrynin, n.d., APRF (cited by [[w.fursenko-one-hell-of-a]],
        194 n.49, n.50). Check: the days. See [[cal.1962-07-31.soviet-union]]. Names: Khrushchev, Kennedy, Bolshakov.'
      tags:
