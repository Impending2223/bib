        - 'via w.fursenko-one-hell-of-a 80 n.13: all'
- add:
    entry:
      id: cal.1960-11-21.transition-and-staff-2
      when: Nov. 21
      date: '1960-11-21'
      thread: transition-and-staff
      also:
      - soviet-union
      c: 'Harriman to the President-elect: Menshikov again, Khrushchev wants high-level talks as soon as convenient. Harriman
        advises caution: a "somewhat overly eager attitude."'
      n: '[[w.fursenko-one-hell-of-a]], 80. To check: Harriman to Kennedy, Nov. 21, 1960, NSF, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
