        - 'via w.fursenko-one-hell-of-a 154 n.17: A-B'
        - 'via w.fursenko-one-hell-of-a 155 n.18: C'
- add:
    entry:
      id: cal.1962-03.soviet-union
      when: Mar.
      date: '1962-03'
      thread: soviet-union
      also:
      - press-and-broadcasting
      - testing
      c: 'Khrushchev calls off the television exchange. Gromyko to the embassy, for Bolshakov to tell Salinger: "Recent events,
        particularly John F. Kennedy''s decision to resume nuclear tests, make it impossible to exchange television messages."
        On the test ban, no inspections at all.'
      n: '[[w.fursenko-one-hell-of-a]], 156. To check: Gromyko to Smirnovsky, the acting ambassador in Washington, APRF (cited
        by [[w.fursenko-one-hell-of-a]], 156 n.20). Check: the day. See [[cal.1962-01-18.soviet-union]]. Names: Khrushchev,
        Gromyko, Bolshakov, Salinger.'
      tags:
      - name:khrushchev-nikita-s
      - name:gromyko-andrei
      - name:bolshakov-georgi
      - name:salinger-pierre
      src:
        c: e25ebfb7
        rows:
        - 'w.fursenko-one-hell-of-a 156: all'
        - 'via w.fursenko-one-hell-of-a 156 n.20: A-B'
- add:
    entry:
      id: cal.1962-04-12.soviet-union
      when: Apr. 12
      date: '1962-04-12'
      thread: soviet-union
      also:
      - cuba
      c: 'The Presidium confirms the arms for Cuba: four divisions of SA-2 launchers and two technical divisions, 180 missiles;
        one Sopka shore battery; ten used Il-28 bombers; four R-15 cruise missile launchers; General Gusev to survey Cuba''s
        needs; 650 Soviet soldiers to guard and train. The SA-2s meant for Nasser to go to Castro first.'
      n: '[[w.fursenko-one-hell-of-a]], 169–70. To check: Presidium resolution, Apr. 12, 1962, and draft resolution, APRF
        (cited by [[w.fursenko-one-hell-of-a]], 170 n.14, n.15). See [[cal.1962-02-08.soviet-union]]. Names: Nasser, Castro.'
      tags:
      - name:nasser-gamal-abdel
      - name:castro-fidel
      src:
        c: 270f1655
        rows:
        - 'w.fursenko-one-hell-of-a 169–70: all'
        - 'via w.fursenko-one-hell-of-a 170 n.14: all'
- add:
    entry:
      id: cal.1962-05-11.soviet-union-2
      when: May 11
      date: '1962-05-11'
      thread: soviet-union
      also:
      - cuba
      c: 'The Presidium adopts Khrushchev''s letter to Castro: all Cuba''s debt excused; arms and ammunition for the next
        two years free, "including missiles"; irrigation experts under Rashidov; an invitation to visit this year.'
      n: '[[w.fursenko-one-hell-of-a]], 175. To check: Khrushchev to Castro, May 11, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        175 n.25, n.26). See [[cal.1962-04-12.soviet-union]]. Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      src:
        c: f0c10c77
        rows:
        - 'w.fursenko-one-hell-of-a 175: all'
        - 'via w.fursenko-one-hell-of-a 175 n.25: all'
- add:
    entry:
      id: cal.1962-05-20.soviet-union
      when: May 20
      date: '1962-05-20'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Back from Bulgaria, Khrushchev with Gromyko, Mikoyan, Malinovsky, Kozlov and Alekseev: medium-range missiles with
        nuclear warheads to Cuba. By Alekseev''s account: "He will be scared"; Malinovsky shouts him down. A delegation, not
        a letter, to tell Castro.'
      n: '[[w.fursenko-one-hell-of-a]], 179–80. To check: *Na Krayu Propasti* (Moscow 1994), 38 (cited by [[w.fursenko-one-hell-of-a]],
        179 n.39); interview with Alekseev, Feb. 16, 1994 (cited by [[w.fursenko-one-hell-of-a]], 180 n.40, n.41). Bibliography:
        [[cal.1962-05-24.missile-crisis]]. Names: Khrushchev, Gromyko, Mikoyan, Malinovsky, Kozlov, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:gromyko-andrei
      - name:mikoyan-anastas
      - name:malinovsky-rodion-yakovlevich
      - name:kozlov-frol-r
      - name:castro-fidel
      src:
        c: 76f2e9b6
        rows:
        - 'w.fursenko-one-hell-of-a 179–80: all'
        - 'via w.fursenko-one-hell-of-a 179 n.39: A'
        - 'via w.fursenko-one-hell-of-a 180 n.40: B-C'
        - 'via w.fursenko-one-hell-of-a 180 n.41: D'
- add:
    entry:
      id: cal.1962-05-21.soviet-union
      when: May 21
      date: '1962-05-21'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'The Defense Council, on Khrushchev''s proposal: "It would be foolish to expect the inevitable second invasion to
        be as badly planned as the first." Mikoyan against, by General Ivanov''s account; the majority for. The Foreign, Defense
        and Navy Ministries "to organize the concealed movement of troops and military technology by ship to Cuba"; the protocol
        signed by all.'
      n: '[[w.fursenko-one-hell-of-a]], 180–81. To check: Khrushchev, *Khrushchev Remembers* (1970), 494 (cited by [[w.fursenko-one-hell-of-a]],
        180 n.42); Volkogonov, *Sem Vozhdei*, 421–22 (cited by [[w.fursenko-one-hell-of-a]], 180 n.43, 181 n.44). Bibliography:
        [[cal.1962-05-24.missile-crisis]]. Names: Khrushchev, Mikoyan.'
      tags:
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      src:
        c: 078e7fd2
        rows:
        - 'w.fursenko-one-hell-of-a 180–81: all'
        - 'via w.fursenko-one-hell-of-a 180 n.42: A'
        - 'via w.fursenko-one-hell-of-a 180 n.43: B-D'
        - 'via w.fursenko-one-hell-of-a 181 n.44: E'
- add:
    entry:
      id: cal.1962-05-27.missile-crisis
      when: May 27
      date: '1962-05-27'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Zhukovka, Khrushchev''s dacha, the Presidium with the delegation for Havana, Biryuzov, Rashidov, Alekseev and Ivanov.
        Khrushchev, by Alekseev''s account: the missiles "not in any case" to be used, "to give them back some of their own
        medicine"; nothing to be disclosed before the elections of Nov. 6; then he will visit the United States and tell Kennedy
        himself.'
      n: '[[w.fursenko-one-hell-of-a]], 181–82. To check: interviews with Alekseev, Feb. 16, 1994, and Ponomarev, Sept. 1993
        (cited by [[w.fursenko-one-hell-of-a]], 181 n.48, 182 n.49). See [[cal.1962-05-24.missile-crisis]]. Names: Khrushchev,
        Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: c8d565ca
        rows:
        - 'w.fursenko-one-hell-of-a 181–82: all'
        - 'via w.fursenko-one-hell-of-a 181 n.48: A'
        - 'via w.fursenko-one-hell-of-a 182 n.49a: B-D'
        - 'via w.fursenko-one-hell-of-a 182 n.49b: B-D'
- add:
    entry:
      id: cal.1962-05-25.soviet-union
      when: May 25
      date: '1962-05-25'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Bohlen to Bundy, the White House having asked him, Kennan and Thompson why Soviet policy has hardened: Khrushchev
        too realistic not to see that the chances of agreement on his terms are "pretty slim"; "Surely Khrushchev cannot seriously
        believe that the United States plans military action against them."'
      n: '[[w.fursenko-one-hell-of-a]], 184–85. To check: Bohlen to Bundy, May 25, 1962, NSF, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        185 n.4). Check: Kennan''s paper, its date (184–85). Names: Bohlen, McGeorge Bundy, Kennan, Thompson, Khrushchev.'
      tags:
      - name:bohlen-charles-e
      - name:bundy-mcgeorge
      - name:kennan-george-f
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      src:
        c: a5421bc0
        rows:
