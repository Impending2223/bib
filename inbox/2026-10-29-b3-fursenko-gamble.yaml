      when: Nov. 20
      date: '1962-11-20'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'Four hours before the press conference, Robert Kennedy to Dobrynin: "according to our reports not all of the warheads
        had left Cuba." Dobrynin, on his instructions, denies it. The tactical warheads and the six bombs still in Cuba.'
      n: '[[w.fursenko-one-hell-of-a]], 311. To check: Dobrynin to the Foreign Ministry, Nov. 20, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        311 n.93). See [[cal.1962-11-20.missile-crisis]]. Names: Robert Kennedy, Dobrynin.'
      tags:
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      src:
        c: 9f8eab6b
        rows:
        - 'w.fursenko-one-hell-of-a 311: all'
        - 'via w.fursenko-one-hell-of-a 311 n.93: A-B'
- add:
    entry:
      id: cal.1962-11-21.laos
      when: Nov. 21
      date: '1962-11-21'
      thread: laos
      also:
      - soviet-union
      c: 'The Presidium, on the Pathet Lao''s request for arms: Khrushchev ends the Soviet airlift. "What is most important
        now is peace"; "If they want a war, it will be their own affair."'
      n: '[[w.fursenko-one-hell-of-a]], 323. To check: Malin''s notes, "Regarding Instructions to the Soviet Ambassador in
        Laos," Protocol 68, Nov. 21, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 323 n.19). Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
