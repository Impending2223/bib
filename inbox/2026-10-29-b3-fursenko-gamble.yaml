        c: 153f0f72
        rows:
        - 'w.fursenko-one-hell-of-a 323: all'
        - 'via w.fursenko-one-hell-of-a 323 n.19: all'
- add:
    entry:
      id: cal.1962-11-22.soviet-union
      when: Nov. 22
      date: '1962-11-22'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'On Mikoyan''s report of the Cuban Foreign Ministry''s cable to Lechuga, "we still have tactical atomic weapons,"
        the Presidium: every nuclear weapon to come out of Cuba; "The weapons are ours, they remain in our hands"; the Cubans,
        as the Americans, to be told all are gone.'
      n: '[[w.fursenko-one-hell-of-a]], 311–13. To check: Mikoyan to Khrushchev, Nov. 22, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        312 n.95); Gromyko''s notes, Protocol 68, Presidium, Nov. 22, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 313
        n.99). See [[cal.1962-11-20.missile-crisis-3]]. Names: Mikoyan, Lechuga.'
      tags:
      - name:mikoyan-anastas
      - name:lechuga-carlos
      src:
        c: 4448f601
        rows:
