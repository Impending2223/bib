      when: May 29
      date: '1961-05-29'
      thread: robert-kennedy
      also:
      - berlin-and-vienna
      - soviet-union
      c: 'From Hyannis Port Robert Kennedy telephones Bolshakov: "The president would like to know whether he and the Chairman
        could meet privately, with only their interpreters present"; an answer wanted before he leaves for Paris on the 30th.
        Khrushchev, at Kiev, sends none; he agrees to some meetings alone at Vienna.'
      n: '[[w.fursenko-one-hell-of-a]], 128–29. To check: GRU, entry for May 29, 1961, "Kratkoye Soderzhanye" (cited by [[w.fursenko-one-hell-of-a]],
        128 n.66). See [[cal.1961-05-21.robert-kennedy]]. Names: Robert Kennedy, Bolshakov, Khrushchev.'
