        - 'via w.fursenko-one-hell-of-a 116 n.41: A'
        - 'via w.fursenko-one-hell-of-a 116 n.42: C'
- add:
    entry:
      id: cal.1961-05-18.soviet-union
      when: May 18
      date: '1961-05-18'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - robert-kennedy
      c: The Presidium approves the answer Bolshakov is to give Robert Kennedy as his own opinion, drafted by the Foreign
        and Defense Ministries; Khrushchev in Central Asia, Suslov and Gromyko in charge. No "one-sided concessions"; on the
        test ban, a council of three, West, East and neutral; agreement on a neutral Laos; on Berlin a peace treaty, with
        the GDR alone if need be; normal relations with Castro would raise the President's prestige.
      n: '[[w.fursenko-one-hell-of-a]], 117–20. To check: GRU, entry for May 16, 1961, "Kratkoye Soderzhanye"; Presidium,
        May 18, 1961, "Regarding the Instructions to Washington in Connection with the Meeting between Comrade Bolshakov and
        R. Kennedy," APRF (cited by [[w.fursenko-one-hell-of-a]], 117 n.44). See [[cal.1961-05-09.berlin-and-vienna]]. Names:
        Bolshakov, Robert Kennedy, Khrushchev, Suslov, Gromyko, Castro.'
      tags:
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:khrushchev-nikita-s
      - name:suslov-mikhail-a
      - name:gromyko-andrei
      - name:castro-fidel
