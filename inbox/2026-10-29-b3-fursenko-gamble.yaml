      date: '1962-11-18'
      thread: missile-crisis
      c: 'Glen Cove, McCloy with Kuznetsov, by Kuznetsov''s report: the press conference on the 20th; if the bombers go, no
        on-site inspection insisted on, the pledge against invasion restated at the Security Council, orally; the missiles
        and Il-28s to be counted at sea. "That would be a deal."'
      n: '[[w.fursenko-one-hell-of-a]], 307–308. To check: Kuznetsov to the Central Committee, Nov. 18, 1962, APRF (cited
        by [[w.fursenko-one-hell-of-a]], 308 n.79). Names: McCloy, Vasily Kuznetsov.'
      tags:
      - name:mccloy-john-j
      - name:kuznetsov-vasily-v
      src:
        c: d19c290d
        rows:
        - 'w.fursenko-one-hell-of-a 307–308: all'
        - 'via w.fursenko-one-hell-of-a 308 n.79: all'
- add:
    entry:
