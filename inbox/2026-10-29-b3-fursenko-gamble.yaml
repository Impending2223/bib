- add:
    entry:
      id: cal.1961-05-04.soviet-union-2
      when: May 4
      date: '1961-05-04'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Thompson to Rusk, eyes only: keep the meeting. Six reasons: the Soviets more reasonable on Laos, testing and disarmament;
        a hand in the Party Congress''s decisions; Soviet–Chinese relations made worse; the meeting more needed after recent
        events; the United States stronger before the world and on Berlin; no major change in Soviet policy.'
      n: '[FRUS 1961–63, V, doc. 66](https://history.state.gov/historicaldocuments/frus1961-63v05/d66). [[w.fursenko-one-hell-of-a]],
        105 (Laos, testing, disarmament). See [[cal.1961-05-04.soviet-union]]. Names: Thompson, Rusk.'
      tags:
      - name:thompson-llewellyn-e
      - name:rusk-dean
      src:
        c: f0767ee9
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v05/d66: all'
