      when: Apr. 1
      date: '1961-04-01'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - cuba-bay-of-pigs
      c: 'Thompson with Khrushchev, on Laos, the Congo and Cuba. Khrushchev agrees to the President''s proposal of a meeting
        at the end of May, in Vienna or Stockholm. On Cuba: the Soviet Union has no base there, the only base the American
        one; why no diplomatic relations with Havana?'
      n: 'FRUS 1961–63, V, doc. [51](https://history.state.gov/historicaldocuments/frus1961-63v05/d51) (its n.7, telegram
        2361: the meeting); X, doc. [77](https://history.state.gov/historicaldocuments/frus1961-63v10/d77) (Cuba). [[w.fursenko-one-hell-of-a]],
        88, 90 (Vienna or Stockholm; Cuba). See [[cal.1961-02-22.berlin-and-vienna]]. Names: Thompson, Khrushchev.'
      tags:
