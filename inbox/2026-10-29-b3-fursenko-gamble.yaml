      id: cal.1962-03-02.robert-kennedy
      when: Mar. 2
      date: '1962-03-02'
      thread: robert-kennedy
      also:
      - testing
      - soviet-union
      c: 'Robert Kennedy and Bolshakov, outside the Justice Department, hours before the President''s address, by the GRU''s
        report: "The president sincerely wants to avoid conducting these nuclear tests"; why not start with a ban on tests
        in the open air, which cannot be hidden? Failing that, the President wants to see Khrushchev again.'
      n: '[[w.fursenko-one-hell-of-a]], 154–55. To check: GRU resident to GRU headquarters, Mar. 3, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        154 n.17, 155 n.18). Check: Robert Kennedy''s date diary does not show the meeting (n.16). See [[cal.1962-03-02.testing]].
        Names: Robert Kennedy, Bolshakov, Khrushchev.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      - name:khrushchev-nikita-s
      src:
        c: a86ef752
        rows:
