- add:
    entry:
      id: cal.1962-10-25.soviet-union
      when: Oct. 25
      date: '1962-10-25'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Midday, the Presidium, on Kennedy''s letter. Khrushchev: the four missile ships to turn back; "We must dismantle
        the missiles to make Cuba into a zone of peace"; "Give us a pledge not to invade Cuba, and we will remove the missiles";
        the UN may inspect. Approved; the Presidium to the Bolshoi that evening.'
      n: '[[w.fursenko-one-hell-of-a]], 259–60. To check: Malin''s notes, Protocol 61, Oct. 25, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        259 n.9, 260 n.12); Khrushchev, *Khrushchev Remembers* (1970), 497 (cited by [[w.fursenko-one-hell-of-a]], 260 n.11).
        Check: Volkogonov''s account differs, *Sem Vozhdei*, 429–30 (259 n.9). See [[cal.1962-10-25.missile-crisis-2]]. Names:
        Kennedy, Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: 57b9d9eb
        rows:
        - 'w.fursenko-one-hell-of-a 259–60: all'
        - 'via w.fursenko-one-hell-of-a 259 n.9a: A-F'
        - 'via w.fursenko-one-hell-of-a 259 n.9b: A-F'
        - 'via w.fursenko-one-hell-of-a 260 n.11: G'
        - 'via w.fursenko-one-hell-of-a 260 n.12: A-F'
- add:
    entry:
      id: cal.1962-10-27.soviet-union
      when: Oct. 27
      date: '1962-10-27'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Moscow, just after 9 a.m., Pliyev''s flash cable: an American strike expected that night or at dawn; Castro has
        ordered his air defense to fire; "in the event of a U.S. air attack on our installations, we will employ all available
        means of air defense." Malinovsky, 11 a.m.: "I propose to confirm."'
      n: '[[w.fursenko-one-hell-of-a]], 271–72. To check: *Na Krayu Propasti* (cited by [[w.fursenko-one-hell-of-a]], 271
        n.55). See [[cal.1962-10-27.missile-crisis]]. Names: Castro, Malinovsky.'
      tags:
      - name:castro-fidel
      - name:malinovsky-rodion-yakovlevich
      src:
        c: d975999c
        rows:
        - 'w.fursenko-one-hell-of-a 271–72: all'
        - 'via w.fursenko-one-hell-of-a 271 n.55: A-D'
- add:
    entry:
      id: cal.1962-11-01.missile-crisis
      when: Nov. 1
      date: '1962-11-01'
      thread: missile-crisis
      also:
      - defense
      - cuba
      c: 'The Joint Chiefs'' estimate for the White House of an invasion of Cuba: 18,484 casualties, killed, missing and wounded,
        4,462 the first day; no Soviet units nor tactical nuclear weapons assumed. The Atlantic command: estimates if the
        enemy uses tactical atomic weapons "cannot be meaningful."'
      n: '[[w.fursenko-one-hell-of-a]], 298–99. To check: Marine Corps summary, Nov. 1, 1962, Cuban Missile Crisis collection,
        National Security Archive (cited by [[w.fursenko-one-hell-of-a]], 298 n.36, 299 n.39). See [[cal.1962-10-28.missile-crisis]].'
      src:
        c: f3421c37
        rows:
        - 'w.fursenko-one-hell-of-a 298–99: all'
        - 'via w.fursenko-one-hell-of-a 298 n.36: all'
        - 'via w.fursenko-one-hell-of-a 299 n.39: C'
- add:
    entry:
      id: cal.1962-11-09.missile-crisis
      when: Nov. 9
      date: '1962-11-09'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'At his home, Robert Kennedy to Bolshakov, by Dobrynin''s report, as his "personal opinion": the Il-28s to go "as
        soon as possible," no date named, or to be flown only by Soviet pilots. An hour later, after telling the President
        at the dinner for Gavin, he calls to take it back: "the rapid removal of the Il-28s from Cuba."'
      n: '[[w.fursenko-one-hell-of-a]], 299–300. To check: Dobrynin to the Foreign Ministry, Nov. 9, 1962, APRF (cited by
        [[w.fursenko-one-hell-of-a]], 300 n.45, n.47); Robert Kennedy''s desk diary, 1962, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        300 n.46, the dinner). See [[cal.1962-11-06.missile-crisis]]. Names: Robert Kennedy, Bolshakov, Dobrynin, Gavin.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      - name:dobrynin-anatoly
      - name:gavin-james-m
      src:
        c: ef5d159e
        rows:
        - 'w.fursenko-one-hell-of-a 299–300: all'
        - 'via w.fursenko-one-hell-of-a 300 n.45: A'
        - 'via w.fursenko-one-hell-of-a 300 n.46: B'
        - 'via w.fursenko-one-hell-of-a 300 n.47: B'
- add:
    entry:
      id: cal.1962-11-10.soviet-union
      when: Nov. 10
      date: '1962-11-10'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'The Presidium on Robert Kennedy''s two statements: take the first, the Il-28s flown by Soviet pilots only; failing
        that, a promise to remove them when "the time was ripe," without a date. Castro to be consulted. Kuznetsov in New
        York not to agree to the withdrawal yet.'
      n: '[[w.fursenko-one-hell-of-a]], 300–301. To check: Khrushchev to Mikoyan, extract from Protocol 65, Presidium, Nov.
        10, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 300 n.50); instructions to V. Kuznetsov, extract from Protocol
        65, Nov. 11, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 301 n.53). Reply: [[cal.1962-11-11.missile-crisis]].
        See [[cal.1962-11-09.missile-crisis]]. Names: Robert Kennedy, Castro, Vasily Kuznetsov.'
      tags:
      - name:kennedy-robert-f
      - name:castro-fidel
      - name:kuznetsov-vasily-v
      src:
        c: 47d3a1e3
        rows:
        - 'w.fursenko-one-hell-of-a 300–301: all'
        - 'via w.fursenko-one-hell-of-a 300 n.50: A-C'
        - 'via w.fursenko-one-hell-of-a 301 n.53: D'
- add:
    entry:
      id: cal.1962-11-12.missile-crisis-2
      when: Nov. 12
      date: '1962-11-12'
      thread: missile-crisis
      c: '5 p.m., the Executive Committee on Khrushchev''s reply: the missiles and warheads out; the Il-28s "at some point."
        McCloy''s offer discussed, the quarantine lifted for a promise to take the bombers out. Rusk: the quarantine against
        the bombers; Kennedy: the Il-28s against the quarantine, the assurances against invasion against safeguards.'
      n: '[FRUS 1961–63, XI, doc. 172](https://history.state.gov/historicaldocuments/frus1961-63v11/d172). [[w.fursenko-one-hell-of-a]],
        303 (the offer). See [[cal.1962-11-11.missile-crisis]]. Names: McCloy, Rusk, Kennedy, Khrushchev.'
      tags:
      - name:mccloy-john-j
      - name:rusk-dean
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      src:
        c: ab92c5fe
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d172: all'
        - 'w.fursenko-one-hell-of-a 303: C'
- add:
    entry:
      id: cal.1962-11-16.soviet-union
      when: Nov. 16
      date: '1962-11-16'
      thread: soviet-union
      also:
      - missile-crisis
      - cuba
      c: 'The Presidium, on Castro''s letter to U Thant and his order to fire on American planes. Khrushchev: Castro''s position
        "just shouting and unreasonable"; "Either they will cooperate or we will recall our personnel." Agreement to remove
        the Il-28s to go to Kennedy orally; then held a few days, Mikoyan to offer Castro three plans of inspection.'
      n: '[[w.fursenko-one-hell-of-a]], 306–307. To check: Malin''s notes, Nov. 16, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        306 n.73); Presidium resolution, "Regarding Instructions to Mikoyan," Nov. 16, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        306 n.74, n.75, 307 n.76). See [[cal.1962-11-10.soviet-union]]. Names: Castro, U Thant, Khrushchev, Kennedy, Mikoyan.'
      tags:
      - name:castro-fidel
      - name:u-thant
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:kennedy-john-f
      src:
