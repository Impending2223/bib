        - 'via w.fursenko-one-hell-of-a 128 n.66: A-B'
- add:
    entry:
      id: cal.1961-05-29.berlin-and-vienna
      when: May 29
      date: '1961-05-29'
      thread: berlin-and-vienna
      c: 'Bundy to the President on the commentators on Berlin, Lippmann and Thompson at one end, Acheson and Rusk at the
        other: "the differences ... do not turn on the issue of standing fast to defend our access to Berlin. They turn rather
        on whether there is any legitimate Soviet interest to which we can give some reassurance."'
      n: '[[w.fursenko-one-hell-of-a]], 128. To check: Bundy, memorandum to the President, May 29, 1961, POF, JFK Library
        (cited by [[w.fursenko-one-hell-of-a]], 128 n.68). Names: McGeorge Bundy, Kennedy, Lippmann, Thompson, Acheson, Rusk.'
      tags:
      - name:bundy-mcgeorge
