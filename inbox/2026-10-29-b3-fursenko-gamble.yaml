      when: May 26
      date: '1961-05-26'
      thread: berlin-and-vienna
      c: 'Mansfield to the President, "Observations on the Forthcoming Talks in Vienna": be ready to walk out if the talks
        are "degenerating into mere propaganda exchanges."'
      n: '[[w.fursenko-one-hell-of-a]], 128. To check: Mansfield to Kennedy, May 26, 1961, POF, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        128 n.67). Names: Mansfield, Kennedy.'
      tags:
      - name:mansfield-mike
      - name:kennedy-john-f
