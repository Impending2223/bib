        photographing Soviet ships in open waters. Kennedy will order a halt; in return the Berlin issue "on ice."
      n: '[[w.fursenko-one-hell-of-a]], 193–94. To check: instructions to Dobrynin, n.d., APRF (cited by [[w.fursenko-one-hell-of-a]],
        193 n.46, 194 n.48); the President''s desk diary, July 31, 1962, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        194 n.48, the day). Check: the day; Fursenko and Naftali give July 30 in the text (194), July 31 in the note. Names:
        Kennedy, Robert Kennedy, Bolshakov.'
