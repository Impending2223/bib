      when: May 24
      date: '1961-05-24'
      thread: robert-kennedy
      also:
      - soviet-union
      - berlin-and-vienna
      c: 'The President, given Thompson''s cable in the morning, calls his brother. Robert Kennedy to Bolshakov in his office
        a few hours later, by Bolshakov''s report: the President has read the first half of it "and he considers the conversation
        very harsh," above all "tighten their belts."'
      n: '[[w.fursenko-one-hell-of-a]], 123. To check: GRU, entry of May 24, 1961, "Kratkoye Soderzhanye" (cited by [[w.fursenko-one-hell-of-a]],
        123 n.55). See [[cal.1961-05-23.berlin-and-vienna]]. Names: Kennedy, Robert Kennedy, Bolshakov, Thompson.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      - name:thompson-llewellyn-e
      src:
        c: eea8c997
        rows:
        - 'w.fursenko-one-hell-of-a 123: all'
        - 'via w.fursenko-one-hell-of-a 123 n.55: B'
- add:
    entry:
      id: cal.1961-05-26.soviet-union
      when: May 26
      date: '1961-05-26'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'The Presidium on the summit, on the Foreign Ministry''s paper: disarmament, the climate, a German treaty and West
        Berlin, Laos, normal relations. Khrushchev approves it as written, no new initiatives. By Dobrynin''s account, Mikoyan
        urges care with Kennedy; Khrushchev rejects the "cautious approach": pressed hard, Kennedy will yield.'
      n: '[[w.fursenko-one-hell-of-a]], 124–26. To check: V. V. Kuznetsov to the Central Committee, May 26, 1961, APRF (cited
        by [[w.fursenko-one-hell-of-a]], 124 n.56, the paper); [[w.dobrynin-in-confidence]], 44 (cited by [[w.fursenko-one-hell-of-a]],
        126 n.60). Names: Khrushchev, Dobrynin, Mikoyan, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:dobrynin-anatoly
      - name:mikoyan-anastas
      - name:kennedy-john-f
      src:
