        rows:
        - 'w.fursenko-one-hell-of-a 80: all'
        - 'via w.fursenko-one-hell-of-a 80 n.12: all'
- add:
    entry:
      id: cal.1960-11-15.transition-and-staff
      when: Nov. 15
      date: '1960-11-15'
      thread: transition-and-staff
      also:
      - soviet-union
      c: 'Harriman to the President-elect: Menshikov has brought Khrushchev''s congratulations, and the wish to return to
        the relations of Roosevelt''s time. Harriman told him Kennedy would want an understanding, but "would not appease
        nor make any compromises of principle."'
      n: '[[w.fursenko-one-hell-of-a]], 80. To check: Harriman to Kennedy, Nov. 15, 1960, NSF, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        80 n.13). See [[cal.1960-11-12.transition-and-staff]]. Names: Harriman, Menshikov, Khrushchev, Kennedy.'
      tags:
      - name:harriman-w-averell
      - name:menshikov-mikhail
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
