- add:
    entry:
      id: cal.1961-08-01.soviet-union
      when: Aug. 1
      date: '1961-08-01'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - latin-america
      c: 'Khrushchev approves most of Shelepin''s KGB plan: "a situation in various areas of the world" to divide the attention
        and forces of the United States during the settlement of a German peace treaty and West Berlin. Mutiny in Nicaragua,
        a rising in El Salvador, rebellion in Guatemala, with the Cubans, $25,000; the Kurds; Western minds to be persuaded
        of more Soviet missiles than there are.'
      n: '[[w.fursenko-one-hell-of-a]], 138. To check: Shelepin to Khrushchev, July 29, 1961, Special Dossier of the Secretariat,
        Aug. 1, 1961, TsKhSD, as Zubok and Pleshakov cite it, *Inside the Kremlin''s Cold War*, 253–55 (cited by [[w.fursenko-one-hell-of-a]],
        138 n.24). Names: Khrushchev, Shelepin.'
      tags:
      - name:khrushchev-nikita-s
      - name:shelepin-alexandr-n
      src:
        c: 06f4632a
        rows:
        - 'w.fursenko-one-hell-of-a 138: all'
        - 'via w.fursenko-one-hell-of-a 138 n.24: all'
