      c: Bundy, two hours at lunch with Dobrynin. The President's first object peace; no invasion of Cuba, as Johnson told
        Mikoyan. The most private communications to Rusk, Thompson or Bundy; asked where his most private messages should
        go, "his best bet was Ambassador Thompson," not the Attorney General.
      n: '[FRUS 1961–63, V, doc. 388](https://history.state.gov/historicaldocuments/frus1961-63v05/d388), Bundy''s memorandum.
