      thread: robert-kennedy
      also:
      - soviet-union
      - berlin-and-vienna
      c: 'Robert Kennedy telephones Bolshakov at TASS: answers on space and the troika wanted before the summit; the President
        losing patience, his speech to the Congress to be firm, no lessening of his wish for a constructive meeting.'
      n: '[[w.fursenko-one-hell-of-a]], 124. Check: the speech; Fursenko and Naftali put it "the following day" (124), the
        message of May 25. See [[cal.1961-05-21.robert-kennedy]]. Names: Robert Kennedy, Bolshakov.'
      tags:
