- add:
    entry:
      id: cal.1962-12-14.missile-crisis
      when: Dec. 14
      date: '1962-12-14'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Kennedy to Khrushchev: he values the confidential channels, though "dangerously misleading information" came through
        them before the crisis; what the papers print is not the government''s policy; "I have some friends among newspapermen,
        but no spokesmen." Bolshakov''s going: by Fursenko and Naftali, "I am sorry to learn that he is returning to Moscow."'
      n: '[FRUS 1961–63, VI, doc. 84](https://history.state.gov/historicaldocuments/frus1961-63v06/d84). [[w.fursenko-one-hell-of-a]],
        323 (the words on Bolshakov). Reply to [[cal.1962-12-11.missile-crisis]]. Names: Kennedy, Khrushchev, Bolshakov.'
      tags:
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:bolshakov-georgi
      src:
        c: 06ed1a81
        rows:
