      id: cal.1962-08-21.missile-crisis
      when: Aug. 21
      date: '1962-08-21'
      thread: missile-crisis
      also:
      - cuba
      c: 'McCone to the President, eyes only, "Proposed plan of action for Cuba": "more aggressive action is indicated than
        any heretofore considered"; Mongoose''s modified plan (b) not enough. An uprising, then the "instantaneous commitment
        of sufficient armed forces to occupy the country, destroy the regime, free the people."'
      n: '[FRUS 1961–63, X, doc. 385](https://history.state.gov/historicaldocuments/frus1961-63v10/d385), its attachment,
        McCone''s paper of Aug. 21. [[w.fursenko-one-hell-of-a]], 201. See [[cal.1962-08-22.missile-crisis]]. Names: McCone,
        Kennedy.'
      tags:
      - name:mccone-john-a
      - name:kennedy-john-f
      src:
        c: 5f65d422
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d385: all'
        - 'w.fursenko-one-hell-of-a 201: all'
        - 'via w.fursenko-one-hell-of-a 201 n.16: all'
- add:
    entry:
      id: cal.1962-08-23.missile-crisis
      when: Aug. 23
      date: '1962-08-23'
      thread: missile-crisis
      also:
      - cuba
      c: 'The President with Rusk, McNamara, Gilpatric, Taylor, Bundy and McCone on Cuba. McCone: probably no telling a surface-to-air
        site from a 350-mile ground-to-ground missile; McNamara: portable missiles could not be found at all. Kennedy asks
        whether to state the American position in advance, and whether missile sites could be taken out by air. McCone questions
        the Jupiters in Turkey and Italy; McNamara: useless, but hard to remove.'
      n: '[FRUS 1961–63, X, doc. 385](https://history.state.gov/historicaldocuments/frus1961-63v10/d385), McCone''s memorandum.
        [[w.fursenko-one-hell-of-a]], 203. See [[cal.1962-08-22.missile-crisis]]. Names: Kennedy, Rusk, McNamara, Gilpatric,
        Taylor, McGeorge Bundy, McCone.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      - name:taylor-maxwell
      - name:bundy-mcgeorge
      - name:mccone-john-a
      src:
