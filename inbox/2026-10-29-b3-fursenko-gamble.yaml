      when: Nov. 12
      date: '1960-11-12'
      thread: transition-and-staff
      also:
      - soviet-union
      c: 'Harriman to the President-elect: a Soviet diplomat he knew in the war, in a semiofficial way, a "fresh start" in
        relations. Harriman: two RB-47 fliers in a Soviet prison could be released to set the tone.'
      n: '[[w.fursenko-one-hell-of-a]], 80. To check: Harriman to Kennedy, Nov. 12, 1960, NSF, JFK Library (cited by [[w.fursenko-one-hell-of-a]],
        80 n.12). Check: the day of the talk, "less than a week after the election" (80). Names: Harriman, Kennedy.'
      tags:
