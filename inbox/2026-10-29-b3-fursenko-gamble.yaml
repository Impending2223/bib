      id: cal.1962-10-23.missile-crisis-8
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      c: The *Aleksandrovsk*, with the warheads for the R-14s and the cruise missiles, turned from Mariel after two American
        planes pass over at 4 p.m., reaches La Isabela hours before the quarantine. The warheads kept on board.
      n: '[[w.fursenko-one-hell-of-a]], 254–55. To check: Alekseev to KGB headquarters, Oct. 23, 1962, SVR (cited by [[w.fursenko-one-hell-of-a]],
        254 n.38, 255 n.39, n.40). See [[cal.1962-10-23.soviet-union]].'
      src:
