- edit:
    id: cal.1961-05-09.berlin-and-vienna
    base: bbf9f711
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 499–501. [[w.reeves-president-kennedy]], 137–38. [[w.fursenko-one-hell-of-a]],
        112–14. To check: "Kratkoye Soderzhanye: Besed G. Bolshakova s R. Kennedi (9 Maya 1961 goda–14 Dekabria 1962 goda),"
        GRU (cited by [[w.fursenko-one-hell-of-a]], 113 n.32). Names: Robert Kennedy, Bolshakov, Khrushchev, Guthman. Check:
        the day; Schlesinger, 499, has "early in 1961." Check: Reeves has the meeting "two weeks before the scheduled summit"
        (137). Check: Fursenko and Naftali give May 9, Victory Day, by Holeman''s account and the GRU''s summary (112–13).'
      src:
        c: c8cb3a58
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 499–501: A-B'
        - 'w.reeves-president-kennedy 137–38: A-B'
        - 'via w.reeves-president-kennedy 137 n.georgi-bolshakov: all'
        - 'via w.reeves-president-kennedy 137 n.holeman-brought-bolshakov-to-the-attorney: A'
        - 'w.fursenko-one-hell-of-a 112–14: all'
        - 'via w.fursenko-one-hell-of-a 113 n.31: C-D'
        - 'via w.fursenko-one-hell-of-a 113 n.32: E-G'
      c: 'Robert Kennedy''s first meeting with Georgi Bolshakov. The back channel to Khrushchev opens. 8:30 p.m., at the Justice
        Department, Holeman and Guthman bringing them together; a walk on the Mall. By Bolshakov''s report: the President
        would take ten inspections a year in a test ban, half the public twenty, offered as a Soviet proposal; a neutral Laos;
        "Cuba is a dead issue."'
