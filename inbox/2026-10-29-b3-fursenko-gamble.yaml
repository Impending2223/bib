      when: Feb. 7
      date: '1962-02-07'
      thread: cuba
      also:
      - defense
      c: 'Norfolk, Dennison''s CINCLANT headquarters: its air, naval and army components on a quick revision of the invasion
        plans, OPLAN 314-61 and 316-61, their lead times to be cut to four days and two, as the White House has told the Joint
        Chiefs. Two airborne divisions, then two Marine divisions by sea; $6.5 million to mount 314, and $153,000 a day.'
      n: '[[w.fursenko-one-hell-of-a]], 149–50. To check: CINCLANT to All Commands, Feb. 24, 1962, NSF, JFK Library (cited
        by [[w.fursenko-one-hell-of-a]], 149 n.1, 150 n.3). Names: Dennison.'
