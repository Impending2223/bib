- add:
    entry:
      id: cal.1960-12-01.transition-and-staff-3
      when: Dec. 1
      date: '1960-12-01'
      thread: transition-and-staff
      also:
      - soviet-union
      - robert-kennedy
      c: '10 a.m., the transition office. Robert Kennedy, thirty minutes with "Mr. B." of *Izvestia*, of the KGB''s New York
        residency, for his brother by the KGB''s report to Khrushchev: better relations; a test ban possible in 1961, no underground
        tests resumed meanwhile; a summit only if results are sure, and not in the first three or four months; under pressure
        on Berlin, the West''s position defended; China the fundamental problem.'
      n: '[[w.fursenko-one-hell-of-a]], 81–82. To check: Robert Kennedy''s telephone log, 1960, RFK Pre-Administration Political
        Files, JFK Library (cited by [[w.fursenko-one-hell-of-a]], 81 n.18, the hour); Shelepin to Khrushchev, Dec. 3, 1960,
        SVR (cited by [[w.fursenko-one-hell-of-a]], 82 n.19). Names: Robert Kennedy, Khrushchev.'
      tags:
      - name:kennedy-robert-f
      - name:khrushchev-nikita-s
      - name:shelepin-alexandr-n
      src:
        c: 315def71
        rows:
