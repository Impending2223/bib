        c: 4554d140
        rows:
        - 'w.fursenko-one-hell-of-a 128: all'
        - 'via w.fursenko-one-hell-of-a 128 n.68: all'
- add:
    entry:
      id: cal.1961-07.testing
      when: July
      date: '1961-07'
      thread: testing
      also:
      - soviet-union
      c: 'The Kremlin''s Oval Room, the Presidium with the weapons scientists: Khrushchev announces that tests will resume
        in the fall. Sakharov, by note: "a resumption of testing at this time would only favor the USA." At dinner Khrushchev
        reads it out: "Leave politics to us"; of Kennedy at Vienna, "He comes to a meeting, but can''t perform."'
      n: '[[w.fursenko-one-hell-of-a]], 132–34. To check: Sakharov, *Memoirs* (1990), 205–17 (cited by [[w.fursenko-one-hell-of-a]],
        132 n.1, 134 n.2). Check: the day; "a month after the summit" (132). Names: Khrushchev, Sakharov, Kennedy.'
      tags:
      - name:khrushchev-nikita-s
      - name:sakharov-andrei-d
      - name:kennedy-john-f
