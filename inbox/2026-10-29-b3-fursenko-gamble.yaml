        - 'via w.fursenko-one-hell-of-a 185 n.4: all'
- add:
    entry:
      id: cal.1962-06-03.robert-kennedy
      when: June 3
      date: '1962-06-03'
      thread: robert-kennedy
      also:
      - soviet-union
      - defense
      c: 'Sunday at Hickory Hill, Robert Kennedy and Bolshakov, by Bolshakov''s report: is anyone in the Soviet leadership
        for "a decisive clash with the United States"? Among the Pentagon''s generals, yes, there are such people; the Joint
        Chiefs have told the President the United States is ahead and "in extremis it would be possible to probe the forces
        of the Soviet Union"; the President has rejected them.'
      n: '[[w.fursenko-one-hell-of-a]], 184–85. To check: Dobrynin to the Foreign Ministry, "On the Meeting between Bolshakov
        and RFK," June 4, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]], 184 n.1, 185 n.5, n.6). See [[cal.1962-03-02.robert-kennedy]].
        Names: Robert Kennedy, Bolshakov.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      src:
        c: e38d2d9a
        rows:
        - 'w.fursenko-one-hell-of-a 184–85: all'
        - 'via w.fursenko-one-hell-of-a 184 n.1: A'
        - 'via w.fursenko-one-hell-of-a 185 n.5: A'
        - 'via w.fursenko-one-hell-of-a 185 n.6: B-D'
- add:
