      date: '1962-07-07'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Khrushchev with eight of his military advisers, after meeting Raúl Castro: "So it is impossible to move these forces
        to Cuba secretly." The SA-2s to go up first, before the ballistic missiles. The Presidium names General Pliyev commander
        of the forces in Cuba.'
      n: '[[w.fursenko-one-hell-of-a]], 192–93. To check: *Na Krayu Propasti*, 61 (cited by [[w.fursenko-one-hell-of-a]],
        192 n.35, n.36, 193 n.42). See [[cal.1962-07.missile-crisis]]. Names: Khrushchev, Raúl Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-raul
