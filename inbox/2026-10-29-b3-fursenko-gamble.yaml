      id: cal.1962-06-10.missile-crisis
      when: June 10
      date: '1962-06-10'
      thread: missile-crisis
      also:
      - soviet-union
      c: '11 a.m., the Presidium with Gromyko, Malinovsky and the general staff. Rashidov and Biryuzov report Castro satisfied.
        Malinovsky''s memorandum: 24 R-12s and 16 R-14s, half as many in reserve; 80 nuclear cruise missiles; 42 Il-28s, a
        MiG-21 wing, 12 SA-2 units; a submarine base, eleven submarines; 50,874 men. Adopted unanimously.'
      n: '[[w.fursenko-one-hell-of-a]], 187–89. To check: General Ivanov''s notes on a Council of Ministers resolution, AGSRF
        (cited by [[w.fursenko-one-hell-of-a]], 187 n.13, 188 n.14); Dobrynin''s report of June 4 and the Presidium''s materials,
        APRF (cited by [[w.fursenko-one-hell-of-a]], 188 n.14). See [[cal.1962-05-24.missile-crisis]]. Names: Gromyko, Malinovsky,
        Castro.'
      tags:
      - name:gromyko-andrei
      - name:malinovsky-rodion-yakovlevich
      - name:castro-fidel
      src:
        c: e6c554f1
        rows:
        - 'w.fursenko-one-hell-of-a 187–89: all'
        - 'via w.fursenko-one-hell-of-a 187 n.13: all'
- add:
    entry:
      id: cal.1962-06-14.soviet-union
      when: June 14
      date: '1962-06-14'
      thread: soviet-union
      also:
      - robert-kennedy
      c: 'The Presidium''s answer to Robert Kennedy, for Bolshakov to give: relations worse by the United States'' doing,
        four reasons: the atmospheric tests; intervention in Southeast Asia; the Bundeswehr on the road to nuclear arms; no
        agreement on West Berlin. His visa refused: "his proposal to visit the Caucasus with Bolshakov is impossible."'
      n: '[[w.fursenko-one-hell-of-a]], 189–90. To check: Presidium, Protocol 36, June 14, 1962, APRF; Gromyko to the Central
        Committee, June 12, 1962 (cited by [[w.fursenko-one-hell-of-a]], 190 n.26, n.27). See [[cal.1962-06-03.robert-kennedy]].
        Names: Robert Kennedy, Bolshakov.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      src:
        c: d70ff44d
        rows:
        - 'w.fursenko-one-hell-of-a 189–90: all'
        - 'via w.fursenko-one-hell-of-a 190 n.26: all'
