      when: Dec. 27
      date: '1962-12-27'
      thread: defense
      also:
      - cuba
      c: 'Palm Beach, 10:45 a.m., the President with McNamara, Gilpatric, Taylor and the Chiefs on the fiscal 1964 budget.
        Kennedy: "although we feel that the present Cuban situation is dormant, we must assume that someday we may have to
        go into Cuba," as quickly as possible, "with a minimum of destruction."'
      n: '[FRUS 1961–63, VIII, doc. 121](https://history.state.gov/historicaldocuments/frus1961-63v08/d121), Clifton''s memorandum.
        [[w.fursenko-one-hell-of-a]], 319 (Kennedy''s words). Names: Kennedy, McNamara, Gilpatric, Taylor.'
