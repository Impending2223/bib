- add:
    entry:
      id: cal.1961-05-18.soviet-union-2
      when: May 18
      date: '1961-05-18'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Stevenson at breakfast with Menshikov, by Menshikov''s report: the summit should have come sooner; "Just between
        us, Kennedy has a lot of questionable and even dangerous advisers, to whom he sometimes gives in." A test ban the
        one area where something might come of it.'
      n: '[[w.fursenko-one-hell-of-a]], 126. To check: Menshikov to the Foreign Ministry, May 18, 1961, APRF (cited by [[w.fursenko-one-hell-of-a]],
        126 n.61). Names: Stevenson, Menshikov, Kennedy.'
      tags:
      - name:stevenson-adlai-e
      - name:menshikov-mikhail
      - name:kennedy-john-f
      src:
        c: 5089dec2
        rows:
        - 'w.fursenko-one-hell-of-a 126: all'
        - 'via w.fursenko-one-hell-of-a 126 n.61: all'
- add:
    entry:
      id: cal.1961-05-21.robert-kennedy
      when: May 21
      date: '1961-05-21'
      thread: robert-kennedy
      also:
      - soviet-union
      - berlin-and-vienna
      - testing
      c: 'Robert Kennedy and Bolshakov again, by the GRU''s account: "Improving U.S.-Soviet relations is job no. 1 for the
        U.S. government"; on the test ban, "My brother is prepared to accept the troika proposal, but no veto"; a space agreement
        wanted at Vienna; the Berlin policy unchanged; Cuba not to be raised there.'
      n: '[[w.fursenko-one-hell-of-a]], 122. To check: GRU, memorandum on the Robert Kennedy–Bolshakov meetings (cited by
        [[w.fursenko-one-hell-of-a]], 122 n.54). See [[cal.1961-05-09.berlin-and-vienna]]. Names: Robert Kennedy, Bolshakov.'
      tags:
      - name:kennedy-robert-f
      - name:bolshakov-georgi
      src:
        c: 781d8a03
        rows:
        - 'w.fursenko-one-hell-of-a 122: all'
        - 'via w.fursenko-one-hell-of-a 122 n.54: all'
- add:
    entry:
      id: cal.1961-05-23.berlin-and-vienna
      when: May 23
      date: '1961-05-23'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev has Thompson to his box at the American ice revue, and to supper. Berlin his trouble with the President:
        failing agreement, a separate treaty in the fall or winter, the East Germans to control the access; force would be
        met with force, Thompson tells him. "They would not touch our troops in Berlin but they might have to tighten their
        belts."'
      n: '[FRUS 1961–63, XIV, doc. 24](https://history.state.gov/historicaldocuments/frus1961-63v14/d24) (May 24). [[w.fursenko-one-hell-of-a]],
        123. Names: Khrushchev, Thompson.'
      tags:
      - name:khrushchev-nikita-s
      - name:thompson-llewellyn-e
      src:
        c: 5da7721c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v14/d24: all'
        - 'w.fursenko-one-hell-of-a 123: all'
