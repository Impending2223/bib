        - 'via w.fursenko-one-hell-of-a 228 n.26b: E-F'
- add:
    entry:
      id: cal.1962-10-21.robert-kennedy
      when: Oct. 21
      date: '1962-10-21'
      thread: robert-kennedy
      also:
      - missile-crisis
      - europe-and-the-alliance-jupiters
      c: 'Evening, the Justice Department. Robert Kennedy''s own group on the way out: "the Turkish missiles would have to
        be given up in the end, as the price of settlement." A public offer through the UN he finds "rather weak and defensive."'
      n: '[[w.fursenko-one-hell-of-a]], 237. To check: Bernstein, "Reconsidering the Missile Crisis: Dealing with Problems
        of the American Jupiters in Turkey," in Nathan, ed., *The Cuban Missile Crisis Revisited* (1992), 73–74 (cited by
        [[w.fursenko-one-hell-of-a]], 237 n.53). Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
      src:
        c: 51f47454
        rows:
        - 'w.fursenko-one-hell-of-a 237: all'
        - 'via w.fursenko-one-hell-of-a 237 n.53: all'
- add:
    entry:
      id: cal.1962-10-22.soviet-union
      when: Oct. 22
      date: '1962-10-22'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Moscow, hours before the address, the Presidium. Malinovsky: "Apparently the radio address is a preelection trick."
        Khrushchev: "We just wanted to intimidate them"; "This may end in a big war." Tactical nuclear weapons for Pliyev
        against a landing considered, then held back on Malinovsky''s advice: the cable to Pliyev, full readiness, the nuclear
        equipment excepted.'
      n: '[[w.fursenko-one-hell-of-a]], 240–43. To check: Malin''s notes, Protocol 60, Oct. 22, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        240 n.1); Malinovsky to Pliyev, Oct. 22, 1962, sent 2:35 p.m. Moscow time, AGSRF (cited by [[w.fursenko-one-hell-of-a]],
        242 n.2, 243 n.6). See [[cal.1962-10-22.missile-crisis]]. Names: Malinovsky, Khrushchev.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      - name:khrushchev-nikita-s
      src:
        c: fd079ed1
        rows:
        - 'w.fursenko-one-hell-of-a 240–43: all'
        - 'via w.fursenko-one-hell-of-a 240 n.1a: A-D'
        - 'via w.fursenko-one-hell-of-a 240 n.1b: A-D'
        - 'via w.fursenko-one-hell-of-a 242 n.2: E'
        - 'via w.fursenko-one-hell-of-a 243 n.6: E'
- add:
    entry:
      id: cal.1962-10-23.soviet-union
      when: Oct. 23
      date: '1962-10-23'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'Moscow, after 1 a.m., the Presidium on the address: the four submarines to go on, the *Aleksandrovsk* to the nearest
        port, the four ships with the R-14s to keep course, the ships not yet arrived to turn back. The Soviet and Warsaw
        Pact forces put on alert; leaves stopped.'
      n: '[[w.fursenko-one-hell-of-a]], 247–48. To check: Malin''s notes, Protocol 60, Oct. 22, 1962, and the extracts, APRF
        (cited by [[w.fursenko-one-hell-of-a]], 247 n.12, 248 n.13). See [[cal.1962-10-22.soviet-union]].'
      src:
        c: 920d7639
        rows:
        - 'w.fursenko-one-hell-of-a 247–48: all'
        - 'via w.fursenko-one-hell-of-a 247 n.12a: A'
        - 'via w.fursenko-one-hell-of-a 247 n.12b: A'
        - 'via w.fursenko-one-hell-of-a 248 n.13: B-C'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-6
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      also:
      - robert-kennedy
      - europe-and-the-alliance-jupiters
      c: 'Holeman calls Bolshakov. By Bolshakov''s notes: "Robert Kennedy and his circle consider it possible to discuss the
        following trade: The U.S. would liquidate its missile bases in Turkey and Italy, and the USSR would do the same in
        Cuba"; but only "in a time of quiet." Bartlett, by the GRU''s record, a like word; the GRU station holds both until
        the next day.'
      n: '[[w.fursenko-one-hell-of-a]], 249–50, 252. To check: GRU summary (cited by [[w.fursenko-one-hell-of-a]], 250 n.19,
        n.20); GRU, entry for Oct. 24, 1962 (cited by [[w.fursenko-one-hell-of-a]], 252 n.30). Check: Bartlett denies he named
        Turkey to Bolshakov; Holeman does not recall (250 n.20). See [[cal.1962-10-21.robert-kennedy]]. Names: Bolshakov,
        Robert Kennedy, Bartlett.'
      tags:
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:bartlett-charles
      src:
        c: c9b7dbc3
        rows:
        - 'w.fursenko-one-hell-of-a 249–50, 252: all'
        - 'via w.fursenko-one-hell-of-a 250 n.19: A-C'
        - 'via w.fursenko-one-hell-of-a 250 n.20: D'
        - 'via w.fursenko-one-hell-of-a 252 n.30: E'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-7
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'At Robert Kennedy''s behest, Bartlett with Bolshakov at his office in the National Press Club, by the GRU''s record:
        the President "very angry," reminded of Pearl Harbor; he "does not want to invade Cuba," only to remove the MRBM bases,
        better through the UN. Later the same day, again, with the U-2 photographs on an easel: "So what do you see, Georgi?"'
      n: '[[w.fursenko-one-hell-of-a]], 251. To check: GRU, "Kratkoye Soderzhanye: Besed G. Bolshakova s R. Kennedy" (cited
        by [[w.fursenko-one-hell-of-a]], 251 n.26, n.27); [[w.robert-kennedy-in-his]], 261 (cited by [[w.fursenko-one-hell-of-a]],
        251 n.28, the photographs); Bolshakov, "Hot Line," *Novoye Vremya*, no. 6 (1989) (cited by [[w.fursenko-one-hell-of-a]],
        251 n.29). See [[cal.1962-10-07.soviet-union]]. Names: Robert Kennedy, Bartlett, Bolshakov, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:bartlett-charles
      - name:bolshakov-georgi
      - name:kennedy-john-f
      src:
        c: b4aed9ca
        rows:
        - 'w.fursenko-one-hell-of-a 251: all'
        - 'via w.fursenko-one-hell-of-a 251 n.26: A-B'
        - 'via w.fursenko-one-hell-of-a 251 n.28: C'
        - 'via w.fursenko-one-hell-of-a 251 n.29: C'
