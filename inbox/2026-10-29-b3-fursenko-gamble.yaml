- add:
    entry:
      id: cal.1960-03-12.cuba
      when: Mar. 12
      date: '1960-03-12'
      thread: cuba
      also:
      - soviet-union
      c: 'The Presidium''s first message from Khrushchev to Castro, by word of mouth, Alekseev of the KGB to deliver it: Soviet
        sympathy with the revolutionary government; the United States "will under no circumstances cross the line to undertake
        an open intervention against Cuba"; arms through the Czechs, "if necessary, then directly from the Soviet Union";
        an invitation to visit.'
      n: '[[w.fursenko-one-hell-of-a]], 44–45. To check: Protocol 270, Mar. 12, 1960; Central Committee to Alekseev, Mar.
        12, 1960, APRF (cited by [[w.fursenko-one-hell-of-a]], 44 n.36). Check: the day; Fursenko and Naftali have the Presidium
        decide Mar. 15 (44) and call it "the March 12 message" (45), the protocol dated Mar. 12. Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      src:
        c: 3c20a728
        rows:
        - 'w.fursenko-one-hell-of-a 44–45: all'
        - 'via w.fursenko-one-hell-of-a 44 n.36a: all'
        - 'via w.fursenko-one-hell-of-a 44 n.36b: all'
- add:
    entry:
      id: cal.1960-04-21.cuba
      when: Apr. 21
      date: '1960-04-21'
      thread: cuba
      also:
      - soviet-union
      c: 'A KGB report of Apr. 20 on the Cuban general staff''s fear of an attack. The Presidium, Apr. 21: "to render urgent
        assistance to the Cuban government." Yes to Castro''s first list of arms, German, Czech and Polish, and nothing to
        be paid; Prague to bear 15–25 percent of the cost, Warsaw 10–20, Moscow the rest.'
      n: '[[w.fursenko-one-hell-of-a]], 46–47. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: d49465fa
        rows:
        - 'w.fursenko-one-hell-of-a 46–47: all'
        - 'via w.fursenko-one-hell-of-a 46 n.43: A'
- add:
    entry:
      id: cal.1960-07-18.cuba
      when: July 17–18
      date: '1960-07-17'
      thread: cuba
      also:
      - soviet-union
      c: 'Raúl Castro in Moscow, July 17, met by Marshal Zakharov. July 18, with Khrushchev, Gromyko, Ponomarev, Zakharov
        and Skachkov. The visit''s joint communiqué: "all means not to consent to an armed United States intervention against
        the Cuban republic."'
      n: '[[w.fursenko-one-hell-of-a]], 53–54. To check: Presidium, July 17, 1960, "On Raul Castro''s Visit to the USSR,"
        APRF (cited by [[w.fursenko-one-hell-of-a]], 54 n.72); Szulc, *Fidel* (1986), 539 (cited by [[w.fursenko-one-hell-of-a]],
        54 n.73, the communiqué). Check: the communiqué''s date. See [[cal.1960-07-09.cuba]]. Names: Raúl Castro, Khrushchev,
        Gromyko, Ponomarev, Zakharov.'
      tags:
      - name:castro-raul
      - name:khrushchev-nikita-s
      - name:gromyko-andrei
      - name:ponomarev-boris-n
      - name:zakharov-matvei-vasileevich
      src:
        c: 2d2d5a39
        rows:
        - 'w.fursenko-one-hell-of-a 53–54: all'
        - 'via w.fursenko-one-hell-of-a 54 n.72: B'
        - 'via w.fursenko-one-hell-of-a 54 n.73: C'
- add:
    entry:
      id: cal.1960-10-28.cuba
      when: Oct. 28–29
      date: '1960-10-28'
      thread: cuba
      also:
      - soviet-union
      c: 'The war scare. Oct. 28, the Navy gives the Marines on four ships of the Vieques exercises weekend leave in San Juan
        and Kingston; 1,450 at Guantanamo too. TASS, Oct. 28, a summary of Khrushchev''s interview of a week before with Franqui
        of *Revolución*; Oct. 29, a fuller text: he hopes the United States will not force him to turn a "symbolic" threat
        of rockets in Cuba''s defense into a real one.'
      n: '[[w.fursenko-one-hell-of-a]], 67–68. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 97921b39
        rows:
        - 'w.fursenko-one-hell-of-a 67–68: all'
- add:
