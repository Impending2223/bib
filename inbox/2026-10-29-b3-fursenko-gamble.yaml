      when: Nov. 18
      date: '1962-11-18'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: 'Breakfast at Robert Kennedy''s for the artists of the Bolshoi. To Dobrynin, by Dobrynin''s report: an answer from
        Moscow wanted before the President''s press conference, in two days, after six days'' wait.'
      n: '[[w.fursenko-one-hell-of-a]], 307. To check: Dobrynin to the Foreign Ministry, Nov. 18, 1962, APRF (cited by [[w.fursenko-one-hell-of-a]],
        307 n.77). See [[cal.1962-11-12.missile-crisis]]. Names: Robert Kennedy, Dobrynin.'
