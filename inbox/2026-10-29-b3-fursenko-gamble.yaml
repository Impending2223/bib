      date: '1962-12-11'
      thread: missile-crisis
      also:
      - soviet-union
      - press-and-broadcasting
      c: 'Khrushchev to Kennedy: the commitments to be put in documents in New York; the columnists "widely commenting on
        the confidential exchange of opinion," no accidental leak; if it goes on, "these channels will cease to be of use
        and may even cause harm."'
      n: '[FRUS 1961–63, VI, doc. 83](https://history.state.gov/historicaldocuments/frus1961-63v06/d83). [[w.fursenko-one-hell-of-a]],
        322 (Dec. 10). Check: the day; Fursenko and Naftali give the oral communication as of Dec. 10. See [[cal.1962-12.missile-crisis]].
        Names: Khrushchev, Kennedy.'
