      when: Oct. 4
      date: '1962-10-04'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'The *Indigirka* at Mariel with the first nuclear warheads: forty-five one-megaton warheads for the R-12s, twelve
        for the Lunas, six bombs for the Il-28s, thirty-six warheads for the cruise missiles.'
      n: '[[w.fursenko-one-hell-of-a]], 217. See [[cal.1962-09-07.missile-crisis-2]].'
      src:
        c: ee1a7f88
        rows:
        - 'w.fursenko-one-hell-of-a 217: all'
- add:
    entry:
      id: cal.1962-10-16.soviet-union
      when: Oct. 16
      date: '1962-10-16'
      thread: soviet-union
      also:
      - missile-crisis
      c: 'The Presidium on the KGB''s plan of Oct. 10 for propaganda to meet the missiles'' unveiling, Ehrenburg and Shostakovich
        among its voices: five of its six points refused, for the elections; only private approaches to West Europeans against
        the embargo, a week''s boycott of American goods. Gromyko''s visit to the President on the 18th.'
      n: '[[w.fursenko-one-hell-of-a]], 228–29. To check: Semichastny to the Central Committee, Oct. 10, 1962, APRF; protocol
        of the Presidium, Oct. 16, distributed Oct. 18, APRF (cited by [[w.fursenko-one-hell-of-a]], 229 n.27, n.28). See
        [[cal.1962-10-18.missile-crisis]]. Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      src:
        c: 66a2c722
        rows:
        - 'w.fursenko-one-hell-of-a 228–29: all'
        - 'via w.fursenko-one-hell-of-a 229 n.27: A'
        - 'via w.fursenko-one-hell-of-a 229 n.28a: A-B'
        - 'via w.fursenko-one-hell-of-a 229 n.28b: A-B'
- add:
    entry:
      id: cal.1962-10-17.missile-crisis-3
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      also:
      - cuba
      c: '9:30 a.m., McCone with the President. By McCone''s note, Kennedy inclined to act promptly if at all, without warning,
        on the MRBMs and possibly the airfields. McCone''s paper: no action without warning, no "Pearl Harbor indictment";
        an ultimatum first. Kennedy approves sabotage, among it a grenade attack on the Chinese embassy in Havana and a mortar
        attack on three SA-2 sites; not the mining of harbors.'
      n: '[FRUS 1961–63, XI, doc. 23](https://history.state.gov/historicaldocuments/frus1961-63v11/d23) (the meeting and Kennedy''s
        inclination, in its note). [[w.fursenko-one-hell-of-a]], 227–28. To check: McCone, "Memorandum for Discussion Today,
        Oct. 17, 1962," doc. 53, and "Brief Discussion with the President—9:30 A.M.—17 October 1962," doc. 55, in McAuliffe,
        ed., *CIA Documents on the Cuban Missile Crisis* (cited by [[w.fursenko-one-hell-of-a]], 228 n.25); Carter, "Operation
        MONGOOSE/Sabotage Proposals," Oct. 16, 1962, and Parrott, memorandum for the Special Group (Augmented), Oct. 17, 1962,
        Rockefeller Commission papers (cited by [[w.fursenko-one-hell-of-a]], 228 n.26). Check: the day of the approval of
        sabotage. See [[cal.1962-10-16.missile-crisis]]. Names: McCone, Kennedy.'
      tags:
      - name:mccone-john-a
      - name:kennedy-john-f
      src:
        c: 819b0121
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d23: A-B'
        - 'w.fursenko-one-hell-of-a 227–28: all'
