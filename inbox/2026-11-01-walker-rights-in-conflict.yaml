      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago. Gregory leads some 3,000 from Grant Park south on Michigan toward his home, the Guard alongside; at 18th Street the Guard bars the way, by Secret Service instruction. Gregory, Frazier of Oklahoma in his wheelchair, Neuhaus and other delegates walk into arrest; 79 arrested by 9:30. Guardsmen push the crowd back with rifle butts.
      n: '[[w.rights-in-conflict-convention-week]], 341–45. See [[cal.1968-08-22.elections-1968]]. Names: Gregory.'
      tags:
      - name:gregory-dick
