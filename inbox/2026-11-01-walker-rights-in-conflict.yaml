      when: Aug. 30
      date: '1968-08-30'
      thread: elections-1968-chicago
      c: Chicago, the Conrad Hilton, from about 5 a.m. Police, sent to stop objects thrown from suite 1506-A, McCarthy's staff's, clear it and the 15th floor; a McCarthy worker clubbed; some 40 or 50 taken down to the lobby. McCarthy comes, tells his people to go to their rooms.
      n: '[[w.rights-in-conflict-convention-week]], 347–50. See [[cal.1968-08-22.elections-1968]]. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
