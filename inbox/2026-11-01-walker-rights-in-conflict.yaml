      when: Nov. 18
      date: '1968-11-18'
      thread: civil-disorders
      also:
      - elections-1968-chicago
      - war-opposition
      c: 'Chicago. Walker signs the Chicago study team''s report to the National Commission on the Causes and Prevention of Violence, the work of 53 days from Sept. 27: 3,437 statements of witnesses, 1,410 the team''s, 2,017 the FBI''s; some 180 hours of film, more than 12,000 photographs.'
      n: '[[w.rights-in-conflict-convention-week]], xiii–xiv, x (Frankel: 90 full-time and 121 part-time staff). See [[cal.1968-08-22.elections-1968]]. Names: Walker.'
      tags:
      - name:walker-daniel
      - state:il
      - city:chicago
