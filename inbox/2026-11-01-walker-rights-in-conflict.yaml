patch: 2026-11-01-walker-rights-in-conflict
by: reader (Claude), Rights in Conflict (the Walker Report), Dutton ed. 1968
ops:
- add:
    entry:
      id: cal.1967-10-08.elections-1968-chicago
      when: Oct. 8
      date: '1967-10-08'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: Chicago named the site of the Democratic National Convention, Aug. 26–29, 1968. McCormick Place burned; the International Amphitheatre the hall, more than five miles from the main hotels, near a ghetto.
      n: '[[w.rights-in-conflict-convention-week]], 16–17, 292.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1967-12-18.war-opposition
      when: Dec. 18
      date: '1967-12-18'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'New York. The National Mobilization Committee''s Administrative Committee, 60 to 70 present, on demonstrating at the Chicago convention: no decision; other groups to be sounded out.'
      n: '[[w.rights-in-conflict-convention-week]], 24 (Rennie Davis''s account).'
      tags:
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-01.elections-1968-chicago
      when: Jan.
      date: 1968-01
      thread: elections-1968-chicago
      c: 'Chicago. The Police Department''s Convention Planning Committee formed: the police, the Secret Service, Military Intelligence, the Mayor''s office, the Fire Department. It meets every two weeks through May, weekly to mid-August.'
      n: '[[w.rights-in-conflict-convention-week]], 95. Check: the day.'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-01-26.war-opposition
      when: Jan. 26
      date: '1968-01-26'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'New York. A meeting sponsored by the National Lawyers Guild on legal aid in Chicago in convention week. Hayden, by an informant''s minutes: "people organized who can fight the police."'
      n: '[[w.rights-in-conflict-convention-week]], 30. See [[cal.1967-12-18.war-opposition]]. Names: Hayden.'
      tags:
      - name:hayden-tom
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-02-11.war-opposition
      when: Feb. 11
      date: '1968-02-11'
      thread: war-opposition
      also:
      - elections-1968-chicago
      - black-nationalism
      c: Chicago. The National Mobilization hosts delegates of black organizations, SNCC and CORE among them. Rennie Davis and Carlos Russell on a national structure joining black organizations and the white protest groups.
      n: '[[w.rights-in-conflict-convention-week]], 25. See [[cal.1967-12-18.war-opposition]]. Names: Davis.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-03-21.war-opposition
      when: Mar. 21
      date: '1968-03-21'
      thread: war-opposition
      c: 'New York, Grand Central Station. The Yippies'' night party, some 5,000: a clash with the police, more than 50 arrests, many hurt.'
      n: '[[w.rights-in-conflict-convention-week]], 47.'
      tags:
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1968-03-22.war-opposition
      when: Mar. 22–24
      date: '1968-03-22'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Lake Villa, Ill. The National Mobilization''s conference on Chicago, some 250 delegates invited. Rennie Davis and Hayden''s paper: the antiwar and black movements in coalition; three days of protest at the convention, a "funeral march" to the Amphitheatre; "nonviolent and legal." Hoffman, Rubin and Krassner come for the Yippies. SDS declines; no alliance with the black organizations.'
      n: '[[w.rights-in-conflict-convention-week]], 26–28, 47. Dellinger to the press after: "We are not going to storm the convention with tanks or mace" (28). See [[cal.1967-12-18.war-opposition]]. Names: Davis, Hayden, Hoffman, Rubin.'
      tags:
      - name:davis-rennie
      - name:hayden-tom
      - name:hoffman-abbie
      - name:rubin-jerry
      - name:dellinger-david
      - state:il
- add:
    entry:
      id: cal.1968-03-26.elections-1968-chicago
      when: Mar. 26
      date: '1968-03-26'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. The Yippies'' local organizers, the Free City group, meet Stahl of the Mayor''s office: the Festival of Life announced; Grant Park asked, the need to sleep in the park in the written request to the Park District. No reply.'
      n: '[[w.rights-in-conflict-convention-week]], 68–69. George Peters, not of the Yippies, had written the Park District Mar. 25 asking Grant Park for camping (68).'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-04-27.war-opposition
      when: Apr. 27
      date: '1968-04-27'
      thread: war-opposition
      also:
      - civil-disorders
      c: Chicago. A march in the Loop against the war, some 6,500, called by Chicago peace groups, the Chicago Peace Council among them, its permit in dispute; at the Civic Center the police disperse it by force, bystanders clubbed by eyewitnesses' accounts.
      n: '[[w.rights-in-conflict-convention-week]], 3, 14, 29. Criticized in the report of a citizens'' committee under Edward J. Sparling, president emeritus of Roosevelt University (14). To check: the Sparling committee''s report (cited by [[w.rights-in-conflict-convention-week]], 14). See [[cal.1968-04-26.war-opposition]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-06-16.elections-1968-chicago
      when: June 16
      date: '1968-06-16'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. Baugher of the Commission on Youth Welfare meets Rennie Davis, the Mobilization''s first contact with the city: permits for parades, rallies and sleeping in the parks, Garfield and Washington Parks among them. Baugher warns of parks in black neighborhoods; Davis asks to meet city and Park District officials.'
      n: '[[w.rights-in-conflict-convention-week]], 61. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-06-19.elections-1968-chicago
      when: June 19
      date: '1968-06-19'
      thread: elections-1968-chicago
      c: 'Chicago. Daley asks Brigadier General Dunn, of the Illinois National Guard''s Emergency Operations Headquarters, what the Guard can do in convention week. Dunn: a call-up in advance, staggered training assemblies, or nothing until needed. Daley: too early to call it out.'
      n: '[[w.rights-in-conflict-convention-week]], 112. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-06-29.elections-1968-chicago
      when: June 29
      date: '1968-06-29'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'Chicago, the Sherman House. The Coalition for an Open Convention, Lowenstein its prime mover, organizes: Robert Kennedy''s and McCarthy''s workers, student groups. Mass rallies in convention week, "On to Chicago"; a rally at Soldier Field, Aug. 25, the main event.'
      n: '[[w.rights-in-conflict-convention-week]], 53. Names: Lowenstein, Robert Kennedy, McCarthy.'
      tags:
      - name:lowenstein-allard
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-07-15.elections-1968-chicago
      when: July 15
      date: '1968-07-15'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: The Free City group's formal application to the Park District for Lincoln Park, the Festival of Life, 25,000 expected; Soldier Field for Aug. 30, a closing rally. No word of sleeping in the park, by the Park District's account.
      n: '[[w.rights-in-conflict-convention-week]], 70–71. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-07-17.elections-1968-chicago-2
      when: July 17
      date: '1968-07-17'
      thread: elections-1968-chicago
      c: 'Dunn to Daley, a letter: Demcon, the Guard''s plan short of a call-up. A battalion, 800, and a company, 300, on training duty Aug. 24–25; a battalion each evening Aug. 26–29 at Boyce and Fuller Parks, near the Amphitheatre. Dunn, to the police superintendent: "I would rather have them ... readily available on duty."'
      n: '[[w.rights-in-conflict-convention-week]], 112–13. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-07-20.war-opposition
      when: July 20
      date: '1968-07-20'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: Cleveland. The National Mobilization's Administrative Committee commits itself to the Chicago demonstrations. Its Chicago office, on a reported $20,000, steps up the work.
      n: '[[w.rights-in-conflict-convention-week]], 28–29, 37. See [[cal.1967-12-18.war-opposition]].'
      tags:
      - state:oh
- add:
    entry:
      id: cal.1968-07-29.elections-1968-chicago
      when: July 29
      date: '1968-07-29'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Simons, a law student for the Mobilization, files its two parade applications for Aug. 28: from State and Wacker to the Grant Park bandshell, 150,000; on Halsted from 39th to 47th, 7 p.m. to midnight, 200,000.'
      n: '[[w.rights-in-conflict-convention-week]], 61–62. Check: the Mobilization''s suit gives July 25 (65). See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-07-31.elections-1968-chicago
      when: July 31
      date: '1968-07-31'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Barry, acting superintendent of the Park District, meets the Mobilization''s negotiators on ten parks for rallies and six to sleep in: a memorandum asked, delivered Aug. 1, an answer before the Park Board''s meeting of Aug. 13.'
      n: '[[w.rights-in-conflict-convention-week]], 61–63. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-07-31.elections-1968-chicago-2
      when: July 31
      date: '1968-07-31'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'Barry meets Slate of the Coalition for an Open Convention on Soldier Field: no dates set. No sleeping in the parks, by ordinance.'
      n: '[[w.rights-in-conflict-convention-week]], 74. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-02.elections-1968-chicago
      when: Aug. 2
      date: '1968-08-02'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, the Palmer House. Stahl at breakfast with Rennie Davis and his negotiators: Davis outlines the Mobilization''s plans; Stahl takes notes, will keep in touch.'
      n: '[[w.rights-in-conflict-convention-week]], 62–63 (after a TV interview in which Davis asked the Justice Department to investigate the police, Stahl had refused to meet). See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-02.elections-1968-chicago-2
      when: Aug. 2
      date: '1968-08-02'
      thread: elections-1968-chicago
      c: 'Dunn with Governor Shapiro: Demcon approved in substance; how they will communicate if the Guard is called.'
      n: '[[w.rights-in-conflict-convention-week]], 113. See [[cal.1968-01.elections-1968-chicago]]. Names: Shapiro.'
      tags:
      - name:shapiro-samuel-h
      - state:il
- add:
    entry:
      id: cal.1968-08-04.war-opposition
      when: Aug. 4
      date: '1968-08-04'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Highland Park, Ill. The National Mobilization''s officers, some 50: one late-afternoon march to the Amphitheatre instead of two, a demonstration within sight of it; 25 movement centers to open Aug. 24; picketing at the Hilton Aug. 25, an antibirthday party for Johnson Aug. 27, the march Aug. 28. No official part in the Coalition for an Open Convention''s rally; $24,000 needed by Aug. 18.'
      n: '[[w.rights-in-conflict-convention-week]], 39–40, 63. Check: the Coalition''s rally Monday by p. 40, Sunday, Aug. 25, by p. 53. See [[cal.1967-12-18.war-opposition]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - state:il
- add:
    entry:
      id: cal.1968-08-04.war-opposition-2
      when: Aug. 4
      date: '1968-08-04'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Chicago. Hoffman, as "Frankie Abbott," at a press conference: the Yippies'' festival goes on with or without a permit.'
      n: '[[w.rights-in-conflict-convention-week]], 71. See [[cal.1967-12-18.war-opposition]]. Names: Hoffman.'
      tags:
      - name:hoffman-abbie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-05.elections-1968-chicago
      when: Aug. 5
      date: '1968-08-05'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, the Old Colony Coffee Shop. Rennie Davis, Dellinger, Greenblatt, Peck and Simons with two men of the Justice Department''s Community Relations Division: Daley has told them the parks will not be open for sleeping.'
      n: '[[w.rights-in-conflict-convention-week]], 63–64 (the Mobilization''s "first solid indication" the city would not cooperate; its letter to Conlisk on the march''s security the same day). See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis, Dellinger.'
      tags:
      - name:davis-rennie
      - name:dellinger-david
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-05.elections-1968-chicago-2
      when: Aug. 5
      date: '1968-08-05'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. The New York Yippies, back in town, with Stahl in the evening: the city holding the permit to the last minute to keep the numbers down, they say; people will come anyway. They offer to drop the festival for $200,000.'
      n: '[[w.rights-in-conflict-convention-week]], 71–72. That day the Free City group had asked Barry to close the zoo for the week; afterward, its statement to the underground press against a "festival of blood" (71). See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-08.elections-1968-chicago
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago. The Free City group withdraws its application; a new one, signed by the New York Yippies and the Chicago group. That afternoon Hoffman and the others meet Stahl and assistant corporation counsel, under ten minutes.
      n: '[[w.rights-in-conflict-convention-week]], 72. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Hoffman.'
      tags:
      - name:hoffman-abbie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-08.elections-1968-chicago-2
      when: Aug. 8
      date: '1968-08-08'
      thread: elections-1968-chicago
      c: 'Fort Sheridan, Ill. The Fifth Army''s conference on convention week: the Army, III Corps from Fort Hood, the Secret Service, the Chicago police, the Illinois and Indiana Guard. The Secret Service''s intelligence summary; it wants more weight on the hotels and the Loop. That afternoon the plans laid before Daley.'
      n: '[[w.rights-in-conflict-convention-week]], 113–14. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
- add:
    entry:
      id: cal.1968-08-10.elections-1968-chicago
      when: Aug. 10
      date: '1968-08-10'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. Rennie Davis with Stahl: the talks dragging; he asks to meet Daley. Stahl: Daley does not decide park or parade permits; the Park District and the Department of Streets do.'
      n: '[[w.rights-in-conflict-convention-week]], 64. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis, Daley.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-12.elections-1968
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968
      also:
      - elections-1968-chicago
      c: 'McCarthy, at a press conference: his supporters to stay away from Chicago in convention week, against "unintended violence"; rallies in their own communities instead. Telegrams to his headquarters.'
      n: '[[w.rights-in-conflict-convention-week]], 54 (reported in touch with Daley on threats of disruption and plots against his life). Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-08-12.elections-1968-chicago
      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. The Mobilization''s Administrative Committee with Stahl, Baugher and a city lawyer: no decision. Would they march without a permit? The heads of the police, the streets and the Park District absent.'
      n: '[[w.rights-in-conflict-convention-week]], 64–65. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-13.elections-1968-chicago
      when: Aug. 13
      date: '1968-08-13'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. The Park District''s board meets: the permits not on the agenda, "under advisement." Barry tells Slate the board has taken no action on the Coalition''s request.'
      n: '[[w.rights-in-conflict-convention-week]], 65, 75. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-14.elections-1968-chicago
      when: Aug. 14
      date: '1968-08-14'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'The Coalition for an Open Convention, by the ACLU, sues the Park District in the federal district court for Soldier Field on Aug. 25: the refusal "without explanation."'
      n: '[[w.rights-in-conflict-convention-week]], 75. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-14.elections-1968-chicago-2
      when: Aug. 14
      date: '1968-08-14'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Rennie Davis to Daley, a telegram: an emergency meeting of city officials on the permits.'
      n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis, Daley.'
      tags:
      - name:davis-rennie
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-16.elections-1968-chicago
      when: Aug. 16
      date: '1968-08-16'
      thread: elections-1968-chicago
      also:
      - democratic-party
      - war-opposition
      c: 'The Mobilization''s spokesmen, the Yippies with them, confront Bailey at a press conference: he will speak to Daley, but the decisions are the city''s, not the party''s.'
      n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-16.elections-1968-chicago-2
      when: Aug. 16
      date: '1968-08-16'
      thread: elections-1968-chicago
      also:
      - defense
      c: 'Washington. Dunn, called by the Defense Department, with the Under Secretary of the Army for civil disturbances, the Army''s director of civil disturbance planning and the Secret Service: questioned on Demcon. Federal troops not to be used until the Guard is called. No decision while he is there.'
      n: '[[w.rights-in-conflict-convention-week]], 114. See [[cal.1968-01.elections-1968-chicago]].'
      tags:
      - state:dc
      - city:washington
- add:
    entry:
      id: cal.1968-08-17.elections-1968-chicago
      when: Aug. 17
      date: '1968-08-17'
      thread: elections-1968-chicago
      c: 'Springfield, Ill., noon. Shapiro to Dunn and his advisers: the Illinois National Guard to be called to state active duty for convention week; the decision secret until Aug. 20.'
      n: '[[w.rights-in-conflict-convention-week]], 114–15. See [[cal.1968-01.elections-1968-chicago]]. Names: Shapiro.'
      tags:
      - name:shapiro-samuel-h
      - state:il
- add:
    entry:
      id: cal.1968-08-17.elections-1968-chicago-2
      when: Aug. 17
      date: '1968-08-17'
      thread: elections-1968-chicago
      also:
      - black-nationalism
      c: Chicago. Black Panthers arrested near a church where McCarthy is speaking; weapons and ammunition in their car.
      n: '[[w.rights-in-conflict-convention-week]], 56. Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-18.elections-1968-chicago
      when: Aug. 18
      date: '1968-08-18'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Lincoln Park. The first demonstrators arrive, the Yippies'' headquarters at the park''s south end. The Mobilization''s marshals'' training opens, Rennie Davis and Hayden there: nonviolence, the police, the demonstrators'' rights. The beach patrol begins clearing the park each night at the 11 p.m. curfew.'
      n: '[[w.rights-in-conflict-convention-week]], 3, 129–30, 138. Police undercover men watch; police intelligence asked to keep the park under surveillance (130, 108). See [[cal.1967-12-18.war-opposition]]. Names: Davis, Hayden.'
      tags:
      - name:davis-rennie
      - name:hayden-tom
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-18.war-opposition
      when: Aug. 18
      date: '1968-08-18'
      thread: war-opposition
      also:
      - elections-1968-chicago
      c: 'Chicago. The Mobilization''s leaders meet, most of those from out of town in for the week: no permits expected.'
      n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1967-12-18.war-opposition]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'The Mobilization sues Daley and other city officials in the federal district court, before Judge William J. Lynch: a conspiracy to deny it the right to assemble; the denial of equal protection.'
      n: '[[w.rights-in-conflict-convention-week]], 65. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago-2
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: The Yippies sue the city for a permit for Lincoln Park; to be heard with the Mobilization's case before Judge Lynch, Aug. 22.
      n: '[[w.rights-in-conflict-convention-week]], 72–73. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago-3
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      also:
      - democratic-party
      c: 'Judge Lynch, on the Coalition for an Open Convention''s suit: granting permits a "legislative function" of the Park District; no injunction. The Coalition gives up its rally of Aug. 25.'
      n: '[[w.rights-in-conflict-convention-week]], 75 (the Park District''s motion to dismiss continued to Sept. 15; four parks open for assemblies without permits). See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago-4
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      c: 'Chicago, 1:30 p.m. Dunn with the police commanders on the Guard''s strength and duties; then the Fifth Army, III Corps, the Secret Service and the city''s departments. Then Dunn, the Fifth Army''s commanders, Conlisk and Quinn with Daley: the civil authorities to handle it, the Guard called only if needed; Army armored personnel carriers at Soldier Field.'
      n: '[[w.rights-in-conflict-convention-week]], 115. See [[cal.1968-01.elections-1968-chicago]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      c: '2 p.m. Shapiro announces the National Guard called to active duty for convention week. Daley had called Dunn that morning: Soldier Field, Humboldt Park and Washington Park to be asked.'
      n: '[[w.rights-in-conflict-convention-week]], 115–16 (Demcon set aside for OPlan 1-68, the standing plan for Chicago). See [[cal.1968-01.elections-1968-chicago]]. Names: Shapiro, Daley.'
      tags:
      - name:shapiro-samuel-h
      - name:daley-richard-j
      - state:il
- add:
    entry:
      id: cal.1968-08-20.war-opposition
      when: Aug. 20
      date: '1968-08-20'
      thread: war-opposition
      also:
      - students
      - elections-1968-chicago
      c: 'Hayden, to some 800 delegates of the National Student Association: a show of dissident strength in Chicago.'
      n: '[[w.rights-in-conflict-convention-week]], 81. Check: the place. See [[cal.1967-12-18.war-opposition]]. Names: Hayden.'
      tags:
      - name:hayden-tom
- add:
    entry:
      id: cal.1968-08-21.elections-1968-chicago
      when: Aug. 21
      date: '1968-08-21'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Judge Lynch''s chambers. Simon, the corporation counsel, to Rennie Davis: no march at night; a march by day, four routes to the Grant Park bandshell; a night rally elsewhere than Halsted from 39th to 45th, closed by the police and the Secret Service. Davis: any route by day, but a rally within "eyeshot" of the Amphitheatre. Simon: no sleeping in the parks.'
      n: '[[w.rights-in-conflict-convention-week]], 65–67 (Davis: housing for nearly 30,000). See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-21.press-and-broadcasting
      when: Aug. 21
      date: '1968-08-21'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: 'Conlisk''s message to every member of the Chicago police: the eyes of the nation and the world on the city and the Department in the coming week.'
      n: '[[w.rights-in-conflict-convention-week]], 299. See [[cal.1968-01.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-22.elections-1968-chicago
      when: Aug. 22
      date: '1968-08-22'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Judge Lynch''s court. Rennie Davis: the Mobilization rejects the city''s routes, will march near the Amphitheatre; it takes Grant Park for a rally Wednesday afternoon. The city: the 11 p.m. curfew stands. Lynch hears the arguments, takes the case under advisement.'
      n: '[[w.rights-in-conflict-convention-week]], 67. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Davis.'
      tags:
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-2
      when: Aug. 23
      date: '1968-08-23'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Judge Lynch dismisses the Mobilization''s suit: the Park District and the city not arbitrary in refusing permits "for the particular places and at the particular times sought"; no First Amendment right to a park to sleep in.'
      n: '[[w.rights-in-conflict-convention-week]], 67–68 (Davis, Dellinger and Peck to City Hall after; Daley out). See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - name:davis-rennie
      - name:dellinger-david
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-3
      when: Aug. 23
      date: '1968-08-23'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: The Yippies withdraw their suit for Lincoln Park, lest a ruling bar even a festival by day.
      n: '[[w.rights-in-conflict-convention-week]], 73. See [[cal.1968-03-26.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-4
      when: Aug. 23
      date: '1968-08-23'
      thread: elections-1968-chicago
      c: Chicago. Some 5,000 of the Illinois National Guard, the 33rd Brigade, five battalions, mobilized for duty in the city; they wait in the armories.
      n: '[[w.rights-in-conflict-convention-week]], 116, 119 (the sheriff''s men on twelve-hour shifts Aug. 23–30). See [[cal.1968-01.elections-1968-chicago]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-5
      when: Aug. 23
      date: '1968-08-23'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago, the Civic Center Plaza. Rubin and other Yippies loose a pig, Pigasus, their candidate for President. The pig seized; six arrested.
      n: '[[w.rights-in-conflict-convention-week]], 134. See [[cal.1968-03-26.elections-1968-chicago]]. Names: Rubin.'
      tags:
      - name:rubin-jerry
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-24.elections-1968-chicago
      when: Aug. 24
      date: '1968-08-24'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: 'Chicago, Lincoln Park. The police command post opens. More than 2,000 in the park by 5 p.m. Ginsberg, Hoffman, Rubin, Sanders and Krassner write statements: they will leave when told. About 11 p.m. some 60 police clear the park; about 200 pushed into Clark Street and down Wells; 11 arrested.'
      n: '[[w.rights-in-conflict-convention-week]], 134–39. See [[cal.1968-08-22.elections-1968]]. Names: Hoffman, Rubin.'
      tags:
      - name:hoffman-abbie
      - name:rubin-jerry
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-25.elections-1968-chicago-2
      when: Aug. 25
      date: '1968-08-25'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago. From Lincoln Park at about 1:30 p.m., a march to the delegates' hotels, the Sherman House first, past the Palmer House, with the police, peaceful; into Grant Park about 3 p.m. Back in Lincoln Park, 3,000 to 5,000 for the music; the Yippies' truck stopped at 5:18 p.m.
      n: '[[w.rights-in-conflict-convention-week]], 140–43. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-2
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Lincoln Park, 11 a.m. The Yippies'' press conference: a telegram to U Thant, law and order broken down in Chicago, an "impartial observer" asked. The North Side Cooperative Ministry, in the afternoon: Chicago a "police state"; churches to lodge the protesters.'
      n: '[[w.rights-in-conflict-convention-week]], 159–60. See [[cal.1968-08-22.elections-1968]]. Names: Thant.'
      tags:
      - name:u-thant
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-3
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Lincoln Park, 2:25 p.m. Hayden and Wolfe Lowenthal arrested: obstructing police, resisting arrest, disorderly conduct. Some 400 to 500, Rennie Davis leading, march to police headquarters, then to Grant Park. Hayden out on $1,000 bond that evening.'
      n: '[[w.rights-in-conflict-convention-week]], 160, 167 (the ABC crew filming the arrest struck, its lens smashed). See [[cal.1968-08-22.elections-1968]]. Names: Hayden, Davis.'
      tags:
      - name:hayden-tom
      - name:davis-rennie
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-4
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: Chicago, Grant Park, about 5 p.m. Marchers climb the Logan statue, across from the Hilton, and drape it with Viet Cong and red flags; the police pull them down, a boy's arm broken; five officers report injuries. Some 1,000 in the crowd by 5:35.
      n: '[[w.rights-in-conflict-convention-week]], 163–66. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-5
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - defense
      c: 'Some 6,000 Army troops, trained for riot control, airlifted from Fort Hood, Tex., Fort Sill, Okla., and Fort Carson, Colo., to Glenview Naval Air Station, Ill., and Great Lakes Naval Training Station, Ill., with rifles, flame throwers and bazookas: Task Force III, the federal force if needed.'
      n: '[[w.rights-in-conflict-convention-week]], 3, 116. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-6
      when: Aug. 26
      date: '1968-08-26'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: Chicago, Lincoln Park, Monday night. From 9 p.m. marches into Old Town; at 10:45 some 45 clergymen at Clark Street. A barricade of picnic tables and trash baskets, about 1,000 behind it. At 12:27 a.m. the Task Force's tear gas; by 12:38 the park empty. Clubbing in the streets of Old Town to 2 a.m., newsmen and residents among the struck.
      n: '[[w.rights-in-conflict-convention-week]], 167–83 (medics treated 24 that night; 15 police treated; Stokes of Cleveland among the crowd, calming it, 181). See [[cal.1968-08-22.elections-1968]].'
      tags:
      - name:stokes-carl-b
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.press-and-broadcasting
      when: Aug. 26
      date: '1968-08-26'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: Chicago. Newsmen beaten by the police on the North Side Monday night; that afternoon a TV reporter warned by two detectives, "the word is out to get newsmen."
      n: '[[w.rights-in-conflict-convention-week]], 308–17. Of 300 newsmen in the parks and streets in the week, 63 attacked by police; in 13 cases their equipment damaged (8). See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-3
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - soviet-union-czechoslovakia
      c: Chicago. Two marches to the Polish Consulate against Poland's part in the invasion of Czechoslovakia, the second about 75 from Lincoln Park; no incidents.
      n: '[[w.rights-in-conflict-convention-week]], 183–84. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-4
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, the Church of the Three Crosses. Some 50 Lincoln Park clergymen and residents form the Lincoln Park Emergency Citizens Committee: police to lift the ban on sleeping in the park. The clergy to hold a prayer vigil in the park from 11 p.m., against the curfew. At 4 p.m. a delegation sees the 18th District''s commander.'
      n: '[[w.rights-in-conflict-convention-week]], 184–85. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.press-and-broadcasting
      when: Aug. 27
      date: '1968-08-27'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: 'Chicago, police headquarters, 3:30 p.m. Conlisk with the city''s editors and the networks'' and magazines'' men on the beatings of newsmen: individual deviations to be investigated; names and photographs given him.'
      n: '[[w.rights-in-conflict-convention-week]], 317–20. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-5
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - black-nationalism
      c: 'Chicago, Lincoln Park, about 7 p.m. Seale of the Black Panthers and Rubin to some 1,500: revolution. Seale: "get your shotguns."'
      n: '[[w.rights-in-conflict-convention-week]], 186–88. See [[cal.1968-08-22.elections-1968]]. Names: Seale, Rubin.'
      tags:
      - name:seale-bobby
      - name:rubin-jerry
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-6
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - labor-disputes
      c: Chicago. From Lincoln Park, a march to the CTA bus barn at Clark and Schubert for the striking Negro bus drivers; at 9 p.m. the police let it circle the barn, not enter.
      n: '[[w.rights-in-conflict-convention-week]], 186, 189–90. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-7
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, the Coliseum. The "un-birthday party" for Johnson, some 3,000: Gregory, Ginsberg, Genet, Burroughs, Southern against the police and Daley. Dellinger: probably a march to the Amphitheatre Wednesday, after the rally in Grant Park.'
      n: '[[w.rights-in-conflict-convention-week]], 206–08. See [[cal.1968-08-22.elections-1968]]. Names: Gregory, Dellinger, Johnson, Daley.'
      tags:
      - name:gregory-dick
      - name:dellinger-david
      - name:johnson-lyndon-b
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.press-and-broadcasting-2
      when: Aug. 27
      date: '1968-08-27'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: 'Chicago, the Amphitheatre floor. Rather of CBS, on the air, asking why a Georgia delegate is being removed, is punched in the stomach by a security man, an employee of the sergeant-at-arms. Cronkite: "a bunch of thugs here."'
      n: '[[w.rights-in-conflict-convention-week]], 321. See [[cal.1968-08-22.elections-1968]]. Names: Cronkite.'
      tags:
      - name:cronkite-walter
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-8
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: Chicago, Lincoln Park, Tuesday night. The clergy's vigil, a wooden cross, the barricade put up again; police mass at 11:30 p.m. After midnight tear gas at the cross, then a sanitation truck's gas sprayer; the crowd driven into Clark Street and Old Town; police smash the windows of cars parked there.
      n: '[[w.rights-in-conflict-convention-week]], 191–204. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-9
      when: Aug. 27
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago. The Park District''s permit for the Mobilization''s rally at the Grant Park bandshell, Aug. 28, 1 to 4 p.m., delivered in the evening: no literature to be handed out; $100,000 to $300,000 of liability insurance. The policy never obtained.'
      n: '[[w.rights-in-conflict-convention-week]], 68, 217. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-27.elections-1968-chicago-10
      when: Aug. 27–28
      date: '1968-08-27'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: 'Chicago, Grant Park, across from the Hilton. Marchers from Lincoln Park and the Coliseum; some 3,000 facing the police at 12:21 a.m. At 1:35 a.m. the deputy superintendent: they may stay the night if peaceful, east of Michigan Avenue. About 3 a.m. 600 of the Guard relieve the police, for the first time in the week.'
      n: '[[w.rights-in-conflict-convention-week]], 206–14 (the 700 police at the Hilton on twelve-hour shifts since Saturday, on duty 15 hours). See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-2
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: 'Chicago, the Grant Park bandshell. The Mobilization''s rally, 8,000 to 10,000 by the afternoon. About 3:30 or 4 p.m. a youth lowers the flag; police charge in to arrest him, under a rain of missiles; Rennie Davis clubbed, by witnesses. Gregory: Daley a "fat, red-faced hoodlum."'
      n: '[[w.rights-in-conflict-convention-week]], 217–30. See [[cal.1968-08-22.elections-1968]]. Names: Davis, Gregory, Daley.'
      tags:
      - name:davis-rennie
      - name:gregory-dick
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-3
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Grant Park, from about 4:30 p.m. Dellinger''s march to the Amphitheatre, nonviolent, held in the park; about an hour of talks, Peck for the march, the deputy superintendent holding firm. About 5 p.m. the Guard blocks Balbo. About 6 or 6:30, the march off: regroup at the Hilton.'
      n: '[[w.rights-in-conflict-convention-week]], 230–36. See [[cal.1968-08-22.elections-1968]]. Names: Dellinger.'
      tags:
      - name:dellinger-david
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.press-and-broadcasting
      when: Aug. 28
      date: '1968-08-28'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: Chicago, the Amphitheatre floor, 8:30 p.m. Mike Wallace of CBS, following a New York delegate taken out for a security check, punched on the chin by a police commander and taken to the command post. Daley and Salant of CBS News come; Wallace and the officer shake hands.
      n: '[[w.rights-in-conflict-convention-week]], 327. See [[cal.1968-08-22.elections-1968]]. Names: Daley.'
      tags:
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-28.elections-1968-chicago-4
      when: Aug. 28
      date: '1968-08-28'
      thread: elections-1968-chicago
      also:
      - war-opposition
      - civil-disorders
      c: Chicago, the Loop, after the clash at the Hilton. By 8:15 the intersection the police's; the Guard in a U across Michigan Avenue by 8:55. At 9:25 a sweep of Michigan south from Monroe; clubbing on Jackson and the side streets. By 10:10 some 800 to 1,000 back across from the Hilton.
      n: '[[w.rights-in-conflict-convention-week]], 9–10, 265–67. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-2
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago, 3:10 a.m. Nearly 600 delegates and alternates, McCarthy's and McGovern's, from a caucus at the Amphitheatre under O'Dwyer, march with candles down Michigan Avenue to the Hilton and the demonstrators in Grant Park; O'Dwyer, Ryan, Goodwin and George Brown at the head. About $2,500 given for bail.
      n: '[[w.rights-in-conflict-convention-week]], 333–35. See [[cal.1968-08-22.elections-1968]]. Names: O''Dwyer, Ryan, Goodwin, Brown, McCarthy, McGovern.'
      tags:
      - name:odwyer-paul
      - name:ryan-william-f
      - name:goodwin-richard-n
      - name:brown-george-e-jr
      - name:mccarthy-eugene-j
      - name:mcgovern-george
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.press-and-broadcasting
      when: Aug. 29
      date: '1968-08-29'
      thread: press-and-broadcasting
      also:
      - elections-1968-chicago
      c: 'Chicago, 10:30 a.m. Sullivan, the police''s press officer, to the newsmen: the demonstration''s leaders communist revolutionaries "bent on the destruction of the United States"; with Johnson out, their target Daley.'
      n: '[[w.rights-in-conflict-convention-week]], 327–28. See [[cal.1968-08-22.elections-1968]]. Names: Daley, Johnson.'
      tags:
      - name:daley-richard-j
      - name:johnson-lyndon-b
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-3
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: Chicago, 4 p.m. The Wisconsin delegation's walk from the Bismarck Hotel, some 500 with clergy and residents, through the Loop; demonstrators join it.
      n: '[[w.rights-in-conflict-convention-week]], 338–41. See [[cal.1968-08-22.elections-1968]].'
      tags:
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-4
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      also:
      - war-opposition
      c: 'Chicago, Grant Park. McCarthy crosses the police and Guard lines in front of the Hilton to more than 2,000: "the government of the people in exile"; work within the system, take the party in 1972. After, some 500 march south behind ex-Peace Corps volunteers, Hoffman with them; turned back at 16th Street by police and Guardsmen with fixed bayonets.'
      n: '[[w.rights-in-conflict-convention-week]], 341. See [[cal.1968-08-22.elections-1968]]. Names: McCarthy, Hoffman.'
      tags:
      - name:mccarthy-eugene-j
