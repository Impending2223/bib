      c: Peking to Hangzhou.{1} By Wu Lengxi's account Deng Xiaoping, Peng Zhen, Lu Dingyi and Kang Sheng, with Wu, Yao Zhen and Fan Ruoyu, leave in the morning for the enlarged Standing Committee
        Mao has called at Hangzhou.{2} The weather puts them down at Nanjing for a short stay. At Hangzhou, where the day's heat is 34 degrees, they lodge at the new Xiling Hotel with the regional
        bureaus' secretaries and Tan Zhenlin, Li Fuchun, Bo Yibo and Liao Luyan; Chen Boda, there before them, is in a villa by the West Lake.{3}
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 561–562 ("on the morning of May 2, after May Day"; the first modern hotel in Hangzhou; Liu Shaoqi, abroad on a state visit, not at the meeting);
