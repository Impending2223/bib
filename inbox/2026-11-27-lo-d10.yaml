        [[w.deng-xiaoping-nianpu-1904]], III, 1756–1757), and the Mao nianpu has Mao at Shanghai May 3 to 5 and at Hangzhou from May 6 ([[w.zedong-mao-zedong-nianpu]], V). Wu''s own days of the
        Hangzhou meetings are not settled by a record.'
