- edit:
    id: cal.1962-12-24.cuba-2
    base: 3158b0dd
    set:
      c: Kennedy calls Cardinal Cushing, who pledges $1 million, and General Clay, who raises the other $1,925,000 and signs a personal note for it.{3} At the President's suggestion, Kennedy asks
        Cushing for a million before the day is over; by Cushing's account he calls back that afternoon, within three hours, the money to be at the White House before six.{4} Cushing is a sponsor
        of the Families Committee, Clay head of its fund-raising.{5}
      n: '[[w.guthman-we-band-of-brothers]], 136; [[w.schlesinger-robert-kennedy-and-his]], 537 (Robert Kennedy turns to Cushing, who raises $1 million in a few hours from Latin American friends;
        Clay raises the rest on his personal note; not the flights, the hour, the figure $1,925,000 or the calls of Nolan and Williams); [[w.odonnell-johnny-we-hardly-knew]], 311–12 (Cushing''s
        account: Robert Kennedy telephones him, at the President''s suggestion, to ask for a million dollars before the day is over, to get the prisoners out before Christmas; he calls back in
        three hours with the money, to be delivered to the White House before six that night; Robert Kennedy had raised $1,900,000 with the help of General Clay; not Nolan and Williams''s calls,
        the flights, the hour or Katzenbach); [[w.odonnell-johnny-we-hardly-knew]], 311. To check: Richard Cardinal Cushing, recorded interview by Jean Stein, n.d., 3, Stein Papers (cited by [[w.schlesinger-robert-kennedy-and-his]],
        537 n.16). See [[cal.1962-12-23.cuba]]. Names: Robert Kennedy, Clay, Cushing. Split under R17 and R25b: Castro''s demand, made on Sunday, Dec. 23, the money due at 3 p.m. "the next afternoon"
        ([[w.guthman-we-band-of-brothers]], 136), is [[cal.1962-12-23.cuba-2]]; Nolan''s early-morning call is [[cal.1962-12-24.cuba-6]], and Kennedy''s calls to Cushing and Clay come after it
        (Guthman: "immediately"). Check: the hour of the calls to Cushing and Clay.'
      tags:
      - name:kennedy-robert-f
      - name:clay-lucius-d
      - name:cushing-richard-g
      variants:
      - unit: '3'
        witness: w.odonnell-johnny-we-hardly-knew
        reads: Cushing promises the million at the White House "before six o'clock that night"; General Clay, in the Attorney General's office "the next morning," signs a note for $2,900,000;
          the prisoners are released "that afternoon" and flown to Miami
        at: 311–12
      src:
        c: 53d2a8d8
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 537: ?'
        - 'w.odonnell-johnny-we-hardly-knew 311–12: ?'
        - 'w.odonnell-johnny-we-hardly-knew 311: 4'
        - 'w.guthman-we-band-of-brothers 136: 3, 5'
    kind: correct
    settles:
    - 'Check: the day; Guthman: "It was Sunday"'
