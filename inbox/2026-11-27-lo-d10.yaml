        Zhen, Lu Dingyi, Kang Sheng, Tan Zhenlin, Li Fuchun, Bo Yibo, Chen Boda, Mao Zedong, Wu Lengxi, Yao Zhen, Fan Ruoyu, Liao Luyan. Check: Wu''s days cannot stand as he has them: Yang''s
        diary and Deng''s nianpu have Deng, Kang Sheng and Wu Xiuquan at Pyongyang May 2–4, Deng back in Peking May 4, at Zhou Enlai''s meeting there May 8, and on the train to Hangzhou only on
        May 10 ([[w.yang-shangkun-riji]], II, 275–277; [[w.deng-xiaoping-nianpu-1904]], III, 1756–1757), and the Mao nianpu has Mao at Shanghai May 3 to 5 and at Hangzhou from May 6 ([[w.zedong-mao-zedong-nianpu]],
        V). Wu''s own days of the Hangzhou meetings are not settled by a record. Peng Zhen''s nianpu has Peng Zhen go to Hangzhou May 2 (IV, 261), and Yang''s diary of May 2 has him telephone,
