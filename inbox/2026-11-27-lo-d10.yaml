    set:
      c: Civil rights message.{1} Public accommodations;{2} school suits by the Attorney General;{3} a Community Relations Service;{4} no federal funds for discrimination;{5} in voting suits,
        a sixth-grade education presumed literacy.{6} Fair employment backed, not asked.{7} Celler's bill, H.R. 7152, June 20.{8}
      n: 'Special Message to the Congress on Civil Rights and Job Opportunities, [1963 Pub. Papers 483](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=541) (June
        19, 1963). [[w.branch-pillar-of-fire]], 114; [[w.sorensen-kennedy]], 496–99 (the message and bill); [[w.sundquist-politics-and-policy]], 263; [[w.mann-walls-of-jericho]], 371 (Celler''s
        bill, June 20); [[w.zelizer-fierce-urgency-of-now]], 49–50; [[w.bernstein-guns-or-butter]], 43, 45 (the omnibus measure; its titles); [[w.reeves-president-kennedy]], 527–28 (the White
        House bill, seven titles, introduced June 19; Title II on public accommodations); [[w.obrien-no-final-victories]], 144 (the civil rights bill sent to Congress on June 19: a ban on discrimination
        in public accommodations, authority for the Attorney General to seek school desegregation, a Community Relations Service; not the rest); [[w.risen-bill-of-the-century]], 77–78 (the message
        and the seven titles of H.R. 7152; fair employment endorsed, not in the bill; the sixth-grade presumption, not said to be in voting suits); [[w.purdum-idea-whose-time-has-2014]], 60–62,
        80 (the bill sent June 19: voting referees, public accommodations, school suits, a Community Relations Service, four more years for the Commission, the cutoff of federal aid, an Equal
        Employment Opportunity Commission; no FEPC; not the sixth-grade rule); [[w.mann-walls-of-jericho]], 371. To check: [[w.graham-civil-rights-era]]. Split under R25b: Mansfield''s bills in
        the Senate are [[cal.1963-06-19.civil-rights-bill-3]] (S. 1731 and S. 1732, before the Republican conference) and [[cal.1963-06-19.civil-rights-bill-4]] (S. 1750, after it and after the
        message was read in the Senate). See [[cal.1963-06-11.civil-rights-bill]]. Names: Celler.'
