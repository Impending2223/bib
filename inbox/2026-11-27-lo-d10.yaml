      c: 'Hangzhou, the eighth floor of the Xiling Hotel, west end.{1} By Wu Lengxi''s account Deng Xiaoping, three mornings, May 3 to 5, chairs the exchange of views on the Peking and Hangzhou
        drafts: Peng Zhen, Lu Dingyi, Chen Boda and Kang Sheng, the drafters Wu Lengxi, Yao Zhen, Fan Ruoyu and Wang Li, and Kang Sheng''s secretary, Li Xin;{2} Lin Ke sits the three days and
        takes both sides'' views to Mao. Wu opens: Peking''s drafters find Chen''s draft short on practice and on the Soviet views, long on general principle, a textbook; Chen answers that Mao
        asked it to begin from contradictions. Lu Dingyi faults both; Deng and Peng Zhen fault Peking''s draft and ask that Chen''s be tied closer to the open polemic.{3}'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 563–565 (the meeting "at first cold," Wu speaking first; Chen Boda, "who held himself high," displeased at the manner of discussion, in which
        the drafters call out and answer at once; Deng: all views may be said, anyone''s may be refuted; Peking''s draft strong on the real situation and the actual contradictions, short on theory;
        Deng asks Lin Ke, as the sessions end, whether he has told Mao all; Lin Ke has, and Mao will talk after the meeting). Made public: 1999. Names: Deng Xiaoping, Peng Zhen, Lu Dingyi, Chen
        Boda, Kang Sheng, Mao Zedong, Wu Lengxi, Yao Zhen, Fan Ruoyu, Wang Li, Li Xin, Lin Ke. Check: Wu''s days cannot stand as he has them: Yang''s diary and Deng''s nianpu have Deng, Kang Sheng
