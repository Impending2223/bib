        secretaries joined the first; Mao then gave himself to the "Former Ten Points"); [[w.peng-zhen-nianpu-1902]], IV, 261 (May 2–12, 1963; Peng Zhen at Hangzhou at Mao''s small meeting on
        rural socialist education; before it the Center had forwarded the report on Xiyang county''s cadres in labor (Mar. 20) and the North China Bureau''s on poor and lower-middle peasants''
        organizations (Apr. 9), and printed the Baoding prefectural committee''s report on the "four clean-ups" (Apr. 4); Mao names Peng Zhen to draft the first paper on the movement). Made public:
