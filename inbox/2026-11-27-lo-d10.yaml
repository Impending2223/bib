      c: Near dawn, Nadasdy, the outgoing chairman, declares Lukens, White's candidate, elected by two votes. The convention adjourns at 5:15 a.m.
      n: '[[w.perlstein-before-the-storm]], 219–21 (Nadasdy declares Lukens the winner by two votes; adjourned at 5:15 a.m., two-thirds of the agenda left); [[w.kabaservice-rule-and-ruin]], 64–65
        (conflicting tallies at 5:15 in the morning, McDevitt winning or losing by two; Lukens declared elected); [[w.smith-on-his-own-terms]], 410 (Lukens elected by two votes, after five in
        the morning); [[w.young-two-suns-of-the]], 67 (a Goldwater man elected); [[w.novak-agony-of-the-g]], 195–201 (adjourned at 5:15 a.m., having adopted only the statement of principles and
        elected officers, by Hiller''s report). Check: the day: June 29 by Perlstein''s session of twenty-two hours from the Friday morning (219); White has the roll calls on Friday, June 28,
        Nadasdy declaring McDevitt after the first and Lukens a majority on the second, the session over near midnight (171–72). Split under R17 and R25b. See [[cal.1963-06-25.republican-party]];
        [[cal.1963-06-27.republican-party]]. Names: Nadasdy, Lukens, White.'
