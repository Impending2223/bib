      c: Mansfield, for himself and Dirksen, sends to the desk S. 1750, the whole program but public accommodations, after the President's message is read in the Senate. Dirksen asks that it lie
        on the desk until the close of Monday's work for cosponsors.
      n: 'The Senate sat from noon to 7:09 p.m.: [Daily Digest, D285](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=283). 109 Cong. Rec. [11,161–62](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt8/pdf/GPO-CRECB-1963-pt8-13-1.pdf#page=87)
        (1963) (S. 1750, "introduced by Mr. Mansfield (for himself and Mr. Dirksen)"; Dirksen: to lie on the desk until the end of the work day Monday, for cosponsors); the message read in the
        Senate, 11,156–61. [[w.civil-rights-presidents-program-1963]], 12–20 (S. 1750: S. 1731 without its preamble and the public accommodations title, Eastland, 1). The order: after [[cal.1963-06-19.civil-rights-bill]],
        109 Cong. Rec. 11,156–62 (the message read in the Senate, then the bill). Split under R25b. See [[cal.1963-06-19.civil-rights-bill]]. Names: Mansfield, Dirksen.'
