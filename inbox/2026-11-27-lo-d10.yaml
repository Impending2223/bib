      c: 'San Francisco, Longshoremen''s Hall at Fisherman''s Wharf, Thursday night. Goldwater, to some 3,000 delegates and guests of the Young Republicans'' convention: "Modern liberalism is
        only a form of rigor mortis." A long ovation.'
      n: '[[w.white-suite-3505]], 169–70 (Thursday night, the Young Republicans given "a respite from the convention battle"; Davies in the *Times*, June 28: 3,000 in Longshoremen''s Hall; the
        "rigor mortis" sentence); [[w.perlstein-before-the-storm]], 219 (the speech; the seven-minute ovation; the next morning the session of twenty-two hours); [[w.young-two-suns-of-the]], 67
        (Goldwater''s "rigor mortis"). Check: the day: White''s Thursday is June 27. Split under R17. See [[cal.1963-06-25.republican-party]]. Names: Goldwater.'
