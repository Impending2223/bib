      c: After four flights, 426 men out, Castro demands the $2,925,000 pledged for the wounded, by 3 p.m. the next afternoon or the rest stay. It is Sunday, the banks closed.
      n: '[[w.guthman-we-band-of-brothers]], 136 ("It was Sunday, and all the banks were closed"; the four flights began in the late afternoon of Dec. 23, 135–36); [[w.schlesinger-robert-kennedy-and-his]],
        537 (half the remaining prisoners loaded, the Cubans hold the rest until the $2.9 million unpaid for the April release comes; not the flights, the hour or the figure $1,925,000). Check:
        the hour of the demand: Guthman gives none. Check: O''Donnell, 311–12, has the demand "at the last minute, only a few days before the Christmas Eve deadline," of "another $2,900,000 in
        cash." Split under R17 and R25b: the money''s raising on Dec. 24 is [[cal.1962-12-24.cuba-2]]. See [[cal.1962-12-23.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      - ok:fields-time
- add:
    entry:
      id: cal.1962-12-24.cuba-6
      when: Dec. 24
      date: '1962-12-24'
      time: 1962-12-24T10:00Z
      time_zone: America/New_York
      place:
      - miami
      - hickory-hill
      thread: cuba
      c: 'At 5 a.m. Nolan and Williams, in Miami from Havana, call Robert Kennedy at Hickory Hill and Katzenbach: Castro is adamant, no cash, no prisoners. Kennedy asks whether they are in a stronger
        position a second after the money is handed over than a second before. Told Castro is dug in, he sets about raising it by 3 p.m.'
      n: '[[w.thomas-robert-kennedy]], 237 (5 a.m. on Dec. 24, Nolan to Kennedy at Hickory Hill; Castro adamant, no cash, no prisoners; "a second after ... or ... before"); [[w.guthman-we-band-of-brothers]],
        136 (Nolan, who was in Havana, and Williams fly to Miami and explain it to Kennedy and Katzenbach "in an early-morning phone call"; the money by 3 p.m.). The hour is Thomas''s. Check:
        whether Williams and Katzenbach were on the call at 5 a.m.: Thomas names Nolan and Kennedy only. Split under R25b: Kennedy''s calls to Cushing and Clay are [[cal.1962-12-24.cuba-2]]; Castro''s
        demand of the day before is [[cal.1962-12-23.cuba-2]]. See [[cal.1962-12-23.cuba-2]]. Names: Nolan, Williams, Robert Kennedy, Katzenbach.'
      tags:
      - name:kennedy-robert-f
      - name:katzenbach-nicholas
      - ok:fields-time
- edit:
    id: cal.1963-01-08.china-leadership
    base: bddb915d
    set:
      c: 'Evening, Hangzhou. Mao asks Zhou Enlai to draft for the Central Committee a notice on the 1963 plan (farms, markets, finance, staff cuts), for the regional first secretaries on Feb.
        5.{1} Zhou telephones Yang Shangkun that day for Liu Shaoqi, Deng Xiaoping and Peng Zhen Mao''s three points: the anti-revisionist articles not to appear until Khrushchev has spoken at
        the East German party''s congress, then to be answered together with his Supreme Soviet speech;{2} more writers to join the Chinese delegation to that congress; a small meeting of the
        regional secretaries from Feb. 5, one with provincial secretaries from Feb. 10.{3}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963 (and Jan. 9). [[w.zhou-enlai-nianpu-1949]], II, 525 (Jan. 15, 1963: Zhou Enlai, at Mao''s request, drafts the Central Committee notice
        on the 1963 plan and the like; the nianpu gives a conference in mid-February, not a meeting of the regional secretaries from Feb. 5); [[w.deng-xiaoping-nianpu-1904]], III, 1741–1742 (Jan.
        9, 1963; Deng reads the record of Zhou Enlai''s call of the 8th from Hangzhou, in which Zhou gives Mao''s three instructions: the anti-revisionist article held until Khrushchev has spoken
        at the SED congress and then answered with his Supreme Soviet speech; more ''writers'' (秀才) for the delegation; Ke Qingshi''s plan of a small meeting on Feb. 5 with the bureau secretaries
        and a work conference on Feb. 10 with the provincial secretaries). The words: 晚上，同周恩来谈话 ([[w.zedong-mao-zedong-nianpu]], V, Jan. 8, 1963). Made public: 1997. After [[cal.1963-01-08.china-leadership-4|Zhou''s
        seeing Bandaranaike off at Shanghai]]: Zhou is at Shanghai''s Hongqiao airport that day ([[w.zhou-enlai-waijiao-huodong]], 349), and with Mao at Hangzhou that evening. The day of the call
        is Jan. 8, not the 9th: Yang''s diary has Zhou''s call from Hangzhou on the 8th and none on the 9th ([[w.yang-shangkun-riji]], II, 241–242), and Deng''s nianpu has Deng read on the 9th
        the record of the call of the 8th ([[w.deng-xiaoping-nianpu-1904]], III, 1741–1742); the Mao nianpu puts it on the 9th. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Peng Zhen,
        Khrushchev, Yang Shangkun.'
    kind: correct
    settles:
    - 'Check: Yang Shangkun''s diary records a call from Zhou Enlai at Hangzhou on Jan. 8'
