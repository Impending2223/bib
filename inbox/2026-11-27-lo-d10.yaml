      c: In the Senate Mansfield introduces S. 1731, the whole program of the message, thirty-seven Democrats and nine Republicans sponsoring; with Magnuson, S. 1732, public accommodations alone.
      n: 'The Senate sat from noon to 7:09 p.m.: [Daily Digest, D285](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=283). 109 Cong. Rec. [11,076–77,
        11,081](https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt8/pdf/GPO-CRECB-1963-pt8-13-1.pdf#page=3) (1963) (S. 1731, "proposed by the President"; he says a second bill, without the
        public accommodations title, will come "this afternoon"; S. 1732, introduced by Mr. Mansfield for himself and Mr. Magnuson, the Interstate Public Accommodations Act of 1963). [[w.civil-rights-presidents-program-1963]],
        1–12 (S. 1731, the program as a Senate bill: "most of the recommendations" of the messages of Feb. 28 and June 19, Eastland, 1); [[w.mann-walls-of-jericho]], 371 (Mansfield''s three bills,
        June 19: the whole program, thirty-seven Democrats and nine Republicans sponsoring; with Dirksen, all but public accommodations; with Magnuson, public accommodations alone); [[w.purdum-idea-whose-time-has-2014]],
        60–62, 80 (Mansfield''s introduction in the Senate with Dirksen''s alternative and Magnuson''s separate bill). The hour is a range: the Senate sat from noon, and Dirksen at the Republican
        conference, 2:45 p.m., has Mansfield already introduced two ([[cal.1963-06-19.republican-party-congress]]). Split under R25b. See [[cal.1963-06-19.civil-rights-bill]]. Names: Mansfield,
        Magnuson.'
      tags: &id001
      - name:mansfield-mike
      - name:dirksen-everett
      - name:magnuson-warren-g
      - name:kennedy-john-f
