      c: From his office, on radio and television, the President says the Government will do what must be done to keep order in Birmingham; the agreement a fair and just accord, not to be sabotaged
        by extremists on either side. Marshall to go back to Birmingham that evening; McNamara to alert units trained in riot control and send selected units to bases near Birmingham; the steps
        to call the Alabama Guard into Federal service to be taken now.
      n: 'Radio and Television Remarks Following Renewal of Racial Strife in Birmingham, [1963 Pub. Papers 397](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=455)
        (May 12, 1963; the note: broadcast from the President''s office at 9 p.m.). [Kennedy, Robert Kennedy, Katzenbach, Marshall, McNamara and others, May 12](https://prde.upress.virginia.edu/conversations/4006291),
        JFK Meeting Tape 86.2 (PRDE only). [[w.sorensen-kennedy]], 491 (May 12: the troops; the statement at 9 p.m.); [[w.caro-passage-of-power]], 257 (Sunday, May 12, Kennedy back from Camp David
        for crisis meetings; the Second Infantry Division and the 82nd Airborne on alert; the papers drawn to federalize the Alabama Guard); [[w.branch-parting-the-waters]], 796–800 (the Sunday
        meetings; Marshall''s call to King from the Oval Office; three thousand troops moved in Operation Oak Tree; the statement drafted in the Cabinet Room); [[w.white-making-of-the-president-1965]],
        170 (battle units moved into position, never used); [[w.purdum-idea-whose-time-has-2014]], 32–33 (the statement, just before nine on May 12, Army units near Birmingham alerted and the
        Alabama Guard to be federalized if necessary). Check: the hour: the Papers'' note has the broadcast at 9 p.m.; Branch has the President step out at 8:48 p.m. (800). Split under R17. See
        [[cal.1963-05-11.alabama]]; [[cal.1963-05-12.civil-rights-the-executive]]. Names: Kennedy, McNamara, Marshall.'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
      - name:marshall-burke
      - state:al
      - city:birmingham
