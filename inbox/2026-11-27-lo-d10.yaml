    set:
      c: 'San Francisco, the Young Republican National Federation''s convention.{1} A session of twenty-two hours.{3} Its platform: the federal income tax abolished, the United States out of the
        United Nations, a "Court of the Union" over the Supreme Court, segregation kept.{6}'
      n: '[[w.perlstein-before-the-storm]], 216–21; [[w.white-suite-3505]], 166–72 (the convention, June 25–28, at the Sheraton-Palace; Goldwater''s speech Thursday night, 169–70); [[w.goldberg-barry-goldwater]],
        172 (the Goldwaterites in control; Hinman on the Birchers there: "There is an insanity in the air around here"); [[w.smith-on-his-own-terms]], 410 (a week after Denver); [[w.novak-agony-of-the-g]],
        195–201 (June 27–28 on the floor, the Sheraton-Palace; three in four delegates for Goldwater; Gaston directing the disruption; Nadasdy; adjourned at 5:15 a.m., having adopted only the
        statement of principles and elected officers, by Hiller''s report; the resolutions committee''s civil rights plank never brought to the floor). [[w.kabaservice-rule-and-ruin]], 64–65 (Nadasdy
        kept in the chair twenty-two hours; the tallies at 5:15 a.m., McDevitt winning or losing by two; Lukens declared elected; the platform). Check: the days. Check: Goldberg, 172, puts the
        Young Republicans'' convention at Denver. Split under R17 and R25b: Goldwater''s speech of Thursday night, June 27, is [[cal.1963-06-27.republican-party]]; the election of Lukens and the
        adjournment at 5:15 a.m. are [[cal.1963-06-29.republican-party]]. Check: Young, 67, puts the convention in August 1963. Check: White, 171–72, has Nadasdy declare McDevitt after the first
        roll call, Lukens a majority on the second, the session over near midnight.'
