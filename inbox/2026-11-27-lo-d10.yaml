- edit:
    id: cal.1963-01-17.china-leadership-3
    base: ae8a516a
    set:
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 521–522 (Jan. 17, Liu Shaoqi''s Politburo; the delegation to expect interference, even interruption, and to have its text translated, typed and
        handed out from several places by the embassy, delegation, Xinhua and the students); [[w.deng-xiaoping-nianpu-1904]], III, 1742–1743 (Jan. 17, 1963; morning, 上午; Deng at the Politburo
        meeting Liu Shaoqi presides over, on the problems at the SED''s Sixth Congress; the meeting decides to revise the Chinese delegation''s address); [[w.mao-zedong-zhuan]], V, ch. 71 (Khrushchev
        names the Chinese party in public at the SED congress, Jan. 15–21; Liu in Peking decides that the delegation speak, stressing opposition to false unity, and that the writers draft a fourth
        reply; no day for Liu''s decision). Made public: 1999. The Politburo met in the morning, by the nianpu (上午, [[w.deng-xiaoping-nianpu-1904]], III, 1742–1743); the meeting at Liu Shaoqi''s
        from 4:30 to 5:45 p.m. in Yang Shangkun''s diary is a later one, on the document of the morning''s meeting: it is [[cal.1963-01-17.china-polemic]], split from this entry. Check: whether
        the morning meeting is the Secretariat''s, "several comrades," from 10:30 a.m. to 2 p.m., of [[cal.1963-01-17.china-leadership-4]] ([[w.yang-shangkun-riji]], II, 244): the same day, matter
        and a morning hour under another name. Names: Liu Shaoqi, Khrushchev.'
      src:
        c: d8ed1ced
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 521–522: 1, 2, 3, 4'
        - 'w.deng-xiaoping-nianpu-1904 III, 1742–1743: ?'
        - 'w.mao-zedong-zhuan V, ch. 71: 3'
      time_range:
      - 1963-01-16T22:00Z
      - 1963-01-17T04:00Z
      time_band: morning
      time_zone: Asia/Shanghai
      range_basis: record
    settles:
    - 'Check: whether the Politburo meeting is the one at Liu Shaoqi''s of 4:30'
    - 'Check: the nianpu puts the Politburo meeting in the morning'
