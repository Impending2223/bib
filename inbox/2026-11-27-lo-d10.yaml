    id: cal.1963-06-12.jobs-and-wages
    base: 342b5969
    set:
      c: 'Albert to the President by telephone, after the House vote, recorded, on the Democrats who sank a $450 million section of the public works bill: "I couldn''t do a damn thing with them."{1}
        Kennedy: "Civil rights did it";{2} "it''s like they shoot this guy in Mississippi ... this has become everything."{3} Albert: civil rights "overwhelming the whole program."{4}'
      n: '[[w.branch-parting-the-waters]], 827–28; [[w.risen-bill-of-the-century]], 69 (Albert and Kennedy on the Area Redevelopment bill lost: "Civil rights did it"; "overwhelming the whole program");
        [[w.purdum-idea-whose-time-has-2014]], 63 (the call after the vote that sank the Area Redevelopment funds, the day after the address; Albert: "awful," it will hurt the farm bill and mass
        transit; not the figure nor the words quoted here). To check: [Kennedy and Albert, June 12](https://prde.upress.virginia.edu/conversations/4001530), JFK Dictabelt 22A.2 (PRDE only) (cited
        by [[w.branch-parting-the-waters]], 827 n.2). The call is after the vote on June 12 ([[cal.1963-06-12.program]]), not in the morning: Purdum has it "after the vote" that sank the Area
        Redevelopment funds that day (63), the House having sat from noon, and the recording is dated June 12 (PRDE); Branch''s "the morning after the Evers murder" (827) cannot be the morning
        of June 12, before the vote. Check: the bill (Branch''s "public works bill"; the House that day rejected the area redevelopment amendments). See [[cal.1963-06-12.program]]. Names: Albert,
        Kennedy.'
      src:
        c: f5dc96b7
        rows:
        - 'w.branch-parting-the-waters 827-28: 1, 2, 3, 4'
        - 'via w.branch-parting-the-waters 827 n.2: 1, 2, 3, 4'
        - 'w.risen-bill-of-the-century 69: 2, 4'
        - 'w.purdum-idea-whose-time-has-2014 63: ?'
