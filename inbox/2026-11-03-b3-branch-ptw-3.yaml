      id: cal.1962-11-15.georgia-albany
      when: Nov. 15
      date: '1962-11-15'
      thread: georgia-albany
      also:
      - civil-rights-the-executive
      - press-and-broadcasting
      c: 'The Southern Regional Council''s study of Albany, for the movement''s first anniversary. Sitton in the *New York
        Times*, on the front page: "President Chided Over Albany, Ga.: Fails to Guard Negro Rights." The government "has hovered
        about Albany from the beginning. Incredibly, in this whole time, it has not acted"; it "will not move in racial controversies
        unless there is uncontrolled violence."'
      n: '[[w.branch-parting-the-waters]], 680–81, 683. To check: Sitton, New York Times, Nov. 15, 1962 (cited by [[w.branch-parting-the-waters]],
        680 n.5); interviews: Leslie Dunbar, May 12, 1986 (cited by [[w.branch-parting-the-waters]], 683 n.1). See [[cal.1962-08-10.albany]].
        Names: Kennedy.'
      src:
        c: 3e3d0b88
        rows:
        - 'w.branch-parting-the-waters 680–81, 683: all'
        - 'via w.branch-parting-the-waters 680 n.5: all'
      tags:
      - name:kennedy-john-f
      - state:ga
      - city:albany-ga
- add:
    entry:
      id: cal.1962-11.georgia-albany
      when: Nov.
      date: 1962-11
      thread: georgia-albany
      also:
      - king
      c: 'The Albany Movement''s anniversary, a week of nightly meetings. King at Third Kiokee Baptist: a boycott of segregated
        businesses "on the national economic level." "I am willing to come back to Albany and go to jail, if necessary."'
      n: '[[w.branch-parting-the-waters]], 680. To check: Laurie Pritchett, memorandum, Nov. 10, 1962, Albany city records
        (cited by [[w.branch-parting-the-waters]], 680 n.3); Atlanta Constitution, Nov. 16, 1962, 5 (cited by [[w.branch-parting-the-waters]],
        680 n.4). Check: the day; Pritchett''s memorandum Nov. 10, the Constitution''s report Nov. 16. Names: Martin Luther
        King.'
      src:
        c: c05918b7
        rows:
        - 'w.branch-parting-the-waters 680: all'
        - 'via w.branch-parting-the-waters 680 n.3: B'
        - 'via w.branch-parting-the-waters 680 n.4: C'
      tags:
      - name:king-martin-luther-jr
      - state:ga
      - city:albany-ga
- add:
