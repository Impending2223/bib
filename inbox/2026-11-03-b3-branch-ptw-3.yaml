      when: Dec. 14
      date: '1962-12-14'
      thread: alabama-birmingham
      c: 'Friday. A bomb outside Bethel Baptist, Birmingham, Shuttlesworth''s old church, bombed twice before: the windows
        shattered, the parsonage''s roof torn off, two infants cut. Connor, running for mayor, takes charge: "Dammit, they
        ought to be hung when they''re caught." No arrests.'
      n: '[[w.branch-parting-the-waters]], 683. To check: Birmingham News, Dec. 15, 1962, 1 (cited by [[w.branch-parting-the-waters]],
        683 n.4). Names: Shuttlesworth, Connor.'
