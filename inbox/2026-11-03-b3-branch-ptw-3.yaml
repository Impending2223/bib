      date: '1963-04-09'
      thread: alabama
      also:
      - alabama-birmingham
      c: 'Montgomery. Wallace and Alabama''s officials draft a bill raising the maximum appeal bond in misdemeanors from $300
        to $2,500, for Birmingham alone, and a resolution: the city "has been invaded by foreigners who would by force and
        violence attempt to overthrow laws." Connor and Wallace want a hundred troopers sent in; the sheriff, the papers,
        the businessmen and Boutwell''s people Pritchett''s methods. The compromise: no troopers for now; Connor to get a
        court order against the protests.'
      n: '[[w.branch-parting-the-waters]], 726–27. To check: Birmingham News, Apr. 10, 1963, 6 (cited by [[w.branch-parting-the-waters]],
        726 n.3). Check: the day of the compromise; Branch, "Tuesday." Names: Wallace, Connor, Boutwell.'
