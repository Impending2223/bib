- add:
    entry:
      id: cal.1962-10-28.alabama-birmingham
      when: Oct. 28
      date: '1962-10-28'
      thread: alabama-birmingham
      also:
      - labor
      c: 'Birmingham''s three commissioners, Connor among them, in secret with the firemen''s leaders: a million-dollar raise
        if the firemen vote against the new charter. A reformer tapes it. Radio advertisements before the vote: a fireman,
        "Do we get the raise regardless of how the election comes out next Tuesday?"; Mayor Arthur Hanes, "Absolutely not.
        You don''t get your raises unless we are here to give it to you."'
      n: '[[w.branch-parting-the-waters]], 674. To check: David Vann, Duard LeGrand Lecture, 1978, University of Alabama in
        Birmingham (cited by [[w.branch-parting-the-waters]], 674 n.1). Check: the days of the advertisements. See [[cal.1962-11-06.alabama-birmingham]].
        Names: Connor.'
      src:
        c: 8b6d2966
        rows:
        - 'w.branch-parting-the-waters 674: all'
        - 'via w.branch-parting-the-waters 674 n.1: C'
      tags:
      - name:connor-eugene
      - state:al
      - city:birmingham
