      date: '1963-04-10'
      thread: alabama-birmingham
      also:
      - court
      c: 'About 9 p.m., Judge William A. Jenkins of the State''s circuit court signs Connor''s injunction against 133, King
        named first: no "parading, demonstrating, boycotting, trespassing and picketing," nor "kneel-ins" in churches. Served
        on King, Abernathy and Shuttlesworth after 1 a.m. in the Gaston Motel''s restaurant, before the cameras. At the night''s
        mass meeting King had called those breaking the boycott "traitors to the Negro race."'
      n: '[[w.branch-parting-the-waters]], 727. To check: Westin and Mahoney, *The Trial of Martin Luther King*, 69–73 (cited
        by [[w.branch-parting-the-waters]], 727 n.2); Birmingham police notes on the mass meeting, Apr. 10, 1963 (cited by
        [[w.branch-parting-the-waters]], 727 n.1). See [[cal.1963-04-09.alabama-al]]. Names: Connor, Martin Luther King, Abernathy,
        Shuttlesworth.'
