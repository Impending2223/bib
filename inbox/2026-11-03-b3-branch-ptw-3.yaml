      date: '1962-11-14'
      thread: king
      also:
      - antisubversion
      c: 'The FBI''s wiretap. Lotte Kunstler, arranging SCLC''s Sammy Davis benefit of Dec. 11, to Levison, on O''Dell''s
        handling its money after the stories: "this thing might bounce back on us." "That spotlight is a powerful thing."
        Transcripts to headquarters.'
      n: '[[w.branch-parting-the-waters]], 677–78. To check: Levison intercept, Nov. 14, 1962, FBI New York file 100-111180;
        FBI headquarters memorandum, Nov. 15, 1962 (cited by [[w.branch-parting-the-waters]], 678 n.1). See [[cal.1962-10-26.king]].
        Names: Levison, O''Dell.'
      src:
