      when: Dec. 26
      date: '1962-12-26'
      thread: civil-rights-the-executive
      c: 'Lee White to Salinger, for the President at Palm Beach, a draft proclamation for the Emancipation centennial: "WHEREAS
        Negro citizens are still being denied rights guaranteed by the Constitution ... the Emancipation Proclamation expresses
        our Nation''s policy, founded on justice and morality." Not to issue a statement "would be regarded as a minor disaster."
        The Budget Bureau had found it "undesirable" to use the Civil War Centennial Commission.'
      n: '[[w.branch-parting-the-waters]], 685–86. To check: White to Salinger, Dec. 26, 1962, with the draft, Lee White Papers,
        Box 20, JFK Library (cited by [[w.branch-parting-the-waters]], 686 nn.3–4); the Budget Director to White, Lee White
        Papers, Box 20 (cited by [[w.branch-parting-the-waters]], 685 n.4). See [[cal.1962-09-22.civil-rights-the-executive]].
        Names: Lee White, Salinger, Kennedy.'
