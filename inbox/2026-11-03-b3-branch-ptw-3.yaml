      c: 'Berl Bernhard''s office, the Civil Rights Commission. Word from Palm Beach: a Second Emancipation Proclamation cannot
        be done halfway. Louis Martin proposes instead a White House reception for Negro leaders on Lincoln''s Birthday; Schlesinger:
        "I think Louie''s got something." Palm Beach trades the proclamation for the reception.'
      n: '[[w.branch-parting-the-waters]], 686–87. To check: interviews: Louis Martin, June 10, 1985; Lee White, oral history,
        JFK Library (cited by [[w.branch-parting-the-waters]], 687 n.1). Check: the day; after Dec. 26. See [[cal.1962-12-26.civil-rights-the-executive]].
        Names: Bernhard, Schlesinger.'
