      date: '1963-04-09'
      thread: alabama-birmingham
      also:
      - king
      c: 'King before more than a hundred of Birmingham''s Negro businessmen, "tense and chilly": no need of outsiders; Boutwell
        not given a chance. Gaston, after, calls on "all the citizens of Birmingham to work harmoniously together ... giving
        due recognition to the local colored leadership among us." At the mass meeting King puts off going to jail himself.'
      n: '[[w.branch-parting-the-waters]], 725–26. To check: [[w.king-why-we-cant-wait]], 67; Kunstler, *Deep in My Heart*,
        182–84 (cited by [[w.branch-parting-the-waters]], 725 n.7); Birmingham News, Apr. 10, 1963, 6 (cited by [[w.branch-parting-the-waters]],
        726 n.1); Birmingham police notes on the mass meeting, Apr. 9, 1963 (cited by [[w.branch-parting-the-waters]], 726
        n.2). Names: Martin Luther King, Boutwell.'
