    id: cal.1963-04-03.mississippi
    text: 'Check: Branch, 722–24, has Doar tell the prisoners Apr. 3 that he will ask Judge Clayton the next day to vacate
      their convictions, stop the harassment and protect the registrants; the marshals take them in chains that evening; the
      city gives way in negotiations the morning of Apr. 4, the suit set aside for their release, and the United States to
      pay Leflore County''s costs of distributing the surplus food (Burke Marshall to the President, Apr. 8, 1963).'
