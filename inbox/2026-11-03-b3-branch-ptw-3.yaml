      c: 'At the FBI''s urging, the Negro press answers King: four of the five agents at Albany Northerners. *Jet*: the Justice
        Department, not the Bureau, holds up the case against Sheriff Campbell; take it up "with the President and the Attorney
        General, bub." The *Chicago Defender* quotes DeLoach: King''s statements "reveal a total ignorance, not only of the
        true character of FBI Director J. Edgar Hoover, but also of the FBI record in protecting civil rights."'
      n: '[[w.branch-parting-the-waters]], 681–82. To check: Jet, Dec. 6, 1962, 12; Chicago Defender, Dec. 6, 1962, 4 (cited
        by [[w.branch-parting-the-waters]], 681 n.3, 682 n.1); [[w.garrow-fbi-and-martin-luther]], 55 (cited by [[w.branch-parting-the-waters]],
        681 n.2). See [[cal.1962-11-18.king]]. Names: Martin Luther King, DeLoach, Hoover.'
