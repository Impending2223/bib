      id: cal.1962-11-18.king
      when: Nov. 18
      date: '1962-11-18'
      thread: king
      also:
      - antisubversion
      - press-and-broadcasting
      c: 'King preaches at Riverside Church, New York. Afterward, to a *Times* reporter, on the Council''s study: "One of
        the great problems we face with the FBI in the South is that the agents are white Southerners who have been influenced
        by the mores of the community. ... Every time I saw FBI men in Albany, they were with the local police force." The
        *Times*, Nov. 19: "Dr. King Says F.B.I. in Albany, Ga., Favors Segregationists."'
      n: '[[w.branch-parting-the-waters]], 681. To check: New York Times, Nov. 19, 1962, 21; Pittsburgh Courier, Dec. 1, 1962
        (cited by [[w.branch-parting-the-waters]], 681 n.1). See [[cal.1962-11-15.georgia-albany]]. Names: Martin Luther King.'
      src:
        c: 2c172f84
        rows:
        - 'w.branch-parting-the-waters 681: all'
        - 'via w.branch-parting-the-waters 681 n.1: all'
      tags:
      - name:king-martin-luther-jr
      - city:nyc
