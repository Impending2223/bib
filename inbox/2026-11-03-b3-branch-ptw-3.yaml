      - civil-rights-organizations
      c: 'Dorchester, near Savannah, Ga. King''s secret planning retreat for Birmingham, SCLC''s board left out: King, Walker,
        Shuttlesworth, Lowery, Abernathy, Andrew Young, Dorothy Cotton, Clarence Jones, O''Dell, Levison and Lawson. Walker''s
        Project C, in four stages: sit-ins and nightly mass meetings; a boycott of downtown; mass marches to fill the jails;
        outsiders called in. A thousand in jail at once, five or six days each; code names, King "JFK." O''Dell: $25,000 net
        in the last quarter of 1962, mailings of 200,000; no postponement for a fund-raising tour. King: "some of the people
        sitting here today will not come back alive from this campaign." Jones''s call to Levison to arrange it alerts the
        FBI.'
      n: '[[w.branch-parting-the-waters]], 688–92. To check: [[w.garrow-fbi-and-martin-luther]], 57–59; [[w.schlesinger-robert-kennedy-and-his]],
