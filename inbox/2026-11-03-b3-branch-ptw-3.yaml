    text: 'Check: Branch, 675–78, quotes the New Orleans Times-Picayune, Oct. 26, 1962: O''Dell a "Communist who has infiltrated
      to the top administrative post" in SCLC; four other papers ran the like, from St. Louis to Long Island; King''s statement
      of Nov. 1 says O''Dell "has functioned purely as a technician"; privately O''Dell never left the staff.'
