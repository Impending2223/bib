      c: Thanksgiving weekend. SNCC's Southwide conference at Nashville; then sit-ins against the city's last segregated places.
        The Tic-Toc Restaurant's owner sprays Sam Block in the face with a fire extinguisher; a week later two policemen drag
        John Lewis from the same restaurant to jail.
      n: '[[w.branch-parting-the-waters]], 679–80. To check: Jet, Dec. 20, 1962, 6–7; Nashville Tennessean, Nov. 25 and Dec.
        2, 1962 (cited by [[w.branch-parting-the-waters]], 680 n.1). Check: the days. Names: Lewis.'
