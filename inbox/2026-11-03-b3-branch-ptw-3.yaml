      thread: alabama-birmingham
      also:
      - king
      c: 'King, Abernathy and Shuttlesworth: they "cannot in all good conscience obey such an injunction"; a march to jail
        on Good Friday. Fewer than 150 jailed in eight days; seven volunteers that day. The city tells the movement''s bondsman
        his credit is exhausted. Daddy King preaches at the night''s meeting in his son''s place.'
      n: '[[w.branch-parting-the-waters]], 727–28. To check: Westin and Mahoney, *The Trial of Martin Luther King*, 78 (cited
        by [[w.branch-parting-the-waters]], 727 n.3); New York Times, Apr. 12, 1963, 1 (cited by [[w.branch-parting-the-waters]],
        728 n.1); [[w.king-why-we-cant-wait]], 71 (cited by [[w.branch-parting-the-waters]], 728 n.3). See [[cal.1963-04-10.alabama-birmingham]].
        Names: Martin Luther King, Abernathy, Shuttlesworth, Martin Luther King Sr.'
