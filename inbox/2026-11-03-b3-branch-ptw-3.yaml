      date: '1962-12-15'
      thread: king
      also:
      - alabama-birmingham
      - civil-rights-the-executive
      c: 'King to the President by telegram: "Once more we have been shocked by the bombing of Bethel Baptist Church." Birmingham
        "by far the worst big city in race relations in the United States. Much of what has gone on has had the tacit consent
        of high public officials."'
      n: '[[w.branch-parting-the-waters]], 684. To check: King to Kennedy, Dec. 15, 1962, Box 1478, Name File, JFK Library
        (cited by [[w.branch-parting-the-waters]], 684 n.1). See [[cal.1962-12-14.alabama-birmingham]]. Names: Martin Luther
        King, Kennedy.'
