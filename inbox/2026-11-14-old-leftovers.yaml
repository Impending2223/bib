      'date': '1960-09-03'
      'thread': 'elections-1960-kennedy'
      'c': 'San Francisco, the International Airport, Saturday at lunch. Kennedy: "I think it is appropriate that we begin the 1960 campaign right here in the State of California." He blames the Republican Party for the lost $1.25 minimum wage and the defeat, by five votes, of medical care for the aged.'
      'n': 'Remarks of Senator John F. Kennedy, San Francisco, CA, International Airport, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-san-francisco-ca-international-airport) (Sept. 3, 1960). [[w.communications-freedom-of-communications-part]], 95. See [[cal.1960-09-03.elections-1960-kennedy]], [[cal.1960-09-02.elections-1960]]. Names: Kennedy.'
