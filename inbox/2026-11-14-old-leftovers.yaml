- 'edit':
    'id': 'cal.1960-09-06.elections-1960'
    'base': 'c69208c4'
    'set':
      'when': 'Sept. 6'
      'c': 'Seattle, the Civic Auditorium. Kennedy: the people "want this country to begin to move again." The crowd below expectations, 500 to 600 seats short of 5,800, by the Times. The advance work in Washington and Oregon "atrocious," by White''s account.'
      'n': 'Speech of Senator John F. Kennedy, Civic Auditorium, Seattle, WA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-civic-auditorium-seattle-wa) (Sept. 6, 1960). [*New York Times*, Sept. 8, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html), at 1, 24 ("Kennedy Pledges ''Fight for Peace''": Seattle, "crowds fell below expectations," the Civic Auditorium short by 500 to 600 seats of 5,800). [[w.white-making-of-the-president]], 253–56, 258; [[w.kallina-kennedy-v-nixon]], 103 (the advance work in Oregon and Washington "atrocious" by the admission of Kennedy''s admirers; no stops or days); [[w.communications-freedom-of-communications-part]], 134 (Seattle, the Civic Auditorium, and the statewide television question period). See [[cal.1960-09-05.elections-1960]], [[cal.1960-09-06.elections-1960-kennedy]]. Names: Kennedy.'
      'src':
        'c': '76a872bf'
        'rows':
        - 'https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-civic-auditorium-seattle-wa: A'
        - 'https://timesmachine.nytimes.com/timesmachine/1960/09/08/issue.html: B'
        - 'w.white-making-of-the-president 253–56: ?'
        - 'w.white-making-of-the-president 258: ?'
        - 'w.kallina-kennedy-v-nixon 103: ?'
        - 'w.communications-freedom-of-communications-part 134: A'
      'tags':
      - 'name:kennedy-john-f'
      - 'state:wa'
