      'when': 'Jan. 24'
      'date': '1961-01-24'
      'c': 'At the first weekly breakfast of the leaders, Rayburn to Kennedy: "Mr. President, I don''t believe we have the votes to expand the Rules Committee."'
      'n': '[[w.obrien-no-final-victories]], 105 (Tuesday, Jan. 24, the first of the weekly breakfasts of the Democratic leaders of the House and Senate; Rayburn''s words as the entry has them). [[w.reeves-president-kennedy]], 55 ("during those first days in office"; no day). See [[cal.1961-01-24.congress]], [[cal.1961-01-24.rules]]. Names: Rayburn, Kennedy.'
      'src':
        'c': 'd99eed53'
        'rows':
        - 'w.obrien-no-final-victories 105: all'
        - 'w.reeves-president-kennedy 55: ?'
      'tags':
      - 'name:rayburn-sam'
      - 'name:kennedy-john-f'
- 'edit':
    'id': 'cal.1961-01-24.rules'
    'base': 'b4250ec3'
    'set':
      'c': 'The White House, the afternoon after the leaders'' breakfast. Kennedy has Rayburn back and asks him to put off the Rules Committee vote from Jan. 25 to Jan. 31. Rayburn, reluctant, agrees. Kennedy to O''Brien: "We can''t lose this one, Larry. The ball game is over if we do." By O''Brien''s account.'
      'n': '[[w.obrien-no-final-victories]], 105–06. See [[cal.1961-01.rules]]. Names: Kennedy, Rayburn, O''Brien.'
      'src':
        'c': 'fd7907be'
        'rows':
        - 'w.obrien-no-final-victories 105–06: all'
- 'check':
    'id': 'cal.1968-03-24.elections-1968-2'
    'text': 'Check: the day. [[w.white-making-of-the-president-1969]], 113, has the meeting on Sunday, Mar. 24, and O''Brien''s departure for Wisconsin on Wednesday, Mar. 27; [[w.obrien-no-final-victories]], 225–26, has it on Monday, Mar. 25, "later that afternoon" after his late lunch with Humphrey (see [[cal.1968-03-25.elections-1968-humphrey]]), and his departure the day after the Tuesday call from Edward Kennedy (see [[cal.1968-03-26.robert-kennedy-campaign-decision]]). Nothing read settles it; the Daily Diary and O''Brien''s own papers not seen.'
