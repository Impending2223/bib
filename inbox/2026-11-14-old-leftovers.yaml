- 'edit':
    'id': 'cal.1960-09-02.elections-1960'
    'base': '809b384c'
    'set':
      'when': 'Sept. 2'
      'c': 'Kennedy, free of the Senate, opens his campaign by chartered jet from Friendship Airport, Baltimore, Friday afternoon. Presque Isle, Maine, the airport rally: "I am delighted to start on this campaign, on this first day, in this county."'
      'n': 'Remarks of Senator John F. Kennedy, Presque Isle, Maine, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally) (Sept. 2, 1960). [[w.white-making-of-the-president]], 251–52; [[w.communications-freedom-of-communications-part]], 80 (Presque Isle, the airport rally, "on this first day," 80–81; not the jet or Baltimore). Check: the order of the Sept. 2 stops; [[w.communications-freedom-of-communications-part]] has Kennedy at Manchester, N.H., "it is proper to start here in New Hampshire" (79), at Presque Isle "on this first day" (80–81), and at Portland, Maine, in the evening: "We have traveled from Presque Isle, and we are going to speak tonight and go to Washington" (83). See [[cal.1960-07.elections-1960-4]]. Names: Kennedy.'
      'src':
        'c': '764d4f37'
        'rows':
        - 'https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally: B'
        - 'w.white-making-of-the-president 251–52: A'
        - 'w.communications-freedom-of-communications-part 80: B'
