- 'check':
    'id': 'cal.1961-07-12.berlin-and-vienna'
    'text': 'Check: the paper. Poole, 145–46 n.28, cites JCSM-461-61 to SecDef, July 12, 1961 (JCS 1907/321); Kaplan, 155 n.54, cites JCSM-476-61, Lemnitzer for SecDef, July 12; FRUS 1961–63, XIV, doc. 67 n.3, names a JCSM-467-61, "Partial Mobilization," July 12. Three numbers for July 12; whether one paper or several is not settled by the pages (JCSM-471-61 is dated July 13).'
- 'check':
    'id': 'cal.1968-08-24.elections-1968-chicago-3'
    'text': 'Check: the setting of the words. [[w.chester-american-melodrama]], 534–35, has Ginsburg say them to Gilligan after an hour''s study of the minority draft, in Geoghegan''s room at the Statler Hilton, just before midnight. [[w.solberg-hubert-humphrey]], 352, cites Chester (532) for them but has Ginsburg alone in his hotel room, reading Edward Kennedy''s speech of the night before, and gives no day or hour; not an independent witness.'
