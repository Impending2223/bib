      - 1960-07-04T04:00Z
      - 1960-07-04T10:00Z
      time_zone: Asia/Nicosia
      n: 'Lawrence Fellows, "Cyprus to Shun Military Blocs," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). The hour: "only this morning,"
        in Fellows''s report. Split under R17: Makarios''s statement the same day is [[cal.1960-07-04.cyprus-3]]. See [[cal.1960-07-01.cyprus]]. Names: Makarios, Kutchuk.'
- edit:
    id: cal.1960-07-04.latin-america-dominican-republic
    base: c43fefa2
    kind: correct
    set:
      c: 'Betancourt: the Dominican Republic plainly behind the attempt on his life; one plotter in touch with Trujillo, another trained there in explosives; proof to go to the OAS Council, to
        meet July 9.'
      n: '"Betancourt Scores Trujillo on Attack," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). Split under R17: the civic leaders he receives
        the same day are [[cal.1960-07-04.latin-america-3]]. See [[cal.1960-06-24.latin-america]]. Names: Betancourt, Trujillo.'
