    entry:
      id: cal.1960-07-04.cyprus-4
      when: July 4
      date: '1960-07-04'
      place: nicosia
      thread: cyprus
      c: 'Nicosia. Makarios, the president-elect: Cyprus will follow a foreign policy independent of any military bloc; the treaty of alliance with Greece and Turkey is for protection against attack. He
        repeats his wish for full Commonwealth membership. Four ambassadors at first, to Athens, Ankara, London and Washington.'
      n: 'Lawrence Fellows, "Cyprus to Shun Military Blocs," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). See [[cal.1960-07-04.cyprus]]. Names:
        Makarios.'
      tags:
      - name:makarios-iii
      - ok:fields-time
- add:
    entry:
      id: cal.1960-07-04.latin-america-3
      when: July 4
      date: '1960-07-04'
      place: caracas
      thread: latin-america
      c: Caracas. Betancourt, his arms bandaged and resting on pillows, receives twenty civic leaders in his rooms at the Presidential Palace, the first group he has received since the attempt on his life.
      n: '"Betancourt Scores Trujillo on Attack," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html). See [[cal.1960-07-04.latin-america-dominican-republic]].
        Names: Betancourt.'
      tags:
      - name:betancourt-romulo
- add:
    entry:
      id: cal.1960-07-09.cuba-2
      when: July 9
      date: '1960-07-09'
      place: newport
      thread: cuba
      also:
      - soviet-union
      follows:
      - cal.1960-07-09.cuba-3
      c: 'Newport, R.I. Eisenhower, in a statement later that day on Khrushchev''s: it shows the intention to establish Cuba in a role serving Soviet purposes; the United States will not "permit the establishment
        of a regime dominated by international Communism in the Western Hemisphere."'
      n: 'Statement by the President Concerning Premier Khrushchev''s Announcement of Support for the Castro Regime in Cuba, [1960–61 Pub. Papers 567](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=619)
        (released at the U.S. Naval Base, Newport). [FRUS 1958–60, VI, doc. 549](https://history.state.gov/historicaldocuments/frus1958-60v06/d549) ("Later that day, President Eisenhower, who was in Newport,
        Rhode Island, issued the following statement"). The order: after [[cal.1960-07-09.cuba-3]], the calls on "the text of this statement" (FRUS, doc. 549). See [[cal.1960-07-09.cuba]]. Names: Eisenhower,
        Khrushchev.'
      tags:
      - name:eisenhower-dwight-d
      - name:khrushchev-nikita-s
