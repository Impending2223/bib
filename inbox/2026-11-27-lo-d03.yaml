      when: July, after the 22nd
      date: 1960-07
      at: after 1960-07-22
      thread: cuba
      also:
      - cuba-bay-of-pigs
      - intelligence
      c: The Cuban, back from Raúl Castro, tells the case officer he had no opportunity to arrange an accident.
      n: '[S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=84), 73 (1975). Made public: the Church Committee''s interim report, Nov.
        20, 1975. See [[cal.1960-07-22.cuba]]. Names: Raúl Castro. Check: the month; the report gives only "When the Cuban returned."'
      tags:
      - name:castro-raul
- add:
    entry:
      id: cal.1960-07-27.goldwater-2
      when: July 27
      date: '1960-07-27'
      place: chicago
      thread: goldwater
      also:
      - elections-1960-chicago
      c: 'Chicago, Wednesday morning. Goldwater at the South Carolina delegation''s last caucus: thanks it; he has released Arizona from its favorite-son pledge and now releases South Carolina to vote for
        Nixon. Milliken and Robert F. Chapman ask him to hold both so his name can be put in nomination and he can make a withdrawal speech on television; he agrees, reluctantly. By White''s account.'
      n: '[[w.white-suite-3505]], 22–23 (F. Clifton White''s account; "On Wednesday morning"). See [[cal.1960-07-26.elections-1960]]. Names: Goldwater, Nixon.'
      tags:
      - name:goldwater-barry-m
      - name:nixon-richard-m
      - ok:name-untagged
      - state:il
      - state:sc
      time_band: morning
      time_range:
      - 1960-07-27T11:00Z
      - 1960-07-27T17:00Z
      time_zone: America/Chicago
- add:
    entry:
      id: cal.1960-07-28.elections-1960-chicago
      when: July 28
      date: '1960-07-28'
      place: chicago
      thread: elections-1960-chicago
      c: Chicago, about 2:30 a.m. Nixon, the leaders' session over, telephones Lodge that he will be nominated for Vice President. Lodge plans to fly to Chicago Thursday to accept. By Nixon's account.
      n: '[[w.nixon-six-crises]], 318 ("around 2:30 in the morning Central Time"). See [[cal.1960-07-27.elections-1960]]. Names: Nixon, Lodge.'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
      - state:il
      time: 1960-07-28T07:30Z
      time_approx: true
      time_zone: America/Chicago
- add:
    entry:
      id: cal.1960-08-02.congo-2
      when: Aug. 2
      date: '1960-08-02'
      thread: congo
      also:
      - europe-and-the-alliance
      c: 'Wigny, Belgium''s Foreign Minister, on Katanga: Belgian troops already withdrawing to their bases and home; in Katanga at the authorities'' request, they do not interfere. Belgium must face facts:
        order prevails there; the Katanga Government proposes a federation; the European technicians will leave if anarchy spreads.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 4 (Aug. 6, 1960) (the statement quoted). See [[cal.1960-08-02.congo]]. Names: Wigny.'
      tags:
      - ok:name-untagged
- add:
    entry:
      id: cal.1960-08-03.congo
      when: Aug. 3
      date: '1960-08-03'
      place:
      - elisabethville
      - leopoldville
      thread: congo
      c: 'Tshombe to Hammarskjöld, through the Belgian Mission in Léopoldville: the Katanga Government will resist by every means the Lumumba Government and the sending of UN forces, whose arrival would
        set off a general uprising; it asks to see Bunche at Elisabethville "not later than tomorrow."'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 5 (Aug. 6, 1960) (the message quoted). See [[cal.1960-08-02.congo]]. Names: Tshombe, Hammarskjöld, Lumumba,
        Bunche.'
      tags:
      - name:tshombe-moise
      - name:hammarskjold-dag
      - name:lumumba-patrice
      - name:bunche-ralph-j
- add:
    entry:
      id: cal.1960-08-03.congo-2
      when: Aug. 3
      date: '1960-08-03'
      place: leopoldville
      thread: congo
      c: 'Léopoldville, the afternoon. The Vice-Premier''s cabinet council "decides" that representatives of the Central Government and twenty Ghanaian soldiers go with Bunche to Katanga. Hammarskjöld refuses
        both: the mission is the UN''s alone.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 6–7 (Aug. 6, 1960). See [[cal.1960-08-02.congo]]. Names: Bunche, Hammarskjöld.'
      tags:
      - name:bunche-ralph-j
      - name:hammarskjold-dag
      time_band: afternoon
      time_range:
      - 1960-08-03T11:00Z
      - 1960-08-03T17:00Z
      time_zone: Africa/Kinshasa
- add:
    entry:
      id: cal.1960-08-03.congo-3
      when: Aug. 3
      date: '1960-08-03'
      place: leopoldville
      thread: congo
      follows:
      - cal.1960-08-03.congo-2
      c: 'Léopoldville, the evening. The Vice-Premier adds a journalist to Bunche''s team; Hammarskjöld refuses: only the Secretary General decides who goes on a UN mission.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 7 (Aug. 6, 1960) ("Later, the same evening"). See [[cal.1960-08-02.congo]]. Names: Bunche, Hammarskjöld.'
      tags:
      - name:bunche-ralph-j
      - name:hammarskjold-dag
      time_band: evening
      time_range:
      - 1960-08-03T18:00Z
      - 1960-08-03T21:00Z
      time_zone: Africa/Kinshasa
- add:
    entry:
      id: cal.1960-08-04.congo
      when: Aug. 4
      date: '1960-08-04'
      place: leopoldville
      thread: congo
      c: 'Hammarskjöld''s reply to Tshombe, through the Belgian Mission: Articles 25 and 49 of the Charter bind subordinate authorities too; resistance to the Security Council has legal consequences. The
        troops under UN command alone, not to interfere in internal affairs, to act only in self-defence; if resistance holds, he will call the Council at once.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 5–6 (Aug. 6, 1960) (the reply quoted). See [[cal.1960-08-03.congo]]. Names: Hammarskjöld, Tshombe.'
      tags:
      - name:hammarskjold-dag
      - name:tshombe-moise
- add:
    entry:
      id: cal.1960-08-04.congo-2
      when: Aug. 4
      date: '1960-08-04'
      place:
      - leopoldville
      - elisabethville
      thread: congo
      follows:
      - cal.1960-08-04.congo
      c: 'Morning. Bunche leaves Léopoldville for Elisabethville, a day ahead of the plan, with Hammarskjöld''s instructions: arrange with the Belgians the withdrawal of their troops and their replacement;
        units of three contingents to arrive Aug. 6 unless other orders come; should he judge forcible resistance a serious risk, advise against the entry, and Hammarskjöld will call the Council.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 7–9 (Aug. 6, 1960) (the instructions quoted; "In the morning of 4 August"; the reply to Tshombe annexed
        to them). The order: after [[cal.1960-08-04.congo]], whose text the instructions annex. See [[cal.1960-08-02.congo]]. Names: Bunche, Hammarskjöld.'
      tags:
      - name:bunche-ralph-j
      - name:hammarskjold-dag
      time_band: morning
      time_range:
      - 1960-08-04T05:00Z
      - 1960-08-04T11:00Z
      time_zone: Africa/Kinshasa
- add:
    entry:
      id: cal.1960-08-05.congo-2
      when: Aug. 5
      date: '1960-08-05'
      place: washington
      thread: congo
      also:
      - europe-and-the-alliance
      c: 'Washington. Scheyven, the Belgian Ambassador, to Herter: Hammarskjöld has broken the Brussels agreement by his statement on Bunche''s visit and on troops to Katanga Aug. 6; the 23,000 whites there
        must be protected; the UN must stay out of Congolese politics. Herter: the decision was taken in Léopoldville''s atmosphere; Bunche on the spot may see it differently; the United States will gladly
        express concern for the whites'' safety, will press Ghana, and asks Tubman to influence Touré.'
      n: '[FRUS 1958–60, XIV, doc. 163](https://history.state.gov/historicaldocuments/frus1958-60v14/d163). See [[cal.1960-08-02.congo]]. Names: Herter, Hammarskjöld, Bunche, Tubman, Touré.'
      tags:
      - name:herter-christian-a
      - name:hammarskjold-dag
      - name:bunche-ralph-j
      - ok:name-untagged
- add:
    entry:
      id: cal.1960-08-05.congo-3
      when: Aug. 5
      date: '1960-08-05'
      place: elisabethville
      thread: congo
      c: 'Elisabethville airport, the morning. Bunche averts "most serious trouble" only with the greatest difficulty, by his report: fanatical opposition to the UN.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 10 (Aug. 6, 1960) (Bunche''s report quoted). See [[cal.1960-08-04.congo-2]]. Names: Bunche.'
      tags:
      - name:bunche-ralph-j
      time_band: morning
      time_range:
      - 1960-08-05T04:00Z
      - 1960-08-05T10:00Z
      time_zone: Africa/Lubumbashi
- add:
    entry:
      id: cal.1960-08-05.congo-4
      when: Aug. 5
      date: '1960-08-05'
      place: elisabethville
      thread: congo
      follows:
      - cal.1960-08-05.congo-3
      c: 'Elisabethville, 11 a.m. Tshombe, his ministers and the Grand Chiefs warn Bunche, the last of repeated warnings: UN troops will be opposed by all the force Katanga can muster.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 9 (Aug. 6, 1960) (Bunche''s report: "the last such warning being at 1100 hours on 5 August"). See [[cal.1960-08-04.congo-2]].
        Names: Tshombe, Bunche.'
      tags:
      - name:tshombe-moise
      - name:bunche-ralph-j
      time: 1960-08-05T09:00Z
      time_zone: Africa/Lubumbashi
- add:
    entry:
      id: cal.1960-08-06.congo-2
      when: Aug. 6
      date: '1960-08-06'
      place: leopoldville
      thread: congo
      c: Léopoldville, the afternoon. Bunche, back from Elisabethville, reports to Hammarskjöld and recommends that the Katanga operation be stopped.
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 9–10 (Aug. 6, 1960) ("Friday afternoon, 6 August"; Bunche''s conclusions quoted). See [[cal.1960-08-04.congo-2]].
        Names: Bunche, Hammarskjöld. Check: the day: the report has "Friday afternoon, 6 August"; Aug. 6, 1960, was a Saturday.'
      tags:
      - name:bunche-ralph-j
      - name:hammarskjold-dag
      time_band: afternoon
      time_range:
      - 1960-08-06T11:00Z
      - 1960-08-06T17:00Z
      time_zone: Africa/Kinshasa
- add:
    entry:
      id: cal.1960-08-06.congo-3
      when: Aug. 6
      date: '1960-08-06'
      thread: congo
      follows:
      - cal.1960-08-06.congo-2
      c: 'Hammarskjöld''s second report to the Security Council: entry into Katanga would have needed force, which the UN Force, acting only in self-defence, may not use; he asks the Council for instructions.'
      n: 'Second Report by the Secretary-General, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 10–11 (Aug. 6, 1960). See [[cal.1960-08-02.congo]]. Names: Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
- add:
    entry:
      id: cal.1960-08-13.laos-2
      when: Aug. 13
      date: '1960-08-13'
      thread: laos
      c: The afternoon. Somsanith sends General Ouane Rattikone to Vientiane to learn the coup leaders' intentions.
      n: '[FRUS 1958–60, XVI, doc. 361](https://history.state.gov/historicaldocuments/frus1958-60v16/d361) (the editorial note). See [[cal.1960-08-13.laos]]. Names: Somsanith.'
      tags:
      - name:somsanith
      - ok:name-untagged
      - ok:fields-place
      time_band: afternoon
      time_range:
      - 1960-08-13T05:00Z
      - 1960-08-13T11:00Z
      time_zone: Asia/Vientiane
- add:
    entry:
      id: cal.1960-08-15.laos-2
      when: Aug. 15
      date: '1960-08-15'
      place: washington
      thread: laos
      c: 'John Eisenhower''s synopsis for the President: the King has accepted the Somsanith government''s resignation; Radio Vientiane, held by the rebels, claims Souvanna Phouma designated Premier, not
        confirmed; the King apparently wishes to avoid a military showdown; the rebel 2d paratroop battalion unpaid for two months.'
      n: '[FRUS 1958–60, XVI, doc. 363](https://history.state.gov/historicaldocuments/frus1958-60v16/d363). To check: telegram 288 from Vientiane, Aug. 15, Department of State, Central Files, 751J.00/8–1560
        (cited by FRUS 1958–60, XVI, doc. 363). See [[cal.1960-08-14.laos]]. Names: John Eisenhower, Eisenhower, Souvanna Phouma, Savang Vatthana.'
      tags:
      - name:eisenhower-john-s-d
      - name:eisenhower-dwight-d
      - name:souvanna-phouma
      - name:savang-vatthana
- add:
    entry:
      id: cal.1960-08-15.laos-3
      when: By Aug. 15
      date: '1960-08-15'
      thread: laos
      c: Sarit, in Thailand, expresses irritation with American inaction on Laos.
      n: '[FRUS 1958–60, XVI, doc. 363](https://history.state.gov/historicaldocuments/frus1958-60v16/d363) (the synopsis; Sarit a relative of Phoumi''s). See [[cal.1960-08-15.laos-2]]. Names: Sarit. Check:
        the day.'
      tags:
      - name:sarit-thanarat
- add:
    entry:
      id: cal.1960-08-15.laos-4
      when: By Aug. 15
      date: '1960-08-15'
      thread: laos
      c: Phoumi, Defense Minister of the fallen government, apparently refuses to accept its resignation.
      n: '[FRUS 1958–60, XVI, doc. 363](https://history.state.gov/historicaldocuments/frus1958-60v16/d363) (the synopsis: "He apparently refuses to accept the action"). See [[cal.1960-08-15.laos-2]]. Names:
        Phoumi Nosavan. Check: the day. Check: the synopsis''s "He" is read as Phoumi.'
      tags:
      - name:phoumi-nosavan
- add:
    entry:
      id: cal.1960-08-15.laos-5
      when: By Aug. 15
      date: '1960-08-15'
      thread: laos
      c: Phoumi asks the United States for 10 million kip to help him retake Vientiane, and plans to drop tracts over the city telling of resistance.
      n: '[FRUS 1958–60, XVI, doc. 366](https://history.state.gov/historicaldocuments/frus1958-60v16/d366) (Brown''s report of the request). See [[cal.1960-08-16.laos]]. Names: Phoumi Nosavan. Check: the
        day.'
      tags:
      - name:phoumi-nosavan
      - ok:fields-place
- add:
    entry:
      id: cal.1960-08-15.laos-6
      when: Aug. 15
      date: '1960-08-15'
      place: vientiane
      thread: laos
      follows:
      - cal.1960-08-15.laos-5
      c: 'Vientiane, 8 p.m. Brown, telegram 294: he has instructed the American representatives at Savannakhet to tell Phoumi that the United States is not prepared to support a forcible effort to retake
        Vientiane or to prevent a new government, and that he should drop no tracts.'
      n: '[FRUS 1958–60, XVI, doc. 366](https://history.state.gov/historicaldocuments/frus1958-60v16/d366). See [[cal.1960-08-16.laos]]. Names: Brown, Phoumi Nosavan.'
      tags:
      - name:brown-winthrop-g
      - name:phoumi-nosavan
      time: 1960-08-15T13:00Z
      time_zone: Asia/Vientiane
- add:
    entry:
      id: cal.1960-08-15.laos-7
      when: Aug. 15
      date: '1960-08-15'
      place: washington
      thread: laos
      follows:
      - cal.1960-08-15.laos-6
      c: The Department, telegram 176 to Vientiane, approves Brown's instruction to Phoumi.
      n: '[FRUS 1958–60, XVI, doc. 366](https://history.state.gov/historicaldocuments/frus1958-60v16/d366) n.3. To check: telegram 176 to Vientiane, Aug. 15, Department of State, Central Files, 751J.00/8–1560
        (cited by FRUS 1958–60, XVI, doc. 366 n.3). See [[cal.1960-08-15.laos-6]]. Names: Brown, Phoumi Nosavan.'
      tags:
      - name:brown-winthrop-g
      - name:phoumi-nosavan
