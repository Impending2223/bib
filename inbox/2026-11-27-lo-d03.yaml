- add:
    entry:
      id: cal.1960-08-20.elections-1960-kennedy
      when: Aug. 20
      date: '1960-08-20'
      place: independence-mo
      thread: elections-1960-kennedy
      follows:
      - cal.1960-08-20.elections-1960
      c: 'Independence, the Truman Library, 12:25 p.m. Kennedy''s press conference with Truman. Kennedy asks Truman to campaign actively, and to come to New York; Truman says he will. His one firm date
        is Marion, Ind., Sept. 5. Asked about his July 2 remark that the convention was fixed, Truman says it looked made up in advance, and: "they nominated this man, and I am going to support him. What
        are you going to do about that?" Jackson, the party chairman, and Symington there.'
      n: '[[w.communications-freedom-of-communications-part]], 24–28 (the press conference at the Truman Library, 12:25 p.m., Saturday, Aug. 20, 1960). See [[cal.1960-08-20.elections-1960]]. Names: Kennedy,
        Truman, Jackson, Symington.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:jackson-henry-m
      - name:symington-william-s
      time: 1960-08-20T17:25Z
      time_zone: America/Chicago
- add:
    entry:
      id: cal.1960-08-24.elections-1960-nixon
      when: Aug. 24
      date: '1960-08-24'
      thread: elections-1960-nixon
      follows:
      - cal.1960-08-24.elections-1960
      c: 'Eisenhower telephones Nixon that afternoon, by Nixon''s account, with his regrets over the remark: he was joking and the press played it straight.'
      n: '[[w.nixon-rn]], 219 (Eisenhower "called me that afternoon to express his regret"); [[w.nixon-six-crises]], 339 ("Later that same day"; "he was simply being facetious and yet they played it straight").
        See [[cal.1960-08-24.elections-1960]]. Names: Eisenhower, Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
      time_band: afternoon
