      c: 'Beverly Hills, the Beverly Hills Hotel, late that night. Lawrence calls on Stevenson, whom he admires: two hours, going on long after midnight. No announcement.'
      n: '[[w.white-making-of-the-president]], 161 ("late that night"; "a two-hour conversation that went on long after midnight"). The hour: the night band is July 10, 10 p.m. to midnight; the talk runs
        past it. See [[cal.1960-07-09.elections-1960-3]]. Names: Lawrence, Stevenson.'
