      date: '1960-07-27'
      place: chicago
      thread: elections-1960-chicago
      c: Chicago. The convention adopts the Republican platform.
      n: '[Republican Party Platform of 1960](https://www.presidency.ucsb.edu/documents/republican-party-platform-1960). [[w.novak-agony-of-the-g]], 23 (the platform accepted). See [[cal.1960-07-26.elections-1960]],
        which holds the convention''s bibliography.'
