- add:
    entry:
      id: cal.1960-07-27.elections-1960-chicago-2
      when: July 27
      date: '1960-07-27'
      place: chicago
      thread: elections-1960-chicago
      also:
      - goldwater
      c: 'Chicago. Fannin, Arizona''s governor, nominates Goldwater, Shorey of South Carolina seconding; Goldwater withdraws his name: "Let''s grow up, conservatives, if we want to take this party
        back."'
      n: '[[w.perlstein-before-the-storm]], 93–95 (Goldwater''s withdrawal); [[w.young-two-suns-of-the]], 27–28 (Goldwater''s withdrawal); [[w.white-suite-3505]], 22–24 (Fannin''s nomination;
        the withdrawal, the words); [[w.goldberg-barry-goldwater]], 145 (his name put in nomination; the demonstration; Goldwater withdraws); [[w.gifford-center-cannot-hold]], 135–36, 156 (Fannin,
        Shorey; the withdrawal); [[w.kabaservice-rule-and-ruin]], 29 (Goldwater withdraws his name: conservatives to "grow up"); [[w.kallina-kennedy-v-nixon]], 93 (Goldwater''s withdrawal). See
        [[cal.1960-07-26.elections-1960]], which holds the convention''s bibliography and the Checks on the words of the withdrawal. Names: Fannin, Goldwater.'
      tags:
      - name:goldwater-barry-m
      - name:fannin-paul-j
      - state:il
      - state:az
