- add:
    entry:
      id: cal.1960-07-27.elections-1960-chicago-2
      when: July 27
      date: '1960-07-27'
      place: chicago
      thread: elections-1960-chicago
      also:
      - goldwater
      c: 'Chicago. Fannin, Arizona''s governor, nominates Goldwater, Shorey of South Carolina seconding; Goldwater withdraws his name and releases his delegates, suggesting their votes go to Nixon: "Let''s
        grow up, conservatives. If we want to take this Party back, and I think we can someday, let''s get to work."'
      n: '[[w.perlstein-before-the-storm]], 93–95 (Fannin''s nomination; the demonstration; the withdrawal, the release of the delegates and the words); [[w.white-suite-3505]], 23–24 (Fannin''s nomination;
        the withdrawal, the release, the words); [[w.gifford-center-cannot-hold]], 135–36, 156 (Fannin; Shorey''s seconding speech; the withdrawal and the words, from the Proceedings); [[w.kabaservice-rule-and-ruin]],
        29 (the withdrawal; the words); [[w.goldberg-barry-goldwater]], 145 (his name put in nomination; the demonstration; Goldwater withdraws); [[w.young-two-suns-of-the]], 27 (Goldwater declines; not
        the words); [[w.kallina-kennedy-v-nixon]], 93 (Goldwater''s withdrawal). The order: after [[cal.1960-07-27.conservative-movement]], "before withdrawing his name." See [[cal.1960-07-26.elections-1960]],
        which holds the convention''s bibliography. Names: Fannin, Goldwater, Nixon. Check: Goldberg, 145, quotes "Let''s if we want to take this party back—and I think we can some day—let''s get to work."
        Check: Young, 27, quotes "Let''s get to work if we want to take this party back—and I think we can."'
      tags:
      - name:goldwater-barry-m
      - name:fannin-paul-j
      - name:nixon-richard-m
      - state:il
      - state:az
      follows:
      - cal.1960-07-27.conservative-movement
- add:
    entry:
      id: cal.1960-07-27.elections-1960-chicago-3
      when: July 27
      date: '1960-07-27'
      place: chicago
      thread: elections-1960-chicago
      c: Chicago, 11:13 p.m. Nixon nominated for President, 1,321 votes to Goldwater's 10, Louisiana's; Hatfield, Oregon's governor, had placed his name in nomination. Arizona moves to make it unanimous.
      n: '[[w.white-making-of-the-president]], 206 (Wednesday evening, July 27; 1,321 to 10, Louisiana offering Goldwater''s name; Arizona''s motion; "at 11:13 in the evening"); [[w.novak-agony-of-the-g]],
        23 (ten Louisiana delegates for Goldwater, the nomination otherwise unanimous); [[w.nixon-six-crises]], 316–17 (Hatfield, Wednesday, places Nixon''s name in nomination; Nixon''s selection "by acclamation").
        The order: after [[cal.1960-07-27.elections-1960-chicago-2]]: "Nixon''s demonstration later in the evening" ([[w.perlstein-before-the-storm]], 93). See [[cal.1960-07-26.elections-1960]], which holds
        the convention''s bibliography. Names: Nixon, Goldwater, Hatfield. Check: Nixon has his selection "by acclamation" (317); White gives the roll call.'
      tags:
      - name:nixon-richard-m
      - name:goldwater-barry-m
      - name:hatfield-mark-o
      - state:il
      time: 1960-07-28T04:13Z
      time_zone: America/Chicago
      follows:
      - cal.1960-07-27.elections-1960-chicago-2
- add:
    entry:
      id: cal.1960-08-02.congo
      when: Aug. 2
      date: '1960-08-02'
      thread: congo
      c: 'Léopoldville. Hammarskjöld, the Secretary General, to the Congolese Cabinet Committee for Co-operation with the UN: the Council''s resolutions apply to Katanga; Bunche to go to Elisabethville
        Friday, Aug. 5, to open talks on the Belgian troops'' withdrawal to their bases; the first UN units to follow Saturday, Aug. 6.'
      n: 'Second Report by the Secretary-General on the Implementation of Security Council Resolutions S/4387 and S/4405, [U.N. Doc. S/4417](https://docs.un.org/S/4417), at 2–3 (Aug. 6, 1960) (the statement
        of Aug. 2, quoted). [FRUS 1958–60, XIV, doc. 163](https://history.state.gov/historicaldocuments/frus1958-60v14/d163) n.1 (the meeting of Aug. 2; Bunche to Katanga Aug. 5; the first units Aug. 6).
        [[w.fursenko-khrushchevs-cold-war]], 310 ("The next day" after the Soviet statement of Aug. 1; the force to enter Katanga "on August 6"). The day: Hammarskjöld''s report dates the statement Aug.
        2 and the entry Aug. 6; Ball (228) has the announcement Aug. 3 and the entry Aug. 8. See [[cal.1960-08-01.congo]]. Names: Hammarskjöld, Bunche. Check: [[w.ball-past-has-another-pattern]], 228, has
        Hammarskjöld announce on Aug. 3 that UN troops would enter Katanga Aug. 8, and cancel the order when Tshombe refused entry.'
      tags:
      - name:hammarskjold-dag
      - name:bunche-ralph-j
      place: leopoldville
- add:
    entry:
      id: cal.1960-08-12.desegregation-schools
      when: Aug. 12
      date: '1960-08-12'
      place: houston
      thread: desegregation-schools
      c: 'Houston. Judge Ben C. Connally''s order of Aug. 12 spells the plan out grade by grade: from September 1960 a first-grader may, at his option, attend the formerly all-white or the formerly all-Negro
        school of the zone where he lives; the rule extends to the second grade in September 1961, and so on.'
      n: '*Ross v. Dyer*, [312 F.2d 191](https://static.case.law/f2d/312/case-pdfs/0191-01.pdf), 192 (5th Cir. 1962) (the order of Aug. 12, 1960, entered when questions arose over the meaning of the brief
        order of Aug. 3; "peremptory in nature"; the plan "grade by grade"). See [[cal.1960-08-03.desegregation-schools-houston]]. Names: Ben C. Connally.'
      tags:
      - state:tx
      - city:houston
      - name:connally-ben-c
