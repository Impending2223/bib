- add:
    entry:
      id: cal.1960-08-26.congo-lumumba
      when: Aug. 26
      date: '1960-08-26'
      place:
      - washington
      - leopoldville
      thread: congo-lumumba
      c: 'Dulles to the station in Léopoldville: "his removal must be an urgent and prime objective," a high priority of covert action; up to $100,000 authorized for "any crash programs." By Bissell''s
        account, Helms released the cable, Bissell on vacation.'
      n: '[FRUS 1964–68, XXIII, doc. 14](https://history.state.gov/historicaldocuments/frus1964-68v23/d14) (the cable, dated Aug. 27). [S. Rep. No. 94-465, 15–16 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=26)
        (the cable signed by Dulles, Aug. 26; the $100,000 for "any crash programs"). [[w.fursenko-khrushchevs-cold-war]], 314–15 (Aug. 26: removal "an urgent and prime objective"; up to a hundred thousand
        dollars). [[w.bissell-reflections-of-a-cold]], 143–44 (Bissell''s account, 1996: the cable signed off by Helms, Bissell on vacation; Dulles drafted it after an NSC meeting). Made public: the Church
        Committee''s interim report, Nov. 20, 1975. See [[cal.1960-08-25.congo]], which holds the bibliography of the Special Group''s meeting. Names: Dulles, Lumumba, Bissell, Helms. Check: FRUS dates
        the telegram Aug. 27; the Church Committee, Aug. 26.'
      tags:
      - name:dulles-allen-w
      - name:lumumba-patrice
      - name:helms-richard
      - name:bissell-richard-m-jr
      gloss:
        title: Commentary
        text:
        - 'Bissell (1996): the cable says, in effect, "I want to get rid of him"; its meaning would have been clear then; it was "no doubt drafted in an intentionally ambiguous fashion" ([[w.bissell-reflections-of-a-cold]],
          144).'
