    set:
      n: '[[w.sorensen-kennedy]], 170 (between the convention and Labor Day); [[w.communications-freedom-of-communications-part]], 18 (Kennedy at Hyde Park, Aug. 14, the memorial program for the Social
        Security Act''s twenty-fifth anniversary: "I am grateful to you, Mrs. Roosevelt, for allowing me" there; the place and a day; not a call on her or her support); [[w.odonnell-johnny-we-hardly-knew]],
        227–28 (the Sunday visit to Mrs. Roosevelt''s cottage, Powers with him; she made no demand for Stevenson and told him to choose his Cabinet "without making any preelection promises"; a granddaughter
        killed in a fall from a horse the day before, the visit kept); [[w.odonnell-johnny-we-hardly-knew]], 227–28. The entry is the call on Mrs. Roosevelt; the speech is [[cal.1960-08-14.medicare]]. The
        day: O''Donnell (227–28) has the visit on a Sunday; Kennedy''s Hyde Park speech is Aug. 14, a Sunday, with Mrs. Roosevelt thanked in it (18); the call is taken to be of that day. Check: the day
        of the call. Names: Kennedy, Eleanor Roosevelt, Powers, Stevenson.'
- edit:
    id: cal.1960-08-24.china-leadership
    base: 012eb0ea
    set:
      time_range:
      - 1960-08-24T07:30Z
      - 1960-08-24T12:30Z
      time_zone: Asia/Shanghai
      place: peking
      c: 'At the enlarged plenary meetings of the central committees of six democratic parties (the Kuomintang Revolutionary Committee, the Democratic League, the Association for Promoting Democracy, the
        Peasants'' and Workers'' Democratic Party, the Zhi Gong Party and the Jiusan Society), Zhou Enlai reports on Sino-Soviet relations since the 20th Congress: the differences on Stalin, on war and
        on peaceful transition are of Marxist–Leninist principle, yet partial as to the two parties, two states and the camp.{1} The banner is Marxism–Leninism; the slogans, hold position, hold principle,
        hold unity.{2}'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 342 (Aug. 24, 1960); [[w.yang-shangkun-riji]], I, 538 (Aug. 24, 1960; 3:30 to 8:30 p.m., at the Hebei Hall of the Great Hall, over a hundred at the parties''
        symposium; Zhou on Sino-Soviet relations). The party''s name: the nianpu (342) prints 中国民主促进会, the Association for Promoting Democracy, not the Democratic Construction Association. Made public:
        1997. Names: Zhou Enlai.'
    kind: correct
- edit:
    id: cal.1960-08-24.china-leadership-2
    base: acfec32b
    settles:
    - 'Check: whether it is the enlarged plenary meetings'
    set:
      time_range:
      - 1960-08-24T07:30Z
      - 1960-08-24T12:30Z
      time_zone: Asia/Shanghai
      place: peking
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 492–493 (Aug. 24, 26, 1960); [[w.yang-shangkun-riji]], I, 538 (Aug. 26, 1960; Aug. 26, 3:30 to 9 p.m., at the Great Hall); [[w.deng-xiaoping-nianpu-1904]],
        III, 1571 (Aug. 24, 1960; afternoon; Deng at Liu Shaoqi''s symposium with the democratic parties'' leaders, held in the Central Committee''s name; Zhou on Sino-Soviet relations); [[w.peng-zhen-nianpu-1902]],
        IV, 53 (Aug. 24 and 26, 1960; Peng Zhen, with Zhu De, Deng Xiaoping and others, at the symposium of the democratic parties'' leaders called in the Center''s name in the Great Hall of the People;
        Zhou and Liu on the differences and their nature and the Center''s stand, principle and unity); [[w.zhu-de-nianpu-xinbian]], III, 1782 (Aug. 24, 1960; Zhu De 朱德 at the Center''s symposium with the
        democratic parties'' leaders on Sino-Soviet relations; Zhou Enlai 周恩来 reports on them). Made public: 1996. The sitting of Aug. 24 is the one at which Zhou Enlai reported ([[cal.1960-08-24.china-leadership]]):
        Yang Shangkun''s diary has one parties'' symposium that day, 3:30 to 8:30 p.m., Zhou reporting on Sino-Soviet relations ([[w.yang-shangkun-riji]], I, 538), and the Liu chronology has Liu presiding
        on Aug. 24 and 26 ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 492). The second sitting is the 26th, 3:30 to 9 p.m., "continued" (Yang, I, 538); the two entries share the first sitting and this
        one holds the second. The time is the first day''s. Names: Liu Shaoqi.'
