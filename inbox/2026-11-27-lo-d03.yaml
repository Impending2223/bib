    entry:
      id: cal.1960-07-10.cuba
      when: July 10
      date: '1960-07-10'
      place: havana
      thread: cuba
      also:
      - soviet-union
      c: Havana. A mass rally before the Presidential Palace; Castro, ill with pneumonia, absent. Dorticós reads Khrushchev's message offering to buy the sugar.
      n: '[FRUS 1958–60, VI, doc. 549](https://history.state.gov/historicaldocuments/frus1958-60v06/d549) (the rally; the Embassy''s reports, Central Files, 737.00/7–1060). To check: the Embassy''s telegrams
        on the rally, Department of State, Central Files, 737.00/7–1060 (cited by FRUS 1958–60, VI, doc. 549). See [[cal.1960-07-09.cuba-4]]. Names: Castro, Dorticós.'
      tags:
      - name:castro-fidel
      - name:dorticos-torrado-osvaldo
- add:
    entry:
      id: cal.1960-07-11.cuba
      when: July 11
      date: '1960-07-11'
      place: havana
      thread: cuba
      also:
      - soviet-union
      c: 'Bonsal, telegram 153 from Havana: the rally comparatively unsuccessful, its crowd the smallest at such a demonstration, many leaving before Dorticós spoke. After Khrushchev''s statement and letter
        no Cuban can contend Cuba is not aligned with the Soviet orbit; "a powerful influence in developments here"; the opposition unorganized and leaderless.'
      n: '[FRUS 1958–60, VI, doc. 549](https://history.state.gov/historicaldocuments/frus1958-60v06/d549) (the telegram described and quoted). To check: telegram 153 from Havana, July 11, Department of
        State, Central Files, 737.00/7–1160 (cited by FRUS 1958–60, VI, doc. 549). See [[cal.1960-07-10.cuba]]. Names: Bonsal, Dorticós, Khrushchev.'
      tags:
      - name:bonsal-philip-w
      - name:dorticos-torrado-osvaldo
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-27
      when: July 14
      date: '1960-07-14'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Los Angeles, four-thirty. O''Donnell telephones Conway, who has been trying to calm Reuther: the labor people and the liberals of Williams''s Michigan delegation still set on a vice-presidential
        candidate of their own, "a fight to the finish" against the ticket. O''Donnell cannot reach Kennedy and lets him rest.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 222 (O''Donnell''s and Powers''s account; "At four-thirty"). See [[cal.1960-07-14.elections-1960-los-angeles-19]]. Made public: [[w.odonnell-johnny-we-hardly-knew]]
        (1972). Names: O''Donnell, Conway, Reuther, Williams, Kennedy.'
      tags:
      - name:odonnell-kenneth-p
      - name:conway-jack-t
      - name:reuther-walter
      - name:williams-g-mennen
      - name:kennedy-john-f
      - city:los-angeles
      time: 1960-07-14T23:30Z
      time_zone: America/Los_Angeles
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-28
      when: July 14
      date: '1960-07-14'
      place: los-angeles
      thread: elections-1960-los-angeles
      follows:
      - cal.1960-07-14.elections-1960-los-angeles-19
      c: 'Los Angeles, the convention floor, seven-thirty. Conway reaches O''Donnell by telephone: no floor fight, and no candidate against Johnson.'
      n: '[[w.odonnell-johnny-we-hardly-knew]], 222 (O''Donnell''s and Powers''s account; "At seven-thirty"). See [[cal.1960-07-14.elections-1960-los-angeles-19]]. Made public: [[w.odonnell-johnny-we-hardly-knew]]
        (1972). Names: Conway, O''Donnell, Johnson.'
      tags:
      - name:conway-jack-t
      - name:odonnell-kenneth-p
      - name:johnson-lyndon-b
      - city:los-angeles
      time: 1960-07-15T02:30Z
      time_zone: America/Los_Angeles
- add:
    entry:
      id: cal.1960-07-20.cuba
      when: July 20
      date: '1960-07-20'
      place: washington
      thread: cuba
      also:
      - cuba-bay-of-pigs
      - intelligence
      c: 'CIA headquarters, the night. The Havana station''s cable arrives: a Cuban who volunteered to gather intelligence will probably be in contact with Raúl Castro; intelligence needs asked for. The
        duty officer, called in from home, reaches Barnes and J. C. King.'
      n: '[S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=83), 72–73 (1975). Made public: the Church Committee''s interim report, Nov.
        20, 1975. To check: Memo to the Inspector General, Jan. 17, 1975 (cited by S. Rep. No. 94-465, 72). See [[cal.1960-07-21.cuba]]. Names: Raúl Castro, Barnes, J. C. King.'
      tags:
      - name:castro-raul
      - name:barnes-c-tracy
      - name:king-j-c
      time_band: night
      time_range:
      - 1960-07-21T02:00Z
      - 1960-07-21T04:00Z
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-07-22.cuba-2
      when: By July 22
      date: '1960-07-22'
      place: havana
      thread: cuba
      also:
      - cuba-bay-of-pigs
      - intelligence
      c: Havana. The case officer, avoiding the word "assassinate," puts the proposal of an "accident" for Raúl Castro to the Cuban, who, assured his sons will be educated should he die, agrees to a "calculated
        risk" limited to what might pass as accidental.
      n: '[S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=84), 73 (1975) (Cable, Havana to Director, 7/22/60; the case officer''s interview,
        Aug. 4, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Havana to Director, July 22, 1960 (cited by S. Rep. No. 94-465, 73). See [[cal.1960-07-21.cuba]].
        Names: Raúl Castro. Check: the day.'
      tags:
      - name:castro-raul
- add:
    entry:
