    entry:
      id: cal.1960-08-15.laos
      when: By Aug. 15
      date: '1960-08-15'
      thread: laos
      c: The King names Souvanna Phouma to form a government.
      n: '[[w.fursenko-khrushchevs-cold-war]], 328 ("The king nominated Souvanna Phouma as prime minister"; Kong Le transfers power to him Aug. 17). [FRUS 1958–60, XVI, doc. 363](https://history.state.gov/historicaldocuments/frus1958-60v16/d363)
        (Aug. 15: Radio Vientiane, controlled by the rebels, claims that Souvanna Phouma has been designated Premier; not confirmed). See [[cal.1960-08-14.laos]]. Names: Savang Vatthana, Souvanna
        Phouma. Check: the day.'
