      c: Beidaihe 北戴河. Zhou Enlai 周恩来, by appointment, goes to Mao Zedong 毛泽东 at noon and reports his talk with Hồ Chí Minh 胡志明.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 338 (Aug. 8, 1960; 中午, 应约到毛泽东处, 汇报同胡志明交谈话情况). Made public: 1997. See [[cal.1960-08-08.china-leadership]]. Names: Zhou Enlai, Hồ Chí Minh, Mao Zedong.'
