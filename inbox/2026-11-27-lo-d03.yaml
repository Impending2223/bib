    entry:
      id: cal.1960-08-02.congo
      when: Aug. 2
      date: '1960-08-02'
      place: nyc
      thread: congo
      c: New York. Hammarskjöld declares that the UN force will enter Katanga Aug. 6.
      n: '[[w.fursenko-khrushchevs-cold-war]], 310 ("The next day" after the Soviet statement of Aug. 1; the force to enter Katanga "on August 6"); [[w.ball-past-has-another-pattern]], 228 (Aug.
        3, 1960, Hammarskjöld announces that UN troops will enter Katanga Aug. 8, cancelling the order when Tshombe refuses entry). [FRUS 1958–60, XIV, doc. 163](https://history.state.gov/historicaldocuments/frus1958-60v14/d163)
        (Aug. 5: the Belgian ambassador on Hammarskjöld''s statement on "the sending of troops into that Province on Saturday, August 6"). See [[cal.1960-08-01.congo]]. Names: Hammarskjöld. Check:
        Ball, 228, has the announcement Aug. 3 and the entry into Katanga Aug. 8.'
      tags:
      - name:hammarskjold-dag
- add:
    entry:
      id: cal.1960-08-12.desegregation-schools
      when: Aug. 12
      date: '1960-08-12'
      place: houston
      thread: desegregation-schools
      c: 'Houston. Judge Ben C. Connally''s order of Aug. 12 spells the plan out grade by grade: from September 1960 a first-grader may, at his option, attend the formerly all-white or the formerly
        all-Negro school of the zone where he lives; the rule extends to the second grade in September 1961, and so on.'
      n: '*Ross v. Dyer*, [312 F.2d 191](https://static.case.law/f2d/312/case-pdfs/0191-01.pdf), 192 (5th Cir. 1962) (the order of Aug. 12, 1960, entered when questions arose over the meaning
        of the brief order of Aug. 3; "peremptory in nature"; the plan "grade by grade"). See [[cal.1960-08-03.desegregation-schools-houston]]. Names: Ben C. Connally.'
      tags:
      - state:tx
      - city:houston
      - name:connally-ben-c
