- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-24
      when: July 14
      date: '1960-07-14'
      place: los-angeles
      thread: elections-1960-los-angeles
      follows:
      - cal.1960-07-14.elections-1960
      c: 'Los Angeles, the afternoon. Robert Kennedy to Johnson''s suite, Rayburn and Connally with Johnson; the accounts of what he said differ. Robert Kennedy asks Rayburn whether Johnson might
        be interested in being chairman of the national committee; Johnson, after Kennedy''s call: "If the candidate will have me, I''ll join with him in making a fight for it." Graham, by his
        own account, tells Kennedy that Bobby is telling Rayburn and Johnson there is opposition; Kennedy: "Bobby''s been out of touch."'
      n: 'See [[cal.1960-07-14.elections-1960]], which holds the day''s bibliography (the accounts of Robert Kennedy, Connally, Graham, Rowe; the pages for the visit). The hour: "early in the
        afternoon" Graham reports Johnson ready, then Robert Kennedy goes down to Johnson''s suite ([[w.odonnell-johnny-we-hardly-knew]], 220–21). Names: Robert Kennedy, Rayburn, Connally, Johnson,
        Kennedy. Check: Sorensen has Robert Kennedy go to Johnson at his brother''s request, and mention the National Committee chairmanship as an alternative ([[w.sorensen-kennedy]], 166).'
      tags:
      - name:kennedy-robert-f
      - name:rayburn-sam
      - name:connally-john
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - state:ca
      time_band: afternoon
      time_range:
      - 1960-07-14T19:00Z
      - 1960-07-15T01:00Z
      time_zone: America/Los_Angeles
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-26
      when: July 14
      date: '1960-07-14'
      place: los-angeles
      thread: elections-1960-los-angeles
      follows:
      - cal.1960-07-14.elections-1960-los-angeles-24
      c: Los Angeles, the Sports Arena, the evening. McCormack moves to suspend the rules; Collins rules two-thirds needed, calls a voice vote, and declares Johnson nominated for Vice President
        by acclamation. Johnson has been nominated by Lawrence and seconded.
      n: '[[w.caro-passage-of-power]], 143 ("As eight o''clock neared"; McCormack''s motion; the voice vote about evenly divided, "Say ''aye''!" shouted from the Texas delegation; Collins announces
        that the rules are suspended). See [[cal.1960-07-14.elections-1960]], which holds the day''s bibliography (Kallina, 79; O''Donnell, 223; O''Brien, 85–86). Names: McCormack, Collins, Johnson.
        Check: the entry it split from had the rules suspended "over shouts from the galleries"; Caro has the voice vote in the hall about evenly divided, Rayburn calling "Say ''aye''!" (143).'
      tags:
      - name:mccormack-john-w
      - name:collins-leroy
      - name:johnson-lyndon-b
      - state:ca
      time_band: evening
      time_range:
      - 1960-07-15T02:00Z
      - 1960-07-15T05:00Z
      time_zone: America/Los_Angeles
