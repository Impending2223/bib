      when: By Aug. 15
      date: '1960-08-15'
      thread: laos
      c: The King names Souvanna Phouma to form a government.
      n: '[[w.guan-vietnamese-communists-relations-with]], 157 ("On 15 August, it was reported that" the King had appointed Souvanna Phouma to form a new government); [[w.fursenko-khrushchevs-cold-war]],
        328 ("The king nominated Souvanna Phouma as prime minister"; no day). Radio Vientiane''s claim of the same day, not confirmed: [[cal.1960-08-15.laos-2]]. See [[cal.1960-08-14.laos]]. Names: Savang
        Vatthana, Souvanna Phouma. Check: the day.'
