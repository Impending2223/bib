      when: July 27
      date: '1960-07-27'
      place: chicago
      thread: elections-1960-chicago
      c: Chicago. Nixon nominated for President, 1,321 votes to Goldwater's 10.
      n: '[[w.white-making-of-the-president]], 206 (1,321 to 10; Louisiana''s votes for Goldwater); [[w.novak-agony-of-the-g]], 23 (ten Louisiana delegates for Goldwater, the nomination otherwise
        unanimous); [[w.nixon-six-crises]], 316–18 (Hatfield, Wednesday, places Nixon''s name in nomination, Nixon chosen "by acclamation"). See [[cal.1960-07-26.elections-1960]], which holds
        the convention''s bibliography. Names: Nixon, Goldwater.'
      tags:
      - name:nixon-richard-m
      - name:goldwater-barry-m
      - state:il
