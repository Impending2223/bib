- edit:
    id: cal.1960-07-04.elections-1960-2
    base: df755196
    settles:
    - 'Check: the words: the *Times* has no "today."'
    - 'Check: the day: [[w.salinger-with-kennedy]], 40, puts'
    - 'Check: the *Times* dates it July 4.'
    set:
      n: '[[w.shesol-mutual-contempt]], 35; [[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease and might prove physically unfit;
        Johnson''s statement denying advance knowledge; not the words quoted, the *Times* or the day). W. H. Lawrence, "Johnson Backers Urge Health Test," [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html).
        Check: the words: the *Times* has no "today." The day: the *Times* of July 5 dates the press conference July 4 (its dateline, "today," and "the eve of the official opening of preliminary
        sessions"); Salinger, writing in 1966, puts it "on the first day of the convention," July 11 ([[w.salinger-with-kennedy]], 40). Check: the page: 19 by [[w.shesol-mutual-contempt]], 35.
        To check: India Edwards oral history, LBJ Library. Names: Connally, Kennedy, Johnson.'
- edit:
    id: cal.1960-07-04.elections-1960-los-angeles
    base: 849eb8e8
    settles:
    - 'Check: the day (Salinger puts'
    set:
      n: '[[w.salinger-with-kennedy]], 40–41. The day: the *Times* of July 5 prints under a July 4 dateline the answer of Kennedy''s side to the charge, a statement of his on his "adrenal insufficiency"
        with the medical report, and Salinger''s and Robert Kennedy''s replies ([[cal.1960-07-04.elections-1960-2]], [[cal.1960-07-04.robert-kennedy]]); Salinger''s "first day of the convention,"
        July 11 (40), is his later date for the charge, which the *Times* puts at July 4. Names: Salinger, Kennedy, Robert Kennedy, Connally.'
- edit:
    id: cal.1960-07-04.china-leadership-2
    base: 16ec15eb
    set:
      c: By Zhou Enlai's instruction, the border guard meets Nepal's delegates and hands over all the Nepalese held and their horses.{1} The handover is at the Mani pass 马尼堆, as Zhou proposed
        in his letter of July 2; both sides state their wish for friendship and harmony on the border.{2}
      n: '[[w.zhou-enlai-nianpu-1949]], II, 329 (July 4, 1960); [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 150 (July 4, 1960). Made public: 1997. Check: "Nepalese Rebuffs Peiping on Incident,"
        [*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), has the soldier''s body and ten Nepalese prisoners handed over July 5. Names: Zhou
        Enlai.'
      src:
        c: c8e1028c
        rows:
        - 'w.zhou-enlai-nianpu-1949 II, 329: ?'
        - 'w.zhonghua-renmin-gongheguo-waijiao-2001 150: 1, 2'
