      when: July 10
      date: '1960-07-10'
      place: beverly-hills
      thread: elections-1960-los-angeles
      follows:
      - cal.1960-07-10.elections-1960-los-angeles-4
      c: 'Los Angeles, the Beverly Hills Hotel, late that night. Lawrence calls on Stevenson, whom he admires: two hours, going on long after midnight. No announcement.'
      n: '[[w.white-making-of-the-president]], 161 ("late that night"; "a two-hour conversation that went on long after midnight"). The hour: the night band is July 10, 10 p.m. to midnight; the
        talk runs past it. See [[cal.1960-07-09.elections-1960-3]]. Names: Lawrence, Stevenson.'
      tags:
      - name:lawrence-david-l
      - name:stevenson-adlai-e
      - state:ca
      time_band: night
      time_range:
      - 1960-07-11T05:00Z
