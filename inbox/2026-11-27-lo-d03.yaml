      c: 'Kennedy flies to Strategic Air Command headquarters in Omaha for a briefing the Administration arranges; not given the full top-secret account of Soviet and American missile and bomber strength.
        Kennedy: he had more as a member of Foreign Relations; he will remember it at appropriation time.'
      time_band: night
      time_range:
      - 1960-08-21T03:00Z
      - 1960-08-21T05:00Z
      time_zone: America/Chicago
