    entry:
      id: cal.1960-08.laos-3
      when: Aug., after the 9th
      date: 1960-08
      at: after 1960-08-09
      place: vientiane
      thread: laos
      c: Kong Le announces a provisional government of forty men, the Pathet Lao's chiefs among them; Souvanna Phouma and Boun Oum decline to join, waiting on the National Assembly.
      n: '[[w.fursenko-khrushchevs-cold-war]], 328 ("In the first days after the coup"). See [[cal.1960-08-09.laos]]. Names: Kong Le, Souvanna Phouma, Boun Oum. Check: the day.'
      tags:
      - name:kong-le
      - name:souvanna-phouma
      - name:boun-oum-na-champassak
- add:
    entry:
      id: cal.1960-08-15.desegregation-schools
      when: Aug. 15
      date: '1960-08-15'
      place: houston
      thread: desegregation-schools
      c: 'Houston. Three days after Judge Connally''s order, the school board formally approves the Superintendent''s recommendations on carrying out the plan: the brother-sister rule for the elementary
        grades, a child to attend the school of an older brother or sister, and the transfer rule.'
