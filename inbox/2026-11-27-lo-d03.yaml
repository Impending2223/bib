      n: '[[w.odonnell-johnny-we-hardly-knew]], 216 (O''Donnell''s and Powers''s account); [[w.salinger-with-kennedy]], 44 (Salinger''s memorandum: Robert Kennedy''s room at the Biltmore, O''Donnell
        there, Robert Kennedy asks Salinger to compute electoral votes, is "seriously thinking of Johnson," and says Kennedy will see Johnson at 10 a.m.; O''Donnell protests violently, Salinger
        with him; not the bathtub or the words). The hour: "about a half hour after Jack had broken the news to Bobby" ([[w.odonnell-johnny-we-hardly-knew]], 215), at about eight (see [[cal.1960-07-14.elections-1960-los-angeles-15]]).
        Made public: [[w.odonnell-johnny-we-hardly-knew]] (1972). Names: O''Donnell, Salinger, Robert Kennedy, Johnson, Nixon.'
