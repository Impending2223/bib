    entry:
      id: cal.1960-07-22.cuba
      when: July 22
      date: '1960-07-22'
      place:
      - washington
      - havana
      thread: cuba
      also:
      - cuba-bay-of-pigs
      - intelligence
      c: 'CIA headquarters to the Havana station, over Tracy Barnes''s signature: "Do not pursue ref. Would like to drop matter." The Cuban has already left to see Raúl Castro; it is too late
        to drop it.'
      n: '[S. Rep. No. 94-465](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=84), 73 (1975) (the cable, Director to Havana, July 22, 1960, signed
        by Barnes). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-07-21.cuba]]. Names: Barnes, Raúl Castro. Check: [[w.fursenko-khrushchevs-cold-war]], 313,
        has "Do not pursue. . . . Would like to drop matter."'
      tags:
      - name:barnes-c-tracy
      - name:castro-raul
