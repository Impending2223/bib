      when: Aug. 14
      date: '1960-08-14'
      thread: laos
      c: Negotiations in Vientiane and Luang Prabang go on through the day without result. Later, the Somsanith cabinet resigns; at 6:55 p.m. the King accepts the resignations.
      n: 'FRUS 1958–60, XVI, doc. [361](https://history.state.gov/historicaldocuments/frus1958-60v16/d361) (the editorial note: the negotiations of Aug. 14; "Later in the day, the Somsanith Cabinet resigned,
        and at 6:55 p.m. the King accepted the resignations"). [[w.guan-vietnamese-communists-relations-with]], 157 (reported Aug. 15: the government''s resignation to the King). To check: telegram 282
        from Vientiane, Aug. 14; telegrams 259 and 260 from Bangkok, Aug. 14 and 15, Department of State, Central Files, 751J.00 (cited by FRUS 1958–60, XVI, doc. 361). See [[cal.1960-08-13.laos]]. Names:
        Somsanith, Savang Vatthana.'
