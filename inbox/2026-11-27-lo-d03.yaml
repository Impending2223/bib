      c: Los Angeles, the Biltmore, 11 a.m. Kennedy and Lawrence confer alone for half an hour. No announcement.
      n: '[[w.white-making-of-the-president]], 161 (Bailey pressed the candidate''s invitation to private conversation "at eleven the next morning"; they "conferred alone at the Biltmore for half
        an hour"). The hour is the invitation''s. See [[cal.1960-07-09.elections-1960-3]]. Names: Lawrence, Kennedy.'
      tags:
      - name:lawrence-david-l
      - name:kennedy-john-f
      - state:ca
      time: 1960-07-10T18:00Z
      time_approx: true
      time_zone: America/Los_Angeles
