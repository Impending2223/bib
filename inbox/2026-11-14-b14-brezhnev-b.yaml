      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev and Sékou Touré, President of Guinea, who arrives July 26: a talk July 28, 10 to 1:40; Touré sent off July 30. July 28, 2:10 to 6, and July 30, 11 to 5: talks with Aidit and the Indonesian delegation.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 54–55 (July 26–30). Made public: 2016. Names: Brezhnev, Sékou Touré, Aidit.'
