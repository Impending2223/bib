      c: Moscow. Brezhnev negotiates with the Shah of Iran, Mohammad Reza Pahlavi, in the Kremlin June 21 (the hours illegible) and June 26, 10 to 1, and attends the reception for the Shah and the Empress. On June 21, 4 to 6 p.m., with Kosygin and Gromyko, he negotiates with Benyahia of Algeria in the Presidium's new hall.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 42–45 (June 21–26). Made public: 2016. Names: Brezhnev, Kosygin, Gromyko, the Shah, Benyahia.'
