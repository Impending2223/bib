- add:
    entry:
      id: cal.1966-01-10.soviet-union-leadership
      when: Jan. 10–11
      date: '1966-01-10'
      thread: soviet-union-leadership
      also:
      - south-asia
      c: 'On the train to Ulan Bator. Kosygin telephones from Tashkent at 12:15 a.m.: Shastri has died suddenly, after negotiating there with Ayub Khan. Suslov passes by telephone a vote-by-telegram to send Kosygin to India with the body and to the funeral; Brezhnev, at Irkutsk, votes for it at 3:10 a.m. Semichastny asks at 4:10 that TASS and *Pravda* be told to publish the news.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 103 (Jan. 10–11). Made public: 2016. See [[cal.1966-01-10.india-and-china]]. Names: Brezhnev, Kosygin, Suslov, Semichastny, Shastri, Ayub Khan.'
      tags:
