      c: Brezhnev leads the party-government delegation to the Mongolian People's Republic on an official visit, leaving Moscow by train Jan. 7, 3 p.m.; in Mongolia from Jan. 12 to Jan. 16 (the record gives no day-by-day).
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 102–103 (Jan. 7–16). Made public: 2016. Names: Brezhnev. Check: The record gives the delegation''s presence only; the treaty and the talks are not in it.'
