      c: Moscow. Brezhnev negotiates with Tito June 29, 10 to 1; receives him June 30, 10 to 11, in the Central Committee's new hall; attends the signing of the joint communiqué at 5:20 p.m. and the reception; Tito leaves July 1.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 46–47 (June 29–July 1). Made public: 2016. Names: Brezhnev, Tito.'
