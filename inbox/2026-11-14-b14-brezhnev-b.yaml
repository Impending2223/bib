      c: 'Moscow. By the record, at 2:30 Brezhnev goes to the Defense Ministry and returns to the Central Committee at 5:30; the Politburo sits, he presiding, from 5 to 9 a.m.: Kosygin, Podgorny, Kirilenko, Polyansky, Voronov, Shelepin, Mazurov, Suslov, Pelshe, Andropov, Grishin, Demichev, Ustinov, Kapitonov, Katushev, Kulakov, Ponomarev, Solomentsev, Chernenko, Aleksandrov, Rusakov and Gromyko present. From 9, by telephone and in person, he talks with callers, including Pavlovsky in Prague, Mazurov in Prague, and Abrasimov in Berlin; Kirilenko works in his office, 11 to 2 and 8 p.m. to 12:30. At 5:20 to 8 p.m. he meets Kosygin, Podgorny, Andropov, Gromyko, Demichev, Katushev, Tolkunov, Mesyatsev, Zimyanin, Yu. Zhukov, Zamyatin and Lapin.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 277 (Aug. 20–21). Made public: 2016. See [[cal.1968-08-20.soviet-union]]. Names: Brezhnev, Kosygin, Podgorny, Kirilenko, Polyansky, Voronov, Shelepin, Mazurov, Suslov, Pelshe, Andropov, Grishin, Demichev, Ustinov, Kapitonov, Katushev, Kulakov, Ponomarev, Solomentsev, Chernenko, Aleksandrov, Rusakov, Gromyko, Pavlovsky, Abrasimov, Tolkunov, Mesyatsev, Zimyanin, Yuri Zhukov, Zamyatin, Lapin. Check: The record files the 2:30 and 5 a.m. lines under Aug. 20, after the evening''s callers; the Aug. 21 sheet opens with the list of those present. They read as the early morning of Aug. 21.'
