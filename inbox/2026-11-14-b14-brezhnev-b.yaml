      c: Bucharest. Brezhnev leads the Soviet party delegation to the Ninth Congress of the Romanian Communist Party, leaving July 17 and attending to July 24; he returns by way of Kishinev July 25, and meets the members and candidates of the Presidium and the secretaries at the Moscow airport.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], II, 53 (July 17–24). Made public: 2016. Names: Brezhnev.'
