patch: 2026-11-10-pilot-humphrey
by: 'Claude (pilot: Humphrey, Education of a Public Man; the private, social, family and minor rows re-ruled by the reader card, and the "already in" rows read against the calendar), Nov. 10-11, 2026'
ops:
# --- the "already in" rows, read against the entries -------------------------------------------------------------
- cite:
    id: cal.1960-11-08.governors-mn
    item: '[[w.humphrey-education-of-a-public-1976]], 233–34 (Freeman, running for a fourth term, beaten by about twenty-two thousand)'
    units: B
- cite:
    id: cal.1961-06-03.berlin-and-vienna
    item: '[[w.humphrey-education-of-a-public-1976]], 248 (the summit of June 1961, which "ended up miserably"; by Humphrey''s account Kennedy was caught inadequately briefed, and Humphrey, Stevenson and Eleanor Roosevelt were not asked their views of Khrushchev)'
    units: A
- cite:
    id: cal.1963-08-28.march-on-washington
    item: '[[w.humphrey-education-of-a-public-1976]], 271–72 (two hundred thousand, at the Lincoln Memorial; Rustin and the Leadership Conference on Civil Rights the organizers; King, "I have a dream"; King, Wilkins and the other leaders invited to the White House)'
    units: B, D, F-G
- cite:
    id: cal.1963-10-29.civil-rights-bill
    item: '[[w.humphrey-education-of-a-public-1976]], 273 (the compromise of McCulloch, printed "McCullough," with an equal employment commission enforcing through the courts)'
    units: C
- cite:
    id: cal.1963-11-20.civil-rights-bill
    item: '[[w.humphrey-education-of-a-public-1976]], 273 (Judiciary reports the bill two days before the assassination, stronger than the administration''s)'
    units: A
- cite:
    id: cal.1963-11-24.assassination
    item: '[[w.humphrey-education-of-a-public-1976]], 263–64 (the Rotunda at 1:30 p.m.; Mansfield, Warren and McCormack speak briefly; the line twenty blocks long)'
    units: C
- cite:
    id: cal.1963-11-25.assassination
    item: '[[w.humphrey-education-of-a-public-1976]], 264–65 (the procession from the White House to St. Matthew''s; Cushing''s mass; the procession to Arlington; de Gaulle and Haile Selassie among the heads of state)'
    units: A-D
- cite:
    id: cal.1963-11-27.succession
    item: '[[w.humphrey-education-of-a-public-1976]], 273 (the address on the Wednesday after the assassination; the appeal for the civil rights bill in Kennedy''s memory, quoted)'
    units: A, B
- cite:
    id: cal.1964-07-29.robert-kennedy
    item: '[[w.humphrey-education-of-a-public-1976]], 290 (Johnson calls Kennedy in and tells him directly but privately he will not be the nominee; no day, no memorandum)'
    units: B
- cite:
    id: cal.1964-07-30.elections-1964
    item: '[[w.humphrey-education-of-a-public-1976]], 290 (Johnson announces publicly that no member of the Cabinet will be considered, after Kennedy was told)'
    units: A
- cite:
    id: cal.1965-01-30.europe-and-the-alliance
    item: '[[w.humphrey-education-of-a-public-1976]], 419 (Warren sent; Humphrey expected to go and was passed over, the press making it a slight; Johnson to Humphrey: no slight meant)'
    units: A, C
- cite:
    id: cal.1965-03-15.voting-rights
    item: '[[w.humphrey-education-of-a-public-1976]], 493–94 n.1 (a joint session urged by Humphrey; Johnson: "We shall overcome")'
    units: A, D
- cite:
    id: cal.1968-03-14.robert-kennedy
    item: '[[w.humphrey-education-of-a-public-1976]], 363–64 (a Kennedy commission to examine the war, its report to the President, the Secretary of State and Congress, the price of staying out of the primaries; Clifford, at the President''s request, hears it and tells him the demands cannot be met; no day)'
    units: A
- cite:
    id: cal.1968-05-27.elections-1968-state-conventions
    item: '[[w.humphrey-education-of-a-public-1976]], 375 (Pennsylvania among the State convention fights with Kennedy''s people that, by his account, Humphrey won)'
    units: A-B
- variant:
    id: cal.1968-05-25.elections-1968-state-conventions
    unit: A
    witness: w.humphrey-education-of-a-public-1976
    reads: 'Humphrey won the Iowa State convention fight with Kennedy''s people ("When we met head on in state convention fights (in Pennsylvania, Vermont, Idaho, and Iowa, among others), I won")'
    at: '375'
- check:
    id: cal.1968-05-25.elections-1968-state-conventions
    text: 'Check: Humphrey, 375, names Iowa among the State convention fights with Kennedy''s people that he won; the entry gives Kennedy 25 of the 46 votes, Humphrey 9½.'
- check:
    id: cal.1968-06-14.elections-1968-2
    text: 'Check: Humphrey, 375, names Idaho among the State convention fights with Kennedy''s people that he won; the convention met after Kennedy''s death, and the entry gives no division.'
- cite:
    id: cal.1968-09-09.elections-1968
    item: '[[w.humphrey-education-of-a-public-1976]], 396 (Philadelphia: the campaign''s start, thin crowds, too little advance work; Rizzo''s inflated crowd estimate; no day)'
    units: A
- check:
    id: cal.1968-09-09.elections-1968
    text: 'Check: Humphrey, 396, makes Philadelphia the start of the campaign and gives no day; his note puts the start at Labor Day, Sept. 2.'
# --- the private, social, family and minor rows, ruled again ------------------------------------------------------
- add:
    entry:
      id: cal.1964-08-29.elections-1964-johnson
      when: Aug. 29?
      date: '1964-08-29'
      thread: elections-1964-johnson
      also: [press-and-broadcasting]
      c: 'The LBJ Ranch. Johnson has Humphrey dress as a rancher, in Johnson''s own jacket, pants and hat, all too big for him, and ride a big, spirited horse, before reporters and cameramen; the horse rears. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 307–08. Check: the day; the memoir says only "after the 1964 convention," at the Ranch; the Ranch days known are Aug. 28–29. See [[cal.1964-08-29.elections-1964]]; [[cal.1964-08-28.press-and-broadcasting-2]]. Names: Johnson, Humphrey.'
      tags: [name:johnson-lyndon-b, name:humphrey-hubert-h]
- add:
    entry:
      id: cal.1964-06-17.civil-rights-bill-6
      when: June 17
      date: '1964-06-17'
      thread: civil-rights-bill
      c: 'Humphrey, called off the Senate floor in mid-afternoon: his son Robert, in the hospital for a swelling in his neck, has a malignant growth and faces major surgery. Humphrey stays for the debate. Rauh and Mitchell come to the whip''s office, pleased with the bill''s progress, and stay with him. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 285, 479–80 n.13 (the call; the surgery; he stays on the floor; Rauh and Mitchell; by the note no flight to Minneapolis on the Friday, at his son''s side Saturday morning). Check: the day; the memoir puts the call on June 17 and the final passage "the next day," and its note puts the Friday, June 19, the day of the final vote ([[cal.1964-06-19.civil-rights-bill]]), as the day he could not fly. See [[cal.1964-06-17.civil-rights-bill]]; [[cal.1964-06-19.civil-rights-bill]]. Names: Humphrey, Rauh, Mitchell.'
      tags: [name:humphrey-hubert-h, name:rauh-joseph-l-jr, name:mitchell-clarence-jr]
- add:
    entry:
      id: cal.1966-02-10.vietnam-humphrey
      when: Feb. 10–12
      date: '1966-02-10'
      thread: vietnam-humphrey
      c: 'Humphrey, flying from Honolulu to Saigon with Kỳ and Thiệu: Thiệu the strongman, Kỳ the front man; he so reports to Johnson. In Saigon, Westmoreland''s briefings; Habib, to one of Humphrey''s staff, hopes Humphrey will talk to others than his briefers; Thomson meets some of Lansdale''s staff, Ellsberg among them, and reporters, critical. Humphrey does not dispute the presentations of Westmoreland and Lodge. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 331–32 (also Kỳ twirling his pistols as Harriman talked with him; the briefers, American soldiers and civilians, Vietnamese labor leaders; Ward Just of the *Washington Post* among the reporters). Check: the days within the stay. See [[cal.1966-02-10.vietnam]]; [[cal.1966-02-12.vietnam-humphrey]]. Names: Humphrey, Nguyễn Cao Kỳ, Nguyễn Văn Thiệu, Johnson, Harriman, Westmoreland, Habib, Thomson, Ellsberg, Lodge.'
      tags: [name:humphrey-hubert-h, name:nguyen-cao-ky, name:nguyen-van-thieu, name:johnson-lyndon-b, name:harriman-w-averell, name:westmoreland-william, name:habib-philip-c, name:thomson-james-c-jr, name:ellsberg-daniel, name:lodge-henry-cabot, place:saigon]
- add:
    entry:
      id: cal.1968-03-31.elections-1968-humphrey
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-humphrey
      also: [latin-america]
      c: 'Mexico City, Ambassador Fulton Freeman''s residence. Humphrey, in Mexico as the United States'' representative to sign a nuclear nonproliferation treaty for the Western Hemisphere, is to host a dinner for President Díaz Ordaz. He and his wife hear Johnson''s address in the library, the guests in other rooms, the press outside. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 358–59 (the trip; the dinner; Watson''s call before the address), 359 n. (by his note, the first time a Mexican President set foot in the American Embassy since the Revolution). Check: the day of the signing; the memoir does not give it. See [[cal.1968-03-31.elections-1968-4]]; [[cal.1968-03-31.elections-1968-6]]. Names: Humphrey, Díaz Ordaz, Johnson, Watson.'
      tags: [name:humphrey-hubert-h, name:diaz-ordaz-gustavo, name:johnson-lyndon-b, name:watson-w-marvin]
- add:
    entry:
      id: cal.1966-12-29.transition-and-staff
      when: Dec. 29?
      date: '1966-12-29'
      thread: transition-and-staff
      c: 'Puerto Rico. Humphrey, asked by Istomin and Stern, at the evening honoring Pablo Casals on his ninetieth birthday: Stern, Istomin and Rose play a piece of Casals''s he had never played, for political reasons. Humphrey presents him a pipe; brief speeches; dinner after. By Humphrey''s account.'
      n: '[[w.humphrey-education-of-a-public-1976]], 418. Check: the day; the memoir gives only "his ninetieth birthday," and Casals was born Dec. 29, 1876 (Wikipedia, "Pablo Casals," read Nov. 11, 2026). Names: Humphrey.'
      tags: [name:humphrey-hubert-h]
