    item: '[[w.wofford-of-kennedys-and-kings]], 154 (Montgomery, the First Baptist Church, nearly 1,500 against "a huge, howling mob"; King; not enough marshals; the governor "belatedly sent in the National Guard" and the mob was driven back; not Abernathy or martial law)'
    units: '?'
- check:
    id: cal.1961-05-21.freedom-rides
    text: 'Check: Wofford, 154, has too few marshals on hand to assure the safety of the nearly 1,500 in the church; fifty were at the airport when King arrived.'
- cite:
    id: cal.1961-05-22.robert-kennedy-2
