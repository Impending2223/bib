patch: 2026-11-11-b8-wofford
by: 'Claude (batch 8: Wofford, Of Kennedys and Kings, the "already in" rows read by the card), Nov. 11, 2026'
ops:
- add:
    entry:
      id: cal.1960-11-30.transition-and-staff-cabinet
      when: Nov. 30
      date: '1960-11-30'
      thread: transition-and-staff-cabinet
      c: 'Georgetown, breakfast, by Bowles''s account. Kennedy to Bowles: "If you were Secretary of State, what kind of an organization would you set up?" Bowles: "I think I''d start by asking Dean Rusk to become Undersecretary." Kennedy asks if Rusk is not the president of the Rockefeller Foundation. Rusk not on the list for Secretary until then.'
      n: '[[w.wofford-of-kennedys-and-kings]], 83 (Bowles''s account; the breakfast four days before the Rockefeller trustees'' meeting at Williamsburg). Check: the day, Nov. 30 counting back from Williamsburg, [[cal.1960-12-04.transition-and-staff-cabinet]]; Wofford does not date the breakfast. Names: Kennedy, Bowles, Rusk.'
      tags:
      - name:kennedy-john-f
      - name:bowles-chester
      - name:rusk-dean
      - city:washington
- add:
    entry:
      id: cal.1960-11.transition-and-staff-cabinet-4
      when: Nov., end
      date: 1960-11
      thread: transition-and-staff-cabinet
      c: 'Kennedy asks Stevenson to be Ambassador to the United Nations, with Cabinet status: with the slim Democratic majority in Congress he needs a Secretary of State "not so controversial." Stevenson will not accept without knowing who will be Secretary of State; alarmed by word that Kennedy is thinking of Bundy. Kennedy, irritated, "was about to tell him that he couldn''t have even that," by Robert Kennedy''s later account.'
      n: '[[w.wofford-of-kennedys-and-kings]], 82–83 (Robert Kennedy''s later account of Kennedy''s irritation; Wofford''s own word on Stevenson''s opposition to Bundy). Check: the day; Wofford has "the end of November". See [[cal.1960-12-01.transition-and-staff-2]]. Names: Kennedy, Stevenson, Bundy, Robert Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:bundy-mcgeorge
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-06-12.civil-rights-bill-4
      when: June 12
      date: '1963-06-12'
      thread: civil-rights-bill
      c: Kennedy by telephone to Eisenhower, for his help on the civil rights bill. Eisenhower does not favor passing a "whole bunch of laws."
      n: '[[w.wofford-of-kennedys-and-kings]], 173. Check: the hour and the call''s record; Wofford names no source. See [[cal.1963-06-10.civil-rights-bill]]. Names: Kennedy, Eisenhower.'
      tags:
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1963-05-13.civil-rights-the-executive
      when: May 13
      date: '1963-05-13'
      thread: civil-rights-the-executive
      c: 'Louis Martin to Robert Kennedy: "the accelerated tempo of Negro restiveness and the rivalry of some leaders for top billing coupled with the resistance of segregationists may soon create the most critical state of race relations since the Civil War."'
      n: '[[w.wofford-of-kennedys-and-kings]], 171 (quoting). Check: the form (memorandum or word) and the record; Wofford names no source. See [[cal.1963-05-24.civil-rights-the-executive]]. Names: Robert Kennedy.'
      tags:
      - name:kennedy-robert-f
- cite:
    id: cal.1960-10-25.elections-1960-5
    item: '[[w.wofford-of-kennedys-and-kings]], 20 (from Nixon''s *Six Crises*: the Justice Department''s draft for Eisenhower to read on television, to join Dr. King in an application for his release; "Who decided against it, and why, we do not know"; not Walsh, the day or the copies)'
    units: '?'
- check:
    id: cal.1960-10-25.elections-1960-5
    text: 'Check: Wofford, 20, from Nixon''s *Six Crises*, has Nixon talk first with Attorney General Rogers, who recommended strong White House action; the draft was for Eisenhower to read on television.'
- cite:
