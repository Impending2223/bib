    item: '[[w.wofford-of-kennedys-and-kings]], 49 (July 2, Truman on television against Kennedy; Symington, Johnson, Bowles, Meyner and "several others"; "be patient"; not the quotations or the number)'
    units: '?'
- cite:
    id: cal.1960-07-04.elections-1960
    item: '[[w.wofford-of-kennedys-and-kings]], 49–50 (July 4, Kennedy''s reply: the age test "would have kept Jefferson from writing the Declaration ... and Christopher Columbus from even discovering America"; fourteen years in office rules out "all but three of the ten names" and every President of the century; not the press conference, New York or Sorensen)'
    units: C
- check:
    id: cal.1960-07-04.elections-1960
    text: 'Check: Wofford, 50, has Kennedy answer Truman''s question "are you certain that you are ready?" with Lincoln''s reply: "I see the storm coming and I know His hand is in it. If He has a place and work for me, I believe that I am ready."'
