    words: 'Accepting: Governor Sanford, Ervin and Jordan of North Carolina; Olin Johnston and Governor Donald Russell of South Carolina; Talmadge, if his schedule permits; Governor Sanders of Georgia. Robertson is going antelope hunting.'
