    words: 'Four days, forty-seven speeches in six States. Robertson of Virginia declines, away antelope hunting. At New Orleans Johnson speaks to some fifteen hundred Democrats at a $100-a-plate dinner at the Jung Hotel: "I signed it, and I am going to enforce it." The old Senator told the story to Speaker Rayburn.'
