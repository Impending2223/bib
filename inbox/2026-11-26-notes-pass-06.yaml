    words: All one hundred Senators are present, Metcalf presiding. Engle, dying of a brain tumor, is wheeled in; at Kuchel's request his lifted finger to his eye is recorded as yea. John J. Williams of Delaware is the sixty-seventh vote; Hayden votes no after Mansfield tells him "We've got the votes." Goldwater is among the six Republicans against.
    item: '[[w.risen-bill-of-the-century]], 227–29'
