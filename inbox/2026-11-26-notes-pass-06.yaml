    after: end
    words: Ferris, of Mansfield's staff, takes the phrase to Katzenbach and Marshall at Justice.
    item: '[[w.risen-bill-of-the-century]], 217'
- add-words:
    id: cal.1964-05-07.civil-rights-bill-3
    after: end
    words: That evening Kuchel goes to Humphrey about a cloture vote in a couple of weeks. Humphrey, "pretty discouraged," says he floated it to keep the civil rights groups in line and sees no action before the first week in June.
    item: '[[w.purdum-idea-whose-time-has-2014]], 281–82'
