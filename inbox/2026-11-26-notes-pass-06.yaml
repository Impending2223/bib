    words: 'Peng Zhen goes; Ambassador Chervonenko gives the reception. Peng Zhen speaks: the differences between the two parties are unavoidable, rooted in class struggle at home and abroad; those who would split the peoples are only passing guests of history; the bond of October cannot be broken.'
