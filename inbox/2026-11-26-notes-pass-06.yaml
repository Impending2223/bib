    words: 'Seymore Trammell is with Wallace. Johnson, joking that Wallace and King "have something in common," keeps him two hours: "You can''t stop a fever by putting an icepack on your head." He shows him a newspaper photograph of a trooper kicking a demonstrator.'
    item: '[[w.kotz-judgment-days]], 304–05'
- add-words:
    id: cal.1965-03-14.voting-rights-2
    after: end
    words: 'McCormack: "I think the president should go over to a joint session." Albert and Humphrey agree; Humphrey dictates the invitation.'
