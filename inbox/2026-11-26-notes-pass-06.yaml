    words: 'They are in at 11:20 a.m. Johnson, against Lee White''s advice to eject and arrest them, says: "Let them eat and drink, but don''t let them go to the bathroom." Lee White, Moyers and Clifford Alexander ask them to meet him; they will not. Five teams of guards, one Negro and one white officer each, take the ten out five exits.'
