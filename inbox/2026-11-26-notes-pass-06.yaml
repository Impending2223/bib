    base: a2bca61d
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 27, 1964. [[w.zhou-enlai-nianpu-1949]], II, 677 (Oct. 27, 1964: Zhou goes to Mao''s for a meeting or talk); [[w.lengxi-shinian-lunzhan-1956-1966]], 841–844 ("one affirm, two watch" to "one push, two watch"; Zhou to head the delegation to Moscow with He Long; the matter left to the next day; the new leaders to take up farming, industry, Party structure first; the policy to China unlikely to change soon); [[w.deng-xiaoping-nianpu-1904]], III, 1833 (Oct. 27, 1964; evening, 晚; Deng at the Politburo Standing Committee meeting Mao presides over; Mao proposes that China take the initiative with the CPSU Central Committee in proposing to send a delegation to the October Revolution celebrations); [[w.peng-zhen-nianpu-1902]], IV, 366–367 (Oct. 27, 1964, afternoon; Peng Zhen, with a dozen in charge of international and foreign affairs, sits in at Mao''s Standing Committee on the questions after Khrushchev''s fall; Mao proposes offering to send a delegation to the October Revolution anniversary; on Liu Shaoqi''s letter of Oct. 18: better leave it a year or two, as with the Xinyang affair everything will come out; on p. 367 the proposal that all twelve socialist countries send delegations, and that Deng Xiaoping and Peng Zhen go to Korea to tell Kim Il Sung, stands under Oct. 29, not Oct. 27); [[w.zhu-de-nianpu-xinbian]], III, 1921 (Oct. 27, 1964; Zhu De 朱德 at the meeting Mao Zedong 毛泽东 presides over). Made public: 1997. Names: Mao Zedong, Zhou Enlai, He Long, Khrushchev.'
