    after: end
    words: 'Peng Zhen sits in. The meeting also takes up Liu Shaoqi''s letter of Oct. 18 on punishing cadres who strike at poor and lower-middle peasants. Mao: leave it a year or two; as with the Xinyang affair, everything will come out.'
