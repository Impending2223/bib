- add-words:
    id: cal.1964-06-08.china-leadership
    after: end
    words: 'Peng Zhen is there; some Politburo members and the regional bureaus'' first secretaries sit in. As Mao speaks on preventing revisionism, he and Zhou Enlai break in: many places below are held by the enemy.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 336'
- add-words:
    id: cal.1964-06-09.civil-rights-bill
    after: end
    words: 'At 7:30 p.m. Johnson telephones from the White House; Humphrey, at dinner at the Monocle with Andrew Glass: "We have the votes." Later that evening, learning that John Williams and Hickenlooper will back cloture, he calls Johnson again.'
    item: '[[w.whalen-longest-debate]], 196'
- add-words:
    id: cal.1964-06-09.civil-rights-bill
    after: end
    words: By Purdum, Humphrey tells Johnson he is sure of sixty-eight votes, forty-two of them Democrats; Edmondson, whom Johnson had lobbied, has agreed because of the Morton amendment. Dirksen is confident of at least twenty-six of the thirty-three Republicans.
