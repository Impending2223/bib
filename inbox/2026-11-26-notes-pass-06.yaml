- add-words:
    id: cal.1964-07-07.china-leadership
    after: end
    words: 'Peng Zhen presides at the Secretariat''s 380th meeting; He Long, Zhou Yang, Hu Sheng 胡绳 and Lin Feng 林枫 sit in. He relays Mao: the arts "very confused," some associations at the edge of revisionism, a Petőfi Club ahead; Yang Xianzhen''s "two combine into one" in philosophy. The meeting also decides that Yang Xianzhen''s views be criticized in public.'
