    words: Johnson sends Fortas to get the resignation; Fortas and Clifford ask editors to hold the story. The FBI tips the Republicans within forty-eight hours; Goldwater is told Oct. 12. Goldwater charges a cover-up of "one of the sorriest rumors we have ever had in the nation's capital," then asks only for thorough security checks.
