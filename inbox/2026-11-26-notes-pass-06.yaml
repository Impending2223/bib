    words: Deng Xiaoping 邓小平 had worked out the lines of the note on the road from Changsha, with the drafting group under Peng Zhen at Xi'an; the party returned to Peking Apr. 20. Mao writes that the note is read, very good, to be broadcast that night and printed next day.
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 769–770'
- add-words:
