- edit:
    id: cal.1964-07-07.china-leadership
    base: b676b2b7
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 7, 1964; [[w.macfarquhar-origins-of-the-cultural]], III, 388 (at the beginning of July Mao proposes a small group to take charge of the revolution in culture: Peng Zhen its head, Lu Dingyi his deputy, Kang Sheng, Zhou Yang and Wu Lengxi members); [[w.yang-shangkun-riji]], II, 390 (July 7, 1964; the Secretariat, afternoon: Peng Zhen relays Mao''s latest directions on rectification in literature and art and the academic world 文艺界、学术界整风; Yang there); [[w.yang-jisheng-tiandi-fanfu]], I, 98 (the five-man group of the Cultural Revolution: Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang, Wu Lengxi; Hu Sheng, Yao Zhen and Fan Ruoyu at the work); [[w.peng-zhen-nianpu-1902]], IV, 342–343 (July 7, 1964, afternoon; Peng Zhen presides at the Secretariat''s 380th meeting, He Long, Zhou Yang, Hu Sheng 胡绳 and Lin Feng 林枫 sitting in; he relays: Mao lately on art, philosophy and social science, the arts "very confused," some associations at the edge of revisionism, a Petőfi Club ahead; the Ministry of Culture not serving the workers, peasants and soldiers, this front badly staffed since 1949; Mao would even make revolution against the ministry and associations from the localities; in philosophy Yang Xianzhen''s "two combine into one"; high salaries; Peng Zhen: great questions of principle; the Secretariat had not taken up the revolution in ideology, the criticism of Hu Feng, of *Dream of the Red Chamber* studies and of *The Life of Wu Xun* all Mao''s own; ideology tied to successors, or children lost and a Petőfi Club and counter-revolutionary restoration; decided: a five-man group, on Mao''s nomination, Peng Zhen head, Lu Dingyi, Kang Sheng, Zhou Yang and Wu Lengxi, to lead the carrying out of the Center''s and Mao''s directions on literature, art, philosophy and social science (later the Five-Man Group of the Cultural Revolution); Yang Xianzhen''s views criticized in public; Mao''s comment of June 27 and Song Renqiong''s report on rural branches training successors printed for senior cadres); [[w.dikotter-cultural-revolution]], 46 (the Group of Five, under Peng Zhen, charged in July 1964 with purifying literature and the arts); [[w.pu-weihua-zalan-jiu-shijie]], 53 (Peng Zhen conveys at the Secretariat of July 7 Mao''s view, the group decided at the Standing Committee of July 2; its task quoted: to lead the carrying out of the Center''s and the Chairman''s instructions on literature and art and philosophy and social science; later called the Center''s Five-Man Group for the Cultural Revolution; to January 1966 it met only two or three times). Made public: 2013. Check: Made public: Yang Shangkun''s diary records the Secretariat''s meeting and Peng Zhen''s relaying of Mao''s directions ([[w.yang-shangkun-riji]], II, 390); by the 2017 edition''s front matter the day stands in its first edition ([[w.shangkun-yang-shangkun-riji-2]], 2001), not seen, before the 2013 the note gives. Names: Mao Zedong, Peng Zhen, Lu Dingyi, Kang Sheng, Zhou Yang, Wu Lengxi. Check: the group''s later name (the "Group of Five") and the chronology''s silence on its minutes.'
