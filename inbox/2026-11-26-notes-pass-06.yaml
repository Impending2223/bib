    id: cal.1964-05-19.civil-rights-bill
    after: end
    words: 'Stennis: the amendments are "designed to make the bill less burdensome to the states in which the proponents can probably pick up a few votes." Clark and Hart say they can live with it. Simpson of Wyoming: "warmed it over like hash."'
