- add-words:
    id: cal.1965-03-20.alabama
    after: end
    words: 'General Graham commands the first forces: an infantry battalion of 1,837 men from his Alabama division, the 503rd Military Police Battalion from Fort Bragg, 500, and the 720th from Fort Hood, 509; almost 100 marshals come in.'
    item: '[[w.bernstein-guns-or-butter]], 233'
- add-words:
    id: cal.1965-03-21.voting-rights
    after: end
    words: By Judge Johnson's order 3,200 may march on the four-lane stretches and 300 a day through Lowndes County. The first day covers seven miles; the three hundred sleep on David Hall's farm. The second is seventeen miles, to Rosa Steele's farm; the third ends at Gaston's; the last night is at the City of St. Jude.
    item: '[[w.kotz-judgment-days]], 320–22'
