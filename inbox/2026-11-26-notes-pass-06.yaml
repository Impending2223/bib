    after: end
    words: At the Georgia legislature's breakfast in Atlanta, the Dinkler Plaza, some 1,700 guests; Johnson tells it not to heed "those who would come waving the tattered and discredited banners of the past." Half a million line the motorcade; forty thousand fill Gainesville's square.
    item: '[[w.whalen-longest-debate]], 178'
- add-words:
    id: cal.1964-05-12.elections-1964
    after: end
    words: 'Nebraska, by Novak: Goldwater 67,369, 49 percent; Nixon, written in, 42,811; Lodge, written in, 22,113. Fred Seaton''s mailing had urged the Nixon write-in.'
