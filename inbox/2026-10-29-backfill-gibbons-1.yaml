      when: July 16
      date: '1965-07-16'
      thread: vietnam-congress
      c: 'Morse in the Senate, the day McNamara leaves for Saigon: "Goldwater could not possibly have moved further and faster than the President has moved in leading us into a war in Asia." The "reservationists" of May: "Of course they have not been consulted."'
      n: '[111 Cong. Rec. 17,146–52](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-8-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 389–90. Names: Morse, McNamara, Goldwater.'
