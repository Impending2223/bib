      thread: laos
      also:
      - republican-party-congress
      c: 'Laird to Rusk: under the Geneva declaration and protocol Laos is "being surrendered to the Communists, as Poland was at Yalta"; the agreement should go to the Senate as a treaty; five questions, among them whether it bars the Communist troops in Laos from moving into South Vietnam.'
      n: 'The letter, in [110 Cong. Rec. 12,257–58](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt9/pdf/GPO-CRECB-1964-pt9-9-1.pdf) (1964) (printed by Laird, June 1, 1964). [[w.gibbons-u-s-government-and]], II, 119 (the letters). Made public: Laird, in the House, June 1, 1964. Names: Laird, Rusk.'
