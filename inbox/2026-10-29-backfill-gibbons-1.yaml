      date: '1965-04-08'
      thread: vietnam-congress
      c: 'Morse and Gruening in the Senate on Johns Hopkins. Morse: "nothing in the President''s speech that suggests to me he has any negotiations in mind at all"; "the dollar sign was liberally displayed."'
      n: '[111 Cong. Rec. 7497–98](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt6/pdf/GPO-CRECB-1965-pt6-2-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 220. See [[cal.1965-04-07.vietnam]]. Names: Morse, Gruening.'
