      when: Apr. 11
      date: '1965-04-11'
      thread: vietnam-congress
      c: 'Fulbright, in a press interview: halt the bombing; a temporary cease-fire might bring negotiations. By Lady Bird Johnson''s diary, the President''s statement of Apr. 17 is "planned as a countermove."'
      n: '[[w.gibbons-u-s-government-and]], III, 222 n.15 (from Lady Bird Johnson, *A White House Diary*, 260–61). Check: the interview''s publication. Names: Fulbright, Lady Bird Johnson.'
