      when: July 23
      date: '1965-07-23'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, privately: 200,000 or 300,000 men only the beginning; "a figure of one million ... could be considered conservative." A new resolution would meet "more opposition than heretofore."'
      n: '[[w.gibbons-u-s-government-and]], III, 390. To check: Mansfield to Johnson, July 23, 1965, NSF, Name File, Mansfield, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 390 n.43). Names: Mansfield, Johnson.'
