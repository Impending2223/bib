      n: '[111 Cong. Rec. 2619](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt2/pdf/GPO-CRECB-1965-pt2-10-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 82. Names: Pell, Mansfield.'
