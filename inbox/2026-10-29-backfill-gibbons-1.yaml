        - 'via w.gibbons-u-s-government-and III, 301 n.67: all'
- add:
    entry:
      id: cal.1965-06-10.vietnam-july-decision
      when: June 10
      date: '1965-06-10'
      thread: vietnam-july-decision
      c: 'Johnson''s second meeting on Westmoreland''s request, Russell present at his invitation: McNamara and Rusk for some 100,000 men; Taylor agrees. Johnson: "Don''t you think it will be read as land war in Asia?" Russell, by William Bundy''s notes: "Driblets were not the answer"; "how to get us out and save face."'
      n: '[[w.gibbons-u-s-government-and]], III, 286–88 (William Bundy''s and McGeorge Bundy''s notes). To check: William Bundy, manuscript history, ch. 26; McGeorge Bundy''s notes, Papers of McGeorge Bundy, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 286 n.24, 288 n.33). See [[cal.1965-06-07.vietnam]]. Names: Johnson, Westmoreland, Russell, McNamara, Rusk, Taylor, William Bundy.'
      tags:
