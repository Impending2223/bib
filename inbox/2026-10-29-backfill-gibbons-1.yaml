      date: '1965-06-16'
      thread: republican-party
      also:
      - vietnam
      c: 'The Young Republican National Convention: Goldwater and Hickenlooper with Laird. Goldwater: SEATO''s Asian troops for the ground war, American sea and air power to strike "all the means" of aggression; a neutral South Vietnam with a coalition "Communist virtually overnight." Javits: Republican criticism may keep the country out of a land war.'
      n: '[[w.gibbons-u-s-government-and]], III, 306. To check: *New York Times*, June 17 and 18, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 306 n.82). Check: the days. Names: Goldwater, Hickenlooper, Laird, Javits.'
