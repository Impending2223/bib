      when: June 5
      date: '1965-06-05'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, after the leaders'' meeting: support for his "resistance to pressures for an irreversible extension of the war in Asia," which bombing Hanoi and Haiphong could be; "the minimum military effort" and the conference table "as soon as possible."'
      n: '[[w.gibbons-u-s-government-and]], III, 276. To check: Mansfield to Johnson, June 5, 1965, NSF, Name File, Mansfield, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 276 n.160). See [[cal.1965-06-03.vietnam]]. Names: Mansfield, Johnson.'
