- add:
    entry:
      id: cal.1965-05-16.vietnam-mayflower
      when: May 16
      date: '1965-05-16'
      thread: vietnam-mayflower
      c: 'Evening, Johnson with Rusk, Ball, Harriman, McNamara, McGeorge Bundy, Raborn, Helms, Acheson and Fortas: the bombing to resume. "We have stopped in deference to Mansfield and Fulbright, but we don''t want to do it too long else we lose our base of support." McNamara: "Mansfield ought to know Hanoi spit in our face."'
      n: '[FRUS 1964–68, II, doc. 304](https://history.state.gov/historicaldocuments/frus1964-68v02/d304) (Valenti''s notes). [[w.gibbons-u-s-government-and]], III, 256–57. Check: FRUS''s notes list the President, Rusk, McNamara, Acheson, Ball, Raborn and Valenti, and lack McNamara''s words; Gibbons, III, 256, adds Harriman, Bundy, Helms and Fortas. See [[cal.1965-05-12.vietnam]]. Names: Johnson, Rusk, Ball, Harriman, McNamara, McGeorge Bundy, Raborn, Helms, Acheson, Fortas, Mansfield, Fulbright.'
