      thread: vietnam-congress
      also:
      - laos
      c: 'Dodd in the Senate, back from Southeast Asia: "the drama which may toll the death knell for the United States and for Western civilization is now being played out in southeast Asia." A Laos "truly free," or by force of arms; guerrillas into North Vietnam, its arsenals and offices "a target for sabotage."'
      n: '[107 Cong. Rec. 9176](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt7/pdf/GPO-CRECB-1961-pt7-8-1.pdf) (1961). [[w.gibbons-u-s-government-and]], II, 46–47. Names: Dodd.'
