      when: May 17–18
      date: '1965-05-17'
      thread: war-opposition
      also:
      - vietnam-congress
      c: 'Dodd''s Internal Security Subcommittee hears J. Edgar Hoover on the Communist Party and the students: the Free Speech Movement at Berkeley "exploited by a few Communists"; Possony: "the radicalization of American youth is proceeding beyond the wildest expectations of the Communists."'
      n: '[[w.gibbons-u-s-government-and]], III, 272. To check: *New York Times*, May 18, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 272 n.146). Names: Dodd, Hoover.'
