      when: July 12
      date: '1965-07-12'
      thread: vietnam-congress
      c: 'Foreign Relations, in executive session, decides not to hold hearings "at this time" on the Javits–Randolph resolution. Fulbright to them, July 13: the committee has reviewed Vietnam in executive session eleven times since January.'
      n: '[[w.gibbons-u-s-government-and]], III, 286 n.23. To check: the letters of July 7 and 13, National Archives, RG 46, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], III, 286 n.23). See [[cal.1965-06-24.vietnam-congress]]. Names: Fulbright, Javits, Randolph.'
