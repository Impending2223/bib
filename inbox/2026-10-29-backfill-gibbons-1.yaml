      when: May 15
      date: '1965-05-15'
      thread: vietnam-congress
      c: 'Mansfield, for the White House, on the teach-in: the administration will not be "goaded by the voices of an impatient arrogance" into withdrawing from Vietnam or the Dominican Republic; the President "will take them out just as soon as a satisfactory alternative is found."'
      n: '[[w.gibbons-u-s-government-and]], III, 272. To check: *New York Times*, May 16, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 272 n.145). See [[cal.1965-05-15.students]]. Names: Mansfield.'
