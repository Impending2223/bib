      when: June 29
      date: '1965-06-29'
      thread: vietnam-congress
      c: 'Morse to Johnson: lay "the whole issue of the Vietnam war" before the Security Council; two draft resolutions, a Geneva conference reconvened for a cease-fire, or a cease-fire and a UN force in place of American troops.'
      n: '[[w.gibbons-u-s-government-and]], III, 313–14. To check: Morse to Johnson, June 29, 1965, WHCF, C.F. ND 19/CO 312, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 313 n.106). Names: Morse, Johnson.'
