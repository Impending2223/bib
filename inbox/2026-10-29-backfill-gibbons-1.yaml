      date: '1965-05-05'
      thread: vietnam-congress
      c: 'McGeorge Bundy at breakfast with Clark. To Johnson: Clark "furious" at the supplemental but likely to vote for it; a man "of plenty of convictions, but not quite enough courage to give them full expression."'
