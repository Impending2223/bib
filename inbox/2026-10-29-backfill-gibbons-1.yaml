- add:
    entry:
      id: cal.1965-07-24.vietnam-support
      when: July 24
      date: '1965-07-24'
      thread: vietnam-support
      also:
      - vietnam-congress
      c: 'Cater to Johnson: "six kick-off speeches ready for key senators" to back the decision, a ten-man speech team at State. Marcy, by telephone, tells Cater of the fears of Fulbright, Aiken, Church, "and perhaps Russell" of a land war without allies; the committee "extremely dissatisfied with itself."'
