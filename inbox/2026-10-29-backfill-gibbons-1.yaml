      when: June 24
      date: '1965-06-24'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Javits and Randolph offer a new resolution on Vietnam: the President authorized "to take all necessary steps, including the use of armed force"; the objectives stated, and readiness to negotiate. The Tonkin resolution "out of date"; "Neither is a Gallup poll" enough. Rusk, the day before, had Mansfield send it to Foreign Relations, where it stays.'
      n: '[111 Cong. Rec. 14,636–38](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-3-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 284–86. To check: Rusk to Johnson, June 23, 1965, NSF, NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 286 n.22). Names: Javits, Randolph, Rusk, Mansfield.'
