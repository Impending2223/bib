      id: cal.1965-05-05.vietnam-congress-2
      when: May 5
      date: '1965-05-05'
      thread: vietnam-congress
      c: 'Appropriations and Armed Services, jointly, report the $700 million unanimously in the morning; the Senate debates it from the afternoon. Allott: "we are there and that we must win." Javits for it, but no substitute for a new resolution: "I want to be consulted again." Byrd against signals "confused" by "pacifistic demonstrations."'
      n: '[111 Cong. Rec. 9492–507](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-6-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 245–46. See [[cal.1965-05-04.vietnam]]. Names: Allott, Javits, Robert Byrd.'
