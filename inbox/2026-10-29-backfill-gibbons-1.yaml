        - 'w.gibbons-u-s-government-and III, 389–90: all'
        - 'via w.gibbons-u-s-government-and III, 389 n.41: all'
- add:
    entry:
      id: cal.1965-07-21.vietnam-congress
      when: July 21
      date: '1965-07-21'
      thread: vietnam-congress
      c: 'Mansfield in the Senate, for an international conference: the war "may go on for 4 or 5 or even 10 years"; "not for a summer of pain and difficulty but for an ordeal of indefinite duration and increasing sacrifice."'
      n: '[111 Cong. Rec. 17,797–98](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-3-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 390. Names: Mansfield.'
