      when: June 14
      date: '1965-06-14'
      thread: republican-party-congress
      also:
      - vietnam-congress
      c: 'Laird, chairman of the House Republican Conference: "We may be dangerously close to ending Republican support of our present Vietnam policy"; if the aim is a coalition settlement, ground forces overcommitted; bomb more targets, Haiphong among them. Dirksen: "We are going to uphold the President''s hand."'
      n: '[111 Cong. Rec. 14,154–55](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt10/pdf/GPO-CRECB-1965-pt10-8-1.pdf) (1965) (printed June 21). [[w.gibbons-u-s-government-and]], III, 305–06. To check: *New York Times*, June 15, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 306 n.81). Names: Laird, Dirksen.'
