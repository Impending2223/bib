      when: July 8
      date: '1965-07-08'
      thread: vietnam-congress
      c: 'Mansfield in the Senate, against Ford and Laird: more bombing would raise "the level of the conflict another notch"; Dirksen excepted, he hopes they "will not seek to divide this Nation at this critical time."'
      n: '[111 Cong. Rec. 15,855–56](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt12/pdf/GPO-CRECB-1965-pt12-2-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 306–07. Names: Mansfield, Ford, Laird, Dirksen.'
