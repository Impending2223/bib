        - 'via w.gibbons-u-s-government-and III, 286 n.24: all'
- add:
    entry:
      id: cal.1965-06-11.vietnam-congress
      when: June 11
      date: '1965-06-11'
      thread: vietnam-congress
      c: 'Taylor before Foreign Relations and Armed Services jointly: 18,000 more men, to about 70,000. Symington: "move in and win this war or get out of it"; Stennis: the United States must "take over"; Hickenlooper muses of plastering the North "from the 17th parallel to the Chinese border." Fulbright: "somewhere in between getting out and destroying it."'
      n: '[[w.gibbons-u-s-government-and]], III, 301–02. To check: the joint executive session transcript, June 11, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 301 n.69). Names: Taylor, Symington, Stennis, Hickenlooper, Fulbright.'
      tags:
      - name:taylor-maxwell
      - name:symington-william-s
      - name:stennis-john-c
      - name:hickenlooper-bourke-b
      - name:fulbright-j-william
      src:
