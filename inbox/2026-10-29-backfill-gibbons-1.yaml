      id: cal.1965-04-17.vietnam
      when: Apr. 17
      date: '1965-04-17'
      thread: vietnam
      c: 'Johnson''s statement on Vietnam, the day of SDS''s march: "The outrage of this country and the world must be visited on those who explode their bombs in cities and villages"; the United States to stay "as long as is necessary, with the might that is required, whatever the risk and whatever the cost"; "no human power capable of forcing us from Viet-Nam."'
      n: 'Statement by the President: "Tragedy, Disappointment, and Progress" in Viet-Nam, [1965 Pub. Papers 428](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=504) (Apr. 17, 1965). [[w.gibbons-u-s-government-and]], III, 221–22 (McGeorge Bundy''s advice of Apr. 14 to cool the rally). See [[cal.1965-04-17.students]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 365ca000
        rows:
