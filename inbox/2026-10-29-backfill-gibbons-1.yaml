      when: July 22
      date: '1965-07-22'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Javits in the Senate, his letters with Fulbright in the Record: "a great mistake for the President not to come back to Congress for a new mandate"; "The door is closed."'
      n: '[111 Cong. Rec. 17,842–43](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt13/pdf/GPO-CRECB-1965-pt13-4-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 390–91. See [[cal.1965-07-12.vietnam-congress]]. Names: Javits, Fulbright.'
