      when: May 25
      date: '1961-05-25'
      thread: vietnam-johnson-asia
      also:
      - vietnam-congress
      c: 'Johnson reports on his trip to 57 Senators, Foreign Relations the host: a "major effort" in Southeast Asia, knowing it may later mean withdrawing or committing major forces. "If a bully can come in and run you out of the yard today, tomorrow he will come back and run you off the porch." Laos: "I don''t think anything is going to come out of the conference."'
      n: '[[w.gibbons-u-s-government-and]], II, 46. To check: *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XIII, pt. 1, 629–51 (cited by [[w.gibbons-u-s-government-and]], II, 46 n.118). See [[cal.1961-05-23.vietnam-johnson-asia]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      src:
