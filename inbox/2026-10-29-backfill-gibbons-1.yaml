      c: 'Alger, in the Record, "Who Authorized the War in Vietnam?": Americans dying in a war to which the President committed them "without congressional approval"; let him ask for a declaration of war; until then "no right to ask for money."'
      n: '[110 Cong. Rec. 11,451](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt9/pdf/GPO-CRECB-1964-pt9-2-1.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 264. See [[cal.1964-05-18.vietnam-congress]]. Names: Alger.'
