      c: 'Ford, after the joint Republican leadership meeting: no settlement "which involves a coalition government with Communists"; "We question the logic of committing U.S. ground forces on a large scale"; air and sea power against the North instead.'
      n: '[111 Cong. Rec. 15,517](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-8-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 306. Names: Ford.'
