      date: '1965-04-30'
      thread: vietnam-congress
      c: 'Morse in the Senate: the Tonkin resolution gave "broad, sweeping power"; the committee should bring it up again, for the Senate to reaffirm it, declare war, or end the power.'
      n: '[111 Cong. Rec. 9111](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt7/pdf/GPO-CRECB-1965-pt7-3-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 241–42. Names: Morse.'
