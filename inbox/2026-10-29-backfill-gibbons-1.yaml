      n: '[[w.gibbons-u-s-government-and]], III, 211–12 (from Johnson and Gwertzman, *Fulbright: The Dissenter*, 205–06). Check: Austin, *The President''s War*, 120, has it handed to Johnson at a dinner of Apr. 5, which the Daily Diary does not show (Gibbons, III, 212 n.188). Names: Fulbright, McNamara, Johnson.'
