      c: 'The House''s forty minutes on the resolution, under suspension. Albert, Halleck, Morgan for it ("definitely not an advance declaration of war," Morgan). Laird: "the land war remains"; Ford: such action earlier "might have turned the tide." Alger''s doubts; Powell votes "present"; Siler, paired against: such resolutions "seal the lips of Congress."'
      n: '[110 Cong. Rec. 18,539–55](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-2.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 308–10. See [[cal.1964-08-07.vietnam]]. Names: Albert, Halleck, Morgan, Laird, Ford, Alger, Powell, Siler.'
