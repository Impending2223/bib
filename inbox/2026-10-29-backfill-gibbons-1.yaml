      n: '[[w.gibbons-u-s-government-and]], III, 242. To check: *Washington Post*, May 3, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 242 n.75). See [[cal.1965-05-04.vietnam]]. Names: Johnson, Fulbright.'
