      id: cal.1965-04-30.vietnam-congress
      when: Apr. 30
      date: '1965-04-30'
      thread: vietnam-congress
      c: 'Rusk before Foreign Relations in executive session on the Dominican Republic and Vietnam: "about 34,000 troops," more under contemplation; no plan for another resolution "unless the situation takes quite a different turn." Fulbright: "for practical purposes we are waging war on North Vietnam"; Congress might have a say over 50,000 or 100,000 men. Clark with him; Hickenlooper, Williams, Case against a new resolution; McCarthy and Mundt doubt the Tonkin resolution''s reach.'
      n: '[[w.gibbons-u-s-government-and]], III, 239–41. To check: the executive session transcript, Apr. 30, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 239 n.65). Names: Rusk, Fulbright, Clark, Hickenlooper, John J. Williams, Case, McCarthy, Mundt.'
