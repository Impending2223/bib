      when: Apr. 29
      date: '1965-04-29'
      thread: vietnam-congress
      c: 'Rusk with Mansfield, Fulbright and Hickenlooper on the plans for more troops, 8,000 to 10,000 in two places; McNamara and William Bundy with other members. William Bundy''s advice to Rusk: say nothing of the Marines'' offensive role from June 1, up to 50 miles from their bases.'
      n: '[[w.gibbons-u-s-government-and]], III, 239. To check: Read to McGeorge Bundy, Apr. 29, 1965, "President''s Evening Reading Items, 1965," State, Lot File 74 D 164; William Bundy to Rusk, "Briefing Notes," Apr. 29, 1965, State, Central File, Pol 27 Viet S (cited by [[w.gibbons-u-s-government-and]], III, 239 nn.66, 68). Names: Rusk, Mansfield, Fulbright, Hickenlooper, McNamara, William Bundy.'
