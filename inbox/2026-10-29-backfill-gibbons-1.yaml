      c: 'Foreign Relations, in executive session on Lodge''s nomination. Lodge: victory "a condition in which the young Viet Cong fighter wakes up one morning and says, ''I am not going back today.''" No new resolution needed; Fulbright asks whether things have taken "quite a different turn."'
