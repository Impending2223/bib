      thread: vietnam-congress
      c: 'William Bundy before the Far East Subcommittee of Foreign Relations (Lausche) in executive session, on the reprisal: more if infiltration goes on; no further plans, "but I don''t want to imply that the book is closed; only that this page is turned." Carlson asks of a "policy decision" to widen the war: "The book is still open."'
      n: '[[w.gibbons-u-s-government-and]], III, 70. To check: the executive session transcript, Feb. 9, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 70 n.73). See [[cal.1965-02-07.vietnam]]. Names: William Bundy, Lausche, Carlson.'
