      when: Feb. 8
      date: '1965-02-08'
      thread: vietnam-congress
      also:
      - republican-party-congress
      c: 'Saltonstall and Clark in the Senate, after Pleiku. Saltonstall: he will support the President and McNamara "in any responsible decisions" to retaliate; "We cannot take an attack lying down." Clark, the acting majority leader: "no time to attack the present administration on the floor of the Senate"; the benefit of the doubt.'
      n: '[111 Cong. Rec. 2261](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt2/pdf/GPO-CRECB-1965-pt2-7-2.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 70 (the exchange). See [[cal.1965-02-07.vietnam]]. Names: Saltonstall, Clark, McNamara.'
