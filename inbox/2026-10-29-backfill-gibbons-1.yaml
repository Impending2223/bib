- add:
    entry:
      id: cal.1964-06-02.vietnam-congress-3
      when: June 2
      date: '1964-06-02'
      thread: vietnam-congress
      c: 'Aiken in the Senate, of the meeting at Honolulu: "An expansion of military operations leading to a general war in southeast Asia will not have my support"; detachments in Thailand only for its defense and at its request; no precipitate withdrawal, "a stalemate with the rebels for the time being if that is the best we can do."'
      n: '[110 Cong. Rec. 12,373](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt9/pdf/GPO-CRECB-1964-pt9-10-1.pdf) (1964). [[w.gibbons-u-s-government-and]], II, 265. Names: Aiken.'
