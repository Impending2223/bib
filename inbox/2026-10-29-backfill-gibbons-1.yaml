      date: '1965-04-07'
      thread: vietnam-congress
      c: 'Before Johns Hopkins, Fulbright and Mansfield, then Church, McGovern and McGee, read the speech at the White House, and approve. Johnson to Church: "Frank, how''s the dam building business going on in Idaho?" Church: the next one "the Walter Lippmann dam." The President laughs.'
      n: '[[w.gibbons-u-s-government-and]], III, 216, 218–19 (Church''s account). To check: the White House Daily Diary, Apr. 7, 1965; Church oral history, May 1, 1969, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 218 n.5, 219 n.9). See [[cal.1965-04-07.vietnam]]. Names: Fulbright, Mansfield, Church, McGovern, McGee, Johnson.'
