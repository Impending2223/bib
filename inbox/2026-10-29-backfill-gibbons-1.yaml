      when: Apr. 12–14
      date: '1965-04-12'
      thread: vietnam-congress
      c: 'Three evenings, 72 Senators in three groups, chiefly of Armed Services, Appropriations and Foreign Relations, two hours each, off the record: Rusk and McNamara brief; Johnson''s message, by one present, that the South Vietnamese army "could not pacify South Vietnam without U.S. Army help."'
      n: '[[w.gibbons-u-s-government-and]], III, 221. To check: Transcripts of Vietnam Briefings, LBJ Library; the White House Daily Diary, Apr. 12–14, 1965; Evans and Novak, *Washington Post*, Apr. 23, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 221 n.13). Names: Rusk, McNamara, Johnson.'
