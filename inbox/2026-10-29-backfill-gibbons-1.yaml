      when: Apr. 7
      date: '1965-04-07'
      thread: vietnam-congress
      c: 'McNamara and Ball before Foreign Relations on foreign aid, then in executive session on Vietnam. Fulbright: the administration assumes no further approval by Congress is needed. McNamara: the President will consult the leaders and the committee "before undertaking any combat moves" that might enlarge the war; Ball, the same of "a land war in Asia."'
      n: '[[w.gibbons-u-s-government-and]], III, 214–15. To check: the executive session transcript, Apr. 7, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 215 n.194). Names: McNamara, Ball, Fulbright.'
