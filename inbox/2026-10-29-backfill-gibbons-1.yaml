      when: June 21
      date: '1965-06-21'
      thread: vietnam-congress
      c: 'Foreign Relations, in executive session, on Dodd''s proposal of a bipartisan mission to Vietnam. Mansfield: "Taylor and Westmoreland are doing the best they can"; Fulbright: a day or two, "a drink at the bar," a briefing, home. Deferred.'
      n: '[[w.gibbons-u-s-government-and]], III, 303. To check: Dodd to Fulbright, National Archives, RG 46, Marcy Chron File; the executive session transcript, June 21, 1965 (cited by [[w.gibbons-u-s-government-and]], III, 303 nn.71–72). Names: Dodd, Mansfield, Taylor, Westmoreland, Fulbright.'
