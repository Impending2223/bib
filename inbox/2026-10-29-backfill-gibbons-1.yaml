      when: July 27
      date: '1965-07-27'
      thread: vietnam-congress
      c: 'At Fulbright''s call, Mansfield, Russell, Fulbright, Sparkman, Aiken and Cooper meet, 3:30 p.m. Mansfield''s report to Johnson, nineteen points: 150,000 men by the end of the year more likely than 100,000; the country behind him "primarily because he is President"; the bombing ill-advised; McNamara "a disappointment"; "we are deeply enmeshed in a place where we ought not to be."'
      n: '[FRUS 1964–68, III, doc. 96](https://history.state.gov/historicaldocuments/frus1964-68v03/d96). [[w.gibbons-u-s-government-and]], III, 432–35. To check: Marcy to Fulbright, July 22, 1965, National Archives, RG 46, Marcy Chron File (cited by [[w.gibbons-u-s-government-and]], III, 432 n.133). See [[cal.1965-07-27.vietnam]]. Names: Fulbright, Mansfield, Russell, Sparkman, Aiken, Cooper, Johnson, McNamara.'
