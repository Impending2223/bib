      when: July 1
      date: '1965-07-01'
      thread: vietnam-congress
      c: 'Morse in the Senate: the President at the UN "honored the charter ... more in the breach than in observance"; the allies to make the war the UN''s business; "The United States must be brought to the bar of international justice, along with the Communists."'
      n: '[111 Cong. Rec. 15,467](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt11/pdf/GPO-CRECB-1965-pt11-8-1.pdf) (1965). [[w.gibbons-u-s-government-and]], III, 314. Names: Morse.'
