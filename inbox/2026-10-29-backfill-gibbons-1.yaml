      when: June 25
      date: '1965-06-25'
      thread: vietnam-congress
      c: 'Church and Carlson with Johnson on Air Force One to San Francisco. By Church''s account, Johnson, reading of a bomb in Saigon: "I suppose you''d turn the other cheek"; next day, to the photographer, "some pictures of me with a peacemaker." Reedy reports both Senators pleased with the speech.'
      n: '[[w.gibbons-u-s-government-and]], III, 310–11 (Church''s account; Reedy''s memorandum). To check: CRS interview with Church, July 5, 1983; Reedy to Johnson, NSF, NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 310 n.99, 311 n.100). Check: the days of the flights. See [[cal.1965-06-25.vietnam]]. Names: Church, Carlson, Johnson, Reedy.'
