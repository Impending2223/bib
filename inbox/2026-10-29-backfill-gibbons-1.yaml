      - republican-party-congress
      c: 'Laird in the House, on the news conference: the President "misled the American people"; the plans exist, and the enemy should not be told otherwise. Sikes (D-Fla.), of the Defense Appropriations Subcommittee: the charge that the President "deliberately misled the American people" "inexcusable and improper"; Laird answers, Mahon joining.'
