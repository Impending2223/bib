      id: cal.1965-06-17.vietnam-congress-2
      when: June 17
      date: '1965-06-17'
      thread: vietnam-congress
      c: 'At a bill signing, Johnson draws Morse aside: his ideas for bringing in the UN, "on blank sheets of paper," by the next day. Marcy drafts; Morse''s memorandum: ask the Security Council, then the General Assembly, to end the war, abide by their decision, and halt the air and naval attacks for a month.'
      n: '[[w.gibbons-u-s-government-and]], III, 311–12. To check: Morse''s memorandum of the conversation, and Marcy''s draft, June 17, National Archives, RG 46, Marcy Chron File; Morse''s memorandum, NSF, NSC History, Deployment of Forces, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 311 nn.101–02). Names: Johnson, Morse, Marcy.'
