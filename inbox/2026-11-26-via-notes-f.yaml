ops:
  - cite:
      id: cal.1966-02-24.vietnam-support
      item: '[[w.gibbons-u-s-government-and]], IV, 228 n.45 (the note''s own sentence: Hoover''s memorandum of Feb. 24, 1966, found no indication that the Communist Party had provided materials to members of the Foreign Relations Committee)'
      'on': Nothing showed the party had given the committee material.
  - cite:
      id: cal.1966-08-11.vietnam
      item: '[[w.gibbons-u-s-government-and]], IV, 387 n.2 (the note''s own text: the paper drafted in the Far East Bureau on Aug. 10, discussed in the Negotiations Committee on Aug. 11)'
      'on': The Negotiations Committee on the Far East Bureau's paper;
  - cite:
      id: cal.1966-10-31.vietnam-air-war
      item: '[[w.gibbons-u-s-government-and]], IV, 466 n.87b (the note''s own text, quoting the summary of the Joint Staff evaluation)'
      'on': 'constraints on mining, airfields, industry and the Hanoi–Haiphong sanctuaries have denied "a clear cut in the throughput of supplies."'
  - primary:
      id: cal.1967-04-25.vietnam
      text: '[President''s Daily Diary, Apr. 25, 1967](https://catalog.archives.gov/id/192467), images 2, 3 (LBJ Library; National Archives Catalog; the luncheon at the Villa Hammerschmidt, Rostow''s note on the Swedish Prime Minister).'
      'on': 'Bonn, at the luncheon after Adenauer''s funeral, by Rostow''s note: Erlander "desperately anxious" to explain to Johnson why Sweden''s laws let the Russell Tribunal meet there.'
  - primary:
      id: cal.1967-04-25.vietnam
      text: '[President''s Daily Diary, Apr. 25, 1967](https://catalog.archives.gov/id/192467), image 2 (LBJ Library; National Archives Catalog).'
      'on': Johnson sends Rostow in the night to find him and hear him out.
  - check:
      id: cal.1967-04-25.vietnam
      text: 'Check: the Diary (image 2) puts the luncheon after the memorial service at the Bundestag and before the Mass at Cologne.'
  - primary:
      id: cal.1968-04-05.king
      text: '[President''s Daily Diary, Apr. 5, 1968](https://catalog.archives.gov/id/192477), images 3, 4, 6 (LBJ Library; National Archives Catalog; the meeting in the Cabinet Room from 11:10 a.m. with the civil-rights leaders, members of Congress and others, and the televised statement in the Fish Room; the words quoted are not in the Diary).'
      'on': 'Johnson meets Negro leaders, members of Congress and others at the White House, then speaks to the nation: "America shall not be ruled by the bullet, but only by the ballot of free and of just men."'
