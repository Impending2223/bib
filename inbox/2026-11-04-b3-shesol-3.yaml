        Tape WH6612.12 (Miller Center). [[w.shesol-mutual-contempt]], 359, 361. Check: Shesol''s note puts "11:46 A.M. [?]";
        the statement''s day; not listened to. See [[cal.1966-12-05.assassination]]. Names: Johnson, Moyers, Manchester, McHugh,
        Jacqueline Kennedy.'
