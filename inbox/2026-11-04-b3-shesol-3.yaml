        war ... all the great opportunities that are going down the drain. ... I don''t like Johnson, but he was doing some
        good things. Now there''s no direction." Asked his plan: "Why, I''m going to make speeches."'
      n: '[[w.shesol-mutual-contempt]], 302–3. Check: the day. To check: [[w.goodwin-remembering-america]], 463–64 (cited
        by [[w.shesol-mutual-contempt]], 302). Names: Robert Kennedy, Goodwin.'
