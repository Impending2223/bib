      when: Feb. 27
      date: '1967-02-27'
      thread: robert-kennedy
      also:
      - vietnam
      c: 'Mankiewicz to Robert Kennedy, "Comments on Viet Nam Draft": only he can make a difference: "Not Morse, who is querulous
        and a bore ... not Fulbright who lacks the follow-through ... not the Hartkes and the McCarthys who have other fish
        to fry. If not today, you know the White House will turn the screws tighter until the day you must." Of Johnson''s
        new tactics, announced four days before the speech: "Horrible though the thought might be, this was done at least
        in part to head you off"; "you will be listed by the press (and the White House) as Number One Dove ... you might
