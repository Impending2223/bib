      c: 'Newfield of the *Village Voice* to Robert Kennedy: "You haven''t said anything for a year. When will you talk again?"
        Kennedy, by Newfield''s account: "the last time I spoke I didn''t have any influence on policy, and I was hurt politically.
        I''m afraid that by speaking out I make Lyndon do the opposite, out of spite."'
      n: '[[w.shesol-mutual-contempt]], 303. Check: the month; Shesol gives "that fall". To check: [[w.newfield-robert-kennedy]],
        128 (cited by [[w.shesol-mutual-contempt]], 303). Names: Robert Kennedy.'
