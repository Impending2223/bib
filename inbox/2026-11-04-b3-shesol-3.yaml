      c: 'Johnson to Moyers by telephone, 11:46 a.m., on Manchester: "I [never said] a son-of-a-bitchin'' word to McHugh!"
        Not "honey" to Mrs. Kennedy "because that was the Texas way." His statement, at Moyers''s urging: "I will not discuss
        the various attributions credited to so-called friends and alleged intimates, except to say that I believe them to
        be inaccurate and untrue."'
