      id: cal.1966-05-14.economy
      when: May 14
      date: '1966-05-14'
      thread: economy
      c: 'Johnson to Donald Cook by telephone, 7:48 a.m., on a tax increase: the members answer "No and hell no"; each "feels
        his whole future is in danger if he votes for [a] tax increase"; "Republicans and Democrats, liberals and conservatives,
        reactionaries, and ADA''ers are generally speaking scared to vote for a tax increase four months before an election."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 253. To check: [Johnson and Cook, 7:48 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-don-cook-may-14-1966),
        Conversations WH6605-03-10122 to 10125 (Miller Center), not heard (cited by [[w.zelizer-fierce-urgency-of-now]], 253
        n.75). Names: Johnson, Cook.'
      src:
        c: 4b5f8242
        rows:
        - 'w.zelizer-fierce-urgency-of-now 253: all'
        - 'via w.zelizer-fierce-urgency-of-now 253 n.75: all'
      tags:
