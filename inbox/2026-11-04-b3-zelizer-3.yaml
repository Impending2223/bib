- add:
    entry:
      id: cal.1966-06-29.open-housing
      when: June 29
      date: '1966-06-29'
      thread: open-housing
      c: 'House Judiciary adopts Mathias''s revised amendment, 21 to 13: land sold for housing development exempted, certain
        sales by religious and educational institutions excluded, the exemption widened from one- to four-family homes. Four
        Republicans for the bill; six Democrats against, Conyers among them. Celler to reporters: "sometimes you''ve got
        to stretch your feet according to the blanket."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 239–40. To check: [[w.graham-civil-rights-era]], 261 (cited by [[w.zelizer-fierce-urgency-of-now]],
        239 n.31); Bruce Winters, "House Unit Approves Rights Bills," *Baltimore Sun*, June 30, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]],
        240 n.32). Check: Zelizer''s "Four Republicans voted in favor of the final bill" against the committee''s count;
        the committee''s report. See [[cal.1966-06-24.open-housing]]. Names: Mathias, Conyers, Celler.'
      src:
        c: 6489bd3f
        rows:
        - 'w.zelizer-fierce-urgency-of-now 239–40: all'
        - 'via w.zelizer-fierce-urgency-of-now 240 n.32: D'
      tags:
      - name:mathias-charles-mcc-jr
      - name:conyers-john-jr
      - name:celler-emanuel
      - ok:result-form
