      c: 'Nixon on the "tax of inflation": "In the last two years the average American worker has been on a Government-operated
        treadmill. New taxes and rising prices have more than wiped out all the pay raises he has won since 1965." The new
        taxes and "the hidden tax of inflation" have left his purchasing power below December 1965''s.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 310. To check: "Nixon Scores ''Tax of Inflation''; Says Worker Is on Treadmill,"
        *New York Times*, Sept. 2, 1968 (cited by [[w.zelizer-fierce-urgency-of-now]], 310 n.10). Check: the day and the
        place. Names: Nixon.'
      src:
        c: c34ab24a
        rows:
