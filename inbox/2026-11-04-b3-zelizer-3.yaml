      c: 'Califano: "Dick Nixon is going to be taking over a government one hell of a lot different than the one he left
        in January, 1961. There were about 45 domestic social programs when the Eisenhower administration ended. Now there
        are no less than 435."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 314. To check: Clayton Knowles, "Great Society: What It Was, Where It Is,"
        *New York Times*, Dec. 9, 1968 (cited by [[w.zelizer-fierce-urgency-of-now]], 314 n.17). Check: the day of the remark.
        Names: Califano, Nixon.'
