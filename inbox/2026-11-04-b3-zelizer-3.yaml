    base: 737ffc35
    set:
      also:
      - elections-1966
      c: 'News conference at Fredericksburg, Tex. Boyd, Under Secretary of Commerce for Transportation, to be the first Secretary
        of Transportation, his nomination to go to the Senate in January. The department: 31 agencies and bureaus, nearly
        100,000 employees, almost $6 billion. At its end, a statement: "I can think of nothing more dangerous, more divisive,
        or more self-destructive than the effort to prey on what is called ''white backlash.''" The voters to ask themselves:
        "Do I want to cast my vote on the basis of fear? Do I want to follow the merchants of bigotry?"'
      n: '[The President''s News Conference](https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1183)
        (Nov. 6, 1966); [The President''s News Conference of November 6, 1966, 1966 Pub. Papers 1332](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=706)
        (the statement on the "white backlash"). [[w.zelizer-fierce-urgency-of-now]], 256 (the statement, "two nights before
        the election"). See [[cal.1966-03-02.transportation]]. Names: Boyd, Johnson.'
      src:
        c: 1a5e8639
        rows:
        - 'https://www.presidency.ucsb.edu/documents/the-presidents-news-conference-1183: A-C'
        - 'https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=706: D'
