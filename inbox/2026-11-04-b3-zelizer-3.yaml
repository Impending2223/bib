      when: Oct. 7
      date: '1966-10-07'
      thread: elections-1966
      c: 'Newark, N.J., a Democratic rally. Johnson: "The Republican symbol is the elephant. Do you know why he is their symbol?
        Because he never forgets. The Republicans remember that they have always been elected by trying to scare the people.
        Their platform this year is made up of one word—fear."'
      n: '[Remarks at a Democratic Party Rally in Newark, 1966 Pub. Papers 1130](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=504)
        (Oct. 7, 1966). [[w.zelizer-fierce-urgency-of-now]], 255 (the theme; its words from the *Chicago Tribune*). To check:
        "Lyndon Says G.O.P. Tries to Scare Voter," *Chicago Tribune*, Oct. 8, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]],
        255 n.82). Check: Zelizer''s wording, from the *Tribune*, differs from the Papers''. Names: Johnson.'
      src:
        c: 8dff57fd
        rows:
