      when: July 28
      date: '1966-07-28'
      thread: open-housing
      c: 'The National Association of Real Estate Boards, a secret bulletin to its members: tell the representatives to reject
        the compromise; every local branch to "telephone, wire or write [its] Representative in the House to vote to strike
        Title IV from the bill."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 240. To check: Ben A. Franklin, "Realtors'' Lobby Calls for Fight on Open Housing,"
        *New York Times*, July 29, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]], 240 n.34). Check: the day; Zelizer
        writes the National Association of Real Estate Brokers, the realtors'' Washington office its source. See [[cal.1966-05-24.open-housing]].'
      src:
        c: 0dcfe29c
        rows:
        - 'w.zelizer-fierce-urgency-of-now 240: all'
        - 'via w.zelizer-fierce-urgency-of-now 240 n.34: all'
