      c: 'Waukegan, Ill. Three nights of rioting in a two-square-mile area; eighty arrested, many hurt; six returning from
        church burned by a gasoline bomb thrown into their car. Luci Johnson Nugent visiting five blocks away. Mayor Robert
        Sabonjian blames "scums, animals, winos, and junkies" and outside agitators; an emergency curfew.'
      n: '[[w.zelizer-fierce-urgency-of-now]], 241. To check: "Seize 64 in Waukegan Riot," *Chicago Tribune*, Aug. 29, 1966;
        "Waukegan Invokes Emergency Curfew," *Washington Post*, Aug. 30, 1966; *Jet*, Sept. 15 and 29, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]],
        241 n.37). Check: the days (the press of Aug. 29–30). Names: Nugent.'
      src:
        c: 7b7bd8f5
        rows:
