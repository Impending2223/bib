      c: 'Johnson to Fowler by telephone, 4:24 p.m.: "I''m not master of a damn thing ... We cannot make this Congress do
        one damn thing that I know of." Of Mills: "I don''t believe that I''ve got a bit of influence with him"; the conference
        Mills''s to chair; "Wilbur Mills cuts your peter off."'
      n: '[[w.zelizer-fierce-urgency-of-now]], 290. To check: [Johnson and Fowler, 4:24 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-henry-fowler-march-24-1968),
        Conversations WH6803-05-12844 to 12847 (Miller Center), not heard (cited by [[w.zelizer-fierce-urgency-of-now]],
        290 nn.58–59). See [[cal.1968-03-24.economy-surcharge]]. Names: Johnson, Fowler, Mills.'
      src:
