      id: cal.1966-05-24.open-housing
      when: May 24
      date: '1966-05-24'
      thread: open-housing
      c: 'Before House Judiciary''s Subcommittee No. 5 on the civil rights bill, Alan Emlen of the National Association of Real
        Estate Boards: "We suggest that this is not cause for rejoicing on the part of more than 30 million home owners, each
        of whom must have assumed that their right to own property carries with it the right to dispose of it to the persons
        of their choice."'
      n: '[Daily Digest, D252](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=250)
        (May 24: Selden and public witnesses; the hearings concluded May 25, D257). [[w.zelizer-fierce-urgency-of-now]], 237
        (the testimony, its words). To check: Joseph Hearst, "Open Housing Called Bar to Race Harmony," *Chicago Tribune*,
        May 25, 1966 (cited by [[w.zelizer-fierce-urgency-of-now]], 237 n.27). Check: the day; the Digest names no public
        witness. See [[cal.1966-04-28.open-housing]].'
      src:
        c: 881f678c
        rows:
        - 'w.zelizer-fierce-urgency-of-now 237: all'
        - 'via w.zelizer-fierce-urgency-of-now 237 n.27: all'
