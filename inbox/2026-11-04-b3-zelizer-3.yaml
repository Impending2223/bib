        Not an Easy Row to Hoe," 4 *Cityscape* 21–24 (1999); Watson, *Lion in the Lobby*, 673–77 (cited by [[w.zelizer-fierce-urgency-of-now]],
        238 n.30). See [[cal.1966-04-28.open-housing]]. Names: Mathias, McCulloch, Celler, Katzenbach.'
      src:
        c: 47b2c148
        rows:
        - 'w.zelizer-fierce-urgency-of-now 238: all'
        - 'via w.zelizer-fierce-urgency-of-now 238 n.30a: all'
      tags:
