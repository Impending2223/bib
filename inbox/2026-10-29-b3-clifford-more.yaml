      date: '1968-07-14'
      thread: vietnam
      also:
      - defense-clifford
      c: Sunday. Clifford in Saigon, ringed by allied troops against the offensive expected; B-52s against the strongholds
        north and west; the 9th Division in a firefight in Phú Vinh, by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 550. See [[cal.1968-06.vietnam]]. Names: Clifford.'
