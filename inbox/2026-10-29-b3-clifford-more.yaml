      - name:clifford-clark
      src:
        c: 4f3a0f67
        rows:
        - 'w.clifford-counsel-to-the-president-2 569: all'
- add:
    entry:
      id: cal.1968-08.vietnam-paris-2
      when: Aug.
      date: 1968-08
      thread: vietnam-paris
      also:
      - press-and-broadcasting
      c: 'A few days after Aug. 7, the *Times* on disagreements between Rusk and Clifford. Johnson to Clifford by telephone:
        "Every day I read something in the papers about deep policy differences between you and Dean. I am telling both of
        you that I want it stopped."'
      n: '[[w.clifford-counsel-to-the-president-2]], 569. See [[cal.1968-08-07.vietnam-paris]]. Names: Rusk, Clifford, Johnson.
        Check: the day.'
      tags:
      - name:rusk-dean
      - name:clifford-clark
      - name:johnson-lyndon-b
      src:
        c: 6f4496d3
        rows:
