      id: cal.1960-07.elections-1960-11
      when: July
      date: 1960-07
      thread: elections-1960
      c: 'Kennedy answers Truman: "If fourteen years in major elective office is insufficient experience, that rules out all
        but a handful of American Presidents, including Wilson, Roosevelt, and Truman."'
      n: '[[w.clifford-counsel-to-the-president-2]], 321. See [[cal.1960-07-02.elections-1960]]. Names: Kennedy, Truman. Check:
        the day, after July 2.'
      tags:
      - name:kennedy-john-f
      - name:truman-harry-s
      src:
        c: 92e00343
        rows:
        - 'w.clifford-counsel-to-the-president-2 321: all'
- add:
    entry:
      id: cal.1964-10.elections-1964-3
      when: Oct.
      date: 1964-10
      thread: elections-1964
      c: 'Lady Bird Johnson, a statement on Jenkins: "My heart is aching today for someone who had reached the end point of
        exhaustion in dedicated service to his country."'
      n: '[[w.clifford-counsel-to-the-president-2]], 402. See [[cal.1964-10-14.elections-1964]]. Names: Lady Bird Johnson,
        Jenkins. Check: the day, after Oct. 14.'
      tags:
