    entry:
      id: cal.1968-12.soviet-union
      when: Dec.
      date: 1968-12
      thread: soviet-union
      also:
      - transition-and-staff
      c: Late December. Johnson learns that Nixon had told the Soviets he was against a Johnson–Kosygin summit, by Clifford's
        account.
      n: '[[w.clifford-counsel-to-the-president-2]], 599. Names: Johnson, Nixon, Kosygin. Check: the day and the channel.'
      tags:
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      - name:kosygin-aleksei
      src:
        c: 170babfc
        rows:
        - 'w.clifford-counsel-to-the-president-2 599: all'
- add:
    entry:
      id: cal.1968-12-24.vietnam-paris
      when: Dec. 24
      date: '1968-12-24'
      thread: vietnam-paris
      c: 'Johnson to Clifford, a letter, the day before his birthday: "your full and fruitful lifetime would be spent in selfless
        pursuit of peace and goodwill among all men."'
      n: '[[w.clifford-counsel-to-the-president-2]], 604. Names: Johnson, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: a2455b28
        rows:
        - 'w.clifford-counsel-to-the-president-2 604: all'
