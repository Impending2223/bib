      when: July
      date: 1968-07
      thread: vietnam
      also:
      - defense-clifford
      c: 'Saigon: Clifford with Bunker, Berger and William Bundy, by Clifford''s account: the six months left to be used for
        an honorable end; Bunker and Berger against bending Saigon to start negotiations.'
      n: '[[w.clifford-counsel-to-the-president-2]], 551. See [[cal.1968-07-14.vietnam]]. Names: Clifford, Bunker, Berger,
        William Bundy. Check: the day, between July 14 and 17.'
