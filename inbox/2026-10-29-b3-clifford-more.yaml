      when: Nov. 1
      date: '1968-11-01'
      thread: vietnam-paris
      c: Thiệu announces a major speech to the Assembly and refuses to see Bunker before it, by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 594. See [[cal.1968-10-31.vietnam]]. Names: Nguyễn Văn Thiệu, Bunker.'
