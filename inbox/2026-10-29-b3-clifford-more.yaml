      when: Nov. 6
      date: '1968-11-06'
      thread: vietnam-paris
      c: 'Kỳ to Bunker, the day after the election: it might take two months to settle his government''s problems with the
        format, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 599. See [[cal.1968-11-02.vietnam]]. Names: Nguyễn Cao Kỳ, Bunker. Check:
        Bunker''s telegram of Nov. 6 on Thiệu''s decision (FRUS VII, doc. 200) does not have it.'
