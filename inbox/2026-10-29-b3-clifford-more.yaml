      id: cal.1968-10-24.vietnam-paris
      when: Oct. 24
      date: '1968-10-24'
      thread: vietnam-paris
      c: 'Bunker from Saigon: "making good progress getting rid of the underbrush."'
      n: '[[w.clifford-counsel-to-the-president-2]], 579. See [[cal.1968-10-14.vietnam]]. Names: Bunker. Check: the cable.'
      tags:
      - name:bunker-ellsworth
      src:
