      when: Aug. 1
      date: '1968-08-01'
      thread: vietnam-paris
      c: 'Clifford to the 8:30 Group: "We are in danger of losing all that we have gained since March." Lady Bird Johnson
        asks the Cliffords to the Ranch for the weekend.'
      n: '[[w.clifford-counsel-to-the-president-2]], 568. See [[cal.1968-07-30.vietnam-paris]]. Names: Clifford, Lady Bird
        Johnson.'
      tags:
      - name:clifford-clark
      - name:johnson-lady-bird
