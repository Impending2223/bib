      when: July
      date: 1968-07
      thread: vietnam
      also:
      - defense-clifford
      c: 'Đà Nẵng, a press conference: attacks expected in the next months "to make an impression on the conference in Paris";
        no date for American withdrawals.'
      n: '[[w.clifford-counsel-to-the-president-2]], 550. See [[cal.1968-07-14.vietnam]]. Names: Clifford. Check: the day,
        between July 14 and 17.'
