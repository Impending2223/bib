      date: '1968-11-01'
      thread: testing-missile-talks
      also:
      - soviet-union
      c: Johnson, by telephone through the 8:30 Group's meeting, reads Clifford the reaction to his address; a summit with
        Kosygin again. At his request Clifford asks Warnke for a memorandum on starting arms talks before he leaves office,
        by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 594. See [[cal.1968-10-31.vietnam]]. Names: Johnson, Clifford, Kosygin,
