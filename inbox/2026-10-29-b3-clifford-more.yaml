      when: July
      date: 1968-07
      thread: vietnam
      also:
      - defense-clifford
      c: 'Saigon, the Presidential Palace: Clifford, with Bunker, Wheeler, Abrams, William Bundy and Pursley, to Thiệu and
        Kỳ, by Clifford''s account: without visible progress the American public will not support the war much longer; failing
        a settlement, the South to take over the war.'
      n: '[[w.clifford-counsel-to-the-president-2]], 550–51. See [[cal.1968-07-14.vietnam]]. Names: Clifford, Bunker, Wheeler,
        Abrams, William Bundy, Pursley, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ. Check: the day, between July 14 and 17.'
      tags:
      - name:clifford-clark
      - name:bunker-ellsworth
      - name:wheeler-earle
