- add:
    entry:
      id: cal.1968-09.elections-1968-16
      when: Sept.
      date: 1968-09
      thread: elections-1968
      c: 'Early September, 2:30 a.m., Humphrey to Clifford by telephone, reprimanded by Presidential aides for saying American
        troops would start home in 1969, by Clifford''s account. Clifford: safe so long as he rests it on Thiệu''s words.
        Clifford reports the call to Johnson.'
      n: '[[w.clifford-counsel-to-the-president-2]], 569. See [[cal.1968-09-12.elections-1968]]. Names: Humphrey, Clifford,
        Nguyễn Văn Thiệu, Johnson. Check: the day.'
