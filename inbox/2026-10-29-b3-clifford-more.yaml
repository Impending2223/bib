      when: June 30
      date: '1968-06-30'
      thread: vietnam-paris
      c: Rostow at dinner with Clifford at his home in Bethesda, three hours on their differences over the negotiations, by
        Clifford's account; neither moves the other.
      n: '[[w.clifford-counsel-to-the-president-2]], 549. Names: Rostow, Clifford.'
