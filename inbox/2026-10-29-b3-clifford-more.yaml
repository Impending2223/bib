      when: July 30
      date: '1968-07-30'
      thread: vietnam-paris
      c: After the Tuesday lunch, in the back of Clifford's car, Rusk worried at the President's hard line, by Clifford's
        account.
      n: '[[w.clifford-counsel-to-the-president-2]], 568. See [[cal.1968-07-30.vietnam-paris]]. Names: Rusk, Clifford, Johnson.'
      tags:
      - name:rusk-dean
      - name:clifford-clark
      - name:johnson-lyndon-b
