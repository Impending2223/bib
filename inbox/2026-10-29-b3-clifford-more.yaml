      when: Oct. 17
      date: '1968-10-17'
      thread: vietnam-paris
      c: 'Gorton, the Australian Prime Minister, briefed with the allies, the first source of the rumors of a move in Paris;
        denials hold the story, by Clifford''s account. Thiệu to Bunker: objections to the agreement, the NLF not to be treated
        as a separate government with its own flag.'
      n: '[[w.clifford-counsel-to-the-president-2]], 577–78. See [[cal.1968-10-14.vietnam]]. Names: Gorton, Nguyễn Văn Thiệu,
        Bunker. Check: Bunker''s report of the meeting.'
      tags:
      - name:gorton-john-g
      - name:nguyen-van-thieu
      - name:bunker-ellsworth
      src:
        c: 344dfca0
        rows:
        - 'w.clifford-counsel-to-the-president-2 577–78: all'
