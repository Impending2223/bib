      when: Nov.
      date: 1968-11
      thread: transition-and-staff
      c: Franklin Lincoln, Nixon's transition chief, with Clifford on the changeover; Clifford's transition files of 1960
        handed him. Asked whether he would stay on for a time, Clifford gives his reasons against; he asks only to give the
        President-elect his views on Vietnam, by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 602. Names: Lincoln, Nixon, Clifford. Check: the days.'
      tags:
      - name:lincoln-franklin-b-jr
      - name:nixon-richard-m
      - name:clifford-clark
      src:
        c: c22d1041
        rows:
        - 'w.clifford-counsel-to-the-president-2 602: all'
- add:
    entry:
      id: cal.1968-12-09.transition-and-staff
      when: Dec. 9
      date: '1968-12-09'
      thread: transition-and-staff
      c: 'Nixon, a note dictated for his files on choosing his cabinet: "There was considerable pressure to keep Clark Clifford,
        but RN thought it would be a mistake to go forward with one who helped shape the policies which RN had been criticizing."'
      n: '[[w.clifford-counsel-to-the-president-2]], 603. Made public: [[w.safire-before-the-fall]] (1975). See [[cal.1968-12-02.transition-and-staff-2]].
        Names: Nixon, Clifford.'
