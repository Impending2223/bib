      - name:nguyen-van-thieu
      - name:johnson-lyndon-b
      src:
        c: ba557d9a
        rows:
        - 'w.clifford-counsel-to-the-president-2 569: all'
- add:
    entry:
      id: cal.1968-09.vietnam-paris
      when: Sept.
      date: 1968-09
      thread: vietnam-paris
      c: 'A few days after Sept. 15. Harriman, home for his mother-in-law''s funeral, with Clifford, then Johnson: stop the
        bombing. To Clifford: "I''d quit if I thought I was just being used in Paris to hold the line until Nixon takes over,"
        by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 570. See [[cal.1968-09-15.vietnam-paris]]. Names: Harriman, Clifford,
        Johnson, Nixon. Check: the days.'
      tags:
      - name:harriman-w-averell
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      src:
        c: 8e16017d
        rows:
        - 'w.clifford-counsel-to-the-president-2 570: all'
- add:
    entry:
      id: cal.1968-10.vietnam-paris
      when: Oct.
      date: 1968-10
      thread: vietnam-paris
      also:
      - soviet-union
      c: 'Johnson to Rusk and Clifford: a farewell trip to Southeast Asia and Moscow. Nitze and Warnke against; Clifford for
        anything that ends the bombing and starts talks, by Clifford''s account. The troop-contributing nations cool to another
        summit.'
      n: '[[w.clifford-counsel-to-the-president-2]], 574. Names: Johnson, Rusk, Clifford, Nitze, Warnke. Check: the day.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:clifford-clark
