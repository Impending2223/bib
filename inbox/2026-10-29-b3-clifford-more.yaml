    entry:
      id: cal.1968-12-31.vietnam-paris
      when: Dec. 31
      date: '1968-12-31'
      thread: vietnam-paris
      c: 'McGeorge Bundy to Clifford, a letter: "you more than any other man have been brave and right at the right time and
        in the right place"; "you have got the damned thing turned around." Clifford''s reply: the year "tortuous and painful
        and, at times, unbelievably lonely."'
      n: '[[w.clifford-counsel-to-the-president-2]], 605. Names: McGeorge Bundy, Clifford. Check: the day of the reply.'
      tags:
      - name:bundy-mcgeorge
      - name:clifford-clark
      src:
        c: 1a542cd7
        rows:
        - 'w.clifford-counsel-to-the-president-2 605: all'
