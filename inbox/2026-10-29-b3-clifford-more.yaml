      when: Aug.
      date: 1968-08
      thread: elections-1968
      c: 'Murphy, the White House''s liaison to Humphrey''s campaign, to Elsey: Johnson said in his presence that if Humphrey
        did not stand firm on Vietnam a Nixon victory would be better for the country, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 564. Names: Charles Murphy, Elsey, Johnson, Humphrey, Nixon. Check: the
        day.'
