    entry:
      id: cal.1968-07.testing-missile-talks
      when: July
      date: 1968-07
      thread: testing-missile-talks
      c: 'Summer. McNamara to Clifford, a private message: he would leave the World Bank at once to be chief arms control
        negotiator, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 560. Names: McNamara, Clifford. Check: the month, from "during the summer."'
