      when: Jan. 12
      date: '1969-01-12'
      thread: robert-kennedy
      c: Johnson tells the Budget Bureau to ask $431,000 for Robert Kennedy's grave at Arlington in the 1970 contingency fund,
        by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 546. See [[cal.1968-06-06.robert-kennedy]]. Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      src:
        c: 7ca694c9
        rows:
        - 'w.clifford-counsel-to-the-president-2 546: all'
