      when: Aug. 12
      date: '1968-08-12'
      thread: elections-1968
      also:
      - vietnam-paris
      c: 'Clifford to the 8:30 Group on the meeting at the Ranch: "Nixon''s game plan is to offer us his support in return
        for inflexibility in our negotiating position, and thereby freeze poor Hubert out in the cold."'
      n: '[[w.clifford-counsel-to-the-president-2]], 563. To check: Elsey''s and Pursley''s notes, 8:30 Group, Aug. 12, 1968
        (cited by [[w.clifford-counsel-to-the-president-2]], 563 n.6). See [[cal.1968-08-10.elections-1968]]. Names: Clifford,
        Nixon, Humphrey.'
      tags:
      - name:clifford-clark
      - name:nixon-richard-m
      - name:humphrey-hubert-h
      src:
