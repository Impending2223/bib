- add:
    entry:
      id: cal.1968-08.vietnam-paris
      when: Aug.
      date: 1968-08
      thread: vietnam-paris
      c: 'The week after the Ranch, Vance, back to argue his case, at dinner at Clifford''s house, by Clifford''s account:
        the Honolulu conference has hurt the peace process.'
      n: '[[w.clifford-counsel-to-the-president-2]], 569. See [[cal.1968-08-04.vietnam-paris]]. Names: Vance, Clifford. Check:
        the day, Aug. 5–9.'
