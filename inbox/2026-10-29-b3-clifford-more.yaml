    entry:
      id: cal.1968-12.vietnam-2
      when: Dec.
      date: 1968-12
      thread: vietnam
      also:
      - transition-and-staff
      c: 'After Dec. 12, Clifford and Warnke with Laird, by Clifford''s account: withdraw American forces whether or not the
        negotiations move, to cut casualties and make Saigon rely on itself. Warnke to stay some months to prepare Laird for
        Vietnam, NATO and the arms talks.'
      n: '[[w.clifford-counsel-to-the-president-2]], 604. See [[cal.1968-12-12.transition-and-staff-3]]. Names: Clifford,
        Warnke, Laird. Check: the days.'
      tags:
      - name:clifford-clark
      - name:warnke-paul
      - name:laird-melvin-r
      src:
        c: 16c991fc
        rows:
        - 'w.clifford-counsel-to-the-president-2 604: all'
- add:
    entry:
      id: cal.1968-12.vietnam-3
      when: Dec.
      date: 1968-12
      thread: vietnam
      c: Mid-December. The last debate on the military's request to go into Cambodia; Clifford against, by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 610. Names: Clifford. Check: the day.'
      tags:
      - name:clifford-clark
      src:
        c: d894a968
        rows:
        - 'w.clifford-counsel-to-the-president-2 610: all'
