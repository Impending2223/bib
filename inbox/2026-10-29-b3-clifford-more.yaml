- add:
    entry:
      id: cal.1960-06.elections-1960-9
      when: June
      date: 1960-06
      thread: elections-1960
      c: 'Clifford with Acheson, by Clifford''s account: write Truman on party unity. Acheson''s letters to "the Boss": "Never
        say any of [the other Democratic candidates] is not qualified to be President"; on Kennedy''s religion, "I don''t
        think he''s a very good Catholic."'
      n: '[[w.clifford-counsel-to-the-president-2]], 321. See [[cal.1960-07-01.elections-1960]]. Names: Clifford, Acheson,
        Truman, Kennedy. Check: the letters'' days.'
      tags:
      - name:clifford-clark
      - name:acheson-dean-g
      - name:truman-harry-s
      - name:kennedy-john-f
      src:
        c: 2ecdac40
        rows:
        - 'w.clifford-counsel-to-the-president-2 321: all'
- add:
    entry:
      id: cal.1960-07-10.elections-1960-2
      when: July 10
      date: '1960-07-10'
      thread: elections-1960
      c: 'Los Angeles, the night before the convention opens, by Clifford''s account: Symington refuses another request from
        Kennedy to withdraw; his name to go before the convention.'
      n: '[[w.clifford-counsel-to-the-president-2]], 316. See [[cal.1960-07-01.elections-1960]]. Names: Symington, Kennedy.'
      tags:
      - name:symington-william-s
      - name:kennedy-john-f
      src:
        c: 25d35652
        rows:
        - 'w.clifford-counsel-to-the-president-2 316: all'
- add:
    entry:
      id: cal.1960-08.elections-1960-6
      when: Aug.
      date: 1960-08
      thread: elections-1960
      c: 'Ribicoff to Independence, Kennedy''s emissary to Truman, by Clifford''s account; Johnson, Acheson and Clifford press
        Truman too, for party unity. A postscript of Kennedy''s to Clifford: "Lyndon said the President is in a difficult
        mood. Perhaps you could intervene as I should like to see him."'
      n: '[[w.clifford-counsel-to-the-president-2]], 322. See [[cal.1960-07-02.elections-1960]]. Names: Ribicoff, Kennedy,
        Truman, Johnson, Acheson, Clifford. Check: the day, before Aug. 20.'
      tags:
      - name:ribicoff-abraham
      - name:kennedy-john-f
      - name:truman-harry-s
      - name:johnson-lyndon-b
      - name:acheson-dean-g
      - name:clifford-clark
      src:
        c: 9dc17d26
        rows:
        - 'w.clifford-counsel-to-the-president-2 322: all'
- add:
    entry:
      id: cal.1960-08.transition-and-staff-3
      when: Aug.
      date: 1960-08
      thread: transition-and-staff
      c: End of August. Jackson brings Neustadt to Kennedy's house on the transition, by Clifford's account; Kennedy tells
        him to work apart from Clifford, two sets of advisers.
      n: '[[w.clifford-counsel-to-the-president-2]], 325. See [[cal.1960-08.transition-and-staff]]. Names: Jackson, Neustadt,
        Kennedy, Clifford. Check: the day.'
      tags:
      - name:jackson-henry-m
      - name:neustadt-richard-e
      - name:kennedy-john-f
      - name:clifford-clark
      src:
        c: 33bbc35e
        rows:
        - 'w.clifford-counsel-to-the-president-2 325: all'
- add:
    entry:
      id: cal.1960-10.elections-1960-8
      when: Oct.
      date: 1960-10
      thread: elections-1960
      c: 'Clifford to Kennedy, a private memorandum after the first debate: "Nixon must not be permitted to create the illusion
        that you and he are working toward the same end."'
      n: '[[w.clifford-counsel-to-the-president-2]], 325. Names: Clifford, Kennedy, Nixon. Check: the day, between the first
        debate, Sept. 26, and the second, Oct. 7.'
      tags:
      - name:clifford-clark
      - name:kennedy-john-f
      - name:nixon-richard-m
      src:
        c: d8c7f06e
        rows:
        - 'w.clifford-counsel-to-the-president-2 325: all'
- add:
    entry:
      id: cal.1960-11.transition-and-staff-2
      when: Nov.
      date: 1960-11
      thread: transition-and-staff
      c: Clifford calls on Hoover for the President-elect, by Clifford's account; Courtney Evans the FBI's contact on the
        clearances of the appointees.
      n: '[[w.clifford-counsel-to-the-president-2]], 333–34. See [[cal.1960-11-09.transition-and-staff]]. Names: Clifford,
        Hoover, Evans. Check: the day, after Nov. 10.'
      tags:
      - name:clifford-clark
      - name:hoover-j-edgar
      - name:evans-courtney-a
      src:
        c: 09c5aa1d
        rows:
        - 'w.clifford-counsel-to-the-president-2 333–34: all'
- add:
    entry:
      id: cal.1960-12.defense
      when: Dec.
      date: 1960-12
      thread: defense
      also:
      - transition-and-staff
      c: 'The Symington Committee on the Defense Establishment reports to Kennedy, a month after the election, by Clifford''s
        account: unification of the services beyond what is feasible, overstated by design; a stronger Secretary of Defense
        and Chairman of the Joint Chiefs.'
      n: '[[w.clifford-counsel-to-the-president-2]], 330. See [[cal.1960-09.elections-1960-2]]. Names: Symington, Kennedy.
        Check: the day.'
      tags:
      - name:symington-william-s
      - name:kennedy-john-f
      - name:clifford-clark
      src:
        c: 3fda77ff
        rows:
        - 'w.clifford-counsel-to-the-president-2 330: all'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet-3
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-cabinet
      c: Clifford and Neustadt for Bell at the Budget Bureau, by Clifford's account; Kennedy and Bell meet; the Bureau to
        be one of the President's tools for controlling the government.
      n: '[[w.clifford-counsel-to-the-president-2]], 339. Names: Clifford, Neustadt, Bell, Kennedy. Check: the day.'
      tags:
      - name:clifford-clark
      - name:neustadt-richard-e
      - name:bell-david-e
      - name:kennedy-john-f
      src:
        c: 441f801d
        rows:
        - 'w.clifford-counsel-to-the-president-2 339: all'
- add:
    entry:
      id: cal.1960-12.transition-and-staff-cabinet-4
      when: Dec.
      date: 1960-12
      thread: transition-and-staff-cabinet
      c: 'The cabinet''s finances, by Clifford''s account: each new member sees Clifford; Lovett arranges Rusk''s termination
        allowance from the Rockefeller Foundation. McNamara''s Ford stock into a blind trust; Armed Services requires the
        sale of holdings over $10,000 in companies doing defense business. Clifford advises Kennedy to cut his ties to some
        family trusts.'
      n: '[[w.clifford-counsel-to-the-president-2]], 340–41. Names: Clifford, Lovett, Rusk, McNamara, Kennedy. Check: the
        days.'
      tags:
      - name:clifford-clark
      - name:lovett-robert-a
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      src:
        c: 72a83265
        rows:
        - 'w.clifford-counsel-to-the-president-2 340–41: all'
- add:
    entry:
      id: cal.1961-07.intelligence
      when: July
      date: 1961-07
      thread: intelligence
      c: Summer. Kennedy raises Clifford as Director of Central Intelligence in Dulles's place, by Clifford's account; agreed
        not suitable.
      n: '[[w.clifford-counsel-to-the-president-2]], 354. Names: Kennedy, Clifford, Dulles. Check: the month, from "the summer
        of 1961."'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      - name:dulles-allen-w
      src:
        c: ab252427
        rows:
        - 'w.clifford-counsel-to-the-president-2 354: all'
- add:
    entry:
      id: cal.1961-12.intelligence
      when: Dec.
      date: 1961-12
      thread: intelligence
      c: McCone, new at the CIA, proposes to Kennedy that the Foreign Intelligence Advisory Board become his own advisory
        group, by Clifford's account; the board refuses. The board urges him to name a professional deputy to run the CIA.
      n: '[[w.clifford-counsel-to-the-president-2]], 354–55. See [[cal.1961-05-15.intelligence]]. Names: McCone, Kennedy.
        Check: the month, from "From the beginning."'
      tags:
      - name:mccone-john-a
      - name:kennedy-john-f
      src:
        c: 682ca85d
        rows:
        - 'w.clifford-counsel-to-the-president-2 354–55: all'
- add:
    entry:
      id: cal.1961-12.elections-1962
      when: Dec.
      date: 1961-12
      thread: elections-1962
      c: Early December. Edward Kennedy to seek the nomination for the Senate seat; Edward McCormack his opponent in the primary,
        by Clifford's account.
      n: '[[w.clifford-counsel-to-the-president-2]], 370. See [[cal.1961-09.elections-1962]]. Names: Edward Kennedy. Check:
        the day.'
      tags:
      - name:kennedy-edward-m
      src:
        c: f2e46f4b
        rows:
        - 'w.clifford-counsel-to-the-president-2 370: all'
- add:
    entry:
      id: cal.1962-01.press-and-broadcasting-2
      when: Jan.
      date: 1962-01
      thread: press-and-broadcasting
      c: 'Kennedy to Clifford, alone, by Clifford''s account: the story from the Blauvelt genealogy that he had once married
        Durie Malcolm; a blind item in *Roll Call*. Clifford to deal with the President, Robert Kennedy and Salinger only.
        That day Clifford reads the book at the Library of Congress and telephones Mrs. Shevlin in Palm Beach: "Good God,
        imagine being married to President Kennedy"; she will sign an affidavit.'
      n: '[[w.clifford-counsel-to-the-president-2]], 371–73. Names: Kennedy, Clifford, Robert Kennedy, Salinger. Check: the
        day.'
      tags:
      - name:kennedy-john-f
      - name:clifford-clark
      - name:kennedy-robert-f
      - name:salinger-pierre
      src:
        c: a16da760
        rows:
        - 'w.clifford-counsel-to-the-president-2 371–73: all'
- add:
    entry:
      id: cal.1962-05.press-and-broadcasting-2
      when: May
      date: 1962-05
      thread: press-and-broadcasting
      c: '*The Thunderbolt*, of the National States Rights Party, prints the Blauvelt item and accuses the national press
        of suppressing it. Letters to the White House; a form letter in reply, no public statement.'
      n: '[[w.clifford-counsel-to-the-president-2]], 373. See [[cal.1962-01.press-and-broadcasting]]. Check: the issue''s
        day.'
      src:
        c: d74c5fbb
        rows:
        - 'w.clifford-counsel-to-the-president-2 373: all'
- add:
    entry:
      id: cal.1962-09-02.press-and-broadcasting
      when: Sept. 2
      date: '1962-09-02'
      thread: press-and-broadcasting
      c: '*Parade*, "Walter Scott''s Personality Parade," prints a reader''s question on the rumor of the President''s earlier
        marriage and calls it false; the British press reports it the same day.'
      n: '[[w.clifford-counsel-to-the-president-2]], 373. See [[cal.1962-01.press-and-broadcasting]].'
      src:
        c: a2162597
        rows:
        - 'w.clifford-counsel-to-the-president-2 373: all'
- add:
    entry:
      id: cal.1962-09-24.press-and-broadcasting
      when: Sept. 24
      date: '1962-09-24'
      thread: press-and-broadcasting
      c: '*Newsweek*, at the President''s invitation to Bradlee, its Washington bureau chief: the rumor known since August
        1961, found false, spread by extremist groups. Clifford has told Bradlee his part, at Kennedy''s request.'
      n: '[[w.clifford-counsel-to-the-president-2]], 373–74. See [[cal.1962-01.press-and-broadcasting]]. Names: Bradlee, Clifford,
        Kennedy. Check: the date of the issue.'
      tags:
      - name:bradlee-benjamin-c
      - name:clifford-clark
      - name:kennedy-john-f
      src:
        c: 33511d0b
        rows:
        - 'w.clifford-counsel-to-the-president-2 373–74: all'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-10
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - intelligence
      c: 'Hours before the President''s address, Clifford calls several members of the Foreign Intelligence Advisory Board:
        be ready on a moment''s notice, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 356. See [[cal.1962-09-28.missile-crisis]]. Names: Clifford.'
      tags:
      - name:clifford-clark
      src:
        c: 7b2255f1
        rows:
        - 'w.clifford-counsel-to-the-president-2 356: all'
- add:
    entry:
      id: cal.1964-07.elections-1964-3
      when: July
      date: 1964-07
      thread: elections-1964
      also:
      - robert-kennedy
      c: 'Johnson and Clifford at length, through the month, on Robert Kennedy and the Vice Presidency, by Clifford''s account:
        Daley wants Kennedy; Johnson will not have him, "sandwiched between the two Kennedy brothers."'
      n: '[[w.clifford-counsel-to-the-president-2]], 395–96. See [[cal.1964-02.elections-1964]]. Names: Johnson, Clifford,
        Robert Kennedy, Daley.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:kennedy-robert-f
      - name:daley-richard-j
      src:
        c: a7ed2538
        rows:
        - 'w.clifford-counsel-to-the-president-2 395–96: all'
- add:
    entry:
      id: cal.1964-08.elections-1964-2
      when: Aug.
      date: 1964-08
      thread: elections-1964
      c: To Atlantic City with Johnson and his family for the convention, by Clifford's account. Johnson keeps his choice
        of a running mate to himself and feeds the talk of Dodd; Lady Bird Johnson, Clifford thinks, for McCarthy.
      n: '[[w.clifford-counsel-to-the-president-2]], 398. Names: Clifford, Johnson, Dodd, Lady Bird Johnson, McCarthy. Check:
        the day of the flight.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:dodd-thomas-j
      - name:johnson-lady-bird
      - name:mccarthy-eugene-j
      src:
        c: 991b0a42
        rows:
        - 'w.clifford-counsel-to-the-president-2 398: all'
- add:
    entry:
      id: cal.1964-09.elections-1964-3
      when: Sept.
      date: 1964-09
      thread: elections-1964
      c: 'The campaign, by Clifford''s account: Fortas, Rowe and Clifford Johnson''s third group, White''s "senior court of
        review," over the daily campaign and the strategists; every major speech and appearance before them.'
      n: '[[w.clifford-counsel-to-the-president-2]], 398. To check: [[w.white-making-of-the-president-1965]], 348–49 (cited
        by [[w.clifford-counsel-to-the-president-2]], 398 n.5). Names: Fortas, Rowe, Clifford, Johnson. Check: the season,
        from Labor Day to the election.'
      tags:
      - name:fortas-abe
      - name:rowe-james-h-jr
      - name:clifford-clark
      - name:johnson-lyndon-b
      src:
        c: 866f74ca
        rows:
        - 'w.clifford-counsel-to-the-president-2 398: all'
- add:
    entry:
      id: cal.1964-12.transition-and-staff
      when: Dec.
      date: 1964-12
      thread: transition-and-staff
      c: 'Late in the year. Johnson, indirectly, to Clifford: the Attorney General''s office? Clifford: happy as a private
        lawyer, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 439. See [[cal.1965-01-28.transition-and-staff]]. Names: Johnson, Clifford.
        Check: the month, from "Late in 1964."'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: 6f8f6b55
        rows:
        - 'w.clifford-counsel-to-the-president-2 439: all'
- add:
    entry:
      id: cal.1965-01.transition-and-staff
      when: Jan.
      date: 1965-01
      thread: transition-and-staff
      c: 'Early January. Katzenbach, Acting Attorney General since September, to Johnson: his status to be settled before
        the new session, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 439. See [[cal.1964-12.transition-and-staff]]. Names: Katzenbach, Johnson.
        Check: the day.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      src:
        c: 40d33323
        rows:
        - 'w.clifford-counsel-to-the-president-2 439: all'
- add:
    entry:
      id: cal.1965-01.transition-and-staff-2
      when: Jan.
      date: 1965-01
      thread: transition-and-staff
      c: 'Mid-January. Johnson raises the Attorney General''s office with Clifford again; Clifford: not an effective use of
        him; he would keep his freedom to speak frankly, by Clifford''s account.'
      n: '[[w.clifford-counsel-to-the-president-2]], 439. See [[cal.1964-12.transition-and-staff]]. Names: Johnson, Clifford.
        Check: the day.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: a4577ac0
        rows:
        - 'w.clifford-counsel-to-the-president-2 439: all'
- add:
    entry:
      id: cal.1965-07.transition-and-staff
      when: July
      date: 1965-07
      thread: transition-and-staff
      c: After Stevenson's death, Johnson asks Mrs. Clifford whether Clifford would take the UN, by Clifford's account; Clifford
        tells Johnson he is not the man for it.
      n: '[[w.clifford-counsel-to-the-president-2]], 438. Names: Stevenson, Johnson, Clifford. Check: the day, after July
        14.'
      tags:
      - name:stevenson-adlai-e
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: d4cae06c
        rows:
        - 'w.clifford-counsel-to-the-president-2 438: all'
- add:
    entry:
      id: cal.1965-07-24.vietnam-july-decision
      when: July 24
      date: '1965-07-24'
      thread: vietnam-july-decision
      c: 'Camp David, Saturday, by Clifford''s account: the Cliffords and the McNamaras, Luci and Patrick Nugent by helicopter;
        Goldberg, to be sworn at the UN the next day, Bayh, Busby and Valenti there; dinner with the Johnsons.'
      n: '[[w.clifford-counsel-to-the-president-2]], 418. See [[cal.1965-07-21.vietnam]]. Names: Clifford, McNamara, Luci
        Baines Johnson Nugent, Patrick Nugent, Goldberg, Bayh, Busby, Valenti, Johnson.'
      tags:
      - name:clifford-clark
      - name:mcnamara-robert-s
      - name:nugent-luci-baines-johnson
      - name:nugent-patrick
      - name:goldberg-arthur-j
      - name:bayh-birch
      - name:busby-horace
      - name:valenti-jack
      - name:johnson-lyndon-b
      src:
        c: e5b0fdf9
        rows:
        - 'w.clifford-counsel-to-the-president-2 418: all'
- add:
    entry:
      id: cal.1965-10-21.vietnam-2
      when: Oct. 21–25
      date: '1965-10-21'
      thread: vietnam
      also:
      - intelligence
      c: 'Clifford leaves Washington for Tokyo, Taiwan and Hong Kong on the Foreign Intelligence Advisory Board''s business,
        by Clifford''s account: the warning of Chinese "volunteers" a priority.'
      n: '[[w.clifford-counsel-to-the-president-2]], 426–27. See [[cal.1965-09.vietnam]]. Names: Clifford. Check: the days
        at each stop.'
      tags:
      - name:clifford-clark
      src:
        c: 60a777a6
        rows:
        - 'w.clifford-counsel-to-the-president-2 426–27: all'
- add:
    entry:
      id: cal.1965-10-31.vietnam
      when: Oct. 31
      date: '1965-10-31'
      thread: vietnam
      c: Clifford back in Washington late in the evening, by Hong Kong, Tokyo, Seattle and Friendship Airport, Baltimore,
        by Clifford's account; hepatitis follows.
      n: '[[w.clifford-counsel-to-the-president-2]], 429. See [[cal.1965-10-26.vietnam-3]]. Names: Clifford.'
      tags:
      - name:clifford-clark
      src:
        c: 82ca3c62
        rows:
        - 'w.clifford-counsel-to-the-president-2 429: all'
- add:
    entry:
      id: cal.1965-11.vietnam
      when: Nov.
      date: 1965-11
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Kissinger to the Associated Press: Foisie''s article "wholly in error." To Clifford by telephone, then by letter
        from Harvard: at Zorthian''s request he met some newsmen, off the record, on his next-to-last day in Saigon; Clifford''s
        name never mentioned.'
      n: '[[w.clifford-counsel-to-the-president-2]], 431–32. See [[cal.1965-11-02.vietnam]]. Names: Kissinger, Clifford, Zorthian.
