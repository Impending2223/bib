# Audited (Nov. 14, 2026) from inbox/2026-11-14-b16-vkd-1967.yaml; this file stands for it (merge this one, not the reader's).
# Vol. XXVIII read afresh: every add's heading, date, issuer and signer; its claims looked up. Adds: 30 upheld, 14 corrected
# (01-19 polity:us off; 01-23 cable wording; 02-22; 04-10; 04-13 reports to the Politburo; 05-10 no. 59-CP; 06-30; 07-05 editors'
# title; 07-21, 08-07, 12-22 the decisions; 10-06 signer; 11-27 the "30-7" slip; 1967-03 the tally's year), 0 dropped.
# Held entries: the plenum made a day entry (edit, Jan. 23-27) with its tags, its one cite split into four, the variant and Check
# reworded; the Jan. 28 cite turned into a See (the cable plans the interview, it does not bear it); the Feb. 15 cite to `?`;
# the Feb. 15 check dropped (no disagreement: the letter says Johnson's letter came Feb. 10, as c reads).
patch: 2026-11-14-b16-vkd-1967
by: 'Claude (batch 16, reader 2: Văn kiện Đảng toàn tập, vol. 28, 1967), Nov. 14, 2026; audited by Claude (Opus), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1967-01-07.vietnam-hanoi
      when: Jan. 7
      date: '1967-01-07'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 139-CT/TW: a mass campaign in the first quarter to carry out the 1967 state plan. First the winter-spring crop, local industry and construction, transport on the main routes. Ministries to send cadres down to the provinces and enterprises; provincial committees to review their own leadership; districts to guide the villages.'
      n: '*Chỉ thị của Ban Bí thư số 139-CT/TW, ngày 7-1-1967, Về đợt vận động quần chúng quyết tâm thực hiện kế hoạch nhà nước năm 1967*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 1–8. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-10.vietnam-hanoi
      when: Jan. 10
      date: '1967-01-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 152-NQ/TW on the leadership of women''s work: committees have not weighed it enough, though the "three responsibilities" movement has grown. The Central Women''s Department, with the Organization Department, to study women''s departments in provinces and cities, review Directive 99-CT/TW, and with the ministries study the use of women''s labor in agriculture and the health of women and children; the Women''s Union to be built up at the base.'
      n: '*Nghị quyết của Ban Bí thư số 152-NQ/TW, ngày 10-1-1967, Về một số vấn đề tổ chức lãnh đạo công tác phụ vận*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 9–21. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-10.vietnam-hanoi-2
      when: Jan. 10
      date: '1967-01-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 153-NQ/TW on women cadres: women over half the North''s people, yet feudal ideas still held by many cadres, leaders among them. Committees to judge women cadres fairly, train and promote them in due proportion, the young above all; special schemes for women of the minorities and from the South.'
      n: '*Nghị quyết của Ban Bí thư số 153-NQ/TW, ngày 10-1-1967, Về công tác cán bộ nữ*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVIII, 22–48. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-11.vietnam-hanoi
      when: Jan. 11
      date: '1967-01-11'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 140-CT/TW on the health of cadres and people in the new situation: village health stations, patriotic hygiene, mothers and children, prevention, drugs and instruments, Eastern with Western medicine, training; Party committees answerable for health work in wartime.'
      n: '*Chỉ thị của Ban Bí thư số 140-CT/TW, ngày 11-1-1967, Về việc bảo vệ và bồi dưỡng sức khoẻ của cán bộ và nhân dân trước tình hình mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 49–58. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-19.vietnam-hanoi
      when: Jan. 19
      date: '1967-01-19'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s directive no. 141-CT/TW on ideological work: the war entering its hardest period, with losses to come beside the victories. Aims: will to fight and win, trust in the Party''s line, independence and self-reliance. Two drives: in the first quarter a mass campaign to carry out the state plan, then a wider one on the Party''s new decisions, with democracy and discipline in the Party, vigilance and state secrecy.'
      n: '*Chỉ thị của Ban Bí thư số 141-CT/TW, ngày 19-1-1967, Về công tác tư tưởng trong thời gian tới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 59–67. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-20.vietnam-hanoi
      when: Jan. 20
      date: '1967-01-20'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat''s directive no. 142-CT/TW on the self-defense forces of factories, mines, farms, transport and offices: no set use against the bombing or a ground war, uneven growth, loose control of arms, tactics training weak. On the spot, they defend their own site; with the police they keep order; they supply the army; a core force and a wider one, full-time military cadres in each.'
      n: '*Chỉ thị của Ban Bí thư số 142-CT/TW, ngày 20-1-1967, Về việc tăng cường lãnh đạo lực lượng tự vệ*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 68–76. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-23.vietnam-hanoi
      when: Jan. 23
      date: '1967-01-23'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      - vietnam
      c: 'The Politburo''s secret cable to the Central Office for the South and Region V: the moment favors saying openly that the DRV and the United States can talk once the United States ends the bombing permanently and unconditionally. The DRV''s representative to tell the Americans so at their request, then the Foreign Minister to say it in an interview; the Front to declare its agreement; illusions of peace talks, abroad and at home, to be fought. Its odds: a flat refusal unlikely, a bargaining reply likely, acceptance very unlikely.'
      n: '*Điện mật của Bộ Chính trị số 00, ngày 23-1-1967, Về tiếp tục đấu tranh ngoại giao bảo vệ lập trường của ta trong thời gian tới* (the title the editors''), signed "Bác Hương," the Politburo''s code name. [[w.van-kien-dang-toan]], XXVIII, 84–87. Made public: 2003. See [[cal.1967-01-03.vietnam-diplomacy]].'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-01-23.vietnam-hanoi-2
      when: Jan. 23
      date: '1967-01-23'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 191-TT/TW on the village purchase-and-sale cooperatives: commune bodies for buying and selling, agents of state trade, not for production (lime, brick, milling); to help the peasants'' sideline production, not coerce it; women cadres of sound politics to run them; the Domestic Trade Ministry''s Party group to study taxes, commissions and profit-sharing.'
      n: '*Thông tri của Ban Bí thư số 191-TT/TW, ngày 23-1-1967, Về việc tăng cường hơn nữa việc lãnh đạo và củng cố phong trào hợp tác xã mua bán xã*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 79–83. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-02-22.vietnam-hanoi
      when: Feb. 22
      date: '1967-02-22'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 157-NQ/TW on science and technology: over 20,000 graduates, 100,000 technical-school cadres, 16 research institutes. Two tasks: the technical revolution in wartime, and preparing for the one after the war. The State Science and Technology Commission to be strengthened as the managing body; Party committees to take the work up themselves.'
      n: '*Nghị quyết của Ban Bí thư số 157-NQ/TW, ngày 22-2-1967, Về tăng cường công tác khoa học và kỹ thuật trong tình hình và nhiệm vụ mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 184–200. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-08.vietnam-hanoi
      when: Mar. 8
      date: '1967-03-08'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 143-CT/TW on the coming elections of people''s councils and administrative committees of districts, towns, wards and villages across the North, held in wartime: Party committees to review their leadership, see to the make-up of councils and committees, direct the voting; the new delegates and committee members to be trained in their duties.'
      n: '*Chỉ thị của Ban Bí thư số 143-CT/TW, ngày 8-3-1967, Về việc lãnh đạo bầu cử Hội đồng nhân dân và Uỷ ban hành chính huyện, xã và các cấp tương đương*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 201–206. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-10.vietnam-hanoi
      when: Mar. 10
      date: '1967-03-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Secretariat''s directive no. 144-CT/TW: a month, Mar. 15–Apr. 15, to push people''s air defense. Every family, street, enterprise, cooperative, school, hospital and office to have shelters and trenches to standard, lookouts and alerts, dispersal; officials whose negligence costs lives to be disciplined.'
      n: '*Chỉ thị của Ban Bí thư số 144-CT/TW, ngày 10-3-1967, Về việc tổ chức một tháng đẩy mạnh công tác phòng không nhân dân*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 207–212. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-13.vietnam-hanoi
      when: Mar. 13
      date: '1967-03-13'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s directive no. 145-CT/TW on security in the North as the American escalation grows: spy, commando and psychological war, among Catholics above all; secrets leaking in the press, on the radio and by wireless. First the former Zone IV, the strategic routes, Hanoi and Haiphong, the base areas, Catholic and border districts. The Public Security Ministry''s Party group to report to the Secretariat every three months.'
      n: '*Chỉ thị của Ban Bí thư số 145-CT/TW, ngày 13-3-1967, Về việc tăng cường giữ vững an ninh miền Bắc trong bước leo thang nghiêm trọng mới của đế quốc Mỹ*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 213–230. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-22.vietnam-hanoi
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'The Secretariat''s circular no. 193-TT/TW: a political drive in the whole country to the end of April on Hồ Chí Minh''s reply to Johnson, which the Foreign Ministry has just published. To speed production, fighting and air defense and be ready for any new escalation.'
      n: '*Thông tri của Ban Bí thư số 193-TT/TW, ngày 22-3-1967, Về việc mở đợt động viên chính trị trong toàn quốc nhân dịp Chủ tịch Hồ Chí Minh gửi thư trả lời Tổng thống Mỹ* (the title the editors''), signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 240–242. Made public: 2003. See [[cal.1967-03-21.vietnam]]. Names: Hồ Chí Minh, Johnson.'
      tags:
      - name:ho-chi-minh
      - name:johnson-lyndon-b
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03-31.vietnam-hanoi
      when: Mar. 31
      date: '1967-03-31'
      thread: vietnam-hanoi
      c: 'The Secretariat and the Government''s Standing Committee, urgent cable no. 20: the winter-spring crop in great difficulty. Plant what the season still allows, tend and fertilize the crops, relieve the farmers'' food shortage and place labor on dikes and irrigation.'
      n: '*Điện khẩn của Ban Bí thư và Thường vụ Hội đồng Chính phủ số 20, ngày 31-3-1967, Yêu cầu khắc phục khó khăn của vụ sản xuất đông - xuân* (the title the editors''), signed by Lê Văn Lương for the Secretariat and Phạm Hùng for the Government''s Standing Committee. [[w.van-kien-dang-toan]], XXVIII, 243–244. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-01.vietnam-hanoi
      when: Apr. 1
      date: '1967-04-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 146-CT/TW to press the carrying out of its resolution no. 136-NQ/TW on the district committees and to hold district Party congresses: many held already; the congress''s business, the make-up of the district committee and the standards for its members.'
      n: '*Chỉ thị của Ban Bí thư số 146-CT/TW, ngày 1-4-1967, Về việc đẩy mạnh việc thi hành Nghị quyết số 136-NQ/TW và mở Đại hội đại biểu các đảng bộ huyện*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 245–257. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-10.vietnam-hanoi
      when: Apr. 10–11
      date: '1967-04-10'
      thread: vietnam-hanoi
      c: The Secretariat, Lê Duẩn, Phạm Hùng, Lê Văn Lương, Tố Hữu, Hoàng Anh and Nguyễn Văn Trân present, hears the Central Agriculture Department on a campaign to promote democracy in the countryside, with one to improve the cooperatives' management and a model charter for agricultural cooperatives. A new and many-sided matter, preparation not thorough; the aim the people's collective mastery and the worker-peasant alliance. More preparation and pilots first, then a report to the Secretariat.
      n: '*Thông báo số 02-TB/TW, ngày 17-4-1967, Về cuộc họp của Ban Bí thư bàn về cuộc vận động phát huy dân chủ ở nông thôn kết hợp với cuộc vận động cải tiến quản lý hợp tác xã và xây dựng điều lệ hợp tác xã nông nghiệp*, signed for the Secretariat by Minh Châu, deputy head of its office. [[w.van-kien-dang-toan]], XXVIII, 284–288. Made public: 2003. Names: Lê Duẩn, Phạm Hùng, Lê Văn Lương, Tố Hữu, Hoàng Anh, Nguyễn Văn Trân.'
      tags:
      - name:le-duan
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-13.vietnam-hanoi
      when: Apr. 13
      date: '1967-04-13'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 147-CT/TW forming a team to investigate the carrying out of the Law on Marriage and the Family in the Việt Bắc Autonomous Region: the region''s own regulations, passed by its people''s council July 3, 1966, await the National Assembly''s Standing Committee. The team, also the National Assembly Standing Committee''s and under the Assembly''s Party group, to gather opinion and figures on the regulations, Article 6 above all, then report to the Politburo.'
      n: '*Chỉ thị của Ban Bí thư số 147-CT/TW, ngày 13-4-1967, Về việc thành lập Đoàn điều tra về vấn đề thi hành Luật Hôn nhân và Gia đình trong Khu tự trị Việt Bắc*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 258–260. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-17.vietnam-hanoi
      when: Apr. 17
      date: '1967-04-17'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 148-CT/TW on finance, trade and prices in 1967: the branches to serve production and the war''s needs, a consumption policy for food, clothing, schooling and health, stricter economic and financial management, a new balance fitted to wartime.'
      n: '*Chỉ thị của Ban Bí thư số 148-CT/TW, ngày 17-4-1967, Về tăng cường lãnh đạo và tổ chức thực hiện công tác tài chính, thương nghiệp và giá cả năm 1967*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVIII, 261–275. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-04-17.vietnam-hanoi-2
      when: Apr. 17
      date: '1967-04-17'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 149-CT/TW on food: grain output to grow all round; management and distribution of grain to be gathered into the hands of the State and the agricultural cooperatives, the way readied to abolish the free market in grain; cooperatives to share out grain democratically. Waste and embezzlement widespread, some grave; committees answerable.'
      n: '*Chỉ thị của Ban Bí thư số 149-CT/TW, ngày 17-4-1967, Về việc tăng cường lãnh đạo công tác lương thực trong tình hình hiện nay*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVIII, 276–283. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-05-10.vietnam-hanoi
      when: May 10
      date: '1967-05-10'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 150-CT/TW on economic and financial management, protection of state, collective and private property, and thrift, to carry out the Government''s resolution no. 59-CP of the same day: waste of labor, materials and funds common, embezzlement widespread and at times grave, worse since the war. Party groups to take stock of property and labor and hold to state prices.'
      n: '*Chỉ thị của Ban Bí thư số 150-CT/TW, ngày 10-5-1967, Về tăng cường quản lý kinh tế tài chính, bảo vệ tài sản của Nhà nước, của tập thể và của nhân dân, ra sức thực hành tiết kiệm trong sản xuất, xây dựng, chiến đấu và đời sống*, signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVIII, 297–304. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-05-26.vietnam-hanoi
      when: May 26
      date: '1967-05-26'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat and the Government''s Standing Committee, joint resolution no. 159-NQ/TW on the 1967 labor balance: waste of labor and low productivity, in places worse. To meet the army''s manpower call for 1967, keep labor for production and transport, cut staff in administrative offices, manage labor strictly.'
      n: '*Nghị quyết Hội nghị liên tịch Ban Bí thư và Thường vụ Hội đồng Chính phủ số 159-NQ/TW, ngày 26-5-1967, Về vấn đề cân đối lao động năm 1967*, signed Tố Hữu for the Secretariat and Phạm Hùng for the Government''s Standing Committee. [[w.van-kien-dang-toan]], XXVIII, 305–310. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-05-26.vietnam-hanoi-2
      when: May 26
      date: '1967-05-26'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 151-CT/TW on choosing students for foreign universities: some chosen carelessly, with poor conduct or schooling; the fields (basic sciences and surveys, industrial techniques, economics, agriculture, medicine), the political, moral and educational standards, and the workers, cadres and youth to be picked. The North to go on sending many to the socialist countries.'
      n: '*Chỉ thị của Ban Bí thư số 151-CT/TW, ngày 26-5-1967, Về một số vấn đề trong công tác tuyển sinh đi học các trường đại học nước ngoài*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 311–318. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-05-29.vietnam-hanoi
      when: May 29
      date: '1967-05-29'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 152-CT/TW on improving Branch II of the Nguyễn Ái Quốc School, set up in 1963 for key Party leaders of industrial enterprises at the primary level: three courses, nearly 500 cadres; enrolment scattered, programme and staff weak. Within two years the Party secretaries and directors of local industrial enterprises, union and Youth secretaries and provincial industry officials to attend in turn, other schools to stop enrolling them, the Central Industry Department to run the enrolment.'
      n: '*Chỉ thị của Ban Bí thư số 152-CT/TW, ngày 29-5-1967, Về việc cải tiến công tác của Trường Nguyễn Ái Quốc phân hiệu II*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 319–323. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-06-15.vietnam-hanoi-2
      when: June 15
      date: '1967-06-15'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Secretariat''s circular no. 195-TT/TW on the coming draft: the Politburo has decided to call up a large number of young men to strengthen the armed forces and the front; the Premier''s Directive no. 100/TTg fixes the plan. Committees to rouse volunteering and rely on persuasion, not orders, hold to the standards and the rules of deferment, and care for the wounded and the families of the dead and of soldiers.'
      n: '*Thông tri của Ban Bí thư số 195-TT/TW, ngày 15-6-1967, Về việc tăng cường chỉ đạo đợt động viên, tuyển quân sắp tới*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVIII, 324–327. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-06-24.vietnam-hanoi
      when: June 24
      date: '1967-06-24'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 153-CT/TW on "reporting merits, earning merits against the Americans": a new form, grown from Quảng Bình''s "two goods" into Thái Bình''s reporting and rating of merit, which the Secretariat finds of great worth for ideological education, action and organization; its aims, content and conduct.'
      n: '*Chỉ thị của Ban Bí thư số 153-CT/TW, ngày 24-6-1967, Về vấn đề "báo công, lập công chống Mỹ, cứu nước"*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 328–336. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-06-24.vietnam-hanoi-2
      when: June 24
      date: '1967-06-24'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 154-CT/TW: resolve to win a great main-season harvest. The winter-spring crop good, with record yields in many provinces of Zone IV; now seed and seedlings, ploughing and drought defense for the autumn crop.'
      n: '*Chỉ thị của Ban Bí thư số 154-CT/TW, ngày 24-6-1967, Quyết tâm phấn đấu giành vụ mùa thắng lợi lớn*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 337–342. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-06-30.vietnam-hanoi
      when: June 30
      date: '1967-06-30'
      thread: vietnam-hanoi
      c: 'The Politburo''s resolution no. 161-NQ/TW on labor: handwork still 90 percent of the North''s labor, skilled labor scant, labor unevenly spread among branches and regions; over a million lowlanders gone to the mountains, unemployment basically ended. Its allocation, use and upkeep to be reordered for production and for the war.'
      n: '*Nghị quyết của Bộ Chính trị số 161-NQ/TW, ngày 30-6-1967, Về công tác lao động*, signed Lê Thanh Nghị for the Politburo. [[w.van-kien-dang-toan]], XXVIII, 343–368. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-07-01.vietnam-hanoi
      when: July 1
      date: '1967-07-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 196-TT/TW: some nine months from July 1967 of study for district, village and cooperative leaders and Party members in the countryside and enterprises, by the Nguyễn Ái Quốc branch schools and local classes.'
      n: '*Thông tri của Ban Bí thư số 196-TT/TW, ngày 1-7-1967, Về việc tăng cường công tác giáo dục cán bộ lãnh đạo sơ cấp, cơ sở và đảng viên ở nông thôn, xí nghiệp*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 369–374. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-07-05.vietnam-hanoi-3
      when: July 5
      date: '1967-07-05'
      thread: vietnam-hanoi
      c: 'The Secretariat''s secret cable no. 113 to provincial and city secretaries: its Directive no. 149-CT/TW on food, of a content unlike the past, has not been taken seriously. Committees to review their study of it, check the democratic discussion on mobilizing grain, and finish the grain collection quickly and cleanly.'
      n: '*Điện mật của Ban Bí thư số 113, ngày 5-7-1967, Về việc tăng cường lãnh đạo công tác lương thực* (the title the editors''), signed for the Secretariat by Phạm Hùng. [[w.van-kien-dang-toan]], XXVIII, 375–378. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-07-21.vietnam-hanoi
      when: July 21
      date: '1967-07-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 155-CT/TW on the fight against drought and planting the main crop on time: drought severe in many places, Zone IV above all, much land not ploughed, seedlings short, the sowing season nearly over. Provincial committees to throw all local means into irrigation, share out water, sow more seedlings, put unplanted fields to other crops, leave none fallow; provincial and district cadres down to the villages, other business put off.'
      n: '*Chỉ thị của Ban Bí thư số 155-CT/TW, ngày 21-7-1967, Về việc đẩy mạnh công tác chống hạn, đảm bảo sản xuất vụ mùa kịp thời vụ*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 379–381. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-08-07.vietnam-hanoi
      when: Aug. 7
      date: '1967-08-07'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 197-TT/TW on pressing Directive no. 145, after six months: American spying through diplomatic offices, the International Commission and visiting delegations, agents landed by parachute, by sea and over the border; leaks in the press, on the radio and by wireless; theft of state property; orphans and petty thieving in the towns. Every level to review its execution of no. 145 and report at intervals to the Secretariat and the Public Security Ministry''s Party group; state secrets, camouflage, the coast against commandos, public order in Hanoi and Haiphong.'
      n: '*Thông tri của Ban Bí thư số 197-TT/TW, ngày 7-8-1967, Về việc tích cực thi hành Chỉ thị 145 của Ban Bí thư*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 382–386. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-08-14.vietnam-hanoi
      when: Aug. 14
      date: '1967-08-14'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 198-TT/TW on drawing up the 1968 state plan and the three-year local economic plan, 1968–70: the State Planning Commission to put the plan to the Politburo and the Government in November, the tasks to reach the bases in December; the Politburo to take up the three-year plan in the first quarter of 1968; the Secretariat to hear provinces and ministries in September–November.'
      n: '*Thông tri của Ban Bí thư số 198-TT/TW, ngày 14-8-1967, Về việc lập kế hoạch Nhà nước năm 1968 và kế hoạch kinh tế địa phương ba năm 1968-1970*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 387–391. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-09-01.vietnam-hanoi
      when: Sept. 1
      date: '1967-09-01'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 200-TT/TW on a review of Directive no. 149 on food: the spring crop''s grain work and the State''s taking over of distribution to be examined, provinces to report.'
      n: '*Thông tri của Ban Bí thư số 200-TT/TW, ngày 1-9-1967, Về sơ kết việc thực hiện Chỉ thị 149 tăng cường lãnh đạo công tác lương thực*, signed for the Secretariat by Tố Hữu. [[w.van-kien-dang-toan]], XXVIII, 394–397. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-09-21.vietnam-hanoi
      when: Sept. 21
      date: '1967-09-21'
      thread: vietnam-hanoi
      c: 'The Secretariat''s resolution no. 167-NQ/TW on work among the workers and the trade unions in the new situation, on the Third Congress, the seventh plenum and its own resolution no. 76 of Apr. 16, 1963: production and its defense, the army, emulation, workers'' lives and health, education; the unions'' organization and Party leadership.'
      n: '*Nghị quyết của Ban Bí thư số 167-NQ/TW, ngày 21-9-1967, Về việc tăng cường công tác vận động công nhân và hoạt động của công đoàn trong tình hình mới*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 398–426. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-10-06.vietnam-hanoi
      when: Oct. 6–7
      date: '1967-10-06'
      thread: vietnam-hanoi
      c: The Secretariat, Lê Văn Lương, Tố Hữu and Nguyễn Văn Trân present, hears the Việt Bắc Zone Committee and the Bắc Thái Provincial Committee on a pilot of the democracy campaign in eight villages of Bạch Thông district. The eight villages, in the low part of the province, not typical of Bắc Thái or the zone; guidance on political education, rules and the apparatus.
      n: '*Thông báo số 06-TB/TW, ngày 20-10-1967, Về cuộc họp của Ban Bí thư bàn về vấn đề thí điểm cuộc vận động dân chủ ở miền núi*, signed for the Secretariat by Phạm Chung, deputy head of its office. [[w.van-kien-dang-toan]], XXVIII, 427–432. Made public: 2003. Names: Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-10-09.vietnam-hanoi
      when: Oct. 9–10
      date: '1967-10-09'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân and Hoàng Anh present, on gathering the management and distribution of grain into the State and the agricultural cooperatives and ending the free market in grain: it hears the Finance and Trade Department''s scheme and the Grain Department''s report on Directive no. 149; the peasants'' ration, prices of grain distributed in the cooperatives, distribution by quota.'
      n: '*Thông báo số 08-TB, ngày 11-11-1967, Về cuộc họp của Ban Bí thư bàn về vấn đề quản lý và phân phối lương thực*, signed Phạm Chung, for the Secretariat''s office. [[w.van-kien-dang-toan]], XXVIII, 440–447. Made public: 2003. Names: Lê Văn Lương, Tố Hữu, Nguyễn Văn Trân, Hoàng Anh.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-10-16.vietnam-hanoi
      when: Oct. 16
      date: '1967-10-16'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Văn Lương, Hoàng Anh and Nguyễn Văn Trân present, hears the Central Agriculture Department on two years of the campaign to improve cooperative management and farming technique: just over half the cooperatives done, unevenly; to be finished.'
      n: '*Thông báo số 07-TB, ngày 7-11-1967, Về cuộc họp của Ban Bí thư bàn về việc tiếp tục hoàn thành cuộc vận động cải tiến quản lý hợp tác xã, cải tiến kỹ thuật trong nông nghiệp*, signed Phạm Chung, for the Secretariat''s office. [[w.van-kien-dang-toan]], XXVIII, 437–439. Made public: 2003. Names: Lê Văn Lương, Hoàng Anh, Nguyễn Văn Trân.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-10-17.vietnam-hanoi
      when: Oct. 17
      date: '1967-10-17'
      thread: vietnam-hanoi
      c: 'The Secretariat, Lê Văn Lương, Nguyễn Văn Trân and Hoàng Anh present, on distribution within the agricultural cooperatives: unfair, with embezzlement and waste common and grave. Work-points, the pay of cooperative and team leaders, the accumulation and public-welfare funds.'
      n: '*Thông báo của Ban Bí thư số 09-TB, ngày 16-11-1967, Về cuộc họp bàn về phân phối trong hợp tác xã nông nghiệp*, signed Phạm Chung, for the Secretariat''s office. [[w.van-kien-dang-toan]], XXVIII, 451–455. Made public: 2003. Names: Lê Văn Lương, Nguyễn Văn Trân, Hoàng Anh.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-11-15.vietnam-hanoi
      when: Nov. 15
      date: '1967-11-15'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'The Secretariat''s circular no. 204-TT/TW amending its rules of July 14, 1965 for cadres and fighters sent to the South and those who come North from it: the food and pocket-money ration for cadres from the South; the terms for those sent South.'
      n: '*Thông tri của Ban Bí thư số 204-TT/TW, ngày 15-11-1967, Bổ sung và sửa đổi một số điểm về chế độ đối với cán bộ, chiến sĩ vào Nam công tác và ở trong Nam ra*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVIII, 448–450. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-11-20.vietnam-hanoi
      when: Nov. 20
      date: '1967-11-20'
      thread: vietnam-hanoi
      c: 'The Secretariat''s directive no. 156-CT/TW on protecting and raising the health of cadres, workers and staff: health slipping, above all in the fighting zones. Checkups and treatment, rest homes, sensible hours, clubs and sport, diet, housing; each cadre''s health kept on record.'
      n: '*Chỉ thị của Ban Bí thư số 156-CT/TW, ngày 20-11-1967, Về tăng cường công tác bảo vệ và nâng cao sức khoẻ cán bộ, công nhân, viên chức*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVIII, 456–467. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-11-27.vietnam-hanoi
      when: Nov. 27
      date: '1967-11-27'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 207-TT/TW on spreading and carrying out the Politburo''s resolution no. 161 and the Government''s no. 103 of July 6, 1967 on labor: committees to study them, plan help to the bases, strengthen the labor offices.'
      n: '*Thông tri của Ban Bí thư số 207-TT/TW, ngày 27-11-1967, Về việc phổ biến và thi hành Nghị quyết 161 của Bộ Chính trị và Nghị quyết số 103 của Hội đồng Chính phủ về công tác lao động*, signed for the Secretariat by Lê Văn Lương. [[w.van-kien-dang-toan]], XXVIII, 468–472 (it dates no. 161 "30-7-1967," 468: a slip for June 30, for the Government''s no. 103 of July 6 "followed" it). Made public: 2003. See [[cal.1967-06-30.vietnam-hanoi]].'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-12-22.vietnam-hanoi
      when: Dec. 22
      date: '1967-12-22'
      thread: vietnam-hanoi
      c: 'The Secretariat''s circular no. 210-TT/TW on strengthening the Party''s control committees and state inspection: control work only begun in many districts and bases, inspection neglected since the Government''s inspection commission was dissolved, petitions piling up; committees short of cadres, their heads changed often. Staff fixed: provincial and city control committees 25, 19 or 15 cadres, Việt Bắc''s 19, Tây Bắc''s 15, a district''s four or five; the district committee''s head a member of the district standing committee.'
      n: '*Thông tri của Ban Bí thư số 210-TT/TW, ngày 22-12-1967, Về việc tăng cường tổ chức Uỷ ban Kiểm tra của Đảng và đẩy mạnh công tác thanh tra của các cơ quan nhà nước*, signed for the Secretariat by Lê Đức Thọ. [[w.van-kien-dang-toan]], XXVIII, 476–481. Made public: 2003.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1967-05.vietnam-hanoi
      when: May
      date: '1967-05'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Fifth Conference of the Central Office for the South, its resolution: the second American counteroffensive, the "two-pronged" plan of the dry season of 1966–67, failing; American strength to reach some 500,000 by the end of 1967 and perhaps 600,000–700,000 in 1968. Tasks: destroy and break up American and puppet forces, guerrilla war, strikes on bases and communications, military and political struggle and work on enemy troops, toward the general offensive and uprising.'
      n: '*Nghị quyết Hội nghị lần thứ năm Trung ương Cục, Tháng 5 năm 1967* (appendix). [[w.van-kien-dang-toan]], XXVIII, 485–559. Made public: 2003.'
      tags:
      - polity:drv
      - polity:us
      - vis:only:drv
- add:
    entry:
      id: cal.1967-03.vietnam-hanoi
      when: Mar.
      date: '1967-03'
      thread: vietnam-hanoi
      also:
      - vietnam
      - vietnam-operations
      c: 'The Sixth Conference (enlarged) of the Region V Committee, its resolution: all strength to the military and political struggle. The Region''s count for the past year: 135,160 of the enemy destroyed (63,579 American, 10,366 South Korean, 61,216 Saigon troops), 22 battalions wiped out, 1,597 aircraft downed or destroyed; the aims to break up some 50,000 Saigon troops and by the end of 1967 or early 1968 to liberate most of the countryside.'
      n: '*Nghị quyết Hội nghị lần thứ sáu Khu uỷ V (mở rộng) tháng 3 năm 1967, Tập trung toàn lực đẩy mạnh đấu tranh quân sự và đấu tranh chính trị quyết giành thắng lợi to lớn nhất trong thời gian tới* (appendix). [[w.van-kien-dang-toan]], XXVIII, 560–596. Made public: 2003.'
      tags:
      - polity:drv
      - polity:rvn
      - polity:us
      - vis:only:drv
