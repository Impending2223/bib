- tag:
    id: cal.1967-01.vietnam
    add:
    - polity:drv
    - vis:only:drv
- cite:
    id: cal.1967-01.vietnam
    item: '[[w.van-kien-dang-toan]], XXVIII, 171–79 (the plenum''s resolution no. 155-NQ/TW of Jan. 27 on the diplomatic offensive, beside the military and political struggle in the South, which is to be pressed whether or not the bombing stops)'
    units: A, B
- cite:
    id: cal.1967-01.vietnam
    item: '[[w.van-kien-dang-toan]], XXVIII, 141–70 (the Politburo''s resolution no. 154-NQ/TW on the military and political struggle in the South, of its sessions of October and November 1966, approved by the plenum Jan. 27, 141 n.)'
    units: A
- cite:
    id: cal.1967-01.vietnam
    item: '[[w.van-kien-dang-toan]], XXVIII, 88–115 (Văn Tiến Dũng''s outline report to the plenum on strategic direction in 1966; the editors'' note, 88 n., has the plenum sit Jan. 23–27)'
    units: A
- cite:
    id: cal.1967-01.vietnam
    item: '[[w.van-kien-dang-toan]], XXVIII, 116–40 (Nguyễn Duy Trinh''s outline report to the plenum, Jan. 23, on the diplomatic offensive: "fight while talking, talk while fighting")'
    units: A
- variant:
    id: cal.1967-01.vietnam
    unit: C
    witness: w.van-kien-dang-toan
    reads: 'a "decisive victory" in "a relatively short time" (no. 154, 146; no. 155, 174), by a "general offensive, general uprising" (tổng công kích, tổng khởi nghĩa: no. 154, 147); no "spontaneous" uprising in either'
    at: XXVIII, 146–47, 174
- check:
    id: cal.1967-01.vietnam
    text: 'Check: the aim. The volume''s two resolutions have a decisive victory in a relatively short time (XXVIII, 146, 174), by a general offensive and general uprising in the Politburo''s (147), not a "spontaneous uprising" in "the shortest possible time"; and the editors'' notes give the plenum Jan. 23–27 (88 n.) and Jan. 23–26 (116 n.).'
- edit:
    id: cal.1967-01-28.vietnam
    base: a708dcaa
    set:
      n: 'Editorial Note, [FRUS 1964–68, V: Vietnam, 1967, doc. 29](https://history.state.gov/historicaldocuments/frus1964-68v05/d29) (the interview, Jan. 28; talks "could" follow). [[w.nguyen-hanois-war]], 90; [[w.gibbons-u-s-government-and]], IV, 498 n.55. To check: [[w.current-documents-1967]], 843–44 (the interview''s text, by FRUS''s note). Check: FRUS''s note gives the condition as an unconditional end of the bombing and of troop augmentation. See [[cal.1967-01-04.vietnam]]; [[cal.1967-01.vietnam]]; [[cal.1967-01-23.vietnam-hanoi]]. Names: Nguyễn Duy Trinh, Burchett.'
- cite:
    id: cal.1967-02-15.vietnam
    item: '[[w.van-kien-dang-toan]], XXVIII, 180–83 (Hồ Chí Minh''s letter, the title the editors'', printed from his *Toàn tập* (2002), XII, 230–32: Johnson''s letter received Feb. 10; the United States to end the bombing and all other acts of war against the DRV permanently and unconditionally, withdraw American and allied troops, recognize the Front; talks only after, 182; the editors'' note, 180 n., dates the reply Feb. 15 and has Johnson order the bombing resumed Feb. 14; not Lê Trang, Guthrie or Moscow)'
    units: '?'
