- add:
    entry:
      id: cal.1964-08-17.elections-1964-2
      when: Aug. 17
      date: '1964-08-17'
      thread: elections-1964
      also:
      - mississippi
      c: 'Eastland asks Johnson by telephone, 12:13 p.m., whether Mississippi''s regulars will be seated. Johnson: "Here are
        people who murdered folks who were trying to help people get a chance to vote, and you''re coming up here to recognize
        them as members of the Democratic Party when they won''t even say they will support the nominee. ... I am anathema
        to the South. ... On the other hand, I am a white southerner!" He wants each delegate''s written pledge to support
        him.'
      n: '[[w.kotz-judgment-days]], 193. To check: [Johnson and Eastland, 12:13 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-17-1964),
        Conversation WH6408-26-4993 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 193 n.15). Names: Johnson,
        Eastland.'
      src:
        c: e36714d3
        rows:
        - 'w.kotz-judgment-days 193: all'
        - 'via x.1964-08-17.johnson-and-eastland-telephone-12-13: all'
      tags:
      - name:johnson-lyndon-b
      - name:eastland-james-o
