      when: Nov. 21
      date: '1964-11-21'
      thread: civil-rights-the-executive
      also:
      - king
      c: 'Sullivan, of the FBI, after Hoover''s note on answering King, has the laboratory make a tape of "highlights" from
        the microphones in King''s hotel rooms at Washington, San Francisco and Los Angeles, and types an anonymous letter
        on plain paper: "King, look into your heart. ... You are done. ... You have just 34 days in which to do (this exact
        number has been selected) for a specific reason." Lish Whitson, an agent, flies the package to Miami and mails it
        to King''s office at Atlanta.'
      n: '[[w.kotz-judgment-days]], 246–47. To check: S. Rep. No. 94-755, Book III (1976), 157–59; Rosen to Belmont, Nov.
        20, 1964, FBI King file, sec. 20 (cited by [[w.kotz-judgment-days]], 246–47 nn.42–43). Check: the day of mailing (Kotz:
        Sullivan assumed it would arrive the next day). Names: Sullivan, Hoover, Martin Luther King.'
      src:
