      id: cal.1964-08-23.elections-1964-3
      when: Aug. 23
      date: '1964-08-23'
      thread: elections-1964
      also:
      - mississippi
      - farm
      c: 'Johnson to Eastland by telephone, 3:35 p.m., after half a dozen calls: are the regulars "traitors to the party—or
        are they going to try to be helpful?" He "might cut out your goddamn subsidies and cut out your $6 billion cotton
        program"; laughing, he might as well "save about $6 billion." Twenty minutes later Eastland: Governor Johnson will
        let the delegates "use their own judgments" on the loyalty oath.'
      n: '[[w.kotz-judgment-days]], 209. To check: [Johnson and Eastland, 3:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964),
        Conversation WH6408-33-5133, and [3:55 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-eastland-august-23-1964-0),
        Conversation WH6408-33-5134 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 209 n.52). Check: Kotz''s
        text has it Sunday evening. See [[cal.1964-08-22.elections-1964]]. Names: Johnson, Eastland, Paul Johnson.'
      src:
        c: 1124b289
        rows:
        - 'w.kotz-judgment-days 209: all'
        - 'via x.1964-08-22.lbj-phone-call-with-james-eastland-3: A-C'
      tags:
      - name:johnson-lyndon-b
      - name:eastland-james-o
      - name:johnson-paul-b-jr
