      when: Aug. 20
      date: '1964-08-20'
      thread: elections-1964
      c: 'Johnson to Humphrey by telephone, 9:20 a.m.: "You need to stop Joe Rauh before this goes too far. [James] Farmer
        and King are out of control. ... Let them have a modest demonstration like at San Francisco. ... If you and Reuther
        and Joe Rauh don''t step in now and say, ''This is going to elect Goldwater,'' it will be too late."'
      n: '[[w.kotz-judgment-days]], 201. To check: [Johnson and Humphrey, 9:20 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-and-telephone-operator-august),
