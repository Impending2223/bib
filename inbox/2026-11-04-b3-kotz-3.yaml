      when: Aug. 20
      date: '1964-08-20'
      thread: elections-1964
      c: 'Johnson to Wirtz by telephone, 11:19 a.m.: "If the liberals weren''t in charge, and didn''t have the president,
        and didn''t have the vice president, and didn''t have the platform, and didn''t have everything they want, they ought
        to do this"; "Those Communists are moving in on King, and King''s moving in on Rauh."'
      n: '[[w.kotz-judgment-days]], 195–96. To check: [Johnson and Wirtz, 11:19 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-willard-wirtz-and-office-conversation-august),
        Conversation WH6408-29-5048 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 195–96 nn.21, 23). Names:
        Johnson, Wirtz, Martin Luther King, Rauh.'
      src:
