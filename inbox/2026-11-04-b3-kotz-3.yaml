      - name:rauh-joseph-l-jr
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1964-08-21.elections-1964-3
      when: Aug. 21
      date: '1964-08-21'
      thread: elections-1964
      c: 'Johnson to Reuther by telephone, 8:56 p.m.: his plan for Mississippi, each regular to take a loyalty oath to be
        seated, the Freedom Democrats seated as honored guests without votes, and from 1968 no delegation seated that excludes
        by race. "We''re having trouble up in Atlantic City with your man Rauh." Reuther: "If he doesn''t come through on
        this, he won''t be my lawyer."'
      n: '[[w.kotz-judgment-days]], 201–02. To check: [Johnson and Reuther, 8:56 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-reuther-august-22-1964),
        Conversation WH6408-32-5112 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 201–02 nn.39, 41). See
        [[cal.1964-08-17.elections-1964]]. Names: Johnson, Reuther, Rauh.'
      src:
        c: 3727a751
        rows:
        - 'w.kotz-judgment-days 201–02: all'
        - 'via x.1964-08-21.lbj-phone-call-with-walter-reuther-8: all'
      tags:
      - name:johnson-lyndon-b
      - name:reuther-walter
      - name:rauh-joseph-l-jr
