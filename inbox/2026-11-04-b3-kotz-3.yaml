      id: cal.1964-08-25.elections-1964-8
      when: Aug. 25
      date: '1964-08-25'
      thread: elections-1964
      c: 'Johnson to Russell at Winder by telephone, 8:15 a.m.: he has "reached a decision"; the Negro leaders have "taken
        over the convention"; he will tell it "to get some fresh figure to nominate and elect"; bitter at Massachusetts''s
        members of the Credentials Committee and at King. Russell: "speaking like a child—and a spoiled one at that"; "take
        a tranquilizer and get a couple of hours'' sleep." By Russell''s notes.'
      n: '[[w.kotz-judgment-days]], 212–13. To check: "Handwritten notes of Richard Russell," Aug. 25, 1964, Russell Library
        (cited by [[w.kotz-judgment-days]], 213 n.60). See [[cal.1964-08-25.elections-1964-2]]. Names: Johnson, Russell, Martin
        Luther King.'
      src:
