      when: Aug. 14
      date: '1964-08-14'
      thread: elections-1964
      c: 'Johnson and Rowe by telephone, 6:35 p.m., and with O''Donnell, on the Credentials Committee: eleven members counted
        for the Freedom Democrats, each delegate and delegation a "problem" to be worked.'
      n: '[[w.kotz-judgment-days]], 203. To check: [Johnson and Rowe, 6:35 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-james-rowe-august-14-1964),
