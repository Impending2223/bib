- edit:
    id: cal.1964-11-28.vietnam
    base: 77a80fda
    set:
      c: 'Press conference at the Ranch. Expansion into Laos or North Vietnam? "When you crawl out on a limb, you always have
        to find another one to crawl back on"; talk of a decision "somewhat premature." "The only thing we need to do to end
        our real problem in that area is for some folks out there to leave their neighbors alone." Hoover and King: both "have
        exercised their freedom of speech on occasions"; "My problem is to try to prevent the strong divisions that could
        come to pass from time to time, instead of provoke them."'
      n: 'The President''s News Conference at the LBJ Ranch, [1963–64 Pub. Papers 1611](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=851),
        1615, 1617 (Nov. 28, 1964). [[w.mann-grand-delusion]], 381 (Vietnam); [[w.kotz-judgment-days]], 231 (Hoover and King).
        Names: Johnson, Hoover, Martin Luther King.'
      also:
      - civil-rights-the-executive
      tags:
      - name:johnson-lyndon-b
      - name:hoover-j-edgar
      - name:king-martin-luther-jr
      src:
