- add:
    entry:
      id: cal.1964-08-01.king
      when: Aug. 1
      date: '1964-08-01'
      thread: king
      also:
      - democratic-party
      c: 'Jenkins to DeLoach by telephone: the President concerned for his safety and his staff''s at the convention; would
        DeLoach head a team "to keep us advised of any potential threats"? Hoover to DeLoach: "Lyndon is way out of line";
        "tell Walter we will give him whatever help he wants." The President''s wish: all the FBI could gather on the Freedom
        Democrats, their sixty-eight delegates, and SNCC, CORE and the SCLC. By DeLoach''s account.'
      n: '[[w.kotz-judgment-days]], 199. To check: [[w.deloach-hoovers-fbi]], 3–5 (cited by [[w.kotz-judgment-days]], 199
        n.33).. Names: Jenkins, DeLoach, Hoover.'
      src:
        c: 2ddbf596
        rows:
        - 'w.kotz-judgment-days 199: all'
      tags:
      - name:jenkins-walter-w
      - name:deloach-cartha
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1964-08-06.democratic-party
      when: Aug. 6
      date: '1964-08-06'
      thread: democratic-party
      also:
      - mississippi
      c: 'The Oval Office: Johnson with Valenti, Jenkins, Moyers, O''Donnell, O''Brien, Bailey and Rowe on the Freedom Democrats''
        challenge, the day of their State convention. Valenti: unless settled it would "surface like a ticking time bomb on
        the convention floor." Johnson: "Get those problems settled. ... Organize yourselves, get a sensible plan, and then
        come back and talk to me!" By Valenti''s account.'
      n: '[[w.kotz-judgment-days]], 190. To check: [[w.valenti-very-human-president]], 201–03 (cited by [[w.kotz-judgment-days]],
        190 n.5). See [[cal.1964-08-06.mississippi]]. Names: Johnson, Valenti, Jenkins, Moyers, O''Donnell, O''Brien, Rowe.'
      src:
        c: 85c51405
        rows:
        - 'w.kotz-judgment-days 190: all'
      tags:
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:jenkins-walter-w
      - name:moyers-bill
      - name:odonnell-kenneth-p
      - name:obrien-lawrence-f
      - name:rowe-james-h-jr
- add:
    entry:
      id: cal.1964-08-09.elections-1964-2
      when: Aug. 9
      date: '1964-08-09'
      thread: elections-1964
      c: 'Johnson to Connally by telephone, 9:45 a.m., on word that forty to fifty Democratic precinct chairmen in Houston
        will back Goldwater: "If I don''t carry but one state in the Union, it''s got to be this one"; if Texas does not want
        the presidency, "we can turn it over to Bobby Kennedy."'
      n: '[[w.kotz-judgment-days]], 194. To check: [Johnson and Connally, 9:45 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-connally-august-9-1964),
        Conversation WH6408-15-4844 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 194 n.17). Names: Johnson,
        Connally, Goldwater, Robert Kennedy.'
      src:
        c: 3d0f322f
        rows:
        - 'w.kotz-judgment-days 194: all'
        - 'via x.1964-08-09.johnson-and-connally-telephone-9-45: all'
      tags:
      - name:johnson-lyndon-b
      - name:connally-john
      - name:goldwater-barry-m
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-08-13.king
      when: Aug. 13
      date: '1964-08-13'
      thread: king
      c: 'The FBI''s tap on King: King to Clarence Jones, the leaders'' moratorium on demonstrations "a wise thing, because
        change occurs in the North through political power and nothing else." Jones: some "acting as if they are paid agents
        to disrupt the movement."'
      n: '[[w.kotz-judgment-days]], 197–98. To check: "Communist Influence in Racial Matters," FBI Bufile 100-3-116, Aug.
        13, 1964 (cited by [[w.kotz-judgment-days]], 197 n.29). Names: Martin Luther King.'
      src:
        c: 7fa32d19
        rows:
        - 'w.kotz-judgment-days 197–98: all'
        - 'via x.1964-08-13.fbi-tap-king-and-jones-moratorium: all'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-08-14.king
      when: Aug. 14
      date: '1964-08-14'
      thread: king
      also:
      - elections-1964
      c: 'The FBI reports to the White House, from its tap, King''s instructions to Rustin for his talk with Lee White: "Lyndon
        Johnson needs the Negro vote. He feels we have no way to go, but we can certainly stay home." Rustin to White: Negro
        voters might "sit on their hands" in November.'
      n: '[[w.kotz-judgment-days]], 191. To check: "Communist Influence in Racial Matters," FBI Bufile 100-3-116 (cited by
        [[w.kotz-judgment-days]], 191 n.11). Check: the day of Rustin''s talk with White. See [[cal.1964-08-13.king]]. Names:
        Martin Luther King, Rustin, White.'
      src:
        c: cc44b92a
        rows:
        - 'w.kotz-judgment-days 191: all'
        - 'via x.1964-08-14.fbi-report-king-instructions-to-rustin: all'
      tags:
      - name:king-martin-luther-jr
      - name:rustin-bayard
      - name:white-lee-c
- add:
    entry:
      id: cal.1964-08-14.elections-1964-3
      when: Aug. 14
      date: '1964-08-14'
      thread: elections-1964
      c: 'Johnson to Humphrey by telephone, 8:25 p.m.: "You''ve got Martin Luther King, the Communists have got hold of him,
        and they''re managing and directing him every day. ... [M]embers of [his] organization are calling up here and asking
        us to do things for them and their Mississippi Freedom Party every day!"'
      n: '[[w.kotz-judgment-days]], 196. To check: [Johnson and Humphrey, 8:25 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-august-15-1964),
        Conversation WH6408-20-4938 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 196 n.26). See [[cal.1964-08-14.elections-1964-2]].
        Names: Johnson, Humphrey, Martin Luther King.'
      src:
        c: dd49cdad
        rows:
        - 'w.kotz-judgment-days 196: all'
        - 'via x.1964-08-14.johnson-and-humphrey-telephone-8-25: all'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:king-martin-luther-jr
