        Names: Johnson, Humphrey, Rauh, Farmer, Martin Luther King, Reuther.'
      src:
        c: 8954e5d3
        rows:
        - 'w.kotz-judgment-days 201: all'
        - 'via x.1964-08-20.johnson-and-humphrey-telephone-9-20: all'
