      id: cal.1964-07-28.democratic-party
      when: July 28
      date: '1964-07-28'
      thread: democratic-party
      c: 'Johnson to Boggs by telephone, 8:17 p.m., asking him to be the convention''s parliamentarian, "to try to anticipate
        Mississippi": "I''ve got to have somebody I can depend on—day or night, right or wrong." Boggs: "Mr. President, I
        just rule for Johnson. Period!"'
      n: '[[w.kotz-judgment-days]], 198. To check: [Johnson and Boggs, 8:17 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hale-boggs-july-29-1964),
        Conversation WH6407-16-4377 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 198 n.32). See [[cal.1964-07-14.democratic-party]].
        Names: Johnson, Boggs.'
