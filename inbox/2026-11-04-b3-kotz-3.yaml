      c: 'Dinner at the White House. Johnson to Russell: "hours each night" reading the FBI''s wiretap reports, King''s talks
        with Rauh on the Freedom Democrats among them. Russell''s notes: "Hoover apparently has been turned loose and is tapping
        everything"; "he loves it."'
      n: '[[w.kotz-judgment-days]], 200. To check: "Handwritten notes of Richard Russell," Aug. 20, 1964, Russell Library
        (cited by [[w.kotz-judgment-days]], 200 n.35). Names: Johnson, Russell, Martin Luther King, Rauh, Hoover.'
