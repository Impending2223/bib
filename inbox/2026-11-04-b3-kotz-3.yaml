    entry:
      id: cal.1964-07-14.democratic-party
      when: July 14
      date: '1964-07-14'
      thread: democratic-party
      c: 'Johnson to McCormack by telephone, 9:20 a.m., asking him to be the convention''s permanent chairman: "With the Mississippi
        delegate challenge coming up, I think it''s important that I have a man that loves me and that I can trust."'
      n: '[[w.kotz-judgment-days]], 198. To check: [Johnson and McCormack, 9:20 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-john-mccormack-july-14-1964),
        Conversation WH6407-08-4224 (Miller Center), not heard (cited by [[w.kotz-judgment-days]], 198 n.31). Check: Kotz''s
        note dates the call July 13, the hour queried; the catalogue, July 14. Names: Johnson, McCormack.'
      src:
        c: bd94b4d2
        rows:
        - 'w.kotz-judgment-days 198: all'
