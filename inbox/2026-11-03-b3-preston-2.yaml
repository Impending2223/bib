# Batch 3 resumed (Nov. 3-4, 2026), reader "advisers": Preston, *The War Council* (w.preston-war-council), its
# witness layer. b3-preston (Oct. 29) was merged without it (its 543 `via` rows dropped: no witness registered). The
# witnesses: inbox/witnesses/2026-11-03-b3-preston-2.yaml; the edges: sources/witnesses/by-work/preston-war-council.yaml.
# Each map row ties a note's item to the units the first run gave it, read again against the note: a row whose note was
# the wrong one moved to the right note (111 n.29, 174 n.41); a row on a work in the catalogue left out (a card is no
# witness row; the edge is kept). Letters after a note number follow the note's order of items. One edit: the Heeney
# cable of Nov. 27, 1961, is Preston's p. 87, the note cited 85.
patch: b3-preston-2
by: Claude (batch 3 resumed, advisers group; Preston, The War Council)
ops:
- add:
    entry:
      id: cal.1966-03-01.transition-and-staff
      when: Mar. 1
      date: '1966-03-01'
      thread: transition-and-staff
      c: McGeorge Bundy president of the Ford Foundation, having left the White House in February.
      n: '[[w.preston-war-council]], 237 (left in February), 240 (the Ford Foundation from Mar. 1). See [[cal.1965-11-07.transition-and-staff]]. Names: Bundy.'
      tags:
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1965-03.vietnam-support
      when: Mar.
      date: 1965-03
      thread: vietnam-support
      c: 'Bundy to Johnson, for a speech tying his policy in Vietnam to Kennedy''s: it would "give us protection and encouragement with some of the ''liberals'' who are falsely telling each other that your
        policy is different from his."'
      n: '[[w.preston-war-council]], 130. To check: [[w.small-johnson-nixon-and-the]], 40; [[w.reeves-president-kennedy]], 660–61 (cited by [[w.preston-war-council]], 130 n.6). Names: Bundy, Johnson, Kennedy.
        Check: the day; Preston gives March 1965 and names no document.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-09.vietnam-2
      when: Sept.
      date: 1963-09
      thread: vietnam
      c: 'Thomson to Bowles: "People in our government are finally doing the right things and thinking the right thoughts, albeit many years too late." Lodge "absolutely superb from the moment of his arrival
        at the post; tough, decisive, with a clear sense of purpose."'
      n: '[[w.preston-war-council]], 185. To check: [[w.bowles-promises-to-keep]], 272, 290–91, 293, 296 (cited by [[w.preston-war-council]], 185 n.69). Names: Thomson, Bowles, Lodge. Check: the day, and
        where the letter is; Preston''s note names none.'
      tags:
      - name:thomson-james-c-jr
      - name:bowles-chester
      - name:lodge-henry-cabot
- edit:
    id: cal.1961-11-27.vietnam-2
    base: 11e471db
    set:
      n: '[[w.preston-war-council]], 87. To check: Heeney to Ottawa, Nov. 27, 1961, RG 25, vol. 4668, file 50052-A-13–40, pt. 2, National Archives of Canada (cited by [[w.preston-war-council]], 87 n.31).
        Names: Heeney, Rostow. Check: the day of the talk. The passage is Preston''s p. 87, not 85.'
      src:
        c: 599c8360
        rows:
        - 'w.preston-war-council 87: all'
        - 'via w.preston-war-council 87 n.31c: all'
