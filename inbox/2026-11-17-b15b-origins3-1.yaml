      when: Oct., mid
      date: 1961-10
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhou Enlai leads the Chinese party''s delegation to the Twenty-second Congress, with Peng Zhen and Kang Sheng, and Tao Zhu: the Russians offer a plane, then balk at its carrying the Albanian first vice-premier Manush Myftiu too, and Zhou hires one; the delegation lays a separate wreath at the mausoleum, "Dedicated to the great Marxist, Comrade Stalin." Peng Zhen tells the ambassador, Liu Xiao, that friendly relations between the two countries must be preserved even if the quarrel between the parties becomes very fierce.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 126–128. Made public: 1997. To check: Origins II, pp. 92–100, 132–5 (cited by [[w.macfarquhar-origins-of-the-cultural]], 126 n.45a); Chu Shi Sulian Ba Nian, pp. 31–9, 78–82 (cited by [[w.macfarquhar-origins-of-the-cultural]], 126 n.45b); The Sino-Soviet Dispute, p. 72 (cited by [[w.macfarquhar-origins-of-the-cultural]], 127 n.46a); Nongye Jitihua Zhongyao Wenjian Huibian (1958–1981), p. 584 (cited by [[w.macfarquhar-origins-of-the-cultural]], 127 n.47); The Sino-Soviet Conflict, 1956–1961, p. 371 (cited by [[w.macfarquhar-origins-of-the-cultural]], 127 n.48); Quan Yanchi, Tao Zhu he tade Qinren: Niier Yanzhongde Fugin, p. 113 (cited by [[w.macfarquhar-origins-of-the-cultural]], 127 n.49); Survey of China Mainland Press, pp. 23, 45–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], 127 n.51b); Origins I, pp. 39–41, 43–8 (cited by [[w.macfarquhar-origins-of-the-cultural]], 128 n.52). Names: Zhou Enlai, Peng Zhen, Kang Sheng, Tao Zhu. Check: the days.'
