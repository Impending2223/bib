      id: cal.1960-12.china-leadership-3
      when: Dec.
      date: 1960-12
      thread: china-leadership
      c: Zhou Enlai and Chen Yun persuade the Standing Committee to buy grain abroad. Supplies for Peking, Tianjin, Shanghai, Shenyang and other cities stand at a few days', in some at one; the big cities' monthly cooking-fat ration is 3.5 oz.
      n: '[[w.macfarquhar-origins-of-the-cultural]], 23. Made public: 1997. To check: Dangdai Zhongguode Liangshi Gongzuo, p. 253 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.3a); Zhonggong Dangshi Renwuzhuan (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.3b); Origins II, pp. 163–70 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.5); Xinhua Yuebao, No. 11, 1989, p. 50 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.6). Names: Zhou Enlai, Chen Yun. Check: the day.'
      tags:
