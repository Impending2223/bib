- add:
    entry:
      id: cal.1961-05.china-leadership
      when: May
      date: 1961-05
      thread: china-leadership
      c: 'The first Sino-Canadian wheat agreement: a maximum of 5,081,000 tonnes of wheat and 46.7 million bushels of barley, June 1961 to December 1963; 762,000 tonnes of wheat and 17 million bushels of barley by Nov. 30.'
