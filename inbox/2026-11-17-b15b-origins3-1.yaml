      c: 'The first grain ships dock in Chinese ports: 500,000 tonnes arrive in the first quarter, 1.65 million in the second, for Peking, Shanghai, Tianjin, Liaoning and the worst-hit areas.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 27. Made public: 1997. To check: Dangdai Zhongguode Liangshi Gongzuo, p. 123 (cited by [[w.macfarquhar-origins-of-the-cultural]], 27 n.34).'
