      when: June 28
      date: '1961-06-28'
      thread: china-leadership
      c: 'The Center''s circular on rusticating workers: those who started work since January 1958, temporary, contract, apprentice and regular, go home to the farms, except where vital; earlier arrivals may go voluntarily. Wages: half a month to those leaving before the middle of a month; severance by length of service, from none to 2.5 months; the units pay.'
