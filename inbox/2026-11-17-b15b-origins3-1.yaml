      when: June 15
      date: '1961-06-15'
      thread: china-leadership
      c: 'The revised Sixty Articles on Agriculture are issued: only eight articles unchanged; mess-halls allowed to close and the supply system ended except for cases of need; secret ballot for the commune''s bodies; private plots from 5 to 7 per cent; peasants own their houses in perpetuity; the team no longer in control of livelihood.'
