    entry:
      id: cal.1960-09-30.china-leadership-2
      when: Sept. 30
      date: '1960-09-30'
      thread: china-leadership
      c: 'The State Planning Commission''s report on the control figures for the 1961 plan carries Li Fuchun''s slogan "adjustment, consolidation, improvement," with Zhou Enlai''s added "filling out": the eight characters gain currency.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 11. Made public: 1997. To check: Origins II, p. 323 (cited by [[w.macfarquhar-origins-of-the-cultural]], 11 n.3a); CCP CC Party History Research Centre (cited by [[w.macfarquhar-origins-of-the-cultural]], 11 n.3b); Liu Shaoqi Xuanji, p. 357 (cited by [[w.macfarquhar-origins-of-the-cultural]], 11 n.4). Names: Zhou Enlai, Li Fuchun.'
      tags:
