- add:
    entry:
      id: cal.1960-12.china-leadership-4
      when: Dec., late
      date: 1960-12
      thread: china-leadership
      c: At Peking airport, as Zhou Enlai leaves for Burma, Zhou, Chen Yun and Ye Jizhuang, Minister of Foreign Trade, fix the grain import at 1.5 million tonnes; at Kunming a phone message makes it 2.5 million, which Chen Yun, called, says is essential.
      n: '[[w.macfarquhar-origins-of-the-cultural]], 23. Made public: 1997. To check: [[w.zhou-enlai-nianpu-1949]] (Zhou at Kunming, Dec. 31); Home News Library, Xinhua News Agency (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.7); Zhonggong Dangshi Renwuzhuan, 45, pp. 273–6 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.8); Bujinde Sinian, pp. 253–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.9a); Kaiguo Zongli Zhou Enlai, pp. 376–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.9b). Names: Zhou Enlai, Chen Yun. Check: the day.'
      tags:
