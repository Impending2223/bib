- add:
    entry:
      id: cal.1960-11-24.china-leadership
      when: Nov. 24–Dec. 12
      date: '1960-11-24'
      thread: china-leadership
      c: 'Peking. The Central Committee''s Culture and Education Small Group (Lu Dingyi, chairman; Kang Sheng, deputy) holds a national work conference with central and provincial officials: politics and professional work, quality and quantity, culture in the service of agriculture. Its statement for 1961 goes to the Secretariat, which approves it in February.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 90–91, 103. Made public: 1997. To check: Zhonghua Renmin Gongheguo Jiaoyu Dashiji, 1949–82 (cited by [[w.macfarquhar-origins-of-the-cultural]], 91 n.6a); Dou Pi Gai Tongxun, No. 16, p. 12 (cited by [[w.macfarquhar-origins-of-the-cultural]], 103 n.79). Names: Lu Dingyi, Kang Sheng.'
      tags:
      - polity:prc
      - name:lu-dingyi
      - name:kang-sheng
      - vis:only:prc
      src:
