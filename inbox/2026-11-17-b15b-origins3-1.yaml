      when: May 17
      date: '1961-05-17'
      thread: china-leadership
      c: 'Li Xiannian to Mao, a long letter: imports for 1962 must be 5 million tonnes, not 3.5; compulsory purchases for 1961–62 are 42 million tonnes, not the 44 million agreed at Canton; the deficit from home sources 7.5 million, of which imports cover 5. He suggests reducing the urban population.'
