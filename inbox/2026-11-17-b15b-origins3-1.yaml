- add:
    entry:
      id: cal.1960-12.china-leadership-2
      when: Dec.
      date: 1960-12
      thread: china-leadership
      c: 'Qian Ying, formerly Minister of Internal Affairs, and Rong Zihe, a former Vice-Minister of Finance, investigate Gansu: the claimed grain output of 7 billion catties is in fact 4 billion; the county secretaries, too frightened to say so, are pressed by the Northwest Bureau''s official to accept the first secretary''s figure.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 12. Made public: 1997. To check: Womende Zhou Zongli (cited by [[w.macfarquhar-origins-of-the-cultural]], 12 n.12a).'
      tags:
      - polity:prc
      - vis:only:prc
      src:
        c: 57abccb5
        rows:
        - 'w.macfarquhar-origins-of-the-cultural 12: all'
        - 'via x.undated.womende-zhou-zongli: all'
- add:
