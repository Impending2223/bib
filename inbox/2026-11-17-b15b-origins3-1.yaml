      when: Dec. 3
      date: '1960-12-03'
      thread: china-leadership
      c: The Center's emergency directive on steel urges one final push; in it Mao says the national honour is at stake. Output for the year, 18,660,000 tons.
      n: '[[w.macfarquhar-origins-of-the-cultural]], 11–12. Made public: 1997. To check: Origins II (cited by [[w.macfarquhar-origins-of-the-cultural]], 12 n.8a); Zhonggong Dangshi Jiaoxue Cankao Ziliao (cited by [[w.macfarquhar-origins-of-the-cultural]], 12 n.8b). Names: Mao Zedong.'
