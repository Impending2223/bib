      id: cal.1961-01-02.china-leadership
      when: Jan. 2–9
      date: '1961-01-02'
      thread: china-leadership
      c: 'Zhou Enlai in Burma: independence day, the exchange of the instruments of ratification of the Sino-Burmese boundary treaty, an interest-free loan of £30 million. Lei Renmin, a Vice-Minister of Foreign Trade, goes with him, and on to Hong Kong to check the grain, shipping and exchange.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 23. To check: Home News Library, Xinhua News Agency (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.7); Bujinde Sinian, pp. 253–4 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.9a); Kaiguo Zongli Zhou Enlai, pp. 376–7 (cited by [[w.macfarquhar-origins-of-the-cultural]], 23 n.9b). Names: Zhou Enlai.'
