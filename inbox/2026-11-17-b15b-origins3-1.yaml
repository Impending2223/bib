      id: cal.1960.china-leadership
      when: 1960, second half
      date: '1960'
      thread: china-leadership
      c: Mao tells Li Fuchun and Bo Yibo that 70 million people should be thrown into a mass steel campaign that winter, for 22 million tons.
      n: '[[w.macfarquhar-origins-of-the-cultural]], 11. Made public: 1997. To check: Origins II (cited by [[w.macfarquhar-origins-of-the-cultural]], 11 n.6); Zhonggong Dangshi Jiaoxue Cankao Ziliao (cited by [[w.macfarquhar-origins-of-the-cultural]], 12 n.8b). Names: Mao Zedong, Li Fuchun, Bo Yibo. Check: the day.'
