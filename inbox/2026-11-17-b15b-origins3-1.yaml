      when: July 6
      date: '1961-07-06'
      thread: china-leadership
      c: 'The Politburo hears Nie Rongzhen and Zhang Jingfu on the Fourteen Articles on Science; Mao absent. Liu Shaoqi: there have been deviations, to be admitted and rectified; Zhou Enlai approves and asks that it go also through the finance, trade, culture and education systems; Deng Xiaoping: cadres should be the scientists'' orderlies; Kang Sheng wants more on Marxism-Leninism leading science. Peng Zhen and Li Fuchun also approve; quotations from Nie''s memoir and a Cultural Revolution denunciation.'
