      when: May 31
      date: '1961-05-31'
      thread: china-leadership
      c: 'Chen Yun to the Central Work Conference: four policies for the food problem: grain imports; the Sixty Articles; industrial support for agriculture; and the move of urban residents to the countryside, at once. Each person sent back needs 75 kg. less state grain: 750,000 tonnes if 10 million go, 1.5 million if 20. Liu Shaoqi warns of the Soviet Union in 1921.'
      n: '[[w.macfarquhar-origins-of-the-cultural]], 30–32. Made public: 1997. To check: Chen Yun Tongzhi Wengao Xuanbian (1956–1962), pp. 120–1 (cited by [[w.macfarquhar-origins-of-the-cultural]], 31 n.46); Origins II, p. 329 (cited by [[w.macfarquhar-origins-of-the-cultural]], 31 n.49); 1949–1989 Niande Zhongguo 2: Quzhe Fazhande Suiyue, p. 382 (cited by [[w.macfarquhar-origins-of-the-cultural]], 32 n.54). Names: Chen Yun, Liu Shaoqi.'
