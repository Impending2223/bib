      when: Jan. 18
      date: '1961-01-18'
      thread: china-leadership
      c: The State Council's General Office on Finance and Trade (director, Li Xiannian) gives the central leadership its opinion that 4 million tonnes of grain must be imported, besides 1 million for re-export.
      n: '[[w.macfarquhar-origins-of-the-cultural]], 24. Made public: 1997. To check: China''s Economic System (cited by [[w.macfarquhar-origins-of-the-cultural]], 24 n.10); Zhonghua Renmin Gongheguo Jingji Dashiji, p. 296 (cited by [[w.macfarquhar-origins-of-the-cultural]], 24 n.11). Names: Li Xiannian.'
