      c: 'The Presidium on the sale of arms to Somalia, stenographed. Khrushchev: the talk with Prime Minister Shermarke was misjudged; he wants more arms to turn against the Emperor and Kenya. "Зачем им 120 танков, к тому же бесплатно?" (why do they need 120 tanks, and free?). The matter to be held back and the position reviewed, someone sent to talk to him; Soviet arms not to set African states against one another, a flexible line so as not to push Somalia away.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 802 (the stenogram: the heading, "Вопрос по Сомали"; no decision recorded); I, 1157 nn.20–23 (the editors: Shermarke in the USSR in July 1963; Kenya independent Dec. 12, 1963; the Somali–Ethiopian border fighting of Feb. 1964, Khrushchev''s message to Shermarke and the Emperor, Feb. 10, 1964). See [[cal.1963-10-01.africa]]. Made public: 2003. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      - polity:ussr
      - vis:only:ussr
