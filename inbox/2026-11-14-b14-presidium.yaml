patch: 2026-11-14-b14-presidium
by: 'Claude (Sonnet), batch 14, reader 4, Nov. 14, 2026: the Presidium''s stenograms passed over (notes/book-checks/prezidium-tsk-kpss-1954.md, "Batch 14")'
ops:
- edit:
    id: cal.1960-12-16.soviet-union-leadership
    base: 780752da
    set:
      c: 'The enlarged Presidium on agriculture, stenographed, the republics'' leaders and Lysenko there. Khrushchev on his note: needs rising with wages, the economy to meet them. Irrigated land to be found, 3 million hectares of rice by 1965 and more by 1970, in Central Asia, Kazakhstan, Azerbaijan, the Volga delta, the Manych and the North Caucasus; pumps, not gravity; Lysenko for rice. Gosplan''s 30–35 billion rubles for the seven-year plan''s farm capital too little, perhaps 70; steel at the plan''s 86 million tons by 1965 if need be, not Gosplan''s 96; Novikov rebuked for revising the Congress. Not to build communism on "moral factors" like the Chinese, "болтовня о коммунизме, а брюхо подтягивай" (talk of communism, and tighten your belly); Liu Shaoqi had told him the Chinese would give farming more heed. In the notes: the Ukrainians first under fire, Poltava, Chernigov, Sumy; Georgia''s sheep; fraud in Ryazan; fewer museums and stadiums, no flowers for Moscow. In the stenogram too: no memorials and no music schools in collective farms; Kiev''s new palace and street lamps; the RSFSR Supreme Soviet''s session on nature protection a mistake, Paustovsky''s article in *Izvestia* answered. Matskevich: Gosplan and the Ministry to recount and report. Khrushchev: the reports and theses for the plenum to be recast. Resolved: his proposals on farming and on reorganizing the Ministry of Agriculture approved; the republics to draft measures, Gosplan and Matskevich to sum them up.'
      n: 'Protocol 311, item I. [[w.prezidium-tsk-kpss-1954]], I, 448–49 (Malin''s notes), 450–74 (the stenogram: the steel and the 70 billion, 451–52; the Chinese and Liu Shaoqi, 453; irrigation and rice, 453–57; Poltava and the Ukrainians, 465–66; memorials, the palace, Paustovsky, music schools, 471–73; Matskevich, 474), 1081–82 nn.1–7 (the Ryazan pledges and Larionov); III, 139 (P 311/I). Made public: 2003. Names: Lysenko, Khrushchev, Matskevich, Novikov.'
- edit:
    id: cal.1963-06-07.soviet-union-leadership
    base: f3de8185
    set:
      c: 'The Presidium. Khrushchev, stenographed, on his talks with Castro in the south: Castro asked what divides Moscow from Peking; "nationalism" and the wish to be first violin. "говорят, что мы струсили. Но если мы струсили, так зачем же мы тогда на Кубу поставили ракеты?" (they say we lost our nerve; but if so, why did we put missiles in Cuba?); Castro had thought them put there for the whole camp; a military treaty not to his advantage, a communiqué instead. A Cuban steel works doubtful, no coking coal, the cans wanted for preserves; Khrushchev feared becoming Guevara''s enemy; the Program''s dropping of the dictatorship of the proletariat, which the Chinese attack, defended. A cane-harvesting machine to be made in two years. He will go to Cuba around Jan. 1. Then his visit to Yaroslavl: the tire works littered, rubber stored in the open, a quarter of the tires still on cotton cord; the engine-oil additives and Gosplan; the technical councils at works to be thought of. Approved, the talks "вполне хорошими" (quite good). Podgorny and Brezhnev to be Central Committee secretaries, Brezhnev leaving the Supreme Soviet''s chair. Lesechko faulted on the Comecon meeting, the Romanians. On a KGB note, Zhukov to be called in and warned: if he does not understand, expulsion and arrest.'
      n: 'Protocol 100. [[w.prezidium-tsk-kpss-1954]], I, 719–20 (doc. 292, Malin''s notes), 720–32 (doc. 293, the stenogram of items I and II, its opening and the rest of the session not stenographed: Castro and China, 720; the missiles, 720–21; the treaty, 722; the steel works and Guevara, 722–23; the Program, 723; the cane machine, 724; Jan. 1, 725–26; Yaroslavl, 726–31; the councils, 731); III, 534–36 (P 100/I–II; the KGB''s note of May 27, Semichastny''s, not printed). See [[cal.1963-05-05.cuba]]. Made public: 2003. Names: Khrushchev, Castro, Guevara, Podgorny, Brezhnev, Lesechko, Zhukov.'
- edit:
    id: cal.1963-12-23.soviet-union-leadership
    base: f769fb07
    set:
      c: 'The Presidium, the same session as the schools. The December plenum''s decisions on chemistry: Khrushchev asks Gosplan, the chemists and industry for an inventory of the plants in fertilizers, herbicides, fibres and plastics against the world''s level, and a list of what to buy abroad before buying; the fertilizer in the plan two thirds "concentrated" and a third of ballast; a chemical industry on Sakhalin oil and gas, for Japan''s trade, and a plant in northern Kirghizia. Tasks to be assigned, letters by branch to the party organizations, the VSNKh not to be supplanted. The delegation to Cuba for the revolution''s fifth anniversary, under Podgorny: its trip to be announced by radio Dec. 23 and in the press Dec. 24, "Почему раньше не опубликовали?" (why was it not published before?); the greeting to repeat Cuba''s position on the base at Guantánamo and its four or five conditions; gifts, Castro''s apart.'
      n: 'Protocol 126, items I and XI. [[w.prezidium-tsk-kpss-1954]], I, 781–82 (doc. 304, Malin''s notes), 783–802 (doc. 305, the stenogram on chemistry; Sakhalin and Kirghizia, 785–86; Cuba and Algeria not stenographed, 816); III, 622–29 (P 126/I and Malin''s own jottings for it, P 126/XI and the departments'' note, P 126/XII on the gifts). See [[cal.1963-12-23.soviet-union]], [[cal.1963-12-04.cuba]]. Made public: 2003. Names: Podgorny, Castro, Khrushchev.'
