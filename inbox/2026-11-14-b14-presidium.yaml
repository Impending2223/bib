      c: 'The Presidium on calling the plenum on agriculture, stenographed. Brezhnev reads the draft decision. Khrushchev: the report to put the manager''s skill and the most got from the land, with science, before the plan''s fulfillment; each republic''s bureau to show its level of preparation; the guests to be asked also the growth of farm output. Volovchenko to take a group of agrochemists and soil scientists to the GDR''s agricultural academy and farms, to learn the use of fertilizer and mechanization: "немцы под боком" (the Germans are next door). Next, Cuba and Algeria, not stenographed.'
      n: '[[w.prezidium-tsk-kpss-1954]], I, 815–16 (the stenogram, Brezhnev reading the draft; the rest not stenographed); I, 1158 n.40 (the editors: the enlarged plenum on intensifying agriculture met Feb. 10–15, 1964). See [[cal.1963-12-23.soviet-union-leadership]]. Made public: 2003. Names: Brezhnev, Khrushchev, Volovchenko.'
      tags:
