patch: 2026-11-12-b9-schlesinger-a
by: 'Claude (batch 9: the "already in" rows of Schlesinger, Robert Kennedy and His Times, pp. 205-586), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1960-07-12.elections-1960-los-angeles
      when: July 12
      date: '1960-07-12'
      thread: elections-1960-los-angeles
      c: Los Angeles. Joseph Rauh, laboring to keep Black delegates in line for Kennedy, goes "in some agitation" to Robert Kennedy when the Washington Post's word that Kennedy will probably offer Johnson second place reaches the District of Columbia delegation. Kennedy assures him, as before, that it will definitely not be Johnson.
      n: '[[w.schlesinger-robert-kennedy-and-his]], 208. See [[cal.1960-07-12.press-and-broadcasting]]. Names: Rauh, Robert Kennedy, Kennedy, Johnson. Check: the day; the book gives none, the Post''s story being of Tuesday, July 12.'
      tags:
      - name:rauh-joseph-l-jr
      - name:kennedy-robert-f
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - city:los-angeles
      src:
        c: d5dd3538
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 208: all'
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-2
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'Los Angeles. Herbert Klein, on Nixon''s behalf, reads a curt concession at a press conference Nixon has scheduled; Nixon does not appear. Hyannis Port: someone observes that Nixon might at least have had the decency to appear and thank his voters. Kennedy: "He went out the way he came in — no class."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 220 (the hour not given). See [[cal.1960-11-09.elections-1960]], [[cal.1960-11-08.elections-1960]]. Names: Klein, Nixon, Kennedy. Check: the hour.'
      tags:
      - name:klein-herbert-g
      - name:nixon-richard-m
      - name:kennedy-john-f
      - city:los-angeles
      src:
        c: c701e701
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 220: all'
- add:
    entry:
      id: cal.1962-03-27.court
      when: Mar. 27
      date: '1962-03-27'
      thread: court
      c: 'Robert Kennedy, the Attorney General, on *Baker v. Carr*: "a landmark in the development of representative government."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 397–98 (the Court''s decision of March 1962; Kennedy "promptly" saluted it). To check: New York Times, Mar. 28, 1962 (cited by [[w.schlesinger-robert-kennedy-and-his]], 398 n.28). See [[cal.1962-03-26.court]]. Names: Robert Kennedy. Check: the day; the text has "promptly", its note the Times of Mar. 28.'
      tags:
      - name:kennedy-robert-f
      src:
        c: 9f790ecd
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 398: all'
- add:
    entry:
      id: cal.1961-11.right-and-the-military-3
      when: Nov.
      date: 1961-11
      thread: right-and-the-military
      c: 'After the President''s western speeches. Walter Reuther congratulates him; Kennedy asks what the federal government can do, within the First Amendment, to curb right-wing extremism. Reuther will make recommendations. Kennedy: "Fine. Give them to Bobby. He''s greatly concerned, and I''ve asked him to work on it."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 451 (by Rauh''s account, interview of Oct. 26, 1976, 451 n.22; "On the President''s return"; the day not given). See [[cal.1961-11-16.right-and-the-military]]. Names: Reuther, Kennedy, Robert Kennedy. Check: the day, after the western tour of Nov. 16–18.'
      tags:
      - name:reuther-walter
      - name:kennedy-john-f
      - name:kennedy-robert-f
      src:
        c: 72970ed8
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 451: all'
- add:
    entry:
      id: cal.1962-10-20.cuba
      when: Oct. 20
      date: '1962-10-20'
      thread: cuba
      c: James Donovan, the Democratic Senate candidate in New York, negotiating the Bay of Pigs prisoners' ransom, receives Castro's shopping list.
      n: '[[w.schlesinger-robert-kennedy-and-his]], 471 (in early October Donovan had flown again to see Castro; the place of the list not given). See [[cal.1962-09-17.governors-ny]]. Names: Donovan, Castro. Check: the place.'
      tags:
      - name:donovan-james-b
      - name:castro-fidel
      - state:ny
      src:
        c: cd30eef5
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 471: all'
- add:
    entry:
      id: cal.1961-05-31.latin-america-4
      when: May 31
      date: '1961-05-31'
      thread: latin-america
      c: 'Allen Dulles telephones Robert Kennedy in the morning: the reports of Trujillo''s death not verified. Half an hour later: probably "99 chances out of 100" that he has been assassinated.'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 491–92 (by Kennedy''s notes dictated June 1, "yesterday morning"; the notes add that the United States had been in contact with some anti-Trujillo generals, had decided in the last week or so not to furnish the arms they asked, and had no contact with them now). To check: RFK, notes dictated June 1, 1961, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 491 nn.82, 86). See [[cal.1961-05-30.latin-america]]. Names: Dulles, Robert Kennedy, Trujillo.'
      tags:
      - name:dulles-allen-w
      - name:kennedy-robert-f
      - name:trujillo-rafael
      src:
        c: 9002db94
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 491–92: all'
- add:
    entry:
      id: cal.1962-11-15.missile-crisis-settlement
      when: Nov. 15
      date: '1962-11-15'
      thread: missile-crisis-settlement
      c: 'Robert Kennedy with Dobrynin, after the Russians reject his proposal on the IL-28s: "the most unpleasant conversation I have had with Dobrynin. It made it seem that perhaps I had seen him too frequently."'
      n: '[[w.schlesinger-robert-kennedy-and-his]], 526 (by Kennedy''s memorandum; "Three days after the Bolshoi evening"; he told the President the next day that such talks were good but not "in every day exchanges"). To check: RFK, memorandum, Nov. 30, 1962, RFK Papers (cited by [[w.schlesinger-robert-kennedy-and-his]], 526 n.126). See [[cal.1962-11-12.missile-crisis]], [[cal.1962-11-15.missile-crisis]]. Names: Robert Kennedy, Dobrynin, Kennedy. Check: the day, three days after the Bolshoi evening of Nov. 12; whether this is the talk in which the message of [[cal.1962-11-15.missile-crisis]] was given.'
      tags:
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      src:
        c: 72dd20e2
        rows:
        - 'w.schlesinger-robert-kennedy-and-his 526: all'
- cite:
    id: cal.1960-07-12.elections-1960-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 205 (Johnson''s challenge to a debate before the Texas delegation early in convention week; Joseph Kennedy at Marion Davies''s estate, by Seigenthaler''s account, on Jack as "a damned fool if he goes near him"; Kennedy accepts, by a radio flash; not the telegram, the press conference, the Massachusetts delegation, the hour or the day)'
    units: '?'
- cite:
    id: cal.1960-07-12.press-and-broadcasting
    item: '[[w.schlesinger-robert-kennedy-and-his]], 207–08 (Graham encouraged the Post to report that Kennedy would probably offer Johnson second place; not the day or the words)'
    units: '?'
- cite:
    id: cal.1960-11-08.elections-1960-9
    item: '[[w.schlesinger-robert-kennedy-and-his]], 219 (election night at Hyannis Port: by midnight people wandering restlessly around the communications center in Robert Kennedy''s house; not the sunporch, the hours or the calls)'
    units: '?'
- cite:
    id: cal.1960-11-09.elections-1960-9
    item: '[[w.schlesinger-robert-kennedy-and-his]], 219 (at 3:15 a.m. Robert Kennedy tells his brother to go to bed and sleep well, they had won; no word from Nixon; Pennsylvania and Michigan looking fairly definite; not the Armory, Salinger or the words on conceding)'
    units: '?'
- cite:
    id: cal.1960-11-09.elections-1960-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 219–20 (after breakfast the Kennedys meet informally with some of the staff at the ambassador''s house: more than a third of the States within 2 percent, Nixon expected to challenge, Kennedy calm and to go forward on the assumption he has been elected; not Illinois or the persons present)'
    units: '?'
- cite:
    id: cal.1960-11-09.transition-and-staff
    item: '[[w.schlesinger-robert-kennedy-and-his]], 254 (Kennedy announced "immediately after the election" that he would keep Hoover on, along with Dulles of the CIA; not the day, the place or the other appointments)'
    units: '?'
- cite:
    id: cal.1961-08-30.states-and-cities
    item: '[[w.schlesinger-robert-kennedy-and-his]], 294 (schools "desegregated without violence in New Orleans, Atlanta and Memphis" in September 1961, after Marshall, Doar, Clark, Oberdorfer and Seigenthaler had traveled to confer with local school officials; not the day, the four high schools or Kennedy''s remarks)'
    units: '?'
- cite:
    id: cal.1961-05-19.civil-rights-the-executive
    item: '[[w.schlesinger-robert-kennedy-and-his]], 372 (in May 1961 Congress passed a bill creating seventy-one new judgeships; 128 judicial nominations by mid-October 1962; not the signing, its day or the statute)'
    units: '?'
- cite:
    id: cal.1963-10-14.defense
    item: '[[w.schlesinger-robert-kennedy-and-his]], 384 (Korth, a Johnson protege who had succeeded Connally, found in 1963 to be using Navy stationery, the yacht Sequoia and other facilities for his Fort Worth bank; Robert Kennedy, over Johnson''s protest, recommended his dismissal and the President agreed; not the resignation, its date, the letters or McClellan''s subcommittee)'
    units: '?'
- cite:
    id: cal.1962-03-26.court
    item: '[[w.schlesinger-robert-kennedy-and-his]], 397–98 (Baker v. Carr, March 1962: apportionment a justiciable issue, courts able to provide relief; the Solicitor General''s amicus intervention, asked by Seigenthaler, Hooker and Henry; not the day, the opinion or the votes)'
    units: C
- cite:
    id: cal.1964-06-15.court
    item: '[[w.schlesinger-robert-kennedy-and-his]], 400 (in June 1964 Warren, "speaking for a nearly unanimous Court," ruled that both houses of a State legislature must be apportioned on population; not the case, the day, Alabama or the quotations)'
    units: G
- cite:
    id: cal.1963-02-14.program
    item: '[[w.schlesinger-robert-kennedy-and-his]], 413–14 (in February 1963 the President recommended a national service corps, after Eunice Shriver''s urging, Hackett''s committee, three Saturday-morning cabinet meetings under the Attorney General and Boone''s feasibility study; the Senate passed the legislation in 1963, the House did not; not the day or the message)'
    units: D
- cite:
    id: cal.1961-01-06.berlin-and-vienna
    item: '[[w.schlesinger-robert-kennedy-and-his]], 422 (Khrushchev''s speech of Jan. 6, 1961: communism to triumph neither through world war nor through local war but through "national liberation wars" in the Third World, to be supported by the Soviet Union; not the audience, the eighty-one parties or the word "inevitable")'
    units: B
- cite:
    id: cal.1961-11-16.right-and-the-military
    item: '[[w.schlesinger-robert-kennedy-and-his]], 432 (Kennedy''s November 1961 speaking tour for negotiation: "we have nothing to fear from negotiations at the appropriate time," against "those who urge upon us what I regard to be the pathway to war: equating negotiations with appeasement"; by the note 1961 Pub. Papers 726–27, within the Seattle address; not the "neither omnipotent nor omniscient" passage)'
    units: '?'
- cite:
    id: cal.1961-11-16.right-and-the-military
    item: '[[w.schlesinger-robert-kennedy-and-his]], 450–51 (in November 1961 the President assailed the extremists "in a series of speeches on the west coast": "They call for ''a man on horseback'' ... They find treason in our churches, in our highest court, in our treatment of water"; by the note 1961 Pub. Papers 735, within the Los Angeles address; not the day or the "discordant voices")'
    units: '?'
- cite:
    id: cal.1961-11-16.right-and-the-military
    item: '[[w.schlesinger-robert-kennedy-and-his]], 492 (that month Kennedy in a speech: "We cannot, as a free nation, compete with our adversaries in tactics of terror [and] assassination"; by the note 1961 Pub. Papers 725, within the Seattle address; not the day)'
    units: '?'
- cite:
    id: cal.1961-06-13.cuba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 447–48 (Robert Kennedy''s private notes on the Study Group meetings (the Joint Chiefs'' "really bad work"); the report''s conclusion: the Eisenhower administration should have seen by November 1960 that the American hand could not be kept secret and made the project an overt operation under Defense, or abandoned it; not the day, the shared blame or the Chiefs'' advising)'
    units: '?'
- cite:
    id: cal.1961-06-28.cuba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 458–59 (in National Security Action Memoranda 55 and 57 Kennedy transferred paramilitary operations from the CIA to Defense and sought to restrict the covert operations remaining to the CIA; not the day or the Study Group''s lessons)'
    units: '?'
- cite:
    id: cal.1962-09-17.governors-ny
    item: '[[w.schlesinger-robert-kennedy-and-his]], 471 (Donovan became the Democratic Senate candidate against Javits; Robert Kennedy thought he should retire from the race, other Democrats that he should campaign more; not the day or the convention)'
    units: '?'
- cite:
    id: cal.1960-09-26.congo-lumumba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 481 (in August 1960 the CIA decided to kill Lumumba and delivered a bag of poison to Leopoldville; his murder in January by his countrymen, not the CIA; not Gottlieb or the day)'
    units: '?'
- cite:
    id: cal.1960-08-18.congo-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 485 (in the Lumumba case Eisenhower "said something in a meeting of the National Security Council that at least one person present understood as an assassination order"; the day and the person not given)'
    units: '?'
- cite:
    id: cal.1960-09.cuba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 482–83 (the CIA commissioned Maheu to "put out the contract" on Castro, assassination presented to him as "a necessary ingredient" of the invasion plan; Maheu brought in Rosselli, Rosselli Giancana, Giancana Trafficante; the case officers'' contacts made before Dulles was told; not the Plaza Hotel, Edwards or the day)'
    units: '?'
- cite:
    id: cal.1960-09.cuba-4
    item: '[[w.schlesinger-robert-kennedy-and-his]], 483 (in October Hoover sent Bissell a report that Giancana, "during recent conversations with several friends," said Castro "was to be done away with shortly"; the CIA installed Giancana and Rosselli in a Miami Beach hotel in the fall; not the poison, the Fontainebleau or the FBI''s informant)'
    units: '?'
- cite:
    id: cal.1961-03.cuba
    item: '[[w.schlesinger-robert-kennedy-and-his]], 484 (a first batch of pills failed to dissolve, a more soluble batch Maheu gave with $10,000 to a Cuban of Trafficante''s; a second attempt in April immediately before the Bay of Pigs; Castro survived; not the dates or the Inspector General''s report)'
    units: '?'
- cite:
    id: cal.1961-01-25.cuba-3
    item: '[[w.schlesinger-robert-kennedy-and-his]], 484–85 (in January 1961, before the inauguration, Bissell discussed with Harvey and soon directed him to set up an "executive action capability" for disabling foreign leaders, assassination a "last resort"; not Harvey''s notes, the White House or Bundy)'
    units: '?'
- cite:
    id: cal.1962-04.cuba-2
    item: '[[w.schlesinger-robert-kennedy-and-his]], 485 (in April 1962 Helms, now Bissell''s successor, ordered Harvey to reactivate the Castro project; Harvey told Rosselli to cut out Maheu and Giancana; the plot ended in February 1963)'
    units: A
- cite:
    id: cal.1961-09-29.soviet-union
    item: '[[w.schlesinger-robert-kennedy-and-his]], 501 (Bolshakov delivered to Salinger on Sept. 30, 1961 the first of the letters Khrushchev initiated as the Berlin crisis subsided; passed thereafter at street corners and bars; not the letter''s date, its contents or the Carlyle Hotel)'
    units: '?'
- cite:
    id: cal.1962-11-02.missile-crisis
    item: '[[w.schlesinger-robert-kennedy-and-his]], 525 (Castro refused UN verification of the missiles'' removal and refused to yield the IL-28s; Khrushchev sent Mikoyan to Havana, where Castro kept him waiting so long that Stevenson said Donovan might be sent to get him out; not the day, the length of the stay or the talks)'
    units: '?'
- cite:
    id: cal.1961-12-05.africa
    item: '[[w.schlesinger-robert-kennedy-and-his]], 560 (the NSC faced the Volta decision on Dec. 5, 1961; Robert Kennedy, an NSC regular since the Bay of Pigs, sat along the wall; the President: "The Attorney General has not yet spoken but I can feel the cold wind of his disapproval on the back of my neck"; the President "resolved to go ahead," against the unit''s deferral; not Rusk, Congress or the legal report)'
    units: A
- cite:
    id: cal.1962-04-03.latin-america
    item: '[[w.schlesinger-robert-kennedy-and-his]], 579–80 (Goulart''s visit to Kennedy in April 1962: Kennedy wished Brazil would do more for the Alliance; at Meany''s urging he raised Communist infiltration of Brazilian labor, "delicately"; the ITT expropriation and the Hickenlooper amendment; the invitation to Brazil in July; not the days or the address to Congress)'
    units: A
- cite:
    id: cal.1961-10-25.latin-america
    item: '[[w.schlesinger-robert-kennedy-and-his]], 580 n. (Kennedy to Jagan: "We are not engaged in a crusade to force private enterprise on parts of the world where it is not relevant. If we are engaged in a crusade for anything, it is national independence," from Schlesinger''s journal, which the note dates Oct. 25, 1962; not the hour or the persons present)'
    units: D
- cite:
    id: cal.1961-12-19.transition-and-staff
    item: '[[w.schlesinger-robert-kennedy-and-his]], 586–87 (on Dec. 19, 1961, playing golf at Palm Beach, Joseph P. Kennedy fell sick; an intracranial thrombosis, paralyzing his right leg, arm and face and the hemisphere governing speech; Ann Gargan drove him home, he said "Don''t call any doctors," and he was rushed to the hospital)'
    units: A
- check:
    id: cal.1961-08-30.states-and-cities
    text: 'Check: Schlesinger puts the desegregation of Atlanta''s schools in September 1961 (294); the entry''s Aug. 30.'
- variant:
    id: cal.1961-05-19.civil-rights-the-executive
    unit: A
    witness: w.schlesinger-robert-kennedy-and-his
    reads: In May 1961 Congress passed a bill creating seventy-one new judgeships
    at: '372'
- variant:
    id: cal.1961-12-05.africa
    unit: F
    witness: w.schlesinger-robert-kennedy-and-his
    reads: The President resolved to go ahead (the National Security Council faced the decision on December 5, 1961)
    at: '560'
- check:
    id: cal.1961-10-25.latin-america
    text: 'Check: Schlesinger dates his journal entry of this talk Oct. 25, 1962 (580 n.); the talk was Oct. 25, 1961.'
