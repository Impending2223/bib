- add:
    entry:
      id: cal.1962-10-21.missile-crisis-5
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      c: 'The Oval Room, 11:30 a.m. to about 12:30 p.m. Kennedy with Robert Kennedy, McNamara, Taylor and Sweeney of the
        Tactical Air Command, McCone joining. Sweeney certain an air strike would be "successful," not all the known missiles
        likely destroyed; Taylor: "The best we can offer you is to destroy 90% of the known missiles." The air strike out,
        the blockade on, by Sorensen''s account.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 36](https://history.state.gov/historicaldocuments/frus1961-63v11/d36).
        [[w.sorensen-kennedy]], 697 (Robert Kennedy in from Virginia in riding clothes; the air strike out). See [[cal.1962-10-16.missile-crisis]].
        Names: Robert Kennedy, McNamara, Taylor, McCone, John F. Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:mccone-john-a
      src:
        c: 3d8a348c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d36: A-D'
        - 'w.sorensen-kennedy 697: B, E'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-13
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - africa
      c: 'Before the Cabinet, a long-scheduled appointment: Kennedy with Obote of Uganda, Rusk present. They debate American
        aid to schools in Rhodesia; the President sees him to the door.'
      n: '[[w.sorensen-kennedy]], 701. See [[cal.1962-10-22.missile-crisis]]. Names: Obote, Rusk, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:obote-a-milton
      - name:rusk-dean
      src:
        c: e90541ba
        rows:
        - 'w.sorensen-kennedy 701: all'
- add:
    entry:
      id: cal.1962-10-23.republican-party-congress
      when: Oct. 23
      date: '1962-10-23'
      thread: republican-party-congress
      also:
      - missile-crisis
      c: The Republican congressional leaders call for complete support of the President on the quarantine; Keating echoes
        them.
      n: '[[w.sorensen-kennedy]], 707. Check: the statement''s text and day. See [[cal.1962-10-22.missile-crisis]]. Names:
        Keating.'
      tags:
      - name:keating-kenneth-b
      src:
        c: 8d1c5a1c
        rows:
        - 'w.sorensen-kennedy 707: all'
- add:
    entry:
      id: cal.1962-10.republican-party
      when: Oct., late
      date: 1962-10
      thread: republican-party
      also:
      - missile-crisis
      c: 'The week of the quarantine. The House Republican Campaign Committee: the whole Kennedy approach "brazenly false"
        and ineffective.'
      n: '[[w.sorensen-kennedy]], 707. Check: the day and the text. See [[cal.1962-10-22.missile-crisis]].'
      src:
        c: 7f2f5374
        rows:
        - 'w.sorensen-kennedy 707: all'
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-6
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Noon. Lincoln White, State's press officer, announcing the work going on at the missile sites, refers reporters
        to the address's "further action will be justified." Headlines that an invasion or an air strike is near. Kennedy,
        his temper lost, calls Rusk, the Assistant Secretary, then White.
      n: '[[w.sorensen-kennedy]], 711–12. See [[cal.1962-10-22.missile-crisis]]. Check: the hour. Names: White, Rusk, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:white-lincoln-p
      - name:rusk-dean
      src:
        c: e762d6e5
        rows:
        - 'w.sorensen-kennedy 711–12: all'
- add:
    entry:
      id: cal.1961-08.testing-3
      when: Aug., late
      date: 1961-08
      thread: testing
      c: 'After the Soviet announcement of Aug. 30. Murrow to Kennedy: no precipitate action, to keep the chance of isolating
        the Communist bloc; the voices on the right "who today urge you to resume testing immediately will tomorrow contend
        that the decision to do so was merely another belated reaction to Soviet action."'
      n: '[[w.sorensen-kennedy]], 619 (one of the most thoughtful pieces of advice, in the President''s view). Check: the
        day; a memorandum or in a meeting. See [[cal.1961-08-30.testing]]. Names: Murrow, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:murrow-edward-r
      src:
        c: 7989f177
        rows:
        - 'w.sorensen-kennedy 619: all'
        - 'via x.1961-08.murrow-to-kennedy-advice-on-testing: B'
- add:
    entry:
      id: cal.1962-04.testing
      when: Apr.
      date: 1962-04
      thread: testing
      c: 'A few days before the atmospheric tests begin. McNamara at lunch with Rusk and Bundy: the tests not really necessary.
        They are startled.'
      n: '[[w.sorensen-kennedy]], 622. See [[cal.1962-04-25.testing]]. Check: the day. Names: McNamara, Rusk, Bundy.'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:bundy-mcgeorge
      src:
        c: c87a6229
        rows:
        - 'w.sorensen-kennedy 622: all'
- add:
    entry:
      id: cal.1962-12.defense
      when: Dec., late
      date: 1962-12
      thread: defense
      also:
      - europe-and-the-alliance
      c: After Nassau, Kennedy at Palm Beach. An Air Force spokesman in Washington announces a successful Skybolt test,
        to the embarrassment and anger of both governments; McHugh, the President's Air Force aide, brings him "the good
        news."
      n: '[[w.sorensen-kennedy]], 607. See [[cal.1962-12-18.europe-and-the-alliance]]. Check: the day. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 9f170cf6
        rows:
        - 'w.sorensen-kennedy 607: all'
- add:
    entry:
      id: cal.1962-10-17.missile-crisis-4
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      c: 'Stevenson to Kennedy, by letter, the day after the President briefed him: personal emissaries to Castro and Khrushchev;
        no disclosure yet that an attack is imminent. "To start or risk starting a nuclear war is bound to be divisive at
        best." The existence of nuclear missile bases anywhere to be made negotiable "before we start anything."'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 25](https://history.state.gov/historicaldocuments/frus1961-63v11/d25).
        [[w.sorensen-kennedy]], 695 (a handwritten note; it annoys the President). See [[cal.1962-10-16.missile-crisis]].
        Names: Stevenson, Castro, Khrushchev, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:castro-fidel
      - name:khrushchev-nikita-s
      src:
        c: a58498bd
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d25: all'
        - 'w.sorensen-kennedy 695: A, C-D'
        - 'via x.1962-10-17.stevenson-to-kennedy-letter: all'
- add:
    entry:
      id: cal.1962-10-17.missile-crisis-5
      when: Oct. 17
      date: '1962-10-17'
      thread: missile-crisis
      also:
      - robert-kennedy
      c: Evening. Robert Kennedy and Sorensen meet the President's plane from Connecticut and sit in his car; on the drive
        to the White House Sorensen gives him a four-page memorandum of the agreements, the disagreements, the choices and
        the unanswered questions. He stays away from the night's meeting at State.
      n: '[[w.sorensen-kennedy]], 686. See [[cal.1962-10-17.missile-crisis-2]]. Check: the hour. Names: Robert Kennedy,
        Sorensen, John F. Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:sorensen-theodore-c
      src:
        c: 34082a31
        rows:
        - 'w.sorensen-kennedy 686: all'
        - 'via x.1962-10-17.sorensen-to-kennedy-four-page-memorandum: B'
- add:
    entry:
      id: cal.1962-10-26.south-asia
      when: Oct. 26
      date: '1962-10-26'
      thread: south-asia
      also:
      - china
      c: 'The afternoon. B. K. Nehru, India''s Ambassador, gives Kennedy the Prime Minister''s letter on the Chinese attack:
        India confident it "shall have your sympathy and support." Kennedy: he will reply at once, full sympathy and support,
        help within American capabilities. By Sorensen''s account he adds, unofficially, that Nehru should make Khrushchev
        "put up or shut up" on the MIGs promised.'
      n: '[FRUS 1961–63, XIX: South Asia, doc. 182](https://history.state.gov/historicaldocuments/frus1961-63v19/d182),
        Washington to New Delhi, Oct. 27. [[w.sorensen-kennedy]], 663 (the first of some fifteen letters in six months;
        the Ambassador on "support" rather than "military assistance"). See [[cal.1962-10-20.india-and-china]]. Names: Jawaharlal
        Nehru, Khrushchev, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:nehru-jawaharlal
      - name:khrushchev-nikita-s
      src:
        c: 431c0365
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v19/d182: A-B'
        - 'w.sorensen-kennedy 663: A, C'
        - 'via x.1962-10-26.nehru-to-kennedy-letter-chinese-attack: A'
