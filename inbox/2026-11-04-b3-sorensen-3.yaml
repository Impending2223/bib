      when: June 27
      date: '1962-06-27'
      thread: china
      c: 'News conference, the opening statement on the Formosa Strait: very large movements of Chinese Communist forces
        into the area; the policy since 1955 unchanged, the United States speaking with one voice; "the purposes of the
        United States in this area are peaceful and defensive."'
      n: 'The President''s News Conference, [1962 Pub. Papers 509](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=569)
