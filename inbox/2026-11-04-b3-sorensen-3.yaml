    entry:
      id: cal.1961-08-30.cuba-bay-of-pigs
      when: Aug. 30
      date: '1961-08-30'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'News conference. Asked of *Time*''s version of the invasion, out that day, that Rusk canceled the air support
        for the landing and the President backed him: no comment; "the most inaccurate of all the articles that have appeared
        on Cuba."'
      n: 'The President''s News Conference, [1961 Pub. Papers 572](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630)
        (Aug. 30, 1961), at 580. [[w.sorensen-kennedy]], 316 (the answer; the article *Time*''s, or *Fortune*''s, from which
        it was condensed). See [[cal.1961-04-17.cuba]]. Names: Rusk, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      src:
        c: 4f55f686
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=630: all'
        - 'w.sorensen-kennedy 316: B'
- add:
    entry:
      id: cal.1961-12.press-and-broadcasting
      when: Dec.
      date: 1961-12
      thread: press-and-broadcasting
      c: 'Palm Beach, the Christmas holiday. Kennedy with the two dozen or so regular White House correspondents traveling
        with him, three to four hours at his house, on background: the year behind and the year ahead, domestic and foreign
        affairs in turn.'
      n: '[[w.sorensen-kennedy]], 327–28 (in 1961 and 1962). See [[cal.1961-01-25.press-and-broadcasting]]. Check: the day.
        Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: d8b09823
        rows:
        - 'w.sorensen-kennedy 327–28: all'
