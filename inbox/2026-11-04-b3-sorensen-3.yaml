      src:
        c: 53d88f75
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430: all'
        - 'w.sorensen-kennedy 329: all'
- add:
    entry:
      id: cal.1962-12.press-and-broadcasting-2
      when: Dec.
      date: 1962-12
      thread: press-and-broadcasting
      c: 'After Sylvester''s words on the right to lie. Kennedy has Sorensen draft a letter for Sylvester to sign: they
        "should have been more carefully phrased and considered"; the President''s and the Department''s abhorrence of censorship.
        Sylvester refuses to sign it.'
      n: '[[w.sorensen-kennedy]], 321. See [[cal.1962-12-06.press-and-broadcasting]]. Check: the day. Names: Sylvester,
        Sorensen, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:sylvester-arthur
      - name:sorensen-theodore-c
      src:
        c: ab414327
        rows:
        - 'w.sorensen-kennedy 321: all'
        - 'via x.1962-12.sorensen-draft-letter-for-sylvester: B'
- add:
    entry:
      id: cal.1961-10-11.foreign-aid
      when: Oct. 11
      date: '1961-10-11'
      thread: foreign-aid
      c: 'News conference. The signing statement''s words on the needs of countries that share "our view of the world crisis,"
        explained: that view is that countries are entitled to national sovereignty and independence; no string of agreement
        attached to the aid.'
      n: 'The President''s News Conference, [1961 Pub. Papers 656](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=714)
        (Oct. 11, 1961), at 661. [[w.sorensen-kennedy]], 538 (the statement written in anger at Belgrade; the answer). See
        [[cal.1961-09-04.foreign-aid]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: c874a1b9
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=714: all'
        - 'w.sorensen-kennedy 538: all'
- add:
    entry:
      id: cal.1961-02-15.congo
      when: Feb. 15
      date: '1961-02-15'
      thread: congo
      c: 'News conference, the opening statement: support for the UN in the Congo; an attempt to destroy the UN system "a
        blow aimed directly at the independence and security of every nation." A warning against "unilateral intervention
        in the internal affairs of the Republic of Congo," "so dangerous and irresponsible a step."'
      n: 'The President''s News Conference, [1961 Pub. Papers 91](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=149)
        (Feb. 15, 1961). [[w.sorensen-kennedy]], 636 (after Lumumba''s death and the Soviet recognition of Gizenga). See
        [[cal.1961-02-13.congo]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: dd8e9d1f
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=149: all'
        - 'w.sorensen-kennedy 636: B'
- add:
    entry:
      id: cal.1962-03.soviet-union-3
      when: Mar.
      date: 1962-03
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'A few days after Khrushchev called off the television exchange. Bolshakov to Sorensen: his government obliged
        to say a few harsh words, low-key ones; the Chairman still likes the President; the exchange to be held later. It
        never is.'
      n: '[[w.sorensen-kennedy]], 558. See [[cal.1962-03-07.soviet-union-2]]. Check: the day. Names: Bolshakov, Sorensen,
        Khrushchev, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:bolshakov-georgi
      - name:sorensen-theodore-c
      - name:khrushchev-nikita-s
      src:
        c: 0cc527bc
        rows:
        - 'w.sorensen-kennedy 558: all'
- add:
    entry:
      id: cal.1962-04.defense-2
      when: Apr.
      date: 1962-04
      thread: defense
      also:
      - berlin-and-vienna
      c: 'Easter Week. Kennedy directs the release of two privates first class, reservists called up for Berlin, facing
        courts-martial: one for organizing protest meetings and disparaging his commanding officer''s ban, the other for
        writing his Senator, for seventy-four buddies, against Kennedy''s "political maneuvers."'
      n: '[[w.sorensen-kennedy]], 628. Check: the day; their names. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: cae48b8a
        rows:
        - 'w.sorensen-kennedy 628: all'
- add:
    entry:
      id: cal.1962-09.europe-and-the-alliance-france
      when: Sept.
      date: 1962-09
      thread: europe-and-the-alliance-france
      c: 'De Gaulle, through Alphand: he likes Kennedy and their last meeting, and would meet again; but solid agreement
        on a long list of issues unlikely, the time not yet right.'
      n: '[[w.sorensen-kennedy]], 561. Check: the day. Names: de Gaulle, Alphand, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:de-gaulle-charles
      - name:alphand-herve
      src:
        c: e2faacc0
        rows:
        - 'w.sorensen-kennedy 561: all'
- add:
    entry:
      id: cal.1963-02.europe-and-the-alliance-france
      when: Feb.
      date: 1963-02
      thread: europe-and-the-alliance-france
      c: 'Kennedy, by letter, to a prominent critic who would give France nuclear weapons: "I do not believe it is in the
        interest of the United States ... to view the possession of a nuclear arsenal as a legitimate and desirable attribute
        of every sovereign nation." "If we are to be caught up in a nuclear war, should we not have a voice in the decision
        that launches it?"'
      n: '[[w.sorensen-kennedy]], 573 (the letter quoted; its addressee not named). Check: the addressee and the day. Names:
        Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: d6acdb5b
        rows:
        - 'w.sorensen-kennedy 573: all'
        - 'via x.1963-02.kennedy-to-a-critic-nuclear-weapons-for-france: A-B'
- add:
    entry:
      id: cal.1963-01.europe-and-the-alliance-france
      when: Jan., early 1963
      date: 1963-01
      thread: europe-and-the-alliance-france
      also:
      - soviet-union
      c: 'A foreign intelligence report of doubtful authenticity, on "rumors from regular and reliable sources": de Gaulle
        and the Soviet Union have made or will make a secret deal, a demilitarized Central Europe with all Germany, Greece
        and Turkey, American troops withdrawn from France and Germany, the Oder-Neisse line recognized. Checked, and found
        groundless.'
      n: '[[w.sorensen-kennedy]], 571 (the report; it moves many of the President''s questions in the meetings after). Check:
        the month; the report''s origin. Names: de Gaulle.'
      tags:
      - name:de-gaulle-charles
      src:
        c: e9af87b4
        rows:
        - 'w.sorensen-kennedy 571: all'
        - 'via x.1963-01.foreign-intelligence-report-de-gaulle-soviet-deal: A'
- add:
    entry:
      id: cal.1963-01.europe-and-the-alliance-france-2
      when: Jan.–Feb.
      date: 1963-01
      thread: europe-and-the-alliance-france
      also:
      - europe-and-the-alliance
      c: 'After de Gaulle''s press conference. Kennedy commissions papers by Bruce and Acheson and calls the ambassadors
        and experts on the West to a series of long conferences. His conclusion: no basic change of strategy; no reprisal
        against de Gaulle, no nuclear aid on his terms.'
      n: '[[w.sorensen-kennedy]], 571–73. See [[cal.1963-01-14.europe-and-the-alliance]]. Check: the days. Names: Bruce,
        Acheson, de Gaulle, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:bruce-david-k-e
      - name:acheson-dean-g
      - name:de-gaulle-charles
      src:
        c: b2b5ab4e
        rows:
        - 'w.sorensen-kennedy 571–73: all'
- add:
    entry:
      id: cal.1963-08-01.latin-america
      when: Aug. 1
      date: '1963-08-01'
      thread: latin-america
      c: 'News conference, on the Alliance for Progress: there must be a revolution in Latin America, peaceful or bloody;
        the Alliance "has failed, of course, to some degree, because the problems are almost insuperable"; it should be
        pursued and intensified.'
      n: 'The President''s News Conference, [1963 Pub. Papers 612](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670)
        (Aug. 1, 1963), at 617. [[w.sorensen-kennedy]], 534–35 (Sorensen: "depressed" by the size of the problems). See
        [[cal.1961-03-13.latin-america]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: b9ab0bd9
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=670: all'
        - 'w.sorensen-kennedy 534–35: B'
- add:
    entry:
      id: cal.1962-03-07.soviet-union-3
      when: Mar. 7
      date: '1962-03-07'
      thread: soviet-union
      c: 'News conference. Asked whether he will eat his words and go to a summit without agreement at a lower level: "I''m
        going to have a dinner for all of the people who''ve written it, and we''ll see who eats what."'
      n: 'The President''s News Conference, [1962 Pub. Papers 196](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=256)
        (Mar. 7, 1962), at 198. [[w.sorensen-kennedy]], 551–52. Names: Kennedy.'
