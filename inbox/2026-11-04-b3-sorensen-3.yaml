      id: cal.1961-10-12.right-and-the-military
      when: Oct. 12
      date: '1961-10-12'
      thread: right-and-the-military
      c: 'Chapel Hill, N.C., the University of North Carolina, an honorary degree: firmness and flexibility; "while we do
        not intend to see the free world give up, we shall make every effort to prevent the world from being blown up."'
      n: 'Address at the University of North Carolina Upon Receiving an Honorary Degree, [1961 Pub. Papers 666](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=724)
