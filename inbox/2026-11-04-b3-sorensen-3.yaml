      when: Apr. 11
      date: '1962-04-11'
      thread: indonesia
      c: 'News conference, on Bunker''s mediation between the Dutch and the Indonesians over West New Guinea: "the role
        of the mediator is not a happy one, and we''re prepared to have everybody mad, if it makes some progress."'
      n: 'The President''s News Conference, [1962 Pub. Papers 315](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=375)
