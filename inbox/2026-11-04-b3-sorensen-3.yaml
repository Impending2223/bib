        - 'w.sorensen-kennedy 551–52: all'
- add:
    entry:
      id: cal.1962-05-09.berlin-and-vienna
      when: May 9
      date: '1962-05-09'
      thread: berlin-and-vienna
      c: 'News conference, on the Berlin talks: the Germans support continuing the exploratory talks; the United States
        has called up 160,000 men and added billions to its defense budget, "not done by many other countries who speak
        with vigor now"; "As Winston Churchill said, ''It is better to jaw, jaw than to war, war,'' and we shall continue
        to jaw, jaw."'
      n: 'The President''s News Conference, [1962 Pub. Papers 375](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=435)
        (May 9, 1962), at 377. [[w.sorensen-kennedy]], 596–98. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 8026f68e
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=435: all'
        - 'w.sorensen-kennedy 596–98: all'
- add:
    entry:
      id: cal.1961-07-19.berlin-and-vienna-3
      when: July 19
      date: '1961-07-19'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'News conference. Asked of Menshikov''s reported remark that the United States would not fight for Berlin: West
        Berlin "a very basic issue," and "we intend to honor our commitments."'
      n: 'The President''s News Conference, [1961 Pub. Papers 513](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571)
        (July 19, 1961), at 520. [[w.sorensen-kennedy]], 586 (the Ambassador departing; "when the chips are down"). Names:
        Menshikov, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:menshikov-mikhail
      src:
        c: bbe7a8ad
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=571: all'
        - 'w.sorensen-kennedy 586: all'
- add:
    entry:
      id: cal.1961-11-08.south-asia
      when: Nov. 8
      date: '1961-11-08'
      thread: south-asia
      c: 'News conference, after Nehru''s visit. Asked whether Nehru works for the Communist movement: "I know of no rational
        man in the United States who holds that view"; differences of policy, geography dictating some.'
      n: 'The President''s News Conference, [1961 Pub. Papers 701](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=759)
        (Nov. 8, 1961), at 706. [[w.sorensen-kennedy]], 578. Names: Nehru, Kennedy.'
