- add:
    entry:
      id: cal.1962-12-12.press-and-broadcasting
      when: Dec. 12
      date: '1962-12-12'
      thread: press-and-broadcasting
      also:
      - missile-crisis
      c: 'News conference, on the articles of Stevenson''s part in the Executive Committee: Stevenson "renders very distinguished
        service." "I''m going to keep my old friends. But I am responsible for many things under the Constitution, but not
        for what they write."'
      n: 'The President''s News Conference, [1962 Pub. Papers 866](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926)
        (Dec. 12, 1962), at 873. [[w.sorensen-kennedy]], 315 (the answer, of the Bartlett and Stewart Alsop article; to
        Sorensen later: "I''ve never told Bartlett what to write, so I can''t start telling him what not to write"). See
        [[cal.1962-12.missile-crisis]]. Names: Stevenson, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      - name:bartlett-charles
      - name:alsop-stewart
      src:
        c: 1339cd9b
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=926: all'
        - 'w.sorensen-kennedy 315: B'
- add:
    entry:
      id: cal.1962-11-20.press-and-broadcasting
      when: Nov. 20
      date: '1962-11-20'
      thread: press-and-broadcasting
      also:
      - missile-crisis
      c: 'News conference. Asked of Collins, of the National Association of Broadcasters, charging State and Defense with
        news suppression in the Cuban crisis: "I have no apologies"; the news "dribbled out" before the response was settled
        and the allies consulted would have been "a great mistake and possibly a disaster." One newspaper learned details
        the Sunday and did not print them.'
      n: 'The President''s News Conference, [1962 Pub. Papers 830](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=890)
        (Nov. 20, 1962), at 834. [[w.sorensen-kennedy]], 321–22 (the answer). See [[cal.1962-10-22.missile-crisis]]. Names:
        Collins, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:collins-leroy
      src:
        c: bc7b5082
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=890: all'
        - 'w.sorensen-kennedy 321–22: A-B'
- add:
    entry:
      id: cal.1962-01-24.antisubversion-2
      when: Jan. 24
      date: '1962-01-24'
      thread: antisubversion
      also:
      - press-and-broadcasting
      c: 'News conference. A reporter calls two State Department officers "well-known security risks." Kennedy: Miller cleared
        by the Department, his record looked at by Rusk and the President; Miller and Wieland fit for their duties, "without
        detriment to the interests of the United States, and I hope without detriment to their characters by your question."'
      n: 'The President''s News Conference, [1962 Pub. Papers 60](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=120)
        (Jan. 24, 1962), at 64 (the answer; the question lost in the series'' text of the volume). [[w.sorensen-kennedy]],
        326 (the question; the President''s anger; he goes on calling on her). Names: Rusk, Wieland, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:wieland-william-a
      src:
        c: de31c384
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=120: B'
        - 'w.sorensen-kennedy 326: A-B'
- add:
    entry:
      id: cal.1963-05-08.alabama-birmingham-6
      when: May 8
      date: '1963-05-08'
      thread: alabama-birmingham
      also:
      - press-and-broadcasting
      c: News conference. Would a fireside chat on civil rights help? "If I thought it would I would give one." His speech
        to Mississippi the night of Oxford "did not seem to do much good, but this doesn't mean we should not keep on trying."
      n: 'The President''s News Conference, [1963 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=430)
        (May 8, 1963), at 378. [[w.sorensen-kennedy]], 329. Names: Kennedy.'
      tags:
