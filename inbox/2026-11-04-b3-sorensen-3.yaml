      when: Dec.
      date: 1962-12
      thread: press-and-broadcasting
      c: 'Palm Beach, the Christmas holiday, as the year before. Kennedy''s background session with the regular White House
        correspondents, three to four hours: the year behind and the year ahead.'
      n: '[[w.sorensen-kennedy]], 327–28. See [[cal.1961-12.press-and-broadcasting]]. Check: the day. Names: Kennedy.'
