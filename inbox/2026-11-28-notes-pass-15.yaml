    words: It is the meeting Mao ordered to settle the fate of Wang Renzhong, whom Tao Zhu has tried to shield. Instead the Group's leaders turn on Tao Zhu; none of his Politburo colleagues defends him,
      and Li Fuchun only suggests that Tao go back to the Central-South Region.
