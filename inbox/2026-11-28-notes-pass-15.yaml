    item: '[[w.zhu-de-nianpu-xinbian]], III, 1955'
- names:
    id: cal.1966-07-29.china-leadership
    add:
    - Zhu De
    tags:
    - name:zhu-de
- add-words:
    id: cal.1966-07-29.china-leadership
    after: end
    words: 'Li Xuefeng says the new committee asked for work groups and they proved unsuitable and obstructed the movement; the masses were right to dismiss Zhang Chengxian of Peking University''s group,
      Sun Youyu of the Normal University''s and Zhou Jie of the Haidian middle schools'' team; Guo Yingqiu, the committee''s secretary for culture and education, is removed and sent back to People''s University
      to make a self-criticism. Deng speaks as a Center worker: the groups were sent in the new committee''s name with the Center''s agreement. Liu, asked how to make the proletarian cultural revolution,
      answers honestly that he does not know either and thinks the other leaders in the Center do not; the reliance is on the revolutionary teachers, students and staff, and the Center will learn from them.
      Classes are stopped for half a year.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 181–82 & n.131'
