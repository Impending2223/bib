    words: 'The meeting, chaired by Li Xuefeng, has the Inner Mongolia group concentrate its fire on Ulanhu. Its ground: the 1935 "Declaration to the people of Inner Mongolia," issued in Mao''s name and
      reprinted in the 1964 Four Cleanups, now called "national splitting" and betraying the Party and the country. Someone asks why he did not treat the Inner Mongolian People''s Revolutionary Party as
      a reactionary party.'
