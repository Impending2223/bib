      c: Students of more than forty military academies come to Peking, angered at Jiang Qing's and Guan Feng's displeasure with the old marshals' speeches of Nov. 13 and 29, form a "preparatory office
        to criticize the bourgeois reactionary line" and set a rally for Jan. 5, naming Chen Yi and Ye Jianying to attend "to receive education."
      n: '[[w.chen-yi-nianpu]], 1180 (1月初). Made public: 1995. Names: Jiang Qing, Guan Feng, Chen Yi, Ye Jianying. Check: the day; the nianpu gives "early January."'
