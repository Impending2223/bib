    words: 'At the forum''s close Liu Zhijian, with Xie, Li and Chen, has Jiang Qing''s talks put in an outline of about 3,000 characters to report to the Party committee: recorded by Li Ming of *Xinghuo
      liaoyuan*, revised by Chen Yading, done the evening of Feb. 20.'
