      c: 'Chicago. Daley, who had called the rioting "juvenile incidents," asks publicly for the National Guard, saying outsiders have incited it beyond his control, and blames King''s staff; at the same
        press conference Rev. J. H. Jackson: "Some other forces are using these young people."'
      n: '[[w.branch-at-canaans-edge]], 503–4. See [[cal.1966-07-12.open-housing]]. Names: Daley, King.'
