- edit:
    id: cal.1966-05.china-leadership-5
    base: 3779db78
    set:
      gloss:
        title: Commentary
        text:
        - 'Yang Jisheng (2016): the verdict that made Ulanhu head of an anti-Party clique of "national splitting" was Liu Shaoqi''s and Deng Xiaoping''s; whether it was Mao''s decision awaits the records
          ([[w.yang-jisheng-tiandi-fanfu]], II, 620).'
- edit:
    id: cal.1966-06-12.china-leadership
    base: ac92b136
    set:
      gloss:
        title: Commentary
        text:
        - 'Li Dazhang (Oct. 22, 1968), at the Twelfth Plenum''s fourth group: at the Hangzhou meeting of June 12 he heard Mao''s instruction on the colleges'' work groups, not to send them, to send few,
          to send late ([[w.pu-weihua-zalan-jiu-shijie]], 154 n.100).'
        - 'Jiang Weiqing (1996), in his memoir: the Center relayed the points of Mao''s talks of June 10 and 12 with Liu Shaoqi, Deng Xiaoping and others: the schools to seize power, the universities first;
          a blow at 5 percent not few; naming in the papers to be careful, but no province or city may name nobody; no haste to send work groups, a "free-for-all" for some months ([[w.pu-weihua-zalan-jiu-shijie]],
          154 n.100).'
        - 'Pu Weihua (2008): the talk is unpublished; its gist is known from later accounts ([[w.pu-weihua-zalan-jiu-shijie]], 154 n.100).'
- edit:
    id: cal.1966-07.china-leadership-8
    base: f5ec9a70
    set:
      gloss:
        title: Commentary
        text:
        - 'Dikötter (2016): the visit "a direct snub" to Wang Guangmei, who had condemned Kuai Dafu as a "rightist" ([[w.dikotter-cultural-revolution]], 67).'
- edit:
    id: cal.1966-08-05.china-leadership-4
    base: cbdeb30e
    set:
      gloss:
        title: Commentary
        text:
        - 'Pu Weihua (2008): the sentence struck on Aug. 5 was Mao''s signal that Liu Shaoqi was to be removed, and Wang Li, then of the Cultural Revolution Group, noticed it ([[w.pu-weihua-zalan-jiu-shijie]],
          201).'
- edit:
    id: cal.1966-08-25.china-leadership-3
    base: 59cec628
    set:
      gloss:
        title: Commentary
        text:
        - 'The General Staff''s Party committee (Jan. 15, 1979), summing up its "three checks and three rectifications," as Yang Jisheng gives it: the "Aug. 25 counterrevolutionary incident" was a plot
          of Lin Biao and the "gang of four" to strike down He Long; the General Staff''s chief, Yang Chengwu, carried out Lin''s "black instruction" ([[w.yang-jisheng-tiandi-fanfu]], II, 1043).'
- edit:
    id: cal.1966-11-29.china-leadership
    base: ebd011bd
    set:
      gloss:
        title: Commentary
        text:
        - 'Teiwes and Sun (1996): He Long''s absence "undoubtedly the result of" Jiang Qing''s protest at his part in the first rally, not of anything Lin Biao did ([[w.teiwes-tragedy-of-lin-biao]], 36).'
- edit:
    id: cal.1966-12-04.china-leadership
    base: a1b892a2
    set:
      gloss:
        title: Commentary
        text:
        - 'Wang Nianyi (1988), as Teiwes and Sun give him: Lin''s summing-up of Dec. 6 "obviously not merely an individual opinion" but Mao''s intention, and in substance "passive and perfunctory" ([[w.teiwes-tragedy-of-lin-biao]],
          69).'
- edit:
    id: cal.1966.china-leadership-90
    base: dd740d42
    set:
      gloss:
        title: Commentary
        text:
        - 'Li Xuefeng, writing in his last years, as his daughter Li Danlin printed it (2002) and Pu Weihua gives it: the North China meeting ran from May 23 to July 20; the Bureau kept reporting to the
          Center, and "two leading comrades of the Center" together talked one by one with Ulanhu and Lin Tie, under criticism, pointing to their "problems" and criticizing their "errors"; the Bureau answers
          for the meeting''s errors ([[w.pu-weihua-zalan-jiu-shijie]], 105, 106 n.33).'
