- add-words:
    id: cal.1966-03.china-leadership-2
    after: end
    words: They add to it and revise it. Liu Zhijian and Chen Yading are called to Shanghai to join; done on the 14th, the text grows from 5,500 characters to about 10,000.
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 45'
