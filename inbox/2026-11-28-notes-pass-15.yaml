    words: 'Yang Jisheng: Daxinzhuang is led by a nine-man group under the commune head, Gao Fuxing, and the commune youth league secretary, Hu Defu. At a secret meeting on the night of Aug. 29 the main
      cadres of 17 brigades fix joint action for 10:30 p.m. on the 31st. That night nine brigades kill, four at once; Gao comes to the scene, faults Hongsheng for killing only 2 and praises Liming for 56
      dead of 11 households. The commune''s toll that night is 110. The corpses go into a deep well, later partly moved to a reed pond. Most of the county''s killing is on the 31st, so it is called the
      Aug. 31 incident.'
