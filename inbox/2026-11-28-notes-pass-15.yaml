    words: 'Liu admits two sets of errors: the summer''s, "serious errors in line," "right-opportunistic in nature"; and past errors in principle and line, chiefly the "right deviation" of 1962 and the
      tendency of 1964. He does not call himself a "revisionist." Deng''s is more personal in tone; he gives Lin Biao his strongest endorsement as Mao''s "assistant and successor," says he will learn from
      Lin, and is ready to call what he did with Liu in the summer a "bourgeois reactionary erroneous line."'
