    after: Leaders busy every day with routine who do not go down have no first-hand knowledge and cannot lead the movement.
    words: 'His first four days back in Peking he leaned toward keeping Zhang Chengxian, then did not approve. Told the work groups are mostly good, some from the army: "can you?"; he cannot either. Told
      that four or five of the seven who put up the first poster no longer back Nie Yuanzi: let it split; this is politics, she fired the first shot.'
