    after: end
    words: 'On the second draft Mao makes ten or so small changes: cuts "everyone agreed it was a short training course"; the army''s "leading role" in the cultural revolution becomes "an important role";
      one "Chairman Mao" becomes "the Party Center"; cuts a line on holding high the great red banner of Mao Zedong Thought; adds a last line, the record for the leading comrades'' reference only.'
