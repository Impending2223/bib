- add-words:
    id: cal.1966-04-16.china-leadership-8
    after: has it rewritten.
    words: On his way to the enlarged Standing Committee meeting at Hangzhou he finds Liu Zhijian and Chen Yading in Shanghai and, the Center's document of Apr. 10 in hand, tells them to rewrite it; he
      dictates the points.
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 48'
