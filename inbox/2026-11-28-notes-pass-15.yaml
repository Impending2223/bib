- add-words:
    id: cal.1966-04-16.china-leadership-8
    after: end
    words: The new comment is nearly three times as long; it stresses that the summary went through three revisions by Mao himself. Jiang Qing, shown it, has Zhang Chunqiao, Liu and Chen go over it; nothing
      changes. Liu hands it to Zhou at Shanghai Apr. 30.
