      c: 'Chicago, the hydrant riot. King, on the gang leaders'' terms, goes with Mahalia Jackson to the 12th District police station and has six battered youths released; at Shiloh Baptist Church they
        tell of police brutality and no playgrounds or pools, and King preaches against riots and halfhearted reform: "I need some victories."'
      n: '[[w.branch-at-canaans-edge]], 502–3. See [[cal.1966-07-12.open-housing]]. Names: King.'
