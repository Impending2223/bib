- add-words:
    id: cal.1966-02-20.china-leadership-3
    after: end
    words: 'At the forum''s close Liu Zhijian, with Xie, Li and Chen, has Jiang Qing''s talks put in an outline of about 3,000 characters to report to the Party committee: recorded by Li Ming of *Xinghuo
      liaoyuan*, revised by Chen Yading, done the evening of Feb. 20.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 43'
- names:
    id: cal.1966-02-20.china-leadership-3
    add:
    - Chen Yading
    tags:
    - name:chen-yading
- add-words:
    id: cal.1966-03-17.china-leadership-2
    after: end
    words: The summary was drafted early in February at Shanghai by Jiang Qing with men of the General Political Department, then rewritten by Zhang Chunqiao and Chen Boda. Lin Biao writes to the Commission's
      Standing Committee for its views.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 474'
- names:
    id: cal.1966-03-17.china-leadership-2
    add:
    - Zhang Chunqiao
    - Chen Boda
    tags:
    - name:zhang-chunqiao
    - name:chen-boda
- add-words:
    id: cal.1966-03-17.china-leadership-2
    after: end
    words: 'On the second draft Mao makes ten or so small changes: cuts "everyone agreed it was a short training course"; the army''s "leading role" in the cultural revolution becomes "an important role";
      one "Chairman Mao" becomes "the Party Center"; cuts a line on holding high the great red banner of Mao Zedong Thought; adds a last line, the record for the leading comrades'' reference only.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 46'
- add-words:
    id: cal.1966-03-31.transition-and-staff
    after: Bundy had left Feb. 28, Komer acting since.
    words: Johnson takes Rostow on Valenti's strong recommendation, over Moyers and Komer; the title is special assistant to the president, not Bundy's special assistant for national security affairs.
    item: '[[w.berman-lyndon-johnsons-war]], 21'
