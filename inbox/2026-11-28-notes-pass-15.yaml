    words: 'Mao: forbidding the masses to besiege newspaper offices, provincial committees or the State Council, or to come to the Center, obstructs their revolution. Leaders busy every day with routine
      who do not go down have no first-hand knowledge and cannot lead the movement.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 176'
