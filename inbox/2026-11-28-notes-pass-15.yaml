    words: The call is a little past 3 a.m. Chen is recovering from cancer surgery of the nose and pharynx and has put his deputy, Mayor Cao Diqiu, in the front line. Close to 20,000 Scarlet Guards at Kunshan,
      a few miles outside Shanghai, on their way to Peking to petition, hold up 26 passenger and 38 freight trains. Zhou has Chen take measures "in consultation with the organizations of the masses."
