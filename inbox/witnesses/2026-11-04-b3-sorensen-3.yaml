# b3-sorensen-3: the records Sorensen's Kennedy (1965) quotes or names in its foreign chapters, for the entries this
# patch makes or cites (R35, R38). The book has no notes: each is a witness as the text gives it.
- id: x.1962-10-17.stevenson-to-kennedy-letter
  what: Stevenson to Kennedy, letter, Oct. 17, 1962, the day after the President briefed him (a "handwritten note" by Sorensen, Kennedy, 695)
  kind: letter
  date: '1962-10-17'
  where: as FRUS prints it
  agent:
    - name:stevenson-adlai-e
  made: contemporaneous
  form: original
  copies:
    - 'FRUS 1961–63, XI, doc. 25'
  read: true
