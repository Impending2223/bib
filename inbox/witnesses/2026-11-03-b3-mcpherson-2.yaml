# cites, registered Nov. 4, 2026 (batch 3 resumed, staff group; patch inbox/2026-11-03-b3-mcpherson-2.yaml). The book
# has no notes: these are the memoranda and papers it prints or quotes in its text, each passage of the book that
# prints one is a row (`part_of` the card, `pin` its page) resting on the paper McPherson kept (no by-work file: the
# edges' form is a note's, and the book has none). The paper itself is not held by the series (FRUS's prints aside,
# given as copies). The few footnotes name only books and newspapers, none bearing on an entry's claim.

