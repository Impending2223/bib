# The witness test, Nov. 3, 2026 (patch inbox/2026-11-03-witness-test.yaml): the witnesses Chen Jian's *Mao's China and
# the Cold War* (w.jian-maos-china-and-the) gives for the passages the calendar cites, read again under R35-R43 from the
# owner's copy (printed page = PDF page - 15; the notes, pp. 285-372). The studies, memoirs and Chinese military
# histories the Oct. 29 reading left out are here; the records it registered are not repeated (their edges stand in
# sources/witnesses/by-work/jian-maos-china-and-the.yaml). Each study's pinpoints are on its by-work edges (`pin`). A
# study's row stands for the whole work and has no `from`; where the passage Chen cites quotes or reports a document,
# that passage is a row of its own (`part_of` the work: a field the schema lacks), carrying the edge (book-check
# addendum, "What the rules missed"). Asselin: not read this run (the copy could not be fetched).

