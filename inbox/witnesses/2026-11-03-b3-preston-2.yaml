# Batch 3 resumed (Nov. 3-4, 2026), reader "advisers": the witnesses Andrew Preston's *The War Council* (2006;
# w.preston-war-council) gives in its notes (pp. 251-301) for chapters 2-9 and the epilogue to p. 238, the pages the
# calendar cites. b3-preston (Oct. 29) was merged without its witness layer; these rows restore it. Read off the owner's
# copy (printed page = PDF page - 15 throughout; checked on the images of pp. 40 and 261), the notes parsed from the text
# layer, each note's items in its order (a, b, c ...), "ibid." resolved to the item before. FRUS documents identified by
# volume and page against the TEI's page breaks (github.com/HistoryAtState/frus) and the daybook; a document the
# registry already holds takes the edge, no row here. Works in the catalogue are their cards (no row). The edges:
# sources/witnesses/by-work/preston-war-council.yaml. Nothing here was read but Preston's note: `read: false` throughout.

