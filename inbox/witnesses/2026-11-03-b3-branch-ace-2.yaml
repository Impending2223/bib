  what: Hoover first resisted the idea that FBI agents would have any contact at all with the politically dangerous Alabama
    authorities, scrawling on a memo, "I thought the military (Federal) was in control." However, Inspector Joseph Sullivan
    bravely argued that the Bureau must have contact with both warring sides in Alabama in order to fulfill its duties as
    observers, in case there were violations of the federal court order. Hoover, under pressure from LBJ, permitted carefully
    limited contact behind a great show of FBI presence. See Belmont to Tolson, March 19, 1965, FSMM-177
