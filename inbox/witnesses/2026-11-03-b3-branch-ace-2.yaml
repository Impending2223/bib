- id: x.1966-09-09.director-to-new-york-chicago-cleveland
  what: Director to New York, Chicago, Cleveland, Detroit, Los Angeles, Mobile, Newark, Philadelphia, and Washington field
    offices, Sept. 9, 1966, FBPA-8. "Information available to the Bureau concerning formation of a Black Panther Party by
    Max Stanford, a New York Revolutionary Action Movement (RAM) leader, would indicate a completely separate organization
    is contemplated by Stanford," wrote Hoover. "Due to the propensity toward violence by Stanford and other RAM members as
    well as indications that Stokely Carmichael has offered to help Stanford to organize a New York based Black Panther Party,
    this matter should receive intensive investigative efforts. . .. There does not appear to be any actual connection between
    the Lowndes County Freedom Organization, a legitimate political party, and the formation of aBlack Panther Party in New
    York by Stanford." RAM had been founded in 1963 by the expatriate NAACP leader Robert Williams, on a platform that Stanford
    described as "revolutionary nationalism, black nationalism or just plain blackism." Stanford and Carmichael had known
    each other in New York, but quarreled in 1966 over what Carmichael thought was a surreptitious effort by Stanford to infiltrate
    SNCC with rigid RAM ideology. Cf. Tyson, Radio Free, pp. 290, 297
  kind: file
  date: '1966-09-09'
  where: FBI file 157-4825 (Black Panther Party, Alabama)
  agent:
  - Director
  made: contemporaneous
