- id: x.1965-08-26.in-a-phone-call-six-days
  what: 'In a phone call six days after the Daniels murder, LBJ exhorted Attorney General Katzenbach to, push a home rule
    bill with the argument that it was harder to gain the vote for Washington, D.C., than for "Downs County" or Mississippi.
    LBJ: "Where is Downs County?" Katzenbach: "Lowndes." LBJ: "Alabama? Lowndes." Katzenbach: "Lowndes is in Alabama." LBJ:
    "Now. A man''s gota whole lot better chance of getting the vote in Lowndes, a nigra has, in Lowndes County, Alabama, than
    he has of getting the vote in the District of Columbia Committee in the House of Representatives." LBJ phone call with
    Nicholas Katzenbach, 2:50 p.m., Aug. 26, 1965, Cit. 8639, Audiotape WH6508.11, LBJ'
  kind: recording
  date: '1965-08-26'
  where: LBJ Library
  agent:
