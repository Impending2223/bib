- id: x.1965-10-14.francis-walter-to-george-murray-oct
  what: Francis Walter to George Murray, Oct. 14, 1965, BIR/C10f57. "I was saddened by the letter you sent October 12," Walter
    replied to Bishop Murray, "but more distressed by the apparent vacuum it creates between the diocese and the [Selma Inter-Religious]
    Project. It is the last thing I intend to embarrass or insult you or the Diocese of Alabama. Given this feeling of mine
    and your position of being unable to cooperate or ask others to do so, | am not going to ask for an appointment with anyone
    at Diocesan House, nor will I embarrass you by dropping by. Though my thinking is not settled on what my relations should
    now be with clergy in the towns I will be visiting, I think I'll adopt the same general policy. ... ?m assuming that my
    staying away from Episcopalians is roughly what you want."
