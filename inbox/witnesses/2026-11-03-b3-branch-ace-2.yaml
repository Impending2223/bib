- id: x.1965-12-06.mlk-to-james-phelan-dec-6
  what: 'MLK to James Phelan, Dec. 6, 1965, A/KP18f45. "While Congressman Powell has criticised me on numerous occasions,
    I have always followed my consistent philosophy of not retaliating with criticisms, but trying to do the job of brotherly
    reconciliation," King wrote Phelan at Chase Manhattan Bank. His five-page apologia insisted that Powell was "not the incarnation
    of evil so much of the press has painted," and placed him instead in a long tradition of famboyant ethnic pioneers such
    as New York mayor James J. Walker: "When the Irish, Italian, Jewish and other minorities were struggling for equal access
    to American society, each produced leaders with conflicting and confusing tendencies."'
