- amend: x.1960-07-13.kozlov-report-plenum-draft
  set:
    where: TsKhSD (now RGANI), CPSU Central Committee Plenum Collection, Twenty-first Party Congress, esp. pp. 62–74 (Westad, *Brothers in Arms*, 26 n.89, 179 n.39); RGANI f.2 o.1 d.458, 12, 13, 65 (Friedman, *Shadow Cold War*, 52 nn.104–106, which dates the report July 7, 1960); not held
  why: 'Friedman cites the same report to the July 1960 plenum, by the same author, from the same plenum collection (f.2, op.1) and within the same pages (65 in 62–74), as "Report of Frol Kozlov at CC CPSU plenum, July 7, 1960": one record; his "July 7" against Westad''s draft of July 13 kept here and in the entries (audit of Friedman run 1, Nov. 21, 2026).'
- amend: x.1964-02-14.speech-mikhail-suslov-communist-party-plenum-february
  absorbs: x.1964-02-14.rgani-2-1-720-p75-china-blames-soviet-union
  why: 'One record: Dikotter''s "RGANI file of Feb. 14, 1964, 2-1-720, p. 75 (Suslov: China blamed the Soviet Union for the famine)" is f.2 o.1 d.720, which Friedman cites (107 nn.22-26) as Suslov''s speech to the plenum of Feb. 14, 1964, at pp. 18-127; p. 75 falls within it (audit of Friedman run 1, Nov. 21, 2026).'
