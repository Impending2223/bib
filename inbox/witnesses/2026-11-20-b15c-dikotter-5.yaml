- amend: x.1961-02-09.guangdong-file-235-1-259-coupons
  absorbs: x.1961-02-09.guangdong-file-235-1-255
  set:
    where: cited by Dikötter (2017 ed.), 199 n.7 (as 235-1-255), 205 n.34, n.36; Guangdong Provincial Archives, 235-1-259, pp. 39–40; not held
  why: 'One record, printed once as 235-1-255 (199 n.7) and twice as 235-1-259 (205 n.34, n.36): the same day (Feb. 9, 1961), the same pages (39-40), the same fonds (235-1, the provincial People''s Congress files); two papers of one day at the same pages of two volumes are not likely, and the matter (Guangdong units trading outside the plan, the unexchanged coupons, the infractions in a report to the provincial People''s Congress) is one report''s. Which volume holds it is not known: the book cites 235-1-255 elsewhere too (Oct. 30, 1961, pp. 170 and 179); 259 kept, as printed twice. Run 5 of Dikotter, on the run 4 audit''s flag; held by the run 5 audit.'
