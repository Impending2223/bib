# Witnesses for *Robert Kennedy in His Own Words* (w.robert-kennedy-in-his), Guthman and Shulman eds., 1988: the
# Kennedy Library's recorded interviews with Robert Kennedy, of which the book prints the transcript as the Library
# re-edited it against the tapes (its Editorial Note, xi). Reading of Nov. 4, 2026 (patch b3-rfk-own-words-2). The
# Schlesinger session of Feb. 27, 1965 is registered already (x.1965-02-27.rfk-recorded-interview-by-the-author); the
# rows the registry holds for single transcript pages (x.1964-03-01.rfk-recorded-interview-by-john-bartlow and the like,
# from Schlesinger's notes) are pages of the sessions below. The book does not mark where each of the four Martin
# sessions of Mar. 1-May 14, 1964, or each of the three Lewis sessions, begins: each set is one row here.
