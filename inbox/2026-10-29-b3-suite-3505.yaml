      when: Nov. 17
      date: '1961-11-17'
      thread: goldwater
      also:
      - elections-1964
      c: 'Washington, Goldwater''s office, after 9 a.m. White and Thone, Nebraska''s national committeeman, report the group''s plans: no candidate before the elections of 1962, an organization meanwhile.
        Goldwater: "This is the best thing I''ve heard of since I became active in the Republican Party on the national scene." His speaking schedule to be sent them. He thinks Rockefeller''s nomination
        all but settled; his interest the platform. By White''s account.'
      n: '[[w.white-suite-3505]], 45–46. See [[cal.1961-10-08.goldwater]]. Names: White, Thone, Goldwater, Rockefeller.'
      src:
        c: e9815865
        rows:
