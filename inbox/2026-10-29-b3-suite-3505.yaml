      c: 'Oklahoma City, at the national committee''s meeting. White, with Tyler, Oklahoma''s national committeeman: the start of a conservative caucus on the committee. Roger Milliken brings the money
        he has raised for the group, enough for four months. By White''s account.'
      n: '[[w.white-suite-3505]], 54. See [[cal.1962-01.republican-party]]. Names: White.'
