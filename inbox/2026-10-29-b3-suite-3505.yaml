      when: July
      date: 1962-07
      thread: goldwater
      also:
      - republican-party
      c: 'Goldwater to Miller, the national chairman, by letter, on the All-Republican Conference: it would give a larger voice to "the same people who caused most of our present party troubles. Most of
        those named as leaders of this new group contributed to the divisive tactics of the 1960 campaign"; the same men responsible for the Eisenhower administration''s policies that "ran counter to the
        traditional principles of the Republican Party." Eisenhower defends the new groups.'
      n: '[[w.white-suite-3505]], 71–72. See [[cal.1962-06-30.republican-party]]. Names: Goldwater, Miller, Eisenhower. Check: the date.'
