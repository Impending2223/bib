      date: '1962-06-30'
      thread: republican-party
      c: Gettysburg, a tent on Eisenhower's farm. The party's leaders unveil an All-Republican Conference, a hundred to work with the national committee on policy, and a Republican National Citizens' Committee.
      n: '[[w.white-suite-3505]], 71–72. Names: Eisenhower. Check: the date; White has it "a week later" than June 22.'
      src:
        c: a1523501
        rows:
