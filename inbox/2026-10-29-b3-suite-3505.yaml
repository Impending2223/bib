      c: 'Washington, a news conference. Rockefeller on Cuba: he hopes the administration is not appeasing; asked of a secret arrangement between the President and Khrushchev on the exiles: "Well, I have
        no idea. But maybe Mr. Khrushchev will release some more of the correspondence and we will find out."'
      n: '[[w.white-suite-3505]], 156–57. Names: Rockefeller, Khrushchev.'
