      c: 'The *New York Times*, Cabell Phillips''s interview. Goldwater: "I don''t want the nomination. I''m not looking for it. I haven''t authorized anybody to look for it for me. But who can tell what
        will happen a year from now? A man would be a damn fool to predict with finality what he would do in this unpredictable world."'
      n: '[[w.white-suite-3505]], 135. To check: *New York Times*, Apr. 15, 1963 (cited by [[w.white-suite-3505]], 135 n.3). See [[cal.1963-04-08.elections-1964]]. Names: Goldwater.'
