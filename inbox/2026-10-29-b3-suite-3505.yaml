      thread: republican-party
      c: 'Washington, the dinner of the Senate and House Republican campaign committees. Eisenhower against the "sophistication" that would use "the FBI, the Internal Revenue Service, the Defense Department,
        the Justice Department, as well as the White House" against business and citizens: "we fight, as against a plague, the whole host of national planning and spending schemes that would destroy the
        enterprise and individuality of our people."'
      n: '[[w.white-suite-3505]], 71. Names: Eisenhower. Check: the date; White read the speech, given "the night before," on June 23.'
      src:
        c: c383e028
