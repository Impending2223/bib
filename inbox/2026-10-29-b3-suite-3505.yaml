      c: 'New York, the Americana, the Presidential suite. White shows Goldwater the program for the group''s December meeting: a State-by-State organization, a budget, the dates of the conventions and
        primaries of 1964, his count of delegates. Goldwater: "This looks good. It''s fine." He agrees with Rockefeller on "a lot of things"; nothing said of running. By White''s account.'
