      when: Nov. 9
      date: '1961-11-09'
      thread: goldwater
      also:
      - elections-1964
      c: 'Rusher to Goldwater, by special delivery to Phoenix: the group met at Chicago Oct. 8 has made itself a permanent, informal committee, White its chairman; it meets again Dec. 10 and would send
        a few of its members to him; "the beginning of the most serious professional effort in almost a decade to turn the Republican party into a more conservative channel."'
      n: '[[w.white-suite-3505]], 44. Made public: [[w.white-suite-3505]], 44. See [[cal.1961-10-08.goldwater]]. Names: Rusher, Goldwater, White.'
