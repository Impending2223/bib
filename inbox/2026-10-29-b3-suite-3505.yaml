      when: Dec. 10
      date: '1961-12-10'
      thread: goldwater
      also:
      - elections-1964
      c: Chicago, the Avenue Motel. White's group, its second meeting, twenty-eight present; new among them Governor Nutter of Montana, Tad Smith, the Texas chairman, and Fay of the national committee.
        A budget of $65,000 for the year approved; Roger Milliken finance chairman, to raise the first $30,000. The country in nine regions, a director each; delegates to be sought in every State, from
        the precinct caucuses of 1962 and 1963 up. Among themselves, "the Clif White group."
      n: '[[w.white-suite-3505]], 46–51. See [[cal.1961-10-08.goldwater]]. Names: White, Nutter.'
      src:
        c: 0f8dc9b1
        rows:
        - 'w.white-suite-3505 46–51: all'
      tags:
