      c: '*Time*: Goldwater "the hottest political figure this side of Jack Kennedy"; since March more than 650 written invitations to speak, 800 letters a day. On the Presidency: "I have no plans for it.
        I have no staff for it, no program for it and no ambition for it."'
      n: '[[w.white-suite-3505]], 31. To check: *Time*, June 23, 1961. Names: Goldwater.'
