      c: Washington, the Jefferson Hotel. Goldwater with Shadegg, his campaign manager, and five other Republicans, Roger Milliken of South Carolina's national committee among them, on reviving the party.
        Shadegg would start on the nomination of 1964; Goldwater cuts the talk short. For national chairman when Morton leaves, Goldwater for Bliss, the Ohio chairman.
      n: '[[w.white-suite-3505]], 25–26. Names: Goldwater, Shadegg, Morton, Bliss. Check: the date; White has it "several weeks after" the election.'
