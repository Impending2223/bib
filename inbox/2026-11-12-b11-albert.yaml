patch: 2026-11-12-b11-albert
by: Claude (batch 11 reader, Albert, Little Giant)
ops:
- add:
    entry:
      id: cal.1960-12-31.rules
      when: Dec. 31
      date: '1960-12-31'
      thread: rules
      c: 'The Speaker''s office, a Saturday. Rayburn with McCormack, Bolling, Deschler, a few Texas congressmen and Albert
        weighs the Rules Committee: a restored twenty-one-day rule, three added members, or Colmer''s removal for campaigning
        in Mississippi against the party''s ticket. Rayburn had offered Smith the enlargement that morning; Smith would have
        none of it. Rayburn gives no sign of his mind. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 238–39 (the day, "a Saturday, the last day of 1960"; those present; the three courses;
        Smith''s refusal; Rayburn''s silence). Names: Rayburn, McCormack, Bolling, Colmer, Smith, Albert.'
      tags:
      - name:rayburn-sam
      - name:mccormack-john-w
      - name:bolling-richard
      - name:colmer-william-m
      - name:smith-howard-w
      - name:albert-carl
      - state:ms
- add:
    entry:
      id: cal.1961-01-02.rules
      when: Jan. 2
      date: '1961-01-02'
      thread: rules
      c: 'Rayburn to a group of liberal Democrats: no restored twenty-one-day rule, and Smith has refused to enlarge the committee.
        He will recommend that the Democratic caucus remove Colmer and seat a loyal Democrat. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 240 (Jan. 2, 1961). Names: Rayburn, Smith, Colmer.'
      tags:
      - name:rayburn-sam
      - name:smith-howard-w
      - name:colmer-william-m
- add:
    entry:
      id: cal.1961-06-12.congress
      when: June 12
      date: '1961-06-12'
      thread: congress
      c: House honors Rayburn on his sixteenth year and 273rd day as Speaker, more than twice as long as any other Speaker,
        Albert says. Rayburn speaks of his love of the House and his gratitude to his district. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 251. Names: Rayburn, Albert.'
      tags:
      - name:rayburn-sam
      - name:albert-carl
- add:
    entry:
      id: cal.1961-10-29.elections-1962-3
      when: Oct. 29
      date: '1961-10-29'
      thread: elections-1962
      c: Big Cedar, Okla. Kennedy dedicates a highway and praises Albert's work for his program; some of the press read it
        as a plug for Albert as next majority leader. He spends the night at Kerr's ranch. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 248–49 ("That fall"; the caption, p. 249, has 1961). Check: the day: the work gives
        none; Oct. 29 is the day of [[cal.1961-10-29.elections-1962-2]] (Kerr''s ranch). Names: Kennedy, Albert, Kerr.'
      tags:
      - name:kennedy-john-f
      - name:albert-carl
      - name:kerr-robert-s
      - state:ok
- add:
    entry:
      id: cal.1961-11-19.congress
      when: Nov. 19
      date: '1961-11-19'
      thread: congress
      c: Bolling announces that he is running for majority leader. Albert, in McAlester, Okla., since Rayburn's funeral, hears
        it from his assistant, Charles Ward, by telephone and on national radio. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 254 ("On Sunday" after the funeral "on a Saturday"). Check: the day: the work gives
        no date; Rayburn died Thursday, Nov. 16 ([[cal.1961-11-16.congress]]), so the Sunday is Nov. 19. Names: Bolling, Rayburn,
        Albert.'
      tags:
      - name:bolling-richard
      - name:rayburn-sam
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11-19.congress-2
      when: Nov. 19
      date: '1961-11-19'
      thread: congress
      c: 'Albert announces for majority leader, by call to the AP''s congressional correspondent and by telegram to 269 members,
        "a few friends and the entire Democratic membership of Congress": "I take this means of advising that I am making
        the race for majority leader of the House subject to the action of the Democratic caucus. I will greatly appreciate
        your support and help. I would like to talk to you about the matter at your convenience." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 254–55 (the telegram read off the page image, 255; the AP''s Bill Arbogast). Check:
        the day: the work puts it after Bolling''s announcement on the Sunday ([[cal.1961-11-19.congress]]). See [[cal.1961-11-19.congress]].
        Names: Albert.'
      tags:
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11.congress
      when: Nov.
      date: 1961-11
      thread: congress
      c: 'McAlester, Okla. Kerr, asked by telephone what help Albert needs, is told: phones. Within the hour three telephone
        workers install a bank of them in Albert''s offices in the Federal Building; he works them for four days. By Albert''s
        account.'
      n: '[[w.albert-little-giant-1990]], 255. Check: the day: the work gives none; after the telegram ([[cal.1961-11-19.congress-2]]).
        Names: Kerr, Albert.'
      tags:
      - name:kerr-robert-s
      - name:albert-carl
      - state:ok
- add:
    entry:
      id: cal.1961-11.congress-2
      when: Nov.
      date: 1961-11
      thread: congress
      c: 'Fogarty of Rhode Island to Albert, by telephone: Kirwan has called him, and the two will go all out for him. By
        Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 255. Check: the day: the work gives none; one of the first calls after the telegram.
        Names: Fogarty, Albert.'
      tags:
      - name:fogarty-john-e
      - name:albert-carl
      - state:ri
- add:
    entry:
      id: cal.1961-11.congress-3
      when: Nov.
      date: 1961-11
      thread: congress
      c: 'Powell to Albert, by telephone: "I''m for you a 100 percent," and he is issuing a statement to the press. By Albert''s
        account.'
      n: '[[w.albert-little-giant-1990]], 255–56. Check: the day: the work gives none; the call after Fogarty''s. Names: Powell,
        Albert.'
      tags:
      - name:powell-adam-clayton-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1961-11.congress-4
      when: Nov.
      date: 1961-11
      thread: congress
      c: 'Smith to Albert, by telephone: he backs him and will work with the southerners for him. Albert tells him Powell
        has just called and will put out a release for him: "I wouldn''t want you to be embarrassed." Smith: "Don''t worry,
        Carl, I figure a guy''s got to get a vote anywhere he can get it, and you still have mine." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 256. Check: the day: the work gives none; the call after Powell''s. Names: Smith,
        Powell, Albert.'
      tags:
      - name:smith-howard-w
      - name:powell-adam-clayton-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1962-01-03.congress
      when: Jan. 3
      date: '1962-01-03'
      thread: congress
      c: 'Bolling to the press: "I am withdrawing from the race for leadership of the House. Developments of the last few
        days have convinced me that I don''t have a chance to win." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 257 ("a week before the 1962 Congress convened"). Names: Bolling, Albert.'
      tags:
      - name:bolling-richard
      - name:albert-carl
- add:
    entry:
      id: cal.1962-01.congress
      when: Jan.
      date: 1962-01
      thread: congress
      c: House Democratic caucus names its leadership slate. McCormack and Albert draw no opponent; Bolling moves that Albert's
        selection be unanimous. Albert says he is the first majority leader of the century to win his party's first caucus
        election without opposition. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 257. Check: the day: the work gives none; after Bolling''s withdrawal ([[cal.1962-01-03.congress]])
        and before the session opened Jan. 10. See [[cal.1962-01-03.congress]]. Names: McCormack, Albert, Bolling.'
      tags:
      - name:mccormack-john-w
      - name:albert-carl
      - name:bolling-richard
- add:
    entry:
      id: cal.1962-01.congress-2
      when: Jan.
      date: 1962-01
      thread: congress
      c: Albert, with McCormack's agreement, names Hale Boggs whip, his own old post. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 258 ("our first order of business"). Check: the day: the work gives none. See [[cal.1962-01.congress]].
        Names: Albert, McCormack, Boggs.'
      tags:
      - name:albert-carl
      - name:mccormack-john-w
      - name:boggs-hale
- add:
    entry:
      id: cal.1962-09-20.farm
      when: Sept. 20
      date: '1962-09-20'
      thread: farm
      c: 'House votes on the conference report on the farm bill, supply management for wheat only: 202–197, after the margin
        against has stood at twenty-one. Albert and Boggs hold the roll open: members sent to ask "how am I recorded?" Halleck''s
        point of order, "for obvious purposes of delay"; McCormack overrules: "The Chair cannot look into the minds of members
        and determine their motives." Three switches decide it. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 272–73 ("It came on September 20"). See [[cal.1962-06-21.program]]. Names: Albert,
        Boggs, Halleck, McCormack.'
      tags:
      - name:albert-carl
      - name:boggs-hale
      - name:halleck-charles-a
      - name:mccormack-john-w
- add:
    entry:
      id: cal.1963-11-21.congress-2
      when: Nov. 21
      date: '1963-11-21'
      thread: congress
      c: 'The Oval Office, after the leaders'' meeting in the Cabinet Room. Kennedy keeps Albert for a legislative matter;
        his helicopter lands near the Rose Garden, he watches it, says good-bye and leaves for Andrews and Texas. Albert:
        "I was the last person to visit with him in the White House." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 280–81. See [[cal.1963-11-21.trade]]. Names: Kennedy, Albert.'
      tags:
      - name:kennedy-john-f
      - name:albert-carl
- add:
    entry:
      id: cal.1963-11-22.succession-30
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Sorensen telephones Albert at his office: the President is dead. Albert had heard of the shooting at lunch from
        Lydia Vacin, a House Agriculture Committee secretary. He says he railed against "the madness of the assassination"
        and said "over and over that he never should have gone." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 281. Names: Sorensen, Albert.'
      tags:
      - name:sorensen-theodore-c
      - name:albert-carl
- add:
    entry:
      id: cal.1963-12-23.foreign-aid-4
      when: Dec. 23
      date: '1963-12-23'
      thread: foreign-aid
      c: 'The Oval Office, the night. Johnson, McCormack and Albert telephone for one more vote to make a quorum of the Rules
        Committee to send the aid conference report to the floor; most members cannot be found. About 2 a.m. Albert reaches
        Colmer at a Mississippi hospital, where his wife is ill: "Bill, we need you, your party needs you, and President Johnson
        needs you. We all need you to give us a quorum." Colmer flies through a blizzard to Washington. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 283. See [[cal.1963-12-23.foreign-aid]]. Names: Johnson, McCormack, Albert, Colmer.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:colmer-william-m
      - state:ms
- add:
    entry:
      id: cal.1963-12-24.foreign-aid-2
      when: Dec. 24
      date: '1963-12-24'
      thread: foreign-aid
      c: 7 a.m. Colmer votes against taking up the aid bill, but his presence gives the Rules Committee its quorum, and the
        bill goes to the House, which passes it. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 283. Check: the hour: Albert has the Rules Committee at 7 a.m.; [[cal.1963-12-24.foreign-aid]]
        has the House in session then. See [[cal.1963-12-23.foreign-aid-4]]. Names: Colmer.'
      tags:
      - name:colmer-william-m
- add:
    entry:
      id: cal.1964-01-30.civil-rights-bill-2
      when: Jan. 30
      date: '1964-01-30'
      thread: civil-rights-bill
      c: Smith assembles about sixty Southern Democrats to plan strategy, the afternoon of the Rules Committee's vote on the
        rule. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 286. See [[cal.1964-01-30.civil-rights-bill]]. Names: Smith.'
      tags:
      - name:smith-howard-w
- add:
    entry:
      id: cal.1964-07.democratic-party
      when: July
      date: 1964-07
      thread: democratic-party
      c: 'Albert, on a motor trip to Quebec with his wife and son during the House recess for the Republican convention, tells
        no one on his staff where he is. Johnson has the FBI, the RCMP and the White House switchboard find him: Albert is
        to direct the Democratic platform committee, and to start now. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 288. Check: the day: the work gives none; the recess was for the Republican convention
        in July. Names: Johnson, Albert.'
      tags:
      - name:johnson-lyndon-b
      - name:albert-carl
- add:
    entry:
      id: cal.1964-08-24.elections-1964-atlantic-city
      when: Aug. 24–27
      date: '1964-08-24'
      thread: elections-1964-atlantic-city
      c: 'Atlantic City. Albert on the Republican slogan "In your heart you know he''s right": "In your heart you know he''s
        right—too far right." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 290. Check: the day: the work gives none; the convention sat Aug. 24–27. Names:
        Albert.'
      tags:
      - name:albert-carl
      - city:atlantic-city
      - state:nj
- add:
    entry:
      id: cal.1964-08-04.vietnam-congress-3
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-congress
      c: 'After the Democratic leaders'' breakfast Johnson keeps Albert for other business. A telephone call comes: "They
        have?" Then: "Now, I''ll tell you what I want. I not only want those patrol boats destroyed, I want everything at
        that harbor destroyed, I want the whole damn works destroyed. I want to give them a real dose." He slams down the
        receiver. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 294–95 (read off the page image). See [[cal.1964-08-04.vietnam-congress]]. Names:
        Johnson, Albert.'
      tags:
      - name:johnson-lyndon-b
      - name:albert-carl
- add:
    entry:
      id: cal.1964-08-07.vietnam-congress-2
      when: Aug. 7
      date: '1964-08-07'
      thread: vietnam-congress
      c: 'House, on the Southeast Asia resolution, Morgan presenting it for Foreign Affairs. No one speaks against. Albert:
        "The president has asked us as representatives of the American people for our support. It is now time for all of us
        to join together as a nation firmly united behind our Commander-in-Chief and to express our complete confidence in
        him and in his leadership." Forty minutes in all. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 296. See [[cal.1964-08-07.vietnam]]. Names: Morgan, Albert.'
      tags:
      - name:morgan-thomas-e
      - name:albert-carl
- add:
    entry:
      id: cal.1967-07-20.cities-and-housing-2
      when: July 20
      date: '1967-07-20'
      thread: cities-and-housing
      c: 'Albert, that afternoon, to Barefoot Sanders, the President''s legislative assistant, after the rat bill: no new
        programs should be sent to the House; only the bare essentials could be got, and not always those. By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 301. See [[cal.1967-07-20.cities-and-housing]]. Names: Sanders, Albert.'
      tags:
      - name:sanders-h-barefoot-jr
      - name:albert-carl
- add:
    entry:
      id: cal.1968-02.vietnam-congress-4
      when: Feb.
      date: 1968-02
      thread: vietnam-congress
      c: 'Johnson, at a leadership meeting: "nobody says anything about Ho Chi Minh. Ho has a great image. But they call me
        a murderer." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 302. Check: the day: the work gives only "February 1968." Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-28.elections-1968-johnson-2
      when: Mar. 28
      date: '1968-03-28'
      thread: elections-1968-johnson
      c: South Carolina Democratic convention. Albert, before a quiet crowd, speaks for the party. Afterward the state chairman
        tells him Johnson could not carry one of the State's six congressional districts in a Democratic primary; McCarthy
        or Kennedy would take all six. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 302. Names: Albert, Johnson.'
      tags:
      - name:albert-carl
      - name:johnson-lyndon-b
      - state:sc
- add:
    entry:
      id: cal.1968-03-29.elections-1968-johnson-2
      when: Mar. 29
      date: '1968-03-29'
      thread: elections-1968-johnson
      c: New York City. Albert helps Representative John Murphy's campaign; the professionals tell him Johnson would finish
        third in New York. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 302 ("The next day"). Names: Albert, Murphy, Johnson.'
      tags:
      - name:albert-carl
      - name:murphy-john-m
      - name:johnson-lyndon-b
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-15
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: Johnson telephones Albert, hours before his television address, to tell him personally that he is withdrawing from
        the race. He leaves Albert chairman of the Democratic National Convention, at Chicago at the end of August. By Albert's
        account.
      n: '[[w.albert-little-giant-1990]], 302. See [[cal.1968-03-31.elections-1968-3]]. Names: Johnson, Albert.'
      tags:
      - name:johnson-lyndon-b
      - name:albert-carl
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-27
      when: Aug. 26–29
      date: '1968-08-26'
      thread: elections-1968-chicago
      c: 'Chicago. Albert, on his election as permanent chairman of the convention: "Our actions here will be viewed around
        the world. We will be judged by our decorum. We can make this convention a showcase of democracy or a shambles of
        discord. We might even make it lively and spirited." By Albert''s account.'
      n: '[[w.albert-little-giant-1990]], 303–04. Check: the day: the work gives none. See [[cal.1968-08-26.elections-1968]].
        Names: Albert.'
      tags:
      - name:albert-carl
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1968-08-26.elections-1968-chicago-platform-3
      when: Aug. 26–28
      date: '1968-08-26'
      thread: elections-1968-chicago-platform
      c: Chicago. Albert has the convention's rules amended to give two full hours, not the thirty minutes customary for a
        minority plank, to debate the Vietnam plank. By Albert's account.
      n: '[[w.albert-little-giant-1990]], 304–05. Check: the day: the work gives none; the platform''s second day. See [[cal.1968-08-26.elections-1968]].
        Names: Albert.'
      tags:
      - name:albert-carl
      - state:il
      - city:chicago
- cite:
    id: cal.1961-01-31.rules
    item: '[[w.albert-little-giant-1990]], 242–43 (the House vote, 217 ayes to 212 noes, Rayburn announcing it, on a fifteen-member
      Rules Committee; not "Rayburns last great fight" or the veto, and not the day: the page has "December 31, 1961")'
    units: '?'
- variant:
    id: cal.1961-01-31.rules
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: "The vote came on December 31, 1961," on the amendment of the rules for the Eighty-seventh Congress to
      provide a fifteen-member Rules Committee'
    at: '242'
- cite:
    id: cal.1961-03-24.program
    item: '[[w.albert-little-giant-1990]], 247–48 (Albert leads the debate for the leaderships version of the bill; it loses
      to the Kitchin–Ayres substitute; the Senate bill, the conferees and the restored bill; not the day)'
    units: '?'
- variant:
    id: cal.1961-03-24.program
    unit: A
    witness: w.albert-little-giant-1990
    reads: 'Albert: "we lost to Kitchin-Ayres, 186 to 185"'
    at: '248'
- cite:
    id: cal.1961-07-18.school-aid
    item: '[[w.albert-little-giant-1990]], 245–46 (the Rules Committee votes not to report the school bill, eight to seven;
      Delaney the deciding vote against; Albert, Ribicoff and Kennedy had pressed him; the page has "July" for the bill''s
      arrival, not the day)'
    units: '?'
- cite:
    id: cal.1961-11-16.congress
    item: '[[w.albert-little-giant-1990]], 251–52 (Rayburn dies at Bonham, early on Nov. 16, 1961; Truman, Eisenhower, Kennedy
      and Johnson at the funeral)'
    units: A, B
- cite:
    id: cal.1962-01-10.congress
    item: '[[w.albert-little-giant-1990]], 257–58 (the House elects McCormack Speaker on party lines, 248 to 166, as the session
      opens, and Alberts selection as majority leader is announced; Albert names Boggs whip; not the day)'
    units: '?'
- cite:
    id: cal.1962-06-21.program
    item: '[[w.albert-little-giant-1990]], 272 (the House votes the farm bill down, 215 to 205, June 21; Albert, with four
      members ready to switch, spares them; not the "mandatory" controls: the page has supply management for milk and feed
      grains, wheat and corn)'
    units: '?'
- cite:
    id: cal.1962-06-28.trade
    item: '[[w.albert-little-giant-1990]], 267–68 (the trade expansion bill: Alberts "key vote, 253 to 171," not the passage
      count of 298–125 or the day; the bill law by the end of 1962, p. 271)'
    units: '?'
- cite:
    id: cal.1962-07-17.medicare
    item: '[[w.albert-little-giant-1990]], 268–69 (Kerr keeps Medicare out of the Senate welfare bill, 52 to 48; not the Anderson–Javits
      amendment, the tabling or the day)'
    units: '?'
- cite:
    id: cal.1962-09-26.missile-crisis
    item: '[[w.albert-little-giant-1990]], 264 (the Cuba resolution passed in September, authorizing action to prevent the
      export of Castros revolution; not the day or the count)'
    units: '?'
- cite:
    id: cal.1962-10-05.berlin-and-vienna
    item: '[[w.albert-little-giant-1990]], 264 (the Berlin resolution rushed through in October, "to prevent by whatever means
      may be necessary, including the force of arms" any Soviet interference with Western rights; not the count or the day)'
    units: '?'
- cite:
    id: cal.1962-10-22.missile-crisis-4
    item: '[[w.albert-little-giant-1990]], 264–65 (Monday, October, 5 p.m.: the leaders of both houses and the committee chairmen
      told of the missiles and the quarantine; Russell: a quarantine "too weak a response," invade; Kennedy: an invasion likely
      would trigger nuclear war; not the photographs, Fulbright, or "too slow and too risky")'
    units: '?'
- cite:
    id: cal.1963-06-11.civil-rights-bill
    item: '[[w.albert-little-giant-1990]], 276 (the address that evening: "a moral issue. It is as old as the Scriptures and
      is as clear as the American Constitution"; a bill to be sent; not the hour)'
    units: '?'
- cite:
    id: cal.1963-09-25.economy
    item: '[[w.albert-little-giant-1990]], 271 (the House passes the tax cut, Sept. 25, 271 to 155; not the party divisions
      or the rates)'
    units: '?'
- cite:
    id: cal.1963-11-20.civil-rights-bill
    item: '[[w.albert-little-giant-1990]], 279 (Celler submits the bill, Nov. 20, 1963, and prepares a discharge petition;
      the page does not say Rodino, H.R. 7152 or H. Rept. 914)'
    units: '?'
- cite:
    id: cal.1963-11-21.trade
    item: '[[w.albert-little-giant-1990]], 280 (the morning meeting of the House and Senate Democratic leaders in the Cabinet
      Room before Kennedy leaves for Texas; not a breakfast, Mundts bill or the Senate vote)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-17
    item: '[[w.albert-little-giant-1990]], 281 (Air Force One arrives at Andrews that night; a military guard removes the
      coffin; Johnson gets out and joins Albert and Johnsons oldest House friends; not Robert Kennedy or the forklift)'
