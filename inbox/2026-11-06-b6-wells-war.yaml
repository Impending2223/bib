      c: 'The SDS march. Ellsberg of the Defense Department, at the Pentagon since August, his first Saturday off, there with
        Patricia Marx, who is interviewing for her public radio program in New York, Stone among those she means to interview;
        he carries her tape recorder. He had helped produce the White Paper Stone demolished. Ellsberg, later: he "never would
        have gone" but for her.'
      n: '[[w.wells-war-within]], 25–26. To check: Daniel Ellsberg, interview by Wells (cited by [[w.wells-war-within]], 26
        n.61). See [[cal.1965-04-17.students]]. Names: Ellsberg, Stone.'
