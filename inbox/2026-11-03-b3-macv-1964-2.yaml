      id: cal.1964-10-02.vietnam
      when: Oct. 2
      date: '1964-10-02'
      thread: vietnam
      also:
      - vietnam-saigon
      c: 'Westmoreland to Taylor, the J1''s survey of the coup of Sept. 13: "while the coup did have an adverse affect on
        the morale and combat effectiveness of the various elements, the overall effect was less severe than might have
        been predicted."'
      n: '[[w.macv-command-history-1964]], 28. To check: Memo, COMUSMACV to Amb Taylor, 2 Oct 64, Subj: Evaluation of Morale
        and Combat Effectiveness of RVN Units in Post-Coup Attempt Period (cited by [[w.macv-command-history-1964]], 28
        n.61). Names: Westmoreland, Taylor.'
      src:
        c: d04a6d89
        rows:
        - 'w.macv-command-history-1964 28: all'
        - 'via w.macv-command-history-1964 28 n.61: all'
      tags:
      - name:westmoreland-william
      - name:taylor-maxwell
    section: '196410'
- add:
    entry:
      id: cal.1964-03-16.vietnam-2
      when: Mar. 16
      date: '1964-03-16'
      thread: vietnam
      c: 'Harkins to Khánh, a letter: better housing for the army''s dependents. McNamara, on his visit, raises it too and
        asks MACV to help Saigon build it quickly.'
      n: '[[w.macv-command-history-1964]], 28. Check: the day; the text gives Mar. 16, the note''s letter Mar. 31. To check:
        Ltr, COMUSMACV to Gen Khanh, Ser 753, 31 Mar 64 (cited by [[w.macv-command-history-1964]], 28 n.63). Names: Harkins,
        Khánh, McNamara.'
      src:
        c: 8b6015a0
        rows:
        - 'w.macv-command-history-1964 28: all'
        - 'via w.macv-command-history-1964 28 n.63: all'
      tags:
      - name:harkins-paul-d
      - name:nguyen-khanh
      - name:mcnamara-robert-s
    section: '196403'
- add:
    entry:
      id: cal.1964-06-16.vietnam
      when: June 16
      date: '1964-06-16'
      thread: vietnam
      c: Westmoreland to Khánh, a stronger letter on the army's dependent housing, asking his immediate attention; Khánh
        had not answered the course of action Westmoreland, as deputy, set out May 19. The year's housing budget then raised
        from 50 to 350 million piasters; 12,343 units built in 1964.
      n: '[[w.macv-command-history-1964]], 28–29. To check: Ltr, COMUSMACV to Gen Khanh, Ser 1391, 16 Jun 64 (cited by [[w.macv-command-history-1964]],
        29 n.64). See [[cal.1964-03-16.vietnam-2]]. Names: Westmoreland, Khánh.'
      src:
        c: 608b0ffe
        rows:
        - 'w.macv-command-history-1964 28–29: all'
        - 'via w.macv-command-history-1964 29 n.64: all'
      tags:
