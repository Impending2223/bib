    section: '196411'
- add:
    entry:
      id: cal.1964-09.vietnam-7
      when: Sept.
      date: 1964-09
      thread: vietnam
      c: Dependents no longer brought to Vietnam at government expense unless the sponsor has an accompanied tour; 120 positions
        so authorized at year's end, 547 military dependents in the country. In February, after the bombings in Saigon,
        some had sent their dependents home.
      n: '[[w.macv-command-history-1964]], 19. Check: the day.'
      src:
        c: 5bc9349d
        rows:
        - 'w.macv-command-history-1964 19: all'
    section: '196409'
- add:
    entry:
      id: cal.1964-07.vietnam-3
      when: July
      date: 1964-07
      thread: vietnam
      c: CINCPAC backs MACV's request that Congress let Americans accept and keep South Vietnamese decorations for combat
        service. Congress has not acted by the year's end.
      n: '[[w.macv-command-history-1964]], 19. Check: the day.'
      src:
        c: a4455a80
        rows:
        - 'w.macv-command-history-1964 19: all'
    section: '196407'
- add:
