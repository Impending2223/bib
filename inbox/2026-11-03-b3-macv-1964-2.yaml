- add:
    entry:
      id: cal.1964-11.vietnam-2
      when: Nov.
      date: 1964-11
      thread: vietnam
      c: Westmoreland approves the Provost Marshal's master plan for the security of the American officers' and enlisted
        men's quarters in Saigon and Cholon.
      n: '[[w.macv-command-history-1964]], 20. Check: the day. Names: Westmoreland.'
