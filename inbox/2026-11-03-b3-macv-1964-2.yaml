        for Additional Security Forces for US STRATCOM Site, Phu Lam (U) (cited by [[w.macv-command-history-1964]], 103
        n.137); Ltr, COMUSMACV to SA, CMD, Ser 1000, 26 Sep 64, Subj: Request for Security Forces for US STRATCOM Site,
        Phu Lam (U) (cited by [[w.macv-command-history-1964]], 103 n.138). Names: Westmoreland.'
