        - 'w.macv-command-history-1964 16: all'
        - 'via w.macv-command-history-1964 16 n.21: all'
      tags:
      - name:westmoreland-william
    section: '196411'
- add:
    entry:
      id: cal.1964-03.vietnam-3
      when: Mar.
      date: 1964-03
      thread: vietnam
      c: 'The Murday Report: MACV''s Adjutant General''s review of the South Vietnamese army''s personnel policies and administration,
        at the J1''s direction. Harkins sends the rationale of 26 actions to the Chairman of the Military Revolutionary
        Council: "if the war is to be won it will be the soldiers who win it."'
      n: '[[w.macv-command-history-1964]], 22. Check: the day; and the Chairman (Khánh), as the OCR reads "Chatman of the
        Military". Names: Harkins.'
      src:
        c: 8f5f5cb2
        rows:
        - 'w.macv-command-history-1964 22: all'
      tags:
      - name:harkins-paul-d
    section: '196403'
- add:
    entry:
      id: cal.1964-06.vietnam-3
      when: June
      date: 1964-06
      thread: vietnam
      c: 'MACV recommends a larger Women''s Army Corps for the South Vietnamese army; rejected by the High Command, later
        approved in principle: 700 to 2,000.'
      n: '[[w.macv-command-history-1964]], 26. Check: the day. To check: Fact Sheet, MACJ1 to CofS, 27 Jan 65, Subj: GVN
        Forces Buildup (cited by [[w.macv-command-history-1964]], 26 n.47).'
      src:
        c: 1b6fcb0f
        rows:
        - 'w.macv-command-history-1964 26: all'
        - 'via w.macv-command-history-1964 26 n.47: all'
    section: '196406'
- add:
    entry:
      id: cal.1964-11.vietnam-3
      when: Nov.
      date: 1964-11
      thread: vietnam
      c: South Vietnamese Women's Army Corps recruiting begins; a training center near Tân Sơn Nhứt to open in late January
        1965, a detachment for each corps.
      n: '[[w.macv-command-history-1964]], 26. Check: the day. See [[cal.1964-06.vietnam-3]].'
      src:
        c: df6e0047
        rows:
        - 'w.macv-command-history-1964 26: all'
    section: '196411'
- add:
