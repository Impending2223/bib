      thread: vietnam
      c: After the Brink bombing, MACV's Chief of Staff names an ad hoc committee under the J3 on the security of Americans
        in Saigon, Gia Định and Cholon.
      n: '[[w.macv-command-history-1964]], 106. To check: DF, MACJ324, 26 Dec 64, Subj: Physical Security of Greater Saigon
