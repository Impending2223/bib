      when: Sept. 8
      date: '1964-09-08'
      thread: vietnam
      c: 'The Capital Military District''s senior adviser on the STRATCOM site at Phú Lâm: external security inadequate;
        asks an airborne or Ranger company each night and a tank company. Westmoreland finds no threat to justify more from
        the High Command (Sept. 26).'
