      thread: vietnam-force-levels
      c: The 716th Military Police Company assigned to Saigon and Cholon, adding to the 75th Detachment.
      n: '[[w.macv-command-history-1964]], 20. Check: the day; the History reads "the 716th" or "the H6th" (OCR). See [[cal.1964-03.vietnam-force-levels]].'
