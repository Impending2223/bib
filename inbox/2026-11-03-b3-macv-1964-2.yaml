        the religious sects; eight at first. By the year''s end 74: 49 Hòa Hảo, 13 Cao Đài, 12 Cambodian.'
      n: '[[w.macv-command-history-1964]], 118. Check: the day.'
      src:
        c: 2ee9b72f
        rows:
        - 'w.macv-command-history-1964 118: all'
