        recommends training at the four national centers and Đức Mỹ, not Quang Trung alone; emergency construction at the
        centers.'
      n: '[[w.macv-command-history-1964]], 116. Check: the day.'
      src:
        c: 82a18364
        rows:
        - 'w.macv-command-history-1964 116: all'
