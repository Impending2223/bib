      date: '1964-10-05'
      thread: vietnam
      c: 'The I Corps senior adviser to MACV''s Chief of Staff: Big Squirt''s sites not secured "to the degree appropriate
        to their financial cost and the propaganda value attached to their destruction"; double fencing, lights, towers.
        The Army''s contract with Page Electronics changed: work from February 1965.'
      n: '[[w.macv-command-history-1964]], 103. To check: Msg, CGUSASCC to COMUSMACV, DTG 251932Z Sep 64; Msg, CGUSASCC
