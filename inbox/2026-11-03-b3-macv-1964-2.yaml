        and 64 armed Nùng guards. Westmoreland refuses both (Oct. 26); the 64 go into USOM's plan for a reserve police force.
      n: '[[w.macv-command-history-1964]], 104. To check: Ltr, CGUSASCV to COMUSMACV, 3 Oct 64, Subj: Physical Security
        of the STRATCOM Station Located at Phu Lam (U) (cited by [[w.macv-command-history-1964]], 104 n.139); Ltr, COMUSMACV
        to CGUSASCV, Ser 5541, 26 Oct 64, Subj: Physical Security of the US STRATCOM Site (U) (cited by [[w.macv-command-history-1964]],
        104 n.140). See [[cal.1964-09-08.vietnam-4]]. Names: Westmoreland.'
