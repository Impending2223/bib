      date: '1964-11-10'
      thread: vietnam
      c: 'The Army Concept Team''s study of door gunners'' weapons on the UH-1Bs of seven airmobile companies: keep the
        M60 machine gun, add M16 rifles, test mounts in the United States.'
      n: '[[w.macv-command-history-1964]], 115. To check: Study, ACTIV, 10 Nov 64, Subj: Improved Weapons and Munitions
        (52-850-0) Weapons for Helicopter Door Gunners (cited by [[w.macv-command-history-1964]], 115 n.168).'
