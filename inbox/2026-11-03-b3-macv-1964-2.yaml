      id: cal.1964-12-24.vietnam-2
      when: Dec. 24
      date: '1964-12-24'
      thread: vietnam
      c: 'Bob Hope''s Christmas troupe in Saigon, guarded by MACV''s Provost Marshal. The Brink bombed the same evening;
        Hope: "while I was going to my hotel in Saigon, I met another hotel going the other way."'
      n: '[[w.macv-command-history-1964]], 20. See [[cal.1964-12-24.vietnam]].'
      src:
        c: f6b1e586
        rows:
        - 'w.macv-command-history-1964 20: all'
    section: '196412'
- add:
    entry:
      id: cal.1964-03.vietnam-force-levels
      when: Mar.
      date: 1964-03
      thread: vietnam-force-levels
      c: MACV's 75th Military Police Detachment activated, for Saigon and Cholon.
      n: '[[w.macv-command-history-1964]], 20. Check: the day.'
      src:
        c: 9c97ae26
        rows:
        - 'w.macv-command-history-1964 20: all'
