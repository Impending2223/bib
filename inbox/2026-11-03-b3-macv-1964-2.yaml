      when: June
      date: 1964-06
      thread: vietnam-saigon
      c: The Regional Force authorized to conscript, to raise its intake to 14,000 recruits. 2,064 trained by the year's
        end.
      n: '[[w.macv-command-history-1964]], 119. Check: the day.'
      src:
        c: a38b91a5
        rows:
        - 'w.macv-command-history-1964 119: all'
