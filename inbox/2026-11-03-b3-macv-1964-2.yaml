      when: Dec. 5
      date: '1964-12-05'
      thread: vietnam
      c: 'A MACV directive: the 2d Air Division and the Army Support Command to provide at their airfields at least a control
        tower, approach control, instrument facilities, runway lights, crash rescue and weather.'
