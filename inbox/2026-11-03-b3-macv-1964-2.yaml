      when: Nov. 30
      date: '1964-11-30'
      thread: vietnam
      c: Westmoreland orders a review of MACV's manpower requirements and personnel utilization.
      n: '[[w.macv-command-history-1964]], 16. To check: Ltr, Hq MACV, 30 Nov 64, Subj: Personnel Utilization (cited by
        [[w.macv-command-history-1964]], 16 n.21). Names: Westmoreland.'
