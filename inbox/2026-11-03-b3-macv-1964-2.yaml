      date: 1964-04
      thread: vietnam
      c: 'The Army directs Big Squirt: a 50-kilowatt medium-wave transmitter near Huế, to relay the Voice of America, USIS
        and Saigon''s programs to North Vietnam.'
      n: '[[w.macv-command-history-1964]], 102–03. Check: the day. To check: Msg, DA to COMUSMACV, Cite 963543, DTG 102112Z
