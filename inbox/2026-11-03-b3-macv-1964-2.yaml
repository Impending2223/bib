      date: 1964-10
      thread: vietnam-prisoners
      c: 'The 2d Air Division asks MACV for a directive on escape and evasion. MACV''s draft: evade capture by every means;
        the Code of Conduct to apply in the counterinsurgency, though it is not "war". Over a non-concurrence, to CINCPAC
        in January 1965.'
      n: '[[w.macv-command-history-1964]], 115. Check: the day.'
      src:
        c: 53fa1727
        rows:
        - 'w.macv-command-history-1964 115: all'
