      date: '1964-06-01'
      thread: vietnam
      c: The South Vietnamese recruit course cut from 12 weeks to nine, MACV approving reluctantly. Over 45,000 recruits
        trained by the year's end.
      n: '[[w.macv-command-history-1964]], 116. See [[cal.1964-05.vietnam-3]].'
      src:
        c: 9894295d
        rows:
        - 'w.macv-command-history-1964 116: all'
