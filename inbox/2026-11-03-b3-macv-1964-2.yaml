      when: Feb.
      date: 1964-02
      thread: vietnam
      c: Harkins asks CINCPAC for authority to award the Joint Service Commendation Medal; refused, a Defense directive
        barring delegation below CINCPAC.
      n: '[[w.macv-command-history-1964]], 19. Check: the day. To check: Msg, COMUSMACV to CINCPAC, Cite MACJ1 1263, Feb
        64 (cited by [[w.macv-command-history-1964]], 19 n.27). Names: Harkins.'
      src:
        c: 15ca1deb
        rows:
        - 'w.macv-command-history-1964 19: all'
        - 'via w.macv-command-history-1964 19 n.27: all'
      tags:
