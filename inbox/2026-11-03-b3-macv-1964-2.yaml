      thread: vietnam
      c: MACV forms a Đà Nẵng port security survey team; Westmoreland has it examine the harbor and naval defense plans
        on a trip of Jan. 1–2, 1965. CINCPACFLT asks about the supposed attempt on the USNS *Muskingum* at Đà Nẵng, Oct.
