      c: 'Los Angeles. Nixon, questioned on Lodge''s pledge: no pledges made for the Cabinet; he will choose it on qualification alone, "without regard to race or creed or color."'
      n: '[[w.nixon-six-crises]], 350 (Nixon''s account: "When I was questioned about this"; not the day or the place); [[w.gifford-center-cannot-hold]], 85 (Nixon "attempted to reel
        in" Lodge, the best men "without regard for" race, creed or color, before Lodge modified his statement "the next day" in Virginia and North Carolina; the *Chicago Daily Defender*:
        "While Lodge made his pledge in Harlem, Nixon was in Los Angeles"), 161. To check: [*New York Times*, Oct. 13](https://timesmachine.nytimes.com/timesmachine/1960/10/13/issue.html)
        and [Oct. 14, 1960](https://timesmachine.nytimes.com/timesmachine/1960/10/14/issue.html), at 1 (cited by [[w.gifford-center-cannot-hold]], 85 n.98); *Chicago Daily Defender*,
        Oct. 20, 1960, at 12 (cited by [[w.gifford-center-cannot-hold]], 85 n.99). See [[cal.1960-10-12.elections-1960]]. Names: Nixon, Lodge. Check: the day; Gifford puts the answer
        before Lodge''s statement of Oct. 13 in Virginia and North Carolina, the *Defender* while Lodge spoke in Harlem, Oct. 12.'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
      - city:los-angeles
