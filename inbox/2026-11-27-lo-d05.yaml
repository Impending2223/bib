      c: Miami. At 8:30 Goodwin begins the last draft of the national-defense speech, sending the sheets to the mimeograph as he writes; the secretaries pack for the plane that leaves
        Miami at two.
      n: '[[w.white-making-of-the-president]], 325 ("At 8:30 Goodwin began the last draft, pushing his sheets to the mimeograph machine as he wrote"). The hour: "At 8:30" ([[w.white-making-of-the-president]],
        325). The order: after [[cal.1960-10-18.elections-1960-kennedy-7]], [[w.white-making-of-the-president]], 325 ("But now the Senator wanted substantial changes"). See [[cal.1960-10-18.elections-1960-3]].
        Names: Goodwin.'
