      c: 'Miami. At eight Goodwin wakes Kennedy with the draft of the national-defense speech. Kennedy wants substantial changes: the cold war''s nonmilitary side as well as the military.'
      n: '[[w.white-making-of-the-president]], 325 ("until eight, when he woke the Senator to present it to him"; "nonmilitary aspects of the cold war as well as the purely military").
        The hour: "until eight" ([[w.white-making-of-the-president]], 325). The order: after [[cal.1960-10-18.elections-1960-kennedy-6]], [[w.white-making-of-the-president]], 325. See
        [[cal.1960-10-18.elections-1960-3]]. Names: Goodwin, Kennedy.'
