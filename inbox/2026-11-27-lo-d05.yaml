      c: 'New York, late at night, on landing. Kennedy to reporters: he telephoned Mrs. King; "She is a friend of mine and I was concerned about the situation." Of King''s imprisonment,
        he may issue a statement later.'
      n: '[Statement by Senator John F. Kennedy on Telephone Call To Mrs. Martin Luther King, at Impromptu Press Conference, New York, NY](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-telephone-call-mrs-martin-luther-king-impromptu-press)
        (Oct. 26, 1960) (from the *New York Post*). [[w.wofford-of-kennedys-and-kings]], 20 ("Late that night when the Senator landed in New York, a newsman asked him"; "publicly he
        confirmed the call"; not the statement promised). The hour: "Late that night" ([[w.wofford-of-kennedys-and-kings]], 20). See [[cal.1960-10-26.elections-1960-king]]. Names: Kennedy,
        Coretta Scott King, Martin Luther King.'
      tags:
