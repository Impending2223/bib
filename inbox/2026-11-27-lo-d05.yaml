      c: The campaign's planes fly from Washington to Ohio; Goodwin and Sorensen join them.
      n: '[[w.white-making-of-the-president]], 325 ("immediately ''Meet The Press'' was over," "flying off from Washington to Ohio that evening"); [[w.communications-freedom-of-communications-part]],
        615 (Kennedy at Silver Spring: "tonight we go to the State of Ohio"). The hour: "that evening" ([[w.white-making-of-the-president]], 325): the evening. The order: after [[cal.1960-10-16.elections-1960-kennedy-7]],
        [[w.white-making-of-the-president]], 325 ("immediately ''Meet The Press'' was over"). The order against the Silver Spring rally ([[cal.1960-10-16.elections-1960-kennedy-4]]):
        not shown. Split under R25b: [[cal.1960-10-16.elections-1960-kennedy]]. Names: Goodwin, Sorensen, Kennedy.'
      tags:
      - name:goodwin-richard-n
      - name:sorensen-theodore-c
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-10-17.elections-1960-kennedy-9
      when: Oct. 17
      date: '1960-10-17'
      time_band: night
      time_range:
      - 1960-10-18T02:00Z
      - 1960-10-18T04:00Z
      time_zone: America/New_York
      place:
      - columbus
      - miami
      thread: elections-1960-kennedy
      follows:
      - cal.1960-10-17.elections-1960-kennedy-7
      c: The night flight from Columbus, Ohio, to Miami. Kennedy reads Goodwin's Latin American draft and revises it; Goodwin and Sorensen go over Sorensen's national-defense draft.
        The party reaches the airport motel in Miami at two in the morning.
      n: '[[w.white-making-of-the-president]], 325 ("the night flight to the south"; "at two in the morning"). The hour: "night flight" ([[w.white-making-of-the-president]], 325): the
        night. The order: after [[cal.1960-10-17.elections-1960-kennedy-7]], Kennedy at Columbus: "I leave Ohio tonight and I go to Miami" ([[w.communications-freedom-of-communications-part]],
        643). Split under R25b: [[cal.1960-10-17.elections-1960-kennedy]]. See [[cal.1960-10-17.elections-1960-kennedy]]. Names: Kennedy, Goodwin, Sorensen.'
      tags:
      - name:kennedy-john-f
      - name:goodwin-richard-n
      - name:sorensen-theodore-c
