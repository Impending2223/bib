      c: 'Des Plaines, Ill., the O''Hare Inn, morning. Shriver, urged by Wofford, waits until the others have left Kennedy''s room and proposes he telephone Coretta King. Kennedy calls
        her: "If there is anything I can do to help, please feel free to call on me," by her account.'
      n: '[Statement by Senator John F. Kennedy on Telephone Call To Mrs. Martin Luther King, at Impromptu Press Conference, New York, NY](https://www.presidency.ucsb.edu/documents/statement-senator-john-f-kennedy-telephone-call-mrs-martin-luther-king-impromptu-press)
        (Oct. 26, 1960) (Kennedy: he telephoned her; her account of his words). [[w.white-making-of-the-president]], 322 ("Early Wednesday morning," Wofford reaches Shriver; Shriver
        reaches Kennedy at O''Hare Inn as he prepares to leave for Michigan; the call from his room); [[w.wofford-of-kennedys-and-kings]], 18–19 (Shriver: "Jack doesn''t leave O''Hare
        for another forty minutes"; he waits until Sorensen, Salinger and O''Donnell are out of the room; Coretta King''s account of the words); [[w.mann-walls-of-jericho]], 284 (Shriver
        places the call; Kennedy speaks "for no more than three minutes"; the words); [[w.schlesinger-robert-kennedy-and-his]], 216–18 (Kennedy in "a motel in the Chicago airport"; to
        Salinger, arriving at Detroit, "I talked to Mrs. King this morning"); [[w.thomas-robert-kennedy]], 101 (Shriver pleads with Kennedy "In an airport lounge at Chicago''s O''Hare
        Airport"); [[w.sorensen-kennedy]], 188, 215–16 (the call, opposed at first by "almost all his advisers"; not the day); [[w.goodwin-remembering-america]], 121–22 (Shriver, waiting
        outside, speaks to Kennedy alone; Kennedy promises to "do all I can"); [[w.sorensen-counselor]], 272 (after "an intensive hotel room debate among his advisors"); [[w.gifford-center-cannot-hold]],
        86 ("a much-publicized call"; not the day or the place); [[w.kallina-kennedy-v-nixon]], 153. The hour: "Early Wednesday morning" ([[w.white-making-of-the-president]], 322); "this
        morning" (Kennedy to Salinger, [[w.schlesinger-robert-kennedy-and-his]], 217). The order: after [[cal.1960-10-26.king]], [[w.wofford-of-kennedys-and-kings]], 18 (Shriver tells
        Kennedy of King''s "middle-of-the-night ride"). Check: Goodwin puts the call "The morning after King''s imprisonment," at his brother''s suggestion by telephone, as Kennedy began
        to prepare for the fourth debate (Oct. 21), O''Donnell and the political advisers against (121). Check: Kallina, 153, has the call Shriver''s and Louis Martin''s idea, Shriver
        placing it. See [[cal.1960-10-25.king]]. Names: Shriver, Wofford, Kennedy, Coretta Scott King.'
      gloss:
        title: Commentary
        text:
        - 'Sorensen (2008): he was among those arguing against the call; "I was wrong, both morally and politically" ([[w.sorensen-counselor]], 272).'
      tags:
      - name:shriver-r-sargent
      - name:wofford-harris
      - name:kennedy-john-f
      - name:king-coretta-scott
      - state:il
