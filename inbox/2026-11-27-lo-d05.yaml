      c: Washington. Kennedy on *Meet the Press*, scheduled for six o'clock. Ned Brooks moderating; Elie Abel, John Chancellor, Edward Folliard and Lawrence Spivak on the panel; Spivak
        opens on Quemoy and Matsu.
      n: '[[w.white-making-of-the-president]], 324–25 ("All Sunday afternoon, October 16th, in Washington, D.C."; "scheduled for six o''clock"). [[w.freedom-of-communications-part]],
        244–51 (the transcript: NBC-TV and radio, Sunday, Oct. 16; Brooks, the panel, Spivak''s first question; not the hour). [[w.communications-freedom-of-communications-part]], 615,
        644 (Kennedy at Silver Spring, Oct. 16: "as I told Meet the Press"; at Columbus, Oct. 17: "When I was on ''Meet the Press'' last night"; not the hour). The hour: "scheduled for
        six o''clock" ([[w.white-making-of-the-president]], 325), the schedule. The order: after [[cal.1960-10-16.elections-1960-kennedy]], Goodwin''s briefing for the program ([[w.white-making-of-the-president]],
        325). See [[cal.1960-10-16.elections-1960-kennedy]]. Names: Kennedy, Chancellor, Spivak. Check: the hour is White''s schedule, not the broadcast''s.'
      tags:
      - name:kennedy-john-f
      - name:chancellor-john
      - name:spivak-lawrence
      place: washington
