      c: Robert Kennedy, from New York, telephones Judge Oscar Mitchell in Georgia for King's release on bail.
      n: '[[w.white-making-of-the-president]], 323 ("the next morning telephoned a plea for King''s release from New York to the Georgian judge"); [[w.wofford-of-kennedys-and-kings]],
        21–22 (before Brinkley''s call "late in the afternoon of October 27"; "It just burned me all the way up here on the plane"; the release "Not long after Bob''s call"); [[w.schlesinger-robert-kennedy-and-his]],
        216–18 (by telephone on reaching New York; "I made it clear to him that it was not a political call"); [[w.thomas-robert-kennedy]], 102–03 (from New York, "probably" from a telephone
        booth); [[w.mann-walls-of-jericho]], 285 ("By day''s end," the day of the call to Mrs. King); [[w.sorensen-kennedy]], 188, 216 (an "indignant protest to the judge"; not the day);
        [[w.nixon-six-crises]], 362 (Robert Kennedy "wasted no time in calling the judge"; not the day); [[w.kallina-kennedy-v-nixon]], 154. The hour: "the next morning" ([[w.white-making-of-the-president]],
        323). Check: the day; Schlesinger (217) and Thomas (101–03) have the call on the afternoon of Oct. 26, on his arrival in New York; Mann has it "By day''s end" of Oct. 26 (285).
        Check: Thomas, from Vandiver''s account, has Robert Kennedy call Mitchell at his brother''s instruction, through Vandiver (102–03); Robert Kennedy''s own account of 1964, at
        Vandiver''s suggestion (103 n.). Check: by Kallina''s account, after Vandiver''s (154), Kennedy first called Vandiver, who arranged through Robert Russell and George Stewart
        that Mitchell would free King on Robert Kennedy''s call. See [[cal.1960-10-25.king]]. Names: Robert Kennedy, Oscar Mitchell, Martin Luther King.'
      tags:
      - name:kennedy-robert-f
      - name:mitchell-oscar
      - name:king-martin-luther-jr
      - city:nyc
