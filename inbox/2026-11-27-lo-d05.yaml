      n: '[Presidential Debate in Washington, DC](https://www.presidency.ucsb.edu/documents/presidential-debate-washington-dc) (Oct. 7, 1960). [[w.kallina-kennedy-v-nixon]], 126–27 (Quemoy
        and Matsu); [[w.nixon-rn]], 219–20 (the debate in Washington; Quemoy and Matsu); [[w.sorensen-kennedy]], 204 (Quemoy and Matsu); [[w.white-making-of-the-president]], 290, 292,
        294–95, 299 (the second, third and fourth debates; Schwerin''s and Gallup''s scores, 293–94); [[w.stein-fiscal-revolution-in-america]], 377–78 (the debate, Oct. 7: Nixon for
        tax reform and, "if necessary," tax cuts in a recession; Kennedy, aid to education or a tax program); [[w.wofford-of-kennedys-and-kings]], 63 (the second debate, Oct. 7; Kennedy:
        by "one stroke of the pen" Eisenhower should sign the proposed executive order against discrimination in housing; not the place, the moderator or Quemoy and Matsu); [[w.gifford-center-cannot-hold]],
        190 (Quemoy and Matsu in the second debate; Nixon attacks Kennedy''s argument that they are "not strategically defensible"; not the quotations); [[w.chang-friends-and-enemies]],
        217 (in the televised debates Kennedy questions the value of the small islands to Taiwan''s defense, Nixon defends the Eisenhower record of 1958; neither presses it). [[w.nixon-six-crises]],
        343–46 (the NBC studios, Washington; Kennedy''s words on Quemoy and Matsu; Nixon''s answer). Check: Gifford, 190, calls the second debate the one devoted to foreign policy; the
        entry has questions on any subject (the fourth debate, Oct. 21, foreign policy only). The hour: 7:30 to 8:30 p.m. EDT ([Wikipedia, 1960 United States presidential debates](https://en.wikipedia.org/wiki/1960_United_States_presidential_debates)).
        See [[cal.1960-09-26.elections-1960]]. Names: Kennedy, Nixon, Frank McGee. Check: the hour against the broadcast record; the network log and the Commission''s papers not read.'
