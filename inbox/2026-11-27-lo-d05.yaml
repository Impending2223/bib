- edit:
    id: cal.1960-10-02.soviet-union
    base: 3a47fd45
    set:
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 365–367 (from Oct. 2; the Chinese in strength, most of the writers with them; Wu and Chen Boda in Peking turn the delegation''s cables
        into suggestions for the Standing Committee); [[w.yang-shangkun-riji]], I, 558–559 (Oct. 1, 1960; Oct. 1, the first session, 1 to 3 p.m., in the Kremlin''s St. George''s Hall:
        Suslov''s welcome; the procedure; the French first, then the others, Deng among them; the Soviet draft the basis; two days for study, the general debate from 2 p.m. Oct. 4; a
        secretariat; the Soviets in the chair); [[w.deng-xiaoping-nianpu-1904]], III, 1580 (Oct. 1–22, 1960; Deng leads the delegation; eight plenary sessions and eleven of the secretariat;
        sharp dispute on the epoch, peaceful coexistence and transition, war and peace, disarmament, "going it alone" and "national communism", revisionism and dogmatism, factions, the
        cult of personality, the Twentieth and Twenty-first Congresses; the draft much amended; no agreement on banishing world war, factions and the two congresses, left to the November
        meeting of eighty-one parties); [[w.lengxi-shinian-lunzhan-1956-1966]], 367; [[w.deng-xiaoping-nianpu-1904]], III, 1580. Made public: 1999. The day: Yang''s diary has the committee''s
        first session Oct. 1, 1 to 3 p.m., in the Kremlin''s St. George Hall, then two days for study and the general debate from Oct. 4 ([[w.yang-shangkun-riji]], I, 558–559); the Deng
        nianpu (III, 1580) has Oct. 1 too. The committee opens Oct. 1, not Oct. 2 ([[w.lengxi-shinian-lunzhan-1956-1966]], 365–367: "from Oct. 2"). Its opening session is also [[cal.1960-10-01.china-leadership-9]].
        Names: Chen Boda, Wu Lengxi, Deng Xiaoping. Check: the account is the Chinese delegation''s.'
      when: Oct. 1
      date: '1960-10-01'
    kind: correct
    settles:
    - 'Check: the Deng nianpu (III, 1580) dates'
    - 'Check: the day: Yang''s diary'
