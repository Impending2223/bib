      c: 'New York, the Hotel Theresa in Harlem, the new frontiers and freedom rally, with Mrs. Roosevelt, Lehman, Mayor Wagner, Harriman and Williams. Kennedy, after Powell: "Here in
        New York today we just concluded a conference on constitutional rights"; the Republican candidate talks of human rights in the North and States rights in the South.'
      n: '[Excerpts of Remarks of Senator John F. Kennedy, Public Rally, Hotel Theresa, New York, NY](https://www.presidency.ucsb.edu/documents/excerpts-remarks-senator-john-f-kennedy-public-rally-hotel-theresa-new-york-ny)
        (Oct. 12, 1960). [[w.communications-freedom-of-communications-part]], 580–83 (excerpts of his remarks at the rally: "I am happy to come to this hotel, a little late"; the conference
        "just concluded," 581; Nixon and rights, 582). [[w.kallina-kennedy-v-nixon]], 147; [[w.wofford-of-kennedys-and-kings]], 63–64 (the rally in front of the Theresa Hotel, the end
        planned for the conference, 63). The hour: the rally "will begin in Harlem" at 4 p.m., in the release of Sept. 24 ([[w.communications-freedom-of-communications-part]], 358),
        a plan; Kennedy at the rally: "a little late" (580). The order: after [[cal.1960-10-12.elections-1960-2]], Kennedy''s words at the rally, "we just concluded a conference on constitutional
        rights" ([[w.communications-freedom-of-communications-part]], 581). See [[cal.1960-10-12.elections-1960-2]]. Check: the hour is the release''s plan. Names: Roosevelt, Wagner,
        Harriman, Williams, Kennedy, Powell, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:powell-adam-clayton-jr
      - name:nixon-richard-m
      - city:nyc
      - name:roosevelt-eleanor
      - name:wagner-robert-f-jr
      - name:harriman-w-averell
      - name:williams-g-mennen
