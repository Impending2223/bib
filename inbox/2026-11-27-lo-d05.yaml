      n: 'Speech of Senator John F. Kennedy, Tampa, FL, Hillsborough County Courthouse, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-tampa-fl-hillsborough-county-courthouse)
