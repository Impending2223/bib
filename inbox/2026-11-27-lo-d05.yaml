      c: Buffalo, N.Y., the War Memorial Auditorium, a rally. Nixon on the Eisenhower record and on Kennedy's statements on Quemoy and Matsu.
      n: '[Partial Transcript of Remarks of the Vice President at War Memorial Auditorium, Buffalo, NY](https://www.presidency.ucsb.edu/documents/partial-transcript-remarks-the-vice-president-war-memorial-auditorium-buffalo-ny)
        (Oct. 17, 1960). The hour: "this rally tonight in Buffalo" (the transcript): the evening. Split under R17: New England is [[cal.1960-10-17.elections-1960-4]]. See [[cal.1960-10-17.elections-1960-4]].
        Names: Nixon, Kennedy. Check: the Polish Union Hall entry, [[cal.1960-10-17.elections-1960-6]], is the same night; the order of the two.'
      tags:
      - name:nixon-richard-m
      - name:kennedy-john-f
      - city:buffalo
- add:
    entry:
      id: cal.1960-10-18.elections-1960-kennedy-6
      when: Oct. 18
      date: '1960-10-18'
      time: 1960-10-18T12:30Z
      time_zone: America/New_York
      place: miami
      thread: elections-1960-kennedy
      also:
      - defense
      c: Miami. Sorensen's draft of the national-defense speech, finished at five, goes to Goodwin, who works on it until eight and gives it to Kennedy; he asks that the cold war's nonmilitary
        side be added. Goodwin begins the last draft at 8:30 and sends the sheets to the mimeograph as he writes.
      n: '[[w.white-making-of-the-president]], 325–26 ("Sorensen labored with a secretary until five a.m."; "At 8:30 Goodwin began the last draft"). The hour: "At 8:30" ([[w.white-making-of-the-president]],
        325), the last draft''s start. Split under R25b and R18: the speech is [[cal.1960-10-18.elections-1960-3]]. See [[cal.1960-10-18.elections-1960-3]]. Names: Sorensen, Goodwin,
        Kennedy.'
      tags:
      - name:sorensen-theodore-c
      - name:goodwin-richard-n
      - name:kennedy-john-f
      - city:miami
