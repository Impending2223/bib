      c: 'Atlanta, Morris Abram''s law office. King''s father and Coretta King tell Abram of Kennedy''s call. The father: if Kennedy has the courage to wipe the tears from Coretta''s
        eyes, he will vote for him, whatever his religion. Abram to urge him to say so in public. By Abram''s account to Wofford.'
      n: '[[w.wofford-of-kennedys-and-kings]], 19 (Abram to Wofford, "Soon afterwards": "Kennedy''s done it, he''s touched the heartstrings"; the elder King and Coretta King "had just
        come to his law office"; Abram to urge the elder King to make his conversion public). See [[cal.1960-10-26.elections-1960-king]]. Names: Martin Luther King Sr., Coretta Scott
        King, Abram, Kennedy, Wofford.'
      tags:
      - name:king-martin-luther-sr
      - name:king-coretta-scott
      - name:abram-morris-b
      - name:kennedy-john-f
      - name:wofford-harris
