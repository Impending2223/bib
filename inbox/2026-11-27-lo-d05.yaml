      c: Miami, the airport motel, two in the morning. The campaign arrives from Columbus; Kennedy sleeps five hours.
      n: '[[w.white-making-of-the-president]], 325 ("at two in the morning, where the candidate slept for five hours"). The hour: "at two in the morning" ([[w.white-making-of-the-president]],
        325). See [[cal.1960-10-18.elections-1960-3]]. Names: Kennedy.'
