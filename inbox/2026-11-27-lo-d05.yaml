      c: Washington. Seigenthaler drives Robert Kennedy to the airport for New York. Robert Kennedy wonders whether to call the judge himself and draw the fire from his brother; Seigenthaler,
        who has heard all day from Southern politicians about the call to Mrs. King, urges him to stay out of it, and he agrees.
      n: '[[w.thomas-robert-kennedy]], 101–02 ("early that afternoon"; a "lightning rod"; "Bobby wearily agreed"); [[w.schlesinger-robert-kennedy-and-his]], 216–18 (he wonders whether
        to call the judge and protest; Seigenthaler thinks it a poor idea; "scheduled to speak in New York that afternoon"). The hour: "early that afternoon" ([[w.thomas-robert-kennedy]],
        101). The order: after [[cal.1960-10-26.robert-kennedy]], [[w.thomas-robert-kennedy]], 101 (from headquarters, Seigenthaler drives him to the airport). See [[cal.1960-10-25.king]].
        Names: Seigenthaler, Robert Kennedy.'
      tags:
      - name:seigenthaler-john
      - name:kennedy-robert-f
