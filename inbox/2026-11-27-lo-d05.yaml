      c: Kennedy on *Meet the Press*, scheduled for six o'clock.
      n: '[[w.white-making-of-the-president]], 325 ("scheduled for six o''clock"); [[w.communications-freedom-of-communications-part]], 615, 642 (Kennedy at Silver Spring, Oct. 16: "as
        I told Meet the Press"; at Columbus, Oct. 17: "When I was on ''Meet the Press'' last night"; not the hour). The hour: "scheduled for six o''clock" ([[w.white-making-of-the-president]],
        325), the schedule. The order: after [[cal.1960-10-16.elections-1960-kennedy]], Goodwin''s briefing for the program ([[w.white-making-of-the-president]], 325). Split under R25b:
        [[cal.1960-10-16.elections-1960-kennedy]]. To check: the program''s transcript. Names: Kennedy. Check: the hour is White''s schedule, not the broadcast''s.'
      tags:
      - name:kennedy-john-f
