      c: Miami, the airport motel. Sorensen, with a secretary, drafts the national-defense speech until five; Goodwin, woken after three hours' sleep, works on the draft until eight.
      n: '[[w.white-making-of-the-president]], 325 ("Sorensen labored with a secretary until five a.m."; Goodwin "worked on that draft until eight"). The hour: "until five a.m." ([[w.white-making-of-the-president]],
        325): before dawn. The time is the first act''s. The order: after [[cal.1960-10-18.elections-1960-kennedy-9]], [[w.white-making-of-the-president]], 325 (the arrival at two; "they
        decided to work in shifts"). See [[cal.1960-10-18.elections-1960-3]]. Names: Sorensen, Goodwin.'
