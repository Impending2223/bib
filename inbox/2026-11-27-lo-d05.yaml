      c: The campaign's planes fly from Washington to Ohio; Goodwin and Sorensen join them.
      n: '[[w.white-making-of-the-president]], 325 ("immediately ''Meet The Press'' was over," Goodwin and Sorensen join the planes "flying off from Washington to Ohio that evening");
        [[w.communications-freedom-of-communications-part]], 615 (Kennedy at Silver Spring: "tonight we go to the State of Ohio"). The hour: "that evening" ([[w.white-making-of-the-president]],
        325): the evening. The order: after [[cal.1960-10-16.elections-1960-kennedy-4]], Kennedy at the rally: "tonight we go to the State of Ohio" ([[w.communications-freedom-of-communications-part]],
        615). The order against the crowd outside the school ([[cal.1960-10-16.elections-1960-kennedy-5]]): neither text gives it (615–21). See [[cal.1960-10-16.elections-1960-kennedy]].
        Names: Goodwin, Sorensen, Kennedy.'
      tags:
