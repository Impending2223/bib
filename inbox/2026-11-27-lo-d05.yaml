      n: '[[w.white-making-of-the-president]], 325 ("the night flight to the south"). The hour: "night flight" ([[w.white-making-of-the-president]], 325): the night. The order: after
        [[cal.1960-10-17.elections-1960-kennedy-7]], Kennedy at Columbus: "I leave Ohio tonight and I go to Miami" ([[w.communications-freedom-of-communications-part]], 644). See [[cal.1960-10-17.elections-1960-kennedy]].
        Names: Kennedy, Goodwin, Sorensen.'
