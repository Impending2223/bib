      c: Before dawn. King, woken in his cell in the DeKalb County jail, is put in handcuffs and leg chains and driven some two hundred miles to the state prison at Reidsville, Ga. At
        dawn he telephones Coretta King.
      n: '[[w.wofford-of-kennedys-and-kings]], 18 ("In the middle of the night"; "two hundred miles"; "When dawn came" at Reidsville, his call to his wife); [[w.schlesinger-robert-kennedy-and-his]],
        216 (awakened "at four-thirty one morning," handcuffs and leg chains, taken from the county jail to a penitentiary in rural Georgia; not the day or Reidsville); [[w.mann-walls-of-jericho]],
        284 (woken "at about 3:30 a.m."; handcuffs and leg irons; "two-hundred-mile trip" to Reidsville; the night after Coretta King''s call to Wofford); [[w.white-making-of-the-president]],
        322 ("whisked away secretly to the State Penitentiary"; Reidsville); [[w.thomas-robert-kennedy]], 101 ("in the early-morning darkness," in chains, to a state prison). The hour:
        "at four-thirty one morning" ([[w.schlesinger-robert-kennedy-and-his]], 216); "at about 3:30 a.m." ([[w.mann-walls-of-jericho]], 284). Check: the hour; Schlesinger gives four-thirty,
        Mann about 3:30. Check: the day; Wofford and Mann put the drive in the night before Kennedy''s call to Mrs. King (18; 284), Thomas "A few days" after the sentence (101). See
        [[cal.1960-10-25.king]]. Names: Martin Luther King, Coretta Scott King.'
      tags:
      - name:king-martin-luther-jr
      - name:king-coretta-scott
      - state:ga
- add:
    entry:
      id: cal.1960-10-26.elections-1960-king
      when: Oct. 26
      date: '1960-10-26'
      time_band: morning
      time_range:
