      c: 'Vienna. Chancellor Kreisky, from seeing Kennedy off, with Khrushchev: "The President was very gloomy at the airport."
        Khrushchev: "the President still doesn''t quite understand the times in which we live . . . the realignment of forces."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 364. See [[cal.1961-06-03.berlin-and-vienna]]. Names: Kreisky, Khrushchev,
        Kennedy.'
