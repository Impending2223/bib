- add:
    entry:
      id: cal.1960-05-12.soviet-union-u2
      when: May 12
      date: '1960-05-12'
      thread: soviet-union-u2
      also:
      - soviet-union
      - berlin-and-vienna
      c: 'The Presidium approves the instructions and proposals for Paris, Gromyko''s, a month in preparation. Khrushchev
        to recall the "fruitful" talks with Eisenhower; one demand, that the intrusions into Soviet airspace stop. On Berlin
        no fallback: the two-year interim agreement, and no doubt of the resolve to sign a peace treaty. On disarmament, strategic
        missiles and bombers first, some inspection of their destruction.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 279–80. To check: Protocol 280, May 12, 1960, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        279 nn.52–53, 280 n.54). See [[cal.1960-05-01.soviet-union]]. Names: Gromyko, Khrushchev, Eisenhower.'
      tags:
      - name:gromyko-andrei
      - name:khrushchev-nikita-s
      - name:eisenhower-dwight-d
      - name:dobrynin-anatoly
      src:
