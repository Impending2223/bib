      id: cal.1961-06-25.intelligence
      when: June 25
      date: '1961-06-25'
      thread: intelligence
      also:
      - berlin-and-vienna
      - soviet-union
      c: 'Moscow, a party. Chief Marshal Varentsov to Colonel Penkovsky of the GRU, the West''s agent: "Soon after the Party
        Congress a peace treaty will be signed"; the West, Bonn not ready for war, "will not start a big war and will retreat";
        the aim, to force the West to negotiate access with the GDR. Penkovsky passes it to his case officer.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 370. To check: Schecter and Deriabin, *The Spy Who Saved the World* (1992),
        186 (cited by [[w.fursenko-khrushchevs-cold-war]], 370 n.17).'
      src:
        c: 70732e64
        rows:
        - 'w.fursenko-khrushchevs-cold-war 370: all'
        - 'via w.fursenko-khrushchevs-cold-war 370 n.17: all'
- cite:
    id: cal.1961-07-13.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 369–70 (Acheson''s case for a national emergency; Dulles tells the President
      of Penkovsky, run with the British)'
    units: A
- add:
    entry:
      id: cal.1961-07-15.berlin-and-vienna
      when: July 15
      date: '1961-07-15'
      thread: berlin-and-vienna
      also:
      - defense
      - defense-soviet-forces
      c: 'Gettysburg. McNamara and Dulles brief Eisenhower, with the new Corona photographs: two ICBM sites at most between
        Leningrad and the Urals, eight launch pads. Eisenhower: the United States so much the stronger, Khrushchev will not
        push too far; "Congress is not capable of exercising sound judgment regarding military programs"; a national emergency
        "would be the worst mistake possible."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 370–71. To check: memorandum of conference, July 15, 1961, Augusta–Walter Reed
        Series, box 2, Eisenhower Library (cited by [[w.fursenko-khrushchevs-cold-war]], 370 nn.18–19, 371 n.24). See [[cal.1961-07-13.berlin-and-vienna]].
        Names: McNamara, Dulles, Eisenhower.'
      tags:
      - name:mcnamara-robert-s
      - name:dulles-allen-w
      - name:eisenhower-dwight-d
      src:
        c: fc4cf79f
        rows:
        - 'w.fursenko-khrushchevs-cold-war 370–71: all'
        - 'via w.fursenko-khrushchevs-cold-war 371 n.24: C'
        - 'via w.fursenko-khrushchevs-cold-war 370 n.19: B'
