- add:
    entry:
      id: cal.1960-05-10.soviet-union-u2
      when: May 10
      date: '1960-05-10'
      thread: soviet-union-u2
      c: 'Powers shown *Izvestia* and the *New York Times* of May 8, Khrushchev''s word that the pilot is alive, and his father''s
        appeal "as one coal miner to another." He answers: no radio contact from takeoff to the shootdown. Shelepin: "The
        matter is that the USA committed an aggressive act," the flight a provocation to scuttle the summit.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 277–78. To check: [[w.powers-operation-overflight]], 133 (cited by [[w.fursenko-khrushchevs-cold-war]],
        277 n.47). See [[cal.1960-05-03.soviet-union-u2]]. Names: Powers, Shelepin, Khrushchev.'
      tags:
