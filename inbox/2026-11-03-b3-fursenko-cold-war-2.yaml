- add:
    entry:
      id: cal.1960-04-07.soviet-union
      when: Apr. 7
      date: '1960-04-07'
      thread: soviet-union
      also:
      - defense
      c: 'The Presidium, its first session since Khrushchev''s return from France. At his order an anonymous letter of Mar.
        5, apparently a commander''s, against the troop cuts, read aloud. Khrushchev attacks the political education of the
        commanders: to be improved; a system of reporting what they say to be considered.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 270. To check: Protocol 274, Apr. 7, 1960, [[w.prezidium-tsk-kpss-1954]], I
        (cited by [[w.fursenko-khrushchevs-cold-war]], 270 nn.24–25). See [[cal.1960-01-14.soviet-union]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: 3ed8ac23
        rows:
        - 'w.fursenko-khrushchevs-cold-war 270: all'
        - 'via w.fursenko-khrushchevs-cold-war 270 n.25: all'
- add:
    entry:
      id: cal.1960-04-28.soviet-union
      when: Apr. 28
      date: '1960-04-28'
      thread: soviet-union
      also:
      - defense
      c: 'The Presidium, Khrushchev absent. Voroshilov against his defense budget: "Is it correct for us to reduce allotments
        for the construction of [civil air] shelters?" Against the incentives for recycling scrap metal, "a gross mistake."
        Reported to Khrushchev.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 271 and n.27. To check: Protocol 277, Apr. 28, 1960, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 271 n.27). See [[cal.1960-04-07.soviet-union]]. Names: Voroshilov,
        Khrushchev.'
      tags:
      - name:voroshilov-klimenti-efremovich
      - name:khrushchev-nikita-s
      src:
        c: 1e2a9c24
        rows:
        - 'w.fursenko-khrushchevs-cold-war 271 and n.27: all'
        - 'via w.fursenko-khrushchevs-cold-war 271 n.27: all'
- add:
    entry:
      id: cal.1960-05-01.soviet-union-u2-2
      when: May 1
      date: '1960-05-01'
      thread: soviet-union-u2
      c: 'Moscow. Malinovsky telephones Khrushchev at 5:00 a.m.: a foreign plane crossing from Afghanistan less than half
        an hour before; civil air traffic halted over most of the country for the pursuit. To his son: "They flew over again."
        On Lenin''s Tomb, at the parade, word from Marshal Biryuzov, in combat dress, that the pilot is taken. Shelepin of
        the KGB and Rudenko, the Procurator General, to question him at the Lubyanka.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 265–66. To check: Sergei Khrushchev, *Nikita Khrushchev and the Creation of
        a Superpower* (2000), 368–80 (cited by [[w.fursenko-khrushchevs-cold-war]], 265–66 nn.6–10). See [[cal.1960-05-01.soviet-union]].
        Names: Malinovsky, Khrushchev, Shelepin.'
      tags:
      - name:malinovsky-rodion-yakovlevich
      - name:khrushchev-nikita-s
      - name:shelepin-alexandr-n
      - name:powers-francis-gary
      src:
        c: f40db002
        rows:
        - 'w.fursenko-khrushchevs-cold-war 265–66: all'
- cite:
    id: cal.1960-05-01.soviet-union
    item: '[[w.fursenko-khrushchevs-cold-war]], 263–66 (near Sverdlovsk; Powers down by parachute at Povarnia, about 11 a.m.;
      a second S-75 salvo brings down a pursuing MiG-19, its pilot killed)'
    units: A-C
- src:
    id: cal.1960-05-01.soviet-union
    rows:
    - 'via w.fursenko-khrushchevs-cold-war 263 n.1: C'
- cite:
    id: cal.1960-05-01.soviet-union-u2
    item: '[[w.fursenko-khrushchevs-cold-war]], 266–67 ("Bill Bailey didn''t come home"; Eisenhower told at Camp David that
      afternoon)'
    units: A
- add:
    entry:
      id: cal.1960-05-03.soviet-union-u2
      when: May 3
      date: '1960-05-03'
      thread: soviet-union-u2
      c: 'The Lubyanka. Shelepin and Rudenko press Powers on how he kept radio contact at altitude. He refuses: "it would
        not be in my self-interest"; his mother very sick; were he not to answer, the Soviets might report him alive, "very
        welcome to me."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 268–69 (the questioning of May 3, by the Soviet record). To check: [[w.powers-operation-overflight]]
        (cited by [[w.fursenko-khrushchevs-cold-war]], 268 nn.15, 19–20). See [[cal.1960-05-01.soviet-union]]. Names: Shelepin,
        Powers.'
      tags:
      - name:shelepin-alexandr-n
      - name:powers-francis-gary
      src:
        c: 27ef5aba
        rows:
        - 'w.fursenko-khrushchevs-cold-war 268–69: all'
- add:
    entry:
      id: cal.1960-05-03.soviet-union
      when: May 3
      date: '1960-05-03'
      thread: soviet-union
      also:
      - europe-and-the-alliance-france
      c: 'Khrushchev with Dejean, the French Ambassador: "real reason to doubt the desire of some of the leaders to find a
        solution"; no closed sessions at Paris, as de Gaulle proposed Apr. 30, or the summit "could be reduced to zero." His
        report to the Supreme Soviet will show "there are people who do not wish a detente."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 272. To check: the Soviet record, May 3, APRF, and the French, May 4, *Documents
        Diplomatiques Français*, 1960, I, no. 198 (cited by [[w.fursenko-khrushchevs-cold-war]], 272 n.30); de Gaulle to Khrushchev,
        Apr. 30, ibid., no. 191 (cited 272 n.31). Names: Khrushchev, Dejean, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:dejean-maurice
      - name:de-gaulle-charles
      src:
        c: 9c55e92c
        rows:
        - 'w.fursenko-khrushchevs-cold-war 272: all'
        - 'via w.fursenko-khrushchevs-cold-war 272 n.30: A, C'
        - 'via w.fursenko-khrushchevs-cold-war 272 n.31: B'
