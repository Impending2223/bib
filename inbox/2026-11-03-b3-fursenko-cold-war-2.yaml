      thread: soviet-union
      also:
      - china
      c: 'Bucharest, two weeks after the meeting at Peking. Khrushchev answers his critics: it is not enough to read Marx;
        "One must also correctly understand what one had read and apply it to specific conditions of the time in which we
        live, taking into consideration the situation and the real balance of forces."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 305. To check: [[w.fursenko-one-hell-of-a]], 49–50 (cited by [[w.fursenko-khrushchevs-cold-war]],
