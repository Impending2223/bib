      when: June 21
      date: '1961-06-21'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev, in the uniform of a lieutenant general, on the twentieth anniversary of the German attack: those who
        test Soviet resolve on Berlin will "share the fate of Hitler."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 365. To check: [[w.slusser-berlin-crisis-of-1961]], 5–15 (cited by [[w.fursenko-khrushchevs-cold-war]],
        365 n.90). See [[cal.1961-06-15.berlin-and-vienna]]. Names: Khrushchev.'
      tags:
      - name:khrushchev-nikita-s
      src:
        c: f2e8c1cf
        rows:
        - 'w.fursenko-khrushchevs-cold-war 365: all'
