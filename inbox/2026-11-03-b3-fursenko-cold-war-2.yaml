      when: May 6
      date: '1960-05-06'
      thread: soviet-union-u2
      c: 'Shelepin again presses Powers on the radio. Offered a letter to his mother for an honest answer; Powers: "Give me
        the chance to write my mother a letter and to receive an answer and I will answer all of your questions."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 274–75. See [[cal.1960-05-03.soviet-union-u2]]. Names: Shelepin, Powers.'
