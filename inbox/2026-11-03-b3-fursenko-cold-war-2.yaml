- check:
    id: cal.1961-07.testing
    text: 'Check: the day: July 10, by Smirnov of Sakharov''s team to Zubok ([[w.fursenko-khrushchevs-cold-war]], 366 n.95,
      citing Zubok and Pleshakov, *Inside the Kremlin''s Cold War*, 253).'
- add:
