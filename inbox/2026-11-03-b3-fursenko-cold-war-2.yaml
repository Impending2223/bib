      when: May 11
      date: '1960-05-11'
      thread: soviet-union-u2
      also:
      - press-and-broadcasting
      c: 'Gorky Park. Khrushchev and Biryuzov view the U-2''s wreckage, on show. To the journalists: Herter "says they will
        continue into the future"; "I was horrified to learn that the President had endorsed the acts"; "I had hopes and they
        were betrayed."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 278–79. To check: excerpts of the press conference, *New York Times*, May 12,
        1960 (cited by [[w.fursenko-khrushchevs-cold-war]], 279 n.49); [[w.beschloss-mayday]], 262–63 (cited by [[w.fursenko-khrushchevs-cold-war]],
        278 n.48, 279 n.49). See [[cal.1960-05-01.soviet-union]]. Names: Khrushchev, Herter, Eisenhower.'
