      date: '1960-09-09'
      thread: congo
      c: The Congolese Parliament annuls Kasavubu's decree dismissing Lumumba; Sept. 14, it calls for a reshuffle, Lumumba
        kept, some of his allies dropped.
      n: '[[w.fursenko-khrushchevs-cold-war]], 315–16. To check: [[w.hoskyns-congo-since-independence]], 219–21 (cited by
        [[w.fursenko-khrushchevs-cold-war]], 315 n.103, 316 n.104). See [[cal.1960-09-05.congo]]. Names: Kasavubu, Lumumba.'
