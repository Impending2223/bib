      c: 'Khrushchev to the graduates of the Soviet military academies: the defense budget up a third; the reductions in the
        armed forces planned for 1961 suspended.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 366. To check: [[w.slusser-berlin-crisis-of-1961]], 51–57 (cited by [[w.fursenko-khrushchevs-cold-war]],
