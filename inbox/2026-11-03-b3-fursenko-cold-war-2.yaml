    item: '[[w.fursenko-khrushchevs-cold-war]], 252–53 (the cut, 1.2 million; Dulles at the NSC that day)'
    units: A, D
- check:
    id: cal.1960-01-14.soviet-union
    text: 'Check: Fursenko and Naftali have Eisenhower call it "[a] very tough speech" against Dulles (252, citing the NSC
      record, n.37); the record gives Dulles the words, the President the view that it "did not appear at first glance to
      be a very tough speech" (FRUS 1958–60, X, pt. 1, doc. 140).'
