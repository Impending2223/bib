        on the CIA's payments to Phoumi Nosavan's forces, give him air support and remove "any military restraints hitherto
        imposed by us on Phoumi." Souvanna Phouma's offer of Nov. 20 to broaden his government to Phoumi's side taken as tactics.
      n: '[[w.fursenko-khrushchevs-cold-war]], 332. To check: Eliades, "United States Decision-making in Laos, 1942–1962"
        (Harvard dissertation), 349 (cited by [[w.fursenko-khrushchevs-cold-war]], 332 n.32). Names: Eisenhower, Phoumi Nosavan,
        Souvanna Phouma.'
      tags:
      - name:eisenhower-dwight-d
      - name:phoumi-nosavan
      - name:souvanna-phouma
      src:
        c: 9e50c00f
        rows:
