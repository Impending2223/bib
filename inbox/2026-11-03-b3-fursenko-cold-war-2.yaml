- add:
    entry:
      id: cal.1961-06-17.soviet-union
      when: June 17
      date: '1961-06-17'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'The Presidium. A Central Committee resolution, at Khrushchev''s instruction: the Vienna meetings "demonstrated the
        wisdom of taking a hard line on the Berlin question"; the minutes of the first meeting to foreign Communist leaders,
        Castro among them; ambassadors in eighteen countries to read from them. On crime, to Rudenko, the Procurator General:
        "Stalin had the correct position on these issues. He went too far, but we never had any mercy on criminals." In July
        the death penalty widened, the KGB''s police units enlarged.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 365–66. To check: the resolution, June 17, 1961, Bohlen Papers, NARA (cited
        by [[w.fursenko-khrushchevs-cold-war]], 365 n.91); the stenogram, June 17, 1961, [[w.prezidium-tsk-kpss-1954]], I
        (cited 366 n.92). See [[cal.1961-06-03.berlin-and-vienna]]. Names: Khrushchev, Castro.'
      tags:
      - name:khrushchev-nikita-s
      - name:castro-fidel
      src:
        c: 4c280f44
        rows:
        - 'w.fursenko-khrushchevs-cold-war 365–66: all'
        - 'via w.fursenko-khrushchevs-cold-war 365 n.91: B-C'
        - 'via w.fursenko-khrushchevs-cold-war 366 n.92: D'
