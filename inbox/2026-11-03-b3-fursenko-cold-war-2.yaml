      c: East Germany announces a hundred-meter no-man's-land on both sides of the wall, West Berliners warned they may be
        shot; Aug. 23, the crossings for the West cut from seven to one, at Friedrichstrasse, Checkpoint Charlie.
      n: '[[w.fursenko-khrushchevs-cold-war]], 385. See [[cal.1961-08-13.berlin-and-vienna]].'
