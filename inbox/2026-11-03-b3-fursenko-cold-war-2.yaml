      when: Feb. 25
      date: '1960-02-25'
      thread: congo
      c: 'Brussels. Lumumba, half an hour late, with Ambassador Burden: invitations to Moscow, he says, all turned down. Burden:
        "a highly articulate, sophisticated, subtle and unprincipled intelligence"; were Lumumba backed by the East, he would
        betray it as it suited him. Lumumba asks an invitation to the United States; Burden for it.'
      n: '[FRUS 1958–60, XIV, doc. 97](https://history.state.gov/historicaldocuments/frus1958-60v14/d97). [[w.fursenko-khrushchevs-cold-war]],
        300–301. Names: Lumumba, Burden.'
