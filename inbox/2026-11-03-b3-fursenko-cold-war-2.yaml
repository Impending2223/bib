      thread: africa
      also:
      - congo
      c: 'Eisenhower to his foreign policy advisers: the world in "a kind of ferment" greater than he can remember; the Communists
        trying to take control of it; students saying "the Communists are thinking of the common man while the United States
        is dedicated to supporting outmoded regimes."'
      n: '[FRUS 1958–60, XIV, doc. 157](https://history.state.gov/historicaldocuments/frus1958-60v14/d157). [[w.fursenko-khrushchevs-cold-war]],
