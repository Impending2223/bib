    entry:
      id: cal.1960-05-07.soviet-union-u2-2
      when: May 7
      date: '1960-05-07'
      thread: soviet-union-u2
      c: 'Thompson from Moscow: admit the espionage without suggesting the President authorized the flight; "[the] great asset
        we have in the regard which Soviet and other people have for [the] President."'
      n: '[FRUS 1958–60, X, pt. 1, doc. 148](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d148). [[w.fursenko-khrushchevs-cold-war]],
        275. See [[cal.1960-05-01.soviet-union]]. Names: Thompson.'
      tags:
      - name:thompson-llewellyn-e
      src:
