- add:
    entry:
      id: cal.1960-05-15.soviet-union-u2
      when: May 15
      date: '1960-05-15'
      thread: soviet-union-u2
      also:
      - berlin-and-vienna
      c: 'Paris. Eisenhower, arriving, with de Gaulle and Macmillan, 2:30 and 6 p.m., on Khrushchev''s demand: no apology,
        even at the cost of the visit to Moscow. A two-year interim agreement on Berlin a new ultimatum, not acceptable. Disarmament
        to be pressed; de Gaulle open to limits on the means of delivery.'
      n: '[FRUS 1958–60, IX, doc. 161](https://history.state.gov/historicaldocuments/frus1958-60v09/d161) (2:30 p.m.); [doc.
        165](https://history.state.gov/historicaldocuments/frus1958-60v09/d165) (6 p.m.). [[w.fursenko-khrushchevs-cold-war]],
        284. See [[cal.1960-05-15.soviet-union]]. Names: Eisenhower, de Gaulle, Macmillan, Khrushchev.'
      tags:
      - name:eisenhower-dwight-d
      - name:de-gaulle-charles
      - name:macmillan-harold
      - name:khrushchev-nikita-s
      src:
        c: 024de2b7
        rows:
