      id: cal.1961-07-20.soviet-union
      when: July 20
      date: '1961-07-20'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - intelligence
      c: 'Shelepin of the KGB to Khrushchev: NATO preparing to treat Berlin as a military problem, united against a treaty
        that touches the access; if he goes ahead, the West will "be ready to take steps that could threaten the security
        of the Soviet Union"; sanctions planned.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 374. To check: Shelepin to Khrushchev, July 20, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        374 n.38). Names: Shelepin, Khrushchev.'
      tags:
      - name:shelepin-alexandr-n
      - name:khrushchev-nikita-s
      src:
        c: 419510cd
        rows:
        - 'w.fursenko-khrushchevs-cold-war 374: all'
        - 'via w.fursenko-khrushchevs-cold-war 374 n.38: all'
- add:
    entry:
      id: cal.1961-07-21.berlin-and-vienna
      when: July 21
      date: '1961-07-21'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'The Soviet forces in Germany and the East German Ministry of Internal Affairs: a plan to control "Greater Berlin"
        and its sector boundary, approved by the Soviet chief of staff in Germany. "Exit or entry into West Berlin would be
        outlawed for all citizens of the GDR, except for those with special permits."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 375. To check: "Measures to effect the strengthening of control . . . of Greater
        Berlin," July 21, 1961 (cited by [[w.fursenko-khrushchevs-cold-war]], 375 n.42). See [[cal.1961-05-19.berlin-and-vienna]].'
      src:
        c: 8618e988
        rows:
        - 'w.fursenko-khrushchevs-cold-war 375: all'
        - 'via w.fursenko-khrushchevs-cold-war 375 n.42: all'
- cite:
    id: cal.1961-07-26.berlin-and-vienna
    item: '[[w.fursenko-khrushchevs-cold-war]], 377 ("Kennedy has declared preliminary war on the Soviet Union"; McCloy invited
      to Pitsunda July 25)'
    units: A
- src:
    id: cal.1961-07-26.berlin-and-vienna
    rows:
    - 'via w.fursenko-khrushchevs-cold-war 377 n.50: A'
- add:
    entry:
      id: cal.1961-07-26.berlin-and-vienna-2
      when: July 26
      date: '1961-07-26'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Khrushchev to Pervukhin, for Ulbricht: "we have to use the tension in international relations now to circle Berlin
        in an iron ring. This must be done before concluding a peace treaty." "Our troops will create this ring; but your
        forces will control it"; "if this drags us into war, there will be war." The invitations to a Warsaw Pact meeting
        Aug. 3 go out the same day.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 375–78. To check: Gromyko to the Central Committee, July 22–23, 1961, APRF
        (cited by [[w.fursenko-khrushchevs-cold-war]], 375 n.43). Check: no record of Khrushchev''s word to Pervukhin found;
        Fursenko and Naftali assume his special telephone (377 n.51). See [[cal.1961-07-21.berlin-and-vienna]]. Names: Khrushchev,
        Pervukhin, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:pervukhin-mikhail-georgievich
      - name:ulbricht-walter
      src:
        c: 0ffa7975
        rows:
        - 'w.fursenko-khrushchevs-cold-war 375–78: all'
- add:
    entry:
      id: cal.1961-07-27.berlin-and-vienna
      when: July 27
      date: '1961-07-27'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Ulbricht''s answer, by Pervukhin: "This is the solution!" Eight days to prepare closing the border between East
        and West Berlin; four to five weeks to close the S-Bahn and the subway.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 378. To check: Pervukhin to Khrushchev, July 27, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        378 n.54). See [[cal.1961-07-26.berlin-and-vienna-2]]. Names: Ulbricht, Pervukhin.'
      tags:
      - name:ulbricht-walter
      - name:pervukhin-mikhail-georgievich
      src:
        c: 44201ba0
        rows:
        - 'w.fursenko-khrushchevs-cold-war 378: all'
        - 'via w.fursenko-khrushchevs-cold-war 378 n.54: all'
- cite:
    id: cal.1961-08-01.soviet-union
    item: '[[w.fursenko-khrushchevs-cold-war]], 378–79 (Shelepin''s proposal of July 29; the FSLN, $10,000 for weapons)'
    units: all
- add:
    entry:
      id: cal.1961-08-03.berlin-and-vienna
      when: Aug. 3
      date: '1961-08-03'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Moscow. Khrushchev with Ulbricht: no word to the public before the barriers go up, "the way we introduced the new
        currency regime"; Soviet tanks along the border with West Germany behind a wall of troops, no reinforcements. Ulbricht:
        two weeks to build the ring. The day left to the GDR; Aug. 13, a Sunday.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 379–80. To check: Khrushchev and Ulbricht, Aug. 3, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]],
        379 n.60, 380 n.61). See [[cal.1961-07-27.berlin-and-vienna]]. Names: Khrushchev, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: 50f97f53
        rows:
        - 'w.fursenko-khrushchevs-cold-war 379–80: all'
        - 'via w.fursenko-khrushchevs-cold-war 380 n.61: all'
- add:
    entry:
      id: cal.1961-08-03.soviet-union
      when: Aug. 3–5
      date: '1961-08-03'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Moscow. The Warsaw Pact''s leaders on Berlin, three days. Khrushchev: "No one can give a guarantee that there will
        be no war"; "we must . . . show them our will and decisiveness." Ulbricht''s main speech Aug. 4. A resolution for
        closing the border; each ally warns of the limits of its economic help.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 381. To check: [[w.harrison-driving-the-soviets-up]], 194–205 (cited by [[w.fursenko-khrushchevs-cold-war]],
        381 nn.66–69). See [[cal.1961-08-03.berlin-and-vienna]]. Names: Khrushchev, Ulbricht.'
      tags:
      - name:khrushchev-nikita-s
      - name:ulbricht-walter
      src:
        c: bd87cbc5
        rows:
        - 'w.fursenko-khrushchevs-cold-war 381: all'
- add:
    entry:
      id: cal.1961-08-07.berlin-and-vienna-2
      when: Aug. 7
      date: '1961-08-07'
      thread: berlin-and-vienna
      c: East Berlin. Ulbricht tells the East German Politburo of the talks in Moscow and of the decision to close the border
        the night of Aug. 12–13.
      n: '[[w.fursenko-khrushchevs-cold-war]], 381. To check: [[w.harrison-driving-the-soviets-up]], 205 (cited by [[w.fursenko-khrushchevs-cold-war]],
        381 n.70). See [[cal.1961-08-03.soviet-union]]. Names: Ulbricht.'
      tags:
      - name:ulbricht-walter
      src:
        c: 77ccb582
        rows:
        - 'w.fursenko-khrushchevs-cold-war 381: all'
- add:
    entry:
      id: cal.1961-08-10.berlin-and-vienna
      when: Aug. 10
      date: '1961-08-10'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Ulbricht''s timetable reaches Khrushchev: the Council of Ministers to approve the Warsaw Pact''s resolution about
        midnight Aug. 12, as police unroll barbed wire along the sector line; the announcement ninety minutes later. Moscow
        announces Marshal Konev''s return to command the Soviet forces in Germany; to the Western mission chiefs: "Gentlemen,
        my name is Konev. You may perhaps have heard of me." Konev to Ulbricht: speed, and West Berlin''s traffic with West
        Germany untouched.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 381–82. To check: Pervukhin to Khrushchev, Aug. 10, 1961; Pervukhin, Konev
        and Chuikov to Khrushchev, Aug. 10–12, 1961, APRF (cited by [[w.fursenko-khrushchevs-cold-war]], 381 n.71, 382 n.76).
        See [[cal.1961-08-07.berlin-and-vienna-2]]. Names: Ulbricht, Khrushchev, Konev.'
      tags:
      - name:ulbricht-walter
      - name:khrushchev-nikita-s
      - name:konev-ivan-stepanovich
      src:
        c: 79a37cc6
        rows:
        - 'w.fursenko-khrushchevs-cold-war 381–82: all'
        - 'via w.fursenko-khrushchevs-cold-war 381 n.71: A'
        - 'via w.fursenko-khrushchevs-cold-war 382 n.76: C'
- add:
    entry:
      id: cal.1961-08-11.berlin-and-vienna
      when: Aug. 11
      date: '1961-08-11'
      thread: berlin-and-vienna
      c: 'East Berlin. Mielke, the East German police chief, briefs the top of the security police: the closing of the border
        is Operation Rose, the preparations "under the strictest secrecy."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 382. To check: [[w.harrison-driving-the-soviets-up]], 205 (cited by [[w.fursenko-khrushchevs-cold-war]],
        382 n.77). See [[cal.1961-08-10.berlin-and-vienna]].'
      src:
        c: b01174eb
        rows:
        - 'w.fursenko-khrushchevs-cold-war 382: all'
