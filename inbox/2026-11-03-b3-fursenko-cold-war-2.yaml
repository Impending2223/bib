      when: Aug. 14–15
      date: '1960-08-14'
      thread: congo
      c: 'Leopoldville. Lumumba to Hammarskjöld, a day after appealing for unity: Congolese troops, not the UN, to guard the
        airports; African and Congolese troops to Katanga, the non-Africans out; captured arms to the government. Five letters
        in a day, both in the city; Lumumba questions a Swede''s impartiality. Hammarskjöld back to New York. Lumumba formally
        asks Soviet military aid.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 312. To check: [[w.hoskyns-congo-since-independence]], 174 (cited by [[w.fursenko-khrushchevs-cold-war]],
