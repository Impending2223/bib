- add:
    entry:
      id: cal.1960-01-21.soviet-union
      when: Jan. 21
      date: '1960-01-21'
      thread: soviet-union
      also:
      - defense
      c: 'The 433d NSC. Dulles on Khrushchev''s speech of Jan. 14: the Soviet Union can overcome capitalism without general
        war, its missiles a shield; the speech "seems to exclude general war as a deliberate Soviet policy."'
      n: '[FRUS 1958–60, III, doc. 85](https://history.state.gov/historicaldocuments/frus1958-60v03/d85) (the 433d NSC, Jan.
        21, 1960). [[w.fursenko-khrushchevs-cold-war]], 252–53 (Dulles: "seems to exclude general war"). See [[cal.1960-01-14.soviet-union]].
        Names: Dulles.'
      tags:
      - name:dulles-allen-w
      src:
        c: 3a56844a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d85: all'
        - 'w.fursenko-khrushchevs-cold-war 252–53: A, C'
        - 'via w.fursenko-khrushchevs-cold-war 253 n.39: A, C'
- add:
    entry:
      id: cal.1960-01-20.soviet-union
      when: Jan. 20
      date: '1960-01-20'
      thread: soviet-union
      also:
      - defense
      c: An R-7 with a dummy warhead flown more than 7,000 miles from Soviet Central Asia to the Pacific south of Hawaii.
        The first such test.
      n: '[FRUS 1958–60, III, doc. 85](https://history.state.gov/historicaldocuments/frus1958-60v03/d85) (the NSC, Jan. 21:
        "a Soviet missile tested the previous day"; the CEP of two kilometers the Soviets claim). [[w.fursenko-khrushchevs-cold-war]],
        253. Check: the day: Fursenko and Naftali have the launch "four days after" the speech of Jan. 14 (253); the NSC record
        of Jan. 21, "the previous day." See [[cal.1960-01-14.soviet-union]].'
      src:
        c: 94a81f7e
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d85: A'
        - 'w.fursenko-khrushchevs-cold-war 253: A-B'
- add:
    entry:
      id: cal.1960-01-18.defense
      when: Jan. 18
      date: '1960-01-18'
      thread: defense
      c: 'General Power, commanding SAC, to the Economic Club of New York, against the administration''s line: "With only
        300 ballistic missiles the Soviet Union could virtually wipe out this country''s entire retaliatory capability in
        thirty minutes." Bombers to be kept aloft at all times.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 253–54. To check: Russell Porter, "S.A.C. Chief Urges Defense Speed-up," *New
        York Times*, Jan. 20, 1960 (cited by [[w.fursenko-khrushchevs-cold-war]], 254 n.42). Check: the day: "four days after"
        Khrushchev''s speech of Jan. 14 (253–54); the *Times*''s story of Jan. 20. Names: Power.'
      tags:
      - name:power-thomas-s
      src:
        c: 26f67720
        rows:
        - 'w.fursenko-khrushchevs-cold-war 253–54: all'
        - 'via w.fursenko-khrushchevs-cold-war 254 n.42: all'
- add:
    entry:
      id: cal.1960-01-23.press-and-broadcasting
      when: Jan. 23
      date: '1960-01-23'
      thread: press-and-broadcasting
      also:
      - defense
      c: Joseph Alsop's series on the missile gap opens in the *Herald Tribune*, six columns. On SAC's premise, 150 Soviet
        ICBMs and 150 intermediate-range missiles could destroy NATO's nuclear forces; at the rate of the Atlas factory, Khrushchev
        would have 150 ICBMs in ten months; "no intelligence service on earth can be absolutely certain" he has not.
      n: '[[w.fursenko-khrushchevs-cold-war]], 254. To check: Joseph Alsop, "The Missile Gap: Basic Facts" and "The Missile
        Gap: The Bridge," *New York Herald Tribune*, Jan. 25, 1960, "Alsop" file, Nixon papers, NARA, Laguna Niguel (cited
        by [[w.fursenko-khrushchevs-cold-war]], 254 nn.44–45). Check: Fursenko and Naftali date the series from Jan. 23 (254);
        the two columns cited are of Jan. 25. Names: Alsop.'
      tags:
      - name:alsop-joseph
      src:
        c: aa2888f4
        rows:
        - 'w.fursenko-khrushchevs-cold-war 254: all'
        - 'via w.fursenko-khrushchevs-cold-war 254 n.44: all'
        - 'via w.fursenko-khrushchevs-cold-war 254 n.45: D'
- add:
    entry:
      id: cal.1960-02-01.soviet-union
      when: Feb. 1
      date: '1960-02-01'
      thread: soviet-union
      also:
      - testing
      c: 'The Presidium. Khrushchev proposes offering to destroy the strategic delivery systems: "Now let''s call for cuts
        in an area where they think we are ahead." The dismantling of NATO, SEATO and CENTO "our most sacred dream." The press
        against his speech: "the journalists write about what the government thinks." Endorsed; Brezhnev for saving it for
        de Gaulle in March, Gromyko for waiting; no day set.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 255–56. To check: the stenogram, Feb. 1, 1960, [[w.prezidium-tsk-kpss-1954]],
        I (cited by [[w.fursenko-khrushchevs-cold-war]], 255 nn.46–47). See [[cal.1960-01-14.soviet-union]]. Names: Khrushchev,
        Brezhnev, Gromyko, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - name:gromyko-andrei
      - name:de-gaulle-charles
      src:
        c: bc0f037b
        rows:
        - 'w.fursenko-khrushchevs-cold-war 255–56: all'
        - 'via w.fursenko-khrushchevs-cold-war 255 n.47: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 255 n.46: D'
- add:
    entry:
      id: cal.1960-02-02.testing
      when: Feb. 2
      date: '1960-02-02'
      thread: testing
      c: 'Eisenhower with Herter, on the cutoff of fissionable material, which he favors as inspectable: "scarcely any proposal
        in the field of disarmament equitable to the two sides that he would not accept if it can be inspected."'
      n: '[FRUS 1958–60, III, doc. 242](https://history.state.gov/historicaldocuments/frus1958-60v03/d242) (Goodpaster''s
        memorandum). [[w.fursenko-khrushchevs-cold-war]], 257 (the words). Names: Eisenhower, Herter.'
      tags:
      - name:eisenhower-dwight-d
      - name:herter-christian-a
      - name:goodpaster-andrew-j
      src:
        c: 9877fd74
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v03/d242: all'
        - 'w.fursenko-khrushchevs-cold-war 257: A'
        - 'via w.fursenko-khrushchevs-cold-war 257 n.49: A'
- add:
    entry:
      id: cal.1960-02-03.defense
      when: Feb. 3
      date: '1960-02-03'
      thread: defense
      c: Eisenhower's news conference, asked about catching up with the Russians in missiles. "What you want is enough, a
        thing that is adequate. A deterrent has no added power, once it has become completely adequate."
      n: 'The President''s News Conference, [1960–61 Pub. Papers 144](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=196)
        (Feb. 3, 1960). [[w.fursenko-khrushchevs-cold-war]], 257 (the words). Check: Fursenko and Naftali date it Feb. 4,
        by the *Times*''s transcript of that day (257 n.51). Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
      src:
        c: 1bb2b087
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=196: all'
        - 'w.fursenko-khrushchevs-cold-war 257: B'
- add:
    entry:
      id: cal.1960-02-07.soviet-union
      when: Feb. 7
      date: '1960-02-07'
      thread: soviet-union
      c: 'Moscow, the Bolshoi. Khrushchev keeps Lodge at his side, President Gronchi of Italy neglected. Lodge: the Soviet
        Union ahead in rocketry; Khrushchev: "no we''re not; not really."'
      n: '[FRUS 1958–60, X, pt. 1, doc. 146](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d146) (Lodge to
        Herter, Feb. 9: the Bolshoi, Feb. 7; the Kremlin, Feb. 8, the President free to travel anywhere in the Soviet Union).
        [[w.fursenko-khrushchevs-cold-war]], 257–58 (Lodge in Moscow; the words). Names: Khrushchev, Lodge, Gronchi.'
      tags:
      - name:khrushchev-nikita-s
      - name:lodge-henry-cabot
      - name:gronchi-giovanni
      src:
        c: 678e8889
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v10p1/d146: all'
        - 'w.fursenko-khrushchevs-cold-war 257–58: C-D'
        - 'via w.fursenko-khrushchevs-cold-war 258 n.52: C-D'
- add:
    entry:
      id: cal.1960-03-23.europe-and-the-alliance-france
      when: Mar. 23–Apr. 3
      date: '1960-03-23'
      thread: europe-and-the-alliance-france
      also:
      - soviet-union
      - berlin-and-vienna
      - testing
      c: 'Khrushchev in France, the trip put off by his flu. Talks with de Gaulle, Mar. 23–25 and Apr. 1–2: de Gaulle raises
        his plan to do away with the means of delivering nuclear weapons, and Khrushchev accepts it. Berlin: two more years
        for an agreement, then West Berlin a free city, the Western troops out, the UN its guarantor, its access to be negotiated
        with East Germany.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 258–59. To check: "Entretiens du Général de Gaulle et M. Khrouchtchev," Mar.
        23–25 and Apr. 1–2, 1960, *Documents Diplomatiques Français*, 1960, I, no. 146 (cited by [[w.fursenko-khrushchevs-cold-war]],
        258 n.53). Check: the trip''s days. Names: Khrushchev, de Gaulle.'
      tags:
      - name:khrushchev-nikita-s
      - name:de-gaulle-charles
      src:
        c: 2c189188
        rows:
        - 'w.fursenko-khrushchevs-cold-war 258–59: all'
        - 'via w.fursenko-khrushchevs-cold-war 258 n.53: B-C'
- add:
    entry:
      id: cal.1960-04-05.europe-and-the-alliance
      when: Apr. 5–6
      date: '1960-04-05'
      thread: europe-and-the-alliance
      also:
      - berlin-and-vienna
      - testing
      c: 'London. De Gaulle with Macmillan on his talks with Khrushchev: Khrushchev has accepted the French plan on the means
        of delivery; a two-year interim agreement on Berlin possible. Macmillan: perhaps Khrushchev would agree to such an
        arrangement "provided he negotiated it himself." De Gaulle: limits on strategic bombers and missiles agreed in principle
        at the summit, then a permanent committee, "a great advance."'
      n: '[[w.fursenko-khrushchevs-cold-war]], 259–60. To check: memoranda of conversation, Macmillan and de Gaulle, 6:00
        p.m., Apr. 5, and 9:45 a.m., Apr. 6, 1960, PREM 11/3001, National Archives (U.K.) (cited by [[w.fursenko-khrushchevs-cold-war]],
        259 nn.54–55). Names: de Gaulle, Macmillan, Khrushchev.'
      tags:
      - name:de-gaulle-charles
      - name:macmillan-harold
      - name:khrushchev-nikita-s
      src:
        c: e0a1f1a8
        rows:
        - 'w.fursenko-khrushchevs-cold-war 259–60: all'
        - 'via w.fursenko-khrushchevs-cold-war 259 n.54a: A-B'
        - 'via w.fursenko-khrushchevs-cold-war 259 n.55: C'
        - 'via w.fursenko-khrushchevs-cold-war 260 n.56: D'
