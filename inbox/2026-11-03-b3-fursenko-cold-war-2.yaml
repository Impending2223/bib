        303. To check: Rubottom to Herter, Mar. 9, 1960, FRUS 1958–60, VI, 829 (cited by [[w.fursenko-khrushchevs-cold-war]],
        303 n.49). See [[cal.1960-03-08.cuba]]. Names: Burke, Eisenhower.'
