      date: '1960-09-09'
      thread: soviet-union-un
      also:
      - congo
      c: Khrushchev sails from Kaliningrad for New York and the General Assembly aboard the *Baltika*, ten days, with leaders
        of the East bloc. On the way, coded messages with the Foreign Ministry on the Congo; on deck, he says later, the thought
        of reshaping the UN.
      n: '[[w.fursenko-khrushchevs-cold-war]], 315–17. To check: Talbott ed., *Khrushchev Remembers: The Last Testament* (1974),
        482 (cited by [[w.fursenko-khrushchevs-cold-war]], 316 n.108). Check: the port. See [[cal.1960-09-19.soviet-union]].
        Names: Khrushchev.'
