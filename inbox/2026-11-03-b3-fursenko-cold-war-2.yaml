      when: May 13
      date: '1960-05-13'
      thread: soviet-union-u2
      also:
      - defense
      c: Moscow announces that Marshal Vershinin of the Soviet Air Force, due to leave May 14 for Washington as the Pentagon's
        guest, puts off his visit.
      n: '[[w.fursenko-khrushchevs-cold-war]], 278, 282. Check: the day: "the next day" after the Presidium of May 12 (282).
        See [[cal.1960-05-01.soviet-union]].'
