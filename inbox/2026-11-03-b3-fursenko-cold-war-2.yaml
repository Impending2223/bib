      c: 'Peking. North Vietnam''s Ambassador, Chan Ti Bin, with Chervonenko, the Soviet Ambassador: Souvanna Phouma "just
        like U Nu and Sihanouk in his anticommunist leanings," "unstable," at best a passing solution; the Vietnamese led
        the revolution in Indochina, most of the Lao party''s first members Vietnamese. American aid to Laos, 1955–60, $169.6
        million; the Lao Army grown from 25,000 to 32,000.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 325–27. To check: Chervonenko and Chan Ti Bin, Oct. 13, 1960, AVPRF (cited
        by [[w.fursenko-khrushchevs-cold-war]], 325 n.7, 326 n.11, 327 n.13). Names: Souvanna Phouma.'
