        East and West Berlin now; the refugees in April twice the year before; perhaps a provisional agreement on Berlin at
        the summit.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 353. To check: Pervukhin to the Foreign Ministry, May 19, 1961, in Harrison,
        "Khrushchev and the ''Concrete Rose''," 36 (cited by [[w.fursenko-khrushchevs-cold-war]], 353 n.64). Names: Pervukhin.'
