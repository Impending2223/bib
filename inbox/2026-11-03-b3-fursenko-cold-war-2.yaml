      when: Dec. 2
      date: '1960-12-02'
      thread: laos
      c: 'Vientiane. Several hundred demonstrators friendly to the Pathet Lao against a coalition taking in Phoumi Nosavan.
        Souvanna Phouma, from the steps of the National Assembly: "peace or war. If you want war you can have my resignation."
        He asks Phoumi for a cease-fire, and Eisenhower, through the American Ambassador, to stop helping Phoumi.'
      n: '[[w.fursenko-khrushchevs-cold-war]], 333. To check: Roy Essoyan, *Washington Post and Times Herald*, Dec. 3, 1960;
        Jacques Nevard, *New York Times*, Dec. 6, 1960 (cited by [[w.fursenko-khrushchevs-cold-war]], 333 nn.34–35). Names:
        Souvanna Phouma, Phoumi Nosavan, Eisenhower.'
      tags:
      - name:souvanna-phouma
      - name:phoumi-nosavan
      - name:eisenhower-dwight-d
      - place:vientiane
      src:
