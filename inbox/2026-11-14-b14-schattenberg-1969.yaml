patch: 2026-11-14-b14-schattenberg-1969
by: 'Claude (batch 14, reader 5, 1969: Schattenberg, *Brezhnev: The Making of a Statesman*, pp. 211, 214–15, 227–28, 247, 254, 282, 285–89, 299, 337–38), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1969-01-22.soviet-union-leadership-2
      when: Jan. 22
      date: '1969-01-22'
      thread: soviet-union-leadership
      c: An attempt on Brezhnev. The assassin shoots at the wrong car of the convoy bringing the cosmonauts of Soyuz 4 and 5 to the reception in the Kremlin; Brezhnev unhurt, a chauffeur the only death. *Pravda* reports it in passing, the cosmonauts the target, Brezhnev not named. He does not mention it in his notebooks.
      n: '[[w.schattenberg-brezhnev]], 337–38 (n.16–17). To check: *Pravda*, Jan. 24, 1969, 2, "Soobshchenie"; V. Medvedev, *Chelovek za spinoy* (1994), 35–36; Shelest, *Da ne sudimy budete*, 418 (cited by [[w.schattenberg-brezhnev]], 337 nn.16–17). Names: Brezhnev.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
- add:
    entry:
      id: cal.1969-11-21.soviet-union-leadership
      when: Nov. 21
      date: '1969-11-21'
      thread: soviet-union-leadership
      c: 'Brezhnev''s notebook, for the agricultural congress that is to settle a new statute for the kolkhozes: mechanization, irrigation, fertilizer, incentives; the farmers'' papers and freedom of movement to be solved, "but not at the congress"; the education of the kolkhoz workers in diligence and economy; the question of democratization depends on kolkhoz life. The rayon committees and administrations to carry it out, not pushed from above.'
      n: '[[w.schattenberg-brezhnev]], 211 (n.66), 214–15 (n.98–101). To check: RGANI, f. 80, op. 1, d. 276, l. 127–32, entry of Nov. 21, 1969; *Rabochie i dnevnikovye zapisi*, I, 431, 451 (cited by [[w.schattenberg-brezhnev]], 211 n.66, 215 nn.99–101). Made public: 2021 at the latest. Names: Brezhnev. Check: the day of the congress itself (the work: "November 1969"); that the notebook entry is for it.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1969-12-17.soviet-union-leadership
      when: Dec. 17
      date: '1969-12-17'
      thread: soviet-union-leadership
      c: 'The Politburo on an article for Stalin''s ninetieth birthday, Dec. 21. Opinions diverge: some want no mention of him, some celebrate him, some a balanced picture, some him as a mass murderer. Brezhnev, who had been for no article, decides after hearing the oblast secretaries and the others that one be published: no one denies his revolutionary merits, no one his grave errors.'
      n: '[[w.schattenberg-brezhnev]], 247 (n.31, 34). To check: L. Mlechin, *Brezhnev*, 303, 307; Shelest, *Da ne sudimy budete*, 444 (cited by [[w.schattenberg-brezhnev]], 247 nn.31, 34). Made public: 2021 at the latest. Names: Brezhnev, Stalin, Shelest. Check: the day: the work gives Dec. 17; its n.34 notes Shelest has Dec. 19; the Politburo''s earlier commission to the Central Committee for the article, undated.'
      tags:
      - name:brezhnev-leonid
      - polity:ussr
      - vis:only:ussr
- add:
    entry:
      id: cal.1969-12-25.soviet-union-leadership
      when: Dec. 25
      date: '1969-12-25'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance-federal-republic
      c: 'West Berlin. Lednëv, a "journalist" sent by the KGB, brings Bahr a copy of Brandt''s letter of Nov. 19 to Kosygin, opening a confidential channel: the Soviet side is open to a confidential exchange of opinions, whose occurrence and content will never be made public. Bahr takes him at first for Kosygin''s man; later he learns Lednëv means Brezhnev and the KGB.'
      n: '[[w.schattenberg-brezhnev]], 288–89 (n.220–24). To check: Bahr''s note, Dec. 24, 1969, *Akten zur Auswärtigen Politik der Bundesrepublik Deutschland 1969*, II, 1465; Brandt to Kosygin, Nov. 19, 1969, ibid., 1313; E. Bahr, *Zu meiner Zeit*, 293 (cited by [[w.schattenberg-brezhnev]], 288 nn.221–23). Made public: 2021 at the latest. Names: Bahr, Brandt, Kosygin, Brezhnev, Andropov. Check: the day: Christmas Day in the text, Bahr''s own record dated Dec. 24.'
      tags:
      - name:brandt-willy
      - name:kosygin-aleksei
      - name:brezhnev-leonid
      - name:andropov-yuriy-vladimirovich
      - polity:ussr
      - polity:frg
      - vis:only:ussr+frg
- cite:
    id: cal.1969-12-15.soviet-union-leadership
    item: '[[w.schattenberg-brezhnev]], 227–28 (nn.229–38), 247 (n.32) (Brezhnev''s secret speech at the December plenum: the first general attack on Kosygin and Gosplan, Baybakov among them, their 1970 plan badly thought out; ministries named by the figures they miss; alcohol the scourge of the country; against a return to Stalinist "order"; prepared by his Secretariat under Bovin and not discussed with the Politburo, which surprised the Central Committee and Politburo)'
    units: '?'
- to-check:
    id: cal.1969-12-15.soviet-union-leadership
    add: RGANI, f. 2, op. 3, d. 168 (Protocol no. 12, Dec. 15, 1969), l. 30, 36, 40–44, 58 (cited by [[w.schattenberg-brezhnev]], 227–28 nn.231–35, 247 n.32)
- cite:
    id: cal.1969-06-25.soviet-union-leadership
    item: '[[w.schattenberg-brezhnev]], 214 (nn.92–97) (Brezhnev on agriculture: the poor harvest of 1967 and the food promised to Czechoslovakia in 1968; the guaranteed wage left the kolkhoz workers apathetic; "We are going through a very critical time"; the work puts it in June 1969, "invited all those involved in the oblasts and rayons to discuss the situation"; not the plenum by name)'
    units: '?'
- check:
    id: cal.1969-06-25.soviet-union-leadership
    text: 'Check: [[w.schattenberg-brezhnev]], 214 (n.92: RGANI, f. 2, op. 3, d. 159, l. 143–44), dates Brezhnev''s statement on agriculture "in June 1969" without naming the plenum; whether it is this plenum is not shown.'
- cite:
    id: cal.1969-01-22.soviet-union-leadership
    item: '[[w.schattenberg-brezhnev]], 337–38 (nn.16–17) (the shots at the convoy bringing the Soyuz 4 and 5 cosmonauts to the Kremlin reception; the work calls it an attempt on Brezhnev; a chauffeur killed; Brezhnev unhurt; see the entry of the attempt)'
    units: '?'
