      when: Nov. 25
      date: '1963-11-25'
      thread: assassination
      also:
      - soviet-union
      c: 'The White House reception after the funeral. Jacqueline Kennedy to Mikoyan and Dobrynin: the morning of his death
        her husband told her "that everything should be done to get things under way with Russia"; "Now our governments must
        go on with this." Her handwritten letter to Khrushchev follows. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 114. See [[cal.1963-11-25.assassination]]. Names: Jacqueline Kennedy, Mikoyan, Dobrynin,
        Khrushchev.'
      tags:
      - name:kennedy-jacqueline
      - name:mikoyan-anastas
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      src:
        c: ce234941
        rows:
        - 'w.dobrynin-in-confidence 114: all'
- cite:
    id: cal.1963-11-24.vietnam
    item: '[[w.dobrynin-in-confidence]], 120 (Johnson to Lodge, as Fulbright later told Dobrynin: "no intention of losing
      Vietnam to the communists, like China")'
    units: A
- check:
    id: cal.1963-11-24.vietnam
    text: 'Check: Dobrynin, from Fulbright, puts Johnson''s words to Lodge "on the very day of Kennedy''s funeral" (120).'
- cite:
    id: cal.1963-12-18.soviet-union
    item: '[[w.dobrynin-in-confidence]], 121 (Bundy for a summit if it leads to agreement; no pulling out of Vietnam, "political
      suicide"; by Dobrynin''s account)'
    units: A
- add:
    entry:
      id: cal.1964-01.soviet-union
      when: Jan.
      date: 1964-01
      thread: soviet-union
      also:
      - elections-1964
      c: 'Bundy to Dobrynin, reversing December: the President too busy for a summit in an election year, and unable to leave
        without a Vice President. Rusk, Dobrynin later learns, had discouraged it; in Moscow, Khrushchev and Mikoyan for,
        Gromyko against unless well prepared.'
      n: '[[w.dobrynin-in-confidence]], 121–22. Check: the day. See [[cal.1963-12-18.soviet-union]]. Names: Bundy, Dobrynin,
        Rusk, Khrushchev, Mikoyan, Gromyko.'
      tags:
      - name:bundy-mcgeorge
      - name:dobrynin-anatoly
      - name:rusk-dean
      - name:khrushchev-nikita-s
      - name:mikoyan-anastas
      - name:gromyko-andrei
      src:
        c: b314138c
        rows:
        - 'w.dobrynin-in-confidence 121–22: all'
- add:
    entry:
      id: cal.1964-04-17.soviet-union
      when: Apr. 17
      date: '1964-04-17'
      thread: soviet-union
      also:
      - testing
      - elections-1964
      c: 'Johnson and Dobrynin alone, the Oval Office: wishes for Khrushchev''s seventieth birthday; hunting. Foreign policy
        for now set by the election; a Chicago paper accused him of "publicly hugging a communist"; Goldwater, Nixon and the
        Republican right. A cutback in fissionable material for weapons, bilateral, "that guy in Paris" aside; an exchange
        of televised addresses; American planes ordered not to violate Soviet airspace, no "extreme measures" for mistakes.
        Khrushchev''s reply, May 15, satisfied. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 123–24. See [[cal.1964-04-20.testing]]. Names: Johnson, Dobrynin, Khrushchev, Goldwater,
        Nixon, de Gaulle.'
      tags:
      - name:johnson-lyndon-b
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      - name:goldwater-barry-m
      - name:nixon-richard-m
      - name:de-gaulle-charles
      src:
        c: d9d20682
        rows:
        - 'w.dobrynin-in-confidence 123–24: all'
- cite:
    id: cal.1964-04-20.testing
    item: '[[w.dobrynin-in-confidence]], 124 ("A joint statement to that effect was soon made")'
    units: A, C
- add:
    entry:
      id: cal.1964-06-05.soviet-union
      when: June 5
      date: '1964-06-05'
      thread: soviet-union
      also:
      - berlin-and-vienna
      - vietnam
      c: 'Khrushchev''s confidential message to Johnson, given orally by Dobrynin to Thompson: troops in Europe, American
        attacks on Cuba, Germany, Southeast Asia, South Vietnam and Cambodia; "everyone needs peace equally"; settle Germany
        and there would be no "great confrontation between John and Ivan"; the revanchists will never seize the GDR, "even
        if in a hundred years the capitalist system is still there."'
      n: '[[w.dobrynin-in-confidence]], 124–25. Names: Khrushchev, Johnson, Dobrynin, Thompson.'
      tags:
      - name:khrushchev-nikita-s
      - name:johnson-lyndon-b
      - name:dobrynin-anatoly
      - name:thompson-llewellyn-e
      src:
        c: 31808ba6
        rows:
        - 'w.dobrynin-in-confidence 124–25: all'
- add:
    entry:
      id: cal.1964-06-10.berlin-and-vienna
      when: June 10
      date: '1964-06-10'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - laos
      c: 'Dobrynin, on Khrushchev''s instruction, tells Rusk that the Soviet Union and the GDR will sign a Treaty of Friendship,
        Cooperation and Mutual Assistance. Rusk: "What''s mine is mine, and what''s yours is to be divided between us." Rusk
        gives him Johnson''s message on Laos: the Geneva agreements Khrushchev''s and Kennedy''s personal understanding, to
        be carried out in full. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 125–26. Check: the day of Johnson''s message. Names: Dobrynin, Khrushchev, Rusk, Johnson.'
      tags:
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      - name:rusk-dean
      - name:johnson-lyndon-b
      src:
        c: 49491e49
        rows:
        - 'w.dobrynin-in-confidence 125–26: all'
- add:
    entry:
      id: cal.1964-07-12.elections-1964-2
      when: July 12
      date: '1964-07-12'
      thread: elections-1964
      also:
      - soviet-union
      c: 'The White House, two hours before Dobrynin''s flight home on leave. Bundy: Goldwater the opponent, and in the polemics
        the President may say things that displease Moscow; campaign rhetoric no change in his position; Soviet criticism
        of Johnson acceptable "within reasonable limits." By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 126. Names: Bundy, Dobrynin, Goldwater, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:dobrynin-anatoly
      - name:goldwater-barry-m
      - name:johnson-lyndon-b
      src:
        c: 0102f180
        rows:
        - 'w.dobrynin-in-confidence 126: all'
- add:
    entry:
      id: cal.1964-10.soviet-union
      when: Oct.
      date: 1964-10
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Bundy at dinner with Dobrynin: the administration''s planners assume Germany could be reunified only as a neutral
        outside NATO; why does Moscow not propose it? By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 125. Check: the day. Names: Bundy, Dobrynin.'
      tags:
      - name:bundy-mcgeorge
      - name:dobrynin-anatoly
      src:
        c: 22e18e05
        rows:
        - 'w.dobrynin-in-confidence 125: all'
- cite:
    id: cal.1964-10-15.soviet-union
    item: '[[w.dobrynin-in-confidence]], 131–33 (Oct. 16, morning: no change in foreign policy; Johnson: "We do not want to
      bury the Soviet Union, but at the same time we do not want to be buried"; "without a pistol under my pillow"; China''s
      bomb that day; by Dobrynin''s account)'
    units: E
- add:
    entry:
      id: cal.1964-11-03.soviet-union
      when: Nov. 3
      date: '1964-11-03'
      thread: soviet-union
      also:
      - elections-1964
      c: 'Election day. Dobrynin hands Thompson the Soviet government''s note for Johnson, at his ranch: both sides to cut
        military spending further without formal agreements; mutual troop reductions in Europe; relations of trust "including
        through established confidential channels." Brezhnev for sending it before the result. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 137. Names: Dobrynin, Thompson, Johnson, Brezhnev.'
      tags:
      - name:dobrynin-anatoly
      - name:thompson-llewellyn-e
      - name:johnson-lyndon-b
      - name:brezhnev-leonid
      src:
        c: 839ea80b
        rows:
        - 'w.dobrynin-in-confidence 137: all'
- add:
    entry:
      id: cal.1965-01-14.soviet-union
      when: Jan. 14
      date: '1965-01-14'
      thread: soviet-union
      c: 'Thompson hands Dobrynin Johnson''s reply to the note of Nov. 3: $2 billion less asked for defense; a member of "the
        Soviet leadership," left unnamed, to visit for full talks. The Soviet leaders come to prefer Johnson in Moscow; Brezhnev
        and Kosygin at odds over who signs. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 138. See [[cal.1964-11-03.soviet-union]]. Names: Thompson, Dobrynin, Johnson, Brezhnev,
        Kosygin.'
      tags:
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      src:
        c: 9821f277
        rows:
        - 'w.dobrynin-in-confidence 138: all'
- cite:
    id: cal.1965-02-06.soviet-union
    item: '[[w.dobrynin-in-confidence]], 139–40 (Fulbright to Dobrynin: Johnson hesitated whether to wait for Kosygin to leave;
      Rusk''s excuses; the strongly worded Soviet message; Kosygin turned against Johnson)'
    units: A-B
- add:
    entry:
      id: cal.1965-03-02.vietnam-4
      when: Mar. 2
      date: '1965-03-02'
      thread: vietnam
      also:
      - soviet-union
      - laos
      c: 'Rusk to Dobrynin, agitated: contacts with Peking and Hanoi show Hanoi will not stop; Laos used to infiltrate the
        South, against the Geneva agreements, for which the Soviet Union shares responsibility. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 141. Names: Rusk, Dobrynin.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      src:
        c: 0435a1c8
        rows:
        - 'w.dobrynin-in-confidence 141: all'
- add:
    entry:
      id: cal.1965-03-12.vietnam-2
      when: Mar. 12
      date: '1965-03-12'
      thread: vietnam
      also:
      - soviet-union
      - china
      - vietnam-humphrey
      c: 'Humphrey at a private lunch with Dobrynin: Peking takes the United States for a "paper tiger"; no forced withdrawal
        without a settlement; Hanoi to halt in the South, the United States in the North, then talks; any government in the
        South acceptable, even socialist, but no yielding to Peking; Soviet aid to Hanoi understood. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 142. Names: Humphrey, Dobrynin.'
      tags:
      - name:humphrey-hubert-h
      - name:dobrynin-anatoly
      src:
        c: d593c511
        rows:
        - 'w.dobrynin-in-confidence 142: all'
- add:
    entry:
      id: cal.1965-05-08.vietnam-2
      when: May 8
      date: '1965-05-08'
      thread: vietnam
      also:
      - soviet-union
      c: 'The State Department''s reception for the diplomatic corps. Rusk to Dobrynin, tentative and personal: neither power
        should be enslaved by its partners; a confidential agreement on Vietnam between Washington and Moscow; a Soviet guarantee
        to North Vietnam against bombing not taken as a challenge; a setback for China. Dobrynin reports it as important;
        Gromyko: hard to put into practice. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 143. Names: Rusk, Dobrynin, Gromyko, Brezhnev.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:gromyko-andrei
      - name:brezhnev-leonid
      src:
        c: 44d439e5
        rows:
        - 'w.dobrynin-in-confidence 143: all'
- cite:
    id: cal.1965-05-12.vietnam
    item: '[[w.dobrynin-in-confidence]], 143 ("two days later," Rusk to Dobrynin: the raids halted for a limited probation
      period)'
    units: B
- check:
    id: cal.1965-05-12.vietnam
    text: 'Check: Dobrynin dates Rusk''s word "two days" after May 8 (143).'
- add:
    entry:
      id: cal.1965-05-15.vietnam
      when: May 15
      date: '1965-05-15'
      thread: vietnam
      also:
      - soviet-union
      - vietnam-mayflower
      c: 'Vienna, the tenth anniversary of the Austrian State Treaty. Rusk presses his proposals on Gromyko, and again through
        Kohler in Moscow; Gromyko: the Soviet Union does not and will not negotiate on Vietnam with anyone, the United States
        included. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 143. Check: the day. See [[cal.1965-05-08.vietnam-2]]. Names: Rusk, Gromyko, Kohler.'
      tags:
      - name:rusk-dean
      - name:gromyko-andrei
      - name:kohler-foy-d
      src:
        c: cc9ecc27
        rows:
        - 'w.dobrynin-in-confidence 143: all'
- add:
    entry:
      id: cal.1965-07-03.vietnam
      when: July 3
      date: '1965-07-03'
      thread: vietnam
      also:
      - soviet-union
      c: 'Rusk and Dobrynin, before Dobrynin''s leave: has Moscow accepted Hanoi''s veto? Gromyko''s "You stop first, then
        we''ll see" to Kohler; every American attempt at a confidential channel to Hanoi has failed; war and peace in Soviet
        and American hands. Dobrynin, under instructions: American policy changed for the worse since Kennedy; Rusk hurt.
        In Moscow, the Politburo: relations with the United States the priority, Vietnam not vital, but "international solidarity."
        By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 144–45. Names: Rusk, Dobrynin, Gromyko, Kohler.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:gromyko-andrei
      - name:kohler-foy-d
      src:
        c: a227edd1
        rows:
        - 'w.dobrynin-in-confidence 144–45: all'
- add:
    entry:
      id: cal.1963-12-09.testing
      when: Dec. 9
      date: '1963-12-09'
      thread: testing
      also:
      - soviet-union
      c: 'Rusk to Dobrynin, for Moscow: the United States to cut its military budget for fiscal 1965 by $1 billion, about
        2 percent. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 151–52. Check: the fiscal year; Dobrynin: "the 1964-65 fiscal year." Names: Rusk,
        Dobrynin.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      src:
        c: 71a10589
        rows:
        - 'w.dobrynin-in-confidence 151–52: all'
- add:
    entry:
      id: cal.1963-12-12.testing
      when: Dec. 12
      date: '1963-12-12'
      thread: testing
      also:
      - soviet-union
      c: 'Moscow''s answer, by Dobrynin: Soviet military spending for 1964 to be cut by 600 million rubles. The same day Rusk
        recalls his proposal to Gromyko that both sides scrap their B-47-class bombers, other weapons to be destroyed at agreed
        sites. Dobrynin, on instructions: no serious step, each side replacing old arms with new; general and complete disarmament.
        By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 152. See [[cal.1963-12-09.testing]]. Names: Rusk, Gromyko, Dobrynin.'
      tags:
      - name:rusk-dean
      - name:gromyko-andrei
      - name:dobrynin-anatoly
      src:
        c: cf4bc0ca
        rows:
        - 'w.dobrynin-in-confidence 152: all'
- add:
    entry:
      id: cal.1964-01-16.testing
      when: Jan. 16
      date: '1964-01-16'
      thread: testing
      also:
      - soviet-union
      c: 'Foster at lunch with Dobrynin: both nations might renounce a large ABM system, at least $15 to $20 billion; a preliminary
        confidential arrangement between the heads of government; Johnson not yet committed. "Don''t talk about this in public,
        or I''ll be called before the Un-American Activities Committee." By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 154. Names: Foster, Dobrynin, Johnson.'
      tags:
      - name:foster-william-c
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      src:
        c: edfb0cf5
        rows:
        - 'w.dobrynin-in-confidence 154: all'
- add:
    entry:
      id: cal.1966-03-18.testing
      when: Mar. 18
      date: '1966-03-18'
      thread: testing
      also:
      - soviet-union
      - defense-abm
      c: 'Dobrynin, on instructions, to Foster: ABM systems deserve attention, and could be discussed in a package with the
        nuclear delivery vehicles. Foster: an ABM agreement needs no inspection, its facilities being impossible to hide,
        the offensive forces closer surveillance; research and development not affected. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 155–56. See [[cal.1964-01-16.testing]]. Names: Dobrynin, Foster.'
      tags:
      - name:dobrynin-anatoly
      - name:foster-william-c
      src:
        c: a0f6b754
        rows:
        - 'w.dobrynin-in-confidence 155–56: all'
- add:
    entry:
      id: cal.1967-01-13.soviet-union
      when: Jan. 13
      date: '1967-01-13'
      thread: soviet-union
      also:
      - vietnam
      - china
      c: Gromyko submits to the Politburo the Foreign Ministry's assessment of relations with the United States; approved.
        "On the whole, international tension does not suit the state interests of the Soviet Union and its friends." Aid to
        the DRV, "without getting directly involved in the war"; agreements with the United States where they do not contradict
        the position on Vietnam; no fight "on two fronts," against China and the United States.
      n: '[[w.dobrynin-in-confidence]], 161–63 (quoting it). Made public: [[w.dobrynin-in-confidence]] (1995). Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      src:
        c: ed6d776d
        rows:
        - 'w.dobrynin-in-confidence 161–63: all'
- add:
    entry:
      id: cal.1967-04-11.defense-abm
      when: Apr. 11
      date: '1967-04-11'
      thread: defense-abm
      also:
      - soviet-union
      - testing
      c: 'McNamara at lunch at his home with Dobrynin: each side able to absorb a surprise strike and destroy the other; the
        American arsenal more than the doctrine needs, from the buildup after the missile gap and the Berlin crisis; no reliable
        ABM possible, the answer more offensive missiles. He would send his assistants to join Thompson for talks in Moscow;
        a preliminary answer wanted. None comes. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 156–58. See [[cal.1967-01-21.defense-abm]]. Names: McNamara, Dobrynin, Thompson.'
      tags:
      - name:mcnamara-robert-s
      - name:dobrynin-anatoly
      - name:thompson-llewellyn-e
      src:
        c: 99a8c1e4
        rows:
        - 'w.dobrynin-in-confidence 156–58: all'
- add:
    entry:
      id: cal.1967-06-21.defense-abm
      when: June 21
      date: '1967-06-21'
      thread: defense-abm
      also:
      - soviet-union
      c: 'McNamara to Dobrynin: at the summit, let him brief Johnson and Kosygin alone, with the latest data on the futility
        of ABM systems. Kosygin agrees to hear him. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 170. Check: the day; Dobrynin: "two days before the Glassboro meeting." See [[cal.1967-04-11.defense-abm]].
        Names: McNamara, Dobrynin, Johnson, Kosygin.'
      tags:
      - name:mcnamara-robert-s
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
      src:
        c: 28a6f81e
        rows:
        - 'w.dobrynin-in-confidence 170: all'
