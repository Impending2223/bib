patch: b3-dobrynin-2
by: Claude (batch 3 reading, group soviet), Nov. 3-4, 2026
ops:
- cite:
    id: cal.1960-05-05.soviet-union-u2
    item: '[[w.dobrynin-in-confidence]], 40 (Malik''s slip at a reception; Thompson''s cable)'
    units: B-C
- check:
    id: cal.1960-05-05.soviet-union-u2
    text: 'Check: Dobrynin has Thompson''s cable reach Washington "minutes too late" to amend its version, and Khrushchev,
      enraged, remove Malik from his post and from the party, then pardon him at Gromyko''s plea after three weeks (40–41).'
- cite:
    id: cal.1960-05-12.soviet-union-u2
    item: '[[w.dobrynin-in-confidence]], 42–43 (directives on every item, approved by the Politburo; leave to criticize the
      flight strongly, none to demand an apology; Khrushchev''s promise "to teach the Americans, who had gone beyond all limits,
      a good lesson"; by Dobrynin''s account, who was there)'
    units: A-B
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.dobrynin-in-confidence]], 41 (May 16: Khrushchev first; the flights "would not be renewed"; by Dobrynin''s
      account, the delegation''s counselor)'
    units: D-E
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.dobrynin-in-confidence]], 42–43 (May 17: the Soviets absent, not told whether the meeting was the opening;
      Hagerty: the conference closed; the Soviet statement in reply)'
    units: F-G
- cite:
    id: cal.1960-05-16.soviet-union-u2-2
    item: '[[w.dobrynin-in-confidence]], 42 (Macmillan and de Gaulle in private talks with Khrushchev: two of the three demands
      met; "Can a head of state censure himself and his nation?" Khrushchev: "We want him to condemn the guilty")'
    units: A
- add:
    entry:
      id: cal.1960-05-16.soviet-union-u2-3
      when: May 16
      date: '1960-05-16'
      thread: soviet-union-u2
      c: 'Paris, evening. Khrushchev with the Soviet delegation, by Dobrynin''s account: if not Eisenhower, his close associates
        meant to humiliate him; Stalin''s words, "the arrogant Americans would wring your necks, like chickens." Malinovsky
        for the unyielding line; Gromyko: "Eisenhower has to be taught a good lesson," but fearing the summit''s collapse,
        looking for a way out.'
      n: '[[w.dobrynin-in-confidence]], 42. See [[cal.1960-05-15.soviet-union]]. Names: Khrushchev, Eisenhower, Malinovsky,
        Gromyko.'
      tags:
      - name:khrushchev-nikita-s
      - name:eisenhower-dwight-d
      - name:malinovsky-rodion-yakovlevich
      - name:gromyko-andrei
      - name:dobrynin-anatoly
      src:
        c: aa6201c7
        rows:
        - 'w.dobrynin-in-confidence 42: all'
- cite:
    id: cal.1961-01-20.soviet-union
    item: '[[w.dobrynin-in-confidence]], 43–44 (the message of greetings on the inauguration: a "radical improvement of relations")'
    units: A
- check:
    id: cal.1961-01-25.press-and-broadcasting
    text: 'Check: Dobrynin has Washington''s official note of Jan. 24 confirming the President''s order that American planes
      not enter Soviet airspace (44).'
- cite:
    id: cal.1961-03-09.soviet-union
    item: '[[w.dobrynin-in-confidence]], 44 (Thompson hands Khrushchev the confidential message proposing a summit, Mar. 9;
      by Dobrynin''s account)'
    units: A
- cite:
    id: cal.1961-05-26.soviet-union
    item: '[[w.dobrynin-in-confidence]], 44–46 ("approximately ten days before" Vienna, Dobrynin there as the delegation''s
      counselor: the pressure on a young president; Mikoyan alone in doubt, "for a cautious approach"; no thought of war)'
    units: A, C-D
- cite:
    id: cal.1961-06-03.berlin-and-vienna
    item: '[[w.dobrynin-in-confidence]], 45–47 ("the most tense"; a treaty with East Germany "not later than in December";
      three inspections a year; by Dobrynin''s account)'
    units: A-B
- check:
    id: cal.1961-06-03.berlin-and-vienna
    text: 'Check: Dobrynin dates the summit July 3–4 (44–45).'
- cite:
    id: cal.1961-06-04.press-and-broadcasting
    item: '[[w.dobrynin-in-confidence]], 46 (Kennedy with Reston right after the meeting; Reston''s article: a prolonged crisis
      inevitable over Germany)'
    units: A
- add:
    entry:
      id: cal.1962-03.soviet-union-2
      when: Mar.
      date: 1962-03
      thread: soviet-union
      c: 'Moscow, before Dobrynin leaves for Washington. Gromyko: no new instructions; not to judge the Americans hastily;
        "serious, solid, and sensible information," without sensations. Khrushchev: "resist temptation when provoked," "Don''t
        ask for trouble," war with the United States inadmissible; Germany and West Berlin the chief issue; American superiority
        makes them "particularly arrogant," the missiles in Turkey "under the very nose of the Soviet Union"; "It''s high
        time their long arms were cut shorter." Kennedy "a man of character." Gromyko has Dobrynin take over Bolshakov''s
        contacts gradually. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 53–55. [[w.fursenko-khrushchevs-cold-war]], 424, 433 (Khrushchev''s anger; "particularly
        arrogant"; the long arms). See [[cal.1962-03-30.soviet-union]]. Names: Dobrynin, Gromyko, Khrushchev, Kennedy, Bolshakov.'
      tags:
      - name:dobrynin-anatoly
      - name:gromyko-andrei
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:bolshakov-georgi
      src:
        c: ebd3c005
        rows:
        - 'w.dobrynin-in-confidence 53–55: all'
        - 'w.fursenko-khrushchevs-cold-war 424, 433: C'
- add:
    entry:
      id: cal.1962-03-29.soviet-union
      when: Mar. 29
      date: '1962-03-29'
      thread: soviet-union
      c: 'The State Department. Dobrynin''s first meeting with Rusk, informal, before the credentials: Rusk had found no personal
        contact with Menshikov; they might meet outside the department, at his house in the evening, on the President''s yacht.
        Nothing serious discussed. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 59–60. See [[cal.1962-03-30.soviet-union]]. Names: Dobrynin, Rusk, Menshikov.'
      tags:
      - name:dobrynin-anatoly
      - name:rusk-dean
      - name:menshikov-mikhail
      src:
        c: 827df11c
        rows:
        - 'w.dobrynin-in-confidence 59–60: all'
- cite:
    id: cal.1962-03-30.soviet-union
    item: '[[w.dobrynin-in-confidence]], 60–62 (Kennedy alone in his rocking chair, Dobrynin alone; another meeting with Khrushchev
      this year, Germany and Berlin; "Whatever I do, 80 percent of the American media comes out against me"; Dobrynin to Moscow:
      "a worthy opponent")'
    units: A
- check:
    id: cal.1962-03-30.soviet-union
    text: 'Check: Dobrynin dates the credentials Mar. 31 (60).'
- add:
    entry:
      id: cal.1962-04-10.press-and-broadcasting
      when: Apr. 10
      date: '1962-04-10'
      thread: press-and-broadcasting
      also:
      - berlin-and-vienna
      c: 'Rusk''s confidential background briefing for a private group of leading columnists, soon known about town: no practical
        reason for the Soviet proposal of a NATO–Warsaw Pact nonaggression treaty without an understanding on the status quo,
        West Berlin included, and none in sight; more money for arms, to bring both sides to a solution. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 65–66. Names: Rusk.'
      tags:
      - name:rusk-dean
      src:
        c: 6e928ab8
        rows:
        - 'w.dobrynin-in-confidence 65–66: all'
- add:
    entry:
      id: cal.1962-05-03.soviet-union
      when: May 3
      date: '1962-05-03'
      thread: soviet-union
      also:
      - robert-kennedy
      c: 'The White House, the reception for the diplomatic corps. Kennedy introduces his brother to Dobrynin as "an expert
        in confidential contacts with the Soviet Union" whom he "ought to know better." A week later, lunch at Robert Kennedy''s
        house in McLean, Va., politics left aside: the start of their channel. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 62–63. Check: the day of the lunch. Names: Kennedy, Robert Kennedy, Dobrynin.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      src:
        c: ef556487
        rows:
        - 'w.dobrynin-in-confidence 62–63: all'
- cite:
    id: cal.1962-06-03.robert-kennedy
    item: '[[w.dobrynin-in-confidence]], 66–67 (the President "cannot do it" on West Berlin; the military''s confidential
      report; not McNamara; by Dobrynin''s account)'
    units: all
- cite:
    id: cal.1962-06-18.berlin-and-vienna
    item: '[[w.dobrynin-in-confidence]], 67 (Moscow urges the President to rein in "the overzealous heads in the Pentagon";
      Robert Kennedy: freeze the Berlin question)'
    units: A
- add:
    entry:
      id: cal.1962-07-13.soviet-union
      when: July 13
      date: '1962-07-13'
      thread: soviet-union
      also:
      - berlin-and-vienna
      c: 'Rusk to Dobrynin: frequent Soviet hints that the United States might start a preventive war, a "very dangerous delusion"
        if believed. Dobrynin: no fear of surprise attack, but of the arms race and Berlin. Rusk, alone with him: thought
        too mild by some, Kennedy''s circle among them, he fears a return to the vocabulary of "Dulles''s times" in the fall
        campaign. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 67–68. Names: Rusk, Dobrynin.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      src:
        c: d4102ec3
        rows:
        - 'w.dobrynin-in-confidence 67–68: all'
- cite:
    id: cal.1962-07-17.berlin-and-vienna
    item: '[[w.dobrynin-in-confidence]], 68–70 (alone at the White House: "If we are forced out of Berlin in any way, all
      our guarantees to Western Europe will lose any sense"; the crisis of last year cost "over three billion dollars"; "I
      wish I were able to get rid of Castro''s Cuba"; a test ban in the atmosphere?)'
    units: A
- check:
    id: cal.1962-07-17.berlin-and-vienna
    text: 'Check: Dobrynin dates this meeting June 17 (68).'
- cite:
    id: cal.1962-08-23.berlin-and-vienna-2
    item: '[[w.dobrynin-in-confidence]], 70 (late August, Sorensen: pressure on Berlin would help the Republicans; Kennedy
      would like the Soviet Union neutral through the elections)'
    units: A
- cite:
    id: cal.1962-09-06.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 70 ("some days later": Moscow regards "the president''s wishes" with understanding;
      Sorensen: Cuba already a campaign issue)'
    units: B-C
- cite:
    id: cal.1962-09-04.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 71–72 (Robert Kennedy, agitated, on the SA-2s and what might follow; Moscow''s instruction:
      "only defensive Soviet weapons in Cuba"; by Dobrynin''s account)'
    units: D
- add:
    entry:
      id: cal.1962-09-18.missile-crisis
      when: Sept. 18
      date: '1962-09-18'
      thread: missile-crisis
      also:
      - soviet-union
      - robert-kennedy
      c: 'Dobrynin gives Robert Kennedy Khrushchev''s oral message, some fifteen pages, in Dobrynin''s own unofficial translation:
        "the aggravation is not our fault"; Berlin frozen until after the elections; the call for 150,000 reservists not expected;
        "piratical demands" to inspect Soviet ships bound for Cuba. Robert Kennedy, gloomy: both should refrain from action,
        Berlin included, before the elections.'
      n: '[[w.dobrynin-in-confidence]], 72–73. See [[cal.1962-09-06.missile-crisis]]. Names: Dobrynin, Robert Kennedy, Khrushchev,
        Udall.'
      tags:
      - name:dobrynin-anatoly
      - name:kennedy-robert-f
      - name:khrushchev-nikita-s
      - name:udall-stewart-l
      src:
        c: e923d33b
        rows:
        - 'w.dobrynin-in-confidence 72–73: all'
- cite:
    id: cal.1962-09-11.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 74 ("this time one cannot attack Cuba and count on going unpunished")'
    units: A
- cite:
    id: cal.1962-05-24.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 74–76 (Alekseev named ambassador; Khrushchev''s "cup of tea" at the dacha; Castro:
      "May we be the first victims of a showdown with U.S. imperialism!"; by Alekseev''s notes given Dobrynin)'
    units: all
- cite:
    id: cal.1962-10-18.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 79–81 (Dobrynin present; "defensive" and "offensive," missiles never named; a summit
      proposed, put off by Rusk''s call that day; Gromyko''s cable: "the situation is quite satisfactory")'
    units: all
- cite:
    id: cal.1962-10-22.missile-crisis-6
    item: '[[w.dobrynin-in-confidence]], 81–82 (6 p.m.; "The documents speak for themselves"; Dobrynin from New York, having
      seen Gromyko off at noon; by Dobrynin''s account)'
    units: A
- check:
    id: cal.1962-10-22.missile-crisis-6
    text: 'Check: Dobrynin gives no sign of shock; he expressed surprise that neither Kennedy nor Rusk had raised it with
      Gromyko four days before (82).'
- cite:
    id: cal.1962-10-23.missile-crisis-5
    item: '[[w.dobrynin-in-confidence]], 84–85 ("staked his political career" on the Soviet assurances; the shipmasters''
      instructions; "But that would be an act of war"; by Dobrynin''s account)'
    units: A-C, F
- cite:
    id: cal.1962-10-27.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 89–91 (the U-2 down; the generals "spoiling for a fight"; the Jupiters out in four
      to five months, nothing said publicly; an answer by Sunday; by Dobrynin''s report written that night)'
    units: B, D
- cite:
    id: cal.1962-10-27.missile-crisis-6
    item: '[[w.dobrynin-in-confidence]], 93–94 (by Rusk''s later account to Dobrynin)'
    units: B-C
- cite:
    id: cal.1962-10-28.missile-crisis-3
    item: '[[w.dobrynin-in-confidence]], 93 (delivered Oct. 29; the accord on Turkey confidential, through Robert Kennedy
      and the ambassador)'
    units: A
- cite:
    id: cal.1962-10-30.missile-crisis-2
    item: '[[w.dobrynin-in-confidence]], 93 (Robert Kennedy: no formal accord, not even confidential letters; he might run
      for President some day)'
    units: B
- check:
    id: cal.1962-10-30.missile-crisis-2
    text: 'Check: Dobrynin does not mention the letter returned (93).'
- add:
    entry:
      id: cal.1962-11-01.missile-crisis-2
      when: Nov. 1
      date: '1962-11-01'
      thread: missile-crisis
      also:
      - robert-kennedy
      - europe-and-the-alliance-jupiters
      c: 'Dobrynin to Robert Kennedy: Khrushchev agrees to the President''s terms on the bases in Turkey, kept confidential,
        and has no doubt the President will keep his word. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 93. Check: the day: "two days later" than Oct. 30 (93). See [[cal.1962-10-30.missile-crisis-2]].
        Names: Dobrynin, Robert Kennedy, Khrushchev.'
      tags:
      - name:dobrynin-anatoly
      - name:kennedy-robert-f
      - name:khrushchev-nikita-s
      src:
        c: 3145ac43
        rows:
        - 'w.dobrynin-in-confidence 93: all'
- cite:
    id: cal.1962-11-29.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 94–96 (three and a half hours, on Cuba; "As soon as the first spark of revolution
      appears any place, so you appear saying, ''Here we are!''"; Mikoyan: "Even you may one day find yourself in Castro''s
      shoes"; "Not I, but my younger brother may indeed"; by Mikoyan''s report)'
    units: A
- cite:
    id: cal.1963-01-07.missile-crisis
    item: '[[w.dobrynin-in-confidence]], 94 (the joint letter, Kuznetsov and Stevenson)'
    units: A
- cite:
    id: cal.1962-10-26.missile-crisis-2
    item: '[[w.dobrynin-in-confidence]], 97–98 (Fomin, really Feklisov, the KGB resident; Kennedy''s letter of Dec. 14 on
      links through journalists; by Dobrynin''s account)'
    units: A
- add:
    entry:
      id: cal.1962-12.robert-kennedy
      when: Dec.
      date: 1962-12
      thread: robert-kennedy
      also:
      - missile-crisis
      - press-and-broadcasting
      c: 'Bolshakov asks Robert Kennedy to stop an article by Bartlett and Stewart Alsop that will name their meetings. Robert
        Kennedy: "We believe that in the Cuban crisis we have been deceived by everybody, including you." The article published;
        Bolshakov recalled. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 97. Check: the day. See [[cal.1962-10-23.missile-crisis-7]]. Names: Bolshakov, Robert
        Kennedy, Bartlett, Stewart Alsop.'
      tags:
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:bartlett-charles
      - name:alsop-stewart
      src:
        c: 49aee1b4
        rows:
        - 'w.dobrynin-in-confidence 97: all'
- cite:
    id: cal.1963-06-20.testing
    item: '[[w.dobrynin-in-confidence]], 101–2 ("to be used in case of emergency"; a telegraph line by Helsinki, Stockholm,
      Copenhagen and London, a wireless backup by Tangier)'
    units: all
- add:
    entry:
      id: cal.1963-03-12.soviet-union
      when: Mar. 12
      date: '1963-03-12'
      thread: soviet-union
      also:
      - robert-kennedy
      - testing
      c: 'Robert Kennedy and Dobrynin, a long private dinner: the President, early on, had him learn Russian, thinking of
        him for ambassador to Moscow; the President''s "heartfelt desire" for a treaty banning all tests, "not for himself,
        but rather for the sake of his children and grandchildren"; another summit, on the test ban, the Soviet troops in
        Cuba, Germany and Berlin. Dobrynin to Moscow: a summit mainly for the 1964 election; nothing new on Berlin.'
      n: '[[w.dobrynin-in-confidence]], 102. Names: Robert Kennedy, Dobrynin, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      src:
        c: 1aee8dd1
        rows:
        - 'w.dobrynin-in-confidence 102: all'
- add:
    entry:
      id: cal.1963-03-26.berlin-and-vienna
      when: Mar. 26
      date: '1963-03-26'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Rusk and Dobrynin on Germany and Berlin, Dobrynin under instructions on Khrushchev''s known proposals. Rusk: many
        see little sense in it, but the President will keep looking; did the Soviets not believe "time would take care of
        settling a number of questions"? A long, repetitive round begins. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 103. See [[cal.1963-03-12.soviet-union]]. Names: Rusk, Dobrynin, Kennedy.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      src:
        c: ffdb8350
        rows:
        - 'w.dobrynin-in-confidence 103: all'
- add:
    entry:
      id: cal.1963-03.testing
      when: Mar.
      date: 1963-03
      thread: testing
      also:
      - soviet-union
      c: 'Dobrynin with McNamara: the physicists see little military sense in more testing, but Congress and the public, more
        afraid of war since Cuba, want it, the Republicans and Teller using it. Oppenheimer and Szilard: "time was against
        all of us." Wiesner: five or six inspections a likely American figure. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 104–5. Check: the days. Names: Dobrynin, McNamara, Oppenheimer, Wiesner, Teller.'
      tags:
      - name:dobrynin-anatoly
      - name:mcnamara-robert-s
      - name:oppenheimer-j-robert
      - name:wiesner-jerome-b
      - name:teller-edward
      src:
        c: 3933abd7
        rows:
        - 'w.dobrynin-in-confidence 104–5: all'
- cite:
    id: cal.1963-04-24.testing
    item: '[[w.dobrynin-in-confidence]], 105–6 ("So you want us unilaterally to open entire regions of our country to foreign
      intelligence?" "thanks to you I made a fool of myself"; concessions only to "Goldwater and other ''hawks''"; Seaborg''s
      regret, told Dobrynin later)'
    units: all
- add:
    entry:
      id: cal.1963-04.testing-2
      when: Apr.
      date: 1963-04
      thread: testing
      also:
      - soviet-union
      - testing-npt
      c: 'Early in the month Thompson, privately, to Dobrynin: an envoy to Khrushchev, Rusk, Robert Kennedy or Harriman; a
        test ban the best issue for the President''s campaign, then a meeting with Khrushchev in August or September to exchange
        ratifications. Kennedy''s message to Khrushchev of Apr. 11 takes up most of it. A few days later Rusk gives Dobrynin
        a draft four-power declaration pledging no transfer of nuclear weapons, directly or through alliances, to nations
        without them. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 105. Check: the days. Names: Thompson, Dobrynin, Rusk, Robert Kennedy, Harriman, Khrushchev,
        Kennedy.'
      tags:
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:rusk-dean
      - name:kennedy-robert-f
      - name:harriman-w-averell
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: 9b2c18c4
        rows:
        - 'w.dobrynin-in-confidence 105: all'
- add:
    entry:
      id: cal.1963-04-29.testing
      when: Apr. 29
      date: '1963-04-29'
      thread: testing
      also:
      - soviet-union
      c: 'Dobrynin passes Kennedy a message: Khrushchev is ready to receive the President''s special representative for an
        informal exchange of views. Rusk to come July 28; Harriman for the test ban talks.'
      n: '[[w.dobrynin-in-confidence]], 105–6. See [[cal.1963-04.testing-2]]. Names: Dobrynin, Kennedy, Khrushchev, Rusk,
        Harriman.'
      tags:
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:rusk-dean
      - name:harriman-w-averell
      src:
        c: 136a409f
        rows:
        - 'w.dobrynin-in-confidence 105–6: all'
- cite:
    id: cal.1963-07-15.testing
    item: '[[w.dobrynin-in-confidence]], 107–8 (Khrushchev to Harriman and Hailsham: no inspection, "even if only two or three";
      "When the cat promises that he is only going to catch mice and won''t touch the lard . . .")'
    units: all
- cite:
    id: cal.1963-08-05.testing
    item: '[[w.dobrynin-in-confidence]], 108 (signed at Moscow; Rusk present)'
    units: all
- cite:
    id: cal.1963-08-09.soviet-union
    item: '[[w.dobrynin-in-confidence]], 108 (Rusk at Pitsunda: a summit, to be duly prepared; badminton; Irina Dobrynin films
      it)'
    units: all
- add:
    entry:
      id: cal.1963-08-26.soviet-union
      when: Aug. 26
      date: '1963-08-26'
      thread: soviet-union
      also:
      - testing
      - berlin-and-vienna
      c: 'The White House, Dobrynin alone with Kennedy, their last meeting, with Khrushchev''s message. Kennedy on the Senate''s
        hearings: "What can I do with people like Teller or Senator Goldwater?" After ratification, talks on surprise attack
        and weapons in outer space. On Germany, no force to change borders, no formal declaration. More trade; cooperation
        in space, perhaps a joint flight to the moon. Cuba: the Soviet troops; Khrushchev''s visit there. Thanks for the condolences
        on Patrick. The press told of Khrushchev''s message.'
      n: '[[w.dobrynin-in-confidence]], 109–10. Names: Dobrynin, Kennedy, Khrushchev, Teller, Goldwater.'
      tags:
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:teller-edward
      - name:goldwater-barry-m
