- add:
    entry:
      id: cal.1968-01-05.soviet-union
      when: Jan. 5
      date: '1968-01-05'
      thread: soviet-union
      also:
      - europe-and-the-alliance
      c: 'Rusk to Dobrynin, a general review in private: a formal proposal that the two alliances cut their troops in Europe,
        the United States "considerably" in Western Europe if the Soviet Union does in Eastern; the troops withdrawn not to
        go to Vietnam. No answer from Moscow. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 174. Names: Rusk, Dobrynin.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      src:
        c: d720f930
        rows:
        - 'w.dobrynin-in-confidence 174: all'
- add:
    entry:
      id: cal.1968-02.soviet-union
      when: Feb.
      date: 1968-02
      thread: soviet-union
      also:
      - vietnam
      c: 'Rusk to Dobrynin: the bombing of Soviet ships at Haiphong accidents. Could Moscow get "at least a rough idea" of
        Hanoi''s intentions, so the bombing might stop? The President could not stop it "blindfolded." "Why shouldn''t Moscow
        arrange for another Tashkent, this time to settle the Vietnam conflict?" Dobrynin: for the United States and the DRV
        to settle. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 174–75. Check: the day. Names: Rusk, Dobrynin.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      src:
        c: a046fb63
        rows:
        - 'w.dobrynin-in-confidence 174–75: all'
- add:
    entry:
      id: cal.1968-04-23.elections-1968-4
      when: Apr. 23
      date: '1968-04-23'
      thread: elections-1968
      also:
      - soviet-union
      c: 'A White House reception. Humphrey to Dobrynin, privately: inclined to run, soon to announce; relations with the
        Soviet Union a major factor for war and peace; his greetings to Brezhnev and Kosygin. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 179–80. Names: Humphrey, Dobrynin, Brezhnev, Kosygin.'
      tags:
      - name:humphrey-hubert-h
      - name:dobrynin-anatoly
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      src:
        c: a16b1b8a
        rows:
        - 'w.dobrynin-in-confidence 179–80: all'
- add:
    entry:
      id: cal.1968-08.elections-1968-4
      when: Aug.
      date: 1968-08
      thread: elections-1968
      also:
      - soviet-union
      c: 'After the convention, Humphrey to Dobrynin: Johnson gives him no appreciable support. "I don''t even know who Johnson
        would prefer as the next president, Nixon or me!" By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 180–81. Check: the day. Names: Humphrey, Dobrynin, Johnson, Nixon.'
      tags:
      - name:humphrey-hubert-h
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      - name:nixon-richard-m
      src:
        c: d74024aa
        rows:
        - 'w.dobrynin-in-confidence 180–81: all'
- add:
    entry:
      id: cal.1968-09.elections-1968-19
      when: Sept.
      date: 1968-09
      thread: elections-1968
      also:
      - soviet-union
      c: 'Gromyko instructs Dobrynin, top secret, to offer Humphrey any help in the campaign, money included; Dobrynin argues
        against it. "There is a decision, you carry it out." At breakfast at Humphrey''s home Dobrynin turns the talk to the
        campaign''s finances; Humphrey: Moscow''s good wishes more than enough. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 181. Check: the month; Dobrynin: after the convention, "shortly afterward." Made public:
        [[w.dobrynin-in-confidence]] (1995). See [[cal.1968-08.elections-1968-4]]. Names: Gromyko, Dobrynin, Humphrey.'
      tags:
      - name:gromyko-andrei
      - name:dobrynin-anatoly
      - name:humphrey-hubert-h
      src:
        c: 24a892a8
        rows:
        - 'w.dobrynin-in-confidence 181: all'
- add:
    entry:
      id: cal.1968-08-15.testing-missile-talks
      when: Aug. 15
      date: '1968-08-15'
      thread: testing-missile-talks
      also:
      - soviet-union
      - soviet-union-czechoslovakia
      c: 'Rusk with Dobrynin, the evening: the level at which the missile talks begin; an announcement wanted before the conference
        of the non-nuclear states at Geneva. Dobrynin, off the record: Lê Đức Thọ takes no change of position back to Paris.
        On Czechoslovakia "the" issue the Communist Party''s exclusive position. Rusk declines to say whether there is a "New
        Nixon." By Dobrynin''s account, Rusk reminds him that Johnson still awaits a reply on a summit.'
      n: '[FRUS 1964–68, XIV, doc. 283](https://history.state.gov/historicaldocuments/frus1964-68v14/d283); [[w.dobrynin-in-confidence]],
        183 (the summit). See [[cal.1968-07-25.testing]]. Names: Rusk, Dobrynin, Lê Đức Thọ, Nixon, Johnson.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:le-duc-tho
      - name:nixon-richard-m
      - name:johnson-lyndon-b
      src:
        c: 3c6cae5b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v14/d283: A-E'
        - 'w.dobrynin-in-confidence 183: F'
- add:
    entry:
      id: cal.1968-08-20.soviet-union-czechoslovakia
      when: Aug. 20
      date: '1968-08-20'
      thread: soviet-union-czechoslovakia
      also:
      - testing-missile-talks
      c: 'Late that night, at State, Rusk reads Dobrynin Johnson''s message from notes: no knowledge of any part taken by
        non-communist countries, nor of any public request for help from Prague; "we feel we should carefully reconsider the
        possibility of announcing a meeting between our leaders." By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 186. See [[cal.1968-08-20.soviet-union]]. Names: Rusk, Dobrynin, Johnson.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      src:
        c: '33979768'
        rows:
        - 'w.dobrynin-in-confidence 186: all'
- add:
    entry:
      id: cal.1968-08-28.soviet-union-czechoslovakia
      when: Aug. 28
      date: '1968-08-28'
      thread: soviet-union-czechoslovakia
      also:
      - berlin-and-vienna
      c: 'Rusk summons Dobrynin: Soviet troops unusually active along Romania''s borders. Johnson, from the ranch, by Rusk:
        "On behalf of mankind, we ask you not to invade Romania"; no action against West Berlin. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 187–88. Check: Moscow''s answer, given Rusk soon after, undated: the reports "specially
        designed by certain circles" to mislead (188). See [[cal.1968-08-23.soviet-union-czechoslovakia-2]]. Names: Rusk,
        Dobrynin, Johnson.'
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
      - name:johnson-lyndon-b
      src:
        c: 570356e1
        rows:
        - 'w.dobrynin-in-confidence 187–88: all'
- add:
    entry:
      id: cal.1968-09-13.testing-missile-talks
      when: Sept. 13
      date: '1968-09-13'
      thread: testing-missile-talks
      also:
      - soviet-union
      c: 'Dobrynin to Rostow, orally, just before 1 p.m., Moscow''s message: still "positive" to a meeting with the President;
        no objection to the questions "named by the American side," the strategic arms, Vietnam and the Middle East; principles
        for limiting offensive and defensive strategic weapons as a directive to the delegations. Rostow: the Middle East
        and Vietnam raised by Dobrynin, not by him; Czechoslovakia not mentioned. By Dobrynin''s account, Johnson telephones
        and thanks him.'
      n: '[FRUS 1964–68, XIV, doc. 296](https://history.state.gov/historicaldocuments/frus1964-68v14/d296); [[w.dobrynin-in-confidence]],
        190 (the call). See [[cal.1968-09-09.soviet-union]]. Names: Dobrynin, Rostow, Johnson.'
      tags:
      - name:dobrynin-anatoly
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: d4f34271
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v14/d296: A-E'
        - 'w.dobrynin-in-confidence 190: A-B, F'
- add:
    entry:
      id: cal.1968-09-16.soviet-union
      when: Sept. 16
      date: '1968-09-16'
      thread: soviet-union
      also:
      - soviet-union-czechoslovakia
      c: Gromyko submits to the Politburo "An Assessment of the Course of Foreign Policy and the State of Soviet-American
        Relations"; approved. A confederation of the socialist countries of Europe to match the Common Market and NATO; "firmness
        with flexibility" toward the United States, whose leaders, by the action in Czechoslovakia, are made to "consider
        more soberly their potential in the region."
      n: '[[w.dobrynin-in-confidence]], 188–89 (quoting it). Made public: [[w.dobrynin-in-confidence]] (1995). See [[cal.1967-01-13.soviet-union]].
        Names: Gromyko.'
      tags:
      - name:gromyko-andrei
      src:
        c: 4c3394ee
        rows:
        - 'w.dobrynin-in-confidence 188–89: all'
- add:
    entry:
      id: cal.1968-10-31.vietnam-paris-2
      when: Oct. 31
      date: '1968-10-31'
      thread: vietnam-paris
      also:
      - soviet-union
      - laos
      c: 'Johnson to Kosygin, given Dobrynin by Rusk at 10 p.m.: a total cessation of the bombing of the North from early
        Nov. 1; "I hope and expect the full weight of the Soviet Union will be thrown into the balance to bring very quickly
        a firm, stable peace to Southeast Asia"; the Soviet Union, Co-Chairman of the Geneva Conference of 1962, for peace
        in Laos too.'
      n: '[FRUS 1964–68, VII, doc. 164](https://history.state.gov/historicaldocuments/frus1964-68v07/d164); [[w.dobrynin-in-confidence]],
        190–91 (Rusk''s call; the message in other words). Names: Johnson, Kosygin, Dobrynin, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
      - name:dobrynin-anatoly
      - name:rusk-dean
      src:
        c: b4fe5c42
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d164: all'
        - 'w.dobrynin-in-confidence 190–91: A-B'
- add:
    entry:
      id: cal.1968-11-01.vietnam-paris-2
      when: Nov. 1
      date: '1968-11-01'
      thread: vietnam-paris
      also:
      - soviet-union
      c: 'Dobrynin brings Rusk his own translation of Kosygin''s letter to Johnson: received "with satisfaction," the news
        of the bombing''s end and of talks with the DRV, the NFLSV, the United States and Saigon; "a great deed has been done."
        Rusk on its phrase "bombings and other military actions": the DMZ, no attacks on the cities.'
      n: '[FRUS 1964–68, VII, doc. 177](https://history.state.gov/historicaldocuments/frus1964-68v07/d177); [[w.dobrynin-in-confidence]],
        191 (Kosygin''s satisfaction). See [[cal.1968-10-31.vietnam-paris-2]]. Names: Dobrynin, Rusk, Kosygin, Johnson.'
      tags:
      - name:dobrynin-anatoly
      - name:rusk-dean
      - name:kosygin-aleksei
      - name:johnson-lyndon-b
      src:
        c: 9ad5e1b2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v07/d177: all'
        - 'w.dobrynin-in-confidence 191: A'
- add:
    entry:
      id: cal.1968-11-24.transition-and-staff
      when: Nov. 24
      date: '1968-11-24'
      thread: transition-and-staff
      also:
      - soviet-union
      c: 'Ellsworth at a private dinner with Dobrynin: authorized by Nixon to keep informal contacts with the Soviet ambassador,
        a confidential channel "just in case" before the inauguration. Would Dobrynin, going to Moscow, sound out the leaders
        on Vietnam, the Middle East, disarmament and Czechoslovakia? By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 191. See [[cal.1968-12-18.testing-missile-talks]]. Names: Ellsworth, Nixon, Dobrynin.'
      tags:
      - name:ellsworth-robert
      - name:nixon-richard-m
      - name:dobrynin-anatoly
      src:
        c: 372810d2
        rows:
        - 'w.dobrynin-in-confidence 191: all'
