patch: b3-dobrynin-2
by: Claude (batch 3 reading, group soviet), Nov. 3-4, 2026
ops:
- cite:
    id: cal.1960-05-05.soviet-union-u2
    item: '[[w.dobrynin-in-confidence]], 40 (Malik''s slip at a reception; Thompson''s cable)'
    units: B-C
- check:
    id: cal.1960-05-05.soviet-union-u2
    text: 'Check: Dobrynin has Thompson''s cable reach Washington "minutes too late" to amend its version, and Khrushchev,
      enraged, remove Malik from his post and from the party, then pardon him at Gromyko''s plea after three weeks (40–41).'
- cite:
    id: cal.1960-05-12.soviet-union-u2
    item: '[[w.dobrynin-in-confidence]], 42–43 (directives on every item, approved by the Politburo; leave to criticize the
      flight strongly, none to demand an apology; Khrushchev''s promise "to teach the Americans, who had gone beyond all limits,
      a good lesson"; by Dobrynin''s account, who was there)'
    units: A-B
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.dobrynin-in-confidence]], 41 (May 16: Khrushchev first; the flights "would not be renewed"; by Dobrynin''s
      account, the delegation''s counselor)'
    units: D-E
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.dobrynin-in-confidence]], 42–43 (May 17: the Soviets absent, not told whether the meeting was the opening;
      Hagerty: the conference closed; the Soviet statement in reply)'
    units: F-G
- cite:
    id: cal.1960-05-16.soviet-union-u2-2
    item: '[[w.dobrynin-in-confidence]], 42 (Macmillan and de Gaulle in private talks with Khrushchev: two of the three demands
      met; "Can a head of state censure himself and his nation?" Khrushchev: "We want him to condemn the guilty")'
    units: A
- add:
    entry:
      id: cal.1960-05-16.soviet-union-u2-3
      when: May 16
      date: '1960-05-16'
      thread: soviet-union-u2
      c: 'Paris, evening. Khrushchev with the Soviet delegation, by Dobrynin''s account: if not Eisenhower, his close associates
        meant to humiliate him; Stalin''s words, "the arrogant Americans would wring your necks, like chickens." Malinovsky
        for the unyielding line; Gromyko: "Eisenhower has to be taught a good lesson," but fearing the summit''s collapse,
        looking for a way out.'
      n: '[[w.dobrynin-in-confidence]], 42. See [[cal.1960-05-15.soviet-union]]. Names: Khrushchev, Eisenhower, Malinovsky,
        Gromyko.'
      tags:
      - name:khrushchev-nikita-s
      - name:eisenhower-dwight-d
      - name:malinovsky-rodion-yakovlevich
      - name:gromyko-andrei
      - name:dobrynin-anatoly
      src:
        c: aa6201c7
        rows:
        - 'w.dobrynin-in-confidence 42: all'
- cite:
    id: cal.1961-01-20.soviet-union
    item: '[[w.dobrynin-in-confidence]], 43–44 (the message of greetings on the inauguration: a "radical improvement of relations")'
    units: A
- check:
    id: cal.1961-01-25.press-and-broadcasting
    text: 'Check: Dobrynin has Washington''s official note of Jan. 24 confirming the President''s order that American planes
      not enter Soviet airspace (44).'
- cite:
    id: cal.1961-03-09.soviet-union
    item: '[[w.dobrynin-in-confidence]], 44 (Thompson hands Khrushchev the confidential message proposing a summit, Mar. 9;
      by Dobrynin''s account)'
    units: A
- cite:
    id: cal.1961-05-26.soviet-union
    item: '[[w.dobrynin-in-confidence]], 44–46 ("approximately ten days before" Vienna, Dobrynin there as the delegation''s
      counselor: the pressure on a young president; Mikoyan alone in doubt, "for a cautious approach"; no thought of war)'
    units: A, C-D
- cite:
    id: cal.1961-06-03.berlin-and-vienna
    item: '[[w.dobrynin-in-confidence]], 45–47 ("the most tense"; a treaty with East Germany "not later than in December";
      three inspections a year; by Dobrynin''s account)'
    units: A-B
- check:
    id: cal.1961-06-03.berlin-and-vienna
    text: 'Check: Dobrynin dates the summit July 3–4 (44–45).'
- cite:
    id: cal.1961-06-04.press-and-broadcasting
    item: '[[w.dobrynin-in-confidence]], 46 (Kennedy with Reston right after the meeting; Reston''s article: a prolonged crisis
      inevitable over Germany)'
    units: A
