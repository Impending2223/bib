        rows:
        - 'w.dobrynin-in-confidence 109–10: all'
- add:
    entry:
      id: cal.1963-11-15.soviet-union
      when: Nov. 15
      date: '1963-11-15'
      thread: soviet-union
      also:
      - robert-kennedy
      c: 'Robert Kennedy, in confidence, the President knowing: relations depend on good personal relations between his brother
        and Khrushchev; another meeting, to "calmly sit and talk everything over" for two or three days; an exchange of visits,
        the President first to the Soviet Union, perhaps early next year. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 110–11. Names: Robert Kennedy, Dobrynin, Khrushchev, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      src:
        c: 7737a363
        rows:
        - 'w.dobrynin-in-confidence 110–11: all'
- add:
    entry:
      id: cal.1963-11-22.soviet-union
      when: Nov. 22
      date: '1963-11-22'
      thread: soviet-union
      also:
      - assassination
      c: 'Dobrynin, called from his dentist''s chair, cables Moscow: "It has just been announced on the radio that President
        Kennedy has died of wounds inflicted as a result of an attempt on his life in the state of Texas." The embassy''s
        chief of intelligence: no links with Oswald. The consular correspondence with the Oswalds, their application of March
        to return refused, to be given the Americans; Moscow approves, Rusk receives copies for the Warren Commission. By
        Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 111–13. See [[cal.1963-11-22.assassination]]. Names: Dobrynin, Kennedy, Oswald, Rusk.'
      tags:
      - name:dobrynin-anatoly
      - name:kennedy-john-f
      - name:oswald-lee-harvey
      - name:rusk-dean
      src:
        c: 6bba0fed
        rows:
        - 'w.dobrynin-in-confidence 111–13: all'
- add:
    entry:
      id: cal.1963-11-24.succession
      when: Nov. 23–24
      date: '1963-11-24'
      thread: succession
      also:
      - soviet-union
      c: 'Thompson, depressed, to Dobrynin, Nov. 23: the President''s death a grave blow to the confidential connection; Mikoyan
        not to stay on after the funeral. Nov. 24: Johnson knows most of the correspondence, not the understanding on the
        missiles in Turkey; Rusk to be to him as Dulles to Eisenhower; Johnson set on running in 1964 and has spoken of Robert
        Kennedy for Vice President; Rusk told to carry on Kennedy''s lines. By Dobrynin''s account.'
      n: '[[w.dobrynin-in-confidence]], 113. Names: Thompson, Dobrynin, Mikoyan, Johnson, Rusk, Robert Kennedy.'
      tags:
      - name:thompson-llewellyn-e
      - name:dobrynin-anatoly
      - name:mikoyan-anastas
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:kennedy-robert-f
      src:
        c: 9785d954
        rows:
        - 'w.dobrynin-in-confidence 113: all'
- cite:
    id: cal.1963-11-25.assassination
    item: '[[w.dobrynin-in-confidence]], 114 (Mikoyan on foot in the front ranks)'
