        - 'via x.1983-10-27.int-harry-wachtel-oct-27-1983: B'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-12.king-2
      when: Dec.
      date: 1964-12
      thread: king
      also:
      - voting-rights-selma
      c: 'After Oslo, by the FBI''s taps on King''s home: King depressed. Abernathy refuses to go to Selma, seeing no need
        for a new movement there, and tells the SCLC staff not to disturb his many relatives in the Alabama counties near
        it.'
      n: '[[w.branch-pillar-of-fire]], 550. To check: Int. Andrew Young, Oct. 26, 1991; [[w.garrow-bearing-the-cross]], 366
        (both cited by [[w.branch-pillar-of-fire]], 550). Check: the day. Names: King, Abernathy.'
