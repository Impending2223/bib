- add:
    entry:
      id: cal.1964-09-12.africa
      when: Sept. 12
      date: '1964-09-12'
      thread: africa
      also:
      - civil-rights-organizations
      c: Conakry, Villa Silla, the SNCC delegation's first day. Invitations to a dinner at the presidential palace; Sékou
        Touré calls unannounced beforehand, Moses, Forman and Julie Belafonte talking with him in French; Hamer, called from
        her bath, receives his kiss on each cheek. Banquets through September; all but two home early on alarms of a rupture
        within SNCC.
      n: '[[w.branch-pillar-of-fire]], 481–82. To check: [[w.mills-this-little-light-of]], 134–36; Int. Harry Belafonte, Mar.
        6–7, 1985; [[w.forman-making-of-black-revolutionaries]], 409, 411 (all cited by [[w.branch-pillar-of-fire]], 481–82).
        Check: the day. See [[cal.1964-09-11.africa]]. Names: Touré, Moses, Forman, Hamer.'
      src:
        c: ec8016de
        rows:
        - 'w.branch-pillar-of-fire 481–82: all'
      tags:
      - name:toure-ahmed-sekou
      - name:moses-robert-p
