      when: Feb. 22
      date: '1965-02-22'
      thread: press-and-broadcasting
      c: 'Johnson dictates aboard the White House helicopter a candid draft answer to the Christian Science Monitor''s questions
        about his spiritual life: "Now I pray several times a day, but I don''t seem to get any answer."'
      n: '[[w.branch-pillar-of-fire]], 596. To check: Marie Fehmer to Busby, with Johnson''s dictation and the Monitor''s
