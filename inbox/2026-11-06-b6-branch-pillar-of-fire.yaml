      id: cal.1960-06-02.civil-rights-the-executive
      when: June 2
      date: '1960-06-02'
      thread: civil-rights-the-executive
      c: 'DeLoach to Mohr, on Archibald Carey of Chicago, judge, alderman and AME pastor, whom the FBI had cultivated since
        1957: "the Director was considerably embarrassed over the failure of our photographer in Chicago to take pictures
        of the Director and Dr. Carey''s sister." Carey has pressed the Bureau on its lack of Negro agents.'
      n: '[[w.branch-pillar-of-fire]], 533–34. To check: DeLoach to Mohr, June 2, 1960, FAC-82 (cited by [[w.branch-pillar-of-fire]],
        534). Made public: [[w.branch-pillar-of-fire]] (1998). Names: DeLoach.'
      src:
        c: 7bd19edb
        rows:
        - 'w.branch-pillar-of-fire 533–34: all'
        - 'via x.1960-06-02.deloach-to-mohr-june-2-1960-fac: all'
      tags:
      - name:deloach-cartha
