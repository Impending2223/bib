      when: Aug. 22
      date: '1964-08-22'
      thread: elections-1964-freedom-democrats
      c: Atlantic City, the Gem Motel, after her testimony. Hamer, told that Johnson had cut into her airtime, denounces a
        plot, until voices call out that television is showing film of the end of her testimony.
