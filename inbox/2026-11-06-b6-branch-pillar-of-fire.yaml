      date: '1964-09-08'
      thread: black-nationalism
      c: 'Chicago, the FBI''s taps: Elijah Muhammad, Malcolm stays in Africa because he "does not have a hundred people in
        all the United States"; the Arabs "laughing at him and not committing themselves."'
      n: '[[w.branch-pillar-of-fire]], 501. To check: SAC, Chicago, to Director, Sept. 8, 1964, FMX-NR (cited by [[w.branch-pillar-of-fire]],
        501). Check: the day of the remarks; the report''s date. Names: Elijah Muhammad, Malcolm X.'
