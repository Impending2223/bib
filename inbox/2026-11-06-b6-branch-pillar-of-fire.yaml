      id: cal.1965-02-11.voting-rights-selma-2
      when: Feb. 11
      date: '1965-02-11'
      thread: voting-rights-selma
      c: Wilson Baker, who had smuggled SNCC workers past the creek barrier to bring back injured students ("I'm human, too"),
        threatens to arrest Sheriff Clark himself if he loses his temper again; and warns he will kill any students who disturb
        Mrs. Baker by picketing near his home.
      n: '[[w.branch-pillar-of-fire]], 588. To check: remarks of Charles Quinn at the University of Mississippi''s symposium
        "Covering the South," Apr. 3–5, 1987; Int. Sheriff Robert "Cotton" Nichols, May 28, 1990 (both cited by [[w.branch-pillar-of-fire]],
        588). Check: the day. Names: Baker, Clark.'
