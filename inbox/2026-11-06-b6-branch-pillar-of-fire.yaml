      id: cal.1965-01-09.voting-rights-selma
      when: Jan. 9
      date: '1965-01-09'
      thread: voting-rights-selma
      c: 'Frank Soracco, of SNCC in Selma, to his parents: "Things are starting to move here organization wise. It has been
        calm because the city wants it that way.... Two guys tear gassed our house. No one was home. They got 6 mos.—unheard
        of 6 mos. ago."'
      n: '[[w.branch-pillar-of-fire]], 559. To check: Soracco to "Dad and Ann," Jan. 9, 1965 (cited by [[w.branch-pillar-of-fire]],
        559).'
      src:
        c: 8e6fcaea
        rows:
        - 'w.branch-pillar-of-fire 559: all'
        - 'via x.1965-01-09.soracco-to-dad-and-ann-jan-9: all'
