      id: cal.1964-07-20.civil-rights-organizations
      when: July 20
      date: '1964-07-20'
      thread: civil-rights-organizations
      c: 'Andrew Young to Septima Clark, by letter, answering her reminders that he has neglected the citizenship classes:
        "There were many days when I thought I might be on the verge of cracking up. I know I had too much on me, but there
        seemed to be no way of getting around it." His new chart for SCLC: thirty-five boxes.'
      n: '[[w.branch-pillar-of-fire]], 407. To check: Young to Clark, July 20, 1964; Clark to Young, July 12, 1964, A/SC154f4
        (both cited by [[w.branch-pillar-of-fire]], 407). Names: Young.'
      src:
        c: dfe2bed1
        rows:
        - 'w.branch-pillar-of-fire 407: all'
        - 'via x.1964-07-20.young-to-clark-july-20-1964: A'
        - 'via x.1964-07-12.clark-to-young-july-12-1964: A'
      tags:
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1964-07-21.king-2
      when: July 21
      date: '1964-07-21'
      thread: king
      also:
      - elections-1964-goldwater
      c: 'On the flight from Atlanta to Jackson, a young passenger to King: "I happen to be a Christian"; King''s methods
        "causing more harm than good," the new civil rights law a step "toward federal dictatorship"; he leans to Goldwater.
        King to Bernard Lee: "These are the people who are rallying to Goldwater."'
      n: '[[w.branch-pillar-of-fire]], 410. To check: [[w.trillin-letter-from-jackson]] (cited by [[w.branch-pillar-of-fire]],
        410). Names: King, Goldwater.'
      src:
        c: 3fa21f7a
        rows:
        - 'w.branch-pillar-of-fire 410: all'
      tags:
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-07-31.black-nationalism
      when: July 31
      date: '1964-07-31'
      thread: black-nationalism
      c: 'Malcolm X, by telephone from Cairo, on the FBI''s tap: "Has there been anything in the papers about me being in
        Cairo?" "Have things cooled down yet?" The answer: they have simmered down; King meeting the mayor, the leaders angry
        at him.'
      n: '[[w.branch-pillar-of-fire]], 420. To check: wiretap transcript of July 31, 1964, FMXNY-sub1-59a (cited by [[w.branch-pillar-of-fire]],
        420). Names: Malcolm X, King.'
      src:
        c: c8cd2927
        rows:
        - 'w.branch-pillar-of-fire 420: all'
        - 'via x.1964-07-31.wiretap-transcript-of-july-31-1964-fmxny: all'
      tags:
      - name:malcolm-x
