      when: Feb. 17
      date: '1965-02-17'
      thread: king
      c: 'King ill with fever. By the FBI''s tap, Abernathy borrows $500 from Wachtel, through Rustin: King sick and "completely
        broke."'
      n: '[[w.branch-pillar-of-fire]], 592 & n. To check: New York LHM dated Feb. 18, 1965, FK-NR (cited by [[w.branch-pillar-of-fire]],
