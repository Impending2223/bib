- add:
    entry:
      id: cal.1964-11-03.elections-1964-johnson
      when: Nov. 3–4
      date: '1964-11-03'
      thread: elections-1964-johnson
      c: 'Austin, election night, with Mrs. Johnson and half a dozen friends. Johnson at the first returns: "God, I hate for
        it to be over, because the hell starts then." Before dawn, the helicopters grounded by storm winds and the roads closed
        by the Pedernales''s floods, the short jet flight to the Ranch.'
      n: '[[w.branch-pillar-of-fire]], 522. To check: [President''s Daily Diary, Nov. 3, 1964](https://catalog.archives.gov/id/192447),
        2; [President''s Daily Diary, Nov. 4, 1964](https://catalog.archives.gov/id/192448), 3 (LBJ Library; National Archives
        Catalog; cited by [[w.branch-pillar-of-fire]], 522). See [[cal.1964-11-03.elections-1964]]. Names: Johnson, Lady Bird
        Johnson.'
      src:
        c: fbc53bf6
        rows:
        - 'w.branch-pillar-of-fire 522: all'
        - 'via x.1964-11-03.presidents-daily-diary-nov-3-1964-p: A-B'
        - 'via x.1964-11-04.presidents-daily-diary-nov-4-1964-p: C'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-18.black-nationalism
      when: Nov. 18
      date: '1964-11-18'
      thread: black-nationalism
      c: 'Chicago, by the FBI: Elijah Muhammad rages privately against Malcolm''s potential to join his renegade son Wallace,
        backed by new Saudi money. He has Captain Joseph warn at a press conference that Malcolm "stands alone...and we shall
        see how successful he will be."'
      n: '[[w.branch-pillar-of-fire]], 539. To check: Chicago LHM dated Nov. 18, 1964, FMX-181 (cited by [[w.branch-pillar-of-fire]],
        539). Check: the day; the report''s date. Names: Elijah Muhammad, Malcolm X.'
      src:
        c: 895d5c2c
        rows:
        - 'w.branch-pillar-of-fire 539: all'
        - 'via x.1964-11-18.chicago-lhm-dated-nov-18-1964-fmx: A'
      tags:
      - name:muhammad-elijah
      - name:malcolm-x
- add:
