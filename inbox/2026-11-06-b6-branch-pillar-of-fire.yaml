      id: cal.1964-11-24.civil-rights-organizations
      when: Nov. 24
      date: '1964-11-24'
      thread: civil-rights-organizations
      c: 'By the FBI''s taps: Rustin has Muste send out an appeal for his expenses abroad on the Nobel trip. Levison to Clarence
        Jones: Rustin taking advantage of Muste as well as King. Levison sends a small donation all the same; his answer will
        "loom large" with Rustin.'
      n: '[[w.branch-pillar-of-fire]], 525. To check: New York LHM dated Nov. 24, 1964, FK-NR (cited by [[w.branch-pillar-of-fire]],
        525). Check: the day of the call; the report''s date. Names: Rustin, Muste, Levison, King.'
      src:
        c: 73441fe7
        rows:
        - 'w.branch-pillar-of-fire 525: all'
        - 'via x.1964-11-24.new-york-lhm-dated-nov-24-1964: all'
      tags:
