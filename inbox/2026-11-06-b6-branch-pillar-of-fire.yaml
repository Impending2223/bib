- add:
    entry:
      id: cal.1965-01-02.king
      when: Jan. 2
      date: '1965-01-02'
      thread: king
      also:
      - civil-rights-organizations
      c: 'The Saturday morning drive from Atlanta to Selma. King to Abernathy: Johnson has worried aloud about dying in office
        before Humphrey becomes Vice President, the presidency falling to McCormack and then Hayden. "If he had sense enough
        to do it, I should have sense enough to do it": King wants formal arrangements for Abernathy to succeed him as SCLC''s
        president. Abernathy scoffs, then promises to accept.'
      n: '[[w.branch-pillar-of-fire]], 552. To check: Int. Ralph Abernathy, Nov. 19, 1984; [[w.garrow-bearing-the-cross]],
        372 (both cited by [[w.branch-pillar-of-fire]], 552). See [[cal.1965-01-02.voting-rights]]. Names: King, Abernathy,
        Johnson, Humphrey, McCormack, Hayden.'
      src:
        c: 88bcc499
        rows:
        - 'w.branch-pillar-of-fire 552: all'
        - 'via x.1984-11-19.int-ralph-abernathy-nov-19-1984: all'
      tags:
