      - name:levison-stanley-d
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1964-12-10.king-3
      when: Dec. 10
      date: '1964-12-10'
      thread: king
      c: Oslo, outside the Grand Hotel, before the ceremony. Ralph and Juanita Abernathy demand to ride with the Kings in
        the first car, against the Norwegian protocol chief's list; Abernathy appeals to King, who stands frozen, then tries
        to push past the security officers, until led to his assigned car. Young and Bernard Lee, refusing to ride with them,
        walk.
      n: '[[w.branch-pillar-of-fire]], 541; 543 (Young: "Ralph''s estrangement," the jealousy behind King''s gloom on the
        trip). To check: Int. Bernard Lee, June 19, 1985; Int. Andrew Young, Oct. 26, 1991; Int. Dora McDonald, Dec. 31, 1990
        (cited by [[w.branch-pillar-of-fire]], 541); [[w.young-easy-burden]], 320 (cited by [[w.branch-pillar-of-fire]], 543).
        See [[cal.1964-12-10.voting-rights]]. Names: Abernathy, King, Young.'
      src:
        c: a3bf5154
        rows:
        - 'w.branch-pillar-of-fire 541: all'
        - 'via x.1985-06-19.int-bernard-lee-june-19-1985: all'
        - 'via x.1991-10-26.int-andrew-young-oct-26-1991-2: all'
        - 'via x.1990-12-31.int-dora-mcdonald-dec-31-1990: all'
      tags:
      - name:abernathy-ralph-david
      - name:king-martin-luther-jr
      - name:young-andrew-j-jr
- add:
    entry:
      id: cal.1964-12-10.king-4
      when: Dec. 10
      date: '1964-12-10'
      thread: king
      c: Oslo, the night of the prize, a case of champagne in toasts. King confides to Eskridge a gnawing worry that his agents
        in Birmingham still hold some $240,000 in SCLC-guaranteed cash bonds from the children's arrests of 1963; complains
        to Wachtel of the large phone bills run up from Oslo on SCLC's account, but will absorb them quietly.
      n: '[[w.branch-pillar-of-fire]], 542 & n. To check: Int. Harry Wachtel, Oct. 27, 1983; Eskridge to Greenberg, Dec. 28,
        1964, A/SC9f37 (both cited by [[w.branch-pillar-of-fire]], 542). See [[cal.1964-12-10.voting-rights]]. Names: King,
        Wachtel.'
      src:
        c: 8216b9dc
        rows:
