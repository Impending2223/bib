      when: Aug. 24
      date: '1964-08-24'
      thread: elections-1964-freedom-democrats
      c: 'Atlantic City, a hotel lobby. Told by Bill Minor of the New Orleans Times-Picayune that E. W. Steptoe sends regards
        from the MFDP delegation, a regular from Amite County: Steptoe alive only because "he owes me $400 and I wouldn''t
        let anybody kill him."'
      n: '[[w.branch-pillar-of-fire]], 466. To check: comments of Bill Minor at a symposium (cited by [[w.branch-pillar-of-fire]],
