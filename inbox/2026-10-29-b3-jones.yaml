      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      c: 'Stevenson to Rusk and Dulles, 6 p.m.: "greatly disturbed" that Saturday''s raids came in part from outside Cuba. Barnes had led him to expect nothing that would embarrass him in the debate; his answers to Roa concocted on the assumption of defectors. "There is gravest risk of another U-2 disaster."'
      n: '[FRUS 1961–63, X, doc. 105](https://history.state.gov/historicaldocuments/frus1961-63v10/d105). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 81–82. See [[cal.1961-04-15.cuba-2]]. Names: Stevenson, Rusk, Dulles, Barnes, Roa.'
