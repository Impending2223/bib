      when: Apr. 13
      date: '1961-04-13'
      thread: cuba-bay-of-pigs
      c: 'Lemnitzer to Dennison, 6:30 p.m., JCS 468-61: the operation, once begun, now cancelable until the landing, and aborted if American forces intervene. Premature intervention to be avoided: Castro''s ships or aircraft engaged only when a friendly ship''s destruction is imminent; an initial strafing or bomb run acceptable.'
      n: '[FRUS 1961–63, X, doc. 96](https://history.state.gov/historicaldocuments/frus1961-63v10/d96). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 69. See [[cal.1961-04-07.cuba-3]]. Names: Lemnitzer, Dennison, Castro.'
