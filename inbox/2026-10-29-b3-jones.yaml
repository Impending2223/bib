      when: Jan. 18
      date: '1961-01-18'
      thread: cuba-bay-of-pigs
      c: 'Barnes to Esterline, on a talk with Gray of the Joint Staff. Gray''s scale of steps: from pressure to open American intervention, through an uprising, a small invasion, guerrillas, a volunteer army; the planning to run to the last step, overt military action. His fear: a landing decided on before the American support is decided and ready. By Barnes, Gray thinks 750 men too few against the militia.'
      n: '[FRUS 1961–63, X, doc. 21](https://history.state.gov/historicaldocuments/frus1961-63v10/d21). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 43 (Gray on the 750). See [[cal.1961-01-16.cuba]]. Names: Barnes, Esterline, David Gray.'
