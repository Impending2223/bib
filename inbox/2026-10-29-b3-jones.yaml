    entry:
      id: cal.1961-04-13.cuba-4
      when: Apr. 13
      date: '1961-04-13'
      thread: cuba-bay-of-pigs
      c: 'Wheeler to Dennison, 7:55 p.m., JCS 469-61: if the operation is aborted, the force to Camp Garcia on Vieques, equipment and rations for 1,500 airlifted from Apr. 14, Marines to seal the compound if need be; if it goes ahead, some 175 men with 25 American instructors to train there.'
      n: '[FRUS 1961–63, X, doc. 97](https://history.state.gov/historicaldocuments/frus1961-63v10/d97). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 70. See [[cal.1961-04-07.cuba-3]]. Names: Wheeler, Dennison.'
