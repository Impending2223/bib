- add:
    entry:
      id: cal.1961-04-09.cuba-bay-of-pigs
      when: Apr. 9
      date: '1961-04-09'
      thread: cuba-bay-of-pigs
      c: 'Sunday, Bissell''s house, by Esterline''s and Hawkins''s accounts of 1996. They would resign: with the strike cut to sixteen B-26s and the landing moved to Zapata, the invasion should be called off. Bissell: too late; he will take the air strikes to the President (Hawkins), or no more cuts (Esterline). They stay.'
      n: '[[w.jones-bay-of-pigs]], 77–78. To check: Esterline and Hawkins, interview by Kornbluh, Oct. 10, 1996, in [[w.bay-of-pigs-declassified]], 263–64; [[w.bohning-castro-obsession]], 31–34, and Hawkins to Bohning, Aug. 27, 2001 (cited by [[w.jones-bay-of-pigs]], 77 nn.6–8). See [[cal.1960-03-17.cuba]]. Names: Bissell, Esterline, Hawkins. Check: by Jones, Bissell''s memoir does not mention the meeting (78).'
      tags:
      - name:bissell-richard-m-jr
      - name:esterline-j-d
      - name:hawkins-jack
