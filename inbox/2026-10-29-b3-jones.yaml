      id: cal.1961-04-22.cuba-2
      when: Apr. 22
      date: '1961-04-22'
      thread: cuba
      c: The 478th NSC, 10 a.m. to noon, some thirty-five present. By Bowles's notes, Robert Kennedy "slamming into anyone" for going slowly; proposals to harass Castro. American help to guerrillas only by moral obligation, or for survival or evacuation; open enlistment of Cubans to be studied; a Caribbean security agency; NSAMs 42 to 47. Stahr proposes a "Freedom Brigade" of Cuban volunteers in the Army.
      n: 'FRUS 1961–63, X, docs. [166](https://history.state.gov/historicaldocuments/frus1961-63v10/d166) (Bowles''s notes); [167](https://history.state.gov/historicaldocuments/frus1961-63v10/d167) (the record of actions, with Stahr''s proposal in its note). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 135. See [[cal.1961-04-15.cuba]]. Names: Bowles, Robert Kennedy, Castro, Stahr.'
