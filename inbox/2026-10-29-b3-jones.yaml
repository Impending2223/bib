      date: 1960-09
      thread: cuba
      c: 'The latter part of September, by Bissell''s testimony: Bissell and Edwards brief Dulles and Cabell on the plan with the gambling syndicate, Edwards "in somewhat circumlocutious terms." By the Inspector General''s report, Dulles "merely nodded, presumably in understanding and approval."'
