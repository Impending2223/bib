    section: '196104'
- add:
    entry:
      id: cal.1961-04-20.cuba-2
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba
      c: 'The Cabinet, 11 a.m. to noon, by Bowles''s notes: "about as grim as any meeting"; Kennedy "quite shattered." Goldberg: not to be undertaken without readiness to send troops. Robert Kennedy and Bell the angriest. Then the Oval Office, half an hour, with Johnson, McNamara and Robert Kennedy, who turns on Bowles; "an almost frantic reaction for an action program."'
      n: '[FRUS 1961–63, X, doc. 158](https://history.state.gov/historicaldocuments/frus1961-63v10/d158) (Bowles''s notes, written in May; the appointment book). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 133–34. See [[cal.1961-04-15.cuba]]. Names: Bowles, Kennedy, Goldberg, Robert Kennedy, Bell, Johnson, McNamara.'
