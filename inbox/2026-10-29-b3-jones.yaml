      c: 'The White House, the afternoon. Eisenhower with Gates, Douglas, Dulles, Gray, Willauer, Mann, King, Goodpaster and Merchant on the *Times* story: no statement, and no comment. Dulles to brief the Foreign Relations Committee the next day, no record kept. White, at the State Department, denies knowing of any base.'
