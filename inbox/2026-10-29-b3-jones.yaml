      c: 'The CIA''s paper for the NSC on the Soviet bloc''s military aid to Castro: $50 to $100 million in arms since September, land armaments nearly all, tanks, assault guns, artillery; no MIGs operational; Cuban pilots training in the bloc.'
      n: '[FRUS 1961–63, X, doc. 181](https://history.state.gov/historicaldocuments/frus1961-63v10/d181). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 149. See [[cal.1961-04-15.cuba]]. Names: Castro. Check: Jones has $100 million (149); the paper, $50 to $100 million.'
