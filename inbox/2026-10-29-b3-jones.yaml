        - 'via w.jones-bay-of-pigs 116 n.9b: D'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-18.cuba-6
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'Gray, for the Chiefs, on Burke''s telephoned word from the White House, to Dennison and Clark. 1:37 p.m.: unmarked Navy aircraft to reconnoiter the beach. 2:49 p.m.: unmarked Navy planes readied for possible combat, unmarked boats for evacuation; "We are operating almost entirely in the dark"; no intention of intervening with American forces.'
      n: 'FRUS 1961–63, X, docs. [122](https://history.state.gov/historicaldocuments/frus1961-63v10/d122); [123](https://history.state.gov/historicaldocuments/frus1961-63v10/d123). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 117. See [[cal.1961-04-18.cuba-4]]. Names: David Gray, Burke, Dennison.'
