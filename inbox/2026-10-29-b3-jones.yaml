      when: Apr. 1
      date: '1961-04-01'
      thread: cuba-bay-of-pigs
      c: 'The Joint Chiefs to Dennison, SM-363-61: his rules of engagement approved. A submerged submarine shadowing the convoy that will not identify itself to be attacked "with all authorized means available." The plan named "Bumpy Road."'
      n: '[FRUS 1961–63, X, doc. 76](https://history.state.gov/historicaldocuments/frus1961-63v10/d76). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 69–70. See [[cal.1961-03-28.cuba-2]]. Names: Dennison.'
