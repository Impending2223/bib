- add:
    entry:
      id: cal.1961-01-25.cuba-3
      when: Jan. 25–26
      date: '1961-01-25'
      thread: cuba
      also:
      - intelligence
      c: 'Harvey, told by Bissell to set up an "executive action" capability, means of removing foreign leaders, assassination among them, takes it up with CIA colleagues. His notes: "magic button," "last resort beyond last resort," "never mention word assassination." By Harvey, Bissell spoke of the White House''s urging; Bissell recalled none, and spoke of it with Bundy.'
      n: '[S. Rep. No. 94-465, 181–84 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=192). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.jones-bay-of-pigs]], 47–49. See [[cal.1960-09.cuba]]. Names: Harvey, Bissell, McGeorge Bundy. Check: Jones has two calls from the White House within three days of the inauguration and Bundy''s encouragement (47–48); the Committee found the testimony on the White House''s part in conflict (183–84).'
      tags:
