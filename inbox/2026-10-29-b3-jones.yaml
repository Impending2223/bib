- edit:
    id: cal.1961-04-06.cuba-bay-of-pigs
    base: e506f8d6
    set:
      c: 'The White House, 9:15 a.m., an hour and a half. Bissell on Masferrer to be arrested and a B-25 and boats seized; a pilot''s defection on D-3 with air strikes; a guerrilla landing on D-2. Apr. 16 the last day to call it off. Kennedy: continue planning; the strikes limited; the operation to look Cuban. Schlesinger, after it: "We seem now destined to go ahead on a quasi-minimum basis—a large-scale infiltration (hopefully) rather than an invasion."'
      n: '[FRUS 1961–63, X, doc. 84](https://history.state.gov/historicaldocuments/frus1961-63v10/d84) (the appointment book; Gray''s notes). [[w.schlesinger-thousand-days-1965]], 256, from his notes (the quotation). [[w.jones-bay-of-pigs]], 67–68 (the meeting; Bissell''s measures; the last day). Made public: [[w.schlesinger-thousand-days-1965]] (1965); FRUS 1961–63, X (1997). See [[cal.1961-03-29.cuba]]. Names: Bissell, Kennedy, Schlesinger.'
      src:
