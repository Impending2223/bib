    entry:
      id: cal.1961-01-26.cuba
      when: Jan. 26
      date: '1961-01-26'
      thread: cuba-bay-of-pigs
      c: The CIA's paper on the plan. A beachhead held two weeks, perhaps thirty days, with an airstrip and access by sea; a reasonable chance it brings the regime down. More likely civil war, then an OAS force, in fact American intervention. Two or three weeks more of the softening up before a judgment.
      n: '[FRUS 1961–63, X, doc. 27](https://history.state.gov/historicaldocuments/frus1961-63v10/d27). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 49 (the beachhead). See [[cal.1961-01-22.cuba]].'
      src:
        c: fb6b642b
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d27: all'
        - 'w.jones-bay-of-pigs 49: B'
        - 'via w.jones-bay-of-pigs 49 n.10b: B'
