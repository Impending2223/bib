    set:
      c: 'The White House. Zapata revised: the landing at night, air drops at first light, the ships away by dawn. Kennedy approves going ahead with the planning; keeps the right to call it off up to 24 hours before the landing. Burke, asked, puts the chances at about 50 percent; the force not to be taken off if pinned down: "Once they were landed they were there."'
