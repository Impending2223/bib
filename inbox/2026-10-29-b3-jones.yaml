        - 'via w.jones-bay-of-pigs 77 n.7a: C-D'
        - 'via w.jones-bay-of-pigs 78 n.8a: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-13.cuba-2
      when: Apr. 13
      date: '1961-04-13'
      thread: cuba-bay-of-pigs
      c: 'Bundy to Rusk, for McNamara and Dulles too: no use of American armed forces against Cuba "unless quite new circumstances develop." The plan for paramilitary support, Nestor, rejected; no more planning of such operations for an invasion.'
      n: '[FRUS 1961–63, X, doc. 95](https://history.state.gov/historicaldocuments/frus1961-63v10/d95). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 69 (the first decision). See [[cal.1961-04-12.cuba-2]]. Names: McGeorge Bundy, Rusk, McNamara, Dulles.'
