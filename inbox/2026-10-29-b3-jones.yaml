      when: Jan. 4
      date: '1961-01-04'
      thread: cuba-bay-of-pigs
      c: 'Hawkins, of the CIA''s paramilitary staff, to Esterline, the project chief: the decisions the strike needs. A lodgment by an all-Cuban force of about 750; air strikes from dawn of D-1 to destroy Castro''s aircraft and ships. The strike in the latter half of February, not after Mar. 1.'
      n: '[FRUS 1961–63, X, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v10/d9). Made public: in part, *Operation Zapata* (1981); FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 40–42. See [[cal.1960-03-17.cuba]]. Names: Hawkins, Esterline, Castro.'
