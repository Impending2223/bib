      when: Apr. 13
      date: '1961-04-13'
      thread: cuba-bay-of-pigs
      c: 'Hawkins, at Puerto Cabezas, replying to the project chief''s cable: his confidence increased in the force''s ability to win its first battles and to overthrow Castro. The brigade 1,400, "a truly formidable force"; its officers expect no help from American forces.'
      n: '[FRUS 1961–63, X, doc. 98](https://history.state.gov/historicaldocuments/frus1961-63v10/d98) (the CIA to Taylor, Apr. 26, quoting the cables). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 70–71. To check: Robert Kennedy, oral history, 1, 43, Kennedy Library (cited by [[w.jones-bay-of-pigs]], 71 n.67). See [[cal.1961-04-12.cuba-2]]. Names: Hawkins, Castro. Check: Jones dates the report Apr. 14 (70); the cable, Apr. 13.'
