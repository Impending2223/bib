      when: May 16
      date: '1961-05-16'
      thread: cuba
      also:
      - robert-kennedy
      c: 'Luncheon at the White House: the Cuba Study Group, Taylor, Robert Kennedy, Burke and Dulles, gives the President its interim conclusions. Kennedy: reassured throughout that the brigade could turn guerrilla; the CIA did not speak to him of the cancellation''s gravity; he was never asked to extend Navy cover over the ammunition convoy.'
      n: 'FRUS 1961–63, X, docs. [218](https://history.state.gov/historicaldocuments/frus1961-63v10/d218); [219](https://history.state.gov/historicaldocuments/frus1961-63v10/d219) (Burke''s debrief). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 91, 128. See [[cal.1961-04-22.cuba]]. Names: Taylor, Robert Kennedy, Burke, Dulles, Kennedy.'
