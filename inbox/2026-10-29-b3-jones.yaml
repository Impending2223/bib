    entry:
      id: cal.1961-04-04.cuba-3
      when: Apr. 4
      date: '1961-04-04'
      thread: cuba-bay-of-pigs
      c: 'The Joint Chiefs approve and send McNamara JCSM-210-61, the logistic support for Zapata: the operation''s later phase, and covert military support for it.'
      n: '[FRUS 1961–63, X, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v10/d80) (the editorial note, from the chronology of the Chiefs'' part). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 66. See [[cal.1961-03-16.cuba]]. Names: McNamara.'
