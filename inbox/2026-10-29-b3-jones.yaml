    set:
      c: 'Kennedy asks the Joint Chiefs what should be done about Cuba. Lemnitzer: the plans were for clandestine operations; with the arms from Czechoslovakia, the clandestine forces not strong enough. Lemnitzer: a government in exile, then troops ashore and guerrilla groups at work; "At that point we would come in and support them."'
