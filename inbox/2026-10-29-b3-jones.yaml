      c: 'An informational memorandum on Castro''s comments of June 14 and 15 on the invasion: the paratroopers dropped too near the beaches, the causeways not cut; the invaders fought well while they thought they had air cover. Zapata "ideal ground"; his air force four T-33s, two Sea Furies and a B-26.'
      n: '[FRUS 1961–63, X, doc. 236](https://history.state.gov/historicaldocuments/frus1961-63v10/d236). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 125. See [[cal.1961-04-15.cuba]]. Names: Castro.'
