- add:
    entry:
      id: cal.1960-09.cuba-2
      when: Sept.
      date: 1960-09
      thread: cuba
      c: 'Miami, the week of Sept. 24, by the Inspector General''s report: the Support Chief, Maheu and Rosselli work out the operation, Rosselli as "John Rawlston" among the Cubans. Rosselli brings in "Sam Gold," Giancana, and "Joe," Trafficante. By Jones''s account, a meeting with exiles on the Venetian Causeway, Varona among them; Orta, in Castro''s office, proposed for the poison.'
      n: '[S. Rep. No. 94-465, 76–77 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=87). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.jones-bay-of-pigs]], 24–26 (the meetings in Miami; the Venetian Causeway). To check: Rosselli, testimony, June 24, 1975, 17, 19–25, and Maheu, testimony, July 29, 1975, 40–42, Church Committee (cited by [[w.jones-bay-of-pigs]], 26 n.42). See [[cal.1960-09.cuba]]. Names: Maheu, Rosselli, Giancana, Varona, Castro. Check: the Committee''s report names no meeting with the exiles in September; Jones dates it late September (25).'
      tags:
