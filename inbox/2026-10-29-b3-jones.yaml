- add:
    entry:
      id: cal.1961-04-19.cuba-6
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: 'Dennison to Clark, 10:46 a.m.: close air support cannot be furnished. 11:24 a.m., and Gray for the Chiefs at 11:57 on Burke''s telephoned word: two destroyers off Blue Beach to see whether the brigade can be taken off. 11:32 a.m.: continuous air cover over the beaches; protection from ground attack not authorized. 1:12 p.m.: the destroyers to take men off the beach and out of the water; if fired on, to return fire. 3:10 p.m.: the brigade''s commander, by the CIA, taken to the woods; its ships dispersed, Dennison to salvage ships and cargo. 8:42 p.m.: one destroyer to stay off the beach overnight, out of the guns'' range, its boat to pick up evacuees.'
      n: 'FRUS 1961–63, X, docs. [144](https://history.state.gov/historicaldocuments/frus1961-63v10/d144); [145](https://history.state.gov/historicaldocuments/frus1961-63v10/d145); [147](https://history.state.gov/historicaldocuments/frus1961-63v10/d147) (Gray); [146](https://history.state.gov/historicaldocuments/frus1961-63v10/d146); [151](https://history.state.gov/historicaldocuments/frus1961-63v10/d151) (Gray); [154](https://history.state.gov/historicaldocuments/frus1961-63v10/d154) (Gray); [156](https://history.state.gov/historicaldocuments/frus1961-63v10/d156) (the Chiefs). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 122 (the night''s destroyer). See [[cal.1961-04-18.cuba-4]]. Names: Dennison, David Gray, Burke.'
      tags:
      - name:dennison-robert-l
      - name:gray-david-w
      - name:burke-arleigh-a
      src:
