      date: '1961-05-09'
      thread: cuba
      also:
      - defense
      c: 'The Joint Chiefs to Dennison: a plan for a military assault on Cuba, to overthrow Castro in minimum time, keep Guantanamo, and strike without warning within five days of the order. The XVIII Airborne Corps, the 82nd and 101st, the 2nd Marine Division, four tactical fighter wings among the forces.'
      n: '[FRUS 1961–63, X, doc. 213](https://history.state.gov/historicaldocuments/frus1961-63v10/d213). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 151. See [[cal.1961-04-29.cuba]]. Names: Dennison, Castro.'
