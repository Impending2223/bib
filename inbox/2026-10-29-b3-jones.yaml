      id: cal.1961-01-16.cuba
      when: Jan. 16
      date: '1961-01-16'
      thread: cuba-bay-of-pigs
      c: 'A Defense staff study for the working group, on military courses to overthrow Castro. His forces: an army of 32,000, a militia of 200,000 to 300,000, pilots in training in Czechoslovakia, 20,000 tons of Soviet arms in five months. No force trained covertly could hold a lodgment; only American action, alone or with the exiles, assures success.'
      n: '[FRUS 1961–63, X, doc. 19](https://history.state.gov/historicaldocuments/frus1961-63v10/d19). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 43. See [[cal.1961-01-12.cuba]]. Names: Castro.'
      tags:
      - name:castro-fidel
      src:
        c: 96f015f6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d19: all'
