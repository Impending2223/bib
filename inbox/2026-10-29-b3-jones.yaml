- add:
    entry:
      id: cal.1961-04-07.cuba-3
      when: Apr. 7
      date: '1961-04-07'
      thread: cuba-bay-of-pigs
      c: 'Lemnitzer to Dennison, CM-179-61: the Navy''s support and the rules of engagement recast so that the United States may "plausibly deny participation." The destroyers to keep their distance by day, close by night, and come no nearer than twenty miles to the target area; no naval support of the landing. D-Day Apr. 17.'
      n: '[FRUS 1961–63, X, doc. 85](https://history.state.gov/historicaldocuments/frus1961-63v10/d85). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 69–70. See [[cal.1961-04-01.cuba-2]]. Names: Lemnitzer, Dennison.'
