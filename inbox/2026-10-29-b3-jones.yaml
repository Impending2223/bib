- add:
    entry:
      id: cal.1961-03-28.cuba-2
      when: Mar. 28
      date: '1961-03-28'
      thread: cuba-bay-of-pigs
      c: 'Dennison, at Norfolk, to Lemnitzer: ready for the missions asked; Guantanamo to be reinforced by a Marine battalion landing team; two destroyers for the convoy. The *Essex* and seven destroyers southwest of Cuba from about Apr. 7; jet squadrons at Guantanamo and Key West; Florida''s air defense to be told. His rules of engagement for the escorts.'
      n: '[FRUS 1961–63, X, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v10/d73). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 63. See [[cal.1961-03-16.cuba]]. Names: Dennison, Lemnitzer.'
