- add:
    entry:
      id: cal.1961-04-20.cuba-3
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba
      c: 'McNamara to Lemnitzer: the President asks Defense for a plan to overthrow Castro by American military force: Cuba''s forces, the civilians'' likely behavior, blockade against invasion, forces, timetable, casualties, and what is left for Laos, Vietnam and Berlin. Not to be read as making military action probable.'
      n: '[FRUS 1961–63, X, doc. 159](https://history.state.gov/historicaldocuments/frus1961-63v10/d159). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 134. Reply: [[cal.1961-04-26.cuba]]. See [[cal.1961-04-15.cuba]]. Names: McNamara, Lemnitzer, Castro.'
      tags:
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:castro-fidel
      - name:kennedy-john-f
      src:
        c: 5f5caef6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d159: all'
        - 'w.jones-bay-of-pigs 134: all'
        - 'via w.jones-bay-of-pigs 134 n.8a: all'
    section: '196104'
- add:
    entry:
      id: cal.1961-04-21.cuba-2
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba
      also:
      - defense
      c: 'McNamara with the Joint Chiefs and the service secretaries, by Burke''s record: the services to "accept appropriate responsibility" and avoid backbiting; military operations to be run by the military; nothing started that cannot be finished. A plan for invading Cuba to be drawn, though invasion "unlikely." Lemnitzer: if the CIA has lost its nerve, the Chiefs to support the rebels through Dennison.'
      n: '[FRUS 1961–63, X, doc. 162](https://history.state.gov/historicaldocuments/frus1961-63v10/d162). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 134–35. See [[cal.1961-04-20.cuba-3]]. Names: McNamara, Burke, Lemnitzer, Dennison.'
      tags:
      - name:mcnamara-robert-s
      - name:burke-arleigh-a
