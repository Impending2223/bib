        - 'w.jones-bay-of-pigs 52: C-F'
        - 'via w.jones-bay-of-pigs 52 n.18a: C-F'
    section: '196102'
- add:
    entry:
      id: cal.1961-03.cuba-bay-of-pigs
      when: Mar.
      date: 1961-03
      thread: cuba-bay-of-pigs
      c: 'On the White House lawn, by Smathers''s account to the Church Committee: Kennedy asks him how Latin America would take Castro''s assassination; the CIA, Kennedy says, has led him to think Castro would be dead by the time of the invasion. Smathers against it; Kennedy, by Smathers, "completely disapproved of the idea."'
      n: '[[w.jones-bay-of-pigs]], 53. To check: Smathers, testimony, July 23, 1975, 6–7, 16–19, 25, Church Committee (cited by [[w.jones-bay-of-pigs]], 53 n.22). See [[cal.1960-03-17.cuba]]. Names: Smathers, Kennedy, Castro. Check: the day; and whether the Committee''s report prints the testimony.'
      tags:
      - name:smathers-george-a
      - name:kennedy-john-f
      - name:castro-fidel
      src:
        c: 14756cba
        rows:
        - 'w.jones-bay-of-pigs 53: all'
        - 'via w.jones-bay-of-pigs 53 n.22a: all'
    section: '196103'
- add:
    entry:
      id: cal.1961-03.cuba
      when: Mar.
      date: 1961-03
      thread: cuba
      c: 'Late February or March, by the Inspector General''s report: Rosselli reports the poison pills delivered to an official close to Castro, who returns them after some weeks. Another attempt in April, through a leading exile. Maheu: the "go signal" never came.'
      n: '[S. Rep. No. 94-465, 80–82 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=91). Made public: the Church Committee''s interim report, Nov. 20, 1975. [[w.jones-bay-of-pigs]], 91 (the official, Orta, by name). To check: Edwards, testimony, May 30, 1975, 12; Maheu, testimony, July 29, 1975, 42–44, 60–61; Rosselli, testimony, June 24, 1975, 24, Church Committee (cited by [[w.jones-bay-of-pigs]], 91 n.48). See [[cal.1960-09.cuba]]. Names: Rosselli, Castro, Maheu. Check: Jones has Orta lose his nerve, break with Castro in January and take refuge in the Mexican embassy on the eve of the invasion (91).'
      tags:
      - name:rosselli-john
      - name:castro-fidel
      - name:maheu-robert-a
      src:
        c: c1c04f7f
        rows:
        - 'https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=91: all'
        - 'w.jones-bay-of-pigs 91: A, C'
        - 'via w.jones-bay-of-pigs 91 n.48a: A, C'
        - 'via w.jones-bay-of-pigs 91 n.48b: C'
        - 'via w.jones-bay-of-pigs 91 n.48c: A'
    section: '196103'
- add:
    entry:
      id: cal.1961-03-10.cuba
      when: Mar. 10
      date: '1961-03-10'
      thread: cuba-bay-of-pigs
      c: 'The Joint Chiefs to McNamara, JCSM-146-61, with their team''s report on the force, from its visit of Feb. 24–27: initial success likely; ultimate success on the assault''s setting off action across Cuba. The team: the odds 85 to 15 against surprise; without it one Castro aircraft with .50-caliber guns could sink the force.'
      n: '[FRUS 1961–63, X, doc. 56](https://history.state.gov/historicaldocuments/frus1961-63v10/d56). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 54–55. To check: the third meeting of the Green Study Group, Apr. 25, 1961, [[w.operation-zapata]], 134 (cited by [[w.jones-bay-of-pigs]], 54 n.24). See [[cal.1961-02-03.cuba]]. Names: McNamara, Castro.'
      tags:
      - name:mcnamara-robert-s
      - name:castro-fidel
      src:
        c: 07560594
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d56: all'
        - 'w.jones-bay-of-pigs 54–55: all'
        - 'via w.jones-bay-of-pigs 54 n.24a: all'
        - 'via w.jones-bay-of-pigs 54 n.24b: A'
    section: '196103'
- add:
    entry:
      id: cal.1961-03-15.cuba-2
      when: Mar. 15
      date: '1961-03-15'
      thread: cuba-bay-of-pigs
      c: 'Schlesinger to Kennedy: the less the military risk, the greater the political, and the political not thought through. Do we deny it at the UN, and then when Castro shows prisoners? "A new U-2 imbroglio." Dulles, with the President out of the room: "Don''t forget that we have a disposal problem."'
      n: '[FRUS 1961–63, X, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v10/d63). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 57–58. See [[cal.1961-03-11.cuba]]. Names: Schlesinger, Kennedy, Castro, Dulles.'
