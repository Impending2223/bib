      when: May 4
      date: '1961-05-04'
      thread: cuba
      c: 'The Interagency Task Force on Cuba''s paper for the NSC, "Cuba and Communism in the Hemisphere": no sure way of overthrowing Castro short of American military intervention, and its costs outweigh its advantages. No intervention now, nothing to foreclose it later; the program''s other parts approved by the whole task force.'
      n: '[FRUS 1961–63, X, doc. 202](https://history.state.gov/historicaldocuments/frus1961-63v10/d202). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 150–51. The Council: [[cal.1961-05-05.cuba]]. Names: Castro. Check: Jones has the task force insist that military intervention was the only way (150); the paper recommends none now.'
