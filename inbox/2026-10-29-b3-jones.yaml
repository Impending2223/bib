      date: '1961-04-29'
      thread: cuba
      c: 'McNamara and Burke review with the President Contingency Plan 1 for an invasion of Cuba by American troops: some 60,000 men besides naval and air units, 25 days from decision to D-Day, the island controlled in eight days, guerrillas fighting on. The President concurs in its general outline.'
      n: '[FRUS 1961–63, X, doc. 190](https://history.state.gov/historicaldocuments/frus1961-63v10/d190) (McNamara to the Chiefs, May 1). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 150. See [[cal.1961-04-26.cuba]]. Names: McNamara, Burke, Kennedy.'
