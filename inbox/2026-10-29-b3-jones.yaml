      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      c: The Pentagon, 9 a.m. Gray briefs McNamara, the Chiefs and others on the strike of Apr. 15, the convoy and the landing; the photographs not yet read. McNamara wants every B-26 Defense can spare delivered to the force, and its supplies moved close.
      n: '[FRUS 1961–63, X, doc. 107](https://history.state.gov/historicaldocuments/frus1961-63v10/d107). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 80 (the photographs). See [[cal.1961-04-15.cuba]]. Names: David Gray, McNamara.'
