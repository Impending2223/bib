    entry:
      id: cal.1961-04-05.cuba-2
      when: Apr. 5
      date: '1961-04-05'
      thread: cuba-bay-of-pigs
      c: 'The White House, 8:30 a.m. McNamara and Lemnitzer with Dulles, Bissell and Cabell on the rules of engagement: if American forces must protect the exiles'' ships, the operation aborted. Then a small meeting with the President on the fake defections and the preliminary strikes; approved in general, more the next morning.'
      n: '[FRUS 1961–63, X, doc. 83](https://history.state.gov/historicaldocuments/frus1961-63v10/d83). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 69–70 (the rules of engagement). See [[cal.1961-04-04.cuba]]. Names: McNamara, Lemnitzer, Dulles, Bissell, Cabell, Kennedy.'
