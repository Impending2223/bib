      date: '1961-01-12'
      thread: cuba-bay-of-pigs
      c: The Special Group. Willauer proposes a task force of State, the CIA, Defense and the Joint Staff to plan for the possible use of American forces; all agree. The working group meets first Jan. 13, Willauer in the chair.
      n: 'FRUS 1961–63, X, docs. [17](https://history.state.gov/historicaldocuments/frus1961-63v10/d17); [16](https://history.state.gov/historicaldocuments/frus1961-63v10/d16) (the chronology); [18](https://history.state.gov/historicaldocuments/frus1961-63v10/d18) (the first meeting). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 43 (the task force). See [[cal.1960-03-17.cuba]]. Names: Willauer.'
