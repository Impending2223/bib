- add:
    entry:
      id: cal.1961-04-19.cuba-8
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: 'The CIA''s air base at Puerto Cabezas, Nicaragua, to headquarters, 12:07 p.m.: air support of the beachhead "completely out of our hands"; five Cuban pilots, six copilots, two American pilots and a copilot lost, killed or captured. Two crews shot down in the hour of the Navy''s cover, 6:30 to 7:30 a.m.'
      n: '[FRUS 1961–63, X, doc. 150](https://history.state.gov/historicaldocuments/frus1961-63v10/d150). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 121 ("completely out of our hands"). See [[cal.1961-04-19.cuba]].'
      src:
        c: 456dfc38
        rows:
