      id: cal.1961-01-27.cuba
      when: Jan. 27
      date: '1961-01-27'
      thread: cuba-bay-of-pigs
      c: 'The Joint Chiefs to McNamara, JCSM-44-61: the speedy overthrow of Castro the objective; the present plan does not assure it. An interdepartmental group to draw an over-all plan, from support for the exiles to American forces, as Lemnitzer proposed at State, Jan. 22.'
      n: '[FRUS 1961–63, X, doc. 28](https://history.state.gov/historicaldocuments/frus1961-63v10/d28). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 49. See [[cal.1961-01-22.cuba]]. Names: McNamara, Castro, Lemnitzer.'
      tags:
      - name:mcnamara-robert-s
      - name:castro-fidel
      - name:lemnitzer-lyman-l
      src:
        c: 71fa9025
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d28: all'
        - 'w.jones-bay-of-pigs 49: A-B'
        - 'via w.jones-bay-of-pigs 49 n.11a: A-B'
    section: '196101'
- add:
    entry:
      id: cal.1961-02-07.cuba
      when: Feb. 7
      date: '1961-02-07'
      thread: cuba-bay-of-pigs
      c: 'Mann''s office, 10 a.m. to 1 p.m., Berle in the chair, with Bissell, Barnes, King, Gray, Goodwin and others. A blockade set aside. No Americans to land; a few contract fliers in the strike. Gray: the force could hold six days and reach the mountains. Mann: once it lands the United States is committed, "would have to underwrite the success of the venture."'
      n: '[FRUS 1961–63, X, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v10/d38). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 52 (the contract pilots; Mann). See [[cal.1961-01-28.cuba]]. Names: Mann, Berle, Bissell, Barnes, David Gray, Goodwin.'
      tags:
      - name:mann-thomas-c
      - name:berle-adolf-a
      - name:bissell-richard-m-jr
