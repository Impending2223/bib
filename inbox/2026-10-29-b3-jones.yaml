      when: Apr. 21
      date: '1961-04-21'
      thread: cuba
      c: 'Rostow to Kennedy, "The Problem We Face": not to let Cuba throw the whole foreign policy off balance. Three threats mixed up: Communist arms and a possible Soviet offensive base, which would be virtually a cause of war; Cuba as a base of subversion in Latin America; and the ideological.'
      n: '[FRUS 1961–63, X, doc. 163](https://history.state.gov/historicaldocuments/frus1961-63v10/d163). Made public: FRUS 1961–63, X (1997). [[w.jones-bay-of-pigs]], 133. See [[cal.1961-04-15.cuba]]. Names: Rostow, Kennedy.'
