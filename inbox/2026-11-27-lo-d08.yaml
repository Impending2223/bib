    base: ce64eb05
    set:
      c: 'Zhou Enlai, on a report on building two railway bridges, the Tanglin and Changlin lines: agrees to add forestry capital investment of 2.01 million yuan for the two, the Ministry of Railways to build them and the materials to come from the railway and forestry ministries, any shortfall from the Economic Commission.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 17, 1962; the approval on the report on the Tanglin and Changlin lines'' bridges). Split under R25b: the departure for Harbin is [[cal.1962-06-17.china-zhou]]. Made public: 1997. The order: after [[cal.1962-06-17.china-leadership]], the printed order alone ([[w.zhou-enlai-nianpu-1949]], II, 484). Names: Zhou Enlai.'
    kind: correct
