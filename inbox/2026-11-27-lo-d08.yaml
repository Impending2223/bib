      n: '[[w.zedong-mao-zedong-nianpu]], V, June 11, 1962; [[w.macfarquhar-origins-of-the-cultural]], III, 272 n.65 (Mao''s input into the preparation of a public statement on the need for national alertness); [[w.jianguo-yilai-mao-zedong]], XVI, 298–300 (June 11, 1962; part one of the item, Mao''s insertion in the Xinhua dispatch, printed from his revised copy, his words in Song type; the volume gives no place). The words: 晚上 (the Mao nianpu, V, June 11, 1962). MacFarquhar''s text at 272 has only the Nationalist war fever and the leaders'' panic; its note 65 gives Mao''s part. Made public: 2013. To check: [[w.zedong-jianguo-yilai-mao-zedong]], 10, 101–3 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 272 n.65b). See [[cal.1962-06-10.china-leadership]]. Names: Mao Zedong.'
