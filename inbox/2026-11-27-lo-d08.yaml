    base: bfb010d6
    set:
      c: 'Zhou Enlai at the orchard nursery of the Yanbian Agricultural College: keep joining teaching with productive labor, raise more apple and pear seedlings fit for the place, plant the gullies and hills; the school farm to serve as a model.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 487 (June 23, 1962; 在延边农学院的果树苗圃). Split under R25b: the visit to a Korean household is [[cal.1962-06-23.china-zhou-foreign]], and the night train is [[cal.1962-06-23.china-zhou-foreign-2]]. Made public: 1997. The order: after [[cal.1962-06-23.china-leadership]], [[w.zhou-enlai-nianpu-1949]], II, 486–87 (the talk "on the way to" the Yanbian Agricultural College, 在去延边农学院视察的路上, and then the college''s orchard nursery; the prefectural committee printed between goes against those words and is left unplaced). Names: Zhou Enlai.'
    kind: correct
