      time_band: afternoon
      time_zone: America/New_York
      c: 'The White House. McNamara joins Kennedy and the Democratic leaders with figures on the funds Congress added to the 1962 budget: used as appropriated in 18 instances, impounded in 3, the B-52 wing, the B-70 and Dynasoar. Vinson, as McNamara recalled, tells Kennedy he will "lead them down the hill." While McNamara and Vinson''s aide Philip Kelleher draft a letter, Kennedy and Vinson walk in the Rose Garden; by their return the text is agreed.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 104–105 ("that afternoon at the White House"; the walk, and Kaplan''s reading that both men had decided to compromise before it; nn.31–35). The words: that afternoon (104). The order: after [[cal.1962-03-20.defense]], "that afternoon" against "the morning" ([[w.kaplan-mcnamara-ascendancy-1961-1965]], 104). See [[cal.1962-03-21.defense]]. Names: McNamara, Vinson, Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:mcnamara-robert-s
      - name:vinson-carl
