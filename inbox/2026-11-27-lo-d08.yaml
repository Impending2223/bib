      n: '[FRUS 1961–63, VII, doc. 58](https://history.state.gov/historicaldocuments/frus1961-63v07/d58) (editorial note: a TASS broadcast at 7 p.m. EDT, Aug. 30, 1961, that the Soviet Union is resuming atomic testing; the U.S. Government had prior knowledge through intelligence channels, and the White House statement followed at approximately 9 p.m.). White House Statement on Soviet Resumption of Nuclear Weapons Tests, [1961 Pub. Papers 580](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=638) (Aug. 30, 1961). [[w.reeves-president-kennedy]], 223; [[w.fursenko-khrushchevs-cold-war]], 385 (the end of the moratorium announced; the tests at Semipalatinsk two days later); [[w.sorensen-kennedy]], 293 (Aug. 30, the Soviet Union announces it will end the moratorium on testing); [[w.macfarquhar-origins-of-the-cultural]], III, 122 (the Soviet announcement of Aug. 30). To check: [[w.khrushchev-khrushchev-remembers-1974]], 271–96 (cited by [[w.macfarquhar-origins-of-the-cultural]],
        III, 122 n.14a); [[w.documents-on-international-affairs]], 339–74, 455–65 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 122 n.14b); [[w.survey-of-international-affairs]], 246–63 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 122 n.14c). Split from [[cal.1961-08-30.berlin-and-vienna]] under R17: the broadcast, at 7 p.m., came after the news conference of 4:10 p.m. See [[cal.1961-08-30.berlin-and-vienna]]; [[cal.1961-08-30.testing]]; [[cal.1961-09-01.testing]]. Names: Khrushchev.'
