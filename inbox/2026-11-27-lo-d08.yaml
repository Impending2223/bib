- edit:
    id: cal.1961-07-20.china-leadership-3
    base: '75609386'
    set:
      c: 'The Huairen Tang 怀仁堂, the back hall, 3:30 to 10:30 p.m. Qian Ying 钱瑛 reports on the Control Commission''s meeting.{1} Peng Zhen, with Yang Shangkun, hears Qian Ying: reviews for cadres who erred in work, not for degenerates; production the center of work in the villages. Peng: the "left" and "right" labels on cadres not off production removed and no more pinned.{2}'
      n: '[[w.yang-shangkun-riji]], II, 51 (July 20, 1961); [[w.peng-zhen-nianpu-1902]], IV, 141–142 (July 20, 1961; Peng Zhen, with Yang Shangkun, hears Qian Ying on the central control work forum; Peng: reviews for cadres who erred in work, not for degenerates (the page''s note: the work conference''s summary on rectifying communes treats landlords, rich peasants, counterrevolutionaries, bad elements and degenerates as enemies); production the center of work in the villages, control work to serve it; the central commission''s cases as models, the rest for the regional bureaus and provinces; laws and rules, not too rigid for so large a country); [[w.peng-zhen-nianpu-1902]], IV, 142 (July 20, 1961, continued; Peng: a few principles rather than rigid rules; reviews to cover the last few years, some cases of 1957 and 1958 among them; the "left" and "right" labels on cadres not off production removed and no more pinned; the chief contradiction now between bourgeoisie and proletariat, without
        the "three antis" and the anti-rightist struggle the country would be lost; control cadres upright, clear-headed, of strong Party spirit); [[w.peng-zhen-nianpu-1902]], IV, 141–142. The words: 下午3时半到10时半 (II, 51). Split under R17: the united front forum''s report is [[cal.1961-07-20.china-united-front]]; the diary (II, 51) has one sitting, 3:30 to 10:30 p.m., in which Peng Zhen and Yang Shangkun hear Qian Ying and then (又) the united front men, and the nianpu (IV, 141–142) prints them as two hearings. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Qian Ying, Peng Zhen, Yang Shangkun.'
      src:
        c: d3447956
        rows:
        - 'w.yang-shangkun-riji II, 51: 1'
        - 'w.peng-zhen-nianpu-1902 IV, 142: ?'
        - 'w.peng-zhen-nianpu-1902 IV, 141–142: 2'
    kind: correct
