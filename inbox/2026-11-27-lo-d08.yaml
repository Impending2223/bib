      c: 'The Huairen Tang 怀仁堂, the back hall, the same sitting. Li Weihan 李维汉 (Luo Mai 罗迈), Xu Bing 徐冰 and Ping Jiesan 平杰三 report on united front work.{1} Peng Zhen, with Yang Shangkun, hears them: the national bourgeoisie mostly reformable, by Mao''s word; posts kept or raised, the wrongly treated restored, unpaid fixed interest paid.{2}'
      n: '[[w.yang-shangkun-riji]], II, 51 (July 20, 1961; the sitting of 3:30 to 10:30 p.m., Qian Ying''s report first, then (又) Ping Jiesan, Xu Bing and Luo Mai on united front work; note 1: Ping and Xu, deputy heads of the United Front Work Department; Luo Mai, that is Li Weihan, its head); [[w.peng-zhen-nianpu-1902]], IV, 142 (July 20, 1961; Peng Zhen, with Yang Shangkun, hears Li Weihan (Luo Mai), Xu Bing and Ping Jiesan on the united front forum: the national bourgeoisie, Chairman Mao says, mostly reformable; in the disaster years no meat, little cloth, too little care, but they did not make trouble; relations improved at once, material care after the harvest; posts kept or raised, the wrongly treated restored, their children to the army on their merits; unpaid fixed interest paid; a symposium on the 1911 Revolution''s fiftieth anniversary at Wuhan, not academic only; the Socialist Institute kept, some lamas taken). The words: 下午3时半到10时半 (II, 51). Split from [[cal.1961-07-20.china-leadership-3]]
        under R17. The order: after [[cal.1961-07-20.china-leadership-3]], the diary''s 又 (II, 51: Qian Ying''s report, then the united front men). Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). See [[cal.1961-07-20.china-leadership-3]]. Names: Li Weihan, Ping Jiesan, Xu Bing, Peng Zhen, Yang Shangkun.'
