      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1961-12.latin-america-3
      when: Dec., before the trip
      date: 1961-12
      at: before 1961-12-15
      place: washington
      thread: latin-america
      c: 'Kennedy telephones Goodwin, now at the State Department, to ask whether to go to Venezuela and Colombia: most of those about him say no, and the Secret Service calls it too dangerous. Goodwin, by his account: go; the trip will be a triumph and Caracas as safe as the United States, Betancourt to have the army out. Goodwin accompanies him on the flight and drafts all his speeches.'
      n: '[[w.goodwin-remembering-america]], 214 (Goodwin''s account: "That December Kennedy was scheduled to make a trip to Venezuela and Colombia"; Kennedy''s call; Goodwin''s answer; the flight to Venezuela, and the drafting of all the speeches, as on each of Kennedy''s three later trips to Latin America). See [[cal.1961-12-15.latin-america-dominican-republic]]; [[cal.1961-12-16.latin-america]]. Names: Goodwin, Kennedy. Check: the day of the call; Goodwin gives only "that December," before the trip, which opened Dec. 15.'
      tags:
      - name:goodwin-richard-n
      - name:kennedy-john-f
