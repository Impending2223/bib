- edit:
    id: cal.1962-06-15.china-leadership
    base: 4e8f6774
    set:
      c: Zhou Enlai at Tieling county, to investigate. At Digong brigade, Pingdingbao commune, he asks the members of their living and production, hears the difficulties, says they are temporary and he will carry the poor and lower-middle peasants' wishes to the Center and Mao. He weeds with them, visits the old and children, and climbs Longshou hill with Deng Yingchao, recalling his schooldays there.
      n: '[[w.zhou-enlai-nianpu-1949]], II, 483 (June 15, 1962). Continues 484. The nianpu''s clause on the household staff (484: 在沈阳期间) has no day of its own and is [[cal.1962-06-15.china-zhou]]. Made public: 1997. Names: Zhou Enlai, Deng Yingchao, Mao Zedong.'
    kind: correct
- add:
    entry:
      id: cal.1962-06-15.china-zhou
      when: By June 15
      date: '1962-06-15'
      place: shenyang
      thread: china-zhou
      c: 'Shenyang. During his stay, Zhou Enlai tells the staff who manage his household: no fish, eggs or meat; leaders must not be exceptions when the masses are in difficulty.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 484 (June 15, 1962; 在沈阳期间，对管生活的有关人员交待). Split from [[cal.1962-06-15.china-leadership]] under R15a: the nianpu prints the clause after the day''s items, with no day of its own; the same page has him leave Shenyang for Changchun that night. Made public: 1997. See [[cal.1962-06-15.china-leadership]]. Names: Zhou Enlai. Check: the day.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - vis:only:prc
- edit:
