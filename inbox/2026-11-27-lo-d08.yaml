- add:
    entry:
      id: cal.1962-03-18.china-retreat-1962
      when: Mar. 18
      date: '1962-03-18'
      place: peking
      thread: china-retreat-1962
      also:
      - china-zhou
      c: 'The Central Committee issues Chen Yun''s, Li Xiannian''s and Li Fuchun''s speeches of Feb. 26 to the Party groups of the State Council''s ministries, with a covering comment: the economy is in an extraordinary period; the main task is to restore agriculture, steady the market and win a basic turn in finance and the economy; the next ten years in two stages, the first of adjustment and mainly recovery, the second of development.'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 464 (Mar. 18, 1962; 中共中央批发陈云、李先念、李富春二月二十六日讲话); [[w.macfarquhar-origins-of-the-cultural]], III, 193 (Chen Yun''s speech ordered distributed to cadres, Mar. 18); [[w.mao-zedong-zhuan]], V, ch. 69 n.28 (Mar. 18: the Center issues the instruction forwarding Chen Yun''s speeches: the next ten years in two stages, the first recovery with some development, the second development with some recovery; Chen Yun, Li Fuchun and Li Xiannian to convey it to the Party groups of the ministries). [[w.peng-zhen-nianpu-1902]], IV, 179 (Mar. 18, 1962; the papers issued after Liu, Zhou and Deng reported to Mao at Wuhan on the 16th; Mao agrees that the three speeches go to the province and army level and that Chen Yun head the group); [[w.chen-yun-nianpu-xiuding]], III, 131 (the Center''s directive forwarding the speeches of Chen Yun and others 《关于批发陈云等同志讲话的指示》: the next ten years in two stages, adjustment (chiefly recovery, some growth), then growth; that the first
        is chiefly recovery not to be said outside, in or out of the Party, but called the adjustment stage. The provinces ask to relay the speeches more widely; Chen Yun''s above all help all see the whole and face the difficulties).. Split from [[cal.1962-03-18.china-leadership]] under R25b. Made public: 1997. To check: the comment as issued; [[w.xiangqian-1962-niande-jingji-tiaozheng]], 62 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32a); [[w.issues-and-studies-taipei]], 95 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32b); Mainichi Shimbun correspondents'' transcription from Red Guard posters in Beijing of Liu Shaoqi''s early Cultural Revolution confession (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32c); [[w.weizhong-zhonghua-renmin-gongheguo-jingji]], 327 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 193 n.32d); Central Committee 中共中央, instruction forwarding Chen Yun''s and others'' speeches 《中共中央关于转发陈云等同志讲话的指示》,
        Mar. 18, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.28). See [[cal.1962-03-18.china-leadership]]. Names: Chen Yun, Li Xiannian, Li Fuchun.'
      tags:
      - polity:prc
      - name:chen-yun
      - name:li-xiannian
      - name:li-fuchun
      - vis:only:prc
- edit:
    id: cal.1962-03-20.china-leadership-6
    base: affd2bd1
    set:
      n: '[[w.jianguo-yilai-mao-zedong]], XVI, 257–260 (Mar. 20, 1962; Mao''s note, dated 9 a.m. Mar. 20; printed from the manuscript, the insertion from his revised copy; note 2: the speech on Party work (the three red banners right; the difficulties temporary, in part from not following Mao''s instructions) and on military work (war unavoidable; no provocation, no pure defense); note 4: Mao then at Wuhan; note 6: his changes chiefly in part two, his words in Song type); [[w.mao-zedong-zhuan]], V, ch. 69 n.20 (Mar. 20: Mao to Tian Jiaying and Luo Ruiqing on Lin Biao''s edited speech: a very good and weighty article). [[w.yang-jisheng-mubei]], II, 1116 (on Mar. 20 Mao writes to Tian Jiaying and Luo Ruiqing of the collated speech: read through, a very good, weighty piece, read with great pleasure); [[w.yang-jisheng-tiandi-fanfu]], I, 69 ("read through; a very good, weighty article; I am very glad"). Mubei''s note 14 on the page (1116) cites only Bo Yibo; the support is the page''s body. Made
        public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 69); the text in full, 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). To check: Lin Biao, speech to the enlarged Central Work Conference, Jan. 29, 1962, the edited text (cited by [[w.jianguo-yilai-mao-zedong]], XVI, 258 n.2); Mao Zedong 毛泽东, letter to Tian Jiaying 田家英 and Luo Ruiqing 罗瑞卿 on the edited text of Lin Biao''s speech, Mar. 20, 1962 ("a very good, weighty article, read with pleasure") (cited by [[w.mao-zedong-zhuan]], V, ch. 69 n.20). See [[cal.1962-01-29.china-leadership]]. Names: Mao Zedong, Tian Jiaying, Luo Ruiqing, Lin Biao, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Yang Shangkun. Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it.'
      src:
        c: '10270514'
        rows:
