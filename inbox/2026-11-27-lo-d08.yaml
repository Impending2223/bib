      n: '[[w.yang-shangkun-riji]], II, 86 (Nov. 6, 1961). The words: 上午 (II, 86). The 3 p.m. of the next page (II, 87) is the West Building meeting under Liu Shaoqi, [[cal.1961-11-06.china-leadership]], not this act. Made public: 2001 ([[w.shangkun-yang-shangkun-riji-2]]). Names: Yang Shangkun, Zhou Enlai.'
- edit:
    id: cal.1961-11-06.china-leadership
    base: 80654b6f
    set:
      n: '[[w.zhou-enlai-nianpu-1949]], II, 441 (Nov. 6, 1961); [[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 543 (Nov. 6–10, 1961; Liu presides at the meeting of the first secretaries of the Central Committee''s bureaus on the system of the people''s communes, the market and grain); [[w.yang-shangkun-riji]], II, 87 (Nov. 6, 1961; the West Building, 3 to 6:30 p.m. (下午3时到6时半), Liu Shaoqi presiding: the Politburo, the Secretariat and the six regional bureaus'' secretaries on the team as the basis, the six bureaus reporting); [[w.deng-xiaoping-nianpu-1904]], III, 1669–1670 (Nov. 6, 7, 8 and 10, 1961; Deng at the bureaus'' first secretaries'' meeting, Liu presiding. Nov. 7: all regions favor accounting at the small team and full contracts for deliveries; the forms varied; the brigade''s role to be studied, the state cannot deal with 4.6 million teams without it; 86 billion jin a year to the state the minimum. Nov. 10: no bargaining over this year''s purchase; the fear of being an honest man;
        82 billion jin for next year, no lower; agrees to Tao Zhu''s proposal to bring all prefectural secretaries to Peking); [[w.peng-zhen-nianpu-1902]], IV, 159 (Nov. 6, 1961, the meeting under Liu Shaoqi on the commune system, the market and grain; on contracting grain for 1962 Peng: once grain is contracted, the peasants will hand over the 18 billion jin the Center wants; all agree to full contracting; Nov. 8, Peng hears Zhou and Li Xiannian on grain); [[w.zhu-de-nianpu-xinbian]], III, 1819 (Nov. 6–10, 1961; Zhu De 朱德 at the meeting of the Center''s bureaus'' first secretaries 各中共中央局第一书记会议 Liu Shaoqi 刘少奇 chairs, on the communes'' system, finance, markets and grain); [[w.chen-yun-nianpu-xiuding]], III, 113–114 (Nov. 10: Chen Yun at Liu Shaoqi''s meeting of the regional bureaus'' first secretaries, on grain and the market: grain, that is farming, is the key to turning the economy round, the aims to get through and not to rely on foreigners; what the provinces send up depends on what is
        bought from the peasants; this year''s 72 billion jin too little, next year 20 billion more grown, 10 billion of it bought, 82 billion; the peasants'' life to improve a little, not too much; the first move more purchase, the second fewer townspeople, 10 million sent down by the end of October; the rural markets in chaos, 3.5 billion yuan taken by the peasants for produce worth 0.5 to 1 billion; he has always been for free markets, but how far to open them now needs thought; high-priced sweets and bicycles to draw the money back); [[w.deng-xiaoping-nianpu-1904]], III, 1669–1670; [[w.chen-yun-nianpu-xiuding]], III, 113–114; [[w.peng-zhen-nianpu-1902]], IV, 159. The time is the first day''s. Made public: 1996. To check: [[w.chen-yun-wenji]], III, where the Chen Yun nianpu says Chen Yun''s speech of Nov. 10 is printed, as 《粮食问题与市场问题》 ([[w.chen-yun-nianpu-xiuding]], III, 114). Names: Zhou Enlai, Liu Shaoqi, Deng Xiaoping, Tao Zhu, Chen Yun, Peng Zhen.'
      time_range:
