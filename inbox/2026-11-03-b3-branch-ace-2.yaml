      when: Jan. 23
      date: '1966-01-23'
      thread: alabama
      c: Wilcox County, Highway 41 outside Camden. David Colson, a movement supporter, turning into Antioch Church for a mass
        meeting on the May primary, is shot dead by J. T. Reaves, a white farmer whose car had bumped his; Reaves surrenders
        to Sheriff Lummie Jenkins. The meeting goes on; no one agrees to stand for office.
      n: '[[w.branch-at-canaans-edge]], 423. Check: the newspapers'' accounts against Walter''s diary. To check: "Farmer Kills
        Negro After Cars Collide," AC, Jan. 24, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 423); "White Man Charged
        in Killing," MA, Jan. 24, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 423); Edward M. Rudd, "All Quiet in Camden
        After Negro Killed, White Man Arrested," SC, Jan (cited by [[w.branch-at-canaans-edge]], 423); Entry for Jan. 23,
        1966, pp. 90-92, diary of Francis Walter, courtesy of Francis Walter (cited by [[w.branch-at-canaans-edge]], 423).'
      src:
        c: f03373cc
        rows:
