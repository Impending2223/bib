        1966; Montgomery Advertiser, Jan. 24, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 422); New York Times, Jan.
        24, 1966, p. 16 (cited by [[w.branch-at-canaans-edge]], 422); New York Times, Jan. 25, 1966, p. 35 (cited by [[w.branch-at-canaans-edge]],
        423); Birmingham News, Jan. 24, 1966, p. 4 (cited by [[w.branch-at-canaans-edge]], 423); New York Times, Jan. 25,
        1966, [Dh 35) (cited by [[w.branch-at-canaans-edge]], 423). Names: Katzenbach, King, Hosea Williams.'
