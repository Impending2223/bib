      c: '10:35 p.m. King to Johnson, by telegram, on the State of the Union: praise for the search for peace and the "reassuring"
        resolve that the war not spoil the domestic program. "In all of these endeavors you have both my prayers and my support."'
      n: '[[w.branch-at-canaans-edge]], 418. To check: MLK telegram to "The President," 10:35 p.m., Jan. 13, 1966, Name File,
        Box 144, LBJ (cited by [[w.branch-at-canaans-edge]], 418). See [[cal.1966-01-12.program]]. Names: King, Johnson.'
      tags:
