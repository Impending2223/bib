- cite:
    id: cal.1966-05-03.elections-1966
    item: '[[w.branch-at-canaans-edge]], 462–65 (Doar with five hundred observers in Dallas County, turnout over 17,000; King:
      "white Alabamians are desperately grasping for a way to return to the old days"; Carmichael: "Nonviolence is irrelevant";
      Baker''s margin held after weeks over six precincts'' boxes)'
    units: A-B, D, F
- to-check:
    id: cal.1966-05-03.elections-1966
    add:
    - John Doar, "The Work of the Civil Rights Division in Enforcing Voting Rights," speech at the U.S. Department ofJustice,
      ca. 1989, courtesy of John Doar (cited by [[w.branch-at-canaans-edge]], 462)
    - Montgomery Advertiser, May 4, 1966, pole (cited by [[w.branch-at-canaans-edge]], 464)
    - New York Times, May 5, 1966, p. 35 (cited by [[w.branch-at-canaans-edge]], 464)
    - Jet, May 19, 1966, pp. 14-17 (cited by [[w.branch-at-canaans-edge]], 464)
    - '[[w.carter-politics-of-rage-1995]], 287 (cited by [[w.branch-at-canaans-edge]], 464)'
    - New York Times, May 5, 1966, p. 46 (cited by [[w.branch-at-canaans-edge]], 464)
    - Carmichael interview for The Militant by John Benson, May 3, 1966, reprinted in The Black Panther Party, a Merit Publishers
      pamphlet, June 1966, pp. 24-29 (cited by [[w.branch-at-canaans-edge]], 464)
    - Montgomery Advertiser, May 6, 1966, p. 1 (cited by [[w.branch-at-canaans-edge]], 465)
    - Jet, May 26, 1966, p. 8 (cited by [[w.branch-at-canaans-edge]], 465)
    - 'John Doar, "The Work of the Civil Rights Division in Enforcing Voting Rights," speech at the U.S. Department of Justice,
      ca. 1989, courtesy of John Doar. In his remarks, Doar described the end of the contested vote count as follows: "The
      result in the six boxes: Baker, 1,412, Clark, 92, enough votes to determine the result of the election. However the
      Dallas County Democratic Executive Committee immediately rejected all the votes in the six boxes. This was done by a
      majority of the forty men on the self-perpetuating, lily-white Democratic Executive Committee. The [Civil Rights] Division
      was determined that the black citizens of Dallas County not be disillusioned with their first experience in actual participation
      in a local election. ... From that time until the federal court decided the contest twenty days later, federal observers
      guarded the boxes." (cited by [[w.branch-at-canaans-edge]], 465)'
