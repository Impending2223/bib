      when: Jan. 13
      date: '1966-01-13'
      thread: civil-rights-the-executive
      c: 'Katzenbach to Hoover, on Senator Long''s proposed hearings on surveillance: to go into past "misunderstandings"
        on the legality of the FBI''s microphones "would seem to be academic."'
      n: '[[w.branch-at-canaans-edge]], 420. To check: Katzenbach to Hoover, Jan. 13, 1966, Section 114, FHOC. Katzenbach
        suggested to Hoover then that delving into prior "misunderstandings" about the legality of microphone surveillance
        policy "would seem to be academic." (cited by [[w.branch-at-canaans-edge]], 420). See [[cal.1965-12-20.civil-rights-the-executive]].
        Names: Katzenbach, Hoover, Long.'
      tags:
      - name:katzenbach-nicholas
