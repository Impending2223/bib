        nominates by ballot, each voter checked against the county's list. School board, John Hinson over Virginia White,
        511 to 327, 61.0 percent. Sheriff, Sidney Logan over Jesse Favors, 492 to 381, 56.4 percent. Tax assessor, Alice Moore,
        unopposed, 852 votes.
