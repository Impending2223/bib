        in Beechwood, Lowndes County, 2:30 p.m., March 27, 1966, Reel 18, SNCC (cited by [[w.branch-at-canaans-edge]], 455);
        "Lowndes Marks a Year Full of Historic Change," SC, April 2-3, 1966, p. 3 (cited by [[w.branch-at-canaans-edge]],
        455). See [[cal.1966-01-22.alabama]]. Names: Bond, Carmichael.'
