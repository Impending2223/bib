        withdrawal." King: "It is imperative to end a war that has played havoc with our domestic destinies."'
      n: '[[w.branch-at-canaans-edge]], 457–58 (the New York Times''s poll: 41 percent less for civil rights for dissent from
        that quarter). To check: [[w.garrow-bearing-the-cross]], 469–70 (cited by [[w.branch-at-canaans-edge]], 457); Miami
        LHM dated April 19, 1966, FKA-NR (cited by [[w.branch-at-canaans-edge]], 457); New York Times, April 14, 1966, p.
        6 (cited by [[w.branch-at-canaans-edge]], 457). Names: King.'
