      c: '1:27 a.m., after a news item that Moyers might want his old place at the Peace Corps, Johnson to Moyers by telephone,
        over half an hour: "Do you want to change jobs?" Moyers: "There''s not another job that I believe I should do right
        now." Johnson: "It''s coming from within ... The Republicans are not hurtin'' us."'
      n: '[[w.branch-at-canaans-edge]], 417–18. To check: [Johnson and Bill Moyers, 1:27 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-bill-moyers-january-13-1966),
        Conversation WH6601-07-9488 (Miller Center) (cited by [[w.branch-at-canaans-edge]], 417, 418). Names: Johnson, Moyers.'
      tags:
