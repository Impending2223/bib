      when: Jan. 17
      date: '1966-01-17'
      thread: civil-rights-the-executive
      also:
      - congress
      c: 'DeLoach to Tolson on his talk with Long, at Hoover''s direction, to keep the FBI out of Long''s hearings on surveillance:
        "a little ludicrous to consider the civil rights of such hoodlums have been violated by microphones." Long "thoroughly
        dislikes Senator [Robert] Kennedy, and will use such information against Senator Kennedy."'
      n: '[[w.branch-at-canaans-edge]], 420. To check: DeLoach to Tolson, Jan. 17, 1966, FRK-1802 (cited by [[w.branch-at-canaans-edge]],
        420). See [[cal.1966-01-13.civil-rights-the-executive]]. Names: DeLoach, Tolson, Long, Hoover, Robert Kennedy.'
      tags:
      - name:deloach-cartha
      - name:tolson-clyde-a
