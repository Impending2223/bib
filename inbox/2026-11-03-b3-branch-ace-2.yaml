      c: 'The New York Times, two pages, as the Tet truce ends: clergy of many faiths and countries, King among them, Barth,
        Heschel, Daniel Berrigan, Niemöller: "they are our brothers whom we kill!" Both sides rebuked; the Geneva accords
        restored under a truce, a plebiscite on reunification. With it, Thich Nhat Hanh''s text, circulated by the Fellowship
        of Reconciliation. King preaches at Riverside Church.'
      n: '[[w.branch-at-canaans-edge]], 421–22. To check: [[w.garrow-bearing-the-cross]], 459 (cited by [[w.branch-at-canaans-edge]],
        421); New York Times, Jan. 23, 1966, pp. E6—7 (cited by [[w.branch-at-canaans-edge]], 421); Friedland, *Lift Up Your
        Voice Likea Trumpet* (1998), 154–56, 170 (cited by [[w.branch-at-canaans-edge]], 422); Thich Nhat Hanh, Lotus, pp.
        97-98 (cited by [[w.branch-at-canaans-edge]], 422); Thich Nhat Hahn, Lotus, p. 68 (cited by [[w.branch-at-canaans-edge]],
        422). Names: King.'
      tags:
