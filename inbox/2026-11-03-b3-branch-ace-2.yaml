      when: Jan. 24
      date: '1966-01-24'
      thread: voting-rights
      also:
      - alabama
      c: Birmingham. Federal examiners under the Voting Rights Act, twenty-three, nine of them Negroes, begin listing voters;
        over a thousand the first day. By Katzenbach's certification the thirty-seventh jurisdiction, the eleventh in Alabama,
        the first urban. King leads a welcome; Hosea Williams, cleared that morning of a drunk-driving charge, asks whites
        to use the registrars too.
