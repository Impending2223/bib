- add:
    entry:
      id: cal.1966-04-29.alabama
      when: Apr. 28–29
      date: '1966-04-28'
      thread: alabama
      also:
      - king
      - elections-1966
      c: 'King in Alabama for the May 3 primary: four speeches the night of Apr. 28; Apr. 29, nine in rural churches over
        825 miles, 1,500 new voters at Antioch Baptist in Wilcox County. Negro registration doubled to 240,000; fifty-four
        Negroes on the Democratic ballot.'
      n: '[[w.branch-at-canaans-edge]], 458–59. To check: "People to People, Dr. King''s Itinerary," April 28-30, A/KP-NA
        (cited by [[w.branch-at-canaans-edge]], 458); New York Times, April 30, 1966, 19 Ik An afternoon rainstorm caught
        King: SC, May 7-8, 1966, p. 2 (cited by [[w.branch-at-canaans-edge]], 459); "It All Comes Down to This—Tomorrow Climaxes
