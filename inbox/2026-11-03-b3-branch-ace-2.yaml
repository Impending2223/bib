      thread: king
      c: 'The Atlanta Constitution, front page: Justice took the car-theft inquiry from the local U.S. attorney to keep Hosea
        Williams out of an indictment; Daddy King had given up a stolen car from SCLC''s fleet. King''s conference call with
        his advisers, on the FBI''s wiretap. SCLC''s statement: cars bought from salesmen "we felt to be reputable."'
