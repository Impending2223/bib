- add:
    entry:
      id: cal.1966-01-24.vietnam-pause-3
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, Bundy, Taylor and Valenti, 6:30–7:30 p.m., after the Democratic leaders. Rusk: decide
        to resume Friday or Saturday. McNamara: "I''d go sooner. Political delay can be damaging. Start Wednesday." Johnson:
        "I think we''ll spend a good deal of political capital in resuming"; Dirksen and a couple of House Republicans to
        be seen quietly first.'
