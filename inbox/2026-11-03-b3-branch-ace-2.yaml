        419); J. G. Deegan to W. R. Wannall, Aug. 18, 1975, Document 74, FGTR (cited by [[w.branch-at-canaans-edge]], 419);
        Curtis Lynum, SAC, San Francisco, letter to Hoover, Jan. 17, 1966, FVL-704 (cited by [[w.branch-at-canaans-edge]],
        419); Rowe to J. Edgar Hoover, Jan. 14, 1966, FVL-705 (cited by [[w.branch-at-canaans-edge]], 419). See [[cal.1965-12-28.civil-rights-the-executive]].
        Names: Hoover.'
      tags:
