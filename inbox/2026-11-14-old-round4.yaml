- edit:
    id: cal.1968-08-28.elections-1968
    base: aad04087
    set:
      c: 'Chicago. The platform''s plank on Vietnam: stop all bombing of the North "when this action would not endanger the lives of our troops in the field," taking "into account the response from Hanoi." The minority plank, McCarthy''s and McGovern''s, for an unconditional halt, defeated, 1,567¾ to 1,041¼ (Check). Ribicoff, nominating McGovern: "Gestapo tactics on the streets of Chicago." Humphrey nominated on the first ballot after midnight: 1,759¼; McCarthy 601, McGovern 146½, Channing Phillips of the District 67½, Moore of North Carolina 17½, Edward Kennedy 12¾.'
      n: '[1968 Democratic Party Platform](https://www.presidency.ucsb.edu/documents/1968-democratic-party-platform) (Aug. 26, 1968); The President''s News Conference Held on His 60th Birthday at Austin, Texas, [1968–69 Pub. Papers 914](https://www.govinfo.gov/content/pkg/PPP-1968-book2/pdf/PPP-1968-book2.pdf#page=224) (Aug. 27, 1968). [Johnson and Daley, 4:08 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-daley-august-27-1968), Aug. 27, Conversation WH6808-03-13327 (Miller Center). Votes: [Wikipedia, "1968 Democratic National Convention"](https://en.wikipedia.org/wiki/1968_Democratic_National_Convention). [[w.longley-lbjs-1968]], 225, 227 (Johnson''s message; Ribicoff); [[w.cq-weekly-report]], Aug. 30, 1968, 2285, 2287–88, 2338, 2342. [[w.mann-grand-delusion]], 613; [[w.chester-american-melodrama]], 579–80, 585 (the debate, three hours; the plank, 1,567 to 1,041 at 4:30 p.m.; Humphrey 1,760¼, McCarthy 601, McGovern 146½, Phillips 67½, Moore 17½, Edward Kennedy 12¾); [[w.solberg-hubert-humphrey]], 362–65 (the debate at noon; 1,567¾ to 1,041¼; the Hilton; Pennsylvania''s votes put him over); [[w.zelizer-fierce-urgency-of-now]], 307 (the plank: a halt only if it would "not endanger the lives of our troops in the field"); [[w.bernstein-guns-or-butter]], 513–14 (the plank adopted 1,567¾ to 1,041¼); [[w.peirce-great-plains-states-of]], 182 (McGovern''s 146 votes); [[w.mann-walls-of-jericho]], 489 (Johnson insists that the platform affirm his conduct of the war); [[w.nixon-rn]], 317 (the McCarthy forces'' peace plank defeated); [[w.zaroulis-who-spoke-up]], 192, 196 (the minority plank defeated 1567¾ to 1041¼; the majority plank "would not endanger the lives of our troops"; Ribicoff and Daley; Humphrey nominated at 11:47 p.m. with Pennsylvania''s 103¾ votes); [[w.wofford-of-kennedys-and-kings]], 433 (Wednesday evening, Ribicoff charges Chicago police with "Gestapo tactics"; Daley shouts at him; not the nominating speech); [[w.albert-little-giant-1990]], 304–05 (the debate on the Vietnam plank, two hours by the rules Albert had amended; not the plank''s words, the vote, Johnson''s message, Ribicoff or the ballot); [[w.obrien-no-final-victories]], 252 (Humphrey accepts the Johnson Vietnam plank and the Convention endorses it, in O''Brien''s words "by a two-to-one margin"; not the plank''s words, the roll call or the day). Check: the *Official Proceedings*. [[w.dallek-flawed-giant]], 575 (the plank, the vote). Check: CQ prints the minority plank''s defeat 1,041¼ to 1,567¾ in its table and its chronology (2287, 2338), 1,048¼ to 1,567¾ in its story (2285), 1,041–1,567 in its analysis (2289): Burton offered it; debate from 1:03 p.m., the roll from 3:52, the result 4:39. Humphrey''s first-ballot total 1,760¼ in its table (2288) and summary (2283), 1,761¾ in its story (2284, 2342), both against 1,759¼ here; Pennsylvania put him over at 11:47 p.m., the result announced 12:02 a.m., Aug. 29 (2338, 2342). The telegrams of Johnson and Edward Kennedy read at 8:02 p.m. (2338). CQ says only that Ribicoff spoke of the tumult in the city, departing from his text (2338). Check: the vote: [[w.obrien-no-final-victories]], 252, has the Convention endorse the Johnson plank "by a two-to-one margin"; 1,567¾ to 1,041¼ is about three to two. To check: [[w.eisele-almost-to-the-presidency]]; [[w.mccarthy-year-of-the-people]]; [[w.johns-price-of-loyalty]]; [[w.witcover-year-the-dream-died]]; [[w.gould-1968]]; [[w.lafeber-deadly-bet]]. See [[cal.1968-08-26.elections-1968-2]]. Names: McCarthy, McGovern, Ribicoff, Humphrey, Phillips, Moore, Edward Kennedy, Daley, Johnson. Check: Longley gives the minority plank''s defeat as 1,527¾ to 1,041¼ (225, from Witcover). Check: Mann, 613, gives the minority plank''s defeat as 1,567 to 1,048, from the *Congressional Quarterly Almanac*, 1968, 1021. Check: Chester, 585, gives Humphrey 1,760¼.'
    unset:
