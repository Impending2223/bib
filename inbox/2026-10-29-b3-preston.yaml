- add:
    entry:
      id: cal.1961-07-21.vietnam
      when: July 21
      date: '1961-07-21'
      thread: vietnam
      c: 'Rostow to Kennedy: South Vietnam "extremely precarious"; "I believe Viet-Nam requires from us a radical push in
        the right directions." Pressure on the North, by the campaign of exposure, "the diplomatic foundation for a military
        contingency plan which would be aimed in part against North Viet-Nam."'
      n: '[[w.preston-war-council]], 87. To check: Rostow to Kennedy, July 21, 1961, NSF, Regional Security, Southeast Asia,
        box 231, Kennedy Library (cited by [[w.preston-war-council]], 87 n.31); [FRUS 1961–63, I, doc. 102](https://history.state.gov/historicaldocuments/frus1961-63v01/d102)
        (Rostow''s paper of the same day, "Evaluation of Positive and Negative Forces in Viet-Nam"; not the memorandum). Names:
        Rostow, Kennedy.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
        c: effe7dc5
        rows:
        - 'w.preston-war-council 87: all'
        - 'via w.preston-war-council 87 n.31a: all'
- add:
    entry:
      id: cal.1961-07-27.vietnam
      when: July 27
      date: '1961-07-27'
      thread: vietnam
      also:
      - laos
      c: 'Taylor and Rostow to Kennedy, "Issues for Decision," for the meeting on Southeast Asia of July 28: one strategy
        for the whole area, Laos, South Vietnam, Thailand and Cambodia all in danger; "to build as much indigenous military,
        political and economic strength as we can," while "preparing to intervene with U.S. military force."'
      n: '[FRUS 1961–63, I, doc. 107](https://history.state.gov/historicaldocuments/frus1961-63v01/d107). [[w.preston-war-council]],
        89. See [[cal.1961-07-28.laos]]. Names: Taylor, Rostow, Kennedy.'
      tags:
