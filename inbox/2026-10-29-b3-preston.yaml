        rows:
        - 'w.preston-war-council 87: all'
        - 'via w.preston-war-council 87 n.32: all'
- add:
    entry:
      id: cal.1961-08-25.vietnam
      when: Aug. 25
      date: '1961-08-25'
      thread: vietnam
      c: 'Robert H. Johnson to Bundy, on the task force''s August report on Vietnam, written mostly by Rostow, Komer''s recommendations
        in it: Rusk and Harriman against it; to be redrafted with more weight on negotiation, the Geneva talks on Laos among
        them.'
      n: '[[w.preston-war-council]], 88. To check: R. Johnson to Bundy, Aug. 25, 1961, NSF, Regional Security, Southeast Asia,
        box 231, Kennedy Library (cited by [[w.preston-war-council]], 88 n.35). Names: Robert H. Johnson, Bundy, Rostow, Komer,
        Rusk, Harriman. Check: what the memorandum itself says; Preston''s note gives it with Komer''s of Aug. 2 for the passage.'
      tags:
