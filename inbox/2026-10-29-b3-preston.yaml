      date: '1965-01-07'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Bundy to Johnson, before a meeting with the press: "We can always emphasize that while avoiding a ''wider war''
        and ignominious withdrawal, we are constantly at work trying to strengthen our program there on every front."'
      n: '[[w.preston-war-council]], 165. To check: Bundy to Johnson, Jan. 7, 1965, NSF, Files of McGeorge Bundy, Chron.,
        box 6, LBJ Library (cited by [[w.preston-war-council]], 165 n.20). Names: Bundy, Johnson.'
