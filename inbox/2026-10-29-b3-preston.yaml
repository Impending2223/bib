      when: Nov. 14
      date: '1963-11-14'
      thread: vietnam
      also:
      - europe-and-the-alliance-france
      c: 'Forrestal to Bundy, of Alphand the night before: France to recognize the new government; asked why the United States
        opposes a neutral Vietnam, Forrestal: "To be neutral, one had to be strong; and it would take some time to build the
        necessary strength."'
      n: '[FRUS 1961–63, IV, doc. 317](https://history.state.gov/historicaldocuments/frus1961-63v04/d317). [[w.preston-war-council]],
        136. Names: Forrestal, Bundy, Alphand.'
