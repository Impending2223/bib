        228–29 (six to eight thousand for the flood); [[w.gibbons-u-s-government-and]], II, 73–78 (the report; Americans "side
        by side" with the Vietnamese; 6,000–8,000 men under cover of the flood; not the helicopters); [[w.kaplan-mcnamara-ascendancy-1961-1965]],
