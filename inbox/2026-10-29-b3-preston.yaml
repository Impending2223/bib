      when: May 29
      date: '1964-05-29'
      thread: vietnam
      c: 'Forrestal to Johnson, on whether time works for or against the United States in South Vietnam: no trend for the
        better; in Saigon, factionalism, bickering, "probably some coup plotting." Needed within a month or six weeks, American
        action somewhere in Southeast Asia showing "that we will do whatever is required to insure this." Bundy sends it to
        the Ranch.'
      n: '[FRUS 1964–68, I, doc. 183](https://history.state.gov/historicaldocuments/frus1964-68v01/d183). [[w.preston-war-council]],
        146. See [[cal.1964-05-26.vietnam-2]]. Names: Forrestal, Johnson, Bundy.'
