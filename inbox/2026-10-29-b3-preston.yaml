- add:
    entry:
      id: cal.1965-02-06.vietnam
      when: Feb. 6
      date: '1965-02-06'
      thread: vietnam
      c: 'McGeorge Bundy to William Bundy from Saigon, 6 p.m., for the President: the mission and the ambassador to report
        apart; Bundy''s report to be written on the way home. "Tomorrow will be spent in the field and should give additional
        color to conclusions which will contain few major surprises. Overall impression is that important decisions are necessary
        but that there is time in which to make them."'
      n: '[FRUS 1964–68, II, doc. 75](https://history.state.gov/historicaldocuments/frus1964-68v02/d75). [[w.preston-war-council]],
        176–77. Names: McGeorge Bundy, William Bundy, Taylor.'
