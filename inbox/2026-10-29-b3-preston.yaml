- add:
    entry:
      id: cal.1961-07-13.vietnam
      when: July 13
      date: '1961-07-13'
      thread: vietnam
      also:
      - laos
      c: 'Rostow to Rusk, after their talk of the day before: to raise Vietnam internationally "we must be ready to go": a
        sharp rise in Americans in the South; a counter-guerrilla operation in the North, American air and naval strength
        perhaps; the alternative of fighting needed for any good Laos settlement.'
      n: '[FRUS 1961–63, I, doc. 88](https://history.state.gov/historicaldocuments/frus1961-63v01/d88). [[w.preston-war-council]],
        86. Names: Rostow, Rusk.'
