      date: '1963-11-02'
      thread: vietnam
      c: 'Bundy to Lodge, 6:31 p.m.: the deaths of Diệm and Nhu "caused shock here"; the new government''s standing in danger
        if the conviction spreads that senior members ordered them killed; "simple assertion of suicide obviously will not
        end the matter."'
      n: '[FRUS 1961–63, IV, doc. 278](https://history.state.gov/historicaldocuments/frus1961-63v04/d278). [[w.preston-war-council]],
