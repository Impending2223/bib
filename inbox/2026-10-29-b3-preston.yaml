      date: '1963-11-07'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Forrestal to Bundy, on Reston''s column of Nov. 6 in the *Times* for a negotiated neutrality of Indochina: an "old
        shibboleth" that "must be causing worries in Saigon." The President to say the United States will leave when the North
        Vietnamese do.'
      n: '[[w.preston-war-council]], 135. To check: Forrestal to Bundy, Nov. 7, 1963, NSF, Country File, Vietnam, box 202,
        Kennedy Library (cited by [[w.preston-war-council]], 135 n.17). Names: Forrestal, Bundy, Reston.'
