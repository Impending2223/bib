- add:
    entry:
      id: cal.1965-02-09.vietnam-2
      when: Feb. 9
      date: '1965-02-09'
      thread: vietnam-air-war
      also:
      - vietnam
      c: 'Taylor to State, noon: the reprisals of Feb. 7 and 8 "a significant forward step"; the White House statement and
        the strikes "a good foundation for embarking on a graduated reprisal program to bring increasing pressure on the DRV
        to cease its intervention in SVN, as discussed here at some length with Bundy and his party." Jointly with Saigon,
        against military targets and infiltration routes only.'
      n: '[FRUS 1964–68, II, doc. 93](https://history.state.gov/historicaldocuments/frus1964-68v02/d93). [[w.preston-war-council]],
        175. See [[cal.1965-02-07.vietnam-2]]. Names: Taylor, Bundy.'
