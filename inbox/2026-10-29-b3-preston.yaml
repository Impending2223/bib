      when: Jan. 10
      date: '1963-01-10'
      thread: china
      c: 'McCone with Bundy in Bundy''s office, by McCone''s memorandum: the estimate of the Chinese nuclear program. Bundy:
        the President thinks it "probably the most serious problem facing the world today"; nuclear weapons in Chinese hands
        "would so upset the world political scene it would be intolerable to the United States and to the West."'
      n: '[FRUS 1961–63, XXII, doc. 162](https://history.state.gov/historicaldocuments/frus1961-63v22/d162) (editorial note,
