        and the rest of Southeast Asia"; the American organization in the field to be made coherent.'
      n: '[FRUS 1964–68, I, doc. 45](https://history.state.gov/historicaldocuments/frus1964-68v01/d45). [[w.preston-war-council]],
        133. See [[cal.1964-02-14.vietnam]]. Names: Forrestal, McNamara.'
