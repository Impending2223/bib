      id: cal.1961-06-26.berlin-and-vienna
      when: June 26
      date: '1961-06-26'
      thread: berlin-and-vienna
      c: 'Rostow to Kennedy on Berlin: "make Mr. Khrushchev share the burden of making sacrifices to avoid nuclear war"; a
        "divisional probe ... to take and hold a piece of territory in East Germany that Khrushchev may not want to lose";
        tactical nuclear weapons into Berlin "at an appropriate tense moment."'
      n: '[[w.preston-war-council]], 67. To check: Rostow to Kennedy, June 26, 1961, NSF, Country File, Germany, box 81A,
        Kennedy Library (cited by [[w.preston-war-council]], 67 n.38). Names: Rostow, Kennedy, Khrushchev.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
        c: d2af4b37
        rows:
        - 'w.preston-war-council 67: all'
        - 'via w.preston-war-council 67 n.38i: all'
