      c: 'Cooper to Bundy, back from a trip: "What is needed now is more walking and less running. Perhaps a bit of just plain
        sitting would be useful." Quát steadier than his predecessor; the Buddhists for negotiations and withdrawal; a "peace"
        group active in Saigon and the northern provinces.'
      n: '[FRUS 1964–68, II, doc. 173](https://history.state.gov/historicaldocuments/frus1964-68v02/d173). [[w.preston-war-council]],
        187. Names: Chester Cooper, Bundy, Phan Huy Quát.'
      tags:
