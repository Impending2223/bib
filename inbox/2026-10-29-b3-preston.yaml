      thread: vietnam
      also:
      - vietnam-congress
      c: 'Forrestal to Harriman, Bundy and Kaysen, of his lunch with Trần Văn Chương, Saigon''s ambassador: how much the Mansfield
        report counts; American opinion, by Chương''s estimate, "99% against the Diem" government.'
