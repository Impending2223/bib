      date: '1963-02-08'
      thread: vietnam
      c: 'Forrestal to Harriman, "Contacts with Vietnamese Opposition": more contacts in Saigon with the noncommunist opposition,
        for a more independent American position and "alternatives in the event of an accident." Diệm will see the shift;
        "We should face this likelihood squarely and without guilt feelings."'
      n: '[FRUS 1961–63, III, doc. 33](https://history.state.gov/historicaldocuments/frus1961-63v03/d33). [[w.preston-war-council]],
