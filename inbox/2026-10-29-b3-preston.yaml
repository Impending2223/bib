      when: Aug. 6
      date: '1963-08-06'
      thread: vietnam
      also:
      - vietnam-struggle
      c: 'Hilsman to Ball, "Buddhist Problem in Viet-Nam": some easing, Diệm''s broadcast of July 18, the barricades round
