      when: Aug. 2
      date: '1961-08-02'
      thread: vietnam
      c: 'Komer to Rostow, on the Policy Planning Staff''s and Intelligence and Research''s answer to his paper: "they miss
        the point"; "What appears to worry S/P most is the use of US troops." Robert H. Johnson to Rostow the same day: any
        propaganda plan "would have to envisage various sorts of possible military responses."'
      n: '[[w.preston-war-council]], 85, 88. To check: Komer to Rostow, Aug. 2, 1961, NSF, Komer, Vietnam, box 447, Kennedy
        Library (cited by [[w.preston-war-council]], 88 n.35); R. Johnson to Rostow, Aug. 2, 1961, NSF, Country File, Vietnam,
        box 194, Kennedy Library (cited by [[w.preston-war-council]], 85 n.28). See [[cal.1961-05-09.vietnam-2]]. Names: Komer,
        Rostow, Robert H. Johnson.'
