      when: Nov. 16
      date: '1961-11-16'
      thread: vietnam
      c: 'Hilsman to Rusk on Taylor''s recommendations: "the most effective way of meeting a guerrilla threat like that of
        the Viet Cong is not with regular troops," but civic action, intelligence, police work and constabulary-like forces.'
      n: '[FRUS 1961–63, I, doc. 259](https://history.state.gov/historicaldocuments/frus1961-63v01/d259). [[w.preston-war-council]],
