      date: '1961-05-03'
      thread: vietnam
      also:
      - laos
      c: 'Komer to Rostow, the lesson of Laos: "we must insulate such a crisis area from outside intervention before the event
        rather than after"; South Vietnam to be sealed off, the Geneva Accords abrogated, other SEATO troops beside American.'
