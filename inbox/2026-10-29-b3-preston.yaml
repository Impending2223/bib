      when: Dec. 4
      date: '1964-12-04'
      thread: vietnam
      c: 'Thomson to Bundy, against reprisal strikes on the North: the American effort already too military.'
      n: '[[w.preston-war-council]], 164. To check: Thomson to Bundy, Dec. 4, 1964, NSF, Country File, Vietnam, box 11, LBJ
