      id: cal.1962-10-04.vietnam
      when: Oct. 4
      date: '1962-10-04'
      thread: vietnam
      c: 'Forrestal to Bundy, the crop destruction program approved: Kennedy''s "main train of thinking was that you cannot
        say no to your military advisors all the time, and with this I agree"; a "rather high political price for little practical
        return."'
      n: '[[w.preston-war-council]], 108. To check: Forrestal to Bundy, Oct. 4, 1962, NSF, Meetings and Memoranda, Staff Memoranda,
        Forrestal, box 320, Kennedy Library (cited by [[w.preston-war-council]], 108 n.19). Names: Forrestal, Bundy, Kennedy.
        Check: Preston has defoliation approved in August, crop destruction early in October, enlarged in November at McNamara''s
        request; the days not given.'
