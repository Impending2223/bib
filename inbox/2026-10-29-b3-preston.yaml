      when: Aug. 17
      date: '1961-08-17'
      thread: vietnam
      also:
      - laos
      c: 'Rostow to Kennedy, the Geneva talks on Laos stalled: if the Pathet Lao resume the drive on Vientiane, "what follows?
        We must produce quickly a course of action which convinces the other side we are dead serious"; "only American leadership
        as well as American ultimate guarantees can pull these chaps together."'
      n: '[[w.preston-war-council]], 87. To check: Rostow to Kennedy, Aug. 17, 1961, NSF, Regional Security, Southeast Asia,
        box 231, Kennedy Library (cited by [[w.preston-war-council]], 87 n.32). Names: Rostow, Kennedy.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
