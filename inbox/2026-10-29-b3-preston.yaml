- add:
    entry:
      id: cal.1965-01-07.vietnam
      when: Jan. 7
      date: '1965-01-07'
      thread: vietnam
      c: 'Johnson to Taylor, 9:50 p.m., drafted by Bundy, answering his 2052: "We are inclined to adopt a policy of prompt
        and clear reprisal," with joint planning of operations in the South and against the North, "but without present commitment
        as to the timing and scale of Phase II." The dependents out before reprisals begin.'
      n: '[FRUS 1964–68, II, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v02/d19); doc. 18 (the editorial
        note: the drafting). [[w.preston-war-council]], 164. Names: Johnson, Taylor, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:bundy-mcgeorge
      src:
        c: e6519678
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d19: all'
        - 'w.preston-war-council 164: A-B'
        - 'via w.preston-war-council 164 n.16b: A-B'
- add:
    entry:
      id: cal.1965-01-06.vietnam-2
      when: Jan. 6
      date: '1965-01-06'
      thread: vietnam
      c: 'Cooper''s paper on bombing the North: reprisal in kind for major terror, "with or without a stable government in
        Saigon"; attacks on infiltration targets only with one; large-scale bombing not at all. "We should not underestimate
        the risk of bombing the North"; "the war must still be fought and victories achieved in South Vietnam."'
      n: '[FRUS 1964–68, II, doc. 16](https://history.state.gov/historicaldocuments/frus1964-68v02/d16). [[w.preston-war-council]],
        164, 167 (Bundy''s mission). Names: Chester Cooper.'
      tags:
      - name:cooper-chester-l
      src:
        c: '96944deb'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d16: all'
        - 'w.preston-war-council 164: all'
        - 'via w.preston-war-council 164 n.18b: all'
- add:
    entry:
      id: cal.1965-01-09.vietnam
      when: Jan. 9
      date: '1965-01-09'
      thread: vietnam
      c: 'Cooper has Bundy''s approval of targets in the North and of bases in Thailand for the raids. Of one target: "If
        we can really knock it out we will slow down [the] build-up and give a loud and clear signal to Hanoi at the same
        time."'
      n: '[[w.preston-war-council]], 164. To check: Cooper to Bundy, Jan. 9 and Jan. 7, 1965, NSF, Country File, Vietnam,
        box 12, LBJ Library (cited by [[w.preston-war-council]], 164 n.17). Names: Chester Cooper, Bundy.'
      tags:
      - name:cooper-chester-l
      - name:bundy-mcgeorge
      src:
        c: f21ac96d
        rows:
        - 'w.preston-war-council 164: all'
        - 'via w.preston-war-council 164 n.17b: all'
- add:
    entry:
      id: cal.1965-01-14.vietnam
      when: Jan. 14
      date: '1965-01-14'
      thread: vietnam
      c: 'Bundy to Johnson, "Our last exchange with Taylor": Taylor still against withdrawing the dependents at once, for
        fear of tying Saigon to reprisals; Rusk, McNamara and Bundy to propose again, under Rusk''s name, a withdrawal covered
        by a statement of firmness that does not speak of reprisals. A poor week for major decisions.'
      n: '[FRUS 1964–68, II, doc. 26](https://history.state.gov/historicaldocuments/frus1964-68v02/d26). [[w.preston-war-council]],
        165 (Bundy with Cooper on the timing: the next phase could wait). Names: Bundy, Johnson, Taylor, Rusk, McNamara.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:rusk-dean
      - name:mcnamara-robert-s
      src:
