      date: '1963-02-26'
      thread: vietnam
      also:
      - soviet-union
      c: 'Zinchuk of the Soviet embassy with Forrestal floats a joint Soviet-American sponsorship of a neutral Vietnam. Forrestal:
        no shift in American policy; "so long as there was militant subversion from the north it was very hard to think about
        any international action which could be helpful in South Vietnam."'
