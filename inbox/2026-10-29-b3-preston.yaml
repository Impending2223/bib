      date: '1963-11-04'
      thread: vietnam
      c: 'The White House staff meeting, 8 a.m., Bundy presiding: the new government to be recognized in a day or two; the
        Saigonese "threw garlands of roses on the tanks." Bundy deplores the slaying of the brothers, the evidence mounting
        that they were murdered.'
