      date: '1963-02-04'
      thread: vietnam
      c: 'Forrestal to Kennedy: the meeting with Wheeler on Friday "a complete waste of your time for which I apologize";
        his "rosy euphoria" made it unworkable. A quiet campaign, Harriman''s and his, "to develop gradually a more independent
        posture for the U.S. in South Vietnam."'
