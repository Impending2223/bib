      date: '1961-05-04'
      thread: cuba-bay-of-pigs
      c: 'Bundy to Taylor, of the Cuba Study Group: the record of his interview not good enough; his own account. The President
        on taking office had to use the Cuban force in Guatemala or disband it.'
