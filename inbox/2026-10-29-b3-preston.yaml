      when: June 30
      date: '1961-06-30'
      thread: vietnam
      also:
      - south-asia
      c: 'McConaughy to Chatterjee, the Indian chargé: MAAG in Vietnam raised by about 100 because of the Communists'' violations,
        "solely" for training; no disrespect of the Geneva Agreements; it might go higher. No Americans to "take over the
        fighting."'
      n: '[FRUS 1961–63, I, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v01/d79). [[w.preston-war-council]],
        85 (word to the Indians of the American case against Hanoi). Names: McConaughy.'
