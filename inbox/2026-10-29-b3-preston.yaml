        - 'via w.preston-war-council 168 n.27b: A'
- add:
    entry:
      id: cal.1965-01-30.vietnam-2
      when: Jan. 30
      date: '1965-01-30'
      thread: vietnam
      c: 'Bundy to Taylor, 7:41 p.m., before his visit: "I hope we can avoid extended organized briefings"; "The more time
        we can spend in very small groups on these central problems the better." Present directives make a stable government
        "an essential prerequisite for important additional U.S. major action, but we now wonder whether this requirement
        is either realistic or necessary."'
      n: '[FRUS 1964–68, II, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v02/d52). [[w.preston-war-council]],
        168–69. Names: Bundy, Taylor.'
      tags:
      - name:bundy-mcgeorge
      - name:taylor-maxwell
      src:
        c: bfdb796d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d52: all'
        - 'w.preston-war-council 168–69: all'
        - 'via w.preston-war-council 169 n.28b: all'
- add:
    entry:
      id: cal.1965-02-01.vietnam
      when: Feb. 1
      date: '1965-02-01'
      thread: vietnam
      c: 'Bundy to Taylor, 6:58 p.m., exclusive: "I am primarily interested in coming away with a sense of what kind of pressures
        you and your senior subordinates feel can be effectively applied to the VC and Hanoi," without the constraints of
        existing policy; "Do we in fact need a stable government in order to proceed aggressively and effectively with pacification?"'
      n: '[FRUS 1964–68, II, doc. 56](https://history.state.gov/historicaldocuments/frus1964-68v02/d56). [[w.preston-war-council]],
        169. See [[cal.1965-01-30.vietnam-2]]. Names: Bundy, Taylor.'
      tags:
      - name:bundy-mcgeorge
      - name:taylor-maxwell
      src:
        c: '0e712e4a'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d56: all'
        - 'w.preston-war-council 169: all'
        - 'via w.preston-war-council 169 n.28c: all'
