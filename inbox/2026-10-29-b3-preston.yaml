- edit:
    id: cal.1964-05-27.vietnam-2
    base: ebd7c7e0
    set:
      n: '[FRUS 1964–68, XXVII, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v27/d53) (the call; the
        quotations); [Johnson and McGeorge Bundy, 11:24 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-and-office-conversation-may-27),
        Conversation WH6405.10, Citation #3522 (Miller Center). [[w.logevall-choosing-war]], 143, 145 (Bundy on Lippmann,
        143; "What the hell is Vietnam worth to me?" 145). Made public: FRUS 1964–68, XXVII (2000). [[w.mann-grand-delusion]],
        330–31 (the words, after Russell''s call). [[w.preston-war-council]], 146 (Bundy on Forrestal''s memorandum). To check:
        [[w.taking-charge]], 370–72 (cited by [[w.mann-grand-delusion]], 331 n.30). Check: Logevall, 143, has the call at
        11:30. See [[cal.1964-05-27.vietnam]]. Names: Johnson, McGeorge Bundy, Lippmann, Mansfield. Check: Preston, 146, gives
        the call no hour; taken as this one.'
      src:
        c: '737a32ca'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v27/d53: A-D'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-mcgeorge-bundy-and-office-conversation-may-27:
          all'
        - 'w.logevall-choosing-war 143: D'
        - 'via w.logevall-choosing-war 143 n.23: D'
        - 'w.logevall-choosing-war 145: C'
        - 'via w.logevall-choosing-war 145 n.31a: C'
        - 'w.mann-grand-delusion 330–31: A-B, E-F'
        - 'w.preston-war-council 146: G'
        - 'via w.preston-war-council 146 n.41a: G'
      c: 'Johnson to McGeorge Bundy, by telephone, 11:24 a.m.: "it looks like to me that we''re getting into another Korea";
        "I don''t think it''s worth fighting for and I don''t think we can get out." "What in the hell is Vietnam worth to
        me?" Bundy on Lippmann: a "diplomatic structure" within which South Vietnam goes under Hanoi''s control. Mansfield''s
        memorandum of May 26, read that morning, "just milquetoast as it can be. He''s got no spine at all." Bundy: "It''s
        an awful mess." Bundy: "I''ve got an extremely good memorandum from Forrestal"; ready "to move a little bit, mainly
        the Vietnamese."'
- add:
