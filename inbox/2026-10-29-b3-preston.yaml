      when: Nov. 12
      date: '1961-11-12'
      thread: vietnam
      also:
      - laos
      c: 'Harriman to Kennedy, his draft memorandum of Nov. 11 attached: a "diplomatic-political course" in Vietnam, to avoid
        heavy military commitments and keep South Vietnam; the Laos settlement first. Rusk''s comment: "It is a matter of
        timing."'
      n: '[FRUS 1961–63, I, doc. 239](https://history.state.gov/historicaldocuments/frus1961-63v01/d239). [[w.preston-war-council]],
        94. Names: Harriman, Kennedy, Rusk. Check: Preston has Harriman to Kennedy "a few days" after Nov. 9, from Kahin,
        136 (n.55).'
