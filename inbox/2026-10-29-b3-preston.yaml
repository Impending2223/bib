- add:
    entry:
      id: cal.1963-09-10.china
      when: Sept. 10
      date: '1963-09-10'
      thread: china
      c: 'Chiang Ching-kuo with Bundy, Cline present: the test ban treaty alone will not solve the problems. Bundy: the United
        States puts a high priority on weakening the Chinese Communist regime, "particularly its nuclear growth," and will
        examine any possibilities advanced; but its aversion to "triggering a major conflict."'
      n: '[FRUS 1961–63, XXII, doc. 185](https://history.state.gov/historicaldocuments/frus1961-63v22/d185) (draft minutes).
        [[w.preston-war-council]], 61–62. Names: Bundy. Check: Preston, 62, quotes Bundy, the "United States is very interested
        in whether something could be planned"; the minutes FRUS prints do not have those words (Preston''s note, 61 n.26,
        cites Burr and Richardson, 72–73).'
      tags:
      - name:bundy-mcgeorge
      src:
