      id: cal.1965-01-31.vietnam
      when: Jan. 31
      date: '1965-01-31'
      thread: vietnam
      c: 'Taylor to State: "a DRV attack on a DeSoto patrol followed by immediate strong and effective U.S. retaliation would
        offer a priceless advantage to our cause here. I hope that in approving the February 3 mission that this thought is
        uppermost in our minds." The South Vietnamese air force not to be in the reprisal for now.'
      n: '[FRUS 1964–68, II, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v02/d53). [[w.preston-war-council]],
        168 (the Bundy mission). Check: FRUS''s "February 3 mission" is the De Soto patrol; Preston reads it as Bundy''s.
        Names: Taylor.'
      tags:
      - name:taylor-maxwell
      src:
        c: '98542421'
        rows:
