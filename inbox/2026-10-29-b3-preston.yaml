      when: June
      date: '1961-06'
      thread: vietnam
      also:
      - defense
      c: 'Rostow at Fort Bragg, N.C., the speech approved by Kennedy: guerrilla warfare "a product of that revolutionary process
        and the Communist effort and intent to exploit it"; the Communists "the scavengers of the modernization process."'
      n: '[[w.department-of-state-bulletin]], [Aug. 7, 1961, 233](https://archive.org/details/departmentofstat451961unit/page/233/mode/1up)
        ("Guerrilla Warfare in the Underdeveloped Areas"). [[w.preston-war-council]], 77. Names: Rostow, Kennedy. Check: the
