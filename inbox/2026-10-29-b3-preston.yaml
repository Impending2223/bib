      when: Aug. 15
      date: '1961-08-15'
      thread: foreign-aid
      c: 'Rostow''s paper on the new nations, after State''s draft: "each nation will be permitted to fashion, out of its
        own culture and its own ambitions, the kind of modern society it wants"; the United States "prepared to gamble" that
        they will choose "a democratic, open society."'
      n: '[[w.preston-war-council]], 77. To check: Rostow paper, Aug. 15, 1961, NSF, Meetings and Memoranda, Staff Memoranda,
