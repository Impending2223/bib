      thread: vietnam
      also:
      - vietnam-johnson-asia
      c: 'Rostow to Kennedy, the election in Vietnam over: time for "gearing up the whole VietNam operation." A full-time
        "back-stop man" in Washington; Nolting briefed by the President; "a possible visit to VietNam in the near future by
        the Vice President"; Thuần to the United States.'
