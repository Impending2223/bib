- add:
    entry:
      id: cal.1961-11-20.berlin-and-vienna
      when: Nov. 20
      date: '1961-11-20'
      thread: berlin-and-vienna
      c: '"The Need for Negotiations," Bundy to Kennedy: Kissinger believes the Germans do not want them; without them a separate
        treaty, salami tactics on the access routes, division among the allies, "possible war, conventional or nuclear." The
        negotiations to be framed for the widest support, not a restatement of old positions.'
      n: '[FRUS 1961–63, XIV, doc. 215](https://history.state.gov/historicaldocuments/frus1961-63v14/d215). [[w.preston-war-council]],
        68–69. Names: Bundy, Kennedy, Kissinger.'
