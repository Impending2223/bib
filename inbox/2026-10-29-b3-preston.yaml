      when: Jan. 30
      date: '1961-01-30'
      thread: transition-and-staff-nsc
      c: 'Bundy to Kennedy, for a staff of policy men under the Special Assistant: State and Defense advise well, but "the
        matter is of literally life-and-death importance, and it also has plenty of political dynamite in it, so that the
        more advice you get, the better off you will be."'
