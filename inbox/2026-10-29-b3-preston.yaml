      when: Nov. 8
      date: '1962-11-08'
      thread: testing
      also:
      - china
      c: 'Bundy to Kennedy, "Test Ban: Black Boxes, Khrushchev, and China": the British to say the black boxes reduce but
        do not end on-site inspection; Kuznetsov''s offer of three on Soviet soil. Raise with Khrushchev the Chinese and a
        test ban: "A Red China nuclear presence is the greatest single threat to the status quo over the next few years."'
      n: '[FRUS 1961–63, VII, doc. 243](https://history.state.gov/historicaldocuments/frus1961-63v07/d243). [[w.preston-war-council]],
