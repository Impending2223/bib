      when: Aug. 23
      date: '1962-08-23'
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Bundy to Sorensen, before his meeting with Dobrynin: say "it would be a most dangerous business to confuse our calmness
        and good manners with any weakening of determination whatsoever"; any move against vital interests in Berlin "met
        by appropriate, prompt, and energetic responses." Not in tones of threat.'
      n: '[FRUS 1961–63, XV, doc. 103](https://history.state.gov/historicaldocuments/frus1961-63v15/d103). [[w.preston-war-council]],
