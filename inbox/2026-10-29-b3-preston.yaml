      when: Apr. 28
      date: '1964-04-28'
      thread: vietnam
      c: 'Forrestal to Bundy, with Sullivan''s status report on Lodge''s proposals (probes into the Laos corridor, hot pursuit
        into Cambodia, raids on the North for terror against Americans), now in the scenario with the Chiefs: "almost any
        of the actions suggested by Lodge, but not yet implemented, could start a chain of escalation for which we are not
        yet prepared." A lunch on future moves.'
