- edit:
    id: cal.1965-02-08.vietnam-congress-3
    base: '847f4fe7'
    set:
      n: 'FRUS 1964–68, II, docs. [87](https://history.state.gov/historicaldocuments/frus1964-68v02/d87) (summary notes);
        [88](https://history.state.gov/historicaldocuments/frus1964-68v02/d88) (McCone''s memorandum for the record). [[w.mann-grand-delusion]],
        398 (Johnson''s words). [[w.preston-war-council]], 179 (Dirksen and Bundy; Bundy''s report of the trip). See [[cal.1965-02-07.vietnam-congress]].
        Names: Mansfield, Dirksen, McCormack, Ford, Johnson, McNamara.'
      src:
        c: '1e6df038'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d87: A-E'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d88: A, F-G'
        - 'w.mann-grand-delusion 398: B-E'
        - 'via w.mann-grand-delusion 398 n.25: B-E'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d87: F'
        - 'w.preston-war-council 179: F'
        - 'via w.preston-war-council 179 n.51a: F'
      c: 'The 547th NSC, 10:30 a.m., the leaders, Mansfield, Dirksen, McCormack and Ford, joining. Johnson: "We are now ready
        to return to our program of pushing forward in an effort to defeat North Vietnamese aggression without escalating
        the war." The Congressional Resolution and his powers enough; "the views of a few Senators could not control his actions";
        he will use it "carefully but effectively." Ford: more money and men? McNamara: "not in the initial stages." Dirksen
        asks what a withdrawal would mean; Bundy: the consequences in Southeast Asia very large, elsewhere "even to the extent
        of affecting the morale in Berlin."'
- edit:
    id: cal.1965-02-09.vietnam
    base: '61c3747d'
    set:
