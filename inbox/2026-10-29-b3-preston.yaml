      when: May 26
      date: '1964-05-26'
      thread: vietnam-congress
      also:
      - republican-party-congress
      - vietnam
      c: 'Johnson, Rusk, McNamara, McCone and Bundy with eight Republican Senators, 4:35–5:23 p.m.: Dirksen, Kuchel, Saltonstall,
        Young, Mundt, Beall, Carlson and Williams. Bundy''s talking points for the President: Rusk on Laos and Cambodia; McNamara''s
        report, brought up to date by Forrestal; McCone''s forecast; "what is at stake overall is whether the Communists will
        take over Southeast Asia."'
      n: '[FRUS 1964–68, I, doc. 179](https://history.state.gov/historicaldocuments/frus1964-68v01/d179) (the talking points;
        the meeting and those at it, n.2; no record of it found). [[w.preston-war-council]], 146 (Bundy''s proposal). See
        [[cal.1964-05-26.vietnam-2]]. Names: Johnson, Rusk, McNamara, McCone, Bundy, Dirksen, Kuchel, Saltonstall, Young,
        Mundt, Beall, Carlson, Williams, Forrestal.'
