      date: '1961-05-30'
      thread: vietnam-johnson-asia
      c: 'Bundy to Johnson on his trip: "the important effect of your mission in arresting the decline of the situation and
        setting the stage for action ... especially in the most critical areas of South Vietnam and Thailand."'
