      date: '1961-05-15'
      thread: vietnam-johnson-asia
      c: 'Nolting by cable on the Vice President''s visit: its purposes, to reassure Diệm and "to reassure the Vietnamese
        people" that the United States "will continue to stand firmly with them," both "excellently served"; "Diem''s confidence
        in US has been greatly increased by visit."'
