- add:
    entry:
      id: cal.1961-08-15.berlin-and-vienna
      when: Aug. 15
      date: '1961-08-15'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 'The *New York Times*, from Frankel, a "highly qualified" source: only "extreme counter-measures" would bring down
        the wall; "These would probably lead to war, and are not justified so long as the West is assured access to West Berlin."
        The source Bundy, by Preston''s account.'
      n: '[[w.preston-war-council]], 68. To check: *New York Times*, Aug. 15, 1961, 1, 9 (cited by [[w.preston-war-council]],
        68 n.40). See [[cal.1961-08-14.berlin-and-vienna]]. Names: Bundy.'
      tags:
      - name:bundy-mcgeorge
      src:
        c: d0bda238
        rows:
        - 'w.preston-war-council 68: all'
- add:
    entry:
      id: cal.1962-08-16.cuba
      when: Aug. 16
      date: '1962-08-16'
      thread: cuba
      c: 'The Special Group (Augmented) on Mongoose, by McCone''s memorandum: Guantánamo not to be used; Bundy''s "strong
        reservations" on Navy submarines, some on overflights; Bundy raises the "noise level," McCone that the planned operations
        would raise it a great deal. "In general the meeting was unsatisfactory."'
      n: '[FRUS 1961–63, X, doc. 378](https://history.state.gov/historicaldocuments/frus1961-63v10/d378). [[w.preston-war-council]],
        64 (the "noise level"). Names: McCone, Bundy, Lemnitzer.'
      tags:
      - name:mccone-john-a
      - name:bundy-mcgeorge
      - name:lemnitzer-lyman-l
