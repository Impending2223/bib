        Conversation WH6402-07-1911 (Miller Center); [[w.taking-charge]], 226 (cited by [[w.preston-war-council]], 138 n.24,
        140 n.27). See [[cal.1964-02-01.vietnam-congress]]. Names: Johnson, Bundy, Mansfield.'
