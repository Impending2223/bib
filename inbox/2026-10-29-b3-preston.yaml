- add:
    entry:
      id: cal.1963-11-01.vietnam-2
      when: Nov. 1
      date: '1963-11-01'
      thread: vietnam
      c: 'The White House staff meeting, the coup under way: the army behind the generals but for the palace guard. Forrestal:
        "a well executed coup, much better than anyone would have thought possible." Bundy: Diệm holding out; "no one wanted
        to go in for the kill." On recognition, Bundy: "an example of the acceptable type of military coup."'
      n: '[FRUS 1961–63, IV, doc. 263](https://history.state.gov/historicaldocuments/frus1961-63v04/d263). [[w.preston-war-council]],
        127–28. See [[cal.1963-11-01.vietnam]]. Names: Forrestal, Bundy, Ngô Đình Diệm.'
      tags:
