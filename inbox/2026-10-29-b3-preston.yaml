      when: Jan. 4
      date: '1965-01-04'
      thread: vietnam-force-levels
      also:
      - vietnam
      c: 'Bundy to Johnson, with a report on Vietnam: "our personnel policies in Vietnam are wrong"; the Army runs it "in
        a regulation way," too much staff and rotation, "not enough action." McNamara against larger American forces, but
        more responsive than before to a plan for volunteer fighting forces.'
      n: '[FRUS 1964–68, II, doc. 2](https://history.state.gov/historicaldocuments/frus1964-68v02/d2). Names: Bundy, Johnson,
        McNamara.'
