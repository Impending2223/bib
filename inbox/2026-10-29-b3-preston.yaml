        394–95. Check: Mann dates the meeting the evening of Feb. 7. [[w.preston-war-council]], 173 (Ball; Johnson''s wait
        for Saigon''s recommendation). See [[cal.1965-02-07.vietnam]]. Names: McCormack, Mansfield, Johnson.'
      src:
        c: '28b435b2'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d76: A-C, H'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d77: A, D-H'
