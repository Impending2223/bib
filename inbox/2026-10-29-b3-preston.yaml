      c: 'Rusk''s office, noon: Rusk, McNamara, U. Alexis Johnson, Robert Kennedy, McCone, Taylor, Lemnitzer and Bundy on
        the latest intelligence from Cuba, by McCone''s memorandum for the file. Blockades discussed; State and Bundy for
        the White House see Cuba tied to Berlin: "a blockade of Cuba would automatically bring about a blockade of Berlin."'
      n: '[FRUS 1961–63, X, doc. 382](https://history.state.gov/historicaldocuments/frus1961-63v10/d382). [[w.preston-war-council]],
