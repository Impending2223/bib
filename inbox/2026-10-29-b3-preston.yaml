      c: 'Galbraith puts his doubts on Taylor''s report to Kennedy in writing. Rostow''s answer, at the President''s asking:
        "If Ken is advocating that we disengage promptly from Vietnam and let Southeast Asia go, I think he should say so";
        Galbraith "grossly underestimated the military significance of the infiltration process."'
      n: '[[w.preston-war-council]], 94–95. To check: Galbraith to Kennedy, Nov. 13, 1961, and Rostow to Kennedy, Nov. 13,
        1961, NSF, Country File, Vietnam, box 195, Kennedy Library (cited by [[w.preston-war-council]], 95 n.57). Names: Galbraith,
        Kennedy, Rostow.'
      tags:
      - name:galbraith-john-kenneth
      - name:kennedy-john-f
