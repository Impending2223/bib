      date: '1961-11-12'
      thread: vietnam
      also:
      - laos
      c: 'Harriman to Kennedy, his draft memorandum of Nov. 11 attached: a "diplomatic-political course" in Vietnam, to avoid
        heavy military commitments and keep South Vietnam; the Laos settlement first. Rusk''s comment: "It is a matter of
