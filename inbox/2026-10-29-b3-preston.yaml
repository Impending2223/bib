      when: Feb. 19
      date: '1965-02-19'
      thread: vietnam
      c: 'Bundy to Johnson: "The pressure for negotiations is coming mostly from people who simply do not understand what
        that word means in Asian ears right now. If the U.S. proposes negotiations or even indicates a desire for them, the
        word in Saigon will be that we are getting out."'
      n: '[[w.preston-war-council]], 188. To check: Bundy to Johnson, Feb. 19, 1965, NSF, Memos to the President, Bundy, box
        2, LBJ Library (cited by [[w.preston-war-council]], 188 n.75). See [[cal.1965-02-19.vietnam-3]]. Names: Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
