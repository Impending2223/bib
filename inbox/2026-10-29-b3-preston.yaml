      when: Jan. 15
      date: '1962-01-15'
      thread: testing
      c: 'Kaysen to Kennedy, "Atmospheric Test Ban Treaty": a treaty offered to the Soviets, the "supreme effort" of the State
        of the Union. Refused, the spring tests stand better in public; signed, "a politically significant pause in the arms
        race."'
      n: '[FRUS 1961–63, VII, doc. 120](https://history.state.gov/historicaldocuments/frus1961-63v07/d120). [[w.preston-war-council]],
