- add:
    entry:
      id: cal.1965-02-04.vietnam
      when: Feb. 4
      date: '1965-02-04'
      thread: vietnam
      c: 'The Bundy mission in Saigon, by Air Force 3, in the morning: Bundy, Cooper, McNaughton, Unger, Goodpaster and Rogers.
        Bundy to McCone, 7:10 p.m.: no member of the country team thinks deterioration can be stopped without "a reasonably
        effective and stable government"; "Getting it is something else again." "The current situation among non-Communists
        forces gives all the appearances of a civil war within a civil war."'
      n: '[FRUS 1964–68, II, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v02/d66) (the telegram). [[w.preston-war-council]],
        170–72. Names: Bundy, Chester Cooper, McNaughton, Unger, Goodpaster, McCone.'
