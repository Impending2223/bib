        - 'w.preston-war-council 62: A-B'
        - 'via w.preston-war-council 62 n.28: all'
- add:
    entry:
      id: cal.1964-11-23.china
      when: Nov. 23
      date: '1964-11-23'
      thread: china
      also:
      - vietnam
      c: 'Komer to Bundy, "ChiRep Thoughts": the question no longer whether to retreat from the rigid China policy but how
        and when. "If we take a tougher stance in VN ... it can hardly be taken as a sign of undue weakness to be flexible
        on ChiRep."'
      n: '[FRUS 1964–68, XXX, doc. 68](https://history.state.gov/historicaldocuments/frus1964-68v30/d68). [[w.preston-war-council]],
