      when: Nov. 23
      date: '1964-11-23'
      thread: china
      also:
      - vietnam
      c: 'Komer to Bundy, "ChiRep Thoughts": the question no longer whether to retreat from the rigid China policy but how
        and when. "If we take a tougher stance in VN ... it can hardly be taken as a sign of undue weakness to be flexible
        on ChiRep."'
