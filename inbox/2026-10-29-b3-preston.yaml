      when: Nov. 22
      date: '1963-11-22'
      thread: vietnam
      also:
      - succession
      c: 'Forrestal from Saigon to Bundy, the President shot: "Everyone here shattered and judgments difficult to make"; he
        would come home. Bundy''s reply: "I know how you loved the President," but the country''s interest and the President''s
        own wish that he finish the visit; "Carry the flag till then."'
      n: '[[w.preston-war-council]], 129. To check: Forrestal (Saigon) to Bundy, and Bundy to Forrestal (Saigon), Nov. 22,
        1963, NSF, Country File, Vietnam, box 202, Kennedy Library (cited by [[w.preston-war-council]], 129 nn.1–2). Names:
        Forrestal, Bundy, John F. Kennedy.'
