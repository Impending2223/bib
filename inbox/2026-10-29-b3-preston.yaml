    entry:
      id: cal.1961-10-16.vietnam
      when: Oct. 16
      date: '1961-10-16'
      thread: vietnam
      c: 'Honolulu, the mission on its way. Rostow to Taylor: CINCPAC to prepare within two weeks a plan for "limited but
        systematic harassment by U.S. naval and air power of North VietNam," hit-and-run landings on its bases among it.'
      n: '[FRUS 1961–63, I, doc. 170](https://history.state.gov/historicaldocuments/frus1961-63v01/d170). [[w.preston-war-council]],
