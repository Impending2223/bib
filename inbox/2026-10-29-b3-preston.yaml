      thread: china
      also:
      - europe-and-the-alliance
      c: 'Nassau, by the British notes: Bundy to Home, China''s nuclear ambitions "the most dangerous element"; it "increasingly
        clear" that the Americans and the Soviets "had a common interest in this field."'
