- add:
    entry:
      id: cal.1961-04-20.defense
      when: Apr. 20
      date: '1961-04-20'
      thread: defense
      c: 'Raskin of the NSC staff to Bundy: "The policy of military deterrence has caused us to lose the initiative in foreign
        policy"; for "unilateral acts of a tension reducing nature," but "we cannot appear as the ''paper tiger.''"'
      n: '[[w.preston-war-council]], 70–71. To check: Raskin to Bundy, Apr. 20, 1961, NSF, Meetings and Memoranda, Staff Memoranda,
        Raskin, box 323, Kennedy Library (cited by [[w.preston-war-council]], 71 n.46). Names: Raskin, Bundy.'
