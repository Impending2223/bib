- add:
    entry:
      id: cal.1961-08-17.vietnam
      when: Aug. 17
      date: '1961-08-17'
      thread: vietnam
      also:
      - laos
      c: 'Rostow to Kennedy, the Geneva talks on Laos stalled: if the Pathet Lao resume the drive on Vientiane, "what follows?
        We must produce quickly a course of action which convinces the other side we are dead serious"; "only American leadership
        as well as American ultimate guarantees can pull these chaps together."'
      n: '[[w.preston-war-council]], 87. To check: Rostow to Kennedy, Aug. 17, 1961, NSF, Regional Security, Southeast Asia,
        box 231, Kennedy Library (cited by [[w.preston-war-council]], 87 n.32). Names: Rostow, Kennedy.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
        c: '4b7435c2'
        rows:
        - 'w.preston-war-council 87: all'
        - 'via w.preston-war-council 87 n.32: all'
- add:
    entry:
      id: cal.1961-08-25.vietnam
      when: Aug. 25
      date: '1961-08-25'
      thread: vietnam
      c: 'Robert H. Johnson to Bundy, on the task force''s August report on Vietnam, written mostly by Rostow, Komer''s recommendations
        in it: Rusk and Harriman against it; to be redrafted with more weight on negotiation, the Geneva talks on Laos among
        them.'
      n: '[[w.preston-war-council]], 88. To check: R. Johnson to Bundy, Aug. 25, 1961, NSF, Regional Security, Southeast Asia,
        box 231, Kennedy Library (cited by [[w.preston-war-council]], 88 n.35). Names: Robert H. Johnson, Bundy, Rostow, Komer,
        Rusk, Harriman. Check: what the memorandum itself says; Preston''s note gives it with Komer''s of Aug. 2 for the passage.'
      tags:
      - name:johnson-robert-h
      - name:bundy-mcgeorge
      - name:rostow-walt-w
      - name:komer-robert-w
      - name:rusk-dean
      - name:harriman-w-averell
      src:
        c: '1136fa91'
        rows:
        - 'w.preston-war-council 88: all'
        - 'via w.preston-war-council 88 n.35b: all'
- add:
    entry:
      id: cal.1961-10-05.vietnam
      when: Oct. 5
      date: '1961-10-05'
      thread: vietnam
      also:
      - laos
      c: 'Rostow to Kennedy: direct word to the Soviets that subversion in South Vietnam must stop; the case against Hanoi
        made public; American and allied troops on the South''s borders. "For us the gut issue as I see it is this: We are
        deeply committed in Viet-Nam; if the situation deteriorates, we will have to go in; the situation is, in fact, actively
        deteriorating; if we go in now, the costs human and otherwise are likely to be less than if we wait."'
      n: '[FRUS 1961–63, XXIV, doc. 195](https://history.state.gov/historicaldocuments/frus1961-63v24/d195). [[w.preston-war-council]],
        87–88. Names: Rostow, Kennedy.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
        c: '95b465e3'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d195: all'
        - 'w.preston-war-council 87–88: all'
        - 'via w.preston-war-council 88 n.33: all'
- add:
    entry:
      id: cal.1961-10-05.vietnam-2
      when: Oct. 5
      date: '1961-10-05'
      thread: vietnam
      also:
      - laos
      c: 'Bowles to Rusk, "The Situation in Southeast Asia": beyond any Laos agreement, the balance in Southeast Asia deteriorating.
        "A direct military response to increased Communist pressure has the supreme disadvantage of involving our prestige
        and power in a remote area under the most adverse circumstances"; a political approach, the neutrality of the region,
        instead.'
      n: '[FRUS 1961–63, I, doc. 145](https://history.state.gov/historicaldocuments/frus1961-63v01/d145). [[w.preston-war-council]],
        93. Names: Bowles, Rusk.'
      tags:
      - name:bowles-chester
      - name:rusk-dean
      src:
        c: bd7fd6d5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d145: all'
        - 'w.preston-war-council 93: all'
        - 'via w.preston-war-council 93 n.52: all'
- add:
    entry:
      id: cal.1961-10-05.intelligence
      when: Oct. 5
      date: '1961-10-05'
      thread: intelligence
      also:
      - vietnam
      c: 'Sherman Kent of the CIA sends Rostow an intelligence summary: the "Communist Bloc probably views the guerrilla and
        subversive campaigns in Laos and South Vietnam as two parts of a single broad political-military strategy, and of
        the two, considers South Vietnam as the more significant prize."'
      n: '[[w.preston-war-council]], 90. To check: CIA Special National Intelligence Estimate, Oct. 5, 1961, and Kent to Rostow,
        Oct. 5, 1961, NSF, Country File, Vietnam, box 194, Kennedy Library (cited by [[w.preston-war-council]], 90 n.43).
        Names: Rostow.'
      tags:
      - name:rostow-walt-w
      src:
        c: aeefefab
        rows:
        - 'w.preston-war-council 90: all'
        - 'via w.preston-war-council 90 n.43a: all'
        - 'via w.preston-war-council 90 n.43b: all'
