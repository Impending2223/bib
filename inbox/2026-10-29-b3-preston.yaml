      id: cal.1965-02-06.vietnam-2
      when: Feb. 6
      date: '1965-02-06'
      thread: vietnam
      c: 'Bundy with Khánh, by Taylor''s report: Washington "willing to consider appropriate means for bringing pressure on
        North Vietnam," but only in "frank and loyal partnership with a stable and reasonably popular" government; strikes
        on the North only as they serve "winning the war in the South"; the President''s "determination to continue to assist
        Vietnam."'
      n: '[[w.preston-war-council]], 172. To check: Taylor to Rusk, Feb. 6, 1965, NSF, Country File, Vietnam, box 13, LBJ
        Library, and Taylor to Rusk, Feb. 6, 1965, FRUS 1964–68, II, 153–54 (cited by [[w.preston-war-council]], 172 n.35).
        Names: Bundy, Nguyễn Khánh, Taylor. Check: the day of the talk.'
      tags:
