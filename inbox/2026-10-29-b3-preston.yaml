      when: May 17
      date: '1963-05-17'
      thread: china
      also:
      - soviet-union
      c: 'Bundy and Dobrynin at lunch, Dobrynin before going home on consultation. Bundy, "an entirely personal suggestion":
        China''s nuclear posture "a matter of real common interest to us," on which the President thinks "a quite private
        and serious exchange of views" useful. Dobrynin answers with NATO''s nuclear plans.'
      n: '[FRUS 1961–63, V, doc. 322](https://history.state.gov/historicaldocuments/frus1961-63v05/d322). [[w.preston-war-council]],
