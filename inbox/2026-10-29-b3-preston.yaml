      when: May 4
      date: '1961-05-04'
      thread: vietnam
      c: 'Komer to Bundy, "Putting US Troops into Vietnam": South Vietnam to be sealed off "to deter another Laos"; any troops,
        or more MAAG, a breach of the Geneva Accords; "as a ''half-way house,''" Diệm to abrogate them before the conference
        on Laos.'
      n: '[FRUS 1961–63, I, doc. 44](https://history.state.gov/historicaldocuments/frus1961-63v01/d44). [[w.preston-war-council]],
        81. See [[cal.1961-05-03.vietnam]]. Names: Komer, Bundy, Ngô Đình Diệm.'
