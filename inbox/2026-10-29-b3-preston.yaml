- add:
    entry:
      id: cal.1965-02-03.vietnam-2
      when: Feb. 3
      date: '1965-02-03'
      thread: vietnam
      c: 'Taylor to Bundy, before his arrival: "you may be arriving just in time to witness some very important governmental
        developments"; high on his agenda, "Can [Washington] do business with a Khanh government? We shall expect you to defend
        the affirmative as we will be on the side of the negative."'
      n: '[[w.preston-war-council]], 171. To check: Taylor to Bundy, Feb. 3, 1965, Westmoreland Papers, box 5, folder 13,
        LBJ Library (cited by [[w.preston-war-council]], 171 n.34). Names: Taylor, Bundy, Nguyễn Khánh.'
