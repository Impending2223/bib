      date: '1962-07-20'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'Bundy to Kennedy, on NATO''s contingency plans for Berlin: General Gray of the Joint Staff had spoken of a "pause"
        of some 60 days before a military response; the time between a blockage of access and hostilities, Phase II of NSAM
        109, is "not a pause at all," but for diplomacy, backed by military and economic moves.'
      n: '[FRUS 1961–63, XV, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v15/d80). [[w.preston-war-council]],
        70. Names: Bundy, Kennedy.'
