- add:
    entry:
      id: cal.1965-02-07.vietnam-3
      when: Feb. 7
      date: '1965-02-07'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'McNamara''s press conference on Pleiku: "I think it was a very clear challenge and test of our political purpose
        and strength of will." William Bundy to the SEATO ambassadors, by Harlech''s report: the North''s action "intended
        as a clear test of will," calling for "urgent and appropriate retaliatory action."'
      n: '[[w.preston-war-council]], 173. To check: McNamara news conference, Feb. 7, 1965, NSF, Country File, Vietnam, box
        13, LBJ Library; Harlech (Washington) to London, Feb. 7, 1965, FO 371/180594, Public Record Office (cited by [[w.preston-war-council]],
        173 n.37). See [[cal.1965-02-07.vietnam]]. Names: McNamara, William Bundy, Ormsby-Gore.'
      tags:
      - name:mcnamara-robert-s
      - name:bundy-william
      - name:ormsby-gore-david
      src:
        c: ddf85ec6
        rows:
        - 'w.preston-war-council 173: all'
        - 'via w.preston-war-council 173 n.37b: A'
        - 'via w.preston-war-council 173 n.37e: B'
- add:
    entry:
      id: cal.1965-02-08.vietnam-2
      when: Feb. 8
      date: '1965-02-08'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Bundy and Reedy''s background briefing at the White House, the mission home the night before. Bundy: "no one in
        South Vietnam ... is in the smallest doubt as to where the primary impetus, impulse, power and direction for the efforts
        of the Communists in the south is coming from"; "the month of January has probably been the most successful in the
        entire war."'
      n: '[FRUS 1964–68, II, doc. 83](https://history.state.gov/historicaldocuments/frus1964-68v02/d83) (the editorial note,
        quoting the transcript on the mission''s day). [[w.preston-war-council]], 173, 183. To check: Bundy press briefing,
        Feb. 8, 1965, NSF, Country File, Vietnam, box 13, LBJ Library (cited by [[w.preston-war-council]], 173 n.37, 183 n.62);
        *Washington Post*, Feb. 18, 1965, A20 (the editorial; cited by [[w.preston-war-council]], 183 n.62). Names: Bundy,
        Reedy.'
      tags:
      - name:bundy-mcgeorge
      - name:reedy-george-e
      src:
        c: bfe13769
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d83: A'
        - 'w.preston-war-council 173: B'
        - 'w.preston-war-council 183: C'
        - 'via w.preston-war-council 173 n.37d: B'
        - 'via w.preston-war-council 183 n.62: C'
- add:
    entry:
      id: cal.1965-02-07.vietnam-4
      when: Feb. 7
      date: '1965-02-07'
      thread: vietnam-air-war
      also:
      - vietnam
      c: 'McNaughton from Saigon to McNamara and Vance: the "theory of a graduated reprisal program," worked out with Bundy
        and talked over with Taylor and Westmoreland, "a measured, controlled sequence of actions against the DRV"; "Not much
        of a government is required for [Saigon] to play its role." Sharp to the Joint Chiefs: "Now that we have retaliated
        for [the] attack on Pleiku we should take this opportunity to step up, on a continuing basis, military pressure against
        the DRV."'
      n: '[[w.preston-war-council]], 174. To check: McNaughton to McNamara and Vance, Feb. 7, 1965, FRUS 1964–68, II, 165–66;
        Sharp to the Joint Chiefs, Feb. 7, 1965, NSF, Country File, Vietnam, box 13, LBJ Library (cited by [[w.preston-war-council]],
        174 nn.41–42). Names: McNaughton, McNamara, Vance, Bundy, Taylor, Westmoreland, Sharp.'
      tags:
      - name:mcnaughton-john-t
      - name:mcnamara-robert-s
      - name:vance-cyrus
      - name:bundy-mcgeorge
      - name:taylor-maxwell
      - name:westmoreland-william
      - name:sharp-u-s-grant
      src:
        c: c6595418
        rows:
