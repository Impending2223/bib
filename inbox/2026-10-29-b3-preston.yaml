      date: '1961-11-14'
      thread: vietnam
      c: 'Robert H. Johnson to Rostow on the draft action memorandum of Nov. 13: "I fear that we are losing a strategic moment
        for the introduction of U.S. troop units"; "A plate glass window on the 17th parallel or a flood relief task force
        could make a great political difference."'
