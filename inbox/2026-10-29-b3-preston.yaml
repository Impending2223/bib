- add:
    entry:
      id: cal.1961-06-22.vietnam
      when: June 22
      date: '1961-06-22'
      thread: vietnam
      c: 'The Special Group (Counterinsurgency). Bundy, over State''s objections: "we are engaged in support of an all out
        civil war"; the CIA''s overflights to drop agents for intelligence or sabotage needed.'
      n: '[[w.preston-war-council]], 85. To check: minutes of meeting, June 22, 1961, NSF, Meetings and Memoranda, Special
        Group (CI), box 319, Kennedy Library (cited by [[w.preston-war-council]], 85 n.27). Names: Bundy.'
