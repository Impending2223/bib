        earlier); [doc. 282](https://history.state.gov/historicaldocuments/frus1961-63v03/d282) (Krulak''s record). [[w.miller-misalliance]],
        290–91 (the drafting, Harriman, Ball on the golf course, Kennedy by telephone from Cape Cod, the terms; not who was
        away); [[w.gibbons-u-s-government-and]], II, 148–50; [[w.schlesinger-robert-kennedy-and-his]], 712 (the drafters;
        the President at Hyannis Port); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 286 (the cable, its drafters and terms;
        Rusk and McNamara away); [[w.schulimson-joint-chiefs-of-staff]], 333–336 (the drafting and approval); [[w.futrell-united-states-air-force]],
        187 (the cable, drafted and cleared by telephone; its terms); [[w.moyar-triumph-forsaken]], 236–38 (the cable drafted
        from the reports of Kim, Thuần, Võ Văn Hải and Đôn; Ball on the golf course; Kennedy''s approval; Rusk reached at
        Yankee Stadium, McNamara in Wyoming, McCone not asked). [[w.reeves-president-kennedy]], 561–63. [[w.preston-war-council]],
        122–23 (the drafting, Forrestal''s clearances, Gilpatric and Felt; the instructions'' words). To check: [[w.hilsman-to-move-a-nation]];
        [[w.taylor-swords-and-plowshares]]; [[w.ball-past-has-another-pattern]]; [[w.abramson-spanning-the-century]]; [[w.jones-death-of-a-generation]];
        [[w.winters-year-of-the-hare]]; [[w.kaiser-american-tragedy]]; [[w.hammer-death-in-november]]; [[w.kahin-intervention]];
