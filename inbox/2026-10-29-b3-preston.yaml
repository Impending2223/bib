      date: '1963-12-16'
      thread: vietnam
      also:
      - soviet-union
      c: 'Zinchuk with Forrestal: a conference on Vietnam such as the *Times* proposes "might be a good idea"; Khrushchev
        had hoped all Southeast Asia, Thailand included, would become nonaligned. Forrestal: "firm in our determination";
        once the insurgency is defeated, the North and South "regulated in a normal manner."'
      n: '[[w.preston-war-council]], 136–37. To check: memcon, Dec. 16, 1963, Harriman Papers, box 461, Library of Congress
        (cited by [[w.preston-war-council]], 137 n.20). See [[cal.1963-02-26.vietnam]]. Names: Forrestal, Khrushchev.'
