- add:
    entry:
      id: cal.1961-11-15.vietnam-2
      when: Nov. 15
      date: '1961-11-15'
      thread: vietnam
      c: 'Bundy to Kennedy, after the President asked him at the swimming pool: "I believe we should commit limited U.S. combat
        units, if necessary for military purposes (not for morale), to help save South Vietnam"; about a division, when needed;
        "a sort of touchstone of our will."'
      n: '[FRUS 1961–63, I, doc. 253](https://history.state.gov/historicaldocuments/frus1961-63v01/d253). [[w.preston-war-council]],
        99–100. See [[cal.1961-11-15.vietnam]]. Names: Bundy, Kennedy.'
