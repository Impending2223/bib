      c: 'Bundy to Lodge, 7:22 p.m., eyes only, after the afternoon''s meeting: Lodge''s cables "examined with care at highest
        levels"; the chances of action, with or without American approval, now so significant that the attitude and contingency
        plans must be weighed; Harkins''s part heavy after Lodge leaves.'
