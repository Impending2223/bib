      id: cal.1965-02-19.vietnam-5
      when: Feb. 19
      date: '1965-02-19'
      thread: vietnam
      also:
      - vietnam-saigon
      c: '"One Dove''s Lament," Thomson to Bundy, after the coup: the air strikes seen "as a substitute for political stability
        in Saigon"; sustained reprisals "greater risks than we have any right to take"; "the only rational alternative remains
        negotiations," with Thant, the Vatican and "the thoughtful press." "Our national interest now demands that we find
        ourselves a face-saving avenue of retreat."'
      n: '[[w.preston-war-council]], 187. To check: Thomson to Bundy, Feb. 19, 1965, NSF, Country File, Vietnam, box 14, LBJ
        Library (cited by [[w.preston-war-council]], 187 n.73). See [[cal.1965-02-19.vietnam]]. Names: Thomson, Bundy, U Thant.'
      tags:
