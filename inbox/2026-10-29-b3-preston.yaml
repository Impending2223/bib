      when: Sept. 7
      date: '1961-09-07'
      thread: berlin-and-vienna
      c: 'The Berlin Steering Group with the President, by Lemnitzer''s notes. Kennedy: how to get the allies to do something?
        McNamara to set down what ten more divisions would do. Acheson: "this is only chance of making nuc war unnecessary."
        Bundy: "could be the reverse."'
      n: '[FRUS 1961–63, XIV, doc. 143](https://history.state.gov/historicaldocuments/frus1961-63v14/d143). [[w.preston-war-council]],
        69 (Bundy against Acheson). Names: Kennedy, McNamara, Acheson, Bundy, Lemnitzer.'
