        - 'w.preston-war-council 61: all'
        - 'via w.preston-war-council 61 n.26: all'
- add:
    entry:
      id: cal.1963-09-10.china
      when: Sept. 10
      date: '1963-09-10'
      thread: china
      c: 'Chiang Ching-kuo with Bundy, Cline present: the test ban treaty alone will not solve the problems. Bundy: the United
        States puts a high priority on weakening the Chinese Communist regime, "particularly its nuclear growth," and will
        examine any possibilities advanced; but its aversion to "triggering a major conflict."'
      n: '[FRUS 1961–63, XXII, doc. 185](https://history.state.gov/historicaldocuments/frus1961-63v22/d185) (draft minutes).
        [[w.preston-war-council]], 61–62. Names: Bundy. Check: Preston, 62, quotes Bundy, the "United States is very interested
        in whether something could be planned"; the minutes FRUS prints do not have those words (Preston''s note, 61 n.26,
        cites Burr and Richardson, 72–73).'
      tags:
      - name:bundy-mcgeorge
      src:
        c: '8e4ff4dc'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v22/d185: all'
        - 'w.preston-war-council 61–62: A-B'
- add:
    entry:
      id: cal.1964-09-25.china
      when: Sept. 25
      date: '1964-09-25'
      thread: china
      also:
      - soviet-union
      c: 'Bundy and Dobrynin at lunch, 1–3:30 p.m.: Chinese nuclear weapons "real dissemination," the MLF nothing of the sort;
        ready for "private and serious talk" on what to do. Dobrynin: the Chinese capability taken for granted, of only psychological
        importance in Asia; the split with Peking Mao''s megalomania.'
      n: '[FRUS 1964–68, XXX, doc. 54](https://history.state.gov/historicaldocuments/frus1964-68v30/d54). [[w.preston-war-council]],
        62. Names: Bundy, Dobrynin, Mao.'
