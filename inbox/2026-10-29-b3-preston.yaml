- add:
    entry:
      id: cal.1962-01-17.testing
      when: Jan. 17
      date: '1962-01-17'
      thread: testing
      c: 'Bundy to Kennedy, sending Kaysen''s paper: an atmospheric test ban can safely be offered, for without the tests
        a nuclear stand-off is sure and with them nothing better after 1963. Defense and the AEC accept its facts, not its
        conclusions. "This is the gut issue."'
      n: '[FRUS 1961–63, VII, doc. 123](https://history.state.gov/historicaldocuments/frus1961-63v07/d123). [[w.preston-war-council]],
        57. See [[cal.1962-01-15.testing]]. Names: Bundy, Kennedy, Kaysen.'
