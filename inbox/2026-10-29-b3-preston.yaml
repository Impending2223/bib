      id: cal.1965-02-14.vietnam
      when: Feb. 14
      date: '1965-02-14'
      thread: vietnam
      c: 'Bundy to Johnson, after the mission: "Max Taylor does not in fact have the political sensitivity needed to provide
        continuing and constructive advice to the struggling factions in Saigon"; "his personal bridges with Khanh are damaged
        beyond repair." Better to back and advise Khánh than to throw him out; Taylor to be replaced "once we get fairly squared
        away on a course of military action."'
      n: '[[w.preston-war-council]], 171. To check: Bundy to Johnson, Feb. 14, 1965, NSF, Memos to the President, Bundy, box
        2, LBJ Library (cited by [[w.preston-war-council]], 171 n.34). Names: Bundy, Johnson, Taylor, Nguyễn Khánh.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:nguyen-khanh
      src:
        c: '69dfb839'
        rows:
