- add:
    entry:
      id: cal.1965-01-26.vietnam-2
      when: Jan. 26
      date: '1965-01-26'
      thread: vietnam
      also:
      - vietnam-saigon
      c: 'Bundy to Johnson, with the CIA''s memorandum: a coup by Khánh "quite likely tonight." Alexis Johnson, not Taylor,
        in Bangkok, to handle it. "There is strong feeling which I share that this back-and-forth in the government in Saigon
        is a symptom, not a root cause of our problem"; our purpose and policy for the 11:30 meeting tomorrow.'
      n: '[FRUS 1964–68, II, doc. 39](https://history.state.gov/historicaldocuments/frus1964-68v02/d39). [[w.preston-war-council]],
        165. To check: Rusk and Bundy, telephone, Jan. 23, 1965, Rusk records, box 52, National Archives (cited by [[w.preston-war-council]],
        165 n.21). See [[cal.1965-01-27.vietnam-2]]. Names: Bundy, Johnson, Nguyễn Khánh, Alexis Johnson, Taylor.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:nguyen-khanh
      - name:johnson-u-alexis
      - name:taylor-maxwell
      src:
        c: '12e721f4'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d39: all'
        - 'w.preston-war-council 165: C'
        - 'via w.preston-war-council 165 n.22b: C'
- add:
    entry:
      id: cal.1965-01-26.vietnam-3
      when: Jan. 26
      date: '1965-01-26'
      thread: vietnam
      also:
      - vietnam-saigon
      c: 'Bundy to Johnson, with Cooper''s summary of the situation in Saigon: let the political mess play itself out, or
        try to hold it together until the National Assembly meets in March; Cooper and Taylor for the second. One more effort
        to talk sense to the Buddhists, through an American they trust.'
      n: '[FRUS 1964–68, II, doc. 37](https://history.state.gov/historicaldocuments/frus1964-68v02/d37). [[w.preston-war-council]],
        165. Names: Bundy, Johnson, Chester Cooper, Taylor. Check: Preston quotes Bundy on the "whole SEA problem" from this
        memorandum (165 n.21); the words not found in it.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:cooper-chester-l
      - name:taylor-maxwell
      src:
        c: bb04f8cc
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d37: all'
        - 'w.preston-war-council 165: all'
        - 'via w.preston-war-council 165 n.21a: all'
