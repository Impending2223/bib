    entry:
      id: cal.1963-01-15.vietnam
      when: Jan. 15
      date: '1963-01-15'
      thread: vietnam
      c: 'Forrestal to Bundy, from the trip: "what we loosely call counter-insurgency is not primarily a military or even
        a police problem until situation has deteriorated to last stage before disaster; it is basically a social and economic
        problem requiring attack at the lowest levels."'
      n: '[[w.preston-war-council]], 116. To check: Forrestal to Bundy, Jan. 15, 1963, NSF, Meetings and Memoranda, Staff
        Memoranda, Forrestal, box 320, Kennedy Library (cited by [[w.preston-war-council]], 116 n.43). Names: Forrestal, Bundy.'
