      c: 'NSC Executive Committee on Southeast Asia. Strikes on the North weighed: Rusk would begin lightly; McCone, "go in
        hard"; Taylor, the chiefs would rather wait for the fall. Rusk: Laos and South Vietnam separate chapters; Bundy: "We
        will have to crank in any Laos scenario." A congressional resolution drafted at State. May 25, Bundy''s draft for
        Johnson: "selected and carefully graduated military force against North Vietnam," after warning and preparation.'
- add:
    entry:
      id: cal.1964-05-26.vietnam-2
      when: May 26
      date: '1964-05-26'
      thread: vietnam
      c: 'Forrestal to Bundy, back from Saigon: "Saigon is still in the center of a doughnut of Viet Cong controlled territory";
        "political bickering among factions in the French fashion continues." The United States "must take a fairly dramatic
        step soon against the North"; "A bit of a shock is needed." Americans to interpose themselves in the chain of command;
        "Eventually this may mean an increase both in the American military and civilian presence in the countryside."'
      n: '[FRUS 1964–68, I, doc. 178](https://history.state.gov/historicaldocuments/frus1964-68v01/d178). [[w.preston-war-council]],
        141, 145–46. To check: Bundy to McNamara and others, May 27, 1964, NSF, Country File, Vietnam, box 5, LBJ Library
        (sending the report on; cited by [[w.preston-war-council]], 146 n.40). Names: Forrestal, Bundy.'
      tags:
      - name:forrestal-michael-v
      - name:bundy-mcgeorge
      src:
        c: f9d89f11
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v01/d178: all'
