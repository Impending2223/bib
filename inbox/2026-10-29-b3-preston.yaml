- add:
    entry:
      id: cal.1961-10-05.vietnam
      when: Oct. 5
      date: '1961-10-05'
      thread: vietnam
      also:
      - laos
      c: 'Rostow to Kennedy: direct word to the Soviets that subversion in South Vietnam must stop; the case against Hanoi
        made public; American and allied troops on the South''s borders. "For us the gut issue as I see it is this: We are
        deeply committed in Viet-Nam; if the situation deteriorates, we will have to go in; the situation is, in fact, actively
        deteriorating; if we go in now, the costs human and otherwise are likely to be less than if we wait."'
      n: '[FRUS 1961–63, XXIV, doc. 195](https://history.state.gov/historicaldocuments/frus1961-63v24/d195). [[w.preston-war-council]],
        87–88. Names: Rostow, Kennedy.'
      tags:
      - name:rostow-walt-w
      - name:kennedy-john-f
      src:
        c: '95b465e3'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d195: all'
        - 'w.preston-war-council 87–88: all'
        - 'via w.preston-war-council 88 n.33: all'
