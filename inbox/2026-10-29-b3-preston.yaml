        Names: McGeorge Bundy, Mansfield, Johnson. Check: Mann has the reply "later that day," Feb. 8.'
      src:
        c: '1b1ade97'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d94: all'
        - 'w.gibbons-u-s-government-and III, 69–70: all'
