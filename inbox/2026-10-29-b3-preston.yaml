        alarmist reactions to Vietnam at home and abroad." Bundy does not send it on.'
      n: '[[w.preston-war-council]], 186. To check: Cooper and Thomson to Bundy, Feb. 22, 1965, NSF, Files of McGeorge Bundy,
        Chron., box 6, LBJ Library (cited by [[w.preston-war-council]], 186 n.72). Names: Chester Cooper, Thomson, Bundy.'
      tags:
