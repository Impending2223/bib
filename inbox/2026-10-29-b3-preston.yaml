      - china
      c: 'Thomson to Cooper, on Bundy''s report and annex: no doubt of a response to "spectaculars" like Pleiku; "my doubts
        focus on the suggested policy of systematic and continuous reprisals against the North." The risk of Chinese intervention
        faced? A ground war against North Vietnam and China? "What has happened to the concept of ''negotiation''?"'
      n: '[FRUS 1964–68, II, doc. 102](https://history.state.gov/historicaldocuments/frus1964-68v02/d102). [[w.preston-war-council]],
