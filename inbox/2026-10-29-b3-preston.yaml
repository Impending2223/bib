      when: Aug. 26
      date: '1963-08-26'
      thread: vietnam
      c: 'Monday. Kennedy to Forrestal, of the cable of Aug. 24: "This shit has got to stop!" Forrestal offers to resign:
        "You''re not worth firing. You owe me something, so you stick around."'
      n: '[[w.preston-war-council]], 123. To check: [[w.taylor-swords-and-plowshares]], 292; *Time*, Oct. 4, 1963, 33; [[w.mcnamara-in-retrospect]],
        54–55; [[w.rust-kennedy-in-vietnam]], 119 (cited by [[w.preston-war-council]], 123 n.60). See [[cal.1963-08-24.vietnam]].
        Names: Kennedy, Forrestal. Check: whose account the words are; Preston''s note gives five sources for the paragraph.'
      tags:
      - name:kennedy-john-f
      - name:forrestal-michael-v
      src:
        c: '992ba8fb'
        rows:
        - 'w.preston-war-council 123: all'
- add:
    entry:
      id: cal.1963-08-26.vietnam-3
      when: Aug. 26
      date: '1963-08-26'
      thread: vietnam
      c: 'Forrestal to Kennedy: Lodge with Diệm, two hours; the Vietnamese view of the United States. The problem now "an
        operational one"; the execution of his decisions to be "lodged in one person, in one office": Hilsman, with Bundy''s
        agreement.'
      n: '[FRUS 1961–63, III, doc. 296](https://history.state.gov/historicaldocuments/frus1961-63v03/d296). [[w.preston-war-council]],
        124. Names: Forrestal, Kennedy, Lodge, Ngô Đình Diệm, Hilsman, Bundy.'
      tags:
