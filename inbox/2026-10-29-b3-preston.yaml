        286 n.100); Gilpatric oral history, Nov. 2, 1982, LBJ Library, 3 (cited by [[w.schulimson-joint-chiefs-of-staff]],
        334 n.97); Robert Kennedy, oral history interview by John Bartlow Martin, Apr. 30, 1964, II, 34, JFK Library (cited
        by [[w.schlesinger-robert-kennedy-and-his]], 712 n.54). See [[cal.1963-05-08.vietnam]]. Names: Hilsman, Harriman,
        Forrestal, Ball, Rusk, McNamara, McCone, Lodge, Ngô Đình Diệm, Ngô Đình Nhu. Check: Moyar, 237, has Kennedy approve
        on condition that Rusk and Gilpatric concur, the condition not passed on to them.'
