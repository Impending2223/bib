- add:
    entry:
      id: cal.1964-05-22.vietnam
      when: May 22
      date: '1964-05-22'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Bundy to Johnson: "A small, tightly knit group meeting at my call," McNamara and Ball with it. Sullivan''s group
        on stiffening the effort in the South, "the tall American at every point of stress and strain"; McNaughton''s plan
        of graduated action against the North, "strike to hurt but not to destroy"; Cooper''s estimate of the enemy''s reactions;
        Ball''s drafts of a resolution, "essential before we act against North Vietnam" but general in form. Russell to be
        asked for a three-day truce in civil rights.'
      n: '[FRUS 1964–68, I, doc. 167](https://history.state.gov/historicaldocuments/frus1964-68v01/d167). [[w.preston-war-council]],
        146–47. Names: Bundy, Johnson, McNamara, Ball, Sullivan, McNaughton, Chester Cooper, Russell. Check: Preston''s note
        (147 n.42) cites Bundy to Johnson of May 27; the text, a May 22 paper; FRUS''s is May 22.'
      tags:
