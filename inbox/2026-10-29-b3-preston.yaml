        - 'via w.preston-war-council 179 n.51c: A, C'
      c: 'McGeorge Bundy answers Mansfield for Johnson, point by point. The UN: no expert sees "any prospect that it can act
        effectively." "We made a vastly heavier sacrifice in Korea—and one which was fully justified—and yet the stakes there
        were certainly not greater than those that are now on the table in Southeast Asia."'
- edit:
    id: cal.1965-02-10.vietnam
    base: c2790167
    set:
      n: 'FRUS 1964–68, II, docs. [95](https://history.state.gov/historicaldocuments/frus1964-68v02/d95), [97](https://history.state.gov/historicaldocuments/frus1964-68v02/d97),
        [98](https://history.state.gov/historicaldocuments/frus1964-68v02/d98), [106](https://history.state.gov/historicaldocuments/frus1964-68v02/d106).
        [[w.gibbons-u-s-government-and]], III, 77–78 (the attack; the NSC: Ball, Thompson and Humphrey for waiting, McNamara
        for striking; two targets, Feb. 11); [[w.frankum-like-rolling-thunder]], 17–18 (the attack at Qui Nhơn; the Navy''s
        strike on Chánh Hòa); [[w.drea-mcnamara-clifford-and-the-2011]], 56 (the attack at Qui Nhơn; the strikes in reply);
        [[w.cosmas-joint-chiefs-of-staff-2012]], 216–217; [[w.staaveren-gradual-failure]], 21–22. Frankum, 18, has the South
        Vietnamese strike another barracks, his target 32, not Chấp Lễ; Staaveren, 21–22, their target the Vu Con barracks,
        Chấp Lễ an alternate. Target 32 is the Vu Con barracks (FRUS 1964–68, II, doc. 78 n. 4); FRUS''s editors, from Vance''s
        chronology, have American and South Vietnamese planes strike Chấp Lễ (doc. 106). [[w.mann-grand-delusion]], 401–2.
        [[w.preston-war-council]], 179–80 (Bundy at the NSC, "a paper tiger"; "we had turned a corner and changed our policy").
        To check: Rolling Thunder (Proj CHECO, 1966), pp 9-12 (cited by [[w.staaveren-gradual-failure]], 22 n.27a); hist,
        CINCPAC, 1965, Vol II, p 322 (cited by [[w.staaveren-gradual-failure]], 22 n.27b). See [[cal.1965-02-07.vietnam]].
        Names: Humphrey, Ball, McNamara, Thompson, Kosygin.'
      src:
        c: cec1b6d7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d95: A-F'
        - 'w.frankum-like-rolling-thunder 17–18: A-B, E'
        - 'w.drea-mcnamara-clifford-and-the-2011 56: A, E-F'
        - 'w.staaveren-gradual-failure 21–22: A-F'
        - 'via w.staaveren-gradual-failure 22 n.27a: E-F'
        - 'via w.staaveren-gradual-failure 22 n.27b: E-F'
        - 'w.cosmas-joint-chiefs-of-staff-2012 216–217: B-F'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 216 n.48: C-D'
        - 'via w.cosmas-joint-chiefs-of-staff-2012 216 n.49: E-F'
        - 'w.gibbons-u-s-government-and III, 77–78: A, C-E'
        - 'via w.gibbons-u-s-government-and III, 77 n.83: C-E'
        - 'w.mann-grand-delusion 401–2: A-D, G'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d98: C'
        - 'w.preston-war-council 179–80: A-C'
        - 'via w.preston-war-council 180 n.53a: C'
      c: 'Qui Nhơn. A Viet Cong bomb wrecks a hotel billeting American enlisted men: 23 killed. Humphrey, Ball and Thompson
        ask that reprisal wait until Kosygin has left the area; McNamara and most of the others for striking at once. Bundy:
        "If we take no action, the Soviets may think we are in fact a paper tiger"; at an appropriate time it could be announced
        "that we had turned a corner and changed our policy." Flaming Dart II, Feb. 11: Navy planes from the *Hancock*, *Coral
        Sea* and *Ranger* hit Chánh Hòa, just north of the demilitarized zone; American and South Vietnamese planes, the barracks
        at Chấp Lễ. Humphrey, asked by Johnson: "I don''t think we should."'
