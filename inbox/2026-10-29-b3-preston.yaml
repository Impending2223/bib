- add:
    entry:
      id: cal.1961-01-01.transition-and-staff-nsc
      when: Jan. 1
      date: '1961-01-01'
      thread: transition-and-staff-nsc
      c: 'The President-elect names Bundy Special Assistant for National Security Affairs: the NSC and "its machinery" to
        be used "more flexibly than in the past"; Bundy to "simplify" it into "a single, small, but strongly organized staff
        unit."'
      n: '[[w.preston-war-council]], 40. To check: Kennedy press release, Jan. 1, 1961, in Henry M. Jackson, ed., *The National
        Security Council* (1965), 302–03 (cited by [[w.preston-war-council]], 40 n.8). Names: Kennedy, Bundy. Check: Preston''s
        text has the appointment announced at a press conference, Dec. 31, 1960; the note, the release of Jan. 1.'
      tags:
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      src:
        c: '4d4b04c1'
        rows:
        - 'w.preston-war-council 40: all'
        - 'via w.preston-war-council 40 n.8: all'
- add:
    entry:
      id: cal.1961-01-30.defense
      when: Jan. 30
      date: '1961-01-30'
      thread: defense
      also:
      - transition-and-staff-nsc
      c: 'Bundy to Kennedy, the policies approved in the NSC that need review: first "basic military policy." Today a subordinate
        commander facing a substantial Russian attack "could start the thermonuclear holocaust on his own initiative if he
        could not reach you."'
      n: '[FRUS 1961–63, VIII, doc. 7](https://history.state.gov/historicaldocuments/frus1961-63v08/d7). [[w.preston-war-council]],
        56 (the holocaust). To check: [[w.reeves-president-kennedy]], 179 (cited by [[w.preston-war-council]], 56 n.10). Names:
        Bundy, Kennedy.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      src:
        c: '77428346'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v08/d7: all'
        - 'w.preston-war-council 56: B'
- add:
    entry:
      id: cal.1961-02-03.transition-and-staff-nsc
      when: Feb. 3
      date: '1961-02-03'
      thread: transition-and-staff-nsc
      c: 'Bundy to Rusk: the President wants to keep track of the directives he gives; a series of National Security Action
        Memoranda begins. "Departments and agencies will always be acting just as fast as they can."'
      n: '[FRUS 1961–63, VIII, doc. 9](https://history.state.gov/historicaldocuments/frus1961-63v08/d9). [[w.preston-war-council]],
        40–41 (the series). Names: Bundy, Rusk. Check: Preston, 41, puts the words in Bundy to Dulles, Mar. 10, 1961 (n.10,
        NSF, Bundy Chron., Kennedy Library); FRUS prints them in the letter to Rusk.'
      tags:
      - name:bundy-mcgeorge
      - name:rusk-dean
      src:
        c: f4c4c275
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v08/d9: all'
        - 'w.preston-war-council 40–41: A-B'
        - 'via w.preston-war-council 41 n.10a: all'
