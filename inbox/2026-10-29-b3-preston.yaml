      when: May 26
      date: '1965-05-26'
      thread: vietnam-congress
      also:
      - transition-and-staff-nsc
      c: 'Johnson to Moyers by telephone: "I don''t want the President''s employees to be subject to committees"; "Just like
        Roosevelt had to keep Harry Hopkins from going down, I''ve got to keep Bundy from going down."'
      n: '[[w.preston-war-council]], 53. To check: [[w.reaching-for-glory]], 341 (cited by [[w.preston-war-council]], 53 n.41).
