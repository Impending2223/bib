      c: 'Hughes of INR to Ball, on Bundy''s report of Feb. 7 against the agreed estimates: "Incomprehensibly to me," it weighs
        sustained strikes without the Chinese response, which the estimates find "quite likely at some stage"; it makes the
        strikes chiefly a lift to Saigon''s morale, the estimates an elation and then a let-down.'
      n: '[FRUS 1964–68, II, doc. 90](https://history.state.gov/historicaldocuments/frus1964-68v02/d90). [[w.preston-war-council]],
        180–81. See [[cal.1965-02-07.vietnam-2]]. Names: Hughes, Ball, Bundy.'
