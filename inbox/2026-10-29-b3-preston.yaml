      when: Feb. 19
      date: '1965-02-19'
      thread: vietnam
      also:
      - vietnam-thant
      c: 'Bundy to Johnson, an answer to Stevenson''s memorandum of Feb. 17: no "readiness for exploratory talks" now. "Our
        position is not one in which we should now look as if we were hunting negotiations. Both the Communists and our friends
        in Saigon would interpret such a proposal as a sign of weakness and readiness to withdraw." Not to the Security Council
        now.'
      n: '[FRUS 1964–68, II, doc. 146](https://history.state.gov/historicaldocuments/frus1964-68v02/d146). [[w.preston-war-council]],
        181. See [[cal.1965-02-17.vietnam-5]]. Names: Bundy, Johnson, Stevenson.'
