      id: cal.1961-07-07.defense
      when: July 7
      date: '1961-07-07'
      thread: defense
      also:
      - berlin-and-vienna
      c: 'Kissinger, consultant, to Bundy: the war plan not revised to avoid an automatic nuclear exchange; "I fear that the
        military will try to force the President''s hand during a crisis." Bundy to Kennedy the same day: the "current strategic
        war plan is dangerously rigid and, if continued without amendment, may leave you very little choice as to how you
        face the moment of thermonuclear truth."'
      n: '[[w.preston-war-council]], 69–70. To check: Kissinger to Bundy, July 7, 1961; Bundy to Kennedy, July 7, 1961; Kaysen
        to Bundy, July 3 and July 7, 1961, NSF, Country File, Germany, box 81A, Kennedy Library (cited by [[w.preston-war-council]],
        70 n.43). Names: Kissinger, Bundy, Kennedy.'
      tags:
