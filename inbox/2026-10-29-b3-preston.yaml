      thread: vietnam
      c: 'Bundy to Lodge, 6:29 p.m., answering his cable of the day: "We are particularly concerned about hazard that an unsuccessful
        coup, however carefully we avoid direct engagement, will be laid at our door by public opinion almost everywhere."
        Struck from the draft: "the impossible takes a little longer."'
      n: '[FRUS 1961–63, IV, doc. 217](https://history.state.gov/historicaldocuments/frus1961-63v04/d217). [[w.preston-war-council]],
        127. See [[cal.1963-10-25.vietnam-2]]. Names: Bundy, Lodge.'
