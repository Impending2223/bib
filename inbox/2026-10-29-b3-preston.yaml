      when: Feb. 17
      date: '1965-02-17'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Bundy to Johnson, of his talk with Lippmann: no "immediate all-out bombardment of Hanoi" planned; a conference now
        "no way to get an honorable settlement." To Lippmann''s "tools of diplomacy": "I fully agreed, as long as it was understood
        that one of the major tools of diplomacy was the 7th Fleet"; "the very word ''conference'' sounded suspiciously like
        surrender in Southeast Asia right now."'
      n: '[[w.preston-war-council]], 182. To check: Bundy to Johnson, Feb. 17, 1965, NSF, Files of McGeorge Bundy, Chron.,
        box 6, LBJ Library (cited by [[w.preston-war-council]], 182 n.59). See [[cal.1965-02-15.vietnam]]. Names: Bundy, Johnson,
        Lippmann. Check: the day of the talk.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:lippmann-walter
      src:
        c: ca6e0220
        rows:
        - 'w.preston-war-council 182: all'
