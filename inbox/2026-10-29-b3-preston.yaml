      when: Feb. 19
      date: '1965-02-19'
      thread: vietnam
      also:
      - europe-and-the-alliance-france
      c: 'Bundy to Johnson, before his meeting with Couve de Murville at 11:30: Couve told him "he thought we had decided
        on ''escalation''" and was "very fearful of the results"; there could be no workable government under "American occupation."
        Bundy: "our current lack of interest in negotiation should not be construed as willful insistence upon a violent solution."'
      n: '[FRUS 1964–68, II, doc. 143](https://history.state.gov/historicaldocuments/frus1964-68v02/d143). [[w.preston-war-council]],
        183. See [[cal.1965-02-19.vietnam-2]]. Names: Bundy, Johnson, Couve de Murville. Check: the day of Bundy''s talk with
        Couve.'
      tags:
