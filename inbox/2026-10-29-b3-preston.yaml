- add:
    entry:
      id: cal.1961-03-27.vietnam
      when: Mar. 27
      date: '1961-03-27'
      thread: vietnam
      c: 'Rostow to Kennedy, after a visit to the Special Warfare Center at Fort Bragg, N.C.: American military helicopters
        for Vietnam, the CIA and the Special Forces drawn closer together. With it his paper of Feb. 28: covert help first,
        then partly overt, then if need be "overt limited war in which U.S. military forces are committed."'
      n: '[[w.preston-war-council]], 80. To check: Rostow paper, Feb. 28, 1961, and Rostow to Kennedy, Mar. 27, 1961, NSF,
        Meetings and Memoranda, Staff Memoranda, Rostow, box 325, Kennedy Library (cited by [[w.preston-war-council]], 80
        n.14). Names: Rostow, Kennedy. Check: which of the two papers says which; Preston''s note gives both.'
