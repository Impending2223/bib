- add:
    entry:
      id: cal.1964-08-31.vietnam
      when: Aug. 31
      date: '1964-08-31'
      thread: vietnam
      c: 'Bundy to Johnson: "Our only really serious international problem is South Vietnam, but that could hardly be more
        serious." Plans for limited escalation: naval harassment, air interdiction in the Laos panhandle, the fleet back in
        the Gulf of Tonkin; a naval base or Marines to guard installations, McNamara strongly against. "A still more drastic
        possibility which no one is discussing is the use of substantial U.S. armed forces in operations against the Viet
        Cong"; "a couple of brigade-size units ... might be good medicine everywhere."'
