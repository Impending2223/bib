      when: Feb. 1
      date: '1965-02-01'
      thread: intelligence
      also:
      - soviet-union
      - vietnam
      c: 'CIA intelligence memorandum, "The Kosygin Delegation to North Vietnam": "an unusually strong delegation" shows Moscow''s
        wish to regain influence in Hanoi and its concern at escalation; more Soviet aid, surface-to-air missiles perhaps.
        The same day Komer to Bundy: Moscow means to "re-engage in Southeast Asia"; "I wish I saw a decent way to warn them
        off."'
