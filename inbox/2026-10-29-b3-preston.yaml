      id: cal.1961-06-10.berlin-and-vienna-2
      when: June 10
      date: '1961-06-10'
      thread: berlin-and-vienna
      c: 'Bundy to Kennedy, with State''s draft reply to the Soviet aide-mémoire and a paper of Kissinger''s for taking "the
        offensive" on German unification; the military contingencies to wait for Acheson and Defense. His own view: "serious
        military preparations now," and a political posture made more acceptable "before the world and also before the Russians."'
      n: '[FRUS 1961–63, XIV, doc. 38](https://history.state.gov/historicaldocuments/frus1961-63v14/d38). [[w.preston-war-council]],
        67. See [[cal.1961-06-10.berlin-and-vienna]]. Names: Bundy, Kennedy, Kissinger, Acheson.'
      tags:
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      - name:kissinger-henry-a
      - name:acheson-dean-g
      src:
        c: '34cac6ff'
        rows:
