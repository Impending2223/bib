      c: 'McGeorge Bundy and William Bundy by telephone: nothing in the President''s press conference to answer; nothing yet
        set for the mission''s return. McGeorge Bundy: "we will not return with urgent and immediate requirements for decision
        making meetings because of the continuing fluidity of the local situation here."'
