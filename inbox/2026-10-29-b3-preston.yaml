      when: July 27
      date: '1961-07-27'
      thread: vietnam
      also:
      - laos
      c: 'Taylor and Rostow to Kennedy, "Issues for Decision," for the meeting on Southeast Asia of July 28: one strategy
        for the whole area, Laos, South Vietnam, Thailand and Cambodia all in danger; "to build as much indigenous military,
        political and economic strength as we can," while "preparing to intervene with U.S. military force."'
      n: '[FRUS 1961–63, I, doc. 107](https://history.state.gov/historicaldocuments/frus1961-63v01/d107). [[w.preston-war-council]],
        89. See [[cal.1961-07-28.laos]]. Names: Taylor, Rostow, Kennedy.'
