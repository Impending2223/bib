      id: cal.1965-01-04.vietnam
      when: Jan. 4
      date: '1965-01-04'
      thread: vietnam
      c: 'Bundy to Johnson, on McNamara''s worry that the State of the Union''s words on Vietnam are stronger than the policy:
        "it is absolutely essential to maintain a posture of firmness today. I believe that without firm U.S. language, the
        danger of further erosion in Saigon is bound to grow."'
      n: '[FRUS 1964–68, II, doc. 5](https://history.state.gov/historicaldocuments/frus1964-68v02/d5). [[w.preston-war-council]],
        163. Names: Bundy, Johnson, McNamara.'
