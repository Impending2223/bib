      when: Mar. 29
      date: '1961-03-29'
      thread: vietnam
      c: 'Rostow to Kennedy: "urgent business to get ourselves properly organized to launch an effective counter-offensive
        in Viet-Nam"; the counter-guerrilla assets to be used, "we are not saving them for the Junior Prom." Diệm might visit,
        or the Vice President go to him.'
