      when: Nov. 27
      date: '1961-11-27'
      thread: vietnam
      c: 'McGhee to Rusk: substantial American combat forces in Vietnam, once in indecisive anti-guerrilla fighting, would
        bring mounting demands at home "that we attack the source of the aggression in North Vietnam."'
      n: '[FRUS 1961–63, I, doc. 283](https://history.state.gov/historicaldocuments/frus1961-63v01/d283). [[w.preston-war-council]],
