      when: July 19
      date: '1961-07-19'
      thread: vietnam
      c: 'Rostow with Taylor and U. Alexis Johnson: a campaign to expose Hanoi''s part in the insurgency, run from Washington
        or from Saigon.'
      n: '[[w.preston-war-council]], 85. To check: memcon, July 19, 1961, NSF, Regional Security, Southeast Asia, box 231,
        Kennedy Library (cited by [[w.preston-war-council]], 85 n.28). Names: Rostow, Taylor, U. Alexis Johnson. Check: Preston
        has the talk "in mid-July"; the date is the memorandum''s.'
