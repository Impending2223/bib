      when: Nov. 14
      date: '1961-11-14'
      thread: vietnam
      c: 'Rostow to Kennedy, "Negotiation about VietNam": the aim to make the Communists stop the infiltration and go back
        to the Geneva Accords; whether to negotiate formally with the bloc before acting.'
      n: '[FRUS 1961–63, I, doc. 251](https://history.state.gov/historicaldocuments/frus1961-63v01/d251). [[w.preston-war-council]],
