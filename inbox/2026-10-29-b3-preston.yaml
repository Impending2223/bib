- add:
    entry:
      id: cal.1964-03-31.vietnam
      when: Mar. 31
      date: '1964-03-31'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Forrestal to Bundy, his "political scenario" for pressure on the North, third draft, to go to Taylor and the Chiefs:
        covert South Vietnamese action, then overt, with covert American support, then direct American action, a move to be
        made "either suddenly or slowly"; before it, a congressional resolution "possibly"; warnings to Moscow and Peking;
        a conference at Geneva at the end. Pressure "might have to be continued over a period of several months and perhaps
        even longer."'
      n: '[FRUS 1964–68, I, doc. 102](https://history.state.gov/historicaldocuments/frus1964-68v01/d102). [[w.preston-war-council]],
        143–44, 149 (the resolution). Names: Forrestal, Bundy, Taylor.'
      tags:
      - name:forrestal-michael-v
      - name:bundy-mcgeorge
