- add:
    entry:
      id: cal.1963-08-23.intelligence
      when: Aug. 23
      date: '1963-08-23'
      thread: intelligence
      also:
      - vietnam-struggle
      c: 'A CIA intelligence memorandum, sent by McCone to Bundy and Forrestal: the Buddhist crisis real, not made or worked
        by the NLF; the Buddhists'' "grievances would be removed only by a change in the government."'
      n: '[[w.preston-war-council]], 121. To check: CIA intelligence memo, Aug. 23, 1963, and McCone to Bundy, Aug. 23, 1963,
        NSF, Country File, Vietnam, box 198A, Kennedy Library (cited by [[w.preston-war-council]], 121 n.57). Names: McCone,
        Bundy, Forrestal.'
