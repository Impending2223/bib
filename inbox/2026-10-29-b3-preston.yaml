- edit:
    id: cal.1964-06-11.vietnam
    base: '35c9acdf'
    set:
      n: '[Johnson and Russell, 12:26 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-june-11-1964),
        Conversation WH6406-05-3680; [continued](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-june-11-1964-0),
        WH6406-05-3681 (Miller Center). [[w.mann-grand-delusion]], 335–36 (the words). [[w.preston-war-council]], 48 (Bundy
        kept in Washington). To check: [[w.taking-charge]], 401–3 (cited by [[w.mann-grand-delusion]], 336 nn.48, 49). See
        [[cal.1964-06-09.laos-2]]. Names: Johnson, Russell, Mansfield.'
      src:
        c: '870b9492'
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-june-11-1964: A'
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-richard-russell-june-11-1964-0: A'
        - 'w.mann-grand-delusion 335–36: all'
        - 'w.preston-war-council 48: F'
        - 'via w.preston-war-council 48 n.29b: F'
      c: 'Johnson and Russell by telephone, 12:26 p.m. Johnson: Mansfield''s "four-page memorandum that I''m getting ourselves
        involved and I''m gonna get in another war if I do any more." Russell: "In a way, I share some of his fears"; "I didn''t
        ever want to get messed up down there"; but to tell the people "you''re coming out ... It''d be disastrous." Johnson:
        "I don''t want to commit us to a war. And I''m in a hell of a shape." Bundy not to go to Saigon as ambassador: too
        valuable in Washington.'
- add:
    entry:
      id: cal.1963-11-23.transition-and-staff-nsc
      when: Nov. 23
      date: '1963-11-23'
      thread: transition-and-staff-nsc
      also:
      - succession
      c: 'Bundy to Johnson, on his office: "The most valuable asset of my office is a staff of half a dozen first-rate men,"
        masters of their areas who know "what it is about them that matters to the President." With it, an undated letter
        of resignation, "to take effect at your pleasure and convenience."'
      n: '[[w.preston-war-council]], 48–49. To check: Bundy to Johnson, Nov. 23, 1963, NSF, Files of McGeorge Bundy, Chron.,
        box 1, LBJ Library (cited by [[w.preston-war-council]], 48 n.30, 49 n.32). Names: Bundy, Johnson. Check: Preston gives
        the letter of resignation under the same note; its date not given.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      src:
        c: '33e74a30'
        rows:
        - 'w.preston-war-council 48–49: all'
        - 'via w.preston-war-council 49 n.32a: A'
        - 'via w.preston-war-council 48 n.30: B'
- add:
    entry:
      id: cal.1964-03-11.transition-and-staff-nsc
      when: Mar. 11
      date: '1964-03-11'
      thread: transition-and-staff-nsc
      c: 'Bundy to Johnson, of Bowles, now ambassador to India and still a critic of the policy in Vietnam: "You''ll see that
        we tried pointedly to sidetrack Bowles."'
      n: '[[w.preston-war-council]], 52. To check: Bundy to Johnson, Mar. 11, 1964, NSF, Memos to the President, Bundy, box
        1, LBJ Library (cited by [[w.preston-war-council]], 52 n.40). Names: Bundy, Johnson, Bowles.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:bowles-chester
      src:
        c: '4067941f'
        rows:
        - 'w.preston-war-council 52: all'
        - 'via w.preston-war-council 52 n.40: all'
- add:
    entry:
      id: cal.1965-01-21.transition-and-staff
      when: Jan. 21
      date: '1965-01-21'
      thread: transition-and-staff
      c: 'Bundy to Johnson, on Rusk: "He is not a manager. He has never been a good judge of men. His instincts are cautious
        and negative"; "He does not move matters toward decision with promptness."'
      n: '[[w.preston-war-council]], 45. To check: Bundy to Johnson, Jan. 21, 1965, NSF, Memos to the President, Bundy, box
        2, LBJ Library (cited by [[w.preston-war-council]], 45 n.21). Names: Bundy, Johnson, Rusk.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:rusk-dean
      src:
        c: '58ee9bab'
        rows:
        - 'w.preston-war-council 45: all'
        - 'via w.preston-war-council 45 n.21: all'
- add:
    entry:
      id: cal.1965-01-22.vietnam
      when: Jan. 22
      date: '1965-01-22'
      thread: vietnam
      also:
      - transition-and-staff-nsc
      c: 'Cooper to Bundy, on the month''s large meetings on Vietnam: "some fairly important decisions are being made without
        time for thoughtful discussion ... Perhaps the meetings you and the Secretaries have had with the President take care
        of this problem."'
      n: '[[w.preston-war-council]], 50. To check: Cooper to Bundy, Jan. 22, 1965, NSF, Country File, Vietnam, box 12, LBJ
        Library (cited by [[w.preston-war-council]], 50 n.35). Names: Cooper, Bundy.'
      tags:
