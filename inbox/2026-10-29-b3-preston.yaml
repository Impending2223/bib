      date: '1964-05-01'
      thread: vietnam
      c: 'Forrestal to McNaughton: "What we are dealing with is social revolution by illegal means, infected by the cancer
        of Communism." The war and social reform "not separable"; "The Viet Cong know this. It is why they are winning."'
      n: '[[w.preston-war-council]], 148. To check: Forrestal to McNaughton, May 1, 1964 (cited by [[w.preston-war-council]],
        148 n.44, from [[w.bird-color-of-truth]], 280). Names: Forrestal, McNaughton.'
