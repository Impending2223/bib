      id: cal.1963-11-13.vietnam-2
      when: Nov. 13
      date: '1963-11-13'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Forrestal to Bundy, of his talk with Kleiman of the *Times*'' editorial board, who urged a reconvened Geneva conference:
        "folly to pursue this line at the present time"; South Vietnam not yet strong enough to come to the table, and its
        people would see "a complete sellout."'
      n: '[[w.preston-war-council]], 135–36. To check: Forrestal to Bundy, Nov. 13, 1963, NSF, Country File, Vietnam, box
        202, Kennedy Library (cited by [[w.preston-war-council]], 136 n.18). Names: Forrestal, Bundy.'
      tags:
      - name:forrestal-michael-v
      - name:bundy-mcgeorge
      src:
        c: b617a03f
        rows:
        - 'w.preston-war-council 135–36: all'
        - 'via w.preston-war-council 136 n.18: all'
