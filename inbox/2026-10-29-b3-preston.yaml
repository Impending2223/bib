      date: '1961-10-27'
      thread: testing
      c: 'Bundy''s draft guidelines for the President and McNamara, the decision on atmospheric tests still open: no tests
        unless "required by military necessity to do so."'
      n: '[[w.preston-war-council]], 57. To check: draft guidelines for Kennedy, drafted by Bundy, Oct. 27, 1961, NSF, Bundy,
