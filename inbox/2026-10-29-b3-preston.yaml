      id: cal.1961-10-05.vietnam-2
      when: Oct. 5
      date: '1961-10-05'
      thread: vietnam
      also:
      - laos
      c: 'Bowles to Rusk, "The Situation in Southeast Asia": beyond any Laos agreement, the balance in Southeast Asia deteriorating.
        "A direct military response to increased Communist pressure has the supreme disadvantage of involving our prestige
        and power in a remote area under the most adverse circumstances"; a political approach, the neutrality of the region,
        instead.'
      n: '[FRUS 1961–63, I, doc. 145](https://history.state.gov/historicaldocuments/frus1961-63v01/d145). [[w.preston-war-council]],
        93. Names: Bowles, Rusk.'
      tags:
      - name:bowles-chester
      - name:rusk-dean
      src:
        c: bd7fd6d5
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d145: all'
        - 'w.preston-war-council 93: all'
        - 'via w.preston-war-council 93 n.52: all'
- add:
    entry:
      id: cal.1961-10-05.intelligence
      when: Oct. 5
      date: '1961-10-05'
      thread: intelligence
      also:
      - vietnam
      c: 'Sherman Kent of the CIA sends Rostow an intelligence summary: the "Communist Bloc probably views the guerrilla and
        subversive campaigns in Laos and South Vietnam as two parts of a single broad political-military strategy, and of
        the two, considers South Vietnam as the more significant prize."'
      n: '[[w.preston-war-council]], 90. To check: CIA Special National Intelligence Estimate, Oct. 5, 1961, and Kent to Rostow,
        Oct. 5, 1961, NSF, Country File, Vietnam, box 194, Kennedy Library (cited by [[w.preston-war-council]], 90 n.43).
        Names: Rostow.'
      tags:
      - name:rostow-walt-w
      src:
        c: aeefefab
        rows:
        - 'w.preston-war-council 90: all'
        - 'via w.preston-war-council 90 n.43a: all'
        - 'via w.preston-war-council 90 n.43b: all'
