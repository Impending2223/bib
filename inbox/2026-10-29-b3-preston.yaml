      date: '1964-01-13'
      thread: soviet-union
      c: 'Bundy to Johnson on relations with Moscow: the "next steps toward peace" to need bold multilateral moves, in Europe
        above all, beside the steps with the Soviet Union; Vietnam, where "we continue to oppose Communist subversion," still
        to need "constant attention."'
      n: '[[w.preston-war-council]], 71–72. To check: Bundy to Johnson, Jan. 13, 1964, NSF, Memos to the President, Bundy,
