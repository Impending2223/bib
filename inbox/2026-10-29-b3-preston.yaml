      when: May 9
      date: '1961-05-09'
      thread: vietnam
      c: 'Komer''s paper "A Doctrine of Deterrence for SEA": steps against Communist aggression ending in American troops,
        a "plate glass window" defense, and "a credible response in case the ''plate glass window'' is broken." Circulated
        by Rostow in the summer without Komer''s knowledge.'
      n: '[[w.preston-war-council]], 88. To check: Komer paper, May 9, 1961, NSF, Regional Security, Southeast Asia, box 231,
        Kennedy Library (cited by [[w.preston-war-council]], 88 n.34). Names: Komer, Rostow.'
