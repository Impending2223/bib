        Kennedy Library (cited by [[w.preston-war-council]], 80 n.15, 84 n.26). Names: Rostow, Kennedy, Ngô Đình Diệm, Johnson.
        Check: Preston''s note 15 gives this and the memorandum of Apr. 3 together for the words.'
