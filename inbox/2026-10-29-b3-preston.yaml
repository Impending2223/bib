- add:
    entry:
      id: cal.1963-08-24.vietnam-2
      when: Aug. 24
      date: '1963-08-24'
      thread: vietnam
      c: 'Forrestal to Kennedy, with the latest cables: Nhu "the mastermind behind the whole operation against the Buddhists";
        agreement that the United States cannot tolerate a result leaving him dominant, disagreement on Diệm. "Averell and
        Roger now agree that we must move before the situation in Saigon freezes."'
      n: '[FRUS 1961–63, III, doc. 278](https://history.state.gov/historicaldocuments/frus1961-63v03/d278). [[w.preston-war-council]],
        121–22. See [[cal.1963-08-21.vietnam]]. Names: Forrestal, Kennedy, Ngô Đình Nhu, Ngô Đình Diệm, Harriman, Hilsman.'
      tags:
      - name:forrestal-michael-v
      - name:kennedy-john-f
      - name:ngo-dinh-nhu
      - name:ngo-dinh-diem
      - name:harriman-w-averell
      - name:hilsman-roger
