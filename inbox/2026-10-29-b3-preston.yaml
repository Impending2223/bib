- add:
    entry:
      id: cal.1961-04-18.cuba-bay-of-pigs
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'Bundy to Kennedy, before noon: the beachheads precarious; the CIA will press for Navy cover for the B-26s. "In my
        own judgment the right course now is to eliminate the Castro air force, by neutrally-painted U.S. planes if necessary,
        and then let the battle go its way."'
      n: '[FRUS 1961–63, X, doc. 119](https://history.state.gov/historicaldocuments/frus1961-63v10/d119). [[w.preston-war-council]],
        64. See [[cal.1961-03-15.cuba]]. Names: Bundy, Kennedy.'
