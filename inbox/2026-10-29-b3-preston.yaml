      c: 'Schlesinger to Bundy, recommending Michael Forrestal for the NSC staff: "He may not quite have his father''s concentrated
        and ambitious drive, but he also does not have his father''s somewhat narrow views." Forrestal joins in February,
        for the Far East.'
