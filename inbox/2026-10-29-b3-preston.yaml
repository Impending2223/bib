    base: '742c00cc'
    set:
      n: 'FRUS 1961–63, III, docs. [261](https://history.state.gov/historicaldocuments/frus1961-63v03/d261), [262](https://history.state.gov/historicaldocuments/frus1961-63v03/d262).
        [[w.miller-misalliance]], 275–77, 287–90 (275–76: the raids, twelve pagodas in Saigon, more than 700 held, Huế and
        Đà Nẵng, martial law; 289–90: the Special Forces and the National Police, a Civil Guard unit, the regular army only
        in Huế; Lodge in Saigon two days before Aug. 24); [[w.gibbons-u-s-government-and]], II, 148 (the attacks, by police
        and Special Forces loyal to Nhu; Lodge to Saigon the next day); [[w.kaplan-mcnamara-ascendancy-1961-1965]], 285 (the
        raids by Nhu''s Special Forces; martial law; Lodge en route); [[w.schulimson-joint-chiefs-of-staff]], 329–331 (the
        raids; martial law); [[w.futrell-united-states-air-force]], 187; [[w.moyar-triumph-forsaken]], 231–34 (232: the raids
        after midnight by police, the Republican Guard and Special Forces, the army in support, martial law proclaimed by
        Đôn; thirty pagodas, a couple of thousand arrested). [[w.reeves-president-kennedy]], 557–58. [[w.preston-war-council]],
        121 (the raids; State''s statement drafted by Forrestal and Harriman; Trueheart''s cable). To check: [[w.hammer-death-in-november]];
        [[w.ahern-cia-and-the-house-2000]]; [[w.demery-finding-the-dragon-lady]]; [[w.blair-lodge-in-vietnam]]; msg, SECSTATE
        to AmEmb Saigon, Aug 21, 1963 (cited by [[w.futrell-united-states-air-force]], 187 n.11); Msgs, 2d AD to CINCPAC,
        Aug 21, 1963 (cited by [[w.futrell-united-states-air-force]], 187 n.12a); CINCPAC to JCS, Aug 21, 1963, and Aug 25,
        1963 (cited by [[w.futrell-united-states-air-force]], 187 n.12b); UPI, "Buddhists Seized," Aug. 21, 1963 (cited by
        [[w.schulimson-joint-chiefs-of-staff]], 330 n.75); Trần Văn Đôn''s special intelligence bulletin 187/TTM/2/5/M, Aug.
        23, 1963, folder 8527, PTTĐN, TTLTQG2 (cited by [[w.miller-misalliance]], 275 n.99); Tôn Thất Đính''s report 0289/QĐIII/VPTL
        to Diệm, Aug. 22, 1963, the same folder (cited by [[w.miller-misalliance]], 289 n.35); Đỗ Cao Trí''s telegram no.
        745/A2/M, Aug. 21, 1963, the same folder (cited by [[w.miller-misalliance]], 290 n.38); Saigon to State, Aug. 21,
        1963, DDRS, 1985, 22 (cited by [[w.moyar-triumph-forsaken]], 232 n.6); [FRUS 1961–63, III, doc. 275](https://history.state.gov/historicaldocuments/frus1961-63v03/d275)
        (CIA Saigon to CIA, Aug. 24, 1963; cited by [[w.moyar-triumph-forsaken]], 232 n.6); [FRUS 1961–63, IV, doc. 80](https://history.state.gov/historicaldocuments/frus1961-63v04/d80)
        (CIA Saigon to CIA, Sept. 10, 1963; cited by [[w.moyar-triumph-forsaken]], 232 n.6); New York Times, Aug. 23, 1963
        (cited by [[w.moyar-triumph-forsaken]], 232 n.6); Saigon to State, Aug. 21, 1963, MHI, Gard Papers, box 2 (cited by
        [[w.moyar-triumph-forsaken]], 232 n.8); USAIRA Saigon to State, Aug. 21, 1963, NA II, RG 59, Central Files, 1963,
        box 4048 (cited by [[w.moyar-triumph-forsaken]], 232 n.8); USARMA Saigon to State, Aug. 22, 1963, NA II, RG 59, Central
        Files, 1963, box 4137 (cited by [[w.moyar-triumph-forsaken]], 232 n.8); Harkins to Taylor, Aug. 22, 1963, NA II, RG
        59, Central Files, 1963, box 4138 (cited by [[w.moyar-triumph-forsaken]], 232 n.8); Henry Cabot Lodge, oral history,
        22, Kennedy Library (cited by [[w.reeves-president-kennedy]], 558). See [[cal.1963-05-08.vietnam]]. Names: Ngô Đình
        Nhu, Lodge. Check: Moyar, 231–32, from the embassy''s and the CIA''s reports, has the raids proposed by the generals
        (by Đôn''s account decided by ten of them Aug. 18: [[cal.1963-08-18.vietnam-saigon]]) and largely run by them, Tôn
        Thất Đính in command in Saigon, Nhu and Colonel Lê Quang Tung with parts of it.'
