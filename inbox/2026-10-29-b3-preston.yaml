      date: '1963-01-02'
      thread: vietnam
      c: 'Saigon, Hilsman''s note for the record, thirty-six hours in: "things are going much much better than they were a
        year ago, but ... they are not going nearly so well as the people here in Saigon both military and civilian think
        they are."'
