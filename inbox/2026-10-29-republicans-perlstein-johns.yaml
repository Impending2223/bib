- add:
    entry:
      id: cal.1962-06-07.republican-party-congress
      when: June 7
      date: '1962-06-07'
      thread: republican-party-congress
      also:
      - republican-party
      c: 'The Senate and House Republican conferences approve the report of their Joint Committee on Republican Principles, Laird chairman, Hickenlooper cochairman:
        "A Declaration of Republican Principle and Policy." Five basic beliefs, "government with a heart" and "government with a head" among them; the administration''s
        "bluster followed by whimpering in respect to Laos." Laird reads it to the House.'
      n: '[108 Cong. Rec. 9990–92](https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt7/pdf/GPO-CRECB-1962-pt7-14-2.pdf). [[w.perlstein-before-the-storm]], 168;
        [[w.johns-vietnams-second-front]], 27 (its foreign policy). Check: Johns gives the declaration to the Republican Congressional Committee. Names: Laird, Hickenlooper.'
