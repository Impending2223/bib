      c: South Carolina's Republican convention. Goldwater speaks, against Nixon's "complacent attitude" toward the South. The convention pledges its thirteen delegates
        to him, by Manion's arrangement, to Goldwater's surprise.
      n: '[[w.perlstein-before-the-storm]], 76. To check: Brophy to Manion, Mar. 26, 1959 [as printed], Manion Papers (cited by [[w.perlstein-before-the-storm]],
        76 n.1). Names: Goldwater, Nixon, Manion.'
