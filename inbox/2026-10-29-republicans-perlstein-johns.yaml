      date: '1961-04-12'
      thread: right-and-the-military
      c: 'Senate. Milton Young of North Dakota (R), condemned by letter-writers for opposing the John Birch Society, prints a Wichita lawyer''s letter and his reply,
        with Welch''s words from *The Politician*: Eisenhower "consciously serving the Communist conspiracy, for all of his adult life." McGee (D) on Welch''s speech
        in Los Angeles the night before.'
      n: '[107 Cong. Rec. 5607–08](https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt5/pdf/GPO-CRECB-1961-pt5-3-1.pdf). [[w.perlstein-before-the-storm]], 118 (Welch''s
        words). Check: Perlstein gives the speech to Stephen Young of Ohio, citing the Record of Apr. 12, 1961, 5268 ff.; the bound Record of the day prints Milton
        Young''s. Names: Milton Young, Welch, Eisenhower, McGee.'
