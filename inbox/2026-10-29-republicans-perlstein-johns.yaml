      c: 'Chicago, Sunday. Rockefeller at Liberty Baptist Church, King beside him on the pulpit, some six thousand Negroes in the pews. Wilkins of the NAACP, the
        main speaker: Rockefeller "made a backbone plank out of a spaghetti plank."'
