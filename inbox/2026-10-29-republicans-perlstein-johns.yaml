      c: 'The convention''s opening session. Hoover speaks. Goldwater, introducing the party''s Senate candidates, held off eight minutes by the demonstration; conservatism
        the "heart and soul of our great historic Party." Judd''s keynote: "Was it the Republicans who secretly divided Poland and gave half of it to the Soviet Union?"'
      n: '[[w.perlstein-before-the-storm]], 91. To check: Andrew, *Other Side of the Sixties* (cited by [[w.perlstein-before-the-storm]], 91 n.1, for the speech).
        See [[cal.1960-07-25.elections-1960]]. Names: Goldwater, Judd.'
