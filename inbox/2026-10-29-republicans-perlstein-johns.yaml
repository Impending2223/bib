      c: 'Chicago, the Union League Club. Twenty-nine members of Manion''s Goldwater for President committee meet. Wannamaker, South Carolina''s new Republican chairman:
        its thirteen delegates ready for Goldwater, though they might back Nixon in public for a time. Manion''s plan for Goldwater''s book: his own imprint, Victor
        Publishing, 50,000 copies in March, bulk sales to friendly businesses.'
      n: '[[w.perlstein-before-the-storm]], 61. To check: Manion to the committee''s members, Mar. 11, 1960, Clarence Manion Papers, Chicago Historical Society (cited
        by [[w.perlstein-before-the-storm]], 61 n.1, for the meeting). Check: the date; Perlstein sets the meeting after Jan. 23 and does not date it. Names: Manion,
        Goldwater, Nixon.'
      tags:
      - name:manion-clarence
      - name:goldwater-barry-m
      - name:nixon-richard-m
      - state:sc
      - city:chicago
      src:
        c: 360fa0d4
        rows:
        - 'w.perlstein-before-the-storm 61: all'
        - 'via w.perlstein-before-the-storm 61 n.1: all'
