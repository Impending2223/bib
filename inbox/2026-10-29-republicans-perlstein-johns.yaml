      date: '1960-09-10'
      thread: conservative-movement
      c: 'Sharon, Conn., Great Elm, the Buckleys'' estate. Almost a hundred young conservatives, called from Liebman''s office, found Young Americans for Freedom.
        Its statement: the individual''s "God-given free will"; "victory over, rather than co-existence with" Communism; a motion to strike God lost, 44–40.'
      n: '[[w.perlstein-before-the-storm]], 105–106. To check: [[w.andrew-other-side-of-the]], 55 (cited by [[w.perlstein-before-the-storm]], 105 n.1, for the call).
