      c: 'Nixon, arrived in Chicago, at a televised news conference at the Hilton: the convention must adopt "a strong civil rights platform, an honest one, which
        does deal specifically and not in generalities" with the problems; the statement he and Rockefeller agreed on its basis.'
      n: '[[w.perlstein-before-the-storm]], 90. To check: "Nixon Says Rights Plank Must Be Made Stronger," *New York Times*, July 26, 1960 (cited by [[w.perlstein-before-the-storm]],
        90 nn.1–2). See [[cal.1960-07-22.elections-1960]]. Names: Nixon, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - city:chicago
      src:
        c: 4fe89198
        rows:
