patch: 2026-11-12-b10-pilot-prc2-1962-10
by: 'Claude (batch 10, the foreign pilot, the PRC, second reading: Chen Jian, *Zhou Enlai: A Life* (Harvard, 2024), the owner''s Drive PDF, chs. 22–23; *Mao Zedong zhuan* 毛泽东传, V, chs. 70–71, the owner''s Drive epub), Nov. 12, 2026'
ops:
# ---------------------------------------------------------------- the run-up, September
- add:
    entry:
      id: cal.1962-09.south-asia-3
      when: Sept., early
      date: '1962-09'
      thread: south-asia
      also: [china]
      c: 'The Central Military Commission orders the troops on the western and eastern sectors of the border with India not to retreat when Indian troops push forward in a standoff; still not to fire the first shot unless the supreme leadership orders it.'
      n: '[[w.jian-zhou-enlai]], 479. Made public: Check (1997 at the latest). To check: [[w.zhongyin-bianjie-ziwei-fanji]], 159–60; [[w.zhou-enlai-nianpu-1949]], II, 496 n. (cited by [[w.jian-zhou-enlai]], 763 n.67). Check: the day.'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-09-26.china
      when: Sept. 26
      date: '1962-09-26'
      thread: china
      also: [south-asia]
      c: 'The Tenth Plenum. Zhou Enlai''s speech: if China is forced to fight a war with India, it will be "for [the sake of] opening the path toward negotiation."'
      n: '[[w.jian-zhou-enlai]], 483. Made public: Check. To check: Zhou''s speech at the Tenth Plenum of the Eighth Central Committee, Sept. 26, 1962, 855-6-2008-14, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 764 n.87). Names: Zhou Enlai. Check: Chen cites the same speech (764 nn.89–90) for words he places "when the war began": "this war, first and foremost, is a political battle"; the Chairman''s Mencius, "a country without an enemy and outside threats will surely head toward destruction."'
      tags: [name:zhou-enlai, polity:prc, polity:india]
# ---------------------------------------------------------------- October: the war's decision
- add:
    entry:
      id: cal.1962-10-05.south-asia
      when: Oct. 5
      date: '1962-10-05'
      thread: south-asia
      also: [china]
      c: 'Zhou Enlai, on the General Staff''s intelligence report quoting AP and AFP from New Delhi (Indian troops likely to attack within days), in the margin: "If the enemy begins taking action in the eastern sector of the border, we should not only give him a bitter strike there but also eliminate some of his strongholds in the western sector." Luo Ruiqing to "submit plans for the Party Center to consider."'
      n: '[[w.jian-zhou-enlai]], 479 (Chen''s translation). Made public: Check (1997 at the latest). To check: [[w.zhou-enlai-nianpu-1949]], II, 500; [[w.zhou-enlai-zhuan-1949]], 699 (cited by [[w.jian-zhou-enlai]], 763 nn.68–69). Names: Zhou Enlai, Luo Ruiqing.'
      tags: [name:zhou-enlai, name:luo-ruiqing, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-08.south-asia-4
      when: Oct. 8
      date: '1962-10-08'
      thread: south-asia
      also: [china]
      c: 'After the Standing Committee, Luo Ruiqing calls a Central Military Commission work meeting: conveys Mao Zedong''s instructions and orders final mobilization for the war.'
      n: '[[w.jian-zhou-enlai]], 479 ("immediately"). Made public: Check (2014 at the latest). To check: [[w.zishen-yang-chengwu-nianpu-chronological]], 368 (cited by [[w.jian-zhou-enlai]], 763 n.72). See [[cal.1962-10-08.south-asia]]. Names: Luo Ruiqing, Mao Zedong.'
      tags: [name:luo-ruiqing, name:mao-zedong, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-12.south-asia
      when: Oct. 12
      date: '1962-10-12'
      thread: south-asia
      also: [china]
      c: 'Nehru, to the press, asked what orders he has given the troops on the border with China: "Our instructions are to free our territory."'
      n: '[[w.jian-zhou-enlai]], 480. To check: [[w.maxwell-indias-china-war]], 369–71; *Statesman*, Oct. 13, 1962 (cited by [[w.jian-zhou-enlai]], 763 n.75). Names: Nehru.'
      tags: [name:nehru-jawaharlal, polity:india, polity:prc]
- add:
    entry:
      id: cal.1962-10-13.soviet-union
      when: Oct. 13
      date: '1962-10-13'
      thread: soviet-union
      also: [china, south-asia]
      c: 'Khrushchev to Liu Xiao, the Chinese Ambassador: Moscow stands with Peking in the border dispute with India, the Presidium''s unanimous choice after Zhou Enlai''s talk with Chervonenko; "We will take due diplomatic action."'
      n: '[[w.jian-zhou-enlai]], 479–80 (it surprises Mao and Zhou). Made public: Check (1986 at the latest). To check: Khrushchev''s conversation with Liu Xiao, Oct. 13, 1962, 109-03809-06, and his talk at the farewell banquet for Liu Xiao, Oct. 14, 1962, 109-03809-04, Chinese Foreign Ministry Archive; [[w.xiao-chushi-sulian-banian-ambassador]], 121 (cited by [[w.jian-zhou-enlai]], 763 n.74). See [[cal.1962-10-08.south-asia-3]]; [[cal.1962-10-11.south-asia]]. Names: Khrushchev, Zhou Enlai, Chervonenko. Check: the day: Chen''s text has "a few days later" than Oct. 8; his n.74 dates the conversation Oct. 13 and the banquet Oct. 14, his n.98 (764) the conversation "at Liu''s farewell banquet," Oct. 13.'
      tags: [name:khrushchev-nikita-s, name:zhou-enlai, name:chervonenko-stepan-v, polity:ussr, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-15.china-2
      when: Oct. 15
      date: '1962-10-15'
      thread: china
      also: [south-asia]
      c: '*People''s Daily*, Xinhua''s report: Nehru''s words of Oct. 12 rendered "Our orders are to cleanse all of them from our territory."'
      n: '[[w.jian-zhou-enlai]], 480 (Zhou and the other leaders take it for Nehru''s intent to open a big offensive, and a reason to act). To check: *Renmin ribao*, Oct. 15, 1962 (cited by [[w.jian-zhou-enlai]], 763 n.76). See [[cal.1962-10-12.south-asia]]. Names: Nehru. Check: the day (Chen''s text dates no report; his note cites the issue of Oct. 15).'
      tags: [name:nehru-jawaharlal, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-17.south-asia-3
      when: Oct. 17
      date: '1962-10-17'
      thread: south-asia
      also: [china]
      c: 'India''s troops shell the Chinese side heavily in the eastern and western sectors at once (the Chinese account).'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("十月十七日，印军在中印边境东段和西段同时向中方进行猛烈炮击"). See [[cal.1962-10-17.south-asia]].'
      tags: [polity:india, polity:prc]
- add:
    entry:
      id: cal.1962-10-18.south-asia-2
      when: Oct. 18
      date: '1962-10-18'
      thread: south-asia
      also: [china]
      c: 'Afternoon. The Central Military Commission orders the troops to begin the "border campaign of self-defense."'
      n: '[[w.jian-zhou-enlai]], 480 ("The next afternoon," after Mao Zedong signed the order of Oct. 17). Made public: Check (1994 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 165; [[w.zhongyin-bianjie-ziwei-fanji]], 179–80 (cited by [[w.jian-zhou-enlai]], 763 n.78). See [[cal.1962-10-17.south-asia-2]]. Check: whether this is the order that put the attack back a day, to Oct. 20.'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-20.china-2
      when: Oct. 20
      date: '1962-10-20'
      thread: china
      also: [south-asia]
      c: 'Zhou Enlai, at a State Council meeting: once Nehru''s "head was broken and bleeding," China will return to the table to settle the border by negotiation.'
      n: '[[w.jian-zhou-enlai]], 483. Made public: Check (1997 at the latest). To check: [[w.zhou-enlai-nianpu-1949]], II, 504 (cited by [[w.jian-zhou-enlai]], 764 n.88). See [[cal.1962-10-20.india-and-china]]. Names: Zhou Enlai, Nehru. Check: one State Council meeting or two: Chen dates this Oct. 20 (483) and Zhou''s statement at a State Council meeting Oct. 21 (481), both from II, 504.'
      tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-21.china-2
      when: Oct. 21
      date: '1962-10-21'
      thread: china
      also: [south-asia]
      c: 'Zhou Enlai, at a State Council meeting: "We are in favor of settling international disputes through negotiation. But Nehru refused to negotiate, called for the war, and launched the attack. ... We cannot make endless concessions, so we fight back. If Nehru remains stubborn and refuses to seek compromise with us, we have no other choice but teach him a bitter lesson."'
      n: '[[w.jian-zhou-enlai]], 481 (Chen''s translation). Made public: Check (1997 at the latest). To check: [[w.zhou-enlai-nianpu-1949]], II, 504 (cited by [[w.jian-zhou-enlai]], 763 n.80). See [[cal.1962-10-20.china-2]]. Names: Zhou Enlai, Nehru. Check: one State Council meeting or two (Chen, 481, 483).'
      tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-22.soviet-union-4
      when: Oct. 22
      date: '1962-10-22'
      thread: soviet-union
      also: [china, south-asia]
      c: 'The Soviet government''s memorandum to the Chinese government: Moscow endorses China''s position in the war with India; on the McMahon line it "supports China''s stand, that is, it is not an established borderline, but a legacy of the tragic historical past."'
      n: '[[w.jian-zhou-enlai]], 485–86. Made public: Check. To check: Memorandum of the Soviet government to the Chinese government, Oct. 22, 1962, 109-03801-02, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 764 n.97). See [[cal.1962-10-18.south-asia]].'
      tags: [polity:ussr, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-24.south-asia-4
      when: Oct. 24
      date: '1962-10-24'
      thread: south-asia
      also: [china]
      c: 'India''s government, by statement, rejects China''s proposals of the same day.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("当天，印度政府发表声明，拒绝了中方的建议"). To check: the statement''s text. See [[cal.1962-10-24.south-asia]].'
      tags: [polity:india, polity:prc]
- add:
    entry:
      id: cal.1962-10-26.china-2
      when: Oct. 26
      date: '1962-10-26'
      thread: china
      also: [south-asia]
      c: 'Zhou Enlai to Nasser and other leaders of Asian and African countries: the border dispute''s course and the conflict''s causes; China not using force to take territory but pushed into a war of self-defense; its aim still talks and a peaceful settlement.'
      n: '[[w.jian-zhou-enlai]], 485 ("immediately after the war began"; letters to the leaders of dozens of countries). Made public: Check. To check: Zhou to President Nasser and other leaders of Asian and African countries, Oct. 26, 1962, 107-00528-11, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 764 n.95). Names: Zhou Enlai, Nasser. Check: the day (Chen''s text dates none; his note dates this letter Oct. 26).'
      tags: [name:zhou-enlai, name:nasser-gamal-abdel, polity:prc, polity:uar, polity:india]
# ---------------------------------------------------------------- Cuba
- add:
    entry:
      id: cal.1962-10-28.china
      when: Oct. 28
      date: '1962-10-28'
      thread: china
      also: [cuba, missile-crisis-settlement]
      c: 'Peking. Zhou Enlai chairs a rally of more than ten thousand in support of "the heroic Cuban comrades"; a telegram of solidarity to Fidel Castro.'
      n: '[[w.jian-zhou-enlai]], 486. To check: *Renmin ribao*, Oct. 29, 1962 (cited by [[w.jian-zhou-enlai]], 764 n.99). Names: Zhou Enlai, Castro.'
      tags: [name:zhou-enlai, name:castro-fidel, polity:prc, polity:cuba]
# ---------------------------------------------------------------- the war's end
- add:
    entry:
      id: cal.1962-10-29.china
      when: Oct. 29
      date: '1962-10-29'
      thread: china
      also: [south-asia]
      c: 'Zhou Enlai with Burma''s Ambassador, Maung Maung Kyaw Win: Nehru''s condition, the line of Sept. 8, 1962, would leave India the ground it took in Aksai Chin in two years and push China further north in the east from positions already north of the McMahon line. "How can this be called cease-fire? This is not cease-fire. This is to ask us to surrender."'
      n: '[[w.jian-zhou-enlai]], 481–82 (Chen''s translation). Made public: Check. To check: Zhou''s conversation with the Burmese Ambassador, Kyaw Win, Oct. 29, 1962, 105-01781-02, Chinese Foreign Ministry Archive; [[w.zhou-enlai-nianpu-1949]], II, 571 (cited by [[w.jian-zhou-enlai]], 764 n.83). Names: Zhou Enlai, Nehru.'
      tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:burma, polity:india]
- add:
    entry:
      id: cal.1962-10-29.south-asia
      when: Oct. 29
      date: '1962-10-29'
      thread: south-asia
      also: [china]
      c: 'Peking orders its troops to halt all operations.'
      n: '[[w.jian-zhou-enlai]], 482; [[w.mao-zedong-zhuan]], V, ch. 71 (the counterattack''s first phase, Oct. 20–29; not the order). Made public: Check. See [[cal.1962-10-24.south-asia-2]]. Check: the order''s record (Chen gives none).'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-04.south-asia
      when: Nov. 4
      date: '1962-11-04'
      thread: south-asia
      also: [china]
      c: 'Zhou Enlai to Nehru, by letter, again: a call to reopen talks on the boundary.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("十一月四日，周恩来总理再次写信给尼赫鲁总理，呼吁重开谈判解决中印边界问题"). To check: the letter''s text. See [[cal.1962-10-24.south-asia-3]]. Names: Zhou Enlai, Nehru.'
      tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-14.china
      when: Nov. 14
      date: '1962-11-14'
      thread: china
      also: [south-asia]
      c: 'The Central Committee''s notice on the border clashes and relations with India: the war has exposed "the true face of Indian reactionaries" and shown "the power and reputation of the Chinese military and the motherland."'
      n: '[[w.jian-zhou-enlai]], 484. Made public: Check. To check: the Central Committee''s Notice on the Chinese-Indian Border Clashes and Questions Concerning Chinese-Indian Relations, Nov. 14, 1962, 855-6-2288-4, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 764 n.91).'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-19.china
      when: Nov. 19
      date: '1962-11-19'
      thread: china
      also: [south-asia]
      c: 'Zhongnanhai. Mao Zedong twice calls Zhou Enlai and others to meetings at his residence.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71; [[w.jian-zhou-enlai]], 482 (Nov. 18: Zhou "rushed to Mao''s residence half an hour" after Mao''s note, and told him this was something new). Made public: Check (2011 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 169; [[w.zhou-enlai-nianpu-1949]], II, 513–14 (cited by [[w.jian-zhou-enlai]], 764 n.85). Names: Mao Zedong, Zhou Enlai. Check: the subject (the zhuan gives none); the day (Chen: Nov. 18).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-11-19.south-asia
      when: Nov. 19
      date: '1962-11-19'
      thread: south-asia
      also: [china]
      c: 'Afternoon. Mao Zedong reads in *Cankao ziliao* that India''s Prime Minister and President spoke on Nov. 18 of a peaceful settlement. His note: "突然大谈和平解决。送总理阅。请外交部研究一下，印度领导人过去几天，是否有过十八日这种论调" (suddenly a great deal of talk of a peaceful settlement. To the Premier to read. The Foreign Ministry to look into whether India''s leaders talked this way in the days before the 18th).'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("同一天下午"); [[w.jian-zhou-enlai]], 482 (Nov. 18; the President, Radhakrishnan, alone; Chen''s translation: "Why suddenly talk so loudly about a peaceful settlement? Please read this. The Foreign Ministry should study whether other Indian leaders have made similar comments in the past several days"). Made public: Check (2011 at the latest). To check: Mao''s note on *Cankao ziliao*, no. 5406, manuscript, Nov. 19, 1962 (cited by [[w.mao-zedong-zhuan]], V, ch. 71 n.3); [[w.zedong-mao-zedong-nianpu]], V, 169 (cited by [[w.jian-zhou-enlai]], 764 n.84). See [[cal.1962-11-19.china]]. Names: Mao Zedong. Check: the day: Chen has Nov. 18.'
      tags: [name:mao-zedong, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-19.south-asia-2
      when: Nov. 19
      date: '1962-11-19'
      thread: south-asia
      also: [china]
      c: 'Zhou Enlai and Chen Yi see P. K. Banerjee, India''s chargé d''affaires: "中印两国应该友好下去。我们应该向远处看" (China and India should stay friends. We should look far ahead); Zhou ready to go to Delhi to settle the boundary by talks.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("随后", after Mao''s meetings); [[w.jian-zhou-enlai]], 482 (at midnight, after Mao''s note of Nov. 18; Zhou alone: he agrees with Radhakrishnan, talks to resume at once; "I have been to New Delhi four times. I am willing to go there a fifth time"; Banerjee to report to Nehru at once). Made public: Check (1990 at the latest). To check: [[w.zhou-enlai-nianpu-1949]], II, 513–14; [[w.zedong-mao-zedong-nianpu]], V, 169; [[w.banerjee-my-peking-memoire-of]], 72 (cited by [[w.jian-zhou-enlai]], 764 n.86). See [[cal.1962-11-19.south-asia]]. Names: Zhou Enlai, Chen Yi. Check: the day (Chen: midnight, after Nov. 18).'
      tags: [name:zhou-enlai, name:chen-yi, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-20.south-asia
      when: Nov. 20
      date: '1962-11-20'
      thread: south-asia
      also: [china]
      c: 'Mao Zedong, Liu Shaoqi, Zhou Enlai and others decide to move first and take the initiative to ease the tension on the border.'
      n: '[[w.mao-zedong-zhuan]], V, ch. 71 ("先走一步，主动采取积极的步骤"; the decision: a cease-fire along the whole line and a withdrawal, unasked). Made public: Check (2011 at the latest). See [[cal.1962-11-19.south-asia-2]]. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai.'
      tags: [name:mao-zedong, name:liu-shaoqi, name:zhou-enlai, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-11-24.china
      when: Nov. 24
      date: '1962-11-24'
      thread: china
      also: [south-asia]
      c: 'Zhou Enlai to the National People''s Congress Standing Committee: Nehru unwilling to let go of "his vision of a great Indian empire"; "we needed to fight the war and to fight a big war, as a small war would not work"; the troops pulled back because "we fought the war for justice, not to change the status quo, which can only be changed through negotiation."'
      n: '[[w.jian-zhou-enlai]], 484 (Chen''s translation; "People''s Congress leaders"). Made public: Check. To check: Zhou''s speech at a meeting of the Standing Committee of the People''s Congress, Nov. 24, 1962, 1057-8-44, Hebei Provincial Archive (cited by [[w.jian-zhou-enlai]], 764 n.94). Names: Zhou Enlai, Nehru.'
      tags: [name:zhou-enlai, name:nehru-jawaharlal, polity:prc, polity:india]
# ---------------------------------------------------------------- the bomb's committee; Japan
- add:
    entry:
      id: cal.1962-11-03.china-2
      when: Nov. 3
      date: '1962-11-03'
      thread: china
      c: 'Mao Zedong approves Luo Ruiqing''s proposal of a special committee under the Center for the atomic industry: it is to tackle its work "by going all out in coordination."'
      n: '[[w.jian-zhou-enlai]], 515–16. Made public: Check (2013 at the latest). To check: [[w.zedong-mao-zedong-nianpu]], V, 167 (cited by [[w.jian-zhou-enlai]], 767 n.100). See [[cal.1962-10-30.china]]. Names: Mao Zedong, Luo Ruiqing.'
      tags: [name:mao-zedong, name:luo-ruiqing, polity:prc]
- add:
    entry:
      id: cal.1962-11-17.china
      when: Nov. 17
      date: '1962-11-17'
      thread: china
      c: 'The special committee on the atomic industry formally established, Zhou Enlai at its head.'
      n: '[[w.jian-zhou-enlai]], 516 (it meets three times before the month is out). Made public: Check (2013 at the latest). To check: [[w.zhonggong-zhongyang-wenjian-xuanji]], XLI, 426–27 (cited by [[w.jian-zhou-enlai]], 767 n.101). See [[cal.1962-11-03.china-2]]. Names: Zhou Enlai.'
      tags: [name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10.japan
      when: Oct., late
      date: '1962-10'
      thread: japan
      also: [china]
      c: 'Tatsunosuke Takasaki leads a large Japanese delegation to China; Zhou Enlai talks with him.'
      n: '[[w.jian-zhou-enlai]], 505. Names: Zhou Enlai. Check: the day.'
      tags: [name:zhou-enlai, polity:japan, polity:prc]
- add:
    entry:
      id: cal.1962-11-09.japan
      when: Nov. 9
      date: '1962-11-09'
      thread: japan
      also: [china]
      c: 'Liao Chengzhi and Tatsunosuke Takasaki sign a trade memorandum, the ground of what became the L-T trade agreement.'
      n: '[[w.jian-zhou-enlai]], 505. To check: [[w.zhonghua-renmin-gongheguo-jingji]], 432–33, 469–71 (cited by [[w.jian-zhou-enlai]], 766 n.50). See [[cal.1962-10.japan]].'
      tags: [polity:prc, polity:japan]
# ---------------------------------------------------------------- cites, checks: entries the calendar holds
- cite:
    id: cal.1962-10-05.vietnam-hanoi
    item: '[[w.jian-zhou-enlai]], 494 (Mao and Zhou with Giap; Mao, in Chen''s translation: "in the past years, we have not thought much about the offensives by the imperialists. We now should give some good attention to it"; the Vietnamese have "caught one of the Americans'' five fingers"; "it is not an easy decision for the United States to intervene"; China "will pay very close attention to the situation in South Vietnam and Laos"; not the place, the hour, the others present or the fleas)'
    units: '?'
- to-check:
    id: cal.1962-10-05.vietnam-hanoi
    add:
    - 'Mao''s conversation with Giap, Oct. 5, 1962, Chinese Central Archive (cited by [[w.jian-zhou-enlai]], 765 n.11)'
- cite:
    id: cal.1962-10-08.south-asia
    item: '[[w.jian-zhou-enlai]], 479 (an enlarged meeting of the Standing Committee, Zhou present, to hear the General Staff''s briefing on the conflict; after hearing Luo Ruiqing and others, Mao decides on a "war of self-defense against the invading Indian troops"; not the hour or the others present)'
    units: '?'
- to-check:
    id: cal.1962-10-08.south-asia
    add:
    - '[[w.zishen-yang-chengwu-nianpu-chronological]], 368; [[w.zhou-enlai-nianpu-1949]], II, 500 (cited by [[w.jian-zhou-enlai]], 763 n.71)'
- cite:
    id: cal.1962-10-08.south-asia-3
