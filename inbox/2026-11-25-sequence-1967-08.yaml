patch: 2026-11-25-sequence-1967-08
by: 'Claude (Sonnet, sequence pass: R25c on August 1967), Nov. 25, 2026; audited and corrected by Claude (Opus, R25c, R33b), Nov. 25, 2026; notes/sequence/1967-08.md, notes/sequence/audit-1967-08.md'
