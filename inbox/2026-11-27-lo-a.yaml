- edit:
    id: cal.1961-04-20.cuba-bay-of-pigs
    base: 6189e45e
    kind: correct
    settles:
    - 'Check: *Six Crises*''s introduction (xi)'
    - 'Check: *Six Crises*, 406 n.12, puts it in May.'
    - 'Check: Reeves puts the talk'
    set:
      n: '[[w.schlesinger-thousand-days-1965]], 336–37 (Nixon''s account, as Schlesinger quotes it); [[w.nixon-rn]], 233–35; [[w.nixon-six-crises]], xi (the visit, in April, Nixon''s first to Kennedy since the inauguration; Kennedy on a public man''s writing a book); [[w.sorensen-kennedy]], 308 (Thursday morning, Kennedy planning talks with every Republican leader, to guard national unity); [[w.wofford-of-kennedys-and-kings]], 352 (Thursday, Apr. 20, Kennedy asks Nixon to the White House: "What would you do now in Cuba?" Nixon: "I would find proper legal cover, and I would go in"; Kennedy fears Khrushchev will move on Berlin; not Laos). [[w.reeves-president-kennedy]], 99–100 (Nixon for going in). [[w.nixon-six-crises]], 406 n.12 (Kennedy asks Nixon to the White House after the Cuban defeat). Made public: Nixon, *Reader''s Digest*, Nov. 1964. To check: Richard M. Nixon, "Cuba, Castro and John F. Kennedy," *Reader''s Digest*, Nov. 1964 (cited by [[w.schlesinger-thousand-days-1965]], 337 n.). After [[cal.1961-04-20.cuba|the address]]: the news conference of Apr. 21 has the statement on Cuba "yesterday afternoon" and the talk with Nixon "last night" ([1961 Pub. Papers 307](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=365), items 1, 5). See [[cal.1961-03-29.cuba]]. The Papers settle the day and the part of it: Kennedy, Apr. 21, "last night," the Vice President "came to the White House at my invitation"; so Apr. 20, at night. *Six Crises*, 406 n.12, puts it in May; Reeves (99) puts the talk the afternoon of Apr. 19, with the Revolutionary Council; *Six Crises*, xi, April. Names: Nixon, Kennedy.'
      time_range:
      - 1961-04-21T03:00Z
      - 1961-04-21T05:00Z
      time_band: night
    unset:
    - range_basis
