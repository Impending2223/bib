      n: '[S. Rep. No. 94-465, 129–30 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=140) (K–J Adm. II.H.3): the friend unnamed; the White House telephone logs, 70 contacts with her, from the end of 1960 to mid-1962. [[w.schlesinger-robert-kennedy-and-his]], 494–95 (Hoover''s memorandum, the Giancana tie); [[w.branch-parting-the-waters]], 566–68 (the memorandum''s matter; the copy to O''Donnell, 568); [[w.thomas-robert-kennedy]], 166–67 (Hoover''s two memoranda of Feb. 27, to O''Donnell and to Robert Kennedy); [[w.reeves-president-kennedy]], 288 (the identical memoranda to Robert Kennedy and O''Donnell: Campbell "a regular companion" of Giancana and Roselli). Check: Branch, 566–67, gives the investigation as one of the Las Vegas wiretap on Phyllis McGuire, Maheu''s and Giancana''s, and the memorandum as counting some seventy calls by Campbell to the White House; Rosselli unnamed. To check: [[w.gage-g-man]]. See [[cal.1961-05-22.robert-kennedy]]. Made public: the Church Committee''s interim report, Nov. 20, 1975, without her name; her name in the press, Dec. 1975. Check the date. Names: Hoover, Campbell, Giancana, Robert Kennedy, O''Donnell, Lincoln, Rosselli.'
