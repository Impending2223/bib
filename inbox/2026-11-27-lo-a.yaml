    kind: correct
    set:
      c: 'Cable to Dearborn, the consul general at Ciudad Trujillo, revised by Goodwin, with the President''s words: the United States "as matter of general policy cannot condone assassination. This last principal is overriding." The machine guns the dissidents ask for not to be passed.{1}'
      n: '[S. Rep. No. 94-465, 212–213 (1975)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=223); [[w.schlesinger-robert-kennedy-and-his]], 491. [[w.reeves-president-kennedy]], 141; [[w.sen-church-alleged-assassination-plots]], 212–13 (the cable of May 29, revised by Goodwin: "we must not run risk of U.S. association with political assassination, since U.S. as matter of general policy cannot condone assassination. This last principal is overriding and must prevail in doubtful situation," the italicized words inserted at the President''s direction by Goodwin''s testimony; the machine guns not to be transferred). The report prints "principal," not "principle" (S. Rep. No. 94-465, 213). Made public: the Church Committee''s interim report, Nov. 20, 1975. Names: Goodwin, Kennedy.'
