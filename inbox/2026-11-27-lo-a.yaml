      n: 'Address Before the American Society of Newspaper Editors, [1961 Pub. Papers 304](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=362) (Apr. 20, 1961). The news conference of Apr. 21 calls the statement on Cuba "yesterday afternoon" ([1961 Pub. Papers 307](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=365), item 1). [[w.logsdon-decision-to-go-to]] prints the memo; [[w.marolda-united-states-navy-and]], 100 (the address). [[w.schlesinger-thousand-days-1965]], 286–88 (the address); [[w.sorensen-kennedy]], 308, 629 (the address to the editors); [[w.sorensen-kennedy]], 629–30; [[w.sorensen-kennedy]], 525; [[w.goodwin-remembering-america]], 180 ("the day after the invasion collapsed," "the most truculent statement of his administration": "our restraint is not inexhaustible"; "we do not intend to be lectured on intervention by those whose character was stamped for all time on the bloody streets of Budapest"; not the editors or the space question). [[w.jones-bay-of-pigs]], 132. See [[cal.1961-04-12.space]]. Names: Johnson.'
- src:
    id: cal.1961-04-20.cuba
