- edit:
    id: cal.1960-01-14.soviet-union
    base: 9aff01cb
    kind: correct
    settles:
    - 'Check: Fursenko and Naftali have Eisenhower call it'
    set:
      c: 'Khrushchev to the Supreme Soviet: the armed forces cut by 1.2 million men, to 2,423,000.{1} Rockets to replace the air force; bomber production stopped.{2}'
      n: '[FRUS 1958–60, X, pt. 1, doc. 140](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140) (NSC, Jan. 14). [[w.current-digest-of-the-soviet-press]], Feb. 10, 1960, 3–16, 23, for the text. [[w.fursenko-khrushchevs-cold-war]], 252–53 (the cut, 1.2 million). Dulles''s report to the NSC that morning (FRUS 1958–60, X, pt. 1, doc. 140) is entered on its own. To check: [[w.taubman-khrushchev]]; [[w.zubok-failed-empire]]. Names: Khrushchev, Dulles.'
      src:
        c: 64ad50ce
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140: 1, 2'
        - 'w.fursenko-khrushchevs-cold-war 252–53: 1'
- add:
    entry:
      id: cal.1960-01-14.soviet-union-2
      when: Jan. 14
      date: '1960-01-14'
      place: washington
      thread: soviet-union
      also:
      - defense
      follows:
      - cal.1960-01-14.soviet-union
      time: 1960-01-14T14:00Z
      time_zone: America/New_York
      c: 'Dulles reports Khrushchev''s speech to the NSC, 432d meeting: forces to 2,423,000; the air force to be replaced by rockets; bomber production stopped; Kirichenko demoted. Eisenhower: not at first glance a very tough speech.'
      n: '[FRUS 1958–60, X, pt. 1, doc. 140](https://history.state.gov/historicaldocuments/frus1958-60v10p1/d140) (NSC, Jan. 14). [[w.fursenko-khrushchevs-cold-war]], 252 (Dulles at the NSC that day). Check: Fursenko and Naftali have Eisenhower call it "[a] very tough speech" against Dulles (252, citing the NSC record, n.37); the record gives Dulles the words, the President the view that it "did not appear at first glance to be a very tough speech" (FRUS 1958–60, X, pt. 1, doc. 140). See [[cal.1960-01-14.soviet-union]]. Names: Dulles, Eisenhower, Khrushchev.'
      tags:
      - name:dulles-allen-w
      - name:eisenhower-dwight-d
      - name:khrushchev-nikita-s
- edit:
    id: cal.1960-01-19.japan-and-korea
    base: e835f6c3
    kind: correct
    set:
      n: 'Joint Statement Following Discussions With Prime Minister Kishi of Japan, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165); Remarks at the Signing, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (Jan. 19, 1960). FRUS 1958–60, XVIII, docs. [132](https://history.state.gov/historicaldocuments/frus1958-60v18/d132)–[146](https://history.state.gov/historicaldocuments/frus1958-60v18/d146). After [[cal.1960-01-19.soviet-union|the morning''s talk]]: the joint statement has the two confer "prior to the formal signing," and the note to the remarks puts the ceremony in the East Room after the luncheon, which began at 2:06 p.m. (1960–61 Pub. Papers 112–13). The status of forces agreement signed the same day, [11 U.S.T. 1652](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=360). The announcement of Jan. 20 that Eisenhower would visit Japan (1960–61 Pub. Papers 113, note) is entered on its own. To check: [[w.packard-protest-in-tokyo]]; [[w.kapur-japan-at-the-crossroads]]; [[w.schaller-altered-states]]; [[w.lafeber-clash]]; [[w.eisenhower-white-house-years]]. Names: Eisenhower, Herter, Kishi.'
      c: Treaty of Mutual Cooperation and Security with Japan signed at the White House, Herter and Kishi among the signers, [11 U.S.T. 1632](https://tile.loc.gov/storage-services/service/ll/lltreaties//lltreaties-11-2/lltreaties-11-2.pdf#page=340), [373 U.N.T.S. 179](https://treaties.un.org/doc/Publication/UNTS/Volume%20373/v373.pdf#page=195). For the treaty of 1951; ten years; prior consultation on major changes in American forces in Japan.
      time_range:
      - 1960-01-19T19:06Z
      - 1960-01-19T22:00Z
    unset:
    - range_basis
    - time_band
