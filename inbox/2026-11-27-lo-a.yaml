    base: 0e31b139
    kind: correct
    set:
      when: June 15
      c: Tokyo. Zengakuren students force their way into the Diet's grounds; a woman student, Kanba Michiko, killed, some 600 hurt.
      n: 'FRUS 1958–60, XVIII, docs. [181](https://history.state.gov/historicaldocuments/frus1958-60v18/d181) (MacArthur: "last night''s bloody riot") and [183](https://history.state.gov/historicaldocuments/frus1958-60v18/d183) (one death and some 600 injured). The request and Eisenhower''s answer of June 16 are entered on their own (FRUS 1958–60, XVIII, docs. 182, 184; 1960–61 Pub. Papers 495). [[w.watson-into-the-missile-age]], 639 (Kishi "forced to ask Eisenhower to postpone a scheduled visit to Japan"; no day; not the students, the dead or Manila). See [[cal.1960-01-19.japan-and-korea]]. Names: Kishi, Eisenhower, Kanba.'
      src:
        c: 7aac81a7
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1958-60v18/d181: all'
        - 'https://history.state.gov/historicaldocuments/frus1958-60v18/d183: all'
        - 'w.watson-into-the-missile-age 639: ?'
