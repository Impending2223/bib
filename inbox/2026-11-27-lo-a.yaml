      id: cal.1960-07-06.cuba
      when: July 6
      date: '1960-07-06'
      place: havana
      thread: cuba
      c: 'Havana''s Law 851: American property may be nationalized. The eight-article law, the Council of Ministers'', lets Castro and Dorticós nationalize American property by resolution, paying in thirty-year bonds at no more than 2 percent, the interest due only if the United States buys at least 3,000,000 tons of Cuban sugar a year at 5.75 cents a pound or more.'
      n: 'Tad Szulc, "Ex-Cuban Premier Quits Regime and Asks Asylum," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 3. See [[cal.1960-07-06.cuba-2]]. Names: Castro, Dorticós.'
      tags:
      - name:castro-fidel
      - name:dorticos-torrado-osvaldo
