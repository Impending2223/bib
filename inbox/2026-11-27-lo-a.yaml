    set:
      n: '[S. Rep. No. 94-755, Book III, 88 (1976)](https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94755-iii.pdf#page=91) (K–J Adm. II.H.3): the adviser is "Adviser A," Levison not named; the microphone installed Mar. 16, the wiretap Mar. 20, authorized by the Attorney General on Hoover''s memorandum of Mar. 6 (n.34, run on to 89). [[w.schlesinger-robert-kennedy-and-his]], 355; [[w.branch-parting-the-waters]], 568–69; [[w.kotz-judgment-days]], 72; [[w.thomas-robert-kennedy]], 170 (Robert Kennedy signs off on the wiretap). Check: Branch, 568–69 & n.2, gives the microphones authorized by Hoover Mar. 2, planted by agents who broke into the office the night of Mar. 15, the receivers turned on at 10:10 a.m. Mar. 16, the wiretap hooked up the afternoon of Mar. 20 (citing SAC New York to Director, airtels, Mar. 16, 20, 1962, FBI file 100-392452, serials 146, 147). Check: Thomas puts the authorization in February 1962, a few days after Hoover told Robert Kennedy of Exner (250, citing Branch, 568). Check: the report''s note (Book III, 88 n.34, run on to 89) has the microphone "approved only at the FBI division level" (Bland to Sullivan, Mar. 2, 1962) and the wiretap authorized by the Attorney General; it does not say he was not told of the microphone. Made public: S. Rep. No. 94-755, Book III (1976). See [[cal.1962-01-08.king]]. Names: Hoover, Robert Kennedy, Levison.'
