- add:
    entry:
      id: cal.1960-01-19.japan-and-korea-treaty-2
      when: Jan. 19
      date: '1960-01-19'
      place: washington
      thread: japan-and-korea-treaty
      also: []
      time_range:
      - 1960-01-19T20:30Z
      - 1960-01-19T22:30Z
      time_zone: America/New_York
      c: 'Kishi and Herter, 3:30 to 5:30 p.m., with Fujiyama, MacArthur and others: economic problems; defense buildup, military assistance, the F-104; the Ryukyus and Bonins; Korea; Communist China; space and weather cooperation; European trade blocs; the Law of the Sea Conference.'
      n: 'FRUS 1958–60, XVIII, docs. [139](https://history.state.gov/historicaldocuments/frus1958-60v18/d139)–[146](https://history.state.gov/historicaldocuments/frus1958-60v18/d146) (Washington, Jan. 19, 1960, 3:30–5:30 p.m.; the subjects are the memoranda''s own). See [[cal.1960-01-19.japan-and-korea]]. Check: the year FRUS 1958–60, XVIII, was published. Names: Kishi, Herter, Fujiyama, MacArthur.'
      tags:
      - name:kishi-nobusuke
      - name:herter-christian-a
      - name:fujiyama-aiichiro
      - name:macarthur-douglas-ii
- add:
    entry:
      id: cal.1960-01-20.japan-and-korea-treaty
      when: Jan. 20
      date: '1960-01-20'
      place: washington
      thread: japan-and-korea-treaty
      c: 'White House: Kishi has invited Eisenhower to visit Japan for the centennial; Eisenhower accepts and will go about June 20.'
      n: 'Remarks at the Signing, note, [1960–61 Pub. Papers 113](https://www.govinfo.gov/content/pkg/PPP-1960-book1/pdf/PPP-1960-book1.pdf#page=165) (the announcement of "the following day," Jan. 20, 1960). FRUS 1958–60, XVIII, [doc. 134](https://history.state.gov/historicaldocuments/frus1958-60v18/d134) has Eisenhower tell Kishi on Jan. 19 that he accepts. See [[cal.1960-01-19.japan-and-korea]]. Names: Eisenhower, Kishi.'
      tags:
      - name:eisenhower-dwight-d
      - name:kishi-nobusuke
