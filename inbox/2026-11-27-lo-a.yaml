      c: 'News conference, the second, State Department auditorium, 4 p.m. Announced: the ban on dependents'' travel abroad to be lifted; five pilot food-stamp areas; faster Veterans Administration insurance dividends, over $250 million; a lower FHA maximum interest. Asked about Khrushchev and the U.N., the RB-47 fliers, a tax cut (not now), the Congo.'
