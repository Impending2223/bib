      c: 'Rusk to Kohler, 2:31 p.m., by telegram 1160, eyes only: puzzled by the timing and motive of the Soviet holdup of the convoy. He lists four possibilities: a coming crisis, the months of détente
        a huge deception; a split in the Moscow regime; Khrushchev, beset, showing force at small risk; Soviet military in Germany out to make trouble. He asks Kohler to report any sign.'
