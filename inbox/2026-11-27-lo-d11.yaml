- edit:
    id: cal.1963-07-12.china-leadership-5
    base: e8d8227c
    set:
      time: 1963-07-12T11:00Z
      variants:
      - unit: '1'
        witness: w.brothers-in-arms
        reads: the meeting set on the 10th for ten o'clock
        at: '385'
      - unit: '4'
        witness: w.lengxi-shinian-lunzhan-1956-1966
        reads: the Soviets propose to meet again that afternoon (他们提出下午继续开会), the fifth meeting "the same day's afternoon" (当天下午)
        at: '608'
      c: 'Moscow, 2 to 6 p.m.{1} Fourth meeting.{2} Deng Xiaoping''s second speech, on the CPSU''s splitting, from Bucharest on: the CPSU wields its baton, makes a split of its own and drives other parties
        to split, carries ideological difference into relations between states, with China and with Albania.{3} He asks why the Soviets, speaking of the differences, say nothing of the withdrawal of all
        experts from China and the tearing up of the contracts; and on Cuba which of two Soviet lines, Kennedy a pirate or Kennedy a lover of peace, stands. Suslov, pale and red by turns, says the Soviets
        will answer next time, and asks to meet again at 2 p.m. the next day.{4} Peng Zhen attends.{5} By the Soviet record Deng says that under Moscow''s line of peaceful transition the Cuban People''s
        Socialist Party attacked Castro''s armed struggle as "putschism," the Algerian party renounced armed struggle, and the Iraqi party was unready for the coup of Feb. 8, 1963.{6}'
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 606–608 ("the fourth meeting on July 12, Deng''s second speech"; "before the break"; Deng: "if you follow your baton and fall into your own trap, you contradict
        the facts"; Deng on Cuba: "what do you mean to have us follow?"); [[w.macfarquhar-origins-of-the-cultural]], III, 352 (Deng speaks again, July 12); [[w.yang-shangkun-riji]], II, 296 (July 12, 1963;
        the session, 2 to 6 p.m.: Deng speaks; the Soviets ask to meet again at 2 p.m. the next day); [[w.deng-xiaoping-nianpu-1904]], III, 1764 (July 12, 1963; Deng at the fourth meeting; speaks that the
        differences show chiefly in two great questions, whether to have revolution and whether to keep the socialist camp united; says that on a series of questions the Soviet Union practices splitting,
        not internationalism); [[w.brothers-in-arms]], 385–386 (the Soviet record, July 12, set on the 10th for "ten o''clock" (385): Deng: under Moscow''s line of peaceful transition the Cuban People''s
        Socialist Party attacked Castro''s armed struggle, the Algerian party renounced armed struggle, the Iraqi party was unready for the coup of Feb. 8, 1963); [[w.peng-zhen-nianpu-1902]], IV, 283 (July
        12, 1963; Peng Zhen at the fourth meeting; Deng Xiaoping: the differences come to two questions, revolution or not, the camp''s unity or not; the Soviet Union practices splitting, not internationalism);
        [[w.peng-zhen-nianpu-1902]], IV, 283; [[w.brothers-in-arms]], 385–86. Made public: 1997 ([[w.macfarquhar-origins-of-the-cultural]], III, 352). To check: [[w.jin-1949-1989-niande-zhongguo]], 589
        (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 352 n.27a). See [[cal.1963-07-10.china-leadership-3]]. The hour: 2 to 6 p.m., by [[w.yang-shangkun-riji]], II, 296, which has the Soviets
        give notice on July 11 that the next day''s session is moved from the morning to 2 p.m. (II, 296); the Soviet record has the meeting set on the 10th for ten o''clock ([[w.brothers-in-arms]], 385).
        The next meeting: 2 p.m. on July 13, by the same diary (苏方提出明天下午2时继续会谈, II, 296), the Soviet record (386) and the Peng Zhen and Deng Xiaoping nianpus (IV, 283; III, 1764); Wu, 608, has it that afternoon.
        Names: Deng Xiaoping, Suslov, Peng Zhen, Castro.'
      src:
        c: aede024e
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 606–608: 1, 2, 3, 4'
        - 'w.macfarquhar-origins-of-the-cultural III, 352: 2, 3'
        - 'via w.macfarquhar-origins-of-the-cultural III, 352 n.27a: 2, 3'
        - 'w.deng-xiaoping-nianpu-1904 III, 1764: 2'
        - 'w.brothers-in-arms 385–386: 1'
        - 'via x.1963-07-05.records-cpsu-ccp-delegations: 1'
        - 'w.peng-zhen-nianpu-1902 IV, 283: 5'
        - 'w.brothers-in-arms 385–86: 6'
        - 'w.yang-shangkun-riji II, 296: 1, 2, 3'
