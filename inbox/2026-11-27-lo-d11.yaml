- add:
    entry:
      id: cal.1963-10-11.berlin-and-vienna-6
      when: Oct. 11
      date: '1963-10-11'
      time: 1963-10-11T21:30Z
      time_zone: America/New_York
      place: washington
      thread: berlin-and-vienna
      also:
      - soviet-union
      - defense
      c: 'Kennedy with Rusk, McNamara, Thompson, Tyler, Nitze, Manning and Bundy, 5:30 p.m.: Tyler sums up Kohler''s talk with Zorin, who left the impression that Moscow is not out to change convoy procedures,
        and the French consent to assemble the Free Style forces. The Russians count sixty-six men in the held convoy, the Americans thirty. Kennedy has Thompson ask Dobrynin to have Zorin tell the Soviet
        commander to meet General Baker on dismounting; no convoys meanwhile in the disputed size; the Free Style forces to begin assembling the next day.'
      n: '[FRUS 1961–63, XV, doc. 224](https://history.state.gov/historicaldocuments/frus1961-63v15/d224) (Memorandum of conference with President Kennedy, Oct. 11, 5:30 p.m.; no drafter shown; "General
        Clay (JCS)" among those present; the tripartite note; the 3 p.m. meeting of the Ambassadorial Group). See [[cal.1963-10-10.berlin-and-vienna]]. Names: Kennedy, Rusk, McNamara, Thompson, Tyler, Nitze,
        Bundy.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:thompson-llewellyn-e
      - name:tyler-william-r
      - name:nitze-paul
      - name:bundy-mcgeorge
- add:
    entry:
