- edit:
    id: cal.1963-11-22.succession
    base: 19a1861e
    set:
      n: 'Remarks Upon Arrival at Andrews Air Force Base, [1963–64 Pub. Papers 1](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=85) (Nov. 22, 1963). [President''s Daily
        Diary, Nov. 22, 1963](https://catalog.archives.gov/id/192430), images 7, 9 (LBJ Library; National Archives Catalog). [[w.johnson-vantage-point]], 14–17 (the oath, Hughes, Mrs. Kennedy beside him;
        the words at Andrews); [[w.dallek-flawed-giant]], 49–50 (the oath aboard Air Force One, Mrs. Kennedy beside him); [[w.shesol-mutual-contempt]], 115 (Katzenbach: "Anybody" can swear him in, Sarah
        Hughes likely; Robert Kennedy tells Johnson so); [[w.bernstein-guns-or-butter]], 15–17 (all but the time; the plane off at 2:41 p.m., at Andrews at 5:59); [[w.young-two-suns-of-the]], 47–48 (the
        oath aboard Air Force One at Love Field, by Judge Hughes; Mrs. Kennedy at the swearing in, by Valenti''s account); [[w.whalen-longest-debate]], 71 (the words at Andrews, "I will do my best ... That
        is all I can do. I ask for your help--and God''s"; also the oath in the plane at Love Field, 98 minutes after Kennedy died, not the hour or the judge); [[w.johnson-white-house-diary]], 5–6, 7 (the
        oath at Mrs. Kennedy''s side, Mrs. Johnson beside him, Judge Hughes before him; the brief statement at Andrews; not the time, the words of the oath or of the statement: "Only about four sentences");
        [[w.valenti-very-human-president]], 47–48 (the oath: Katzenbach''s wording read back, Judge Hughes, Mrs. Kennedy "at the left side of LBJ"; the hour given as "2:40 CST"); [[w.valenti-very-human-president]],
        56 (Andrews, "precisely 6:10 p.m. Eastern Standard Time": "I will do my best. That is all I can do. I ask for your help—and God''s"); [[w.obrien-no-final-victories]], 163–64 (Judge Hughes arrives
        and is handed a typed sheet with the oath; Johnson asks O''Brien whether Mrs. Kennedy would join him; she comes and stands with the Johnsons; O''Brien hands the judge a book in a white box from
        the President''s bedside table, a Catholic missal, not a Bible; not the hour or Andrews); [[w.obrien-no-final-victories]], 164. [[w.caro-passage-of-power]], 329–36, 356, 365. Shesol, 115, has Judge
        Hughes arrive at 3:38 p.m., no zone given; read as Eastern time, it is 2:38 p.m. Central, the Public Papers'' hour; and Johnson''s hand on "John Kennedy''s Bible." Check: O''Brien, 164, has a Catholic
        missal. To check: [[w.manchester-death-of-a-president]]; [[w.holland-kennedy-assassination-tapes]]; [[w.gillon-kennedy-assassination-24-hours]]; [[w.taking-charge-2001]]; [[w.presidential-recordings-2005]];
        Hughes''s account as told to Michael Drury, Special Files, Assassination, LBJ Library (cited by [[w.caro-passage-of-power]], 335); Kenneth P. O''Donnell OH, LBJ Library (cited by [[w.dallek-flawed-giant]],
        50). Names: Johnson, Jacqueline Kennedy, Hughes, O''Brien. Check: the Daily Diary gives the oath at 2:40 p.m. (image 9); so does Johnson, "approximately 2:40 p.m. Central Standard Time" (15); the
        Public Papers'' note to item 1, 2:38.'
    settles:
    - 'Check: Shesol, 115,'
