- add:
    entry:
      id: cal.1963-12-28.europe-and-the-alliance-6
      when: Dec. 28
      date: '1963-12-28'
      time: 1963-12-28T21:15Z
      time_zone: America/Chicago
      place: lbj-ranch
      thread: europe-and-the-alliance
      also:
      - soviet-union
      c: 'The LBJ Ranch, 3:15 to 5:15 p.m. Johnson with Rusk and ten officials, Erhard with Schroeder and twelve: East–West relations (part 5 of 5). Erhard: Western suggestions have met few encouraging
        answers; the test ban cut the threat of a hot war; the West needs a more exact evaluation of the Soviet position; he favors the proposed wheat sales; the recent autobahn incidents were no accident;
        the Christmas pass issue has dynamite in it.'
      n: '[FRUS 1961–63, XV, doc. 253](https://history.state.gov/historicaldocuments/frus1961-63v15/d253) (Memorandum of conversation, Dec. 28, 3:15 p.m.; the meeting ended at 5:15 p.m.). See [[cal.1963-12-28.europe-and-the-alliance]].
        Names: Johnson, Rusk, Erhard, Schroeder.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:erhard-ludwig
      - name:schroder-gerhard
