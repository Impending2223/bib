      c: 'The LBJ Ranch, 11 a.m. Johnson and Erhard, Bundy and the interpreters present: Germany and East–West negotiations (part 2 of 2). Erhard: Bonn cannot approach Khrushchev directly; would the United
        States, holding to self-determination, explore solutions with him? Germany ready to make real sacrifices, credits among them. Johnson: no meeting with Khrushchev until it can bring concrete results;
        a $50 billion defense budget; a dearth of new ideas; act while Khrushchev is weak, lest he go "for our jugular."'
      n: '[FRUS 1961–63, XV, doc. 254](https://history.state.gov/historicaldocuments/frus1961-63v15/d254) (Memorandum of conversation, Dec. 29, 11 a.m.). See [[cal.1963-12-28.europe-and-the-alliance]].
        Names: Johnson, Erhard, Bundy, Khrushchev.'
      tags:
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:bundy-mcgeorge
      - name:khrushchev-nikita-s
