      when: Oct. 11
      date: '1963-10-11'
      time: 1963-10-11T23:00Z
      time_zone: America/New_York
      place: washington
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Thompson calls in Dobrynin, 7 p.m.: Kohler''s talks with Smirnovsky and Zorin; the American right of access, no duty to notify or dismount; the practice at the checkpoints. General Clay telephones
        a list of convoys since May 1: only two held, and briefly. Dobrynin, at first reluctant, agrees to send Zorin a message; he and Gromyko are upset at the incident and the attention of the press.'
      n: '[FRUS 1961–63, XV, doc. 225](https://history.state.gov/historicaldocuments/frus1961-63v15/d225) (Memorandum of conversation, Oct. 11; drafted by Thompson; "at 7:00 p.m."). See [[cal.1963-10-10.berlin-and-vienna]].
        Names: Thompson, Dobrynin, Gromyko, Zorin.'
      tags:
      - name:thompson-llewellyn-e
