      c: Peking 北京. At the dinner of Pakistan's Ambassador, Raza 罗查, at his residence, for the visiting Pakistani party for National Day, Zhou Enlai says the chief task now is to expose the three-power
        treaty's deceit of the world's peoples. When Raza says all agree it was Zhou who led the Bandung Conference and guided its course at the critical hours, he says no, it was everyone's merit, one
        man cannot do it, one must move all together.
      n: '[[w.zhou-enlai-waijiao-huodong]], 373 (Oct. 3, 1963; 晚7时30分, the dinner at Raza''s residence 其官邸 for the Pakistani National Day observation party 国庆观礼团); [[w.zhou-enlai-nianpu-1949]], II, 585
        (Oct. 3, 1963; at the dinner Zhou says the chief task now is to expose the three-power treaty''s deceit of the world''s peoples; to Raza''s words on Bandung, no, it was everyone''s merit). Made
        public: 1993. See [[cal.1963-10-03.china-leadership-3]]. Names: Zhou Enlai, Raza.'
      tags:
      - polity:prc
      - polity:pakistan
      - name:zhou-enlai
      - name:raza-nawabzada-agha-mohammad
      - vis:only:prc+pakistan
