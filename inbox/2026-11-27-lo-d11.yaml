      time_band: morning
      time_zone: America/New_York
      c: 'Huntley and Brinkley, for NBC''s first half-hour news.{1} The domino theory: "I believe it."{2} A cut in aid to Saigon not "helpful at this time."{3}'
      n: 'Transcript of Broadcast on NBC''s "Huntley-Brinkley Report.", [1963 Pub. Papers 658](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=716) (Sept. 9, 1963). Kennedy,
        interview with Chet Huntley and David Brinkley (Viet. II.J). [[w.gibbons-u-s-government-and]], II, 163 (the interview with Huntley; the domino theory); [[w.kaplan-mcnamara-ascendancy-1961-1965]],
        288 (the interview; the domino principle); [[w.mcnamara-in-retrospect]], ch. 3 at n.19. [[w.reeves-president-kennedy]], 592–93; [[w.selverstone-kennedy-withdrawal]], 147–48, 152 (Huntley and Brinkley,
        Sept. 9: the domino image affirmed three times; aid cuts "would not be helpful at this time"); [[w.mann-grand-delusion]], 290–91 (Kennedy to Huntley and Brinkley of NBC, Sept. 9: the domino theory,
        "I believe it"; on cutting aid, "it is possible you could have some effect upon the government structure there" but "you might have a situation which could bring about a collapse"; not the first
        half-hour newscast or "helpful at this time"); [[w.salinger-with-kennedy]], 114 (the exclusive for NBC''s Huntley-Brinkley show when it went to thirty minutes, cut to fit, Kennedy insisting on the
        White House''s final approval of what was shown, and NBC agreeing; not the words). [[w.sorensen-kennedy]], 658 (the interview). The interview was taped in his office on the morning of Sept. 9, the
        broadcast that evening (the Papers'' note, 661). To check: [[w.watson-expanding-vista]]. See [[cal.1963-09-02.vietnam]]. Names: Huntley, Brinkley, Kennedy.'
      src:
        c: 173f2eea
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=716: 1, 2, 3'
        - 'w.kaplan-mcnamara-ascendancy-1961-1965 288: 1, 2'
        - 'via w.kaplan-mcnamara-ascendancy-1961-1965 288 n.108: 1, 2, 3'
        - 'w.gibbons-u-s-government-and II, 163: 1, 2'
        - 'via w.gibbons-u-s-government-and II, 163 n.75: 1, 2'
        - 'w.reeves-president-kennedy 592–93: 1, 2, 3'
        - 'w.sorensen-kennedy 658: 1'
        - 'w.mcnamara-in-retrospect ch. 3 at n.19: 1, 2'
        - 'via x.1963-09-09.transcript-of-broadcast-on-nbcs-huntley: 1, 2'
        - 'w.selverstone-kennedy-withdrawal 147–48, 152: 1, 2, 3'
        - 'w.mann-grand-delusion 290–91: 2'
        - 'w.salinger-with-kennedy 114: 1'
