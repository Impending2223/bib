- edit:
    id: cal.1963-07-19.china-leadership
    base: 28c058ad
    set:
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 19, 1963; [[w.lengxi-shinian-lunzhan-1956-1966]], 615–616 (Wu: the eighth meeting, July 19, Kang Sheng speaking: he opens by charging the CPSU with breaking
        the agreement, made for the talks, that neither side publish, charge the other or disclose the talks, in the Open Letter, which put the differences before the world; then the dictatorship of the
        proletariat, the CPSU''s "party and state of the whole people" and Stalin, in a text prepared at Peking from several parts; Khrushchev''s praises of Stalin before the Twentieth Congress and abuse
        after; Suslov red in the face protests, Ponomarev tries several times to break in, Deng Xiaoping lets Kang Sheng finish, and Suslov protests again and rejects the speech, as never at the seven before);
        [[w.macfarquhar-origins-of-the-cultural]], III, 352 (Kang Sheng speaks, July 19); [[w.yang-shangkun-riji]], II, 299 (July 19, 1963; Kang Sheng speaks, 10 a.m. to 1 p.m., a twenty-minute break; the
        Chinese propose a recess for the Soviet delegation to consider); [[w.deng-xiaoping-nianpu-1904]], III, 1765 (July 19, 1963; Deng at the eighth meeting; after Kang Sheng speaks he says that the two
        parties have serious differences, that since the Pravda open letter of July 14 the Soviet press attacks the CCP, that in such conditions agreement on any question, even calm talks, is no longer
        possible; proposes for the delegation that the talks pause until another agreed time); [[w.brothers-in-arms]], 387–390 (the Soviet record, among excerpts printed under the heading July 13 that run
        on to this meeting: Kang Sheng on Khrushchev''s abuse of Stalin; Suslov''s protest at Peking radio''s propaganda; Deng: "two weeks have gone by," the meeting to adjourn, the time and place of the
        next to be set by the two Central Committees); [[w.peng-zhen-nianpu-1902]], IV, 284 (July 19, 1963; Peng Zhen at the eighth meeting; Deng Xiaoping proposes for the delegation that the talks pause
        and resume at a time agreed); [[w.peng-zhen-nianpu-1902]], IV, 284; [[w.yang-shangkun-riji]], II, 299; [[w.lengxi-shinian-lunzhan-1956-1966]], 615–616; [[w.deng-xiaoping-nianpu-1904]], III, 1765.
        Made public: 1997 ([[w.macfarquhar-origins-of-the-cultural]], III, 352). The hour: 10 a.m. to 1 p.m., by Yang''s diary of the day (II, 299); Wu, 616, has the delegation report to Peking that afternoon
        on "the afternoon''s talks" (下午会谈). To check: the delegation''s speeches and the Soviet record of the talks; [[w.jin-1949-1989-niande-zhongguo]], 589 (cited by [[w.macfarquhar-origins-of-the-cultural]],
        III, 352 n.27a). See [[cal.1963-07-18.china-leadership]]. Names: Mao Zedong, Kang Sheng, Deng Xiaoping, Suslov, Peng Zhen, Khrushchev, Ponomarev.'
