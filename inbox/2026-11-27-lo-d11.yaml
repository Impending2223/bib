      - name:gromyko-andrei
      - name:zorin-valerian
- add:
    entry:
      id: cal.1963-10-12.berlin-and-vienna
      when: Oct. 12
      date: '1963-10-12'
      place:
      - cincinnati
      - nyc
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Gromyko, in New York, telephones Rusk, at the Hebrew Union College in Cincinnati: the Soviet Union does not mean to change the autobahn procedures, it wants no incident on Berlin, and the incident
        is not to cut across what Gromyko told the President. He asks Rusk to see whether the American military tried to change the procedures. Rusk holds that the Soviet military did, and that Thompson''s
        talk with Dobrynin may clear it up. On a General Assembly resolution on bombs in orbit, Rusk says Stelle and Foster will be in New York from Monday.'
      n: '[FRUS 1961–63, XV, doc. 227](https://history.state.gov/historicaldocuments/frus1961-63v15/d227) (Memorandum of telephone conversation, Oct. 12; drafted by Rusk on Oct. 14; Rusk in Cincinnati,
        Gromyko in New York). Check: the hour of the call. See [[cal.1963-10-10.berlin-and-vienna]]. Names: Gromyko, Rusk, Thompson, Dobrynin, Foster.'
      tags:
