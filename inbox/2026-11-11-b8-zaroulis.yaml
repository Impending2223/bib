      c: 'Ball on "Meet the Press": "There is no decision on the part of the United States Government to bomb Haiphong or to bomb the fuel installations in Haiphong-Hanoi." The first strikes on the oil storage follow June 29.'
      n: '[[w.zaroulis-who-spoke-up]], 88 (three days before the first attack; the quotation). Check: the day; Zaroulis and Sullivan give none. To check: *Meet the Press*, the broadcast and its transcript. See [[cal.1966-06-29.vietnam]]. Names: Ball.'
