- add:
    entry:
      id: cal.1968-10-30.elections-1968
      when: Oct. 30
      date: '1968-10-30'
      thread: elections-1968
      also:
      - right-and-the-military
      c: 'H. L. Hunt, at Shreveport, asked whether he backs Bernard, Fulbright''s Republican opponent: he is doing all he
        can to defeat Fulbright on Nov. 5. Richard Viguerie raising Bernard''s money in the Tulsa-Dallas-Shreveport crescent;
        Fulbright for recognizing Red China, "hands off" Castro.'
      n: '[[w.woods-fulbright]], 495. Check: the day; Woods cites the *Memphis Commercial Appeal* of Oct. 31. To check:
        "Fulbright Tags Dallas Tycoon ''Eccentric'' Foe," *Memphis Commercial Appeal*, Oct. 31, 1968; Robert Webb to "Fellow
        American," Oct. 8, 1968, Series 78, Box 26:5, SPF (cited by [[w.woods-fulbright]], 495 nn.39–40). Names: Fulbright,
        Castro.'
      tags:
      - name:fulbright-j-william
      - name:castro-fidel
      - state:ar
