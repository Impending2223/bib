- add:
    entry:
      id: cal.1968-05-03.vietnam-congress
      when: May 3
      date: '1968-05-03'
      thread: vietnam-congress
      c: 'The opening of the National Collection of Fine Arts in the old Patent Office Building, the Smithsonian''s regents
        on the dais: Johnson goes out of his way to shake Fulbright''s hand, to applause. Days later he telephones Fulbright
        in Arkansas with a briefing on Paris: "the stud-duck of the opposition."'
      n: '[[w.woods-fulbright]], 488. Check: the days; Woods has early May and cites the *Washington Post* of May 4 and
        Westbrook to Fulbright, May 10. To check: "LBJ Tells Art Audience Peace Is Endless Effort," *Washington Post*, May
        4, 1968; Parker Westbrook to Fulbright, May 10, 1968, Series 1:1, Box 4:1, SPF (cited by [[w.woods-fulbright]],
        488 nn.10–11). Names: Johnson, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
