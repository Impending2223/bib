      date: '1968-06-27'
      thread: elections-1968-state-conventions
      also:
      - elections-1968
      c: 'Little Rock, the Democratic State Committee. Fulbright, at his first meeting of it, with proxies enough: the delegation
        to Chicago uncommitted, bound in the end to the party''s nominees, against Jim Johnson''s men and a bolt to Wallace.'
