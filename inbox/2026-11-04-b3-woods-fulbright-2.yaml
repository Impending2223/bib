- add:
    entry:
      id: cal.1967-10-20.elections-1968-2
      when: Oct. 20
      date: '1967-10-20'
      thread: elections-1968
      also:
      - vietnam-congress
      c: 'Fulbright on the service-club circuit in Arkansas. At Camden, Ark., asked whether he will support Johnson in 1968,
        he pushes the microphone away and walks out: "when I am trying to meet my people." At Hot Springs, to the Arkansas
        Home Builders: Rusk on "a McCarthy-type crusade" against the war''s opponents.'
      n: '[[w.woods-fulbright]], 465–66. Check: the days; Woods cites the *Arkansas Gazette* of Oct. 21. To check: "TV Man
        Gets Dressing Down by Fulbright," *Arkansas Gazette*, Oct. 21, 1967 (cited by [[w.woods-fulbright]], 465 n.45).
        Names: Fulbright, Johnson, Rusk.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rusk-dean
      - state:ar
