      when: Aug. 10
      date: '1968-08-10'
      thread: elections-1968-state-conventions
      also:
      - elections-1968
      c: 'The Arkansas Democratic State Committee instructs the delegation: Leon Catlett, its chairman, has promised the
        33 votes to Humphrey. McCarthy''s men move to make Fulbright the favorite son. Fulbright declines and withdraws
        as a delegate.'
      n: '[[w.woods-fulbright]], 493. Check: the day of his withdrawal. To check: "Fulbright Against Favorite-Son Movement
        in Party," *Pine Bluff Commercial*, Aug. 11, 1968; "Fulbright Won''t Be Delegate," *Mena Evening Star*, Aug. 16,
        1968 (cited by [[w.woods-fulbright]], 493 n.35). Names: Humphrey, McCarthy, Fulbright.'
