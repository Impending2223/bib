- add:
    entry:
      id: cal.1968-11-26.vietnam-congress
      when: Nov. 26
      date: '1968-11-26'
      thread: vietnam-congress
      c: 'Marcy to Fulbright: the new administration will be staffed by novices; with Mansfield and Aiken form a Senate
        foreign policy council to "endorse, reshape, substitute, or reject Administration proposals." Dec. 30: the committee
        should claim a say on Laird''s nomination too.'
      n: '[[w.woods-fulbright]], 501–02. To check: Marcy to Fulbright, Nov. 26 and Dec. 30, 1968, Marcy Papers, box 8, folder
        Oct.–Dec., RG 46, National Archives (cited by [[w.woods-fulbright]], 502 nn.7–8). Names: Marcy, Fulbright, Mansfield,
        Aiken, Laird.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:aiken-george-d
      - name:laird-melvin-r
