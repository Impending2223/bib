- add:
    entry:
      id: cal.1967-11-08.elections-1968
      when: Nov. 8
      date: '1967-11-08'
      thread: elections-1968
      c: 'McMath, touring Arkansas with speeches for the war and against Fulbright, disavows a Senate race: the "commitments
        and trials and tribulations in Vietnam are a direct result of policies which Senator J. W. Fulbright himself advanced
        and championed." A Little Rock television poll: 54 percent against Fulbright''s stand, 46 for.'
      n: '[[w.woods-fulbright]], 466. Check: the days; Woods cites the *Arkansas Gazette* of Nov. 9 and the *Arkansas Democrat*
        of Nov. 2. To check: "McMath Criticizes Fulbright, but Disavows Senate Race," *Arkansas Gazette*, Nov. 9, 1967;
        "Fulbright''s Stand Tested by TV Poll," *Arkansas Democrat*, Nov. 2, 1967 (cited by [[w.woods-fulbright]], 466 nn.46–47).
        Names: McMath, Fulbright.'
      tags:
      - name:mcmath-sidney-s
      - name:fulbright-j-william
      - state:ar
      - ok:result-form
