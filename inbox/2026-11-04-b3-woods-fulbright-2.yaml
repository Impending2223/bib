- add:
    entry:
      id: cal.1967-04-03.latin-america
      when: Apr. 3
      date: '1967-04-03'
      thread: latin-america
      also:
      - vietnam-congress
      c: 'The state dinner for President Sunay of Turkey. Fulbright, learning that Johnson has denounced the committee and
        him in public, leaves in the middle of dinner: to his wife, "I said ''come on.''"'
      n: '[Toasts of the President and President Sunay of Turkey](https://www.presidency.ucsb.edu/documents/toasts-the-president-and-president-sunay-turkey)
        (Apr. 3, 1967), APP (the dinner''s day). [[w.woods-fulbright]], 446. Check: Woods has the dinner the night of Apr.
        4, after a press conference at which Johnson condemned the committee; the Papers print no news conference that day.
        To check: *Chicago Sun-Times*, Apr. 13, 1967; Charles Bartlett, "Is Feud Hurting U.S. Interests?," *Chicago Sun-Times*,
        Apr. 12, 1967 (cited by [[w.woods-fulbright]], 446 nn.23–24). See [[cal.1967-03-16.latin-america]]. Names: Fulbright,
        Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
