- add:
    entry:
      id: cal.1968-03-08.vietnam-congress
      when: Mar. 8
      date: '1968-03-08'
      thread: vietnam-congress
      c: 'Rostow to Johnson, after Fulbright''s speech of Mar. 7: send up a bill repealing the Tonkin resolution, and make
        those "wringing their hands, shedding crocodile tears, caterwauling" "stand up like men and vote one way or the
        other." Johnson tempted; he does not.'
      n: '[[w.woods-fulbright]], 473. To check: Rostow to Johnson, Mar. 8, 1968, NSF, Country File, Vietnam, box 102, Johnson
        Papers (cited by [[w.woods-fulbright]], 473 n.19). See [[cal.1968-03-07.vietnam-congress]]. Names: Rostow, Johnson,
        Fulbright.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:fulbright-j-william
