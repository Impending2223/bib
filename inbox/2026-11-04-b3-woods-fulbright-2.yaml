      c: 'Fulbright to a Little Rock crowd, on the charge that dissent helps the enemy: "Ho Chi Minh couldn''t care less
        about what I say or what any other senator says."'
      n: '[[w.woods-fulbright]], 465. Check: the day; Woods cites the *Arkansas Gazette* of Oct. 26. To check: Jerol Garrison,
        "Fulbright Declares ''Ho Chi Minh Couldn''t Care Less What I Say,''" *Arkansas Gazette*, Oct. 26, 1967 (cited by
        [[w.woods-fulbright]], 465 n.44). See [[cal.1967-10-11.vietnam-congress-2]]. Names: Fulbright, Hồ Chí Minh.'
      tags:
      - name:fulbright-j-william
      - name:ho-chi-minh
      - state:ar
