- add:
    entry:
      id: cal.1968-11-06.elections-1968-3
      when: Nov. 6
      date: '1968-11-06'
      thread: elections-1968
      c: 'Nixon, the day after the election, telephones Fulbright: congratulations both ways; he means to consult Foreign
        Relations every step of the way. Later he consults Fulbright before naming a Secretary of State.'
      n: '[[w.woods-fulbright]], 500. Check: the day of the consultation on State. To check: Rowland Evans and Robert Novak,
        "A Sweet J. W. Fulbright," Jan. 28, 1969 (cited by [[w.woods-fulbright]], 500 n.1). Names: Nixon, Fulbright.'
      tags:
      - name:nixon-richard-m
      - name:fulbright-j-william
