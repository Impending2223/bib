- add:
    entry:
      id: cal.1968-06-15.elections-1968-6
      when: June 15
      date: '1968-06-15'
      thread: elections-1968
      also:
      - labor
      c: 'The Arkansas AFL-CIO''s convention, after a floor revolt and three hours of debate, endorses Fulbright, J. Bill
        Becker for him; Wayne Glenn: in twenty-six years Fulbright has never given labor a vote on a "bread and butter"
        issue. Jim Johnson unthinkable.'
      n: '[[w.woods-fulbright]], 491. Check: the day; Woods cites the *Arkansas Gazette* of June 16. To check: Bill Lewis,
        "COPE Endorses Boswell, Fulbright After Hot Debate," *Arkansas Gazette*, June 16, 1968 (cited by [[w.woods-fulbright]],
        491 n.23). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
