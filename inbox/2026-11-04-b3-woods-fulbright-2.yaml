- add:
    entry:
      id: cal.1969-01-16.congress
      when: Jan. 16
      date: '1969-01-16'
      thread: congress
      c: 'The Senate''s farewell to Johnson in S-207, the room packed. Johnson to Valeo, lifting him by the lapels: "I want
        to take another trip with you!" Fulbright there; he and Johnson do not speak.'
      n: '[[w.woods-fulbright]], 500–01. To check: Frank Valeo, interview by Woods, Oct. 2, 1991; Mansfield and Dirksen
        to Fulbright, Jan. 16, 1969, Series 48:18, Box 56:7, SPF (cited by [[w.woods-fulbright]], 500–01 nn.2–3). Names:
        Johnson, Valeo, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:valeo-francis-r
      - name:fulbright-j-william
