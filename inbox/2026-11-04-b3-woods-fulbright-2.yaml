      when: Sept. 27
      date: '1968-09-27'
      thread: foreign-aid
      c: 'State''s budget for the exchange program in fiscal 1969: funds for the coming academic year cut 72 percent, Fulbright
        programs to end in eighteen European countries; the balance of payments the reason given.'
      n: '[[w.woods-fulbright]], 490. Check: the day; Woods cites the *Arkansas Gazette* of Sept. 27. To check: "Budget
        Cuts Imperil Fulbright''s Program on Scholar Exchange," *Arkansas Gazette*, Sept. 27, 1968 (cited by [[w.woods-fulbright]],
        490 n.20). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
