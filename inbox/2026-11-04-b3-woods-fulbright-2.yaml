    - 'via x.1967-04-29.fulbright-to-chassler: B'
- add:
    entry:
      id: cal.1967-05-04.vietnam-congress-2
      when: May 4
      date: '1967-05-04'
      thread: vietnam-congress
      c: '*Newsday*, Moyers''s paper, prints Fulbright''s interview: the war "a nice little war, not too much killing, but
        still a big help to the economy"; Rivers, Jackson and Russell for it as their districts thrive on defense contracts.
        Rivers and Jackson protest; Fulbright apologizes, the interview off the record and quoted out of context.'
      n: '[[w.woods-fulbright]], 448–49. Check: the days; Woods cites the *Arkansas Democrat* of May 5. To check: "Fulbright
        Charges News Story Aimed to Discredit Him," *Arkansas Democrat*, May 5, 1967 (cited by [[w.woods-fulbright]], 448–49
        nn.34–35). Names: Moyers, Fulbright, Rivers, Jackson, Russell.'
      tags:
      - name:moyers-bill
      - name:fulbright-j-william
      - name:rivers-l-mendel
      - name:jackson-henry-m
      - name:russell-richard-b
