# copy (archive.org's scan, its OCR layer; printed page = PDF page - 26), read against the calendar from 1960 (p. 250)
# on. The calendar's cites held up (R33); new entries claimed in the ledger under this patch's name; the rest
# additive. The ids of b3-woods-2, -3 and -4 (Woods's 1998 book) are merged. The book-check:
# notes/book-checks/woods-fulbright.md. Witnesses: inbox/witnesses/ under this patch's name.
patch: b3-woods-fulbright-2
by: 'Claude (batch 3, advisers group; Woods, Fulbright: A Biography)'
ops:
- add:
    entry:
      id: cal.1967-03-16.latin-america
      when: Mar. 16
      date: '1967-03-16'
      thread: latin-america
      also:
      - vietnam-commitments
      c: 'Fulbright in the Senate against the Punta del Este resolution, the Tonkin and Formosa resolutions in mind: reject
        it and Congress weakens the President; pass it and Congress commits itself "to support courses of action which will
        lead, it knows not where ... we will have bought a pig in a poke." His substitute, funds "only in keeping with Constitutional
        processes," reported by Foreign Relations. Linowitz had asked him to sponsor the resolution; Morse does.'
      n: '[[w.woods-fulbright]], 445–46. Check: the words, in the Record not read; and the day of the committee''s vote.
        To check: 113 Cong. Rec. 7057 (Senate, Mar. 16, 1967); "Rocky Road to the Summit," *Washington Star*, Mar. 23, 1967;
        Hugh Sidey, "L.B.J.''s Diplomatic Foray into South America," *Life*, Apr. 14, 1967, 38b (cited by [[w.woods-fulbright]],
        445–46 nn.20–22). See [[cal.1967-03-13.latin-america]]. Names: Fulbright, Morse.'
      tags:
      - name:fulbright-j-william
      - name:morse-wayne
