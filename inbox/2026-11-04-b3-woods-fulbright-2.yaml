    entry:
      id: cal.1969-01-08.transition-and-staff
      when: Jan. 8
      date: '1969-01-08'
      thread: transition-and-staff
      also:
      - vietnam-congress
      c: 'Marcy to Fulbright, for open hearings on Rogers: "Rogers will never be impeached. The only chance the Senate has
        to examine him from a position of power is now." Fulbright unmoved.'
      n: '[[w.woods-fulbright]], 502. To check: Marcy to Fulbright, Jan. 8, 1969, Marcy Papers, box 8, folder Jan.–Mar.,
        RG 46, National Archives (cited by [[w.woods-fulbright]], 502 n.9). Hearing: [[cal.1969-01-15.transition-and-staff]].
        Names: Marcy, Fulbright, Rogers.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:rogers-william-p
