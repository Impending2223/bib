- add:
    entry:
      id: cal.1967-11-04.vietnam-support
      when: Nov. 4
      date: '1967-11-04'
      thread: vietnam-support
      c: 'Johnson at lunch with Rusk, McNamara, Rostow and Helms: "I''m not going to let the communists take this government
        and they''re doing it right now." The CIA to watch the leaders of the antiwar groups and show them directed from
        abroad.'
      n: '[[w.woods-fulbright]], 464. Check: the order''s day. To check: Luncheon Meeting with Rusk, McNamara, Rostow, Helms
        et al., Nov. 4, 1967, Meeting Notes File, box 2, Johnson Papers (cited by [[w.woods-fulbright]], 464 n.40). Names:
        Johnson, Rusk, McNamara, Rostow, Helms.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:helms-richard
