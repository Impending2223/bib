- add:
    entry:
      id: cal.1967-05-01.vietnam-congress-2
      when: May 1
      date: '1967-05-01'
      thread: vietnam-congress
      c: 'Fulbright to Carl Reiner: "The Administration''s drive at total consensus, climaxed last Friday by General Westmoreland''s
        appearance at the Joint Session, is leading us into a frenzy of chauvinism." To Sey Chassler of *Redbook*, Apr.
        29: the mood not unlike Germany''s in the 1930s.'
      n: '[[w.woods-fulbright]], 448. To check: Fulbright to Reiner, May 1, 1967, Series 48:18, Box 53:2; Fulbright to Chassler,
        Apr. 29, 1967, Series 48:18, Box 51:3, SPF (cited by [[w.woods-fulbright]], 448 nn.31–32). See [[cal.1967-04-28.vietnam]].
        Names: Fulbright, Westmoreland.'
      tags:
      - name:fulbright-j-william
      - name:westmoreland-william
