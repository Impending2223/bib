- add:
    entry:
      id: cal.1967-08-09.vietnam-congress-2
      when: Aug. 9
      date: '1967-08-09'
      thread: vietnam-congress
      also:
      - civil-disorders
      c: 'Fulbright to the Hawaii Bar Association at Honolulu, "The Price of Empire": "we are truly fighting a two-front
        war and doing badly in both." In a week of July 164 Americans killed in Vietnam and 1,442 wounded; 65 dead and 2,100
        hurt in the riots. $76 billion for the Pentagon in fiscal 1968, $15 billion for social programs.'
      n: '[[w.woods-fulbright]], 459. Check: the day; Woods has it ten days after the Detroit riot and cites the Record
        of Aug. 9, 22126–27, not read. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- src:
    id: cal.1967-08-09.vietnam-congress-2
    rows:
    - 'w.woods-fulbright 459: all'
    - 'via x.1967-08-09.fulbright-price-of-empire-record: all'
- add:
    entry:
      id: cal.1967-10-01.elections-1968
      when: Oct. 1
      date: '1967-10-01'
      thread: elections-1968
      c: 'Jack Pickens, the Little Rock contractor and a backer of Faubus in 1964 and Rockefeller in 1966, for Fulbright
        in 1968: "I am going with Bill and I have told the governor so." Bill Darby the same.'
      n: '[[w.woods-fulbright]], 466–67. Check: the day; Woods cites the *Arkansas Democrat* of Oct. 1. To check: George
        Douthit, "Pickens Throws His Support to Fulbright," *Arkansas Democrat*, Oct. 1, 1967 (cited by [[w.woods-fulbright]],
        467 n.50). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
