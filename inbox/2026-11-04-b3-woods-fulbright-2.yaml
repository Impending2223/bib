- add:
    entry:
      id: cal.1967-04-26.elections-1968-2
      when: Apr. 26
      date: '1967-04-26'
      thread: elections-1968
      also:
      - governors
      c: 'Faubus to reporters: "very possible" and "mostly likely" that he will run against Fulbright in 1968. "I agree
        with Gov. George Romney of Michigan when he said that Fulbright is aiding the enemy by his comments."'
      n: '[[w.woods-fulbright]], 466. Check: the day; Woods cites the *Arkansas Democrat* of Apr. 27. To check: "Faubus
        Says Fulbright Vulnerable," *Arkansas Democrat*, Apr. 27, 1967 (cited by [[w.woods-fulbright]], 466 n.48). Names:
        Faubus, Fulbright, Romney.'
      tags:
      - name:faubus-orval-e
      - name:fulbright-j-william
      - name:romney-george-w
      - state:ar
