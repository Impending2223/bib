      n: '[[w.woods-fulbright]], 491. Check: the day; Woods cites the *Arkansas Democrat* of June 23. To check: "Hayes Ties
        Fulbright to Lloyds," *Arkansas Democrat*, June 23, 1968 (cited by [[w.woods-fulbright]], 491 n.27). Names: Fulbright.'
