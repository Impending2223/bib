      when: Apr. 27
      date: '1967-04-27'
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'Doris Fleeson''s column, put in the Record: "No precedent exists for an American President bringing home the field
        commander of American forces at war to plead in public for support of that war and an end to protest and dissent
        against it."'
      n: '[[w.woods-fulbright]], 448. Check: the column''s day; Woods cites the Record of Apr. 27, 11042–43, not read.'
      tags: []
