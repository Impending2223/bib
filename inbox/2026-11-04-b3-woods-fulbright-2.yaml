      date: '1968-04-26'
      thread: civil-rights-bill
      also:
      - press-and-broadcasting
      c: 'Ralph McGill, "Fulbright''s Credibility Widens on Moral Issues," in the *Atlanta Constitution*: Fulbright asked
        Rusk why he did not seek peace so that there would be more money for the cities and the poor, and the same day voted
        against the open housing bill.'
      n: '[[w.woods-fulbright]], 479–80. To check: Ralph McGill, "Fulbright''s Credibility Widens on Moral Issues," *Atlanta
        Constitution*, Apr. 26, 1968 (cited by [[w.woods-fulbright]], 480 n.47). See [[cal.1968-03-11.vietnam]]. Names:
        McGill, Fulbright, Rusk.'
      tags:
      - name:mcgill-ralph
      - name:fulbright-j-william
      - name:rusk-dean
