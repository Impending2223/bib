patch: 2026-11-14-nyt-1968-01-06
by: 'Claude (the lead), Nov. 14, 2026, from the owner''s clippings of the *New York Times*, Jan. 6, 1968, pp. 1, 3, 6, 7 (screenshots sent in the session)'
ops:
  - add:
      entry:
        id: cal.1968-01-04.vietnam-diplomacy
        when: Jan. 4
        date: '1968-01-04'
        thread: vietnam-diplomacy
        c: 'Rusk: the United States is trying to learn whether Hanoi, in Trinh''s statement, seriously wants to negotiate or is making only a propaganda move.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1 (Rusk "yesterday"). See [[cal.1967-12-29.vietnam]]. Names: Rusk, Nguyễn Duy Trinh. Check: where and to whom Rusk said it.'
        tags: [name:rusk-dean, name:nguyen-duy-trinh]
  - add:
      entry:
        id: cal.1968-01-04.vietnam-rfk-front
        when: Jan. 4
        date: '1968-01-04'
        thread: vietnam-rfk-front
        c: 'San Francisco, the Commonwealth Club of California. Robert Kennedy, answering questions: "It would make some sense to go to the negotiating table"; "We have to at least take the first step."'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (Kennedy "yesterday"). Names: Kennedy.'
        tags: [name:kennedy-robert-f, state:ca, city:san-francisco]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-pacification
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-pacification
        c: 'Saigon. The Mission: the Viet Cong killed 3,820 civilians in 1967, against 1,618 in 1966, and kidnapped 5,368, against 3,507; the worst attack, on the Montagnard village of Đắk Sơn, about 200 killed with flame throwers and grenades. Komer: the rise "suggests increasing enemy desperation."'
        n: '"Vietcong Slaying of Civilians in ''67 Put at 3,820" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. See [[cal.1967-12-05.vietnam-operations]]. Names: Komer. Check: the Mission dates Đắk Sơn mid-December, the calendar Dec. 5, with 108 killed (MACV).'
        tags: [name:komer-robert-w]
  - edit:
      id: cal.1968-01-05.vietnam-tet
      base: 9dc0dc93
      set:
        c: 'Saigon. The Mission, through Zorthian''s Joint U.S. Public Affairs Office, makes public a document the 101st Airborne captured Nov. 13 in Quảng Tín: the time may be near for "a general offensive and general uprising"; "very strong military attacks in co-ordination with the uprisings of the local population to take over towns and cities." Its writer, the Mission says, a cadre of low or middle rank; the Mission implies it less significant than it sounds.'
        n: '"Vietcong Slaying of Civilians in ''67 Put at 3,820" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3; [[w.westmoreland-soldier-reports]], 316 (the release, the office, the quotations). Names: Zorthian.'
  - add:
      entry:
        id: cal.1968-01-05.vietnam-air-war
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-air-war
        c: 'Air Force planes strike the Lạng Sơn railroad bridge, within ten miles of the Chinese border, for a third day, reported destroyed with four antiaircraft sites, and the Kép airfield, northeast of Hanoi; 135 missions over the North. Two F-105s lost. With two Navy planes and an F-100 near Ban Mê Thuột on Jan. 4, the announced American losses pass 1,000: 781 over the North since Feb. 7, 1965, 220 in the South.'
        n: 'Tom Buckley, "U.S. Plane Losses in Vietnam Pass 1,000 as 5 Are Downed," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. Check: the day of the two Navy losses, announced the evening of Jan. 5.'
  - add:
      entry:
        id: cal.1968-01-05.europe-and-the-alliance-federal-republic
        when: Jan. 5
        date: '1968-01-05'
        thread: europe-and-the-alliance-federal-republic
        also: [vietnam-diplomacy]
        c: 'Bonn. The Social Democrats'' executive board, after a closed meeting and Brandt''s political survey, calls on the United States to end the bombing of North Vietnam, as U Thant urged, to open talks, a truce by all to follow; North Vietnam, the Viet Cong, the United States and Saigon to show their willingness to negotiate.'
        n: 'Philip Shabecoff, "Bonn Socialists Call Upon U.S. To End North Vietnam Bombing," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. Names: Brandt, U Thant.'
        tags: [name:brandt-willy, name:u-thant, polity:frg]
  - add:
      entry:
        id: cal.1968-01-05.europe-and-the-alliance-federal-republic-2
        when: Jan. 5
        date: '1968-01-05'
        thread: europe-and-the-alliance-federal-republic
        c: Bonn. Arthur Rathke, the Christian Democrats' chief spokesman, attacks the Social Democrats' declaration almost as soon as it is issued.
        n: 'Philip Shabecoff, "Bonn Socialists Call Upon U.S. To End North Vietnam Bombing," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. See [[cal.1968-01-05.europe-and-the-alliance-federal-republic]].'
        tags: [polity:frg]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-diplomacy
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-diplomacy
        c: 'Washington. At the State Department McCloskey meets questions on the Social Democrats'' appeal with "No comment"; the Administration declines comment on the appeals for a halt and will not elaborate on Rusk''s remark of Jan. 4. Administration sources: no message through diplomatic channels has amplified Trinh''s statement.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3. See [[cal.1968-01-04.vietnam-diplomacy]]. Names: McCloskey, Rusk, Nguyễn Duy Trinh.'
        tags: [name:mccloskey-robert-j, name:rusk-dean, name:nguyen-duy-trinh]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-congress-republicans
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-congress-republicans
        c: 'Cooper (R-Ky.), a statement: praises Johnson for meeting the Viet Cong''s use of Cambodia by diplomacy rather than by pursuit across the border; hopes he "will now take the step—with its risk—to stop the bombing of North Vietnam"; the United States could quickly learn whether the offer is sincere.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. Names: Cooper, Johnson.'
        tags: [name:cooper-john-sherman, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-congress-armed-services
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-congress-armed-services
        c: 'Rivers (D-S.C.), chairman of the House Armed Services Committee, by telegram to Johnson: no cessation of the bombing unless Hanoi first agrees to exchange prisoners, or at least to their inspection by the International Red Cross; "we are not going to be suckers for North Vietnamese tricks."'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1. Names: Rivers, Johnson.'
        tags: [name:rivers-l-mendel, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-05.war-opposition-2
        when: Jan. 5
        date: '1968-01-05'
        thread: war-opposition
        also: [vietnam-diplomacy]
        c: 'Rabbi Arthur J. Lelyveld, president of the American Jewish Congress, by telegram to Johnson: "a reasonable indication that cessation of the bombing is likely to have productive results"; not to let the chance slip by delay or conditions.'
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3. Names: Johnson. Check: the day, within the forty-eight hours before the story.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1968-01-04.soviet-union
        when: Jan. 4
        date: '1968-01-04'
        thread: soviet-union
        also: [vietnam-air-war]
        c: 'Washington, afternoon. Dobrynin hands Rusk a formal protest, the first delivered to him directly: American planes raiding Haiphong about 3 p.m. seriously damaged the Soviet freighter *Pereyaslavl-Zalessky*, a bomb bursting six feet off, a delayed-action bomb on a barge beside her 25 minutes later; Soviet agencies "will be compelled to take measures to insure the safety of Soviet vessels"; punishment of those responsible demanded. Tass gives the captain''s account Jan. 5.'
        n: 'Raymond H. Anderson, "U.S. Raid Damaged Ship, Moscow Says," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3 (continued as "Moscow Says U.S. Bomb Damaged Soviet Ship"); Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3. See [[cal.1968-01-04.vietnam-air-war]]. Names: Dobrynin, Rusk.'
        tags: [name:dobrynin-anatoly-f, name:rusk-dean, polity:ussr, polity:us]
  - add:
      entry:
        id: cal.1968-01-05.soviet-union-2
        when: Jan. 5
        date: '1968-01-05'
        thread: soviet-union
        also: [vietnam-air-war]
        c: 'The United States expresses regret for the damage to the *Pereyaslavl-Zalessky*: if American planes were responsible, an accident; Rusk tells Dobrynin so in the evening. The State Department: an investigation has "neither substantiated nor ruled out the possibility" of American fault; "careful precautions" taken, the risk impossible to eliminate.'
        n: 'Raymond H. Anderson, "U.S. Raid Damaged Ship, Moscow Says," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 3 ("U.S. Expresses Regret," Washington). See [[cal.1968-01-04.soviet-union]]. Names: Rusk, Dobrynin.'
        tags: [name:rusk-dean, name:dobrynin-anatoly-f, polity:us, polity:ussr]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-order-of-battle
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam-order-of-battle
        c: Washington. Some American officials cite intelligence reports of North Vietnamese infiltration into the South in the past month, as high as three or four divisions, 30,000 to 40,000 men, as raising doubt of Hanoi's wish for talks; others call every estimate tentative, a rise in the dry season usual.
        n: 'Hedrick Smith, "Pressure Mounts for Bombing Halt as Test for Hanoi," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3.'
  - add:
      entry:
        id: cal.1968-01-05.defense
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Proxmire (D-Wis.), at a news conference, names 23 contractors, among them Boeing, Sikorsky, Raytheon, Sperry Gyroscope, TRW and FMC, and the Universities of Chicago and Maryland, from a fifteen-month General Accounting Office inquiry for his subcommittee of the Joint Economic Committee: Defense Department property used for commercial work without leave and at low rents; the waste "hundreds of millions of dollars a year," "the military industrial complex at work." The GAO''s samples do not prove his figure; he calls them "representative." The property 5,500 contractors hold cost $15 billion.'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 7 (the list of the 23 at 7). Names: Proxmire.'
        tags: [name:proxmire-william]
  - add:
      entry:
        id: cal.1968-01-05.defense-2
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Thomas D. Morris, Assistant Secretary of Defense for Installations and Logistics: no evidence the 23 failed their contracts; in only five cases did contractors owe small sums for commercial use, about $60,000 in all, "portrayed as charges of waste amounting to hundreds of millions or billions"; managing the property saves "well over $100-million" a year in new equipment.'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 7. See [[cal.1968-01-05.defense]]. Names: Morris.'
        tags: [name:morris-thomas-d]
  - add:
      entry:
        id: cal.1968-01-05.defense-3
        when: Jan. 5
        date: '1968-01-05'
        thread: defense
        c: 'Most of the 23 deny Proxmire''s charges: Boeing (few findings relate to it, "readily explainable"); FMC (the charges "misleading or factually incorrect"); Sperry Gyroscope; Aerojet-General (the GAO gives it two short paragraphs); TRW ("totally unjustifiable").'
        n: 'Neil Sheehan, "Proxmire Links 23 Contractors to Defense Waste," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 7. See [[cal.1968-01-05.defense]].'
  - add:
      entry:
        id: cal.1968-01-05.soviet-union-czechoslovakia
        when: Jan. 5
        date: '1968-01-05'
        thread: soviet-union-czechoslovakia
        c: 'Prague. The Central Committee relieves Novotný, "at his request," as First Secretary of the party, with thanks for his work; Dubček, First Secretary of the Slovak party, succeeds him, the first Slovak to lead it. Novotný stays President. Tanjug reports it first; ČTK confirms it in the evening.'
        n: '"Novotny Deposed as Party Leader; Slovak Gets Post" (UPI), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 6. Names: Novotný, Dubček. Check: the plenum''s days (Jan. 3–5).'
        tags: [name:novotny-antonin, name:dubcek-alexander, polity:czechoslovakia]
  - check:
      id: cal.1967-12-08.soviet-union-leadership
      text: 'Check: UPI''s informed sources (*New York Times*, Jan. 6, 1968, 6): the Presidium had voted 8 to 2, unofficially, to remove Novotný from both posts; Brezhnev, come to Prague to save his place as party leader, forced a 5-to-5 deadlock at a later meeting.'
  - check:
      id: cal.1967-12-05.vietnam-operations
      text: 'Check: the Mission''s figures (AP, *New York Times*, Jan. 6, 1968, 3): about 200 civilians killed at Đắk Sơn, with flame throwers and grenades, the attack dated mid-December.'
  - add:
      entry:
        id: cal.1967-12-04.vietnam-2
        when: Dec. 4
        date: '1967-12-04'
        thread: vietnam
        also: [vietnam-diplomacy]
        c: 'A note from Rusk to Phnom Penh urges a diplomatic settlement of the Viet Cong''s use of Cambodian territory; the United States "continues to respect the neutrality, sovereignty, independence and territorial integrity of Cambodia."'
        n: 'Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 5 (the note, Dec. 4); "Transcript of Replies by Sihanouk to Questions on Vietnam Border Issue," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 ("the recent Rusk message"). Names: Rusk. Check: the channel (the United States and Cambodia without relations since 1965), and whether the note was made public at the time.'
        tags: [name:rusk-dean, polity:us, polity:cambodia]
  - add:
      entry:
        id: cal.1968-01-05.vietnam
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam
        also: [vietnam-diplomacy]
        c: 'Sihanouk, answering questions the *New York Times* cabled from Hong Kong: Bowles''s visit, "if President Johnson is willing to prevent aggression against our country," may at least reduce tension; if Bowles brings recognition of Cambodia''s present frontiers, "we shall immediately re-establish diplomatic relations." He favors an ICC with full logistic and financial means from the United States, but the co-chairmen and the members must agree, and the Soviet Union and Poland have opposed widening it; no agreement with the United States, no American reconnaissance flights or patrols; Cambodian forces fired on will "retaliate." American and South Vietnamese blows, he says, have always fallen on Khmers, never on the Viet Cong; no Vietnamese volunteers; from China, material aid first, then, under American pressure, "volunteer combatants" under Khmer command.'
        n: '"Transcript of Replies by Sihanouk to Questions on Vietnam Border Issue," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 (an unofficial translation from the French); Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 1, 5. See [[cal.1967-12-04.vietnam-2]]. Names: Sihanouk, Bowles, Johnson.'
        tags: [name:norodom-sihanouk, name:bowles-chester, name:johnson-lyndon-b, polity:cambodia]
  - add:
      entry:
        id: cal.1968-01-05.vietnam-2
        when: Jan. 5
        date: '1968-01-05'
        thread: vietnam
        c: 'New Delhi. The embassy: Bowles leaves Monday, Jan. 8, for Cambodia, with a party of six, among them Habib, Deputy Assistant Secretary of State for East Asian Affairs, and Douglas Perry, a specialist on Cambodia, flown from Washington; to stay several days.'
        n: '"Leaves Monday Morning," in Tillman Durdin, "Sihanouk Hopeful on U.S. Relations," [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 5. See [[cal.1968-01-05.vietnam]]. Names: Bowles, Habib.'
        tags: [name:bowles-chester, name:habib-philip-c, polity:india]
  - add:
      entry:
        id: cal.1967-12-29.middle-east
        when: Dec. 29
        date: '1967-12-29'
        thread: middle-east
        c: 'Tel Aviv. The United States submits to Israel a bill for $3.3 million for the families of the 34 Navy men killed in the attack on the *Liberty*, June 8.'
        n: '"U.S. Asks Israel to Pay $3.3-Million for Attack" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4. See [[cal.1967-06-08.middle-east]]. Check: the bill''s form and who presented it.'
        tags: [polity:us, polity:israel]
  - add:
      entry:
        id: cal.1968-01-05.middle-east-2
        when: Jan. 5
        date: '1968-01-05'
        thread: middle-east
        c: 'McCloskey announces the bill for the *Liberty*''s dead, submitted Dec. 29: the families'' loss of support and their "emotional anguish" weighed.'
        n: '"U.S. Asks Israel to Pay $3.3-Million for Attack" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4. See [[cal.1967-12-29.middle-east]]. Names: McCloskey.'
        tags: [name:mccloskey-robert-j]
  - add:
      entry:
        id: cal.1968-01-05.war-opposition-3
        when: Jan. 5
        date: '1968-01-05'
        thread: war-opposition
        c: 'Stockholm. The Swedish Government: two more American servicemen, a sailor and a soldier, have asked political asylum to escape duty in the Vietnam war.'
        n: '"Two More U.S. Servicemen Seek Asylum, Sweden Says" (UPI), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 4 (its first paragraph only read). Check: the rest of the story; the two men''s names.'
        tags: [polity:sweden]
  - check:
      id: cal.1968-01-04.vietnam-air-war
      text: 'Check: Moscow''s account (Tass, the captain; *New York Times*, Jan. 6, 1968, 1, 3): the *Pereyaslavl-Zalessky* damaged, not missed, a bomb six feet off holing her hull, about 3 p.m., Haiphong time; the State Department, Jan. 5: American planes might have "inadvertently" damaged her.'
  - add:
      entry:
        id: cal.1968-01-06.vietnam-saigon
        when: Jan. 6
        date: '1968-01-06'
        thread: vietnam-saigon
        also: [vietnam-diplomacy]
        c: 'Saigon. Thiệu, asked whether he objects to the United States talking alone with Hanoi if it stops the bombing and Hanoi answers in kind: South Vietnam would welcome "any movement or any informal talks from any government to bring peace," but "negotiations should be the main task between the Saigon Government and the Hanoi Government"; of a softening in Hanoi, "Everyone is waiting for a more clarifying position."'
        n: '"Thieu Calls Task Saigon''s" (AP), [*New York Times*, Jan. 6, 1968](https://timesmachine.nytimes.com/timesmachine/1968/01/06/issue.html), at 3 (dated "Saturday, Jna. 6," the paper''s slip). Names: Thiệu.'
        tags: [name:nguyen-van-thieu, polity:rvn]
