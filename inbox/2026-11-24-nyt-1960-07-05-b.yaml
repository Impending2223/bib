      when: July 4
      date: '1960-07-04'
      place: baltimore
      thread: white-house
      c: 'Fort McHenry, at midnight, by the President''s direction, the first raising of the fifty-star flag; some 30,000 there. Seaton, in a speech, contrasts democracy and communism; Inouye leads Hawaii''s delegation.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 24 (Weart; "Program at Shrine," Baltimore, July 4, AP). Names: Seaton, Inouye, Eisenhower.'
      tags: [name:seaton-fred-a, name:inouye-daniel-k, name:eisenhower-dwight-d, state:md]
      time: 1960-07-04T04:00Z
      time_zone: America/New_York
