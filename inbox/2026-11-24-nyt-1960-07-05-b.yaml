      when: July 4
      date: '1960-07-04'
      place: libertyville
      thread: elections-1960-nomination
      c: 'Stevenson, at his Libertyville farm: does not know what Truman meant; "not informed of any rigging of any kind" by the Kennedy group or any other.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 20 ("Stevenson Doubts ''Rigging''," Chicago, July 4). Names: Stevenson, Truman, Kennedy.'
      tags: [name:stevenson-adlai-e, name:truman-harry-s, name:kennedy-john-f, state:il]
- add:
    entry:
      id: cal.1960-07-05.elections-1960-kennedy
      when: 'By July 5'
      date: '1960-07-05'
      thread: elections-1960-kennedy
      c: 'Sorensen, with an assistant of Governor Hatfield of Oregon, works to block a primary bill less favorable to Kennedy; Hatfield vetoes it and lets the other become law.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 20 ("Kennedy''s Top Adviser," Man in the News). Check: the day; the bills. Names: Sorensen, Hatfield, Kennedy.'
      tags: [ok:fields-place, name:sorensen-theodore-c, name:hatfield-mark-o, name:kennedy-john-f, state:or]
- add:
    entry:
      id: cal.1960-06-30.congress
      when: June 30
      date: '1960-06-30'
      place: washington
      thread: congress
      also: [rules]
      c: 'Howard W. Smith, chairman of House Rules, in a House speech, defends the committee against its critics, stung by Gerald T. Flynn''s complaint that voters are "sick and tired" of it.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 22 (John D. Morris, "Drive Is On to Curb Rules Unit," Washington, July 4: "last Thursday"). To check: 106 Cong. Rec. (1960). Names: Smith, Flynn.'
      tags: [name:smith-howard-w, name:flynn]
- add:
    entry:
      id: cal.1960-07-04.rules
      when: 'By July 4'
      date: '1960-07-04'
      place: washington
      thread: rules
      also: [congress]
      c: 'Liberal Democrats of the Democratic Study Group, Holifield, Frank Thompson and Stewart Udall leading, Bolling their tactician, organize a drive to curb House Rules at the opening of the next Congress; the twenty-one-day rule among the proposals; an "outside coalition" of voters being organized.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 22 (Morris, "Drive On to Curb House Rules Unit"). Check: the day. Names: Holifield, Thompson, Udall, Bolling, Rayburn.'
      tags: [name:holifield-chet, name:thompson-frank-jr, name:udall-stewart-l, name:bolling-richard, name:rayburn-sam]
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles-3
      when: July 4
      date: '1960-07-04'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'J. Leonard Reinsch, the convention''s director, reports rooms found for all who asked, both rival delegations from Puerto Rico among them; the police to open command posts at the Biltmore and the Sports Arena.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 23 (Gladwin Hill, "Democrats Open Hearings Today on Platform Issues," Los Angeles, July 4).'
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles-4
      when: July 4
      date: '1960-07-04'
      place: los-angeles
      thread: elections-1960-los-angeles
      c: 'Stephen A. Mitchell, counsel to the convention''s Rules Committee, explains his proposed rule barring a state from changing its vote during a roll call; Kennedy''s headquarters prepares for it.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html) (Leo Egan, "Convention Rule Facing a Change," Los Angeles, July 4; page not shown). Names: Mitchell, Kennedy.'
      tags: [name:mitchell-stephen-a, name:kennedy-john-f]
- add:
    entry:
      id: cal.1960-07-04.democratic-party
      when: 'By July 4'
      date: '1960-07-04'
      thread: democratic-party
      also: [elections-1960-los-angeles]
      c: 'Jacob Arvey, Illinois national committeeman, proposes a rule giving each state a vote in the National Committee in proportion to its convention votes.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html) (Egan, "Convention Rule Facing a Change"; page not shown). Check: the day.'
      tags: [ok:fields-place, ok:name-untagged]
- add:
    entry:
