      when: July 4
      date: '1960-07-04'
      place: philadelphia
      thread: white-house
      c: 'The fifty-star flag raised officially at Independence Hall by a Marine color guard; Fong, given the working model by Clark and Scott, speaks on the sugar act and Cuba and the Monroe Doctrine; Scott reads Eisenhower''s greeting.'
      n: '[*New York Times*, July 5, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/05/issue.html), at 1, 24 (William G. Weart, "Fifty-Star Flag Flies for Fourth," Philadelphia, July 4). Names: Fong, Clark, Scott, Eisenhower.'
      tags: [name:fong-hiram-l, name:clark-joseph-s, name:scott-hugh-d-jr, name:eisenhower-dwight-d, state:pa, city:philadelphia]
