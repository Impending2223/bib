      time_zone: America/New_York
      place: washington
      thread: vietnam-support
      c: 'The South Lawn. Johnson awards the Medal of Honor to Specialist 6 Lawrence Joel, an Army medical aide, for his action in Biên Hòa province: wounded twice, he crawled for more than twelve hours under fire to bring others to safety.'
      n: 'Remarks Upon Awarding the Medal of Honor to Specialist 6 Lawrence Joel, USA, [1967 Pub. Papers 299](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=367) (Mar. 9, 1967) (the hour in its note: 12:50 p.m.). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - city:washington
