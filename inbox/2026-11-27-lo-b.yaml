- add:
    entry:
      id: cal.1967-03-18.states-and-cities-3
      when: Mar. 18
      date: '1967-03-18'
      time: 1967-03-18T19:13Z
      time_zone: America/New_York
      place: washington
      thread: states-and-cities
      c: 'The State Dining Room, the Governors'' luncheon. Johnson, after 36 years in Washington: no period comparable; the crises of 1967 are "born of responsibility, not of disaster." Federal and State cooperation has never been higher, but "our theory has not caught up with our practice."'
      n: 'Remarks at the Governors'' Luncheon, [1967 Pub. Papers 372](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=440) (Mar. 18, 1967) (the hour in its note: 2:13 p.m.). See [[cal.1967-03-18.states-and-cities-us]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1967-03-18.states-and-cities-4
      when: Mar. 18
      date: '1967-03-18'
      time: 1967-03-19T02:33Z
      time_zone: America/New_York
      place: washington
      thread: states-and-cities
      follows:
      - cal.1967-03-18.states-and-cities-2
      c: 'The State Dining Room, the dinner for the Governors. Johnson''s toast: the Vietnam conflict "still stretches across our land tonight"; he leaves shortly for Guam to review the course with the commanders and the Vietnamese leaders. Andrew Jackson''s toast, "Our Federal Union, it must be preserved"; his own: "May we build on its past to lift the quality of its life in the future."'
      n: 'The President''s Toast at a Dinner for the Governors, [1967 Pub. Papers 374](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=442) (Mar. 18, 1967) (the hour in its note: 9:33 p.m.). See [[cal.1967-03-18.states-and-cities-2]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - city:washington
