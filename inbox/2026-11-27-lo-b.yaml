      n: 'Message to the Congress Transmitting 20th Annual Report on U.S. Participation in the United Nations, [1967 Pub. Papers 295](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=363) (Mar. 9, 1967). Names: Johnson, Stevenson, Goldberg.'
