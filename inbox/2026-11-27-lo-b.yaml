      when: Mar. 9
      date: '1967-03-09'
      thread: economy
      c: 'Statement: Johnson sends the Congress a fiscal 1968 budget amendment cutting $14.9 million from the Atomic Energy Commission, which ends development of the heavy-water-moderated, organic-cooled power reactor but keeps research on heavy water reactors.'
      n: 'Statement by the President on a Budget Amendment Reducing Funds Proposed for the Atomic Energy Commission, [1967 Pub. Papers 293](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=361) (Mar. 9, 1967). Names: Johnson.'
      tags:
