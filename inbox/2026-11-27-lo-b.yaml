      date: '1967-03-09'
      thread: program
      c: 'Message to the Congress transmitting the first report on marine resources and engineering development, on the Federal Government''s marine science: the sea''s food, pollution of shores and bays, weather and storm forecasting, the ocean floor.'
      n: 'Message to the Congress Transmitting First Report on Marine Resources and Engineering Development, [1967 Pub. Papers 298](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=366) (Mar. 9, 1967). Names: Johnson.'
