- add-words:
    id: cal.1965-12-28.vietnam-pause-2
    after: State to Saigon, telegram 1805, on the pause.
    words: 'Johnson defers resumption of the bombing several more days, possibly into the middle of the next week; no commitment that limits freedom of action; operations in South Vietnam and Laos go on. A major factor: the public must be prepared in January for reinforcements and a defense increase of some twenty billion dollars; Hanoi not expected to respond.'
    text: '[FRUS 1964–68, III, doc. 255](https://history.state.gov/historicaldocuments/frus1964-68v03/d255)'
