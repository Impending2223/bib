      date: '1967-03-09'
      thread: program
      c: 'Special message: Reorganization Plan 2 of 1967 moves the Tariff Commission''s routine executive and administrative functions to its Chairman.'
      n: 'Special Message to the Congress Transmitting Reorganization Plan 2 of 1967: United States Tariff Commission, [1967 Pub. Papers 294](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=362) (Mar. 9, 1967). Names: Johnson.'
