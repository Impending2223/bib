      n: 'Remarks Upon Arrival at the Airport, Louisville, Kentucky, [1966 Pub. Papers 776](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=150) (July 23, 1966) (the hour in its note: 8:10 p.m.). The order: after [[cal.1966-07-23.vietnam-support-3|Vincennes]], by the hours of the Papers'' notes (6:30 p.m. there, 8:10 p.m. here). To check: [[w.johnson-white-house-diary]], 398. Names: Johnson, Cooper, Morton, Bess Abell.'
