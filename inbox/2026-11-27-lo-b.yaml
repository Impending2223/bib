- add:
    entry:
      id: cal.1965-12-21.europe-and-the-alliance
      when: Dec. 21
      date: '1965-12-21'
      place: washington
      thread: europe-and-the-alliance
      c: 'Joint statement after the talks with Erhard: the Federal Republic and other partners without nuclear weapons to have "an appropriate part in nuclear defense"; Germany wants no national control; alliance arrangements "would not constitute proliferation." The offset, German purchases of American arms against American military spending in Germany, to be "fully executed and continued." German support in Vietnam.'
      n: 'Joint Statement Following Discussions With Chancellor Erhard, [1965 Pub. Papers 1165](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=639) (Dec. 21, 1965). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 419 (the joint statement, the MLF let go); [[w.schwartz-lyndon-johnson-and-europe]], 88–90, 112 (the offset; Vietnam; the nuclear proposals); [[w.gavin-gold-dollars-and-power]], 140 (the offset). See [[cal.1965-12-20.europe-and-the-alliance]]. Names: Erhard, Johnson.'
      tags:
      - name:erhard-ludwig
      - name:johnson-lyndon-b
