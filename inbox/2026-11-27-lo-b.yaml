- add:
    entry:
      id: cal.1966-07-23.crime-and-hijacking
      when: July 23
      date: '1966-07-23'
      thread: crime-and-hijacking
      c: 'Statement on receiving the first report of the President''s Commission on Crime in the District of Columbia, on the Metropolitan Police Department. Johnson: he wants the best police force in the United States; reported homicides, robberies, housebreakings and auto thefts down from the year before; the Commission''s final report to come.'
      n: 'Statement by the President Upon Receiving a Report of the President''s Commission on Crime in the District of Columbia, [1966 Pub. Papers 784](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=158) (July 23, 1966). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
      - ok:fields-place
- add:
    entry:
      id: cal.1966-10-15.vietnam-asian-trip-2
      when: Oct. 15
      date: '1966-10-15'
      time_range:
      - 1966-10-15T18:40Z
      - 1966-10-15T19:30Z
      time_zone: America/New_York
      place: washington
      thread: vietnam-asian-trip
      also:
      - vietnam
      follows:
      - cal.1966-10-15.vietnam
      c: 'The 565th meeting of the National Security Council, 2:40 to 3:30 p.m., on the Manila Conference. Johnson has McNamara, Wheeler and Katzenbach report on their visit to Vietnam: McNamara, the military situation better than he expected, pacification less than he hoped, "longer than we have thought"; Katzenbach, 55 of 65 schoolrooms built in one area destroyed within the year. Rusk on the conference: the heads of the countries contributing to the war; Moyers: friendship, not policy gains. Johnson: no backgrounding on Manila unless Moyers clears it; the conference "will probably accomplish little."'
      n: '[FRUS 1964–68, IV, doc. 272](https://history.state.gov/historicaldocuments/frus1964-68v04/d272) (summary notes, Bromley Smith, 2:40–3:30 p.m.; its n.2: the President''s office meeting began at 2:10 p.m.). See [[cal.1966-10-15.vietnam]]. Names: Johnson, McNamara, Wheeler, Katzenbach, Rusk, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:rusk-dean
      - name:moyers-bill
      range_basis: record
- add:
    entry:
      id: cal.1968-02-12.vietnam-205000-2
      when: Feb. 12
      date: '1968-02-12'
      time: 1968-02-12T13:29Z
      time_zone: America/New_York
      place: washington
      thread: vietnam-205000
      c: 'McNamara to Johnson by telephone, 8:29 a.m.: a message from Westmoreland, "quite different" from the reading of the night before, wants six battalions immediately; the Chiefs are meeting. Johnson: never for "this whole thing" at this stage; rather a reinforcement like the 525, more combat troops than supply, without breaking up the 82d Airborne. McNamara: the plan to push through; the Marine battalions available for an emergency assignment, though the Chiefs and the Marines do not want to send them.'
      n: '[FRUS 1964–68, VI, doc. 69](https://history.state.gov/historicaldocuments/frus1964-68v06/d69) (telephone conversation, Washington, Feb. 12, 1968, 8:29 a.m.). Made public: FRUS 1964–68, VI (2002). Names: Johnson, McNamara, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:westmoreland-william
