    id: cal.1967-03-20.vietnam-guam
    text: 'Check: the day. The Papers have Johnson speak to the men of Andersen Air Force Base, General Crumm named, on Mar. 21, 5:16 p.m., on leaving Guam ([1967 Pub. Papers 388](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=456)); on Mar. 20 the remarks on arrival are at Guam International Airport (375).'
- add:
    entry:
      id: cal.1965-12-15.india-and-china-kashmir
      when: Dec. 15
      date: '1965-12-15'
      place: washington
      thread: india-and-china-kashmir
      c: Joint statement after the talks with Ayub Khan. Johnson and Ayub reaffirm support for the Security Council's resolution of Sept. 20, "in all its parts," and those of Sept. 27 and Nov. 5. Johnson reaffirms that the United States regards "as vital to world peace the preservation of the independence and integrity of Pakistan." Both agree on a peaceful resolution of the differences between India and Pakistan, and discuss southeast Asia.
      n: 'Joint Statement Following Discussions With the President of Pakistan, [1965 Pub. Papers 1156](https://www.govinfo.gov/content/pkg/PPP-1965-book2/pdf/PPP-1965-book2.pdf#page=630) (Dec. 15, 1965). See [[cal.1965-12-14.india-and-china]]. Names: Ayub Khan, Johnson.'
      tags:
      - name:ayub-khan-mohammad
      - name:johnson-lyndon-b
