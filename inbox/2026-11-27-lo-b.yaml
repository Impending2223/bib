      c: 'Statement: Johnson approves Kentucky''s request for an Economic Development Administration grant of $3,972,000, matched equally by the State, for a recreation facility at Lake Barkley State Park, for the public and for servicemen and their families at Fort Campbell.'
      n: 'Statement by the President Announcing a Grant for a Recreational Facility at Lake Barkley State Park, Kentucky, [1966 Pub. Papers 778](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=152) (July 23, 1966). The order: after [[cal.1966-07-23.program]], the printed order alone (1966 Pub. Papers 776, 778). See [[cal.1966-07-23.program]]. Names: Johnson.'
      tags:
