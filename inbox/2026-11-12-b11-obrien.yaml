patch: 2026-11-12-b11-obrien
by: Claude (batch 11 reader, O'Brien, No Final Victories)
ops:
- add:
    entry:
      id: cal.1960-03-07.elections-1960-primaries
      when: Mar. 7
      date: '1960-03-07'
      thread: elections-1960-primaries
      c: 'Manchester, N.H., election eve. Governor Wesley Powell, Nixon''s New Hampshire manager, on his way to a television
        station to repeat that Kennedy is "soft" on communism. Boutin, Salinger and O''Brien buy fifteen minutes right after
        Powell, $75; Boutin answers him, Salinger writing the pages as he speaks. Powell to O''Brien: "I''ll see you in Wisconsin."
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 64. Check: the day (the work says election eve). Names: Powell, Boutin, Salinger,
        O''Brien, Kennedy, Nixon.'
      tags:
      - name:powell-wesley
      - name:boutin-bernard-l
      - name:salinger-pierre
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - name:nixon-richard-m
      - state:nh
      - city:manchester
- cite:
    id: cal.1960-03-08.elections-1960
    item: '[[w.obrien-no-final-victories]], 64 (Kennedy beats Paul Fisher, a California penmaker who entered against him,
      "by a nine-to-one margin"; Kennedy at the University of New Hampshire with Fisher backstage; not the vote totals or
      percentages)'
    units: '?'
- cite:
    id: cal.1960-04-05.elections-1960
    item: '[[w.obrien-no-final-victories]], 65 (Kennedy 56.5 per cent and six of the ten congressional districts; O''Brien''s
      account of the optimism and the "moral victory" Humphrey claimed; not the vote totals or the Republican side)'
    units: '?'
- cite:
    id: cal.1960-04-06.elections-1960
    item: '[[w.obrien-no-final-victories]], 66 (O''Brien, Robert Kennedy and O''Donnell fly to West Virginia the morning after
      the primary; the Caroline has a flat tire; not the Clarksburg and Charleston meetings, the counties or the numbers)'
    units: '?'
- cite:
    id: cal.1960-04-26.elections-1960
    item: '[[w.obrien-no-final-victories]], 78 (Pennsylvania: Kennedy''s write-in of 183,073 votes, Lawrence and Green running
      a favorite-son slate, Kennedy workers barred from the State; Green fires a precinct captain for the write-in; not the
      Massachusetts or Republican sides)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-01.elections-1960-primaries
      when: May 1
      date: '1960-05-01'
      thread: elections-1960-primaries
      c: West Virginia, the Sunday nine days before the primary. O'Brien, McDonough and Phyllis Maddock hop across the State
        in a twin-engine plane, about ten stops, to meet local political leaders; on confirming each slating arrangement O'Brien
        hands over the agreed share of the election-day expenses. The last landing, late at night, by the headlights of three
        automobiles. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 74. Check: the day (the work says the Sunday nine days before the election). Names:
        O''Brien, McDonough, Maddock.'
      tags:
      - name:obrien-lawrence-f
      - state:wv
- cite:
    id: cal.1960-05.elections-1960-primaries-4
    item: '[[w.obrien-no-final-victories]], 72–73 (O''Brien: the anonymous Minnesota correspondence on Humphrey''s draft board
      given to Roosevelt to be used only if Humphrey struck a low blow; Roosevelt hands it to a reporter in a car; Humphrey''s
      camp demands a retraction; Roosevelt apologizes and offers to leave; Kennedy, at the Charleston rally that evening,
      speaks warmly of him; not the day)'
    units: '?'
- cite:
    id: cal.1960-05.elections-1960-8
    item: '[[w.obrien-no-final-victories]], 75 (Sunday before the election: the last major television appearance, in a studio,
      Roosevelt to have moderated a question-and-answer session; Kennedy changes the format and talks directly of his religion;
      O''Brien watching from a bench; not the day, which the entry lacks)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-08.elections-1960-primaries
      when: May 8
      date: '1960-05-08'
      thread: elections-1960-primaries
      c: 'Charleston, W. Va., the hotel, the Sunday before the primary, after Mass in the rain. The polls show Kennedy behind.
        O''Brien, recalling Ribicoff''s televised talk of his immigrant parents: "are you ready to cry a little?" Kennedy:
        "I''m desperate but not that desperate." They agree to claim a moral victory, as Humphrey had in Wisconsin, if he
        loses by no more than 53–47; he would not quit. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 74–75. Names: O''Brien, Kennedy, Ribicoff, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - name:ribicoff-abraham
      - name:humphrey-hubert-h
      - state:wv
      - city:charleston
- cite:
    id: cal.1960-05-10.elections-1960
    item: '[[w.obrien-no-final-victories]], 76 (Kennedy 61 to 39 and forty-eight of fifty-five counties; Nebraska, Kennedy
      89.1 per cent, the largest Democratic vote since Roosevelt in 1940; not the Republican side or the official returns)'
    units: '?'
- cite:
    id: cal.1960-05-10.elections-1960-4
    item: '[[w.obrien-no-final-victories]], 76 (Humphrey concedes; Robert Kennedy goes to Humphrey''s headquarters and escorts
      him back to the Kennedy headquarters, "gallant and gracious"; the entry has Kennedy at Humphrey''s hotel room, Muriel
      Humphrey and Rauh, which O''Brien does not give)'
    units: '?'
- add:
    entry:
      id: cal.1960-05-11.elections-1960-primaries-2
      when: May 11
      date: '1960-05-11'
      thread: elections-1960-primaries
      c: The commercial flight from Charleston to Washington, Wednesday morning. O'Brien, Maddock and King sit near Humphrey
        and his wife; O'Brien and Humphrey agree it was "a hard fight, but fairly fought." Kennedy workers in the back sing
        a parody of the Humphrey song; O'Brien sends Maddock to stop them. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 76–77. Names: O''Brien, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - state:wv
- cite:
    id: cal.1960-05-17.elections-1960
    item: '[[w.obrien-no-final-victories]], 77 (Kennedy over Morse, 70.3 per cent to 17.2; O''Brien believes Teamster money
      was behind Morse; not the vote totals)'
    units: '?'
- cite:
    id: cal.1960-05-20.elections-1960
    item: '[[w.obrien-no-final-victories]], 79 (Kennedy 51 per cent, Morse 32, Humphrey 5.7, Symington 4.4, Johnson just under
      4; O''Brien''s account of the campaign; not the Republican side or the totals)'
    units: '?'
- cite:
    id: cal.1960-05.elections-1960
    item: '[[w.obrien-no-final-victories]], 79–80 (after the Oregon primary, O''Brien and O''Donnell persuade Kennedy to stop
      in Illinois on the way east and call on Stevenson; Stevenson "cool and aloof," gives no sign of retiring; Kennedy furious
      at the position they put him in; the entry has Stevenson''s lawn and a call from New York, which O''Brien does not give)'
    units: '?'
- check:
    id: cal.1960-05.elections-1960
    text: 'Check: the day: [[w.obrien-no-final-victories]], 79–80, puts the call on Stevenson on Kennedy''s way east just
      after the Oregon primary of May 20.'
- cite:
    id: cal.1960-07-10.elections-1960-3
    item: '[[w.obrien-no-final-victories]], 81 (Illinois gives 59½ of its 69 votes to Kennedy; Daley''s judgment; O''Brien
      dates it to the Sunday before the convention opened, saying Stevenson''s chance "had evaporated")'
    units: '?'
- cite:
    id: cal.1960-07-12.elections-1960-2
    item: '[[w.obrien-no-final-victories]], 81–82 (Johnson''s challenge to debate Kennedy before the Texas delegation, the
      day before the drive in which Kennedy tells O''Brien "I''m going to do it"; Kennedy''s opening, "full of admiration
      for Senator Johnson ... for majority leader of the United States Senate"; Johnson deflated and the Texans cheering;
      not the hour, the place or the Massachusetts delegation)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-11.elections-1960-los-angeles-3
      when: July 11–13
      date: '1960-07-11'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, a television booth above the convention floor, as Stevenson makes his first appearance in the hall
        and his followers set off a demonstration. Mike Wallace of CBS to O''Brien: "Isn''t this exciting?" O''Brien: it is
        "a fine demonstration but I don''t think it''s changing any delegate votes. It only shows Stevenson might be elected
        mayor of Los Angeles." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 81. Check: the day (the work says only "early in the convention week" for the drive
        with Kennedy and puts the demonstration before it). Names: O''Brien, Wallace, Stevenson.'
      tags:
      - name:obrien-lawrence-f
      - name:stevenson-adlai-e
      - state:ca
      - city:los-angeles
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.obrien-no-final-victories]], 82–83 (O''Brien on the floor near the California delegation, which gives Kennedy
      33½ of its 81; his count on target; Wyoming puts Kennedy over; Ted Kennedy waving the Wyoming standard; not the totals
      of the entry)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960-4
    item: '[[w.obrien-no-final-victories]], 84–85 (O''Brien meets Johnson for the first time in Kennedy''s suite; Johnson
      in brown, a five-minute monologue, nose to nose: he wants to be on the team and work tirelessly for the ticket; not
      the words quoted, which are Bernstein''s)'
    units: '?'
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-23
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: Los Angeles. To avoid a roll call on Johnson, where Reuther and Governor Williams of Michigan are opposed, McCormack
        is to ask the chairman, Collins, to suspend the rules and take the nomination by voice vote; Ribicoff, beside O'Brien,
        to seek the floor if anything fails. Collins recognizes McCormack, rules two-thirds needed, puts the motion on a chorus
        of ayes, and declares Johnson nominated by acclamation. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 85–86. Names: O''Brien, Reuther, Williams, McCormack, Collins, Ribicoff, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:reuther-walter
      - name:williams-g-mennen
      - name:mccormack-john-w
      - name:ribicoff-abraham
      - name:johnson-lyndon-b
      - state:mi
      - state:ca
- cite:
    id: cal.1960-07-16.democratic-party
    item: '[[w.obrien-no-final-victories]], 84–86 (Kennedy gives Jackson the national chairmanship for the campaign, though
      it was promised to Bailey, who agrees to wait until January; the national committee meeting where Kennedy announces
      O''Brien as director of organization; not the day, the hour or the press conference)'
    units: '?'
- add:
    entry:
      id: cal.1960-08-02.elections-1960-kennedy
      when: Aug. 2
      date: '1960-08-02'
      thread: elections-1960-kennedy
      c: 'Philadelphia, the Sheraton, 2 p.m. First of the regional meetings for state and local Democrats that Robert Kennedy
        and O''Brien hold across the country. O''Brien outlines registration, telephone campaigns, tabloids; Kennedy takes
        questions; Green tells how his organization registers voters. Kennedy: "We''ll buy you a shirt, Bill," and takes Green
        on to Boston. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 87. Names: O''Brien, Robert Kennedy, Green.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - name:green-william-j
      - state:pa
      - city:philadelphia
- add:
    entry:
      id: cal.1960-08-02.elections-1960-kennedy-2
      when: Aug. 2
      date: '1960-08-02'
      thread: elections-1960-kennedy
      c: Boston, the Parker House, that night. The regional meeting with party leaders of the New England States. By O'Brien's
        account.
      n: '[[w.obrien-no-final-victories]], 87. Names: O''Brien, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - state:ma
      - city:boston
- add:
    entry:
      id: cal.1960-08-03.elections-1960-kennedy
      when: Aug. 3
      date: '1960-08-03'
      thread: elections-1960-kennedy
      c: Chicago, luncheon meeting with Democrats of Illinois, Wisconsin, Indiana, Michigan, Ohio and Minnesota. On arrival
        Robert Kennedy and O'Brien learn that Daley's office was only notified of the meeting, not asked to host it; they
        call on him at the Morrison Hotel and apologize. Daley, satisfied, hosts it a few hours later. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 87–88. Names: O''Brien, Robert Kennedy, Daley.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - name:daley-richard-j
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy-4
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      c: St. Louis, the meeting with border-State Democrats, after Kansas City the same day. Liberal leaders come, but few
        from the State party organizations; the campaign decides against a meeting of Deep South Democrats until it has thought
        more, and asks Senator Smathers to coordinate the Southern States. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88–89. Check: the day (the work gives Kansas City and St. Louis for Saturday; Smathers''s
        appointment follows without a day). Names: Smathers.'
      tags:
      - name:smathers-george-a
      - name:obrien-lawrence-f
      - state:mo
      - city:st-louis
- add:
    entry:
      id: cal.1960-08-07.elections-1960-kennedy
      when: Aug. 7
      date: '1960-08-07'
      thread: elections-1960-kennedy
      c: New York, the Biltmore ballroom, Sunday night. The last of the regional meetings, with a thousand State politicians;
        the New Yorkers are less impressed than the other regions and some have more than a few words to say. It becomes a
        pep rally rather than a business session. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 88. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1960-09-26.elections-1960-debates-5
      when: Sept. 26
      date: '1960-09-26'
      thread: elections-1960-debates
      c: Chicago, WBBM, before the first debate. In the holding room Kennedy drinks tea, leaves the sandwiches; his father,
        Robert Kennedy, O'Donnell, Sorensen and O'Brien watch the clock. Ten minutes before air time O'Brien finds Nixon alone
        in the studio, pacing, mopping his brow, his make-up bad. Kennedy comes in as the countdown passes three minutes,
        barely glancing at him. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 92–93. Names: Kennedy, Robert Kennedy, O''Donnell, Sorensen, O''Brien, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:sorensen-theodore-c
      - name:obrien-lawrence-f
      - name:nixon-richard-m
      - state:il
      - city:chicago
- add:
    entry:
      id: cal.1960-11-08.elections-1960-count-16
      when: Nov. 8
      date: '1960-11-08'
      thread: elections-1960-count
      c: 'Hyannis Port, Robert Kennedy''s house, the afternoon. Kennedy, hoarse, in khakis and a tan sweater, inspects the
        telephone network O''Brien has set up for early returns from weathervane precincts, ten volunteers under Donahue,
        Dungan and Napolitan. He has Donahue get Bailey: "John, how''s it going?" Bailey asks who it is. "Jack." "Jack who?"
        "Your candidate." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 95. Names: Kennedy, O''Brien, Donahue, Dungan, Napolitan, Bailey.'
      tags:
      - name:kennedy-john-f
      - name:obrien-lawrence-f
      - name:napolitan-joseph
      - name:bailey-lloyd-w
      - state:ma
      - city:hyannis-port
- cite:
    id: cal.1960-11-08.elections-1960-9
    item: '[[w.obrien-no-final-victories]], 95–96 (the telephone network of weathervane precincts at Robert Kennedy''s house;
      election night watched together; Kennedy sips a beer as the returns see-saw; not the sunporch, the hours or Harris)'
    units: '?'
- cite:
    id: cal.1960-11-08.elections-1960-count-13
    item: '[[w.obrien-no-final-victories]], 96 (Johnson telephones; Kennedy: "Well, I see you lost Ohio and I won Texas";
      the entry has Johnson''s remark about Pennsylvania and Ohio)'
    units: '?'
- variant:
    id: cal.1960-11-08.elections-1960-count-13
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Johnson calls and Kennedy breaks the tension by quipping, "Well, I see you lost Ohio and I won Texas"'
    at: '96'
- cite:
    id: cal.1960-11-09.elections-1960-9
    item: '[[w.obrien-no-final-victories]], 96 (Nixon on television about 3 a.m. refusing to concede; "Why should he?" ...
      "I wouldn''t, in his place"; Lodge, nodding, "Cabot looks like he''s having a hard time staying awake"; Kennedy to bed
      about four; not the Armory)'
    units: '?'
- add:
    entry:
      id: cal.1960-11-14.transition-and-staff-4
      when: Nov. 14
      date: '1960-11-14'
      thread: transition-and-staff
      c: 'Washington, the Monday after the election, the Democratic National Committee office. O''Brien at his desk. The President-elect''s
        first assignment: to think about which campaign supporters should be offered places in the new Administration. By
        O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 97. Names: O''Brien, Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-11.transition-and-staff-cabinet-6
      when: Nov., mid-month
      date: 1960-11
      thread: transition-and-staff-cabinet
      c: Palm Beach, poolside and in the President-elect's bedroom, the talks on appointments. Shriver first names McNamara,
        the new president of the Ford Motor Company, for Defense. Someone asks if he is a Catholic; no one knows, and Shriver
        is to find out, since a Catholic Attorney General is already in view. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 97–98. Check: the day (the work gives "mid-November" for the move to Palm Beach
        and no day for the bedroom talk). Names: Shriver, McNamara.'
      tags:
      - name:shriver-r-sargent
      - name:mcnamara-robert-s
      - name:kennedy-john-f
      - state:fl
- add:
    entry:
      id: cal.1960-12.transition-and-staff-6
      when: Dec., mid-month
      date: 1960-12
      thread: transition-and-staff
      c: 'The Democratic National Committee offices, Washington. Robert Kennedy to O''Brien: "the spot for you is Deputy Postmaster
        General," the number two post, since John Bailey will not stay on as national chairman forever. O''Brien: "I haven''t
        any interest whatsoever in that spot"; he can go back to Springfield. Kennedy, annoyed, says that might not be a bad
        idea. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 100. Check: the day (the work says "one day in mid-December"). Names: Robert Kennedy,
        O''Brien, Bailey.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:bailey-lloyd-w
- add:
    entry:
      id: cal.1960-12.transition-and-staff-7
      when: Dec., Christmas
      date: 1960-12
      thread: transition-and-staff
      c: 'Kennedy to O''Brien: "Larry, I''ve decided congressional relations is the right role for you and the personnel slot
        seems to go with it." O''Brien is named special assistant to the President for congressional relations and personnel.
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 101. Check: the day (the work says "over Christmas"). Names: Kennedy, O''Brien.'
      tags:
      - name:kennedy-john-f
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1961-01-13.transition-and-staff
      when: Jan. 13
      date: '1961-01-13'
      thread: transition-and-staff
      c: O'Brien begins interviewing candidates for his congressional relations staff, with and without Capitol Hill experience;
        he thinks sound political judgment matters more than prior service on the Hill. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 101–02. To check: Phyllis Maddock''s call on Bryce Harlow and his staff, and the
        choices (Manatos for the Senate, Henry Hall Wilson for the House, Donahue, Desautels), none dated in the work. Names:
        O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1961-01-21.transition-and-staff-3
      when: Jan. 21
      date: '1961-01-21'
      thread: transition-and-staff
      c: The White House, the Fish Room, 8 a.m., the morning after the Inaugural Ball. Kennedy gives the staff a brief let's-get-going
        talk; they scramble for office space. O'Brien takes Harlow's old rooms on the second floor and Feldman's paneled corner
        office, and later is sworn in alone by the chief clerk. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 102–03. Names: Kennedy, O''Brien, Feldman, Harlow.'
      tags:
      - name:kennedy-john-f
      - name:obrien-lawrence-f
      - name:feldman-myer
      - name:harlow-bryce-n
- cite:
    id: cal.1961-01.rules
    item: '[[w.obrien-no-final-victories]], 105–06 (the weekly leaders'' breakfast, Tuesday, Jan. 24: Rayburn: "Mr. President,"
      ... "I don''t believe we have the votes to expand the Rules Committee"; Kennedy calls him back that afternoon and asks
      him to put off the vote from Jan. 25 to Jan. 31; Kennedy: "We can''t lose this one, Larry"; O''Brien does not give the
      words as the entry has them)'
    units: '?'
- check:
    id: cal.1961-01.rules
    text: 'Check: the day: [[w.obrien-no-final-victories]], 105, puts Rayburn''s warning at the first of Kennedy''s weekly
      leaders'' breakfasts, Tuesday, Jan. 24; the afternoon call asking to postpone the vote of Jan. 25 follows.'
- add:
    entry:
      id: cal.1961-01-24.rules
      when: Jan. 24
      date: '1961-01-24'
      thread: rules
      c: The White House, that afternoon. Kennedy calls Rayburn back and asks him to postpone the Rules Committee vote from
        Jan. 25 to Jan. 31. Rayburn is reluctant; he agrees. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 105–06. Names: Kennedy, Rayburn, O''Brien.'
      tags:
      - name:kennedy-john-f
      - name:rayburn-sam
      - name:obrien-lawrence-f
- cite:
    id: cal.1961-01-31.rules
    item: '[[w.obrien-no-final-victories]], 106–07 (the White House whip count, which first showed a loss by seven votes,
      with Bolling and other House allies helping; Kennedy''s one call, to Cooley, dean of the North Carolina delegation,
      urging him to reconvene it, with no vote changed; the vote 217 to 212 with twenty-two Republicans and thirty-four Southern
      Democrats)'
    units: '?'
- add:
    entry:
      id: cal.1961-03-24.jobs-and-wages
      when: Mar. 24
      date: '1961-03-24'
      thread: jobs-and-wages
      c: 'Rayburn''s office. Goldberg and O''Brien with Vinson, McCormack, Albert and Powell on the minimum wage. Vinson would
        go to $1.15 for Southern votes; Goldberg to O''Brien: "This really is a White House decision." O''Brien holds $1.25,
        drops about half a million of the four million workers from coverage, and has Albert lead the floor debate. By O''Brien''s
        account.'
      n: '[[w.obrien-no-final-victories]], 124–25. Check: the day (the work puts the meeting before the debate and the vote
        of 186 to 185 "the next day" and "that day"). Names: Rayburn, Goldberg, Vinson, McCormack, Albert, Powell, O''Brien.'
      tags:
      - name:rayburn-sam
      - name:goldberg-arthur-j
      - name:vinson-carl
      - name:mccormack-john-w
      - name:albert-carl
      - name:obrien-lawrence-f
- cite:
    id: cal.1961-03-24.program
    item: '[[w.obrien-no-final-victories]], 125 (the House loses the minimum-wage bill on the floor, "by a vote of 186 to
      185"; Kennedy, told by O''Brien: "One vote! I can''t believe it!"; later the House passes $1.15, the conference agrees
      to a two-step increase, $1.15 then $1.25)'
    units: '?'
- variant:
    id: cal.1961-03-24.program
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the House lost on the floor "by a vote of 186 to 185," the day after the meeting in Rayburn''s office
      on the 24th; the House then passed a $1.15 version'
    at: '125'
- cite:
    id: cal.1961-05-01.program
    item: '[[w.obrien-no-final-victories]], 126 (Kennedy signs the Area Redevelopment Act, a four-year, $451 million program,
      "that same week, the anniversary of his victory in the West Virginia primary"; not the statute)'
    units: '?'
- check:
    id: cal.1961-05-01.program
    text: 'Check: the day: [[w.obrien-no-final-victories]], 126, puts the signing in the week of the anniversary of the West
      Virginia primary (May 10), the same week as the minimum-wage signing.'
- cite:
    id: cal.1961-05-05.jobs-and-wages
    item: '[[w.obrien-no-final-victories]], 125–26 (the conference report approved 230 to 196; Kennedy signs on May 5; Biemiller
      of the AFL-CIO: "Larry, we in organized labor have been waiting seven years for this moment"; not the statute)'
    units: '?'
- cite:
    id: cal.1961-09.press-and-broadcasting
    item: '[[w.obrien-no-final-victories]], 129–30 (after the President''s two receptions for House and Senate Democrats before
      the adjournment on Sept. 27, Sorensen briefs about two dozen reporters at the home of Carroll Kilpatrick of the Washington
      Post, O''Brien there to answer questions; the reporters resent what they see as a snow job; not the date)'
    units: '?'
- cite:
    id: cal.1961-11-16.congress
    item: '[[w.obrien-no-final-victories]], 115 (O''Brien with the President in California when the news comes; to Bonham
      for the funeral on Nov. 18; McCormack succeeds as Speaker; not the burial)'
    units: '?'
- cite:
    id: cal.1962-03-21.defense
    item: '[[w.obrien-no-final-victories]], 117–18 (Vinson''s bill to direct the Secretary of the Air Force to spend about
      half a billion dollars on the RS-70 against the Defense Department''s $171 million; McNamara cannot budge him; in March
      Kennedy calls him in and, in a private walk in the Rose Garden, persuades him to withdraw the demand; not the day)'
    units: '?'
- cite:
    id: cal.1962-05-19.democratic-party
    item: '[[w.obrien-no-final-victories]], 151 (O''Brien and his wife in New York for the Democratic fund-raiser at Madison
      Square Garden on the President''s birthday; Marilyn Monroe sings "Happy Birthday"; Arthur Krim''s party afterward; not
      the year''s day, the month being given as May)'
    units: '?'
- cite:
    id: cal.1962-05-20.medicare
    item: '[[w.obrien-no-final-victories]], 133–34 (the National Council of Senior Citizens'' rally at the Garden, May 20;
      Kennedy agrees to a nationally televised address; it fails to rouse pressure on Congress and annoys Mills; not the AMA''s
      answer)'
    units: '?'
- cite:
    id: cal.1962-07-17.medicare-2
    item: '[[w.obrien-no-final-victories]], 134 (O''Brien''s head count to the President before the Senate vote: the Senate
      divided 50–50, adding "Senator Randolph has a problem"; the page does not give the leaders'' breakfast or the day)'
    units: '?'
- cite:
    id: cal.1962-07-17.medicare
    item: '[[w.obrien-no-final-victories]], 135 (Anderson''s amendment to the public welfare bill; the vote lost, 52 to 48,
      Randolph with Kerr; Hayden had promised to vote with the administration if Randolph did, which would have made a tie
      for Johnson to break; not the Javits name or the tabling motion)'
    units: '?'
- add:
    entry:
      id: cal.1962-07-16.medicare
      when: July 16
      date: '1962-07-16'
      thread: medicare
      c: The day before the Senate's Medicare vote. Ribicoff and Wilbur Cohen call on Senator Randolph of West Virginia and
        assure him that the administration, not Kerr, will cover the $11 million his State overspent on federal welfare funds.
        The White House has also called every labor leader and politician it knows in West Virginia to press him. Randolph
        is noncommittal. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 134–35. Names: Ribicoff, Cohen, Randolph, Kerr.'
      tags:
      - name:ribicoff-abraham
      - name:cohen-wilbur-j
      - name:randolph-jennings
      - name:kerr-robert-s
      - state:wv
- add:
    entry:
      id: cal.1962-07.rules
      when: July, late
      date: 1962-07
      thread: rules
      c: A Saturday afternoon, after two weeks of the liberals' filibuster against the communications satellite bill. Kerr,
        Bobby Baker, Manatos and O'Brien pool their intelligence and conclude that a two-thirds vote for cloture is possible
        but very close. Many Southerners want the filibuster stopped but are reluctant to vote against unlimited debate; the
        plan is to persuade them not to vote at all. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 132–33. Check: the day (the work says "in late July" and "one Saturday afternoon").
        Names: Kerr, O''Brien.'
      tags:
      - name:kerr-robert-s
      - name:obrien-lawrence-f
- cite:
    id: cal.1962-08-14.rules
    item: '[[w.obrien-no-final-victories]], 133 (Aug. 14: cloture 63 to 27, three votes to spare, the first time since 1927
      and the fifth in history; of the twenty-two senators of the eleven Confederate States, fifteen against, two for, five
      not voting; the five who stayed away gave the margin)'
    units: '?'
- cite:
    id: cal.1962-09-30.mississippi-ole-miss-6
    item: '[[w.obrien-no-final-victories]], 139–40 (O''Brien and O''Donnell called to the White House about 6 p.m., the Cabinet
      Room, then the Oval Office, where Kennedy paces and asks his brother "What''s going on?"; Katzenbach''s telephone reports;
      Kennedy''s speech postponed from 7:30 to 10 p.m.; the troops from Memphis do not arrive for hours; Kennedy on the military:
      "No wonder it''s so hard to win a war"; the entry has the Bay of Pigs remark, which O''Brien does not give)'
    units: '?'
- cite:
    id: cal.1962-10-11.trade
    item: '[[w.obrien-no-final-victories]], 131 (Kennedy signs the Trade Expansion Act of 1962 on Oct. 11, "the most important
      international piece of legislation since the Marshall Plan")'
    units: '?'
- cite:
    id: cal.1962-10-20.missile-crisis
    item: '[[w.obrien-no-final-victories]], 140–41 (Saturday, Oct. 20, in Kennedy''s Chicago hotel suite: Kennedy calls in
      Salinger and has him tell the press he has a cold and is returning to the White House; the plane to Andrews, the helicopter,
      Kennedy silent, chin in hand; not the quarantine decision)'
    units: '?'
- add:
    entry:
      id: cal.1962-11-06.elections-1962-3
      when: Nov. 6
      date: '1962-11-06'
      thread: elections-1962
      c: 'Election night. O''Brien goes to the President''s office to say that Representative Frank W. Burke of Louisville,
        a staunch supporter, has been defeated. Kennedy: "It looks like a damn long night, Larry." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 142. Names: O''Brien, Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-john-f
      - state:ky
      - city:louisville
- cite:
    id: cal.1963-06-19.civil-rights-bill
    item: '[[w.obrien-no-final-victories]], 144 (the civil rights bill sent to Congress on June 19: a ban on discrimination
      in public accommodations, authority for the Attorney General to seek school desegregation, a Community Relations Service)'
    units: '?'
- cite:
    id: cal.1963-06-26.europe-and-the-alliance-kennedy-in-europe
    item: '[[w.obrien-no-final-victories]], 152–54 (about fifty White House staff of Irish descent flown to Ireland; Kennedy,
      fresh from West Berlin, met at Dublin Airport; the motorcade and City Hall at Cork, where Kennedy has O''Brien and Powers
      present their relatives, O''Brien''s aunt Julia Sweeney; the choir at Shannon; O''Brien, Boland and Donahue fly on to
      Rome for three days; not the days)'
    units: '?'
- cite:
    id: cal.1963-10-29.republican-party-congress
    item: '[[w.obrien-no-final-victories]], 146 (Kennedy asks Halleck to his office; Halleck: "Give me until tomorrow noon";
      no call by 12:45, Kennedy calls him; Halleck: "I''ve got you the votes to get your bill out of the committee"; the bill
      reported out of Judiciary in late October; O''Brien in the room; the entry has the recorded words, which O''Brien does
      not give)'
    units: '?'
- cite:
    id: cal.1963-10-29.civil-rights-bill
    item: '[[w.obrien-no-final-victories]], 143, 146 (the House Judiciary Committee''s approval; Kennedy''s personal intervention;
      Halleck and McCulloch the key Republicans; not the vote of 20 to 12)'
    units: '?'
- variant:
    id: cal.1963-11-22.democratic-party-5
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: on the Friday morning, on the sidewalk below the Hotel Texas where the motorcade waits, he persuades
      Yarborough to ride with Johnson, then tells Johnson at the hotel door "Yarborough''s going to ride with you"; Kennedy
      had told him in the suite to "throw Yarborough into the car with Lyndon"'
    at: '156'
- cite:
    id: cal.1963-11-22.democratic-party-5
    item: '[[w.obrien-no-final-victories]], 156–57 (Kennedy in the suite at the Hotel Texas on Friday morning, looking down
      at the speaker''s platform: the Secret Service could not stop someone who wanted to get him; Kennedy''s order to O''Brien
      to end the Johnson–Yarborough sideshow; O''Brien persuades Yarborough on the sidewalk, not by telephone; not Connally
      or the governor''s reception)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-24
    item: '[[w.obrien-no-final-victories]], 158–60 (the hospital: Kilduff, the acting press secretary, asks what to tell the
      press; the casket; a coroner and a judge insist on an autopsy; O''Donnell, Powers, McHugh and O''Brien push the casket
      past the Dallas officials, O''Brien shoving a priest aside; the entry has Dr. Rose and Judge Ward by name, which O''Brien
      does not give)'
    units: '?'
- cite:
    id: cal.1963-11.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 163–65 (Johnson in the stateroom of Air Force One before the take-off, to O''Brien
      and O''Donnell: "I need you more than you need me—and more than Jack Kennedy needed you"; again in the air; and in the
      days after: "I need you, Larry"; the decision to stay; not the month)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-22.medicare-2
      when: Nov. 22
      date: '1963-11-22'
      thread: medicare
      c: Washington, the morning of the assassination. Henry Hall Wilson and Wilbur Mills, after weeks of talks, reach agreement
        on a formula to finance Medicare acceptable both to Mills and to the Administration. Wilson, bursting with excitement,
        tries to reach O'Brien in Texas and is told the President's party has just left for Dallas. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 143. Names: Wilson, Mills, O''Brien.'
      tags:
      - name:mills-wilbur-d
      - name:obrien-lawrence-f
      - state:tx
- add:
    entry:
      id: cal.1963-11-22.succession-31
      when: Nov. 22–23, midnight
      date: '1963-11-22'
      thread: succession
      c: Gawler's Funeral Home, Wisconsin Avenue, Washington, while Kennedy's body is at Bethesda. O'Brien, O'Donnell and
        Powers ask for the plainest casket in the middle price range and take the one with the simplest interior without asking
        the price; it proves expensive. The body reaches the East Room at 4 a.m. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 161. Names: O''Brien, O''Donnell.'
      tags:
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - city:washington
- add:
    entry:
      id: cal.1963-11-23.medicare
      when: Nov. 23
      date: '1963-11-23'
      thread: medicare
      c: The White House, Saturday night, Johnson's second night as President. Henry Hall Wilson tells O'Brien of the breakthrough
        with Mills of the day before. O'Brien, thinking it urgent, has Wilson send a draft of the new Medicare bill to Johnson
        that night. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 186. Names: Wilson, O''Brien, Mills, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:mills-wilbur-d
      - name:johnson-lyndon-b
- cite:
    id: cal.1963-11-27.succession-3
    item: '[[w.obrien-no-final-victories]], 164 (Wednesday noon: Sorensen, Salinger and O''Brien go with Johnson to the Hill
      for the address to Congress; the vote on the Russian wheat bill, scheduled for Monday, postponed until later in the
      week)'
    units: '?'
- cite:
    id: cal.1964-10-06.elections-1964-2
    item: '[[w.obrien-no-final-victories]], 177–78 (O''Brien''s four trips for the campaign: regional meetings with Democrats
      and labor; his reports, critical of the lack of materials and co-ordination, telephoned in when the mail is thought
      too slow; Johnson reading them as they came and demanding action, by Jenkins; not the date)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-24.elections-1964-atlantic-city-2
      when: Aug. 24–27
      date: '1964-08-24'
      thread: elections-1964-atlantic-city
      c: Atlantic City. O'Brien and O'Donnell are stationed in an out-of-the-way motel, with a room, cars and tickets to the
        floor and the receptions, and nothing to do; Johnson, through Jenkins and Marvin Watson, controls every detail, and
        the platform was written in the White House. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 176–77. Check: the days (the work gives none). Names: O''Brien, O''Donnell, Johnson,
        Jenkins.'
      tags:
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
      - name:johnson-lyndon-b
      - state:nj
      - city:atlantic-city
- add:
    entry:
      id: cal.1964-11-03.elections-1964-7
      when: Nov. 3
      date: '1964-11-03'
      thread: elections-1964
      c: 'Election night. Johnson calls O''Brien twice, elated by the landslide and the new Democratic majorities in both
        Houses: "We can wrap up the New Frontier program now, Larry," he says. "We can pass it all now." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 178. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1965-01.transition-and-staff-3
      when: Jan., one day
      date: 1965-01
      thread: transition-and-staff
      c: 'Johnson''s office. O''Brien, who had meant to leave after the election, tells Johnson he will stay on two conditions:
        that Johnson announce at his next news conference that O''Brien submitted his resignation but agreed at Johnson''s
        insistence to stay through the 1965 legislative session, and that at the session''s end he accept the resignation
        without further discussion. Johnson: "I accept your conditions." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 179–80. Check: the day (the work says "one day in January"). Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-18.vietnam-congress-3
      when: Feb. 18
      date: '1965-02-18'
      thread: vietnam-congress
      c: 'O''Brien to Johnson, by memorandum: a Vietnam debate is scheduled in the House; the leadership will lead it in support
        of the President''s policy and O''Brien''s office will help with facts and speech material. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-18.vietnam-congress-4
      when: Feb. 18
      date: '1965-02-18'
      thread: vietnam-congress
      c: 'O''Brien to Johnson, by memorandum: a Senate debate on Vietnam is scheduled; Dirksen''s support is "fine" and considerable
        additional Democratic support is available "to counteract Church, McGovern, et al." A resolution supporting the President
        is inadvisable, since it would go to Fulbright''s Foreign Relations Committee; instead an informal statement of support
        is to be circulated among Senate allies, and O''Brien''s office will keep supplying them with speeches and statements.
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Names: O''Brien, Johnson, Dirksen, Church, McGovern, Fulbright.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:church-frank
      - name:mcgovern-george
      - name:fulbright-j-william
- cite:
    id: cal.1965-03-26.medicare
    item: '[[w.obrien-no-final-victories]], 187–88 (in mid-March, after Ways and Means reported the bill, Johnson on television
      with nine Democratic leaders of Congress; all but Byrd pledge support; Johnson pins Byrd down to prompt and thorough
      hearings: "Yes"; the words quoted)'
    units: '?'
- check:
    id: cal.1965-03-26.medicare
    text: 'Check: the day: [[w.obrien-no-final-victories]], 187, puts Johnson''s television appearance with the congressional
      leaders and Byrd''s promise of hearings "in mid-March, just after Ways and Means reported out the Medicare bill."'
- cite:
    id: cal.1965-04-08.medicare
    item: '[[w.obrien-no-final-victories]], 188 (the House passes Medicare on April 8; Mills given a standing ovation; the
      Republican Bettercare substitute defeated by 45 votes; the final vote 313 to 115)'
    units: '?'
- cite:
    id: cal.1965-07-09.medicare
    item: '[[w.obrien-no-final-victories]], 188 (the Senate passes Medicare 68 to 21, after prompt hearings by Byrd''s committee;
      not the day)'
    units: '?'
- cite:
    id: cal.1965-07-30.medicare
    item: '[[w.obrien-no-final-victories]], 188 (Johnson signs at the Truman Library, Independence, Mo., July 30, 1965, Truman
      present)'
    units: '?'
- add:
    entry:
      id: cal.1965-08-27.transition-and-staff
      when: Aug. 27
      date: '1965-08-27'
      thread: transition-and-staff
      c: 'The White House, a Friday afternoon in late August, before Johnson leaves for the Ranch. Johnson, his back turned,
        studying a news ticker, to O''Brien: "Bad news, Larry," he says. "You''re going to have to leave the White House.
        I''m appointing you Postmaster General!" O''Brien is to come to the Ranch the next day. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 199. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- cite:
    id: cal.1965-08-29.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 199–201 (O''Brien flies down on Saturday with Rusk and the Gronouskis, Mass with
      Gronouski, to church with Johnson on Sunday, where Merriman Smith of UPI cries out "Hey, there''s Larry O''Brien!";
      Johnson''s news conference on the lawn confirming Gronouski as ambassador to Poland and O''Brien as Postmaster General,
      who is to go on with the legislative program; the dated Sunday is O''Brien''s, not the page''s)'
    units: '?'
- add:
    entry:
      id: cal.1965-10-03.immigration-2
      when: Oct. 3
      date: '1965-10-03'
      thread: immigration
      c: 'Liberty Island, the immigration bill signing. The word is out to do all that can be done for Abe Beame, running
        for mayor of New York. The politicians scramble off the ferry for places near Johnson in the news photographs; O''Brien
        blocks Governor Rockefeller''s path to give Beame a head start. Rockefeller: "Damn it, O''Brien, I''m the governor
        of New York and I have a right to get off this boat." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 184. Check: the month (the work says "the summer of 1965"). Names: O''Brien, Beame,
        Rockefeller.'
      tags:
      - name:obrien-lawrence-f
      - name:beame-abraham-d
      - name:rockefeller-nelson
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1965-10-11.transition-and-staff
      when: Oct. 11
      date: '1965-10-11'
      thread: transition-and-staff
      c: The Federal City Club, Washington. A party for O'Brien given by Washington newspapermen, with songs and skits. Dirksen
        asks for "a few bricks and a little mortar" for post offices in Illinois; Art Buchwald reads a speech so funny that
        he leaves to phone it in for his next column. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 204. Names: Dirksen, O''Brien.'
      tags:
      - name:obrien-lawrence-f
      - city:washington
- cite:
    id: cal.1965-11-03.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 202–03 (the swearing-in delayed two months because Johnson wanted him to stay
      with the legislative program; Johnson, at the Ranch recovering from surgery, calls him to Hye, Tex., a combination store
      and post office; Johnson asks the storekeeper who appointed him postmaster; "Jim Farley"; the Kraft cheese)'
    units: '?'
- add:
    entry:
      id: cal.1965-12-09.program
      when: Dec. 9
      date: '1965-12-09'
      thread: program
      c: 'O''Brien to Johnson, a blunt memorandum on the Post Office Department after his first month: "postal service has
        obviously been deteriorating rapidly while mail volume shows an extraordinary yearly increase." He lists an inadequate
        budget and serious management deficiencies. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 205. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-03.vietnam-support
      when: Mar.
      date: 1966-03
      thread: vietnam-support
      c: 'New York. O''Brien, after a luncheon with the editors of the *New York Times*, to Johnson, by memorandum: a two-hour
        question-and-answer period, mostly on Vietnam; he reminded them of the public''s attitude, the polls, the President''s
        desire for a peaceful resolution and his intention to fulfil the commitment, and urged internal unity. The editors
        are not of one mind; some, individually, support the President. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work says "the next month," after a February memorandum).
        Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1966-04.vietnam-support
      when: Apr., mid-month
      date: 1966-04
      thread: vietnam-support
      c: 'California. O''Brien at a testimonial dinner for Representative Cohelan, a critic of the war who speaks twenty minutes
        in a "dove-like" position; O''Brien follows with the Vietnam part of his speech, hit "very hard"; the audience is
        cool. To Johnson, by memorandum: the extent of concern in northern California surprised him; "this could mean political
        trouble in the near future." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 192. Check: the day (the work says "in mid-April"). Names: O''Brien, Johnson, Cohelan.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - state:ca
- add:
    entry:
      id: cal.1966-11-02.elections-1966
      when: Nov. 2
      date: '1966-11-02'
      thread: elections-1966
      c: 'O''Brien to Johnson, his predictions for the elections: a net loss of thirty-two House seats and perhaps thirty-seven;
        one Senate seat and perhaps two; four governorships. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 193. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.obrien-no-final-victories]], 193 (O''Brien''s account of the result: forty-seven House seats, four Senate seats
      and eight governorships lost, against his predictions of Nov. 2; the entry''s House figure, 295 to 248, agrees)'
    units: '?'
- cite:
    id: cal.1967-01-09.vietnam-congress-2
    item: '[[w.obrien-no-final-victories]], 213–14 (Jan. 9, 1967, the President with the Senate Democratic leaders on the
      war; Manatos''s notes of what Fulbright, Smathers, Russell, Symington, Magnuson, Inouye, Hill and Randolph said; O''Brien:
      the strongest face-to-face criticism of the war the President had yet heard; not the order of speakers or Mansfield''s
      suggestion)'
    units: '?'
- add:
    entry:
      id: cal.1967-04-03.program
      when: Apr. 3
      date: '1967-04-03'
      thread: program
      c: 'Postmaster General O''Brien, to the Magazine Publishers Association: the postal service should be taken out of the
        Cabinet and made a nonprofit government corporation, run by a board of directors appointed by the President and a
        professional executive, free of appropriated funds and able to issue bonds for new facilities. Front-page news across
        the country; several hundred editorials, most favorable. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 208–09. Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- cite:
    id: cal.1967-04-08.program
    item: '[[w.obrien-no-final-victories]], 209–10 (April 8, five days after O''Brien''s speech: the President names the President''s
      Commission on Postal Organization, Kappel, formerly of AT&T, chairman; the commission reports in June 1968; not the
      executive order)'
    units: '?'
- cite:
    id: cal.1967-11-03.elections-1968
    item: '[[w.obrien-no-final-victories]], 215 (O''Brien''s long memorandum in early November at the President''s request:
      no early announcement; organize at once; no primaries, but let supporters work in key primary States, the New Hampshire
      write-in for one; stress the vision of the future; the strategy adopted at the meeting and followed for four months;
      not the "debacle")'
    units: '?'
- cite:
    id: cal.1967-11-30.elections-1968
    item: '[[w.obrien-no-final-victories]], 215 (McCarthy announces he will challenge Johnson in New Hampshire and other primaries;
      Johnson limits himself to a decidedly negative opinion of McCarthy; no one around him takes it seriously)'
    units: '?'
- add:
    entry:
      id: cal.1968-02-26.robert-kennedy-campaign-decision
      when: Feb. 26
      date: '1968-02-26'
      thread: robert-kennedy-campaign-decision
      c: 'Robert Kennedy''s Senate office, lunch. For the first time Kennedy tells O''Brien he may challenge Johnson: "I don''t
        want to do it, but I may have to," he says. "Johnson''s Vietnam policy is a debacle. ... He scares me." He asks O''Brien
        to talk to McNamara. O''Brien still doubts that he will run. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 216. Names: Robert Kennedy, O''Brien, Johnson, McNamara.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- cite:
    id: cal.1968-02.robert-kennedy
    item: '[[w.obrien-no-final-victories]], 216–17 (a few days after the lunch of Feb. 26, McNamara and O''Brien talk in O''Brien''s
      office: Vietnam worse than the public knows, Johnson not objective; McNamara: "I think Bob has to run"; O''Brien: not
      sure it is the best way to a new policy; the entry''s words are as the page has them)'
    units: '?'
- check:
    id: cal.1968-02.robert-kennedy
    text: 'Check: the day: [[w.obrien-no-final-victories]], 216–17, puts the talk a few days after the lunch of Feb. 26, in
      O''Brien''s office; Clifford had replaced McNamara as Secretary of Defense.'
- cite:
    id: cal.1968-01.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 219 (O''Brien''s long memorandum to Johnson on a poll of Massachusetts Democrats:
      Edward Kennedy 80 to McCarthy''s 12, the President 72 to 11, McCormack 70 to 20, O''Brien 59 to 23; his offer to resign
      and run as Johnson''s stand-in; his advice that Johnson himself might enter; "earlier in the year," no day given)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-02.robert-kennedy-campaign-decision
      when: Mar. 2
      date: '1968-03-02'
      thread: robert-kennedy-campaign-decision
      c: 'Hickory Hill, breakfast. Robert Kennedy speaks of the politicians urging him to run and says Unruh is having a poll
        taken in California. O''Brien: he shares Kennedy''s concern but cannot ignore political realities; the hope is that
        the men around Johnson can change his policy; he will keep their talks confidential but until then remain loyal to
        the President. He urges Kennedy to see Johnson face to face. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 217–18. Names: Robert Kennedy, O''Brien, Unruh, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:unruh-jesse-m
      - name:johnson-lyndon-b
      - state:ca
- cite:
    id: cal.1968-03-03.robert-kennedy-campaign
    item: '[[w.obrien-no-final-victories]], 218–19 (Sunday: Kennedy calls to say the California poll shows an Unruh slate
      pledged to him would run strongly, a "quickie" telephone poll; dinner at Hickory Hill, Ted Kennedy, Smith and Tunney
      there; Ethel Kennedy: he will have to run; Edward Kennedy tells O''Brien he will not enter the Massachusetts primary;
      not the order of guests)'
    units: '?'
- cite:
    id: cal.1968-03-05.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 220 (the filing deadline of the Apr. 30 primary; at the legislative breakfast
      Johnson thanks O''Brien for his offer to stand in; Donahue ready to file; Watson fails to return two calls; Donahue
      told he cannot file; not McCarthy''s words)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-07.elections-1968-johnson
      when: Mar. 7
      date: '1968-03-07'
      thread: elections-1968-johnson
      c: 'Johnson telephones O''Brien, displeased at a *New York Times* story quoting a "high official" that he will enter
        no primaries: "Were you the source of that?" O''Brien: the article made sense and he agrees with it. Johnson: "I''ll
        make my own damn decisions about the primaries and nobody is authorized to speak for me." O''Brien asks if he has
        any further comment and hangs up; the only unpleasant conversation between them. Ira Kapenstein had been the source.
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 220–21. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-03-11.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 221 (New Hampshire: the Johnson people panic and run rough radio advertisements
      implying a vote for McCarthy is a vote for Hanoi; O''Brien kept out of the New Hampshire effort, which Boutin directed;
      Boutin called to apologize; the night before the primary is the entry''s, not the page''s)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-15.robert-kennedy-campaign-decision-3
      when: Mar. 15
      date: '1968-03-15'
      thread: robert-kennedy-campaign-decision
      c: Boston, a luncheon in connection with the issue of a John F. Kennedy postage stamp. O'Brien, Postmaster General,
        speaks; Edward Kennedy, there, has to leave early for Washington and has Jimmy King of his Senate staff tell O'Brien
        that Robert Kennedy will announce his candidacy the next day. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 222. Names: O''Brien, Edward Kennedy, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
      - name:kennedy-robert-f
      - state:ma
      - city:boston
- cite:
    id: cal.1968-03-16.robert-kennedy-campaign-2
    item: '[[w.obrien-no-final-victories]], 222 (O''Brien watches Kennedy''s televised announcement on Saturday morning, then
      goes on with his Massachusetts schedule, a parade in Holyoke and a wreath at the Kennedy memorial in Chicopee; not the
      Caucus Room)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-17.robert-kennedy-campaign-decision
      when: Mar. 17
      date: '1968-03-17'
      thread: robert-kennedy-campaign-decision
      c: Everett, Mass., Sunday evening, the day after Robert Kennedy's announcement. O'Brien, Postmaster General, makes a
        speech, introduced by Edward Kennedy. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 222. Names: O''Brien, Edward Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
      - state:ma
      - city:everett
- add:
    entry:
      id: cal.1968-03-18.elections-1968-johnson
      when: Mar. 18
      date: '1968-03-18'
      thread: elections-1968-johnson
      c: 'Washington, Monday morning. Rowe reads O''Brien, back late Sunday night, a telegram to be sent over their joint
        signatures to several hundred Democratic leaders: pledge support to Johnson; O''Brien to direct his re-election campaign.
        O''Brien: it will boomerang and cannot go over his signature; Johnson should ask him himself. He sends Johnson a memorandum
        against it. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 222–23. Names: Rowe, O''Brien, Johnson.'
      tags:
      - name:rowe-james-h-jr
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- variant:
    id: cal.1968-03-19.elections-1968-3
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Rowe reads him the telegram on Monday morning, Mar. 18, after O''Brien''s return to Washington late
      Sunday night from four days on the road; the memorandum to the President follows that day'
    at: '223'
- cite:
    id: cal.1968-03-19.elections-1968-3
    item: '[[w.obrien-no-final-victories]], 222–23 (the proposed telegram, the loyalty-oath point, "an extension of the ''overkill''
      tactics used in New Hampshire," "let the ''dividers'' slug it out among themselves"; the memorandum sent after Rowe''s
      call; O''Brien in Washington, not Massachusetts; not McPherson)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-18.robert-kennedy-campaign-decision
      when: Mar. 18
      date: '1968-03-18'
      thread: robert-kennedy-campaign-decision
      c: O'Brien's home, Washington, that evening. Edward Kennedy comes to dinner and talks over the political situation;
        he implies that it would be nice if O'Brien headed Robert Kennedy's campaign, and they do not pursue it. By O'Brien's
        account.
      n: '[[w.obrien-no-final-victories]], 223. Names: Edward Kennedy, O''Brien, Robert Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
      - city:washington
- add:
    entry:
      id: cal.1968-03-19.robert-kennedy-campaign-decision
      when: Mar. 19
      date: '1968-03-19'
      thread: robert-kennedy-campaign-decision
      c: Robert Kennedy calls O'Brien and refers again to Edward Kennedy's suggestion of the night before. Neither brother
        pushes him hard, as O'Brien sees it. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 223. Names: Robert Kennedy, O''Brien, Edward Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1968-03-20.robert-kennedy-campaign-decision
      when: Mar. 20
      date: '1968-03-20'
      thread: robert-kennedy-campaign-decision
      c: 'Morning, before O''Brien''s speech to the National Press Club. Robert Kennedy calls to ask what he will say; O''Brien
        reads him the part saying he supports Johnson. Kennedy: "Larry, I hope I''m not putting you on the spot, announcing
        my candidacy just before you make a speech to the Press Club. I didn''t plan it that way." O''Brien: "You''re not
        putting me on the spot, Bob." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 224. Names: Robert Kennedy, O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-21.elections-1968-johnson
      when: Mar. 21
      date: '1968-03-21'
      thread: elections-1968-johnson
      c: 'Johnson telephones O''Brien, very warm, the day after his Press Club speech; he wants to meet soon about O''Brien''s
        heading his campaign. Then: "You are in a position to destroy me." O''Brien tells him he disagrees. By O''Brien''s
        account.'
      n: '[[w.obrien-no-final-victories]], 224. Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-21.vietnam-support
      when: Mar. 21
      date: '1968-03-21'
      thread: vietnam-support
      c: 'O''Brien to Johnson, a memorandum on Vietnam, after the invitation of views at the last Cabinet meeting: Americans
        are frustrated that South Vietnam is not carrying the burden; the need is to phase out American responsibility and
        phase in South Vietnamese, with the South Vietnamese government increasing its troops as the United States decreases
        its own; not withdrawal; meaningful negotiations unrealistic now; escalation would be matched. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 224–25. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-25.elections-1968-humphrey
      when: Mar. 25
      date: '1968-03-25'
      thread: elections-1968-humphrey
      c: O'Brien's office, a late lunch. Vice President Humphrey tells O'Brien of his doubts about the war and that he is
        arranging for prominent citizens who question it to meet privately with Johnson. O'Brien tells him of his own doubts
        and his memoranda. Each had not known the other's views; the problem is Johnson's equating criticism with disloyalty.
        By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 225. Names: Humphrey, O''Brien, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- variant:
    id: cal.1968-03-24.elections-1968-2
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Monday, Mar. 25, "an informal meeting of the Cabinet was held in my office" at Johnson''s request, the
      Secretaries of State, Defense and the Treasury not invited; Freeman, Wirtz, Cohen, Udall, Clark and Weaver there'
    at: '225'
- cite:
    id: cal.1968-03-24.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 225–26 (the meeting of the Cabinet in O''Brien''s office, the Secretaries of State,
      Defense and the Treasury not invited, to discuss helping Johnson in Wisconsin; Freeman for going back, the others despondent;
      Udall stays behind to discuss a joint action by five or six Cabinet officers; the day is Monday on the page; not the
      "fight to save the administration" words)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-26.robert-kennedy-campaign-decision
      when: Mar. 26
      date: '1968-03-26'
      thread: robert-kennedy-campaign-decision
      c: 'Edward Kennedy telephones O''Brien: "there''s a rumor all over town that you''re resigning as Postmaster General
        to join us." O''Brien: he is going to Wisconsin the next day to campaign for the President. Kennedy: an office is
        set aside in their headquarters with "Larry O''Brien" on the door. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 226. Names: Edward Kennedy, O''Brien.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-03-27.vietnam-support
      when: Mar. 27
      date: '1968-03-27'
      thread: vietnam-support
      c: 'O''Brien to Johnson, a second memorandum on Vietnam: loyal Administration Democrats fear the Chicago convention
        and November. He proposes insisting on South Vietnamese responsibility; a general amnesty for political prisoners;
        Thieu''s offer to negotiate and a cease-fire on a date certain with a bombing pause the same day; a delegation of
        prominent Americans to Geneva. Before leaving for Wisconsin. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 226–28. Names: O''Brien, Johnson, Thieu.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:nguyen-van-thieu
- variant:
    id: cal.1968-03-26.elections-1968-2
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: flies to Wisconsin on Wednesday, Mar. 27, for one day, ending with a rally in Milwaukee; home to Springfield
      that night; to New York on Friday'
    at: '228'
- cite:
    id: cal.1968-03-26.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 228–30 (Milwaukee rally, Johnson headquarters dark and McCarthy''s busy; Rusk''s
      two calls; Johnson''s call to the Plaza on Friday: O''Brien predicts a defeat: "Sixty-forty," then "Maybe two to one";
      Johnson: "You were there only one day"; Rusk to brief him, Katzenbach to fill in; not the professionals'' telephone
      reports)'
    units: '?'
- variant:
    id: cal.1968-03-30.elections-1968-3
    unit: A
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the dinner at Toots Shor''s with his son, Breslin and Unruh is on Friday evening, Mar. 29, the night
      he reaches the Plaza; Unruh''s remark about his son''s absence from the Army comes as the evening wears on'
    at: '230'
- variant:
    id: cal.1968-03-30.elections-1968-3
    unit: E
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: the next evening Unruh apologizes in person and joins him and his son for a nightcap at the Plaza Hotel'
    at: '231'
- cite:
    id: cal.1968-03-30.elections-1968-3
    item: '[[w.obrien-no-final-victories]], 230–31 (Toots Shor''s with Larry, Jr., Breslin and Unruh; Unruh: "By Christ, we''re
      going to knock Lyndon Johnson out of the box"; "Why the hell aren''t you in the Army?"; the rough reply, nose to nose;
      the apology the next evening; the page does not have the entry''s words for the question or the answer)'
    units: '?'
- add:
    entry:
      id: cal.1968-03-31.elections-1968-johnson-16
      when: Mar. 31
      date: '1968-03-31'
      thread: elections-1968-johnson
      c: 'Washington, Sunday evening before Johnson''s address. Larry Temple of the White House staff telephones O''Brien:
        "The President wants you to know that at the end of his speech tonight he will announce that he will not be a candidate
        for re-election." O''Brien: "Gotcha!" and hangs up. He then doubts it as the speech runs half an hour without a mention.
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 231. Names: Temple, O''Brien, Johnson.'
      tags:
      - name:temple-larry
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1968-03-31.elections-1968-11
    item: '[[w.obrien-no-final-victories]], 232 (Robert Kennedy calls "a little before midnight": "I hope I got to you first";
      "I hope you''ll join me"; "It''s a new ball game now"; Humphrey''s call is on the page of the next days, not the next
      morning)'
    units: '?'
- variant:
    id: cal.1968-03-31.elections-1968-11
    unit: C
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: Humphrey, who had been in Mexico, telephones on Tuesday, Apr. 2, "later that day," after the leaders''
      breakfast, probing O''Brien''s intentions'
    at: '234'
- add:
    entry:
      id: cal.1968-04-01.elections-1968-johnson-4
      when: Apr. 1
      date: '1968-04-01'
      thread: elections-1968-johnson
      c: 'O''Brien to Johnson, a letter written at his Post Office desk: he is proud of his President and of his association
        with him; respect and admiration for the position he so courageously took last night; no American can question his
        sincerity. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 233. Names: O''Brien, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1968-04-02.congress
    item: '[[w.obrien-no-final-victories]], 233–34 (the regular Tuesday legislative breakfast: O''Brien asks why; Johnson:
      "I''m doing everything I humanly can do to bring peace ... now I''ve done the one thing that proves it''s not politics
      ... I''ve gone the distance")'
    units: '?'
- add:
    entry:
      id: cal.1968-04-04.robert-kennedy-campaign-decision
      when: Apr. 4
      date: '1968-04-04'
      thread: robert-kennedy-campaign-decision
      c: Lunch, Thursday. Edward Kennedy and O'Brien discuss frankly that some in the Kennedy camp, old associates and newer
        people, were not enamored of O'Brien for having stayed with Johnson after Dallas. Kennedy says O'Brien would be in
        charge and the others would have to live with it, and suggests a news conference to make the point. Robert Kennedy
        calls later to confirm and stress that time is short. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 234. Check: the day (the work says "Thursday" after the Tuesday breakfast). Names:
        Edward Kennedy, O''Brien, Robert Kennedy.'
      tags:
      - name:kennedy-edward-m
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-04-05.elections-1968-humphrey
      when: Apr. 5
      date: '1968-04-05'
      thread: elections-1968-humphrey
      c: 'Humphrey calls O''Brien: "I have three words for you: I need you." O''Brien says he will decide very soon; Humphrey
        asks to come to his office the next day, and O''Brien insists on going to him. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 234. Check: the day (the work says "Friday"). Names: Humphrey, O''Brien.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-04-06.elections-1968
    item: '[[w.obrien-no-final-victories]], 234–36 (O''Brien goes to Humphrey''s office, more than an hour: Humphrey: "if
      you agree to manage my campaign it will make the difference"; O''Brien must go with Robert Kennedy; Humphrey proposes
      that he, Kennedy and O''Brien meet midway in the struggle to avoid a bitter convention battle; O''Brien then telephones
      Kennedy, who agrees; the entry''s words for Kennedy are Bernstein''s)'
    units: '?'
- cite:
    id: cal.1968-04-10.transition-and-staff
    item: '[[w.obrien-no-final-victories]], 236 (Wednesday afternoon: Johnson reads O''Brien''s letter of resignation and
      asks "Are you going with Bob Kennedy?"; asks his advice on a successor, discusses Krim, then calls in Watson and names
      him Postmaster General; Johnson tells the press that day; not Abrams, Goodpaster or McCain)'
    units: '?'
- add:
    entry:
      id: cal.1968-04-11.transition-and-staff-2
      when: Apr. 11
      date: '1968-04-11'
      thread: transition-and-staff
      c: The Post Office Department auditorium. A farewell ceremony for O'Brien, with members of Congress and the Executive
        Branch; his farewell address; the Marine Band plays "Auld Lang Syne" and the audience sings. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 237. Check: the day (the work says "a day or two later" and the next day was Good
        Friday, Apr. 12). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1968-04-12.robert-kennedy-campaign-primaries
      when: Apr. 12
      date: '1968-04-12'
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana, Good Friday. O''Brien at work with Ira Kapenstein, who has left the Post Office to come with him: organizing
        volunteers into the Kennedy program and get-out-the-vote drives. Edward Kennedy and Steve Smith had set up the campaign
        organization already. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 237–38. Names: O''Brien, Edward Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:kennedy-edward-m
      - state:in
- add:
    entry:
      id: cal.1968-04.robert-kennedy-campaign-primaries-6
      when: Apr., late
      date: 1968-04
      thread: robert-kennedy-campaign-primaries
      c: 'Indiana, Gary and East Chicago. The workers and families who line the streets for Kennedy are enthusiastic. Two
        decisions: he should go after the votes of workers and the ethnic groups, and present himself as a national candidate
        on pocketbook issues and crime, not a one-issue or far-left candidate; in some speeches he stresses his record as
        Attorney General. Some purists in the camp call it a sell-out. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 238. Check: the day (the work gives none). Names: O''Brien.'
      tags:
      - name:kennedy-robert-f
      - name:obrien-lawrence-f
      - state:in
      - city:gary
      - city:east-chicago
- cite:
    id: cal.1968-05-07.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 238–39 (Kennedy 42 per cent, Branigin 31, McCarthy 27; Branigin a favorite son
      and in fact a stand-in for Humphrey)'
    units: '?'
- cite:
    id: cal.1968-05-07.robert-kennedy-campaign-primaries
    item: '[[w.obrien-no-final-victories]], 239 (election night, O''Brien and Kapenstein with their precinct sheets, Kapenstein
      telephoning Pierre Salinger; Breslin''s column; "I go to Omaha tomorrow"; the page quotes the column, not the hour)'
    units: '?'
- add:
    entry:
      id: cal.1968-04.elections-1968-humphrey
      when: Apr.–May
      date: 1968-04
      thread: elections-1968-humphrey
      c: 'Omaha, the hotel lobby and Humphrey''s suite, during the Indiana campaign. Humphrey, in Omaha to address a dinner
        for the Johnson–Humphrey slate, and O''Brien, on a quick trip to check Nebraska, have a drink. Humphrey: much of his
        delegate support is anti-Kennedy; "I''ll never make the mistake of underestimating a Kennedy campaign." O''Brien reminds
        him of the midpoint meeting with Robert Kennedy; Humphrey: still his intention. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 239–40. Check: the day (the work places the trip "during the Indiana campaign"
        and the Nebraska primary of May 14). Names: O''Brien, Humphrey, Robert Kennedy.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - state:ne
      - city:omaha
- cite:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    item: '[[w.obrien-no-final-victories]], 241–42 (the weekend before the Oregon vote: O''Brien, Salinger, Edelman, Walinsky
      and Oregon people discuss McCarthy''s standing challenge to debate; O''Brien tends to favor it with reservations, some
      of the younger men opposed; Kennedy sends for O''Brien in his suite; Drew Pearson''s column on the King wiretap; decided
      no by default; the laughing aides)'
    units: '?'
- variant:
    id: cal.1968-05-25.robert-kennedy-campaign-2
    unit: B
    witness: w.obrien-no-final-victories
    reads: 'O''Brien: "I tended to favor the idea, although with reservations. Some of the younger men ... were opposed";
      Salinger takes the group''s conclusions to Kennedy, who then sends word for O''Brien to come'
    at: '241'
- cite:
    id: cal.1968-05-28.robert-kennedy-campaign-primaries-3
    item: '[[w.obrien-no-final-victories]], 242 (election night in Oregon: Kennedy goes first to Edith Green, saying the loss
      was his, not theirs; the telegram of congratulations to McCarthy argued for a half hour; Kennedy: "For Christ''s sake,
      we''ve lost the primary but we ought at least to be able to resolve this"; the entry''s words for the concession are
      not on the page)'
    units: '?'
- add:
    entry:
      id: cal.1968-06-07.robert-kennedy-campaign
      when: June 7
      date: '1968-06-07'
      thread: robert-kennedy-campaign
      c: 'New York, the Waldorf-Astoria, the day before Robert Kennedy''s funeral. A Secret Service man hands O''Brien, back
        from St. Patrick''s Cathedral, a note: the Vice President would like him in his suite. O''Brien, Elva, Phyllis Maddock
        and Kapenstein go. Humphrey, depressed and shaken: "Men struggle for worthy goals," he says, "and yet they have no
        control over their own destinies. It all seems futile and pointless." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 245. Names: O''Brien, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1968-06-08.robert-kennedy-campaign-3
      when: June 8
      date: '1968-06-08'
      thread: robert-kennedy-campaign
      c: 'The funeral train, New York to Washington. Many politicians aboard, and no political talk except Unruh''s remark
        to O''Brien: "Larry, we''ve got to get moving and get behind a candidate." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 245–46. Names: Unruh, O''Brien.'
      tags:
      - name:unruh-jesse-m
      - name:obrien-lawrence-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-06.elections-1968-humphrey
      when: June, mid-month
      date: 1968-06
      thread: elections-1968-humphrey
      c: O'Brien's home, Washington, about a week after Robert Kennedy's funeral. Humphrey keeps the talk from politics and
        invites O'Brien and his wife to his lake home at Waverly, Minn. As he leaves O'Brien tells him he wants no question
        about his feelings for Humphrey's candidacy as against McCarthy's or about his hope to see Humphrey the nominee. By
        O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 247. Check: the day (the work says "about a week after Bob''s funeral"). Names:
        Humphrey, O''Brien, McCarthy.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:mccarthy-eugene-j
      - city:washington
- add:
    entry:
      id: cal.1968-06-22.elections-1968-humphrey
      when: June 22–23
      date: '1968-06-22'
      thread: elections-1968-humphrey
      c: 'Waverly, Minn., the weekend after. Sunday evening in Humphrey''s kitchen: he reviews his staff''s weaknesses, says
        Mondale and Harris, the co-chairmen, are limited by their Senate duties, and says he wants O''Brien active. O''Brien
        will think about it. Mondale and Harris later come to his home to urge him to take charge. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 247–48. Check: the day (the work says "the following weekend"; the call at O''Brien''s
        home is undated). Names: Humphrey, O''Brien, Mondale, Harris.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:mondale-walter-f
      - name:harris-fred-r
      - state:mn
- add:
    entry:
      id: cal.1968-07.elections-1968-humphrey
      when: July
      date: 1968-07
      thread: elections-1968-humphrey
      c: 'Humphrey''s Capitol office, lunch with O''Brien on Vietnam. Humphrey reads him a statement he says he will soon
        make public, for a bombing halt and a negotiated end to the war; satisfied, O''Brien agrees to join his campaign through
        the Convention. Humphrey is to meet Johnson that evening: "I don''t think he''s going to hug me with joy." The statement
        does not appear. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 248–49. Check: the day (the work gives none). Names: Humphrey, O''Brien, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-08-19.elections-1968-chicago-7
      when: Aug. 19
      date: '1968-08-19'
      thread: elections-1968-chicago
      c: 'Chicago, not long after O''Brien arrives. Fred Harris and O''Brien call on Governor Connally of Texas, in a hostile
        mood over the challenge to his Texas delegation and the peace plank: "If Humphrey thinks he''s got the nomination
        locked up, he''d better count the delegates again, because all hell will break loose if we''re kicked around. He''d
        better remember we in the South can deny him the nomination if we withdraw our support." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 250–51. Names: Harris, O''Brien, Connally, Humphrey.'
      tags:
      - name:harris-fred-r
      - name:obrien-lawrence-f
      - name:connally-john
      - name:humphrey-hubert-h
      - state:tx
      - city:chicago
- add:
    entry:
      id: cal.1968-08-20.elections-1968-chicago-6
      when: Aug. 20
      date: '1968-08-20'
      thread: elections-1968-chicago
      c: Chicago. Harris and O'Brien meet Connally again; he hints that if Humphrey is not careful Johnson's name will be
        entered in nomination. O'Brien takes it for a bluff, there having been no show of pro-Johnson feeling at the Convention.
        By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 251. Names: Harris, O''Brien, Connally, Johnson.'
      tags:
      - name:harris-fred-r
      - name:obrien-lawrence-f
      - name:connally-john
      - name:johnson-lyndon-b
      - state:tx
      - city:chicago
- add:
    entry:
      id: cal.1968-08-23.elections-1968-chicago-platform
      when: Aug. 23–24
      date: '1968-08-23'
      thread: elections-1968-chicago-platform
      c: 'Chicago. Charles Murphy, the President''s spokesman, pronounces the compromise Vietnam plank of Ginsburg, Sorensen
        and others unacceptable. O''Brien and Ginsburg urge Humphrey to call Johnson; the call is not returned. Humphrey:
        "These are just words," and "I don''t see that we''ve upset any applecarts." O''Brien: "This could blow the whole
        campaign." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 251–52. Check: the days (the work gives Friday, Aug. 23, for the drafted language
        and Boggs''s trip to Washington, and Murphy''s arrival after it). Names: Murphy, Ginsburg, Sorensen, O''Brien, Humphrey,
        Johnson.'
      tags:
      - name:murphy-charles-s
      - name:ginsburg-david
      - name:obrien-lawrence-f
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - state:il
      - city:chicago
- check:
    id: cal.1968-08-24.elections-1968-chicago-5
    text: 'Check: [[w.obrien-no-final-victories]], 251–52, has Murphy, on his arrival, pronounce the Ginsburg–Sorensen draft
      unacceptable to the President, and Johnson refuse Humphrey''s call, not agree the language with Ginsburg.'
- cite:
    id: cal.1968-08-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 252 (Humphrey accepts the Johnson Vietnam plank and the Convention endorses it,
      in O''Brien''s words "by a two-to-one margin"; not the plank''s words, the roll call or the day)'
    units: '?'
- check:
    id: cal.1968-08-28.elections-1968
    text: 'Check: the vote: [[w.obrien-no-final-victories]], 252, has the Convention endorse the Johnson plank "by a two-to-one
      margin"; 1,567¾ to 1,041¼ is about three to two.'
- add:
    entry:
      id: cal.1968-08-29.elections-1968-chicago-14
      when: Aug. 29
      date: '1968-08-29'
      thread: elections-1968-chicago
      c: 'Chicago, Humphrey''s suite. Humphrey, Rowe, Connell and O''Brien in one bedroom, Muskie in another, Harris in the
        living room. Humphrey: "if you had fifteen seconds to decide, who would it be?" O''Brien: "Ed Muskie"; Rowe and Connell
        agree. Humphrey tells each himself. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 253. Check: the day (the work gives none). Names: Humphrey, Rowe, O''Brien, Muskie,
        Harris.'
      tags:
      - name:humphrey-hubert-h
      - name:rowe-james-h-jr
      - name:obrien-lawrence-f
      - name:muskie-edmund-s
      - name:harris-fred-r
      - state:il
      - city:chicago
- cite:
    id: cal.1968-08-29.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 253–56 (Napolitan''s outline of organization, personnel, issues and media strategy,
      with no part for O''Brien; Humphrey asks him to stay through November, O''Brien refuses; late that evening a Secret
      Service agent calls him to the Vice President''s suite; "Dump the Hump" from the street; "Don''t leave me naked"; Napolitan''s
      note "Elva and I say do it. Joe"; O''Brien then explains his clients, the networks and Hughes, and Humphrey calls Maheu,
      Stanton and Bessie the next morning; not the day, or the plan cut from Freeman''s book)'
    units: '?'
- add:
    entry:
      id: cal.1968-08-31.elections-1968-humphrey
      when: Aug. 31–Sept. 2
      date: '1968-08-31'
      thread: elections-1968-humphrey
      c: 'Waverly, Minn., Labor Day weekend, in the guest cottage. Humphrey, his staff, O''Brien, Napolitan and Kapenstein
        try to put together a campaign two months before the election: no travel plans for the candidate, no media program,
        no one in key posts, little money. They spend the weekend telephoning to recruit staff. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 256–57. Check: the days (the work says "the Labor Day weekend"). Names: Humphrey,
        O''Brien, Napolitan.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:napolitan-joseph
      - state:mn
- cite:
    id: cal.1968-09-26.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 259 (September 27: O''Brien sees an advance copy of a Gallup poll, Nixon 43, Humphrey
      28, Wallace 21; $100,000 gathered for half an hour of national television; Monday, Sept. 30, from Salt Lake City, the
      day chosen)'
    units: '?'
- check:
    id: cal.1968-09-26.elections-1968-2
    text: 'Check: the day: [[w.obrien-no-final-victories]], 259, has O''Brien see the advance copy of the Gallup poll on Sept.
      27.'
- cite:
    id: cal.1968-09-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 259 (Saturday morning in Washington, two days before the speech: O''Brien shown
      what he is told is the final draft of the Vietnam speech; telecopier message to Humphrey: a waste of $100,000; Humphrey
      that afternoon: "that wasn''t any final draft you saw. The speech isn''t even written yet. Why don''t you fly out here";
      not the Watergate or "an abomination")'
    units: '?'
- cite:
    id: cal.1968-09-29.elections-1968-4
    item: '[[w.obrien-no-final-victories]], 260 (Sunday morning to Seattle, Humphrey''s hotel suite; Humphrey had read the
      draft and reacted much as O''Brien had; on to Salt Lake City that afternoon; the night''s discussion of the draft in
      Humphrey''s suite, a dozen present: Harris and O''Brien for a softer line, Rowe and Connell for the Johnson policy;
      Rowe: "You can''t expect to be elected President if you turn on the President you served under"; Humphrey: "Damn it,
      I''m on my own two feet ... This is my speech and I''ll write it myself"; he takes a pen; not Ball, Van Dyk or the 2
      p.m. list)'
    units: '?'
- check:
    id: cal.1968-09-29.elections-1968-4
    text: 'Check: the hour: [[w.obrien-no-final-victories]], 260, has the drafting go on "until three or four in the morning,
      when I finally decided to leave."'
- cite:
    id: cal.1968-09-30.elections-1968-humphrey-7
    item: '[[w.obrien-no-final-victories]], 261 (after the speech Humphrey receives a telegram of congratulations from Ted
      Kennedy and shows it to O''Brien and the staff, beaming; the key passage on stopping the bombing; the page has a telegram,
      the entry a telephone call)'
    units: '?'
- check:
    id: cal.1968-09-30.elections-1968-humphrey-7
    text: 'Check: the means: [[w.obrien-no-final-victories]], 261, has Edward Kennedy send Humphrey a telegram of congratulations,
      not telephone.'
- cite:
    id: cal.1968-10-08.press-and-broadcasting
    item: '[[w.obrien-no-final-victories]], 263 (the campaign urges its allies on the Hill to pass a bill waiving the equal-time
      law so a Nixon–Humphrey debate could take place; the House passes it after McCormack locks the members in the chamber;
      Mansfield and Pastore decline in the Senate; not the resolution''s number or the dates)'
    units: '?'
- cite:
    id: cal.1968-11-03.elections-1968
    item: '[[w.obrien-no-final-victories]], 264 (the Astrodome in Houston, "a tremendous reception" for Humphrey that final
      weekend; not Johnson or the broadcast)'
    units: '?'
- cite:
    id: cal.1968-11-04.elections-1968-2
    item: '[[w.obrien-no-final-victories]], 264 (Monday: Humphrey drives through the streets of Los Angeles "like a conquering
      hero," among the kind of crowds that had greeted Robert Kennedy that spring; by Election Day, flying from California
      to Minnesota, the campaign knew it was in a contest; not the noon, Muskie or the telethon)'
    units: '?'
- add:
    entry:
      id: cal.1968-11-05.elections-1968-humphrey-4
      when: Nov. 5
      date: '1968-11-05'
      thread: elections-1968-humphrey
      c: Election night, a Minneapolis hotel suite. Early returns show New Jersey lost; O'Brien telephones Governor Hughes
        hoping it is wrong, and Hughes confirms it. Humphrey loses Ohio, California, Illinois and New Jersey narrowly, carrying
        thirteen States and the District, 191 electoral votes, Texas among them. O'Brien stays until the concession early
        Wednesday. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 264–65. Names: O''Brien, Hughes, Humphrey.'
      tags:
      - name:obrien-lawrence-f
      - name:hughes-richard-j
      - name:humphrey-hubert-h
      - state:nj
      - state:mn
      - city:minneapolis
- add:
    entry:
      id: cal.1965-05.vietnam-congress
      when: May
      date: 1965-05
      thread: vietnam-congress
      c: At the President's request O'Brien's office telephones congressional offices to learn how the mail runs on Vietnam
        and on the intervention in the Dominican Republic. The mail is not heavy and tends to support the President, except
        in a few Eastern States. By O'Brien's account.
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work gives "in May 1965"). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1966-02.vietnam-support
      when: Feb.
      date: 1966-02
      thread: vietnam-support
      c: 'New Jersey, a fund-raising dinner. O''Brien to Johnson, by memorandum: Governor Richard Hughes "made an excellent
        plea to support you on the Vietnam policy and this was received with obvious strong approval by the audience." By
        O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 191. Check: the day (the work gives "In February"). Names: O''Brien, Hughes, Johnson.'
      tags:
      - name:obrien-lawrence-f
      - name:hughes-richard-j
      - name:johnson-lyndon-b
      - state:nj
- add:
    entry:
      id: cal.1966-06.vietnam-congress
      when: June
      date: 1966-06
      thread: vietnam-congress
      c: 'Johnson reads a Scripps-Howard article in which a number of Democratic congressmen criticize the war and has O''Brien''s
        staff talk to all of them that day. O''Brien to Johnson, by memorandum: most are confused and concerned, want to support
        the President, but face elections and constituents troubled by draft calls and casualties; they are allies, and "it
        is awfully important that we return every one of them we possibly can next January." By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 192–93. Check: the day (the work gives "June 1966"). Names: Johnson, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1967-08.vietnam-congress-3
      when: Aug.
      date: 1967-08
      thread: vietnam-congress
      c: 'O''Brien to Johnson, by memorandum, on Senator Pastore: "Our problem is Vietnam—boxes coming back, casualties going
        up. ... We are losing good Democrats in droves." Pastore, a staunch supporter, adds that the attitude now is that
        any Republican can do a better job. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 214. Check: the day (the work gives "in August"). Names: O''Brien, Johnson, Pastore.'
      tags:
      - name:obrien-lawrence-f
      - name:johnson-lyndon-b
      - name:pastore-john-o
- cite:
    id: cal.1964-07-29.robert-kennedy
    item: '[[w.obrien-no-final-victories]], 174–75 (Johnson calls Robert Kennedy to his office to settle the vice presidency;
      Kennedy first stops at O''Brien''s office and the two speculate that Johnson will pass him over; Johnson announces he
      will choose no member of his Cabinet as running mate; not the hour, the Clifford memorandum or the words)'
    units: '?'
- cite:
    id: cal.1964-07-29.robert-kennedy-5
    item: '[[w.obrien-no-final-victories]], 175 (Kennedy, O''Donnell and O''Brien lunch after the meeting and Kennedy recounts
      it in detail; Johnson then asks O''Brien in and gives a version differing at points from Kennedy''s, Jenkins reading
      from a memorandum Johnson had dictated just after Kennedy left; the page does not give the offer to manage the campaign,
      or the words about forming their own country)'
    units: '?'
- cite:
    id: cal.1964-09-02.medicare
    item: '[[w.obrien-no-final-victories]], 186 (Medicare attached as a rider to the Social Security amendments to bypass
      Byrd''s Finance Committee; passed 49 to 44, Goldwater among those against; the first time a health insurance bill had
      passed either house; then a month of conference, where it dies "largely because of Wilbur Mills"; the page puts the
      Senate vote in August; not the Gore amendment or the day)'
    units: '?'
- check:
    id: cal.1964-09-02.medicare
    text: 'Check: the month: [[w.obrien-no-final-victories]], 186, has Medicare attached to the Social Security amendments
      and passed, 49 to 44, "In August."'
- cite:
    id: cal.1968-03-12.elections-1968
    item: '[[w.obrien-no-final-victories]], 221 (McCarthy wins more than 40 per cent, losing to Johnson by only a narrow margin;
      O''Brien "in no way involved" in the primary, Johnson having kept him out; Boutin had directed the Johnson effort; not
      the Republican side or the totals)'
    units: '?'
- cite:
    id: cal.1968-05-14.elections-1968
    item: '[[w.obrien-no-final-victories]], 240 (Nebraska: Kennedy 51 per cent, McCarthy 31, the Johnson–Humphrey slate 14;
      not the Republican side or West Virginia)'
    units: '?'
- cite:
    id: cal.1968-05-28.elections-1968
    item: '[[w.obrien-no-final-victories]], 242 (Oregon: the defeat, "the first election defeat a Kennedy had ever experienced";
      Kennedy campaigning in California on the day of the voting and returning that evening; McCarthy''s organization the
      best of any of the primaries; not the Florida or Republican sides or the figures)'
    units: '?'
- cite:
    id: cal.1968-06-01.elections-1968
    item: '[[w.obrien-no-final-victories]], 243 (Kennedy accepts McCarthy''s challenge to debate, a decision O''Brien counts
      important after the Oregon loss; Kennedy works hard preparing and "we were all pleased with the outcome"; not the day
      or the hour)'
    units: '?'
- cite:
    id: cal.1968-06-05.robert-kennedy-2
    item: '[[w.obrien-no-final-victories]], 243–44 (O''Brien in a bungalow next to the Ambassador Hotel with Kapenstein, watching
      the last of Kennedy''s victory statement on television; room service answers: "Senator Kennedy''s been shot"; he spends
      the night watching reports; early in the morning calls Steve Smith at the hospital, who says there is little or no chance;
      not the hospital or the time)'
    units: '?'
- add:
    entry:
      id: cal.1969-01.transition-and-staff-4
      when: Jan., one afternoon
      date: 1969-01
      thread: transition-and-staff
      c: 'The White House, 5 p.m., almost two hours: O''Brien''s farewell call on Johnson. Johnson asks who will succeed O''Brien
        as chairman of the Democratic National Committee; Fred Harris, O''Brien understands; Johnson noncommittal. Of his
        sons-in-law in Vietnam: "I''m not a President where those two boys are concerned," he says. "I''m just a worried father."
        By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 266. Check: the day (the work says "one January afternoon" as the Nixon inauguration
        neared). Names: Johnson, O''Brien, Harris.'
      tags:
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
      - name:harris-fred-r
- add:
    entry:
      id: cal.1969-01-19.elections-1968-humphrey
      when: Jan. 19
      date: '1969-01-19'
      thread: elections-1968-humphrey
      c: 'Washington, the evening before the Nixon Inauguration. Humphrey calls in the afternoon; he and Muriel come that
        evening. They go over the campaign, how close it was, the ifs: more money, a bombing halt sooner. Humphrey thanks
        O''Brien for his efforts. He goes back to Minnesota to teach and write, O''Brien to New York. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 266–67. Check: the day (the work says "the afternoon before the Inauguration").
        Names: Humphrey, O''Brien.'
      tags:
      - name:humphrey-hubert-h
      - name:obrien-lawrence-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1966-01.program
      when: Jan.–Mar., early
      date: 1966-01
      thread: program
      c: 'O''Brien asks four of his assistants, Kapenstein, Ronald Lee, Tim May and Larry Lewin, for a confidential study
        of the whole postal service: is a postal corporation, out of the Cabinet, a viable answer, and if not, what lesser
        steps? After several months they recommend that the Post Office be taken out of the Cabinet and made a nonprofit government
        corporation. By O''Brien''s account.'
      n: '[[w.obrien-no-final-victories]], 208. Check: the day (the work says "early in 1966"). Names: O''Brien.'
      tags:
      - name:obrien-lawrence-f
- cite:
    id: cal.1968-07-16.program
    item: '[[w.obrien-no-final-victories]], 210 (the Kappel Commission reports to the President and endorses the proposal
      fully, with detailed ideas on the changeover; Johnson takes no action and does not publish the report for several months;
      the page puts the report in June 1968)'
    units: '?'
- check:
    id: cal.1968-07-16.program
    text: 'Check: the month: [[w.obrien-no-final-victories]], 210, has the Kappel Commission report to the President "in June
      of 1968."'
- cite:
    id: cal.1969-01-14.program
    item: '[[w.obrien-no-final-victories]], 210 (Johnson endorses the postal corporation plan in his final State of the Union
      message in January 1969; not the day)'
    units: '?'
- cite:
    id: cal.1962-10-13.congress
    item: '[[w.obrien-no-final-victories]], 135 (Congress adjourns on Oct. 13; O''Brien''s list of 1962 passage: the trade
      bill, the first omnibus tax reform since 1954, the UN bond issue, the International Wheat Agreement, the Communications
      Satellite Act, manpower training, accelerated public works, among others; forty of fifty-four major proposals; not the
      investment credit or welfare)'
    units: '?'
