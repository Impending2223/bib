patch: 2026-11-25-via-bare
by: Claude (the orchestrating session), from the rule check of ruling 53 (notes/via-read/rule-2026-11-25.tsv, the two parts left without a source). FRUS 1964-68, IV, doc. 156, read in sources/frus-text/1966-06.json.xz, holds "speak in terms of disassociation" and the paragraph on the timing of a visit. Audited on Opus, Nov. 25, 2026 (notes/via-read/audit-bare.md), against doc. 156 whole with its notes, in the repository's text and on history.state.gov, and against Hansard for Feb. 8, 1966. The audit split the one cite into two, corrected the visit's words to the document's, added the document's substance to the line, and added four entries the document's text and notes date.
ops:
  - edit:
      id: cal.1966-06-14.vietnam-air-war
      base: 3349c51d
      kind: correct
      set:
        c: 'Johnson to Wilson, after Rusk''s private talk with him: "I see no way of avoiding such action," the corridor through Laos, the buildup, Cambodia, no interest in peace in Hanoi;{1} "not ... an air assault on civilian centers."{2} Not to "speak in terms of disassociation." A visit in mid- or late July.{3}'
        n: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156). [[w.gibbons-u-s-government-and]], IV, 370; [[w.gibbons-u-s-government-and]], IV, 370 (Rusk''s private talk with Wilson; the strikes not against population centers). The message itself gives the visit "in mid- or late July," not late July alone (doc. 156). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-06-03.vietnam-air-war]]. Names: Johnson, Wilson, Rusk.'
  - cite:
      id: cal.1966-06-14.vietnam-air-war
      item: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156)'
      on: 'Not to "speak in terms of disassociation."'
  - cite:
      id: cal.1966-06-14.vietnam-air-war
      item: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156)'
      on: 'A visit in mid- or late July.'
  - add-words:
      id: cal.1966-06-14.vietnam-air-war
      after: '"not ... an air assault on civilian centers."'
      words: 'The target the oil installations of Hanoi and Haiphong; orders not yet issued.'
      text: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156)'
  - add-words:
      id: cal.1966-06-14.vietnam-air-war
      after: 'Not to "speak in terms of disassociation."'
      words: 'Else seven points to include, among them: Wilson told beforehand; oil storage the target, not civilian centers; Britain, with no troops in the fighting, not to judge the military action; Hanoi and Peking unresponsive.'
      text: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156)'
  - add-words:
      id: cal.1966-06-14.vietnam-air-war
      after: 'A visit in mid- or late July.'
      words: '"A good deal of blue sky" between the visit and any action in Vietnam; nothing before mid-July, the dates left open.'
      text: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156)'
  - add-words:
      id: cal.1966-06-14.vietnam-air-war
      after: end
      words: 'Drafted by Rusk, reviewed by Johnson, redrafted by Rusk and Rostow; an information copy to McNamara.'
      text: '[FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156) n.1'
  - names:
      id: cal.1966-06-14.vietnam-air-war
      add: [Rostow, McNamara]
      tags: [name:rostow-walt-w, name:mcnamara-robert-s]
