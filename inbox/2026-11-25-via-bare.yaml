        c: 'Wilson in the Commons, in the debate on South and South-East Asia: "We have made it clear in Washington that we could not support any extension of the bombing against North Vietnam by stages to Hanoi or Haiphong."'
        n: '[HC Deb, Feb. 8, 1966](https://api.parliament.uk/historic-hansard/commons/1966/feb/08/south-and-south-east-asia), vol. 724, c. 259. [FRUS 1964–68, IV, doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v04/d156) n.3. Wilson rose at 4.48 p.m. (Hansard); the time is his speech''s start. Check: Bruce''s report of the words, as doc. 156 n.3 quotes it, reads "Hanoi and Haiphong"; Hansard, "Hanoi or Haiphong." Names: Wilson.'
        time: 1966-02-08T16:48Z
        time_zone: Europe/London
        tags: [name:wilson-harold]
