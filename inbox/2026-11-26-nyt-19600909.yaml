      id: cal.1960-09-08.cities-and-housing
      when: Sept. 8
      date: '1960-09-08'
      thread: cities-and-housing
      place: nyc
      c: 'New York, the Statler Hilton Hotel. Mayor Robert F. Wagner, to some 300 persons at the opening session of the American Political Science Association''s annual meeting: the Eisenhower Administration has failed in its responsibilities toward the growing cities, which face urgent demands for housing, schools, highways, hospitals and recreational and industrial facilities without the resources to meet them; only the Federal Government can provide enough money. He praises the Democratic platform''s promise of a Cabinet post for urban affairs: "the farmer got his seat at that [Cabinet] table ninety-eight years ago. It is high time that today''s 120,000,000 urbanites sit down as well." He offers the city to the political scientists as "a living laboratory."'
      n: 'Kennett Love, "Wagner Charges Neglect of Cities," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Wagner.'
      tags:
      - name:wagner-robert-f-jr
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1960-09-08.elections-1960-2
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960
      place: nyc
      c: 'New York, the Statler Hilton Hotel. Charles Burton Marshall, of the Washington Center of Foreign Policy Research and formerly of the State Department''s policy-planning staff, to the American Political Science Association: no matter who is chosen President, the election will mark a turning away from "gerontocracy," or government by an old man, and a new era for the Presidency.'
      n: 'Kennett Love, "Wagner Charges Neglect of Cities," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day and the occasion; the *Times* gives "Further criticism of the Eisenhower Administration" from Marshall at the same meeting. See [[cal.1960-09-08.cities-and-housing]].'
      tags:
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1960-09-08.elections-1960-nixon-2
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      place: worcester
      c: 'Worcester, Mass. Lodge opens a two-day swing through Massachusetts, billed as a nonpolitical homecoming after his retirement as United States delegate to the UN. Police estimate 1,000 at City Hall, where acting Mayor Andrew B. Holmstrom gives Lodge and Senator Leverett Saltonstall keys to the city, and more than 2,500 at a hotel reception; Lodge: "I''m not fat-headed enough to think it''s for me personally ... You are saying that you approve of the course which the United States has followed in the United Nations." John A. Volpe, the Republican candidate for Governor, tells reporters that some Democrats had talked of a 500,000-vote margin for the Kennedy–Johnson slate in the State and that Lodge''s nomination had "shaved that down to 150,000 -- and we might just have a fighting chance." Even the bravest Republican politicians hold out only a forlorn hope for the State''s sixteen electoral votes, the *Times* reports.'
      n: 'Peter Kihss, "Lodge Is on Swing in Massachusetts," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Lodge, Volpe, Saltonstall.'
      tags:
      - name:lodge-henry-cabot
      - name:volpe-john-a
      - name:saltonstall-leverett
      - state:ma
      - city:worcester
