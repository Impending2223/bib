      date: '1960-08-03'
      thread: latin-america-dominican-republic
      c: Joaquín Balaguer, Trujillo's protégé, becomes President of the Dominican Republic, its first civilian President in thirty years.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Balaguer, Trujillo.'
