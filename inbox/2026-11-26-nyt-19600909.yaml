      id: cal.1960-09-08.elections-1960-kennedy-16
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-kennedy
      also:
      - conservation
      c: 'On the campaign train in California. Kennedy, applauded, for public power in Federal hydroelectric projects: "I would like to make it clear that when the people put their shoulders to the development of great dams, then I think the power should be distributed in a way that benefits the people. I don''t think the people should pay for irrigation and have the power distributed by a private company." Again and again: the greatest contributions to Western resources development were Theodore and Franklin D. Roosevelt''s; a return to their policies and a reversal of the "no new starts" conservation cutback of the Eisenhower Administration.'
      n: 'W. H. Lawrence, "Kennedy Reverts to Old-Fashioned Whistle-Stop Tour in California," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 16. Check: the stop. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ca
