      id: cal.1960-09-09.elections-1960-religion-2
      when: Sept. 9
      date: '1960-09-09'
      thread: elections-1960-religion
      c: 'As the *Times* reports it: the Kennedy campaign organization chooses for the moment to ignore the statement of Peale''s National Conference of Citizens for Religious Freedom, and plans no counter-attack.'
      n: 'John W. Finney, "Democrats Issue Paper on Religion," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 14. See [[cal.1960-09-07.elections-1960]]. Names: Peale.'
