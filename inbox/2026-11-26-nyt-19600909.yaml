      id: cal.1960-09-08.elections-1960-kennedy-13
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-kennedy
      place: boston
      c: Boston. Johnson flies in for the formal opening of his campaign for Vice President; brass bands playing "The Eyes of Texas" and "Deep in the Heart of Texas" greet him at Logan Airport and lead a slow-moving caravan through downtown to the Sheraton-Plaza Hotel in mid-afternoon, welcoming ceremonies arranged by Massachusetts Democratic organizations. He waves a Western-style pearl gray hat and jumps from his open car to shake hands. Governor Foster Furcolo, head of the welcoming committee, estimates the crowds along the route at 40,000. The choice of a New England setting is meant to stress that he is a man of national rather than regional interests.
      n: 'John D. Morris, "Johnson''s Drive Opens in Boston," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Johnson, Furcolo.'
      tags:
      - name:johnson-lyndon-b
      - name:furcolo-foster
      - state:ma
      - city:boston
