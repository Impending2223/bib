      c: Colombo. Krishna Menon, India's Defense Minister, says India will support the Soviet resolution at the General Assembly later this month for the admission of Communist China.
      n: '"India Backs Red China for U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-06.china-2]]. Names: Menon.'
