- add:
    entry:
      id: cal.1960-09-08.soviet-union
      when: Sept. 8
      date: '1960-09-08'
      thread: soviet-union
      place: moscow
      c: 'Moscow, the Kremlin. Llewellyn E. Thompson Jr., the American Ambassador, calls on Khrushchev, on the eve of his departure, to seek the release of the two surviving crew members of the RB-47 shot down July 1, Capt. Freeman B. Olmstead and Capt. John R. McKone, and to discuss strained relations; an hour and a half. Thompson: "Prior to his expected departure for the United Nations I called on Premier Khrushchev to discuss matters of interest to both Governments, including the detention of the RB-47 fliers."'
      n: 'Seymour Topping, "U.S. Urges Russians to Free Two Fliers in the RB-47 Case," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-07.soviet-union]]. Names: Thompson, Khrushchev, Olmstead.'
      tags:
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      - name:olmstead-freeman-b
      - polity:us
      - polity:ussr
      - ok:name-untagged
      time_range:
      - 1960-09-08T03:00Z
      - 1960-09-08T09:00Z
      time_band: morning
      time_zone: Europe/Moscow
