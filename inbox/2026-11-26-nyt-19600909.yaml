      place: birmingham
      c: 'Birmingham. Judge H. H. Grooms, of the U.S. District Court, amends his ruling in the libel suits against the *New York Times*: the cases involve a question that, through appeal, might speed their termination.'
      n: '"Times Will Appeal Ruling in Alabama," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html).'
