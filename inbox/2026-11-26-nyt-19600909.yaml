      when: By Sept. 8
      date: '1960-09-08'
      thread: middle-east
      place: cairo
      c: Cairo. Nasser will head the United Arab Republic's delegation to the General Assembly, his first trip to a Western country, well-informed sources say.
      n: '"Nasser Coming to U.N., Cairo Sources Report," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Nasser.'
