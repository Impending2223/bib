      c: Houston. Kennedy accepts an invitation to address the Greater Houston Ministerial Association, 800 members, interdenominational and Protestant, Monday night, Sept. 12, after a rally, in the Crystal Ballroom of the Rice Hotel; the invitation came from the Rev. Herbert Meza, its vice president and program chairman.
