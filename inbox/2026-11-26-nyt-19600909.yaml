      when: Sept. 8
      date: '1960-09-08'
      thread: alabama
      place: birmingham
      c: Birmingham. The *New York Times*'s attorneys say they will file a petition tomorrow with the Fifth Circuit in New Orleans to appeal the U.S. District Court ruling, amended by Judge H. H. Grooms, that last week upheld service of seven civil suits totaling $3,100,000 against the *Times*, six of $500,000 each, by officials of Birmingham and Bessemer, and one of $100,000.
      n: '"Times Will Appeal Ruling in Alabama," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (AP). Names: none.'
      tags:
      - state:al
      - city:birmingham
