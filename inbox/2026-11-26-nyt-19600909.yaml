    entry:
      id: cal.1960-09-08.berlin-and-vienna-2
      when: Sept. 8
      date: '1960-09-08'
      thread: berlin-and-vienna
      place: berlin
      c: 'Ulbricht, in a statement before the East German Cabinet, demands complete withdrawal of Allied troops from West Berlin by the end of 1962. It is part of a three-phase disarmament plan for East and West Germany: a German peace treaty, "demilitarizing" Berlin with foreign troops out by the end of 1962, dissolution of the German armies and destruction of weapons by 1964. East Germany will seek an invitation from Hammarskjold to present the program to the General Assembly session opening Sept. 20. The new travel curb, Ulbricht says, will "help to sober up the West Berlin and West German militarists."'
      n: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7. Names: Ulbricht, Hammarskjöld.'
      tags:
      - name:ulbricht-walter
      - name:hammarskjold-dag
      - polity:gdr
      time_range:
      - 1960-09-08T18:00Z
      - 1960-09-08T21:00Z
      time_band: evening
      time_zone: Europe/Berlin
