      date: '1960-09-09'
      thread: africa
      c: Dakar. President Léopold Sédar Senghor and Premier Mamadou Dia, newly re-elected leaders of Senegal, leave the National Assembly to cheers. Senegal, no longer part of the Mali Federation, has formed a Government as an independent state.
      n: '"Cheered in Dakar," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day.'
