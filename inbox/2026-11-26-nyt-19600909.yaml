- add:
    entry:
      id: cal.1960-09-09.latin-america-dominican-republic-2
      when: Sept. 9
      date: '1960-09-09'
      thread: latin-america-dominican-republic
      c: 'As the *Times* reports it: some of the best-informed observers in Ciudad Trujillo, in the foreign colony and in the top circles of the Trujillo regime, think the United States and its allies could be confronted within a few months by a Leftist Dominican Government as full of problems as Castro''s. There is no functioning opposition party, for the first time since the spring. If secret elections were held now, Trujillo would probably be elected President by 99.99 percent, they contend. Balaguer''s gradual "democratization" has so far survived: people discuss politics more freely; foreign correspondents report freely; many imprisoned opponents have been pardoned; a general amnesty bill moves slowly through Congress; fear of the secret police remains.'
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Castro, Trujillo, Balaguer.'
      tags:
      - name:castro-fidel
      - name:trujillo-rafael
      - name:balaguer-joaquin-videla
