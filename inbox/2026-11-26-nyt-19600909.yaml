      when: Sept. 8
      date: '1960-09-08'
      thread: cuba
      place: montreal
      c: Montreal. Gen. José Pedraza y Cabrera says he has resigned as leader of a movement of Cuban exiles; he has been ordered deported from Canada.
      n: '"Exile Quits Fight on Castro," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (AP).'
