      date: '1960-08-22'
      thread: elections-1960-religion
      c: West View, Pa. W. L. King, a clergyman of the Nazarene Baptist Church, who quoted the fake Knights of Columbus oath and would not retract it, is charged with criminal libel in the Magistrate's Court.
      n: '"Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (quoting *Time*, Aug. 22, 1960, at 15). Check: the day. See [[cal.1960-08-22.elections-1960-religion]].'
