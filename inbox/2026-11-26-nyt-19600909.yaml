- add-words:
    id: cal.1960-09-08.berlin-and-vienna
    after: end
    words: The order, published by the East German press agency ADN, comes three days after the earlier five-day ban was lifted; permits are to be sought at the People's Police offices, and Allied personnel and other foreigners are not affected. Western officials call it the most stringent violation of Berlin's four-power status since the end of World War II.
    text: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7.'
