- add:
    entry:
      id: cal.1960-09-08.china-3
      when: Sept. 8
      date: '1960-09-08'
      thread: china
      place: washington
      c: 'Washington. The State Department makes public a statement on the Warsaw talks: it is "reluctantly compelled to conclude that Communist China, whatever its reason may be, has no serious interest either in reporting by its own newsmen from the United States or reporting by American newsmen from the China mainland." The American proposal, made three months ago, was for each government to accept the other''s newsmen on "equality and reciprocity." One official calls the Chinese reply "the most cynical statement of China''s attitude in a long time." The Department''s statement says the Chinese plan''s preamble would commit the United States to negotiate withdrawal of all its armed forces from Taiwan; officials in Washington read it as a reversal of policy meant to shatter confidence in Chiang Kai-shek.'
      n: '"Deal With Peiping Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: whether the last sentence is the Department''s statement or the *Times*''s account of what officials noted. See [[cal.1960-09-06.china-3]].'
      tags:
      - polity:us
      - polity:prc
- add:
    entry:
      id: cal.1960-09-06.china-4
      when: Sept. 6
      date: '1960-09-06'
      thread: china
      place: warsaw
      c: 'Warsaw. At the 100th meeting, Wang Bingnan brings back his Government''s answer to the American proposal for an exchange of newsmen: unacceptable; he offers a proposal of his own. Its preamble says the exchange would "seek to eliminate estrangement between the Chinese and American peoples," make "preliminary improvement in the present relations," and settle peacefully the question of withdrawal of all United States armed forces from Taiwan; Peking asks a guarantee in advance that none of its chosen reporters will be refused entry. Jacob D. Beam speaks for the United States. The next meeting is set for Oct. 18.'
      n: '"Deal With Peiping Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-06.china-3]]. Names: Wang Bingnan, Beam.'
      tags:
      - name:wang-bingnan
      - name:beam-jacob-d
      - polity:prc
      - polity:us
      - polity:poland
