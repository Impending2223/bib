      - polity:ussr
- add:
    entry:
      id: cal.1960-09-09.africa-algeria-morocco
      when: Sept. 9
      date: '1960-09-09'
      thread: africa-algeria-morocco
      c: 'As the *Times* reports it: a project to merge the Government of Tunisia and the rebel Provisional Government of Algeria has been reported by observers in Tunis, after Bourguiba''s statement two days earlier that he was ready to "link his fate" with Algeria. Conversations are said to have gone on almost a month. Some reports mention a common Algerian-Tunisian government, one part free and the other occupied by a foreign power; some observers think the purpose is to bring about UN intervention if France extends operations into Tunisian territory, or to let foreign troops, such as Chinese Communists, cross Tunisia into Algeria. The Tunisians and Algerians are said to have abandoned hope that France will negotiate without outside pressure.'
      n: 'Henry Giniger, "Algerian Link-Up to Tunisia Hinted," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Bourguiba.'
      tags:
      - name:bourguiba-habib-ben-ali
      - polity:algeria
      - polity:tunisia
      - polity:fr
- add:
    entry:
      id: cal.1960-09-06.africa-algeria-morocco
      when: Sept. 6
      date: '1960-09-06'
      thread: africa-algeria-morocco
      c: Tunisia. Bourguiba says he is ready to "link his fate" with Algeria.
