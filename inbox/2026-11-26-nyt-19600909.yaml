- add:
    entry:
      id: cal.1960-09-08.europe-and-the-alliance
      when: Sept. 8
      date: '1960-09-08'
      thread: europe-and-the-alliance
      also:
      - united-nations
      place: washington
      c: 'Washington. Herter, addressing editors and publishers of United Press International, answers de Gaulle''s news conference of Sept. 5: "It continues to be the policy of the United States to encourage the concept of integration in NATO"; nuclear-capable weapons are already with the allied forces. He calls Khrushchev''s proposal of a summit of the leaders of eighty and more nations at the General Assembly "ludicrous in the extreme."'
      n: 'Dana Adams Schmidt, "Revision of NATO Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html); E. W. Kenworthy, "Herter Ridicules a Summit in U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-05.europe-and-the-alliance-france]]. Names: Herter, de Gaulle, Khrushchev.'
      tags:
