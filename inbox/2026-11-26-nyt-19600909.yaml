      thread: elections-1960-religion
      place: washington
      c: An aide to Nixon, commenting on the Peale group's statement, repeats Nixon's position that the religious issue has no place in the Presidential campaign.
      n: 'John W. Finney, "Democrats Issue Paper on Religion," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 14. Check: the day. See [[cal.1960-09-07.elections-1960]]. Names: Peale, Nixon.'
