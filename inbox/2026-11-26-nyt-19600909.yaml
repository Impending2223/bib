      c: Birmingham. Judge Grooms upholds the service of seven civil suits totaling $3,100,000 against the *New York Times*, over its articles of April on race relations in Birmingham.
      n: '"Times Will Appeal Ruling in Alabama," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day.'
