      id: cal.1960-09-08.latin-america-dominican-republic-2
      when: Sept. 8
      date: '1960-09-08'
      thread: latin-america-dominican-republic
      also:
      - soviet-union
      place: nyc
      c: 'United Nations. The Security Council debates the Soviet request to approve the OAS sanctions of Aug. 20 against the Trujillo regime. Kuznetsov argues under Article 53 of the Charter and revises the Soviet draft to drop its references to the sanctions, while calling the Trujillo Government "a regime of tyranny, corruption and assassination." Wadsworth: no Council endorsement is required, and the American republics want "alien ideologies" kept out of inter-American affairs. Tsiang of Nationalist China: approval would "expose the Soviet veto" to any regional decision. Argentina, Venezuela and Britain also speak. The Dominican delegation under Enrique de Marchena watches from the public gallery and declines a seat at the Council table.'
      n: 'Kathleen Teltsch, "Soviet O.A.S. Role Is Opposed at U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 3. "Excerpts From U.N. Council Debate on Trujillo Regime in Dominican Republic," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html) (the speeches of Kuznetsov, Amadeo, Wadsworth, Sosa-Rodriguez and Beeley). To check: the Security Council''s record, Sept. 8, 1960. Names: Kuznetsov, Wadsworth.'
      tags:
      - name:kuznetsov-vasily-v
      - name:wadsworth-james-j
      - polity:ussr
      - polity:us
      - polity:oas
      - polity:dominican-republic
- add:
    entry:
      id: cal.1960-08-30.latin-america-dominican-republic
      when: Aug. 30–31
      date: '1960-08-30'
      thread: latin-america-dominican-republic
      place: santo-domingo
      c: 'Santo Domingo, then Ciudad Trujillo. Night of Aug. 30, Villa Consuelo: free-for-alls, by 8:30 a.m. Wednesday gang fights, more than 300 Trujillistas against more than 100 Dominican People''s Movement adherents, with sticks, clubs, stones and knives. 22 of the movement and 28 Trujillistas are hospitalized; the movement is routed and its headquarters sacked. Part of the mob sacks the headquarters and home of the Quisqueyano party''s president, Dr. Ramón Gonzales de León, burning goods valued at $12,600; the national police do not intervene. Libertad, the movement''s organ, is last sold Aug. 30, and rioters smash its press the next day. The *Times* writer (Lissner) reports it.'
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day of each act; the *Times* gives "Aug. 30" and "last Wednesday" (Aug. 31). Names: none.'
      tags: []
- add:
    entry:
      id: cal.1960-08-23.latin-america-dominican-republic
      when: Aug. 23
      date: '1960-08-23'
      thread: latin-america-dominican-republic
      place: santo-domingo
      c: Santo Domingo. Foreign Minister Porfirio Herrera Báez, stepping off his plane from the San José meeting, delivers a speech calling for public support in a fight against the ministers' resolution. President Balaguer, after the foreign ministers' vote, has recalled the San José delegation and organized mass demonstrations to welcome it with an orderly protest against the OAS sanctions.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day of the demonstrations. See [[cal.1960-08-26.latin-america-dominican-republic]]. Names: Balaguer.'
      tags:
      - name:balaguer-joaquin-videla
      - polity:oas
- add:
    entry:
      id: cal.1960-09-09.latin-america-dominican-republic
      when: By Sept. 9
      date: '1960-09-09'
      thread: latin-america-dominican-republic
      place: santo-domingo
      c: Santo Domingo. Radio Caribe, a powerful station controlled by a private group and the organ of the extreme nationalist faction of Trujillo's Dominican party, first calls for Trujillo to assume the Presidency immediately as the nation's answer to the San José resolution; then denounces the Cabinet for its alleged silence on the sanctions; then demands that Trujillo take the Presidency and say whether he will steer the country on an extreme nationalist course. The Cabinet and then the President write to the station to praise its initiative and support its position on the Presidency; Balaguer says he would have resigned except that Trujillo was not disposed to accept the call. Radio Caribe ignores the letter and organizes demonstrations by workers, syndicate members and peasants. The *Times* writer (Lissner) reports it, without the days.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the days; the account is undated. Names: Trujillo, Balaguer.'
      tags:
      - name:trujillo-rafael
      - name:balaguer-joaquin-videla
- add:
    entry:
      id: cal.1960-09-03.latin-america-dominican-republic
      when: Sept. 3
      date: '1960-09-03'
      thread: latin-america-dominican-republic
      place: santo-domingo
      c: Santo Domingo. The Quisqueyano party disbands, the Saturday before the *Times* writer's report. For the first time since last spring there is no functioning opposition party. Libertad is the organ of the Dominican People's Movement; La Prensa Libre, the organ of the loyal opposition, has been suspended since last February.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day; the *Times* says "Saturday", Sept. 3 if the writer means the week before his return. Names: none.'
      tags: []
- add:
    entry:
      id: cal.1960-09-09.latin-america-dominican-republic-2
      when: Sept. 9
      date: '1960-09-09'
      thread: latin-america-dominican-republic
      c: 'Will Lissner, in the *Times*, after a month in the Dominican Republic: observers in Ciudad Trujillo, within the foreign colony and the top circles of the Trujillo regime, think the United States and its allies could be confronted within a few months by a Leftist Dominican Government as full of problems as Castro''s. Had the OAS ministers voted for the immediate overthrow of the regime, they say, chaos and civil war would have followed and a Communist Government or another strong army regime. If secret elections were held now, Trujillo would probably be elected President by 99.99 percent. Balaguer''s policy of gradual "democratization" has so far survived: people discuss politics more freely, foreign correspondents report freely, many imprisoned opponents are pardoned, a general amnesty bill moves slowly through Congress; fear of the secret police remains.'
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Castro, Trujillo, Balaguer.'
      tags:
      - name:castro-fidel
      - name:trujillo-rafael
      - name:balaguer-joaquin-videla
