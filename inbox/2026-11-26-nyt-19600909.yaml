      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      place: washington
      c: Walter Reed Army Medical Center, Washington. Herbert G. Klein, Nixon's press secretary, reports in the afternoon that the Vice President is making "remarkable progress" in recovering from his knee infection and is walking freely about his suite; he announces that President Eisenhower will take part in a send-off rally Monday morning, Sept. 12, at Friendship International Airport, Baltimore, before Nixon takes off on his first prolonged campaign swing.
      n: 'Russell Baker, "Nixon and Benson Get Wire Crossed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-08-29.elections-1960]]. Names: Klein, Nixon, Eisenhower.'
      tags:
