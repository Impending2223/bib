    id: cal.1960-09-08.berlin-and-vienna
    text: 'Check: the *Times*, Sept. 9, 1960, at 1, 7, says it was not clear whether the curbs restricted residents of West Berlin from crossing to East Berlin, and reports no refusal of West German passports held by West Berliners.'
