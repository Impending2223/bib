      id: cal.1960-09-08.berlin-and-vienna-4
      when: Sept. 8
      date: '1960-09-08'
      thread: berlin-and-vienna
      place: west-berlin
      c: 'West Berlin. The city government calls an emergency session on the East German curb and contacts the Western allies and the Bonn Government. Mayor Willy Brandt, after the session: he is convinced "we haven''t yet reached the climax of the new crisis"; he calls on the Western powers "responsible for the security of Berlin" to deal with the Communist threat.'
      n: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7. Names: Brandt.'
      tags:
      - name:brandt-willy
      follows:
      - cal.1960-09-08.berlin-and-vienna
- add:
    entry:
      id: cal.1960-09-09.berlin-and-vienna
      when: Sept. 9
      date: '1960-09-09'
      thread: berlin-and-vienna
      c: 'As the *Times* reports it: the Soviet commander in Berlin has not yet answered the protest sent last week by the three Western commanders over the five-day East German traffic curbs, Aug. 31 to Sept. 4.'
      n: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7.'
