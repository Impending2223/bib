      when: Sept. 8
      date: '1960-09-08'
      thread: cuba
      place: havana
      c: Havana. Paul D. Wilson, 31, a former Air Force sergeant, is expelled from Cuba after the Government rejects his offer to serve in an intelligence capacity for Cuba, Communist China or the Soviet Union; he is put on an airliner for Miami.
      n: '"Cuba Expels Former G.I.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (AP).'
