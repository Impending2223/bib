- primary:
    id: cal.1960-09-08.space
    text: Felix Belair Jr., "Eisenhower Terms Soviet Space Work 'Soulless, Barren'," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 8 (the dedication at Huntsville; von Braun the center's director; not July 1 or the team)
- add-words:
    id: cal.1960-09-08.space
    after: end
    words: About 10,000 workers hear him; Mrs. George C. Marshall unveils a bust of Marshall a few minutes earlier. The nation's space achievements, he says, are the outgrowth not of "a soulless, barren technology, nor of a grasping state imperialism" but of "unrestrained human talent and energy."
    text: Felix Belair Jr., "Eisenhower Terms Soviet Space Work 'Soulless, Barren'," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 8
- primary:
    id: cal.1960-09-08.berlin-and-vienna
    text: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7 (the permits; not the passports)'
- add-words:
    id: cal.1960-09-08.berlin-and-vienna
    after: end
    words: The order, published by the East German press agency ADN, comes three days after the earlier five-day ban was lifted; permits are to be sought at the People's Police offices, and Allied personnel and other foreigners are not affected. Western officials call it the most stringent violation of Berlin's four-power status since the end of World War II.
    text: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7'
