      when: By Sept. 6
      date: '1960-09-06'
      thread: china
      place: taipei
      c: Taipei. Nationalist China enacts a law to induce foreign capital, approved last week by the National Congress, superseding thirty older laws; it follows American advice and a 19-point American-sponsored plan for expansion.
      n: '"Taiwan Regime Woos Investors," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day of the approval and the body; the *Times* says "last week" and "National Congress". Names: none.'
