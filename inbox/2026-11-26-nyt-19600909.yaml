      thread: europe-and-the-alliance-france
      also:
      - europe-and-the-alliance
      c: 'De Gaulle, at his news conference, on NATO: integration was arranged ten years ago; "Everything is commanded by Americans, and it is the Americans who dispose of utilization of the principal arms, that is to say, atomic." He proposes to undo integration and return to an alliance of national forces, and asks a French voice in the use of the nuclear weapons NATO wishes to store on French soil.'
      n: 'Dana Adams Schmidt, "Revision of NATO Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the place and the words, from a later report. Names: de Gaulle.'
