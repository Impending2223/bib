      id: cal.1960-09-08.antisubversion
      when: Sept. 8
      date: '1960-09-08'
      thread: antisubversion
      place: washington
      c: Washington. Walter, at a news conference, says he is writing to Kilday, head of a subcommittee appointed by Vinson of the Armed Services Committee, to offer his co-operation in the other's inquiry into the defectors Mitchell and Martin; he will continue his own investigation, with a hearing set for Sept. 16, and is indicating in his letter where he thinks the committees' jurisdictions lie. He says Martin and Mitchell were known to acquaintances as "sex deviates," which he heard "from a source in which I have great confidence." McCormack called on Walter to conduct the inquiry on Aug. 29; the Vinson action is seen as an effort to wrest the investigation from Walter's committee. Senate leaders, who will not be quoted, stress confidence in the quiet inquiry of Russell's Armed Services Committee.
      n: 'Jack Raymond, "House Units Map Defector Studies," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-06.antisubversion]]. Names: Walter, Kilday, Vinson, McCormack, Russell, Mitchell, Martin.'
