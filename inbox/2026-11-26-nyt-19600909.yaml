      id: cal.1960-09-08.berlin-and-vienna-5
      when: Sept. 8
      date: '1960-09-08'
      thread: berlin-and-vienna
      place: west-berlin
      c: 'West Berlin. Mayor Willy Brandt, after the city government''s emergency session: he is convinced "we haven''t yet reached the climax of the new crisis"; he calls on the Western powers "responsible for the security of Berlin" to deal with the Communist threat.'
      n: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7. Names: Brandt.'
      tags:
