      c: Keating says the Democrats are injecting religion into the campaign, in a recorded radio interview.
      n: '"Kennedy Group Cited," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (AP). Names: Keating.'
