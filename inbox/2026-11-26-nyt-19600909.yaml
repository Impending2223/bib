      - name:peale-norman-vincent
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-03-03.elections-1960-religion
      when: Mar. 3
      date: '1960-03-03'
      thread: elections-1960-religion
      c: 'Kennedy, in *Look*: "I am flatly opposed to appointment of an Ambassador to the Vatican. Whatever advantages it might have in Rome—and I''m not convinced of these—they would be more than offset by the divisive effect at home."'
      n: '"Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (cited as *Look*, March 3, 1960). Check: the year; the memorandum cites *Look* of March 3, 1959, for another passage. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - polity:vatican
- add:
    entry:
      id: cal.1960-04-15.elections-1960-religion
      when: By Apr. 15
      date: '1960-04-15'
      thread: elections-1960-religion
      c: 'Kennedy, as the *Philadelphia Inquirer* reports him, on the Poling dinner: invited by the Rev. Dr. Poling to the dinner for the Chapel of the Four Chaplains, he learned he was to attend as spokesman for the Catholic faith, in the sanctuary of a church of another faith, and the Archdiocese of Philadelphia could not support the drive; "I felt I had not credentials to attend in the capacity in which I had been asked." His record on church and state "has been written in the past fourteen years in Congress."'
      n: '"Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (cited as the *Philadelphia Inquirer*, April 15, 1960). Check: the day. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - ok:name-untagged
- add:
    entry:
      id: cal.1960-04-19.elections-1960-religion-2
      when: By Apr. 19
      date: '1960-04-19'
      thread: elections-1960-religion
      c: 'Kennedy, as the *New York Herald Tribune* reports him: "I don''t think that my religion is anyone''s business but my business. Is anyone going to tell me that I lost this primary the day that I was born and baptized forty-two years ago?"'
      n: '"Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (cited as the *New York Herald Tribune*, April 19, 1960). Check: the day and the place; whether it is the answer at Wheeling, [[cal.1960-04-19.elections-1960-religion]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
