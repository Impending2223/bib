    entry:
      id: cal.1960-09-02.elections-1960-religion
      when: Sept. 2
      date: '1960-09-02'
      thread: elections-1960-religion
      place: washington
      c: 'Washington. The Democratic campaign organization begins quietly distributing, to party workers across the country and to voters who write in, a memorandum on Kennedy''s position on church and state: answers to the questions "frequently asked by fair-minded persons," from Kennedy''s speeches, among them his acceptance speech at Los Angeles, magazine articles and interviews, with the Constitution and the congressional oath. It takes up the separation of church and state, an Ambassador to the Vatican, aid to parochial schools, birth control, the Poling dinner, the Roman Catholic Church''s position and the Knights of Columbus oath. Nothing new on his position.'
      n: 'John W. Finney, "Democrats Issue Paper on Religion," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 14; "Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (the text; the Democratic National Committee its circulator). Names: Kennedy.'
      tags:
      - name:kennedy-john-f
