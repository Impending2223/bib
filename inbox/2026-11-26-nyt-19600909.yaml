      c: 'Worcester, Mass. John A. Volpe, Republican candidate for Governor, to reporters: some Democrats had talked of a 500,000-vote margin for the Kennedy–Johnson ticket in the State; Lodge''s nomination had "shaved that down to 150,000--and we might just have a fighting chance."'
