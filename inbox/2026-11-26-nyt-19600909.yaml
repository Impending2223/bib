- add:
    entry:
      id: cal.1960-09-08.latin-america-2
      when: Sept. 8
      date: '1960-09-08'
      thread: latin-america
      place: bogota
      c: Bogotá. Senator Wayne Morse, chairman of the Senate Foreign Relations subcommittee on Latin America, tells delegates to the inter-American economic conference that the United States decision to support social, educational and economic development of Latin America will be backed by Congress; if the nations work together "to bring social and economic justice to the underprivileged in our hemisphere, future support of United States' Presidents and Congresses will be assured." The Latin American delegates receive it "with evident pleasure"; the American delegation has said privately that its $500,000,000 offer is only a first step but that no further specific commitments can be made without Congressional approval. Morse, like Dillon before him, pays tribute to Kubitschek's Operation Pan America.
      n: 'Richard Eder, "Morse Hails Plan for Aid to Latins," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-05.latin-america]]. Names: Wayne Morse, Dillon, Kubitschek.'
      tags:
      - name:morse-wayne
      - name:dillon-c-douglas
      - name:kubitschek-juscelino
      - polity:us
- add:
    entry:
      id: cal.1960-09-08.latin-america-3
      when: Sept. 8
      date: '1960-09-08'
      thread: latin-america
      place: bogota
      c: 'Bogotá. Raúl Prebisch, executive director of the UN Economic Commission for Latin America, tells the inter-American economic conference that Latin America, "even with the small aid that it has received," has not done enough for itself: a 40 percent illiteracy rate and an average of one year of schooling per capita; failure to tax idle land into production and to apply income taxes to narrow the gap between rich and poor; failures on anti-inflationary measures. Unless a "profound transformation" is effected, the youth of the continent will not stay passive: "These new generations ... will destroy this world and build another."'
      n: Richard Eder, "Morse Hails Plan for Aid to Latins," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-05.latin-america]].
      tags:
      - polity:un
      time_range:
      - 1960-09-08T11:00Z
      - 1960-09-08T17:00Z
      time_band: morning
      time_zone: America/Bogota
- add:
    entry:
      id: cal.1960-09-08.congo-2
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: leopoldville
      c: 'Léopoldville. The Congo Senate votes 41 to 2, with seven abstentions, to reject Kasavubu''s dismissal on Monday of Lumumba as Premier. The Senate is at first hostile: two ministers who countersigned the dismissal, Foreign Minister Justin Bomboko and Albert Delvaux, Minister Resident in Belgium, speak against Lumumba. Lumumba then speaks in a two-hour address; he announces his Cabinet''s decision to request immediate UN withdrawal, charges that the UN, by seizing the airports and the radio, has sought to impose military occupation ("They want to have us in slavery ... They cannot stay"), and says the Congo Government will keep law and order with its own army. Debate continues three hours. The lower house voted 60 to 19 the day before to "invalidate" both dismissals.'
      n: 'Henry Tanner, "Lumumba Bids U.N. Give Up Controls or Face Ouster," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. See [[cal.1960-09-07.congo-3]]. Names: Lumumba, Kasavubu, Bomboko.'
      tags:
      - name:lumumba-patrice
      - name:kasavubu-joseph
      - name:bomboko-justin-marie
      - polity:un
      time_range:
      - 1960-09-08T05:00Z
      - 1960-09-08T11:00Z
      time_band: morning
      time_zone: Africa/Kinshasa
- add:
    entry:
      id: cal.1960-09-08.congo-3
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: leopoldville
      c: 'Léopoldville. Lumumba, at a news conference after the Senate vote, calls it a "moral defeat" for the UN and Kasavubu; the Congo is "ready to break off relations with everybody, including the United Nations." He tones down the Senate statement: withdrawal will be demanded unless the UN ends its "occupation" of the airports and the radio station; the same conditional threat is in a seven-point memorandum he says he is submitting to the UN that night, listing UN moves the Government calls interference in internal affairs. UN technical assistance, as distinct from "military interference," would still be welcome, as would military assistance from "our African brothers." He displays a young white man, in a paratrooper''s uniform, whom he calls a "Belgian paratrooper" captured that morning.'
      n: 'Henry Tanner, "Lumumba Bids U.N. Give Up Controls or Face Ouster," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. See [[cal.1960-09-08.congo]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
      - polity:un
      - polity:belgium
      follows:
      - cal.1960-09-08.congo-2
- add:
    entry:
      id: cal.1960-09-08.congo-4
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: leopoldville
      c: Léopoldville. A clandestine radio station, calling itself Radio Freedom and believed controlled by Kasavubu's party, the Association of the Lower Congo (Abako), goes on the air right after the Senate vote, inviting the people to rally around Kasavubu. It declares the Lumumba Government illegal and warns that if the Premier does not give up his post by Saturday the whole Léopoldville population will be "mobilized" against him.
      n: 'Henry Tanner, "Lumumba Bids U.N. Give Up Controls or Face Ouster," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. Names: Kasavubu, Lumumba.'
      tags:
      - name:kasavubu-joseph
      - name:lumumba-patrice
      follows:
      - cal.1960-09-08.congo-2
- add:
    entry:
      id: cal.1960-09-08.congo-5
      when: By Sept. 8
      date: '1960-09-08'
      thread: congo
      place: elisabethville
      c: Elisabethville. About 200 Congolese troops are reported to have entered secessionist Katanga from the north, in the Kongolo region on the Congo River, more than 400 miles from Elisabethville; there is no official confirmation. The UN has refused to let Katanga send a police force to the troubled area and has banned unscheduled flights.
      n: '"Katanga Invaded by Congo Troops," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (UPI). Check: the report; the *Times* gives no confirmation, and Tanner''s dispatch from Léopoldville the same day bracketed it as UPI''s.'
      tags:
      - polity:congo
      - polity:un
- add:
    entry:
      id: cal.1960-09-08.congo-6
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: elisabethville
      c: 'Elisabethville. The UN closes all airports in Katanga, on Hammarskjold''s order, to prevent the spread of fighting: Sabena is told to cancel all flights, Katanga authorities are not permitted internal military or police flights, and only white two-engine UN courier planes may land or take off for the indefinite duration. Swedish officers put it into effect at Elisabethville Airport fifteen minutes after local authorities are notified. Katanga protests at once to the UN, calling it a violation of the agreement between the UN and President Tshombe for joint control of airports, and warns the UN it bears responsibility for tribal hostilities if it refuses to supply Katanga police and army units; Belgium''s Consul General in Elisabethville also delivers a protest. The order comes about 48 hours after similar action in the rest of the Congo.'
      n: 'A. M. Rosenthal, "U.N. Bans Katanga Flights," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Hammarskjöld, Tshombe.'
      tags:
      - name:hammarskjold-dag
      - name:tshombe-moise
      - polity:un
      - polity:belgium
- add:
    entry:
      id: cal.1960-09-08.congo-7
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: 'United Nations. Hammarskjold sends Belgium a note verbale questioning reports that some nine tons of weapons were landed from a Belgian civil aircraft at Elisabethville the day before: "confirmed reports" had been received "to the effect that a cargo marked ''Belgian weapons or something similar''" had been delivered from a Sabena plane. "Should this be the case, the Secretary General would consider it necessary to make a formal protest against the delivery, which is contrary to the spirit and letter of the Security Council resolution of 22 July 1960" and to non-intervention in the Congo''s internal affairs. It is the third reproof he has addressed to Belgium; the Times understands a note verbale is less formal than most diplomatic communications.'
      n: 'Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. "Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html) (the addendum, Note verbale of Sept. 8). See [[cal.1960-09-07.congo-6]]. Names: Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-08.congo-8
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: United Nations. Yugoslavia calls for an immediate meeting of the Security Council on the Congo; its note, delivered to Hammarskjold that morning by Dobrivoje Vidic, says "new and very serious difficulties have arisen" through the Lumumba–Kasavubu conflict, caused by outside interferences, "an organized action" supporting the secessionists Tshombe and Kalonji with military equipment and instructors, "facilitated" by the practices of the UN command, and urges that the Council "take measures which would finally insure full implementation" of its resolutions. A Council session Saturday is expected; Ortona of Italy, the month's president, is discussing the Congo with the eleven members.
      n: 'Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. Names: Vidic, Hammarskjöld, Tshombe.'
      tags:
      - name:vidic-dobrivoje
      - name:hammarskjold-dag
      - name:tshombe-moise
      - polity:un
      time_range:
      - 1960-09-08T10:00Z
      - 1960-09-08T16:00Z
      time_band: morning
      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-09-08.congo-9
      when: By Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: United Nations. The UN makes public a cablegram from Lumumba inviting the Security Council to hold its next meeting in Léopoldville, under the Charter's allowance for meetings away from the seat of the organization, so that the members can see "the situation existing in the Republic of the Congo as a result of the United Nations' interference in the Congo's domestic problems."
      n: 'Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. Check: the day of the cablegram; the *Times* gives only the day it was made public. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
      - polity:un
- add:
    entry:
      id: cal.1960-09-04.congo
      when: Sept. 4
      date: '1960-09-04'
      thread: congo
      place: nyc
      c: New York. Walter Loridan, Belgium's permanent representative at the UN, writes the Secretary General with further information on the delay in the evacuation of Belgian troops from the Congo, in reply to his note of Aug. 30. Belgium says the relief arrangements by UN units were decided between Generals von Horn and Geysen on Aug. 13 and ordered Aug. 14, that the UN relief was not carried out to the timetable, and that the Belgian troops would be withdrawn at midnight Aug. 30; the company at Elisabethville was to leave for Brussels Aug. 30 and left for Kamina, delayed to Aug. 31 and Sept. 1 by a USAF rescue operation at Kano and the railway companies' resources.
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (A, letter dated Sept. 4).'
      tags:
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-04.congo-2
      when: Sept. 4
      date: '1960-09-04'
      thread: congo
      place: nyc
      c: 'Hammarskjold cables Belgian Foreign Minister Wigny that he must approach him personally on the Kitona base: UN representatives who went to the base report its commander has received no instructions except to give logistic support to the UN, that 650 Belgians are still there, including those at Banana, whom the commander calls all combatants (he is himself a paratroop), and that two gunboats were seen at the Banana naval base. The information comes five days after the expiry of the period set by Belgium for withdrawal, and Hammarskjold must correct his report to the Security Council of Sept. 1 as incomplete; he reiterates his formal protest and expresses personal disappointment. He notes that the last paratroops at Albertville were taken aboard on Sept. 3 at 7 p.m.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (B, cable dated Sept. 4). Check: the day; the cable mentions Albertville "yesterday, 3 September". Names: Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-05.congo-5
      when: Sept. 5
      date: '1960-09-05'
      thread: congo
      c: 'Wigny, Belgian Foreign Minister, cables Hammarskjold: he has personally examined his message and will send a precise reply within a few hours.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (C, cable dated Sept. 5). Names: Hammarskjöld. See [[cal.1960-09-04.congo-2]].'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-05.congo-6
      when: Sept. 5
      date: '1960-09-05'
      thread: congo
      c: 'Hammarskjold writes Loridan that Belgium''s letter of Sept. 4 calls for observations: the relief arrangements of Aug. 13 and 14 were never approved by the Secretary General; Belgium''s assurance of withdrawal within eight days is dated Aug. 20 and repeated in a letter of Aug. 24 that the period would end at 2400 hours Aug. 29, and neither letter mentioned those plans nor made UN relief a condition.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). (D, letter dated Sept. 5; the text in the copy is cut at the edge). Check: the rest of the letter, not on the clipping. Names: Hammarskjöld. See [[cal.1960-09-04.congo]].'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-08.soviet-union-un-2
      when: Sept. 8
      date: '1960-09-08'
      thread: soviet-union-un
      also:
      - congo
      - africa
      place: moscow
      c: Moscow. President Sékou Touré of Guinea announces in a joint communiqué signed with Khrushchev that he will join Khrushchev at the UN to support Soviet efforts to "get the aggressive forces out of the Congo"; each will head his country's delegation, and the two agree there is a possibility of bringing up the question of African "national independence" among the heads of government attending the session. Touré, who had signed a trade agreement earlier after a two-day visit, leaves that evening for Outer Mongolia and Communist China; Tass had indicated earlier that he could not go to New York. At the airport he says he would not have been treated so well in "reactionary states."
      n: 'Osgood Caruthers, "Toure to Support Khrushchev in U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Touré, Khrushchev.'
      tags:
      - name:toure-ahmed-sekou
      - name:sekou-toure
      - name:khrushchev-nikita-s
      - polity:guinea
      - polity:ussr
      time_range:
      - 1960-09-08T16:00Z
      - 1960-09-08T19:00Z
      time_band: evening
      time_zone: Europe/Moscow
- add:
    entry:
      id: cal.1960-09-08.soviet-union
      when: Sept. 8
      date: '1960-09-08'
      thread: soviet-union
      place: moscow
      c: Moscow. Llewellyn E. Thompson Jr., the American Ambassador, calls on Khrushchev in his Kremlin office to seek the release of the two surviving crew members of the RB-47 shot down July 1, Capt. Freeman B. Olmstead and Capt. John R. McKone. The meeting lasts an hour and a half. Khrushchev, who leaves the next day for a Baltic port to board the *Baltika*, had insisted in exchanges with Thompson the night before that the Soviet Government means to press the RB-47 case before the General Assembly.
      n: 'Seymour Topping, "U.S. Urges Russians to Free Two Fliers in the RB-47 Case," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Thompson, Khrushchev, Olmstead.'
      tags:
      - name:thompson-llewellyn-e
      - name:khrushchev-nikita-s
      - name:olmstead-freeman-b
      - polity:us
      - polity:ussr
