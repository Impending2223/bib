      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4 (Hammarskjold''s letter of Sept. 5). See [[cal.1960-08-20.congo-2]].'
