      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      also:
      - farm
      place: washington
      c: 'Nixon''s headquarters issues his letter to Senator John Sherman Cooper of Kentucky: the tobacco program, supports at 90 percent with strict production controls, "is the most successful of the price support programs for the basic farm crops"; "I wholly support the present tobacco program, and if elected President, I will recommend that it be continued without change"; for any improvements or technical modifications he will depend on "the recommendations of tobacco growers, tobacco-state farm organizations, and their representatives in Congress."'
      n: 'Russell Baker, "Nixon and Benson Get Wire Crossed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Nixon, John Sherman Cooper.'
      tags:
      - name:nixon-richard-m
      - name:cooper-john-sherman
      - state:ky
      follows:
