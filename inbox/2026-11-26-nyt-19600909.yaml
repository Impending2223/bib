    text: 'Check: the hour: the *Times*, Sept. 9, 1960, at 1, 16, has Kennedy''s speech-making day begin at 8:45 a.m. at Dunsmuir, against "six in the morning" in the line.'
- primary:
    id: cal.1960-09-08.elections-1960-kennedy-6
    text: W. H. Lawrence, "Kennedy Reverts to Old-Fashioned Whistle-Stop Tour in California," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 16 (the speech as prepared for delivery; the rally due at 9 p.m.).
- add-words:
    id: cal.1960-09-08.elections-1960-kennedy-6
    after: end
    words: 'In the text prepared for delivery he reiterates that the short post-convention Congressional session was not as injurious to the Democratic party as some said but an eye-opener that only Democratic leadership could produce progressive legislation, and makes medical care for the aged a top-priority issue; he refrains from direct attacks on Nixon while Nixon is in the hospital, but pokes fun at a "new" Republican party: "There is no new Republican party--and no old Republican party."'
    text: W. H. Lawrence, "Kennedy Reverts to Old-Fashioned Whistle-Stop Tour in California," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 16.
