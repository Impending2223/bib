      when: June 27
      date: '1960-06-27'
      thread: cuba
      c: Honduras sends a note to the United States protesting Washington's latest assertion of sovereignty over the Swan Islands. In a reply sent late in August, the United States said it was prepared to negotiate the question; Honduras was reported to be organizing a commission to send to Washington for the talks.
      n: '"American Radio in the Caribbean Counters Red Campaign in Cuba," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 2. Check: the day of the American reply, late August.'
