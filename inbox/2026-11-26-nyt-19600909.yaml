      c: Taipei. Nationalist China enacts a law to induce foreign capital, approved last week by the National Congress, superseding thirty older laws; it follows American advice and a 19-point American-sponsored plan for expansion.
      n: '"Taiwan Regime Woos Investors," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day of the approval and the body; the *Times* says "last week" and "National Congress". Names: none.'
      tags:
      - polity:roc
      - polity:us
- add:
    entry:
      id: cal.1960-09-09.cuba
      when: Sept. 9
      date: '1960-09-09'
      thread: cuba
      c: 'As the *Times* reports it: Radio Swan, a 50,000-watt American-owned station on Greater Swan Island, about 100 miles north of Honduras and under 400 miles from Cuba, is used to counter Communist propaganda in Cuba. It went on the air in May with test programs; in mid-June it went to two hours a day, and from next week will broadcast two hours each morning and three and a half hours in the evening, in Spanish and English. It is owned by the Gibraltar Steamship Company of New York. The State Department said June 1 the only station it knew of on Swan Island was a weather station. Honduras and the United States both claim the islands.'
      n: '"American Radio in the Caribbean Counters Red Campaign in Cuba," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 2. Names: Castro.'
      tags:
      - name:castro-fidel
      - polity:us
      - polity:cuba
      - polity:honduras
- add:
    entry:
      id: cal.1960-09-08.cuba
      when: By Sept. 8
      date: '1960-09-08'
      thread: cuba
      c: Radio Swan agrees with Walter S. Lemmon, president of the World Wide Broadcasting System, to tape and rebroadcast some of World Wide's programs to Latin America; a thirty-minute Spanish program on World Wide's short-wave station WRUL, Scituate, Mass., will be repeated by Radio Swan on medium wave an hour later. Programs will be largely news and interviews with Cuban exiles, many prepared in Miami by Pepita Riera, "Havana Rose."
      n: '"American Radio in the Caribbean Counters Red Campaign in Cuba," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 2. Check: the day of the agreement; the *Times* gives no day. See [[cal.1960-09-08.cuba]]. Names: Lemmon.'
      tags:
      - polity:us
      - state:ma
      - city:miami
