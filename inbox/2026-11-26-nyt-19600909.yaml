      id: cal.1960-08-30.latin-america-dominican-republic
      when: Aug. 30–31
      date: '1960-08-30'
      thread: latin-america-dominican-republic
      place: santo-domingo
      c: Ciudad Trujillo, the Villa Consuelo district. Free-for-alls through the night of Aug. 30; by 8:30 a.m. Aug. 31, gang fights, more than 300 Trujillistas against more than 100 adherents of the Dominican People's Movement, with sticks, clubs, stones and knives. 22 of the movement and 28 Trujillistas hospitalized; the movement routed, its headquarters sacked. Part of the mob sacks the headquarters of the Quisqueyano party and the home of its president, Dr. Ramón Gonzales de León, burning goods valued at $12,600; the national police do not intervene; secret police informers take part. Libertad, the movement's organ, last sold Aug. 30; its press smashed by rioters Aug. 31.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). The time is the first day''s. Check: the day of the gang fights, Aug. 31 by the article''s sequence.'
      tags: []
      time_range:
      - 1960-08-31T03:00Z
      - 1960-08-31T05:00Z
      time_band: night
      time_zone: America/Santo_Domingo
