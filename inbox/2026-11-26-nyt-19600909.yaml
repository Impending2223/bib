    id: cal.1960-09-08.space
    item: Felix Belair Jr., "Eisenhower Terms Soviet Space Work 'Soulless, Barren'," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 8 (the dedication at Huntsville and von Braun as director of the center; not July 1).
- add-words:
    id: cal.1960-09-08.space
    after: end
    words: About 10,000 workers hear him; Mrs. George C. Marshall unveils a bust of Marshall a few minutes earlier. The nation's space achievements, he says, are the outgrowth not of "a soulless, barren technology, nor of a grasping state imperialism" but of "unrestrained human talent and energy."
    item: Felix Belair Jr., "Eisenhower Terms Soviet Space Work 'Soulless, Barren'," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 8.
