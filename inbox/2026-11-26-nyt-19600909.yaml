      when: Aug., after the San José vote
      date: 1960-08
      thread: latin-america-dominican-republic
      c: Balaguer, after the foreign ministers' vote at San José, recalls the Dominican delegation and organizes mass demonstrations to welcome it with an orderly protest against the OAS sanctions.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day. See [[cal.1960-08-16.latin-america]]. Names: Balaguer.'
