    entry:
      id: cal.1960-09-08.europe-and-the-alliance-federal-republic
      when: Sept. 8
      date: '1960-09-08'
      thread: europe-and-the-alliance-federal-republic
      place: london
      c: London. Franz Josef Strauss, West German Defense Minister, confers with Harold Watkinson, British Defence Minister, on joint development and production of military equipment for NATO; Strauss returns to Bonn after the talks.
      n: '"Joint NATO Arms Discussed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Strauss.'
      tags:
      - name:strauss-franz-josef
      - polity:frg
      - polity:uk
      - polity:nato
- add:
    entry:
      id: cal.1960-09-08.europe-and-the-alliance
      when: Sept. 8
      date: '1960-09-08'
      thread: europe-and-the-alliance
      also:
      - soviet-union-un
      place: washington
      c: 'Washington. Herter, in an address to editors and publishers of United Press International, indirectly replies to de Gaulle''s news conference of Monday: revision of NATO is rejected, and integration is essential. He calls Khrushchev''s bid for a summit meeting at the UN "ludicrous in the extreme." The President may speak at the opening of the General Assembly, Sept. 20.'
      n: 'Dana Adams Schmidt, "Revision of NATO Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). E. W. Kenworthy, "Herter Ridicules a Summit in U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Herter, de Gaulle, Khrushchev.'
      tags:
      - name:herter-christian-a
