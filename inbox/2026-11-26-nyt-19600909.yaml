    words: 'Wang brings back his Government''s answer to the American proposal for an exchange of newsmen: unacceptable; he offers a proposal of his own, whose preamble says the exchange would "seek to eliminate estrangement between the Chinese and American peoples," make "preliminary improvement in the present relations," and settle peacefully the question of withdrawal of all United States armed forces from Taiwan; Peking asks a guarantee in advance that none of its chosen reporters will be refused entry. Jacob D. Beam speaks for the United States. The next meeting is set for Oct. 18.'
