- add:
    entry:
      id: cal.1960-09-08.congo-7
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: 'United Nations. Hammarskjold sends Belgium a note verbale: "Confirmed reports have been received to the effect that a cargo of weapons, marked ''Belgian weapons'' or something similar, the weight of which is estimated at nine tons, was unloaded at Elisabethville Airport yesterday from a DC-7 civil aircraft of the Sabena Airlines." He asks whether the Belgian Government sent or authorized it; if so, he "would consider it necessary to make a formal serious protest against the delivery, which is contrary to the letter and spirit of the Security Council resolution of 22 July 1960," binding under Articles 25 and 49. His third reproof to Belgium.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4 (the addendum, the note verbale of Sept. 8); Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. See [[cal.1960-09-07.congo-6]]. Names: Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-08.congo-8
      when: Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: 'United Nations. Yugoslavia asks an immediate meeting of the Security Council on the Congo, a few hours after the fourth report; its note, delivered that morning by Dobrivoje Vidic: "new and very serious difficulties have arisen" through the Lumumba–Kasavubu conflict, from outside interference and "an organized action" for the secessionists Tshombe and Kalonji, with military equipment and instructors, "facilitated" by the practices of the UN command; the Council to "take measures which would finally insure full implementation" of its resolutions.'
      n: 'Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. Names: Vidic, Hammarskjöld, Tshombe.'
      tags:
      - name:vidic-dobrivoje
      - name:tshombe-moise
      - polity:un
      - polity:yugoslavia
      time_range:
      - 1960-09-08T10:00Z
      - 1960-09-08T16:00Z
      time_band: morning
      time_zone: America/New_York
      follows:
      - cal.1960-09-08.congo
- add:
    entry:
      id: cal.1960-09-08.congo-9
      when: By Sept. 8
      date: '1960-09-08'
      thread: congo
      place: nyc
      c: United Nations. The UN makes public a cablegram from Lumumba inviting the Security Council to hold its next meeting in Léopoldville, under the Charter's allowance for meetings away from the seat of the organization, so that the members can see "the situation existing in the Republic of the Congo as a result of the United Nations' interference in the Congo's domestic problems."
      n: 'Lindesay Parrott, "U.N. Chief Queries Belgium on Arms," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 4. Check: the day of the cablegram. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
      - polity:un
- add:
    entry:
      id: cal.1960-09-04.congo
      when: Sept. 4
      date: '1960-09-04'
      thread: congo
      place: nyc
      c: 'New York. Walter Loridan, Belgium''s permanent representative at the UN, writes the Secretary General on the delay in the evacuation of Belgian troops, in reply to his note of Aug. 30: the relief by UN units was settled between Generals von Horn and Gheysen on Aug. 13, ordered Aug. 14, and not carried out to the timetable; the company at Elisabethville, due to leave Aug. 30, left for Kamina and was held there to Aug. 31 and Sept. 1 by a USAF rescue operation at Kano; the paratroop battalion at Kamina, training for Ruanda, waited on the railway companies; the men left for police and fire duties stayed with the consent of the UN command.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4. See [[cal.1960-08-30.congo]].'
      tags:
      - polity:belgium
      - polity:un
      - ok:name-untagged
- add:
    entry:
      id: cal.1960-09-04.congo-2
      when: Sept. 4
      date: '1960-09-04'
      thread: congo
      place: nyc
      c: 'Hammarskjold to Wigny, Belgian Foreign Minister, by cable, on the Kitona base: its commander has no instructions but to give logistic support to the UN; 650 Belgians are there and at Banana, all combatants; two gunboats at the Banana naval base. Five days after the period Belgium set for withdrawal, he must correct his report to the Council of Sept. 1 as incomplete; he reiterates his formal protest at the delay and at the erroneous information, and his keen personal disappointment.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4. See [[cal.1960-09-04.congo-3]]. Names: Hammarskjöld, Wigny.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
      follows:
      - cal.1960-09-04.congo-3
- add:
    entry:
      id: cal.1960-09-05.congo-5
      when: Sept. 5
      date: '1960-09-05'
      thread: congo
      c: 'Wigny, Belgian Foreign Minister, to Hammarskjold, by cable: he has examined the message personally and will send a precise reply within a few hours.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4. See [[cal.1960-09-04.congo-2]]. Names: Wigny, Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-05.congo-6
      when: Sept. 5
      date: '1960-09-05'
      thread: congo
      c: 'Hammarskjold to Loridan, on Belgium''s letter of Sept. 4: the relief arrangements of Aug. 13 and 14 were never approved by him; Belgium''s assurance of Aug. 20, withdrawal within eight days, and its letter of Aug. 24, the period to end at 2400 hours Aug. 29, named no such plans and made no condition of UN relief; Gheysen''s conditions of Aug. 24 were refused; after Aug. 24 no sign of delay, and daily assurances; the UN''s air evacuation of the Kamina battalion failed because the Belgians insisted on Usumbura.'
      n: '"Text of New Notes at U.N. on the Congo," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 4. See [[cal.1960-09-04.congo]]. Names: Hammarskjöld.'
      tags:
      - name:hammarskjold-dag
      - polity:belgium
      - polity:un
- add:
    entry:
      id: cal.1960-09-08.soviet-union-un-2
      when: Sept. 8
      date: '1960-09-08'
      thread: soviet-union-un
      also:
      - congo
      - africa
      place: moscow
      c: 'Moscow. Sékou Touré of Guinea and Khrushchev sign a joint communiqué: Touré will join Khrushchev at the UN to support Soviet efforts to "get the aggressive forces out of the Congo"; each will head his country''s delegation; there is a possibility of raising African "national independence" among the heads of government at the session.'
      n: 'Osgood Caruthers, "Toure to Support Khrushchev in U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Touré, Khrushchev.'
      tags:
      - name:toure-ahmed-sekou
      - name:khrushchev-nikita-s
      - polity:guinea
      - polity:ussr
      time_range:
      - 1960-09-08T16:00Z
      - 1960-09-08T19:00Z
