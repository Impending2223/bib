      thread: korea
      place: seoul
      c: Seoul. Ten members of South Korea's Cabinet, formed 16 days earlier, threaten in a statement to resign en masse. Premier John M. Chang asks President Yun Po-sun and House Speaker Kwak San Ghun to mediate.
      n: '"Korean Cabinet Rebels," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Chang, Yun Po-sun.'
