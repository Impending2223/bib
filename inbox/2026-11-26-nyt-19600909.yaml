    entry:
      id: cal.1960-08.latin-america-dominican-republic-2
      when: Aug., after the 23rd
      date: 1960-08
      thread: latin-america-dominican-republic
      c: Herrera Báez, with the President and the Cabinet, prepares a temperate report to the National Congress, to open a strong, dignified fight on the San José resolution.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day. See [[cal.1960-08-23.latin-america-dominican-republic]].'
      tags:
      - ok:name-untagged
      at: after 1960-08-23
- add:
    entry:
      id: cal.1960-08.latin-america-dominican-republic-3
      when: Aug., after the 23rd
      date: 1960-08
      thread: latin-america-dominican-republic
      c: 'Radio Caribe, an all-wave station controlled by a private group, organ of the extreme nationalist faction of Trujillo''s Dominican party: first it calls on Trujillo to assume the Presidency at once as the answer to the San José resolution; then it denounces the Cabinet for its silence on the sanctions and on that call; then it demands that Trujillo take the Presidency and say whether he would steer the country on an extreme nationalist course.'
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the days. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
      at: after 1960-08-23
- add:
    entry:
      id: cal.1960-09-09.latin-america-dominican-republic-3
      when: By Sept. 9
      date: '1960-09-09'
      thread: latin-america-dominican-republic
      c: First the Cabinet, then President Balaguer, write to Radio Caribe to praise its initiative and support its stand on the Presidency; Balaguer says he would have resigned but that Trujillo was not disposed to accept the call. He and the moderate leaders are silent on an extreme nationalist course seeking an understanding with Castro and the Soviet Union.
      n: 'Will Lissner, "Dominican Turn to Left Feared," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day. See [[cal.1960-08.latin-america-dominican-republic-3]]. Names: Balaguer, Trujillo, Castro.'
      tags:
      - name:balaguer-joaquin-videla
      - name:trujillo-rafael
      - name:castro-fidel
- add:
