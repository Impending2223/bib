- add:
    entry:
      id: cal.1960-09-10.defense
      when: Sept. 10
      date: '1960-09-10'
      thread: defense
      place: colorado-springs
      c: 'Operation Sky Shield, a North American Air Defense Command test: all commercial and private flights in the United States and Canada grounded six hours, 2 to 8 a.m., some 1,000 commercial flights and 37,000 passengers, 700 private planes, 310 Canadian flights; some 2,000 sorties of American and Canadian interceptors against Strategic Air Command bombers. Gen. Laurence S. Kuter directs it from NORAD headquarters, Colorado Springs; Gen. Thomas S. Power, of Strategic Air Command, or one of his assistants, aloft.'
      n: '"Air Defense Test Is Set Tomorrow," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the test as held. See [[cal.1960-07-25.defense]]. Names: Kuter, Power. Check: whose clock the hours are.'
      tags:
      - name:kuter-laurence-s
      - name:power-thomas-s
      - polity:us
      - polity:canada
      time_range:
      - 1960-09-10T08:00Z
