- add:
    entry:
      id: cal.1960-09-02.elections-1960-religion
      when: Sept. 2–8
      date: '1960-09-02'
      thread: elections-1960-religion
      place: washington
      c: 'Washington. The Democratic campaign organization begins distributing to party workers across the country, and to individuals and organizations that write in, a memorandum on Kennedy''s position on church and state: answers to the questions "frequently asked by fair-minded persons," made up of quotations from Kennedy''s speeches, including his acceptance speech at Los Angeles, magazine articles, interviews, the Constitution and the congressional oath. It takes up separation of church and state, an Ambassador to the Vatican, aid to parochial schools, birth control, the Roman Catholic Church''s position, and the Knights of Columbus oath. It adds nothing new on his position; the Times prints the text.'
      n: 'John W. Finney, "Democrats Issue Paper on Religion," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 14. "Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (the text, with the Democratic National Committee named as its circulator). Check: the day the distribution began; the *Times* says "last Friday", Sept. 2. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-09-08.elections-1960-religion-3
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-religion
      place: washington
      c: Washington. The Kennedy campaign organization chooses for the moment to ignore the statement of the National Conference of Citizens for Religious Freedom, headed by Peale, and plans no particular counter-attack. An aide to Nixon, commenting on the Peale group's statement, repeats the Vice President's position that the religious issue has no place in the Presidential campaign.
      n: 'John W. Finney, "Democrats Issue Paper on Religion," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 14. See [[cal.1960-09-07.elections-1960]]. Names: Peale, Nixon.'
      tags:
      - name:peale-norman-vincent
      - name:nixon-richard-m
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-09-08.elections-1960-kennedy-16
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-kennedy
      also:
      - conservation
      c: 'On the campaign train in California. Kennedy: "I would like to make it clear that when the people put their shoulders to the development of great dams, then I think the power should be distributed in a way that benefits the people. I don''t think the people should pay for irrigation and have the power distributed by a private company. I think the people should benefit." He takes a stand for public power in Federal hydroelectric projects, loudly applauded, and says such policies have been abandoned by the Eisenhower Administration; the two New Yorkers who contributed most to Western resources development were Theodore and Franklin D. Roosevelt, and he urges a return to their policies and a reversal of the "no new starts" conservation cutback.'
      n: 'W. H. Lawrence, "Kennedy Reverts to Old-Fashioned Whistle-Stop Tour in California," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 16. Check: the stop; the *Times* gives none for the remarks. Names: Kennedy, Eisenhower.'
      tags:
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - state:ca
- add:
    entry:
      id: cal.1960-09-08.elections-1960-nixon-3
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      also:
      - farm
      place: washington
      c: Washington. Benson, appearing before a conference of United Press International editors and publishers, says he will take "a very active part" in the campaign for the Nixon–Lodge ticket, and in answer to questions that it is time for the 90 percent price-support level on tobacco to be broken and for acreage to be expanded so that the country can regain its position in the world market.
      n: 'Russell Baker, "Nixon and Benson Get Wire Crossed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Benson.'
      tags:
      - name:benson-ezra-taft
      - polity:us
- add:
    entry:
      id: cal.1960-09-08.elections-1960-nixon-4
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      also:
      - farm
      place: washington
      c: 'Nixon''s headquarters issues a letter from Nixon to Senator John Sherman Cooper of Kentucky: the present tobacco program, with supports at 90 percent and strict production controls, "is the most successful of the price support programs for the basic farm crops"; "I wholly support the present tobacco program, and if elected President, I will recommend that it be continued without change," depending on the recommendations of tobacco growers, tobacco-State farm organizations and their representatives in Congress for any technical modifications.'
      n: 'Russell Baker, "Nixon and Benson Get Wire Crossed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Nixon, John Sherman Cooper.'
      tags:
      - name:nixon-richard-m
      - name:cooper-john-sherman
      - state:ky
      follows:
      - cal.1960-09-08.elections-1960-nixon-3
