- add:
    entry:
      id: cal.1960-09-08.china-3
      when: By Sept. 8
      date: '1960-09-08'
      thread: china
      place: washington
      c: 'Washington. The State Department makes public a statement on the Warsaw talks: it is "reluctantly compelled to conclude that Communist China, whatever its reason may be, has no serious interest either in reporting by its own newsmen from the United States or reporting by American newsmen from the China mainland." The American proposal, made three months earlier, was for each government to accept the other''s newsmen on "equality and reciprocity." One official calls the Chinese reply "the most cynical statement of China''s attitude in a long time." Officials say the Chinese preamble would commit the United States to negotiate the withdrawal of its forces from Taiwan, a reversal of policy meant to shatter confidence in Chiang Kai-shek.'
      n: '"Deal With Peiping Rejected by U.S.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day of the statement. See [[cal.1960-09-06.china-3]]. Names: Chiang Kai-shek.'
      tags:
      - polity:us
      - polity:prc
      - name:chiang-kai-shek
- add:
