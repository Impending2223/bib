      time_band: predawn
      time_zone: America/Denver
- add:
    entry:
      id: cal.1960-09-08.antisubversion
      when: Sept. 8
      date: '1960-09-08'
      thread: antisubversion
      place: washington
      c: 'Washington. Walter, at a news conference: he is writing to Kilday, head of a subcommittee appointed by Vinson of the Armed Services Committee, offering his co-operation in its inquiry into the defectors Mitchell and Martin; he will continue his own, with a hearing set for Sept. 16, and says in his letter where he thinks the committees'' jurisdictions lie. Martin and Mitchell were known to acquaintances as "sex deviates," he says, which he heard "from a source in which I have great confidence." Senate leaders, not to be quoted, stress confidence in the quiet inquiry of Russell''s Armed Services Committee.'
      n: 'Jack Raymond, "House Units Map Defector Studies," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-08-29.antisubversion]]. Names: Walter, Kilday, Vinson, Russell, Mitchell, Martin.'
      tags:
      - name:walter-francis-e
      - name:kilday-paul-j
      - name:vinson-carl
      - name:russell-richard-b
- add:
    entry:
      id: cal.1960-09-08.labor
      when: Sept. 8
      date: '1960-09-08'
      thread: labor
      place: washington
      c: Washington. McClellan announces that the Senate Investigations subcommittee has abandoned its plans for rackets hearings the next week, citing "the difficulties of holding such hearings during an election campaign year"; a new date when he can "make arrangements for a quorum of the subcommittee."
      n: '"M''Clellan Inquiry Off," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: McClellan.'
      tags:
      - name:mcclellan-john-l
- add:
    entry:
      id: cal.1960-09-08.elections-1960-nixon
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      place: houston
      c: 'Houston. Wright Morrow, a Houston lawyer and former Democratic National Committeeman from Texas, endorses Nixon: "I am convinced the election of Richard Nixon and Henry Cabot Lodge would be in the best interests of the people of our country."'
      n: '"Texan Endorses Nixon," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Nixon, Lodge.'
      tags:
      - name:nixon-richard-m
      - name:lodge-henry-cabot
      - state:tx
      - city:houston
- add:
    entry:
      id: cal.1960-09-08.press-and-broadcasting
      when: Sept. 8
      date: '1960-09-08'
      thread: press-and-broadcasting
      place: washington
      c: Washington. Senator Yarborough asks the public to "be the jury" and tell his subcommittee on freedom of communications of unfair handling of political broadcasts on radio and television; the subcommittee had asked the Senate for $150,000, with no action before Congress adjourned.
      n: '"Senator Enlists Public," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Ralph Yarborough.'
      tags:
      - name:yarborough-ralph
- add:
    entry:
      id: cal.1960-09-08.opinion
      when: Sept. 8
      date: '1960-09-08'
      thread: opinion
      place: richmond
      c: 'Richmond. A telephone poll of 402 persons by the research department of Richmond Newspapers Inc., reported here: Nixon 40 percent, Kennedy 25, undecided 35; of the undecided, 7 lean to Nixon, 9 to Kennedy. Women 38 to 23, men 43 to 27.'
      n: '"Richmond Favoring Nixon, Survey Finds," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Nixon, Kennedy.'
      tags:
      - state:va
      - city:richmond
      - name:nixon-richard-m
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1960-09-08.cities-and-housing
      when: Sept. 8
      date: '1960-09-08'
      thread: cities-and-housing
      place: nyc
      c: 'New York, the Statler Hilton Hotel. Mayor Robert F. Wagner, to some 300 persons at the opening session of the American Political Science Association''s annual meeting: the Eisenhower Administration has failed in its responsibilities toward the growing cities, which face urgent demands for housing, schools, highways, hospitals and recreational and industrial facilities without the resources to meet them; only the Federal Government can provide enough money. He praises the Democratic platform''s promise of a Cabinet post for urban affairs: "the farmer got his seat at that [Cabinet] table ninety-eight years ago. It is high time that today''s 120,000,000 urbanites sit down as well." He offers the city to the political scientists as "a living laboratory."'
      n: 'Kennett Love, "Wagner Charges Neglect of Cities," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Wagner.'
      tags:
      - name:wagner-robert-f-jr
      - state:ny
      - city:new-york
- add:
    entry:
      id: cal.1960-09-08.elections-1960-2
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960
      place: nyc
      c: 'New York, the Statler Hilton Hotel. Charles Burton Marshall, of the Washington Center of Foreign Policy Research and formerly of the State Department''s policy-planning staff, to the American Political Science Association: whoever is chosen President, the election will mark a turning away from "gerontocracy," or government by an old man.'
      n: 'Kennett Love, "Wagner Charges Neglect of Cities," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the day; the *Times* gives it with Wagner''s address at the same meeting. See [[cal.1960-09-08.cities-and-housing]].'
      tags:
      - state:ny
      - city:new-york
      - ok:name-untagged
- add:
    entry:
      id: cal.1960-09-08.elections-1960-nixon-2
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-nixon
      place: worcester
      c: 'Worcester, Mass. Lodge opens a two-day swing through Massachusetts, billed as a nonpolitical homecoming after his retirement as United States delegate to the UN. Police estimate 1,000 at City Hall, where acting Mayor Andrew B. Holmstrom gives Lodge and Senator Leverett Saltonstall the keys to the city, and more than 2,500 at a hotel reception. Lodge: "I''m not fat-headed enough to think it''s for me personally ... You are saying that you approve of the course which the United States has followed in the United Nations."'
      n: 'Peter Kihss, "Lodge Is on Swing in Massachusetts," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Lodge, Saltonstall.'
      tags:
      - name:lodge-henry-cabot
      - name:saltonstall-leverett
      - state:ma
      - city:worcester
- add:
    entry:
      id: cal.1960-09-08.elections-1960-kennedy-11
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-kennedy
      also:
      - elections-1960-religion
      place: atlanta
      c: 'Atlanta, the Dinkler Plaza Hotel. A one-day Democratic strategy meeting of party leaders from Virginia, the Carolinas, Georgia and Florida, with Robert F. Kennedy. Kennedy, to newsmen, questions the motives of Peale and the Rev. Dr. Daniel Poling, who joined in the statement of concern over John F. Kennedy''s religious faith: "Their close relationship with Mr. Nixon and the Republican party in the election leads me to question the sincerity of their statement and their judgment in issuing it." Governor Almond of Virginia, at the session, still holds that Nixon is capitalizing on the issue through innuendo.'
      n: 'Claude Sitton, "Peale Is Criticized," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-07.elections-1960-kennedy-6]]. Names: Robert Kennedy, Peale, Kennedy, Nixon.'
