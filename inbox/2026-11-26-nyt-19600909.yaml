      when: Sept. 7
      date: '1960-09-07'
      thread: soviet-union
      place: moscow
      c: Moscow. Khrushchev, in exchanges with Ambassador Thompson, insists that the Soviet Government intends to press the RB-47 case before the General Assembly.
