      thread: defense
      place: colorado-springs
      c: 'Operation Sky Shield, a North American Air Defense Command test: all commercial and private flights in the United States and Canada are to be grounded for six hours, 2 to 8 a.m., some 1,000 commercial flights and 37,000 passengers, against 2,000 defense sorties; Gen. Laurence S. Kuter directs it from NORAD headquarters, Colorado Springs, and Gen. Thomas S. Power, of Strategic Air Command, is to be aloft. NORAD announced it July 25.'
      n: '"Air Defense Test Is Set Tomorrow," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Check: the test as held. Names: Kuter, Power.'
