      place: washington
      c: Washington. Benson, appearing before a conference of United Press International editors and publishers, says he will take "a very active part" in the campaign for the Nixon–Lodge ticket, and in answer to questions that it is time for the 90 percent price-support level on tobacco to be broken and for acreage to be expanded so that the country can regain its position in the world market.
      n: 'Russell Baker, "Nixon and Benson Get Wire Crossed," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Benson.'
      tags:
      - name:benson-ezra-taft
