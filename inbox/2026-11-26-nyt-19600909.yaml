      time_zone: America/New_York
- add:
    entry:
      id: cal.1960-09-08.elections-1960-kennedy-14
      when: Sept. 8
      date: '1960-09-08'
      thread: elections-1960-kennedy
      place: boston
      c: 'Boston, Symphony Hall. Johnson, at a political rally, in his first full-dress speech of the campaign: he presents himself as dedicated to the interests of the whole nation and, as Kennedy had done, names foreign policy the number one issue, "the overriding issue" of the campaign. He strikes hardest at "the deterioration of this nation''s position in the world"; Republican campaigners "must give the American people an accounting," and the Republican Administration is "a symbol of inertia and indifference to the full time labors of American leadership." He promises a government of "vitality and decisiveness" if Kennedy is elected.'
      n: 'John D. Morris, "Johnson''s Drive Opens in Boston," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Johnson, Kennedy.'
      tags:
      - name:johnson-lyndon-b
