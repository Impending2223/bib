      id: cal.1960-09-08.latin-america-dominican-republic-2
      when: Sept. 8
      date: '1960-09-08'
      thread: latin-america-dominican-republic
      also:
      - united-nations
      - soviet-union
      place: nyc
      c: 'United Nations. The Security Council debates the Soviet request that it approve the OAS sanctions of Aug. 20 against the Trujillo regime. Kuznetsov, under Article 53 of the Charter, revises the Soviet draft to drop its references to the sanctions, while calling the Trujillo Government "a regime of tyranny, corruption and assassination." Wadsworth: no Council endorsement is required, only a report under Article 54; the American republics reject the attempts of Communist China and the Soviet Union to "make use of the political, economic or social situations of any American state." Tsiang of Nationalist China: approval would "expose to the Soviet veto" any regional decision. Argentina (Amadeo), Venezuela (Sosa-Rodriguez) and Britain (Beeley) also speak. The Dominican delegation under Enrique de Marchena watches from the public gallery and takes no seat at the Council table.'
      n: 'Kathleen Teltsch, "Soviet O.A.S. Role Is Opposed at U.N.," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 3; "Excerpts From U.N. Council Debate on Trujillo Regime in Dominican Republic," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 2 (the speeches of Kuznetsov, Amadeo, Wadsworth, Sosa-Rodriguez and Beeley; Beeley''s "this afternoon"). To check: the Security Council''s record, Sept. 8, 1960. See [[cal.1960-08-16.latin-america]]. Names: Kuznetsov, Wadsworth.'
      tags:
      - name:kuznetsov-vasily-v
