      date: '1960-09-08'
      thread: elections-1960-religion
      place: washington
      c: 'Washington. Keating, in a recorded radio interview: the Democrats, not the Republicans, are injecting religion into the Presidential race. "They seem to think it will do them some good to keep talking about this religious issue."'
      n: '"Kennedy Group Cited," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Keating.'
