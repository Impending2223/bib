    entry:
      id: cal.1960-09-07.soviet-union
      when: Sept. 7
      date: '1960-09-07'
      thread: soviet-union
      place: moscow
      c: Moscow, at a reception. Khrushchev, in exchanges with Ambassador Thompson, insists that the Soviet Government means to press the RB-47 case before the General Assembly; when he complains of American flights near the Soviet Union, Thompson suggests the reception is not the place for Soviet–American differences.
      n: 'Seymour Topping, "U.S. Urges Russians to Free Two Fliers in the RB-47 Case," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Khrushchev, Thompson.'
