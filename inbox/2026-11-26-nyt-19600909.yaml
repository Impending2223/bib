      when: Sept. 9
      date: '1960-09-09'
      thread: berlin-and-vienna
      c: 'As the *Times* reports it: the Soviet commander in Berlin has not yet answered the protest sent last week by the three Western commanders over the five-day East German traffic curbs, Aug. 31 to Sept. 4.'
      n: '"German Reds Put a Continuing Curb on Berlin Travel," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 1, 7.'
