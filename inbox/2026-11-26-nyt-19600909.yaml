    entry:
      id: cal.1960-09-09.africa-algeria-morocco
      when: Sept. 9
      date: '1960-09-09'
      thread: africa-algeria-morocco
      c: 'As the *Times* reports it: a project to merge the Government of Tunisia and the rebel Provisional Government of Algeria has been reported by observers in Tunis, after Bourguiba''s statement that he was ready to "link his fate" with Algeria; conversations said to have gone on almost a month; some reports of a common Algerian–Tunisian government, one part free and one occupied; the passage of foreign troops, such as Chinese Communists, across Tunisia into Algeria said to be under consideration by the Tunisian Government.'
      n: 'Henry Giniger, "Algerian Link-Up to Tunisia Hinted," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). See [[cal.1960-09-06.africa-algeria-morocco]]. Names: Bourguiba.'
      tags:
      - name:bourguiba-habib-ben-ali
