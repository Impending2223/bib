      when: By Aug. 22
      date: '1960-08-22'
      thread: elections-1960-religion
      c: The fake Knights of Columbus oath, a vow of war against Protestants and Masons, turns up in scattered cities and towns, mostly in the South, passed from hand to hand and sent anonymously through the mails; clergymen have quoted it in sermons, and it is printed in newsletters of Southern Baptist churches in Rainelle, W. Va., Phoenix, Greensboro, N.C., and Knoxville.
      n: '"Text of Democratic Memorandum on Religion as Election Issue," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html), at 15 (quoting *Time*, Aug. 22, 1960, at 15). Check: the day. Names: Kennedy.'
