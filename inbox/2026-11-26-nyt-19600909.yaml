      thread: elections-1960-kennedy
      place: san-diego
      c: 'San Diego. Local Democratic leaders react bitterly to the cancellation of Kennedy''s noon rally there on Saturday, Sept. 10; Lloyd Winburn: "We''re disgusted"; the rally was set up at the request of the candidate''s advance men several weeks before.'
      n: '"Cancellation Irks Kennedy Backers," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html). Names: Kennedy.'
