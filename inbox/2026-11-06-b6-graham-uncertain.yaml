- add:
    entry:
      id: cal.1968-04.transition-and-staff
      when: Apr.
      date: 1968-04
      thread: transition-and-staff
      c: 'Johnson sets Califano and his staff to how best to found his school of public affairs beside his library at the
        University of Texas. Califano, Gaither and Levinson ask the advice of the deans of public affairs, Denny, Bailey,
        Price and Bernstein, and of Neustadt and Sterling, and report it: no meddling in the school''s academic or administrative
        matters; no faculty appointment, but perhaps as an occasional lecturer.'
      n: '[[w.graham-uncertain-triumph]], 189, 259 n.19. Check: the day. Names: Johnson, Califano, Levinson, Neustadt, Price.'
      tags:
