- add:
    entry:
      id: cal.1967-10-05.school-aid
      when: Oct. 5
      date: '1967-10-05'
      thread: school-aid
      c: 'R. C. Carlson of the Budget Bureau to Carey, by memorandum, on HEW''s education proposals. Carey''s words: an adult
        education program "recreational education for the middle class"; a telecommunications proposal "old-fashioned hogwash";
        detailed federal earmarks discourage State and local planning. Yet "We couldn''t lose anything—the programs are already
        lousy and we have failed in cut-backs."'
      n: '[[w.graham-uncertain-triumph]], 178 n.39. To check: Carlson to Carey, Oct. 5, 1967, container 413, OMB Records
        Division, National Archives (cited by [[w.graham-uncertain-triumph]], 178 n.39). See [[cal.1967-10-04.school-aid]].
        Names: Carey.'
      tags:
