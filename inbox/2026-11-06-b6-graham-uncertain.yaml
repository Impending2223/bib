    entry:
      id: cal.1961-04-12.school-aid
      when: Apr. 12
      date: '1961-04-12'
      thread: school-aid
      c: 'Sorensen to Kennedy, "administratively confidential," on the strategy: in public, a bill for public schools only;
        Ribicoff and Sorensen in secret with Bishop Hannan and Monsignors Tanner and Hurley of the NCWC. The administration
        to send uncontroversial revisions of the NDEA; in markup Clark and Morse to amend Title IV, section 305, private schools''
        loans to reach classrooms for science, mathematics, foreign languages, English, physical fitness and school lunches.
        "There was to be no mention or indication that the Administration had played any role or taken any position on this
        amendment or course of strategy."'
      n: '[[w.graham-uncertain-triumph]], 21. To check: Sorensen to Kennedy, Apr. 12, 1961, "Education and Religion" folder,
        Sorensen file, container 33, JFK Library (cited by [[w.graham-uncertain-triumph]], 21 n.55). See [[cal.1961-02-20.school-aid]].
        Names: Sorensen, Kennedy, Ribicoff, Clark, Morse.'
      tags:
