    id: cal.1963-06-25.republican-party
    base: '84117949'
    set:
      c: 'San Francisco, the Young Republican National Federation''s convention.{1} A session of twenty-two hours.{3} Its platform: the federal income tax abolished, the United States out of the United Nations, a "Court of the Union" over the Supreme Court, segregation kept.{6} The chairmanship: Lukens, Goldwater''s candidate, is declared elected over McDevitt.{7}'
    kind: reword
- cite:
    id: cal.1963-06-25.republican-party
    item: '[[w.kabaservice-rule-and-ruin]], 65'
    'on': 'The chairmanship: Lukens, Goldwater''s candidate, is declared elected over McDevitt.'
- cite:
    id: cal.1963-06-25.republican-party
    item: '[[w.white-suite-3505]], 171'
    'on': 'The chairmanship: Lukens, Goldwater''s candidate, is declared elected over McDevitt.'
- names:
