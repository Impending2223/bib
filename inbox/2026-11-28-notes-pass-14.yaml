- add-words:
    id: cal.1960-10-26.elections-1960-king
    after: Shriver, urged by Wofford, waits until the others have left Kennedy's room and proposes he telephone Coretta King.
    words: Sorensen has gone off to finish a speech, Salinger to see the press, O'Donnell to the bathroom.
    item: '[[w.wofford-of-kennedys-and-kings]], 18'
- add-words:
    id: cal.1960-10-26.elections-1960-king
    after: end
    words: 'Shriver to Wofford beforehand: "Jack doesn''t leave O''Hare for another forty minutes."'
