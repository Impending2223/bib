patch: notes-pass-14
by: 'Claude (reader; the notes pass, batch 14: R33a, building on the entry from its cites)'
ops:
- add-words:
    id: cal.1965-02-10.china-leadership-3
    after: end
    words: 'Peng Zhen 彭真 presides and speaks: China cannot ignore the U.S. bombing and strafing of the DRV''s towns and villages; the whole people to strengthen preparations on every front to support Vietnam and beat back U.S. war provocations.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 396'
- add-words:
    id: cal.1965-02-10.china-leadership-3
    after: end
    words: Liu Ningyi 刘宁一 speaks.
    item: '[[w.yang-shangkun-riji]], II, 508'
- add-words:
    id: cal.1965-02-10.china-leadership-3
    after: end
    words: Chen Yi 陈毅 attends, in the morning.
    item: '[[w.chen-yi-nianpu]], 1084'
- names:
    id: cal.1965-02-10.china-leadership-3
    add:
    - Peng Zhen
    - Liu Ningyi
    - Chen Yi
    tags:
    - name:peng-zhen
    - name:liu-ningyi
    - name:chen-yi
- add-words:
    id: cal.1965-01-26.china-leadership-3
    after: end
    words: 'More than 10,000 attend. Peng Zhen 彭真 speaks the welcome: Sukarno''s withdrawal from the United Nations, against its manipulation by U.S. imperialism, unsettles the imperialists and is cheered by the revolutionary peoples of Indonesia and the world.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 394'
- add-words:
    id: cal.1965-01-26.china-leadership-3
    after: end
    words: 'Chen Yi 陈毅 speaks, in the afternoon: Indonesia''s leaving the United Nations defends its own and all revolutionary peoples'' interests; if the United States forces war on Indonesia, China will not stand by.'
    item: '[[w.chen-yi-nianpu]], 1081–82'
- names:
    id: cal.1965-01-26.china-leadership-3
    add:
    - Peng Zhen
    - Chen Yi
    tags:
    - name:peng-zhen
    - name:chen-yi
- add-words:
    id: cal.1965-02-20.china-leadership-4
    after: end
    words: 'The meeting, of 10,000, also marks the China–Tanzania friendship treaty; Liu Shaoqi 刘少奇 attends. Peng Zhen 彭真 speaks: the Tanzanian people''s victory a glorious page in Africa''s anti-imperialist revolution; China firmly supports them.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 400'
- add-words:
    id: cal.1965-02-20.china-leadership-4
    after: end
    words: Chen Yi 陈毅 attends.
    item: '[[w.chen-yi-nianpu]], 1086'
- names:
    id: cal.1965-02-20.china-leadership-4
    add:
    - Liu Shaoqi
    - Peng Zhen
    - Chen Yi
    tags:
    - name:liu-shaoqi
    - name:peng-zhen
    - name:chen-yi
- add-words:
    id: cal.1965-03-05.china-leadership-4
    after: end
    words: 'The meeting is of 10,000. Peng Zhen 彭真 speaks: Asian and African countries, great or small, to respect one another and settle disputes on equal terms, without great-power chauvinism; of the U.S. air raids on the DRV three days before, however mad, the aggressors cannot escape defeat in Vietnam.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 404–05'
- add-words:
    id: cal.1965-03-05.china-leadership-4
    after: end
    words: Chen Yi 陈毅 attends.
    item: '[[w.chen-yi-nianpu]], 1088'
- names:
    id: cal.1965-03-05.china-leadership-4
    add:
