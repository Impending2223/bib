- add:
    entry:
      id: cal.1965-10-09.china-zhou-foreign
      when: Oct. 9
      date: '1965-10-09'
      time: 1965-10-09T08:00Z
      place: peking
      thread: china-zhou-foreign
      also:
      - vietnam-hanoi
      - soviet-union
      - china-foreign
      c: 'Peking, 4 p.m., the delegation''s third meeting before Moscow, Peng Zhen and Luo Ruiqing present. Zhou to Phạm Văn Đồng, as his own opinion and not the Central Committee''s: better without Soviet aid; he does not support Soviet volunteers for Vietnam; "we never think of selling out Vietnam. But we are always afraid of the revisionists standing between us." China has given Cambodia 28,000 weapons; Sihanouk would leave Phnom Penh for the countryside if war came.'
      n: '[[w.77-conversations-between-chinese]], [87–88](https://www.wilsoncenter.org/sites/default/files/media/documents/publication/ACFB39.pdf#page=85) (doc. 14; Beijing, 4 p.m., Oct. 9, 1965; 87 n.133, the third meeting). Made public: [[w.77-conversations-between-chinese]] (1998). See [[cal.1965-10-06.china-leadership]]. Names: Zhou Enlai, Phạm Văn Đồng, Peng Zhen, Luo Ruiqing, Sihanouk.'
      tags:
      - polity:prc
      - polity:drv
      - name:zhou-enlai
      - name:pham-van-dong
      - name:peng-zhen
      - name:luo-ruiqing
      - name:norodom-sihanouk
      time_zone: Asia/Shanghai
- add:
    entry:
      id: cal.1965-11-26.china-hai-rui
      when: Nov. 26
      date: '1965-11-26'
      place: shanghai
      thread: china-hai-rui
      also:
      - china-zhou
      c: 'Shanghai. Chen Pixian 陈丕显, the city''s Party secretary, asks Luo Ruiqing 罗瑞卿 to brief Zhou, come for Anna Louise Strong''s birthday, on Yao Wenyuan''s essay on *Hai Rui Dismissed from Office*: "the chairman has been quite unhappy about Beijing''s refusing to publish it in local papers."'
      n: '[[w.jian-zhou-enlai]], 530; [[w.pu-weihua-zalan-jiu-shijie]], 78 (by the Shanghai committee''s account of 1966: Luo at Shanghai Nov. 25 or 26; Chen first talks with Luo, Luo telephones Peng Zhen, Chen tells the Premier). To check: [[w.pixian-chen-pixian-huiyilu]], 34 (cited by [[w.jian-zhou-enlai]], 530 n.48b). Check: Pu Weihua, 78, has Luo at Shanghai Nov. 25 or 26. See [[cal.1965-11-26.china-leadership-2]]. Names: Chen Pixian, Luo Ruiqing, Zhou Enlai.'
      tags:
      - polity:prc
      - name:chen-pixian
      - name:luo-ruiqing
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
