      date: '1965-09-27'
      place: moscow
      thread: soviet-union-leadership
      c: Moscow, the plenum. Ustinov made a secretary of the Central Committee for armament, Kulakov for agriculture, at Brezhnev's wish.
      n: '[[w.schattenberg-brezhnev]], 175 ("at the September Plenum of 1965"). To check: RGANI, f. 2, op. 1, d. 787 (Protocol no. 12, Sept. 27–29, 1965), l. 17 (cited by [[w.schattenberg-brezhnev]], 175 n.29). Check: the day. See [[cal.1965-09-27.soviet-union-leadership]]. Names: Ustinov, Kulakov, Brezhnev.'
