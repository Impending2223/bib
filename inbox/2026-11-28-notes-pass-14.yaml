    after: end
    words: 'Peng Zhen 彭真 presides and speaks: China cannot ignore the U.S. bombing and strafing of the DRV''s towns and villages; the whole people to strengthen preparations on every front to support Vietnam and beat back U.S. war provocations.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 396'
- add-words:
