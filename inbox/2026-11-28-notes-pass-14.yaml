- add-words:
    id: cal.1965-01-26.china-leadership-3
    after: end
    words: 'More than 10,000 attend. Peng Zhen 彭真 speaks the welcome: Sukarno''s withdrawal from the United Nations, against its manipulation by U.S. imperialism, unsettles the imperialists and is cheered by the revolutionary peoples of Indonesia and the world.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 394'
- add-words:
    id: cal.1965-01-26.china-leadership-3
    after: end
    words: 'Chen Yi 陈毅 speaks, in the afternoon: Indonesia''s leaving the United Nations defends its own and all revolutionary peoples'' interests; if the United States forces war on Indonesia, China will not stand by.'
    item: '[[w.chen-yi-nianpu]], 1081–82'
- names:
    id: cal.1965-01-26.china-leadership-3
    add:
