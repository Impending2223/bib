    after: end
    words: 'The meeting is of 10,000. Peng Zhen 彭真 speaks: Asian and African countries, great or small, to respect one another and settle disputes on equal terms, without great-power chauvinism; of the U.S. air raids on the DRV three days before, however mad, the aggressors cannot escape defeat in Vietnam.'
