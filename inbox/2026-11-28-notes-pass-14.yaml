      when: Dec. 2
      date: '1965-12-02'
      thread: vietnam-pause
      also:
      - vietnam-force-levels
      c: 'McNamara to McGeorge Bundy: more than military increases; "some form of political action:—a pause, or a ceasefire, or action by the United Nations."'
      n: '[[w.gibbons-u-s-government-and]], IV, 116 (by Bundy''s notes; the emphasis in the original). To check: McGeorge Bundy, notes, Dec. 2, 1965, McGeorge Bundy Notes on Vietnam, LBJ Library (cited by [[w.gibbons-u-s-government-and]], IV, 116 n.11). See [[cal.1965-12-02.vietnam-pause]]. Names: McNamara, McGeorge Bundy.'
      tags:
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
