- add-words:
    id: cal.1965-02-20.china-leadership-4
    after: end
    words: 'The meeting, of 10,000, also marks the China–Tanzania friendship treaty; Liu Shaoqi 刘少奇 attends. Peng Zhen 彭真 speaks: the Tanzanian people''s victory a glorious page in Africa''s anti-imperialist revolution; China firmly supports them.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 400'
- add-words:
    id: cal.1965-02-20.china-leadership-4
    after: end
    words: Chen Yi 陈毅 attends.
