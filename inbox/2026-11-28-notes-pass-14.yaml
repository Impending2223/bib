      n: '[[w.zedong-mao-zedong-nianpu]], V, Jan. 6, 1966. [[w.jianguo-yilai-mao-zedong]], XVIII, 199 (Jan. 6, 1966; Mao''s note of 11 a.m., Jan. 6, on Kang Sheng''s and Wu Lengxi''s letter of Jan. 3 sending the Center''s draft reply to the CPSU letter of Nov. 28, 1965 (which attacked the *Renmin ribao*–*Hongqi* article of Nov. 11 on "united action"): "Very good. Best to hand it to the Soviet ambassador soon"; note 1: sent Jan. 7). Made public: 2013. To check: the CPSU letter of Nov. 28, 1965 and the Center''s reply of Jan. 7, 1966 (named by the nianpu, not printed in it); Kang Sheng and Wu Lengxi, letter to Mao Zedong of Jan. 3, 1966 sending the Center''s draft reply to the CPSU Central Committee''s letter of Nov. 28, 1965 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1a); CPSU Central Committee, letter to the Chinese Central Committee of Nov. 28, 1965, attacking the *Renmin ribao*–*Hongqi* editorial of Nov. 11 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1b); Central Committee of the Chinese Communist Party, reply to the CPSU Central Committee, Jan. 7, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1d). Split under R17: the reply''s sending, Jan. 7, and Kang Sheng''s and Wu Lengxi''s letter of Jan. 3 are entries of their own (Wengao, XVIII, 199 n.1). The hour: "一月六日上午十一时" (Wengao, XVIII, 199), 11 a.m., Peking''s clock. Names: Mao Zedong.'
