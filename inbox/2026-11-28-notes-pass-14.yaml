    words: 'More than 10,000 attend. Peng Zhen 彭真 speaks the welcome: Sukarno''s withdrawal from the United Nations, against its manipulation by U.S. imperialism, unsettles the imperialists and is cheered by the revolutionary peoples of Indonesia and the world.'
