- add-words:
    id: cal.1962-04.cuba-2
    after: end
    words: Harvey, on "explicit orders" from Helms by his testimony, asks Edwards to put him in touch with Rosselli; the Support Chief introduces them in Miami. Harvey tells Rosselli to keep his Cuban contacts but not to deal with Maheu or Giancana, "untrustworthy" and "surplus."
