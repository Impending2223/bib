      when: Nov. 27
      date: '1965-11-27'
      place: shanghai
      thread: china-zhou
      also:
      - china-hai-rui
      c: Shanghai. Zhou thanks Chen Pixian 陈丕显 when he sees him.
      n: '[[w.jian-zhou-enlai]], 530 ("the next day"). To check: [[w.pixian-chen-pixian-huiyilu]], 34 (cited by [[w.jian-zhou-enlai]], 530 n.48b). See [[cal.1965-11-26.china-hai-rui]]. Names: Zhou Enlai, Chen Pixian.'
      tags:
      - polity:prc
      - name:zhou-enlai
      - name:chen-pixian
      - vis:only:prc
- add:
    entry:
      id: cal.1965-11-27.china-luo-ruiqing
      when: Nov. 27
      date: '1965-11-27'
      thread: china-luo-ruiqing
      also:
      - china-army
      c: 'Li Zuopeng, deputy commander of the navy, with Wang Hongkun and Zhang Xiuchuan, writes for Lin Biao, on four questions Lin set, "The struggle of two lines of thought in the navy of late": over 7,000 characters; Luo Ruiqing "harbors a great plot" to seize the navy; aimed too at Xiao Jinguang and Su Zhenhua.'
      n: '[[w.pu-weihua-zalan-jiu-shijie]], 26 (關於近來海軍兩種思想鬥爭的情況; 11月27日; 七千多字). See [[cal.1965-12.china-leadership-4]]. Names: Li Zuopeng, Lin Biao, Luo Ruiqing, Su Zhenhua.'
      tags:
      - polity:prc
      - name:li-zuopeng
      - name:lin-biao
      - name:luo-ruiqing
      - name:su-zhenhua
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-03.china-polemic
      when: Jan. 3
      date: '1966-01-03'
      thread: china-polemic
      also:
      - soviet-union
      c: Kang Sheng 康生 and Wu Lengxi 吴冷西 send Mao the Center's draft reply to the CPSU Central Committee's letter of Nov. 28, 1965, which attacked the editorial departments' article of Nov. 11 on "united action."
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1. To check: Kang Sheng and Wu Lengxi, letter to Mao Zedong of Jan. 3, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1a). See [[cal.1966-01-06.china-leadership]]. Names: Kang Sheng, Wu Lengxi, Mao Zedong.'
      tags:
      - polity:prc
      - name:kang-sheng
      - name:wu-lengxi
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1966-01-07.china-polemic
      when: Jan. 7
      date: '1966-01-07'
      thread: china-polemic
      also:
      - soviet-union
      c: 'The Center''s reply to the CPSU Central Committee''s letter of Nov. 28, 1965 goes out: the Nov. 11 article had shown up the "united action" as a swindle and raised a series of major questions of principle.'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1 (the reply sent Jan. 7; the words: 揭穿了你们玩弄的所谓''联合行动''的骗局，提出了一系列重大的原则性问题). To check: Central Committee of the Chinese Communist Party, reply to the CPSU Central Committee, Jan. 7, 1966 (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 199 n.1d). See [[cal.1966-01-06.china-leadership]].'
      tags:
      - polity:prc
      - polity:ussr
      - vis:only:prc
- add:
    entry:
      id: cal.1967-05-24.middle-east-six-day-war-3
      when: May 24
      date: '1967-05-24'
      time: 1967-05-24T15:00Z
      place: washington
      thread: middle-east-six-day-war
      c: 'The State Department, 11 to 11:40 a.m. George Thomson, the British Minister of State for Foreign Affairs, to Rusk: the Cabinet''s decisions of the night before, a maritime declaration and a probing escort through the Strait of Tiran backed in the Eastern Mediterranean. Rusk: Congress must be with us before any shooting; his long session with Foreign Relations the day before; the two staffs to work out a plan with as many countries as possible.'
      n: '[FRUS 1964–68, XIX, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v19/d53) (the time from Rusk''s Appointment Book, by the source note). See [[cal.1967-05-23.middle-east-six-day-war]]. Names: Rusk.'
      tags:
      - name:rusk-dean
      time_zone: America/New_York
- add:
    entry:
      id: cal.1961-03-21.middle-east
      when: By Mar. 21
      date: '1961-03-21'
      thread: middle-east
      c: 'A telegram from Jidda: King Saud is pleased with the tenor of the State Department''s press release on the Dhahran announcement.'
      n: 'FRUS 1961–63, XVII, doc. [24](https://history.state.gov/historicaldocuments/frus1961-63v17/d24) (Battle to Dungan, Mar. 21, 1961: "A telegram has since been received from Jidda"). Check: the day. See [[cal.1961-03-16.middle-east-2]]. Names: Saud ibn Abd al-Aziz Al Saud.'
      tags:
      - name:saud-ibn-abd-al-aziz-al-saud
- add:
    entry:
