    entry:
      id: cal.1965-03-08.voting-rights-4
      when: Mar. 8
      date: '1965-03-08'
      place: washington
      thread: voting-rights
      also:
      - alabama
      c: 'Javits in the Senate, of Selma: "a disgraceful display of terror" yesterday against a peaceful march; the law, title 10, section 333, used at Little Rock, gives the President power to act: "the time has come to act."'
      n: '[111 Cong. Rec. 4310–11](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-2-1.pdf#page=39) (1965) (Mar. 8, 1965). [[w.bernstein-guns-or-butter]], 227–28 (Javits, Yarborough and Mondale denounce the attack on the floor). The Senate sat from noon to 5:30 p.m.: [Daily Digest, D92](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=90). See [[cal.1965-03-07.voting-rights]]. Names: Javits.'
      tags:
      - name:javits-jacob-k
      - state:al
      - city:selma
      time_range:
      - 1965-03-08T17:00Z
      - 1965-03-08T22:30Z
      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1965-03-09.voting-rights-selma-6
      when: Mar. 9
      date: '1965-03-09'
      place: selma
      thread: voting-rights-selma
      also:
      - king
      c: 'Selma, by Brown''s Chapel, before the march. Wofford, brought by Andrew Young, urges King to a protest short of defying the injunction, until Collins and Doar interrupt. Half an hour later King and Abernathy come out: "We march." King, to Wofford: "But we may not march very far."'
      n: '[[w.wofford-of-kennedys-and-kings]], 181–82 (Wofford''s account). See [[cal.1965-03-09.voting-rights-selma-3]]. Made public: [[w.wofford-of-kennedys-and-kings]] (1980). Names: Wofford, Andrew Young, Martin Luther King, Collins, Doar, Abernathy.'
      tags:
      - name:wofford-harris
      - name:young-andrew-j-jr
      - name:king-martin-luther-jr
      - name:collins-leroy
      - name:doar-john
      - name:abernathy-ralph-david
      - state:al
      - city:selma
- add:
    entry:
      id: cal.1965-03-11.china-mao-foreign
      when: Mar. 11
      date: '1965-03-11'
      thread: china-mao-foreign
      also:
      - soviet-union
      - china-foreign
      c: 'Mao reads the editorial departments'' draft article on the Moscow meeting, changes "small meeting" in its title to "meeting", and adds that the Soviet leaders took over slogans and the U.S. took over Khrushchev''s: peaceful coexistence, competition, transition, détente, disarmament, two powers ruling the world, joint aid to India, joint help to reactionaries, joint use of the UN, joint anti-China. He sends the revisions to Kang Sheng 康生: a few changes, "consider whether they can be used."'
      n: '[[w.jianguo-yilai-mao-zedong]], XVIII, 29–33 (Mar. 11, 1965; Mao''s note of Mar. 11 to Kang Sheng, 作了一点修改，请考虑是否可用; the title changed from "On the small meeting" to "On the Moscow splitting meeting"; the passage that the new leaders took over Khrushchev''s slogans and that U.S. imperialism took them over in turn, in his additions; the article printed Mar. 23); [[w.zedong-mao-zedong-nianpu]], V, Mar. 11, 1965; [[w.khoo-collateral-damage]], 22 (Mao''s careful editing of the press statements against the Soviet conference, by documents printed in 1996; not the day). Made public: 2013. To check: [[w.zedong-jianguo-yilai-mao-zedong]], XI, 346–350, 394–395 (cited by [[w.khoo-collateral-damage]], 22 n.78a); [[w.xie-yixian-zhongguo-dangdai-waijiaoshi]], 241–242 (cited by [[w.khoo-collateral-damage]], 22 n.78b). Split under R17 and R25b from [[cal.1965-03-11.china-leadership]], whose line had these acts "Beforehand." Names: Mao Zedong, Kang Sheng, Khrushchev.'
      tags:
      - name:mao-zedong
      - name:kang-sheng
      - name:khrushchev-nikita-s
      - polity:prc
      - vis:only:prc
      src:
        rows:
        - 'w.jianguo-yilai-mao-zedong XVIII, 29–33: all'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 31 n.1: all'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 32 n.1: all'
        - 'w.zedong-mao-zedong-nianpu V, Mar. 11, 1965: all'
        - 'w.khoo-collateral-damage 22: all'
- add:
    entry:
      id: cal.1965-04-26.latin-america-dominican-republic-3
      when: Apr. 26
      date: '1965-04-26'
      place: santo-domingo
      thread: latin-america-dominican-republic
      c: Santo Domingo, the civil war full-scale. For the evacuation the Constitutionalists agree that American helicopters may land at the Embajador Hotel and American ships dock at Haina.
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 138. See [[cal.1965-04-25.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1965-04-28.latin-america-dominican-republic-10
      when: Apr. 28
      date: '1965-04-28'
      time: 1965-04-28T20:40Z
      place: santo-domingo
      thread: latin-america-dominican-republic
      follows:
      - cal.1965-04-28.latin-america
      c: 'Santo Domingo, 2040Z. Ambassador Bennett''s Critic 5: the Country Team unanimous, now that the junta has asked for help, that the "time has come to land the Marines. American lives are in danger." Bennett recommends an immediate landing, a beachhead near the Hotel Embajador centered on the polo field, and a detachment for the embassy grounds.'
      n: '[FRUS 1964–68, XXXII, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v32/d32) (2040Z; the copy repeated to the Department received at 5:16 p.m.). The order: after [[cal.1965-04-28.latin-america]], the junta''s request in the cable itself. See [[cal.1965-04-28.latin-america]]. Names: Bennett.'
      tags:
      - name:bennett-w-tapley-jr
      time_zone: America/Santo_Domingo
- add:
    entry:
      id: cal.1965-09.king-3
      when: Sept.
      date: 1965-09
      place: atlanta
      thread: king
      also:
      - civil-rights-organizations
      c: 'Atlanta, the Airport Hilton Inn: a two-day SCLC staff meeting on the Coordinating Council of Community Organizations'' invitation to Chicago. Bevel for Chicago: "Black Chicago is Mississippi moved north a few hundred miles." Rustin against: "SCLC''s special mission is to transform the eleven Southern states." Andrew Young with Rustin; Hosea Williams against, then for.'
      n: '[[w.young-easy-burden]], 381–84 (Young''s account; those present, 382: Abernathy, Hosea Williams, Dorothy Cotton, James Orange, Bernard Lee, C. T. Vivian, Diane and James Bevel, Rustin, Levison, Harry Wachtel, Cleveland Robinson, Clarence Jones, Chauncey Eskridge; Dora McDonald keeping the record). To check: Dora McDonald''s record of the meeting (cited by [[w.young-easy-burden]], 382). Check: the days; Young gives only September 1965, and the order against [[cal.1965-09-01.king]]. Made public: [[w.young-easy-burden]] (1996). Names: Rustin, Andrew Young, Hosea Williams, Martin Luther King.'
      tags:
      - name:rustin-bayard
      - name:young-andrew-j-jr
      - name:williams-hosea
      - name:king-martin-luther-jr
      - state:ga
      - city:atlanta
- add:
    entry:
