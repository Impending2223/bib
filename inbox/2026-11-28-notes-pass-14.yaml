      id: cal.1965-02-13.vietnam-humphrey
      when: Feb. 13
      date: '1965-02-13'
      thread: vietnam-humphrey
      also:
      - vietnam
      c: 'Thomas L. Hughes, State''s Director of Intelligence and Research and Humphrey''s former assistant, telephones Humphrey that night, Humphrey left out of the day''s meeting: "the die was cast"; any last chance to weigh in must be taken at once.'
      n: '[[w.gibbons-u-s-government-and]], III, 92 (Hughes''s account; the night of the 13th). To check: *Washington Post*, May 9, 1976 (cited by [[w.gibbons-u-s-government-and]], III, 92 n.127). See [[cal.1965-02-08.vietnam-congress-3]]. Names: Hughes, Humphrey.'
      tags:
      - name:hughes-thomas-l
      - name:humphrey-hubert-h
      time_range:
      - 1965-02-14T03:00Z
      - 1965-02-14T05:00Z
      time_band: night
      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1965-02-14.vietnam-humphrey
      when: Feb. 14
      date: '1965-02-14'
      place: georgia
      thread: vietnam-humphrey
      also:
      - vietnam
      c: 'Humphrey, with Hughes, flies to Georgia on the private plane of Ford Bell, a supporter from Minneapolis. At Bell''s plantation he reads the latest documents Hughes has brought and decides to write Johnson on the domestic political effects of more military involvement: "I can only talk to him as a long-standing political ally."'
      n: '[[w.gibbons-u-s-government-and]], III, 92 (Hughes''s account). To check: *Washington Post*, May 9, 1976 (cited by [[w.gibbons-u-s-government-and]], III, 92 n.127). See [[cal.1965-02-13.vietnam-humphrey]]. Names: Humphrey, Hughes, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:hughes-thomas-l
      - name:johnson-lyndon-b
      - state:ga
- add:
    entry:
      id: cal.1965-02-15.vietnam-humphrey
      when: Feb. 15
      date: '1965-02-15'
      thread: vietnam-humphrey
      also:
      - vietnam
      c: On the flight back to Washington from Georgia, Hughes drafts Humphrey's memorandum to Johnson on the war's politics, dated Feb. 15.
      n: '[FRUS 1964–68, II, doc. 134](https://history.state.gov/historicaldocuments/frus1964-68v02/d134) (the source note: an earlier version, drafted by Hughes of INR and dated Feb. 15, printed in Humphrey''s *Education of a Public Man*, 320–24). [[w.gibbons-u-s-government-and]], III, 92 (drafted by Hughes on the plane back to Washington, Feb. 15). To check: [[w.humphrey-education-of-a-public-1976]], 320–24. See [[cal.1965-02-13.vietnam-humphrey]]. Names: Hughes, Humphrey, Johnson.'
      tags:
      - name:hughes-thomas-l
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-19.vietnam-saigon
      when: Feb. 19
      date: '1965-02-19'
      place: saigon
      thread: vietnam-saigon
      follows:
      - cal.1965-02-19.vietnam
      c: Saigon, the embassy, during the coup. Westmoreland, back that afternoon from the Delta with Michael Forrestal, sends Kỳ, whose bomb-laden planes are buzzing the city, an ultimatum through General Rowland, then telephones him to stop. The buzzing stops.
      n: '[[w.westmoreland-soldier-reports]], 96–97 (Westmoreland''s account: back at Tan Son Nhut "only a short time before the coup attempt began," in the early afternoon). The order: during [[cal.1965-02-19.vietnam]], its line. Made public: [[w.westmoreland-soldier-reports]] (1976). Names: Westmoreland, Forrestal, Nguyễn Cao Kỳ.'
      tags:
      - name:westmoreland-william
      - name:forrestal-michael-v
      - name:nguyen-cao-ky
      - place:saigon
      time_range:
      - 1965-02-19T04:00Z
      - 1965-02-19T10:00Z
      time_band: afternoon
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
