      date: '1965-10-08'
      place: peking
      thread: china-liu
      also:
      - vietnam-hanoi
      - china-foreign
      c: Liu Shaoqi, with Zhou Enlai and others, meets the Vietnamese party and government delegation led by Nguyễn Duy Trinh, Deputy Premier and Foreign Minister, and Văn Tiến Dũng.
      n: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 626 (Oct. 8, 1965). See [[cal.1965-10-06.china-leadership]]. Names: Liu Shaoqi, Zhou Enlai, Nguyễn Duy Trinh, Văn Tiến Dũng.'
