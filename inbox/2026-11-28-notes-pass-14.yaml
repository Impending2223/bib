    tags:
    - name:lukens-donald-e
- check:
    id: cal.1963-06-25.republican-party
    text: 'Check: Kabaservice, 65, has conflicting tallies at 5:15 a.m. showing McDevitt winning or losing by two ballots, and McDevitt giving up; White, 171, has Nadasdy declare McDevitt the winner after the first roll call and Lukens win a clear majority on the second.'
