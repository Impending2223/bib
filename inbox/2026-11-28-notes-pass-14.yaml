    set:
      c: 'Bundy to Johnson in Texas, 8:34 p.m.: Westmoreland''s deployments accepted for planning;{2} the December decisions to prove "we have done everything that we could to move toward peace."{3}'
      n: '[FRUS 1964–68, III, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v03/d213) (Bundy''s telegram, also from Califano and Moyers, by its source note). [[w.preston-war-council]], 223–24 (Bundy''s telegram: he, Moyers and Califano for a pause; "a solid base for the chosen level of later military action"). Split under R17: McNamara''s words to Bundy that day (Gibbons, IV, 116) are an entry of their own. Made public: FRUS 1964–68, III (1996). Names: McGeorge Bundy, Johnson, Westmoreland, McNamara.'
      src:
        c: 6eb14bd3
        rows:
