      when: Sept. 11
      date: '1965-09-11'
      place: washington
      thread: united-nations
      also:
      - china
      c: 'The State Department, Saturday: Rusk chairs a strategy meeting for the twentieth General Assembly, Ball, Goldberg and Thompson among those there. Goldberg would "hit it hard" on Lin Biao''s article.'
      n: '[FRUS 1964–68, XXXIII, doc. 367](https://history.state.gov/historicaldocuments/frus1964-68v33/d367) (Chase to McGeorge Bundy, Sept. 13: "On Saturday"). See [[cal.1965-09-03.china]]. Names: Rusk, Ball, Goldberg, Thompson, Lin Biao.'
      tags:
      - name:rusk-dean
      - name:ball-george-w
      - name:goldberg-arthur-j
      - name:thompson-llewellyn-e
      - name:lin-biao
