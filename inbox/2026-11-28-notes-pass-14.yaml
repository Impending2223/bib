- add-words:
    id: cal.1965-12-02.vietnam-pause
    after: end
    words: 'The telegram is from Bundy, Califano and Moyers, after an hour''s talk that afternoon. The decisions fall in four groups: proof of the effort for peace, "a solid base for the chosen level of later military action," consensus on the budget, and balancing Westmoreland''s effort by action on the political, social and economic front. On a bombing pause, Califano and Moyers would keep it very brief; Bundy shares McNamara''s feeling for three to four weeks; all would make it hard-nosed, expecting the bombing to be intensified in 1966.'
    text: '[FRUS 1964–68, III, doc. 213](https://history.state.gov/historicaldocuments/frus1964-68v03/d213)'
