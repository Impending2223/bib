patch: threads-6
by: Claude (thread statements, stage 6, agent 6)
ops:
- edit:
    id: cal.thread.alabama
    base: 5a1b24a1
    set:
      c: 'Alabama: its government, politics and courts, and the movement''s campaigns there. The Montgomery students; the unpledged electors; King acquitted; Meriwether confirmed; Anniston and the Birmingham terminal; the church besieged at Montgomery; Wallace nominated; *Sims v. Frink*; Hill over Martin; Birmingham''s vote for a mayor and council.'
      c2: 'Alabama: its government, politics and courts, and the movement''s campaigns there. Wallace''s inaugural; Boutwell over Connor; the Birmingham campaign, April–May; the schoolhouse door; the schools in September; the Sixteenth Street church; Tuskegee High closed; the unpledged electors; *Lee v. Macon*; Atlantic City and the pledge; five Republican seats; Bloody Sunday; the march to Montgomery; Liuzzo, the Hayneville trials, the Klansmen convicted; the succession bill lost.'
      c3: 'Alabama: its government, politics and courts, and the movement''s campaigns there. Robert Kennedy at Tuscaloosa; Lurleen Wallace nominated, elected and sworn; the act against the guidelines; her answer to the statewide school order; *Walker v. City of Birmingham*, King''s five days in jail; *Lee v. Washington*; Lurleen Wallace''s death, Brewer governor; *King v. Smith*.'
- edit:
    id: cal.thread.baker
    base: 0b50f13c
    set:
      c: The Senate majority's secretary and the Rules Committee's inquiry. Hill's suit; Johnson at Copenhagen; the resignation and the inquiry voted; Rometsch; Reynolds before the committee's staff; his testimony released; Johnson's statement; the Williams resolution tabled; the Select Committee on Standards and Conduct; the inquiry reopened.
- edit:
    id: cal.thread.defense
    base: 62ee712f
    set:
      c: Strategy, forces and the defense budget; the services, the draft, civil defense and the bases. The missile gap in the hearings; Polaris at sea; the first SIOP; Eisenhower's farewell address; McNamara's no missile gap; the March budget; civil defense to the Pentagon; the fallout shelters; Gilpatric at Hot Springs; the Special Group (Counter-Insurgency); the RS-70; counterforce at Ann Arbor; the TFX award.
      c2: Strategy, forces and the defense budget; the services, the draft, civil defense and the bases. The TFX hearings; the draft extended; the RS-70 added; *Thresher*; Anderson and Korth out; the base closings; the A-11; the draft study; the $700 million for Vietnam; the base-closing veto; the Manned Orbiting Laboratory; the draft-card act.
      c3: Strategy, forces and the defense budget; the services, the draft, civil defense and the bases. Palomares; the supplemental; the deferment test; McNamara at Montreal; the Marshall commission; the reserves amendment; the ABM and Kosygin's reply on talks; the Military Selective Service Act; the *Liberty*; the Stennis hearings; the "Chinese-oriented" ABM; McNamara to the World Bank, Clifford for him; Thule; the 205,000; the Sentinel votes; Westmoreland Chief of Staff; MIRV tested.
- edit:
    id: cal.thread.desegregation-public-places
    base: 090b6645
    set:
      c: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. The Las Vegas Strip; the Biloxi wade-in; *Boynton*; *Burton*; the Freedom Rides and the ICC order; Albany; *Garner*; Maryland's special session; Baltimore's ordinance. Gallup on the Freedom Riders and on integration.
      c2: Segregation in travel, at lunch counters, in parks and other public places, short of the schools; each event in its own thread. Maryland's public accommodations act; Birmingham; Greensboro; the sit-in cases; *Watson*; Jackson; the public accommodations title; Cambridge's referendum; Frankfort; St. Augustine; *Bell v. Maryland*; Title II tested; Maryland's act upheld at referendum; *Heart of Atlanta*; the Nevada, Missouri and Kentucky acts. Gallup on integration.
- edit:
    id: cal.thread.economy
    base: 8e613527
    set:
      c: Fiscal and monetary policy, the balance of payments, the dollar and gold. The peak; the London gold price; the balance-of-payments directive; the trough; the Fed's long rates; Heller's gap; the investment credit asked; the 1962 Report and the guideposts; the May slide; the gold talks of August; no tax cut now; the Revenue Act of 1962; the Economic Club.
      c2: Fiscal and monetary policy, the balance of payments, the dollar and gold. The tax message; the discount rate to 3½; the interest equalization tax; the House's 271–155; the Revenue Act of 1964; the sterling crisis, the discount rate to 4; Ackley for Heller; the gold cover; Fowler for Dillon; the excise tax cut; Martin at Columbia; the coinage act; sterling supported; aluminum and copper; the Fed's December rise.
      c3: Fiscal and monetary policy, the balance of payments, the dollar and gold. The Tax Adjustment Act; the Fed's squeeze; the investment credit suspended; the Interest Rate Control Act; the cutback; the surcharge proposed; the investment credit restored; special drawing rights; the surcharge set aside by Ways and Means; sterling devalued; the balance-of-payments program; the note cover ended; the gold market closed; the Revenue and Expenditure Control Act; the franc and the mark; the surplus.
- edit:
    id: cal.thread.economy-debt-limit
    base: 32ff3120
    set:
      c: The statutory limit on the public debt, raised a year at a time over the permanent $285 billion. $293 billion for fiscal 1961; $298 billion; $300 billion; $308 billion in three steps.
      c2: The statutory limit on the public debt, raised a year at a time over the permanent $285 billion. $307 and $309 billion; $309 billion continued; $315 billion; $324 billion; $328 billion.
- edit:
    id: cal.thread.elections-1967
    base: 2eec06d3
    set:
      c: 'The off-year elections of 1967. Mayors: Daley''s fourth term; Hatcher at Gary; Stokes at Cleveland; Loeb at Memphis; White over Hicks; Tate over Specter; Alioto, Lugar, D''Alesandro. Governors: Williams over Winter in Mississippi; McKeithen renominated; Nunn in Kentucky. New Jersey''s Senate Republican; Reid to Virginia''s House of Delegates; New York''s constitution refused; Louisville''s open housing ordinance.'
- edit:
    id: cal.thread.european-community
    base: f9f9d4c2
    set:
      c: The Six and the Seven, and Britain's applications. The OEEC remade; the EFTA in force and the Six speeded; Macmillan in Washington; Hallstein at the White House; Macmillan applies; Heath at Paris; the farm policy; carpets and glass; the Atlantic Partnership statement; the Fouchet plan fails; the Grand Design; Brighton.
      c2: The Six and the Seven, and Britain's applications. The veto; the Franco-German treaty; Monnet; *Van Gend en Loos*; the Bundestag's preamble; the Paulskirche; the chicken war; the Kennedy Round opened; *Costa v. ENEL*; Wilson's surcharge; the grain price; the Merger Treaty; the empty chair; de Gaulle against the Commission.
      c3: The Six and the Seven, and Britain's applications. The Luxembourg compromise; peaceful engagement; Wilson's new approach; the Kennedy Round concluded; de Gaulle's second veto; the Council's refusal; the customs union complete.
- edit:
    id: cal.thread.farm
    base: 7882f727
    set:
      c: Price supports and production controls; food stamps and food aid. Eisenhower's wheat message; the surplus food doubled; the emergency feed grain program; the farm bill's defeat; the Food and Agriculture Act of 1962.
      c2: Price supports and production controls; food stamps and food aid. The Feed Grain Act of 1963; the food stamp bill; the Agricultural Act of 1964; the Food Stamp Act; Food for Peace extended; the county committee elections in Mississippi; the agriculture message; the Food and Agriculture Act of 1965.
      c3: Price supports and production controls; food stamps and food aid. Grain for India; the Food for Freedom message; Indira Gandhi in Washington; the Food for Peace Act of 1966; food for India again; the Kennedy Round; food stamps extended; the Wholesome Meat Act; the message of 1968; *Hunger in America*; the payment limit; Food for Freedom extended; the Wholesome Poultry Products Act; the food stamp amendments; the farm programs extended.
- edit:
    id: cal.thread.goldwater
    base: ed8b3a21
    set:
      c: 'Barry M. Goldwater: his speeches, writings and campaigns, and the draft. His column; the South Carolina convention; *The Conscience of a Conservative*; Chicago, his name withdrawn; the statement on the election; the Proposed Republican Principles; White''s group at Chicago; Atlanta and the Negro vote; the Garden; the draft''s Chicago meeting of December 1962; the Phoenix Country Club.'
      c2: 'Barry M. Goldwater: his speeches, writings and campaigns, and the draft. White refused; the National Draft Goldwater Committee; the Armory rally; Dodger Stadium; the vote against the test ban; the moratorium after Dallas; the announcement, "a choice, not an echo"; New Hampshire, Lodge''s write-in; California; the vote against the civil rights bill; San Francisco, the nomination and the acceptance; Hershey; "A Time for Choosing"; the defeat; the Free Society Association.'
- edit:
    id: cal.thread.korea
    base: 006fac38
    set:
      c: 'South Korea: its governments, the alliance, the North. Rhee re-elected; Masan; the April students and Rhee''s fall; Yun Po-sun and Chang Myon; Park''s coup; the NSC on the junta; the promise of civilian rule; Park in Washington, his offer of troops; the Purification Law; Yun''s resignation; NSAM 151 on the talks with Japan; Kim Chong-p''il and Ōhira''s offer.'
      c2: 'South Korea: its governments, the alliance, the North. Park''s offer to stand aside and its reversal; the referendum put off; Park elected; Park received after the funeral; martial law in Seoul against the settlement with Japan; the noncombat units for Vietnam; the treaty initialed; Park''s state visit; the treaty signed; the combat division; the treaty approved and in force.'
      c3: 'South Korea: its governments, the alliance, the North. Humphrey at Seoul; a second division for Vietnam; the status of forces agreement; Manila; Johnson at Seoul; the raid on the Blue House; the *Pueblo*; Vance at Seoul; Park at Honolulu; the talks at Panmunjom; the commandos at Ulchin; the crew released.'
- edit:
    id: cal.thread.mayors
    base: 6b4b9746
    set:
      c: The races for mayor in the large cities, primaries and generals; the mayors' successions and the cities' charters. Maier in Milwaukee; Yorty over Poulson; Wagner against Tammany; Allen over Maddox; Cavanagh over Miriani; Wagner over Lefkowitz; Schiro in New Orleans; Tate for Dilworth; Addonizio in Newark; Nashville's Metro charter; Locher after Celebrezze; Birmingham's mayor and council.
      c2: The races for mayor in the large cities, primaries and generals; the mayors' successions and the cities' charters. Boutwell over Connor; Daley over Adamowski; Bradley to the council; McKeldin; Tate, Shelley, Collins; Welch; Gangemi out at Jersey City; Jonsson; Braman at Seattle; Cervantes; Yorty re-elected; Wagner out, Lindsay over Beame and Buckley; Locher over Stokes; Cavanagh and Barr re-elected.
      c3: The races for mayor in the large cities, primaries and generals; the mayors' successions and the cities' charters. Addonizio re-elected; Memphis's charter; Daley's fourth term; Hatcher at Gary; High's death; Stokes over Locher and Taft; Loeb at Memphis; White over Hicks; Tate over Specter; Alioto, Lugar, D'Alesandro; Maier's third term; Jacksonville and Duval County one government; Fasi at Honolulu.
- edit:
    id: cal.thread.press-and-broadcasting
    base: c18a82bc
    set:
      c: The President and the press, broadcasting and its regulators, the law of the press. Section 315 suspended; the live press conference; Szulc's story; the publishers' speech; Minow's wasteland; the White House tour; the *Herald Tribune* cancelled; the Executive Committee's rule on reporters; "The Political Obituary of Richard Nixon"; Sylvester's right to lie; the newspaper strike; "After Two Years."
      c2: The President and the press, broadcasting and its regulators, the law of the press. The newspaper strike's end; the reporters beaten in Saigon; the networks' first half-hour news, Cronkite and Huntley–Brinkley; Starnes on the CIA; Sulzberger on Halberstam; the *Chronicle* and the bank merger; California's Free Television Act; Safer at Cẩm Nê.
      c3: The President and the press, broadcasting and its regulators, the law of the press. The Fulbright hearings televised, Friendly resigns; the Free Television Act struck; *Sheppard*; the Freedom of Information Act; Salisbury in Hanoi; *Time v. Hill*; Arkansas's freedom of information act; *Curtis v. Butts*; the satellite message; the Public Broadcasting Act; the Loan photograph; Bến Tre; Cronkite's "stalemate"; the 206,000 story; *Hunger in America*; Section 315's suspension passed by the House, no debates.
- edit:
    id: cal.thread.railroads
    base: 9abeff95
    set:
      c: 'The railroads'' labor disputes. The work-rules dispute, firemen on diesels: the Presidential Railroad Commission. Gallup on a law against requiring more workers than a job needs.'
      c2: 'The railroads'' labor disputes. The work-rules dispute, firemen on diesels: *Locomotive Engineers v. B&O*; the emergency board; the strike deadlines; arbitration by statute; the moratorium; the settlement. Gallup on the dispute.'
      c3: 'The railroads'' labor disputes. The shopcraft wage dispute: the emergency board; the no-strike extensions; the Special Board asked; the strike and the Special Board; its award.'
- edit:
    id: cal.thread.sit-ins
    base: 988f36a9
    set:
      c: The student sit-ins at lunch counters, from Greensboro. Greensboro; the spread; Montgomery; Nashville's arrests; Atlanta's Appeal; Orangeburg; Eisenhower asked; SNCC; Looby's house; the counters opened at Nashville and Greensboro; Jacksonville; Rich's; the Jackson library.
- edit:
    id: cal.thread.states-and-cities
    base: b291474d
    set:
      c: State and city politics where no narrower thread holds them. The Twenty-third Amendment; Chessman; the Master Plan; the Governors' Conferences; Tower; Newburgh; Atlanta's schools; New York's Conservative Party; Nashville's Metro charter; Brooke attorney general; the Council of State Governments' amendments.
      c2: State and city politics where no narrower thread holds them. Oklahoma's Senate seat filled; Gantt at Clemson; Crystal City; Boston's Stay Out; the Council of State Governments' amendments; Auto Row; the Alaska earthquake; Harlem, Rochester, Jersey City, Philadelphia; the Massachusetts council indicted; the District's first presidential vote; District home rule; Watts; the Racial Imbalance Act; the Northeast blackout; the McCone report; the transit strike; Reagan announces.
      c3: State and city politics where no narrower thread holds them. Free D.C.; New York's divorce law; Mississippi's prohibition ended; Omaha, Hough, Dayton, Hunters Point; "creative federalism"; Reagan sworn; "a new federalism"; Howard Hughes in Las Vegas; the Butler Act repealed; the Twin Cities' Metropolitan Council; Tierra Amarilla; Newark, Detroit, Milwaukee; Walter Washington for the District; the teachers' strike and the Bundy report; the governors at sea; Prudhoe Bay; *Avery v. Midland County*; Ocean Hill–Brownsville; Jacksonville consolidated; the District's elected school board; Tijerina acquitted.
- edit:
    id: cal.thread.vietnam-support
    base: 224af3cf
    set:
      c: The administration's campaign for support of the war at home and against its critics, and the war's supporters' statements. The speech team; the governors briefed; the information meetings; *Why Vietnam*; the Dean committee; the day of prayer; the law professors; Freedom House's statement; the New England faculties; the AFL-CIO.
      c3: The administration's campaign for support of the war at home and against its critics, and the war's supporters' statements. The Lawyers Committee and the law professors' answer; the Bar Association's resolution; the FBI on Fulbright and Morse and on the embassies' callers; Moyers on the credibility gap; Russell's tribunal; Freedom House's statement; the briefings of Congress; Washburn's plan; the third force and Roche's committee; the Vietnam Information Group; the search for evidence of progress; the Citizens Committee for Peace with Freedom; Panzer on the polls.
