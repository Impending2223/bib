- edit:
    id: cal.1963-11-29.assassination-3
    base: 1b9bfbc8
    set:
      also:
      - cuba
      - transition-and-staff
      c: 'Johnson to Hoover by telephone, 1:40 p.m.: "whether [Oswald] was connected with the Cuban operation with money."
        Hoover: "That''s what we''re trying to nail down now"; the tie unlikely; Oswald "strongly pro-Castro." Johnson:
        "You''re my brother and personal friend"; "I have more confidence in your judgment than anybody in town." He asks
        for DeLoach as the FBI''s liaison to the White House; Hoover agrees.'
      n: '[Johnson and Hoover, 1:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-november-29-1963),
        Tape K6311.04 (Miller Center). [[w.shesol-mutual-contempt]], 131; [[w.kotz-judgment-days]], 80, 82 (Johnson''s
        words to Hoover; DeLoach). To check: DeLoach, oral history, 6, LBJ Library (cited by [[w.kotz-judgment-days]],
        82 n.68). See [[cal.1963-11-29.assassination]]. Names: Johnson, Hoover, Oswald, DeLoach.'
      src:
        c: 652398de
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-november-29-1963: all'
        - 'w.shesol-mutual-contempt 131: A-D'
        - 'via w.shesol-mutual-contempt 131 n.connected: A-D'
        - 'w.kotz-judgment-days 80, 82: E-H'
        - 'via w.kotz-judgment-days 80 n.63: E-F'
        - 'via w.kotz-judgment-days 82 n.68a: G-H'
        - 'via w.kotz-judgment-days 82 n.68b: G-H'
      tags:
      - name:johnson-lyndon-b
      - name:hoover-j-edgar
      - name:oswald-lee-harvey
      - name:deloach-cartha
- edit:
    id: cal.1964-01-15.robert-kennedy
    base: 5496b534
    set:
      c: 'DeLoach to Hoover: "Walter Jenkins told me last night that he was seriously concerned about the continued employment
        of Paul Corbin at Democratic National Committee Headquarters"; the President too. The FBI''s file on Corbin, "also
        known as Paul Kobrinsky," the same day. Jenkins: "the President was not yet quite ready to take on Bobby," but
        means to be rid of some of Kennedy''s close associates soon.'
      n: '[[w.shesol-mutual-contempt]], 188; [[w.kotz-judgment-days]], 83 (Jenkins on Robert Kennedy). To check: DeLoach
        to Hoover, Jan. 15, 1964, and "Paul Corbin also known as Paul Kobrinsky," Jan. 15, 1964, Hoover Official and Confidential
        Files, #92 (cited by [[w.shesol-mutual-contempt]], 188). Check: Kotz, 83, puts the talk "in mid-January" and the
        associates as Johnson''s plan; the memorandum (O&C file 92, cited 83 n.72) to read. Names: DeLoach, Hoover, Jenkins,
        Johnson, Robert Kennedy.'
      src:
        c: 204afe7d
        rows:
        - 'w.shesol-mutual-contempt 188: A-C'
        - 'via w.shesol-mutual-contempt 188 n.jenkins-told-me: A-C'
        - 'w.kotz-judgment-days 83: D'
        - 'via w.kotz-judgment-days 83 n.72: D'
      tags:
      - name:deloach-cartha
      - name:hoover-j-edgar
      - name:jenkins-walter-w
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
