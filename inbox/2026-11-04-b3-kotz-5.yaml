- check:
    id: cal.1963-06-22.civil-rights-bill
    text: 'Check: Kotz, 79, has Robert Kennedy see King first: "You haven''t broken with Levison"; King: "Yes, I have";
      Kennedy: "I have a tape of a conference call that you and three others had with Levison," the call of June 10 (Schlesinger''s
      interview with Levison, Aug. 3, 1976, and the taps of June 10 and 12, cited 79 n.55).'
