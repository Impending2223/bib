patch: b3-kotz-5
by: 'Claude (batch 3 reading, fifth run: Kotz, Judgment Days, 2005, pp. 77-84, ch. 4 from the FBI''s memoranda of 1962-63), Nov. 4, 2026'
ops:
- add:
    entry:
      id: cal.1963-08.king
      when: Aug.
      date: 1963-08
      thread: king
      also:
      - robert-kennedy
      c: 'Robert Kennedy, at dinner with Marietta Tree, a U.S. representative to the United Nations, in Washington for the
        March, of King: "He''s not a serious person. If the country knew what we know about King''s goings on, he''d be
        finished."'
      n: '[[w.kotz-judgment-days]], 79. To check: [[w.thomas-robert-kennedy]], 262–63 (cited by [[w.kotz-judgment-days]],
        79 n.58). Check: the day. Names: Robert Kennedy, Martin Luther King.'
      src:
        c: e6d72dc1
        rows:
        - 'w.kotz-judgment-days 79: all'
      tags:
      - name:kennedy-robert-f
      - name:king-martin-luther-jr
- add:
    entry:
      id: cal.1963-11-25.king-2
      when: Nov. 25
      date: '1963-11-25'
      thread: king
      also:
      - press-and-broadcasting
      - civil-rights-bill
      c: 'Robert Allen and Paul Scott, columnists, in the *Long Island Press*: Johnson and Robert Kennedy soon to face "evidence
        obtained by tapping telephones" tying an unnamed civil rights leader to a Soviet agent; "if this close association
        isn''t ended, the new administration faces public disclosures about this individual''s Red ties in the midst of
        the coming congressional debate on civil rights legislation."'
      n: '[[w.kotz-judgment-days]], 81. To check: *Long Island Press*, Nov. 25, 1963, 9; [[w.garrow-bearing-the-cross]],
        308 (cited by [[w.kotz-judgment-days]], 81 n.66). Check: Kotz has the FBI overhear King''s alarm at the column, no
        day given (81). Names: Johnson, Robert Kennedy.'
      src:
        c: 9dabfa7b
        rows:
        - 'w.kotz-judgment-days 81: all'
        - 'via w.kotz-judgment-days 81 n.66b: all'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1963-11-27.king
      when: Nov. 27
      date: '1963-11-27'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'Hoover to Robert Kennedy and O''Donnell: a statement under King''s name for the *New York Herald Tribune* written
        by Clarence Jones, Levison''s intermediary; Jones''s past Communist-related affiliations noted.'
      n: '[[w.kotz-judgment-days]], 80–81. To check: Hoover to the Attorney General and O''Donnell, Nov. 27, 1963, FBI
        file 100-3-116-539 (cited by [[w.kotz-judgment-days]], 81 n.64). Made public: Check; Kotz cites the FBI''s file.
        Names: Hoover, Robert Kennedy, O''Donnell, Martin Luther King, Levison.'
      src:
        c: d35f3aa6
        rows:
        - 'w.kotz-judgment-days 80–81: all'
        - 'via w.kotz-judgment-days 81 n.64: all'
      tags:
      - name:hoover-j-edgar
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
      - name:king-martin-luther-jr
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-12-02.king
      when: Dec. 2
      date: '1963-12-02'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'From the tap, the FBI learns King is to see Johnson Dec. 3: the New York office to Hoover; the Domestic Intelligence
        Division''s "Informative Note." Hoover sends an aide to warn Johnson of what King''s tie to Levison means for national
        security. Johnson does not cancel the meeting.'
      n: '[[w.kotz-judgment-days]], 81. To check: SAC New York to Director, Dec. 2, 1963, FBI file 100-106670, sec. 7;
        Domestic Intelligence Division, "Informative Note," Dec. 2, 1963, FBI file 100-106670, sec. 7 (cited by [[w.kotz-judgment-days]],
        81 n.65). Check: the day of the aide''s warning; Kotz''s note gives the papers of Dec. 2 and Hoover to Jenkins, Dec.
        3, for the paragraph. Made public: Check; Kotz cites the FBI''s King file. The meeting: [[cal.1963-12-03.king]].
        Names: Martin Luther King, Johnson, Hoover, Levison.'
      src:
        c: 6af76044
        rows:
        - 'w.kotz-judgment-days 81: all'
        - 'via w.kotz-judgment-days 81 n.65b: A-B'
        - 'via w.kotz-judgment-days 81 n.65c: A-B'
      tags:
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      - name:hoover-j-edgar
      - name:levison-stanley-d
- add:
    entry:
      id: cal.1963-12-03.king-2
      when: Dec. 3
      date: '1963-12-03'
      thread: king
      also:
      - civil-rights-the-executive
      c: 'Hoover to Jenkins, of King''s day: from New York to the Statler Hilton, where he confers at 9:30 a.m. with Clarence
        Jones and Harry Wachtel before a taxi to the White House for his 11:30 appointment. Jones and Wachtel in the 1950s
        members of organizations the FBI considers Communist fronts.'
      n: '[[w.kotz-judgment-days]], 81. To check: Hoover to Jenkins, Dec. 3, 1963, Mildred Stegall Files, King file, LBJ
        Library (cited by [[w.kotz-judgment-days]], 81 n.65). Check: which of the papers of Dec. 2–3 (81 n.65) gives which
        detail. See [[cal.1963-12-02.king]]. Names: Hoover, Jenkins, Martin Luther King.'
      src:
        c: 5bb7aafe
        rows:
        - 'w.kotz-judgment-days 81: all'
        - 'via w.kotz-judgment-days 81 n.65a: all'
      tags:
      - name:hoover-j-edgar
      - name:jenkins-walter-w
      - name:king-martin-luther-jr
