    after: 'Clifford: say we will put in 500,000 to a million men; "How do we avoid creating feeling that we are pounding troops down rathole?"'
    words: 'The lunch is in the Secretary of State''s private dining room: Rusk, McNamara, Clifford, Rostow, Katzenbach and William Bundy, with McPherson and Califano; asked by Johnson to take up the request for 205,000, and a speech on Vietnam he plans for the end of March; three hours.'
    item: '[[w.califano-triumph-and-tragedy-of]], 262–63'
