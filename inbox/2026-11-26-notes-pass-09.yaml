- edit:
    id: cal.1969-04-24.china-leadership-3
    base: 4b811f23
    set:
      c: 'Zhou Enlai''s request, as the editors give it: the preliminary list, adopted the afternoon before by the presidium and the convenors of the delegations, can serve as the formal list once the presidium passes it; a presidium meeting half an hour before the session, Mao and Lin Biao hoped to come; the time for Mao to set, after 3 p.m. better.{1} Mao 毛泽东, on Zhou Enlai''s 周恩来 request of Apr. 24 on the preliminary vote for the Ninth Central Committee''s members and alternates and the formal election and closing session that afternoon: ''Agreed: the presidium to meet at 3:30 p.m. and the Congress at 4.''{2}'
      n: '[[w.jianguo-yilai-mao-zedong]], XIX, 429 (Apr. 24, 1969); [[w.jianguo-yilai-mao-zedong]], XIX, 429 n.1 (the editors'' note); [[w.yang-jisheng-tiandi-fanfu]], II, 722, 725 (the third and last plenary session, afternoon, for the election; the votes: Zhu De 809, Chen Yun 815, Li Fuchun 886, Chen Yi 867, Xu Xiangqian 808, Nie Rongzhen 838, Ye Jianying 821, Deng Zihui 827, Li Xiannian 922, Zhang Dingcheng 1,099; 170 members and 109 alternates, 53 of them of the Eighth). Made public: 2023 ([[w.jianguo-yilai-mao-zedong]], the first open printing). Check: whether the first edition ([[w.zedong-jianguo-yilai-mao-zedong]], printed for internal circulation) printed it. See [[cal.1969-04-24.china-leadership]]. To check: Zhou Enlai, request for instructions of Apr. 24, 1969 on the preliminary list of the Ninth Central Committee, adopted the afternoon of Apr. 23 by the presidium and the group convenors, as the formal election list, and on the Congress''s formal election and closing session that afternoon (cited by [[w.jianguo-yilai-mao-zedong]], XIX, 429 n.1); Chi Zehou 遲澤厚, 〈中共「九大」內幕瑣憶〉, *Yanhuang chunqiu* 《炎黃春秋》, 2003, no. 3 (cited by [[w.yang-jisheng-tiandi-fanfu]], II, 725 n.26). Names: Mao Zedong, Zhou Enlai.'
