      c: 'The White House, the small lounge off the Oval Office, 3:30 p.m.: Clifford reports the Kennedy–Sorensen proposal to Johnson, Humphrey and Fortas. Johnson refuses: it would look a political deal, give comfort to Hanoi and usurp his authority, and its proposed members are all known opponents of the war. Humphrey, Fortas and Clifford agree.'
      n: '[[w.clifford-counsel-to-the-president-2]], 504–05. [[w.witcover-85-days]], 78–79 (Clifford with Johnson shortly before 4 p.m.; five reasons, the havoc among critics such as Fulbright and McCarthy among them; the Administration''s version the only one). Check: Witcover, 78, has Clifford see Johnson shortly before 4 p.m. See [[cal.1968-03-14.robert-kennedy]]. Names: Clifford, Robert Kennedy, Sorensen, Johnson, Humphrey, Fortas.'
      tags:
