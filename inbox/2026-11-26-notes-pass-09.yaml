    after: send Zhou Enlai their second report on the world situation.
    words: Xiong Xianghui, Zhou's assistant, and Yao Guang, head of the European and American division in the Foreign Ministry, are tasked to assist the marshals. The report holds that "the Soviet revisionists have made China their main enemy," a greater threat to China's security than the American imperialists.
