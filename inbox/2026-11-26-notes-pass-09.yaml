- add-words:
    id: cal.1967-10-25.vietnam-support
    after: Paul Douglas announces the Citizens Committee for Peace with Freedom in Vietnam, Truman and Eisenhower among more than a hundred members; conceived and organized at the White House, Roche the principal staff member, its press release drafted there.
    words: Douglas denies the committee is the administration's counterattack on critics; its purpose is that Peking and Hanoi "will not mistake the strident voices of some dissenters" for American discouragement.
