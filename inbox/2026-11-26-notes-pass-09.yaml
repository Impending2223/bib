    after: Lin Biao tells the plenum that the "February counter-current" was the most serious anti-Party incident since the Eleventh Plenum, a rehearsal of capitalist restoration.
    words: 'MacFarquhar, who dates it Oct. 26, has a four-hour keynote, in which Lin holds the former Cultural Revolution Group members Wang Li, Guan Feng and Qi Benyu and Generals Yang Chengwu, Yu Lijin and Fu Chongbi partly responsible for the current: they wanted cadres above department director level "baked," and are responsible for the winds of arrests and of dragging out high military cadres; they put the blame on the Group, but it was them.'
