- edit:
    id: cal.1967-11-02.vietnam
    base: 4ee066f1
    set:
      time_range:
      - 1967-11-02T00:00Z
      - 1967-11-02T03:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      n: 'FRUS 1964–68, V, doc. [377](https://history.state.gov/historicaldocuments/frus1964-68v05/d377); McGeorge Bundy''s summary, Nov. 10, doc. [393](https://history.state.gov/historicaldocuments/frus1964-68v05/d393) (no one for getting out; no negotiations to be expected). [[w.drea-mcnamara-clifford-and-the-2011]], 221–222 (the briefing of Nov. 1; the meeting of Nov. 2, the bombing to be moderated, not ended); [[w.dallek-flawed-giant]], 494, 496 (the advisers; firmness); [[w.herring-lbj-and-vietnam]], 59 (the Wise Men, briefed by Wheeler and Carver; Bundy''s summary, a "strong and unanimous negative" on getting out; Ball''s restriction of the bombing to the DMZ); [[w.clifford-counsel-to-the-president-2]], 454–55 (dinner at State, Nov. 1, Wheeler and Carver briefing; Nov. 2 with the President, four hours, Jim Jones''s notes; Ball for the bombing near the DMZ); [[w.rusk-as-i-saw-it-1990]], 481 (none for getting out); [[w.mcnamara-in-retrospect]], ch. 10 at nn.43–46 (the Wise Men in the Cabinet Room, the morning). [[w.ball-past-has-another-pattern]], 407 (the dinner with Rusk, Nov. 1; the President, Nov. 2; Ball for getting out); [[w.berman-lyndon-johnsons-war]], 96–101 (the evening of Nov. 1: McNamara, "perhaps he and Rusk''s efforts since 1961 have been a failure"; Wheeler and Carver; Nov. 2: the five questions; Bradley, "We need to raise patriotism"; Acheson, "a dilettante fool"; Bundy, "Emphasize the ''light at the end of the tunnel''"; Rostow, "ways of guiding the press"; Fortas, Clifford; getting out, "Absolutely not"; Ball: "a flock of buzzards"); [[w.bernstein-guns-or-butter]], 424–25 (Clifford''s account); [[w.taylor-swords-and-plowshares]], 377–78 (Nov. 2 in the Cabinet Room; public information uppermost; one for cutting the bombing; no record kept); [[w.dallek-flawed-giant]], 492 (Nov. 2, Johnson with Acheson and other "wise men" presses the case for "far more vigorous action to stabilize public support for our policy in Vietnam"; not the five questions). Made public: FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 875–77. Check: McGeorge Bundy''s summary (FRUS 1964–68, V, doc. 393) gives the trade of the bombing for an end to attacks across the DMZ to Acheson, "and one or two others agreed"; Ball the one speaker who did not hold the bombing an important part of the campaign. The time is the first day''s. To check: [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]. See [[cal.1967-11-01.vietnam]]. Names: Acheson, Ball, Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley, Johnson. Check: Dallek, 496, has Ball dissenting, by his own account (Ball, *Past Has Another Pattern*, 407). Check: Rusk calls it the group''s first meeting and dates it October 1967 ([[w.rusk-as-i-saw-it-1990]], 481). Check: Ball (407) has himself making "my usual plea for extrication."'
- add-words:
    id: cal.1967-11-02.vietnam
    after: 'The senior advisers at State and the White House: Acheson, Ball, McGeorge Bundy, Clifford, Dillon, Fortas, Lodge, Murphy, Taylor, Bradley among them.'
    words: Arthur Dean and Harriman are there too. The group dines with Rusk and McNamara at State the evening of Nov. 1, Wheeler and Carver briefing, and meets four hours with Johnson the next morning; Jim Jones keeps notes.
    item: '[[w.clifford-counsel-to-the-president-2]], 454–55'
- add-words:
    id: cal.1967-11-02.vietnam
    after: 'Johnson''s five questions, Nov. 2. No one for getting out; Acheson and Bundy: no negotiations to be expected, the bombing to be played down; Ball for shifting it to the DMZ.'
    words: 'Bundy''s summary: "a strong and unanimous negative" on getting out. Ball: "No one in this group thinks we should get out of the war." Harriman: a negotiation "inevitable and necessary."'
    item: '[[w.clifford-counsel-to-the-president-2]], 455'
- add-words:
    id: cal.1967-11-02.vietnam
    after: 'Johnson''s five questions, Nov. 2. No one for getting out; Acheson and Bundy: no negotiations to be expected, the bombing to be played down; Ball for shifting it to the DMZ.'
    words: 'Bradley: "We need to raise patriotism." Bundy: emphasize the "light at the end of the tunnel."'
    item: '[[w.berman-lyndon-johnsons-war]], 96–101'
