    item: '[[w.johnson-white-house-diary]], 621–22'
- add-words:
    id: cal.1968-01-18.war-opposition
    after: 'Eartha Kitt, a guest, to the President''s wife: the young rebel in the streets against the war and the draft (Check the words).'
    words: 'Johnson looks in; leaving, he is asked by Kitt what is to be done about parents too busy to look after their children, and answers that the Social Security bill allots millions for day-care centers. Mrs. Hughes of New Jersey rises to speak in defense of the war. Mrs. Johnson answers Kitt: the war "still doesn''t give us a free ticket not to try to work for better things."'
