    after: 'The Cabinet Room, 11:02 a.m.: Johnson with the Joint Chiefs, Rusk, McNamara, Clifford and Rostow.'
    words: Nitze, Christian and Tom Johnson are there too.
    text: '[FRUS 1964–68, VI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v06/d64) (the source note).'
- add-words:
    id: cal.1968-02-09.vietnam-tet
    after: 'Clifford: "a very strange contradiction in what we are saying and doing."'
    words: 'Wheeler: Westmoreland wants the 82nd Airborne and two-thirds of a Marine division, 15 battalions; McNamara: about 40,000 men in all. Wheeler: the North Vietnamese infantry up from 78 battalions to 105 since December.'
    text: '[FRUS 1964–68, VI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v06/d64).'
- add-words:
    id: cal.1968-02-09.vietnam-tet
    after: 'Clifford: "a very strange contradiction in what we are saying and doing."'
    words: 'Wheeler: the South Vietnamese forces about 360,000 men, all forces about 600,000. Johnson, after Clifford: the enemy has changed its tactics; "We have to be prepared for all that we might face."'
    text: '[FRUS 1964–68, VI, doc. 64](https://history.state.gov/historicaldocuments/frus1964-68v06/d64).'
