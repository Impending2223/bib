    after: 99 from the army.
    words: The hall is divided into seven zones, each with a ballot box, and one on the platform; 1,510 delegates are present, two on leave. After voting, a delegate leaps onto the platform to shake Mao's, Lin's and Zhou's hands, others run after him, and bodyguards and a human wall hold them back. At the close young delegates strip the platform of the leaders' cups, pencils and papers.
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 722–23, 725'
- add-words:
    id: cal.1969-04-24.china-leadership
    after: 99 from the army.
    words: Zhou and Lin each cross out their own names. Zhang Dingcheng 1,099. Liu Jieting, the rebel from Sichuan, is elected a member with 1,435 votes and his wife Zhang Xiting an alternate with 1,400; Nie Yuanzi an alternate with 937. Wang Baidan, the steelworker, is thirty-four, from Harbin.
