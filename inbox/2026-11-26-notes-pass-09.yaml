      c: 'At Johnson''s instruction Clifford telephones Sorensen and Robert Kennedy, in Kennedy''s Senate office, Johnson listening silently on a line: the proposal unacceptable; Kennedy off the commission would make no difference, it would still look a political deal.'
      n: '[[w.clifford-counsel-to-the-president-2]], 505. [[w.witcover-85-days]], 79 (the call about 5 p.m.; Kennedy''s later account of Clifford''s two reasons). The time is Witcover''s, "about 5 P.M."; Clifford gives none. See [[cal.1968-03-14.robert-kennedy]]. Names: Clifford, Sorensen, Robert Kennedy, Johnson.'
