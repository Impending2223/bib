    after: Chicago's West Side, rioting from Apr. 5. Acting Governor Shapiro asks for troops, Apr. 6; Executive Order 11404, Apr. 7. The dead in Chicago, 11 (Check the count).
    words: The Guard on the streets Apr. 6 cannot cope; that evening the mayor and the governor ask for federal troops, and Califano brings the proclamation to Johnson, who signs it lying in bed. The federalized Illinois Guard and Army troops from Fort Hood and Fort Carson, under General Mather, come in at O'Hare and Glenview the morning of Apr. 7. Daley sets a curfew for those under 21, 7 p.m. to 6 a.m. The mayor lifts the emergency the Wednesday after. Losses over $14 million, about 3,000 arrested.
