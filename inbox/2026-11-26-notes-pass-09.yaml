    after: 'The Congress to open Apr. 1: three items, the political report, the constitution, the election of a Central Committee; no Group names in the report, only his and Liu Shaoqi''s; separate Deng Xiaoping from Liu.'
    words: 'To the five called from their factories: the old men have eaten more rice and have more experience; the "little turnips" look down on them, "I do not agree." Those who erred this time erred less than Wang Ming 王明, and not one was lost at the Seventh Congress; most are to be treated as contradictions among the people. Of Jiang Weiqing 江渭清, Tan Qilong 谭启龙, Zhang Pinghua 张平化, Zhao Ziyang 赵紫阳 and Huo Shilian 霍士廉: study what is seriously wrong, and if nothing but this time''s error, free them in time.'
