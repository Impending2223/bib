- add-words:
    id: cal.1967-10-23.vietnam-pennsylvania
    after: 'Johnson: "I am not prepared to act simply on hope."'
    words: 'The leadership meeting from 5:36 p.m.: Humphrey, Mansfield, Long, Byrd, Albert and Moss. Joining at 6:05 p.m.: McNamara, Rusk and Helms; Senators Dirksen, Hickenlooper, Margaret Chase Smith, Sparkman and Hayden; Representatives Bates and Mahon.'
    text: '[FRUS 1964–68, V, doc. 364](https://history.state.gov/historicaldocuments/frus1964-68v05/d364) (the source note, from the Daily Diary).'
- add-words:
    id: cal.1967-10-23.vietnam-pennsylvania
    after: 'Johnson: "I am not prepared to act simply on hope."'
    words: 'McNamara: "We cannot win the war with bombing in the north"; bombing "a supplement to, not a substitute." Byrd: "You may lose next year''s election because of it, but I believe that history will vindicate you." Albert: "I would tell them to jump in the lake."'
    text: '[FRUS 1964–68, V, doc. 364](https://history.state.gov/historicaldocuments/frus1964-68v05/d364).'
    item: '[[w.berman-lyndon-johnsons-war]], 90'
