    words: Zhou's request had said that the preliminary list, adopted the afternoon before by the presidium and the delegations' convenors, could serve as the formal list; he proposed a presidium meeting half an hour before the session, hoped Mao and Lin would come to see the delegates, and left the time to Mao, after 3 p.m. being better.
