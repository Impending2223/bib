    after: no widening of the targets of attack.
    words: On widening he cites a Peking group's bulletin, that one tendency hides another; at Nankou eight men made a case file on a Party secretary as a "dog spy" and the masses found him a good man; the case-makers' material is not accurate, and a man once shut up is hard to let out. The army is to be careful.
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.77'
- add-words:
    id: cal.1969-04-11.china-leadership
    after: no widening of the targets of attack.
    words: 'By MacFarquhar, he also picks senior men who were in disgrace before the Cultural Revolution, Zhang Wentian and Wang Jiaxiang among them, and calls the ten of the Eighth Central Committee his "opposition"; to delegates'' doubts about electing "old rightists": "What''s wrong with having a few opponents in the party?" and, to Zhang Guohua of the Chengdu Military Region, that those who oppose him are not all bad.'
