    words: The report is "Looking at a Zhenbao tree from the world's forest" 《从世界的森林看一棵珍宝树》, drawn up by Ye Jianying 叶剑英 and checked by Chen Yi 陈毅, Xu Xiangqian 徐向前 and Nie Rongzhen 聂荣臻, and goes to Mao and the Center under the four names. It takes up the causes, aims and course of the Soviet incursion on Zhenbao Island, the American and Soviet bids for world hegemony and their conflicts with other countries, and offers proposals on the militia, training and military production.
