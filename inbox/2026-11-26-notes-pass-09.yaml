    after: Sino-Korean friendship; on Moscow, we do not want a war, we need not abuse Soviet revisionism daily; their daily abuse failed; the split pleases the US; the border has been quiet for a dozen days.
    words: 'Choe says Pyongyang''s ties with Peking are "like one between lips and teeth." Mao: the Americans "intend to attack you," but their main target is China, "therefore, our two countries must be united." He invites Kim Il-sung to China, "either publicly or secretly," and, pointing to Zhou: "we may dispatch Premier Zhou to visit Korea."'
