    words: Zhou and Lin each cross out their own names. Liu Jieting, the rebel from Sichuan, is elected a member with 1,435 votes and his wife Zhang Xiting an alternate with 1,400; Nie Yuanzi an alternate with 937. Wang Baidan, the steelworker, is thirty-four, from Harbin.
