patch: notes-pass-09
by: 'Claude (reader; the notes pass, batch 09: R33a, building on the entry from its cites), audited by Claude (Opus), Nov. 26, 2026: every op checked against its page and corrected in place (notes/notes-pass/audit-09.md)'
ops:
- add-words:
    id: cal.1967-09.vietnam
    after: 'The Marines'' combat base two miles below the DMZ under North Vietnamese artillery, rocket and mortar fire from north of the zone, and attacks across the Bến Hải, through the first three and a half weeks of the month: at least 200 rounds a day; some 1,200 on Sept. 25; over 3,000 Sept. 19–27.'
    words: The heaviest shelling of the war; at its peak, Sept. 19–27, 3,077 mortar, artillery and rocket rounds. An estimated 35,000 North Vietnamese troops massed in the area.
    item: '[[w.macv-command-history-1967]], 361'
