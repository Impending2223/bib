    words: 'On the old comrades, by the recording Yang Jisheng quotes: the old marshals, Li Xiannian and Li Fuchun to be elected; Xu Shiyou: they should be; Jiang Qing: Wang Ming is different; Mao: what harm in a few in opposition; Dong Biwu: the marshals can be elected, Zhang Wentian and Wang Jiaxiang will be hard.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 724'
- add-words:
    id: cal.1969-04-11.china-leadership
    after: no widening of the targets of attack.
    words: 'MacFarquhar, who gives no day, has him pick senior men in disgrace before the Cultural Revolution, Zhang Wentian and Wang Jiaxiang among them, and call the ten of the Eighth Central Committee his "opposition": "What''s wrong with having a few opponents in the party?"; to Zhang Guohua of the Chengdu Military Region, those who oppose him are not "necessarily bad people."'
