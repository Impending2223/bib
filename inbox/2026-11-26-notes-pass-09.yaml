- add-words:
    id: cal.1967-10-08.robert-kennedy
    after: 'Salinger''s meeting on 1968: Edward Kennedy, Stephen Smith, Sorensen, O''Donnell;'
    words: Lawrence O'Brien is there too; Walinsky and the other young aides are not asked.
    item: '[[w.shesol-mutual-contempt]], 406'
- add-words:
    id: cal.1967-10-08.robert-kennedy
    after: 'Sorensen for waiting until 1972; O''Donnell: Johnson a bully and a coward who would run from a fight.'
    words: 'Salinger "guaranteed" Johnson would withdraw. The meeting''s only recommendations: Dolan to poll New Hampshire, Kennedy to get a haircut. O''Donnell: "just the most inconclusive bunch of crap thrown around."'
    item: '[[w.shesol-mutual-contempt]], 406'
