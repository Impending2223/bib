      time_zone: America/New_York
      place: washington
      thread: vietnam-paris
      also:
      - elections-1968
      c: 'The White House dining room, 7:45 to 10 p.m.: Johnson with Rusk, Clifford, Wheeler, Taylor, Rostow and Tom Johnson on Hanoi''s terms. Rusk: "I smell Vodka and Caviar in it." Clifford: "If ten steps separated us, they have taken eight and we have taken 2." Taylor, for the first time with them: "I have been a hard-nosed man, Mr. President, but I am for this." Johnson: "herded into this under pressure"; he wants Soviet assurances on the DMZ and the cities, and Abrams brought back.'
      n: '[FRUS 1964–68, VII, doc. 129](https://history.state.gov/historicaldocuments/frus1964-68v07/d129) (notes of the meeting, 7:45–10 p.m., the White House dining room). [[w.clifford-counsel-to-the-president-2]], 579–81 (the meeting at 7:30 p.m.; Taylor with Rusk and Clifford "for the first time"; Abrams sent for: "Let''s get him back"). Made public: FRUS 1964–68, VII (2003). Check: Clifford, 579, has the meeting convene at 7:30 p.m. See [[cal.1968-10-27.vietnam-paris]]. Names: Johnson, Rusk, Clifford, Wheeler, Taylor, Rostow, Tom Johnson, Abrams.'
