    id: cal.1968-02-27.vietnam
    after: 'Clifford: say we will put in 500,000 to a million men; "How do we avoid creating feeling that we are pounding troops down rathole?"'
    words: 'Katzenbach: the 205,000 cannot be granted; the question is how to handle Wheeler. Rusk shares McNamara''s doubts and proposes a bombing halt; Rostow alone holds the bombing should go on.'
    item: '[[w.califano-triumph-and-tragedy-of]], 263–64'
