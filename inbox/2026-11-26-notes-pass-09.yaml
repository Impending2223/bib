    after: and gives both to the secretariat for editing before publication.
    words: 'Nine speak: Zhou Enlai 周恩来, Chen Boda 陈伯达, Kang Sheng 康生, Huang Yongsheng 黄永胜, Wang Hongwen 王洪文, Chen Yonggui 陈永贵, Sun Yuguo 孙玉国, Wei Fengying 尉凤英 and Ji Dengkui 纪登奎. Sun, a soldier from the Zhenbao front, is applauded standing by Mao as he comes up and when he finishes, and Mao shakes his hand.'
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.79'
- add-words:
    id: cal.1969-04-14.china-leadership
    after: and gives both to the secretariat for editing before publication.
    words: Lin's report passes by a show of hands, and no one objects when Mao asks whether more changes may be made before publication. Wang Hongwen pledges for the working class to "resolutely surpass" the economic targets. Zhou calls Lin Mao's "glorious representative" at Jinggangshan and his "universally recognized successor." Kang Sheng calls the constitution "to the point, not burdened with trivial detail." Jiang Qing says writing Lin's name in will reduce the likelihood that others covet the place.
