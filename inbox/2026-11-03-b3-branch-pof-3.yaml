      also:
      - civil-rights-the-executive
      - georgia
      c: 'The *Atlanta Constitution*, front page: the FBI''s birthday cake for Herbert Guest. DeLoach to Mohr: headquarters
        "fails to reflect that we knew anything about the cake."'
      n: '[[w.branch-pillar-of-fire]], 454, 429. To check: “A check here at the Bureau fails to reflect that we knew anything
        about the cake.” DeLoach to Mohr, Aug. 19, 1964, FLP-210. “The success of this technique was proven, inasmuch as Guest
        furnished damaging information.” SAC, Atlanta, to Hoover, Aug. 1964, FLP-213 (cited by [[w.branch-pillar-of-fire]],
        454); Atlanta Constitution, Aug. 19, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 429); SAC, Atlanta, to Director,
        Aug. 19, 1964, FLP-213 (cited by [[w.branch-pillar-of-fire]], 429); DeLoach to Mohr, Aug. 19, 1964, FLP-210 (cited
        by [[w.branch-pillar-of-fire]], 429). See [[cal.1964-07-31.civil-rights-the-executive]]. Names: DeLoach, Guest.'
      src:
        c: 5c331936
        rows:
