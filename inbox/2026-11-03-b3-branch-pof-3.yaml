      when: Aug. 19
      date: '1964-08-19'
      thread: elections-1964
      also:
      - king
      c: Reedy to Johnson by telephone, 12:34 p.m., on press rumors of King's telegram; the White House to say the Mississippi
        question rests with the convention. King releases nothing.
      n: '[[w.branch-pillar-of-fire]], 454. To check: [Conversation with GEORGE REEDY and OFFICE CONVERSATION, 12:34 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-george-reedy-and-office-conversation-august-2),
        Conversation WH6408-28-5030 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 454); There were scattered small
        stories on the rumors, without citing the telegram, e.g., “LBJ Gets Negro Warning,” WP, Aug. 20, 1964, p. 4 (cited
        by [[w.branch-pillar-of-fire]], 454). See [[cal.1964-08-19.elections-1964]]. Names: Reedy, Johnson, King.'
      src:
        c: b81a6fd4
        rows:
        - 'w.branch-pillar-of-fire 454: all'
        - 'via w.branch-pillar-of-fire 454 n.whole-life-s-work: all'
