      c: 'Atlantic City, Union Temple Baptist. Rauh, Morse, Henry and Rustin for the compromise; Samstein to Rustin, "You''re
        a traitor." King: "being a Negro leader, I want you to take this, but if I were a Mississippi Negro, I would vote
        against it." Moses: "not here to bring politics to our morality, but to bring morality to our politics." The delegates
        reject it again. Hamer: "We didn''t come all this way for no two seats."'
      n: '[[w.branch-pillar-of-fire]], 473–74. To check: Interview with Joseph Rauh, Oct. 17, 1983 (cited by [[w.branch-pillar-of-fire]],
        473); Forman, Black Revolutionaries, p. 392 (cited by [[w.branch-pillar-of-fire]], 473); Interview with Robert P.
        Moses, March 13, 1988. “King was neutral,” said Moses. “He wasn’t taking Bayard’s position.” (cited by [[w.branch-pillar-of-fire]],
        473); Interview with Edwin King by Anne Romaine, Nov. 1966, A/AR (cited by [[w.branch-pillar-of-fire]], 473); Burner,
        Gently He Shall Lead, p. 187 (cited by [[w.branch-pillar-of-fire]], 474); Interview with Victoria Gray Adams, May
        14, 1991 (cited by [[w.branch-pillar-of-fire]], 474); Carson, Jn Struggle, p. 126 (cited by [[w.branch-pillar-of-fire]],
        474); [[w.mills-this-little-light-of]], 132 (cited by [[w.branch-pillar-of-fire]], 474). See [[cal.1964-08-25.mississippi]].
        Names: Rauh, Morse, Henry, Rustin, King, Moses, Hamer.'
