- check:
    id: cal.1963-12-07.economy-2
    text: 'Check: Lady Bird Johnson, 33, has "about eighty-nine businessmen" at a stag dinner for the Business Council at the White House on the evening of Jan. 7, 1964, with Cabinet officers; the entry has the same number on Dec. 7, 1963, in the Cabinet Room. Whether one event, and which day.'
- cite:
    id: cal.1964-01-08.program
    item: '[[w.johnson-white-house-diary]], 34–35 (the House chamber: Mrs. Johnson in the front row with Luci and relatives; Johnson introduced, McCormack and Hayden behind him; the opening, "I will be brief", and the war on poverty; about thirty minutes; the Republican applause sparse; she speaks to the press after)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-08.poverty
      when: Jan. 8
      date: '1964-01-08'
      thread: poverty
      c: The White House family sitting room, about 5:30 p.m. Batt of the Area Redevelopment Administration and two aides, with Liz Carpenter and Kilduff, brief Mrs. Johnson with maps on unemployment in the Pennsylvania coal areas, for her trip Saturday.
      n: '[[w.johnson-white-house-diary]], 35 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Batt, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:batt-william-l-jr
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-01-10.white-house
      when: Jan. 10
      date: '1964-01-10'
      thread: white-house
      c: The Yellow Room, 4 p.m. Mrs. Johnson's tea for about sixty-five newswomen. She introduces Esther Peterson, the President's Assistant for Consumer Problems, who discusses her mail and plans; a tour of the second floor; the tea to set the tone of her "informal meetings" with the press.
      n: '[[w.johnson-white-house-diary]], 36–37 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Esther Peterson.'
      tags:
      - name:johnson-lady-bird
      - name:peterson-esther
- add:
    entry:
      id: cal.1964-01-11.poverty
      when: Jan. 11
      date: '1964-01-11'
      thread: poverty
      c: 'Pennsylvania. Mrs. Johnson with Flood, McDade, Batt, Carpenter, Kilduff and about forty newswomen to the coal region, 11 percent unemployed by Flood''s figure, twice the national rate. Scranton: Mrs. Scranton at her side, the Courthouse Square, flowers, the Mayor. Wilkes-Barre: the key to the city, Goldsmith Mill (a payroll of about a hundred saved by the town and the A.R.A.), the Wyoming Valley Technical Institute.'
      n: '[[w.johnson-white-house-diary]], 38–40 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Flood, Batt, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:flood-daniel-j
      - name:batt-william-l-jr
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-01-11.poverty-2
      when: Jan. 11
      date: '1964-01-11'
      thread: poverty
      c: Wilkes College, Wilkes-Barre. Mrs. Johnson meets students, then attends the dedication of the Science Center, built with A.R.A. funds matched locally; the speaker Frank Graham, former Senator, praises her. Lunch before at the home of the college's president, Eugene Farley.
      n: '[[w.johnson-white-house-diary]], 40–41 (Lady Bird Johnson''s account). See [[cal.1964-01-11.poverty]]. Names: Lady Bird Johnson, Graham.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-11.democratic-party
      when: Jan. 11
      date: '1964-01-11'
      thread: democratic-party
      c: The White House, 6:30 p.m. Mrs. Johnson with Johnson receives about 150 Democratic National Committee members, State chairmen and vice chairmen, and Democratic women. In the State Dining Room Johnson stands on a chair and speaks of the Administration's aims and plans; Margaret Price, vice chairman, takes over the party.
      n: '[[w.johnson-white-house-diary]], 41 (Lady Bird Johnson''s account; Mrs. Johnson was called on for a greeting). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-11.succession
      when: Jan. 11
      date: '1964-01-11'
      thread: succession
      c: Johnson, in the receiving line, tells Mrs. Johnson to pack for Camp David in twenty minutes and sends for McNamara, his wife and their son Craig; they fly by helicopter from the South Lawn that night.
      n: '[[w.johnson-white-house-diary]], 41 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcnamara-robert-s
- cite:
    id: cal.1964-01-12.civil-rights-bill-2
    item: '[[w.johnson-white-house-diary]], 41–42 (Camp David: Johnson to church in Thurmont; Russell arrives about 11 and tells of Antietam, the lost Lee order and McClellan; McNamara''s staff, Vance among them, telephone about Panama; not Russell''s other meetings)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-13.latin-america-panama
      when: Jan. 13
      date: '1964-01-13'
      thread: latin-america-panama
      c: The Cabinet Room, from about 9 p.m. Johnson with Rusk, McNamara, Bundy and about fourteen others on Panama; the meeting breaks up a little after midnight, Johnson talks with his staff, and reaches home at 2 a.m.
      n: '[[w.johnson-white-house-diary]], 44–45 (Lady Bird Johnson''s account: she watched a television program on Panama while waiting, and learned the hours the next morning). Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-01-14.europe-and-the-alliance
      when: Jan. 14
      date: '1964-01-14'
      thread: europe-and-the-alliance
      c: Union Station, noon. Johnson and Mrs. Johnson greet President Segni of Italy and Signora Segni at 18 degrees, the fifty States' flags, a short ceremony, then a parade down Pennsylvania Avenue to Blair House.
      n: '[[w.johnson-white-house-diary]], 45–46 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Segni.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-14.europe-and-the-alliance-2
      when: Jan. 14
      date: '1964-01-14'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner for Segni. In the Yellow Room, Warren, Rusk, the Italian ambassador Fenoaltea, Reinhardt and Duke; gifts, a silver box and a 1774 letter of Philip Mazzei. In the East Room, guests include Pastore, Rodino, Fascell, Conte, Meany, Dubinsky, Reuther; Saragat on Mrs. Johnson''s left. Entertainment by Robert Merrill and the Christy Minstrels. Johnson, at the porch: "I must get back to work."'
      n: '[[w.johnson-white-house-diary]], 46–47 (Lady Bird Johnson''s account; Bundy is quoted: "The President just hates to be unemployed."). Names: Johnson, Lady Bird Johnson, Segni, Warren, Rusk, Duke, Pastore, Rodino, Fascell, Conte, Meany, Reuther, Saragat, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:rusk-dean
      - name:duke-angier-b
      - name:pastore-john-o
      - name:rodino-peter-w-jr
      - name:fascell-dante-b
      - name:conte-silvio-o
      - name:meany-george
      - name:reuther-walter
      - name:saragat-giuseppe
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-01-15.europe-and-the-alliance
      when: Jan. 15
      date: '1964-01-15'
      thread: europe-and-the-alliance
      c: 'The Italian Embassy, 1:30 p.m. Luncheon for Johnson and Mrs. Johnson''s guests, the Segnis; Mrs. Johnson between Segni and Saragat, who tells her of the Pope: he does not kneel. Toasts "pro-Western." The diary has Johnson and Segni in "substantive talks" without their content.'
      n: '[[w.johnson-white-house-diary]], 48–49 (Lady Bird Johnson''s account; she does not say Johnson was at the lunch). Names: Lady Bird Johnson, Segni, Saragat, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:saragat-giuseppe
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-15.congress
      when: Jan. 15
      date: '1964-01-15'
      thread: congress
      c: The White House, the Blue Room and State Dining Room. Mrs. Johnson receives about forty senators and representatives and members of the Canadian Parliament, the Inter-Parliamentary Committee, at Senator Aiken's request. Johnson comes in for ten minutes of greetings.
      n: '[[w.johnson-white-house-diary]], 49–50 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Aiken, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:aiken-george-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-16.white-house
      when: Jan. 16
      date: '1964-01-16'
      thread: white-house
      c: 'The White House, 1 p.m. Mrs. Johnson''s luncheon for Senate wives and others: Mary Ellen Monroney, Betty Fulbright, Abigail McCarthy, Mrs. Hoff, the actress Helen Hayes. Ellen Stoutenberg tells of the twenty-eight United Nations delegates she brought to the Ranch last April; Mrs. Johnson plans more such gatherings of "Women Do-ers."'
      n: '[[w.johnson-white-house-diary]], 49–51 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-16.congress
      when: Jan. 16
      date: '1964-01-16'
      thread: congress
      c: The White House, 7 p.m. Dinner, about sixty-four guests, for the chairmen and ranking members of the Senate committees and the leaders of both parties with their wives. Johnson takes the men to the little theater for a briefing by McCone, McNamara, Rusk and Gordon, "the purpose really business"; Margaret Chase Smith goes with them. Mrs. Johnson shows the wives the second floor. Russell on her left at dinner, Hayden on her right.
      n: '[[w.johnson-white-house-diary]], 51–52 (Lady Bird Johnson''s account; she was not at the briefing). Names: Johnson, Lady Bird Johnson, McCone, McNamara, Rusk, Kermit Gordon, Margaret Chase Smith, Russell, Hayden.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mccone-john-a
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:gordon-kermit
      - name:smith-margaret-chase
      - name:russell-richard-b
      - name:hayden-carl
- add:
    entry:
      id: cal.1964-01-16.congress-2
      when: Jan. 16
      date: '1964-01-16'
      thread: congress
      c: The White House, after dinner. Humphrey, the Fulbrights and the O'Briens stay upstairs with the Johnsons until about 10; Johnson then reads a stack of papers on Panama and goes to bed after 2 a.m.
      n: '[[w.johnson-white-house-diary]], 52 (Lady Bird Johnson''s account; Rusk had warned her of the papers as he came in). Names: Johnson, Lady Bird Johnson, Humphrey, Fulbright, O''Brien, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
      - name:fulbright-j-william
      - name:obrien-lawrence-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-01-17.white-house
      when: Jan. 17
      date: '1964-01-17'
      thread: white-house
      c: 'The White House, 11 a.m. Clifford with Mrs. Johnson on the committees Mrs. Kennedy set up for the White House''s art: to be replaced by an Executive Order making the Curator an official position and creating a Committee on the Preservation of the White House (Walker, Carmichael, Clifford, Walton and Hartzog, with public members); Mrs. Kennedy has made suggestions.'
      n: '[[w.johnson-white-house-diary]], 53–54 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Clifford, Hartzog.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
- add:
    entry:
      id: cal.1964-01-17.governors
      when: Jan. 17
      date: '1964-01-17'
      thread: governors
      c: The White House, afternoon. Mrs. Johnson has tea with Governor Breathitt of Kentucky, newly elected, and Mrs. Breathitt.
      n: '[[w.johnson-white-house-diary]], 54 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:breathitt-edward-t
- add:
    entry:
      id: cal.1964-01-17.white-house-2
      when: Jan. 17
      date: '1964-01-17'
      thread: white-house
      c: The White House, 7:30 p.m. Dinner for the Charles Engelhards and the Mansfields, seven in all, Johnson late. Mrs. Johnson shows Jane Engelhard the dining room furniture the Engelhards gave.
      n: '[[w.johnson-white-house-diary]], 54 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mansfield-mike
- add:
    entry:
      id: cal.1964-01-20.white-house
      when: Jan. 20
      date: '1964-01-20'
      thread: white-house
      c: New York. Mrs. Johnson, by commercial airline, tours the Metropolitan Museum of Art with Mary Lasker, Rorimer, Rousseau and Fosburgh, and the Whitney Museum, to choose American paintings that the museums will lend the White House for two years; lunch at Mrs. Lasker's with Roger Stevens of the Kennedy Cultural Center.
      n: '[[w.johnson-white-house-diary]], 55–56 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Roger Stevens.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-20.white-house-2
      when: Jan. 20
      date: '1964-01-20'
      thread: white-house
      c: New York. Mrs. Johnson with Fortas, Stevenson and Mary Lasker sees Arthur Miller's *After the Fall*, the repertory theater's first play, a benefit; then the champagne supper at New York University with Miller, Robards, Myrna Loy, Lauren Bacall and Mayor Wagner. Stevenson takes her home.
      n: '[[w.johnson-white-house-diary]], 56–57 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Fortas, Stevenson, Wagner.'
      tags:
      - name:johnson-lady-bird
      - name:fortas-abe
      - name:stevenson-adlai-e
      - name:wagner-robert-f-jr
- add:
    entry:
      id: cal.1964-01-21.economy-2
      when: Jan. 21
      date: '1964-01-21'
      thread: economy
      c: 'The Canadian Embassy. Prime Minister Pearson''s dinner in honor of Johnson and Mrs. Johnson, about eighteen: Rusk, Duke, the Canadian ambassador Ritchie, Butterworth and Canadian Cabinet members. Pearson''s toast; the Canadians give Mrs. Johnson a maple-leaf pin and Johnson a Mountie''s saddle.'
      n: '[[w.johnson-white-house-diary]], 58–59 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Lester Pearson, Rusk, Duke, Ritchie, Butterworth.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:pearson-lester-b
      - name:rusk-dean
      - name:duke-angier-b
      - name:ritchie-charles-s-a
- cite:
    id: cal.1964-01-23.baker
    item: '[[w.johnson-white-house-diary]], 60 (Mrs. Johnson, in the evening: Johnson looks "relaxed, happy, successful, even after what must have been a rather grueling press conference"; not the subject)'
    units: '?'
- add:
    entry:
      id: cal.1964-01-23.white-house
      when: Jan. 23
      date: '1964-01-23'
      thread: white-house
      c: 'The White House, 2 p.m. Mrs. Johnson with Cliff Carter of the Democratic National Committee, Carpenter, Bess Abell and Kilduff on her schedule: a reception for college editors in February, the Society of Newspaper Editors in April, the fund-raising dinners, visits to Kentucky, Michigan and New York; she wants a trip South for the A.R.A. or a college.'
      n: '[[w.johnson-white-house-diary]], 59 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Cliff Carter, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-01-23.congress
      when: Jan. 23
      date: '1964-01-23'
      thread: congress
      c: The White House, dinner at round tables in the State Dining Room, the Senate briefing. Mrs. Johnson between Dodd and McGee. Johnson speaks of Hruska; Mrs. Johnson, of Magnuson, who came to Congress with them in 1937; Lynda Bird speaks, to be at George Washington University this semester.
      n: '[[w.johnson-white-house-diary]], 59–60 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Dodd, McGee, Hruska, Magnuson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dodd-thomas-j
      - name:mcgee-gale-w
      - name:hruska-roman-l
      - name:magnuson-warren-g
- add:
    entry:
      id: cal.1964-01-24.white-house
      when: Jan. 24
      date: '1964-01-24'
      thread: white-house
      c: The Queen's Sitting Room. Clifford, Fortas, Walton, Salinger, Carpenter and Mrs. Johnson go over the Executive Order for a permanent Curator and a Committee for the Preservation of the White House. Clifford brings word that Mrs. Kennedy will serve on it, with Henry duPont and James Fosburgh as public members.
      n: '[[w.johnson-white-house-diary]], 60–61 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Clifford, Fortas, Salinger, Carpenter, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
      - name:fortas-abe
      - name:salinger-pierre
      - name:carpenter-liz
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-01-12.white-house
      when: Jan. 12
      date: '1964-01-12'
      thread: white-house
      c: 'Mrs. Johnson''s television interview with Nancy Dickerson, filmed the week before, shown on "The Week That Was" with film from her Pennsylvania trip. By her account "a catastrophe": she looked "old and frenetic and tired and unprepared."'
      n: '[[w.johnson-white-house-diary]], 42 (Lady Bird Johnson''s account of her own appearance; she saw it at Camp David). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-27.cyprus
      when: Jan. 27
      date: '1964-01-27'
      thread: cyprus
      c: 'The White House, 1 p.m. Luncheon for Queen Frederika of Greece and Princess Irene, with the Greek ambassador Matsas, Warren, Ball for Rusk, Fulbright, Sparkman, Symington, Neuberger, Albert Thomas, Frelinghuysen and Brademas. The Queen to Johnson on Cyprus: "Forty miles straight, between there and Turkey, ... can get there in a motorboat." Johnson''s toast on Greece; the Queen''s reply on John Govatos, a friend of Johnson''s since 1931, who had predicted in Corpus Christi that he would be President.'
      n: '[[w.johnson-white-house-diary]], 61–63 (Lady Bird Johnson''s account; she overheard the remark on Cyprus; the guests are hers). Names: Johnson, Lady Bird Johnson, Frederika, Matsas, Warren, Ball, Sparkman, Albert Thomas, Frelinghuysen, Brademas, Neuberger.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:ball-george-w
      - name:sparkman-john
      - name:thomas-albert
      - name:frelinghuysen-peter-h-jr
      - name:brademas-john
      - name:neuberger-maurine-b
- add:
    entry:
      id: cal.1964-01-30.congress
      when: Jan. 30
      date: '1964-01-30'
      thread: congress
      c: 'The White House, the last of the Senate dinners and briefings: cocktails, the briefing for the men by Rusk, McNamara and Gordon, the wives upstairs, then dinner. Johnson toasts Keating, the top Republican present; Mrs. Johnson toasts Monroney, who with Johnson alone of the oil States'' senators voted against raising the price of oil in the war. Dancing in the East Room, Thurmond and Smathers among Mrs. Johnson''s partners.'
      n: '[[w.johnson-white-house-diary]], 66 (Lady Bird Johnson''s account; she was not at the briefing). Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Kermit Gordon, Keating, Monroney, Thurmond, Smathers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:gordon-kermit
      - name:keating-kenneth-b
      - name:monroney-almer-s
      - name:thurmond-strom
      - name:smathers-george-a
- add:
    entry:
      id: cal.1964-02-05.white-house
      when: Feb. 5
      date: '1964-02-05'
      thread: white-house
      c: The Mayflower Hotel, 7:30 a.m. Congressional wives' prayer breakfast, Mrs. Langford presiding, Mrs. B. Everett Jordan introducing Mrs. Billy Graham, who speaks; Mrs. Johnson quotes a hymn learned in Greece; Mrs. Hodges reads. Johnson and a few Senators who began the Prayer Breakfast come in, and Billy Graham speaks briefly. Mrs. Johnson takes the Grahams to Johnson's office.
      n: '[[w.johnson-white-house-diary]], 67–68 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Billy Graham.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:graham-billy
- add:
    entry:
      id: cal.1964-02-05.governors
      when: Feb. 5
      date: '1964-02-05'
      thread: governors
      c: The White House, 1:30 p.m. Mrs. Johnson has tea with Mrs. Carl Sanders, wife of the Governor of Georgia, and Mrs. Farris Bryant, wife of the Governor of Florida, after their tour of the house; Mrs. Sanders gives her a Georgia charm, with kind words for Johnson.
      n: '[[w.johnson-white-house-diary]], 68 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- cite:
    id: cal.1964-02-05.cuba
    item: '[[w.johnson-white-house-diary]], 68 (Johnson leaves in the middle of the afternoon for New York and the Joseph P. Kennedy Foundation dinner; Mrs. Johnson stays; not the Weizmann dinner or Cuba)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-11.white-house
      when: Feb. 11
      date: '1964-02-11'
      thread: white-house
      c: 'The White House, 7 p.m. Diplomatic reception. Mrs. Johnson and Johnson receive the Dean of the Corps, Sevilla-Sacasa of Nicaragua, Warren, Rusk and Sparkman upstairs; the Spanish ambassador presents a letter to Johnson on Spain''s recognition of Russia, and they leave the room for a while. Four new ambassadors present credentials: the Dominican Republic, Libya, Peru and Sweden. Dancing: Mrs. Johnson with Dobrynin, who tells her of Siberia''s diamonds, and with the Kuwaiti Al-Ghoussein; Dobrynin dances with Lynda Bird. Johnson stays until 9:30.'
      n: '[[w.johnson-white-house-diary]], 69–71 (Lady Bird Johnson''s account; she leaves early with flu). See [[cal.1964-02-11.civil-rights-bill-2]]. Names: Johnson, Lady Bird Johnson, Sevilla-Sacasa, Warren, Rusk, Sparkman, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:rusk-dean
      - name:sparkman-john
      - name:dobrynin-anatoly
- cite:
    id: cal.1964-02-11.civil-rights-bill-2
    item: '[[w.johnson-white-house-diary]], 70–71 (the diplomatic reception in the evening, Johnson at it until 9:30; not the talk of cloture)'
    units: '?'
- cite:
    id: cal.1964-02-12.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 71 (the arrival ceremonies for the Douglas-Homes in the morning, brief speeches by the Prime Minister and Johnson; not the talks)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-12.white-house
      when: Feb. 12
      date: '1964-02-12'
      thread: white-house
      c: 'The White House, dinner with William S. White, the columnist, and Mrs. White: his book, and Johnson''s reasons for going to church, which Mrs. Johnson gives as that anyone in his house needed help "more than man''s" and that no one could any longer say he went for political reasons.'
      n: '[[w.johnson-white-house-diary]], 71–72 (Lady Bird Johnson''s account; she does not say Johnson was at the table). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-27.white-house
      when: Jan. 27
      date: '1964-01-27'
      thread: white-house
      c: The White House, after the Queen's luncheon. Mrs. Johnson gives Mrs. Charles Lindbergh two hours for an interview for a magazine article she is writing, in the Queen's Sitting Room; they talk of Mrs. Lindbergh's books *Gift from the Sea* and *Dearly Beloved*.
      n: '[[w.johnson-white-house-diary]], 63 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-02-14.soviet-union
      when: Feb. 14
      date: '1964-02-14'
      thread: soviet-union
      c: 'The White House, late afternoon. Mrs. Johnson has John and Elaine Steinbeck to tea, back from six months in Poland, Czechoslovakia and Russia on a cultural-exchange mission. Steinbeck: the Russians were hospitable but would not believe facts about the United States, among them Khrushchev''s shoe at the United Nations.'
      n: '[[w.johnson-white-house-diary]], 72 (Lady Bird Johnson''s account of what the Steinbecks told her). To check: the Steinbecks'' tour. Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-02-14.program
      when: Feb. 14
      date: '1964-02-14'
      thread: program
      c: St. Louis. Johnson speaks at the city's bicentennial celebration.
      n: '[[w.johnson-white-house-diary]], 72–73 (Lady Bird Johnson''s account: "Tonight Lyndon is in St. Louis, making a speech celebrating St. Louis'' Bicentennial"; she is in Washington). To check: the Public Papers, Remarks in St. Louis, Feb. 14, 1964. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-02-25.white-house
      when: Feb. 25
      date: '1964-02-25'
      thread: white-house
      c: 'The Executive Office Building. Mrs. Johnson visits the volunteers answering mail for Mrs. Kennedy, Tuckerman showing her four rooms: Foreign Service and Army wives, Mrs. Moorhead, translators. The mail has fallen from 44,000 messages on a peak day after Nov. 22 to seven or eight hundred a day. She thanks the telephone operators, and sees the Kennedy files, to go to the Kennedy Library.'
      n: '[[w.johnson-white-house-diary]], 73–74 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1964-02-26.economy
    item: '[[w.johnson-white-house-diary]], 74–76 (the East Room, evening, the signing before the congressional leaders; Johnson''s statement of the $11.5 billion cut and its effects; the vote 74 to 19; Byrd thanked for letting the bill out of committee; Russell Long, Smathers, Mills, Albert, McCormack and Dillon present; not the rates)'
    units: '?'
- add:
    entry:
      id: cal.1964-02-26.robert-kennedy
      when: Feb. 26
      date: '1964-02-26'
      thread: robert-kennedy
      c: Mrs. Kennedy's house, Georgetown, after the tax bill signing. Johnson and Mrs. Johnson meet the Kennedy Cabinet there, for about forty-five minutes; Johnson brings four of the signing pens, for Mrs. Kennedy, the Kennedy Library and the two children. The Cabinet gives her a gold tray and coffee service engraved with the names of the Cabinet and the President's closest advisers; Rusk makes the speech. To the reporters outside Johnson calls the visit "very moving" and says Kennedy had worked long and hard on the bill.
      n: '[[w.johnson-white-house-diary]], 76 (Lady Bird Johnson''s account; it was meant as a surprise to Mrs. Kennedy). See [[cal.1964-02-26.economy]]. Names: Johnson, Lady Bird Johnson, Jacqueline Kennedy, Kennedy, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-02-26.succession
      when: Feb. 26
      date: '1964-02-26'
      thread: succession
      c: Johnson and Mrs. Johnson call without notice on the Valentis in Georgetown and stay to supper.
      n: '[[w.johnson-white-house-diary]], 76–77 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-02-28.succession
      when: Feb. 28
      date: '1964-02-28'
      thread: succession
      c: Palm Beach, Fla. Johnson and Mrs. Johnson pay a courtesy call on Joseph P. Kennedy, an invalid since his stroke in December 1961, and Mrs. Kennedy at their house; two of the Robert Kennedy children are there. Mrs. Kennedy talks of the house and the family, and is grateful for Johnson's kindnesses to the family.
      n: '[[w.johnson-white-house-diary]], 77–78 (Lady Bird Johnson''s account; the visit was the night before, ending with her return to Washington at 8:30 a.m. on the 28th). Check: the day of the visit. Names: Johnson, Lady Bird Johnson, Joseph Kennedy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-joseph-p
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-02-28.white-house-2
      when: Feb. 28
      date: '1964-02-28'
      thread: white-house
      c: 'Georgetown, 11 a.m. Mrs. Johnson with Mrs. Kennedy: the Committee for the Preservation of the White House to have as members the head of the Smithsonian, Park Service, Fine Arts Commission and National Gallery, the Curator and the Chief Usher, with public members; Mrs. Kennedy accepts to serve and Mrs. Johnson will ask duPont and Fosburgh. Mrs. Kennedy''s own Fine Arts Committee to be dissolved, with an advisory committee kept. Mrs. Johnson gives her four coins with President Kennedy''s head, the first minted.'
      n: '[[w.johnson-white-house-diary]], 78–79 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy, Clifford.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:clifford-clark
- add:
    entry:
      id: cal.1964-02-28.governors
      when: Feb. 28
      date: '1964-02-28'
      thread: governors
      c: The White House, about 4 p.m. Governor Connally and Mrs. Connally, in Washington, come for coffee with Johnson; snow cancels their plane and the Johnsons keep them for the night, with the Walter Jenkinses to dinner.
      n: '[[w.johnson-white-house-diary]], 79–80 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
- add:
    entry:
      id: cal.1964-03-10.succession
      when: Mar. 10
      date: '1964-03-10'
      thread: succession
      c: Washington. Mrs. Johnson leaves for Athens for the funeral of King Paul, co-chief with Truman of the official delegation, which includes Brademas, Manatos of the White House staff, John Plumides of Ahepa, Judge John Pappas, Archbishop Iakovos, General Vaughan, Clifton Daniel, Angier Biddle Duke and Mrs. Duke. Truman meets the Greek party in the Diplomatic Reception Room about 3:45; Mrs. Johnson says good-by to Johnson on the lawn; helicopter to Andrews; Air Force One leaves about 5 p.m.
      n: '[[w.johnson-white-house-diary]], 81–82 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Truman, Brademas, Manatos, Duke.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:truman-harry-s
      - name:brademas-john
      - name:manatos-mike-n
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-03-10.succession-2
      when: Mar. 10
      date: '1964-03-10'
      thread: succession
      c: 'Air Force One to Athens. Truman to Mrs. Johnson: the Truman Doctrine "was all the Marshall Plan"; on the Presidency, "Get all the information you can, make up your mind and go ahead—and tell them to go to Hell"; of a wife, "Protect him. Don''t let people use you"; his three lectures to students; Tyler''s answer to Webster, "I am the President." Reporters bring the New Hampshire result: Lodge''s write-in beat Rockefeller and Goldwater, with write-ins for Robert Kennedy for Vice President and more for Johnson.'
      n: '[[w.johnson-white-house-diary]], 82–84 (Lady Bird Johnson''s account; she gives no count). See [[cal.1964-03-10.elections-1964]]. Names: Lady Bird Johnson, Truman, Lodge, Rockefeller, Goldwater, Robert Kennedy, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:lodge-henry-cabot
      - name:rockefeller-nelson
      - name:goldwater-barry-m
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-03-10.elections-1964
    item: '[[w.johnson-white-house-diary]], 84 (on the plane that night, reporters bring word that Lodge, a write-in and away in Vietnam, beat Rockefeller and Goldwater, with write-ins for Robert Kennedy for Vice President and more for Johnson; no figures)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-11.succession
      when: Mar. 11
      date: '1964-03-11'
      thread: succession
      c: 'Athens, 8:45 a.m. Mrs. Johnson and Truman land, met by Prince Michael and the Grand Mistress of the Court; anthems, troops reviewed, to the Athens Hilton. Prince Michael says his grandfather was aide-de-camp to Grant; Truman: "on the wrong side." With Ambassador Labouisse they sign the guest book at the Palace.'
      n: '[[w.johnson-white-house-diary]], 84–85 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:labouisse-henry-r-jr
- add:
    entry:
      id: cal.1964-03-11.cyprus-2
      when: Mar. 11
      date: '1964-03-11'
      thread: cyprus
      c: 'Athens. Mrs. Labouisse, at lunch, tells Mrs. Johnson of Greek politics: Karamanlis out, George Papandreou, about seventy-five, Prime Minister by a sizable majority; his son Andreas, an American citizen teaching at Berkeley, has given up his citizenship to serve in his father''s government. Andreas''s American wife, with Mrs. Costopoulos, the Foreign Minister''s wife, takes Mrs. Johnson sightseeing and speaks of her husband''s plans for industrializing Greece. Mrs. Johnson sees tourism hurt by the stoning mobs and the threat to Cyprus.'
      n: '[[w.johnson-white-house-diary]], 85–86 (Lady Bird Johnson''s account; the Papandreous'' plans are as the wife told them). Names: Lady Bird Johnson, George Papandreou, Andreas Papandreou.'
      tags:
      - name:johnson-lady-bird
      - name:papandreou-george
      - name:papandreou-andreas
- add:
    entry:
      id: cal.1964-03-11.cyprus-3
      when: Mar. 11
      date: '1964-03-11'
      thread: cyprus
      c: 'The Royal Palace, Athens, 9 p.m. Informal supper for the funeral delegations; two of each delegation invited, Mrs. Johnson and Truman for the United States. Queen Frederika receives Mrs. Johnson alone. Present: Kings and Queens of Denmark, Sweden, Norway, Belgium, the Netherlands, Prince Philip, Prince Rainier, exiled and pretender kings, German princes of the Queen''s family. Makarios of Cyprus the center of all eyes; the Queen speaks with him in a corner for a long time, and "everyone was mentally clocking the minutes."'
      n: '[[w.johnson-white-house-diary]], 86–89 (Lady Bird Johnson''s account; Truman left early). Names: Lady Bird Johnson, Truman, Frederika, Makarios.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-03-12.succession
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: 'Athens Cathedral. Requiem Mass for King Paul, Archbishop Chrysostomos and about fifty prelates; Queen Frederika and King Constantine, Princess Sophie, Juan Carlos, Princess Irene. Chiefs of State on the left: Mrs. Johnson, Truman, Queen Juliana, Baudouin, Frederick IX, Gustaf VI, Olav V, Prince Philip. The coffin on a gun carriage drawn by one hundred sailors; Mrs. Johnson walks the mile and a half to the Athens Hilton, about 1,000,000 lining the road, with Prince Philip and Archbishop Makarios in her row; the crowd cheers Makarios.'
      n: '[[w.johnson-white-house-diary]], 89–91 (Lady Bird Johnson''s account; the crowd is by report). Names: Lady Bird Johnson, Truman, Constantine, Makarios.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:constantine-ii
      - name:makarios-iii
- add:
    entry:
      id: cal.1964-03-12.succession-2
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: Tatoi, the royal summer palace. Burial of King Paul in the family cemetery; Queen Juliana asks Labouisse to introduce the chiefs of state, among them the prince of Cambodia (whose countrymen had stoned the American Embassy the day before), the Crown Prince of Ethiopia, Couve de Murville and the Jordanian foreign minister. Constantine receives the folded standard from the coffin and gives it to the Queen; three shots; Mrs. Johnson and Truman bow at the grave. Lunch at the palace near 4 p.m.
      n: '[[w.johnson-white-house-diary]], 91–94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse, Couve de Murville, Constantine.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:labouisse-henry-r-jr
      - name:couve-de-murville-maurice
      - name:constantine-ii
- add:
    entry:
      id: cal.1964-03-12.succession-3
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: 'Athens, on the way back from Tatoi. Truman to Mrs. Johnson: Roosevelt picked him as running mate because "he couldn''t stand to see anybody succeed him that he thought could do as well"; "I want Lyndon Johnson to do well. I know he''s going to be a great President. ... I''ve been for him all these years."'
      n: '[[w.johnson-white-house-diary]], 94 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-03-12.succession-4
      when: Mar. 12
      date: '1964-03-12'
      thread: succession
      c: 'Athens, evening. The Labouisses'' dinner for the American delegation and Embassy staff: Brademas, Manatos, Pappas, Plumides, Archbishop Iakovos, the Dukes, Vaughan, Daniel, Robert Dowling for the Mayor of New York, General Van Fleet and Karl Rankin. Truman plays the piano; toasts.'
      n: '[[w.johnson-white-house-diary]], 94–95 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Labouisse, Brademas, Manatos, Duke.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:labouisse-henry-r-jr
      - name:brademas-john
      - name:manatos-mike-n
      - name:duke-angier-b
- cite:
    id: cal.1964-03-19.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 96 (Salinger tells Johnson in his office about 3 p.m. that he will resign to run for the Senate in California, and then tells the press; the diary has no lunch)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-19.transition-and-staff-2
      when: Mar. 19
      date: '1964-03-19'
      thread: transition-and-staff
      c: Johnson telephones George Reedy in the hospital and asks him to take the press secretary's job; Reedy accepts and agrees to come over as soon as possible, so that the announcement can be made.
      n: '[[w.johnson-white-house-diary]], 96 (Lady Bird Johnson''s account; she gives no hour). See [[cal.1964-03-19.transition-and-staff]]. Names: Johnson, Reedy, Salinger.'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-19.democratic-party-2
      when: Mar. 19
      date: '1964-03-19'
      thread: democratic-party
      c: The Armory. The Democratic fund-raising dinner, 5,300 present, for the Congressional Class of 1936, of which Johnson was a member; James Farley toastmaster; the co-chairmen Mrs. Miller, Lindy Boggs and Mrs. Claiborne Pell; about thirty-five Texans from the old Tenth District. Stevenson with the Johnsons. Johnson's speech, with little humor. Mrs. Johnson notes the St. Patrick's decorations and no member of the Kennedy family.
      n: '[[w.johnson-white-house-diary]], 96–97 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Stevenson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1964-03-20.white-house
      when: Mar. 20
      date: '1964-03-20'
      thread: white-house
      c: 'Mrs. Paul Mellon with Mrs. Johnson in the White House gardens. Mrs. Mellon proposes a plaque in the East Garden for Mrs. Kennedy. Johnson, Clifford, Hartzog and Walton all approve. Mrs. Kennedy: no; "scratch my initials on a tree, or put a plaque, ever so little, underneath some bench."'
      n: '[[w.johnson-white-house-diary]], 97–98 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy, Johnson, Clifford, Walton.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:walton-william
- add:
    entry:
      id: cal.1964-03-24.space
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: 'Huntsville, Ala. Mrs. Johnson, with Carpenter and about thirty reporters, lands at the Marshall Space Flight Center; Webb, Von Braun and Representative Robert Jones meet her. Her speech to about 300: she comes because Johnson wrote the Space Act in 1958, because women hold 20 percent of the payroll, and because the space program takes the South into the future. "The South has hitched its wagon to the stars."'
      n: '[[w.johnson-white-house-diary]], 98–99 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Webb, Von Braun, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:webb-james-e
      - name:von-braun-wernher
      - name:carpenter-liz
- add:
    entry:
      id: cal.1964-03-24.space-3
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: The Saturn exhibits and test stand. Mrs. Johnson, with Webb and Von Braun, tours the engineering hangar and the Saturn exhibits, and is given a hard hat. Von Braun wears the Stetson Johnson gave him at the Ranch at Erhard's visit. After lunch she watches from a bunker the test firing of an eight-engine cluster of Saturn I; Saturn I is to put an unmanned Apollo craft in orbit, one on the pad at Cape Kennedy.
      n: '[[w.johnson-white-house-diary]], 99–101 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Webb, Von Braun, Johnson, Erhard.'
      tags:
      - name:johnson-lady-bird
      - name:webb-james-e
      - name:von-braun-wernher
      - name:johnson-lyndon-b
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1964-03-24.space-4
      when: Mar. 24
      date: '1964-03-24'
      thread: space
      c: The Administration Building auditorium. Mrs. Johnson presents service, invention and achievement awards to NASA employees in the Administration Building auditorium, about 500 present; then a reception hosted by Mrs. Webb and Mrs. Von Braun for Alabama officials and organization leaders.
      n: '[[w.johnson-white-house-diary]], 101 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Webb, Von Braun.'
      tags:
      - name:johnson-lady-bird
      - name:webb-james-e
      - name:von-braun-wernher
- cite:
    id: cal.1964-04-07.farm
    item: '[[w.johnson-white-house-diary]], 101–02 (the night of the 7th, after the North Carolina reception: Johnson in the little room with staff, O''Brien going through a list of House members, committed, against, shaky, absent and pairable; Johnson making call after call; the bill had been nearly given up for lost, "the Food Stamp plan tied in with it")'
    units: '?'
- check:
    id: cal.1964-04-07.farm
    text: 'Check: Lady Bird Johnson, 101–02, has the farm bill (with the food stamp plan) passing on the night of Apr. 7, writing on Apr. 8 of the night before; the votes in the House were on Apr. 8.'
- add:
    entry:
      id: cal.1964-04-08.succession
      when: Apr. 8
      date: '1964-04-08'
      thread: succession
      c: 'Union Station and the Capitol. Funeral of General Douglas MacArthur. Johnson and Mrs. Johnson board the train to greet Mrs. MacArthur and the family, among them Ambassador Douglas MacArthur and General Courtney Whitney. The casket goes by caisson to the Capitol; the Joint Chiefs walk behind; in the Rotunda, where Congress has adjourned, the House and Senate chaplains pray and Johnson places a wreath. Robert Kennedy, beside Mrs. Johnson: "We seem always to be meeting at funerals ... There''ve been a lot of them these last four months." And: "You''re doing a wonderful job. Everybody says so ... and so is your husband."'
      n: '[[w.johnson-white-house-diary]], 102–03 (Lady Bird Johnson''s account; Johnson on the ride tells Lynda Bird of the Silver Star MacArthur gave him in New Guinea). Names: Johnson, Lady Bird Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-04-08.succession-2
      when: Apr. 8
      date: '1964-04-08'
      thread: succession
      c: The White House, Yellow Oval Room. Mrs. Johnson gives tea to Mrs. MacArthur, her son and the family after the Capitol service.
      n: '[[w.johnson-white-house-diary]], 103–04 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-08.press-and-broadcasting
      when: Apr. 8
      date: '1964-04-08'
      thread: press-and-broadcasting
      c: 'Lippmann, on television for an hour: foreign aid will be hard to pass after what he says of it; of the Vice Presidency, Johnson need not look for help, and McNamara, once a registered Republican, is passed over. By Mrs. Johnson''s account, who watched.'
      n: '[[w.johnson-white-house-diary]], 104 (Lady Bird Johnson''s account). Names: Lippmann, Johnson, McNamara.'
      tags:
      - name:lippmann-walter
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-09.succession
      when: Apr. 9
      date: '1964-04-09'
      thread: succession
      c: New York Hilton. The first anniversary luncheon of the Eleanor Roosevelt Memorial Foundation, 2,800 at $12.50, to raise $100,000; Jean Kintner's. Mrs. Johnson, Mrs. Kintner and Anna Rosenberg Hoffman receive donors of $1,000. Stevenson introduces Mrs. Johnson, who speaks of Mrs. Roosevelt at a benefit luncheon in 1939 and of her speaking out. Marian Anderson reads from Mrs. Roosevelt's book.
      n: '[[w.johnson-white-house-diary]], 105–06 (Lady Bird Johnson''s account; she speaks from a draft she wrote with Hester Provenson). Names: Lady Bird Johnson, Stevenson.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- cite:
    id: cal.1964-04-09.railroads
    item: '[[w.johnson-white-house-diary]], 106 (the diary: Johnson, who told her at breakfast of the railroad strike due that night, has asked the Brotherhood and the railroads to meet with him; he stays at the office until midnight)'
    units: '?'
- add:
    entry:
      id: cal.1964-04-10.program
      when: Apr. 10
      date: '1964-04-10'
      thread: program
      c: The White House, 2:30 p.m. Mrs. Johnson receives Carl Sandburg, his wife and Edward Steichen and Mrs. Steichen, brought by Udall and Mrs. Udall. In the Lincoln Room Sandburg signs her books on Lincoln; Johnson joins; tea in the Yellow Room.
      n: '[[w.johnson-white-house-diary]], 107–08 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Udall.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1964-04-10.press-and-broadcasting
      when: Apr. 10
      date: '1964-04-10'
      thread: press-and-broadcasting
      c: 'The Truman Balcony. Johnson takes Sandburg and Steichen out on the balcony and shouts back and forth with reporters in the Rose Garden. The Associated Press: "President Johnson staged a balcony scene."'
      n: '[[w.johnson-white-house-diary]], 107–08 (Lady Bird Johnson''s account, quoting the AP and the Herald Tribune). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-04-10.railroads-2
      when: Apr. 10
      date: '1964-04-10'
      thread: railroads
      c: The Cabinet Room. Johnson ushers Sandburg and Steichen in to see the railroad industry leaders, "some tough men operating ... who can throw several million people out of work," ready to spend fourteen or fifteen days in negotiations to prevent a strike.
      n: '[[w.johnson-white-house-diary]], 108 (Lady Bird Johnson''s account). See [[cal.1964-04-10.railroads]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-04-10.transition-and-staff
      when: Apr. 10
      date: '1964-04-10'
      thread: transition-and-staff
      c: The home of Mr. and Mrs. Dillon. Dinner in honor of Under Secretary Fowler and Mrs. Fowler, who is leaving government for the third time; toasts. Johnson and Mrs. Johnson attend.
      n: '[[w.johnson-white-house-diary]], 108–09 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Dillon, Fowler.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dillon-c-douglas
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1964-04-14.middle-east-2
      when: Apr. 14
      date: '1964-04-14'
      thread: middle-east
      c: The White House, 11:30 a.m. King Hussein of Jordan arrives by helicopter on the South Lawn, with his brother Prince Hassan; Johnson's welcome and the King's response on the North Portico. Johnson, to the surprise of the Secret Service, rides with him to Blair House and walks back, shaking hands and signing autographs.
      n: '[[w.johnson-white-house-diary]], 109 (Lady Bird Johnson''s account; Johnson told her to appear). See [[cal.1964-04-14.middle-east]]. Names: Johnson, Lady Bird Johnson, Hussein, Duke.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hussein-ibn-talal
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-04-14.consumers
      when: Apr. 14
      date: '1964-04-14'
      thread: consumers
      c: The Department of Agriculture. Mrs. Johnson opens the Food and Home Fair for Consumers, Jane and Orville Freeman, Esther Peterson and Mrs. John G. Lee of the Consumer Advisory Council receiving her; a few words as the family's "purchasing agent."
      n: '[[w.johnson-white-house-diary]], 109–10 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Freeman, Esther Peterson.'
      tags:
      - name:johnson-lady-bird
      - name:freeman-orville-l
      - name:peterson-esther
- add:
    entry:
      id: cal.1964-04-14.white-house
      when: Apr. 14
      date: '1964-04-14'
      thread: white-house
      c: 'The Senate Ladies Red Cross Luncheon in Mrs. Johnson''s honor, her first as guest after fifteen years as a hostess; Mrs. Dominick of Colorado the Republican chairman, Betty Talmadge co-chairman; Louella Dirksen presents her a Senate-seal charm. Mrs. Johnson: the longest chapter in any book of her life would be "our love affair with the Senate."'
      n: '[[w.johnson-white-house-diary]], 110 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Dirksen.'
      tags:
      - name:johnson-lady-bird
      - name:dirksen-everett
- add:
    entry:
      id: cal.1964-04-14.middle-east-3
      when: Apr. 14
      date: '1964-04-14'
      thread: middle-east
      c: 'The White House, State dinner for King Hussein, about 150 guests. In the Yellow Oval Room, gifts: from the Johnsons a gold clock, a pen stand and a book of Johnson''s speeches; from the King two bracelets of Abraham''s time, a lamp, and a Bible in mother-of-pearl. The guests include Warren, Ball, the Dukes, Hoover, Najeeb Halaby, Helen Thomas of UPI. Hussein tells Mrs. Johnson that many of the Jordan''s springs rise in Israel; he piloted his own 707; the Dave Brubeck Quartet plays.'
      n: '[[w.johnson-white-house-diary]], 110–12 (Lady Bird Johnson''s account; Hoover "never goes to affairs of this sort"). See [[cal.1964-04-14.middle-east]]. Names: Johnson, Lady Bird Johnson, Hussein, Warren, Ball, Duke, Hoover.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hussein-ibn-talal
      - name:warren-earl
      - name:ball-george-w
      - name:duke-angier-b
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1964-04-16.white-house
      when: Apr. 16
      date: '1964-04-16'
      thread: white-house
      c: The White House, afternoon. Johnson brings some forty Texas newspaper editors and their wives to the Oval Room for refreshments, among them Hobby, Mayborn and Humphrey; Jenkins, Cliff Carter and Valenti help; Johnson shows them the gardens from the Truman Balcony.
      n: '[[w.johnson-white-house-diary]], 112 (Lady Bird Johnson''s account; the names are hers). Names: Johnson, Lady Bird Johnson, Jenkins, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:jenkins-walter-w
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-04-16.program
      when: Apr. 16
      date: '1964-04-16'
      thread: program
      c: 'The White House, dinner. Barbara Ward (Lady Jackson), staying on the third floor, and Dr. Willis Hurst with the Johnsons. Lady Jackson: the money saved and men put out of work by the base closings might serve a pilot program in urban renewal, a model city; automation can be a blessing. Johnson listens.'
      n: '[[w.johnson-white-house-diary]], 112–13 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-17.press-and-broadcasting
      when: Apr. 17
      date: '1964-04-17'
      thread: press-and-broadcasting
      c: 'The Rose Garden and South Lawn, 5:30 p.m. Reception for the American Society of Newspaper Editors, 1,200. Mrs. Johnson and Lynda Bird welcome them; Johnson speaks: the President''s duties, civil rights, the war on poverty, "turning tax eaters into tax payers," 49 percent of draftees unfit, Medicare, the pay bill, the railroad talks; and "we must either love each other or we must die." Food in the State Dining Room, dancing in the East Room; Miles Wolff and Herbert Brucker of the Society with them.'
      n: '[[w.johnson-white-house-diary]], 113–14 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-19.white-house
      when: Apr. 19
      date: '1964-04-19'
      thread: white-house
      c: Johnson and Mrs. Johnson to St. Mark's Church with Dillon and Mrs. Dillon and Stevenson, who had come about 10:15 to talk a little business; Johnson shakes hands with tourists at the gate. Lunch with the Dillons and the McNamaras.
      n: '[[w.johnson-white-house-diary]], 114–15 (Lady Bird Johnson''s account; she does not say what Stevenson''s business was). Names: Johnson, Lady Bird Johnson, Dillon, Stevenson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dillon-c-douglas
      - name:stevenson-adlai-e
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1964-04-22.white-house
      when: Apr. 22
      date: '1964-04-22'
      thread: white-house
      c: The White House, 4 p.m. Mrs. Johnson receives about 200 Daughters of the American Revolution, the State Regents and national officers, the first First Lady's reception for them in eleven years; Mrs. Duncan, the president, brings two pairs of white gloves.
      n: '[[w.johnson-white-house-diary]], 115–16 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-22.white-house-2
      when: Apr. 22
      date: '1964-04-22'
      thread: white-house
      c: 'The White House. Mrs. Johnson with Boisfeuillet Jones of Health, Education and Welfare, Carpenter and Wendy Marcus, planning her trip to Atlanta on May 11: groundbreaking for the Communicable Disease Center, Emory''s honors convocation, lunch, the Governor and the legislature, a reception at the Mansion, the art museum.'
      n: '[[w.johnson-white-house-diary]], 116 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Boisfeuillet Jones, Carpenter.'
      tags:
      - name:johnson-lady-bird
      - name:jones-boisfeuillet
      - name:carpenter-liz
- cite:
    id: cal.1964-04-22.railroads
    item: '[[w.johnson-white-house-diary]], 116–17 (Johnson comes out of the elevator with the men for the Yellow Room, about twenty, among them Dr. William J. Taylor of the mediators; later, thumb and forefinger raised to Mrs. Johnson as a sign of success; the announcement on television on the David Brinkley show, with a word for Taylor, whose wife was in surgery; not the terms)'
    units: '?'
- cite:
    id: cal.1964-04-24.poverty
    item: '[[w.johnson-white-house-diary]], 117–23 (the five-State day: South Bend, Pittsburgh, Inez and Paintsville, Huntington; the Cabinet members with Johnson; the Governors'' conference and the television speech; see the entries below)'
    units: '?'
- add:
    entry:
      id: cal.1964-04-24.poverty-2
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: 'South Bend, Ind., 8:45 a.m. Johnson and Mrs. Johnson land at the Cline School playground before about 15,000; Studebaker closed last Christmas Eve and threw 8,700 out of work. Three adult literacy classes, a computer class, a practical nursing class; Johnson speaks without notice from the athletic field. With them: Wirtz, Hodges, Franklin Roosevelt Jr., Celebrezze, six Congressmen, and Governors Welsh, Barron and Breathitt in and out.'
      n: '[[w.johnson-white-house-diary]], 117–19 (Lady Bird Johnson''s account; she places the start at 5:30 a.m. in Chicago). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson, Wirtz, Hodges, Franklin Roosevelt Jr., Celebrezze, Welsh, Barron, Breathitt.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:wirtz-w-willard
      - name:hodges-luther-h
      - name:roosevelt-franklin-d-jr
      - name:celebrezze-anthony-j
      - name:welsh-matthew-e
      - name:barron-w-w
      - name:breathitt-edward-t
- add:
    entry:
      id: cal.1964-04-24.poverty-3
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: 'Pittsburgh, the League of Women Voters'' convention, 1,300 delegates; Wirtz was to speak and brought the President along on the evening before. Johnson: his program is to give work to a half-million young Americans; the women of America to be first to enlist. Mrs. Johnson thanks the League for bringing the issues to the people. Met at the airport by Mayor Barr, Governor David Lawrence, Senators Hugh Scott and Joseph Clark and David McDonald.'
      n: '[[w.johnson-white-house-diary]], 119 (Lady Bird Johnson''s account). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson, Wirtz, Barr, David Lawrence, Hugh Scott, Clark, David McDonald.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:wirtz-w-willard
      - name:barr-joseph-m
      - name:lawrence-david-l
      - name:scott-hugh-d-jr
      - name:clark-joseph-s
      - name:mcdonald-david-l
- add:
    entry:
      id: cal.1964-04-24.poverty-4
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: 'Pittsburgh. Motorcade to David McDonald Hall, the Steelworkers'' home local, a quarter of a million along the route by the Chief of Police''s estimate; Johnson in an open convertible stops three times to speak by bullhorn on the war on poverty and discrimination. McDonald, introducing him: "that the Union shall do all of the down-to-earth work that is possible to elect you this November." Mrs. Johnson speaks a minute.'
      n: '[[w.johnson-white-house-diary]], 119–20 (Lady Bird Johnson''s account: "the first really outspoken assumption that Lyndon is running"). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson, David McDonald.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:mcdonald-david-l
- add:
    entry:
      id: cal.1964-04-24.poverty-5
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: 'Inez, Martin County, Ky. Johnson and Mrs. Johnson at the three-room tarpaper house of Tom Fletcher, a former miner with eight children who earned $400 in the last year; the New York *Herald Tribune*: "The President hunkered down on the porch with Mr. Fletcher for a talk." A storekeeper tells Mrs. Johnson the area needs jobs and a hospital. Martin County has the lowest per capita income in Kentucky.'
      n: '[[w.johnson-white-house-diary]], 120–22 (Lady Bird Johnson''s account; the income rank is as she was told). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-24.poverty-6
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: Paintsville, Ky. The Mayo State Vocational School, then Johnson's speech at the courthouse, where he calls on Wirtz and Celebrezze to stand; each is across the street at the ice cream parlor, and each sprints back, Wirtz taking the bow for Celebrezze.
      n: '[[w.johnson-white-house-diary]], 122 (Lady Bird Johnson''s account). See [[cal.1964-04-24.poverty]]. Names: Johnson, Lady Bird Johnson, Wirtz, Celebrezze.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:wirtz-w-willard
      - name:celebrezze-anthony-j
- add:
    entry:
      id: cal.1964-04-24.poverty-7
      when: Apr. 24
      date: '1964-04-24'
      thread: poverty
      c: 'Huntington, W. Va., after 6 p.m. Johnson on the plane with the Governors of the Appalachian States, Welsh, Breathitt, Barron and a representative of Scranton, on the Appalachian recovery plan, about $3 billion over five years: planned for thirty minutes, it lasts nearly two hours. Then a short televised speech: poverty and unemployment unnecessary. All day Johnson: "We are going to have a Civil Rights Bill if it takes all summer."'
      n: '[[w.johnson-white-house-diary]], 122–23 (Lady Bird Johnson''s account). See [[cal.1964-04-24.poverty]]. Names: Johnson, Welsh, Breathitt, Barron, Scranton.'
      tags:
      - name:johnson-lyndon-b
      - name:welsh-matthew-e
      - name:breathitt-edward-t
      - name:barron-w-w
      - name:scranton-william-w
- add:
    entry:
      id: cal.1964-04-25.succession
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: The White House, morning. Johnson holds a brief press conference in his office, 60 to 70 reporters in a half circle, with Truman on his right and J. Frank Dobie, the Texas folklorist, a guest at the White House, on his left.
      n: '[[w.johnson-white-house-diary]], 123–24 (Lady Bird Johnson''s account, from Dobie''s description). Names: Johnson, Truman.'
      tags:
      - name:johnson-lyndon-b
      - name:truman-harry-s
- add:
    entry:
      id: cal.1964-04-25.succession-2
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: 'The White House, lunch after 2 p.m. Johnson with Truman, Dobie and the editors Walker Stone and Bill Steven; Lynda Bird and a friend. Truman on the decision to use the bomb: told it would end the war in days, he asked Marshall and Bradley the cost of an invasion, 200,000 to 250,000 lives; "there was nothing to do but drop it." His hard decisions all made the same way, and he sleeps. Dobie reports Truman as saying, "Lyndon Johnson may be the greatest President since Lincoln," from the railroad settlement.'
      n: '[[w.johnson-white-house-diary]], 124 (Lady Bird Johnson''s account; the Lincoln remark is Dobie''s report). Names: Johnson, Truman, Marshall, Bradley.'
      tags:
      - name:johnson-lyndon-b
      - name:truman-harry-s
      - name:marshall-george-c
      - name:bradley-omar-n
- add:
    entry:
      id: cal.1964-04-25.succession-3
      when: Apr. 25
      date: '1964-04-25'
      thread: succession
      c: The Gridiron Dinner, Washington. Johnson attends in white tie, a stag dinner; Dobie goes with Walker Stone.
      n: '[[w.johnson-white-house-diary]], 124–25 (Lady Bird Johnson''s account; she records only that he goes). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-04-27.south-asia
      when: Apr. 27
      date: '1964-04-27'
      thread: south-asia
      c: 'The White House, 11 a.m. Mrs. Johnson has coffee with Indira Gandhi, Mrs. Avtar Dhar of the Indian Embassy and Mrs. Rusk; Mrs. Gandhi: the health of Nehru is steadily improving. Mrs. Johnson thinks that with Nehru gone Mrs. Gandhi may be the leading influence in India.'
      n: '[[w.johnson-white-house-diary]], 125 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Indira Gandhi, Rusk.'
      tags:
      - name:johnson-lady-bird
      - name:gandhi-indira
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-04-27.white-house
      when: Apr. 27
      date: '1964-04-27'
      thread: white-house
      c: 'Georgetown. Mrs. Johnson asks Mrs. Kennedy to attend the meeting of the Committee for the Preservation of the White House and the tea on May 7. Mrs. Kennedy: "I cannot return to the White House"; she asks Mrs. Johnson to tell them she sends her best wishes. Mrs. Johnson shows her the East Room drapery fabric, chosen last summer from Boudin.'
      n: '[[w.johnson-white-house-diary]], 125–27 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-04-27.labor
      when: Apr. 27
      date: '1964-04-27'
      thread: labor
      c: The White House. Johnson's impromptu reception for labor newspaper editors, nominally stag; Johnson sends for Mrs. Johnson because some of the editors are women.
      n: '[[w.johnson-white-house-diary]], 127 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-28.program
      when: Apr. 28
      date: '1964-04-28'
      thread: program
      c: The White House, black-tie dinner for business leaders. Batten of J. C. Penney, Blough of U.S. Steel, Busch, Donald David and Henry Ford II of the Ford Foundation and Company, Greenewalt of du Pont, Kappel, McCabe of Scott Paper, David and James Rockefeller and Touhy of the C&O among them. Mrs. Johnson, at Johnson's note passed by Valenti, proposes a toast to the leaders of business; dancing in the East Room.
      n: '[[w.johnson-white-house-diary]], 127–28 (Lady Bird Johnson''s account; she does not give the guests as a list of the whole). Names: Johnson, Lady Bird Johnson, Blough, Henry Ford II, Kappel, David Rockefeller, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:blough-roger-m
      - name:ford-henry-ii
      - name:kappel-frederick-r
      - name:rockefeller-david
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-04-30.white-house
      when: Apr. 30
      date: '1964-04-30'
      thread: white-house
      c: The Sheraton Park, the Congressional Club's annual breakfast in honor of the First Lady, about a thousand women; the president Carrie Davis. Mrs. Johnson recalls her first, in 1938, with Eleanor Roosevelt as guest.
      n: '[[w.johnson-white-house-diary]], 128–29 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-04-30.program-2
      when: Apr. 30
      date: '1964-04-30'
      thread: program
      c: 'Winchester, Va. Johnson drives to the Shenandoah Apple Blossom Festival, unannounced to Mrs. Johnson, for the crowning of Luci Johnson as queen by General LeMay on the steps of the high school: "She''s always been a Queen to me." His telegram to the festival''s officials warns the city of Winchester "is in danger of being taken over by a new monarch."'
      n: '[[w.johnson-white-house-diary]], 129–30 (Lady Bird Johnson''s account; she saw the photograph and read the telegram). Names: Johnson, Lady Bird Johnson, LeMay.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:lemay-curtis-e
- add:
    entry:
      id: cal.1964-04-30.japan-and-korea-far-east
      when: Apr. 30
      date: '1964-04-30'
      thread: japan-and-korea-far-east
      c: The White House, Blue Room. Mrs. Johnson, at the State Department's request, receives eleven visiting Japanese Governors and their wives; Duke and Mrs. Ball for the department.
      n: '[[w.johnson-white-house-diary]], 130 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Duke.'
      tags:
      - name:johnson-lady-bird
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-04-30.democratic-party
      when: Apr. 30
      date: '1964-04-30'
      thread: democratic-party
      c: 'The Sheraton Park, evening. Johnson addresses the Democratic Women''s Conference, 3,000, Margaret Price introducing him; jokes, then women in government jobs: "I promise this tonight not because you need jobs but because the country needs you." Mrs. Johnson takes a bow.'
      n: '[[w.johnson-white-house-diary]], 130 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-06.white-house
      when: May 6
      date: '1964-05-06'
      thread: white-house
      c: The White House, 1 p.m. Mrs. Johnson's luncheon for the Senate Ladies Red Cross unit, 130 at tables set with the china of eighteen Administrations; the wives of sitting and former Senators, among them Mrs. Mansfield, Mrs. Kuchel, Mrs. Kefauver. Mrs. Johnson reads Abigail Adams's letter of 1800; Helen Hayes and company perform from Hotchner's play *The White House*. Johnson comes in and calls the Senate wives "the jewels" of the Senators.
      n: '[[w.johnson-white-house-diary]], 130–32 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-05-06.press-and-broadcasting
    item: '[[w.johnson-white-house-diary]], 132–33 (the South grounds, 4:30 p.m.: Johnson in the band shell answering questions on the gross national product, Vietnam and Republican nominees; the reporters'' children; photographs with them; Mary McGrory''s piece; not the statement)'
    units: '?'
- add:
    entry:
      id: cal.1964-05-06.white-house-2
      when: May 6
      date: '1964-05-06'
      thread: white-house
      c: Alice Brown, wife of George Brown of Houston, arrives as a White House guest with a Winslow Homer watercolor, "The Surf at Prout's Neck," and a Sully portrait of Washington as gifts, the first important acquisition through Mrs. Johnson.
      n: '[[w.johnson-white-house-diary]], 133 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-07.white-house
      when: May 7
      date: '1964-05-07'
      thread: white-house
      c: 'The Yellow Oval Room, 10:30 a.m. First meeting under Mrs. Johnson of the Committee for the Preservation of the White House, with Clifford: the first panel of East Room damask, the Adams silver urn acquired, copies of the antique Green, Blue and Red Room rugs to be priced, the Historical Association''s finances. Johnson and Lynda Bird have left for Andrews on the poverty tour.'
      n: '[[w.johnson-white-house-diary]], 134 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Clifford, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:clifford-clark
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-05-07.poverty
    item: '[[w.johnson-white-house-diary]], 134 (Johnson and Lynda Bird leave by helicopter for Andrews that morning for a five-State poverty tour of two days)'
    units: '?'
- add:
    entry:
      id: cal.1964-05-07.white-house-2
      when: May 7
      date: '1964-05-07'
      thread: white-house
      c: 'The Green Room and Blue Room, 4 p.m. Mrs. Johnson''s tea for about fifty-five people of the art world: members of Mrs. Kennedy''s Fine Arts, Paintings and Library Committees and the Advisory Committee, curators and museum directors; a list of gifts to the collection since Mrs. Kennedy''s tea of Dec. 1, 1962. She makes a speech of welcome.'
      n: '[[w.johnson-white-house-diary]], 135–36 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- check:
    id: cal.1964-05-14.elections-1964
    text: 'Check: Lady Bird Johnson, 138–40, writes of the memorandum that she wrote it at Huntland, Middleburg, Va., on May 14, nine pages, out of her "own feelings on what Lyndon should do this August," with a draft announcement that he would not run; she does not say he asked for it. Her conclusion, 139: run, and announce in "February or March 1968" that he will not be a candidate for reelection.'
- cite:
    id: cal.1964-05-14.elections-1964
    item: '[[w.johnson-white-house-diary]], 138–40 (the memorandum, nine pages, with a draft announcement of withdrawal, the alternatives, and her conclusion to run now and announce in February or March 1968; given to Dr. Hurst and Dr. Cain to pass to Johnson at the meeting next morning; not "at his asking", not the notebook)'
    units: '?'
- add:
    entry:
      id: cal.1964-05-14.elections-1964-johnson
      when: May 14
      date: '1964-05-14'
      thread: elections-1964-johnson
      c: Huntland, Middleburg, Va. Mrs. Johnson has Dr. Hurst and Dr. James Cain of the Mayo Clinic to dinner, with Luci, to talk over Johnson's situation; she gives them her memorandum to take to Johnson the next morning. Both think from the psychological side that he should continue now, that idleness and loss of command would be harder on him than the work. She doubts either understands his pain at the thought of sending many thousands of American boys to Vietnam or elsewhere.
      n: '[[w.johnson-white-house-diary]], 138–40 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Hurst.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-05-15.elections-1964-johnson
      when: May 15
      date: '1964-05-15'
      thread: elections-1964-johnson
      c: The White House. Dr. Hurst and Dr. James Cain meet with Dr. Larry Lamb of San Antonio and Dr. George Burkley and Dr. Janet Travell of the White House over Johnson's health, a thorough check-up planned for the morning; Mrs. Johnson's memorandum to be handed to Johnson.
      n: '[[w.johnson-white-house-diary]], 138–40 (Lady Bird Johnson''s account of what was planned the evening before; she does not describe the meeting). Check: the day, the meeting and the check-up as planned, not as held. Names: Johnson, Hurst, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-14.elections-1964-johnson-2
      when: May 14
      date: '1964-05-14'
      thread: elections-1964-johnson
      c: 'A little after midnight Johnson, back from a stag party, telephones Mrs. Johnson at Huntland: lonesome, by her account; "a sad-happy talk," his "restive desire to seek a way out of the burdens he carries."'
      n: '[[w.johnson-white-house-diary]], 140 (Lady Bird Johnson''s account; the call falls after midnight, on the 15th). Check: the day, the 14th or the 15th. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: Kentucky. Mrs. Johnson, with Carpenter, Bess Abell, Representative Perkins, Batt of the A.R.A. and aides of Agriculture and Commerce, lands at Lexington about 8 a.m., Governor and Mrs. Breathitt meeting her. Eight hours by motorcade, foot and helicopter through the Cumberland Plateau. On the road she stops the motorcade at a school of children on the last day of classes.
      n: '[[w.johnson-white-house-diary]], 140–41 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Carpenter, Perkins, Batt, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:perkins-carl-d
      - name:batt-william-l-jr
      - name:breathitt-edward-t
- add:
    entry:
      id: cal.1964-05-21.poverty-2
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: 'Warshoal Branch, Breathitt County, Ky. Mrs. Johnson walks a mile up the creek to the three-room house of Arthur Robertson, his wife and seven children: a $700 federal grant for materials, siding, a well; three-fifths of an acre of tobacco; a part-time job on the Unemployed Parents program. Federal money in Kentucky, about $200 million a year since 1961. Mrs. Robertson: "It don''t hurt to dream!"'
      n: '[[w.johnson-white-house-diary]], 141–42 (Lady Bird Johnson''s account; the federal total is as she gives it). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty-3
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: 'Lick Branch School, Breathitt County. Mrs. Johnson lunches with the 25 children of the one-room school, a hot lunch for ten cents; presents a flag that flew over the Capitol and a set of encyclopedias; she throws the switch on the school''s first electric lights. Marie Turner, the county superintendent: a year''s teacher turnover; school lunch lifts the children.'
      n: '[[w.johnson-white-house-diary]], 142–44 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-21.poverty-4
      when: May 21
      date: '1964-05-21'
      thread: poverty
      c: Breathitt High School, Jackson, Ky. Mrs. Johnson makes her first speech of the day to about 5,000, among them the Lieutenant Governor and Perkins, at the dedication of the new gymnasium, one of 188 accelerated public works projects in the Cumberland area; Mrs. Roosevelt dedicated the old one 26 years before. Mrs. Breathitt gives her a hooked rug and a quilt.
      n: '[[w.johnson-white-house-diary]], 144 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Perkins, Breathitt.'
      tags:
      - name:johnson-lady-bird
      - name:perkins-carl-d
      - name:breathitt-edward-t
- cite:
    id: cal.1964-05-23.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 144–46 (Lexington, Va.: Johnson and Mrs. Johnson with Acheson, Rusk and Byrd; the cadets; the visit to the library with Eisenhower, Mrs. Marshall and Governor Harrison; Bradley presiding, then Eisenhower''s speech and Johnson''s, "touching"; not the words of Johnson''s speech)'
    units: '?'
- add:
    entry:
      id: cal.1964-05-23.program
      when: May 23
      date: '1964-05-23'
      thread: program
      c: 'Lexington, Va. Johnson inspects the V.M.I. cadets; he and Mrs. Johnson visit the Marshall Library with Eisenhower, Mrs. Marshall and Governor Harrison. Bradley to Mrs. Johnson before the ceremony: "This is one of the twenty-two things I''m doing because I think they''re good to do."'
      n: '[[w.johnson-white-house-diary]], 145 (Lady Bird Johnson''s account). See [[cal.1964-05-23.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Eisenhower, Harrison, Bradley.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:eisenhower-dwight-d
      - name:harrison-albertis-s-jr
      - name:bradley-omar-n
- add:
    entry:
      id: cal.1964-05-25.white-house
      when: May 25
      date: '1964-05-25'
      thread: white-house
      c: New York, Museum of Modern Art, evening. Dinner for 400 at the opening of the new wing, at Frank Stanton's urging; Stevenson takes Mrs. Johnson; David Rockefeller speaks; Lipchitz, who designed the Presidential scholars' medal, at her table. Mrs. Johnson presses the switch that lights the garden and the wing and salutes "a war against the poverty of man's spirit."
      n: '[[w.johnson-white-house-diary]], 146–48 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Stevenson, Stanton, David Rockefeller.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
      - name:stanton-frank
      - name:rockefeller-david
- add:
    entry:
      id: cal.1964-05-25.white-house-2
      when: May 25
      date: '1964-05-25'
      thread: white-house
      c: 'New York, Waldorf Towers. Stevenson''s party after the opening: Richard Rodgers, Marc Connelly, Galbraith, Josh Logan, Fredric March, the Weisls, the Fortases. Galbraith with Mrs. Johnson on her Kentucky trip and the idea of a teachers training corps.'
      n: '[[w.johnson-white-house-diary]], 148 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Stevenson, Galbraith, Fortas.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
      - name:galbraith-john-kenneth
      - name:fortas-abe
- cite:
    id: cal.1964-05-27.india-and-china
    item: '[[w.johnson-white-house-diary]], 148 (the news of Nehru''s death at about 6 a.m.; Rusk left at dawn for the funeral)'
    units: '?'
- add:
    entry:
      id: cal.1964-05-27.europe-and-the-alliance
      when: May 27
      date: '1964-05-27'
      thread: europe-and-the-alliance
      c: 'The South Lawn. Johnson and Mrs. Johnson receive President de Valera of Ireland: the Diplomatic Corps, anthems, troops reviewed, speeches; they ride with him to Blair House.'
      n: '[[w.johnson-white-house-diary]], 148–49 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-05-27.europe-and-the-alliance-2
      when: May 27
      date: '1964-05-27'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner for de Valera. Gifts: a vermeil cigar box, an antique ballot box, a copy of his baptismal certificate (St. Agnes, New York). Robert Kennedy, Mrs. Kennedy and Edward Kennedy and his wife decline; the Shrivers come for the family; Ball and Mrs. Ball for Rusk, away at Nehru''s funeral. Johnson''s toast: "there are more Irishmen in the White House than people."'
      n: '[[w.johnson-white-house-diary]], 149–50 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Robert Kennedy, Ted Kennedy, Shriver, Ball, Rusk, Duke.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-robert-f
      - name:kennedy-edward-m
      - name:shriver-r-sargent
      - name:ball-george-w
      - name:rusk-dean
      - name:duke-angier-b
- add:
    entry:
      id: cal.1964-06-04.white-house
      when: June 4
      date: '1964-06-04'
      thread: white-house
      c: The East Room, 5 p.m. Mark Bortman of Boston, who headed the People-to-People program, presents John Adams's silver coffee urn to the White House, before 13 Adamses, the Massachusetts delegation led by Saltonstall, and about 80 guests. Mrs. Johnson accepts it; Thomas Boylston Adams of the Massachusetts Historical Society gives her two volumes of the Adams letters.
      n: '[[w.johnson-white-house-diary]], 151–53 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Saltonstall, Thomas Boylston Adams.'
      tags:
      - name:johnson-lady-bird
      - name:saltonstall-leverett
      - name:adams-thomas-boylston
- add:
    entry:
      id: cal.1964-06-04.white-house-2
      when: June 4
      date: '1964-06-04'
      thread: white-house
      c: The home of Max Freedman, Washington. Johnson and Mrs. Johnson at a birthday supper for Bill Moyers, thirty, about twenty present.
      n: '[[w.johnson-white-house-diary]], 153 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:moyers-bill
- add:
    entry:
      id: cal.1964-06-04.elections-1964-johnson
      when: June 4
      date: '1964-06-04'
      thread: elections-1964-johnson
      c: The Senate caucus room. Rally forming Young Citizens for Johnson, Bayh and Marvella Bayh the organizers; Charlotte Ford, daughter of Henry Ford II, who says she decided to vote for Johnson before her father, a Republican, declared for him; John Reuther, son of Victor Reuther, Bobby Mitchell of the Redskins, Peter Duchin and Mayor Wagner's son Bob Jr. among them. Lynda Bird and Luci attend.
      n: '[[w.johnson-white-house-diary]], 154 (Lady Bird Johnson''s account of the *New York Times* report; the rally was "yesterday" in an entry dated June 5). Check: the day; the diary has June 4 by the entry date, June 5. Names: Johnson, Bayh, Lynda Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:bayh-birch
      - name:johnson-lynda-bird
- add:
    entry:
      id: cal.1964-06-05.middle-east-2
      when: June 5
      date: '1964-06-05'
      thread: middle-east
      c: 'National Cathedral. Memorial service for Nehru, Johnson and Mrs. Johnson attending with Rusk and Mrs. Rusk and Mrs. B. K. Nehru; B. K. Nehru, India''s Ambassador, followed with Bunker, formerly Ambassador to India, and Dean Sayre. Present: Lord and Lady Harlech, Dobrynin, the Dean of the Corps. Bunker on Nehru: lines of Frost on a pad on his desk.'
      n: '[[w.johnson-white-house-diary]], 154–55 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Nehru, Rusk, Bunker, Dobrynin.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:nehru-jawaharlal
      - name:rusk-dean
      - name:bunker-ellsworth
      - name:dobrynin-anatoly
- cite:
    id: cal.1964-06-05.middle-east
    item: '[[w.johnson-white-house-diary]], 155 (the State luncheon at the White House for the Shah and the Empress Farah, Mrs. Johnson on the North Portico; Johnson late; the Shah on his dams, one a year; not the talks with Johnson)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-05.program
      when: June 5
      date: '1964-06-05'
      thread: program
      c: 'The White House. Dinner for John and Elaine Steinbeck. Steinbeck on Russia: the Russians'' dislike of the Chinese, shown by Khrushchev''s daughter Rada; it is "blindness" not to have relations with the quarter of mankind in Red China; invite young Russian writers who object to their government to see the country as it is. Steinbeck has written a piece on Johnson that the Democratic Committee will distribute at the Convention; Mrs. Johnson asks for more such help. Johnson, the Steinbecks and Mrs. Johnson walk along Pennsylvania Avenue to see them off.'
      n: '[[w.johnson-white-house-diary]], 155–57 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Khrushchev.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:khrushchev-nikita-s
- cite:
    id: cal.1964-06-06.laos
    item: '[[w.johnson-white-house-diary]], 157–58 (the telephone call from McGeorge Bundy at 4:30 a.m. that one of the reconnaissance planes had been shot down over Laos; Johnson up early)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-06.laos-2
      when: June 6
      date: '1964-06-06'
      thread: laos
      c: 'Johnson in the White House hall to Mrs. Johnson, after a morning of Laos and Vietnam: "We''ve got our planes ready to go in if absolutely necessary. Everybody''s in agreement that we can''t turn and run." He asks her to take something to Walter Jenkins.'
      n: '[[w.johnson-white-house-diary]], 158 (Lady Bird Johnson''s account; she puts it about 1:45 p.m.). See [[cal.1964-06-06.laos]]. Names: Johnson, Lady Bird Johnson, Walter Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-06-09.program
      when: June 9
      date: '1964-06-09'
      thread: program
      c: 'Cambridge, Mass. Mrs. Johnson gives the baccalaureate address at Radcliffe, in the Memorial Church of Harvard: education a loan to be repaid by a gift of self; the "natural woman"; better cities; "make your front line of freedom your front door"; women''s low voting rate. She notes Mary Bunting''s appointment to the Atomic Energy Commission by Johnson.'
      n: '[[w.johnson-white-house-diary]], 158–60 (Lady Bird Johnson''s account; Johnson spoke at Swarthmore the day before). Names: Lady Bird Johnson, Johnson, Galbraith, Peabody.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:galbraith-john-kenneth
      - name:peabody-endicott
- add:
    entry:
      id: cal.1964-06-09.program-2
      when: June 9
      date: '1964-06-09'
      thread: program
      c: Cambridge. Mrs. Johnson, with Mrs. Peabody and Mrs. John Collins, walks the site on the Charles River given by Harvard for the Kennedy Library; flies back to Washington.
      n: '[[w.johnson-white-house-diary]], 160 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Peabody.'
      tags:
      - name:johnson-lady-bird
      - name:peabody-endicott
- add:
    entry:
      id: cal.1964-06-09.europe-and-the-alliance
      when: June 9
      date: '1964-06-09'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner-dance for Prime Minister Jens Otto Krag of Denmark and Mrs. Krag, Peter Duchin''s music. Gifts: for the Krags'' estate a barbecue wagon and a turquoise-and-silver Hopi necklace; Lynda Bird gives the children a talking doll and a hobby horse. Luci Johnson''s first State dinner.'
      n: '[[w.johnson-white-house-diary]], 160–62 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-10.program
      when: June 10
      date: '1964-06-10'
      thread: program
      c: 'The East Room, 5:30 p.m. Johnson presents the Presidential Scholars'' medals to 121 students, two from each State and others, chosen by a commission headed by Milton Eisenhower, with Fulbright among its members; they had been briefed by Rusk, shown the Capitol, lunched with their Congressmen, briefed by Alan Shepard at NASA and met Warren at the Supreme Court. Johnson: "You are younger than most of the earth''s quarrels, and you are older than most of the earth''s governments." His delivery below par; Southeast Asia has kept him at his desk.'
      n: '[[w.johnson-white-house-diary]], 162–64 (Lady Bird Johnson''s account). Names: Johnson, Milton Eisenhower, Fulbright, Rusk, Shepard, Warren.'
      tags:
      - name:johnson-lyndon-b
      - name:eisenhower-milton-s
      - name:fulbright-j-william
      - name:rusk-dean
      - name:shepard-alan-b-jr
      - name:warren-earl
- add:
    entry:
      id: cal.1964-06-10.program-2
      when: June 10
      date: '1964-06-10'
      thread: program
      c: The White House. The Presidential Scholars' reception with invited artists and scientists, among them Balanchine, Herblock, Helen Hayes, de Kooning, Harper Lee, Lippmann, Oppenheimer, Seaborg, Shepard, Ben Shahn and John Walker; entertainment on the lawn, Poitier, the Gerry Mulligan Quartet, Jose Ferrer, Bernstein, the Kingston Trio. Lynda Bird host to the students.
      n: '[[w.johnson-white-house-diary]], 164–65 (Lady Bird Johnson''s account; guests as she recognized them). Names: Lippmann, Oppenheimer, Seaborg, Shepard, Lady Bird Johnson.'
      tags:
      - name:lippmann-walter
      - name:oppenheimer-j-robert
      - name:seaborg-glenn-t
      - name:shepard-alan-b-jr
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-10.robert-kennedy
      when: June 10
      date: '1964-06-10'
      thread: robert-kennedy
      c: The South Lawn. Johnson, who has been in the West Wing in a Southeast Asia briefing with Cabinet members, goes out to mingle with the Presidential Scholars, goes back in and brings out Robert Kennedy to meet the young people.
      n: '[[w.johnson-white-house-diary]], 164–65 (Lady Bird Johnson''s account, from the newspapers). Names: Johnson, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-11.elections-1964-johnson
      when: June 11
      date: '1964-06-11'
      thread: elections-1964-johnson
      c: Johnson, by Mrs. Johnson's account, wants her help to get out of the race; the cloture vote on the civil rights bill passed the day before, with about four votes to spare. She thinks he could announce at the bill's signing but fears "a wave of disillusion, resentment, even bitterness" and that no Democrat is ready to step in; she can only say, "Stay on for now."
      n: '[[w.johnson-white-house-diary]], 165–66 (Lady Bird Johnson''s account, from a drive home from Philadelphia, where she attended the Golden Slipper Dinner). See [[cal.1964-05-14.elections-1964]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-14.succession
      when: June 14
      date: '1964-06-14'
      thread: succession
      c: Johnson and Mrs. Johnson to the National City Christian Church with Secretary Hodges, Mrs. Hodges and the Udalls; lunch with them, on the Interstate highways, 90 percent federal, and Hodges's ruling that routes across parks and shrines are decided case by case; Udall for preserving the wilderness.
      n: '[[w.johnson-white-house-diary]], 166 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Hodges, Udall.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:hodges-luther-h
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1964-06-14.elections-1964-johnson
      when: June 14
      date: '1964-06-14'
      thread: elections-1964-johnson
      c: 'Afternoon. Johnson to Mrs. Johnson: the next five months, with Vietnam, Laos and Cyprus, and a summer of turmoil if the civil rights bill passes, and worse if it fails; he wishes for an honorable way out. She: "What exit is there?"'
      n: '[[w.johnson-white-house-diary]], 166–67 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-06-14.vietnam
      when: June 14
      date: '1964-06-14'
      thread: vietnam
      c: About 8:30 p.m. Johnson telephones Rusk at his office; Rusk brings a wire from Lodge asking to resign as Ambassador to Vietnam and come home. Johnson has already asked Bundy, McNamara and Rusk whom they would recommend, and their lists contain men whose willingness to go has been checked.
      n: '[[w.johnson-white-house-diary]], 167 (Lady Bird Johnson''s account). See [[cal.1964-06-16.vietnam-2]]. Names: Johnson, Rusk, Lodge, Bundy, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:lodge-henry-cabot
      - name:bundy-mcgeorge
      - name:mcnamara-robert-s
- cite:
    id: cal.1964-06-16.vietnam-2
    item: '[[w.johnson-white-house-diary]], 167 (Johnson asking, if Lodge resigned, "Whom do you recommend?" of Bundy, McNamara and Rusk; the diary gives Sunday, June 14, evening, for Lodge''s wire and not the 16th)'
    units: '?'
- add:
    entry:
      id: cal.1964-06-15.succession
      when: June 15
      date: '1964-06-15'
      thread: succession
      c: The White House. Mrs. Johnson is interviewed for two hours by William Manchester, whom Mrs. Kennedy has chosen to write a book on the assassination; Manchester is interviewing everyone present in the five days.
      n: '[[w.johnson-white-house-diary]], 167 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Manchester, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:manchester-william
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1964-06-15.elections-1964-johnson
      when: June 15
      date: '1964-06-15'
      thread: elections-1964-johnson
      c: 'The White House, dinner with Joseph Alsop and Mrs. Alsop and Clifford and Mrs. Clifford. Wagers on the Republican nomination: Alsop five to two and Clifford four to one for Goldwater; one thinks Scranton is thinking of the future, to pick up the pieces. Alsop on the Turks and Greeks, with Inonu and Papandreou to come in a week. After they leave, Johnson says Alsop told him: "if you don''t commit troops you''re going to preside over the first real defeat of the United States in history."'
      n: '[[w.johnson-white-house-diary]], 167–68 (Lady Bird Johnson''s account). Names: Johnson, Alsop, Clifford, Goldwater, Scranton, Inonu, George Papandreou.'
      tags:
      - name:johnson-lyndon-b
      - name:alsop-joseph
      - name:clifford-clark
      - name:goldwater-barry-m
      - name:scranton-william-w
      - name:inonu-ismet
      - name:papandreou-george
- add:
    entry:
      id: cal.1964-06-16.cities-and-housing
      when: June 16
      date: '1964-06-16'
      thread: cities-and-housing
      c: The White House, Mrs. Johnson's Women Do-ers luncheon, with Jane Jacobs, author of *The Death and Life of Great American Cities*, as speaker; Mary Roebling the banker, Mrs. Clark Kerr and Marie Turner of Breathitt County among the guests. Jacobs on park upkeep and the mortgage blackout in changing neighborhoods. Johnson greets them after lunch.
      n: '[[w.johnson-white-house-diary]], 169–70 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Jane Jacobs, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:jacobs-jane
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-06-16.robert-kennedy
      when: June 16
      date: '1964-06-16'
      thread: robert-kennedy
      c: 'New York, the St. Regis. Dinner for 300 given by Stephen Smith and the trustees of the Kennedy Library in honor of Mrs. Kennedy, her first public social appearance since the assassination; Johnson and Mrs. Johnson, with Warren, Goldberg, the Freemans, the McNamaras, the Celebrezzes and Edward Kennedy, fly from Washington. Mrs. Johnson sits between Robert Kennedy and Stephen Smith; Johnson at Mrs. Kennedy''s table. Robert Kennedy: the guests all gave $10,000 or more; the $10 million expected by September. Fredric March reads poems Mrs. Kennedy chose.'
      n: '[[w.johnson-white-house-diary]], 170–71 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Jacqueline Kennedy, Stephen Smith, Warren, Goldberg, Freeman, McNamara, Celebrezze, Ted Kennedy, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:smith-stephen-e
      - name:warren-earl
      - name:goldberg-arthur-j
      - name:freeman-orville-l
      - name:mcnamara-robert-s
      - name:celebrezze-anthony-j
      - name:kennedy-edward-m
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-16.civil-rights-the-executive
      when: June 16
      date: '1964-06-16'
      thread: civil-rights-the-executive
      c: 'New York, the car in from the St. Regis, Johnson and Mrs. Johnson with Warren and Robert Kennedy. Johnson and Kennedy, in earnest, on the first acts after the civil rights bill passes: a meeting of the Governors of the nineteen States without public accommodations laws, not only Southern ones, to work out a peaceful transition; and a mediator, Johnson wanting a Southerner, for the complaints.'
      n: '[[w.johnson-white-house-diary]], 171–72 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Warren, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:warren-earl
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1964-06-20.congress
      when: June 20
      date: '1964-06-20'
      thread: congress
      c: Mrs. Johnson telephones Rose Kennedy and the Northampton hospital about Edward Kennedy's plane crash; Dr. Corriden reports on Bayh and his wife, who escaped with minor injuries; Joan Kennedy says Kennedy can use his arms and legs but the broken back's condition is unknown. His executive assistant and the pilot died.
      n: '[[w.johnson-white-house-diary]], 172 (Lady Bird Johnson''s account). See [[cal.1964-06-19.congress]]. Names: Lady Bird Johnson, Ted Kennedy, Bayh.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-edward-m
      - name:bayh-birch
- add:
    entry:
      id: cal.1964-06-20.civil-rights-bill
      when: June 20
      date: '1964-06-20'
      thread: civil-rights-bill
      c: Boggs, who comes over to see Mrs. Johnson, says the House has set July 4 as the day for passing the civil rights bill and, barring accident, will meet it.
      n: '[[w.johnson-white-house-diary]], 173 (Lady Bird Johnson''s account). Names: Boggs, Lady Bird Johnson.'
      tags:
      - name:boggs-hale
      - name:johnson-lady-bird
- cite:
    id: cal.1964-07-02.civil-rights-bill
    item: '[[w.johnson-white-house-diary]], 173–74 (the news of the House vote, 289 to 126, mid-afternoon; the signing in the East Room at 6:30 with television, the congressional leaders behind Johnson, Mansfield, Dirksen, Boggs and Robert Kennedy there; Humphrey asks for the copy of the statement and it has vanished; Mrs. Johnson to the newswomen on 1957 and the thirty-seven nights; not the hour of the House vote)'
    units: '?'
- add:
    entry:
      id: cal.1964-07-02.succession
      when: July 2
      date: '1964-07-02'
      thread: succession
      c: 'Johnson telephones Mrs. Johnson, as though the thought had just come to him: "We might just get off to Texas tonight." At 10:30 p.m. they leave the South Lawn by helicopter with Moyers; Jetstar from Andrews to the Ranch, midnight Texas time.'
      n: '[[w.johnson-white-house-diary]], 174–75 (Lady Bird Johnson''s account). See [[cal.1964-07-02.civil-rights-bill]]. Names: Johnson, Lady Bird Johnson, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:moyers-bill
- add:
    entry:
      id: cal.1964-07-06.elections-1964-johnson
      when: July 6
      date: '1964-07-06'
      thread: elections-1964-johnson
      c: 'Scharnhorst Ranch. Johnson with Mrs. Johnson, Jesse Kellam and A. W. Moursund on whether he will run. "Lyndon wants to get out." Ed Weisl: "I don''t know any honorable way for him not to run." Moursund: "you are the only man that can make up your mind." Kellam: run, and announce on election that he will not seek a second term.'
      n: '[[w.johnson-white-house-diary]], 175 (Lady Bird Johnson''s account; Weisl spoke looking at her). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-11.elections-1964-johnson-2
      when: July 11
      date: '1964-07-11'
      thread: elections-1964-johnson
      c: 'The White House, the weekend. Johnson "is going through the throes of what may be the last desperate turning away, the desire to escape being the Democratic candidate this fall"; Mrs. Johnson: "he can''t find any honorable escape."'
      n: '[[w.johnson-white-house-diary]], 176 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-13.elections-1964-johnson
      when: July 13
      date: '1964-07-13'
      thread: elections-1964-johnson
      c: 'The White House, small room off the Oval Office, until nearly 11 p.m. Johnson with O''Donnell, Valenti, Maguire, Cliff Carter and Jenkins, "at least eight of the chief political cogs" by Mrs. Johnson''s count, on the campaign. Johnson comes home with Jenkins and Maguire: "We are on the move."'
      n: '[[w.johnson-white-house-diary]], 177 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, O''Donnell, Valenti, Walter Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:odonnell-kenneth-p
      - name:valenti-jack
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-07-15.elections-1964-johnson
      when: July 15
      date: '1964-07-15'
      thread: elections-1964-johnson
      c: 'The White House, after midnight. Johnson watches the Republican convention on television with Mrs. Johnson, who thinks it will nominate Goldwater any minute. About 3:30 a.m. he wakes and tells her, in detail, the pros and cons of every decision on the campaign: each sensitive job to be filled, every spot on the battlefield to be manned.'
      n: '[[w.johnson-white-house-diary]], 178 (Lady Bird Johnson''s account; the hour is the night of the 15th to the 16th). Names: Johnson, Lady Bird Johnson, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-16.elections-1964-johnson
      when: July 16
      date: '1964-07-16'
      thread: elections-1964-johnson
      c: The White House, 9 a.m. Galbraith to breakfast with Johnson and Mrs. Johnson, two hours. He says he is first a friend of the Kennedy family but understands Johnson; friendly toward Humphrey. Johnson asks him to help with Congressmen to pass the poverty bill; Galbraith is willing, Mrs. Johnson believes, to write for the campaign. Mrs. Johnson hopes Johnson will not take Goldwater's tone ("Yes, I know the fellow").
      n: '[[w.johnson-white-house-diary]], 178 (Lady Bird Johnson''s account). See [[cal.1964-07-16.elections-1964-4]]. Names: Galbraith, Johnson, Lady Bird Johnson, Humphrey, Goldwater.'
      tags:
      - name:galbraith-john-kenneth
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-16.program
      when: July 16
      date: '1964-07-16'
      thread: program
      c: The Yellow Room, late afternoon. James Roosevelt and his daughter Anna with Mrs. Johnson. James Roosevelt says he will go before the Commission to prevent acceptance of the proposed Franklin Roosevelt memorial, the "Instant Stonehenge" of pillars, which none of the four sons likes; Mrs. Johnson dislikes it too.
      n: '[[w.johnson-white-house-diary]], 179–80 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, James Roosevelt.'
      tags:
      - name:johnson-lady-bird
      - name:roosevelt-james
- add:
    entry:
      id: cal.1964-07-17.white-house
      when: July 17
      date: '1964-07-17'
      thread: white-house
      c: The White House. Mrs. Johnson presents the one millionth copy of the White House guidebook to a tourist family at the entrance desk, before cameras and reporters; photographs in the Rose Garden.
      n: '[[w.johnson-white-house-diary]], 180 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-07-17.program
      when: July 17
      date: '1964-07-17'
      thread: program
      c: 'Independence, Mo. Mrs. Johnson and Lynda Bird, on a trip promised her by Truman on the flight to Athens, are taken through the Truman Library by Truman, with Mrs. Truman: original documents of each President, the State Dining Room mantel with John Adams''s inscription, the Benton mural, a replica of the Oval Office. Truman talks with school children there for several hours a day, three or four days a week in summer. Mrs. Johnson gives him a flag from Blair House. They have a soft drink at the Trumans'' house.'
      n: '[[w.johnson-white-house-diary]], 180–82 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Truman, Lynda Bird Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - name:johnson-lynda-bird
- add:
    entry:
      id: cal.1964-07-17.elections-1964-johnson
      when: July 17
      date: '1964-07-17'
      thread: elections-1964-johnson
      c: Kansas City, the Muehlebach Hotel, about 6:30 p.m. Truman and Mrs. Truman have drinks with Mrs. Johnson and Lynda Bird; Truman plays Chopin; he "reiterated that he wanted to do whatever he could to help Lyndon." Johnson, uncertain at noon, has gone to the Ranch by early afternoon and asks Mrs. Johnson to come on the courier plane.
      n: '[[w.johnson-white-house-diary]], 182–83 (Lady Bird Johnson''s account). Names: Truman, Lady Bird Johnson, Johnson.'
      tags:
      - name:truman-harry-s
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-07-24.elections-1964
    item: '[[w.johnson-white-house-diary]], 183–84 (the afternoon: Johnson''s televised press conference at 3:30, which Mrs. Johnson watched from her room, Bryson Rash on his "mouse-trapping" Goldwater by saying "we will talk about Civil Rights" before Goldwater''s appointment, and "All campaigns are rough"; Johnson to leave early for his 5:30 appointment with Goldwater; not the meeting itself)'
    units: '?'
- add:
    entry:
      id: cal.1964-07-24.labor
      when: July 24
      date: '1964-07-24'
      thread: labor
      c: The Mansion, after the press conference. Johnson's reception for 250 to 300 labor leaders, invited for a report on the State of the Nation, like his stag luncheons for business leaders. Late from the press conference and gone early for the 5:30 appointment with Goldwater, he is in the receiving line less than an hour.
      n: '[[w.johnson-white-house-diary]], 183–84 (Lady Bird Johnson''s account, from an aide). Names: Johnson, Goldwater.'
      tags:
      - name:johnson-lyndon-b
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-07-24.elections-1964-vice-presidency
      when: July 24
      date: '1964-07-24'
      thread: elections-1964-vice-presidency
      c: The White House, the small room off the Oval Office, evening. Johnson with staff discussing Vice Presidential nominees, Rusk, McNamara, Kennedy, McCarthy, Humphrey and Muskie, "the favorite guessing game of the Capitol." Mrs. Johnson takes him home to dinner at 10.
      n: '[[w.johnson-white-house-diary]], 184 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Robert Kennedy, Eugene McCarthy, Humphrey, Muskie.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:muskie-edmund-s
- cite:
    id: cal.1964-07-26.vietnam-congress
    item: '[[w.johnson-white-house-diary]], 185 (the evening dinner at the Fulbrights'', with the Restons, the Dillons and Russell; Mrs. Johnson mentions no talk of Vietnam; she and Johnson at the table)'
    units: '?'
- add:
    entry:
      id: cal.1964-07-26.elections-1964-2
      when: July 26
      date: '1964-07-26'
      thread: elections-1964
      c: 'Washington. Johnson and Mrs. Johnson at the Fulbrights'' for dinner, with the Restons, the Dillons and Senator Russell. Reston, back from the Republican convention, asked what he saw: "Just one thing. Work like Hell." Fulbright''s book *Old Myths and New Realities* on De Gaulle, China, and consular and student exchanges with the Iron Curtain countries.'
      n: '[[w.johnson-white-house-diary]], 185 (Lady Bird Johnson''s account). See [[cal.1964-07-26.vietnam-congress]]. Names: Johnson, Lady Bird Johnson, Fulbright, Reston, Dillon, Russell.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:fulbright-j-william
      - name:reston-james
      - name:dillon-c-douglas
      - name:russell-richard-b
- add:
    entry:
      id: cal.1964-07-26.elections-1964-3
      when: July 26
      date: '1964-07-26'
      thread: elections-1964
      c: Johnson and Mrs. Johnson walk the grounds after church; at the gates Johnson invites about a hundred tourists at each to walk around the block with him.
      n: '[[w.johnson-white-house-diary]], 185 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-01.succession
      when: Aug. 1
      date: '1964-08-01'
      thread: succession
      c: Fort Myer Chapel. Memorial service for Senator Clair Engle, the Senate Chaplain officiating; Johnson and Mrs. Johnson in the front row. Mrs. Johnson speaks to Mrs. Engle, who has lived "a tortured year," part of it the pressure from California leaders that the Senator get out of the race.
      n: '[[w.johnson-white-house-diary]], 186 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Clair Engle.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:engle-clair
- add:
    entry:
      id: cal.1964-08-01.states-and-cities
      when: Aug. 1
      date: '1964-08-01'
      thread: states-and-cities
      c: 'The White House, dinner for Mayor Wagner, his sons and Celebrezze and Wirtz with their wives, on the Truman Balcony. Wagner, home from Majorca: King the only leader the Negro people will listen to, with a hold Wilkins and Young lack; heavy unemployment in Harlem; 1,300 jobs promised youth, a million dollars for rat eradication; deteriorating public housing.'
      n: '[[w.johnson-white-house-diary]], 186–87 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Wagner, Celebrezze, Wirtz, King, Wilkins, Whitney Young.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:wagner-robert-f-jr
      - name:celebrezze-anthony-j
      - name:wirtz-w-willard
      - name:king-martin-luther-jr
      - name:wilkins-roy
      - name:young-whitney-m-jr
- cite:
    id: cal.1964-08-04.vietnam-congress-2
    item: '[[w.johnson-white-house-diary]], 187–88 (Tuesday evening, cars through the Southwest Gate; Johnson an hour and a half with congressional leaders, the Cabinet and the Joint Chiefs; not the hour or the speakers)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-9
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: The White House, the regular Tuesday lunch of Johnson with the Secretary of Defense, the Secretary of State and McGeorge Bundy, which runs long. Bundy in the hall afterward "extraordinarily grave"; to Mrs. Johnson a "portentous answer."
      n: '[[w.johnson-white-house-diary]], 187–88 (Lady Bird Johnson''s account; she does not give what Bundy said). Names: Johnson, McNamara, Rusk, Bundy, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-10
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: Evening. Johnson delays his statement on the second attack on the destroyers in the Gulf of Tonkin, first set for 7, then 8, until he has an accurate fix on where his planes are; at 10:40 he comes up to dinner with Bundy and Valenti, Reedy dropping in for dessert. One destroyer was attacked Sunday and the United States did not respond; after the second attack he ordered air action against the gunboats and their bases.
      n: '[[w.johnson-white-house-diary]], 188 (Lady Bird Johnson''s account). Names: Johnson, Bundy, Valenti, Reedy, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:valenti-jack
      - name:reedy-george-e
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-04.vietnam-tonkin-11
      when: Aug. 4
      date: '1964-08-04'
      thread: vietnam-tonkin
      c: 'After 11 p.m., after word from the Defense Department that the planes had been launched and Hanoi knew it, Johnson''s televised statement: "Yet our response, for the present, will be limited and fitting ... We still seek no wider war." Stevenson to take the matter to the Security Council; the congressional leaders asked for a resolution; "firmness in the right is indispensable today for peace." Mrs. Johnson: "an excellent statement."'
      n: '[[w.johnson-white-house-diary]], 188–89 (Lady Bird Johnson''s account; the hour is hers, "after 11"). Check: the hour. Names: Johnson, Stevenson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:stevenson-adlai-e
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-08-06.civil-disorders
      when: Aug. 6
      date: '1964-08-06'
      thread: civil-disorders
      c: 'The White House bedroom, morning. Mayor Daley of Chicago with Johnson in bed and Mrs. Johnson, over coffee, on how he would meet a race riot in Chicago: no steel helmets, caps only, so that each policeman looks "like the friend down the block"; year-round meetings with the press, television, Negro leaders, white businessmen and churches. Mrs. Johnson on television and newspapers egging on trouble.'
      n: '[[w.johnson-white-house-diary]], 189 (Lady Bird Johnson''s account). Names: Daley, Johnson, Lady Bird Johnson.'
      tags:
      - name:daley-richard-j
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1964-08-06.vietnam-2
    item: '[[w.johnson-white-house-diary]], 189–90 (the welcoming ceremony a little past 11 in the Rose Garden, without military pomp; U Thant an hour with Johnson, then a tour of the flower gardens with Mrs. Johnson, followed by Johnson and Stevenson; not the twenty minutes alone or the others present)'
    units: '?'
- add:
    entry:
      id: cal.1964-08-06.europe-and-the-alliance
      when: Aug. 6
      date: '1964-08-06'
      thread: europe-and-the-alliance
      c: 'The White House, State dinner for U Thant. Gifts: moon photographs from Ranger VII and an 1829 letter of Andrew Jackson; from U Thant a Burmese silver tea and coffee service. Stevenson, Rusk, McNamara, the Dukes, the Bunches and the Lodges in the Yellow Room. Johnson''s toast names two Republicans and two Democrats as outstanding: Fulbright, Dirksen, Stevenson and Lodge. He talks long and seriously with the Burmese ambassador and U Thant across the two wives; leaves early to talk with Rusk and Bundy.'
      n: '[[w.johnson-white-house-diary]], 190–91 (Lady Bird Johnson''s account; she thinks it "probably the last one during our tenure"). Names: Johnson, Lady Bird Johnson, U Thant, Stevenson, Rusk, McNamara, Duke, Lodge, Fulbright, Dirksen, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:u-thant
      - name:stevenson-adlai-e
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:duke-angier-b
      - name:lodge-henry-cabot
      - name:fulbright-j-william
      - name:dirksen-everett
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-06.governors
      when: Aug. 6
      date: '1964-08-06'
      thread: governors
      c: Governor and Mrs. Pat Brown of California, the John Daltons of Missouri and the Matthew Welshes of Indiana arrive as the Johnsons' houseguests.
      n: '[[w.johnson-white-house-diary]], 190 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Welsh.'
      tags:
      - name:johnson-lady-bird
      - name:welsh-matthew-e
- add:
    entry:
      id: cal.1964-08-25.elections-1964-johnson
      when: Aug. 25
      date: '1964-08-25'
      thread: elections-1964-johnson
      c: Johnson lunches with Rusk, McNamara and Bundy at about one, then sits alone in his room with the shades drawn, making many telephone calls. He does not believe he should accept the nomination or go to Atlantic City; he and Mrs. Johnson talk of it.
      n: '[[w.johnson-white-house-diary]], 192 (Lady Bird Johnson''s account; Mrs. Johnson was working on remarks for a press brunch at the convention). See [[cal.1964-08-25.elections-1964-2]]. Names: Johnson, Lady Bird Johnson, Rusk, McNamara, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1964-08-25.elections-1964-johnson-2
      when: Aug. 25
      date: '1964-08-25'
      thread: elections-1964-johnson
      c: 'That afternoon Mrs. Johnson, after a long talk with Lynda Bird on the South grounds, writes Johnson a note: "You are as brave a man as Harry Truman—or FDR—or Lincoln ... To step out now would be wrong for your country, and I can see nothing but a lonely wasteland for your future." Signed "Bird."'
      n: '[[w.johnson-white-house-diary]], 192 (Lady Bird Johnson''s account, quoting the letter in full; her answer, she writes, came on the night of Aug. 27 with his acceptance). See [[cal.1964-08-25.elections-1964-2]]. Names: Lady Bird Johnson, Johnson, Truman.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:truman-harry-s
- add:
    entry:
      id: cal.1964-09-04.elections-1964-vice-presidency
      when: Sept. 4
      date: '1964-09-04'
      thread: elections-1964-vice-presidency
      c: The White House. Abigail McCarthy, wife of Senator Eugene McCarthy, comes for coffee with Mrs. Johnson to say that Johnson's choice of Humphrey for Vice President makes no difference to their friendship; Mrs. Johnson notes a week of strain among their friends and promoters, and resolves to remind both McCarthys how much they are valued.
      n: '[[w.johnson-white-house-diary]], 193–94 (Lady Bird Johnson''s account). Check: the day, the diary heading having Sept. 4. Names: Lady Bird Johnson, Humphrey, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-09-04.elections-1964-johnson
      when: Sept. 4
      date: '1964-09-04'
      thread: elections-1964-johnson
      c: The White House, 11:30 a.m., three hours. Mrs. Johnson with Carpenter, Bess Abell, Scooter Miller, Woodward, Joe Moran of the advance men, White House transportation men and Dewey Long, who arranged Truman's 1948 whistle-stop, plan her whistle-stop train trip. They cut a ten-day, fourteen-State plan to four days; end it in New Orleans, not Tallahassee, at Bill Brawley's urging as head of the Democratic National Committee's Southern campaign; more stops in North Carolina and Virginia, and Georgia.
      n: '[[w.johnson-white-house-diary]], 194 (Lady Bird Johnson''s account). See [[cal.1964-09.elections-1964-5]]. Names: Lady Bird Johnson, Carpenter, Truman.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:truman-harry-s
- cite:
    id: cal.1964-09.elections-1964-5
    item: '[[w.johnson-white-house-diary]], 195–98 (Sept. 11: Mrs. Johnson''s telephone calls to the Governors and Senators of the States on the train route: Byrd, his "invisible silken curtain"; Thurmond, a decision to make within two weeks; Russell, no, but advance men; and the acceptances and refusals of Harrison, Sanford, Ervin, Jordan, Olin Johnston, Donald Russell, Talmadge, Sanders, Holland, Smathers, Bryant, Hill, Sparkman, Ellender; the refusals of Robertson, Stennis, McKeithen)'
    units: '?'
- check:
    id: cal.1964-09.elections-1964-5
    text: 'Check: Lady Bird Johnson, 195–98, dates the calls Friday, Sept. 11, 1964, and has Byrd say that because of Mrs. Byrd''s death he and his sons would take no part in public affairs for some time; the entry has Byrd''s "invisible silken curtain" without the day.'
- add:
    entry:
      id: cal.1964-09-11.elections-1964-johnson
      when: Sept. 11
      date: '1964-09-11'
      thread: elections-1964-johnson
      c: The Yellow Oval Room, afternoon. Mrs. Johnson has the Cabinet wives to tea, Mrs. Rusk, Mrs. McNamara, Mrs. Gronouski, Mrs. Udall, Mrs. Freeman, Mrs. Wirtz, Mrs. Celebrezze and Mrs. Katzenbach, with Muriel Humphrey's press secretary and Margaret Price, Carrie Davis and Scooter Miller of the Democratic National Committee, on what the wives can do in the seven weeks of the campaign and who shall fill the invitations she must refuse. Freeman and Celebrezze the most active.
      n: '[[w.johnson-white-house-diary]], 197–98 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- cite:
    id: cal.1964-10-06.elections-1964
    item: '[[w.johnson-white-house-diary]], 198–99 (the whistle-stop through the South, "forty-seven stops in four days"; a woman at a North Carolina stop who milked twenty cows to be at the train; Mrs. Johnson kept no diary of the campaign; not the dates or the route)'
    units: '?'
- add:
    entry:
      id: cal.1964-11-14.poverty
      when: Nov. 14
      date: '1964-11-14'
      thread: poverty
      c: 'The LBJ Ranch. Celebrezze and Wirtz confer with Johnson in the morning, the fifth and sixth Cabinet members in eleven days after the campaign. Celebrezze, whom columns say will leave the Cabinet, would like a judgeship; Wirtz speaks of 3.5 million youths turning eighteen next year, a million more than this, of whom one in seven will meet a closed job or college door: "Operation Birthright." Both leave about noon for a press conference in Austin.'
      n: '[[w.johnson-white-house-diary]], 199–200 (Lady Bird Johnson''s account; she talked with Wirtz while Johnson saw Celebrezze). Names: Johnson, Lady Bird Johnson, Celebrezze, Wirtz.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:celebrezze-anthony-j
      - name:wirtz-w-willard
- add:
    entry:
      id: cal.1964-11-14.transition-and-staff-cabinet
      when: Nov. 14
      date: '1964-11-14'
      thread: transition-and-staff-cabinet
      c: 'The Ranch, arrivals from New York: Frank Stanton of C.B.S., Donald Cook of American Electric Power Service, Thomas Watson of I.B.M. and Ed Weisl, with Eddie Weisl Jr., who stay overnight with Johnson.'
      n: '[[w.johnson-white-house-diary]], 200 (Lady Bird Johnson''s account). Names: Johnson, Stanton, Don Cook.'
      tags:
      - name:johnson-lyndon-b
      - name:stanton-frank
      - name:cook-donald-c
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff-cabinet
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff-cabinet
      c: 'The Ranch, breakfast. Johnson asks Watson to be Secretary of Commerce in place of Hodges; Cook he hopes will accept a Cabinet place; Stanton he would like to have in the Cabinet. Mrs. Johnson thinks Stanton will not leave his business. Cook to her at the airport: "We''ll find them. We''ll have to find a way." Johnson tells her his bet is that none of the three will accept.'
      n: '[[w.johnson-white-house-diary]], 201–02 (Lady Bird Johnson''s account; she does not say Watson accepted or refused). Names: Johnson, Lady Bird Johnson, Stanton, Don Cook, Hodges.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:stanton-frank
      - name:cook-donald-c
      - name:hodges-luther-h
- add:
    entry:
      id: cal.1964-11-15.succession
      when: Nov. 15
      date: '1964-11-15'
      thread: succession
      c: 'The White House lawn, 6:30 p.m. Johnson and Mrs. Johnson return from Texas, their first since the election, met by the Cabinet and their wives with Rusk at the foot of the steps, and 200 or 300 of the staff and families: "Congratulations! Welcome home!"'
      n: '[[w.johnson-white-house-diary]], 202–03 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:rusk-dean
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff
      c: 'The State Department, evening. Party for Walter Heller, who leaves the Council of Economic Advisers for the University of Minnesota, given by the Cabinet and top officials. Heller: "We have had two perceptive and restless Presidents, who realize the economy''s potential"; "I have Potomac Fever."'
      n: '[[w.johnson-white-house-diary]], 203 (Lady Bird Johnson''s account). Names: Heller, Johnson, Lady Bird Johnson.'
      tags:
      - name:heller-walter-w
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-15.transition-and-staff-2
      when: Nov. 15
      date: '1964-11-15'
      thread: transition-and-staff
      c: Later that evening Johnson meets some of the staff on a talent search for the best people for the next four years.
      n: '[[w.johnson-white-house-diary]], 203 (Lady Bird Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-11-17.transition-and-staff
      when: Nov. 17
      date: '1964-11-17'
      thread: transition-and-staff
      c: Mrs. Johnson calls on Walter Jenkins and Mrs. Jenkins, who are going home to Texas. Jenkins is, she writes, a casualty of exhaustion; a barrage of mail from the public has come to him, and friends offer jobs.
      n: '[[w.johnson-white-house-diary]], 204 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Walter Jenkins.'
      tags:
      - name:johnson-lady-bird
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1964-11-17.program
      when: Nov. 17
      date: '1964-11-17'
      thread: program
      c: The White House second floor. Mary Lasker with Mrs. Johnson on giving the Inaugural ceremonies more style and flair, perhaps a march or a symphony written for the occasion; she suggests an entertainment at the White House for the committee of the Kennedy Cultural Center.
      n: '[[w.johnson-white-house-diary]], 205 (Lady Bird Johnson''s account). Names: Lady Bird Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-17.transition-and-staff-2
      when: Nov. 17
      date: '1964-11-17'
      thread: transition-and-staff
      c: The State Department, farewell reception for Ralph Dungan, leaving to be Ambassador to Chile. Johnson and Mrs. Johnson stay about thirty minutes, Johnson in no hurry to leave.
      n: '[[w.johnson-white-house-diary]], 205 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Dungan.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:dungan-ralph-a
- add:
    entry:
      id: cal.1964-11-17.white-house
      when: Nov. 17
      date: '1964-11-17'
      thread: white-house
      c: 'The White House, 9 p.m. Johnson''s surprise party for Mrs. Johnson''s thirtieth wedding anniversary: the Fortases, the Alsops, the Carpenters, Justice Tom Clark and Mrs. Clark, Corcoran, Katharine Graham, the Valentis, the Tyler Abells. Gifts; a thirty-pound wedding cake; toasts. Mrs. Johnson''s toast to "happiness" and "pedestrian courage."'
      n: '[[w.johnson-white-house-diary]], 205–07 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Fortas, Tom Clark, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:fortas-abe
      - name:clark-tom-c
      - name:valenti-jack
- add:
    entry:
      id: cal.1964-11-21.farm
      when: Nov. 21
      date: '1964-11-21'
      thread: farm
      c: The LBJ Ranch. Richard Juhl and a party of eleven from Iowa, including the presidents of the National Swinegrowers' Association and the Iowa Farm Brokers' Association and two farm editors, drive 1,600 miles to present Johnson with a Yorkshire boar; photographs with Freeman, a house guest. Johnson takes them over the Ranch and keeps them to lunch.
      n: '[[w.johnson-white-house-diary]], 206–08 (Lady Bird Johnson''s account). Names: Johnson, Freeman, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:freeman-orville-l
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-11-21.farm-2
      when: Nov. 21
      date: '1964-11-21'
      thread: farm
      c: 'The Ranch, lunch. Freeman to Mrs. Johnson on why the Department of Agriculture grows while farm population falls to 8 percent: consumer inspection and grading, research, and forestry.'
      n: '[[w.johnson-white-house-diary]], 208–09 (Lady Bird Johnson''s account). Names: Freeman, Lady Bird Johnson.'
      tags:
      - name:freeman-orville-l
      - name:johnson-lady-bird
