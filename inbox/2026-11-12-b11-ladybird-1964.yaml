patch: 2026-11-12-b11-ladybird-1964
by: 'Claude (batch 11: Lady Bird Johnson, A White House Diary, Nov. 22, 1963 to Dec. 31, 1964), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1963-11-22.assassination-13
      when: Nov. 22
      date: '1963-11-22'
      thread: assassination
      c: Dallas. The Johnsons ride third in the motorcade, behind the Kennedys and the Connallys, with Yarborough. Three shots; Youngblood of the Secret Service throws Johnson to the floor. The car goes at speed to Parkland Hospital.
      n: '[[w.johnson-white-house-diary]], 3–4 (Lady Bird Johnson''s account; her times are not given). Names: Johnson, Lady Bird Johnson, Kennedy, Jacqueline Kennedy, Connally, Yarborough, Youngblood.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - name:connally-john
      - name:yarborough-ralph
- add:
    entry:
      id: cal.1963-11-22.succession-18
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: Parkland Hospital, a small room lined with sheets. Johnson with Thornberry, Brooks, O'Donnell and Secret Service agents; he proposes that Air Force One be moved and that Mrs. Johnson see Mrs. Kennedy and Mrs. Connally. Kilduff comes in and says "Mr. President." The party leaves for Love Field.
      n: '[[w.johnson-white-house-diary]], 4–5 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Kenneth O''Donnell, Thornberry, Brooks, Jacqueline Kennedy, Connally, Kilduff.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:odonnell-kenneth-p
      - name:thornberry-william-h
      - name:brooks-jack-b
      - name:kennedy-jacqueline
      - name:connally-john
- add:
    entry:
      id: cal.1963-11-22.succession-19
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: 'Air Force One, Love Field. Word to Washington, "I believe to the Attorney General": Johnson to be sworn in at once, in Dallas. Judge Sarah Hughes is called to administer the oath.'
      n: '[[w.johnson-white-house-diary]], 5 (Lady Bird Johnson''s account; she does not know who spoke). See [[cal.1963-11-22.succession]]. Names: Johnson, Robert Kennedy, Sarah Hughes.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:hughes-sarah-t
- cite:
    id: cal.1963-11-22.succession
    item: '[[w.johnson-white-house-diary]], 5–6, 7 (the oath at Mrs. Kennedy''s side, Mrs. Johnson beside him, Judge Hughes before him; the brief statement at Andrews; not the time or the words of the oath)'
    units: '?'
- cite:
    id: cal.1963-11-22.succession-14
    item: '[[w.johnson-white-house-diary]], 7 (home from Andrews in a car with Liz Carpenter; not what was said)'
    units: '?'
- cite:
    id: cal.1963-11-23.succession-12
    item: '[[w.johnson-white-house-diary]], 7 (Johnson with Mrs. Johnson to the White House, the Kennedy family in the Green Room; he walks past the casket in the East Room; the Cabinet, congressional leaders, Court and staff there; the diary has no north portico)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-23.succession-13
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: St. John's Episcopal Church, Lafayette Square. Johnson and Mrs. Johnson at a brief service after the viewing of the body in the East Room.
      n: '[[w.johnson-white-house-diary]], 7 (Lady Bird Johnson''s account; not the hour). See [[cal.1963-11-23.succession-12]]. Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- cite:
    id: cal.1963-11-24.succession-6
    item: '[[w.johnson-white-house-diary]], 8 (church at St. Mark''s with Luci and Thornberry; Baxter''s sermon: whoever fostered an atmosphere of hate had his hand on the gun barrel)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-24.assassination-6
      when: Nov. 24
      date: '1963-11-24'
      thread: assassination
      c: 'Washington. Johnson and Mrs. Johnson ride with Mrs. Kennedy and Robert Kennedy behind the caisson to the Capitol. In the Rotunda, eulogies by Warren, McCormack and Mansfield; Johnson lays a wreath at the foot of the casket. Robert Kennedy, passing a building: "That was where it all began. That was where he ran for the Presidency."'
      n: '[[w.johnson-white-house-diary]], 8–10 (Lady Bird Johnson''s account; she places Shriver''s news of Oswald''s death in the Green Room before the ride). See [[cal.1963-11-24.assassination]]. Names: Johnson, Lady Bird Johnson, Jacqueline Kennedy, Robert Kennedy, Warren, McCormack, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:kennedy-robert-f
      - name:warren-earl
      - name:mccormack-john-w
      - name:mansfield-mike
- cite:
    id: cal.1963-11-26.succession-3
    item: '[[w.johnson-white-house-diary]], 10 (J. B. West at The Elms in the morning on moving three suites of furniture; Mrs. Johnson''s and her daughters'' into Mrs. Kennedy''s, Caroline''s and John Jr.''s rooms)'
    units: '?'
- add:
    entry:
      id: cal.1963-11-26.succession-5
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'The White House, 3 p.m. Mrs. Kennedy receives Mrs. Johnson to go over the housekeeping, by Mrs. Johnson''s account: West and the Curator, Ketchum, to depend on; the third-floor school to continue until after Christmas, which Mrs. Johnson grants.'
      n: '[[w.johnson-white-house-diary]], 10–12 (Lady Bird Johnson''s account). See [[cal.1963-11-26.succession-3]]. Names: Lady Bird Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
- cite:
    id: cal.1963-11-26.latin-america
    item: '[[w.johnson-white-house-diary]], 12 (the East Room, about 5 p.m.: Johnson to the Alliance for Progress representatives, "continued strength and interest"; Mrs. Johnson seated behind him; the diary does not mention Mrs. Kennedy at it)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-02.program
      when: Dec. 2
      date: '1963-12-02'
      thread: program
      c: 'The Cabinet Room, late afternoon. Johnson presents the Enrico Fermi Award to Oppenheimer, the citation signed by Kennedy before his death, with the $50,000 to Mrs. Oppenheimer. Present: the senior Democrats of the Atomic Energy Committee, Teller, Smyth; the ranking Republicans absent. Oppenheimer: "it has taken some charity and some courage for you to make this award today."'
      n: '[[w.johnson-white-house-diary]], 12–13 (Lady Bird Johnson''s account; she was present). To check: the Public Papers, remarks at the presentation, Dec. 2, 1963. Names: Johnson, Lady Bird Johnson, Oppenheimer, Kennedy, Teller.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:oppenheimer-j-robert
      - name:kennedy-john-f
      - name:teller-edward
- add:
    entry:
      id: cal.1963-12-02.succession-2
      when: Dec. 2
      date: '1963-12-02'
      thread: succession
      c: The Elms, dinner. Johnson and Mrs. Johnson with Drew and Luvie Pearson, Justice and Mrs. Goldberg, Bess and Tyler Abell.
      n: '[[w.johnson-white-house-diary]], 13–14 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Drew Pearson, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:pearson-drew
      - name:goldberg-arthur-j
- cite:
    id: cal.1963-12-07.succession
    item: '[[w.johnson-white-house-diary]], 14–16 (the move in the afternoon, Mr. West notifying them Mrs. Kennedy had left; the press at the gates; not the hour)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-07.press-and-broadcasting-2
      when: Dec. 7
      date: '1963-12-07'
      thread: press-and-broadcasting
      c: 'The White House. Liz Carpenter, Mrs. Johnson''s staff director and press secretary, meets groups of newswomen and boils their wishes down to two: "Be Available" and "Never Lie." Mrs. Johnson to the press, through Carpenter, on the move: she would serve Mrs. Kennedy''s convenience.'
      n: '[[w.johnson-white-house-diary]], 14–15 (Lady Bird Johnson''s account; the remark on convenience is of "several days ago"; the day is the diary''s). Check: the day of the remark. Names: Lady Bird Johnson, Carpenter, Jacqueline Kennedy.'
      tags:
      - name:johnson-lady-bird
      - name:carpenter-liz
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1963-12-07.succession-2
      when: Dec. 7
      date: '1963-12-07'
      thread: succession
      c: Evening, the house of Walter and Marjorie Jenkins. Johnson and Mrs. Johnson to dinner; reporters and cameras in front.
      n: '[[w.johnson-white-house-diary]], 16 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Walter Jenkins.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:jenkins-walter-w
- add:
    entry:
      id: cal.1963-12-14.congress
      when: Dec. 14
      date: '1963-12-14'
      thread: congress
      c: 'The White House, dinner. Johnson with Boggs, Albert Thomas, Mills, Brooks, Albert, Gerald Ford and Thornberry and their wives. The talk: recognizing the Dominican Republic, Mann''s naming for Latin America, and "the Tax Bill, the Tax Bill, the Tax Bill."'
      n: '[[w.johnson-white-house-diary]], 16–17 (Lady Bird Johnson''s account). See [[cal.1963-12-14.latin-america]]. Names: Johnson, Lady Bird Johnson, Boggs, Albert Thomas, Mills, Brooks, Albert, Gerald Ford, Thornberry, Mann.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:boggs-hale
      - name:thomas-albert
      - name:mills-wilbur-d
      - name:brooks-jack-b
      - name:albert-carl
      - name:ford-gerald-r
      - name:thornberry-william-h
      - name:mann-thomas-c
- add:
    entry:
      id: cal.1963-12-18.program-2
      when: Dec. 18
      date: '1963-12-18'
      thread: program
      c: Eva Adams, Director of the Mint, and the sculptor Gilroy Roberts show Mrs. Johnson a head of Johnson for the Presidential medal. She asks a change in the mouth, for "a certain grimness"; Roberts makes it.
      n: '[[w.johnson-white-house-diary]], 17–18 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson, Eva Adams.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- cite:
    id: cal.1963-12-21.foreign-aid
    item: '[[w.johnson-white-house-diary]], 18–19 (Mrs. Johnson, Dec. 21: Congress will not adjourn, so no flight home on Sunday; she goes to the President''s office to comfort him; not Halleck or the credit for wheat sales)'
    units: '?'
- cite:
    id: cal.1963-12-24.foreign-aid
    item: '[[w.johnson-white-house-diary]], 19 (the House met early and passed the foreign aid bill, which released the Johnsons; not the amendment or the vote)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-24.succession
      when: Dec. 24
      date: '1963-12-24'
      thread: succession
      c: Johnson leaves Washington about 9:30 a.m., after the House passes the foreign aid bill. At Philadelphia, the funeral of Representative William Green; then to Austin.
      n: '[[w.johnson-white-house-diary]], 19 (Lady Bird Johnson''s account). See [[cal.1963-12-24.foreign-aid]]. Names: Johnson, Lady Bird Johnson, William Green.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:green-william-j-jr
- add:
    entry:
      id: cal.1963-12-24.succession-2
      when: Dec. 24
      date: '1963-12-24'
      thread: succession
      c: Austin, the Governor's Mansion. Johnson and Mrs. Johnson see Connally, his arm in a sling, and his wife.
      n: '[[w.johnson-white-house-diary]], 19 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Connally.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
- add:
    entry:
      id: cal.1963-12-25.press-and-broadcasting-4
      when: Dec. 25
      date: '1963-12-25'
      thread: press-and-broadcasting
      c: The LBJ Ranch. The press at the house for a family Christmas picture; at a reporter's request Johnson takes fifty to seventy-five of them through the house, and gives them ashtrays.
      n: '[[w.johnson-white-house-diary]], 21 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1963-12-27.europe-and-the-alliance
      when: Dec. 27
      date: '1963-12-27'
      thread: europe-and-the-alliance
      c: The Ranch. Rusk, Freeman, Ball, McGhee (Ambassador to Germany) and McGeorge Bundy with Johnson in groups for the briefings before Erhard's visit.
      n: '[[w.johnson-white-house-diary]], 21–22 (Lady Bird Johnson''s account; Rusk arrived that morning, Freeman and Ball before him). See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson, Rusk, Freeman, Ball, McGhee, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:freeman-orville-l
      - name:ball-george-w
      - name:mcghee-george-c
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1963-12-27.press-and-broadcasting-2
      when: Dec. 27
      date: '1963-12-27'
      thread: press-and-broadcasting
      c: The Ranch, about 200 reporters, White House, Texas and German, by five buses. Mrs. Johnson, on the bus microphone, tells them the ranch's history; Salinger runs the tour. Barbecue (Walter Jetton); Johnson on a bale of hay introduces Rusk, Freeman and Mann, "Number One coordinator of Latin American affairs." By Mrs. Johnson, "an all-around press conference, but most casual."
      n: '[[w.johnson-white-house-diary]], 22 (Lady Bird Johnson''s account). See [[cal.1963-12-27.succession]]. Names: Lady Bird Johnson, Johnson, Salinger, Rusk, Freeman, Mann.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:salinger-pierre
      - name:rusk-dean
      - name:freeman-orville-l
      - name:mann-thomas-c
- cite:
    id: cal.1963-12-27.succession
    item: '[[w.johnson-white-house-diary]], 22 (the press barbecue and Johnson''s remarks to the gathering; not the budget)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-28.europe-and-the-alliance-2
      when: Dec. 28
      date: '1963-12-28'
      thread: europe-and-the-alliance
      c: 'Bergstrom Air Force Base, Austin. Johnson and Mrs. Johnson, Connally and his wife meet Erhard: troops reviewed, anthems, brief speeches by Erhard and Johnson. By helicopter to the Ranch: a stag luncheon for fourteen of the Germans, and talks after. The German party includes Schroeder, Westrick and Carstens.'
      n: '[[w.johnson-white-house-diary]], 23–24 (Lady Bird Johnson''s account; the guest numbers are hers). See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Connally, Erhard, Schroeder, Carstens, Westrick.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
      - name:erhard-ludwig
      - name:carstens-karl
      - name:westrick-ludger
- add:
    entry:
      id: cal.1963-12-28.europe-and-the-alliance-3
      when: Dec. 28
      date: '1963-12-28'
      thread: europe-and-the-alliance
      c: The Ranch, evening. Stag dinner for Erhard and about forty of the German delegation. Gifts exchanged; the Johnsons give a book of poems by Hulda Walter, a Fredericksburg girl, translated, with a letter to Mrs. Erhard.
      n: '[[w.johnson-white-house-diary]], 24 (Lady Bird Johnson''s account). See [[cal.1963-12-28.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Erhard.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1963-12-29.europe-and-the-alliance-2
      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: Fredericksburg. Johnson and Mrs. Johnson with Erhard and the German party at the Pioneer Memorial; speeches by the postmaster and a lawyer, a book presented to Erhard, his response; then the Lutheran church service.
      n: '[[w.johnson-white-house-diary]], 24–25 (Lady Bird Johnson''s account). See [[cal.1963-12-29.europe-and-the-alliance]]. Names: Johnson, Lady Bird Johnson, Erhard.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:erhard-ludwig
- add:
    entry:
      id: cal.1963-12-29.europe-and-the-alliance-3
      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: 'Stonewall school gymnasium, the barbecue for Erhard: the German delegation, the German, White House and local press, about seventy-five invited guests; Van Cliburn plays. Johnson introduces the Germans and his own party; Rusk''s introduction moving. Toasts by Erhard and Johnson.'
      n: '[[w.johnson-white-house-diary]], 25–27 (Lady Bird Johnson''s account; the guests are hers, among them Von Braun, Kleberg, Ransom and Dobie). See [[cal.1963-12-29.europe-and-the-alliance]]. Names: Johnson, Erhard, Rusk, Van Cliburn.'
      tags:
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:rusk-dean
- cite:
    id: cal.1963-12-29.europe-and-the-alliance
    item: '[[w.johnson-white-house-diary]], 26–27 (the barbecue and toasts; Rusk''s introduction by Johnson; Mrs. Johnson does not give the breakfast on the terrace or Ball''s galaxy remark)'
    units: '?'
- cite:
    id: cal.1963-12-30.defense
    item: '[[w.johnson-white-house-diary]], 27 (the Joint Chiefs, led by Taylor and including LeMay and Shoup, at the Ranch in the morning; Heller and Gordon in and out of the meetings; not McNamara, Gilpatric or the reporters)'
    units: '?'
- cite:
    id: cal.1963-12-29.poverty
    item: '[[w.johnson-white-house-diary]], 27 (Heller and Gordon at the Ranch, in and out of the meetings of Dec. 30; Lynda Bird talks economics with Heller after dinner; not poverty)'
    units: '?'
- add:
    entry:
      id: cal.1963-12-30.succession
      when: Dec. 30
      date: '1963-12-30'
      thread: succession
      c: Austin. Johnson and Mrs. Johnson at the funeral of Mrs. Tom Miller, widow of the mayor.
      n: '[[w.johnson-white-house-diary]], 27–28 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1963-12-30.succession-2
      when: Dec. 30
      date: '1963-12-30'
      thread: succession
      c: 'Austin, dedication of the Agudas Achim Synagogue, postponed from Nov. 24. Novy introduces Johnson: "all those Jews he got out of Germany during the days of Hitler." Johnson: his first unofficial speech in the office was in a place of worship in his home town.'
      n: '[[w.johnson-white-house-diary]], 28 (Lady Bird Johnson''s account; the words are Novy''s as she gives them). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1963-12-31.succession
      when: Dec. 31
      date: '1963-12-31'
      thread: succession
      c: The Ranch. Johnson goes deer hunting at dawn with Pickle and Don Thomas; later visitors flown in from Washington talk with him in the living room.
      n: '[[w.johnson-white-house-diary]], 29 (Lady Bird Johnson''s account; she names no visitor). Names: Johnson, Lady Bird Johnson, Pickle.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:pickle-james-j
- add:
    entry:
      id: cal.1964-01-05.press-and-broadcasting
      when: Jan. 5
      date: '1964-01-05'
      thread: press-and-broadcasting
      c: St. Barnabas Church, Fredericksburg. Johnson and Mrs. Johnson with James Reston of the *New York Times*, Mrs. Reston, Lynda Bird and Gerri Whittington; then a drive through Johnson City, the boyhood home to become a community center.
      n: '[[w.johnson-white-house-diary]], 29–30 (Lady Bird Johnson''s account; she records no talk with Reston). Names: Johnson, Lady Bird Johnson, Reston.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:reston-james
- add:
    entry:
      id: cal.1964-01-05.elections-1964-johnson
      when: Jan. 5
      date: '1964-01-05'
      thread: elections-1964-johnson
      c: 'Austin. The Johnsons stop at the Governor''s Mansion for coffee with Connally and his wife; then Senator Yarborough''s New Year''s reception for his neighbors. Mrs. Johnson: "We''re going to need him, we''re going to need everybody."'
      n: '[[w.johnson-white-house-diary]], 30 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson, Connally, Yarborough.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:connally-john
      - name:yarborough-ralph
- add:
    entry:
      id: cal.1964-01-05.succession
      when: Jan. 5
      date: '1964-01-05'
      thread: succession
      c: Johnson and Mrs. Johnson fly from Austin to Washington with Mrs. Johnson's uncle and aunts, Huffman and Ovilee Baines and Josefa, as the President's guests at the White House.
      n: '[[w.johnson-white-house-diary]], 30–31 (Lady Bird Johnson''s account). Names: Johnson, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1964-01-06.white-house
      when: Jan. 6
      date: '1964-01-06'
      thread: white-house
      c: The White House, 6 to 7:30 p.m. Reception for the household staff, from cooks to gardeners. Johnson arrives late; Luci stands in the line with Mrs. Johnson until he does.
      n: '[[w.johnson-white-house-diary]], 31–32 (Lady Bird Johnson''s account). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-07.labor
      when: Jan. 7
      date: '1964-01-07'
      thread: labor
      c: 'The White House, 1 p.m. Johnson''s stag luncheon for labor leaders. Mrs. Johnson stands in line in the Red Room to greet them: Meany, Reuther, Dubinsky, James Carey, MacDonald, Suffridge and Biemiller; the Cabinet officers and staff receiving them are Rusk, Dillon, McNamara, Hodges, Wirtz, Gordon, Heller, O''Brien, Salinger and Sorensen.'
      n: '[[w.johnson-white-house-diary]], 32 (Lady Bird Johnson''s account; she records no talk; the guests'' names are hers). Names: Johnson, Lady Bird Johnson, Meany, Reuther, Rusk, Dillon, McNamara, Hodges, Wirtz, Kermit Gordon, Heller, O''Brien, Salinger, Sorensen.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:meany-george
      - name:reuther-walter
      - name:rusk-dean
      - name:dillon-c-douglas
      - name:mcnamara-robert-s
      - name:hodges-luther-h
      - name:wirtz-w-willard
      - name:gordon-kermit
      - name:heller-walter-w
      - name:obrien-lawrence-f
      - name:salinger-pierre
      - name:sorensen-theodore-c
- add:
    entry:
      id: cal.1964-01-07.economy-2
      when: Jan. 7
      date: '1964-01-07'
      thread: economy
      c: 'The White House, evening. Stag dinner for the Business Council, about 89 businessmen: Blough of U.S. Steel, Kappel of A.T.&T., Watson of I.B.M., McElroy of Procter and Gamble, C. R. Smith of American Airlines, Stanton of C.B.S., Lazarus, Murphy, McCollum and Turman among them. Dillon, McNamara, Hodges, Wirtz, Gordon and Heller attend "to give them an impression of what this Administration plans to do."'
      n: '[[w.johnson-white-house-diary]], 33 (Lady Bird Johnson''s account; she greets sixteen guests upstairs before Johnson comes down, then leaves them). See [[cal.1963-12-07.economy-2]]. Names: Johnson, Lady Bird Johnson, Blough, Kappel, McElroy, C. R. Smith, Stanton, Dillon, McNamara, Hodges, Wirtz, Kermit Gordon, Heller.'
      tags:
      - name:johnson-lyndon-b
      - name:johnson-lady-bird
      - name:blough-roger-m
