        c: a16a6d39
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=853: B-C'
        - 'w.sorensen-kennedy 744–45: A-C'
- add:
    entry:
      id: cal.1963-10-30.elections-1964
      when: Oct. 30
      date: '1963-10-30'
      thread: elections-1964
      also:
      - democratic-party
      c: 'Philadelphia, the Democratic County Executive Committee''s dinner, Green the chairman, Tate the mayor: "America
        is stronger than it was ever before, and the possibilities of peace are brighter now than ever before."'
      n: 'Remarks in Philadelphia at a Dinner Sponsored by the Democratic County Executive Committee, [1963 Pub. Papers 820](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=878)
        (Oct. 30, 1963), at 824. [[w.sorensen-kennedy]], 745 (the words). See [[cal.1963-10-19.soviet-union]]. Names: Kennedy,
        Green, Tate.'
