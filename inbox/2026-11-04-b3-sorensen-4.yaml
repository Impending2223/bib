      when: Oct. 19
      date: '1963-10-19'
      thread: soviet-union
      also:
      - testing
      c: 'Address at the University of Maine: "while maintaining our readiness for war, let us exhaust every avenue for peace";
        no illusions about Communist methods or goals; the present pause not to be wasted.'
      n: 'Address at the University of Maine, [1963 Pub. Papers 795](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=853)
        (Oct. 19, 1963), at 797. [[w.sorensen-kennedy]], 744–45 & n.7 (the words; Dobrynin''s question whether the American
        University speechwriter wrote this too). See [[cal.1963-06-10.testing]]. Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
