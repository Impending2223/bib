- add:
    entry:
      id: cal.1962-10-23.missile-crisis-16
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: Dinner at the White House with the Ormsby-Gores, in place of a planned gala. Afterward Kennedy reviews the photographs
        with the Ambassador, who suggests the best be made public, the British press doubting the missiles are there; the
        President releases them.
      n: '[[w.sorensen-kennedy]], 704–06. Check: the day the photographs were released. See [[cal.1962-10-21.missile-crisis-6]].
        Names: Kennedy, Ormsby-Gore.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:ormsby-gore-david'
      src:
        c: 21e8810e
        rows:
        - 'w.sorensen-kennedy 704–06: all'
- add:
    entry:
      id: cal.1962-10-23.missile-crisis-17
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      c: 'Bertrand Russell wires Kennedy: "Your action desperate ... no conceivable justification"; and Khrushchev: "Your
        continued forbearance is our great hope." Khrushchev answers him.'
      n: '[[w.sorensen-kennedy]], 706, 709. Check: the day of the telegrams and of Khrushchev''s answer. See [[cal.1962-10-22.missile-crisis]].
        Names: Kennedy, Khrushchev.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:khrushchev-nikita-s'
      src:
        c: 7fdc82ba
        rows:
        - 'w.sorensen-kennedy 706, 709: all'
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-6
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis
      also:
      - soviet-union
      c: 'Moscow. Khrushchev summons W. E. Knox, president of Westinghouse Electric International: a blockade illegal except
        in war; stopping and searching Soviet ships piracy; Soviet submarines would sink an American ship that forced a Soviet
        ship to stop; the missiles in Cuba admitted; Kennedy should agree to a meeting.'
      n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 419](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d419)
        (Hilsman to Rusk, Oct. 26, from Knox''s report). [[w.sorensen-kennedy]], 710 (the businessman, unnamed: a summit;
        nuclear war possible; the submarines). See [[cal.1962-10-24.missile-crisis-2]]. Names: Khrushchev, Kennedy.'
      tags:
      - 'name:khrushchev-nikita-s'
      - 'name:kennedy-john-f'
      - 'name:hilsman-roger'
      src:
        c: 12379c55
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d419: all'
        - 'w.sorensen-kennedy 710: B, D-F'
        - 'via x.1962-10-24.knox-report-of-khrushchev-conversation: all'
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-7
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'The Executive Committee, the fourth meeting. USIA to weigh dropping leaflets on Cuba. Non-bloc ships to be investigated
        and boarded, tankers excluded; the tanker *Bucharest* not to be intercepted, a bloc ship to be ready for interception
        Friday in daylight. Eight low-level reconnaissance aircraft over the sites at once. An answer to U Thant approved,
        revised with New York by 1:15 p.m.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 71](https://history.state.gov/historicaldocuments/frus1961-63v11/d71)
        (record of action). [[w.sorensen-kennedy]], 710–11 (the tanker passed on the President''s instructions; a nonbloc
        ship under Soviet charter to be boarded; the leaflet drop authorized and held). See [[cal.1962-10-24.missile-crisis]].
        Names: Kennedy, McCone, McNamara, U Thant.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:mccone-john-a'
      - 'name:mcnamara-robert-s'
      - 'name:u-thant'
      src:
        c: bfed6355
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d71: all'
        - 'w.sorensen-kennedy 710–11: B-D'
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-8
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      also:
      - defense
      c: 'At dawn the Soviet tanker *Bucharest* is hailed at the quarantine line and, on the President''s instructions, passes
        after identifying itself; as the East German passenger ship *Völkerfreundschaft* does later. The *Bucharest* is celebrated
        at Havana.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 71](https://history.state.gov/historicaldocuments/frus1961-63v11/d71)
        (the *Bucharest* not to be intercepted); [FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v11/d73)
        (5 p.m.: the *Völkerfreundschaft* at the barrier, a decision whether to stop it); [FRUS 1961–63, XI: Cuban Missile
        Crisis and Aftermath, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v11/d79) (Oct. 26: McCone
        on the celebration at Havana). [[w.sorensen-kennedy]], 710. Check: the hour of the hailing, and the day the *Völkerfreundschaft*
        passed. See [[cal.1962-10-25.missile-crisis-7]]. Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: c74b5580
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d71: A'
        - 'w.sorensen-kennedy 710: A'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d73: A'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d79: B'
- add:
    entry:
      id: cal.1962-10-25.missile-crisis-9
      when: Oct. 25
      date: '1962-10-25'
      thread: missile-crisis
      c: 'The Executive Committee, 5 p.m., the fifth meeting. McCone: fifteen ships en route to Cuba. Dillon: a run on gold
        in Germany and London. McNamara: no ship yet boarded; the Lebanese ship turned back before the barrier. Rusk: the
        missiles out, or under UN control; heavy pressure on the Russians while talks go on.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v11/d73)
        (Bromley Smith''s summary record). [[w.sorensen-kennedy]], 711 (Thursday and Friday the President and the Committee
        weigh new pressures: a tighter blockade, more low-level flights, action inside Cuba, an air strike, an invasion).
        See [[cal.1962-10-25.missile-crisis-7]]. Names: McCone, Dillon, McNamara, Rusk.'
      tags:
      - 'name:mccone-john-a'
      - 'name:dillon-c-douglas'
      - 'name:mcnamara-robert-s'
      - 'name:rusk-dean'
      - 'name:kennedy-john-f'
      src:
        c: fd3b02fd
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d73: all'
        - 'w.sorensen-kennedy 711: A, E'
- add:
    entry:
      id: cal.1962-10-26.missile-crisis-9
      when: Oct. 26
      date: '1962-10-26'
      thread: missile-crisis
      also:
      - cuba
      c: 'The Executive Committee, 10 a.m., the sixth meeting. McCone has stood down a CIA plan to land ten teams in Cuba
        by submarine; the President wants it before the Special Group, and Mongoose remade, perhaps under the Committee, for
        a Cuba after Castro. Bundy on the leaks to the press. The *Marucla*''s boarding to be made public.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 79](https://history.state.gov/historicaldocuments/frus1961-63v11/d79)
        (Bromley Smith''s summary record). [[w.sorensen-kennedy]], 711 (the pressures weighed; the leaflet drop prepared,
        cleared by the President and held). See [[cal.1962-10-25.missile-crisis-9]]. Names: McCone, Bundy, Kennedy.'
      tags:
      - 'name:mccone-john-a'
      - 'name:bundy-mcgeorge'
      - 'name:kennedy-john-f'
      src:
        c: f1f6d3ed
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d79: all'
        - 'w.sorensen-kennedy 711: A'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-10
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      c: 'The Executive Committee, 4 p.m. The night reconnaissance with flares held up, then called off. The President''s
        message to U Thant: is the Soviet Union willing "immediately to cease work on these bases in Cuba and render the weapons
        inoperable under UN verification so that various solutions can be discussed"? The U-2 over the Soviet Union not to
        be mentioned unless Moscow does; tomorrow''s day mission without escort, but fighters to attack MIGs that attack it.'
      n: '[FRUS 1961–63, X–XII, microfiche supp., doc. 437](https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d437)
        (record of action, meeting no. 8). [[w.sorensen-kennedy]], 713–14 (the flare-drop flight called off; the letter to
        U Thant; the Alaska U-2 ignored; fighter escorts, and the order to answer a MIG attack). Check: Sorensen has fighter
        escorts authorized; the record, the next day''s mission without escort. See [[cal.1962-10-27.missile-crisis-4]]. Names:
        Kennedy, U Thant.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:u-thant'
      - 'name:mcnamara-robert-s'
      - 'name:rusk-dean'
      - 'name:taylor-maxwell'
      src:
        c: 1648a179
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10-12mSupp/d437: all'
        - 'w.sorensen-kennedy 713–14: B-D'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-11
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      c: 'White House statement, 4:30 p.m., on the Moscow broadcast: "several inconsistent and conflicting proposals"; the
        broadcast one "involves the security of nations outside the Western Hemisphere"; work on the bases must stop and the
        weapons be rendered inoperable before any proposal is considered.'
      n: 'White House Statement on Soviet Proposals Relating to International Security, [1962 Pub. Papers 813](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=873)
        (Oct. 27, 1962). [[w.sorensen-kennedy]], 714 (4:30 p.m.). See [[cal.1962-10-27.missile-crisis-2]].'
      tags: []
      src:
        c: cd7a5c4e
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=873: all'
        - 'w.sorensen-kennedy 714: A'
- add:
    entry:
      id: cal.1962-10-27.missile-crisis-12
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis
      also:
      - defense
      c: The Defense Department calls up twenty-four Air Force Reserve troop carrier squadrons.
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 100](https://history.state.gov/historicaldocuments/frus1961-63v11/d100)
        (the call-up of the air reserves, announced by the Department of Defense Saturday). [[w.sorensen-kennedy]], 715 (twenty-four
        squadrons). Check: the announcement''s text and number of men. See [[cal.1962-10-23.missile-crisis-14]].'
      tags: []
      src:
        c: 278c93d2
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d100: all'
