- add:
    entry:
      id: cal.1962-10-23.missile-crisis-13
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      c: The Executive Committee, 10 a.m. The Proclamation of Interdiction approved, to issue at 6 p.m., in force at dawn
        Oct. 24; an order extending tours of duty. If a U-2 is shot down, retaliation on the likeliest SAM site, McNamara
        to decide if the President is unavailable. Quarantine to exclude POL at first. About six low-level reconnaissance
        flights approved.
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 47](https://history.state.gov/historicaldocuments/frus1961-63v11/d47)
        (Bundy''s minutes). [[w.sorensen-kennedy]], 708–09 (the proclamation discussed at 10 a.m. and 6 p.m.; what to do if
        a U-2 were shot down; the Brazil trip canceled; the Southeast''s air defense, the planes dispersed; tours extended;
        low-level flights for the first time). See [[cal.1962-10-22.missile-crisis-20]]. Names: Kennedy, McNamara.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:mcnamara-robert-s'
      - 'name:bundy-mcgeorge'
      - 'name:mccone-john-a'
      src:
        c: 21cd7775
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d47: all'
        - 'w.sorensen-kennedy 708–09: all'
