- add:
    entry:
      id: cal.1961-03-26.laos
      when: Mar. 26
      date: '1961-03-26'
      thread: laos
      also:
      - europe-and-the-alliance
      c: 'Key West, Fla. Kennedy and Macmillan on Laos, over lunch. Joint statement: the situation in Laos "cannot be allowed
        to deteriorate"; the British note to the Soviet Union, if carried out, would end the fighting and make Laos "the truly
        neutral country" both wish to see.'
      n: 'Joint Statement With Prime Minister Macmillan Following an Exchange of Views on Laos, [1961 Pub. Papers 228](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=286)
        (Mar. 26, 1961). [FRUS 1961–63, XXIV: Laos Crisis, doc. 41](https://history.state.gov/historicaldocuments/frus1961-63v24/d41)
        (the memorandum of conversation, Key West, six pages not declassified). Macmillan of the lunch: Remarks at the Reading
        of the Joint Statement Following Discussions With Prime Minister Macmillan, [1961 Pub. Papers 251](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=309)
        (Apr. 8, 1961), at 253. [[w.sorensen-kennedy]], 642 (Kennedy saw Macmillan at Key West; the warning that a cease-fire
        must precede negotiations conveyed by the British to the Soviet co-chairman). See [[cal.1961-03-23.laos]]. Names:
        Kennedy, Macmillan.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:macmillan-harold'
      src:
        c: 0a752626
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=286: A, C-D'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d41: A-B'
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=309: B'
        - 'w.sorensen-kennedy 642: A-B, D'
- add:
    entry:
      id: cal.1962-01-15.laos
      when: Jan. 15
      date: '1962-01-15'
      thread: laos
      c: 'News conference. Asked whether coalition governments lean toward Communist control: "We are taking a chance in all
        of southeast Asia." "There''s no easy, sure answer for Laos," but a neutral and independent Laos in the country''s
        best interests; "I recognize the risks that are involved," and the risks "if we fail," a military struggle escalating.'
      n: 'The President''s News Conference, [1962 Pub. Papers 15](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=75)
        (Jan. 15, 1962), at 18–19. [[w.sorensen-kennedy]], 642 (the answer). See [[cal.1962-01-15.vietnam]]. Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: 20e37cab
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=75: all'
        - 'w.sorensen-kennedy 642: C-D'
- add:
    entry:
      id: cal.1963-09-24.vietnam
      when: Sept. 24
      date: '1963-09-24'
      thread: vietnam
      c: 'The President''s letter to Diệm, its text cabled to Lodge and McNamara in Saigon, eyes only: some methods of some
        members of Diệm''s government may make public support impossible to sustain; American cooperation and assistance not
        to be given "to or through individuals whose acts and words seem to run against the purpose of genuine reconciliation";
        more reporting by American newsmen, not less. The President''s own judgment: not appropriate unless they find the
        situation so serious; McNamara might make the points orally.'
      n: '[FRUS 1961–63, IV: Vietnam, August–December 1963, doc. 147](https://history.state.gov/historicaldocuments/frus1961-63v04/d147)
        (telegram 476, 9:25 p.m., drafted by Hilsman, cleared with Harriman and McGeorge Bundy); the draft of Sept. 16, [doc.
        115](https://history.state.gov/historicaldocuments/frus1961-63v04/d115). Reply: Lodge and McNamara, telegram 593,
        Sept. 25, against transmitting a letter (doc. 147 n.2). [[w.sorensen-kennedy]], 658 (the letter, as sent: the passages
        on public support, assistance and the reporters; the officials to take part in decisions). Check: Sorensen gives the
        letter as written to Diệm (658); FRUS prints no delivery, and Lodge and McNamara advised against it. See [[cal.1963-09-23.vietnam]].
        Names: Kennedy, Diệm, Lodge, McNamara.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:ngo-dinh-diem'
      - 'name:lodge-henry-cabot'
      - 'name:mcnamara-robert-s'
      - 'name:hilsman-roger'
      src:
        c: '45613174'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v04/d147: all'
        - 'w.sorensen-kennedy 658: A-C'
        - 'via x.1963-09-24.kennedy-to-diem-letter-not-delivered: A-C'
- add:
    entry:
      id: cal.1962-10-28.south-asia
      when: Oct. 28
      date: '1962-10-28'
      thread: south-asia
      also:
      - india-and-china
      c: 'Kennedy to Ayub Khan, by letter, the text cabled to McConaughy for delivery Oct. 29: the Chinese attack on India
        no border wrangle; American help to India "will be used only against the Chinese"; Ayub to signal to Nehru, perhaps
        by private message, that Pakistan will take no action on the frontiers, so India can move its forces from them. No
        commitment on Kashmir.'
      n: '[FRUS 1961–63, XIX: South Asia, doc. 186](https://history.state.gov/historicaldocuments/frus1961-63v19/d186) (telegram
        681, 2:42 p.m.); [doc. 184](https://history.state.gov/historicaldocuments/frus1961-63v19/d184) (the instructions,
        Oct. 27: "We do not however feel it appropriate to make any commitment about Kashmir at this stage"). [[w.sorensen-kennedy]],
        664 (the letter: aid conditioned on its use against the Chinese; Ayub to reassure Nehru on Kashmir; Ayub to the Ambassador,
        unavailable for a week to read it, complaining he had not been consulted). Ayub''s reply in hand: [doc. 191](https://history.state.gov/historicaldocuments/frus1961-63v19/d191)
        (McConaughy with Ayub at Rawalpindi, Nov. 5). See [[cal.1962-10-26.south-asia]]. Names: Kennedy, Ayub Khan, Nehru.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:ayub-khan-mohammad'
      - 'name:nehru-jawaharlal'
      - 'name:mcconaughy-walter-p'
      src:
        c: '49595515'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v19/d186: all'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v19/d184: D'
        - 'w.sorensen-kennedy 664: A-C'
- add:
    entry:
      id: cal.1963-11-14.china
      when: Nov. 14
      date: '1963-11-14'
      thread: china
      c: 'News conference. No trade with Red China "in view of the policy that Red China pursues"; when it shows a desire
        to live at peace, the United States would reappraise. "We are not wedded to a policy of hostility to Red China."'
      n: 'The President''s News Conference, [1963 Pub. Papers 845](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=903)
        (Nov. 14, 1963), at 845–46. [[w.sorensen-kennedy]], 665 (the words). See [[cal.1961-06-02.china]]. Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: 9101f19c
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=903: all'
        - 'w.sorensen-kennedy 665: D'
- add:
    entry:
      id: cal.1961-06-02.china
      when: June 2
      date: '1961-06-02'
      thread: china
      c: 'Paris, the press luncheon. Asked how Communist China can normalize relations with the West: "we desire peace and
        we desire to live in amity with the Chinese people"; the attacks on the United States since before he took office
        "constant, immediate, and in many cases malevolent." "But it takes two to make peace." No evidence of it today.'
      n: 'Remarks and Question and Answer Period at the Press Luncheon in Paris, [1961 Pub. Papers 429](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=487)
        (June 2, 1961), at 436. [[w.sorensen-kennedy]], 665 (the answer, quoted). See [[cal.1961-05-31.berlin-and-vienna]].
        Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: 7c3b70ae
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=487: all'
        - 'w.sorensen-kennedy 665: B, D'
