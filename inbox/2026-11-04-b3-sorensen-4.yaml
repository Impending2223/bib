- add:
    entry:
      id: cal.1962-10-23.missile-crisis-15
      when: Oct. 23
      date: '1962-10-23'
      thread: missile-crisis
      c: The Executive Committee, 6 p.m. A first report of the low-level reconnaissance. The Proclamation of Interdiction
        revised slightly and approved; a further message to Khrushchev agreed. McNamara to review the naval action under the
        quarantine; Pittman to plan civil defense for the Southeast. Nitze to chair a subcommittee on Berlin, Rostow one on
        advance planning.
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 50](https://history.state.gov/historicaldocuments/frus1961-63v11/d50)
        (record of action). [[w.sorensen-kennedy]], 708–09 (the second meeting of the day; the pictures from the low-level
        flights). See [[cal.1962-10-23.missile-crisis-13]]. Names: McNamara, Nitze, Rostow, Khrushchev.'
      tags:
      - 'name:mcnamara-robert-s'
