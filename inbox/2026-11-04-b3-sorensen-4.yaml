- add:
    entry:
      id: cal.1961-01-25.congo
      when: Jan. 25
      date: '1961-01-25'
      thread: congo
      also:
      - foreign-aid
      c: 'News conference: the American contribution to relieve the famine in the Congo much increased: more corn meal and
        dry milk, rice, and an airlift of a thousand tons of food, seeds and hospital supplies from African nations; the Congo''s
        emergency needs from surplus stocks to be met in full.'
      n: 'The President''s News Conference, [1961 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=66)
        (Jan. 25, 1961). [[w.sorensen-kennedy]], 636 (the first move, in the first week: the emergency airlift). See [[cal.1961-01-17.congo]].
        Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: ab025cde
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=66: all'
        - 'w.sorensen-kennedy 636: all'
- add:
    entry:
      id: cal.1962-07-05.defense
      when: July 5
      date: '1962-07-05'
      thread: defense
      c: 'News conference, asked of the $460 million for fallout shelters on which Armed Services has held no hearings: "When
        the skies are clear, no one is interested"; "I think the time to do it is now." A supplemental request of some $35
        million to stock food against attack.'
      n: 'The President''s News Conference, [1962 Pub. Papers 539](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=599)
        (July 5, 1962), at 543. [[w.sorensen-kennedy]], 616–17 (the words; the shelter legislation of 1962). See [[cal.1961-07-20.defense]].
        Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: fbb755e5
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=599: all'
        - 'w.sorensen-kennedy 616–17: B'
- add:
    entry:
      id: cal.1961-10-17.testing
      when: Oct. 17
      date: '1961-10-17'
      thread: testing
      c: 'White House statement: the Soviet Union reported to plan a fifty-megaton explosion, asked to reconsider; the United
        States able since 1957 to make bombs of 50 to 100 megatons, but they are not needed; such a test "could only serve
        some unconfessed political purpose."'
      n: 'White House Statement Concerning Soviet Plans To Test a 50-Megaton Bomb, [1961 Pub. Papers 674](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=732)
        (Oct. 17, 1961). [[w.sorensen-kennedy]], 620 (the public appeal not to test a fifty-megaton bomb). See [[cal.1961-09-05.testing]].'
      tags: []
      src:
        c: e79df228
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=732: all'
        - 'w.sorensen-kennedy 620: A'
