- add:
    entry:
      id: cal.1963-11-01.testing
      when: Nov. 1
      date: '1963-11-01'
      thread: testing
      c: 'Statement to American women on their part in securing peace: information first, from one''s congressman or the Arms
        Control and Disarmament Agency; discussion of arms control in churches, parent-teacher associations and women''s organizations;
        letters to Representatives and Senators when an issue is up.'
      n: 'Statement by the President to American Women Concerning Their Role in Securing World Peace, [1963 Pub. Papers 834](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=892)
        (Nov. 1, 1963). [[w.sorensen-kennedy]], 745. Names: Kennedy.'
