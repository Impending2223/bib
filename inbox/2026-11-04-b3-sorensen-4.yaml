- add:
    entry:
      id: cal.1963-11-08.foreign-aid
      when: Nov. 8
      date: '1963-11-08'
      thread: foreign-aid
      also:
      - poverty
      c: 'New York, the Protestant Council''s dinner: poverty in eastern Kentucky and the cities; then "the Family of Man
        beyond the United States," more than three billion, most of them not white, not Christian; a word for Rockefeller''s
        candidacy.'
      n: 'Remarks at the Dinner of the Protestant Council of the City of New York, [1963 Pub. Papers 838](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=896)
        (Nov. 8, 1963). [[w.sorensen-kennedy]], 745–46 (on understanding the emerging peoples). See [[cal.1963-11-01.testing]].
        Names: Kennedy, Rockefeller.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:rockefeller-nelson'
