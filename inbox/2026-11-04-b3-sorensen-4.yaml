        - 'w.sorensen-kennedy 697: all'
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-6
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: 'The White House, 12:30 p.m. Kennedy alone with Ormsby-Gore, the British Ambassador: the U-2 evidence; an air strike
        on Oct. 22 or a blockade, which could Britain support? Ormsby-Gore the blockade; the President: he and his advisers
        had come to the same conclusion.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 37](https://history.state.gov/historicaldocuments/frus1961-63v11/d37)
        (editorial note, from the Ambassador''s report to London; no American record found). [[w.sorensen-kennedy]], 697 (he
        met with the British Ambassador, his close friend). To check: Harold Macmillan, *At the End of the Day, 1961–1963*
        (1973), 190–94 (cited by FRUS, doc. 37). See [[cal.1962-10-21.missile-crisis-3]]. Names: Kennedy, Ormsby-Gore.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:ormsby-gore-david'
      src:
        c: c0fa600a
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d37: all'
        - 'w.sorensen-kennedy 697: B'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-16
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: 'Kennedy to Macmillan, by letter, cabled to the embassy in London at 12:17 a.m. for delivery that morning: "incontrovertible"
        photographic evidence of offensive nuclear missiles in Cuba, some perhaps operational; Gromyko''s assurances of last
        Thursday false.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 39](https://history.state.gov/historicaldocuments/frus1961-63v11/d39)
        (telegram 2269, eyes only for the Ambassador). [[w.sorensen-kennedy]], 697 (letters to heads of state drafted Saturday).
        See [[cal.1962-10-21.missile-crisis-6]]. Names: Kennedy, Macmillan, Gromyko.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:macmillan-harold'
      - 'name:gromyko-andrei'
      src:
        c: dd080df6
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d39: all'
        - 'w.sorensen-kennedy 697: A'
