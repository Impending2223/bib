- add:
    entry:
      id: cal.1960-12.defense-2
      when: Dec., late
      date: 1960-12
      thread: defense
      also:
      - transition-and-staff
      c: 'After the late December budget and program review, the President-elect to McNamara: a list of questions (a supplemental
        defense budget; more for Polaris, Minuteman and Atlas; an air alert; airlift; a basic re-evaluation of strategy, bases
        abroad, the command and control of nuclear weapons). His first policy change: "Under no circumstances should we allow
        a predetermined arbitrary financial limit to establish either strategy or force levels."'
      n: '[[w.sorensen-kennedy]], 602–03 (the list and the instruction quoted). Check: the day, and the document (Sorensen
        gives no date beyond the December review). See [[cal.1960-12-21.transition-and-staff-2]]. Names: Kennedy, McNamara.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:mcnamara-robert-s'
      src:
        c: 6796c3b9
        rows:
        - 'w.sorensen-kennedy 602–03: all'
        - 'via x.1960-12.kennedy-to-mcnamara-defense-questions: all'
