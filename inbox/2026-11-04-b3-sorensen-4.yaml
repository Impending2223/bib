- add:
    entry:
      id: cal.1963-11-14.soviet-union
      when: Nov. 14
      date: '1963-11-14'
      thread: soviet-union
      c: 'News conference, on Professor Barghoorn''s arrest in Moscow: six protests by the embassy in forty-eight hours, Kohler
        at the Foreign Ministry; "He was not on an intelligence mission of any kind"; his release essential if the exchanges
        are to go on.'
      n: 'The President''s News Conference, [1963 Pub. Papers 845](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=903)
        (Nov. 14, 1963), at 845. [[w.sorensen-kennedy]], 746 (the strongly worded and successful protest over the detention
        of an American professor). See [[cal.1963-11-14.china]]. Names: Kennedy, Kohler.'
