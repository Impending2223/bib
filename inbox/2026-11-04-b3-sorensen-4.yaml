- add:
    entry:
      id: cal.1962-10-28.missile-crisis-5
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: '12:12 a.m. Rusk to the mission at NATO, for the Council: the President wants a factual briefing, the United States
        determined on its course; Khrushchev''s letter of Oct. 26 seemed to offer hope, the public letter linking Cuba to
        the Jupiters diminished it; "The situation as we see it is increasingly serious and time is growing shorter."'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 100](https://history.state.gov/historicaldocuments/frus1961-63v11/d100)
        (Topol 578). [[w.sorensen-kennedy]], 715 (special messages to NATO, de Gaulle and Adenauer on the critical stage reached).
        Check: the messages to de Gaulle and Adenauer. See [[cal.1962-10-27.missile-crisis-2]]. Names: Rusk, Kennedy, Khrushchev.'
      tags:
      - 'name:rusk-dean'
      - 'name:kennedy-john-f'
      - 'name:khrushchev-nikita-s'
      src:
        c: c3cd5449
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d100: all'
        - 'w.sorensen-kennedy 715: A'
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-6
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis
      c: 'The Executive Committee, 11:10 a.m., the tenth meeting, Khrushchev''s broadcast read by all beforehand. Bundy: "today
        was the doves'' day." No air reconnaissance today; the tanker *Graznyy* lying outside the zone, no bloc ship to halt;
        the UN to take on the surveillance if it will. No gloating, no claim of victory.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 103](https://history.state.gov/historicaldocuments/frus1961-63v11/d103)
        (Bromley Smith''s summary record). [[w.sorensen-kennedy]], 716–17 (the meeting postponed from 10 to 11 a.m.; the Sunday
        overflights called off, no ship halted; precautions against the exiles'' raids; "no boasting, no gloating"). See [[cal.1962-10-28.missile-crisis]].
        Names: Bundy, McNamara, Rusk, Kennedy.'
      tags:
      - 'name:bundy-mcgeorge'
      - 'name:mcnamara-robert-s'
      - 'name:rusk-dean'
      - 'name:kennedy-john-f'
      src:
        c: b215b369
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d103: A-E'
        - 'w.sorensen-kennedy 716–17: A, C-D, F'
- add:
    entry:
      id: cal.1962-10-28.missile-crisis-7
      when: Oct. 28
      date: '1962-10-28'
      thread: missile-crisis
      c: 'Statement by the President: "I welcome Chairman Khrushchev''s statesmanlike decision"; "an important and constructive
        contribution to peace." The arms race and the confrontation of the Warsaw Pact and NATO next.'
      n: 'Statement by the President Following the Soviet Decision To Withdraw Missiles From Cuba, [1962 Pub. Papers 815](https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=875)
        (Oct. 28, 1962). [[w.sorensen-kennedy]], 717–18 (the brief three-paragraph statement, in place of a television appearance).
        See [[cal.1962-10-28.missile-crisis]]. Names: Kennedy, Khrushchev.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:khrushchev-nikita-s'
      src:
        c: 12db8842
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1962-book1/pdf/PPP-1962-book1.pdf#page=875: all'
        - 'w.sorensen-kennedy 717–18: A'
- add:
    entry:
      id: cal.1962-10-30.missile-crisis-5
      when: Oct. 30–31
      date: '1962-10-30'
      thread: missile-crisis
      also:
      - cuba
      c: 'Havana. U Thant and his party with Castro, to arrange the inspection; Castro will have none. They leave at 4:30
        p.m., Oct. 31, "difficulties with Castro."'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 129](https://history.state.gov/historicaldocuments/frus1961-63v11/d129)
        (McCloy to Kuznetsov, Oct. 31: "U Thant and his entire party leaving Havana 4:30 p.m. today, and according our info
        there were difficulties with Castro"). [[w.sorensen-kennedy]], 720 (Castro''s five conditions; U Thant harangued and
        harassed, and back to New York baffled). Check: the days of the talks (U Thant''s report). See [[cal.1962-10-28.missile-crisis]].
        Names: U Thant, Castro.'
      tags:
      - 'name:u-thant'
      - 'name:castro-fidel'
      src:
        c: b2e0ec05
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d129: A, C'
        - 'w.sorensen-kennedy 720: all'
- add:
    entry:
      id: cal.1962-10-31.missile-crisis
      when: Oct. 31
      date: '1962-10-31'
      thread: missile-crisis
      c: 'New York. McCloy with Kuznetsov, an hour: the United States will continue its aerial surveillance of Cuba from tomorrow
        until the UN can verify; the gravest danger if a plane is fired on. Kuznetsov: the dismantling done by Nov. 2 or 3;
        the antiaircraft weapons in Cuban hands.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 129](https://history.state.gov/historicaldocuments/frus1961-63v11/d129)
        (USUN to State, 10:50 p.m.). [[w.sorensen-kennedy]], 719–20 (the reconnaissance continued, the UN unable to mount
        a substitute, with formal notice to the Soviets). See [[cal.1962-10-30.missile-crisis-5]]. Names: McCloy, Kuznetsov.'
      tags:
      - 'name:mccloy-john-j'
      - 'name:kuznetsov-vasily-v'
      src:
        c: 551985be
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d129: all'
        - 'w.sorensen-kennedy 719–20: B'
- add:
    entry:
      id: cal.1963-04-19.cuba
      when: Apr. 19
      date: '1963-04-19'
      thread: cuba
      c: 'To the American Society of Newspaper Editors, asked of Cuba: a blockade or an invasion a mistake under present conditions;
        "I don''t accept the view that Mr. Castro is going to be in power in 5 years"; "time will see Cuba free again."'
      n: 'Remarks and Question and Answer Period Before the American Society of Newspaper Editors, [1963 Pub. Papers 323](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=381)
        (Apr. 19, 1963), at 329–30. [[w.sorensen-kennedy]], 722 (the words). See [[cal.1963-04-19.economy]]. Names: Kennedy,
        Castro.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:castro-fidel'
      src:
        c: 4a0cebbf
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=381: all'
        - 'w.sorensen-kennedy 722: B-C'
- add:
    entry:
      id: cal.1963-04-11.testing
      when: Apr. 11
      date: '1963-04-11'
      thread: testing
      also:
      - soviet-union
      c: 'Kennedy to Khrushchev, in the private channel: no American representative ever indicated readiness to accept the
        number of inspections of Khrushchev''s message of Dec. 19, but there was "an honest misunderstanding"; he and Macmillan
        will make new suggestions soon. Firmly against more national nuclear forces; the multilateral force no increase in
        the danger.'
      n: '[FRUS 1961–63, VII: Arms Control and Disarmament, doc. 274](https://history.state.gov/historicaldocuments/frus1961-63v07/d274)
        (printed also in vol. VI, doc. 95). [[w.sorensen-kennedy]], 728 (the letter: Dean and Wiesner never indicated a readiness
        to agree on three inspections; an honest misunderstanding). See [[cal.1962-12-19.testing]]. Names: Kennedy, Khrushchev,
        Macmillan.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:khrushchev-nikita-s'
      - 'name:macmillan-harold'
      src:
        c: a1f6ece1
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v07/d274: all'
        - 'w.sorensen-kennedy 728: A'
- add:
    entry:
      id: cal.1963-09-12.testing-2
      when: Sept. 12
      date: '1963-09-12'
      thread: testing
      also:
      - goldwater
      c: 'News conference, the opening statement on the test ban treaty: "if this small clearly beneficial step cannot be
        approved by the widest possible margin in the Senate, then this Nation cannot offer much leadership." On Goldwater''s
        Chicago speech, that not ten men know the truth about Cuba and the treaty: "There are no commitments." Further comment?
        "No, no. Not yet, not yet."'
      n: 'The President''s News Conference, [1963 Pub. Papers 672](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=730)
        (Sept. 12, 1963), at 672, 675. [[w.sorensen-kennedy]], 739 & n.4 (the margin; the answer on Goldwater). See [[cal.1963-09-11.goldwater]].
        Names: Kennedy, Goldwater.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:goldwater-barry-m'
      src:
        c: 28fa8e26
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=730: all'
        - 'w.sorensen-kennedy 739: all'
- add:
    entry:
      id: cal.1963-10-10.trade
      when: Oct. 10
      date: '1963-10-10'
      thread: trade
      c: 'Kennedy to the President of the Senate and the Speaker, by letter, on the sale of wheat to the Soviet Union: the
        reasons for not prohibiting the sale of surplus wheat, flour, feed grains and other commodities to the Soviet Union
        and Eastern Europe, by private dealers, for dollars or gold, cash or normal credit.'
      n: 'Letter to the President of the Senate and to the Speaker of the House on the Sale of Wheat to the Soviet Union,
        [1963 Pub. Papers 776](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=834) (Oct. 10,
        1963). [[w.sorensen-kennedy]], 742 (the comprehensive report to the Congress the day after the decision). See [[cal.1963-10-09.trade]].
        Names: Kennedy.'
      tags:
      - 'name:kennedy-john-f'
      src:
        c: 8de8e5a8
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=834: all'
        - 'w.sorensen-kennedy 742: all'
- add:
    entry:
      id: cal.1963-10-09.space
      when: Oct. 9
      date: '1963-10-09'
      thread: space
      also:
      - testing
      c: 'News conference, on the reported agreement in principle to keep nuclear weapons out of space: "there is not an agreement."
        The United States will not put weapons in space; the Soviet Union says it does not intend to. "There is no way we
        can verify that, but we are glad to hear the intention."'
      n: 'The President''s News Conference, [1963 Pub. Papers 767](https://www.govinfo.gov/content/pkg/PPP-1963-book1/pdf/PPP-1963-book1.pdf#page=825)
