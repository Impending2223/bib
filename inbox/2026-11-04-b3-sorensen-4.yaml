      when: Jan. 25
      date: '1961-01-25'
      thread: testing
      c: 'News conference, the first announcement: the Geneva test ban negotiations, due early in February, to be put off
        to late March for a clear American position; McCloy''s panel of experts under Fisk of the Bell Laboratories to recommend
        it.'
      n: 'The President''s News Conference, [1961 Pub. Papers 8](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=66)
        (Jan. 25, 1961). [[w.sorensen-kennedy]], 617 (the special group to prepare a new bargaining position and a draft treaty).
