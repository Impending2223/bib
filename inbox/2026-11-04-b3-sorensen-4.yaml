- add:
    entry:
      id: cal.1962-10-22.missile-crisis-22
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - europe-and-the-alliance-france
      c: 'Paris, 5 p.m. Acheson, with Lyon, gives de Gaulle the President''s letter and the first part of his address; Sherman
        Kent ready with the photographs. De Gaulle: no French objection to the blockade, though he doubts it will get the
        missiles out; Moscow more likely to answer in Berlin; "France will act in accord with you." He appreciates being informed,
        after the decision.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 46](https://history.state.gov/historicaldocuments/frus1961-63v11/d46)
        (Lyon to Rusk, 9 p.m.). [[w.sorensen-kennedy]], 697, 705 (Acheson the emissary to de Gaulle and NATO; de Gaulle''s
        backing, no complaint of no advance consultation). See [[cal.1962-10-22.missile-crisis-8]]. Names: Acheson, de Gaulle.'
      tags:
      - 'name:acheson-dean'
      - 'name:de-gaulle-charles'
      src:
        c: f1ab66e8
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d46: all'
        - 'w.sorensen-kennedy 697, 705: B, D, G'
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-23
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - europe-and-the-alliance
      c: 'Kennedy and Macmillan by telephone, after the address: the clandestine build-up would have unhinged Latin America
        and Berlin; no plan to invade Cuba; the object to get the missiles out; "attempting to begin the escalation in a way
        to prevent WW III." Macmillan for his support, and for a summit on disarmament.'
      n: '[FRUS 1961–63, XI: Cuban Missile Crisis and Aftermath, doc. 45](https://history.state.gov/historicaldocuments/frus1961-63v11/d45)
        (the President''s side only). [[w.sorensen-kennedy]], 705 (Macmillan phoned his support, with an interest in a summit
        on disarmament and an interim suspension on both sides). Check: the hour. See [[cal.1962-10-22.missile-crisis-16]].
        Names: Kennedy, Macmillan.'
      tags:
      - 'name:kennedy-john-f'
      - 'name:macmillan-harold'
      src:
        c: 59015e51
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v11/d45: A-D'
        - 'w.sorensen-kennedy 705: E'
