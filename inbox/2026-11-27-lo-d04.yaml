      c: St. Louis, the hotel, about 3:30 a.m. Nixon wakes with a raging fever. Dr. John C. Lungren, who travels with him, finds a temperature over 103, probably a flu virus. Nixon tells him the
        Machinists' convention, set for 8:15 that morning, is the one meeting he must attend.
      n: '[[w.nixon-six-crises]], 331 ("at about three-thirty in the morning"; "a temperature of over 103, caused probably by a flu virus"; the Machinists'' convention "scheduled for 8:15 that
        morning"). The hour: "about three-thirty in the morning" ([[w.nixon-six-crises]], 331). See [[cal.1960-09-14.elections-1960-3]]. Names: Nixon. Check: White gives a cold, Nixon a fever,
        probably flu; White has Nixon, at three, unable to sleep, calling an aide, and a fever only at Roanoke that evening ([[w.white-making-of-the-president]], 274).'
