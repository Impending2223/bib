      when: Sept. 2
      date: '1960-09-02'
      place: baltimore
      thread: elections-1960-kennedy
      c: Baltimore, Friendship Airport. Kennedy, free of the Senate, takes off by chartered jet to open his campaign.
      n: '[[w.white-making-of-the-president]], 251 (the take-off "on Friday afternoon, September 2nd"; Maine that evening). Split under R17: the Presque Isle airport rally is [[cal.1960-09-02.elections-1960]].
        See [[cal.1960-09-02.elections-1960]]. Names: Kennedy. Check: the hour; White has the take-off Friday afternoon, but a reporter at the Portland press conference asks about the speech at
        Manchester "this morning" ([[w.communications-freedom-of-communications-part]], 90).'
      tags:
      - name:kennedy-john-f
      - state:md
      - city:baltimore
      - ok:fields-time
- edit:
    id: cal.1960-09-02.elections-1960
    base: 3e504ace
    set:
      c: 'Presque Isle, Maine, the airport rally: "I am delighted to start on this campaign, on this first day, in this county."{2}'
      n: 'Remarks of Senator John F. Kennedy, Presque Isle, Maine, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally)
        (Sept. 2, 1960). [[w.white-making-of-the-president]], 251–52 (Friday evening in Maine; not Presque Isle by name); [[w.communications-freedom-of-communications-part]], 80–81 (Presque Isle,
        the airport rally, "on this first day"). The hour: "yesterday afternoon I campaigned in Aroostook County, Maine" (Kennedy at Palmer, Sept. 3, [[w.communications-freedom-of-communications-part]],
        100). Split under R17: the take-off from Baltimore is [[cal.1960-09-02.elections-1960-kennedy-5]]. The order: after [[cal.1960-09-02.elections-1960-kennedy-4]], Manchester, which a reporter
        at the Portland press conference places "this morning" ([[w.communications-freedom-of-communications-part]], 90), against Presque Isle "yesterday afternoon" in Kennedy''s words at Palmer the next day (100); the printed order ([[w.communications-freedom-of-communications-part]],
        78–80) agrees. See [[cal.1960-07.elections-1960-4]]. Names: Kennedy.'
      time_band: afternoon
      time_range:
      - 1960-09-02T16:00Z
      - 1960-09-02T22:00Z
      time_zone: America/New_York
      src:
        c: 9d395918
        rows:
        - 'https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally: 2'
        - 'w.communications-freedom-of-communications-part 80–81: 2'
    kind: correct
    settles:
    - 'Check: the order of the Sept. 2 stops'
