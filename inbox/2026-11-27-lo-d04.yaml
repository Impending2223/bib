      c: 'Texarkana, Ark.-Tex., the fairgrounds, with Patman and Rayburn. Kennedy, at the fair at Patman''s invitation: "I come to this State on this occasion as the Democratic standard bearer." Boston,
        Tex., and Boston, Mass., "only a few inches apart"; of a President''s letter of a hundred years before: "we see the storm coming."'
      n: '[[w.communications-freedom-of-communications-part]], 226–27 (Kennedy: "Yesterday I was shown the Alamo"; the text follows the Dallas speech and precedes the note on the St. Louis airport).
        The order: after [[cal.1960-09-13.elections-1960-kennedy-4]], the printed order alone ([[w.communications-freedom-of-communications-part]], 223–26). See [[cal.1960-09.elections-1960-6]],
        [[cal.1960-09-13.elections-1960-kennedy-4]]. Names: Kennedy, Patman, Rayburn. Check: whether [[cal.1960-09.elections-1960-6]] (Woods: the Arkansas delegation turns out for Kennedy, McClellan
        in the lead; its note cites this page) is this appearance.'
      tags:
      - name:kennedy-john-f
      - name:patman-wright
      - name:rayburn-sam
      - state:ar
      - state:tx
      - city:texarkana
