- check:
    id: cal.1960-09-15.soviet-union
    text: 'Check: "that day" for Deng''s landing; Yang Shangkun''s diary, I, 544 (Sept. 15: "tomorrow''s flight to Moscow"; Sept. 16, 9 a.m., the Tu-104) and the Deng nianpu, III, 1574 (Deng and
      Peng Zhen leave Peking the morning of Sept. 16 and reach Moscow that evening; Chen Boda and Kang Sheng leave on the 15th) put the arrival on Sept. 16.'
- edit:
    id: cal.1960-09-17.soviet-union
    base: 3040cff1
    set:
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 358–360 (the first day; Suslov spoke first); [[w.yang-shangkun-riji]], I, 545, 547–548 (Sept. 17, 1960; from 1 p.m. Moscow time in the Kremlin;
        Deng''s greeting to Khrushchev and the Soviet Central Committee; Suslov; then Deng: nearly seventy Soviet articles attacking China since Bucharest, the experts withdrawn, *Su-Zhong youhao*
        苏中友好 stopped, embassy staff recalled, border incidents: where do the Soviets mean to take the relations; the Soviets adjourn to Monday); [[w.deng-xiaoping-nianpu-1904]], III, 1575–1576
        (Sept. 17, 1960; 1 to 2:30 p.m., the Kremlin; Deng: the delegation come for unity; after Suslov: the CPSU has carried the disputes on principle into state relations, sixty or seventy articles
        since Bucharest, the friendship journals stopped, the experts all withdrawn, a Chinese Embassy officer''s recall demanded, border incidents; where do the CPSU and the Soviet government
        mean to take the two parties and countries?); [[w.peng-zhen-nianpu-1902]], IV, 59–60 (Sept. 17–22, 1960; Peng Zhen at the talks; Sept. 17, 1 p.m., they open: Suslov: the Reply shows "no
        wish to ease," regrettable and dangerous; Deng: nearly seventy Soviet articles in two months since Bucharest, the experts withdrawn, the magazine *Druzhba* stopped (the page''s note: the
        Chinese weekly in the Soviet Union, stopped at the Soviet counsellor''s request of July 6, 1960), border incidents; where is this leading? The Soviet side adjourns, Sunday the 18th a rest).
        The hour: 1 p.m. Moscow time; Andropov: "the talks begin this afternoon at 1" ([[w.yang-shangkun-riji]], I, 547); 1 to 2:30 p.m. ([[w.deng-xiaoping-nianpu-1904]], III, 1575). Made public:
        1999. See [[cal.1960-09-15.soviet-union]]. Names: Suslov, Kozlov, Andropov, Deng Xiaoping, Peng Zhen, Lu Dingyi, Kang Sheng, Pospelov, Trotsky. Check: the account is the Chinese delegation''s.'
      time: 1960-09-17T10:00Z
      time_zone: Europe/Moscow
