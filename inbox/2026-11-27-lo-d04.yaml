- edit:
    id: cal.1960-09-08.elections-1960-kennedy-10
    base: e563c084
    set:
      c: 'Dunsmuir, Calif., from the rear platform of his train, at 8:45 a.m., with Governor Brown.{1} Kennedy: "We start this campaign in this State this morning"; he will be "all over it in
        the next few days" and come back in October.{2}'
      n: 'Rear Platform Remarks of Senator John F. Kennedy, Dunsmuir, CA, [APP](https://www.presidency.ucsb.edu/documents/rear-platform-remarks-senator-john-f-kennedy-dunsmuir-ca) (Sept. 8, 1960).
        [[w.white-making-of-the-president]], 256 (the train from Portland the evening before; the crowd risen at six; not Brown or the words); [[w.communications-freedom-of-communications-part]],
        163. W. H. Lawrence, "Kennedy Reverts to Old-Fashioned Whistle-Stop Tour in California," [*New York Times*, Sept. 9, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/09/issue.html),
        at 1, 16 (the speech-making day "began at 8:45 A. M. in Dunsmuir"). The hour: the *Times*; White''s six in the morning is when the little knot of people "had risen" ([[w.white-making-of-the-president]],
        256), not the speech. See [[cal.1960-09-02.elections-1960]]. Names: Kennedy, Brown.'
      time: 1960-09-08T15:45Z
      time_zone: America/Los_Angeles
    kind: correct
    settles:
    - 'Check: the hour: the *Times*, Sept. 9, 1960'
- edit:
    id: cal.1960-09-09.elections-1960-religion
    base: 7f0a4b1d
    set:
      n: 'Press Conference of Senator John F. Kennedy, Lockheed Air Terminal, Burbank, CA, [APP](https://www.presidency.ucsb.edu/documents/press-conference-senator-john-f-kennedy-lockheed-air-terminal-burbank-ca)
        (Sept. 9, 1960). [[w.white-making-of-the-president]], 255–56; [[w.communications-freedom-of-communications-part]], 182–87 (Kennedy''s press conference at the Lockheed Air Terminal, Burbank,
        Sept. 9; the questions on Peale and religion, 183–84; the expected child, 185; not the hour). The hour: "that afternoon in Los Angeles," the press-conference question on the expected child
        and the answer "My wife told me" ([[w.white-making-of-the-president]], 256), the exchange at [[w.communications-freedom-of-communications-part]], 185. Check: the words and the order; [[w.communications-freedom-of-communications-part]],
        185 prints Kennedy: "She told me. You would have to ask her.", and further questions after it, on the draft, Governor Brown''s forecast and Nixon (185–87). See [[cal.1960-09-08.elections-1960-kennedy-10]].
        Names: Kennedy.'
      place: burbank
      time_band: afternoon
      time_range:
      - 1960-09-09T19:00Z
      - 1960-09-10T01:00Z
      time_zone: America/Los_Angeles
    settles:
    - 'Check: whether White'
