- edit:
    id: cal.1960-09-14.elections-1960
    base: 1e46ddff
    set:
      n: '[[w.schlesinger-thousand-days-1965]], 70, by Schlesinger''s account; [[w.communications-freedom-of-communications-part]], 238–41 (Kennedy''s speech accepting the Liberal Party''s nomination,
        Commodore Hotel, New York; not Schlesinger''s hand in it); [[w.schlesinger-journals]], 89 (the Liberal Party banquet of Sept. 14: both Kennedy and Stevenson asked Schlesinger for their
        speeches that night and he wrote both, "a fact I have carefully kept secret"; Stevenson''s speech "a great success in the evening, but so was Kennedy''s"). The order: after [[cal.1960-09-14.elections-1960-kennedy-2]],
        the printed order alone ([[w.communications-freedom-of-communications-part]], 235–38). The hour: "tonight" (Kennedy at the Commodore Hotel, [[w.communications-freedom-of-communications-part]],
        239, 241): the evening. To check: Speech of Senator John F. Kennedy, Commodore Hotel, New York, NY, Acceptance of Party Nomination, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-commodore-hotel-new-york-ny-acceptance-party-nomination).
        See [[cal.1960-07-15.elections-1960]]. Names: Kennedy, Schlesinger.'
      time_band: evening
      time_range:
      - 1960-09-14T23:00Z
      - 1960-09-15T02:00Z
      time_zone: America/New_York
- edit:
    id: cal.1960-09-14.elections-1960-3
    base: 70f418e6
    set:
      c: Grand Forks, N.D., at noon.{1}
      n: 'Remarks of Vice President Richard M. Nixon, University of North Dakota Field House, Grand Forks, ND, [APP](https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-university-north-dakota-field-house-grand-forks-nd)
        (Sept. 14, 1960). [[w.nixon-six-crises]], 331 ("a noontime stop at Grand Forks"); [[w.white-making-of-the-president]], 273–74 (Grand Forks to Peoria, Wednesday). Split under R17: Peoria
        is [[cal.1960-09-14.elections-1960-nixon]] (the rally) and [[cal.1960-09-14.elections-1960-nixon-2]] (the press conference); St. Louis, [[cal.1960-09-14.elections-1960-nixon-3]] (the airport)
        and [[cal.1960-09-14.elections-1960-nixon-4]] (the hotel); the fever of Sept. 15 is [[cal.1960-09-15.elections-1960-nixon]]. See [[cal.1960-09-13.elections-1960]]. Names: Nixon. Check:
        the hour; Nixon has a "noontime stop," while the speaker who introduces him at the field house (APP) and a reporter at Peoria say "this afternoon."'
      src:
        c: c79274b7
        rows:
        - 'https://www.presidency.ucsb.edu/documents/remarks-vice-president-richard-m-nixon-university-north-dakota-field-house-grand-forks-nd: 1'
        - 'w.nixon-six-crises 331: 1'
        - 'w.white-making-of-the-president 273–74: 1'
    kind: correct
    settles:
    - 'Check: White gives a cold, Nixon a fever, probably flu.'
