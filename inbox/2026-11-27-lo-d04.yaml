      thread: elections-1960-nixon
      follows:
      - cal.1960-09-14.elections-1960-3
      c: 'Peoria, the WMBD-TV studios. Nixon''s press conference. On space: if the Soviet Union launches a man first, "we''re not going to get downhearted." Asked about his remark at Grand Forks
        that more may be paid to get the surpluses off the farmers'' back: his first farm speech, at Guthrie Center, Iowa, will deal with the surplus; a time should be set to deal with it.'
      n: 'Press Conference of Vice President Richard M. Nixon, WMBD-TV Studios, Peoria, IL, [APP](https://www.presidency.ucsb.edu/documents/press-conference-vice-president-richard-m-nixon-wmbd-tv-studios-peoria-il)
        (Sept. 14, 1960). See [[cal.1960-09-14.elections-1960-3]]. Names: Nixon.'
