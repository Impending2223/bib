      c: St. Louis, the airport. Nixon, from Peoria, is greeted by more than 5,000, after eleven at night.
      n: '[[w.nixon-six-crises]], 331 ("past eleven when we arrived"; "an enthusiastic airport crowd of over 5000"). The hour: "past eleven" ([[w.nixon-six-crises]], 331); the time is approximate.
        The order: after [[cal.1960-09-14.elections-1960-nixon]] and [[cal.1960-09-14.elections-1960-nixon-2]], the flight from Peoria ([[w.nixon-six-crises]], 331). See [[cal.1960-09-14.elections-1960-3]].
        Names: Nixon. Check: White has Nixon leave Peoria at eleven at night and reach St. Louis "shortly after midnight" ([[w.white-making-of-the-president]], 274).'
      tags:
      - name:nixon-richard-m
      - state:mo
