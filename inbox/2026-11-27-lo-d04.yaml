- edit:
    id: cal.1960-09-05.latin-america
    base: 7861c572
    set:
      c: 'Bogotá, the OAS Committee of 21. Dillon offers an inter-American program for social development: land, housing, schools, health.{1} Dillon speaks at the
        first plenary session of the meeting, the third in eighteen months of the OAS''s economic policy-making body; Julio César Turbay Ayala, Colombia''s Foreign Minister, presides. The program
        is "broad new social development"; a $500,000,000 fund "a first step."{2}'
      n: 'Juan de Onís, "U.S. Tells Latins of Plan to Widen Development Aid," [*New York Times*, Sept. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/09/07/issue.html), at 1, 5 (not
        the Committee of 21 by name, nor land, housing, schools and health as such). FRUS 1958–60, V, microfiche supp., docs. [ETA–48](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d48),
        [ETA–49](https://history.state.gov/historicaldocuments/frus1958-60v05mSupp/eta_d49) (instructions, Sept. 2). Dillon''s statement: [[w.department-of-state-bulletin]], [Oct. 3, 1960, 533](https://archive.org/details/departmentofstat4360unit/page/533/mode/1up)
        (the Committee convened Sept. 5–13; Dillon''s statement "on September 6," press release 513, dated Sept. 6). To check: [[w.rabe-eisenhower-and-latin-america]]; [[w.taffet-foreign-aid-as-foreign]];
        [[w.levinson-alliance-that-lost-its]]; [[w.rabe-most-dangerous-area-in]]. See [[cal.1960-09-05.latin-america-3]]. Names: Dillon, Turbay Ayala.'
      when: Sept. 6
      date: '1960-09-06'
    kind: correct
- follows:
