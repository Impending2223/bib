      when: Mar. 6
      date: '1965-03-06'
      thread: program
      also:
      - congress
      c: 'Johnson and Humphrey by telephone, 11:25 a.m., on the program before Congress, 104 bills. "If we don''t pass anything
        but education, and medical care, and Appalachia, we have had a record that the Congressmen can be reelected on." Humphrey
        to court Edith Green on the school bill: "She hates Morse."'
      n: '[Johnson and Humphrey, 11:25 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-hubert-humphrey-march-6-1965),
        Conversation WH6503-02-7024 (Miller Center). [[w.branch-at-canaans-edge]], 33–34 (the words). See [[cal.1965-01-04.program]].
        Names: Johnson, Humphrey, Green, Morse.'
