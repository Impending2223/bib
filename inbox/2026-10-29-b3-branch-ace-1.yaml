      c: Selma. Seventy-two white Alabamians, led by Joseph Ellwanger, a Lutheran pastor of Birmingham, march to the Dallas
        County courthouse for Negro voting rights; a telegram from his church's district president disowns him; some hundred
        whites with pipes and clubs shout down his statement. Wilson Baker arrests two attackers.
      n: '[[w.branch-at-canaans-edge]], 34–37. To check: SAC Mobile to Director, teletype, Mar. 6, 1965, FBI file 44-12831-477;
        Joseph Ellwanger, "Statement of Purpose," Mar. 7 [*sic*], 1965, Carpenter Papers, Birmingham Public Library (cited
        by [[w.branch-at-canaans-edge]], 35–37). Names: Baker.'
