        murder at once. The draft of the voting message "just doesn't sing yet." Katzenbach's talks with Dirksen on the bill
        have angered Mansfield; the Justice Department wants charges against Clark for Sunday, seven more lawyers sent. Johnson
        will meet the civil rights and church leaders.
