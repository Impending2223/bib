- add:
    entry:
      id: cal.1965-02-27.voting-rights
      when: Feb. 27
      date: '1965-02-27'
      thread: voting-rights
      c: 'Busby to Moyers and Lee White, "The Voting Rights Message": against a message proposing to suspend literacy tests
        and to send federal registrars where Negroes vote far below their share. To white Southern voters "a return to Reconstruction";
        unpopular "far outside the South," a "most radical intervention."'
      n: '[[w.branch-at-canaans-edge]], 15. To check: Horace Busby to Bill Moyers and Lee White, "The Voting Rights Message,"
        Feb. 27, 1965, Legislative Background, Voting Rights Act of 1965, box 1, LBJ Library (cited by [[w.branch-at-canaans-edge]],
        15). See [[cal.1965-02-09.voting-rights]]. Check: Branch has the memorandum circulate Sunday, Feb. 28, after Johnson
        ordered the staff to weigh the proposal. Names: Busby, Moyers, Lee White.'
      tags:
      - name:busby-horace
      - name:moyers-bill
      - name:white-lee-c
      src:
        c: 6d8839aa
        rows:
        - 'w.branch-at-canaans-edge 15: all'
        - 'via w.branch-at-canaans-edge 15 n.a-return-to: all'
- add:
    entry:
      id: cal.1965-03-01.voting-rights
      when: Mar. 1
      date: '1965-03-01'
      thread: voting-rights
      c: 'Katzenbach to Moyers and Lee White, answering Busby: abuse by the registrars is forbidden already, and the cases
        are delayed and evaded; no remedy that would "leave control of voting machinery in state hands." "While I agree with
        Mr. Busby that the political consequences of the proposed message are serious, I see no alternative."'
      n: '[[w.branch-at-canaans-edge]], 15–16. To check: Katzenbach to Moyers and White, Mar. 1, 1965, Moyers Papers, box
        6, LBJ Library (cited by [[w.branch-at-canaans-edge]], 16). See [[cal.1965-02-27.voting-rights]]. Names: Katzenbach,
        Moyers, Lee White, Busby.'
      tags:
      - name:katzenbach-nicholas
      - name:moyers-bill
      - name:white-lee-c
      - name:busby-horace
      src:
        c: dbac9bc4
        rows:
        - 'w.branch-at-canaans-edge 15–16: all'
        - 'via w.branch-at-canaans-edge 16 n.leave-control-of: all'
