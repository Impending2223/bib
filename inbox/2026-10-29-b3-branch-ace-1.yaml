        Educational and Cultural Affairs. Fulbright: the exchange program''s universities would recoil; "It never occurred
        to me that they were outstanding in the cultural field." Johnson: "They won''t have any if I don''t name this fella."
        Fulbright blocks the choice.'
      n: '[Johnson, Fulbright and McPherson, 1:00 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-william-fulbright-and-harry-mcpherson-july-9-0),
