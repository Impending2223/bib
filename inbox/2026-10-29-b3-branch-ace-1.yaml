- add:
    entry:
      id: cal.1965-03-08.voting-rights-selma-3
      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      c: King's telegrams call clergy of all faiths to "a ministers' march to Montgomery" on Mar. 9. The National Council
        of Churches' Commission on Religion and Race seconds him; its Washington chapter charters a plane. O'Boyle lets Catholic
        priests go, "just this once"; Bishop Hines rules the march a "recognized ecumenical activity," over Bishop Carpenter
        of Alabama. Some 800 from twenty-two States by Mar. 9, by *Jet*'s estimate.
      n: '[[w.branch-at-canaans-edge]], 60–61, 73. To check: King to Arthur Walmsley, Mar. 8, 1965; National Council of Churches,
        Commission on Religion and Race, press release, Mar. 8, 1965; memorandum from the Presiding Bishop, "Re: Executive
        Council involvement in the Selma-Montgomery March," Ralph Smeltzer Papers (cited by [[w.branch-at-canaans-edge]],
        60–61). See [[cal.1965-03-07.voting-rights]]. Names: Martin Luther King.'
      tags:
