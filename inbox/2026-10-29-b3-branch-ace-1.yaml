      c: 'Katzenbach to Hoover by telephone: Johnson and Rusk want the FBI to look into King''s position on Vietnam, and Communist
        influence on it; Wilkins and Farmer have called King''s words on the war wrongheaded. July 7, Hoover to Marvin Watson
        for Johnson: "The Position of Martin Luther King, Jr. and the Communist Party, USA, on Vietnam."'
