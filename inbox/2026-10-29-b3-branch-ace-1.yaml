    entry:
      id: cal.1965-03-10.vietnam
      when: Mar. 10
      date: '1965-03-10'
      thread: vietnam
      c: 'McNaughton, "Action for South Vietnam." The aims: "70%—To avoid a humiliating US defeat (to our reputation as a
        guarantor). 20%—To keep SVN (and then adjacent) territory from Chinese hands. 10%—To permit the people of SVN to enjoy
        a better, freer way of life." A coup within three weeks an even chance. Courses: squeeze the North, add a massive
        ground effort, or downgrade the stakes.'
      n: '[FRUS 1964–68, II, doc. 193](https://history.state.gov/historicaldocuments/frus1964-68v02/d193). [[w.branch-at-canaans-edge]],
        102. See [[cal.1965-02-26.vietnam]]. Names: McNaughton.'
