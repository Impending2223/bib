      id: cal.1965-03-27.alabama
      when: Mar. 27
      date: '1965-03-27'
      thread: alabama
      also:
      - civil-rights-the-executive
      c: 'Clark, of the Klansmen''s car: "The FBI had that car under surveillance." The FBI, by statement that night: "a malicious
        lie"; it "promptly disseminated all information which came to its knowledge"; only a "totalitarian" FBI could have
        done more.'
      n: '[[w.branch-at-canaans-edge]], 181. To check: *New York Times*, Mar. 28, 1965, 58; Hoover to Tolson et al., 1:38
        p.m., Mar. 29, 1965, FBI file on Tolson (cited by [[w.branch-at-canaans-edge]], 181). See [[cal.1965-03-25.alabama]].
        Names: Clark.'
      tags:
      - name:clark-james-g-jr
      src:
        c: fd5f41bf
        rows:
        - 'w.branch-at-canaans-edge 181: all'
        - 'via w.branch-at-canaans-edge 181 n.the-fbi-had: all'
- add:
    entry:
      id: cal.1965-06-28.voting-rights-selma
      when: June 28
      date: '1965-06-28'
      thread: voting-rights-selma
      c: 'Clark, an open letter of four pages, to be passed on: Selma the victim of a "criminal assassination" the Justice
        Department "planned, encouraged, executed, and helped" carry out; "The master of hate, who planned the operation,
        was in the White House."'
      n: '[[w.branch-at-canaans-edge]], 301. To check: James G. Clark, open letter, June 28, 1965, Birmingham Public Library
        Archives, Carpenter Papers, box 10, folder 56 (cited by [[w.branch-at-canaans-edge]], 301). See [[cal.1965-03-13.voting-rights-selma-2]].
        Names: Clark.'
      tags:
      - name:clark-james-g-jr
      - city:selma
      src:
        c: 5bc2f243
        rows:
        - 'w.branch-at-canaans-edge 301: all'
        - 'via w.branch-at-canaans-edge 301 n.criminal-assassination: all'
- add:
    entry:
      id: cal.1965-07-01.civil-rights-organizations-2
      when: July 1
      date: '1965-07-01'
      thread: civil-rights-organizations
      also:
      - civil-rights-the-executive
      c: 'After Abernathy''s word at Atlanta that SCLC checks its associates with "FBI men," DeLoach to Mohr: statements to
        the press that the claim is "absolutely untrue," "so as to give the lie to Martin Luther King and his ilk." Hoover:
        anyone furnishing information to SCLC "will be dismissed."'
      n: '[[w.branch-at-canaans-edge]], 249–50 (by DeLoach''s report). To check: DeLoach to Mohr, July 1, 1965, FBI file on
        SCLC, serial 391; Baumgardner to Sullivan, July 1, 1965, FBI file on SCLC, serial 408 (cited by [[w.branch-at-canaans-edge]],
        249–50). Made public: Check. Names: Abernathy, DeLoach, Martin Luther King, Hoover.'
      tags:
      - name:abernathy-ralph-david
