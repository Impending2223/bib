      date: '1965-05-19'
      thread: king
      c: 'Archibald Carey of Chicago, for King, to DeLoach at the FBI, to head off a press attack rumored for the end of the
        month. DeLoach: the FBI "had plenty to do without being responsible for a discrediting campaign against Reverend King."
        Hoover: "well handled"; he authorizes giving the FBI''s bugging and wiretap information on King to UPI''s chief Southern
        correspondent.'
      n: '[[w.branch-at-canaans-edge]], 225 (by DeLoach''s report). To check: DeLoach to Mohr, May 19, 1965, FBI file 77-59135-30
        (cited by [[w.branch-at-canaans-edge]], 225); [[w.garrow-fbi-and-martin-luther]], 170, 275 (cited by [[w.branch-at-canaans-edge]],
        225). Made public: Check (the Church Committee''s *Supplementary Detailed Staff Reports*, 1976, 171, 175, cited by
        Branch). See [[cal.1965-03-08.king]]. Names: DeLoach, Martin Luther King, Hoover.'
