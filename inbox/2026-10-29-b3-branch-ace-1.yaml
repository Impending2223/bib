      when: Apr. 1–2
      date: '1965-04-01'
      thread: civil-rights-organizations
      also:
      - king
      c: 'Baltimore, SCLC''s board. The Alabama boycott let slip; Andrew Young''s proposal to carry the movement into the
        Northern cities approved; Hosea Williams''s SCOPE, two thousand college students to register Negroes in 120 Black
        Belt counties that summer. Rustin: "We must not split what we have got for the first time." King names Abernathy his
        successor: "I know of no one that articulates my ideas more thoroughly."'
      n: '[[w.branch-at-canaans-edge]], 195–99. To check: Minutes, SCLC board meeting, Apr. 1–2, 1965, King Papers, King Library
        and Archives (cited by [[w.branch-at-canaans-edge]], 195–97). See [[cal.1965-03-27.voting-rights-selma]]. Names: Andrew
        Young, Williams, Rustin, Martin Luther King, Abernathy.'
