      c: 'Selma. Some 500 led out of Brown Chapel stopped down Sylvan Street at 12:47 p.m. by Smitherman''s police: no march,
        a permanent blockade; Clark''s possemen and a hundred troopers behind. Speeches for two hours; a vigil all night for
        Reeb. Baker strings a clothesline across the street, the "Berlin Wall."'
      n: '[[w.branch-at-canaans-edge]], 83–84. To check: Mobile LHM, Mar. 12, 1965, FBI file 44-12831-565 (cited by [[w.branch-at-canaans-edge]],
        83–84). See [[cal.1965-03-09.voting-rights]]. Names: Smitherman, Clark, Reeb, Baker.'
