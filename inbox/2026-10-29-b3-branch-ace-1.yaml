        tent city on Rosie Steele''s land on Highway 80. Hulett: "People in Lowndes County, whether they live or die, will
        put up our own candidates."'
      n: '[[w.branch-at-canaans-edge]], 403–05. To check: SNCC, "Background Information," Dec. 28, 1965, SNCC Papers; *New
        York Times*, Jan. 1, 1966, 15; *Southern Courier*, Jan. 1–2, 1966, 2 (cited by [[w.branch-at-canaans-edge]], 403–05).
        Check: the days. See [[cal.1965-11-16.alabama]].'
