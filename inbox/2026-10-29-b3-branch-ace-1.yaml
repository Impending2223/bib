      when: Mar. 13
      date: '1965-03-13'
      thread: voting-rights-selma
      c: 'Selma. Smitherman and Clark, a joint statement: "We say to all of these outside agitators, both white and Negro,
        you are not needed or wanted in our city." "Local government must not prostitute itself before the mob."'
      n: '[[w.branch-at-canaans-edge]], 91. To check: *Selma Times-Journal*, Mar. 14, 1965, 1 (cited by [[w.branch-at-canaans-edge]],
        91). Check: the day; Branch: "the next day" after Mar. 12. See [[cal.1965-03-09.voting-rights]]. Names: Smitherman,
        Clark.'
