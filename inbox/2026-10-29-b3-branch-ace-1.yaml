- add:
    entry:
      id: cal.1965-03-01.voting-rights-selma
      when: Mar. 1
      date: '1965-03-01'
      thread: voting-rights-selma
      also:
      - alabama
      - king
      c: 'A registration day. Selma: King leads some 300 to the Dallas County courthouse in the rain; Clark keeps them outside;
        266 complete applications, twice the record. Camden, Wilcox County: ten of some 200 in line allowed to apply. Hayneville,
        Lowndes County: Golson, a registrar, turns King away; that morning some 37 of the county''s Negroes, at the courthouse
        to register, were told to sign a pad and come back in two weeks.'
      n: '[[w.branch-at-canaans-edge]], 17–22. To check: *New York Times*, Mar. 2, 1965, 1, 10, 19 (cited by [[w.branch-at-canaans-edge]],
        19, 21–22). See [[cal.1965-01-02.voting-rights]]. Names: Martin Luther King, Clark.'
      tags:
      - name:king-martin-luther-jr
      - name:clark-james-g-jr
      src:
        c: 1a52cf91
        rows:
        - 'w.branch-at-canaans-edge 17–22: all'
        - 'via w.branch-at-canaans-edge 19 n.in-the-name: B-C'
        - 'via w.branch-at-canaans-edge 18 n.who-is-that: E'
- add:
    entry:
      id: cal.1965-03-03.voting-rights-selma
      when: Mar. 3
      date: '1965-03-03'
      thread: voting-rights-selma
      also:
      - alabama
      - king
      c: 'Marion, Perry County. Jimmie Lee Jackson''s funeral at Zion''s Chapel Methodist, some 400 inside, nearly a thousand
        outside. King''s eulogy: blame on the segregationists, the moderates, the "timidity" of the federal government; "unmerited
        suffering is redemptive." More than a thousand walk three miles in the rain to the grave. King sets the march from
        Selma to Montgomery for Sunday, Mar. 7; Bevel announces it that night.'
      n: '[[w.branch-at-canaans-edge]], 24–25. To check: *New York Times*, Mar. 4, 1965, 23 (cited by [[w.branch-at-canaans-edge]],
        24–25). See [[cal.1965-02-18.voting-rights]]. Names: Jackson, Martin Luther King.'
      tags:
      - name:jackson-jimmie-lee
      - name:king-martin-luther-jr
      src:
        c: a08dbdae
        rows:
        - 'w.branch-at-canaans-edge 24–25: all'
        - 'via w.branch-at-canaans-edge 24 n.a-tear-glistened: B-D'
        - 'via w.branch-at-canaans-edge 25 n.he-set-the: E'
- add:
    entry:
      id: cal.1965-03-03.king
      when: Mar. 3
      date: '1965-03-03'
      thread: king
      c: 'FBI headquarters to the Boston office: to try to scuttle the "Martin Luther King Day" planned for April by a derogatory
        briefing on King for Governor Volpe, "on a highly confidential basis and with the proviso that under no circumstances
        may there ever be any attribution to the FBI."'
      n: '[[w.branch-at-canaans-edge]], 27. To check: Baumgardner to Sullivan, Mar. 2, 1965, FBI file 100-106670-938 (cited
        by [[w.branch-at-canaans-edge]], 27). Made public: Check. Check: the day; Branch has headquarters instruct Boston
        "the day before" Mar. 4, the memorandum his note cites dated Mar. 2. Names: Volpe.'
      tags:
      - name:volpe-john-a
      - name:hoover-j-edgar
      src:
        c: 986c8773
        rows:
        - 'w.branch-at-canaans-edge 27: all'
        - 'via w.branch-at-canaans-edge 27 n.on-a-highly: all'
- add:
    entry:
      id: cal.1965-03-05.king
      when: Mar. 5
      date: '1965-03-05'
      thread: king
      also:
      - voting-rights-selma
      c: 'Hoover to Marvin Watson, for Johnson, from the FBI''s taps on Clarence Jones and its watch on King''s advisers at
        the Americana Hotel, New York: requests for federal protection of King in Alabama will be subversive in origin; Jones
        once of a suspect youth group, Ossie Davis called a Communist in 1963. By a separate secret letter: King again in
        touch with Levison.'
      n: '[[w.branch-at-canaans-edge]], 27. To check: Hoover to Marvin Watson, Mar. 5, 1965, FBI file 100-106670-931; SAC
        New York to Director, teletype, Mar. 4, 1965, FBI file 100-106670-963 (cited by [[w.branch-at-canaans-edge]], 27).
        Made public: Check. See [[cal.1965-01-11.king]]. Check: the separate letter''s date; Branch gives none. Names: Hoover,
        Watson, Levison.'
      tags:
      - name:hoover-j-edgar
      - name:watson-w-marvin
      - name:levison-stanley-d
      - name:king-martin-luther-jr
      - name:johnson-lyndon-b
      src:
        c: de31e0a7
        rows:
