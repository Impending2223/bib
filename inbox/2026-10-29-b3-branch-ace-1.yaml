      thread: georgia-bond
      also:
      - king
      c: 'King, by statement cleared from Los Angeles for an Atlanta press conference, on the move to keep Bond from his seat:
        "It is ironic that some of the prominent persons who now question Mr. Bond''s willingness to uphold the Constitution
        of the U.S. have failed miserably in this regard."'
