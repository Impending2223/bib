      c: 'Johnson and Katzenbach by telephone, 10 p.m., on Wallace''s wire asking him to police the march with federal civilians:
        "ridiculous," Katzenbach. The reply drafted: the Alabama Guard, ten thousand, is "trained and equipped for this purpose."
        Johnson: "and if he won''t call them out, we will." Earlier, to Ellington, Wallace "absolutely treacherous."'
      n: '[Johnson and Katzenbach, 10 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nicholas-katzenbach-and-marie-fehmer-march-0),
