      when: Jan. 7
      date: '1966-01-07'
      thread: king
      also:
      - states-and-cities
      - civil-rights-organizations
      c: 'Chicago, the Sahara Motel. King releases SCLC''s thirteen-page plan for "the first significant Northern freedom
        movement": the slum "a system of internal colonialism"; rallies, organizing and test demonstrations toward May. He
        will move his family into a slum flat before the month''s end.'
      n: '[[w.branch-at-canaans-edge]], 407–08. To check: SCLC, "A Proposal ... for the Development of a Nonviolent Action
        Movement for the Greater Chicago Area"; King, statement for release at 11 a.m., Jan. 7, 1966, Chicago police Red Squad
        files, Chicago History Museum; *New York Times*, Jan. 8, 1966, 22; *Chicago Defender*, Jan. 8–14, 1966, 1 (cited by
        [[w.branch-at-canaans-edge]], 407–08); [[w.garrow-bearing-the-cross]], 457–58 (cited by [[w.branch-at-canaans-edge]],
        407). See [[cal.1965-10-08.king]]. Names: Martin Luther King.'
      tags:
      - name:king-martin-luther-jr
      - state:il
      - city:chicago
      src:
