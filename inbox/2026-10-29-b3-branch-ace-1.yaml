      when: Mar. 20
      date: '1965-03-20'
      thread: civil-rights-organizations
      also:
      - civil-rights-the-executive
      c: 'DeLoach to Hoover, fourteen pages on Roy Wilkins''s "Connections and Affiliations" since the 1930s, for the Gridiron
        dinner that night, where Hoover sits beside him: Wilkins reliably anti-Communist through the Cold War, and a steady
        praiser of the Director.'
      n: '[[w.branch-at-canaans-edge]], 137–38. To check: DeLoach to Hoover, Mar. 20, 1965; M. A. Jones to DeLoach, Mar. 16,
        1965, FBI file on Roy Wilkins (cited by [[w.branch-at-canaans-edge]], 137). Made public: Check. Names: DeLoach, Hoover,
        Wilkins.'
      tags:
      - name:deloach-cartha
      - name:hoover-j-edgar
      - name:wilkins-roy
