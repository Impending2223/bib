- add:
    entry:
      id: cal.1965-03-09.king
      when: Mar. 9
      date: '1965-03-09'
      thread: king
      also:
      - voting-rights-selma
      c: 'Hoover vetoes a warning to King of threats against him if he marches that day, one of gunmen from Detroit, one of
