      when: Feb. 26
      date: '1965-02-26'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson and McNamara by telephone, 9:10 a.m.: "The game now is in the fourth quarter and it''s about 78 to nothing."
        On the bombing: "Now we''re off to bombing those people and we''re over that hurdle. And I don''t think anything is
        gonna be as bad as losing, and I don''t see any way of winning."'
      n: '[Johnson and McNamara, 9:10 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-february-26-1965),
        Conversation WH6502-06-6887 (Miller Center). [[w.branch-at-canaans-edge]], 16–17 (the words). See [[cal.1965-02-26.vietnam]].
        Names: Johnson, McNamara.'
