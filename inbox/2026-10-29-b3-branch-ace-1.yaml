      c: 'Hoover to Johnson by telephone, 8:10 a.m., on Liuzzo''s death: the case nearly solved, the FBI having "one of our
        men in the car," who "of course had no gun and did no shooting." At 9:36, of Liuzzo''s husband: "a Teamster man";
        of her, "numerous uh needle points." To his executives, 9:32 a.m.: "the appearance of a necking party." Johnson calls
        the widower anyway.'
      n: '[Johnson and Hoover, 8:10 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-j-edgar-hoover-march-26-1965),
