      when: Aug. 18
      date: '1965-08-18'
      thread: civil-disorders-watts
      also:
      - king
      c: 'Watts. King, with Rustin, at the Westminster Neighborhood Association, heckled: "Get out of here, Dr. King!" A man:
        "All we want is jobs. ... We don''t get no jobs, we''ll tear up Los Angeles, period." King: "We are not free in the
        South, and you are not free in the cities of the North." "Elijah Muhammad is my brother, even though our methods are
        different." That day he sees Governor Brown.'
