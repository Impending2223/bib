      when: Mar. 4
      date: '1965-03-04'
      thread: alabama
      also:
      - voting-rights-selma
      c: 'Montgomery. Wallace''s council, Lingo with it, on Sunday''s march: a plan to let it go and close Highway 80 to all
        traffic behind trooper roadblocks, the marchers cut off from support; Bill Jones, the press secretary: they will be
        the "laughingstock of the nation." By midnight Wallace approves leaks that no march will be allowed.'
      n: '[[w.branch-at-canaans-edge]], 26. To check: [[w.lesher-george-wallace]], 319; [[w.carter-politics-of-rage-1995]],
        246–47; Jones, *The Wallace Story*, 355–56 (cited by [[w.branch-at-canaans-edge]], 26). See [[cal.1965-03-06.voting-rights-selma-2]].
        Names: Wallace, Lingo.'
      tags:
      - name:wallace-george-c
      - name:lingo-albert-j
      - city:montgomery
      src:
        c: 9f7becdc
        rows:
        - 'w.branch-at-canaans-edge 26: all'
