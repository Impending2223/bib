      when: Aug. 14
      date: '1965-08-14'
      thread: alabama
      also:
      - voting-rights
      c: Fort Deposit, Lowndes County. Some twenty Negro teenagers with SNCC's workers, Jonathan Daniels and Father Morrisroe
        of Chicago among them, picket stores while a hundred Negroes wait to register with the federal examiners at the post
        office. Armed men close in within a minute; the pickets are arrested, Carmichael with them, and carried to the county
        jail at Hayneville on a garbage truck. Carl Golson, the registrar, smashes a reporters' windshield with a baseball
        bat.
      n: '[[w.branch-at-canaans-edge]], 290–92. To check: [[w.eagles-outside-agitator]], 169–71 (cited by [[w.branch-at-canaans-edge]],
        290); "48 Picketers Arrested in First Fort Deposit Protest," press report (cited by [[w.branch-at-canaans-edge]],
        292). See [[cal.1965-08-10.voting-rights]]. Names: Daniels, Morrisroe, Carmichael.'
