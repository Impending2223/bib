      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - king
      c: 'Moyers to Johnson by telephone, near midnight: Wallace, through Ellington, proposes that Johnson federalize the
        Guard; Katzenbach works to have King call off the next day''s march. Johnson, on the sit-ins at the Justice Department
        on television: "It looks like that man''s in charge of the country and taking it over." Moyers to take "a very firm
        line" with King.'
      n: '[Johnson and Moyers](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-bill-moyers-2),
        Conversation WH6503-04-7044 (Miller Center). [[w.branch-at-canaans-edge]], 65 (the words). See [[cal.1965-03-08.voting-rights-selma]].
        Names: Moyers, Johnson, Wallace, Ellington, Katzenbach, Martin Luther King.'
