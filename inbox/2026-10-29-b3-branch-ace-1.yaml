      when: Mar. 26
      date: '1965-03-26'
      thread: press-and-broadcasting
      also:
      - voting-rights-selma
      c: 'Busby to Johnson on the "heavy budget of news" Johnson ordered for Mar. 25, to take the nation''s attention back
        after the march: the trade figures, the mayors'' meeting, aid to North Vietnam if the fighting stopped, the Ranger''s
        landing places on the moon.'
      n: '[[w.branch-at-canaans-edge]], 171. To check: Horace Busby to Johnson, Mar. 26, 1965, Busby Papers, box 52, LBJ Library;
        *Washington Post*, Mar. 26, 1965, 1 (cited by [[w.branch-at-canaans-edge]], 171). See [[cal.1965-03-25.civil-rights-the-executive]].
        Names: Busby, Johnson.'
      tags:
      - name:busby-horace
      - name:johnson-lyndon-b
      src:
        c: 0db6604c
        rows:
        - 'w.branch-at-canaans-edge 171: all'
        - 'via w.branch-at-canaans-edge 171 n.heavy-budget-of: all'
        - 'via w.branch-at-canaans-edge 171 n.two-or-three: all'
- add:
