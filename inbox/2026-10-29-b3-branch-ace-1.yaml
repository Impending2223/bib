      when: Mar. 8
      date: '1965-03-08'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'Johnson and Lister Hill by telephone, 4:24 p.m. Johnson: "Our basic difficulty is we have no communication with
        Wallace at all"; King''s wires have clergy coming from all over the country. Hill: "That damn little Wallace" will
        make Johnson look the instigator, as though "he just moved in there and took over for this King."'
      n: '[Johnson and Hill, 4:24 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-lister-hill-march-8-1965),
        Conversation WH6503-04-7039 (Miller Center). [[w.branch-at-canaans-edge]], 59–60 (the words). See [[cal.1965-03-08.voting-rights-selma]].
        Names: Johnson, Hill, Wallace, Martin Luther King.'
