      when: Mar. 19
      date: '1965-03-19'
      thread: civil-rights-the-executive
      also:
      - voting-rights-selma
      c: 'Belmont to Tolson, on the FBI''s part in the march: Hoover, on the memorandum, "I thought the military (Federal)
        was in control." Inspector Sullivan argues for contact with both sides; Hoover allows it, within limits.'
      n: '[[w.branch-at-canaans-edge]], 137. To check: Belmont to Tolson, Mar. 19, 1965, FBI file 44-28544 (Selma march),
        serial 177; Rosen to Belmont, Mar. 20, 1965, FBI file 44-12831, serial 759 (cited by [[w.branch-at-canaans-edge]],
        137). Made public: Check. See [[cal.1965-03-21.voting-rights]]. Names: Belmont, Tolson, Hoover.'
