      c: 'Johnson and Katzenbach by telephone, 8:10 a.m., on Selma. Katzenbach: the FBI jailed three white men who attacked
        one of its agents on the bridge, unannounced: "That didn''t look right." No one can reach Wallace; Johnson sends Buford
        Ellington to Katzenbach''s office as a go-between: "Just have to be mighty quiet."'
