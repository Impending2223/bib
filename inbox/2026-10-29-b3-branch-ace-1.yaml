- add:
    entry:
      id: cal.1965-07-07.voting-rights-2
      when: July 7
      date: '1965-07-07'
      thread: voting-rights
      also:
      - king
      - war-opposition
      c: 'King to Johnson by telephone, 8:05 p.m., his first call to the President. Johnson on the voting bill: the House''s
        ban on the poll tax would force a conference and delay; a case from Vermont would let the Court void the whole act;
        the tax to fall by a pending suit. King on his words about Vietnam: not "destructive criticism," not unilateral withdrawal.
        Johnson: "I don''t want to be a warmonger," but he will not "come home runnin'' with my tail between my legs." He
        offers King briefings by Rusk and McNamara.'
      n: '[Johnson and King, 8:05 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-martin-luther-king-july-8-1965-1),
        Conversation WH6507-02-8311 (Miller Center). [[w.branch-at-canaans-edge]], 252–55 (the words). See [[cal.1965-05-25.voting-rights]].
        Names: Martin Luther King, Johnson, Rusk, McNamara.'
