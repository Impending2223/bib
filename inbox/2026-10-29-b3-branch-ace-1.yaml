      date: '1966-01-07'
      thread: alabama
      also:
      - civil-rights-the-executive
      c: 'Clifford Alexander to Johnson, 10:45 a.m., on Tuskegee: "The white city officials are frightened, and some have
        mentioned that they would like Federal troops or Federal marshals." Doar to sue that day over restaurants turned into
        "sham private clubs." Johnson returns the memoranda: call Younge''s father and Foster; "support any action we need
        to take here."'
      n: '[[w.branch-at-canaans-edge]], 408. To check: Alexander to Johnson, 4:10 p.m., Jan. 6, 1966; 10:45 a.m., 1:00 p.m.
        and 4:22 p.m., Jan. 7, 1966, EX HU2/ST1, box 25, LBJ Library (cited by [[w.branch-at-canaans-edge]], 408). Check:
        whether Doar filed that day. See [[cal.1966-01-03.alabama]]. Names: Alexander, Johnson, Doar, Younge.'
      tags:
