      c: 'Johnson to Katzenbach by telephone, after Joseph Alsop and James Reston complained to him of being tapped: "have
        I ever asked you or suggested to you that you tap a line?" Taps "brought to an irreducible minimum, and only in the
        gravest cases"; "I''m against wiretapping, period." Katzenbach: he authorizes every FBI tap, King''s "the furthest
        out"; the FBI''s microphones, planted by trespass, he learned of only lately, and will bring under the same approval.'
      n: '[Johnson, Katzenbach and Moyers, 6:24 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-nicholas-katzenbach-and-bill-moyers-march-29),
        Conversation WH6503-14-7179 (Miller Center). [[w.branch-at-canaans-edge]], 185–88 (the words). Names: Johnson, Katzenbach,
        Alsop, Reston, Martin Luther King.'
