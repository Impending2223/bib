        authorization," removed. Inspector Joe Sullivan, from the Neshoba investigation, ordered to Selma to take charge.'
      n: '[[w.branch-at-canaans-edge]], 91. To check: Belmont to Tolson, Mar. 12, 1965, FBI file 44-12831, serial 603 (cited
