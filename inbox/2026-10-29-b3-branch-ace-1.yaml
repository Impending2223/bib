      c: 'Saltonstall calls DeLoach to his office at noon: "pressure is mounting" in Massachusetts for him to sponsor a dinner
        for King, and he feels misled by the FBI. DeLoach: Johnson never lets himself be alone with King; "King was a phony
        through and through."'
