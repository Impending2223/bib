      c: 'Johnson and McNamara by telephone, 9:22 a.m., before Wallace comes: "They all say, ''we want troops.''" Katzenbach''s
        lawyers recommend against them; marshals no better. McNamara: troops "leave a bitter taste in the mouths" of the States
        and their Senators, with the bill coming; "If we did anything wrong in the past two or three years on this, it was
        to introduce troops too early." Units on alert.'
