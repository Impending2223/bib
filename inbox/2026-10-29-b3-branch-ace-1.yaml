      thread: civil-rights-the-executive
      also:
      - voting-rights-selma
      c: 'DeLoach to Mohr: he has turned down the White House''s and the Justice Department''s request for an FBI escort for
        Marie Reeb at Birmingham, the Alabama agents "working around the clock in the Selma area." Hoover commends him and
        asks a security review of the Justice aide behind the idea, James Flug.'
      n: '[[w.branch-at-canaans-edge]], 90–91 (by DeLoach''s report). To check: DeLoach to Mohr, Mar. 10, 1965, FBI file 44-12831
        (Dallas County election laws), serial 570 (cited by [[w.branch-at-canaans-edge]], 90). Made public: Check. See [[cal.1965-03-09.voting-rights]].
        Names: DeLoach, Hoover.'
      tags:
      - name:deloach-cartha
      - name:hoover-j-edgar
