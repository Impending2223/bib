- add:
    entry:
      id: cal.1965-03-06.vietnam-force-levels
      when: Mar. 6
      date: '1965-03-06'
      thread: vietnam-force-levels
      c: 'Johnson and McNamara by telephone, 2:32 p.m., the Marines for Đà Nẵng: "The answer is yes, if there''s no other
        alternative." "Every mother is gonna say, ''Uh, oh. This is it.''" Not to be called military police; "security battalions."
        Johnson: "my answer is yes but my judgment''s no." The order to go out that afternoon, the release held for the night.'
      n: '[Johnson and McNamara, 2:32 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-march-6-1965),
        Conversation WH6503-03-7028 (Miller Center). [[w.branch-at-canaans-edge]], 39–40 (the words). See [[cal.1965-02-26.vietnam]];
        [[cal.1965-03-06.vietnam-congress-2]]. Names: Johnson, McNamara.'
      tags:
