- add:
    entry:
      id: cal.1965-03-06.voting-rights-selma-2
      when: Mar. 6
      date: '1965-03-06'
      thread: voting-rights-selma
      also:
      - alabama
      c: 'King, from Atlanta, about noon: if Sunday''s marchers are stopped they will "lie down in the road" and seek federal
        relief. Wallace, at a news conference at four: "There will be no march between Selma and Montgomery"; Lingo to "take
        whatever steps necessary." Smitherman: "Negroes should not be permitted to make this senseless march."'
      n: '[[w.branch-at-canaans-edge]], 37–39. To check: SAC Mobile to Director, teletype, Mar. 6, 1965, FBI file 44-12831-477;
        *Selma Times-Journal*, Mar. 7, 1965 (cited by [[w.branch-at-canaans-edge]], 38–39). See [[cal.1965-01-02.voting-rights]].
        Names: Martin Luther King, Wallace, Lingo, Smitherman.'
      tags:
      - name:king-martin-luther-jr
      - name:wallace-george-c
      - name:lingo-albert-j
      - name:smitherman-joseph-t
      src:
