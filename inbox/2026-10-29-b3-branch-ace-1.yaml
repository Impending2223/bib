      when: Aug. 30
      date: '1965-08-30'
      thread: desegregation-schools
      c: 'The South''s public schools open. The Office of Education: nearly two-thirds of the districts with satisfactory
        plans. Nine Negroes into white schools at Philadelphia, Miss.; at Atlanta three Abernathy children and two of King''s
        at Spring Street School, under freedom of choice.'
