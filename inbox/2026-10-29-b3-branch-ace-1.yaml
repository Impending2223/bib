      c: 'King on *Meet the Press*, from San Francisco. Asked of Truman''s word for the Selma march, "silly": "the march was
        not silly at all." The march for the voting bill, and against the bombings and murders, "as much as to gain the right
        to vote." Demonstrations "the best way" to keep the issues before the public.'
      n: '[[w.branch-at-canaans-edge]], 183–84. To check: transcript, *Meet the Press*, Mar. 28, 1965, SCLC Records, King
        Library and Archives (cited by [[w.branch-at-canaans-edge]], 183). See [[cal.1965-03-21.voting-rights]]. Names: Martin
        Luther King, Truman.'
