        - 'via w.branch-at-canaans-edge 137 n.assistant-director-deloach: all'
- add:
    entry:
      id: cal.1965-03-25.civil-rights-the-executive
      when: Mar. 25
      date: '1965-03-25'
      thread: civil-rights-the-executive
      also:
      - voting-rights-selma
      c: 'Collins of the Community Relations Service, to the Cabinet in closed session and then to the press: the federal
        agencies around Montgomery still largely segregated, reform pledged; few white ministers willing to preach "against
        rowdiness"; his mediators met white Alabamians "conditioned to think of the federal government and of the march leadership
        as forces of evil."'
      n: '[[w.branch-at-canaans-edge]], 171–72. To check: Collins to Johnson, Mar. 24, 1965; Johnson to Collins, Mar. 25,
        1965, EX FG/ST1, box 229, LBJ Library (cited by [[w.branch-at-canaans-edge]], 171). Check: which words were the Cabinet''s
        and which the press''s. See [[cal.1965-03-21.voting-rights]]. Names: Collins.'
      tags:
      - name:collins-leroy
      src:
        c: bfef7379
        rows:
        - 'w.branch-at-canaans-edge 171–72: all'
        - 'via w.branch-at-canaans-edge 171 n.this-was-a: all'
- add:
