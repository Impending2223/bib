        conference, the agents grilled on how he could promise prosecutions before the FBI had given "any information whatsoever"
        identifying the officers of Mar. 7.'
      n: '[[w.branch-at-canaans-edge]], 91. To check: Rosen to Belmont, Mar. 11, 1965, FBI file 44-12831, serials 581, 669
        (cited by [[w.branch-at-canaans-edge]], 91). Made public: Check. See [[cal.1965-03-11.civil-rights-the-executive-2]].
