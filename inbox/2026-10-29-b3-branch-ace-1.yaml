      thread: students
      also:
      - civil-rights-the-executive
      - war-opposition
      c: 'Alexander to Johnson, after 4:55 p.m., on SNCC''s statement: Negro leaders being mobilized to "negate the impact
        of this story" with their "wholehearted support" of the war. "The most difficult part of the equation is what Martin
        Luther King will do next."'
      n: '[[w.branch-at-canaans-edge]], 408. To check: Alexander to Johnson, Jan. 7, 1966, EX HU2/ST1, box 25, LBJ Library
        (cited by [[w.branch-at-canaans-edge]], 408). Check: its hour. See [[cal.1966-01-06.students]]. Names: Alexander,
        Johnson, Martin Luther King.'
      tags:
