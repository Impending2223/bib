- add:
    entry:
      id: cal.1965-03-01.vietnam-air-war
      when: Mar. 1
      date: '1965-03-01'
      thread: vietnam-air-war
      also:
      - press-and-broadcasting
      c: 'Johnson and McNamara by telephone, 10:46 a.m. McNamara cleared to "go ahead tonight" with the first strike of the
        sustained bombing, put off by weather. Johnson, on the *New York Times*''s story of the plans that morning: "Am I
        wrong in saying that this appears to be almost traitorous?" "Somebody ought to be removed, Bob."'
      n: '[Johnson and McNamara, 10:46 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-march-1-1965),
        Conversation WH6503-01-7002 (Miller Center). [[w.branch-at-canaans-edge]], 17 (the words). To check: Robert Kleiman,
        "U.S. Said to Plan Limited Air War as Lever on Hanoi," *New York Times*, Mar. 1, 1965, 1 (cited by [[w.branch-at-canaans-edge]],
        17). See [[cal.1965-03-02.vietnam]]. Names: Johnson, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      src:
        c: 04ef90cd
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-march-1-1965: A'
