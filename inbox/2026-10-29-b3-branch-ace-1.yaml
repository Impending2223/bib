      - voting-rights-selma
      c: 'Rosen to Belmont, from the field offices: "a total of 1,856 persons are already in Selma or actually have departed
        and are en route"; sixty-three groups more, "totaling 1,011 in number," getting ready.'
      n: '[[w.branch-at-canaans-edge]], 137. To check: Rosen to Belmont, Mar. 20, 1965, FBI file 44-28544, serial 179 (cited
        by [[w.branch-at-canaans-edge]], 137). Made public: Check. See [[cal.1965-03-19.civil-rights-the-executive-2]]. Names:
