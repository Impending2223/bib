        - 'via w.branch-at-canaans-edge 27 n.warning-to-president: A'
        - 'via w.branch-at-canaans-edge 27 n.we-cannot-afford: A'
- add:
    entry:
      id: cal.1965-03-05.civil-rights-organizations
      when: Mar. 5–6
      date: '1965-03-05'
      thread: civil-rights-organizations
      also:
      - voting-rights-selma
      c: 'Atlanta, Frazier''s café. SNCC''s executive committee, two nights, on King''s march from Selma. Silas Norman, the
        Selma project''s director: SNCC should give logistics and medical help; Forman, Cox and others for a course of SNCC''s
        own; Lewis alone for the march: "If these people want to march, I''m going to march with them." Toward midnight Saturday:
        SNCC disapproves the march, its workers free to join "as individuals." Lewis and Norman to King, Mar. 7: "the objectives
        of the march do not justify the danger and the resources involved."'
      n: '[[w.branch-at-canaans-edge]], 29–31, 40–42, 50. To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965,
        and Mar. 6, 1965, SNCC Papers, King Library and Archives; John P. Lewis and Silas Norman, Jr., to King, Mar. 7, 1965,
        King Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). See [[cal.1965-03-07.voting-rights]].
        Names: Forman, John Lewis, Martin Luther King.'
      tags:
      - name:forman-james
      - name:lewis-john
      - name:king-martin-luther-jr
      src:
        c: 067ee2b0
        rows:
        - 'w.branch-at-canaans-edge 29–31: A-C'
        - 'w.branch-at-canaans-edge 40–42: all'
        - 'w.branch-at-canaans-edge 50: E'
