      when: Mar. 21
      date: '1965-03-21'
      thread: alabama-birmingham
      also:
      - voting-rights-selma
      c: Birmingham. Bombs of dynamite, timed for noon, found at Our Lady of the Universe Catholic Church, at a mortuary of
        A. G. Gaston's, and at the home of Arthur Shores; an Army demolition team from Fort McClellan disarms them, one of
        fifty-eight sticks. Four bombs at Negro sites disarmed by night, Moyers reports to Johnson; two more on Mar. 22.
      n: '[[w.branch-at-canaans-edge]], 140, 145. To check: Moyers to Johnson, Mar. 21, 1965, and "Bombing Devices Found in
        Birmingham," 10:45 p.m., Mar. 21, 1965, WH Confidential, box 56, LBJ Library; *New York Times*, Mar. 22, 1965, 1,
        27 (cited by [[w.branch-at-canaans-edge]], 140, 145). See [[cal.1963-09-15.alabama]]. Names: Moyers, Johnson.'
