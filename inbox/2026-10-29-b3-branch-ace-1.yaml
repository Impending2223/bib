        over Heckling," *Los Angeles Times*, Aug. 19, 1965, 3 (cited by [[w.branch-at-canaans-edge]], 296). See [[cal.1965-08-11.states-and-cities]].
        Names: Martin Luther King, Rustin, Brown.'
