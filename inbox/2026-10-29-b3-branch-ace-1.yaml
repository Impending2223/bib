        Hoover to Marvin Watson, and Watson to Johnson, with the FBI''s memorandum "The Position of Martin Luther King, Jr.
        and the Communist Party, USA, on Vietnam," July 7, 1965, Office Files of Mildred Stegall, LBJ Library (cited by [[w.branch-at-canaans-edge]],
        251). Made public: Check. See [[cal.1965-03-05.king]]. Names: Katzenbach, Hoover, Johnson, Rusk, Wilkins, Farmer,
        Watson.'
