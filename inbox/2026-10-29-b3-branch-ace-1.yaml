      c: 'The Agricultural Stabilization and Conservation Service''s county committee elections in five Black Belt counties,
        the first contested between the races: in Lowndes, where nearly two-thirds of the farmers are Negroes, seventy Negroes
        put on the ballot by whites split the vote, and the committee stays white. Carmichael: "We believed in them, and they
        cheated us."'
