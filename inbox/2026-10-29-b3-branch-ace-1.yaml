      n: '[[w.branch-at-canaans-edge]], 15. To check: Branigan to Sullivan, Feb. 28, 1965, FBI file 100-106670-983 (cited
        by [[w.branch-at-canaans-edge]], 15). Made public: Check. See [[cal.1965-03-01.voting-rights-selma]]. Names: Sullivan,
        Martin Luther King, Johnson, Hoover.'
