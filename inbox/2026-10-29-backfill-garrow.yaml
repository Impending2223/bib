      c: 'Johnson''s bipartisan meeting in the Cabinet Room, 5 to 6:30 p.m., "re civil rights difficulties": Humphrey, Katzenbach,
        Burke Marshall, McCormack, Mansfield, Dirksen, Kuchel, Albert, Hale Boggs, McCulloch, with Ramsey Clark, O''Brien,
        Lee White, Valenti. The address to a joint session the next night agreed, by Garrow''s account.'
