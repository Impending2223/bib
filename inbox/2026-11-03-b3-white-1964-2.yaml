      date: '1964-05-30'
      thread: elections-1964
      c: 'Saturday afternoon, New York. Nelson A. Rockefeller Jr. born. Rockefeller home in time: he had telephoned his wife
        from the San Francisco airport at 4:30 Friday and flown east at once.'
      n: '[[w.white-making-of-the-president-1965]], 124. Names: Rockefeller, Margaretta Rockefeller.'
