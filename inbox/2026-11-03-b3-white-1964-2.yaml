      date: 1963-08
      thread: elections-1964
      also:
      - republican-party
      c: 'Eisenhower names ten Republicans besides Goldwater and Rockefeller as Presidential timber, for the party to choose
        among in open discussion. His own first choices, by White''s account: Robert Anderson, Gruenther, Clay, and his brother
        Milton.'
      n: '[[w.white-making-of-the-president-1965]], 71. Names: Eisenhower, Goldwater, Rockefeller, Robert Anderson, Gruenther,
        Clay, Milton Eisenhower. Check: the day and the ten names.'
      tags:
      - 'name:eisenhower-dwight-d'
      - 'name:goldwater-barry-m'
