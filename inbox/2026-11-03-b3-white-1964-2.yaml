    item: '[[w.white-making-of-the-president-1965]], 158–59 (Scranton at the O''Hare Inn, June 30, picketed by Goldwater''s
      men and by civil-rights demonstrators; Stassen heard; Goldwater 48, abstaining 8, passing 2, Scranton none)'
    units: 'A, C, E'
