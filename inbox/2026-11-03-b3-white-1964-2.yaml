        F. Clifton White, Moley. Dates and timing; Moley for running, but out of the primaries. Goldwater still undecided.'
      n: '[[w.white-making-of-the-president-1965]], 96. See [[cal.1963-12-08.goldwater]]. Names: Goldwater, Kitchel, Cotton,
