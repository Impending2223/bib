- add:
    entry:
      id: cal.1964-01.elections-1964-9
      when: Jan.
      date: 1964-01
      thread: elections-1964
      c: 'Late January, a Friday. Rockefeller, from New York business that morning, flies to Manchester, N.H., about 2 p.m.,
        Gregg and his staff to meet him, and opens a headquarters in Nashua; the questions at every stop on foreign affairs.
        That week Buffalo Monday, California Tuesday to Thursday. Twenty-eight days of New Hampshire campaigning allotted;
        Goldwater''s lead cut from 3 to 1 to about even.'
      n: '[[w.white-making-of-the-president-1965]], 100–02. See [[cal.1963-11-07.elections-1964]]. Names: Rockefeller, Gregg.
        Check: the day (Jan. 24 or 31).'
