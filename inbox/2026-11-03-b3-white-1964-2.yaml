        rows:
        - 'w.white-making-of-the-president-1965 147: all'
- add:
    entry:
      id: cal.1964-06-07.elections-1964-3
      when: 'June 7'
      date: '1964-06-07'
      thread: elections-1964
      c: 'Cleveland. Rockefeller''s press conference after Scranton''s broadcast. Would he support Scranton? "Governor Scranton
        said that he was waiting to see where Senator Goldwater stood. And after listening to his press conference, I think
        I''ve got to wait to see where he stands." Scranton''s leadership? "Did you see him on television?"'
      n: '[[w.white-making-of-the-president-1965]], 147. See [[cal.1964-06-07.elections-1964]]. Names: Rockefeller, Scranton,
        Goldwater.'
