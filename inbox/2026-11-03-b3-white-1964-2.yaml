- add:
    entry:
      id: cal.1964-03-05.goldwater
      when: 'Mar. 5'
      date: '1964-03-05'
      thread: goldwater
      c: 'Wilton, N.H., the home of Samuel Abbott, thirty townspeople and fifteen national reporters, the morning after the
        Keene speech. Goldwater: abolish the electoral college; "carrying the war to North Vietnam"; the debt a trillion dollars;
        on Guantanamo, "a dictator was able to push the United States around." The day before, at Keene State College, to
        students: government starts depressions; the recognition of Russia a mistake; a low-yield atom bomb on North Vietnam
        ten years ago to defoliate the trees.'
      n: '[[w.white-making-of-the-president-1965]], 105–06. See [[cal.1964-03-04.goldwater-2]]. Names: Goldwater.'
      tags:
      - 'name:goldwater-barry-m'
      - 'state:nh'
      src:
        c: 2bb1fabb
        rows:
        - 'w.white-making-of-the-president-1965 105–06: all'
- add:
    entry:
      id: cal.1964-03-07.elections-1964
      when: 'Mar. 7'
      date: '1964-03-07'
      thread: elections-1964
      c: 'Hollis, N.H., the high school gymnasium, the Saturday before the primary, mid-morning. Rockefeller with his wife,
        she seated in the camera lights, on leadership and responsibility. Hollis votes Lodge 238, Rockefeller 120, Goldwater
        85.'
      n: '[[w.white-making-of-the-president-1965]], 108. Names: Rockefeller, Margaretta Rockefeller, Lodge, Goldwater.'
      tags:
