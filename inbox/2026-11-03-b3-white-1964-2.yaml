- add:
    entry:
      id: cal.1964-06-08.elections-1964-2
      when: 'June 8'
      date: '1964-06-08'
      thread: elections-1964
      c: 'Michigan. Nixon at breakfast with Romney on the party''s state; their memories of its terms disagree. Public appearances
        in upper Michigan; Muskegon in the evening, whence Rhodes''s plane takes him to Cleveland. Goldwater at the governors''
        banquet that evening, not asked to speak to them: "I sat there just waiting for them to ask me."'
      n: '[[w.white-making-of-the-president-1965]], 149–50. See [[cal.1964-06-07.states-and-cities-us]]. Names: Nixon, Romney,
        Rhodes, Goldwater.'
      tags:
      - 'name:nixon-richard-m'
      - 'name:romney-george-w'
      - 'name:rhodes-james-a'
      - 'name:goldwater-barry-m'
      - 'state:mi'
