      when: Dec.
      date: 1962-12
      thread: alabama-birmingham
      also:
      - king
      c: 'Atlanta, SCLC''s headquarters in the Masonic Lodge building, 334 Auburn Avenue. The Alabama Christian Movement''s
        leaders with King, the plans drawn after Thanksgiving: the protest at Birmingham to open just before Easter, after
        the city''s election, so as not to turn white anger into votes for Connor. In January King''s aides fly to Birmingham
        to reconnoiter; in February the recruiting of 300 volunteers.'
      n: '[[w.white-making-of-the-president-1965]], 168. See [[cal.1962-11-06.alabama-birmingham]]. Names: King. Check: the
        day.'
