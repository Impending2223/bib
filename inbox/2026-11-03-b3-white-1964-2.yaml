      when: 'June 9'
      date: '1964-06-09'
      thread: goldwater
      c: 'Washington. Goldwater, on the dispatches from Cleveland: "Nixon sounds more and more like Harold Stassen every day."'
      n: '[[w.white-making-of-the-president-1965]], 153. See [[cal.1964-06-09.elections-1964]]. Names: Goldwater, Nixon.'
      tags:
      - 'name:goldwater-barry-m'
      - 'name:nixon-richard-m'
      src:
        c: f33e58ad
        rows:
        - 'w.white-making-of-the-president-1965 153: all'
- add:
    entry:
      id: cal.1964-06-10.elections-1964
      when: 'June 10'
      date: '1964-06-10'
      thread: elections-1964
      c: 'Nixon flies from Cleveland to London.'
      n: '[[w.white-making-of-the-president-1965]], 153. See [[cal.1964-06-09.elections-1964]]. Names: Nixon. Check: Theodore
        White says he left for Baltimore the day before, then London "the next morning."'
      tags:
      - 'name:nixon-richard-m'
      src:
        c: e958244d
        rows:
        - 'w.white-making-of-the-president-1965 153: all'
- add:
    entry:
      id: cal.1964-06-10.elections-1964-2
      when: 'June 10'
      date: '1964-06-10'
      thread: elections-1964
      also:
      - republican-party
      c: 'Gettysburg. Thirty Pennsylvania legislators ask Eisenhower to lead a move against Goldwater, who imperils them at
        home. Eisenhower telephones Scranton that day with another reading of their misunderstanding. Scranton flies back
        from Cleveland to Harrisburg, and broods that night at Indiantown Gap.'
      n: '[[w.white-making-of-the-president-1965]], 154–56. Names: Eisenhower, Goldwater, Scranton.'
      tags:
      - 'name:eisenhower-dwight-d'
      - 'name:goldwater-barry-m'
      - 'name:scranton-william-w'
      - 'state:pa'
      src:
        c: 1c13e810
        rows:
        - 'w.white-making-of-the-president-1965 154–56: all'
- add:
    entry:
      id: cal.1964-06-11.elections-1964-2
      when: 'June 11'
      date: '1964-06-11'
      thread: elections-1964
      also:
      - republican-party
      c: 'Gettysburg, the morning. Milton Eisenhower and Moos with Eisenhower; Moos, staying an hour more: he will be held
        responsible for Goldwater''s nomination; let him urge Scranton in. Eisenhower to Scranton by telephone: what of Goldwater''s
        vote against cloture? Scranton: it made him sick. Eisenhower glad; let him say so in public; Moos to Harrisburg.'
      n: '[[w.white-making-of-the-president-1965]], 154–55. See [[cal.1964-06-11.elections-1964]]. Names: Milton Eisenhower,
        Eisenhower, Goldwater, Scranton.'
      tags:
      - 'name:eisenhower-milton-s'
      - 'name:eisenhower-dwight-d'
      - 'name:goldwater-barry-m'
      - 'name:scranton-william-w'
      src:
        c: e1d13ed7
        rows:
        - 'w.white-making-of-the-president-1965 154–55: all'
- add:
    entry:
      id: cal.1964-06.elections-1964-3
      when: June
      date: 1964-06
      thread: elections-1964
      c: 'After his resignation from Saigon, Lodge to Eisenhower to ask his help for Scranton; Eisenhower will not move in
        public. Rockefeller telephones Eisenhower to plead for Scranton: he must preserve his influence. "For what?"'
      n: '[[w.white-making-of-the-president-1965]], 158. See [[cal.1964-06-23.vietnam]]. Names: Lodge, Eisenhower, Scranton,
        Rockefeller. Check: the days.'
      tags:
      - 'name:lodge-henry-cabot'
      - 'name:eisenhower-dwight-d'
      - 'name:scranton-william-w'
      - 'name:rockefeller-nelson'
