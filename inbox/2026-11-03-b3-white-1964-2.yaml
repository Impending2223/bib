      when: 'July 13'
      date: '1964-07-13'
      thread: elections-1964
      c: 'The plaza before the Cow Palace: civil rights demonstrators ("Barry Goldwater—clap clap—must go!"), women for peace
        against the MLF, and a white bus with "Justice for Hoffa" and "Investigate Bobby Kennedy."'
      n: '[[w.white-making-of-the-president-1965]], 199. See [[cal.1964-07-10.elections-1964]]. Names: Goldwater.'
      tags:
      - 'name:goldwater-barry-m'
      src:
        c: 72cf543e
        rows:
