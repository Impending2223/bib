      thread: elections-1964
      c: 'California, the last weeks. Spencer-Roberts, for Rockefeller, mails "Who Do You Want in the Room with the H Bomb?"
        to all two million registered Republicans, at about $120,000. Telephone mills, some 1,200 paid callers, 600 in the
        largest at Los Angeles. Grindle and Goldberg''s Lodge volunteers for Rockefeller.'
      n: '[[w.white-making-of-the-president-1965]], 123–24. See [[cal.1964-03.elections-1964-2]]. Names: Rockefeller. Check:
