    item: '[[w.white-making-of-the-president-1965]], 146–47 (the Chieftain Room; Romney''s draft, dictated at dawn; Rockefeller
      applauds; Scranton in at half past ten, out early)'
    units: A-C
- cite:
    id: cal.1964-06-07.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 146–47 (Eisenhower''s call to Scranton''s suite that morning: no part
      of a "cabal" to stop Goldwater; the program at 12:30; "I don''t plan to go out to try and defeat Senator Goldwater")'
    units: A-C
- cite:
    id: cal.1964-06-08.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 149–53 (Nixon to Cleveland from Muskegon on Rhodes''s plane, about midnight;
      to bed at 2; Romney at 7 for breakfast)'
    units: A
- check:
    id: cal.1964-06-08.elections-1964
    text: 'Check: Theodore White, 149–53, puts Nixon''s arrival at Cleveland about midnight Monday, June 8, and his breakfast
      and talk with Romney on Tuesday, June 9.'
- cite:
    id: cal.1964-06-11.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 155–56 (about noon, at his office in Harrisburg; Eisenhower on the telephone:
      Goldwater''s vote; Mrs. Scranton at lunch; the staff summoned to the mansion that evening)'
    units: B
- cite:
    id: cal.1964-06-12.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 156–57 (John Hay Whitney''s plane; the AP''s count that weekend, 604
