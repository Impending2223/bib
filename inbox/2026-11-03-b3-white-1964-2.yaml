      date: '1964-06-06'
      thread: elections-1964
      c: 'Michigan, a press conference. Nixon: the race still open; no part of a Stop Goldwater movement; Goldwater to come
        closer to the center of the mainstream. Hatfield at Cleveland: the game over, the party to close ranks behind Goldwater.'
      n: '[[w.white-making-of-the-president-1965]], 145. Names: Nixon, Goldwater, Hatfield. Check: the day ("that weekend").'
      tags:
      - 'name:nixon-richard-m'
      - 'name:goldwater-barry-m'
