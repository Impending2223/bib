- add:
    entry:
      id: cal.1963-11-22.press-and-broadcasting
      when: 'Nov. 22–25'
      date: '1963-11-22'
      thread: press-and-broadcasting
      also:
      - assassination
      c: 'Television through the four days, the three networks'' coverage pooled. By 2:15 p.m. Friday the audience doubled;
        at Johnson''s arrival at Andrews, Md., 70 percent of New York''s sets on. By late Saturday 1,500 network men, 44 mobile
        cameras, 33 taping machines at Washington. Sunday, the Rotunda, 85 percent of television homes; Monday, the funeral,
        93 percent, the highest in television''s history.'
      n: '[[w.white-making-of-the-president-1965]], 13. See [[cal.1963-11-22.assassination]].'
      src:
        c: 3d670abf
        rows:
        - 'w.white-making-of-the-president-1965 13: all'
- add:
    entry:
      id: cal.1963-11-22.succession-4
      when: 'Nov. 22'
      date: '1963-11-22'
      thread: succession
      also:
      - labor
      c: 'Johnson, leaving the Executive Office Building for home, sets Reedy to list the labor leaders he must speak to in
        the next few days. That evening he telephones Funston of the New York Stock Exchange to thank him for closing the
        Big Board.'
      n: '[[w.white-making-of-the-president-1965]], 45. See [[cal.1963-11-22.succession]]. Names: Johnson, Reedy.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:reedy-george-e'
      src:
        c: a54121a8
        rows:
        - 'w.white-making-of-the-president-1965 45: all'
- add:
    entry:
      id: cal.1963-11-23.space
      when: 'Nov. 23'
      date: '1963-11-23'
      thread: space
      also:
      - soviet-union-un
      c: 'Stevenson with Johnson after the Cabinet meeting, on the policy he must state at the UN Tuesday on armed vehicles
        in orbit; the Pentagon of another view. Johnson, recalling his own speech of 1957 as a Senator, agrees with Stevenson:
        put the words in the President''s mouth.'
      n: '[[w.white-making-of-the-president-1965]], 47. See [[cal.1963-11-23.transition-and-staff]]. Names: Stevenson, Johnson.
        Check: the day of Stevenson''s statement at the UN.'
      tags:
      - 'name:stevenson-adlai-e'
      - 'name:johnson-lyndon-b'
      src:
        c: 992cab9c
        rows:
        - 'w.white-making-of-the-president-1965 47: all'
- add:
    entry:
      id: cal.1963-11-23.economy
      when: 'Nov. 23'
      date: '1963-11-23'
      thread: economy
      c: 'Gordon, Budget Director, to Johnson, a one-page memorandum, early afternoon: what the Bureau of the Budget does;
        still time to make the next year''s budget his own. By 6 p.m. Johnson telephones Gordon at home: an appointment for
        Sunday at 6.'
      n: '[[w.white-making-of-the-president-1965]], 48. Names: Gordon, Johnson.'
      tags:
      - 'name:gordon-kermit'
      - 'name:johnson-lyndon-b'
      src:
        c: bab69a93
        rows:
        - 'w.white-making-of-the-president-1965 48: all'
- add:
    entry:
      id: cal.1963-11-26.economy
      when: 'Nov. 26–Dec.'
      date: '1963-11-26'
      thread: economy
      also:
      - testing
      - defense
      c: 'The budget for fiscal 1965 begun with Johnson the morning after the burial: sessions of one to four hours a day
        for a month. Rover, the nuclear rocket, cut back. Enriched uranium cut 25 percent; three of Hanford''s nine plutonium
        reactors, one of Savannah River''s five, closed: "I''m not going to make atom bombs into a WPA project." The MURA
        accelerator, $170 million, refused; two more secretaries for Heller denied. The total $97.9 billion, about $2 billion
        off the first figures, most from Defense and the AEC.'
      n: '[[w.white-making-of-the-president-1965]], 49–50. See [[cal.1963-11-23.economy]]. Names: Johnson, Heller. Check:
        the day of each decision.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:heller-walter-w'
      src:
        c: fbb62800
        rows:
        - 'w.white-making-of-the-president-1965 49–50: all'
- add:
    entry:
      id: cal.1963-12.defense
      when: Dec.
      date: 1963-12
      thread: defense
      c: 'A legislative breakfast. Johnson raises the Boston Navy Yard, on McNamara''s list of economies; McCormack angry:
        Kennedy''s old district, weeks after his death. Johnson yields; the yard kept a year later, when other East Coast
        yards close.'
      n: '[[w.white-making-of-the-president-1965]], 50. See [[cal.1963-12-07.defense]]. Names: Johnson, McNamara, McCormack,
        Kennedy. Check: the day ("one morning in early December").'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:mcnamara-robert-s'
      - 'name:mccormack-john-w'
      - 'name:kennedy-john-f'
      - 'state:ma'
      - 'city:boston'
      src:
        c: caa4bc6d
        rows:
        - 'w.white-making-of-the-president-1965 50: all'
- add:
    entry:
      id: cal.1963-12-05.transition-and-staff
      when: 'Dec. 5'
      date: '1963-12-05'
      thread: transition-and-staff
      c: 'Afternoon, the President''s office: officials on the ceremony for the Medals of Freedom. Kennedy had planned forty-five
        minutes; Johnson, tired of being told what Kennedy wanted done, will give it ten minutes on television. Ball upset;
        Sorensen leaves the room.'
      n: '[[w.white-making-of-the-president-1965]], 57. Names: Johnson, Kennedy, Ball, Sorensen.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:kennedy-john-f'
      - 'name:ball-george-w'
      - 'name:sorensen-theodore-c'
      src:
        c: 3e25c232
        rows:
        - 'w.white-making-of-the-president-1965 57: all'
- add:
    entry:
      id: cal.1963-12-06.transition-and-staff
      when: 'Dec. 6'
      date: '1963-12-06'
      thread: transition-and-staff
      c: 'Johnson telephones Ball in the morning to apologize for his temper of the day before.'
      n: '[[w.white-making-of-the-president-1965]], 57. See [[cal.1963-12-05.transition-and-staff]]. Names: Johnson, Ball.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'name:ball-george-w'
      src:
        c: be9338a0
        rows:
        - 'w.white-making-of-the-president-1965 57: all'
- add:
    entry:
      id: cal.1963-12.press-and-broadcasting
      when: Dec.
      date: 1963-12
      thread: press-and-broadcasting
      c: 'Three New York broadcasting executives to lunch at the White House, at the President''s invitation; after lunch,
        summoned to swim with him in the pool, all four naked. By White''s account, a story told round Washington.'
      n: '[[w.white-making-of-the-president-1965]], 56. Names: Johnson. Check: the day and the executives'' names.'
      tags:
      - 'name:johnson-lyndon-b'
      src:
        c: 7c8fb52d
        rows:
        - 'w.white-making-of-the-president-1965 56: all'
