      thread: elections-1964
      c: 'Grindle and Goldberg, the Lodge campaign over, fly to California the morning after Oregon to put their people behind
        Rockefeller. Their first week there, $10,000 in cash delivered to them, returned to the donors, found at Denver.'
      n: '[[w.white-making-of-the-president-1965]], 139 n.2. See [[cal.1964-05-15.elections-1964]]. Names: Lodge, Rockefeller.'
