- add:
    entry:
      id: cal.1960-11.elections-1964
      when: Nov.
      date: 1960-11
      thread: elections-1964
      c: 'Tarrytown, N.Y., the playroom on the Rockefeller estate, within weeks of the election: the first survey by Rockefeller''s
        men of a campaign for 1964. Later meetings in the executive dining room of Radio City Music Hall, an informal strategy
        board.'
      n: '[[w.white-making-of-the-president-1965]], 73. Names: Rockefeller. Check: the day.'
      tags:
      - 'name:rockefeller-nelson'
      - 'state:ny'
