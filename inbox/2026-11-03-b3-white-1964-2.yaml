      when: 'May 13'
      date: '1964-05-13'
      thread: elections-1964
      c: 'Oregon, Rockefeller''s last week, alone in the State: "He Cares Enough to Come": the Gateway Shopping Center, 3:30
        p.m.; the University of Portland, 8 p.m. His "mainstream": the party must move with it. Price''s direct mail and a
        television barrage for the last forty-eight hours.'
      n: '[[w.white-making-of-the-president-1965]], 112–14. See [[cal.1964-04-11.elections-1964]]. Names: Rockefeller.'
      tags:
      - 'name:rockefeller-nelson'
      - 'state:or'
      src:
