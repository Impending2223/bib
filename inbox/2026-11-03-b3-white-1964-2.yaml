      when: Mar.
      date: 1964-03
      thread: press-and-broadcasting
      c: 'The LBJ Ranch, the end of March. Johnson''s guests from the press: driving them at 75, 80 or 90, a beer can in his
        hand, his hat over the speedometer. Their stories; the President feels his hospitality betrayed.'
      n: '[[w.white-making-of-the-president-1965]], 247. Names: Johnson. Check: the days.'
      tags:
      - 'name:johnson-lyndon-b'
      - 'state:tx'
      src:
        c: af61f67b
        rows:
        - 'w.white-making-of-the-president-1965 247: all'
- add:
    entry:
      id: cal.1964-04.press-and-broadcasting
      when: Apr.
      date: 1964-04
      thread: press-and-broadcasting
      c: 'The White House lawn. Johnson lifts his two beagles by the ears; dog lovers protest; the President: it does not
        hurt; the American Kennel Club disagrees.'
      n: '[[w.white-making-of-the-president-1965]], 247. Names: Johnson. Check: the day ("a few weeks" after the end of March).'
      tags:
      - 'name:johnson-lyndon-b'
      src:
        c: a94dd545
        rows:
        - 'w.white-making-of-the-president-1965 247: all'
- add:
    entry:
      id: cal.1964-04.press-and-broadcasting-2
      when: Apr.
      date: 1964-04
      thread: press-and-broadcasting
      c: 'Reston, in the *New York Times*, the end of April: in seven days Johnson has held two formal and two informal press
        conferences, made seven impromptu statements, addressed the AP, helped settle the railroad dispute, opened the World''s
        Fair and spoken at a rally in Chicago. "The White House is now more open than any residence in Washington."'
      n: '[[w.white-making-of-the-president-1965]], 248. To check: James Reston, *New York Times*, late April 1964 (quoted
        by [[w.white-making-of-the-president-1965]], 248). Names: Reston, Johnson. Check: the day.'
      tags:
      - 'name:reston-james'
      - 'name:johnson-lyndon-b'
      src:
        c: 7c10757a
        rows:
        - 'w.white-making-of-the-president-1965 248: all'
- add:
    entry:
      id: cal.1964-05-06.press-and-broadcasting
      when: 'May 6'
      date: '1964-05-06'
      thread: press-and-broadcasting
      c: 'The south lawn, 4:30 p.m. Johnson''s news conference for the reporters and their families, more than a thousand:
