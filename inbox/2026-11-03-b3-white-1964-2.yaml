- add:
    entry:
      id: cal.1964-05-30.elections-1964-3
      when: 'May 30'
      date: '1964-05-30'
      thread: elections-1964
      c: 'New York, a suite at the Waldorf-Astoria. Nixon''s old followers, Seaton, Finch, Guylay and half a dozen others,
        some hours on his course if Rockefeller wins California: an organization at once, a Washington office and Nixon clubs,
        or wait for a deadlocked convention. Nixon listens. The meeting known the day before.'
      n: '[[w.white-making-of-the-president-1965]], 141. Names: Nixon, Seaton, Finch, Rockefeller.'
      tags:
      - 'name:nixon-richard-m'
      - 'name:seaton-fred-a'
      - 'name:finch-robert-h'
      - 'name:rockefeller-nelson'
      - 'city:nyc'
