- cite:
    id: cal.1964-06-06.republican-party
    item: '[[w.white-making-of-the-president-1965]], 143 (Eisenhower''s call Friday evening; Scranton drives to Gettysburg,
      a rainy morning, an hour and a quarter at Eisenhower''s office; Eisenhower: "I''ll be watching")'
    units: A-C
- cite:
