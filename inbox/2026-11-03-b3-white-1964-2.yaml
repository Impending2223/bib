      when: 'Mar. 3'
      date: '1964-03-03'
      thread: elections-1964
      c: 'California. Rockefeller''s slate of 86 delegates announced, Hinman''s work since January: Kuchel at its head, Knight,
        Christopher, a Chandler and a Sutro, Firestone, Petersen, Jack Warner, Dart, James Mitchell. Rockefeller never above
        31 percent in a California poll to then.'
