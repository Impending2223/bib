      thread: republican-party
      c: 'Hershey, Pa., Eisenhower''s birthday party, his old Cabinet and political friends: Milton Eisenhower on the dais,
        the only speaker but the General. Friends sound out support for Milton round the country, with Eisenhower''s knowledge.'
