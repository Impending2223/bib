by: 'Claude (batch 3 resumed, b3-1964: Theodore H. White, The Making of the President 1964)'
ops:
- cite:
    id: cal.1963-11-12.elections-1964
    item: '[[w.white-making-of-the-president-1965]], 28–29 (Tuesday, Nov. 12, the Cabinet Room, late afternoon to 7:20; Dungan
      there; the South''s seats at the convention to be cut from 23 to 19 percent; Bailey to run the campaign from the National
      Committee, Smith its executive director)'
    units: 'A, C'
- cite:
    id: cal.1963-11-24.vietnam
    item: '[[w.white-making-of-the-president-1965]], 47 (nearly an hour; Johnson''s decision, "Press on, increase the pressure")'
    units: A
- check:
    id: cal.1963-11-24.vietnam
    text: 'Check: White, 47, names Taylor and Harriman among those present, not McNamara.'
- cite:
    id: cal.1963-11-29.civil-rights-bill
    item: '[[w.white-making-of-the-president-1965]], 44 (Wilkins the first, the Friday after the assassination; Whitney Young
      the Monday, King Tuesday, Farmer Wednesday)'
    units: A
- cite:
    id: cal.1963-11-27.succession
    item: '[[w.white-making-of-the-president-1965]], 46 (the drafters, Sorensen, Bundy, Galbraith, Fortas, Moyers, Busby;
      Johnson''s own line in pencil, Wednesday morning: "For thirty-two years, Capitol Hill has been my home")'
    units: A
