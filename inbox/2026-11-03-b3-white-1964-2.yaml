- add:
    entry:
      id: cal.1964-06-09.elections-1964
      when: 'June 9'
      date: '1964-06-09'
      thread: elections-1964
      also:
      - republican-party
      c: 'Cleveland. Romney''s day as a candidate. At the governors'' closed breakfast Scranton tells him of his work on a
        coalition, Brownell, Bliss and Hall for its mechanics; Rockefeller will not sit with Nixon, so Romney, Rhodes, Rockefeller
        and Scranton meet in Romney''s suite. Romney in Nixon''s suite, then to the press: Nixon and other governors have
        urged him to run. Brownell and Hall decline to manage it; by late afternoon, his advisers warning of the Detroit papers,
        Romney out, held to his pledge to Michigan. The governors'' ball that evening.'
      n: '[[w.white-making-of-the-president-1965]], 150–53 (Romney''s and Nixon''s accounts of their talk differ, 152). See
        [[cal.1964-06-08.elections-1964]]. Names: Romney, Scranton, Brownell, Bliss, Hall, Rockefeller, Nixon, Rhodes.'
      tags:
      - 'name:romney-george-w'
      - 'name:scranton-william-w'
      - 'name:brownell-herbert-jr'
      - 'name:bliss-ray-c'
