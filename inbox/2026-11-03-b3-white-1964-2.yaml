      c: 'Eisenhower in New York for an award at Columbia. The New York Republicans opposed to both Rockefeller and Goldwater
        plan to meet him that Saturday, Clay and Brownell among them, to have him lead them to a new candidate. After the
        assassination, no meeting.'
      n: '[[w.white-making-of-the-president-1965]], 71–72. Names: Eisenhower, Rockefeller, Goldwater, Clay, Brownell.'
