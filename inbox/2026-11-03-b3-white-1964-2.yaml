    item: '[[w.white-making-of-the-president-1965]], 199–202 (Eisenhower''s added lines on columnists and on the criminal
      with a switchblade; the platform read for ninety minutes; Rockefeller''s five minutes on extremism, "This is still a
      free country"; Romney''s compromise; White''s trailer, sixteen walkie-talkies and thirty telephone lines)'
    units: 'A, C-F'
