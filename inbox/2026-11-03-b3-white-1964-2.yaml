      date: '1964-07-17'
      thread: goldwater
      c: 'Evening, the Fairmont. White''s original band gives him a farewell party; some weep; some would still drop Goldwater
        for a candidate of their own. White kills the idea.'
      n: '[[w.white-making-of-the-president-1965]], 206. [[w.white-suite-3505]], 17–18 (the party). See [[cal.1964-07-17.republican-party]].
        Names: White, Goldwater.'
