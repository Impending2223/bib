      thread: goldwater
      c: 'Memorial Day. Riverside, Cal., the high school, shortly before noon, 1,200: prayer, the colors, the pledge. Goldwater:
        the dead "trying to warn us"; "Some wobbly thinkers think that laws will stop you from hating"; Washington to care
        for Mom and Pop "the ultimate destruction of the American family."'
      n: '[[w.white-making-of-the-president-1965]], 125–26. Names: Goldwater.'
