      when: 'May 29'
      date: '1964-05-29'
      thread: elections-1964
      c: 'San Francisco. Rockefeller, of the other Republicans out of the California fight: "It''s understandable. All of
        them are available for the nomination and hoping that lightning will strike. What other position could they take?"'
      n: '[[w.white-making-of-the-president-1965]], 139. Names: Rockefeller. Check: the day ("four days before the primary").'
