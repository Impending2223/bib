- add:
    entry:
      id: cal.1963-05-15.civil-rights-bill
      when: 'May 15'
      date: '1963-05-15'
      thread: civil-rights-bill
      c: 'Oberdorfer and Guthman back from Birmingham. Robert Kennedy takes them on a small Air Force jet to Asheville, N.C.,
        to talk undisturbed: what could a law do, what should it stress, schools, public accommodations, voting? The talks
        go on through the weekend with other officials; the results to the President the day of their return.'
      n: '[[w.white-making-of-the-president-1965]], 172. Names: Oberdorfer, Guthman, Robert Kennedy, John F. Kennedy. Check:
        the days.'
      tags:
      - 'name:oberdorfer-louis-f'
      - 'name:guthman-edwin-o'
      - 'name:kennedy-robert-f'
      - 'name:kennedy-john-f'
      src:
        c: a835941a
        rows:
        - 'w.white-making-of-the-president-1965 172: all'
- add:
    entry:
      id: cal.1964-04-20.civil-rights-organizations
      when: 'Apr. 20'
      date: '1964-04-20'
      thread: civil-rights-organizations
      c: 'Gracie Mansion. Wagner with his chief officials, four hours in secret, two days before the stall-in at the World''s
        Fair: the radicals'' demands, building halted until the trades are integrated, a rent strike, a timetable for the
        schools, a civilian police review board. His decision: protect the city.'
      n: '[[w.white-making-of-the-president-1965]], 187–89. See [[cal.1964-04-22.civil-rights-organizations-nyc]]. Names:
        Wagner.'
      tags:
      - 'name:wagner-robert-f-jr'
      - 'state:ny'
      - 'city:nyc'
      src:
        c: e8179b92
        rows:
        - 'w.white-making-of-the-president-1965 187–89: all'
