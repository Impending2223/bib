- add:
    entry:
      id: cal.1964-07-10.elections-1964-3
      when: 'July 10–12'
      date: '1964-07-10'
      thread: elections-1964
      also:
      - republican-party
      c: 'San Francisco, Friday to Sunday. The Eastern Republicans'' councils of war with Scranton: Rockefeller, Javits, Keating,
        Case, Lodge, Scott. On what ground to force a vote against the Platform Committee: Scott a national right-to-work
        law, others civil rights, Rockefeller extremism, Javits the President''s sole control of nuclear weapons. Scott: "I''m
        willing to knock myself out as John the Baptist, if only someone else will be Jesus Christ."'
      n: '[[w.white-making-of-the-president-1965]], 195–96. Names: Scranton, Rockefeller, Javits, Keating, Case, Lodge, Scott.'
      tags:
      - 'name:scranton-william-w'
      - 'name:rockefeller-nelson'
      - 'name:javits-jacob-k'
      - 'name:keating-kenneth-b'
      - 'name:case-clifford-p'
      - 'name:lodge-henry-cabot'
      - 'name:scott-hugh-d-jr'
      - 'city:san-francisco'
      src:
        c: 116ea1ea
        rows:
        - 'w.white-making-of-the-president-1965 195–96: all'
- add:
    entry:
      id: cal.1964-07-13.elections-1964-3
      when: 'July 13'
      date: '1964-07-13'
      thread: elections-1964
      also:
      - republican-party
      c: '10:15 a.m., Eisenhower''s suite. Gates, flown overnight from the East, and Moos come away with his apparent approval
        of Scranton''s resolution on control of nuclear weapons. At lunch word that he has repudiated it: an ex-President
        should not discuss the secret technology of defense in politics.'
      n: '[[w.white-making-of-the-president-1965]], 196–97. Names: Eisenhower, Gates, Scranton.'
      tags:
      - 'name:eisenhower-dwight-d'
      - 'name:gates-thomas-s-jr'
      - 'name:scranton-william-w'
      - 'city:san-francisco'
      src:
        c: da535545
        rows:
        - 'w.white-making-of-the-president-1965 196–97: all'
