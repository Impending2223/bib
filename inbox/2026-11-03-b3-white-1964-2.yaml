- add:
    entry:
      id: cal.1964-06.elections-1964-4
      when: June
      date: 1964-06
      thread: elections-1964
      also:
      - republican-party
      c: 'New York, The Recess club. Dewey, asked by Scranton, gathers Brownell, Clay, the Wall Street lawyers Peck, Eaton
        and Bromley, Gates, Dechert for McCabe, and Rockefeller''s Wells and Douglass, to sway delegates pledged to Goldwater
        through the regional law firms. The old names gone; within two weeks Dewey gives it up, and stays away from the convention,
        his first missed in twenty-eight years.'
      n: '[[w.white-making-of-the-president-1965]], 158. Names: Dewey, Scranton, Brownell, Clay, Gates. Check: the day.'
      tags:
      - 'name:dewey-thomas-e'
      - 'name:scranton-william-w'
      - 'name:brownell-herbert-jr'
      - 'name:clay-lucius-d'
      - 'name:gates-thomas-s-jr'
      - 'city:nyc'
      src:
        c: 967afe16
        rows:
        - 'w.white-making-of-the-president-1965 158: all'
- add:
    entry:
      id: cal.1964-07.elections-1964-9
      when: July
      date: 1964-07
      thread: elections-1964
      c: 'Scranton on the road after the Illinois caucus: Salt Lake City, Utah''s delegates locked to Goldwater; Seattle,
        22 of 24 unshakable; North Dakota''s State Fair, a balloon ("It runs on hot air, just like my campaign"); Eugene,
        Ore.: "I can conceive of nothing more terrible for the United States than to have a violent disruption over these
        matters, racial matters." 30,000 letters after one television appearance.'
      n: '[[w.white-making-of-the-president-1965]], 158–60. See [[cal.1964-06.elections-1964-state-conventions-3]]. Names:
        Scranton, Goldwater. Check: the days.'
      tags:
      - 'name:scranton-william-w'
      - 'name:goldwater-barry-m'
      src:
        c: 1487bd3f
        rows:
        - 'w.white-making-of-the-president-1965 158–60: all'
