      id: cal.1964-03.press-and-broadcasting
      when: Mar.
      date: 1964-03
      thread: press-and-broadcasting
      c: 'The *Wall Street Journal*, the first inquiry into the President''s personal fortune: how did a poor Texas boy on
        a government salary come by his millions? The press already on the stereo set, worth $542, Baker''s gift to him as
        Vice President.'
      n: '[[w.white-making-of-the-president-1965]], 247. See [[cal.1963-11-22.baker]]. Names: Johnson, Baker. Check: the day.'
      tags:
      - 'name:johnson-lyndon-b'
