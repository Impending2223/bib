      when: 'June 4'
      date: '1964-06-04'
      thread: elections-1964
      c: 'Scranton on television: he would accept the vice-presidential nomination under Goldwater. His gathering of Eastern
        Republicans at Harrisburg, set for that Thursday to review the Rockefeller victory expected, not held. He had refused
        Hugh Scott''s alliance with Rockefeller before the primary.'
      n: '[[w.white-making-of-the-president-1965]], 142–43. See [[cal.1964-06-02.elections-1964]]. Names: Scranton, Goldwater,
        Scott, Rockefeller. Check: the day of the broadcast ("two days" before the Saturday).'
      tags:
