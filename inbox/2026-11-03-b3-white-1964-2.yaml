      when: 'Mar. 11'
      date: '1964-03-11'
      thread: elections-1964
      c: 'Rockefeller, having had the New Hampshire returns at his Fifth Avenue apartment, leaves at 7 a.m. by jet for the
        West Coast, to show his men in Oregon and California he will fight on. Goldwater to skip Oregon for California; he
        weighs quitting, his advisers against it.'
      n: '[[w.white-making-of-the-president-1965]], 111–12. See [[cal.1964-03-10.elections-1964]]. Names: Rockefeller, Goldwater.
        Check: the day of Goldwater''s decision.'
      tags:
