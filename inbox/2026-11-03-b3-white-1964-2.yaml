- add:
    entry:
      id: cal.1963-08.goldwater-3
      when: Aug.
      date: 1963-08
      thread: goldwater
      c: 'Goldwater begins to explore the Presidency in earnest. Kitchel to Washington late in the month, campaign manager
        in name for the Senate race of 1964, to study the volunteers, screen them for extremists, and judge whether Goldwater
        could come within 5 percent of Kennedy; with Edward McCabe he catalogues Goldwater''s statements of ten years. The
        volunteers organized in thirty-two States.'
      n: '[[w.white-making-of-the-president-1965]], 94–95. See [[cal.1963-04-08.elections-1964]]. Names: Goldwater, Kitchel,
        McCabe, Kennedy. Check: the day.'
      tags:
      - 'name:goldwater-barry-m'
      - 'name:kitchel-denison'
      - 'name:mccabe-edward-a'
      - 'name:kennedy-john-f'
      src:
