      when: Feb.
      date: 1964-02
      thread: elections-1964
      c: 'New Hampshire, the Lodge write-in. A second mailing, "Pick Up Two More Votes," and a third with a sample ballot
        marked for the write-in; Grindle''s television film of Lodge''s career from Eisenhower''s 1960 clips, made for $750.
        The polls through February find Lodge rising.'
      n: '[[w.white-making-of-the-president-1965]], 109–10. See [[cal.1964-01.elections-1964-3]]. Names: Lodge. Check: the
        days.'
