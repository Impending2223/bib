      - republican-party
      c: 'Cleveland. Romney''s press conference just before Scranton goes on the air: "If his views deviate as indicated from
        the heritage of our Party, I will do everything within my power to keep him from becoming the Party''s Presidential
        candidate."'
      n: '[[w.white-making-of-the-president-1965]], 147. See [[cal.1964-06-07.republican-party]]. Names: Romney.'
      tags:
      - 'name:romney-george-w'
      - 'city:cleveland'
