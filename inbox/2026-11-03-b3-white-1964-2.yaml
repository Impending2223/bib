      c: 'Sunday. Goldwater''s men, holding back to the last weekend, take four and a half pages of the *Los Angeles Times*;
        Rockefeller''s one. Monday afternoon churches open for prayer meetings of the Goldwater volunteers, six at Los Angeles:
        9,500 volunteers in Los Angeles County for election day, 10,000 more in the south, 5,000 in the north.'
      n: '[[w.white-making-of-the-president-1965]], 126. Names: Goldwater, Rockefeller.'
      tags:
