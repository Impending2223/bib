      date: '1964-06-01'
      thread: elections-1964
      c: 'Los Angeles International Airport, the eve of the primary. A crowd of Goldwater''s supporters boos and heckles Rockefeller''s
        last appearance.'
      n: '[[w.white-making-of-the-president-1965]], 139 n.2. Names: Rockefeller, Goldwater. Check: the day ("the final evening").'
      tags:
      - 'name:rockefeller-nelson'
      - 'name:goldwater-barry-m'
      - 'city:los-angeles'
      src:
