- add:
    entry:
      id: cal.1964-07-10.elections-1964-2
      when: 'July 10'
      date: '1964-07-10'
      thread: elections-1964
      c: 'San Francisco, Scranton''s apartment, late. Rhodes, having released Ohio''s delegates, explains: Goldwater will
        be the Truman of 1964, the white "backlash" to carry Ohio; let Scranton run for Vice President. After he leaves, Scranton
        to his young men and allies: hopeless now, any may go; he and his wife will go on to defeat on the floor. None leaves.'
      n: '[[w.white-making-of-the-president-1965]], 195. See [[cal.1964-07-09.elections-1964]]. Names: Rhodes, Goldwater,
        Scranton. Check: the day.'
      tags:
      - 'name:rhodes-james-a'
      - 'name:goldwater-barry-m'
      - 'name:scranton-william-w'
      - 'city:san-francisco'
      src:
