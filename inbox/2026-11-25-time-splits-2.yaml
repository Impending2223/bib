      when: May 2
      date: '1965-05-02'
      place: washington
      thread: latin-america-dominican-republic
      c: 'Masterson, 2:14 a.m., replies: Plan A, 18 battalions and seven days, at "prohibitive" cost and risk; Plan B, 15 battalions and 24 hours, casualties unknown; Plan C, 12 battalions over three to five days, the fewest casualties.'
      n: '[[w.poole-joint-chiefs-of-staff-2012]], 141–42 ("at 0214 on 2 May"). Check: Poole''s clock for the hours ("1840", "0214", "1303") is not stated; Washington''s is assumed. See [[cal.1965-05-01.latin-america-dominican-republic]].'
      time: 1965-05-02T06:14Z
      time_zone: America/New_York
      tags: []
