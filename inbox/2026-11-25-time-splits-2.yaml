      place: washington
      thread: latin-america-dominican-republic
      follows:
      - cal.1965-04-28.latin-america-dominican-republic-2
      c: 'Johnson, after meeting the congressional leaders, tells the country on television, 8:40 p.m.: troops ordered ashore "to give protection to hundreds of Americans"; 400 Marines already landed.'
