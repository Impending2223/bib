- edit:
    id: cal.1965-09-19.china-leadership
    base: 19ad9cb8
    kind: correct
    set:
      c: 'Mao revises the Foreign Ministry''s draft note to India of Sept. 19, 4 a.m., sent up by Zhou Enlai: the draft demands that India dismantle by midnight of the 19th the fortifications on the Chinese side of the Sikkim border and straddling it. Mao: one day is too hurried, India cannot do it, it would win no sympathy; make it two days, or three, the 21st. The note changes it to midnight of the 22nd.{1}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 19, 1965. [[w.jianguo-yilai-mao-zedong]], XVIII, 151–152 (Sept. 19, 1965; Mao''s note, 4:30 a.m., on Zhou''s submission at 4 a.m. of the Foreign Ministry''s draft reply to India''s note of Sept. 17: one day is too hurried, India in fact cannot do it and it would win no sympathy among nations or the Indian people; two days, or three, to midnight of the 21st; note 2: the reply as sent says before midnight of the 22nd; the volume does not give the hour of delivery). Made public: 2013. To check: Indian Ministry of External Affairs, note to the Chinese embassy in India, Sept. 17, 1965 (no Indian crossing of the Sikkim border; works built Sept. 1962 on the Sikkim side not occupied; no objection to a joint inquiry or to the pulling down of any works found on the Tibetan side) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 151 n.1a); Chinese Foreign Ministry, reply note to the Indian embassy in China, Sept. 19, 1965 (all works to be pulled down before midnight of the 22nd) (cited by [[w.jianguo-yilai-mao-zedong]], XVIII, 152 n.2). Names: Mao Zedong, Zhou Enlai. Check: Sikkim: the nianpu says "the China-Sikkim boundary". Check: the note''s hand-over to the Indian embassy at 3:40 p.m. was in this line from the Mao nianpu (V, Sept. 19, 1965), whose Drive copy is a table of contents only; it is an act of cal.1965-09-19.china, not of Mao''s revision, and its hour is left to the audit.'
      src:
        rows:
        - 'w.zedong-mao-zedong-nianpu V, Sept. 19, 1965: 1'
        - 'w.jianguo-yilai-mao-zedong XVIII, 151–152: 1'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 151 n.1a: 1'
        - 'via w.jianguo-yilai-mao-zedong XVIII, 152 n.2: 1'
