      c: 'Santo Domingo, 7:27 p.m. Bennett to Washington, flash: with all government authority breaking down, "serious thought" to "armed intervention which would go beyond the mere protection of Americans and seek to establish order"; if the loyal forces fail, intervene "to prevent another Cuba"; more military units to be sent.'
