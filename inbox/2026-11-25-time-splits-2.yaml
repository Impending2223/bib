- edit:
    id: cal.1961-04-17.cuba-6
    base: a8205288
    kind: correct
    set:
      c: 'The ships ordered out to sea till dark, the Navy''s cover at the twelve-mile limit promised. Crutchfield, for five destroyers: "My heart is with you, but I cannot help you." Mutineers on the *Blagar* subdued; the *Atlántico* and *Caribe* run south, the *Caribe* turned by a destroyer''s shot across her bow. Tanks at Playa Larga by midafternoon; the brigade falls back on Blue Beach.'
      n: '[[w.jones-bay-of-pigs]], 105, 107–9. After the landing: [[w.jones-bay-of-pigs]], 105, 107–9. Split under R25b and R17: San Blas about 3 p.m. is an entry of its own. See [[cal.1961-04-17.cuba]].'
      src:
        rows:
        - 'w.jones-bay-of-pigs 105, 107–9: all'
- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-6
      when: Apr. 17
      date: '1961-04-17'
      place: san-blas
      thread: cuba-bay-of-pigs
      c: 'San Blas, about 3 p.m.: Castro''s militia open heavy fire on the brigade''s paratroopers; with artillery and aircraft they surround the outpost by late afternoon. Pepe sends a tank and a mortar force; the outpost retreats south of San Blas, its radios out. Eighty of the airborne battalion hold above San Blas through the night.'
      n: '[[w.jones-bay-of-pigs]], 105 ("About 3:00 p.m. local"). The hour is Jones''s, Havana''s clock. See [[cal.1961-04-17.cuba-6]].'
      time: 1961-04-17T20:00Z
      time_approx: true
      time_zone: America/Havana
      tags: []
