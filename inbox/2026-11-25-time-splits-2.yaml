      c: Selma. Judge Thomas of Mobile orders Clark to permit a limited march to the courthouse; Abernathy announces it to Brown Chapel as King finishes, four minutes after Baker takes down the barricades on Sylvan Street. Some 3,500 march at 5:08 p.m., a twenty-minute memorial on the courthouse steps.
      n: '[[w.branch-at-canaans-edge]], 107–08 ("at 5:08 p.m."; the order; the twenty-minute ceremony; hour read on the text layer, printed page against the running head). [[w.bernstein-guns-or-butter]], 231 (after a battle led by Collins and Baker). To check: Mobile LHM, Mar. 19, 1965, FBI file 44-12831-693; *Washington Post*, Mar. 16, 1965, at 1 (cited by [[w.branch-at-canaans-edge]], 108). See [[cal.1965-03-15.voting-rights-selma-2]]. Names: Daniel Thomas, Clark, Abernathy, Baker, King. Check: Bernstein, 231, gives a crowd of 2,000 on the courthouse steps.'
      time: 1965-03-15T23:08Z
      time_zone: America/Chicago
      tags:
