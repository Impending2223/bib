      c: 'Ankara. Ball with İnönü, after Erkin: İnönü, hurt by Johnson''s letter, receives him correctly; Ball tells him of the Papandreou talk, and that Makarios need not be in any negotiations; İnönü: "the first rays of light." Aside, the letter held "all the juridical thunderbolts"; the Foreign Office will have to answer them.'
