      c: Atlanta, Frazier's café. SNCC's executive committee, at an impasse toward midnight Saturday, votes to disapprove the march officially, its workers free to take part "as individuals," not as SNCC. It does not vote Lewis out of the chair. Lewis will go to Selma by morning.
      n: '[[w.branch-at-canaans-edge]], 40–42 (Friday''s debate "lasted well into Saturday night"; the vote "toward midnight"). To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965, and Mar. 6, 1965, SNCC Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). The range is Branch''s "toward midnight," Atlanta''s clock. See [[cal.1965-03-05.civil-rights-organizations]]. Names: John Lewis.'
      time_zone: America/New_York
      time_range:
      - 1965-03-07T03:00Z
      - 1965-03-07T05:00Z
      time_band: night
      range_basis: record
      tags:
