riors]], 147–48 (Wheeler and Abrams alone with Johnson on Mar. 26, almost two hours, before the Wise Men; Johnson: "We must have something"); [[w.zaroulis-who-spoke-up]], 159–60 (the week of March 25: the Wise Men briefed by Habib, DePuy and Carver, conferring with Rusk and Clifford; the next day their verdict, Bundy speaking for them; the bombing should be stopped, the war unwinnable); [[w.dallek-flawed-giant]], 512 (Mar. 26, Johnson with the Chiefs, by Clifford a "painfully sad speech": "We need more money in an election year, more taxes in an election year, more troops in an election year and more [budget] cuts in an election year. ... We have no support for the war"; not the causes Johnson names in H). [[w.longley-lbjs-1968]], 80–82 (Acheson''s terms; the briefings; the meeting with the President; "Who poisoned the well," by Clifford''s account); [[w.palermo-in-his-own-right]], 153 (H; the words as FRUS 1964–68, VI, doc. 156, prints them). [[w.ball-past-has-another-pattern]], 407–09 (the briefings; Bundy''s summary, Fortas and Murphy dissenting; Acheson, Dillon, Ridgway, Vance). Made public: FRUS 1964–68, VI (2002). [[w.cosmas-joint-chiefs-of-staff]], 169 (the briefings; the meeting; Acheson); [[w.drea-mcnamara-clifford-and-the-2011]], 189, 225 (the briefings of Mar. 25, DePuy''s among them; Johnson with Wheeler and Abrams; the majority for disengaging; some for stopping the bombing at once); [[w.dallek-flawed-giant]], 511–12 (the briefings; Johnson with the Chiefs; the majority for withdrawal, several against); [[w.herring-lbj-and-vietnam]], 162–63 (the Wise Men reconvened, most for moving toward extrication; Johnson with Wheeler and Abrams, Mar. 26). [FRUS 1964–68, VI, doc. 155](https://history.state.gov/historicaldocuments/frus1964-68v06/d155); [doc. 156](https://history.state.gov/historicaldocuments/frus1964-68v06/d156); [doc. 157](https://history.state.gov/historicaldocuments/frus1964-68v06/d157); [doc. 158](https://history.state.gov/historicaldocuments/frus1964-68v06/d158). Check: Taylor names Murphy, Fortas and himself as the three for the course of the strategy review, not Bradley ([[w.taylor-swords-and-plowshares]], 390). To check: [[w.isaacson-wise-men]]; [[w.schandler-unmaking-of-a-president]]; [[w.hoopes-limits-of-intervention]]; [[w.brinkley-dean-acheson]]; President''s Daily Diary, March 26, 1968, pp. 4–8, LBJ (cited by [[w.branch-at-canaans-edge]], 727); [[w.langguth-our-vietnam]], 488–90 (cited by [[w.branch-at-canaans-edge]], 727); Rusk,As J Saw It, p. 478 (cited by [[w.branch-at-canaans-edge]], 728); FRUS, *Vol. 6* (n.d.), 474 (cited by [[w.branch-at-canaans-edge]], 728); FRUS, *Vol. 6* (n.d.), 476 (cited by [[w.branch-at-canaans-edge]], 728). See [[cal.1968-02-27.vietnam]]. The hours of Mar. 26 are the Notes of Meeting''s: Johnson with Wheeler and Abrams, 10:30 a.m.–12:15 p.m. (doc. 156), and the group with the President, 1:15–3:05 p.m. (doc. 157). The first line gave 10:30 a.m. to 12:15 p.m. to the group; Drea, 189, and doc. 156 give that span to Wheeler and Abrams. Split under R25b and R17: the two meetings of Mar. 26 are entries of their own. Names: Rusk, Clifford, DePuy, Habib, Carver. Check: Ball (408) has Fortas and Murphy as the dissenters. Check: Clifford, 516, has Fortas with Bradley, Taylor and Murphy.'
