      id: cal.1964-06-23.mississippi-16
      when: June 23
      date: '1964-06-23'
      place: neshoba-county
      thread: mississippi
      c: 'Their burned station wagon found in a thicket near the Bogue Chitto bridge outside Philadelphia, by Choctaw Indians; FBI agent Proctor identifies it by the license tag. The agent sends word to the FBI by coded message: car found, no bodies.'
      n: '[[w.branch-pillar-of-fire]], 366–67 (the find "hours earlier" than Hoover''s call of 4:05 p.m., Tuesday; Branch has a Ford Fairlane for the station wagon). The President''s News Conference, [1963–64 Pub. Papers 802](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=886) (June 23, 1964). *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). See [[cal.1964-06-21.mississippi]]. Names: Price. Check: the hour of the find; Branch gives none.'
      tags:
      - name:price-cecil-r
      - ok:fields-time
