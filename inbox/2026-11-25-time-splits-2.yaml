- edit:
    id: cal.1965-03-05.civil-rights-organizations
    base: 6413dde2
    kind: correct
    set:
      c: 'Atlanta, Frazier''s café. SNCC''s executive committee meets from before 10 p.m. Friday, on King''s march from Selma.{1} Silas Norman, the Selma project''s director: SNCC should give logistics and medical help;{2} Forman, Cox and others for a course of SNCC''s own;{3} Lewis alone for the march: "If these people want to march, I''m going to march with them."{4}'
      n: '[[w.branch-at-canaans-edge]], 29–31, 40–42, 50. The time: the committee "convened before ten o''clock Friday night" (29). The time is the first day''s. To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965, and Mar. 6, 1965, SNCC Papers, King Library and Archives; John P. Lewis and Silas Norman, Jr., to King, Mar. 7, 1965, King Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). The debate runs past midnight and through Saturday (Branch, 40). Split under R25b and R17: the vote of Saturday toward midnight and the letter to King of Mar. 7 are entries of their own. See [[cal.1965-03-07.voting-rights]]. Names: Forman, John Lewis, Martin Luther King.'
      src:
        rows:
        - 'w.branch-at-canaans-edge 29–31: 1, 2'
        - 'w.branch-at-canaans-edge 40–42: 1, 2, 3, 4'
        - 'w.branch-at-canaans-edge 50: 4'
        - 'via w.branch-at-canaans-edge 29 n.basement-of-fraziers: 1, 2'
        - 'via w.branch-at-canaans-edge 40 n.julian-bond-proposed: 2, 3'
        - 'via w.branch-at-canaans-edge 42 n.voted-toward-midnight: 3, 4'
- add:
    entry:
      id: cal.1965-03-06.civil-rights-organizations
      when: Mar. 6
      date: '1965-03-06'
      place: atlanta
      thread: civil-rights-organizations
