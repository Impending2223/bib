      - city:selma
- edit:
    id: cal.1965-03-21.alabama-birmingham
    base: c0b9ef2a
    kind: correct
    set:
      c: Birmingham.{1} Bombs of dynamite, timed for noon, found at Our Lady of the Universe Catholic Church, at a mortuary of A. G. Gaston's, and at the home of Arthur Shores;{2} an Army demolition team from Fort McClellan disarms them, one of fifty-eight sticks.{3}
      n: '[[w.branch-at-canaans-edge]], 140, 145. The time: the first box found at "early Sunday mass" (140). To check: Moyers to Johnson, Mar. 21, 1965, and "Bombing Devices Found in Birmingham," 10:45 p.m., Mar. 21, 1965, WH Confidential, box 56, LBJ Library; [*New York Times*, Mar. 22, 1965](https://timesmachine.nytimes.com/timesmachine/1965/03/22/issue.html), at 1, 27 (cited by [[w.branch-at-canaans-edge]], 140, 145). Split under R25b and R17: Moyers''s report to Johnson that night is an entry of its own, and the two more bombs of Mar. 22 stay with the first. See [[cal.1963-09-15.alabama]]. Names: Moyers, Johnson.'
      src:
        rows:
        - 'w.branch-at-canaans-edge 140: 1'
        - 'w.branch-at-canaans-edge 145: 2'
        - 'via w.branch-at-canaans-edge 140 n.our-lady-of: 1'
        - 'via w.branch-at-canaans-edge 140 n.dashed-up-the: 1'
        - 'via w.branch-at-canaans-edge 145 n.bill-moyers-notified: 2'
