    kind: correct
    set:
      c: Chaney, Goodman and Schwerner, of CORE's Meridian project, missing in Neshoba County after a visit to the burned Mount Zion church at Longdale.{1} Deputy Sheriff Price arrests them on the outskirts of Philadelphia and holds them in the jail.{2}
      n: 'The President''s News Conference, [1963–64 Pub. Papers 802](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=886) (June 23, 1964). *United States v. Price*, [383 U.S. 787](https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf) (1966). [[w.dittmer-local-people]], 246–51 (247: the arrest, the jail, the release at about 10:30); [[w.branch-pillar-of-fire]], 361–64; [[w.taking-charge]], 425. The Court''s opinion has Price detain the three June 21 and release them "in the dark of that night" (383 U.S. at 790); Dittmer, 247, the same, the release "about 10:30 that night"; the June 23 the line set beside the release is kept with the station wagon. The time is the arrest, "shortly after 3:00 P.M." (Dittmer, 247), Mississippi''s clock in 1964, daylight or standard, in doubt: the range covers both. To check: [[w.taking-charge-2001]]; [[w.mars-witness-in-philadelphia]]; [[w.cagin-we-are-not-afraid]]; [[w.gage-g-man]]; President''s Daily Diary, June 23, 1964 ([National Archives Catalog](https://catalog.archives.gov/id/192440)) (cited by [[w.dittmer-local-people]], 250 n.16). The time is the arrest, "shortly after 3:00 P.M." (Dittmer, 247). Split under R25b and R17: the release that night and the finding of the station wagon are entries of their own; Hoover''s call, the parents and Dulles are entries of June 23 already. See [[cal.1964-06-14.mississippi]]. Names: Chaney, Goodman, Schwerner, Price, Johnson, Dulles. Check: the station wagon''s day, June 23 (no source read gives it).'
      src:
        rows:
        - 'https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=886: all'
        - 'https://tile.loc.gov/storage-services/service/ll/usrep/usrep383/usrep383787/usrep383787.pdf: all'
        - 'w.dittmer-local-people 247: 1, 2'
        - 'w.branch-pillar-of-fire 361–64: 1, 2'
        - 'w.taking-charge 425: 1'
      tags:
      - name:chaney-james-e
      - name:goodman-andrew
      - name:schwerner-michael
      - name:price-cecil-r
- add:
