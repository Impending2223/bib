- edit:
    id: cal.1965-03-05.civil-rights-organizations
    base: 6413dde2
    kind: correct
    set:
      c: 'Atlanta, Frazier''s café. SNCC''s executive committee meets from before 10 p.m. Friday, on King''s march from Selma.{1} Silas Norman, the Selma project''s director: SNCC should give logistics and medical help;{2} Forman, Cox and others for a course of SNCC''s own;{3} Lewis alone for the march: "If these people want to march, I''m going to march with them."{4}'
      n: '[[w.branch-at-canaans-edge]], 29–31, 40–42, 50. The time: the committee "convened before ten o''clock Friday night" (29). The time is the first day''s. To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965, and Mar. 6, 1965, SNCC Papers, King Library and Archives; John P. Lewis and Silas Norman, Jr., to King, Mar. 7, 1965, King Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). The debate runs past midnight and through Saturday (Branch, 40). Split under R25b and R17: the vote of Saturday toward midnight and the letter to King of Mar. 7 are entries of their own. See [[cal.1965-03-07.voting-rights]]. Names: Forman, John Lewis, Martin Luther King.'
      src:
        rows:
        - 'w.branch-at-canaans-edge 29–31: 1, 2'
        - 'w.branch-at-canaans-edge 40–42: 1, 2, 3, 4'
        - 'w.branch-at-canaans-edge 50: 4'
        - 'via w.branch-at-canaans-edge 29 n.basement-of-fraziers: 1, 2'
        - 'via w.branch-at-canaans-edge 40 n.julian-bond-proposed: 2, 3'
        - 'via w.branch-at-canaans-edge 42 n.voted-toward-midnight: 3, 4'
- add:
    entry:
      id: cal.1965-03-06.civil-rights-organizations
      when: Mar. 6
      date: '1965-03-06'
      place: atlanta
      thread: civil-rights-organizations
      also:
      - voting-rights-selma
      c: Atlanta, Frazier's café. SNCC's executive committee, at an impasse toward midnight Saturday, votes to disapprove the march officially, its workers free to take part "as individuals," not as SNCC. It does not vote Lewis out of the chair. Lewis will go to Selma by morning.
      n: '[[w.branch-at-canaans-edge]], 40–42 (Friday''s debate "lasted well into Saturday night"; the vote "toward midnight"). To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965, and Mar. 6, 1965, SNCC Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). The range is Branch''s "toward midnight," Atlanta''s clock. See [[cal.1965-03-05.civil-rights-organizations]]. Names: John Lewis.'
      time_zone: America/New_York
      time_range:
      - 1965-03-07T03:00Z
      - 1965-03-07T05:00Z
      time_band: night
      range_basis: record
      tags:
      - name:lewis-john
- add:
    entry:
      id: cal.1965-03-07.civil-rights-organizations
      when: Mar. 7
      date: '1965-03-07'
      place: atlanta
      thread: civil-rights-organizations
      also:
      - voting-rights-selma
      c: 'Lewis and Norman to King for SNCC''s executive committee: "the objectives of the march do not justify the danger and the resources involved."'
      n: '[[w.branch-at-canaans-edge]], 50 (the footnote: the SNCC letter "mailed to King that day"; a stand-in signed Lewis''s name). To check: John P. Lewis and Silas Norman, Jr., to King, Mar. 7, 1965, King Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31, 40–42). See [[cal.1965-03-05.civil-rights-organizations]]. Names: John Lewis, Martin Luther King. Check: who signed; Branch has a stand-in sign Lewis''s name.'
      tags:
      - name:lewis-john
      - name:king-martin-luther-jr
