      n: '[[w.zedong-mao-zedong-nianpu]], VI, Sept. 16, 1967. [[w.macfarquhar-maos-last-revolution]], 217 (in September, on a brief visit, Mao tries to get Zhejiang''s rival groups to unite; his call goes unheeded); [[w.deng-xiaoping-nianpu-1904]], III, 1939 (Sept. 16, 1967; Mao Zedong 毛泽东, on his train stopped at Hangzhou 杭州, in talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (footnote 1: Nan, political commissar of the 20th Army and head of Zhejiang''s military control committee; Chen, political commissar of the Air Force''s 5th Army and deputy head), mentions that Deng Xiaoping 邓小平 and Liu Shaoqi 刘少奇 still differ); [[w.mao-zedong-zhuan]], VI, ch. 76 n.69 (Sept. 16 Mao leaves Shanghai by train for Peking by way of Hangzhou, Nanchang, Changsha, Wuhan and Zhengzhou, talking with the heads of each province on the way; in Zhejiang, to Nan Ping and Chen Liyun, n.69: Long Qian and Ruan Xianbang have errors, are to be helped, not beaten to death, cadres are not landlords, no kneeling, jet planes, house searches, tall hats, placards; ''I cannot make out why one factory, one school divides in two, both sides have backers''; ''left in form, right in fact'', the first year of the movement past, the second three months gone, July, Aug., Sept., ''by the Spring Festival, I think, perhaps an outline''). [[w.yang-jisheng-tiandi-fanfu]], I, 547 (Mao leaves Shanghai on Sept. 16, to return to Peking by Hangzhou, Nanchang, Changsha, Wuhan and Zhengzhou). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 76). Check: the book (217) gives no day for Mao''s call to Zhejiang''s factions and names no source for it. To check: Mao Zedong 毛泽东, talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (record 谈话记录), Sept. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.69); [[w.zedong-jianguo-yilai-mao-zedong]], XII, 385–390 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 548 n.88). Split under R25b and R17: the talk on the train at noon is an entry of its own, with the words of Mao''s talk. Names: Mao Zedong.'
