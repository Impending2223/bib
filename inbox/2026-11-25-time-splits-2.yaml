      c: 'Rusk calls in the Soviet chargé, Kornienko, 11:30 a.m.: the convoy held over dismounting is within the limits for not dismounting; the tailgates of the vehicles are under the height the procedures set; the procedures were given the Soviet military Oct. 29. Kornienko: no information; the Soviet requirements unchanged. Rusk asks him to inform Moscow and Dobrynin.'
      n: '[FRUS 1961–63, XV, doc. 234](https://history.state.gov/historicaldocuments/frus1961-63v15/d234) (the Department to Bonn, 1:47 p.m.: "at 11:30 am Washington time"). See [[cal.1963-11-04.berlin-and-vienna]]. Names: Rusk, Kornienko.'
      time: 1963-11-04T16:30Z
      time_zone: America/New_York
      tags:
      - name:rusk-dean
      - name:kornienko-georgi-m
- add:
    entry:
      id: cal.1963-11-05.berlin-and-vienna
      when: Nov. 5
      date: '1963-11-05'
      place: washington
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: 'Rusk to Dobrynin, 6:10 p.m., after Dobrynin''s call on the Under Secretary about West Berlin and the test ban treaty: any reply to Rusk''s representations of Nov. 4? None; Dobrynin disclaims knowledge, and notes the convoy had sleeping bags and rations. Rusk: astonished, after the procedures passed to the Soviet military Oct. 29.'
      n: '[FRUS 1961–63, XV, doc. 236](https://history.state.gov/historicaldocuments/frus1961-63v15/d236) (the Department to Bonn, 8:15 p.m.; n. 1: "The meeting with Dobrynin took place at 6:10 p.m."). See [[cal.1963-11-04.berlin-and-vienna]]. Names: Rusk, Dobrynin.'
      time: 1963-11-05T23:10Z
      time_zone: America/New_York
      tags:
      - name:rusk-dean
      - name:dobrynin-anatoly
- add:
    entry:
      id: cal.1963-11-05.berlin-and-vienna-2
      when: Nov. 5
      date: '1963-11-05'
      place: berlin
      thread: berlin-and-vienna
      also:
      - soviet-union
      c: The Soviets release the American convoy at the autobahn, no troops dismounting and no tailgate lowered, at about the hour of Rusk's meeting with Dobrynin. A protest note to the Soviet Union follows from each of the three Western powers.
      n: '[FRUS 1961–63, XV, doc. 236](https://history.state.gov/historicaldocuments/frus1961-63v15/d236), n. 2 ("At about the same time that Rusk and Dobrynin were meeting"; Telegram 641 from Berlin, Nov. 6, Department of State, Central Files, POL 38–10, not read). The hour is the note''s "about the same time," 6:10 p.m. Washington''s clock. See [[cal.1963-11-04.berlin-and-vienna]].'
      time: 1963-11-05T23:10Z
      time_approx: true
      time_zone: America/New_York
      tags: []
