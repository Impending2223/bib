- edit:
    id: cal.1965-03-15.voting-rights-selma-2
    base: 55c44b80
    kind: correct
    set:
      c: 'Selma, Brown Chapel. The memorial service for Reeb, Bishop Hines, Walter Reuther, Archbishop Iakovos and members of Congress among the speakers.{1} King, late from Judge Johnson''s hearing: "His crime was that he dared to live his faith."{2} King stays in Alabama, declining the President''s invitation to the joint session.{4}'
      n: '[[w.branch-at-canaans-edge]], 104–08; [[w.kotz-judgment-days]], 307–08, 312 (King kept in Alabama by Reeb''s memorial service; he watches the address with Lewis at the Jacksons'', in tears); [[w.bernstein-guns-or-butter]], 231 (after a battle led by Collins and Baker; King preaches). Check: Bernstein, 231, gives a crowd of 2,000 on the courthouse steps. To check: Mobile LHM, Mar. 19, 1965, FBI file 44-12831-693; *Washington Post*, Mar. 16, 1965, at 1 (cited by [[w.branch-at-canaans-edge]], 108). The service was set for two o''clock (Branch, 105): the time is that. Split under R25b and R17: the order for a march and the march at 5:08 p.m. are an entry of their own. See [[cal.1965-03-14.voting-rights]]. Names: Reeb, Reuther, Martin Luther King, Frank Johnson, Clark, Iakovos.'
      src:
        rows:
        - 'w.branch-at-canaans-edge 104–08: 1, 2, 4'
        - 'via w.branch-at-canaans-edge 108 n.clark-received-mortifying: 2'
        - 'via w.branch-at-canaans-edge 108 n.a-march-of: 2'
        - 'w.kotz-judgment-days 307–08, 312: 4'
        - 'w.bernstein-guns-or-butter 231: 1'
      time: 1965-03-15T20:00Z
      time_approx: true
- add:
    entry:
