      c: Birmingham. Robert Kennedy by telephone to Patterson, who says he cannot guarantee "this bunch of rabble-rousers" safe passage; to Greyhound, whose drivers will not drive.{1}
      n: '[[w.branch-parting-the-waters]], 426–29; [[w.schlesinger-robert-kennedy-and-his]], 295 (Seigenthaler sent to Birmingham; the airlines'' bomb threats; he takes the riders by plane to New Orleans, the hour not given). To check: *Jet*, June 1, 1961, at 20–21; [*New York Times*, May 15, 1961](https://timesmachine.nytimes.com/timesmachine/1961/05/15/issue.html), at 1; Birmingham police report of the mass meeting of May 15, 1961, Eugene T. Connor Papers, box 9, folder 24, Birmingham Public Library (cited by [[w.branch-parting-the-waters]], 426 n.3); Peck, *Freedom Ride*, 101; [[w.farmer-lay-bare-the-heart]], 203; [[w.guthman-we-band-of-brothers]], 167–68; [[w.meier-core]], 173 (cited by [[w.branch-parting-the-waters]], 426 n.3); John Seigenthaler, recorded interview by Ronald J. Grele, Feb. 22, 1966, 305–09, JFK Oral History Program (cited by [[w.schlesinger-robert-kennedy-and-his]], 295 n.48). See [[cal.1961-05-04.freedom-rides]]. Split under R25b and R17: the 10 a.m. call to the riders and the flight near midnight are entries of their own, the call first and the flight after. Names: Robert Kennedy, Patterson.'
