      c: The riders give up the buses for the airport; Seigenthaler, sent by Kennedy, goes with them. Held there into the night by bomb threats, they fly to New Orleans, the plane lifting off near midnight.
      n: '[[w.branch-parting-the-waters]], 428–29 ("the plane lifted off the ground near midnight"); [[w.schlesinger-robert-kennedy-and-his]], 295 (Seigenthaler takes the riders by plane to New Orleans, the hour not given). The hour is Branch''s "near midnight," Birmingham''s clock: Alabama kept standard time, 6 a.m. UTC May 16. See [[cal.1961-05-15.freedom-rides]]. Names: Seigenthaler.'
