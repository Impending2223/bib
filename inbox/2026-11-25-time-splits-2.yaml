      c: 'At noon, on the train, Mao talks with the 20th Army''s commissar Nan Ping and the Air Force 5th Army''s commissar Chen Liyun, Yang Chengwu, Zhang Chunqiao, Yu Lijin and Wang Dongxing present. The movement''s first year gone, the second three months in, July to September; ten more provinces to settle, and by the Spring Festival the country will have an outline. Factions: two sides in one factory, one school, one family; each has a backer. The army has had two styles: democratic, with officers and men close; and the other, scolding, aloof, no democracy.'
