      c: 'Robert Kennedy telephones the riders at Shuttlesworth''s house, 10 a.m.: Simeon Booker of *Jet* first, then Shuttlesworth. Riders "trapped"; Shuttlesworth asks police protection to Montgomery; Kennedy: one bus, then Connor''s police at the station and to the city line. Shuttlesworth: to the Alabama line.'
      n: '[[w.branch-parting-the-waters]], 426–27 (the call "at ten o''clock that morning"; the Attorney General asking for Booker; the escort Connor concedes through the FBI; Shuttlesworth: the escort in Anniston was to the city line, "where the bus burned"). See [[cal.1961-05-15.freedom-rides]]. Names: Robert Kennedy, Shuttlesworth, Connor.'
