- check:
    id: cal.1964-05-25.republican-party-congress
    text: 'Check: the minutes (Wolff and Ritchie, 976–84) record meetings May 19, 20, 22 and 25, the fourth, and no consensus vote on May 25; Dirksen expected the amendments to go in as a substitute, with a cloture petition the following week (982).'
