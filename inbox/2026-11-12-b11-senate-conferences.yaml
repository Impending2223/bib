- cite:
    id: cal.1964-05-25.republican-party-congress
    item: '[[w.wolff-minutes-of-the-senate]], 981–84 (the Conference, Monday, May 25, 1964, 10:05 a.m. to 12:18 p.m. and 2:50 to 4:55 p.m., twenty present at each; the redraft of Titles I–VI and Title VII; Dirksen: the amendments to go in as a substitute, a cloture petition hoped for the following week; Fong on the Bishop Estate; Cotton against the gradation to twenty-five employees; no vote on a consensus recorded)'
    units: '?'
