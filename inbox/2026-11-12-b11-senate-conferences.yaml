    entry:
      id: cal.1962-06-07.congress
      when: June 7
      date: '1962-06-07'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats on the tax bill, 3:30 p.m., the Majority Leader''s office, thirty-seven attending. Kerr: not enough votes in committee to report it with withholding; he will offer exemption certificates for those under $5,000 (over 65, $7,500). Robertson, Young, Gruening and Long (La.) for postponement; Clark and Kerr for the bill. Mansfield: on one vote twenty-six Democrats were absent; the decision is the President''s.'
      n: '[[w.ritchie-minutes-of-the-senate]], 603–05. Names: Kerr, Clark, Mansfield, Long.'
      tags:
      - name:kerr-robert-s
      - name:clark-joseph-s
