    entry:
      id: cal.1962-04-03.republican-party-congress
      when: Apr. 3
      date: '1962-04-03'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, on the Dirksen–Mansfield compromise on the U.N. bond bill: a $100 million loan, matched over $25 million by others. Hickenlooper: the Aiken–Hickenlooper substitute would draw 32 to 42 votes. Dirksen: it gets the administration "off the hook." Tower, Miller, Goldwater, Bush and others: capitulation to the White House; Javits: it takes the party "off the hook for wrecking the United Nations." Teeple introduced as Policy Committee staff director.'
      n: '[[w.wolff-minutes-of-the-senate]], 910–12 (9:40 to 10:39 a.m.). Names: Dirksen, Hickenlooper, Tower, Miller, Goldwater, Javits.'
      tags:
      - name:dirksen-everett
