      when: Jan. 3
      date: '1961-01-03'
      thread: republican-party-congress
      c: 'Senate Republican conference organizes the 87th Congress, thirty-three present: Saltonstall chairman, Young secretary, Bridges Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Boggs and Miller introduced. Morton: research on the Cabinet nominees, the Policy Committee the focal point. Dirksen: no course of blind opposition, but modify where necessary.'
      n: '[[w.wolff-minutes-of-the-senate]], 867–71 (the elections, 868–69; Morton, 870; Dirksen, 871). Names: Saltonstall, Young, Bridges, Dirksen, Kuchel, Morton.'
