      id: cal.1964-05-19.republican-party-congress-2
      when: May 19
      date: '1964-05-19'
      thread: republican-party-congress
      c: 'Senate Republican conference, 9:24 a.m. to 12:09 p.m., twenty-seven present, with Judiciary staff, on the civil rights bill. Cooper moves, and the chair puts without objection, that Dirksen explain the whole bill before the parts are debated; he takes Titles I to XI in turn, Title VII left to another conference. Aiken: a middle ground is needed. Saltonstall: not binding.'
      n: '[[w.wolff-minutes-of-the-senate]], 976–78. See [[cal.1964-05-19.civil-rights-bill]]. Names: Dirksen, Cooper, Aiken, Saltonstall.'
