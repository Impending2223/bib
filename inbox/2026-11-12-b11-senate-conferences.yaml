    item: '[[w.wolff-minutes-of-the-senate]], 975–76 (the Senate Republican Conference, Thursday, Apr. 9, 1964, 9:27 a.m. to noon, twenty-nine present; Dirksen explaining forty-odd amendments to Title VII; Margaret Chase Smith asking about striking the word "sex"; the chair: not binding; not the words to the press)'
    units: '?'
