      id: cal.1961-01-13.republican-party-congress
      when: Jan. 13
      date: '1961-01-13'
      thread: republican-party-congress
      c: Senate Republican conference, twenty present, 10:13 to 10:45 a.m., on committee assignments. Schoeppel moves the Committee on Committees' recommendations; approved, Javits voting "Present." Javits calls the assignments a "rubber stamp" and moves that the committee consult the leadership to suspend seniority; held over under the rules. Goldwater and Allott also against seniority.
      n: '[[w.wolff-minutes-of-the-senate]], 880–83 (the meeting; Javits''s motion, 881–82). Names: Javits, Goldwater, Allott.'
