    text: 'Check: the minutes (Ritchie, 577–80) have Mansfield say the proposal was his alone, not Johnson''s, and carry the 46–17 vote on Holland''s substitute, not on Mansfield''s motion; the pages 581–83 cited above are Jan. 4''s, the minutes of Jan. 3 are 577–80, with Johnson''s remarks to the conference from the Johnson Library (579–80).'
- cite:
    id: cal.1961-01-05.republican-party-congress
    item: '[[w.wolff-minutes-of-the-senate]], 872–75 (the Senate Republican Conference, Thursday, Jan. 5, 1961, 10:07 a.m., thirty-two present; Mundt''s resolution praising Goldwater as chairman of the Senatorial Campaign Committee, unanimous with applause, 873; Javits on the 1962 campaign and Goldwater''s reply, 873–74, no words given; Saltonstall''s nominations, Goldwater chairman of the Campaign Committee, approved unanimously, 874, 877–78; not the press remarks, Goldwater''s pledge or Javits''s dropping his opposition)'
    units: A
- variant:
    id: cal.1961-01-05.republican-party-congress
    unit: D
    witness: w.wolff-minutes-of-the-senate
    reads: Goldwater named chairman of the Campaign Committee in the chairman's nominations, approved unanimously; thirty-two Senators present
    at: 874, 877–78
- cite:
    id: cal.1962-06-07.republican-party-congress
    item: '[[w.wolff-minutes-of-the-senate]], 922–24 (the Senate Republican Conference, Thursday, June 7, 1962, 9:08 a.m., twenty-eight present; the Joint Committee''s report, copies handed out that morning; Hickenlooper, its cochairman, asking that no changes be made; the resolution that the conference "approves the issuance of this report as a declaration of Republican principles and policy representing the consensus of Republicans in the Senate," adopted on a yea and nay vote with one negative, Young of North Dakota, over the word "massive" on land retirement; Cooper, having voted for it, changing to "nay" over its foreign policy language; Javits''s questions; Kuchel: the press would say the party was veering to the right; not the House conference)'
    units: A
- cite:
    id: cal.1963-01-14.republican-party-congress
    item: '[[w.wolff-minutes-of-the-senate]], 949–52 (the Senate Republican Conference, Monday, Jan. 14, 1963, 9:55 a.m., thirty present; Saltonstall''s nominees for the conference committees confirmed on Allott''s motion with no voice in the negative; the list attached names Goldwater to the Policy Committee, 951; no word of leaving him off or of Javits)'
    units: '?'
- variant:
    id: cal.1963-01-14.republican-party-congress
    unit: A
    witness: w.wolff-minutes-of-the-senate
    reads: Barry Goldwater a member of the Policy Committee in the nominees confirmed, no voice in the negative
    at: 949–51
- check:
    id: cal.1963-01-14.republican-party-congress
    text: 'Check: the minutes (Wolff and Ritchie, 949–51) have the conference confirm the chairman''s nominees, Goldwater among the Policy Committee''s members, with no negative voice; nothing there of leaving him off, or of putting him back a few days later.'
- cite:
    id: cal.1963-06-05.republican-party-congress
    item: '[[w.wolff-minutes-of-the-senate]], 963–69 (the Senate Republican Conference, headed ''Wednesday, June 6, 1963,'' sitting 9:41 to 11:30 a.m., twenty-five present, and 4:10 to 7:10 p.m., twenty-six; Javits on the "historical significance" of the conference; Dirksen''s "consensus" taken paragraph by paragraph, amended and adopted on the yeas and nays; Goldwater''s motion for no recorded vote withdrawn; Hickenlooper against having called the meeting; the draft dated June 5 and the text ''as adopted'' differ, 968–69)'
    units: '?'
- variant:
    id: cal.1963-06-05.republican-party-congress
    unit: B
    witness: w.wolff-minutes-of-the-senate
    reads: we as Republican members of the Senate will support any appropriate request by the President for such legislative authority as may be required to deal with the problems in the civil rights field which presently confront the nation (the text as adopted; the quoted words are the June 5 draft's)
    at: 968–69
- check:
    id: cal.1963-06-05.republican-party-congress
    text: 'Check: the minutes (Wolff and Ritchie, 963–69) head the meeting ''Wednesday, June 6, 1963'' (June 6 was a Thursday), while the May 27 minutes call it for ''Wednesday, June 5'' (962) and the draft consensus is dated June 5; the two sittings run 9:41 to 11:30 a.m. and 4:10 to 7:10 p.m., under five hours, not seven; the quoted words are the draft''s, the text as adopted reads otherwise (968–69).'
