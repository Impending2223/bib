      id: cal.1960-01-20.congress
      when: Jan. 20
      date: '1960-01-20'
      thread: congress
      also:
      - democratic-party
      - school-aid
      c: Senate Democrats in conference on S. 8, the emergency federal aid to education bill, 10:40 a.m. to 12:25 p.m.; thirty-eight answer the roll. Hill and McNamara explain the bill, reported 11 to 2. Clark will offer two amendments, funds for college construction and teachers' salaries. Holland counts twenty-six present of sixty-five Democrats and opposes the bill. No vote.
      n: '[[w.ritchie-minutes-of-the-senate]], 544–55 (the roll, 544; the bill''s committee vote, 548; Clark''s amendments, 550–51; Holland''s count, 552; the close, 555). Names: Hill, McNamara, Clark, Holland.'
