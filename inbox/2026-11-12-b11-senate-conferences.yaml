    entry:
      id: cal.1960-01-06.republican-party-congress
      when: Jan. 6
      date: '1960-01-06'
      thread: republican-party-congress
      c: 'Senate Republican conference, Saltonstall chairman, thirty-four present, 2:38 to 4:07 p.m.; condolences for Langer and for Thurmond''s wife; the floor leader''s and the whip''s seats made permanent. Dirksen on the session: aid to education the likely first bill, civil rights about Feb. 15, a minimum wage bill early. Javits asks for a conference before the civil rights bill; Dirksen reports the Revenue Service ruling that a sitting Senator''s contributions are tax free.'
      n: '[[w.wolff-minutes-of-the-senate]], 846–50 (the meeting; Dirksen''s report, 847–50; exhibits, 850–52). Names: Saltonstall, Dirksen, Javits, Thurmond.'
      tags:
      - name:saltonstall-leverett
      - name:dirksen-everett
      - name:javits-jacob-k
      - name:thurmond-strom
- add:
    entry:
      id: cal.1960-01-18.republican-party-congress
      when: Jan. 18
      date: '1960-01-18'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, 11:07 to 11:55 a.m. Schoeppel moves, and the conference unanimously approves, the Committee on Committees'' assignments for the vacancies after Langer''s death. Javits''s resolution for a special committee on assignments, any change to take effect next session, adopted. Bridges, Policy Committee chairman, on the Democrats'' proposal to rename it a Steering Committee: he prefers the name, but the Democrats have the votes if they insist; he is made a committee of one to confer with Hayden and Johnson.'
      n: '[[w.wolff-minutes-of-the-senate]], 856–58 (the assignments, 856–57; the resolution, 857; Bridges, 858; exhibits, 859–60). Names: Javits, Hayden, Johnson, Bridges.'
      tags:
