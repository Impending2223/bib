- add:
    entry:
      id: cal.1961-05-16.republican-party-congress
      when: May 16
      date: '1961-05-16'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-nine present, on federal aid to education and Kennedy''s four reorganization plans. Dirksen: the customary resolutions drawn, two introduced; he asks that action on Swidler''s nomination to the Power Commission wait until he learns how the President means to displace Chairman Kuykendall. Goldwater to offer amendments on parochial schools and tax credits; Javits and Cooper on the formula; Case on a 1 percent withholding returned to the States; Allott: the 1960 platform covered construction only.'
      n: '[[w.wolff-minutes-of-the-senate]], 884–87 (the meeting). Names: Dirksen, Goldwater, Javits, Cooper, Allott, Kennedy, Swidler.'
      tags:
      - name:dirksen-everett
