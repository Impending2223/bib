    entry:
      id: cal.1963-04-02.republican-party-congress
      when: Apr. 2
      date: '1963-04-02'
      thread: republican-party-congress
      c: Senate Republican conference on the mass transit bill, 9:35 to 10:50 a.m., Dirksen presiding for the absent Saltonstall. Thirteen Senators give views; amendments to come; labor's opposition may be compromised; the big issues taxes and economy.
      n: '[[w.wolff-minutes-of-the-senate]], 960–61. Names: Dirksen, Saltonstall.'
      tags:
      - name:dirksen-everett
      - name:saltonstall-leverett
- add:
    entry:
      id: cal.1963-05-27.republican-party-congress
      when: May 27
      date: '1963-05-27'
      thread: republican-party-congress
      c: Senate Republican conference, 3:08 to 4:12 p.m., twenty-two present, on the debt limit. Williams, of Finance, recommends support for the committee's amendment fixing $309 billion for the whole fiscal year; the consensus is to support it. Javits urges a position for the Attorney General's power to sue in civil rights cases, "Part 3"; Saltonstall calls a conference on civil rights for June 5.
      n: '[[w.wolff-minutes-of-the-senate]], 961–63 (the call for ''Wednesday, June 5,'' 962). Names: Williams, Javits, Saltonstall.'
      tags:
      - name:williams-john-j
      - name:javits-jacob-k
      - name:saltonstall-leverett
- add:
    entry:
      id: cal.1963-06-19.republican-party-congress
      when: June 19
      date: '1963-06-19'
      thread: republican-party-congress
      c: 'Senate Republican conference, 2:45 to 4:02 p.m., twenty-five present, on the administration''s civil rights bills. Dirksen: Mansfield introduced two, a package and one on Title II; he will introduce a third with all but Title II, which he cannot sponsor. Javits: that leaves the party in a "twilight zone." Dirksen cautions against a Republican bill of their own.'
      n: '[[w.wolff-minutes-of-the-senate]], 969–71. Names: Dirksen, Mansfield, Javits.'
      tags:
      - name:dirksen-everett
      - name:mansfield-mike
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1963-08-26.republican-party-congress
      when: Aug. 26
      date: '1963-08-26'
      thread: republican-party-congress
      c: Senate Republican conference, 2:05 to 2:32 p.m., thirty present, on S.J. Res. 102 to settle the railroad labor dispute. Cotton, ranking on Commerce, reviews the bill; Goldwater to offer an amendment against "featherbedding"; Javits one on seizure. Explanatory; no conclusions.
      n: '[[w.wolff-minutes-of-the-senate]], 971–72. Names: Cotton, Goldwater, Javits.'
      tags:
      - name:cotton-norris-h
      - name:goldwater-barry-m
      - name:javits-jacob-k
