- add:
    entry:
      id: cal.1964-07-27.congress
      when: July 27
      date: '1964-07-27'
      thread: congress
      also:
      - democratic-party
      - baker
      c: 'Senate Democrats, 11:10 to 11:55 a.m., forty-nine present, on the Senate disclosure resolution, S. Res. 337. Mansfield: recommit it with instructions to report it back with a joint resolution for a commission on ethics covering every branch; "I think it is about time that Senators stopped tearing the Senate down." Pastore, Gruening, Holland, Russell, Ervin, Jordan and Cannon object to singling out the Senate; Clark defends disclosure; Mansfield says the Senate would be "in the soup" if it did not act.'
      n: '[[w.ritchie-minutes-of-the-senate]], 642–48 (Mansfield''s statement, 643–46; the discussion, 646–48). Names: Mansfield, Pastore, Gruening, Holland, Russell, Ervin, Cannon, Clark.'
      tags:
      - name:mansfield-mike
      - name:pastore-john-o
