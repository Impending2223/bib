- add:
    entry:
      id: cal.1961-01-04.congress-2
      when: Jan. 4
      date: '1961-01-04'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Mansfield in the chair, on Gore''s resolution that Policy and Steering Committee vacancies be filled by election. Mansfield''s resolution supersedes it: he names the members, after consulting the president pro tempore, whip and conference secretary, "as representative as possible of the geographic and philosophic composition of the Democratic Conference," subject to confirmation by the conference; voice vote. Pastore''s resolution that the Steering Committee assign Democrats to committees, voice vote. Proxmire takes the leaders'' assurance of periodic caucuses in place of a vote.'
      n: '[[w.ritchie-minutes-of-the-senate]], 581–83 (10:10 a.m. to 12:58 p.m.; the resolution as printed, 583). Names: Mansfield, Gore, Pastore, Proxmire.'
      tags:
      - name:mansfield-mike
      - name:gore-albert-sr
      - name:pastore-john-o
      - name:proxmire-william
