    entry:
      id: cal.1962-08-08.republican-party-congress
      when: Aug. 8
      date: '1962-08-08'
      thread: republican-party-congress
      c: 'Senate Republican conference, held with the Policy Committee''s meeting, 1:10 to 1:12 p.m.; McCone, the CIA director, among those present. Carlson''s recommendations after Dworshak''s death adopted unanimously: Javits to Appropriations, Murphy to Banking and Currency, Jordan of Idaho to Interior and Labor. Jordan to the Committee on Committees.'
      n: '[[w.wolff-minutes-of-the-senate]], 940–41. Names: McCone, Carlson, Javits, Murphy.'
      tags:
      - name:mccone-john-a
