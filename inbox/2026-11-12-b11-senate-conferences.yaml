    entry:
      id: cal.1961-07-11.republican-party-congress
      when: July 11
      date: '1961-07-11'
      thread: republican-party-congress
      c: 'Senate Republican conference, thirty present, 9:37 to 10:33 a.m. On Schoeppel''s motion the conference assigns Fong, Tower and Dirksen to committees; on the leadership''s recommendation it adds Tower to the Policy Committee, sixteen members for the 87th. Dirksen on his visit with Halleck to Eisenhower July 10: Eisenhower not very communicative on Berlin; on Laos, the best judgment to protect Viet-Nam and Thailand. Javits proposes a task force of Senators and outsiders on a Republican Berlin policy; Kuchel suggests nuclear testing.'
      n: '[[w.wolff-minutes-of-the-senate]], 888–92 (the assignments, 888–89; Tower and the Policy Committee, 889–90; Dirksen''s report, 890–91; Javits and Kuchel, 891–92); the minutes'' account of Dirksen, not his words. Names: Fong, Tower, Dirksen, Halleck, Eisenhower, Javits, Kuchel.'
