    entry:
      id: cal.1961-01-03.congress-2
      when: Jan. 3
      date: '1961-01-03'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats elect their officers by acclamation: Mansfield majority leader, nominated by Hayden; Humphrey whip, nominated by McNamara; Smathers secretary of the conference; Hayden president pro tempore. Johnson tells the conference he will take the oath for his new term and resign at once.'
      n: '[[w.ritchie-minutes-of-the-senate]], 577–79 (the elections; Johnson''s remarks as supplied from the Johnson Library, 579–80, ''it is my intention to take the oath of office for my new term and then to resign immediately after taking that oath''). See [[cal.1961-01-03.congress]]. Names: Mansfield, Hayden, Humphrey, McNamara, Smathers, Johnson.'
      tags:
