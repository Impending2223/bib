      id: cal.1962-02-01.republican-party-congress
      when: Feb. 1
      date: '1962-02-01'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-two present, 9:27 to 10 a.m. Carlson, acting for Schoeppel, reports assignments for the vacancies after the deaths of Bridges and Schoeppel; approved. Aiken says a member has waited for Commerce and Judiciary; Williams: stop assigning a third committee until every Senator has two major ones.'
      n: '[[w.wolff-minutes-of-the-senate]], 903–05. Names: Carlson, Aiken, Williams.'
      tags:
      - name:carlson-frank
