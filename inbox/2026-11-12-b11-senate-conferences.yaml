    entry:
      id: cal.1960-03-30.republican-party-congress
      when: Mar. 30
      date: '1960-03-30'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-five present, 10:15 to 11:30 a.m., on the Judiciary Committee''s civil rights bill, H.R. 8601. Dirksen: four of thirty-two amendments adopted, Lausche''s to Section 1 and Kefauver''s on parties at referee hearings among them; he asks a solid party vote to strike Section 1. A second cloture petition may be needed, he and Johnson to file it; he fears an extra session if no bill passes before the July adjournment.'
      n: '[[w.wolff-minutes-of-the-senate]], 862–64 (Dirksen''s report, 863–64). Names: Dirksen, Johnson.'
      tags:
      - name:dirksen-everett
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-06-30.republican-party-congress
      when: June 30
      date: '1960-06-30'
      thread: republican-party-congress
      c: 'Senate Republican conference, 9:22 to 10:55 a.m., twenty-four present, called by Dirksen. The recess: no party position; each on his own. Aiken reports no interest in the committee on assignments by seniority; closed for the session. On Eisenhower''s veto of the pay bill Dirksen says the President is right but the Senate will not sustain it; he wants the vote put over to August. The conference concludes the vote cannot be deferred.'
      n: '[[w.wolff-minutes-of-the-senate]], 864–66 (the recess, 865; the veto, 866). Names: Dirksen, Aiken, Eisenhower.'
      tags:
      - name:dirksen-everett
      - name:aiken-george-d
      - name:eisenhower-dwight-d
