      when: July 18
      date: '1962-07-18'
      thread: republican-party-congress
      c: 'Senate Republican conference, held with the Policy Committee''s meeting, thirty-three present, 1:25 to 1:28 p.m. Carlson''s recommendations after Francis Case''s death adopted: Clifford Case to Armed Services, Prouty to Commerce, Murphy and Pearson to Public Works, Bottum to Interior and to Rules. Bottum to the Committee on Committees.'
      n: '[[w.wolff-minutes-of-the-senate]], 938–39. Names: Carlson, Case, Murphy, Pearson.'
      tags:
