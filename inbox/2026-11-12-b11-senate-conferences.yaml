- add:
    entry:
      id: cal.1964-08-03.congress
      when: Aug. 3
      date: '1964-08-03'
      thread: congress
      also:
      - democratic-party
      - medicare
      - foreign-aid
      c: 'Senate Democrats, 11:13 to 11:35 a.m., twenty-six named present. Mansfield: foreign aid the week''s business; the Senate might adjourn by Aug. 24. Morse against reconvening after the convention, which would give the Republicans "a political sounding board." Magnuson wants a Democratic Medicare amendment ready against Javits''s; Mansfield: it will not be brought up unless a member offers it.'
      n: '[[w.ritchie-minutes-of-the-senate]], 648–51 (the list of bills cleared, 649). Names: Mansfield, Morse, Magnuson, Javits.'
      tags:
      - name:mansfield-mike
      - name:morse-wayne
      - name:magnuson-warren-g
      - name:javits-jacob-k
- add:
    entry:
      id: cal.1964-08-10.congress
      when: Aug. 10
      date: '1964-08-10'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats, 11:05 to 11:25 a.m. The Steering Committee''s assignments announced: McIntyre to Armed Services, Brewster to Commerce, Salinger to Government Operations and Public Works. Neuberger objects that she was passed over for Commerce. Mansfield lists the Southeast Asia Resolution among the bills cleared to the President; hopes to adjourn Aug. 22, else return Aug. 31. Long (Mo.) says he must review his support of the Administration and the Leadership; Symington backs him.'
      n: '[[w.ritchie-minutes-of-the-senate]], 651–55 (the assignments and the schedule, 652–53; Neuberger, 653; Long and Symington, 654). Names: Mansfield, Neuberger, Salinger, Symington.'
      tags:
      - name:mansfield-mike
      - name:neuberger-maurine-b
      - name:salinger-pierre
      - name:symington-william-s
- add:
    entry:
      id: cal.1964-08-17.congress
      when: Aug. 17
      date: '1964-08-17'
      thread: congress
      also:
      - democratic-party
      - foreign-aid
      c: 'Senate Democrats, 11:12 to 11:25 a.m., twenty-six named present. Mansfield: hopes of adjourning before the convention "have been reapportioned"; the Senate to sit through Friday evening, Aug. 21, and return Aug. 31. Dirksen''s reapportionment amendment is on the foreign aid bill and "is not going to go away"; a compromise worked up with the Deputy Attorney General has failed.'
      n: '[[w.ritchie-minutes-of-the-senate]], 655–56 (Mansfield''s statement, 655–56; ''the last meeting this session under the Neuberger proposal''). Names: Mansfield, Dirksen.'
      tags:
      - name:mansfield-mike
      - name:dirksen-everett
