    entry:
      id: cal.1960-02-15.congress
      when: Feb. 15
      date: '1960-02-15'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats in conference at the freshmen''s request, Muskie speaking for them; Johnson reads a statement on the session''s problems. Douglas leads on the Joint Economic Committee''s report: growth 2.3 percent a year, 1953–59, against 4.6 to 4.7 percent, 1947–53; unemployment 4 percent. Against lifting the 4¼ percent interest ceiling: it would be "unilateral disarmament." Long (La.): the Republicans "want to saddle us with high interest rates for the next twenty years." Adjourned 12:11 p.m.'
      n: '[[w.ritchie-minutes-of-the-senate]], 557–71 (the meeting, 557–60; Johnson''s statement, 561–63; Douglas, 558–59; Long, 560; the interest-rate papers attached, 564–71). Names: Johnson, Muskie, Douglas, Long.'
      tags:
      - name:johnson-lyndon-b
      - name:muskie-edmund-s
      - name:douglas-paul-h
      - name:long-russell-b
- add:
    entry:
      id: cal.1960-02-18.congress
      when: Feb. 18
      date: '1960-02-18'
      thread: congress
      also:
      - democratic-party
      - foreign-aid
      c: 'Senate Democrats in conference, 10:54 a.m. adjournment. Clark on the budget: "We cannot be the party of irresponsible spenders." Johnson tells of an unpublicized White House meeting with Eisenhower on his $4.175 billion foreign aid request; Symington: the President "is acting like a spoiled child on defense." Douglas, asked by Johnson, says stand firm on the 4¼ percent ceiling.'
      n: '[[w.ritchie-minutes-of-the-senate]], 572–75 (the meeting; Johnson''s account of the White House meeting, 573; Symington''s words, 573; Douglas, 575). Names: Clark, Johnson, Eisenhower, Symington, Douglas.'
      tags:
