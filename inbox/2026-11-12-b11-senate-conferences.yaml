    entry:
      id: cal.1962-05-02.republican-party-congress
      when: May 2
      date: '1962-05-02'
      thread: republican-party-congress
      c: 'Senate Republican conference on Medicare, at Javits''s request, expository, 9:45 to 10:55 a.m.; John Guy Miller present as Dirksen''s expert. Javits compares the five or six plans and analyzes his S. 2664; the fears: community responsibility for hospitals, benefits demanded each election year, the Social Security program. The Policy Committee''s comparison sheet is kept out of the Record. Dirksen: the cloture petition is at the desk.'
      n: '[[w.wolff-minutes-of-the-senate]], 912–13 (the sheet attached, 914–21). Names: Javits, Dirksen.'
      tags:
      - name:javits-jacob-k
      - name:dirksen-everett
- add:
    entry:
      id: cal.1962-06-25.republican-party-congress
      when: June 25
      date: '1962-06-25'
      thread: republican-party-congress
      c: 'Senate Republican conference, eighteen present, at Dirksen''s request, on the session ahead: appropriations, the debt ceiling, tax and sugar extensions as "must" bills. Javits and Bush to offer substitutes to Anderson''s Medicare amendment. Dirksen would let the tax cut ride and make the President ask for it; Hickenlooper: the administration should be told not to go over $300 billion. No conclusions.'
      n: '[[w.wolff-minutes-of-the-senate]], 931–33 (9:48 to 11:13 a.m.). Names: Dirksen, Javits, Bush, Anderson, Hickenlooper.'
      tags:
      - name:dirksen-everett
      - name:javits-jacob-k
