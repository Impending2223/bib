    entry:
      id: cal.1963-01-08.republican-party-congress
      when: Jan. 8
      date: '1963-01-08'
      thread: republican-party-congress
      c: 'Senate Republican conference organizes the 88th Congress, thirty-two present, 2:35 to 3:55 p.m.: Saltonstall chairman, Young secretary, Hickenlooper Policy Committee chairman, Dirksen floor leader, Kuchel whip, each by unanimous ballot; Mechem, Dominick and Simpson introduced. Aiken named the Republican candidate for president pro tempore. A resolution praising Goldwater, retiring as campaign committee chairman, unanimous. Dirksen on the session: fiscal bills, the U.N., Cuba, the Common Market, missiles; Tuesday–Thursday sessions from 9:30 considered.'
      n: '[[w.wolff-minutes-of-the-senate]], 943–48 (the elections, 944–45; Goldwater''s resolution, 945–46; Dirksen''s report, 946–47). Names: Saltonstall, Young, Hickenlooper, Dirksen, Kuchel, Mechem, Dominick, Simpson, Aiken, Goldwater.'
