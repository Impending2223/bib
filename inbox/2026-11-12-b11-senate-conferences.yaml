    entry:
      id: cal.1960-01-07.congress
      when: Jan. 7
      date: '1960-01-07'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Johnson in the chair, 3:30 to 5:12 p.m. Clark moves that the conference meet every two weeks or on the request of fifteen members; Russell: it "would destroy the Conference system after the second week." Clark withdraws it. Gore moves that Policy Committee vacancies be filled by the conference, and withdraws it until the next meeting. Hayden: Rayburn wants to adjourn July 2.'
      n: '[[w.ritchie-minutes-of-the-senate]], 515–22 (the meeting; the motions; Russell''s words, 517; Hayden''s report, 522; no vote taken). Names: Johnson, Clark, Russell, Gore, Hayden, Rayburn.'
