      when: Feb. 19
      date: '1963-02-19'
      thread: republican-party-congress
      c: 'Senate Republican conference, twenty-one present, 11:20 to 11:43 a.m., confirms the Committee on Committees'' assignments, Williams acting for Carlson. Dirksen: the Democrats refused the Appropriations ratio on Russell''s objection. He reports the White House briefing the evening before; asked "what is down the road," the President says only "We do the best we can." Keating calls the Democrats'' action a slap at his colleague.'
      n: '[[w.wolff-minutes-of-the-senate]], 958–60. Names: Williams, Carlson, Dirksen, Russell, Keating, Kennedy.'
      tags:
      - name:williams-john-j
