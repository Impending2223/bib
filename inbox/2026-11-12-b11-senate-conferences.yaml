- cite:
    id: cal.1964-05-19.civil-rights-bill
    item: '[[w.ritchie-minutes-of-the-senate]], 634–38 (the Democrats, 10:10 to 11:54 a.m., forty-seven named present; Mansfield praises Humphrey, 635–36; questions to Humphrey from Lausche, Symington, Byrd (W.Va.), Nelson, Douglas, Pastore, Holland, Ervin and Gore, 636–37; Clark not satisfied with Title VII but for a compromise, 636; Ervin wants a week; Whalen''s forty-nine is not the minutes'' count)'
    units: C
- cite:
    id: cal.1964-05-19.civil-rights-bill
    item: '[[w.wolff-minutes-of-the-senate]], 976–78 (the Republicans, 9:24 a.m. to 12:09 p.m., twenty-seven present; Dirksen explains the bill; Aiken for a middle ground, Hickenlooper for the whole picture first; not "a gargantuan thing")'
    units: '?'
