- add:
    entry:
      id: cal.1964-01-08.congress
      when: Jan. 8
      date: '1964-01-08'
      thread: congress
      also:
      - democratic-party
      - civil-rights-bill
      c: 'Senate Democrats, the session''s first meeting, 4:15 to 4:48 p.m., forty present. Mansfield reports his meetings with the President: appropriations, civil rights, the tax bill on the floor by Feb. 1, health care for the aged. Recesses set, Feb. 11–17 and Mar. 26–30 among them; no important business May 25–26, the Kennedy birthday dinner. On civil rights he asks members to consider what "an acrid and excessively prolonged debate" will do "to the President, to the Senate, and to the party." Fulbright''s three-day week discussed; no action.'
      n: '[[w.ritchie-minutes-of-the-senate]], 625–29 (the meeting; Mansfield''s statement, 626–27; the agenda attached, 628–29). Names: Mansfield, Fulbright, Johnson.'
      tags:
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-01-28.congress
      when: Jan. 28
      date: '1964-01-28'
      thread: congress
      also:
      - democratic-party
      - economy
      c: 'Senate Democrats, 2:45 to 4:15 p.m., forty-four present, on the campaign and the tax bill. Mansfield: no independent fund raising in New York or Washington; Inouye to coordinate speaking dates. Magnuson: $15,000 for each candidate, a dinner Mar. 19 at the Armory, Farley treasurer. Long (La.) floor manager of the tax bill, 153 committee amendments; Gore: "a rich man''s bill." Mansfield to call it up Thursday.'
      n: '[[w.ritchie-minutes-of-the-senate]], 629–34 (the campaign, 629–32; the tax bill, 632–34). Names: Mansfield, Inouye, Magnuson, Long, Gore.'
      tags:
      - name:mansfield-mike
      - name:inouye-daniel-k
      - name:magnuson-warren-g
      - name:long-russell-b
      - name:gore-albert-sr
- add:
    entry:
      id: cal.1964-05-19.congress
      when: May 19
      date: '1964-05-19'
      thread: congress
      also:
      - democratic-party
      - civil-rights-bill
      c: 'Senate Democrats, 10:10 to 11:54 a.m., the old Supreme Court chamber, forty-seven present, on the civil rights bill''s revision. Mansfield: "Today is the 60th day of debate on the Civil Rights bill"; cloture the key question; Humphrey managed the bill "day in and day out." Humphrey explains the package, Titles II, V and VII changed. Clark not satisfied with Title VII but for a compromise; Ervin wants a week to study the bill.'
      n: '[[w.ritchie-minutes-of-the-senate]], 634–38 (Mansfield''s statement, 635–36; Humphrey and the questions, 636–37; the agenda, 637–38). Names: Mansfield, Humphrey, Clark, Ervin.'
      tags:
      - name:mansfield-mike
      - name:humphrey-hubert-h
      - name:clark-joseph-s
      - name:ervin-sam-j-jr
- add:
    entry:
      id: cal.1964-07-20.congress
      when: July 20
      date: '1964-07-20'
      thread: congress
      also:
      - democratic-party
      - medicare
      c: 'Senate Democrats, 10:10 to 11:02 a.m., forty-two present, on what must pass before adjournment. Mansfield: the work could be done in the month before the Democratic convention; "if we meet on Saturdays we must have a quorum and we must conduct business." Dodd asks for the drug and gun bills. Holland against Medicare this session; Russell: it and the Social Security increases cannot both pass; Gore for a strong stand; Long (La.): the House will not accept it. Neuberger proposes another meeting July 27.'
      n: '[[w.ritchie-minutes-of-the-senate]], 638–42 (Mansfield''s statement, 638–39; Medicare, 640–42). Names: Mansfield, Dodd, Holland, Russell, Gore, Long, Neuberger.'
      tags:
      - name:mansfield-mike
      - name:dodd-thomas-j
      - name:holland-spessard-l
      - name:russell-richard-b
