    entry:
      id: cal.1964-01-29.republican-party-congress-2
      when: Jan. 29
      date: '1964-01-29'
      thread: republican-party-congress
      c: 'Senate Republican conference, 9:45 to 11 a.m., twenty-four present, on the tax bill. Dirksen: floor action by Feb. 7; he will offer amendments to repeal four excise taxes. Williams, of Finance, against agreeing to the committee amendments en bloc before the report; Dominick on the college tax credit amendment with Ribicoff.'
      n: '[[w.wolff-minutes-of-the-senate]], 973–75. Names: Dirksen, Williams, Dominick, Ribicoff.'
      tags:
      - name:dirksen-everett
      - name:williams-john-j
