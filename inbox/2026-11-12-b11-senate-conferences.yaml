    entry:
      id: cal.1961-01-05.congress
      when: Jan. 5
      date: '1961-01-05'
      thread: congress
      also:
      - democratic-party
      c: Senate Democrats in conference, Mansfield in the chair, 10:10 to 10:50 a.m. Long (La.) offers a resolution that the author of a major amendment in conference be considered in choosing Senate conferees, and that the majority of them be "Senators who voted for the Senate position"; Mansfield promises to consult the committee chairmen; not voted. Clark puts off his rules proposals to Jan. 10.
      n: '[[w.ritchie-minutes-of-the-senate]], 583–85 (the resolution as printed, 584). Names: Mansfield, Long, Clark.'
      tags:
      - name:mansfield-mike
      - name:long-russell-b
      - name:clark-joseph-s
- add:
    entry:
      id: cal.1961-01-10.congress
      when: Jan. 10
      date: '1961-01-10'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, 10:05 to 11:35 a.m. Mansfield names Dodd, Williams and Clark to the Steering Committee; confirmed. Muskie to the Calendar Committee. Clark withdraws his motion to let the Calendar Committee''s members vote in the Policy Committee, which the law fixes at seven. Mansfield reads the President-elect''s message on his Cabinet nominees, with hearings to be quick: the Senate to sit on Inauguration Day to receive them. None of Clark''s rules proposals is voted.'
      n: '[[w.ritchie-minutes-of-the-senate]], 585–88 (the Steering Committee, 585; the Policy Committee''s number, 585–86; the Cabinet message, 587; Clark''s proposals, 587–88). Names: Mansfield, Dodd, Clark, Muskie.'
      tags:
      - name:mansfield-mike
      - name:dodd-thomas-j
      - name:clark-joseph-s
      - name:muskie-edmund-s
- add:
    entry:
      id: cal.1961-02-27.congress
      when: Feb. 27
      date: '1961-02-27'
      thread: congress
      also:
      - democratic-party
      c: 'Senate Democrats in conference, Johnson in the chair, 10:10 to 10:35 a.m. Mansfield on four or five White House meetings: "these meetings have been most cordial and most helpful"; the President knows "the line of demarcation" between the branches. He reads the "Must Bills"; in five weeks the Senate has confirmed 14,000 appointments and passed 65 bills. Kerr and Mansfield on adjournment by July 31.'
      n: '[[w.ritchie-minutes-of-the-senate]], 588–91 (the meeting, 588–90; the Leader reads sixteen ''Must Bills'', 589, the program attached lists seventeen items, 590–91; Mansfield''s notes, 591). Names: Johnson, Mansfield, Kerr, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:kerr-robert-s
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-02-07.congress
      when: Feb. 7
      date: '1962-02-07'
      thread: congress
      also:
      - democratic-party
      - cities-and-housing
      c: 'Senate Democrats, an informal conference. Mansfield reports the President''s breakfast with the leaders Feb. 6: urban affairs, the Easter recess, the week''s programs, the education bill. O''Brien''s account: the urban affairs department no "political plot on his part"; the President is sending a message on education and "not giving up." Morse proposes lend-lease of staff and more live pairs for Senators up for reelection.'
      n: '[[w.ritchie-minutes-of-the-senate]], 591–93 (the minutes'' own words; O''Brien''s account, 592–93). Names: Mansfield, O''Brien, Morse, Kennedy.'
      tags:
      - name:mansfield-mike
      - name:obrien-lawrence-f
      - name:morse-wayne
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-03-13.congress
      when: Mar. 13
      date: '1962-03-13'
      thread: congress
      also:
      - democratic-party
      - medicare
      c: 'Senate Democrats, 2:30 p.m., on Medicare tactics. Anderson: Javits means to attach his plan to a tax bill; whether to offer King–Anderson as a substitute or move to table. Douglas, Magnuson and others for offering it at once; Mansfield would table if members chose to wait for the House. Mansfield takes it that the members will follow the leadership on procedure; no one contradicts.'
      n: '[[w.ritchie-minutes-of-the-senate]], 593–94 (no vote taken). Names: Mansfield, Anderson, Javits, Douglas, Magnuson.'
      tags:
      - name:mansfield-mike
