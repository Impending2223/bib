      c: 'Mills, in a statement on federal spending and the growth of government: the committee''s action "not irresponsible, bullheaded, or spiteful," but the anxiety members found at home over the Labor Day recess about "the recent sharp rise in federal outlays."'
- add:
    entry:
      id: cal.1967-06-07.economy-surcharge
      when: June 7
      date: '1967-06-07'
      thread: economy-surcharge
      c: 'Johnson with Fowler, Trowbridge, Wirtz, Ackley and Schultze: they urge the surcharge; Fowler, a deficit of $23 to $28 billion without it. Johnson, by Califano''s memorandum: he will "refuse to run a deficit of the magnitude projected"; he will "slash the hell out of domestic programs if necessary."'
      n: '[[w.gibbons-u-s-government-and]], IV, 755. To check: Califano, memorandum for the files, June 9, 1967 (LBJ Library); [[w.califano-triumph-and-tragedy-of]], 243. Names: Johnson, Fowler, Trowbridge, Wirtz, Ackley, Schultze, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:fowler-henry-h
      - name:trowbridge-alexander-b
      - name:wirtz-w-willard
      - name:ackley-gardner
      - name:schultze-charles-l
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1967-06-13.defense
      when: June 13
      date: '1967-06-13'
      thread: defense
      also:
      - vietnam
      c: 'The House passes the defense appropriation for fiscal 1968, H.R. 10738, $70.3 billion, [408–1](https://voteview.com/rollcall/RH0900074), Brown alone against; his amendment holding defense spending to 95 percent of the budget''s estimate lost by voice. Mahon: the vote shows "the House of Representatives is in support of the war effort."'
      n: '[113 Cong. Rec., House, June 13, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt12/pdf/GPO-CRECB-1967-pt12-2-1.pdf), 15541–42 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 761, 763. Check: Gibbons gives 407–1. Names: Brown, Mahon.'
      tags:
      - name:brown-george-e-jr
      - name:mahon-george-h
- add:
    entry:
      id: cal.1967-06-14.vietnam-congress
      when: June 14
      date: '1967-06-14'
      thread: vietnam-congress
      also:
      - soviet-union
      c: 'Thompson calls on Fulbright, sent by Johnson and Katzenbach, Johnson having "sought out" Fulbright at a reception the evening before: Kosygin may come, a chance to begin an understanding with Moscow. Fulbright: reduce the bombing, for fear of China and Russia; the war''s effect at home.'
      n: '[[w.gibbons-u-s-government-and]], IV, 719 (Thompson''s memorandum of the meeting, June 14, 1967, State, Lot File 74 D 164). Names: Thompson, Fulbright, Johnson, Katzenbach, Kosygin.'
      tags:
      - name:thompson-llewellyn-e
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1967-06-17.vietnam-congress
      when: June 17
      date: '1967-06-17'
      thread: vietnam-congress
      also:
      - soviet-union
      c: 'Fulbright to Johnson: meet Kosygin, on the Middle East, Vietnam and the two powers'' view of each other. Received 3:25 p.m., read to Johnson by Watson at 3:45; Johnson sends it to Rusk and telephones Fulbright that night. No record of the call.'
      n: '[[w.gibbons-u-s-government-and]], IV, 719. To check: Fulbright to Johnson, June 17, 1967 (LBJ Library, WHCF, Ex ND 19/CO 1-6). See [[cal.1967-06-14.vietnam-congress]]. Names: Fulbright, Johnson, Kosygin, Watson, Rusk.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
      - name:watson-w-marvin
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-06-19.vietnam-congress-2
      when: June 19
      date: '1967-06-19'
      thread: vietnam-congress
      also:
      - soviet-union
      c: 'Fulbright writes Johnson again to meet Kosygin. Johnson''s reply, dictated by himself: "We are ready to meet with him if there is any indication that he wishes and is willing to discuss with us substantive problems of common interest."'
      n: '[[w.gibbons-u-s-government-and]], IV, 719. To check: the letters (LBJ Library, WHCF, Ex FO/Kosygin). See [[cal.1967-06-17.vietnam-congress]]. Names: Fulbright, Johnson, Kosygin.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1967-06-30.vietnam-congress
      when: June 30
      date: '1967-06-30'
      thread: vietnam-congress
      c: 'Fulbright to Johnson, after Glassboro and his talks with Rusk: the bombing "quietly and progressively reduced over a period of, say, a week or two and then terminated," no announcement; "great caution" on more troops before South Vietnam''s September elections.'
      n: '[[w.gibbons-u-s-government-and]], IV, 724–25. To check: Fulbright to Johnson, June 30, 1967, (LBJ Library). See [[cal.1967-06-23.soviet-union]]. Names: Fulbright, Johnson, Rusk.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-07-05.vietnam-congress
      when: July 5
      date: '1967-07-05'
      thread: vietnam-congress
      c: 'Manatos to Johnson: Glassboro has made goodwill among the Senate''s leaders of both parties, "from Mansfield and Dirksen on down"; "Particularly is this change telling on Senator Fulbright."'
      n: '[[w.gibbons-u-s-government-and]], IV, 725. To check: Manatos to Johnson, July 5, 1967 (LBJ Library). See [[cal.1967-06-23.soviet-union]]. Names: Manatos, Johnson, Mansfield, Dirksen, Fulbright.'
      tags:
      - name:manatos-mike-n
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:dirksen-everett
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-18.vietnam
      when: July 18
      date: '1967-07-18'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson with Rusk, McNamara and others, 6:06 to 7:30 p.m. He reads a letter from Arizona: "People believe that civilian heads have ignored the advice of the military," symptomatic of what is coming on the Hill. McNamara: CINCPAC''s new targets "largely unimportant," those near Hanoi''s center "not worth the loss of a single U.S. plane or pilot"; seventeen outside the zones, not Phúc Yên. Rolling Thunder 57 "only a limited extension."'
      n: 'FRUS 1964–68, V, doc. [247](https://history.state.gov/historicaldocuments/frus1964-68v05/d247). [[w.gibbons-u-s-government-and]], IV, 735–36 (Tom Johnson''s notes; JCS to CINCPAC 1859). Made public: FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-07-26.economy-surcharge
      when: July 26
      date: '1967-07-26'
      thread: economy-surcharge
      c: 'Johnson with Mills and Fowler, 5:10 to 7:33 p.m., Ackley, Califano, Levinson and McPherson joining, over a draft of the tax message: a surcharge of 10 percent, as the economic advisers had unanimously recommended July 22. By Califano''s account, Mills helps draft it but keeps his distance until the President cuts spending.'
      n: '[[w.gibbons-u-s-government-and]], IV, 755; [[w.califano-triumph-and-tragedy-of]], 244 (by Gibbons''s quotation). Names: Johnson, Mills, Fowler, Ackley, Califano, Levinson, McPherson.'
      tags:
