      n: 'FRUS 1964–68, V, docs. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84), [88](https://history.state.gov/historicaldocuments/frus1964-68v05/d88). [[w.gibbons-u-s-government-and]], IV, 562–68 (the decisions: Walt Rostow''s notations on his agenda and Wheeler''s cable to Sharp and Westmoreland, JCS 1422-67, Feb. 23); [[w.drea-mcnamara-clifford-and-the-2011]], 135. To check: [[w.berman-lyndon-johnsons-war]]. See [[cal.1967-02-06.vietnam]]. Check: Drea, 135, has Rusk at the meeting; FRUS 1964–68, V, doc. 88, n. 2, from the Daily Diary, lists Eugene Rostow, not Rusk. Names: McNamara, Eugene Rostow, Taylor, Wheeler, Johnson, Walt Rostow.'
      c: 'Johnson with McNamara, Eugene Rostow, Taylor and Wheeler, 1:15 to 3:25 p.m.; no notes found. On the Joint Chiefs'' three programs, by Walt Rostow''s notations and Wheeler''s cable the next day: Rolling Thunder 54, the steel plant and the power plant at Thái Nguyên and the power plants at Việt Trì, Bắc Giang and Hòn Gai added; inland waterways and estuaries south of the 20th parallel mined; naval gunfire at shipping and shore targets to the 20th; artillery from the South into the DMZ, the North and Laos; Shining Brass widened; Popeye, the seeding of clouds over the trail, approved. Not announced.'
