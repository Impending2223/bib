- add:
    entry:
      id: cal.1967-09-20.war-opposition
      when: Sept. 20
      date: '1967-09-20'
      thread: war-opposition
      c: 'Johnson with McNamara, Katzenbach, Ramsey Clark, Udall and the administrator of General Services on the October march. McNamara: troops enough. Clark: a single command post, at Defense or Justice; Katzenbach: one, "and possibly preliminary steps taken to discourage attendance." Justice to supervise the preparations. Clark, McNamara and Katzenbach: he might be out of Washington that weekend.'
      n: '[[w.gibbons-u-s-government-and]], IV, 861 (unsigned notes of the meeting, LBJ Library, Meetings Notes File). Check: Gibbons dates the meeting Sept. 21; the notes are of Sept. 20. To check: [[w.debenedetti-american-ordeal]]. Names: Johnson, McNamara, Katzenbach, Clark, Udall.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:clark-ramsey
      - name:udall-stewart-l
- add:
    entry:
      id: cal.1967-10-04.war-opposition
      when: Oct. 4
      date: '1967-10-04'
      thread: war-opposition
      c: 'Cabinet. Clark on the march: other events to be staged to draw people off; the sponsors pacifists and "extreme Left-wing groups with long lines of Communist affiliations." Rusk: "Wouldn''t it help to leak that?" Gardner: "they must know that!" Clark: given to some columnists. Johnson: "Let''s see it some more"; "Every day, Senators attack us."'
      n: '[[w.gibbons-u-s-government-and]], IV, 861–62 (notes of the Cabinet meeting, LBJ Library, Cabinet Papers). See [[cal.1967-09-20.war-opposition]]. Names: Clark, Rusk, Gardner, Johnson.'
      tags:
      - name:clark-ramsey
      - name:rusk-dean
      - name:gardner-john-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-16.war-opposition-2
      when: Oct. 16
      date: '1967-10-16'
      thread: war-opposition
      c: 'Califano to Johnson: the preparations for the march on course; the leaks to the press on Communist influence "should discourage many less extreme antiwar sympathizers from attending."'
      n: '[[w.gibbons-u-s-government-and]], IV, 862 (LBJ Library, WHCF, HU 4). See [[cal.1967-10-04.war-opposition]]. Names: Califano, Johnson.'
      tags:
      - name:califano-joseph-a-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-18.vietnam
      when: Oct. 18
      date: '1967-10-18'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson, after Humphrey and Clifford: Clifford for "a gradually increasing squeeze" on the North. Of the dinner the night before: "You are surrounded by people you can trust."'
      n: '[[w.gibbons-u-s-government-and]], IV, 873–74 (McGeorge Bundy to Johnson, Oct. 18, 1967, LBJ Library, C.F. ND 19/CO 312). See [[cal.1967-10-17.vietnam]]. Names: McGeorge Bundy, Johnson, Humphrey, Clifford.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:clifford-clark
- add:
    entry:
      id: cal.1967-10-19.vietnam
      when: Oct. 19
      date: '1967-10-19'
      thread: vietnam
      c: 'Johnson with Clifford and Rostow on the pressure for a pause: the question to go to the senior advisers. Their memorandum of Oct. 20: ten of them to meet "to explore the problem of a pause." Johnson strikes Acheson and Fortas from the list, adds Taylor and Lodge; Acheson and Fortas asked after all.'
      n: '[[w.gibbons-u-s-government-and]], IV, 874–75 (Clifford and Rostow to Johnson, Oct. 20, 1967, with Johnson''s notes on it, LBJ Library, Diary Backup). To check: [[w.clifford-counsel-to-the-president-2]], 454; [[w.isaacson-wise-men]]. See [[cal.1967-10-18.vietnam]]. Names: Johnson, Clifford, Rostow, Acheson, Fortas, Taylor, Lodge.'
      tags:
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:rostow-walt-w
      - name:acheson-dean-g
      - name:fortas-abe
      - name:taylor-maxwell
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1967-10-20.war-opposition
      when: Oct. 20
      date: '1967-10-20'
      thread: war-opposition
      also:
      - draft
      c: 'Night, after the cards are left at Justice. Johnson to Califano: "I want a memo to the Attorney General tonight. I want the FBI investigating." Before dinner he calls Hershey on punishing draft protesters, by Califano''s account. The memorandum goes to Clark, Hershey and Hoover. Troops on alert for the Pentagon, the Capitol and the White House, some in the Commerce Department''s basement.'
      n: '[[w.gibbons-u-s-government-and]], IV, 863–64 (from [[w.califano-triumph-and-tragedy-of]], 198–99; the memorandum, LBJ Library, WHCF, Ex ND 9-4). To check: [[w.califano-triumph-and-tragedy-of]]. See [[cal.1967-10-16.war-opposition]]. Names: Johnson, Califano, Hershey, Clark, Hoover.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      - name:hershey-lewis-b
      - name:clark-ramsey
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1967-10-20.war-opposition-2
      when: Oct. 20
      date: '1967-10-20'
      thread: war-opposition
      c: 'Signed, 11:29 p.m.: S. 2310, the Capitol''s buildings and grounds, [81 Stat. 275](https://www.govinfo.gov/content/pkg/STATUTE-81/pdf/STATUTE-81-Pg275-3.pdf). No parading, demonstrating or picketing in the buildings; loud, threatening or abusive language or disorderly conduct meant to disrupt a session or a hearing, a misdemeanor. The House had passed its bill, H.R. 13178, Oct. 19, [336–20](https://voteview.com/rollcall/RH0900169).'
      n: '[[w.gibbons-u-s-government-and]], IV, 864 (the signing, from the *New York Times*, Oct. 22, 1967). Check: Gibbons has Congress pass it that day; the House''s roll call on its bill is of Oct. 19; the Senate''s day not read. See [[cal.1967-10-20.war-opposition]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-25.vietnam-2
      when: Oct. 25
      date: '1967-10-25'
      thread: vietnam
      c: 'Rostow, for Clifford and himself, to Johnson: the senior advisers to meet Nov. 1–2, "since there is no single issue like a pause": an evening briefing at State, then the President. Their advice to be asked on the bombing, an unconditional pause, peace initiatives, the war in the South and support at home.'
      n: '[[w.gibbons-u-s-government-and]], IV, 875 (LBJ Library, NSF Country File, Vietnam). See [[cal.1967-10-19.vietnam]]. Names: Rostow, Clifford, Johnson.'
      tags:
      - name:rostow-walt-w
      - name:clifford-clark
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-31.war-opposition
      when: Oct. 31
      date: '1967-10-31'
      thread: war-opposition
      also:
      - economy-surcharge
      c: 'Johnson with the Democratic leaders, McCormack, Albert, Mansfield, Russell Long and Robert Byrd. McCormack: Mills will not report the surtax until sure of the votes; Mansfield: "keep pounding away for a tax bill," though not likely before 1968. Johnson: of the 256 said to have burned their draft cards, many "crazy people" with histories in mental institutions, by the FBI''s reports, most cards copies; he does not want to be "like a McCarthyite," but "someone has to uncover this information."'
      n: '[[w.gibbons-u-s-government-and]], IV, 869, 923 (Jim Jones''s notes). Check: Jones''s notes of Nov. 4 have Johnson say the leaders met him "Monday," [FRUS 1964–68, V, doc. 386](https://history.state.gov/historicaldocuments/frus1964-68v05/d386). See [[cal.1967-10-21.war-opposition]]. Names: Johnson, McCormack, Albert, Mansfield, Long, Byrd, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:mansfield-mike
      - name:long-russell-b
      - name:byrd-robert-c
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1967-11-02.vietnam-2
      when: Nov. 2
      date: '1967-11-02'
      thread: vietnam
      c: 'Rostow''s comments on McNamara''s memorandum: with him on points 1 to 5 and 9 of the nine; "with a little luck and reasonable performance by the South Vietnamese under the new government, the evidence of solid progress will become increasingly clear to one and all."'
      n: '[FRUS 1964–68, V, doc. 378](https://history.state.gov/historicaldocuments/frus1964-68v05/d378). [[w.gibbons-u-s-government-and]], IV, 883–84, 908. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-01.vietnam]]. Names: Rostow, McNamara.'
      tags:
      - name:rostow-walt-w
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-11-03.vietnam-3
      when: Nov. 3
      date: '1967-11-03'
      thread: vietnam
      c: 'Harriman to Johnson and Rusk, after the senior advisers: that offers to negotiate only encourage Hanoi to hold out, "There is no evidence whatever"; the efforts to be kept up.'
      n: '[FRUS 1964–68, V, doc. 380](https://history.state.gov/historicaldocuments/frus1964-68v05/d380). [[w.gibbons-u-s-government-and]], IV, 878. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-02.vietnam]]. Names: Harriman, Johnson, Rusk.'
      tags:
      - name:harriman-w-averell
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-11-08.vietnam
      when: Nov. 8
      date: '1967-11-08'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Humphrey back: with Johnson and Rostow, 9:42 a.m., then to the National Security Council with Mansfield, Russell, Fulbright, Margaret Chase Smith, Hayden, McCormack, Bates and Mahon. Revolutionary Development "beginning to move"; the election''s "very good effect." Fulbright: "What is our objective in Vietnam?" "Who is the enemy—Peking or Ho Chi Minh?" Mansfield: "mildly encouraging." Russell: how is the ammunition moved?'
      n: '[FRUS 1964–68, V, doc. 390](https://history.state.gov/historicaldocuments/frus1964-68v05/d390) (Bromley Smith''s summary). [[w.gibbons-u-s-government-and]], IV, 895–96 (Tom Johnson''s notes too). Made public: FRUS 1964–68, V (2002). See [[cal.1967-10-31.vietnam]]. Names: Humphrey, Johnson, Rostow, Mansfield, Russell, Fulbright, Margaret Chase Smith, Hayden, McCormack, Bates, Mahon.'
      tags:
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
      - name:rostow-walt-w
      - name:mansfield-mike
      - name:russell-richard-b
      - name:fulbright-j-william
      - name:smith-margaret-chase
      - name:hayden-carl
      - name:mccormack-john-w
      - name:bates-william-h
      - name:mahon-george-h
- add:
    entry:
      id: cal.1967-11-09.vietnam-air-war
      when: Nov. 9
      date: '1967-11-09'
      thread: vietnam-air-war
      c: Johnson refuses Wheeler's request of Oct. 27 to narrow the prohibited areas around Hanoi and Haiphong.
      n: '[[w.gibbons-u-s-government-and]], IV, 891 (no notes of the meeting). To check: [[w.pentagon-papers]], IV, 14 (Gibbons''s page). See [[cal.1967-10-23.vietnam-pennsylvania]]. Names: Johnson, Wheeler.'
      tags:
      - name:johnson-lyndon-b
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-11-10.vietnam
      when: Nov. 10
      date: '1967-11-10'
      thread: vietnam
      c: 'McGeorge Bundy''s summary of the senior advisers'' meeting, at Johnson''s asking. Getting out: "a strong and unanimous negative." His own advice: once the targets approved are struck, rule out a major widening of the bombing; a review of the conduct of the war in the South by the Commander-in-Chief; "some visible de-escalation, based on success and not failure."'
      n: '[FRUS 1964–68, V, doc. 393](https://history.state.gov/historicaldocuments/frus1964-68v05/d393). [[w.gibbons-u-s-government-and]], IV, 876–80. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-02.vietnam]]. Names: McGeorge Bundy, Johnson.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-15.war-opposition
      when: Nov. 15
      date: '1967-11-15'
      thread: war-opposition
      c: 'Helms to Johnson, the CIA''s "International Connections of the U.S. Peace Movement," asked for after the march: no source found for the leaders'' travel, no contact with foreign embassies; the groups "well infiltrated" with Communists, their influence "disproportionate," not "controlling"; "Most of the Vietnam protest activity would be there with or without the Communist element." Not released.'
      n: '[[w.gibbons-u-s-government-and]], IV, 869–71 (the report and Helms''s memorandum, LBJ Library, NSF Intelligence File; not released, from DeBenedetti and Chatfield, 205). To check: [[w.debenedetti-american-ordeal]]; Senate Select Committee to Study Governmental Operations with Respect to Intelligence Activities, *Final Report*, Book III (1976) (the request). See [[cal.1967-10-21.war-opposition]]. Names: Helms, Johnson.'
      tags:
      - name:helms-richard
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-16.vietnam-congress
      when: Nov. 16
      date: '1967-11-16'
      thread: vietnam-congress
      c: 'Bunker before the Foreign Relations Committee, in executive session: "steady, not spectacular but steady progress"; "we are going to win." Case: "almost a unanimous impression on the part of the newspaper reporters" against the "general optimistic reports" of the government''s agencies. Bunker: the reporters "young and inexperienced"; the impression given "a very distorted view."'
      n: '[[w.gibbons-u-s-government-and]], IV, 897–98 (the committee''s unpublished transcript). See [[cal.1967-11-13.vietnam]]. Names: Bunker, Case.'
      tags:
      - name:bunker-ellsworth
      - name:case-clifford-p
- add:
    entry:
      id: cal.1967-11-20.vietnam-2
      when: Nov. 20
      date: '1967-11-20'
      thread: vietnam
      c: 'Rostow lunches with Westmoreland, on McNamara''s propositions: against a halt or more limits in the Hanoi-Haiphong area; an announced ceiling of 525,000 "foolish"; turning functions over to the South Vietnamese his "central purpose"; raids in force above the DMZ wanted for May or June 1968; Laos and Cambodia not ruled out.'
      n: '[FRUS 1964–68, V, doc. 404](https://history.state.gov/historicaldocuments/frus1964-68v05/d404). [[w.gibbons-u-s-government-and]], IV, 885–86, 932. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-01.vietnam]]. Names: Rostow, Westmoreland, McNamara.'
      tags:
      - name:rostow-walt-w
      - name:westmoreland-william
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-11-20.vietnam-3
      when: Nov. 20
      date: '1967-11-20'
      thread: vietnam
      c: 'Late, Rostow an hour with Bunker on the same questions: no reason to think a stand-down would bring serious talks; stabilize, but give Saigon no sign of a withdrawal; no statement against ground operations in North Vietnam, Laos or Cambodia, "keep them guessing."'
      n: '[FRUS 1964–68, V, doc. 410](https://history.state.gov/historicaldocuments/frus1964-68v05/d410) (Rostow to Johnson, Nov. 21). [[w.gibbons-u-s-government-and]], IV, 885–86. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-20.vietnam-2]]. Names: Rostow, Bunker.'
      tags:
      - name:rostow-walt-w
      - name:bunker-ellsworth
- add:
    entry:
      id: cal.1967-11-20.elections-1968
      when: Nov. 20
      date: '1967-11-20'
      thread: elections-1968
      c: 'Night, the Westmorelands at the White House, Russell at dinner. Johnson to Westmoreland, by his notes: McNamara leaving, Clifford to succeed him; his health not good, he and his wife tired; he does not plan to run in 1968. How would the troops take it? Westmoreland: told why, they would understand.'
      n: '[[w.gibbons-u-s-government-and]], IV, 900 (Westmoreland''s history notes for Nov. 20, 1967, CMH, Westmoreland Papers). To check: [[w.westmoreland-soldier-reports]], 233. Names: Johnson, Westmoreland, Russell, McNamara, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:russell-richard-b
      - name:mcnamara-robert-s
      - name:clifford-clark
- add:
    entry:
      id: cal.1967-12-04.opinion
      when: Dec. 4
      date: '1967-12-04'
      thread: opinion
      c: 'Harris, in the *Washington Post*: Johnson''s handling of the war, positive 34 percent, negative 66, late November; late October 23 and 77; September 31 and 69; August 33 and 67; June 46 and 54.'
      n: '[[w.gibbons-u-s-government-and]], IV, 900. To check: *Washington Post*, Dec. 4, 1967. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-12-18.opinion
      when: Dec. 18
      date: '1967-12-18'
      thread: opinion
      also:
      - war-opposition
      c: 'Harris, in the *Washington Post*: the demonstrations "encourage Communists to fight all the harder," 76 percent; have hurt the cause of opposing the war, 70; "acts of disloyalty against the boys in Vietnam," 68. The right to demonstrate peacefully against the war: have it 54 percent, 61 in July; have not 40, 30 in July; not sure 6 and 9.'
      n: '[[w.gibbons-u-s-government-and]], IV, 867–68. To check: *Washington Post*, Dec. 18, 1967. Check: the *Post* prints 40 for July; Gibbons reads 30, from the article''s "up ten points from July."'
- add:
    entry:
      id: cal.1967-12-23.opinion
      when: Dec. 23
      date: '1967-12-23'
      thread: opinion
      c: 'Harris, in the *Washington Post*: escalation over de-escalation, 63 percent to 37. A halt in the bombing "to see if the Communists will come to the negotiating table," rejected 63 to 24 (October, 53 to 29). Mine Haiphong "even at the risk of sinking Russian ships," 42 to 33; invade North Vietnam, 49 to 29; American forces held where they are and the South Vietnamese Army built up to take over, 66 to 15.'
      n: '[[w.gibbons-u-s-government-and]], IV, 900–02. To check: *Washington Post*, Dec. 23, 1967. See [[cal.1967-12-04.opinion]].'
- add:
    entry:
      id: cal.1967-12-28.vietnam-support
      when: Dec. 28
      date: '1967-12-28'
      thread: vietnam-support
      c: 'Fred Panzer to Johnson, on the polls: "All in all it looks like the public has greater understanding of what the Administration is trying to do in Vietnam—and accepts it." "Thus, Vietnam is well in hand."'
      n: '[[w.gibbons-u-s-government-and]], IV, 902 (LBJ Library, C.F. PR 16). See [[cal.1967-12-23.opinion]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
