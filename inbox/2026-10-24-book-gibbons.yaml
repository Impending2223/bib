    set:
      n: 'Check: the transcript. [[w.gibbons-u-s-government-and]], IV, 896–97 (Westmoreland: a phasing down "in two years or less," confirmed there). See [[cal.1967-11-13.vietnam]]. Names: Bunker, Westmoreland.'
