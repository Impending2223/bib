- add:
    entry:
      id: cal.1965-12-07.vietnam-pause
      when: Dec. 7
      date: '1965-12-07'
      thread: vietnam-pause
      c: 'At the Ranch, Johnson with Rusk, McNamara and McGeorge Bundy on McNamara''s report and a pause. Johnson: "I don''t see any light down that barrel"; "I''d trade back to where we were"; "If I have to decide this morning, full steam ahead." McNamara would not have proposed a pause "if he didn''t think we could manipulate it." Rusk: Fulbright and the Kennedys might come along; Johnson and McNamara doubt it. Consult Mansfield, Dirksen, Robert Kennedy and Russell "before we go over board."'
      n: 'McGeorge Bundy''s notes (LBJ Library, Papers of McGeorge Bundy) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 118–19. Johnson''s account: [[w.johnson-vantage-point]], 235 (To check). See [[cal.1965-12-07.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Fulbright, Mansfield, Dirksen, Robert Kennedy, Russell.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:dirksen-everett
      - name:kennedy-robert-f
      - name:russell-richard-b
- add:
    entry:
      id: cal.1965-12-09.vietnam-congress
      when: Dec. 9
      date: '1965-12-09'
      thread: vietnam-congress
      also:
      - vietnam-pause
      c: 'McGeorge Bundy to Johnson on the soundings of Congress, McNamara''s calls among them: Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford and Arends. Nearly all for a pause, then more force, bombing included, if needed to "win," and a resolution of support; the war not understood at home. Mansfield, cabled in Asia: against the bombing, doubtful of a pause meant as a prelude to escalation; better a cease-fire of about a month.'
      n: 'McGeorge Bundy to Johnson, Dec. 9, 1965, with McNamara''s memorandum of his calls (LBJ Library, NSF Memos to the President—McGeorge Bundy); Washington to Hong Kong 762, Dec. 9, and Manila to Washington 1132, Dec. 10 (State, Central File, Pol 27 Viet S) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 119–20 and n.22 (the resolution drafted Dec. 6). See [[cal.1965-12-07.vietnam-pause]]. Names: McGeorge Bundy, Johnson, McNamara, Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford, Arends, Mansfield.'
