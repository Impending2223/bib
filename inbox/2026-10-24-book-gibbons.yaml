- add:
    entry:
      id: cal.1966-05-20.vietnam-congress
      when: May 20
      date: '1966-05-20'
      thread: vietnam-congress
      c: 'Marcy to Fulbright: get Mansfield and Russell to arrange a private meeting of a few senior Senators of both parties with the President, to urge "a radical shift" toward less involvement: a speech "more in sorrow than in anger," American forces withdrawn to designated areas for up to two years, then out. "This may seem pretty wild."'
      n: '[[w.gibbons-u-s-government-and]], IV, 324–25. To check: Marcy to Fulbright, May 20, 1966; Marcy to Hartke, May 22 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, Mansfield, Russell.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-05-21.vietnam
      when: May 21
      date: '1966-05-21'
      thread: vietnam
      c: 'Johnson and Fortas by telephone on Vietnam. Fortas''s handwritten memorandum after: "We''ve got to make a commitment to success"; go on the offensive in the propaganda war; if Kỳ succeeds at Đà Nẵng, a statement that the United States will not let South Vietnam be "a monument to freedom''s defeat."'
      n: '[[w.gibbons-u-s-government-and]], IV, 322 n.27. To check: Fortas''s memorandum, undated (LBJ Library, NSF Country File, Vietnam, Box 99). Check: the memorandum is filed with Sept.–Oct. 1967; Gibbons dates it by the call of May 21, 1966, and its reference to Đà Nẵng; Berman (*Lyndon Johnson''s War*, 87) and Kalman (*Abe Fortas*, 248) date it Oct. 14, 1967. Names: Johnson, Fortas, Nguyễn Cao Kỳ.'
      tags:
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1966-05-23.vietnam-congress
      when: May 23
      date: '1966-05-23'
      thread: vietnam-congress
      c: 'Rusk at State with the Senate''s leaders, Long, Kuchel, Russell, Saltonstall, Fulbright, Hickenlooper, Hayden and Milton Young, then the House''s, McCormack, Albert, Ford, Arends, Mahon, Bow, Morgan, Bolton, Rivers and Bates: Đà Nẵng in hand, a settlement possible at Huế. In both, deep concern at the South Vietnamese quarrel; Bates: the people "progressively more restive," and more will want to pull out. Fulbright to reporters: not encouraged.'
      n: '[[w.gibbons-u-s-government-and]], IV, 323–24. To check: Memorandum "For the President''s Evening Reading," May 23, 1966 (State, Lot File 74 D 164); *New York Times*, May 24, 1966. Names: Rusk, Russell Long, Kuchel, Russell, Saltonstall, Fulbright, Hickenlooper, Hayden, Milton Young, McCormack, Albert, Ford, Arends, Mahon, Bow, Morgan, Bolton, Rivers, Bates.'
      tags:
      - name:rusk-dean
      - name:long-russell-b
      - name:kuchel-thomas-h
      - name:russell-richard-b
      - name:saltonstall-leverett
      - name:fulbright-j-william
      - name:hickenlooper-bourke-b
      - name:hayden-carl
      - name:young-milton-r
      - name:mccormack-john-w
      - name:albert-carl
      - name:ford-gerald-r
      - name:arends-leslie-c
      - name:mahon-george-h
      - name:bow-frank-t
      - name:morgan-thomas-e
      - name:bolton-frances-p
      - name:rivers-l-mendel
      - name:bates-william-h
- add:
    entry:
      id: cal.1966-05-28.vietnam
      when: May 28
      date: '1966-05-28'
      thread: vietnam
      c: 'McNamara with Harriman, by Harriman''s notes: he hopes for a settlement and sees no value in escalation; North Vietnamese troops out and American troops out, an expanded ICC to watch; the bombing stopped if infiltration stops; the South Vietnamese to decide their future "even if it meant a coalition government with the Viet Cong."'
      n: 'FRUS 1964–68, IV, doc. [148](https://history.state.gov/historicaldocuments/frus1964-68v04/d148) (Harriman, May 30). [[w.gibbons-u-s-government-and]], IV, 328. Made public: FRUS 1964–68, IV (1998). Names: McNamara, Harriman.'
      tags:
      - name:mcnamara-robert-s
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1966-06-01.vietnam-congress
      when: June 1
      date: '1966-06-01'
      thread: vietnam-congress
      c: Fulbright with Johnson at the White House, brought by Clinton Anderson, who leaves them; Rostow joins; 6:20 to 8:13 p.m. By Rostow's notes, Johnson on "the options open to him and why the option he has chosen is in the national interest"; Fulbright "wished he could share our confidence that there is an honorable way out; but would keep in touch."
      n: '[[w.gibbons-u-s-government-and]], IV, 343–44. To check: Rostow''s notes, President''s Daily Diary, June 1, 1966 (LBJ Library). See [[cal.1966-05-27.vietnam-congress]]. Names: Fulbright, Johnson, Clinton Anderson, Rostow.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:anderson-clinton-p
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1966-06-06.vietnam-congress
      when: June 6
      date: '1966-06-06'
      thread: vietnam-congress
      c: 'Fulbright sends Johnson *Neutralization in Southeast Asia: Problems and Prospects*, a study made at his request by members of the Princeton faculty: neutralization "merits serious consideration" as an alternative to a long American military presence in South Vietnam.'
      n: '[[w.gibbons-u-s-government-and]], IV, 346. To check: Fulbright to Johnson, June 6, 1966 (LBJ Library, Files of Walt Rostow). Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-13.vietnam-congress
      when: June 13
      date: '1966-06-13'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, on the five alternatives Rostow''s staff drew up and Johnson gave him (withdrawal; enclaves; the present course; major escalation; the maximum short of nuclear war): withdrawal rather than enclaves; the present course leading fast to major escalation; the best course to limit the military involvement and seek negotiations.'
      n: '[[w.gibbons-u-s-government-and]], IV, 326–27. To check: Mansfield to Johnson, June 13, 1966 (LBJ Library, NSF Files of Mike Mansfield); Jorden and Ginsburgh''s paper, May 27, and Rostow''s cover memorandum, June 2 (LBJ Library, NSF Memos to the President—Walt Rostow). Names: Mansfield, Johnson, Rostow.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1966-06-15.vietnam-congress
      when: June 15
      date: '1966-06-15'
      thread: vietnam-congress
      c: 'Johnson with Fulbright alone after a White House ceremony, 12:50 to 1:40 p.m. No notes. By Coffin''s account, from Fulbright soon after, "a highly emotional harangue": victory, and force if the Communists do not relent; Fulbright afraid Johnson "beyond a rational discussion of Vietnam."'
      n: '[[w.gibbons-u-s-government-and]], IV, 344. To check: Tristram Coffin, *Senator Fulbright: Portrait of a Public Philosopher* (1966), 313; the President''s Daily Diary, June 15, 1966 (LBJ Library). See [[cal.1966-06-01.vietnam-congress]]. Names: Johnson, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-06-16.vietnam-congress
      when: June 16
      date: '1966-06-16'
      thread: vietnam-congress
      c: 'Mansfield in the Senate: Rusk to meet China''s Foreign Minister to seek an end to the war. "Peace in Vietnam and peace in China ... are very closely interrelated, if not, indeed, inseparable." The White House: the President welcomes suggestions; Rusk and others to review it.'
      n: '[[w.gibbons-u-s-government-and]], IV, 327–28. To check: *New York Times*, June 17, 1966. See [[cal.1966-04-18.vietnam-congress]]. Names: Mansfield, Rusk.'
      tags:
      - name:mansfield-mike
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-06-18.vietnam
      when: June 18
      date: '1966-06-18'
      thread: vietnam
      c: 'News conference: the alternatives examined, "including all suggestions from those who have not shared our views"; "the national interest requires that we persist in our present policy." Forces and operations may increase. Hanoi''s hopes rest "more on political differences in Saigon and Washington than on his military capacity."'
      n: 'The President''s News Conference, [1966 Pub. Papers 625](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=701) (June 18, 1966). [[w.gibbons-u-s-government-and]], IV, 344–45. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-22.vietnam-congress
      when: June 22
      date: '1966-06-22'
      thread: vietnam-congress
      c: 'Johnson''s reply to Mansfield, written by Rostow: peace will come once Hanoi is convinced "that we are not weak; that we are not impatient; that we are not going to falter; that they cannot win." Mansfield answers June 25, restating his view; Johnson acknowledges it June 30 without comment.'
      n: '[[w.gibbons-u-s-government-and]], IV, 327. To check: Johnson to Mansfield, June 22, 1966; Mansfield to Johnson, June 25 (LBJ Library, NSF Files of Mike Mansfield); Johnson to Mansfield, June 30 (LBJ Library, WHCF, ND 19/CO 312). See [[cal.1966-06-13.vietnam-congress]]. Names: Johnson, Mansfield, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1966-06-28.vietnam-congress
      when: June 28
      date: '1966-06-28'
      thread: vietnam-congress
      c: 'Mansfield with the Democratic chairmen, Russell and Fulbright among them, an hour and three-quarters, then the junior Democrats, three hours, on the war. His report to Johnson, June 29: general support for the President; deep concern that no way has been found to end the war; no sentiment for immediate withdrawal; "a strong conviction that candidates of the Democratic Party will be hurt by the war."'
      n: '[[w.gibbons-u-s-government-and]], IV, 348–50. To check: Mansfield to Johnson, June 29, 1966, and his report on the meetings (LBJ Library, NSF Files of Mike Mansfield). Names: Mansfield, Russell, Fulbright, Johnson.'
      tags:
      - name:mansfield-mike
      - name:russell-richard-b
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-06-28.vietnam-congress-2
      when: June 28
      date: '1966-06-28'
      thread: vietnam-congress
      c: 'Marcy calls Rostow for a reply to Fulbright on the Princeton study. Rostow: some useful suggestions; it should not be published now. His memorandum to Johnson that night: study it respectfully, keep "a good arm''s length" from neutralization. Johnson, instead of a letter, has Moyers tell Marcy that Rusk will be in touch with Fulbright.'
      n: '[[w.gibbons-u-s-government-and]], IV, 346–47. To check: Marcy to Fulbright, June 29, 1966 (National Archives, RG 46, Marcy Chron File); Rostow to Johnson, June 28, with Moyers''s note (LBJ Library, Files of Walt Rostow). See [[cal.1966-06-06.vietnam-congress]]. Names: Marcy, Rostow, Fulbright, Johnson, Moyers, Rusk.'
      tags:
      - name:marcy-carl
      - name:rostow-walt-w
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-06-29.vietnam-congress
      when: June 29
      date: '1966-06-29'
      thread: vietnam-congress
      c: 'Fulbright invites sixteen Senators to an informal meeting on the war: Democrats Bartlett, Burdick, Church, Clark, Gore, Gruening, Hartke, McCarthy, McGovern, Metcalf, Moss, Nelson, Neuberger and Stephen Young; Republicans Aiken and Cooper. Not Mansfield or Morse.'
      n: '[[w.gibbons-u-s-government-and]], IV, 347–48. To check: Marcy to Fulbright, June 29, 1966 (National Archives, RG 46). Names: Fulbright, Bartlett, Burdick, Church, Clark, Gore, Gruening, Hartke, McCarthy, McGovern, Metcalf, Moss, Nelson, Neuberger, Stephen Young, Aiken, Cooper, Mansfield, Morse.'
