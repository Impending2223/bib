- add:
    entry:
      id: cal.1967-03-24.vietnam-congress
      when: Mar. 24
      date: '1967-03-24'
      thread: vietnam-congress
      c: 'Wheeler to Westmoreland, back channel, on his coming home: Fulbright will try to get him before the committee, perhaps "in an open hearing complete with TV and Radio"; "the problem is to keep you away from all congressional committees."'
      n: '[[w.gibbons-u-s-government-and]], IV, 618–19. To check: Wheeler to Westmoreland, JCS 2218-67, Mar. 24, 1967 (Center of Military History, Westmoreland Papers). Names: Wheeler, Westmoreland, Fulbright.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-04-24.vietnam-2
      when: Apr. 24
      date: '1967-04-24'
      thread: vietnam
      c: 'Rusk to Brandt, privately: stronger in Vietnam "on the military side," but no sign of peace from Hanoi; the trouble at home "not with the ''doves,''" but the growing impatience of Americans, 2,500 killed since January. "Something must give, and give shortly."'
      n: '[[w.gibbons-u-s-government-and]], IV, 612–13. To check: memorandum of conversation, Rusk and Brandt, Apr. 24, 1967 (State, Central File, Pol 27 Viet S). Names: Rusk, Brandt.'
      tags:
      - name:rusk-dean
      - name:brandt-willy
- add:
    entry:
      id: cal.1967-04-24.vietnam-program-5
      when: Apr. 24
      date: '1967-04-24'
      thread: vietnam-program-5
      c: 'After the Non-Group of Apr. 21, Katzenbach to Vance, Walt Rostow, William Bundy, McNaughton, Helms and Komer: papers in three weeks on Westmoreland''s request, the situation and the actions open, negotiations, the effects of a wider war; pacification added. State to report on "domestic support" and a "head count" of Congress.'
      n: '[[w.gibbons-u-s-government-and]], IV, 620–21. To check: Katzenbach''s memorandum, Apr. 24, 1967, and the papers'' descriptions (State, Central File, Pol 27 Viet S). See [[cal.1967-03-18.vietnam]]. Names: Katzenbach, Vance, Walt Rostow, William Bundy, McNaughton, Helms, Komer, Westmoreland.'
      tags:
      - name:katzenbach-nicholas
      - name:vance-cyrus
      - name:rostow-walt-w
      - name:bundy-william
      - name:mcnaughton-john-t
      - name:helms-richard
      - name:komer-robert-w
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-04-24.vietnam-program-5-2
      when: Apr. 24
      date: '1967-04-24'
      thread: vietnam-program-5
      c: 'Komer, leaving for Saigon, "Thoughts on Future Strategy in Vietnam": Hanoi unlikely to negotiate; more bombing or mining would not make it "Cry Uncle"; "the Critical Variable is in the South!" More from the South Vietnamese forces, not more American troops; in 12 to 18 months perhaps "a few troops home."'
      n: 'FRUS 1964–68, V, doc. [147](https://history.state.gov/historicaldocuments/frus1964-68v05/d147). [[w.gibbons-u-s-government-and]], IV, 621–22. Made public: FRUS 1964–68, V (2002). See [[cal.1967-04-24.vietnam-program-5]]. Names: Komer.'
      tags:
      - name:komer-robert-w
- add:
    entry:
      id: cal.1967-04-25.vietnam-congress
      when: Apr. 25
      date: '1967-04-25'
      thread: vietnam-congress
      also:
      - war-opposition
      c: 'The Senate on Westmoreland''s speech. McGovern: the administration "now trying to blame their failure on those who have warned them all along." Fulbright: a "final drive" for more men and a military victory; dissent to be met with "implications of treason." Holland: invite Westmoreland before the committees.'
      n: '[113 Cong. Rec., Senate, Apr. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt8/pdf/GPO-CRECB-1967-pt8-7-1.pdf), 10611, 10618–22 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 618. See [[cal.1967-04-24.vietnam]]. Names: Westmoreland, McGovern, Fulbright, Holland.'
      tags:
      - name:westmoreland-william
      - name:mcgovern-george
      - name:fulbright-j-william
      - name:holland-spessard-l
- add:
    entry:
      id: cal.1967-04-27.vietnam-congress
      when: Apr. 27
      date: '1967-04-27'
      thread: vietnam-congress
      c: 'Fulbright in the Senate: the committee''s invitation to Westmoreland declined, his schedule too full. Symington: if he has time for talks in Washington and New York, he should answer the Armed Services Committee. Morton: is he here "to put a sort of a sack ... over discussion"?'
      n: '[113 Cong. Rec., Senate, Apr. 27, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt8/pdf/GPO-CRECB-1967-pt8-9-1.pdf), 11042, 11049–51 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 618–19. See [[cal.1967-03-24.vietnam-congress]]. Names: Fulbright, Westmoreland, Symington, Morton.'
      tags:
      - name:fulbright-j-william
      - name:westmoreland-william
      - name:symington-william-s
      - name:morton-thruston-b
- add:
    entry:
      id: cal.1967-04-28.vietnam-congress
      when: Apr. 28
      date: '1967-04-28'
      thread: vietnam-congress
      c: 'The Senate after Westmoreland''s address. Morse: "Wrapping a bad policy in the American flag does not improve its chances for success one iota." Mansfield: no field commander has had to look over his shoulder to see if he is "supported."'
      n: '[113 Cong. Rec., Senate, Apr. 28, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-1-2.pdf), 11186–87, 11194 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 619. See [[cal.1967-04-28.vietnam]]. Names: Westmoreland, Morse, Mansfield.'
      tags:
      - name:westmoreland-william
      - name:morse-wayne
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-05-01.vietnam-program-5
      when: May 1
      date: '1967-05-01'
      thread: vietnam-program-5
      c: 'William Bundy to Katzenbach: against a large increase and a call-up, whose debate "could only encourage Hanoi"; against mining Haiphong; "totally against" invading the North, a 75–25 chance of bringing China in. A steady program for nine months: the "very jerky and impatient impression" given Hanoi since December.'
      n: 'FRUS 1964–68, V, doc. [154](https://history.state.gov/historicaldocuments/frus1964-68v05/d154). [[w.gibbons-u-s-government-and]], IV, 622–23. Made public: [[w.pentagon-papers]] (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: William Bundy, Katzenbach.'
      tags:
      - name:bundy-william
      - name:katzenbach-nicholas
- add:
    entry:
      id: cal.1967-05-01.vietnam-program-5-2
      when: May 1
      date: '1967-05-01'
      thread: vietnam-program-5
      c: 'Enthoven to McNamara, "Increase of Southeast Asia Forces": an enemy that "just may have found a dangerously clever strategy for licking the United States," holding its losses to what it can bear while waiting for American opinion to turn. More combat forces "a step in the wrong direction."'
      n: 'FRUS 1964–68, V, doc. [155](https://history.state.gov/historicaldocuments/frus1964-68v05/d155) (editorial note). [[w.gibbons-u-s-government-and]], IV, 627–29. Made public: [[w.pentagon-papers]], IV, 463–68 (1971). See [[cal.1967-04-24.vietnam-program-5]]. Names: Enthoven, McNamara.'
      tags:
      - name:enthoven-alain-c
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-05-02.vietnam-2
      when: May 2
      date: '1967-05-02'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Tuesday lunch, 1:27 to 2:50 p.m., Johnson with Rusk, McNamara, Rostow and Christian. On the agenda McNamara''s proposal: finish the major targets, the power plants of Hanoi and Haiphong; then shift the bombing south of the 20th parallel, the Russians "quietly notified"; and Mansfield''s U.N. approach, put off at least to June, by Sisco''s memorandum of May 12. No notes.'
      n: '[[w.gibbons-u-s-government-and]], IV, 631, 678–79. To check: the agenda (LBJ Library, NSF Files of Walt W. Rostow); Sisco to Rusk, May 12, 1967 (State, Central File, Pol 27 Viet S). Names: Johnson, Rusk, McNamara, Rostow, Christian, Mansfield, Sisco.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:christian-george
      - name:mansfield-mike
      - name:sisco-joseph-j
- add:
    entry:
      id: cal.1967-05-03.vietnam-program-5
      when: May 3
      date: '1967-05-03'
      thread: vietnam-program-5
      c: 'McGeorge Bundy to Johnson: more troops and escalation "inevitable, in the framework of strictly military analysis," but a mistake; tactical bombing yes, the power plants no, hit "because we have ''run out'' of other targets"; a publicly proclaimed limit, Norstad and Bradley to rally the generals. "The present issue is not ''negotiation.'' It is ''escalation.''" The *New York Times* the same day reports Westmoreland''s request.'
      n: 'FRUS 1964–68, V, doc. [157](https://history.state.gov/historicaldocuments/frus1964-68v05/d157). [[w.gibbons-u-s-government-and]], IV, 623–26, 631 (the *Times*). Made public: [[w.pentagon-papers]], IV, 157–60 (1971). To check: *New York Times*, May 3 and 4, 1967. See [[cal.1967-04-24.vietnam-program-5]]. Names: McGeorge Bundy, Johnson, Norstad, Bradley, Westmoreland.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:norstad-lauris
      - name:bradley-omar-n
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-05-04.vietnam
      when: May 4
      date: '1967-05-04'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Lunch, 1:32 to 3:00 p.m., Johnson with Rusk, McNamara, Rostow, McPherson and Christian: the power plants of Hanoi and Haiphong, and the cutback to follow. Put off, by Rostow''s note on his agenda.'
      n: '[[w.gibbons-u-s-government-and]], IV, 631. To check: the agenda (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-05-02.vietnam-2]]. Names: Johnson, Rusk, McNamara, Rostow, McPherson, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:mcpherson-harry
      - name:christian-george
- add:
    entry:
      id: cal.1967-05-06.vietnam
      when: May 6
      date: '1967-05-06'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Rostow, "U.S. Strategy in Vietnam," to Johnson, Rusk, Vance, Katzenbach, McNaughton, William Bundy and Helms: strike the Hanoi power plant, but not "the top of the funnel," the ports and the railways to China; then shift the bombing south of the 20th parallel, with strikes in the north as needed.'
      n: 'FRUS 1964–68, V, doc. [162](https://history.state.gov/historicaldocuments/frus1964-68v05/d162). [[w.gibbons-u-s-government-and]], IV, 632–33. Made public: FRUS 1964–68, V (2002). See [[cal.1967-05-02.vietnam-2]]. Names: Rostow, Johnson, Rusk, Vance, Katzenbach, McNaughton, William Bundy, Helms.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:vance-cyrus
      - name:katzenbach-nicholas
      - name:mcnaughton-john-t
      - name:bundy-william
      - name:helms-richard
- add:
    entry:
      id: cal.1967-05-09.vietnam-congress
      when: May 9
      date: '1967-05-09'
      thread: vietnam-congress
      c: 'Senators against invading the North. Morton: "I do not know of any member of this body who wants an invasion of North Vietnam"; Cooper with him. Symington: more troops, more casualties, a clash with China; "The results of such action on our part, therefore, are incalculable."'
      n: '[113 Cong. Rec., Senate, May 9, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-7-2.pdf), 12113 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 617. Check: Gibbons puts it "toward the end of May"; his page is in the Senate''s day of May 9. See [[cal.1967-04-27.vietnam-program-5]]. Names: Morton, Cooper, Symington.'
      tags:
      - name:morton-thruston-b
      - name:cooper-john-sherman
      - name:symington-william-s
- add:
    entry:
      id: cal.1967-05-16.vietnam
      when: May 16
      date: '1967-05-16'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Tuesday lunch, 1:10 to 3:05 p.m., Johnson with Humphrey, Rusk, McNamara, Rostow, Helms, Wheeler and Christian, on bombing the Hanoi power plant. No notes. Kohler to Rusk the same day: drop it for good, inconsistent with seeking Moscow''s help toward talks.'
      n: '[[w.gibbons-u-s-government-and]], IV, 636. To check: the agenda (LBJ Library, Files of Walt W. Rostow); Kohler''s memorandum, May 16, 1967 (State, Central File, Pol 27 Viet S). See [[cal.1967-05-02.vietnam-2]]. Names: Johnson, Humphrey, Rusk, McNamara, Rostow, Helms, Wheeler, Christian, Kohler.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
