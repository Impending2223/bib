- add:
    entry:
      id: cal.1967-04-17.vietnam
      when: Apr. 17
      date: '1967-04-17'
      thread: vietnam
      also:
      - elections-1968
      c: 'Nixon in Saigon: political leaders who criticize the war, Mansfield and Robert Kennedy among them, are "prolonging the war"; the defeat of the Communist forces in the South "inevitable. The only question is, how soon?"'
      n: '[[w.gibbons-u-s-government-and]], IV, 698. To check: *New York Times*, Apr. 18, 1967. Names: Nixon, Mansfield, Robert Kennedy.'
      tags:
      - name:nixon-richard-m
      - name:mansfield-mike
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1967-04-24.war-opposition
      when: Apr. 24
      date: '1967-04-24'
      thread: war-opposition
      c: 'King and Rauh of the ADA announce Negotiations Now!: a million signatures on a petition to Johnson to end the bombing of the North and negotiate a truce.'
      n: '[[w.gibbons-u-s-government-and]], IV, 698. To check: *New York Times*, Apr. 25, 1967; [[w.zaroulis-who-spoke-up]], 117–18. Names: Martin Luther King, Rauh, Johnson.'
      tags:
      - name:king-martin-luther-jr
      - name:rauh-joseph-l-jr
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-04-25.vietnam
      when: Apr. 25
      date: '1967-04-25'
      thread: vietnam
      also:
      - war-opposition
      c: 'Bonn, at the luncheon after Adenauer''s funeral, by Rostow''s note: Erlander "desperately anxious" to explain to Johnson why Sweden''s laws let the Russell Tribunal meet there. Johnson sends Rostow in the night to find him and hear him out.'
      n: '[[w.gibbons-u-s-government-and]], IV, 701 (Rostow''s note in the Daily Diary, Apr. 25, 1967). Check: whether "the Prime Minister of Sweden" Gibbons names is Erlander. Names: Erlander, Johnson, Rostow, Adenauer.'
      tags:
      - name:erlander-tage
      - name:johnson-lyndon-b
      - name:rostow-walt-w
      - name:adenauer-konrad
- add:
    entry:
      id: cal.1967-04-29.vietnam-congress
      when: Apr. 29
      date: '1967-04-29'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, "Vietnam": invite Hanoi, the NLF and China with Saigon to put their views to the Security Council; ask the World Court''s advisory opinion on the Geneva accords'' bearing. The bombing makes Hanoi ever more dependent on China; "the road to settlement with Hanoi, now, very likely runs by way of Peking." He offers to approach Peking himself.'
      n: '[[w.gibbons-u-s-government-and]], IV, 677. To check: Mansfield to Johnson, Apr. 29, 1967 (LBJ Library, NSF Name File, Mansfield). Names: Mansfield, Johnson.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-04-30.vietnam-congress
      when: Apr. 30
      date: '1967-04-30'
      thread: vietnam-congress
      c: 'Rostow to Johnson on Mansfield''s proposal: Katzenbach and Goldberg "agree it''s a gimmick. Nick leans against; Arthur for." Rusk: ready to take it to the Security Council, but Thant and others will oppose; the World Court lacks jurisdiction; "strongly opposed" to a Mansfield mission to China, Mansfield being "an officer of the United States Government."'
      n: '[[w.gibbons-u-s-government-and]], IV, 677–78. To check: Rostow''s two memoranda to Johnson, Apr. 30, 1967 (LBJ Library, NSF Name File, Mansfield). See [[cal.1967-04-29.vietnam-congress]]. Names: Rostow, Johnson, Mansfield, Katzenbach, Goldberg, Rusk.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:katzenbach-nicholas
      - name:goldberg-arthur-j
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-05-01.vietnam-congress
      when: May 1
      date: '1967-05-01'
      thread: vietnam-congress
      c: Breakfast, 8:30 to 10:03 a.m., Johnson with Mansfield and Morse on the U.N. approach; Rusk, Rostow, Katzenbach, Goldberg and Califano with him. No record.
      n: '[[w.gibbons-u-s-government-and]], IV, 678. See [[cal.1967-04-29.vietnam-congress]]. Names: Johnson, Mansfield, Morse, Rusk, Rostow, Katzenbach, Goldberg, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:morse-wayne
      - name:rusk-dean
      - name:rostow-walt-w
      - name:katzenbach-nicholas
      - name:goldberg-arthur-j
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1967-05-03.vietnam-congress
      when: May 3
      date: '1967-05-03'
      thread: vietnam-congress
      c: 'A second breakfast, 8:30 to 9:55 a.m., Johnson with Mansfield, Morse, Rusk, Rostow, Katzenbach and Goldberg. No notes. Mansfield to Johnson after it, on Katzenbach''s word "phony": he wants "no part of any ''phony'' proposal"; a bona fide one could be taken for one by its tone, a new military enterprise beside it, or leaks.'
      n: '[[w.gibbons-u-s-government-and]], IV, 679–80. To check: Mansfield to Johnson, May 3, 1967 (LBJ Library, NSF Files of Mike Mansfield). See [[cal.1967-05-01.vietnam-congress]]. Names: Johnson, Mansfield, Morse, Rusk, Rostow, Katzenbach, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:morse-wayne
      - name:rusk-dean
      - name:rostow-walt-w
      - name:katzenbach-nicholas
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1967-05-04.vietnam-congress
      when: May 4
      date: '1967-05-04'
      thread: vietnam-congress
      c: 'Johnson, by an unsigned note passed to Christian: Christian should one day have a statement that the President "is not going to argue with Fulbright"; "This man is doing everything he can to create problems for the President." Fulbright had asked Rusk, Apr. 27, to testify in public; Rusk, May 2: in executive session.'
      n: '[[w.gibbons-u-s-government-and]], IV, 680–81. To check: the note, May 4, 1967 (LBJ Library, Ex FG 1 ND 19/CO 312); Rusk to Fulbright, May 2, 1967 (State, Lot File 74 D 164). Names: Johnson, Christian, Fulbright, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:christian-george
      - name:fulbright-j-william
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-05-11.vietnam-congress
      when: May 11
      date: '1967-05-11'
      thread: vietnam-congress
      c: 'Morton in the Senate, on pacification put under Westmoreland: American troops in pacification "could very well become another step in the Americanization of the entire conflict"; the war "an almost unbroken series of promising programs followed by disappointing results followed by increased U.S. involvement."'
      n: '[113 Cong. Rec., Senate, May 11, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt9/pdf/GPO-CRECB-1967-pt9-9-2.pdf), 12494 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 684–85. See [[cal.1967-05-09.vietnam]]. Names: Morton, Westmoreland.'
      tags:
      - name:morton-thruston-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-05-12.vietnam-congress
      when: May 12
      date: '1967-05-12'
      thread: vietnam-congress
      also:
      - vietnam-air-war
      c: 'Dinner at the White House, Johnson, Russell, Mrs. Johnson and McPherson. Johnson''s three choices: more bombing in the North; the DMZ alone; the 17th to the 20th parallel made "a desert." Russell: "We''ve just got to finish it soon," blockade the ports. Johnson: that would bring war sooner than anything; of the Hanoi power plant, half a mile from Hồ''s headquarters, "Suppose we missed."'
      n: '[[w.gibbons-u-s-government-and]], IV, 685–86 (notes typed on the Daily Diary for May 12 by a secretary present). To check: the Daily Diary, May 12, 1967 (LBJ Library). Names: Johnson, Russell, Lady Bird Johnson, McPherson, Hồ Chí Minh.'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
      - name:johnson-lady-bird
      - name:mcpherson-harry
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1967-05-15.vietnam-congress
      when: May 15
      date: '1967-05-15'
      thread: vietnam-congress
      c: 'Cooper in the Senate: more force may shut off talks and bring in China and the Soviet Union, "the dread possibility" of a third world war. Confine the bombing to the southern panhandle; if Hanoi shows interest, stop it. Milton Young finds "much merit"; Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson and Morse with him.'
      n: '[113 Cong. Rec., Senate, May 15, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-1-1.pdf), 12578–610 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 683–85. To check: *New York Times*, May 16, 1967. Names: Cooper, Young, Morton, McCarthy, Mansfield, Church, Aiken, Fulbright, Pell, Carlson, Morse.'
      tags:
      - name:cooper-john-sherman
      - name:young-milton-r
      - name:morton-thruston-b
      - name:mccarthy-eugene-j
      - name:mansfield-mike
      - name:church-frank
      - name:aiken-george-d
      - name:fulbright-j-william
      - name:pell-claiborne-d
      - name:carlson-frank
      - name:morse-wayne
- add:
    entry:
      id: cal.1967-05-17.vietnam-congress
      when: May 17
      date: '1967-05-17'
      thread: vietnam-congress
      c: 'Sixteen Senators led by Church, the text coordinated with State, "A Plea for Realism": for a negotiated settlement, but "steadfastly opposed to any unilateral withdrawal"; no "misconceptions in Hanoi." Cooper and Hatfield the Republicans; eighteen House Democrats with them.'
      n: '[113 Cong. Rec., Senate, May 17, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-3-1.pdf), 13011–13 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 686. To check: *New York Times*, May 17 and 18, 1967. Names: Church, Cooper, Hatfield.'
      tags:
      - name:church-frank
      - name:cooper-john-sherman
      - name:hatfield-mark-o
- add:
    entry:
      id: cal.1967-05-17.vietnam-support
      when: May 17
      date: '1967-05-17'
      thread: vietnam-support
      c: 'Rowe to Johnson, "Vietnam and a ''Third Force,''" with McPherson and Roche, at Louis Martin''s instigation: a committee of independents, Republicans and intellectuals as a "rally ground"; "It is elementary that this is an unpopular war." Califano: "This looks like a great idea to me."'
      n: '[[w.gibbons-u-s-government-and]], IV, 701–02. To check: Rowe to Johnson, May 17, 1967 (LBJ Library, C.F. ND 19/CO 312). See [[cal.1967-03-17.vietnam-support]]. Names: Rowe, Johnson, McPherson, Roche, Califano.'
      tags:
      - name:rowe-james-h-jr
      - name:johnson-lyndon-b
      - name:mcpherson-harry
      - name:roche-john-p
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1967-05-17.war-opposition
      when: May 17–19
      date: '1967-05-17'
      thread: war-opposition
      c: 'Spock, Coretta King and Bevel of the Spring Mobilization at the White House gate, asking to see Johnson; a petition read. May 18, Bevel''s letter asking him to address their conference. Johnson: "Walt. Have Moose reply." May 19, Moose declines and hears out their speakers.'
      n: '[[w.gibbons-u-s-government-and]], IV, 699. To check: the documents (LBJ Library, NSF Country File, Vietnam). Names: Spock, Coretta King, Johnson, Rostow, Moose.'
      tags:
      - name:spock-benjamin
      - name:king-coretta-scott
      - name:johnson-lyndon-b
      - name:rostow-walt-w
      - name:moose-richard-m
- add:
    entry:
      id: cal.1967-05-17.opinion-2
      when: May 17
      date: '1967-05-17'
      thread: opinion
      also:
      - vietnam
      c: 'Harris Survey: "total military victory" 45 percent, 43 in February; withdrawal of both sides'' forces under U.N. supervision 41, 44 in February. A long war 81. Johnson''s handling of the war approved 70; the bombing helping to win it 55, 61 in February.'
      n: '[[w.gibbons-u-s-government-and]], IV, 692. To check: *New York Times*, May 17, 1967. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-05-18.vietnam
      when: May 18
      date: '1967-05-18'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'News conference. On the United Nations, after Mansfield''s speeches: "we will welcome any constructive action that they could take or get our adversaries to take"; "our objectives are the same and our determination is just as strong as it has ever been."'
      n: 'The President''s News Conference, [1967 Pub. Papers 541](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=609) (May 18, 1967). [[w.gibbons-u-s-government-and]], IV, 680 (and Mansfield''s speeches of May 15, 18 and 24, 113 Cong. Rec. 12593–94, 13213–14, 13728). See [[cal.1967-04-29.vietnam-congress]]. Names: Johnson, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-05-18.vietnam-congress
      when: May 18
      date: '1967-05-18'
      thread: vietnam-congress
      c: 'Fulbright at lunch with Russell, on Marcy''s points: the two committees'' duty to advise on the national interest; a joint subcommittee of five each to hold public hearings on Vietnam; a sense-of-the-Senate resolution; a joint call on Johnson. No notes.'
      n: '[[w.gibbons-u-s-government-and]], IV, 681–83. To check: Marcy to Fulbright, May 16 and 18, 1967 (National Archives, RG 46, Marcy Chron File). Names: Fulbright, Russell, Marcy, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:russell-richard-b
      - name:marcy-carl
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-05-19.vietnam-congress
      when: May 19
      date: '1967-05-19'
      thread: vietnam-congress
      c: 'Fulbright to Russell, with Marcy''s draft for joint hearings: the American interest in Southeast Asia; what it would bear in men and materiel; China and Russia. Witnesses: Rusk, McNamara, Rostow, Taylor, Wheeler; Bradley, Commager, Fairbank. By hand: the hearings would make the executive "examine their premises." None held.'
      n: '[[w.gibbons-u-s-government-and]], IV, 682–83. To check: Fulbright to Russell, May 19, 1967 (National Archives, RG 46). See [[cal.1967-05-18.vietnam-congress]]. Names: Fulbright, Russell, Marcy, Rusk, McNamara, Rostow, Taylor, Wheeler, Bradley, Fairbank.'
      tags:
      - name:fulbright-j-william
      - name:russell-richard-b
      - name:marcy-carl
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:taylor-maxwell
      - name:wheeler-earle
      - name:bradley-omar-n
      - name:fairbank-john-k
- add:
    entry:
      id: cal.1967-05-22.vietnam-support
      when: May 22
      date: '1967-05-22'
      thread: vietnam-support
      c: Luncheon at the White House, Johnson with sixteen "intellectuals" of his own administration, Gardner, Schultze, Ackley, Okun, Brzezinski, Enthoven, Harold Brown and Roche among them, on his trouble reaching the intellectuals. By the *Times*'s account, puzzled by their alienation; perhaps they want him "to agonize about his problems in public."
      n: '[[w.gibbons-u-s-government-and]], IV, 700. To check: *New York Times*, May 22, 1967 (Max Frankel). Names: Johnson, Gardner, Schultze, Ackley, Okun, Brzezinski, Enthoven, Harold Brown, Roche.'
      tags:
      - name:johnson-lyndon-b
      - name:gardner-john-w
      - name:schultze-charles-l
      - name:ackley-gardner
      - name:okun-arthur-m
      - name:brzezinski-zbigniew
      - name:enthoven-alain-c
      - name:brown-harold
      - name:roche-john-p
- add:
    entry:
      id: cal.1967-05-23.vietnam-congress
      when: May 23
      date: '1967-05-23'
      thread: vietnam-congress
      c: 'Morton in the Senate, after the Harris Survey: what "total military victory" would mean, pacification by Americans, half a million to two million men, the North invaded, China. "An unhealthy and unproductive war fever is mounting"; "there is going to be hell to pay if we settle for anything less."'
      n: '[113 Cong. Rec., Senate, May 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf), 13534–35 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 686–87. See [[cal.1967-05-17.opinion-2]]. Names: Morton.'
      tags:
      - name:morton-thruston-b
- add:
    entry:
      id: cal.1967-05-23.vietnam-congress-2
      when: May 23
      date: '1967-05-23'
      thread: vietnam-congress
      c: 'Pell in the Senate: "cool it down, to slow down." Stop the bombing and hold the troops; curtail search and destroy; then free elections open to all, eventual withdrawal, an amnesty, pacification back to civilians; talks with the Viet Cong; a neutralized Southeast Asia. Mansfield, Morse and Gore praise it.'
      n: '[113 Cong. Rec., Senate, May 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-7-1.pdf), 13498–502 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 687–89. Names: Pell, Mansfield, Morse, Gore.'
      tags:
      - name:pell-claiborne-d
      - name:mansfield-mike
      - name:morse-wayne
      - name:gore-albert-sr
- add:
    entry:
      id: cal.1967-06-19.vietnam-congress
      when: June 19
      date: '1967-06-19'
      thread: vietnam-congress
      c: 'Paris. Pell, by Air France, with Mai Văn Bộ, Hanoi''s delegate, an hour and a half, Manac''h having arranged it; Dean of the embassy and Bohlen had discouraged it, Harriman too. Bộ: talks if and when the bombing ends "without condition"; of a freeze on forces or "mutual deescalation," he "took note." Back the same day.'
      n: '[[w.gibbons-u-s-government-and]], IV, 689–91 (Pell''s memorandum of the conversation, June 20, 1967, in his papers; his account, CRS interview, Jan. 24, 1979). See [[cal.1967-05-23.vietnam-congress-2]]. Names: Pell, Mai Văn Bộ, Manac''h, Bohlen, Harriman.'
      tags:
      - name:pell-claiborne-d
      - name:mai-van-bo
      - name:manach-etienne-m
      - name:bohlen-charles-e
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1967-06-20.vietnam-congress
      when: June 20
      date: '1967-06-20'
      thread: vietnam-congress
      c: 'Pell with Rostow, his memorandum on Bộ for Johnson; he asks to see the President. Rostow to Johnson: Pell "disappointed"; the bombing hard to stop while Hanoi violates the DMZ; Pell: hence "mutual deescalation."'
      n: '[[w.gibbons-u-s-government-and]], IV, 691. To check: Rostow to Johnson, June 20, 1967 (LBJ Library, Memos to the President—Walt Rostow). See [[cal.1967-06-19.vietnam-congress]]. Names: Pell, Rostow, Mai Văn Bộ, Johnson.'
      tags:
      - name:pell-claiborne-d
      - name:rostow-walt-w
      - name:mai-van-bo
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-07-13.vietnam-congress
      when: July 13
      date: '1967-07-13'
      thread: vietnam-congress
      c: Pell with Johnson, 11:25 to 11:55 a.m., on his talk with Bộ. By Pell's account, Johnson "could not have been more courteous."
      n: '[[w.gibbons-u-s-government-and]], IV, 691 (Pell''s account, CRS interview, Jan. 24, 1979). See [[cal.1967-06-19.vietnam-congress]]. Names: Pell, Johnson, Mai Văn Bộ.'
      tags:
      - name:pell-claiborne-d
      - name:johnson-lyndon-b
