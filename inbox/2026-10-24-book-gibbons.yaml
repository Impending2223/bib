- add:
    entry:
      id: cal.1967-08-10.vietnam-congress
      when: Aug. 10
      date: '1967-08-10'
      thread: vietnam-congress
      also:
      - vietnam-elections
      c: 'Fifty-seven House Democrats, Yates and Bingham leading, to Johnson on South Vietnam''s campaign: make "the strongest representations"; if Saigon will not assure free and fair elections, it should be told the United States "may very well undertake a serious reappraisal of its policies."'
      n: '[[w.gibbons-u-s-government-and]], IV, 772 (the letter, 113 Cong. Rec. 22262–63). Names: Yates, Bingham, Johnson.'
      tags:
      - name:yates-sidney-r
      - name:bingham-jonathan-b
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-11.vietnam-pennsylvania
      when: Aug. 11
      date: '1967-08-11'
      thread: vietnam-pennsylvania
      c: 'Johnson approves the message for Hanoi: the United States "willing to stop the aerial and naval bombardment of North Vietnam if this will lead promptly to productive discussions"; Hanoi assumed not to take advantage of it.'
      n: '[[w.gibbons-u-s-government-and]], IV, 778–79. To check: [[w.herring-secret-diplomacy-of-the]], 726. See [[cal.1967-08-08.vietnam]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-19.vietnam-pennsylvania
      when: Aug. 19
      date: '1967-08-19'
      thread: vietnam-pennsylvania
      also:
      - vietnam-air-war
      c: 'Johnson with Rusk, McNamara, Rostow and Wheeler, 8:35 to 9:55 p.m.: the ten-mile limit around Hanoi restored for ten days, for Marcovich and Aubrac''s visit. Rusk: a few days ago one chance in a hundred of secret contact, "today ... one chance in 50"; McNamara: one in ten. Kissinger tells them, from Aug. 24.'
      n: '[[w.gibbons-u-s-government-and]], IV, 779 (Jim Jones''s notes). To check: [[w.herring-secret-diplomacy-of-the]], 729. Check: Gibbons dates the restriction from Aug. 21 in one place and from Aug. 24 in another (IV, 748, 779). See [[cal.1967-08-17.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Wheeler, Marcovich, Aubrac, Kissinger.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:wheeler-earle
      - name:marcovich-hebert
      - name:aubrac-raymond
      - name:kissinger-henry-a
- add:
    entry:
      id: cal.1967-09-12.vietnam-pennsylvania
      when: Sept. 12
      date: '1967-09-12'
      thread: vietnam-pennsylvania
      c: 'Tuesday lunch, 1:25 to 3:10 p.m., Johnson with Rusk, McNamara, Rostow, Christian, Harold Johnson and Jim Jones, on Hanoi''s rejection of Sept. 11. Is Kissinger "a dove and a critic of our policy"? Rusk: he "is for us." Johnson: "why shouldn''t we quit explaining so much and just say we will stop bombing, if a conference is arranged"? The words in question dropped; the channel kept. Of Mansfield''s plan for the UN, Rusk: "a nose count at the UN indicated that it just won''t work." Harold Johnson to have the Chiefs "search for imaginative ideas" to end the war, not more men or the atom bomb.'
      n: 'Jones''s notes, [FRUS 1964–68, V, doc. 317](https://history.state.gov/historicaldocuments/frus1964-68v05/d317). [[w.gibbons-u-s-government-and]], IV, 780–81, 797, 917, 925. Made public: FRUS 1964–68, V (2002). See [[cal.1967-09-08.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Harold K. Johnson, Jim Jones, Kissinger, Mansfield.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:christian-george
      - name:johnson-harold-k
      - name:kissinger-henry-a
      - name:mansfield-mike
      - name:jones-jim
- add:
    entry:
      id: cal.1967-09-26.vietnam-pennsylvania-2
      when: Sept. 26
      date: '1967-09-26'
      thread: vietnam-pennsylvania
      c: 'Katzenbach to Johnson, "Negotiation with North Vietnam," as asked at lunch, his own view: Paris "the closest thing we have yet had to establishing a dialogue"; keep Hanoi unbombed at least until Bộ refuses to see Kissinger; "test that possibility to the hilt."'
      n: '[[w.gibbons-u-s-government-and]], IV, 782–83. To check: the memorandum (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-09-26.vietnam-pennsylvania]]. Names: Katzenbach, Johnson, Mai Văn Bộ, Kissinger.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - name:mai-van-bo
      - name:kissinger-henry-a
- add:
    entry:
      id: cal.1967-10-03.vietnam
      when: Oct. 3
      date: '1967-10-03'
      thread: vietnam
      also:
      - vietnam-pennsylvania
      c: 'Johnson with Rusk, McNamara, Rostow, Helms, Christian and Tom Johnson, 6:10 to 9:32 p.m. Rusk, from the United Nations: no one can say what would follow a halt; Moscow has given up trying to move Hanoi. Johnson: no halt unless Hanoi agrees to meet promptly and push for a settlement. Rostow: the bombing costly to Hanoi; McNamara: "I do not agree." From the Friendly Five reports: all "think that we will lose the election if we do not do something about Vietnam quick." Rusk: "You must not go down." Of the march on the Pentagon: "They are not going to run me out of town."'
      n: 'FRUS 1964–68, V, doc. [341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.gibbons-u-s-government-and]], IV, 784, 807–08, 839, 861 (Tom Johnson''s notes). Made public: FRUS 1964–68, V (2002). See [[cal.1967-08-21.vietnam-congress]]; [[cal.1967-10-03.elections-1968]]. Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:helms-richard
      - name:christian-george
- add:
    entry:
      id: cal.1967-10-04.vietnam
      when: Oct. 4
      date: '1967-10-04'
      thread: vietnam
      also:
      - vietnam-air-war
      - vietnam-pennsylvania
      c: 'Johnson with Rusk, McNamara, Rostow and Christian, 7:02 to 7:55 p.m., on two messages from Paris: Bộ has withdrawn "solemn engagement to talk." Johnson: "We need to pour the steel on. Let''s hit them every day and go every place except Hanoi"; of the 24 targets left, "Hit all you can." McNamara of Kissinger: "the best I''ve seen in my seven years." Of Percy''s resolution: "Tell Percy we will listen to him at any time and any place."'
      n: 'FRUS 1964–68, V, doc. [346](https://history.state.gov/historicaldocuments/frus1964-68v05/d346). [[w.gibbons-u-s-government-and]], IV, 785, 831 (Percy). Made public: FRUS 1964–68, V (2002). See [[cal.1967-10-03.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian, Mai Văn Bộ, Kissinger, Percy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:christian-george
      - name:mai-van-bo
      - name:kissinger-henry-a
      - name:percy-charles-h
- add:
    entry:
      id: cal.1967-10-04.vietnam-2
      when: Oct. 4
      date: '1967-10-04'
      thread: vietnam
      also:
      - war-opposition
      c: 'Watson to Rostow: Johnson wants to see the telegrams answering San Antonio, and those against it sent to the FBI "to run a check on" their senders. Rostow''s office does both.'
      n: '[[w.gibbons-u-s-government-and]], IV, 784 (a note from Rostow''s staff to Rostow, Oct. 4, 1967, LBJ Library, NSF Country File, Vietnam). Made public: [[w.gibbons-u-s-government-and]], IV (1995). See [[cal.1967-09-29.vietnam]]. Names: Watson, Rostow, Johnson.'
      tags:
      - name:watson-w-marvin
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-05.vietnam-pennsylvania
      when: Oct. 5
      date: '1967-10-05'
      thread: vietnam-pennsylvania
      c: 'Johnson with Rusk, McNamara and Rostow, 6:55 to 8:25 p.m., on the new message for Bộ. Johnson: "This proposal may lead them to a meeting, but it may lead me into a trap." Rusk''s words, "in accordance with its proposal of August 25," carry the no-advantage assumption; "without expression of condition" kept. Mansfield and Dirksen told? "Not until we have something."'
      n: 'FRUS 1964–68, V, doc. [348](https://history.state.gov/historicaldocuments/frus1964-68v05/d348). [[w.gibbons-u-s-government-and]], IV, 786. Made public: FRUS 1964–68, V (2002). See [[cal.1967-10-04.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Mai Văn Bộ, Mansfield, Dirksen.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:mai-van-bo
      - name:mansfield-mike
      - name:dirksen-everett
- add:
    entry:
      id: cal.1967-10-11.vietnam
      when: Oct. 11
      date: '1967-10-11'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Tuesday lunch, 12:55 to 1:03 p.m.: McConnell, acting chairman, for striking Phúc Yên; McNamara: "militarily marginal"; Rusk: wait some days. Johnson waits, and asks a "strategy for the next 12 months on Vietnam—military, political, negotiating"; "too much vague talk."'
      n: '[[w.gibbons-u-s-government-and]], IV, 787–88. To check: notes of the meeting and Rostow''s typed notes (LBJ Library). Names: McConnell, McNamara, Rusk, Johnson.'
      tags:
      - name:mcconnell-john-p
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-16.vietnam
      when: Oct. 16
      date: '1967-10-16'
      thread: vietnam
      also:
      - vietnam-pennsylvania
      c: 'Johnson with Rusk, McNamara, Rostow, Helms and Christian. Rusk: no serious answer from Hanoi, "a one way conversation." McNamara for a pause of a month at least, "because of the domestic plus"; *Life* to call for one. Johnson: "How are we ever going to win?" McNamara: "I have no idea how we can win it in the next 12 months."'
      n: 'FRUS 1964–68, V, doc. [353](https://history.state.gov/historicaldocuments/frus1964-68v05/d353). [[w.gibbons-u-s-government-and]], IV, 788. Made public: FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:helms-richard
      - name:christian-george
- add:
    entry:
      id: cal.1967-10-17.vietnam-2
      when: Oct. 17
      date: '1967-10-17'
      thread: vietnam
      also:
      - vietnam-pennsylvania
      c: 'Johnson with Rusk, McNamara, Wheeler, Helms, Rostow and Christian, 1:40 to 2:50 p.m.: "the news is all bad." Paris to be made known: Rusk to "disclose it under strong questioning" in a closed committee session; "It will take about two days to leak." McNamara to see Russell; Rusk''s people to "pull their gloves off." Hanoi''s bombing to resume after Oct. 20 without an answer. Rusk: Fulbright asks him to testify in public; "I do not want seven hours of public debate." Johnson: "I would go to the hearings and hit them hard and solid," not on television.'
      n: 'FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.gibbons-u-s-government-and]], IV, 789, 910 (the testimony, from Tom Johnson''s notes). Made public: FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara, Wheeler, Helms, Rostow, Christian, Russell, Fulbright.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:helms-richard
      - name:rostow-walt-w
      - name:christian-george
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-10-23.vietnam
      when: Oct. 23
      date: '1967-10-23'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson with Rusk, McNamara, Rostow, Wheeler and Christian, 1:05 to 3:40 p.m. Helms: "you ended up where you began." Phúc Yên, two bridges and the power plant authorized: "Now we have gotten rid of the excuses." Johnson: "It doesn''t seem we can win the war militarily"; "We''ve almost lost the war in the last two months in the court of public opinion." The reserves? McNamara: not needed. Of the draft-card protesters, Rusk: "I would enforce the law." The Joint Chiefs'' report of Oct. 17 "not what was desired."'
      n: 'FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363) (all but the Joint Chiefs'' report). [[w.gibbons-u-s-government-and]], IV, 793–95, 868–69, 874, 927–28 (Tom Johnson''s notes; the report, from the Pentagon Papers). Made public: FRUS 1964–68, V (2002). To check: [[w.pentagon-papers]], IV, 536 (the report). See [[cal.1967-10-20.vietnam-pennsylvania]]. Names: Johnson, Rusk, McNamara, Rostow, Wheeler, Christian, Helms.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:wheeler-earle
      - name:christian-george
      - name:helms-richard
