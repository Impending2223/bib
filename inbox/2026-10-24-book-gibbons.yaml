    base: 0b2f2a9a
    set:
      n: '[[w.gibbons-u-s-government-and]], IV, 752–53. To check: Senate Comm. on Armed Services, Preparedness Investigating Subcomm., *Air War Against North Vietnam* (Comm. Print 1967). Check: the print''s pages. See [[cal.1967-08-09.vietnam]]. Names: Stennis.'
      c: 'The Stennis subcommittee''s report, a committee print: the air war "has not done the job"; "the fragmentation of our air might by overly restrictive controls, limitations, and the doctrine of ''gradualism''"; more than 660 planes lost. Close Haiphong; strike every target of military significance.'
