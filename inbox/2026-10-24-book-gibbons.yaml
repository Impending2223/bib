      - name:aiken-george-d
- add:
    entry:
      id: cal.1966-06-29.vietnam-congress-2
      when: June 29
      date: '1966-06-29'
      thread: vietnam-congress
      c: 'The Senate on the oil strikes. Russell: "we have exhausted every effort to arrive at negotiations"; Saltonstall, Symington and, in the House, Ford with him. Mansfield: "a new stage in the war," more aid from Moscow and Peking, more infiltration in the end. Aiken: "The President has made a mistake."'
      n: '[[w.gibbons-u-s-government-and]], IV, 377. To check: *New York Times*, June 30, 1966; 112 Cong. Rec., June 29 and 30, 1966. See [[cal.1966-06-29.vietnam]]. Names: Russell, Saltonstall, Symington, Ford, Mansfield, Aiken.'
      tags:
      - name:russell-richard-b
      - name:saltonstall-leverett
      - name:symington-stuart-s
      - name:ford-gerald-r
      - name:mansfield-mike
      - name:aiken-george-d
- add:
    entry:
      id: cal.1966-06-30.vietnam-congress
      when: June 30
      date: '1966-06-30'
      thread: vietnam-congress
      c: 'Ball before the Foreign Relations Committee, at its hearings on NATO. Fulbright: the oil strikes "one more step toward the ultimate war"; the only solution contemplated "the surrender of North Vietnam." Ball: the bombing weakens Hanoi''s morale; he has "no doubts or reservations." Moyers to Ball the next day: "a wonderful job for the President."'
      n: 'Daily Digest, [112 Cong. Rec. D340](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=338) (the hearing). [[w.gibbons-u-s-government-and]], IV, 377–78. To check: *New York Times*, July 1, 1966; Ball''s telephone transcripts (LBJ Library, Papers of George Ball, "Presidential Telecons"). See [[cal.1966-06-29.vietnam]]. Names: Ball, Fulbright, Moyers.'
      tags:
      - name:ball-george-w
      - name:fulbright-j-william
      - name:moyers-bill
- add:
    entry:
      id: cal.1966-07-26.vietnam
      when: July 26
      date: '1966-07-26'
      thread: vietnam
      c: 'Rostow to Johnson, who has asked about McNamara to State in Ball''s place and Komer for William Bundy: the pairing of Rusk and McNamara "exceedingly attractive," but McNamara needed at Defense "until we are over the hump in Vietnam." For Ball''s post, Bruce or Clifford, Bruce preferred.'
      n: '[[w.gibbons-u-s-government-and]], IV, 355–56. To check: Rostow to Johnson, July 26, 1966 (LBJ Library, NSF Files of Walt W. Rostow). Names: Rostow, Johnson, McNamara, Ball, Komer, William Bundy, Rusk, Bruce, Clifford.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:komer-robert-w
      - name:bundy-william
      - name:rusk-dean
      - name:bruce-david-k-e
      - name:clifford-clark
- add:
    entry:
      id: cal.1966-08-08.vietnam
      when: Aug. 8
      date: '1966-08-08'
      thread: vietnam
      c: 'The *New York Times*: a Pentagon study puts victory eight years off, or five with 750,000 men, partial mobilization and the reserves called. The source Greene, the Marine Commandant, in a backgrounder in Saigon; by Greene''s recollection, Johnson by telephone demands what he meant. Denials follow.'
      n: '[[w.gibbons-u-s-government-and]], IV, 380–81. To check: *New York Times*, Aug. 8, 1966; [[w.herring-lbj-and-vietnam]], 50. Names: Greene, Johnson.'
      tags:
      - name:greene-wallace-m-jr
      - name:johnson-lyndon-b
