- add:
    entry:
      id: cal.1960-02-26.vietnam-congress
      when: Feb. 26
      date: '1960-02-26'
      thread: vietnam-congress
      c: The Foreign Relations Committee's Subcommittee on State Department Organization and Public Affairs, Mansfield chairman, reports on the aid program in Vietnam, after its hearings on Colegrove's articles (Washington, July 1959; Saigon, Dec. 1959). Unanimous. Aid to be reshaped and in time ended, as Vietnam becomes self-sufficient; the MAAG, on Williams's testimony, can be phased out "barring unforeseen developments"; the import program's exchange rate and budget support criticized.
      n: 'Senate Comm. on Foreign Relations, *United States Aid Program in Vietnam*, Report by a Subcommittee on State Department Organization and Public Affairs, Comm. Print, 86th Cong., 2d Sess. (Feb. 26, 1960) (Check: not read). [[w.gibbons-u-s-government-and]], I, 321–27, 338. Check: Gibbons dates the print Feb. 26, 1960 (I, 324 n.111), and calls it "the January 1960 report" (I, 338). Names: Mansfield, Colegrove, Williams.'
      tags:
      - name:mansfield-mike
      - name:colegrove-albert-m
      - name:williams-samuel-t
- add:
    entry:
      id: cal.1960-05-05.vietnam-congress
      when: May 5
      date: '1960-05-05'
      thread: vietnam-congress
      c: 'Mansfield writes Williams and Herter: a UPI despatch of the day has the MAAG doubled for the worsening security in Vietnam; why, and who decided. Fulbright writes them too.'
      n: '[FRUS 1958–60, I, doc. 154](https://history.state.gov/historicaldocuments/frus1958-60v01/d154) (editorial note: Mansfield''s letters). [[w.gibbons-u-s-government-and]], I, 338–39 (Mansfield''s and Fulbright''s letters, National Archives, RG 46). Made public: Mansfield''s letter, [[w.def-u-s-viet-rels]], Book 10, 1276–78 (1971). See [[cal.1960-03-17.vietnam]]; [[cal.1960-02-26.vietnam-congress]]. Names: Mansfield, Williams, Herter, Fulbright.'
      tags:
      - name:mansfield-mike
      - name:williams-samuel-t
      - name:herter-christian-a
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1960-05-20.vietnam-congress
      when: May 20
      date: '1960-05-20'
      thread: vietnam-congress
      c: 'Williams to Mansfield: the MAAG not doubled. The 350 men of TERM, since 1956 a cover for logistical advisers, go into a MAAG of 685, which the ICC approved Apr. 19; the change "ends subterfuge." The MAAG to "work itself out of a job," some 15 percent fewer in mid-1961, 20 percent a year after. Herter''s reply, May 10, much the same.'
      n: 'FRUS 1958–60, I, docs. [154](https://history.state.gov/historicaldocuments/frus1958-60v01/d154) (the interim reply by wire; Herter''s), [166](https://history.state.gov/historicaldocuments/frus1958-60v01/d166) (the letter). Made public: [[w.def-u-s-viet-rels]], Book 10, 1279–80 (1971). [[w.gibbons-u-s-government-and]], I, 338–39. See [[cal.1960-05-05.vietnam-congress]]. Names: Williams, Mansfield, Herter.'
      tags:
      - name:williams-samuel-t
      - name:mansfield-mike
      - name:herter-christian-a
- add:
    entry:
      id: cal.1960-08-23.vietnam
      when: Aug. 23
      date: '1960-08-23'
      thread: vietnam
      c: 'SNIE 63.1-60, "Short-Term Trends in South Vietnam": a "marked deterioration since January"; criticism of Diệm''s rule mounting, the Viet Cong''s terror and guerrilla war markedly up. Unchecked, the trends "will almost certainly in time cause the collapse of Diem''s regime."'
      n: '[FRUS 1958–60, I, doc. 185](https://history.state.gov/historicaldocuments/frus1958-60v01/d185). [[w.gibbons-u-s-government-and]], I, 341. Made public: [[w.def-u-s-viet-rels]], Book 10, 1298–1301 (1971). Names: Ngô Đình Diệm.'
      tags:
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1960-09-13.vietnam
      when: Sept. 13
      date: '1960-09-13'
      thread: vietnam
      c: 'Lansdale, "Possible Courses of Action in Vietnam": the MAAG to give "on-the-spot advice and assistance" in operations against the Viet Cong, and be staffed with officers skilled in counter-guerrilla war; Seventh Fleet vessels and Air Force patrols, in a large operation, to deter reinforcement by sea.'
      n: '[FRUS 1958–60, I, doc. 195](https://history.state.gov/historicaldocuments/frus1958-60v01/d195). [[w.gibbons-u-s-government-and]], I, 337. Made public: [[w.def-u-s-viet-rels]], Book 10, 1307–09 (1971). Names: Lansdale.'
      tags:
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1960-09-16.vietnam
      when: Sept. 16
      date: '1960-09-16'
      thread: vietnam
      c: 'Durbrow to State: Diệm''s government "in quite serious danger," from a coup in Saigon and from the Viet Cong in the countryside; he asks leave to tell Diệm, "drastic" as it is, what is needed to save it, Nhu sent abroad among the steps. If Diệm will not act, "alternative courses of action and leaders."'
      n: '[FRUS 1958–60, I, doc. 197](https://history.state.gov/historicaldocuments/frus1958-60v01/d197). [[w.gibbons-u-s-government-and]], I, 341. Made public: [[w.def-u-s-viet-rels]], Book 10, 1311–16 (1971). The approach: [[cal.1960-10-14.vietnam]]. Names: Durbrow, Diệm, Nhu.'
      tags:
      - name:durbrow-elbridge
      - name:ngo-dinh-diem
      - name:ngo-dinh-nhu
- add:
    entry:
      id: cal.1960-12-23.vietnam
      when: Dec. 23
      date: '1960-12-23'
      thread: vietnam
      c: 'Durbrow sees Diệm, an hour and three-quarters, and leaves State''s suggestions in writing: liberalizing measures announced at once, credit for the peasants, the Assembly to investigate the departments. Diệm pleasant and "basically negative": he wants 20,000 more troops, the Laotian crisis worsening, and has raised the Civil Guard to 64,000.'
      n: '[FRUS 1958–60, I, doc. 270](https://history.state.gov/historicaldocuments/frus1958-60v01/d270) (Durbrow, Dec. 24). [[w.gibbons-u-s-government-and]], I, 342 (Diệm "even less forthcoming than before"). Made public: [[w.def-u-s-viet-rels]], Book 10, 1348–51 (1971). See [[cal.1960-12-04.vietnam]]. Check: Gibbons dates the meeting Dec. 24, the telegram''s date; Durbrow: "Diem didn''t receive me until 23rd." Names: Durbrow, Diệm.'
      tags:
      - name:durbrow-elbridge
      - name:ngo-dinh-diem
- edit:
    id: cal.1965-09-15.latin-america
    base: d8aeeaf8
    set:
      n: '[111 Cong. Rec., Senate, Sept. 15, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-2-1.pdf); [111 Cong. Rec., House, Sept. 20, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-5-1.pdf). [[w.gibbons-u-s-government-and]], IV, 38–41 (the speech''s making; Fulbright''s note to Johnson the same morning; his loss of access). To check: [[w.fulbright-arrogance-of-power]]; [[w.woods-fulbright]]; [[w.lowenthal-dominican-intervention]]. See [[cal.1965-04-28.latin-america]]; [[cal.1965-09-03.latin-america]]. Names: Fulbright, Selden.'
- add:
    entry:
      id: cal.1965-08-01.vietnam-congress
      when: Aug. 1
      date: '1965-08-01'
      thread: vietnam-congress
      c: 'Russell on *Face the Nation*: the "greatest mistake" overemphasis on the military, too little on the civilian side; in a free election the South Vietnamese "highly likely" to choose Hồ Chí Minh; the domino theory "not necessarily true"; defeat a worse blow to prestige than to strategy.'
      n: 'Transcript, *Face the Nation*, Aug. 1, 1965 (CBS) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 22–23. Names: Russell, Hồ Chí Minh.'
      tags:
      - name:russell-richard-b
      - name:ho-chi-minh
- add:
    entry:
      id: cal.1965-08-03.vietnam-support
      when: Aug. 3–4
      date: '1965-08-03'
      thread: vietnam-support
      c: 'White House dinner on the government''s "information problem" on the war, Cater in the chair, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield and Morris Leibman, of Chicago, among those there; Leibman''s paper on a "10 to 20 year period of ''twilight war.''" Aug. 4, a luncheon: how to get the private sector to carry some of the burden; Cooper: the American Friends of Vietnam, the government''s hand "fairly hidden," helped to money. A Public Affairs Policy Committee for Vietnam follows, McGeorge Bundy chairman, meeting weekly.'
      n: 'Chase to Johnson, Aug. 4, 1965; Memorandum for the Record, "August 4 Luncheon Meeting on the Information Problem" (LBJ Library, NSF Country File, Vietnam) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 30–32. Names: Cater, McGeorge Bundy, Cooper, Califano, Marks, Chancellor, Greenfield.'
      tags:
      - name:cater-s-douglass
      - name:bundy-mcgeorge
      - name:cooper-chester-l
      - name:califano-joseph-a-jr
      - name:marks-leonard-h
      - name:chancellor-john
      - name:greenfield-james-l
- add:
    entry:
      id: cal.1965-08-04.vietnam-congress
      when: Aug. 4
      date: '1965-08-04'
      thread: vietnam-congress
      also:
      - defense
      c: 'McNamara and Wheeler before Stennis''s defense subcommittee of Senate Appropriations, in executive session, on the $1.7 billion asked in early August for the war to the end of 1965: South Vietnam the test of the "war of national liberation"; "We have no desire to widen the war." The bombing only "very small" in difference from the Joint Chiefs'' program; Wheeler: "primarily one of tempo." Robertson and Ellender against more involvement; Symington, win or get out. Aug. 5, the House subcommittee, unprinted.'
      n: 'Daily Digest, [111 Cong. Rec. D439](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=437). Senate Comm. on Appropriations, *Department of Defense Appropriations for 1966: Hearings*, 89th Cong., 1st Sess., 731 ff. (1965) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 33–34. Names: McNamara, Wheeler, Stennis, Robertson, Ellender, Symington.'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:stennis-john-c
      - name:robertson-absalom-w
      - name:ellender-allen-j
      - name:symington-stuart-s
- add:
    entry:
      id: cal.1965-08-05.vietnam-congress
      when: Aug. 5
      date: '1965-08-05'
      thread: vietnam-congress
      c: 'The NSC. McNamara on the Armed Services committees: "broad support, but this support is thin. There is a feeling of uneasiness and frustration"; Republicans "overstating" the war''s cost to the economy. Rusk: good support in House Foreign Affairs.'
      n: '[FRUS 1964–68, III, doc. 110](https://history.state.gov/historicaldocuments/frus1964-68v03/d110). [[w.gibbons-u-s-government-and]], IV, 34. Made public: FRUS 1964–68, III (1996). Names: McNamara, Rusk, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-07-26.vietnam
      when: July 26–Aug. 5
      date: '1965-07-26'
      thread: vietnam
      c: 'SIGMA II-65, the Joint Chiefs'' politico-military game at the Pentagon, senior officials reviewing it at the end: the Communist teams counted on the long run, "the 1968 U.S. elections, ten and even twenty years beyond"; the Viet Cong hard to "find and fix"; the bombing absorbed. Rostow to William Bundy: an indecisive war of many American troops "could produce political frustration in the U.S."'
      n: 'SIGMA II-65, Final Report, Aug. 20, 1965 (declassified for Gibbons; Check: not read); Rostow to William Bundy, Aug. 5, 1965 (State, S/P Chron File). [[w.gibbons-u-s-government-and]], IV, 17–19. Names: Rostow, William Bundy.'
      tags:
      - name:rostow-walt-w
      - name:bundy-william
- add:
    entry:
      id: cal.1965-08-09.war-opposition
      when: Aug. 6–9
      date: '1965-08-06'
      thread: war-opposition
      also:
      - vietnam
      c: 'Washington. The Assembly of Unrepresented People, Muste, Dellinger and Lynd among its leaders, some 1,000. Aug. 6, a delegation with Cooper at the White House. Aug. 9, marching on the Capitol, they refuse to stop at the police lines: 350 arrested. A National Coordinating Committee to End the War in Vietnam formed, 23 organizations.'
      n: '[[w.gibbons-u-s-government-and]], IV, 27. To check: [[w.debenedetti-american-ordeal]]; [[w.powers-war-at-home]]. Names: Muste, Dellinger, Lynd, Cooper.'
      tags:
      - name:muste-a-j
      - name:dellinger-david
      - name:lynd-staughton
      - name:cooper-chester-l
      - city:washington
- add:
    entry:
      id: cal.1965-08-09.vietnam-congress
      when: Aug. 9–11
      date: '1965-08-09'
      thread: vietnam-congress
      c: 'Off-the-record White House briefings on the war for all the Members, 74 Senators and 336 Representatives: Johnson, then Taylor, Rusk and McNamara; Harriman on his talks in Moscow, Goldberg on U Thant, Black on the Mekong.'
      n: 'Partial transcripts of the briefings of Aug. 10 and 11 (LBJ Library, Transcripts of Vietnam Briefings) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 34 (from the Daily Diary). Check: the days; Morse''s speech of Aug. 10 has one the day before. Names: Johnson, Taylor, Rusk, McNamara, Harriman, Goldberg, Black.'
      tags:
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:harriman-w-averell
      - name:goldberg-arthur-j
      - name:black-eugene-r
- add:
    entry:
      id: cal.1965-08-10.vietnam-congress
      when: Aug. 10
      date: '1965-08-10'
      thread: vietnam-congress
      c: 'Morse in the Senate, the day after a White House briefing: "an Alice-in-Wonderland exhibition"; the guerrilla war lost and turned into a conventional war under "the same men who failed." McGeorge Bundy sends Johnson a summary the next day.'
      n: '[111 Cong. Rec., Senate, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-1.pdf), 19840. [[w.gibbons-u-s-government-and]], IV, 34–35. See [[cal.1965-08-09.vietnam-congress]]. Names: Morse, McGeorge Bundy, Johnson.'
      tags:
      - name:morse-wayne
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-10.war-opposition
      when: Aug. 10
      date: '1965-08-10'
      thread: war-opposition
      also:
      - vietnam-congress
      - students
      c: 'The House passes the bill making it a crime to destroy or mutilate a draft card, up to five years and $10,000, the day after the arrests at the Capitol: 393–1, Henry P. Smith of New York against. Bray: "a filthy, sleazy beatnik gang."'
      n: '[111 Cong. Rec., House, Aug. 10, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt15/pdf/GPO-CRECB-1965-pt15-1-2.pdf), 19871–72. [[w.gibbons-u-s-government-and]], IV, 28. Signed: [[cal.1965-08-30.students]]. Names: Bray, Henry P. Smith.'
      tags:
      - name:bray-william-g
      - name:smith-henry-p-iii
- add:
    entry:
      id: cal.1965-08-15.vietnam-congress
      when: Aug. 15
      date: '1965-08-15'
      thread: vietnam-congress
      c: 'Fulbright asks McGeorge Bundy to an informal coffee with the Foreign Relations Committee. Bundy declines on Johnson''s instructions: the President does not want "to get into the habit of sending Presidential aides to the Hill"; the committee might come to Bundy''s office or home for a drink. Not taken up.'
      n: 'Marcy to Fulbright (National Archives, RG 46, Marcy Chron File) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 38 n.119. Names: Fulbright, McGeorge Bundy, Marcy, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:bundy-mcgeorge
      - name:marcy-carl
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-17.vietnam
      when: Aug. 17
      date: '1965-08-17'
      thread: vietnam
      c: 'Eisenhower, at a news conference at Gettysburg: the Communists must be stopped in Vietnam, but his letter to Diệm made no commitment of a military kind.'
      n: '*New York Times*, Aug. 18, 1965. [[w.gibbons-u-s-government-and]], IV, 35. Check: Gibbons has the letter of "October 1955." Names: Eisenhower, Ngô Đình Diệm.'
      tags:
      - name:eisenhower-dwight-d
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1965-08-18.vietnam-2
      when: Aug. 18
      date: '1965-08-18'
      thread: vietnam
      c: 'Johnson, through Moyers at 9:50 p.m., to McGeorge Bundy: by morning, everything said in the SEATO debates and by Eisenhower in office that "builds our case," "the kind of brief Abe Fortas would prepare on Gideon"; Hughes of State out of bed to do the research; Goodpaster to helicopter to Gettysburg with it.'
      n: 'Moyers to McGeorge Bundy, Aug. 18, 1965 (LBJ Library, NSF Memos to the President—McGeorge Bundy) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 36. See [[cal.1965-08-17.vietnam]]. Names: Johnson, Moyers, McGeorge Bundy, Hughes, Goodpaster, Eisenhower.'
      tags:
      - name:johnson-lyndon-b
      - name:moyers-bill
      - name:bundy-mcgeorge
      - name:hughes-thomas-l
      - name:goodpaster-andrew-j
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-08-19.vietnam
      when: Aug. 19
      date: '1965-08-19'
      thread: vietnam
      c: 'Goodpaster at Gettysburg, unannounced. Eisenhower: no question of his support; "continuity of purpose and policy, together with evolution of means and action." To the press after: circumstances changed since 1954; "there is only one thing a good American can do, and that is to support the President."'
      n: 'Goodpaster to McGeorge Bundy (LBJ Library, NSF Name File, President Eisenhower) (Check: not read). *New York Times*, Aug. 20, 1965. [[w.gibbons-u-s-government-and]], IV, 36–37. See [[cal.1965-08-17.vietnam]]. Names: Goodpaster, Eisenhower.'
      tags:
      - name:goodpaster-andrew-j
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-08-19.vietnam-support
      when: Aug. 19
      date: '1965-08-19'
      thread: vietnam-support
      c: 'Johnson lunches with Rusk and the senior officers of State: public support "generally satisfactory at present," more doubtful if the war goes on another year; the Department to put the case in public forums and to deal with the *New York Times* and "the ''Kennedy columnists''"; advance consultation with the congressional leaders and committees.'
      n: '[FRUS 1964–68, III, doc. 123](https://history.state.gov/historicaldocuments/frus1964-68v03/d123) (William Bundy''s notes). [[w.gibbons-u-s-government-and]], IV, 29. Made public: FRUS 1964–68, III (1996). Names: Johnson, Rusk, William Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:bundy-william
- add:
    entry:
      id: cal.1965-08-20.vietnam-support
      when: Aug. 20
      date: '1965-08-20'
      thread: vietnam-support
      c: The White House issues *Why Vietnam*, the statements on the American role since Eisenhower's of 1954; nothing of Truman's commitment of 1950. Thomson of the NSC staff, who drafted it, lost his fight for a question mark in the title.
      n: '[[w.gibbons-u-s-government-and]], IV, 30. Thomson''s account: James C. Thomson, Jr., "How Could Vietnam Happen?," *Atlantic*, Apr. 1968, 50 (Check: not read). Names: Thomson.'
      tags:
      - name:thomson-james-c-jr
- add:
    entry:
      id: cal.1965-08-24.vietnam-congress
      when: Aug. 24
      date: '1965-08-24'
      thread: vietnam-congress
      also:
      - economy
      c: 'House. Laird''s motion to recommit the Labor and HEW supplemental appropriation fails, [138–264](https://voteview.com/rollcall/RH0890123): the war''s needs upon us; the domestic spending cut first, the war''s cost for fiscal 1966 told to Congress. Most Republicans and some Southern Democrats for it.'
      n: '[111 Cong. Rec., House, Aug. 24, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-4-2.pdf), 21549–71. [[w.gibbons-u-s-government-and]], IV, 37. Check: Gibbons gives 139–263. Names: Laird.'
      tags:
      - name:laird-melvin-r
- add:
    entry:
      id: cal.1965-08-25.vietnam
      when: Aug. 25
      date: '1965-08-25'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'House Republicans'' white paper, "Vietnam: Some Neglected Aspects of the Historical Record": the crisis since 1960, under the Democrats; Laos, the reversal on Diệm, the danger concealed, the campaign of 1964. McGeorge Bundy to Johnson: McNamara, Ball, William Bundy and Moyers think it "a pretty feeble effort," not worth a reply at the top; Dirksen has disavowed it.'
      n: '[111 Cong. Rec., House, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-2.pdf), 21838–44. McGeorge Bundy to Johnson, Aug. 25, 1965 (LBJ Library, NSF Memos to the President—McGeorge Bundy) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 37–38. Names: McGeorge Bundy, Johnson, McNamara, Ball, William Bundy, Moyers, Dirksen.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:bundy-william
