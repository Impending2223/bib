- edit:
    id: cal.1965-12-07.vietnam-pause-2
    base: ae6f2c6a
    set:
      n: '[FRUS 1964–68, III, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v03/d223). [[w.johnson-vantage-point]], 235. Bibliography: [[cal.1965-12-24.vietnam]]. [[w.gibbons-u-s-government-and]], IV, 118–19 (Bundy''s notes). Names: Rusk, McNamara, McGeorge Bundy, Johnson, Mansfield, Dirksen, Robert Kennedy, Russell.'
      c: 'The LBJ Ranch: Rusk, McNamara and McGeorge Bundy with Johnson on McNamara''s report and a pause in the bombing. Johnson: "I don''t want to take off till I know I can get back." By his account he asks twice whether the bombing could be resumed if Hanoi did nothing; they assure him it could. By McGeorge Bundy''s notes: "I don''t see any light down that barrel"; "If I have to decide this morning, full steam ahead." McNamara would not have proposed a pause "if he didn''t think we could manipulate it all." Mansfield, Dirksen, Robert Kennedy and Russell to be seen "before we go overboard."'
- tag:
