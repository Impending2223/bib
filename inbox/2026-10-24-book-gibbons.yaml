- edit:
    id: cal.1967-07-31.vietnam
    base: 0af67dab
    set:
      n: 'FRUS 1964–68, V, doc. [262](https://history.state.gov/historicaldocuments/frus1964-68v05/d262). [[w.gibbons-u-s-government-and]], IV. [113 Cong. Rec., Senate, July 31, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt15/pdf/GPO-CRECB-1967-pt15-8-2.pdf), 20702–19 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 809–11. To check: [[w.woods-fulbright]]; [[w.berman-william-fulbright-and-the]]; [[w.ely-war-and-responsibility]]. Names: Fulbright, Russell.'
      c: 'Fulbright introduces S. Res. 151: a national commitment to a foreign power to follow only from action by both the executive and the legislative branches, "through means of a treaty, convention, or other legislative instrumentality specifically intended to give effect to such a commitment." Russell first among the Senators for it.'
- tag:
    id: cal.1967-07-31.vietnam
    add:
    - name:russell-richard-b
- edit:
    id: cal.1967-08-17.vietnam-commitments
    base: 71aa99aa
    set:
      n: 'Daily Digest, [113 Cong. Rec. D425](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=423). *U.S. Commitments to Foreign Powers: Hearings Before the Senate Committee on Foreign Relations on S. Res. 151*, 90th Cong., 1st Sess. (1967), 76–91 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 812–14, 817 (McCarthy''s words, from the *New York Times*, Aug. 18, 1967). To check: [[w.katzenbach-some-of-it-was]]; [[w.sandbrook-eugene-mccarthy]]; [[w.mccarthy-year-of-the-people]]. See [[cal.1967-07-31.vietnam]]. Names: Katzenbach, McCarthy.'
      c: 'Foreign Relations'' hearings on S. Res. 151, from Aug. 16. Katzenbach: the Tonkin Gulf resolution and the SEATO treaty authority enough; a declaration of war "outmoded" (Check the words). McCarthy, leaving the hearing: "This is the wildest testimony I ever heard. There is no limit to what he says the President could do."'
- edit:
    id: cal.1967-08-18.vietnam-commitments
    base: b774e85d
    set:
      n: 'The President''s News Conference, [1967 Pub. Papers 788](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=180) (Aug. 18, 1967), item 10. [[w.gibbons-u-s-government-and]], IV, 814–15. See [[cal.1967-07-31.vietnam]]. Names: Johnson.'
- edit:
    id: cal.1967-09-26.vietnam
    base: 10ae1366
    set:
      c: 'Senate. Case, citing McNamara''s testimony that bombing the North''s ports would not stop its supplies: the administration''s statements on the war have brought a "crisis of confidence"; the President''s "perversion of the Tonkin Gulf resolution." Mansfield and Dirksen answer him. Morton, about the same days: the President misled by the generals and the military-industrial complex; stop the bombing (Johnson''s account to Dirksen, Oct. 4; Check Morton''s words and the date).'
- edit:
    id: cal.1967-10-12.vietnam
    base: b1119843
    set:
      n: '[*New York Times*, Oct. 13, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/13/issue.html); [Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html). FRUS 1964–68, V, doc. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355). [[w.gibbons-u-s-government-and]], IV, 845–47 (the transcript, *Bulletin*, Oct. 30, 1967; McCarthy, 113 Cong. Rec. 28929–31). To check: [[w.schoenbaum-waging-war-and-peace]]; [[w.rusk-as-i-saw-it-1990]]. Names: Rusk, McCarthy.'
      c: 'Rusk, at a news conference: Vietnam vital to the security of the United States; within a decade or two, "a billion Chinese on the mainland, armed with nuclear weapons," "with no certainty about what their attitudes toward the rest of Asia will be." McCarthy, Oct. 16: Rusk raising a "yellow peril."'
- add:
    entry:
      id: cal.1967-07-14.vietnam-commitments
      when: July 14
      date: '1967-07-14'
      thread: vietnam-commitments
      also:
      - vietnam-congress
      - congo
      c: 'Fulbright to Russell, after their lunch on the Congo, a draft resolution: a national commitment results only from action by both branches. Russell had asked for one; he will not introduce it but "WILL jump to his feet to support JWF," by Marcy''s memorandum of July 27.'
      n: '[[w.gibbons-u-s-government-and]], IV, 810 (Fulbright''s oral history, Apr. 19, 1971, Russell Papers). To check: Fulbright to Russell, July 14, 1967 (University of Arkansas, Fulbright Papers); Marcy to Henderson, July 27, 1967 (National Archives, RG 46, Marcy Chron File). See [[cal.1967-07-10.congo]]. Names: Fulbright, Russell, Marcy.'
      tags:
      - name:fulbright-j-william
      - name:russell-richard-b
      - name:marcy-carl
- add:
    entry:
      id: cal.1967-08-08.vietnam-congress
      when: Aug. 8
      date: '1967-08-08'
      thread: vietnam-congress
      c: 'Ford in the House: "grave misgivings ... about the way the war in Vietnam is going"; not more men, but let the military bomb, shell from the sea and quarantine Haiphong. To the press before: "a break with Administration policy."'
      n: '[113 Cong. Rec., House, Aug. 8, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt16/pdf/GPO-CRECB-1967-pt16-6-2.pdf), 21897 ff. (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 800. To check: *New York Times*, Aug. 9, 1967. Names: Ford.'
      tags:
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1967-08-09.vietnam-congress
      when: Aug. 9
      date: '1967-08-09'
      thread: vietnam-congress
      also:
      - economy-surcharge
      c: 'Johnson with fifty-eight House Democrats on the tax, 9:02 to 10:25 a.m. Of Ford''s speech: "I am not going to do what Ford says, because we would be in a war with China tonight if we did. Much as we want it, there is no easy way out."'
      n: '[[w.gibbons-u-s-government-and]], IV, 757, 800 (Tom Johnson''s notes). See [[cal.1967-08-08.vietnam-congress]]. Names: Johnson, Ford.'
      tags:
      - name:johnson-lyndon-b
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1967-08-21.vietnam-congress
      when: Aug. 21
      date: '1967-08-21'
      thread: vietnam-congress
      c: 'Johnson with the departments'' congressional liaison officers on the "Friendly Five": each to talk privately with the members he knows best, the purpose and the President''s part not told. 169 talks in August and September, 32 Senators and 137 Representatives. By Lewis''s count, 104 negative, 22 positive. Pastore: "We''re losing Democrats in droves."'
      n: '[[w.gibbons-u-s-government-and]], IV, 804–06 (the reports in the Sanders papers; Jean P. Lewis, "President Johnson Surveys the Congress," Georgetown seminar paper, 1990, 80–81). Made public: Evans and Novak''s column, *Washington Post*, Sept. 6, 1967 (the survey). To check: [[w.obrien-no-final-victories]], 214. Names: Johnson, Pastore.'
      tags:
      - name:johnson-lyndon-b
      - name:pastore-john-o
- add:
    entry:
      id: cal.1967-08-20.vietnam-commitments
      when: Aug. 20
      date: '1967-08-20'
      thread: vietnam-commitments
      c: 'Fulbright on *Issues and Answers*: Johnson''s remarks of Aug. 18 may deny Congress''s power to declare war; repeal of the Tonkin Gulf resolution "a direct slap at a leader in time of war"; the only real sanction impeachment, "politically impractical." An Associated Press survey the day before: 40 of 84 Senators disapprove of the President''s course.'
      n: '[[w.gibbons-u-s-government-and]], IV, 815. To check: *New York Times* and *Washington Post*, Aug. 21, 1967; *Washington Post*, Aug. 20, 1967. See [[cal.1967-08-18.vietnam-commitments]]. Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-21.vietnam-commitments
      when: Aug. 21
      date: '1967-08-21'
      thread: vietnam-commitments
      c: 'Katzenbach again before the Foreign Relations Committee: without the resolution the President had authority to send the troops and bomb the North, but would have found it "extremely difficult" alone; repeal would not stop him. To Hickenlooper: Congress "can get the troops out of Vietnam if it chooses to do it," through support.'
      n: '[[w.gibbons-u-s-government-and]], IV, 816–17 (the hearings, *U.S. Commitments to Foreign Powers*, 129, 141, 147, 170–71). See [[cal.1967-08-17.vietnam-commitments]]. Names: Katzenbach, Hickenlooper.'
      tags:
      - name:katzenbach-nicholas
      - name:hickenlooper-bourke-b
- add:
    entry:
      id: cal.1967-08-28.vietnam-congress
      when: Aug. 28
      date: '1967-08-28'
      thread: vietnam-congress
      c: 'Tim Lee Carter, a Kentucky Republican, in the House: "Let us now, while we are yet strong, bring our men home, every man jack of them"; the Viet Cong fight "because it is their land and we are foreigners."'
      n: '[113 Cong. Rec., House, Aug. 28, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt18/pdf/GPO-CRECB-1967-pt18-5-1.pdf), 24279 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 800–01. Names: Carter.'
      tags:
      - name:carter-tim-l
- add:
    entry:
      id: cal.1967-09.vietnam-congress
      when: Sept.
      date: 1967-09
      thread: vietnam-congress
      c: 'O''Neill''s newsletter to his district: no further escalation; stop the bombing; enclaves; the United Nations. A *Star* reporter finds it; by O''Neill''s account Johnson has him in at 9 the next morning: "You mean to tell me that you know more about this war than I do?"; "I''m afraid you may have started a snowball on me."'
      n: '[[w.gibbons-u-s-government-and]], IV, 835–39 (O''Neill''s account, CRS interview, May 7, 1979; the newsletter, sent with O''Brien to Johnson, Sept. 29, 1967; Desautels to O''Brien, Sept. 27). Check: the days of the *Star* story and the meeting. To check: [[w.oneill-man-of-the-house-1987]]. Names: O''Neill, Johnson, O''Brien.'
      tags:
      - name:oneill-thomas-p-jr
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1967-09-21.vietnam-congress
      when: Sept. 21
      date: '1967-09-21'
      thread: vietnam-congress
      c: 'A stag dinner, Johnson and Humphrey with Mansfield, Long, Hayden, Nelson, Clark, Church, Magnuson, Monroney, Morse and McGovern; Johnson talks, once forty-five minutes on end. McGovern''s memorandum the next day: "a tortured and confused man ... literally tortured by the mess he has gotten into in Vietnam."'
      n: '[[w.gibbons-u-s-government-and]], IV, 847–48 (McGovern''s memorandum for his file). Names: Johnson, Humphrey, Mansfield, Long, Hayden, Nelson, Clark, Church, Magnuson, Monroney, Morse, McGovern.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mansfield-mike
      - name:long-russell-b
      - name:hayden-carl
      - name:nelson-gaylord-a
      - name:clark-joseph-s
      - name:church-frank
      - name:magnuson-warren-g
      - name:monroney-almer-s
      - name:morse-wayne
      - name:mcgovern-george
- add:
    entry:
      id: cal.1967-09-25.vietnam-congress
      when: Sept. 25
      date: '1967-09-25'
      thread: vietnam-congress
      also:
      - vietnam-commitments
      c: 'Findley, with Bradford Morse, 47 other Republicans and four Democrats, H. Con. Res. 509: the committees of each House to report whether further congressional action on Southeast Asia is desirable. Morse: "a new war." Katzenbach to Johnson, Sept. 26: a "low-key response."'
      n: '[113 Cong. Rec., House, Sept. 25, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-3-1.pdf), 26598–603 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 803–04. To check: Katzenbach to Johnson, "Congressional Criticism and Action, September 25," Sept. 26, 1967 (State, Lot File 70 D 207). Names: Findley, Morse, Katzenbach, Johnson.'
      tags:
      - name:findley-paul
      - name:morse-frank-b
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-09-27.vietnam-congress
      when: Sept. 27
      date: '1967-09-27'
      thread: vietnam-congress
      c: 'Morton to the Business Executives for Peace in Vietnam: "If the President has been mistaken, so have I"; "I was wrong!" Stop the bombing and search and destroy; hold the coast and the cities; an all-Asian conference. Katzenbach has talking points against it drafted for Dirksen.'
      n: '[[w.gibbons-u-s-government-and]], IV, 827–28 (the text, 113 Cong. Rec. 27131; Katzenbach to Johnson, Sept. 27, 1967). Names: Morton, Katzenbach, Dirksen.'
      tags:
      - name:morton-thruston-b
      - name:katzenbach-nicholas
      - name:dirksen-everett
- add:
    entry:
      id: cal.1967-09-27.vietnam-support
      when: Sept. 27
      date: '1967-09-27'
      thread: vietnam-support
      c: 'Rostow to Bunker, eyes only: Johnson asks him, Westmoreland and Komer to search "urgently," Johnson''s word added by hand, for "sound evidence of progress"; the press and television full of the DMZ, the Thiệu–Kỳ split, the elections'' irregularities. Bunker''s answer, Oct. 7.'
      n: '[[w.gibbons-u-s-government-and]], IV, 845. To check: Rostow to Bunker, Sept. 27, 1967 (LBJ Library, NSF Country File, Vietnam). Names: Rostow, Bunker, Johnson, Westmoreland, Komer, Nguyễn Văn Thiệu, Nguyễn Cao Kỳ.'
      tags:
      - name:rostow-walt-w
      - name:bunker-ellsworth
      - name:johnson-lyndon-b
      - name:westmoreland-william
      - name:komer-robert-w
      - name:nguyen-van-thieu
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1967-10-02.vietnam-congress
      when: Oct. 2
      date: '1967-10-02'
      thread: vietnam-congress
      c: 'Cooper in the Senate: stop the bombing without condition, keep it stopped, the war confined to the South. Mansfield, Fulbright, Pell, Morton, Javits and Percy with him; Kuchel, Miller, Thurmond, Murphy, Dominick and McGee against. Percy: the President''s seven failures; McGee: "The Vietnam question ... is incidental."'
      n: '[113 Cong. Rec., Senate, Oct. 2, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-8-1.pdf), 27441 ff. (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 829–30. Names: Cooper, Mansfield, Fulbright, Pell, Morton, Javits, Percy, Kuchel, Thurmond, McGee, Miller, Murphy.'
      tags:
      - name:cooper-john-sherman
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:pell-claiborne-d
      - name:morton-thruston-b
      - name:javits-jacob-k
      - name:percy-charles-h
      - name:kuchel-thomas-h
      - name:thurmond-strom
      - name:mcgee-gale-w
      - name:miller-jack-r
      - name:murphy-george
- add:
    entry:
      id: cal.1967-10-03.vietnam-congress
      when: Oct. 3
      date: '1967-10-03'
      thread: vietnam-congress
      c: 'Dirksen in the Senate, supplied by the executive at Johnson''s direction: Vietnam "our outside security line"; "I was not made a Senator to preside over the liquidation of the holy fabric of freedom." Case answers; Fulbright and he at it nearly two hours.'
      n: '[113 Cong. Rec., Senate, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-1.pdf), 27576–84 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 832–33. To check: *New York Times*, Oct. 4, 1967; [[w.macneil-dirksen]], 301. Check: Gibbons puts Kuchel''s speech earlier that day; his page, 27442, is in the Senate''s day of Oct. 2. See [[cal.1967-10-02.vietnam-congress]]. Names: Dirksen, Johnson, Case, Fulbright, Kuchel.'
      tags:
      - name:dirksen-everett
      - name:johnson-lyndon-b
      - name:case-clifford-p
      - name:fulbright-j-william
      - name:kuchel-thomas-h
- add:
    entry:
      id: cal.1967-10-05.vietnam-congress
      when: Oct. 5
      date: '1967-10-05'
      thread: vietnam-congress
      c: 'Percy offers S. Res. 173, sixteen Republicans and five Democrats with him: American forces not to bear an ever larger share of the fighting; the non-Communist nations of Asia to give more. Dirksen: "full of mischief." Nitze and William Bundy: it could be taken in Asia as American pressure.'
      n: '[[w.gibbons-u-s-government-and]], IV, 830–31 (the resolution, 113 Cong. Rec. 28038). To check: *New York Times*, Oct. 6, 1967; William Bundy, "Late Note for the President''s Evening Reading," Oct. 4, 1967 (LBJ Library). See [[cal.1967-10-02.vietnam-congress]]. Names: Percy, Dirksen, Nitze, William Bundy.'
      tags:
      - name:percy-charles-h
      - name:dirksen-everett
      - name:nitze-paul
      - name:bundy-william
- add:
    entry:
      id: cal.1967-10-11.vietnam-congress
      when: Oct. 11
      date: '1967-10-11'
      thread: vietnam-congress
      also:
      - war-opposition
      c: 'McCormack in the House, quoting Giáp on American dissent, "a valuable mark of sympathy": "If I were one of those, my conscience would be such that it would disturb me the rest of my life"; a standing ovation from some hundred members.'
      n: '[113 Cong. Rec., House, Oct. 11, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-6-2.pdf), 28611 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 840. To check: *New York Times*, Oct. 12, 1967. Check: Gibbons dates the speech Oct. 12; his page is in the House''s day of Oct. 11. Names: McCormack, Võ Nguyên Giáp.'
      tags:
      - name:mccormack-john-w
      - name:vo-nguyen-giap
- add:
    entry:
      id: cal.1967-10-12.vietnam-congress
      when: Oct. 12
      date: '1967-10-12'
      thread: vietnam-congress
      c: 'William Fitts Ryan and 29 other Representatives, 27 Democrats and 3 Republicans, to Johnson: stop the bombing of the North.'
      n: '[[w.gibbons-u-s-government-and]], IV, 839 n.125. To check: the letter (LBJ Library, WHCF, Name File, Ryan). Names: Ryan, Johnson.'
      tags:
      - name:ryan-william-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-18.vietnam-congress
      when: Oct. 18
      date: '1967-10-18'
      thread: vietnam-congress
      c: 'Morris Udall to Johnson: "a letter which is painful to write"; he has concluded "our Vietnam policies are unwise and should be substantially modified." His speech, already mailed to 20,000 constituents: stop the bombing, enclaves, a settlement. Rostow, Oct. 21: "the most politically effective statement I have yet seen" for de-escalation.'
      n: '[[w.gibbons-u-s-government-and]], IV, 834–35. To check: Rostow to Johnson, Oct. 21, 1967, with Udall''s letter (LBJ Library, NSF Country File, Vietnam); Katzenbach to Johnson, Oct. 20, 1967 (State, Lot File 70 D 207). Names: Udall, Johnson, Rostow.'
      tags:
      - name:udall-morris-k
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-10-24.vietnam-congress
      when: Oct. 24
      date: '1967-10-24'
      thread: vietnam-congress
      c: Dinner at the White House for members of the House of both parties; Johnson talks the whole time. 1968 "tough"; a Congressman may put "a very visible public distance" between himself and the President, but they will be on one line of the ballot. "They're just plain unhappy with me."
      n: '[[w.gibbons-u-s-government-and]], IV, 847–48. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-25.vietnam-support
      when: Oct. 25
      date: '1967-10-25'
      thread: vietnam-support
      c: Paul Douglas announces the Citizens Committee for Peace with Freedom in Vietnam, Truman and Eisenhower among more than a hundred members; conceived and organized at the White House, Roche the principal staff member, its press release drafted there.
      n: '[[w.gibbons-u-s-government-and]], IV, 843–44, 605 n.145 (109 members, ten from Washburn''s list). To check: *Washington Post* and *New York Times*, Oct. 26, 1967. See [[cal.1967-05-17.vietnam-support]]. Names: Douglas, Truman, Eisenhower, Roche.'
      tags:
      - name:douglas-paul-h
      - name:truman-harry-s
      - name:eisenhower-dwight-d
      - name:roche-john-p
- add:
    entry:
      id: cal.1967-10-31.vietnam-congress
      when: Oct. 31
      date: '1967-10-31'
      thread: vietnam-congress
      c: 'Rusk with Ryan''s group. Katzenbach to Johnson: all against the present policy, but agreed neither why nor on what instead; "no doves were converted."'
      n: '[[w.gibbons-u-s-government-and]], IV, 839–40. To check: Katzenbach to Johnson, "Congressional Criticism and Action," Nov. 1, 1967 (State, Lot File 70 D 207). See [[cal.1967-10-12.vietnam-congress]]. Names: Rusk, Ryan, Katzenbach, Johnson.'
      tags:
      - name:rusk-dean
      - name:ryan-william-f
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-01.vietnam-commitments
      when: Nov. 1
      date: '1967-11-01'
      thread: vietnam-commitments
      c: 'The Foreign Relations Committee in executive session on the staff''s revisions of S. Res. 151. Fulbright: report it now, debate it in 1968, "an educational gesture." Lausche: say the Tonkin Gulf resolution gave the President his authority. Aiken: on the floor it will be "are you for the boys ... or are you for Hanoi," defeated four to one; the President has "grossly abused" his power.'
      n: '[[w.gibbons-u-s-government-and]], IV, 820–22 (the unpublished transcript). See [[cal.1967-08-17.vietnam-commitments]]. Names: Fulbright, Lausche, Aiken.'
      tags:
      - name:fulbright-j-william
      - name:lausche-frank-j
      - name:aiken-george-d
- add:
    entry:
      id: cal.1967-11-16.vietnam-commitments
      when: Nov. 16
      date: '1967-11-16'
      thread: vietnam-commitments
      c: 'The Foreign Relations Committee approves the National Commitments Resolution, S. Res. 187, the staff''s draft and Hickenlooper''s combined, 16–0, 19–0 with the absent polled: the commitment of the forces to hostilities abroad, but to repel an attack or protect citizens, requires "affirmative action by Congress specifically intended." Reported Nov. 20, S. Rept. 90-797.'
      n: '[[w.gibbons-u-s-government-and]], IV, 822–24 (the unpublished transcript, Nov. 16; the report). To check: Senate Comm. on Foreign Relations, *National Commitments*, S. Rep. No. 90-797 (1967). See [[cal.1967-11-01.vietnam-commitments]]. Names: Hickenlooper.'
      tags:
      - name:hickenlooper-bourke-b
      - name:fulbright-j-william
- edit:
    id: cal.1967-10-16.war-opposition
    base: 6a40dcd4
    set:
      n: '[*New York Times*, Oct. 17, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/17/issue.html); [Oct. 18, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/18/issue.html); [Oct. 21, 1967](https://timesmachine.nytimes.com/timesmachine/1967/10/21/issue.html). FRUS 1964–68, V, docs. [355](https://history.state.gov/historicaldocuments/frus1964-68v05/d355), [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 862–63 (Oct. 16, eighteen cities, from the *Times* of Oct. 17; Oct. 20, from Coffin''s memoir). To check: [[w.ferber-resistance]]; [[w.foley-confronting-the-war-machine]]; [[w.wells-war-within]]; [[w.debenedetti-american-ordeal]]; [[w.zaroulis-who-spoke-up]]. Names: Coffin, Spock.'
- edit:
    id: cal.1967-10-21.war-opposition
    base: 6198b125
    set:
      n: 'Memorandum Following the Peace Demonstrations at the Lincoln Memorial and the Pentagon, [1967 Pub. Papers 936](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=328) (Oct. 23, 1967). FRUS 1964–68, V, doc. [363](https://history.state.gov/historicaldocuments/frus1964-68v05/d363). [[w.gibbons-u-s-government-and]], IV, 865–68 (the final count, from DeBenedetti and Chatfield, 198, 443 n. 21; Johnson''s weekend, from Califano). To check: [[w.mailer-armies-of-the-night]]; [[w.debenedetti-american-ordeal]]; [[w.small-antiwarriors]]; [[w.wells-war-within]]; [[w.zaroulis-who-spoke-up]]. Names: Dellinger, Spock, Mailer, Johnson, McNamara, Clark. Check: Gibbons puts the crowd at the Lincoln Memorial at 50,000 to 100,000, at least half of it going on to the Pentagon (IV, 865–66).'
      c: 'The March on the Pentagon, called by the National Mobilization Committee, Dellinger its chairman. A rally at the Lincoln Memorial, Spock among the speakers; some 30,000 to 35,000 go on to the Pentagon, many to stay the night; soldiers and marshals hold the building. Mailer among those arrested; 208 arrests by the *Times* of Oct. 23; 647 to 693 in all, by the later estimates. Johnson to McNamara and Ramsey Clark, Oct. 23: the troops and police acted "with restraint, firmness and professional skill."'
