- add:
    entry:
      id: cal.1965-12-09.vietnam-congress
      when: Dec. 9
      date: '1965-12-09'
      thread: vietnam-congress
      also:
      - vietnam-pause
      c: 'McGeorge Bundy to Johnson on the soundings of Congress, McNamara''s calls among them: Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford and Arends. Nearly all for a pause, then more force, bombing included, if needed to "win," and a resolution of support; the war not understood at home. Mansfield, cabled in Asia: against the bombing, doubtful of a pause meant as a prelude to escalation; better a cease-fire of about a month.'
      n: '[[w.gibbons-u-s-government-and]], IV, 119–20 and n.22 (the resolution drafted Dec. 6). To check: McGeorge Bundy to Johnson, Dec. 9, 1965, with McNamara''s memorandum of his calls (LBJ Library, NSF Memos to the President—McGeorge Bundy); Washington to Hong Kong 762, Dec. 9, and Manila to Washington 1132, Dec. 10 (State, Central File, Pol 27 Viet S). See [[cal.1965-12-07.vietnam-pause-2]]. Names: McGeorge Bundy, Johnson, McNamara, Sparkman, Church, Pastore, Monroney, Magnuson, Ervin, Robert Kennedy, Saltonstall, Kuchel, Javits, McCormack, Hébert, Ford, Arends, Mansfield.'
      tags:
