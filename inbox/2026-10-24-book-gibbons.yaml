- edit:
    id: cal.1967-11-13.vietnam
    base: e0d3385b
    set:
      n: 'FRUS 1964–68, V, doc. [400](https://history.state.gov/historicaldocuments/frus1964-68v05/d400). [[w.cosmas-joint-chiefs-of-staff]], 114, 123–124; [[w.gibbons-u-s-government-and]], IV, 891, 896–98. To check: [[w.westmoreland-soldier-reports]]; [[w.sorley-westmoreland]]; [[w.schaffer-ellsworth-bunker]]; [[w.hammond-public-affairs]]; [[w.oberdorfer-tet]]; [[w.schmitz-tet-offensive]]. See [[cal.1967-11-01.vietnam]]. Names: Bunker, Westmoreland, Komer, Rusk, McNamara, Wheeler, Helms, Johnson. Check: the meeting of FRUS 400 is of Nov. 15, 2:16 to 3:20 p.m.; Gibbons has them arrive Nov. 15 (IV, 896).'
      c: 'Bunker, Westmoreland and Komer in Washington. Bunker to the President, Rusk, McNamara, Wheeler and Helms: to Congress''s committees he reported "steady progress on the political, military, and economic front." Johnson: "First, get the number of targets down to the absolute minimum. Second, get the troops out there as rapidly as possible."'
- edit:
    id: cal.1967-11-16.vietnam
