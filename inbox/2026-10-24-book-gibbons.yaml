- add:
    entry:
      id: cal.1967-09-13.vietnam
      when: Sept. 13
      date: '1967-09-13'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'National Security Council. Goldberg on the Security Council: "Our friends are timid and reluctant"; still, "I would go," to "show to the Mansfields and that group that we at least tried." McNamara: a rebuff blamed on the bombing, on balance a loss; Katzenbach with him; Humphrey: not without the votes.'
      n: '[FRUS 1964–68, V, doc. 319](https://history.state.gov/historicaldocuments/frus1964-68v05/d319) (Bromley Smith''s summary). [[w.gibbons-u-s-government-and]], IV, 917–18 (Jim Jones''s notes: the words quoted). Made public: FRUS 1964–68, V (2002). See [[cal.1967-08-28.vietnam-congress-2]]. Names: Goldberg, Mansfield, McNamara, Katzenbach, Humphrey.'
      tags:
      - name:goldberg-arthur-j
      - name:mansfield-mike
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:humphrey-hubert-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-09-19.vietnam-congress
      when: Sept. 19
      date: '1967-09-19'
      thread: vietnam-congress
      c: 'Morse''s S. Con. Res. 44: the President to ask an emergency meeting of the Security Council, the United States pledged in advance to accept its decision; failing it, the General Assembly.'
      n: '[113 Cong. Rec., Senate, Sept. 19, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt19/pdf/GPO-CRECB-1967-pt19-6-1.pdf), 25957 (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 917. Check: Gibbons dates it Sept. 11; his page is in the Senate''s day of Sept. 19. See [[cal.1967-08-28.vietnam-congress-2]]. Names: Morse.'
      tags:
      - name:morse-wayne
- add:
    entry:
      id: cal.1967-10-05.vietnam
      when: Oct. 5
      date: '1967-10-05'
      thread: vietnam
      c: 'Rusk to his staff conference, after a *Times* story on dissent within the Government: "Either support the President or keep quiet"; "This is not a debating society." The decision not to create a war psychology: "Maybe this was a mistake."'
      n: '[[w.gibbons-u-s-government-and]], IV, 906–07 (Lindley to the Policy Planning Council, Oct. 5, 1967, State, Lot File 71 D 273). Names: Rusk.'
      tags:
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-10-09.vietnam-congress
      when: Oct. 9
      date: '1967-10-09'
      thread: vietnam-congress
      c: 'Mansfield''s letter to every Senator: go to the Security Council "win or lose," a recorded vote to show "who is willing and who is not willing." Johnson to Rostow: "get me a reply quickly."'
      n: 'The letter, [113 Cong. Rec., Senate, Oct. 12, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt21/pdf/GPO-CRECB-1967-pt21-7-2.pdf), 28857–58 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 918–19. See [[cal.1967-09-19.vietnam-congress]]. Names: Mansfield, Johnson, Rostow.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-10-13.economy-surcharge
      when: Oct. 13
      date: '1967-10-13'
      thread: economy-surcharge
      c: 'Schultze and Ackley to Johnson, "Impasse on the Tax Increase": keep pressing "even if in your judgment there is no chance of getting a tax increase passed," and fix the responsibility on the Republicans.'
      n: '[[w.gibbons-u-s-government-and]], IV, 922 (LBJ Library, WHCF Ex LE/FI 11-4). See [[cal.1967-10-03.economy]]. Names: Schultze, Ackley, Johnson.'
      tags:
      - name:schultze-charles-l
      - name:ackley-gardner
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-15.vietnam
      when: Oct. 15
      date: '1967-10-15'
      thread: vietnam
      c: '"MACV Strategic Study, September 1967–September 1968," sixty-eight pages: the enemy''s population base "slipping from his grasp." Pacification "of paramount importance"; the offensive cut to mobile brigades in each corps zone; American and South Vietnamese units integrated, against the forces'' eventual withdrawal.'
      n: '[[w.gibbons-u-s-government-and]], IV, 928–30 (National Archives, Westmoreland-CBS Papers). To check: [[w.sorley-thunderbolt]]. Names: Westmoreland.'
      tags:
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-10-17.vietnam-3
      when: Oct. 17
      date: '1967-10-17'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'The Joint Chiefs, "Increased Pressures on North Vietnam," JCSM-555-67: progress slow "largely because US military power has been restrained." Ten actions, among them all targets of military worth freed, the deep-water ports mined, more in Laos and Cambodia. McNamara to Johnson: for six of the ten, not the targets, the ports, the naval operations or Cambodia.'
      n: '[[w.gibbons-u-s-government-and]], IV, 925–27 (the report and McNamara''s memorandum, State, Central File, Pol 27 Viet S). To check: [[w.pentagon-papers]], IV, 210–14 (the report). See [[cal.1967-09-12.vietnam-pennsylvania]]. Names: McNamara, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-10-17.economy-surcharge
      when: Oct. 17
      date: '1967-10-17'
      thread: economy-surcharge
      c: 'Johnson with McCormack, Albert and Mansfield, 5:35 to 6:55 p.m.: Mills "wants to cut 5 to 10 billion dollars in expenditures and then in programs"; "We are in an all-out, knock-down war."'
      n: '[[w.gibbons-u-s-government-and]], IV, 922–23 (Tom Johnson''s notes). See [[cal.1967-10-13.economy-surcharge]]. Names: Johnson, McCormack, Albert, Mansfield, Mills.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:mansfield-mike
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1967-10-19.vietnam-congress
      when: Oct. 19
      date: '1967-10-19'
      thread: vietnam-congress
      c: 'Rusk to Fulbright, asked to testify in public: a meeting "will run less risk of damaging our foreign relations if it were held in Executive Session."'
      n: '[[w.gibbons-u-s-government-and]], IV, 910 (read into the committee''s executive session of Oct. 31, unpublished transcript). See [[cal.1967-10-17.vietnam-2]]. Names: Rusk, Fulbright.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-10-26.vietnam-congress
      when: Oct. 26
      date: '1967-10-26'
      thread: vietnam-congress
      c: 'Foreign Relations opens public hearings on Morse''s S. Con. Res. 44 and Mansfield''s S. Res. 180, Oct. 26, 27 and Nov. 2. Morse: Mansfield''s, with the broader support, the one to send to the President.'
      n: '[[w.gibbons-u-s-government-and]], IV, 920. To check: Senate Committee on Foreign Relations, *Submission of the Vietnam Conflict to the United Nations*, Hearings (1967). See [[cal.1967-10-25.vietnam]]. Names: Morse, Mansfield.'
      tags:
      - name:morse-wayne
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-10-31.vietnam-congress-2
      when: Oct. 31
      date: '1967-10-31'
      thread: vietnam-congress
      c: 'Foreign Relations in executive session, Fulbright reading Rusk''s letter. Hickenlooper, Mansfield, Lausche and Symington for hearing him in executive session; Aiken and Cooper too, the committee to decide after; Morse: "plain Executive supremacy"; Gore against secrecy. Agreed: Rusk asked to an executive session on a public one. Nov. 1, he accepts.'
      n: '[[w.gibbons-u-s-government-and]], IV, 910–11 (the committee''s unpublished transcript). See [[cal.1967-10-19.vietnam-congress]]. Names: Fulbright, Rusk, Hickenlooper, Mansfield, Lausche, Symington, Aiken, Cooper, Morse, Gore.'
      tags:
      - name:fulbright-j-william
      - name:rusk-dean
      - name:hickenlooper-bourke-b
      - name:mansfield-mike
      - name:lausche-frank-j
      - name:symington-william-s
      - name:aiken-george-d
      - name:cooper-john-sherman
      - name:morse-wayne
      - name:gore-albert-sr
- add:
    entry:
      id: cal.1967-11-02.vietnam-congress
      when: Nov. 2
      date: '1967-11-02'
      thread: vietnam-congress
      c: 'Goldberg before Foreign Relations, in executive session, then in public: seven and possibly eight of the nine votes in the Security Council; Johnson''s question whether failure would be "a defeat for the United States," Goldberg against it; Mansfield''s resolution would help him. Fulbright: "If you don''t get but one vote I would prefer that to no vote."'
      n: '[[w.gibbons-u-s-government-and]], IV, 920–21 (the unpublished transcript; the hearings, 149 ff.). To check: Senate Committee on Foreign Relations, *Submission of the Vietnam Conflict to the United Nations*, Hearings (1967). See [[cal.1967-10-26.vietnam-congress]]. Names: Goldberg, Johnson, Mansfield, Fulbright.'
      tags:
      - name:goldberg-arthur-j
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-11-06.vietnam-congress
      when: Nov. 6
      date: '1967-11-06'
      thread: vietnam-congress
      c: 'Macomber to Marcy, by telephone: his list of Senate "doves" or "dovishly inclined," some thirty; could Rusk appear in public without television? Marcy: the committee has never excluded one medium; the "circus atmosphere" an "unavoidable consequence of doing business with Congress."'
      n: '[[w.gibbons-u-s-government-and]], IV, 908–09, 911 (Marcy''s memoranda, National Archives, RG 46). See [[cal.1967-10-31.vietnam-congress-2]]. Names: Macomber, Marcy, Rusk.'
      tags:
      - name:macomber-william-b-jr
      - name:marcy-carl
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-11-06.vietnam-congress-2
      when: Nov. 6
      date: '1967-11-06'
      thread: vietnam-congress
      c: 'Evening, at a State Department reception, Rusk to Marcy: why a public session "in time of war"? Why "provide a public forum for candidates for President like McCarthy"?'
      n: '[[w.gibbons-u-s-government-and]], IV, 911 (Marcy''s memorandum). See [[cal.1967-11-06.vietnam-congress]]. Names: Rusk, Marcy, McCarthy.'
      tags:
      - name:rusk-dean
      - name:marcy-carl
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1967-11-07.vietnam-congress
      when: Nov. 7
      date: '1967-11-07'
      thread: vietnam-congress
      c: 'Rusk before Foreign Relations, in executive session. Fulbright: whether he testifies in public "a matter of constitutional significance"; Rusk to think it over and answer promptly. Fulbright to the press: "If the President doesn''t wish to advise with this Committee, there is no way to make him do it."'
      n: '[[w.gibbons-u-s-government-and]], IV, 912–13 (the unpublished transcript; the *Washington Post*, Nov. 8, 1967). See [[cal.1967-11-06.vietnam-congress-2]]. Names: Rusk, Fulbright.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-11-08.vietnam-congress
      when: Nov. 8
      date: '1967-11-08'
      thread: vietnam-congress
      c: 'Marcy to Fulbright: propose, himself or through Mansfield, "a bull session in the White House" on whether to stay in Vietnam, the President, McNamara, Rusk, Russell, Mansfield and Fulbright, "no Rostow."'
      n: '[[w.gibbons-u-s-government-and]], IV, 913 (National Archives, RG 46, Marcy Chron File). See [[cal.1967-11-07.vietnam-congress]]. Names: Marcy, Fulbright, Mansfield, McNamara, Rusk, Russell, Rostow.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:mcnamara-robert-s
      - name:rusk-dean
      - name:russell-richard-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-11-08.vietnam-2
      when: Nov. 8
      date: '1967-11-08'
      thread: vietnam
      c: 'Tuesday lunch, 1:00 to 2:15 p.m.: Rusk proposes that State and Defense plan operations for the next four months. Wheeler to Westmoreland that afternoon: "highest authority" thinking of top priority for the programs with the most effect in the South in six months, the infrastructure, the ARVN with American units, the RF and PF, corruption among them.'
      n: '[[w.gibbons-u-s-government-and]], IV, 896, 932–33 (no notes of the lunch; Wheeler to Westmoreland, JCS 9566, Nov. 8, 1967, CMH, Westmoreland Papers). To check: [[w.pentagon-papers]], IV, 536. See [[cal.1967-10-17.vietnam-3]]. Names: Rusk, Wheeler, Westmoreland, Johnson.'
      tags:
      - name:rusk-dean
      - name:wheeler-earle
      - name:westmoreland-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-11-20.economy-surcharge
      when: Nov. 20
      date: '1967-11-20'
      thread: economy-surcharge
      c: 'Johnson with sixteen leaders of both parties, 5:05 to 6:40 p.m., after the devaluation: the surtax "absolutely was imperative"; a cut of $4 billion in fiscal 1968 spending. Ford: the administration had opposed one "tooth and nail."'
      n: '[[w.gibbons-u-s-government-and]], IV, 923 (Tom Johnson''s notes). See [[cal.1967-11-18.economy]]. Names: Johnson, Ford.'
      tags:
      - name:johnson-lyndon-b
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1967-11-21.vietnam-congress
      when: Nov. 21
      date: '1967-11-21'
      thread: vietnam-congress
      c: Foreign Relations reports Mansfield's S. Res. 180, unanimous.
      n: '[[w.gibbons-u-s-government-and]], IV, 921. To check: S. Rept. 90-798 (1967). See [[cal.1967-11-02.vietnam-congress]]. Names: Mansfield.'
      tags:
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-11-27.vietnam
      when: Nov. 27
      date: '1967-11-27'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'The Joint Chiefs to McNamara, JCSM-663-67, "Policies for the Conduct of Operations in Southeast Asia over the Next Four Months": "no new programs" under the present guidelines would bring a rapid or visible gain; ten changes asked, Westmoreland''s York II in the A Shau Valley with a raid into Laos, patrols throughout the DMZ, air strikes in Cambodia, mining Haiphong, Hòn Gai and Cẩm Phả among them. McNamara sends it to Rusk.'
      n: '[FRUS 1964–68, V, doc. 418](https://history.state.gov/historicaldocuments/frus1964-68v05/d418). [[w.gibbons-u-s-government-and]], IV, 934–35. Made public: FRUS 1964–68, V (2002). See [[cal.1967-11-08.vietnam-2]]. Names: McNamara, Westmoreland, Rusk.'
      tags:
      - name:mcnamara-robert-s
      - name:westmoreland-william
      - name:rusk-dean
      - name:wheeler-earle
- add:
    entry:
      id: cal.1967-11-28.vietnam
      when: Nov. 28
      date: '1967-11-28'
      thread: vietnam
      c: 'Bohlen with Johnson, 11:19 to 11:57 a.m., Rostow there. Asked about the bombing, by Bohlen''s account: politically "the worst thing that the United States had done"; Rostow defends it; Johnson silent.'
      n: '[[w.gibbons-u-s-government-and]], IV, 936 (from [[w.bohlen-witness-to-history-1929]], 525). To check: [[w.bohlen-witness-to-history-1929]], 525. Names: Bohlen, Johnson, Rostow.'
      tags:
      - name:bohlen-charles-e
      - name:johnson-lyndon-b
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-11-28.vietnam-congress
      when: Nov. 28
      date: '1967-11-28'
      thread: vietnam-congress
      c: 'Manatos to Johnson: Gore to move to force Rusk to testify in public; Mansfield, better to "beat Gore to the punch." Afternoon, after Mansfield and Dirksen have canvassed the committee: Gore lacks the votes; Rusk might appear with a time limit, perhaps without television.'
      n: '[[w.gibbons-u-s-government-and]], IV, 913–14 (Manatos to Johnson, 12:10 and 5:46 p.m., LBJ Library, WHCF Ex FG 431/F). See [[cal.1967-11-07.vietnam-congress]]. Names: Manatos, Johnson, Gore, Rusk, Mansfield, Dirksen.'
      tags:
      - name:manatos-mike-n
      - name:johnson-lyndon-b
      - name:gore-albert-sr
      - name:rusk-dean
      - name:mansfield-mike
      - name:dirksen-everett
- add:
    entry:
      id: cal.1967-11-30.vietnam-congress
      when: Nov. 30
      date: '1967-11-30'
      thread: vietnam-congress
      c: 'Foreign Relations, executive session, on Gore''s motion: the chairman to tell the President of the committee''s concern at the "breakdown in public communication" from Rusk''s refusal to testify in public. Hickenlooper to table; Case and Carlson against squawking; Mundt for it. Not acted on: "Let it simmer," Pell. Fulbright to Rusk: most for a public exchange before adjournment.'
      n: '[[w.gibbons-u-s-government-and]], IV, 914–15 (the unpublished transcript; Fulbright to Rusk, Nov. 30, 1967, LBJ Library, NSF Country File, Vietnam). See [[cal.1967-11-28.vietnam-congress]]. Names: Gore, Rusk, Hickenlooper, Case, Carlson, Mundt, Pell, Fulbright.'
      tags:
      - name:gore-albert-sr
      - name:rusk-dean
      - name:hickenlooper-bourke-b
      - name:case-clifford-p
      - name:carlson-frank
      - name:mundt-karl-e
      - name:pell-claiborne-d
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-12-04.vietnam
      when: Dec. 4
      date: '1967-12-04'
      thread: vietnam
      c: 'Katzenbach to Rusk on JCSM-663-67: "a course of ever-expanding military objectives," maybe "a direct war against North Vietnam"; York II and the DMZ patrols "''firebreak'' issues." Instead: decelerate search and destroy near the borders, "make the enemy come to us," the ARVN a larger part.'
      n: '[[w.gibbons-u-s-government-and]], IV, 936–37 (State, Central File, Pol 27 Viet S). See [[cal.1967-11-27.vietnam]]. Names: Katzenbach, Rusk.'
      tags:
      - name:katzenbach-nicholas
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-12-07.vietnam-congress
      when: Dec. 7
      date: '1967-12-07'
      thread: vietnam-congress
      c: 'McPherson to Mansfield: support the President on the procedural question of Rusk''s testimony. Mansfield: "I think he''s wrong, but I''ll try to support him. But you ought to be aware that this could develop into a Constitutional crisis."'
      n: '[[w.gibbons-u-s-government-and]], IV, 915 (McPherson to Johnson, Dec. 7, 1967, LBJ Library, WHCF, Ex FG 185). See [[cal.1967-11-30.vietnam-congress]]. Names: McPherson, Mansfield, Rusk.'
      tags:
      - name:mcpherson-harry
      - name:mansfield-mike
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-12-08.vietnam-congress
      when: Dec. 8
      date: '1967-12-08'
      thread: vietnam-congress
      c: 'Rusk to Fulbright, cleared by McPherson: the matters "should be fully discussed only in executive session"; he will testify in one at any time.'
      n: '[[w.gibbons-u-s-government-and]], IV, 915 (LBJ Library, NSF Country File, Vietnam). See [[cal.1967-12-07.vietnam-congress]]. Names: Rusk, Fulbright, McPherson.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:mcpherson-harry
