- add:
    entry:
      id: cal.1966-06-09.opinion
      when: June 9
      date: '1966-06-09'
      thread: opinion
      also:
      - vietnam
      c: 'Moyers to Johnson on his talks with Harris, Gallup and other pollsters: "our standing is down and likely to drop further"; Vietnam the issue; "the people are in a foul mood over Vietnam," Harris says; the sentiment not to withdraw but "Why can''t we get it over with?" The President "on dead center"; their advice, "some ray of hope."'
      n: '[[w.gibbons-u-s-government-and]], IV, 339. To check: Moyers to Johnson, June 9, 1966 (LBJ Library, WHCF, CF PR 16). Names: Moyers, Johnson, Harris, Gallup.'
      tags:
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:harris-louis
      - name:gallup-george-h
- edit:
    id: cal.1966-06-29.vietnam
    base: 941680ed
    set:
      n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV, 360–78 (the decision, the NSC of June 17 and 22, Wilson''s dissociation, 369–71); [[w.pentagon-papers]], IV; [[w.drea-mcnamara-clifford-and-the-2011]], 74–76; [[w.frankum-like-rolling-thunder]], 47–50; [[w.vietnam-victory-in-vietnam]], 181–82; [[w.staaveren-gradual-failure]], 279–288. Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). To check: [[w.herring-lbj-and-vietnam]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]. Names: McNamara, William Bundy, Wilson, Holt, Ronning, Johnson.'
      c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29. Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result; put off for weather and leaks; Johnson''s assent to McNamara by telephone, June 28. Wilson, told in advance, dissociates Britain. Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."'
- edit:
    id: cal.1966-08-13.vietnam
    base: a163e5b8
    set:
      n: 'Remarks to the Press at the LBJ Ranch Following a Report on Vietnam by General Westmoreland, [1966 Pub. Papers 821](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=195) (Aug. 14, 1966). [[w.gibbons-u-s-government-and]], IV, 381. To check: [[w.westmoreland-soldier-reports]]. Names: Westmoreland, Johnson.'
- add:
    entry:
      id: cal.1966-06-17.vietnam
      when: June 17
      date: '1966-06-17'
      thread: vietnam
      c: 'The 559th NSC, on striking the oil stores. Johnson: "The choice is one of military lives vs. escalation." McNamara: he has opposed the strikes for months; the situation has changed. Humphrey: "I have come around reluctantly"; politically "it will play hell." Goldberg alone against: the Chinese and Soviets will make up the loss; the world''s reaction "strongly adverse."'
      n: 'FRUS 1964–68, IV, doc. [159](https://history.state.gov/historicaldocuments/frus1964-68v04/d159). [[w.gibbons-u-s-government-and]], IV, 372–74. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-06-29.vietnam]]. Names: Johnson, McNamara, Humphrey, Goldberg.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:humphrey-hubert-h
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1966-06-22.vietnam-congress-2
      when: June 22
      date: '1966-06-22'
      thread: vietnam-congress
      c: 'Johnson off the record with thirty members of the Armed Services and foreign affairs committees who had been to South Vietnam, ten Senators and twenty Representatives; Rusk, McNamara, Wheeler and Rostow with him; 5:45 to 7:10 p.m. By Monagan''s account, Johnson: "We are going to win!"; no one gives him a better alternative than McNamara''s or Wheeler''s; Hanoi reads "some Senators" more carefully than we do. Most members for more military pressure; Mansfield and Aiken against.'
      n: '[[w.gibbons-u-s-government-and]], IV, 376–77. To check: John S. Monagan, unpublished recollections. See [[cal.1966-06-29.vietnam]]. Names: Johnson, Rusk, McNamara, Wheeler, Rostow, Monagan, Mansfield, Aiken.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:rostow-walt-w
      - name:monagan-john-s
