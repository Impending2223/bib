- add:
    entry:
      id: cal.1966-06-09.opinion
      when: June 9
      date: '1966-06-09'
      thread: opinion
      also:
      - vietnam
      c: 'Moyers to Johnson on his talks with Harris, Gallup and other pollsters: "our standing is down and likely to drop further"; Vietnam the issue; "the people are in a foul mood over Vietnam," Harris says; the sentiment not to withdraw but "Why can''t we get it over with?" The President "on dead center"; their advice, "some ray of hope."'
      n: '[[w.gibbons-u-s-government-and]], IV, 339. To check: Moyers to Johnson, June 9, 1966 (LBJ Library, WHCF, CF PR 16). Names: Moyers, Johnson, Harris, Gallup.'
      tags:
      - name:moyers-bill
      - name:johnson-lyndon-b
      - name:harris-louis
      - name:gallup-george-h
- edit:
    id: cal.1966-06-29.vietnam
    base: 5897933e
    set:
      n: 'FRUS 1964–68, IV, docs. [152](https://history.state.gov/historicaldocuments/frus1964-68v04/d152), [161](https://history.state.gov/historicaldocuments/frus1964-68v04/d161), [164](https://history.state.gov/historicaldocuments/frus1964-68v04/d164). [Johnson and McNamara, 7:59 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-and-office-noise-june-28-1966), Conversation WH6606-06-10266 (Miller Center) (June 28, 1966). Remarks of Welcome to Prime Minister Holt of Australia on the South Lawn at the White House, [1966 Pub. Papers 664](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=740) (June 29, 1966); "Two Threats to World Peace" - Remarks in Omaha, [1966 Pub. Papers 679](https://www.govinfo.gov/content/pkg/PPP-1966-book1/pdf/PPP-1966-book1.pdf#page=755) (June 30, 1966). [[w.gibbons-u-s-government-and]], IV, 360–78 (the decision, the NSC of June 17 and 22, Wilson''s dissociation, 369–71); [[w.pentagon-papers]], IV; [[w.drea-mcnamara-clifford-and-the-2011]], 74–76; [[w.frankum-like-rolling-thunder]], 47–50; [[w.vietnam-victory-in-vietnam]], 181–82; [[w.staaveren-gradual-failure]], 279–288; [[w.dallek-flawed-giant]], 373–74 (the NSC of June 22, the strikes). Made public, the NSC''s notes and the call: FRUS 1964–68, IV (1998). To check: [[w.herring-lbj-and-vietnam]]; [[w.berman-lyndon-johnsons-war]]; [[w.mcnamara-in-retrospect]]. Names: McNamara, William Bundy, Wilson, Holt, Ronning, Johnson.'
      c: 'Navy and Air Force planes strike the oil storage at Haiphong and near Hanoi, June 29. Decided at the NSC June 22, where McNamara put the civilian dead at 50 to 300 and William Bundy reported Ronning''s second visit to Hanoi, June 14–17, without result; put off for weather and leaks; Johnson''s assent to McNamara by telephone, June 28. Wilson, told in advance, dissociates Britain. Holt of Australia, at the White House June 29: "all the way with LBJ." Johnson at Omaha, June 30: "We will see this through."'
- edit:
    id: cal.1966-08-13.vietnam
    base: a163e5b8
    set:
      n: 'Remarks to the Press at the LBJ Ranch Following a Report on Vietnam by General Westmoreland, [1966 Pub. Papers 821](https://www.govinfo.gov/content/pkg/PPP-1966-book2/pdf/PPP-1966-book2.pdf#page=195) (Aug. 14, 1966). [[w.gibbons-u-s-government-and]], IV, 381. To check: [[w.westmoreland-soldier-reports]]. Names: Westmoreland, Johnson.'
- edit:
    id: cal.1966-06-17.vietnam-2
    base: 975af7f3
    set:
      n: '[FRUS 1964–68, IV, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v04/d159). [[w.dallek-flawed-giant]], 373. Made public: FRUS 1964–68, IV (1998). [[w.gibbons-u-s-government-and]], IV, 372–74. Names: Johnson, Rusk, Ronning, Goldberg, McNamara, Humphrey.'
      c: 'NSC, 6:05 p.m.: the strikes on the oil stores. Johnson: not to disrupt the oil reaching the forces in the field is to pay in American casualties. The decision waits on Rusk''s return from NATO, Ronning''s report from Hanoi, word to the allies. McNamara: he has opposed the strikes for months; the situation has changed. Humphrey: "I have come around reluctantly"; politically "it will play hell." Goldberg alone against. "In order not to be lobbied on the decision, not another soul should be informed of this discussion."'
