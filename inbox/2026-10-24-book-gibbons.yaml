      n: 'Rostow to Johnson on the *Newsweek* report, Feb. 6: FRUS 1964–68, V, doc. [38](https://history.state.gov/historicaldocuments/frus1964-68v05/d38). [[w.schlesinger-robert-kennedy-and-his]], 764–69; [[w.dallek-flawed-giant]], 447 (the meeting of Feb. 6). [[w.gibbons-u-s-government-and]], IV, 551–52 (the meeting, 4:34 to 5:52 p.m., Katzenbach and Rostow present, by Schlesinger''s account). To check: [[w.shesol-mutual-contempt]]; [[w.kraslow-secret-search-for-peace]]; [[w.katzenbach-some-of-it-was]]. See [[cal.1966-12-09.poverty-nyc]]. Names: Robert Kennedy, Manac''h, Katzenbach, Rostow, Johnson.'
- add:
    entry:
      id: cal.1966-11-28.vietnam-congress
      when: Nov. 28
      date: '1966-11-28'
      thread: vietnam-congress
      c: 'Symington by telephone to Rostow, before going to Asia, by Rostow''s memorandum: "You and I have been hawks on Viet Nam since 1961. I am thinking of getting off the train soon"; with the restraints on air power "we can''t win"; in 1968 Nixon "will become the biggest dove of all times." Johnson''s note to Rostow, Nov. 30: "I know at least one more fellow who can turn faster on a dime than Nixon."'
      n: '[[w.gibbons-u-s-government-and]], IV, 551 n.79. To check: Rostow to Johnson, Nov. 28, 1966, with Johnson''s note, Nov. 30 (LBJ Library, C.F. ND 19/CO 312). Names: Symington, Rostow, Nixon, Johnson.'
      tags:
      - name:symington-william-s
      - name:rostow-walt-w
      - name:nixon-richard-m
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-01-09.vietnam-congress-2
      when: Jan. 9
      date: '1967-01-09'
      thread: vietnam-congress
      c: 'At Mansfield''s suggestion ("Let Mansfield do it," Johnson writes), Johnson with twenty-three Democratic Senators, chairmen and the Policy Committee, Humphrey present. Mansfield: unusual criticism of the President personally. Fulbright: find a way to "get out"; Rusk''s position that Hanoi must surrender. Magnuson: "get on with it. People want action." Muskie: withdrawal and escalation both unacceptable. Russell and Hill: "go in and win, or get out." Symington "not as optimistic"; Jordan calls the involvement "bad"; Bible: the war the main factor in Nevada''s elections.'
      n: '[[w.gibbons-u-s-government-and]], IV, 547–49. To check: notes of the meeting (LBJ Library, President''s Appointment File, Jan. 9, 1967, and Manatos''s, Ex FG 400); Humphrey''s notes, Jan. 10 (Minnesota Historical Society); [[w.obrien-no-final-victories]], 213–14. Names: Mansfield, Johnson, Humphrey, Fulbright, Rusk, Magnuson, Muskie, Russell, Hill, Symington, Jordan, Bible.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
