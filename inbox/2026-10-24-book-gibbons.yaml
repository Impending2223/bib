      n: 'Daily Digest, [112 Cong. Rec. D434](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=432), [112 Cong. Rec. D439](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=437), [112 Cong. Rec. D443](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=441). House Committee on Un-American Activities, *Hearings on H.R. 12047, H.R. 14925, H.R. 16175, H.R. 17140, and H.R. 17194—Bills to Make Punishable Assistance to Enemies of U.S. in Time of Undeclared War*, 89th Cong., 2d Sess. (Aug. 16–23, 1966), pts. [1](https://archive.org/details/hearingsonhr120401unit), [2](https://archive.org/details/hearingsonhr120402unit). [[w.gibbons-u-s-government-and]], IV, 428–29 (the hearings; Kinoy; Rubin). To check: [[w.goodman-committee]]; [[w.wells-war-within]]. Names: Rubin, Kinoy, Pool.'
- add:
    entry:
      id: cal.1966-05-24.vietnam-congress
      when: May 24
      date: '1966-05-24'
      thread: vietnam-congress
      also:
      - foreign-aid
      c: 'The Foreign Relations Committee, in executive session on the foreign aid bill, adopts Church''s amendment in the words State supplied: no assistance under the act to be construed "as creating a new commitment or as affecting any existing commitment" to use the armed forces for any foreign country. Rusk had asked Johnson; Johnson: "I would try to keep any amendment out—if not I''d try a modified amendment."'
      n: '[[w.gibbons-u-s-government-and]], IV, 414–15. To check: the committee''s transcript, May 24 and 26, 1966, unpublished; S. Rep. No. 89-1359, 7; Rostow to Johnson, May 13, 1966, with Meeker''s memorandum (LBJ Library, NSF Memos to the President—Walt Rostow). Check: Gibbons gives the amendment as enacted "creating" and Meeker''s language "enacting" (IV, 414, 415 n.108). Names: Church, Rusk, Johnson, Meeker.'
      tags:
      - name:church-frank
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:meeker-leonard-c
- add:
    entry:
      id: cal.1966-07-22.vietnam-congress
      when: July 22
      date: '1966-07-22'
      thread: vietnam-congress
      c: 'Fulbright in the Senate, on the foreign aid bill, against "the emerging Asian doctrine": unlimited in what it would do and unilateral in its execution; the United States "policeman and provider for all of non-Communist Asia," without the Senate''s advice and consent. Mansfield: no "Johnson Doctrine" for Asia, no commitment to bring before Congress. Moyers in reply: no commitments in the President''s speech that Fulbright is not aware of.'
      n: '[[w.gibbons-u-s-government-and]], IV, 416–18. To check: 112 Cong. Rec. 16808–14 (1966); *Washington Post*, July 23, 1966. See [[cal.1966-07-12.india-and-china]]. Names: Fulbright, Mansfield, Moyers.'
      tags:
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:moyers-bill
- add:
    entry:
      id: cal.1966-07-27.vietnam-congress
      when: July 27
      date: '1966-07-27'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, on Fulbright''s objection to the speech on Asia: perhaps a confusion of the United States as a "Pacific power" with an "Asian power"; make the difference clear. "Today''s generalizations are, too often, tomorrow''s sanction for the expansion of the permanent bureaucratic commitment." Johnson''s reply, drafted by Rostow, perfunctory.'
      n: '[[w.gibbons-u-s-government-and]], IV, 417. To check: Mansfield to Johnson, July 27, 1966, with Rostow''s transmittal, Aug. 1 (LBJ Library, NSF Memos to the President—Walt Rostow). See [[cal.1966-07-22.vietnam-congress]]. Names: Mansfield, Johnson, Fulbright, Rostow.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1966-08-08.economy
      when: Aug. 8
      date: '1966-08-08'
      thread: economy
      also:
      - vietnam
      c: 'Johnson with the congressional leaders on an income tax increase. By Califano''s account: Ford, "You''d have trouble getting more than fifteen votes"; Albert, "You wouldn''t even get that many!" Russell Long and Mills against any increase, but they might go along with suspending the investment credit.'
      n: '[[w.gibbons-u-s-government-and]], IV, 425–26. To check: [[w.califano-triumph-and-tragedy-of]], 148. Names: Johnson, Ford, Albert, Russell Long, Mills, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:ford-gerald-r
      - name:albert-carl
      - name:long-russell-b
      - name:mills-wilbur-d
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1966-08-15.vietnam-congress
      when: Aug. 15
      date: '1966-08-15'
      thread: vietnam-congress
      c: 'Marcy to Fulbright, Mansfield and Aiken: accept Sihanouk''s invitation to send three Senators to Cambodia, under Mansfield, Fulbright or Morse, with the President''s tacit approval; the real purpose to give the NLF or Hanoi "a chance to talk." Failing that, the fallout in Johnson''s favor.'
      n: '[[w.gibbons-u-s-government-and]], IV, 394. To check: Marcy''s memorandum, Aug. 15, 1966 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, Mansfield, Aiken, Sihanouk, Morse, Johnson.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:aiken-george-d
      - name:norodom-sihanouk
      - name:morse-wayne
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-24.vietnam-congress
      when: Aug. 24
      date: '1966-08-24'
      thread: vietnam-congress
      c: 'Harriman at lunch with Fulbright, to sound him out for Rusk or the President. By Harriman''s memorandum: Fulbright evades the question of how to start talks, but names two obstacles, no place for the NLF and Hanoi''s disbelief that the United States will ever withdraw; he himself does not believe it. Harriman: the President means to withdraw if North Vietnam does. Fulbright: Congress "more warlike than the President." He speaks slightingly of the coming elections in the South.'
      n: '[[w.gibbons-u-s-government-and]], IV, 394–95, 412. To check: Harriman, memorandum of conversation, Aug. 24, 1966 (Library of Congress, Harriman Papers, Fulbright File). Names: Harriman, Fulbright, Rusk, Johnson.'
      tags:
      - name:harriman-w-averell
      - name:fulbright-j-william
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-29.vietnam-support
      when: Aug. 29
      date: '1966-08-29'
      thread: vietnam-support
      c: 'Ball to Johnson on Bertrand Russell''s war crimes tribunal: an interagency group under Ball "quietly exploring with the British and French available legal steps"; articles to be stimulated on the "unsavory and leftwing background" of the organizers. The CIA to make dossiers on the tribunal''s members and staff.'
      n: '[[w.gibbons-u-s-government-and]], IV, 432–34. To check: Ball, "Items for Evening Reading," Aug. 29, 1966, and Ball to Johnson, Sept. 16 (State, Lot File 74 D 164); the assignments memorandum, Aug. 25 (State, Central File, Pol 27 Viet S). Names: Ball, Johnson.'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-31.vietnam
      when: Aug. 31
      date: '1966-08-31'
      thread: vietnam
      c: 'Rostow to Johnson, on Taylor''s warning of Aug. 30 that Westmoreland''s concept of operations would make an "open-ended requirement" for American forces: McNamara wants no review in Washington but a reorganization of pacification in Vietnam, his task for his October trip. Johnson approves, and wants word sent to Westmoreland "so that he will not assume that we have approved."'
      n: 'FRUS 1964–68, IV, docs. [221](https://history.state.gov/historicaldocuments/frus1964-68v04/d221) (Taylor), [223](https://history.state.gov/historicaldocuments/frus1964-68v04/d223) (Rostow). [[w.gibbons-u-s-government-and]], IV, 405–06. Names: Rostow, Johnson, Taylor, Westmoreland, McNamara.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:taylor-maxwell
      - name:westmoreland-william
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-09-19.vietnam-congress
      when: Sept. 19
      date: '1966-09-19'
      thread: vietnam-congress
      c: 'Helms, at Johnson''s direction, briefs Fulbright, Mansfield and Russell on the CIA''s study "The Will to Persist." By Helms''s report: no one''s view changed; Fulbright holds the war a civil war internationalized by the United States, and asks whether the briefing is meant to stop his and Mansfield''s criticism; Russell would have come to the same conclusions.'
      n: '[[w.gibbons-u-s-government-and]], IV, 418–19. To check: Helms to Rostow, "Senatorial Briefing," Sept. 20, 1966 (LBJ Library, NSF Agency File, CIA). Names: Helms, Johnson, Fulbright, Mansfield, Russell.'
      tags:
      - name:helms-richard
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-09-20.vietnam-congress
      when: Sept. 20
      date: '1966-09-20'
      thread: vietnam-congress
      also:
      - thailand
      c: 'Foreign Relations in executive session on Thailand, William Bundy the witness: the constitutional and legal ground of what the United States does there, and the secrecy. Symington: explain it to the public; Bundy: the Thais object. Marcy''s memorandum beforehand: Fulbright wants "a constitutional discussion of what is happening to Senate authority."'
      n: 'Daily Digest, [112 Cong. Rec. D509](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=507). [[w.gibbons-u-s-government-and]], IV, 419–20. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 979 (1993); Marcy to Bader, Aug. 29, 1966 (National Archives, RG 46, Marcy Chron File). Names: William Bundy, Symington, Marcy, Fulbright.'
      tags:
      - name:bundy-william
      - name:symington-stuart-s
      - name:marcy-carl
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-09-20.elections-1966
      when: Sept. 20
      date: '1966-09-20'
      thread: elections-1966
      also:
      - vietnam
      c: 'The House Republican Conference brings up to date its paper of 1965 on the war: a stalemate; peace "not in sight"; a five-year war would cost 125,000 American casualties. Boggs and Mahon: a partisan issue made of the war. Laird: no clear objectives; Ford: "deception and confusion."'
      n: '[[w.gibbons-u-s-government-and]], IV, 422–23. To check: 112 Cong. Rec. 23225–28, 23309–18 (1966). Names: Boggs, Mahon, Laird, Ford.'
      tags:
      - name:boggs-hale
      - name:mahon-george-h
      - name:laird-melvin-r
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1966-10-13.vietnam-congress
      when: Oct. 13
      date: '1966-10-13'
      thread: vietnam-congress
      c: 'Stennis in the Senate, the day McNamara is back from Saigon: "It is time that we take a good hard look at the realities"; a nation with little industry has tied us down; "prepare for the long pull," some Great Society programs deferred. Symington with him; Thurmond for the "full power" of the United States.'
      n: '[[w.gibbons-u-s-government-and]], IV, 421. To check: 112 Cong. Rec. 26537–41 (1966). Check: Gibbons prints the pages "16537-26541." See [[cal.1966-10-14.vietnam]]. Names: Stennis, McNamara, Symington, Thurmond.'
      tags:
      - name:stennis-john-c
      - name:mcnamara-robert-s
      - name:symington-stuart-s
      - name:thurmond-strom
- add:
    entry:
      id: cal.1966-10-13.students
      when: Oct. 13
      date: '1966-10-13'
      thread: students
      also:
      - vietnam-congress
      c: The House passes Pool's bill, H.R. 12047, against aid to an enemy in an undeclared war and obstruction of the armed forces' movements, [275–64](https://voteview.com/rollcall/RH0890367), after seven quorum calls; 56 Democrats and 8 Republicans against. Justice and Defense had called it unnecessary. It dies in the Senate's Judiciary Committee.
      n: '[112 Cong. Rec., House, Oct. 13, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-1-2.pdf). [[w.gibbons-u-s-government-and]], IV, 429–30. Check: Gibbons has the debate on Oct. 12, the vote at 112 Cong. Rec. 26592–93. See [[cal.1966-08-16.students]]. Names: Pool.'
      tags:
      - name:pool-joe-r
- add:
    entry:
      id: cal.1966-11-29.vietnam-support
      when: Nov. 29
      date: '1966-11-29'
      thread: vietnam-support
      c: 'A statement drawn up by Freedom House, signed by 145 leaders, Eisenhower, Acheson and Javits among them, and printed as an advertisement in the *New York Times*: critics should renounce "such fantasies" as that this is "Lyndon Johnson''s War," that its leaders commit "war crimes," or that military service is at the individual''s option.'
      n: '[[w.gibbons-u-s-government-and]], IV, 434–35. To check: *New York Times*, Nov. 30, 1966. Names: Eisenhower, Acheson, Javits, Johnson.'
      tags:
      - name:eisenhower-dwight-d
      - name:acheson-dean-g
      - name:javits-jacob-k
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-10.vietnam-congress
      when: Nov. 10
      date: '1966-11-10'
      thread: vietnam-congress
      c: Mansfield proposes that the Security Council invite all the interested parties, North Vietnam, the NLF and China among them, to a meeting on the war.
      n: '[[w.gibbons-u-s-government-and]], IV, 403. To check: *New York Times*, Nov. 11, 1966. Names: Mansfield.'
      tags:
      - name:mansfield-mike
- add:
    entry:
      id: cal.1966-11.vietnam-congress
      when: Nov.
      date: 1966-11
      thread: vietnam-congress
      c: 'New York. Mansfield, brought by Goldberg at Johnson''s request, with U Thant, Katzenbach present. By Goldberg''s report, U Thant against formal Security Council consideration of the war, which "could only lead to increased tensions"; the only hope private channels, his own among them. By Mansfield''s note to Johnson, U Thant: "China is real key and cannot be contacted."'
      n: '[[w.gibbons-u-s-government-and]], IV, 403. To check: USUN New York to Washington 2499, Nov. 20, 1966 (State, Lot File 70 D 48); Mansfield to Johnson (LBJ Library, NSF Files of Mike Mansfield). Check: the day; Goldberg''s cable is of Nov. 20. See [[cal.1966-11-10.vietnam-congress]]. Names: Mansfield, Goldberg, Johnson, U Thant, Katzenbach.'
      tags:
      - name:mansfield-mike
      - name:goldberg-arthur-j
      - name:johnson-lyndon-b
      - name:u-thant
      - name:katzenbach-nicholas
