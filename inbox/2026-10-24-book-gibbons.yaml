    set:
      n: '[FRUS 1964–68, V, doc. 341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.johnson-vantage-point]], 428. Made public: Johnson''s memoir (1971); the notes, FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 807–08 (Tom Johnson''s notes). Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
- edit:
    id: cal.1967-07-10.vietnam
    base: cc587691
    set:
      n: '[113 Cong. Rec., House, July 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt14/pdf/GPO-CRECB-1967-pt14-2-2.pdf), 18193–94, 18227, 18233 ff. (Gibbons''s pages). [[w.johns-vietnams-second-front]], 157 (all but Albert and Rivers); [[w.gibbons-u-s-government-and]], IV, 801–03. To check: Read to Rostow, "Comments on Republican Proposal for Staged De-Escalation in Vietnam," July 10, 1967 (State, Central File, Pol 27 Viet S). Check: Johns cites a press release of July 17. Names: Morse, Stafford, Albert, Rivers.'
      c: 'Bradford Morse and Stafford, with other House Republicans, propose a staged de-escalation, "GRID": no bombing north of the 21st parallel, Hanoi in, Haiphong out, for sixty days; north of the 20th if Hanoi answers in kind; and so on, step for step. Albert answers them: the plan implies the key to peace "lies not in Hanoi, but in Washington." Rivers: Hanoi not "punished ... enough."'
- tag:
    id: cal.1967-07-10.vietnam
    add:
    - name:albert-carl
    - name:rivers-l-mendel
- edit:
    id: cal.1967-07-10.congo
    base: 4ad8b820
    set:
      n: 'FRUS 1964–68, XXIII, doc. [519](https://history.state.gov/historicaldocuments/frus1964-68v23/d519). [113 Cong. Rec., Senate, July 10, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt14/pdf/GPO-CRECB-1967-pt14-2-1.pdf), 18093 ff. (Gibbons''s page). [[w.gibbons-u-s-government-and]], IV, 809. See [[cal.1967-07-05.congo]]. Names: Russell, Stennis, Fulbright, Mansfield, Morse, McCarthy, Case, Pearson, Thurmond, Young, Ford.'
      c: 'Senators protest the C-130s: Russell, in the Senate, against intervening where "we have no commitment or any vital interest whatever"; Stennis, Fulbright, Mansfield, Morse, McCarthy, Case, James Pearson, Thurmond and Milton Young with him; Ford in the House.'
- tag:
