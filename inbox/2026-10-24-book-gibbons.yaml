    base: 440a598b
    set:
      n: 'Daily Digest, [113 Cong. Rec. D505](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=503) (Oct. 3, 1967). [113 Cong. Rec., House, Oct. 3, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt20/pdf/GPO-CRECB-1967-pt20-9-2.pdf). [[w.zelizer-taxing-america]], 264–65 (the day, the motion, Mills for it). Check: Zelizer, 265, counts Mills, ten Republicans and eight Democrats for the motion. [[w.gibbons-u-s-government-and]], IV, 760 (20–5, by CQ''s *Almanac*, 1967, 653). To check: [[w.bernstein-guns-or-butter]]; [[w.okun-political-economy-of-prosperity]]. See [[cal.1967-01-10.economy]]; [[cal.1967-08-03.economy]]. Names: Watts, Mills.'
      c: Ways and Means sets the surcharge aside on Watts's motion, 20–5, until the President and Congress agree on cuts in spending; Mills for it. The House orders the rule for another continuing resolution, [213–205](https://voteview.com/rollcall/RH0900151).
- edit:
