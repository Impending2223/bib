      when: Oct. 22
      date: '1965-10-22'
      thread: vietnam-congress
      c: 'Fulbright in the Senate, on his criticism of the President: a consensus "a miscarriage of democratic procedures insofar as it represents the concealment of differences."'
      n: '[111 Cong. Rec., Senate, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-1.pdf), 28372 ff. [[w.gibbons-u-s-government-and]], IV, 41 n.128. See [[cal.1965-09-15.latin-america]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-08-27.vietnam
      when: Aug. 27
      date: '1965-08-27'
      thread: vietnam
      also:
      - defense
      c: 'The Joint Chiefs to McNamara, JCSM-652-65, "Concept for Vietnam": the war "the single most critical international problem facing the United States"; intensified air and naval pressure on the North, its war-supporting power progressively destroyed and its routes cut; search and destroy in the South from secure bases; a buildup in Thailand. Never approved by the civilians.'
      n: '[FRUS 1964–68, III, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v03/d130). [[w.gibbons-u-s-government-and]], IV, 45–48, 50 (Wheeler''s later regret that he did not press for its approval). Made public: FRUS 1964–68, III (1996). Names: McNamara, Wheeler.'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
- add:
    entry:
      id: cal.1965-09-11.vietnam
      when: Sept. 11
      date: '1965-09-11'
      thread: vietnam
      also:
      - defense
      c: 'McNamara to Wheeler on the Chiefs'' concept: recommendations for future operations "should be submitted for individual consideration as they are developed." McNaughton, Sept. 8, had advised against approving it as a whole: blockade, mining, the Thai buildup "clearly controversial." The same day Rusk, McNamara, McGeorge Bundy and Ball meet on the war; Rusk asks whether 200,000 men are needed.'
      n: '[FRUS 1964–68, III, doc. 136](https://history.state.gov/historicaldocuments/frus1964-68v03/d136) (McNaughton). McNamara to the Chairman of the Joint Chiefs, "Concept for Vietnam," Sept. 11, 1965 (National Archives, RG 330); McGeorge Bundy to Johnson, Sept. 12, on the meeting (LBJ Library, NSF Memos to the President) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 47–48, 72–73. See [[cal.1965-08-27.vietnam]]. Names: McNamara, Wheeler, McNaughton, Rusk, McGeorge Bundy, Ball.'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:mcnaughton-john-t
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:ball-george-w
- add:
    entry:
      id: cal.1965-09-13.vietnam
      when: Sept. 13
      date: '1965-09-13'
      thread: vietnam
      also:
      - defense
      c: 'Johnson''s luncheon, 1:16 to 2:20 p.m., with Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Moyers and Califano. McNamara: the Chiefs'' program of Sept. 2, the SAM sites, the airfields with IL-28s, targets near Hanoi, Haiphong and China, a "significant escalation," premature; Rusk agrees. Two bridges toward China, one day each; Johnson approves.'
      n: '[FRUS 1964–68, III, doc. 140](https://history.state.gov/historicaldocuments/frus1964-68v03/d140) (Califano''s notes). [[w.gibbons-u-s-government-and]], IV, 73. Made public: FRUS 1964–68, III (1996). Names: Johnson, Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Moyers, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:raborn-william-f-jr
      - name:ball-george-w
      - name:moyers-bill
      - name:califano-joseph-a-jr
- add:
    entry:
      id: cal.1965-09-15.vietnam
      when: Sept. 15
      date: '1965-09-15'
      thread: vietnam
      also:
      - defense
      c: 'McNamara to Wheeler: the Chiefs'' strikes of Sept. 17–30 (JCSM-670-65) not approved; not persuaded the gains outweigh the risks, above all "a US-Chinese confrontation"; a new estimate of Hanoi''s, Moscow''s and Peking''s reactions asked.'
      n: '[FRUS 1964–68, III, doc. 142](https://history.state.gov/historicaldocuments/frus1964-68v03/d142). [[w.gibbons-u-s-government-and]], IV, 73–74. See [[cal.1965-09-13.vietnam]]. Names: McNamara, Wheeler.'
      tags:
      - name:mcnamara-robert-s
      - name:wheeler-earle
