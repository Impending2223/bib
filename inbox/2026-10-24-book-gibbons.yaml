- add:
    entry:
      id: cal.1967-05-19.vietnam-2
      when: May 19
      date: '1967-05-19'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson with Rusk, McNamara, Rostow and Christian, 5:38 to 6:59 p.m., on the Hanoi power plant and a shift south of the 20th parallel. Rostow''s memorandum, 3 p.m.: "dangerously strong feelings in your official family"; strike the plant, then cut back around Hanoi and Haiphong for some weeks while Moscow has its chance to "deliver something." Accepted, by Gibbons''s reading.'
      n: 'FRUS 1964–68, V, doc. [176](https://history.state.gov/historicaldocuments/frus1964-68v05/d176) (Rostow''s memorandum). [[w.gibbons-u-s-government-and]], IV, 650–52 (and Cooper''s account, [[w.cooper-lost-crusade]], 375). Made public: FRUS 1964–68, V (2002). See [[cal.1967-05-19.vietnam]]. Names: Johnson, Rusk, McNamara, Rostow, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:christian-george
- add:
    entry:
      id: cal.1967-06-12.vietnam-2
      when: June 12
      date: '1967-06-12'
      thread: vietnam
      c: Johnson with Walt, commanding the Marines in Vietnam, alone, 1:24 to 1:28 p.m., by the Daily Diary; Greene had asked a "complete briefing" on I Corps. Walt then to the press.
      n: '[[w.gibbons-u-s-government-and]], IV, 667 n.122 (the Daily Diary). Names: Johnson, Walt, Greene.'
      tags:
      - name:johnson-lyndon-b
      - name:walt-lewis-w
      - name:greene-wallace-m-jr
- add:
    entry:
      id: cal.1967-06-13.vietnam
      when: June 13
      date: '1967-06-13'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Tuesday lunch, 1:10 to 2:35 p.m., Johnson with McNamara, Katzenbach, Rostow and Christian, McGeorge Bundy and Thompson joining, on the three bombing options: the Joint Chiefs'' wider program, McNamara''s south of the 20th, Harold Brown''s refinement of the present one. The present level to hold until McNamara is back from Vietnam. Helms: none would affect the war in the South.'
      n: '[[w.gibbons-u-s-government-and]], IV, 667 (by Read''s memorandum to Rusk, June 15). To check: Read to Rusk, June 15, 1967 (State, Lot File 74 D 164). See [[cal.1967-06-12.vietnam]]. Names: Johnson, McNamara, Katzenbach, Rostow, Christian, McGeorge Bundy, Thompson, Harold Brown, Helms.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:rostow-walt-w
      - name:christian-george
      - name:bundy-mcgeorge
      - name:thompson-llewellyn-e
      - name:brown-harold
      - name:helms-richard
- add:
    entry:
      id: cal.1967-06-15.vietnam
      when: June 15
      date: '1967-06-15'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson with Rusk, McNamara, Walt and Eugene Rostow, Wheeler, Helms, Christian and McGeorge Bundy, 11:55 a.m. to 1:06 p.m., on the bombing. No notes. Walt Rostow''s memorandum, 10:45 a.m.: McNamara expects the war through 1968, low-key; give Moscow some weeks, perhaps through Kosygin''s visit, and decide troops and bombing together when McNamara returns.'
      n: 'FRUS 1964–68, V, doc. [203](https://history.state.gov/historicaldocuments/frus1964-68v05/d203) (Rostow''s memorandum). [[w.gibbons-u-s-government-and]], IV, 667–69. Made public: FRUS 1964–68, V (2002). See [[cal.1967-06-13.vietnam]]. Names: Johnson, Rusk, McNamara, Walt Rostow, Eugene Rostow, Wheeler, Helms, Christian, McGeorge Bundy, Kosygin.'
      tags:
