- add:
    entry:
      id: cal.1965-08-25.vietnam-congress
      when: Aug. 25
      date: '1965-08-25'
      thread: vietnam-congress
      also:
      - defense
      c: 'The Senate passes the defense appropriation for fiscal 1966, H.R. 9221, with the $1.7 billion for Southeast Asia, [89–0](https://voteview.com/rollcall/RS0890204). Morse votes for it: the troops there "must have every possible bit of protection." Gruening, who voted against the war''s money in May, for it too; he had talked with Johnson, at his own request, Aug. 19.'
      n: '[111 Cong. Rec., Senate, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-1.pdf), 21732. [[w.gibbons-u-s-government-and]], IV, 33, 38. See [[cal.1965-08-04.vietnam-congress]]. Names: Morse, Gruening, Johnson.'
      tags:
      - name:morse-wayne
      - name:gruening-ernest
      - name:johnson-lyndon-b
- add:
