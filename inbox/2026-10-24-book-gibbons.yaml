    set:
      n: 'Statement by the President on the Nomination of Secretary McNamara as President of the International Bank for Reconstruction and Development, [1967 Pub. Papers 1077](https://www.govinfo.gov/content/pkg/PPP-1967-book2/pdf/PPP-1967-book2.pdf#page=469) (Nov. 29, 1967). [[w.mcnamara-in-retrospect]], 311–314; [[w.drea-mcnamara-clifford-and-the-2011]], 177, 221; [[w.dallek-flawed-giant]], 494–95 (the appointment and its background); [[w.gibbons-u-s-government-and]], IV, 892. To check: [[w.shapley-promise-and-power]]. See [[cal.1967-11-01.vietnam]]. Names: McNamara, Woods, Fowler, Johnson. Check: Gibbons has it announced Nov. 28 (IV, 892).'
