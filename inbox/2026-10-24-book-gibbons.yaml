- add:
    entry:
      id: cal.1966-09-15.vietnam
      when: Sept. 15
      date: '1966-09-15'
      thread: vietnam
      c: 'McNamara, without waiting for the Joint Chiefs'' answer, names Starbird director of Joint Task Force 728: an infiltration interdiction system across South Vietnam and Laos "as a matter of highest priority," in operation by Sept. 15, 1967. CINCPAC had called a barrier impracticable, Sept. 13; the Chiefs, Sept. 17, approve with reservations.'
      n: 'FRUS 1964–68, IV, doc. [233](https://history.state.gov/historicaldocuments/frus1964-68v04/d233). [[w.gibbons-u-s-government-and]], IV, 454–56. Made public: [[w.pentagon-papers]], IV, 113–23 (1971). Names: McNamara, Starbird.'
      tags:
      - name:mcnamara-robert-s
      - name:starbird-alfred-d
- add:
    entry:
      id: cal.1966-10-13.vietnam-congress-2
      when: Oct. 13
      date: '1966-10-13'
      thread: vietnam-congress
      c: 'Mansfield to Johnson, privately: raising the military ante "gets us in deeper all the time, with no terminus in sight." Stop bombing the North and agree to an immediate hold-fire, then a cease-fire and negotiations, the NLF a party; a token withdrawal of 30,000 men in the first week; U Thant to carry the terms to Hanoi. Johnson''s reply perfunctory.'
      n: 'FRUS 1964–68, IV, doc. [266](https://history.state.gov/historicaldocuments/frus1964-68v04/d266). [[w.gibbons-u-s-government-and]], IV, 447. Made public: FRUS 1964–68, IV (1998). Names: Mansfield, Johnson, U Thant.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:u-thant
- add:
    entry:
      id: cal.1966-10-19.vietnam-congress
      when: Oct. 19
      date: '1966-10-19'
      thread: vietnam-congress
      c: 'Aiken in the Senate, as Johnson leaves for Manila: two choices, escalate into a new dimension, or de-escalate; the United States "could well declare unilaterally that this stage of the Vietnam war is over—that we have ''won,''" redeploy its forces around strategic centers and put reconnaissance in place of bombing. By Aiken''s later account, the only time Johnson "ever really got mad at me."'
      n: '[112 Cong. Rec., Senate, Oct. 19, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt20/pdf/GPO-CRECB-1966-pt20-5-1.pdf), 27523–25. [[w.gibbons-u-s-government-and]], IV, 447–50 (and Aiken''s account, CRS interview, Oct. 19, 1978; Marks''s, of Johnson''s reply to him in 1967: "in my gut I knew that you and George Aiken were right"). Names: Aiken, Johnson.'
      tags:
      - name:aiken-george-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-03.vietnam-congress
      when: Nov. 3
      date: '1966-11-03'
      thread: vietnam-congress
      c: 'Johnson gives Fulbright an hour''s private briefing on Manila, after Fulbright had come with Humphrey to meet him at Dulles on his return; Rusk to go on with it at lunch. Johnson''s letter after: "Let me have your suggestions from time to time." Fulbright then praises the conference''s results.'
      n: '[[w.gibbons-u-s-government-and]], IV, 446 (Stone''s account of the airport and the statement). To check: I. F. Stone, *In a Time of Torment* (1967), 346–47; Johnson to Fulbright, Nov. 4, 1966 (LBJ Library, Ex FO 6-3). See [[cal.1966-10-24.vietnam-asian-trip]]. Names: Johnson, Fulbright, Humphrey, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:humphrey-hubert-h
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-11-05.vietnam-congress
      when: Nov. 5
      date: '1966-11-05'
      thread: vietnam-congress
      c: 'Rusk at lunch with Fulbright. Jacobsen to Johnson: it went well; Fulbright "very relaxed on Vietnam and seemed to be moving closer to our position."'
      n: '[[w.gibbons-u-s-government-and]], IV, 446. To check: Jacobsen to Johnson, Nov. 5, 1966 (LBJ Library, WHCF, Name File, Fulbright). See [[cal.1966-11-03.vietnam-congress]]. Names: Rusk, Fulbright, Jacobsen, Johnson.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:jacobsen-jake
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-11-16.vietnam
      when: Nov. 16
      date: '1966-11-16'
      thread: vietnam
      c: 'Johnson to Lodge, in Komer''s draft, on the dual plan for pacification approved the day before as "final": no major difference between Lodge''s ideas and Washington''s; a limited number of American combat forces as catalysts; he had favored giving it all to MACV. By hand: "Make them all follow your orders and lets get going."'
      n: 'FRUS 1964–68, IV, doc. [310](https://history.state.gov/historicaldocuments/frus1964-68v04/d310). [[w.gibbons-u-s-government-and]], IV, 471–73. Names: Johnson, Lodge, Komer.'
      tags:
      - name:johnson-lyndon-b
      - name:lodge-henry-cabot
      - name:komer-robert-w
