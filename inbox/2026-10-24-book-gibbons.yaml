    set:
      n: '[FRUS 1964–68, V, doc. 403](https://history.state.gov/historicaldocuments/frus1964-68v05/d403). [[w.johnson-vantage-point]], 376–77. Made public: in part, [[w.johnson-vantage-point]], 376–77; FRUS 1964–68, V (2002). [[w.gibbons-u-s-government-and]], IV, 884–85. See [[cal.1967-11-01.vietnam]]. Names: Rusk, McNamara.'
- edit:
    id: cal.1967-11-21.vietnam-2
    base: d24673c3
    set:
      n: 'FRUS 1964–68, V, doc. [409](https://history.state.gov/historicaldocuments/frus1964-68v05/d409). [[w.gibbons-u-s-government-and]], IV, 896–900 (the meeting, from Tom Johnson''s notes and Rostow''s; the speech, from the *Times* of Nov. 20). See [[cal.1967-11-13.vietnam]]. Names: Westmoreland, Bunker, Johnson, McNamara. Check: Gibbons dates the speech to the Press Club Nov. 19 (IV, 896).'
      c: 'Westmoreland at the National Press Club: "We have reached an important point when the end begins to come into view"; a phasing down of the American effort conceivable "within two years or less" (Check the words). The same morning, the President with Bunker, Westmoreland and his advisers: more allied troops, and the troops approved, as fast as possible. "I am beginning to agree with Bob McNamara that it does not appear the targets are worth the loss in planes."'
