    set:
      n: 'FRUS 1964–68, V, doc. [141](https://history.state.gov/historicaldocuments/frus1964-68v05/d141). [[w.gibbons-u-s-government-and]], IV, 617–18 (the words; the text, 113 Cong. Rec. 10699–700). To check: [[w.sorley-westmoreland]]; [[w.westmoreland-soldier-reports]]. See [[cal.1967-03-18.vietnam]]. Names: Westmoreland.'
      c: 'Westmoreland home. New York, to the Associated Press: the enemy "sees every protest as evidence of crumbling morale and diminishing resolve" (Check the place).'
- edit:
    id: cal.1967-04-28.vietnam
    base: 058ff6ce
    set:
      n: 'The address to Congress, 56 *Dep''t St. Bull.* 738 (1967). Remarks at a Luncheon for General Westmoreland, [1967 Pub. Papers 469](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=537) (Apr. 28, 1967). [[w.gibbons-u-s-government-and]], IV, 619–20. See [[cal.1967-04-24.vietnam]]. Names: Westmoreland, Johnson, Wheeler, Russell, Stennis, Fulbright, Mahon.'
      c: 'Westmoreland to a joint meeting of Congress: "we will prevail in Vietnam over the Communist aggressor." Johnson''s luncheon for him, the governors and the members of the foreign policy, armed services and appropriations committees. After it, he and Wheeler call on Russell, Stennis, Fulbright and Mahon.'
