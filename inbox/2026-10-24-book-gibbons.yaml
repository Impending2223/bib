- add:
    entry:
      id: cal.1967-08-28.vietnam-congress-2
      when: Aug. 28–29
      date: '1967-08-28'
      thread: vietnam-congress
      c: 'Mansfield in the Senate: the Vietnam question to the Security Council, where the American resolution has waited since February 1966; the Council "a good forum for the airing of issues." Morse, Aiken, Fulbright, Cooper, Symington, Pell, Sparkman, Church, Carlson, Lausche, Allott, Hart, Mondale, Pastore and Edward Long with him, Aug. 28 and 29.'
      n: '[113 Cong. Rec., Senate, Aug. 28, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt18/pdf/GPO-CRECB-1967-pt18-5-2.pdf), 24287; [Aug. 29](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt18/pdf/GPO-CRECB-1967-pt18-6-1.pdf), 24437 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 916. To check: Senate Committee on Foreign Relations, *Submission of the Vietnam Conflict to the United Nations*, Hearings, Oct. 26, 27 and Nov. 2, 1967 (1967); [[w.oberdorfer-senator-mansfield-2003]]. See [[cal.1966-01-31.vietnam]]. Names: Mansfield, Morse, Aiken, Fulbright, Cooper, Symington, Pell, Sparkman, Church, Carlson, Lausche, Allott, Hart, Mondale, Pastore, Long.'
      tags:
      - name:mansfield-mike
      - name:morse-wayne
      - name:aiken-george-d
      - name:fulbright-j-william
      - name:cooper-john-sherman
      - name:symington-william-s
      - name:pell-claiborne-d
