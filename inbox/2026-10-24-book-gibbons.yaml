    entry:
      id: cal.1967-05-19.vietnam-air-war
      when: May 19
      date: '1967-05-19'
      thread: vietnam-air-war
      c: The Hanoi thermal power plant, a mile from the center of the city, struck.
      n: '[[w.gibbons-u-s-government-and]], IV, 651 (and Cooper''s account, [[w.cooper-lost-crusade]], 375: many more strikes before it was out of operation). Check: Gibbons has Johnson approving the strike May 16 (IV, 568) and the strike after the meeting of May 19 (IV, 651). See [[cal.1967-05-19.vietnam-2]].'
- add:
    entry:
      id: cal.1967-05-22.vietnam-air-war
      when: May 22
      date: '1967-05-22'
      thread: vietnam-air-war
      also:
      - soviet-union
      c: The bombing around Hanoi and Haiphong cut back, in part to move Moscow to bring Hanoi to talks.
      n: '[[w.gibbons-u-s-government-and]], IV, 651–52. Check: the order''s terms and day. See [[cal.1967-05-19.vietnam-2]].'
