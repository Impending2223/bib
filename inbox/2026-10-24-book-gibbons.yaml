    entry:
      id: cal.thread.vietnam-congress
      s: Congress and the President
      parent: vietnam
      c: 'The war as Congress met it: hearings and reports, the votes on its money, the briefings at the White House, the members'' letters, memoranda and talks with the President. Mansfield''s report on aid; his and Fulbright''s letters on the MAAG.'
