      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1966-04-25.vietnam
      when: Apr. 25
      date: '1966-04-25'
      thread: vietnam
      c: 'Johnson with Humphrey, Rusk, McNamara, Ball, William Bundy, Rostow, Raborn, Helms, Komer and Moyers, eighteen minutes, on the working group''s report. By Rostow''s record: "We shall stay on course and explore with Lodge a cautious Track B."'
      n: '[[w.gibbons-u-s-government-and]], IV, 298, 300. To check: Rostow, Memorandum for the Record, Apr. 25, 1966 (LBJ Library, NSF Country File, Vietnam). See [[cal.1966-04-24.vietnam]]. Names: Johnson, Humphrey, Rusk, McNamara, Ball, William Bundy, Rostow, Raborn, Helms, Komer, Moyers, Lodge.'
      tags:
      - name:johnson-lyndon-b
