- add:
    entry:
      id: cal.thread.vietnam-support
      s: Support at home
      parent: vietnam
      c: 'The administration''s campaign for support at home and against its critics: the information meetings, *Why Vietnam*, the Dean committee; the law professors and the bar; the FBI on Fulbright and Morse and on the embassies'' callers.'
    section: th
