- add:
    entry:
      id: cal.1965-11-18.vietnam
      when: Nov. 18
      date: '1965-11-18'
      thread: vietnam
      also:
      - economy
      c: 'Moyers to Fowler by telephone on a speech Fowler would give business: the President thinks it "a little too hard on the Vietnam situation"; he is "saying himself that we can have both guns and butter," and does not want to tell business "that we have declared war in Vietnam." Fowler: he had tried to avoid saying there was a war on, but it is "the only psychological ribbon on which we can fight a lot of these things."'
      n: '[[w.gibbons-u-s-government-and]], IV, 214. To check: Notes of the telephone conversation (LBJ Library, Papers of Henry H. Fowler). Names: Moyers, Fowler, Johnson.'
      tags:
      - name:moyers-bill
      - name:fowler-henry-h
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-12-03.economy
      when: Dec. 3
      date: '1965-12-03'
      thread: economy
      also:
      - vietnam
      c: 'Johnson to McGeorge Bundy, on McNamara''s estimate of the war''s cost in fiscal 1967, $15 to $17 billion: "My 70 young congressmen can''t take it." "I''d much rather go for a 10 Billion supplemental."'
      n: '[[w.gibbons-u-s-government-and]], IV, 216. To check: McGeorge Bundy''s notes, Dec. 3, 1965 (LBJ Library, Papers of McGeorge Bundy). Names: Johnson, McGeorge Bundy, McNamara.'
      tags:
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-12-22.economy
      when: Dec. 22
      date: '1965-12-22'
      thread: economy
      also:
      - vietnam
      c: 'Little Rock, Ark. Fowler with Mills on the budget and taxes for the war. Mills: civilian spending in fiscal 1967 no higher than in 1966; cover the present rate of the war''s spending "but no more"; no tax increase in 1966 on the deficit discussed, but "we must seriously think about a tax increase in 1967"; asked for taxes in 1966, Republicans, some Democrats and liberals "would start tearing at the budget instead."'
      n: '[[w.gibbons-u-s-government-and]], IV, 215–16. To check: Fowler to Johnson, Dec. 29, 1965 (LBJ Library, C.F. FI2). Names: Fowler, Mills.'
      tags:
      - name:fowler-henry-h
      - name:mills-wilbur-d
      - state:ar
- add:
    entry:
      id: cal.1965-12-27.economy
      when: Dec. 27
      date: '1965-12-27'
      thread: economy
      also:
      - vietnam
      c: 'Schultze to Johnson, "1967 Budgetary and Fiscal Policy": put $10 billion for the war in the fiscal 1967 budget, not the $16 to $18 billion expected, on the assumption that it ends by June 30, 1967; then, if the fighting goes on, $6 to $8 billion more in a supplemental in May or June, with an income tax increase of about $5 billion tied to it and not to the Great Society. Ackley the same day: a "significant tax increase" needed, though tactically perhaps only later in the year.'
      n: '[[w.gibbons-u-s-government-and]], IV, 215–17. To check: [[w.bernstein-guns-or-butter]]; Schultze to Johnson, Dec. 27, 1965 (LBJ Library, C.F. FI4); Ackley to Johnson, Dec. 17 and 27 (LBJ Library, Ex/FI4, C.F. FI4). Names: Schultze, Johnson, Ackley.'
      tags:
      - name:schultze-charles-l
      - name:johnson-lyndon-b
      - name:ackley-gardner
- add:
    entry:
      id: cal.1965-12-23.vietnam-congress
      when: Dec. 23
      date: '1965-12-23'
      thread: vietnam-congress
      c: 'The Foreign Relations staff to Fulbright, Tillman''s memorandum sent by Holt: public hearings on Vietnam "can even be regarded as a Committee responsibility"; they might bring the debate "to an official forum." Talk first to Hickenlooper, Aiken and Mansfield.'
      n: '[[w.gibbons-u-s-government-and]], IV, 222–23. To check: National Archives, RG 46, Papers of the Committee on Foreign Relations. Names: Fulbright, Hickenlooper, Aiken, Mansfield.'
      tags:
      - name:fulbright-j-william
      - name:hickenlooper-bourke-b
      - name:aiken-george-d
      - name:mansfield-mike
- add:
    entry:
      id: cal.1966-01-20.vietnam-supplemental
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-supplemental
      also:
      - defense
      c: 'Senate Armed Services and the defense subcommittee of Appropriations, Russell chairman of both, open joint hearings in executive session on the military authorization of the supplemental, $4.8 billion: McNamara and Wheeler. Ervin: "people are dying unlimitedly in a limited war"; Symington for bombing harbors and oil, or get out; McNamara: strategic bombing would not stop the infiltration.'
      n: 'Daily Digest, [112 Cong. Rec. D14](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=12). [[w.gibbons-u-s-government-and]], IV, 220–22 (the hearings, and the House Armed Services Committee''s after them). To check: Senate Comm. on Armed Services and Subcomm. on Dep''t of Defense of the Comm. on Appropriations, *Supplemental Military Procurement and Construction Authorizations, Fiscal Year 1966: Hearings*, 89th Cong., 2d Sess. (1966), 153–54. See [[cal.1966-01-19.vietnam]]. Names: Russell, McNamara, Wheeler, Ervin, Symington.'
      tags:
      - name:russell-richard-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:ervin-sam-j-jr
      - name:symington-william-s
- add:
    entry:
      id: cal.1966-01-28.vietnam-congress
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-congress
      c: 'Rusk before Foreign Relations in open session on the $415 million of supplemental aid, State having pressed for a closed one: "battered by questions" on the war. Fulbright: never so much apprehension over a military involvement; should Congress not give "its further approval of this changed situation?" Rusk: "I will have to take it under advisement." The commitment, Rusk says, rests on SEATO; Church doubts that intervention against every revolution is wise.'
      n: 'Daily Digest, [112 Cong. Rec. D26](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=24). [[w.gibbons-u-s-government-and]], IV, 222, 224–26 (MacArthur''s call to Marcy against an open session). To check: Senate Comm. on Foreign Relations, *Supplemental Foreign Assistance, Fiscal Year 1966—Vietnam: Hearings*, 89th Cong., 2d Sess., 2, 50–51, 61, 73–75 (1966). Names: Rusk, Fulbright, Church, MacArthur, Marcy.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:church-frank
      - name:macarthur-douglas-ii
      - name:marcy-carl
- add:
    entry:
      id: cal.1966-01-29.vietnam-congress
      when: Jan. 29
      date: '1966-01-29'
      thread: vietnam-congress
      c: Saturday. Senators not on the Foreign Relations Committee meet Fulbright to urge public hearings on the war.
      n: '[[w.gibbons-u-s-government-and]], IV, 223. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-02-01.vietnam-congress
      when: Feb. 1
      date: '1966-02-01'
      thread: vietnam-congress
      c: Ten of the fifteen Senators who wrote against resuming the bombing meet privately with Fulbright; they agree to try to force the administration into a full discussion of its policy.
      n: '*New York Times*, Feb. 2, 1966. [[w.gibbons-u-s-government-and]], IV, 223. See [[cal.1966-01-29.vietnam-congress]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-02-02.vietnam-congress
      when: Feb. 2
      date: '1966-02-02'
      thread: vietnam-congress
      c: Javits and Randolph again propose that Congress replace the Southeast Asia resolution with one approving the war on its present scale and stating its aims.
      n: '[112 Cong. Rec., Senate, Feb. 2, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-5-2.pdf), 1892 ff. [[w.gibbons-u-s-government-and]], IV, 251. Names: Javits, Randolph.'
      tags:
      - name:javits-jacob-k
      - name:randolph-jennings
- add:
    entry:
      id: cal.1966-02-03.vietnam-congress
      when: Feb. 3
      date: '1966-02-03'
      thread: vietnam-congress
      c: Foreign Relations, in closed session, agrees to hold public hearings on the war, the witnesses left to Fulbright and Hickenlooper, Hickenlooper still against open sessions.
      n: 'Daily Digest, [112 Cong. Rec. D34](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=32). *New York Times*, Feb. 4, 1966. [[w.gibbons-u-s-government-and]], IV, 223–24. Opened: [[cal.1966-02-04.vietnam]]. Names: Fulbright, Hickenlooper.'
      tags:
      - name:fulbright-j-william
      - name:hickenlooper-bourke-b
- add:
    entry:
      id: cal.1966-02-16.vietnam-congress
      when: Feb. 16
      date: '1966-02-16'
      thread: vietnam-congress
      also:
      - vietnam-supplemental
      c: 'The Senate takes up the war''s supplemental authorization; two weeks of debate, Gore, Hartke, Church, Young, Gruening, Morse and Clark the critics. Long, acting majority leader: "these advocates of retreat, defeat, surrender, and national dishonor" on television; every such speech "goes right back to Hanoi." Russell: no vote on policy, "the throwing of a rope to a man in the water."'
      n: '[112 Cong. Rec., Senate, Feb. 16, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt3/pdf/GPO-CRECB-1966-pt3-4-1.pdf), 3041–43 (Long and the answers); the debate, 3135–4404 passim. [[w.gibbons-u-s-government-and]], IV, 242, 252–53. Names: Gore, Hartke, Church, Young, Gruening, Morse, Clark, Long, Russell.'
      tags:
      - name:gore-albert-sr
      - name:hartke-rupert-v
      - name:church-frank
      - name:young-stephen-m
      - name:gruening-ernest
      - name:morse-wayne
      - name:clark-joseph-s
      - name:long-russell-b
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-02-19.vietnam-congress
      when: Feb. 19
      date: '1966-02-19'
      thread: vietnam-congress
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball, Wheeler, Taylor and Helms, 10 a.m. to 1:30 p.m., on the Senate. "Real source of our trouble is Stennis": the 600,000 figure, from "our figures." "Maybe we consult with ''em too much"; "You could lose the Senate." Of the motions coming, Morse''s "is the one to press." "The pause has done this to us." Word comes in of Robert Kennedy''s statement on the NLF.'
      n: '[FRUS 1964–68, IV, doc. 79](https://history.state.gov/historicaldocuments/frus1964-68v04/d79) (Helms''s record). [[w.gibbons-u-s-government-and]], IV, 253–54. Made public: FRUS 1964–68, IV (1998). To check: McGeorge Bundy''s notes (LBJ Library, Papers of McGeorge Bundy). See [[cal.1966-02-19.vietnam]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, Wheeler, Taylor, Helms, Stennis, Morse, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:ball-george-w
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:helms-richard
      - name:stennis-john-c
      - name:morse-wayne
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1966-02-21.vietnam-congress
      when: Feb. 21
      date: '1966-02-21'
      thread: vietnam-congress
      c: 'Rusk lunches with four of the Foreign Relations Committee''s "problem Senators," Case, Church, Clark and Pell: none for leaving at once, all against more troops, troubled by talk of 600,000; they ask a private briefing of the committee by the President.'
      n: '[[w.gibbons-u-s-government-and]], IV, 253. To check: Rusk''s report in the President''s "night reading" (State, Lot File 74 D 164). Names: Rusk, Case, Church, Clark, Pell, Johnson.'
      tags:
      - name:rusk-dean
      - name:case-clifford-p
      - name:church-frank
      - name:clark-joseph-s
      - name:pell-claiborne-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-02-21.vietnam-support
      when: Feb. 21
      date: '1966-02-21'
      thread: vietnam-support
      c: 'The American Bar Association''s House of Delegates resolves, 279–0, that the American position in Vietnam is legal under international law, the UN Charter and the SEATO treaty; Deutsch''s resolution, Russell Long''s prompting, the White House in it. The White House had arranged the law professors'' letter of Feb. 14 against the Lawyers Committee''s brief; Katzenbach, Feb. 19, to Johnson: the brief "a blatant misreading."'
      n: '*New York Times*, Feb. 22, 1966. The letter of Feb. 14: 112 Cong. Rec. 3843 (1966) (Check: the day and the link). [[w.gibbons-u-s-government-and]], IV, 246–47 n.96. To check: Katzenbach to Johnson, Feb. 19, 1966 (LBJ Library, Ex ND 19/CO 312); McPherson to Alford, Feb. 5 (LBJ Library, Office Files of Harry McPherson). Names: Long, Katzenbach, Johnson, McPherson.'
      tags:
      - name:long-russell-b
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - name:mcpherson-harry
- add:
    entry:
      id: cal.1966-02-22.vietnam-congress
      when: Feb. 22
      date: '1966-02-22'
      thread: vietnam-congress
      c: 'Johnson with his advisers, 11:45 a.m. to 1:30 p.m., on asking Congress for a new resolution: Rusk against, except "to beat Morse"; McNamara and Clifford against; Ball: ride it out and the country stays in an uproar, or amend the resolution. The leaders to meet Humphrey Thursday at 8 a.m., the committees after. Helms to Moyers, Feb. 23: twenty votes against a new resolution would look to Hanoi a "significant erosion."'
      n: '[FRUS 1964–68, IV, doc. 82](https://history.state.gov/historicaldocuments/frus1964-68v04/d82). [[w.gibbons-u-s-government-and]], IV, 254–55. Made public: FRUS 1964–68, IV (1998). To check: McGeorge Bundy''s notes; Helms to Moyers, Feb. 23 (LBJ Library). See [[cal.1966-02-19.vietnam-congress]]. Names: Johnson, Rusk, Morse, McNamara, Clifford, Ball, Humphrey, Helms, Moyers.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:morse-wayne
      - name:mcnamara-robert-s
      - name:clifford-clark
      - name:ball-george-w
      - name:humphrey-hubert-h
      - name:helms-richard
      - name:moyers-bill
- add:
    entry:
      id: cal.1966-02-22.vietnam-support
      when: Feb. 22
      date: '1966-02-22'
      thread: vietnam-support
      also:
      - vietnam-congress
      c: 'Marcy to Fulbright: the White House staff had asked State''s intelligence bureau for a political dossier on Fulbright and other critics; Hughes refused, and Ball countermanded the request.'
      n: '[[w.gibbons-u-s-government-and]], IV, 229–30. To check: Marcy to Fulbright, Feb. 22, 1966 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, Hughes, Ball.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:hughes-thomas-l
      - name:ball-george-w
- add:
    entry:
      id: cal.1966-02-24.vietnam-congress
      when: Feb. 24
      date: '1966-02-24'
      thread: vietnam-congress
      c: '8 a.m., Johnson and Humphrey with the leaders, Mansfield away ill: Humphrey, back from Asia, "Tide of battle has turned." Johnson: "I intend to carry out the resolution. If you choose, you can repeal the resolution. I think I have the authority without the resolution." McCormack: repeal "wouldn''t get to first base"; Dirksen: "wouldn''t get four votes." Johnson: "can''t understand why Americans who dissent can''t do their dissenting in private." Then the Foreign Relations, Foreign Affairs, Armed Services and Appropriations committees; then all of Congress, in four groups.'
      n: '[FRUS 1964–68, IV, doc. 84](https://history.state.gov/historicaldocuments/frus1964-68v04/d84). [[w.gibbons-u-s-government-and]], IV, 235–36. Made public: FRUS 1964–68, IV (1998). To check: Transcript of the briefing of Feb. 24 (LBJ Library, Congressional Briefings Notes). See [[cal.1966-02-22.vietnam-congress]]. Names: Johnson, Humphrey, Mansfield, McCormack, Dirksen.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mansfield-mike
      - name:mccormack-john-w
      - name:dirksen-everett
- add:
    entry:
      id: cal.1966-02-24.vietnam-support
      when: Feb. 24
      date: '1966-02-24'
      thread: vietnam-support
      also:
      - vietnam-congress
      c: 'Hoover sends Johnson the memorandum he asked for: the FBI, at the President''s direction, had watched the Foreign Relations hearings to set Fulbright''s and Morse''s statements beside "the Communist Party line." Nothing showed the party had given the committee material.'
      n: '[[w.gibbons-u-s-government-and]], IV, 228 n.45. Made public: the Church Committee''s report, Apr. 1976. To check: Senate Select Comm. to Study Governmental Operations with Respect to Intelligence Activities, *Final Report*, Book II, 229, and Book III, 489, S. Rep. No. 94-755 (1976). Names: Hoover, Johnson, Fulbright, Morse.'
      tags:
      - name:hoover-j-edgar
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:morse-wayne
- add:
    entry:
      id: cal.1966-02-26.vietnam
      when: Feb. 26
      date: '1966-02-26'
      thread: vietnam
      c: 'Saturday, the first meeting of the President''s Vietnam Group, 12:45 to 2:16 p.m., on the "other war" after Honolulu: a Washington "czar" for the nonmilitary programs to be picked within days (Komer). Asked about a resolution, Johnson: "nothing more need be done now"; Morse''s motion to repeal to come to a vote, Russell''s to reaffirm not.'
      n: '[FRUS 1964–68, IV, doc. 85](https://history.state.gov/historicaldocuments/frus1964-68v04/d85) (Bromley Smith''s notes). [[w.gibbons-u-s-government-and]], IV, 232–33, 255. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-02-06.vietnam]]. Names: Johnson, Komer, Morse, Russell.'
      tags:
      - name:johnson-lyndon-b
      - name:komer-robert-w
      - name:morse-wayne
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-02-28.vietnam-congress
      when: Feb. 28
      date: '1966-02-28'
      thread: vietnam-congress
      c: 'Twelve Democratic Senators against the war meet on a "sense of Congress" amendment: Gore, Young, McCarthy, McGovern, Gruening, Morse, Clark, Bartlett, Burdick, Moss, Fulbright, Robert Kennedy. Morse will not drop his motion to repeal; Fulbright against any amendment, fifteen votes a victory for the President. McCarthy, as reported: "We''ve got a wild man in the White House." No amendment. Mansfield, Fulbright and Russell then agree: Morse''s motion to be tabled, Russell''s reaffirmation not offered.'
      n: 'Drew Pearson, "Washington Merry-Go-Round," *Washington Post*, Mar. 10, 1966; *New York Times*, Mar. 1, 1966. [[w.gibbons-u-s-government-and]], IV, 255–57. Made public: Pearson''s column, Mar. 10, 1966. To check: Norvill Jones, "Points to Make on Sense of Congress Amendment" (National Archives, RG 46). Names: Gore, Young, McCarthy, McGovern, Gruening, Morse, Clark, Bartlett, Burdick, Moss, Fulbright, Robert Kennedy, Mansfield, Russell.'
      tags:
      - name:gore-albert-sr
      - name:young-stephen-m
      - name:mccarthy-eugene-j
      - name:mcgovern-george
      - name:gruening-ernest
      - name:morse-wayne
      - name:clark-joseph-s
      - name:bartlett-edward-l
      - name:burdick-quentin-n
      - name:moss-frank-e
      - name:fulbright-j-william
      - name:kennedy-robert-f
      - name:mansfield-mike
      - name:russell-richard-b
- add:
    entry:
      id: cal.1966-03-01.vietnam-2
      when: Mar. 1
      date: '1966-03-01'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Ball lunches with McGovern, Clark, Ribicoff and Tydings, at McGovern''s asking, before the vote; the "dissenting Senators" offer a "Gavin-Kennan" policy, "staying where we are with what we have on the ground"; Ball: "totally unrealistic."'
      n: '[[w.gibbons-u-s-government-and]], IV, 258 n.127. To check: Ball to Johnson, Mar. 1, 1966 (State, Lot File 74 D 272). Names: Ball, McGovern, Clark, Ribicoff, Tydings.'
      tags:
      - name:ball-george-w
      - name:mcgovern-george
      - name:clark-joseph-s
      - name:ribicoff-abraham
      - name:tydings-joseph-d
- add:
    entry:
      id: cal.1966-03-01.vietnam-congress
      when: Mar. 1
      date: '1966-03-01'
      thread: vietnam-congress
      c: 'Fulbright in the Senate, as the debate ends: a neutralized Southeast Asia, the United States and China both withdrawing their military power; to bring China to it, enclaves on the coast as Gavin proposed. Mar. 19, he writes Johnson to consider such a plan.'
      n: '[112 Cong. Rec., Senate, Mar. 1, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt4/pdf/GPO-CRECB-1966-pt4-2-1.pdf), 4379 ff. *New York Times*, Mar. 2, 1966. [[w.gibbons-u-s-government-and]], IV, 259. Names: Fulbright, Gavin, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:gavin-james-m
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-03-02.vietnam-congress
      when: Mar. 2
      date: '1966-03-02'
      thread: vietnam-congress
      c: 'Humphrey meets the Foreign Relations Committee informally in Mansfield''s office, Johnson having refused to let him testify: Fulbright presses him on his pledge to Thailand and on the NLF; Humphrey, by Cooper''s account, near tears. Fulbright at the end: "You know we all love you."'
      n: '[[w.gibbons-u-s-government-and]], IV, 236–37. Made public: the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 411–67 (1993). Names: Humphrey, Mansfield, Johnson, Fulbright, Cooper.'
      tags:
      - name:humphrey-hubert-h
      - name:mansfield-mike
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:cooper-chester-l
- add:
    entry:
      id: cal.1966-03-02.vietnam
      when: Mar. 2
      date: '1966-03-02'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'McPherson to Johnson, "For what it''s worth": Fulbright''s nephew Teasdale writes that the Senator bears the President no personal feeling and a reconciliation might be managed. Johnson: "Pursue this." Moyers, on Teasdale''s next letter: reconciliation is being sought "through other personal channels."'
      n: '[[w.gibbons-u-s-government-and]], IV, 237–39. To check: McPherson to Johnson, Mar. 2, 1966, with Teasdale''s letters (LBJ Library, Office Files of Harry McPherson). Names: McPherson, Johnson, Fulbright, Moyers.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:moyers-bill
- add:
    entry:
      id: cal.1966-03-03.vietnam-congress
      when: Mar. 3
      date: '1966-03-03'
      thread: vietnam-congress
      c: 'McNamara before Foreign Relations in executive session, having refused an open one. To Fulbright''s "They haven''t given up for 20 years": nor have they faced such force; as they expand, "we must continue to expand ours," until they can increase no further.'
      n: 'Daily Digest, [112 Cong. Rec. D84](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=82). [[w.gibbons-u-s-government-and]], IV, 248. Made public: the Historical Series, 1993. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 499–500 (1993). Names: McNamara, Fulbright.'
      tags:
      - name:mcnamara-robert-s
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-03-06.vietnam-congress
      when: Mar. 6
      date: '1966-03-06'
      thread: vietnam-congress
      c: 'Rusk to Fulbright, against the amendments before the committee: the President acting "fully within his constitutional powers"; the resolution and the vote of 92 to 5; the amendments would "make our enemies more obdurate."'
      n: '[[w.gibbons-u-s-government-and]], IV, 262. To check: Rusk to Fulbright, Mar. 6, 1966 (State, Lot File 70 D 207). Names: Rusk, Fulbright.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-03-07.vietnam-congress
      when: Mar. 7
      date: '1966-03-07'
      thread: vietnam-congress
      also:
      - vietnam-supplemental
      c: 'Foreign Relations, executive session, orders the supplemental aid bill reported, 18–1, Morse against. Fulbright''s amendment, that aid is no commitment to defend with American forces, fails 6–13: Fulbright, Morse, Gore, Church, Clark and Pell for it. McGovern''s, offered by Church, that the bill ratifies no decision on Vietnam, fails 5–14. McCarthy, by the press account, red-faced over Rusk''s letter.'
      n: 'Daily Digest, [112 Cong. Rec. D91](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=89). S. Rep. No. 89-1060 (1966). *New York Times*, Mar. 8, 1966. [[w.gibbons-u-s-government-and]], IV, 260–62. To check: Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 609–41 (1993). See [[cal.1966-03-06.vietnam-congress]]. Names: Morse, Fulbright, Gore, Church, Clark, Pell, McGovern, McCarthy, Rusk.'
      tags:
      - name:morse-wayne
      - name:fulbright-j-william
      - name:gore-albert-sr
      - name:church-frank
      - name:clark-joseph-s
      - name:pell-claiborne-d
      - name:mcgovern-george
      - name:mccarthy-eugene-j
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-03-07.vietnam-support
      when: Mar. 7
      date: '1966-03-07'
      thread: vietnam-support
      also:
      - vietnam-congress
      c: 'DeLoach of the FBI, at the President''s request, gives Dirksen, in confidence, information on Fulbright and Morse; Dirksen: both "very much obligated to communist interests"; the China hearings "obviously" instigated. Hickenlooper told Mar. 8.'
      n: '[[w.gibbons-u-s-government-and]], IV, 229. Made public: Theoharis, 1991. To check: DeLoach to Tolson, Mar. 7, 1966, in Athan Theoharis, ed., *From the Secret Files of J. Edgar Hoover*, 237–38 (1991). Names: DeLoach, Johnson, Dirksen, Fulbright, Morse, Hickenlooper.'
      tags:
      - name:deloach-cartha
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:fulbright-j-william
      - name:morse-wayne
      - name:hickenlooper-bourke-b
- add:
    entry:
      id: cal.1966-03-10.vietnam-supplemental
      when: Mar. 10
      date: '1966-03-10'
      thread: vietnam-supplemental
      c: The Senate passes the supplemental foreign assistance authorization, H.R. 12169, [82–2](https://voteview.com/rollcall/RS0890281), Morse and Gruening against.
      n: '[112 Cong. Rec., Senate, Mar. 10, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-1-1.pdf), 5563. [[w.gibbons-u-s-government-and]], IV, 263. See [[cal.1966-02-24.vietnam-supplemental]]. Names: Morse, Gruening.'
      tags:
      - name:morse-wayne
      - name:gruening-ernest
- add:
    entry:
      id: cal.1966-03-14.vietnam-support
      when: Mar. 14
      date: '1966-03-14'
      thread: vietnam-support
      also:
      - vietnam-congress
      c: 'Johnson with DeLoach: the FBI to report the contacts of members of Congress and others with foreign embassies, the Soviet above all; the protest and the hearings stirred by foreign officials; six Senators, Fulbright, Morse, Robert Kennedy, Gruening, Clark and Aiken, had been to the Soviet embassy or seen its ambassador. A 67-page list follows, Mar. 22, and reports every two weeks to 1969.'
      n: '[[w.gibbons-u-s-government-and]], IV, 228. Made public: the Church Committee''s report, 1976; Theoharis, 1978. To check: DeLoach''s report, as printed in Athan G. Theoharis, *Spying on Americans*, 177–78 (1978). Names: Johnson, DeLoach, Fulbright, Morse, Robert Kennedy, Gruening, Clark, Aiken.'
      tags:
      - name:johnson-lyndon-b
      - name:deloach-cartha
      - name:fulbright-j-william
      - name:morse-wayne
      - name:kennedy-robert-f
      - name:gruening-ernest
      - name:clark-joseph-s
      - name:aiken-george-d
- add:
    entry:
      id: cal.1966-03-15.congress
      when: Mar. 15
      date: '1966-03-15'
      thread: congress
      also:
      - vietnam-supplemental
      c: The House passes the supplemental defense appropriation, H.R. 13546, [389–3](https://voteview.com/rollcall/RH0890222), Burton, Conyers and Ryan against.
      n: '[112 Cong. Rec., House, Mar. 15, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt5/pdf/GPO-CRECB-1966-pt5-3-1.pdf), 5802–23. [[w.gibbons-u-s-government-and]], IV, 263. Names: Burton, Conyers, Ryan.'
      tags:
      - name:burton-phillip
      - name:conyers-john-jr
      - name:ryan-william-f
