      when: Jan. 18
      date: '1967-01-18'
      thread: vietnam-congress
      also:
      - vietnam-sunflower
      c: Johnson with Mansfield, Dirksen, Fulbright, Hickenlooper, Russell and Aiken in the Cabinet Room, 9:40 to 10:45 a.m., Rostow the only staff; Margaret Chase Smith invited, not present. No record of what was said. Jan. 24, the Foreign Relations Committee decides to hold its hearings.
      n: '[[w.gibbons-u-s-government-and]], IV, 506. To check: President''s Appointment File, Diary Backup, Jan. 17–18, 1967 (LBJ Library). See [[cal.1967-01-17.vietnam-congress]]. Names: Johnson, Mansfield, Dirksen, Fulbright, Hickenlooper, Russell, Aiken, Rostow, Margaret Chase Smith.'
