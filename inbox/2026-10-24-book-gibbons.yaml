- add:
    entry:
      id: cal.1967-02-13.vietnam
      when: Feb. 13
      date: '1967-02-13'
      thread: vietnam-sunflower
      c: 'Johnson with Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor and Wheeler, 8:29 to 10:45 a.m., on Bruce''s plea for more time before the bombing resumes. Humphrey for it; Wheeler: "a political decision"; McNamara alone against: "if they come back with a moderated no and we haven''t bombed, we''re in a hell of a fix." Johnson grants three hours more.'
      n: '[[w.gibbons-u-s-government-and]], IV, 517–18. To check: Tom Johnson''s notes of the meeting, Feb. 13, 1967 (LBJ Library). See [[cal.1967-02-06.vietnam]]. Names: Johnson, Humphrey, McNamara, Katzenbach, Vance, Rostow, William Bundy, Kohler, Taylor, Wheeler, Bruce.'
