- add:
    entry:
      id: cal.1967-07-31.economy-surcharge
      when: July 31
      date: '1967-07-31'
      thread: economy-surcharge
      c: 'Johnson with the Democratic leaders on the surcharge, 5:46 to 6:35 p.m.: Mansfield, Long and Byrd of Virginia; McCormack, Albert and Boggs. For it. Boggs: in every war Congress has raised taxes. McCormack: "You do your duty and we''ll do ours."'
      n: '[[w.gibbons-u-s-government-and]], IV, 757 (Tom Johnson''s notes). See [[cal.1967-07-26.economy-surcharge]]. Names: Johnson, Mansfield, Long, Harry F. Byrd Jr., McCormack, Albert, Boggs.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:long-russell-b
      - name:byrd-harry-f-jr
      - name:mccormack-john-w
      - name:albert-carl
      - name:boggs-hale
- add:
    entry:
      id: cal.1967-08-07.vietnam-congress
      when: Aug. 7
      date: '1967-08-07'
      thread: vietnam-congress
      c: 'Mansfield in the Senate, against escalation "in which the enemy can match and outmatch us": stop the bombing of the North but for the supply lines at the 17th parallel, as Cooper proposed; finish the barrier below the DMZ; revive the Security Council resolution of January 1966. Cooper with him.'
      n: '[113 Cong. Rec., Senate, Aug. 7, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt16/pdf/GPO-CRECB-1967-pt16-5-2.pdf), 21636–38 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 758. To check: McNamara''s and Rostow''s suggested answers for Johnson, Aug. 7, 1967 (LBJ Library). See [[cal.1967-05-15.vietnam-congress]]. Names: Mansfield, Cooper.'
      tags:
      - name:mansfield-mike
      - name:cooper-john-sherman
- add:
    entry:
      id: cal.1967-08-08.vietnam
      when: Aug. 8
      date: '1967-08-08'
      thread: vietnam
      also:
      - vietnam-air-war
      - vietnam-pennsylvania
      c: 'Tuesday lunch, 1:25 to 2:50 p.m., Johnson with McNamara, Katzenbach for Rusk, Rostow, Christian, Califano. The Chiefs ask the Hanoi power plant again, the Doumer bridge, ten targets in the Chinese buffer zone. Johnson: "it doesn''t look as though we have escalated enough to win"; all but lifting the zones around Hanoi and Haiphong approved, the bridge if Katzenbach agrees. "We have got to do something to win." On Kissinger''s report of Marcovich and Aubrac''s talks in Hanoi, McNamara: "the most interesting message on the matter of negotiations which we have ever had"; Johnson: no slowing of the bombing until the facts are clearer.'
      n: '[[w.gibbons-u-s-government-and]], IV, 741–42, 778 (Tom Johnson''s notes). See [[cal.1967-07-21.vietnam]]. Names: Johnson, McNamara, Katzenbach, Rusk, Rostow, Christian, Califano, Kissinger, Marcovich, Aubrac.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:rostow-walt-w
      - name:christian-george
      - name:califano-joseph-a-jr
      - name:kissinger-henry-a
      - name:marcovich-hebert
      - name:aubrac-raymond
- add:
    entry:
      id: cal.1967-08-10.economy-surcharge
      when: Aug. 10
      date: '1967-08-10'
      thread: economy-surcharge
      c: 'Johnson with fourteen business leaders, Dillon, Henry Ford II, Gates, Kappel, David Rockefeller and Weinberg among them: a deficit of $29 to $30 billion, a quarter to be met by the tax, a quarter by cuts, half by borrowing. Kappel: "you can''t do anything else." All for it by a show of hands; a committee to follow.'
      n: '[[w.gibbons-u-s-government-and]], IV, 757–58 (Christian''s notes). See [[cal.1967-08-03.economy]]. Names: Johnson, Dillon, Henry Ford II, Gates, Kappel, David Rockefeller.'
      tags:
      - name:johnson-lyndon-b
      - name:dillon-c-douglas
      - name:ford-henry-ii
      - name:gates-thomas-s-jr
      - name:kappel-frederick-r
      - name:rockefeller-david
- add:
    entry:
      id: cal.1967-08-11.vietnam-congress
      when: Aug. 11
      date: '1967-08-11'
      thread: vietnam-congress
      c: 'Javits in the Senate: "an imperative need to reassess our commitment"; the momentum threatens "a full-blown colonial venture." South Vietnam''s elections to begin the end of the commitment; the bombing ended or held to the routes near the DMZ. Clark welcomes him "to the ranks of the ''nervous nellies'' and the ''doves.''" Case: "is the Johnson administration blind to the signs of growing public unrest?"'
      n: '[113 Cong. Rec., Senate, Aug. 11, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt17/pdf/GPO-CRECB-1967-pt17-2-1.pdf), 22348–64 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 758–59. Names: Javits, Clark, Case.'
      tags:
      - name:javits-jacob-k
      - name:clark-joseph-s
      - name:case-clifford-p
- add:
    entry:
      id: cal.1967-08-12.vietnam
      when: Aug. 12
      date: '1967-08-12'
      thread: vietnam
      c: 'Gen. Harold K. Johnson, back from Vietnam, with Johnson, 11:47 a.m., then to the press at Johnson''s suggestion: "We''re winning the war"; the 45,000 "should be adequate" if the war stays at its level and the bombing goes on.'
      n: '[[w.gibbons-u-s-government-and]], IV, 747–48. To check: Rostow to Johnson, Aug. 11, 1967, with Johnson''s note; the press conference''s text (LBJ Library, Diary Backup, Aug. 12, 1967). Names: Harold K. Johnson, Lyndon Johnson.'
      tags:
      - name:johnson-harold-k
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-22.defense
      when: Aug. 22
      date: '1967-08-22'
      thread: defense
      also:
      - vietnam
      - vietnam-congress
      c: 'The Senate passes the defense appropriation, [85–3](https://voteview.com/rollcall/RS0900172), Morse, Gruening and Stephen Young against. Morse''s 10 percent cut lost, [5–85](https://voteview.com/rollcall/RS0900169); Clark''s motion to recommit for $3.5 billion less, [6–83](https://voteview.com/rollcall/RS0900171). Case: "The missing ingredient in Vietnam is not manpower or airpower, but willpower"; Stennis and McGee answer.'
      n: '[113 Cong. Rec., Senate, Aug. 22, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt18/pdf/GPO-CRECB-1967-pt18-1-1.pdf), 23454–55, 23498 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 761–63. Check: Gibbons gives 87–3, and Clark''s an amendment for a 5 percent cut. See [[cal.1967-06-13.defense]]. Names: Morse, Gruening, Stephen Young, Clark, Case, Stennis, McGee.'
      tags:
      - name:morse-wayne
      - name:gruening-ernest
      - name:young-stephen-m
      - name:clark-joseph-s
      - name:case-clifford-p
      - name:stennis-john-c
      - name:mcgee-gale-w
- add:
    entry:
      id: cal.1967-08-22.vietnam
      when: Aug. 22
      date: '1967-08-22'
      thread: vietnam
      c: Lunch, 1:20 to 3:10 p.m., Johnson with Rusk, McNamara, Rostow, Wheeler, Helms and Christian. By Wheeler's cable to Westmoreland, Rusk proposes an all-out offensive by every American force four to six weeks after the South Vietnamese elections, a "peace offensive"; Johnson tells Wheeler to think it over.
      n: '[[w.gibbons-u-s-government-and]], IV, 748–49. To check: Wheeler to Westmoreland, Aug. 23, 1967 (Center of Military History, Westmoreland Papers). Check: the cable''s number, which Gibbons''s print garbles. Names: Johnson, Rusk, McNamara, Rostow, Wheeler, Helms, Christian, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:wheeler-earle
      - name:helms-richard
      - name:christian-george
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-08-25.vietnam-air-war-2
      when: Aug. 25
      date: '1967-08-25'
      thread: vietnam-air-war
      c: 'McNamara, on his way back from the hearing, called to the White House by telephone to his car: some three hours "upbraided and roared at," by Gilpatric''s account.'
      n: '[[w.gibbons-u-s-government-and]], IV, 751 (Gilpatric''s account, CRS interview, Jan. 9, 1979). See [[cal.1967-08-25.vietnam-air-war]]. Names: McNamara, Gilpatric.'
      tags:
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-08-25.defense
      when: Aug. 25–26
      date: '1967-08-25'
      thread: defense
      also:
      - vietnam-air-war
      c: 'By Perry''s account, Wheeler gathers the Joint Chiefs in his office after McNamara''s testimony, no aides, no notes, and proposes they resign together at a press conference in the morning; Harold Johnson the most for it. Aug. 26, Wheeler: "We can''t do it. It''s mutiny." He asks a seat at the Tuesday lunch.'
      n: '[[w.gibbons-u-s-government-and]], IV, 751–52; [[w.perry-four-stars]], 162–64, 169 (by Gibbons''s quotation). Check: Perry''s the only account read. See [[cal.1967-08-25.vietnam-air-war]]. Names: Wheeler, Harold K. Johnson, McNamara, Moorer, McConnell.'
      tags:
      - name:wheeler-earle
      - name:johnson-harold-k
      - name:mcnamara-robert-s
      - name:moorer-thomas
      - name:mcconnell-john-p
- add:
    entry:
      id: cal.1967-09-13.economy-surcharge
      when: Sept. 13
      date: '1967-09-13'
      thread: economy-surcharge
      c: 'Sanders to Johnson: Mills tells Treasury''s liaison the administration must choose between "guns and butter," go on television and choose guns, cut domestic spending and pass the tax; then he will go "all the way." Sanders: "We have just got to have it both ways."'
      n: '[[w.gibbons-u-s-government-and]], IV, 759. To check: Sanders to Johnson, Sept. 13, 1967 (LBJ Library, Ex FG 1). Names: Sanders, Johnson, Mills.'
      tags:
      - name:sanders-h-barefoot-jr
      - name:johnson-lyndon-b
      - name:mills-wilbur-d
- add:
    entry:
      id: cal.1967-09-15.economy-surcharge
      when: Sept. 15
      date: '1967-09-15'
      thread: economy-surcharge
      c: 'Lunch, Johnson with Rusk, McNamara and Rostow, by Jim Jones''s notes. Johnson: without the tax bill, perhaps a message asking Congress to cut every appropriation 10 percent. McNamara: "I''d stick it to Mills." On the polls, Johnson leading Nixon 49–41, Romney 45–41, Rockefeller 59–41, Reagan 55–45: "There are three groups hitting us," Robert Kennedy and his crowd, the Republicans, the ADA and the liberals.'
      n: '[[w.gibbons-u-s-government-and]], IV, 760, 806. To check: Jones''s notes (LBJ Library, Meetings Notes File). Names: Johnson, Rusk, McNamara, Rostow, Mills, Nixon, Romney, Rockefeller, Reagan, Robert Kennedy, Jim Jones.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:mills-wilbur-d
      - name:nixon-richard-m
      - name:romney-george-w
      - name:rockefeller-nelson
      - name:reagan-ronald
      - name:kennedy-robert-f
      - name:jones-jim
- add:
    entry:
      id: cal.1967-09-19.economy-surcharge
      when: Sept. 19
      date: '1967-09-19'
      thread: economy-surcharge
      c: 'The weekly breakfast with the Democratic leaders, Humphrey present: Johnson''s "biggest problem now is with Mills and the Ways and Means Committee and the budget." Boggs: "With Mills you can get it out of Committee, and without Mills you can''t."'
      n: '[[w.gibbons-u-s-government-and]], IV, 760 (Jones''s notes). Names: Johnson, Humphrey, Mills, Boggs.'
      tags:
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:mills-wilbur-d
      - name:boggs-hale
