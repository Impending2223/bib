- add:
    entry:
      id: cal.1966-01-07.vietnam-congress
      when: Jan. 7
      date: '1966-01-07'
      thread: vietnam-congress
      c: 'Dirksen, at a news conference as reported: blockade the North, Haiphong above all; complete military victory before negotiation.'
      n: '*New York Times*, Jan. 8, 1966. [[w.gibbons-u-s-government-and]], IV, 141. Names: Dirksen.'
      tags:
      - name:dirksen-everett
- add:
    entry:
      id: cal.1966-01-10.vietnam-pause
      when: Jan. 10
      date: '1966-01-10'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor and Helms, 1:10 to 2:10 p.m.: resuming the bombing in a few days, or after Tet; Wheeler, "Every day makes a difference." Briefing Congress: Johnson would rather Rusk and McNamara appear "at as many hearings as possible"; Rusk proposes a luncheon for the leaders and the senior committee members, and Johnson agrees.'
      n: '[FRUS 1964–68, IV, doc. 14](https://history.state.gov/historicaldocuments/frus1964-68v04/d14) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-03.vietnam-pause]]. Names: Johnson, Rusk, McNamara, Ball, McGeorge Bundy, Wheeler, Taylor, Helms.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:ball-george-w
      - name:bundy-mcgeorge
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:helms-richard
- add:
    entry:
      id: cal.1966-01-11.vietnam-congress
      when: Jan. 11
      date: '1966-01-11'
      thread: vietnam-congress
      c: 'Foreign Relations, executive session: Mansfield and Aiken report on their trip to Asia with Muskie, Inouye and J. Caleb Boggs. Mansfield: the collapse prevented, the situation not reversed; "an open-end requirement of unpredictable dimensions," perhaps 700,000 men; "all the choices open to us are bad choices." Fulbright, by prearrangement with Hickenlooper, asks Mansfield to ask Johnson to meet the committee; Mansfield will think about it, and prefers closed hearings to open.'
      n: 'Senate Comm. on Foreign Relations, *Executive Sessions of the Senate Foreign Relations Committee (Historical Series)*, XVIII: 1966, 36 (1993) (Check: not read). The report: Mansfield, Muskie, Inouye, Aiken and Boggs, *The Vietnam Conflict: The Substance and the Shadow*, Comm. Print (Jan. 1966); Mansfield''s private report to Johnson, "Vietnam: The Situation and Outlook," printed in S. Doc. No. 93-11 (1973) (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 136–37. Made public: the executive session, the Historical Series, 1993. Names: Mansfield, Aiken, Muskie, Inouye, Fulbright, Hickenlooper, Johnson.'
      tags:
      - name:mansfield-mike
      - name:aiken-george-d
      - name:muskie-edmund-s
      - name:inouye-daniel-k
      - name:boggs-james-c
      - name:fulbright-j-william
      - name:hickenlooper-bourke-b
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-11.vietnam
      when: Jan. 11
      date: '1966-01-11'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Ball before House Foreign Affairs in the morning. At the White House, 1:05 to 2:05 p.m., Bell back from Vietnam: pacification the first problem; McNamara: "Don''t think there''s a single area pacified." Ball on the House committee: once "Gung Ho," now "looking for a way out." Johnson: "Senate will be worse than House."'
      n: '[FRUS 1964–68, IV, doc. 15](https://history.state.gov/historicaldocuments/frus1964-68v04/d15) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 135–36. Made public: FRUS 1964–68, IV (1998). Names: Ball, Bell, McNamara, Johnson.'
      tags:
      - name:ball-george-w
      - name:bell-david-e
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-12.vietnam-congress
      when: Jan. 12
      date: '1966-01-12'
      thread: vietnam-congress
      c: 'Ball before Foreign Relations in executive session, over three hours. Johnson by telephone, before: tell them the door is open to their suggestions; after, Ball: the members "troubled," not unfriendly, "not convinced there is a way out"; Fulbright on his "familiar line." A meeting of the committee with the President would set every committee asking; Johnson agrees. Dirksen, the same day, warns against bombing Hanoi and Haiphong; he had called Johnson to say he was misquoted and met him two hours, unannounced.'
      n: '[FRUS 1964–68, IV, doc. 19](https://history.state.gov/historicaldocuments/frus1964-68v04/d19) (the telephone call, 2:10 p.m.). Ball''s other calls (LBJ Library, Papers of George Ball, "Presidential Telecons") (Check: not read). *New York Times*, Jan. 12, 1966. [[w.gibbons-u-s-government-and]], IV, 136–37, 141. Made public: FRUS 1964–68, IV (1998). Check: the day of Dirksen''s meeting with Johnson. See [[cal.1966-01-11.vietnam-congress]]; [[cal.1966-01-07.vietnam-congress]]. Names: Ball, Johnson, Fulbright, Dirksen.'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:dirksen-everett
- add:
    entry:
      id: cal.1966-01-13.vietnam-congress
      when: Jan. 13
      date: '1966-01-13'
      thread: vietnam-congress
      c: 'Luncheon at the State Department for the congressional leaders and senior committee members, Fulbright and Hickenlooper among them: Ball, Rusk away, and McNamara on Vietnam.'
      n: 'Ball''s report in the President''s "Evening Reading," Jan. 13, 1966 (State, Lot File 74 D 164) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 137. See [[cal.1966-01-10.vietnam-pause]]. Names: Fulbright, Hickenlooper, Ball, Rusk, McNamara.'
      tags:
      - name:fulbright-j-william
      - name:hickenlooper-bourke-b
      - name:ball-george-w
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-01-15.vietnam-congress
      when: Jan. 15
      date: '1966-01-15'
      thread: vietnam-congress
      c: 'Goldberg to Johnson on his talks with members: Fulbright approving the peace initiative and "anxious to ''make up'' with the President"; Mansfield and Aiken enthusiastic, troubled at escalation; Church and McGovern with them; Symington ambivalent, withdrawal or all-out war; Dirksen sympathetic, but asking sympathy for his "Republican" noises; Hickenlooper doubtful of the Communists; Morgan warmly appreciative.'
      n: 'Goldberg to Johnson, Jan. 15, 1966 (LBJ Library, C.F. ND 19/CO 312) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 138. Names: Goldberg, Johnson, Fulbright, Mansfield, Aiken, Church, McGovern, Symington, Dirksen, Hickenlooper, Morgan.'
      tags:
      - name:goldberg-arthur-j
      - name:johnson-lyndon-b
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:aiken-george-d
      - name:church-frank
      - name:mcgovern-george
      - name:symington-stuart-s
      - name:dirksen-everett
      - name:hickenlooper-bourke-b
      - name:morgan-thomas-e
- add:
    entry:
      id: cal.1966-01-17.vietnam-congress
      when: Jan. 17
      date: '1966-01-17'
      thread: vietnam-congress
      c: 'Dirksen, in the Republicans'' answer to the State of the Union: "Viet Nam is not our war. But we pledged ourselves"; let the peace efforts and the military effort go on, the latter "intensified if necessary"; "There is, after all, no substitute for victory."'
      n: '*New York Times*, Jan. 18, 1966. [[w.gibbons-u-s-government-and]], IV, 141. Check: the day. Names: Dirksen.'
      tags:
      - name:dirksen-everett
- add:
    entry:
      id: cal.1966-01-19.vietnam-congress
      when: Jan. 19
      date: '1966-01-19'
      thread: vietnam-congress
      c: 'Valenti to Fulbright by telephone: "mischief makers" trying to promote a fight between the President and the chairman. Fulbright: newsmen spotlight a break for want of anything else to write; he intends to cooperate with the President.'
      n: 'Valenti to Johnson, Jan. 19, 1966 (LBJ Library, WHCF, Ex FG 431/F) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 145 n.94. Names: Valenti, Fulbright, Johnson.'
      tags:
      - name:valenti-jack
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-20.vietnam-pause
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Ball and Harriman, 5:54 to 6:31 p.m.: McNamara to get a plan of military action from the Chiefs; Rusk to tell the press there has been no answer to the pause, "the peace jig is up."'
      n: '[FRUS 1964–68, IV, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v04/d32) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 153. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-10.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Ball, Harriman.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:ball-george-w
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1966-01-20.vietnam-congress
      when: Jan. 20
      date: '1966-01-20'
      thread: vietnam-congress
      c: 'McGovern in the Senate, back from Vietnam: negotiation pursued, the forces held where they are, no new offensives, the bombing still suspended; a major war in Asia "could exhaust America''s blood and treasure for all our days."'
      n: '[112 Cong. Rec., Senate, Jan. 20, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-8-1.pdf), 775 ff. [[w.gibbons-u-s-government-and]], IV, 139–40. Names: McGovern.'
      tags:
      - name:mcgovern-george
- add:
    entry:
      id: cal.1966-01-22.vietnam-pause
      when: Jan. 22
      date: '1966-01-22'
      thread: vietnam-pause
      c: 'Johnson with his advisers, noon to 2:12 p.m.: all but Ball, Goldberg and Harriman for resuming. Johnson: "I''m of the mind to continue it anyway, but we''ve had no indication of any success"; "If we go back in, the pressure will be on us to go further." McGeorge Bundy, that morning: tell the leaders the pause has failed, through the weekly meeting; no "formal consultation" with Congress.'
      n: 'FRUS 1964–68, IV, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v04/d34) (Bundy), [35](https://history.state.gov/historicaldocuments/frus1964-68v04/d35) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 154. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-20.vietnam-pause]]. Names: Johnson, Ball, Goldberg, Harriman, McGeorge Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:ball-george-w
      - name:goldberg-arthur-j
      - name:harriman-w-averell
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1966-01-24.vietnam-congress
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-congress
      c: 'Rusk before Foreign Relations in executive session: Fulbright, Clark, John Williams, Pell and Case want the committee consulted before any new major decision; Rusk: the President "has the question of consultation in front of him." The NLF one group among many. To Johnson after: the members want "a chance to sit down with you on a give-and-take discussion basis." Fulbright to the press: consult the committee before resuming; the NLF a "proper party" to negotiations. Rusk before House Foreign Affairs the same day: 12 of 15 speaking for resuming.'
      n: 'Daily Digest, [112 Cong. Rec. D16](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=14). [FRUS 1964–68, IV, doc. 38](https://history.state.gov/historicaldocuments/frus1964-68v04/d38) (Rusk to Johnson). Senate Comm. on Foreign Relations, *Executive Sessions (Historical Series)*, XVIII: 1966, 139–40, 163–82 (1993) (Check: not read). *Washington Post*, Jan. 25, 1966. [[w.gibbons-u-s-government-and]], IV, 143–44. Names: Rusk, Fulbright, Clark, John Williams, Pell, Case, Johnson.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:clark-joseph-s
      - name:williams-john-j
      - name:pell-claiborne-d
      - name:case-clifford-p
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-24.vietnam-pause
      when: Jan. 24
      date: '1966-01-24'
      thread: vietnam-pause
      also:
      - vietnam-congress
      c: 'Johnson with the Democratic leaders, 4:35 to 5:46 p.m., McCormack, Albert, Hale Boggs, Mansfield and Long. Mansfield against resuming: "I''d think most seriously before final decision is made"; China "always conquers the conqueror." McCormack: "From now on you''ll look weak." Long: "Congress can appropriate—can''t fight the war." Johnson to his advisers after: "four for us and Mansfield against us."'
      n: 'McGeorge Bundy''s notes (LBJ Library, Papers of McGeorge Bundy) (Check: not read). [FRUS 1964–68, IV, doc. 40](https://history.state.gov/historicaldocuments/frus1964-68v04/d40) (the advisers, 6:30 p.m.). [[w.gibbons-u-s-government-and]], IV, 144–46. See [[cal.1966-01-22.vietnam-pause]]. Names: Johnson, McCormack, Albert, Hale Boggs, Mansfield, Long.'
      tags:
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:boggs-hale
      - name:mansfield-mike
      - name:long-russell-b
- add:
    entry:
      id: cal.1966-01-25.vietnam-pause
      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam-pause
      also:
      - vietnam-congress
      c: 'The bipartisan leaders and the chairmen and ranking members of Appropriations, Armed Services and Foreign Affairs at the White House, 5:30 to 7:40 p.m., on resuming the bombing. For it: Dirksen, Saltonstall, Ford, Hickenlooper, Russell ("Go all the way"), McCormack, Albert, Boggs, Long, Morgan, Rivers, Mahon, Hayden. Against: Mansfield and Fulbright; while Fulbright speaks, by one account, Johnson turns to talk with Rusk. Johnson: the resolution "you can take it away from me any time." Saltonstall: "Keep that resolution in your pocket."'
      n: '[FRUS 1964–68, IV, doc. 43](https://history.state.gov/historicaldocuments/frus1964-68v04/d43) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 146–47. Johnson''s snub of Fulbright: MacNeil, *Dirksen* (1970), 275 (Check: not read). Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-24.vietnam-pause]]. Names: Dirksen, Saltonstall, Ford, Hickenlooper, Russell, McCormack, Albert, Boggs, Long, Morgan, Rivers, Mahon, Hayden, Mansfield, Fulbright, Johnson, Rusk.'
      tags:
      - name:dirksen-everett
      - name:saltonstall-leverett
      - name:ford-gerald-r
      - name:hickenlooper-bourke-b
      - name:russell-richard-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:boggs-hale
      - name:long-russell-b
      - name:morgan-thomas-e
      - name:rivers-l-mendel
      - name:mahon-george-h
      - name:hayden-carl
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-01-25.vietnam-congress
      when: Jan. 25
      date: '1966-01-25'
      thread: vietnam-congress
      c: 'The White House''s survey of Congress: Wilson, Jan. 21, of 251 of the 295 House Democrats, majority sentiment for the policy in all but nine districts, "but most districts reported a lot of uneasy people"; Manatos, Jan. 25, the 19 Democratic Senators up for reelection, and 12 more, all in support.'
      n: 'Manatos to Johnson, Jan. 25, 1966 (LBJ Library, Diary Backup); Jean P. Lewis, "President Johnson Surveys the Congress" (paper, Georgetown University, 1990), 16–17, 34 (Check: neither read). [[w.gibbons-u-s-government-and]], IV, 147–48. Names: Wilson, Manatos.'
      tags:
      - name:wilson-henry-hall
      - name:manatos-mike-n
- add:
    entry:
      id: cal.1966-01-26.vietnam-pause
      when: Jan. 26
      date: '1966-01-26'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy, Raborn and Ball on when to resume. Johnson: "If you understand Fulbright he wants us to get out. Mansfield wants us to hunker up"; Cooper, asked if he could deliver the Viet Cong for more time, could not answer. Ball: "What we need is a philosophy of the bombing." McNamara leaves to testify; Johnson: "something wrong with our system." McGeorge Bundy telephones Edward Kennedy to keep him from a speech for a longer pause.'
      n: '[FRUS 1964–68, IV, doc. 46](https://history.state.gov/historicaldocuments/frus1964-68v04/d46) (Valenti''s notes). McGeorge Bundy to Johnson, "Phone Conversation with Ted Kennedy," Jan. 26, 1966 (LBJ Library) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 155–56, 159 n.137. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-25.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Raborn, Ball, Fulbright, Mansfield, Cooper, Edward Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:raborn-william-f-jr
      - name:ball-george-w
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:cooper-john-sherman
      - name:kennedy-edward-m
- add:
    entry:
      id: cal.1966-01-27.vietnam-pause
      when: Jan. 27
      date: '1966-01-27'
      thread: vietnam-pause
      c: 'Johnson with Rusk, McNamara, McGeorge Bundy and Wheeler, 6:20 to 8:20 p.m., the day of the fifteen Senators'' letter: "I don''t want to back out—and look like I''m reacting to the Fulbrights. ... We will lose a good part of the Senate"; "I thought of chucking that resolution back to them." "We don''t have anyone defending us" in the Senate; Douglas could. McNamara to see Robert Kennedy Saturday.'
      n: '[FRUS 1964–68, IV, doc. 50](https://history.state.gov/historicaldocuments/frus1964-68v04/d50) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 158–59. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-26.vietnam-pause]]. Names: Johnson, Rusk, McNamara, McGeorge Bundy, Wheeler, Fulbright, Douglas, Robert Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:wheeler-earle
      - name:fulbright-j-william
      - name:douglas-paul-h
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1966-01-27.vietnam-congress
      when: Jan. 27
      date: '1966-01-27'
      thread: vietnam-congress
      c: 'McCarthy''s first speech on the war, the day of the Senators'' letter: a national debate; a "moral commitment" asked to purposes "we do not clearly understand"; the bombing''s success not shown. That evening McCarthy, McGovern, Burdick and Hartke at Harriman''s house for a drink: their fear that the Chiefs and the Armed Services hawks will push the bombing to a clash with China. Harriman to McGeorge Bundy, Feb. 4: McCarthy might be brought to lead in support of the President.'
      n: '[112 Cong. Rec., Senate, Jan. 27, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt1/pdf/GPO-CRECB-1966-pt1-12-1.pdf), 1234. Harriman to McGeorge Bundy, Feb. 4, 1966 (Library of Congress, Harriman Papers) (Check: not read). [[w.gibbons-u-s-government-and]], IV, 156 n.129, 158 n.133. McCarthy''s account: [[w.mccarthy-year-of-the-people]], 23–27 (To check). Check: the day of the drink, "that same afternoon" the letter went. Names: McCarthy, McGovern, Burdick, Hartke, Harriman, McGeorge Bundy.'
      tags:
      - name:mccarthy-eugene-j
      - name:mcgovern-george
      - name:burdick-quentin-n
      - name:hartke-rupert-v
      - name:harriman-w-averell
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1966-01-28.vietnam-pause
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-pause
      c: 'Johnson with his advisers and four of the Wise Men, McCloy, Dulles, Dean and Clifford, 1:20 to 3:45 p.m.: "A year ago, by 504–2 the Congress told the President to do what was necessary in Vietnam," Johnson as Valenti noted it; the opposition now could muster perhaps 40 votes. McNamara for resuming: the people "will not long support a government which will not support, by bombing, 400,000 troops there."'
      n: '[FRUS 1964–68, IV, doc. 52](https://history.state.gov/historicaldocuments/frus1964-68v04/d52) (Valenti''s notes). [[w.gibbons-u-s-government-and]], IV, 160. Made public: FRUS 1964–68, IV (1998). See [[cal.1966-01-27.vietnam-pause]]. Names: Johnson, McCloy, Dulles, Dean, Clifford, McNamara, Valenti.'
      tags:
      - name:johnson-lyndon-b
      - name:mccloy-john-j
      - name:dulles-allen-w
      - name:dean-arthur-h
      - name:clifford-clark
      - name:mcnamara-robert-s
      - name:valenti-jack
- add:
    entry:
      id: cal.1966-01-28.vietnam
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam
      also:
      - vietnam-congress
      c: 'Manatos to Johnson: Mansfield says the fifteen Senators avoided him and he told them it was not the proper approach; Johnson''s reply "perfectly proper"; drop the matter.'
      n: 'Manatos to Johnson, Jan. 28, 1966, as cited by Lewis, "President Johnson Surveys the Congress," 41 (Check: not read). [[w.gibbons-u-s-government-and]], IV, 157 n.131. See [[cal.1966-01-31.vietnam]]. Names: Manatos, Mansfield, Johnson.'
      tags:
      - name:manatos-mike-n
      - name:mansfield-mike
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-01-30.vietnam
      when: Jan. 30
      date: '1966-01-30'
      thread: vietnam
      c: 'Ball at Northwestern University, the State Department''s statement of the American case: to recognize the NLF "would do violence to the truth." Johnson, on the draft, Jan. 28: "Do we want to here refuse NLF?" The passage stands. Morse: "a dove in hawk''s feathers, unless he is a pigeon."'
      n: '*Washington Post*, Feb. 6, 1966 (the text). The draft with Johnson''s note (LBJ Library, NSF Country File, Vietnam) (Check: not read). [112 Cong. Rec., Senate, Feb. 2, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-5-2.pdf), 2067 (Morse; Check the day). [[w.gibbons-u-s-government-and]], IV, 163–64. Names: Ball, Johnson, Morse.'
      tags:
      - name:ball-george-w
      - name:johnson-lyndon-b
      - name:morse-wayne
- add:
    entry:
      id: cal.1966-01-31.vietnam-congress
      when: Jan. 31
      date: '1966-01-31'
      thread: vietnam-congress
      c: 'Congress on the resumption. Aiken: "we have passed the point of no return"; taxes, "universal conscription," controls to come; his vote of Aug. 1964 never a grant "to wage war at will"; he will support the President. Morse and Cotton welcome the turn to the UN. Dirksen speaks for the decision. Laird, in the House: shifts of policy, no progress with 200,000 men, the Mansfield report a "stinging indictment"; he and Ford ask a debate, perhaps a new resolution.'
      n: '[112 Cong. Rec., Senate, Jan. 31, 1966](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-2.pdf); [House](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt2/pdf/GPO-CRECB-1966-pt2-3-1.pdf), 1564–66 (Laird). Gibbons cites "1553 ff." for the comments (Check the pages). [[w.gibbons-u-s-government-and]], IV, 165–67. See [[cal.1966-01-31.vietnam]]. Names: Aiken, Morse, Cotton, Dirksen, Laird, Ford.'
      tags:
      - name:aiken-george-d
      - name:morse-wayne
      - name:cotton-norris-h
      - name:dirksen-everett
      - name:laird-melvin-r
      - name:ford-gerald-r
- add:
    entry:
      id: cal.1966-01-04.vietnam-congress
      when: Jan. 4
      date: '1966-01-04'
      thread: vietnam-congress
      also:
      - laos
      c: 'Udorn, Thailand. Symington, at his own asking, alone with Sullivan: the bombing of the trails in Laos, 274 sorties for the day, "shocking waste of air power"; Sullivan: no interdiction, at best harassment. Symington would strike the North''s fuel, power, Haiphong, dams and levees, which "everybody else" on his trip tells him would take it out of the war; Sullivan doubts it. McGeorge Bundy to Johnson: talk to Symington before he says it in public.'
      n: '[FRUS 1964–68, XXVIII, doc. 217](https://history.state.gov/historicaldocuments/frus1964-68v28/d217) (Sullivan, Jan. 5). [[w.gibbons-u-s-government-and]], IV, 142 n.86. Made public: FRUS 1964–68, XXVIII (1998). Names: Symington, Sullivan, McGeorge Bundy, Johnson.'
      tags:
      - name:symington-stuart-s
      - name:sullivan-william-h
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-08-01.vietnam
      when: Aug. 1
      date: '1966-08-01'
      thread: vietnam
      c: 'Krulak, commanding the Fleet Marine Force, Pacific, with Johnson, forty minutes, arranged by Greene: the Marines'' case against attrition, for protecting the people and for striking the North''s ports. By Krulak''s account, when he came to mining the ports Johnson "got to his feet, put his arm around my shoulder, and propelled me firmly toward the door."'
      n: '[[w.gibbons-u-s-government-and]], IV, 198–99. Krulak''s account: [[w.krulak-first-to-fight]], 202 (To check). Names: Krulak, Johnson, Greene.'
      tags:
      - name:krulak-victor-h
      - name:johnson-lyndon-b
      - name:greene-wallace-m-jr
