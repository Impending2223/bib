      date: '1965-10-22'
      thread: vietnam-congress
      c: 'Fulbright in the Senate, on his criticism of the President: a consensus "a miscarriage of democratic procedures insofar as it represents the concealment of differences."'
      n: '[111 Cong. Rec., Senate, Oct. 22, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt21/pdf/GPO-CRECB-1965-pt21-2-1.pdf), 28372 ff. [[w.gibbons-u-s-government-and]], IV, 41 n.128. See [[cal.1965-09-15.latin-america]]. Names: Fulbright.'
