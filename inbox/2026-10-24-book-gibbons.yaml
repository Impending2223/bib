      date: '1967-01-16'
      thread: vietnam-congress
      c: 'Rusk before the Foreign Relations Committee in executive session, chiefly on Vietnam. Fulbright on the war''s legal basis and the SEATO Treaty: his part in the Tonkin Gulf resolution came of his support for Johnson in the 1964 election and the hope of preventing a war; Congress did not vote for the war of 1967; "The circumstances were very, very different."'
      n: 'Daily Digest, [113 Cong. Rec. D7](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=5) (the session). [[w.gibbons-u-s-government-and]], IV, 581 n.62. To check: the unpublished transcript, Jan. 16, 1967 (Senate Comm. on Foreign Relations); Rusk to Johnson, "Items for Evening Reading," Jan. 16, 1967 (State, Lot File 74 D 164). Names: Rusk, Fulbright, Johnson.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-01-23.vietnam-supplemental
      when: Jan. 23–25
      date: '1967-01-23'
      thread: vietnam-supplemental
      also:
      - vietnam-congress
      - vietnam-air-war
      c: 'Russell''s Armed Services Committee and his Defense appropriations subcommittee, jointly, in executive session on the supplemental, $12.3 billion. McNamara: the bombing has not "significantly reduced, nor any bombing that I could contemplate in the future would significantly reduce," the flow of men and materiel South; a "penalty" on the North. Wheeler: it limits what Hanoi can deploy. Cannon: why the sorties, then?'
      n: 'Daily Digest, [113 Cong. Rec. D14](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=12), [D17](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=15), [D19](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=17) (the sessions). [[w.gibbons-u-s-government-and]], IV, 586–87. To check: Senate Comms. on Armed Services and Appropriations, *Supplemental Military Procurement and Construction Authorizations for Fiscal Year 1967: Hearings*, 90th Cong., 1st Sess. (1967), 13, 57, 69–70. Check: the day of the exchange. Names: Russell, McNamara, Wheeler, Cannon.'
      tags:
      - name:russell-richard-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:cannon-howard-w
- add:
    entry:
      id: cal.1967-01-30.vietnam-congress
      when: Jan. 30
      date: '1967-01-30'
      thread: vietnam-congress
      c: The Foreign Relations Committee opens its hearings on "The Responsibilities of the U.S. as a World Power," Kennan on "The Communist World in 1967."
      n: 'Daily Digest, [113 Cong. Rec. D26](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=24). [[w.gibbons-u-s-government-and]], IV, 580–81 (and the committee''s decision of Jan. 24, by its transcript). To check: Senate Comm. on Foreign Relations, *The Communist World in 1967: Hearing*, 90th Cong., 1st Sess. (1967); Marcy to Fulbright, Nov. 28 and Dec. 12, 1966 (National Archives, RG 46, Marcy Chron File). Names: Kennan.'
      tags:
      - name:kennan-george-f
- add:
    entry:
      id: cal.1967-01-31.vietnam-congress
      when: Jan. 31
      date: '1967-01-31'
      thread: vietnam-congress
      c: 'Reischauer before the Foreign Relations Committee, "Asia, the Pacific, and the United States": the United States should not have gone into Vietnam; the commitment made, it should be kept; "prudent deescalation," clear and hold rather than search and destroy. Fewer military commitments in Asia, no sponsorship of change there.'
      n: 'Daily Digest, [113 Cong. Rec. D28](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=26). [[w.gibbons-u-s-government-and]], IV, 581–82. To check: Senate Comm. on Foreign Relations, *Asia, the Pacific, and the United States: Hearing*, 90th Cong., 1st Sess. (1967), 4, 8–9, 14. See [[cal.1967-01-30.vietnam-congress]]. Names: Reischauer.'
      tags:
      - name:reischauer-edwin-o
- add:
    entry:
      id: cal.1967-01-31.vietnam
      when: Jan. 31
      date: '1967-01-31'
      thread: vietnam
      c: 'Tuesday lunch, 2:20 to 3:20 p.m., Johnson with Rusk, McNamara, Taylor, Rostow, Komer and Christian, on a successor to Lodge: Westmoreland as Ambassador discussed. No notes. Johnson asks Taylor for ways it could be done.'
      n: '[[w.gibbons-u-s-government-and]], IV, 575–76. To check: [[w.westmoreland-soldier-reports]], 212–17. Names: Johnson, Rusk, McNamara, Taylor, Rostow, Komer, Christian, Lodge, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:rostow-walt-w
      - name:komer-robert-w
      - name:christian-george
      - name:lodge-henry-cabot
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-02-06.vietnam-2
      when: Feb. 6
      date: '1967-02-06'
      thread: vietnam
      c: 'Taylor to Johnson: lacking "a very outstanding civilian," Westmoreland as Ambassador, "the pros outweigh the cons"; Ambassador and commander in chief both, with a military deputy for the forces, a civilian for the rest, a third for the Mission.'
      n: '[[w.gibbons-u-s-government-and]], IV, 576. To check: Taylor to Johnson, Feb. 6, 1967 (LBJ Library). See [[cal.1967-01-31.vietnam]]. Names: Taylor, Johnson, Westmoreland.'
      tags:
      - name:taylor-maxwell
      - name:johnson-lyndon-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-02-06.vietnam-support
      when: Feb. 6
      date: '1967-02-06'
      thread: vietnam-support
      c: 'Roche to O''Brien, Rostow copied: assume the war unsettled by the 1968 election; the "Korean whipsaw," the war party three days a week, the party of appeasement the other three. State "simply incompetent" at informing the administration''s friends; a small office in the White House under Harold Kaplan: the Vietnam Information Group.'
      n: '[[w.gibbons-u-s-government-and]], IV, 603. To check: Roche to O''Brien, Feb. 6, 1967 (LBJ Library, NSF Name File, Roche Memos). Names: Roche, O''Brien, Rostow.'
      tags:
      - name:roche-john-p
      - name:obrien-lawrence-f
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-02-11.vietnam
      when: Feb. 11
      date: '1967-02-11'
      thread: vietnam
      c: 'Katzenbach to Johnson: Westmoreland as Ambassador "unwise"; no serious objection if he first resigned from the Army and no outstanding civilian were found, but more valuable as commander.'
      n: '[[w.gibbons-u-s-government-and]], IV, 576–77. To check: Katzenbach to Johnson, Feb. 11, 1967 (LBJ Library). See [[cal.1967-01-31.vietnam]]. Names: Katzenbach, Johnson, Westmoreland.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-02-17.vietnam
      when: Feb. 17
      date: '1967-02-17'
      thread: vietnam
      also:
      - vietnam-air-war
      c: 'Johnson with McNamara, Wheeler, Taylor and Rostow, 12:25 to 2:04 p.m., no one from State. Wheeler for bombing the steel and cement plants and the North''s power grid, 138,000 kilowatts: pressure on the economy and on Hanoi''s will, no major direct military effect. Johnson wants courses of action for Feb. 22.'
      n: 'FRUS 1964–68, V, doc. [84](https://history.state.gov/historicaldocuments/frus1964-68v05/d84). [[w.gibbons-u-s-government-and]], IV, 558–60 (the hour; Wheeler''s cables to Sharp and Westmoreland, JCS 1284-67, Feb. 17, and of Feb. 18: "a new sense of urgency in the atmosphere"). Made public: FRUS 1964–68, V (2002). Names: Johnson, McNamara, Wheeler, Taylor, Rostow.'
      tags:
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:taylor-maxwell
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-02-20.vietnam-congress
      when: Feb. 20
      date: '1967-02-20'
      thread: vietnam-congress
      c: 'Commager before the Foreign Relations Committee, "Changing American Attitudes Toward Foreign Policy": the war a mistake, supported by neither the SEATO Treaty nor the Tonkin Gulf resolution; turn it over to the United Nations. Of the intellectuals: no war "where the hostility was so deep or so widespread."'
      n: 'Daily Digest, [113 Cong. Rec. D57](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=55). [[w.gibbons-u-s-government-and]], IV, 582–83. To check: Senate Comm. on Foreign Relations, *Changing American Attitudes Toward Foreign Policy: Hearing*, 90th Cong., 1st Sess. (1967), 3–18, 47–48. See [[cal.1967-01-30.vietnam-congress]].'
- add:
    entry:
      id: cal.1967-02-20.vietnam-supplemental
      when: Feb. 20
      date: '1967-02-20'
      thread: vietnam-supplemental
      also:
      - vietnam-congress
      c: 'McNamara before the House Appropriations subcommittees on the supplemental. Minshall: the "''we are the aggressors'' sentiment" a ripple two or three years ago, "Now it is becoming a big swell." Andrews: "fast getting to be a ''Dove.''" McNamara: two minorities, out and win faster, both lacking patience. Laird, on his letter to Johnson of Feb. 9: the Viet Cong could fight on without the North.'
      n: '[[w.gibbons-u-s-government-and]], IV, 596–97. To check: House Comm. on Appropriations, *Supplemental Defense Appropriations for 1967: Hearings*, 90th Cong., 1st Sess. (1967), 40–48, 60–62, 67, 113–14. Check: Gibbons puts the hearings in the last week of February and the exchange on Feb. 20. Names: McNamara, Minshall, Andrews, Laird, Johnson.'
      tags:
      - name:mcnamara-robert-s
      - name:minshall-william-e-jr
      - name:andrews-george-w
      - name:laird-melvin-r
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-02-21.vietnam-congress
      when: Feb. 21
      date: '1967-02-21'
      thread: vietnam-congress
      c: 'Gavin before the Foreign Relations Committee, "Conflicts Between United States Capabilities and Foreign Commitments," the last of the series: "What is now needed is a political solution"; against the bombing of the North; talks with Hồ and the NLF for a neutral, non-Communist Vietnam on the Laos model of 1962. "I am afraid that our society is going to be torn apart."'
      n: 'Daily Digest, [113 Cong. Rec. D59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=57). [[w.gibbons-u-s-government-and]], IV, 583–84. To check: Senate Comm. on Foreign Relations, *Conflicts Between United States Capabilities and Foreign Commitments: Hearing*, 90th Cong., 1st Sess. (1967), 3–4, 25–27. See [[cal.1967-01-30.vietnam-congress]]. Names: Gavin.'
      tags:
      - name:gavin-james-m
- add:
    entry:
      id: cal.1967-02-23.vietnam-supplemental
      when: Feb. 23
      date: '1967-02-23'
      thread: vietnam-supplemental
      also:
      - vietnam-congress
      c: 'The Senate takes up the supplemental authorization. Clark''s amendment, Morse with him, a "Statement of Congressional Policy": no funds of this or any act for operations in or over the North, or for more than 500,000 men in the South, without a declaration of war. His second: support for the forces, a negotiated settlement, the Geneva agreement of 1954 and its conference reconvened.'
      n: '[113 Cong. Rec., Senate, Feb. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-1-1.pdf), 4295–96 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 587–88. The vote: [[cal.1967-03-01.vietnam]]. Names: Joseph Clark, Morse.'
      tags:
      - name:clark-joseph-s
      - name:morse-wayne
- add:
    entry:
      id: cal.1967-02-24.vietnam-congress
      when: Feb. 24
      date: '1967-02-24'
      thread: vietnam-congress
      c: 'Marcy to Fulbright: to keep "the initiative of influence," invite witnesses who disagree, McCone, McGeorge Bundy, LeMay, Shoup; a committee trip to Tokyo, Hong Kong, Saigon and Bangkok; a declaration of the minimum terms of a settlement, his draft attached, the bombing to cease. None done; instead four coffees for interested Senators at the committee''s offices.'
      n: '[[w.gibbons-u-s-government-and]], IV, 584–85 (and Fulbright''s account of the coffees, CRS interview, Feb. 18, 1983). To check: Marcy to Fulbright, Feb. 24, 1967 (National Archives, RG 46, Marcy Chron File). Names: Marcy, Fulbright, McCone, McGeorge Bundy, LeMay, Shoup.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:mccone-john-a
      - name:bundy-mcgeorge
      - name:lemay-curtis-e
      - name:shoup-david-m
- add:
    entry:
      id: cal.1967-02-27.vietnam-2
      when: Feb. 27
      date: '1967-02-27'
      thread: vietnam
      c: 'McGeorge Bundy to Johnson, "personal," McNamara having pressed him: Bunker for Saigon, "the precise combination of strength and sensitivity that Saigon now needs." He cannot campaign for the post himself this time: a breach of faith with the Ford Foundation''s trustees.'
      n: '[[w.gibbons-u-s-government-and]], IV, 577. To check: Bundy to Johnson, Feb. 27, 1967 (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-01-31.vietnam]]. Names: McGeorge Bundy, Johnson, McNamara, Bunker.'
      tags:
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:bunker-ellsworth
- add:
    entry:
      id: cal.1967-02-28.vietnam-supplemental
      when: Feb. 28
      date: '1967-02-28'
      thread: vietnam-supplemental
      also:
      - vietnam-congress
      c: 'The Senate on Clark''s amendment. Russell against: a declaration of war might widen it; repeal the Tonkin Gulf resolution if Congress wants its authority; of 1964, "Personally, at that time I did not contemplate anything of this magnitude"; "strongly opposed to any invasion of North Vietnam." Fulbright: repeal "impractical." Cooper: Congress cannot direct the war. Mansfield offers his substitute, Clark''s second amendment revised.'
      n: '[113 Cong. Rec., Senate, Feb. 28, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt4/pdf/GPO-CRECB-1967-pt4-4-1.pdf), 4717–66 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 588–89. See [[cal.1967-02-23.vietnam-supplemental]]. Names: Joseph Clark, Russell, Fulbright, Cooper, Mansfield.'
      tags:
      - name:clark-joseph-s
      - name:russell-richard-b
      - name:fulbright-j-william
      - name:cooper-john-sherman
      - name:mansfield-mike
- add:
    entry:
      id: cal.1967-03-03.vietnam
      when: Mar. 3
      date: '1967-03-03'
      thread: vietnam
      c: 'Wheeler to Westmoreland on the embassy: Rusk no objection to him, but concern at a "complete ''militarization''" of the senior posts in Saigon with elections coming; McNamara has advised Johnson against appointing him out of uniform. Better he stay where he is; Wheeler agrees.'
      n: 'FRUS 1964–68, V, doc. [97](https://history.state.gov/historicaldocuments/frus1964-68v05/d97) (Johnson to Rusk, Mar. 2). [[w.gibbons-u-s-government-and]], IV, 577–78. To check: Wheeler to Westmoreland, JCS 1637-67, Mar. 3, 1967 (Center of Military History, Westmoreland Papers). See [[cal.1967-01-31.vietnam]]. Names: Wheeler, Westmoreland, Rusk, McNamara, Johnson.'
      tags:
      - name:wheeler-earle
      - name:westmoreland-william
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-03-06.vietnam-thant
      when: Mar. 6
      date: '1967-03-06'
      thread: vietnam-thant
      c: 'Goldberg with U Thant, back from Rangoon and his talk with Hanoi''s officials: their terms (the bombing stopped, the American forces out, the Four Points) no basis for a settlement; his idea, a "stand down" of all military activity on both sides. Rostow to Johnson: "It poses the question of a total ceasefire."'
      n: 'FRUS 1964–68, V, doc. [101](https://history.state.gov/historicaldocuments/frus1964-68v05/d101) (Johnson and Rusk by telephone, 4:03 p.m.: "What does U Thant bring back?"). [[w.gibbons-u-s-government-and]], IV, 574. To check: Goldberg''s report, Mar. 7, 1967, and Rostow''s memorandum (LBJ Library, NSF). See [[cal.1967-03-14.vietnam]]. Names: Goldberg, U Thant, Rostow, Johnson.'
      tags:
      - name:goldberg-arthur-j
      - name:u-thant
      - name:rostow-walt-w
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-03-06.vietnam
      when: Mar. 6
      date: '1967-03-06'
      thread: vietnam
      c: 'Wheeler to Sharp and Westmoreland, back channel: "even broader authority to exert additional military pressure on North Vietnam can be obtained in the near future"; the one obstacle, military complaints of civilian restraints: "the absolute necessity for every military man to keep his mouth shut and get on with the war."'
      n: '[[w.gibbons-u-s-government-and]], IV, 569–70. To check: Wheeler to Sharp and Westmoreland, JCS 1691-67, Mar. 6, 1967 (Center of Military History, Westmoreland Papers). See [[cal.1967-02-22.vietnam-2]]. Names: Wheeler, Sharp, Westmoreland.'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
      - name:westmoreland-william
- add:
    entry:
      id: cal.1967-03-07.vietnam
      when: Mar. 7
      date: '1967-03-07'
      thread: vietnam
      also:
      - vietnam-thant
      c: Tuesday lunch, 12:45 to 2:30 p.m., Johnson with Rusk, McNamara, Katzenbach, Rostow and Christian. Johnson wants "an orderly public account" of the efforts to negotiate in the pauses and in Kosygin's week in London; "sick and tired of being afraid to blow a contact"; "every possible item of pressure." U Thant to put his proposal in writing.
      n: '[[w.gibbons-u-s-government-and]], IV, 570, 574. To check: notes of the lunch (LBJ Library, NSF Files of Walt W. Rostow). See [[cal.1967-03-06.vietnam-thant]]. Names: Johnson, Rusk, McNamara, Katzenbach, Rostow, Christian, U Thant, Kosygin.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:katzenbach-nicholas
      - name:rostow-walt-w
      - name:christian-george
      - name:u-thant
      - name:kosygin-aleksei
- add:
    entry:
      id: cal.1967-03-10.vietnam
      when: Mar. 10
      date: '1967-03-10'
      thread: vietnam
      c: 'Rostow to Johnson, 3:45 p.m., on McNamara''s thinking, after McNamara''s paper on Robert Kennedy''s proposal: "deeply troubled" the war will run into 1968; willing to contemplate mining Haiphong, a crisis with Moscow and Peking; "thrashing about for a short cut." Rostow: back him on negotiations and pacification, but caution in giving up the bombing.'
      n: 'FRUS 1964–68, V, doc. [105](https://history.state.gov/historicaldocuments/frus1964-68v05/d105). [[w.gibbons-u-s-government-and]], IV, 570–72 (McNamara''s paper of Mar. 9, by Rostow''s account: eight power plants struck, then attacks held south of the 20th parallel and Moscow asked to open talks through Thompson). Made public: FRUS 1964–68, V (2002). See [[cal.1967-03-02.robert-kennedy]]. Names: Rostow, Johnson, McNamara, Robert Kennedy, Thompson.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:kennedy-robert-f
      - name:thompson-llewellyn-e
- add:
    entry:
      id: cal.1967-03-11.vietnam
      when: Mar. 11
      date: '1967-03-11'
      thread: vietnam
      c: 'McPherson to Johnson: without "outward manifestations of searching for peace," the administration identified "along with Ky and the generals, as ''war-lovers''"; the hawks run no risk from a more open effort. Johnson''s reply, Mar. 13, in Rostow''s draft: Rostow to tell him of "the intense planning that is going forward on negotiations."'
      n: '[[w.gibbons-u-s-government-and]], IV, 570 n.26. To check: McPherson to Johnson, Mar. 11, and Johnson to McPherson, Mar. 13, 1967 (LBJ Library, ND 19/CO 312). Names: McPherson, Johnson, Kỳ, Rostow.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:nguyen-cao-ky
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1967-03-11.vietnam-2
      when: Mar. 11
      date: '1967-03-11'
      thread: vietnam
      c: 'Johnson with Drew Pearson, by Pearson''s notes: the war "going very well"; "Lodge has got to go"; "probably Westmoreland will go," Bruce Palmer in his place. Of Gromyko: "When the Chinese get a little weaker and the Russians stronger, we''re going to have a peace."'
      n: '[[w.gibbons-u-s-government-and]], IV, 570 n.25, 578. Made public: [[w.gibbons-u-s-government-and]], IV (1995). To check: Pearson''s notes of the meeting (LBJ Library, Papers of Drew Pearson). Check: Gibbons gives the date Mar. 11 in a note and "a few days after" Mar. 10 in the text. Names: Johnson, Pearson, Lodge, Westmoreland, Palmer, Gromyko.'
      tags:
      - name:johnson-lyndon-b
      - name:pearson-drew
      - name:lodge-henry-cabot
      - name:westmoreland-william
      - name:palmer-bruce-jr
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1967-03-17.vietnam-support
      when: Mar. 17
      date: '1967-03-17'
      thread: vietnam-support
      c: 'Rostow sends Johnson Washburn''s letter and plan of Mar. 15: weekly ten-minute fireside reports on the war; meetings with "opinion leaders"; a bipartisan national citizens'' committee. Johnson: "Walt: I like this. Bring this up on the way out—it''s very important."'
      n: '[[w.gibbons-u-s-government-and]], IV, 603–04. To check: Rostow to Johnson, Mar. 17, 1967, with Washburn''s letter and Johnson''s reply (LBJ Library, Ex ND 19/CO 312). See [[cal.1967-02-06.vietnam-support]]. Names: Rostow, Johnson, Washburn.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:washburn-abbott-m
- add:
    entry:
      id: cal.1967-03-22.vietnam-congress
      when: Mar. 22
      date: '1967-03-22'
      thread: vietnam-congress
      also:
      - vietnam-thant
      c: 'New York. Twelve of the Foreign Relations Committee with U Thant, three hours, no executive officials present: Hanoi will not negotiate until the bombing stops; stopped, talks in weeks; Hanoi thinks the United States wants "to make a South Korea out of South Vietnam." Goldberg, on Katzenbach''s suggestion, has told Fulbright and Carlson of Thant''s proposal and the American answer; they keep it from the rest, and Thant does not raise it.'
      n: '[[w.gibbons-u-s-government-and]], IV, 575, 676–77. Made public: Senate Comm. on Foreign Relations, *A Conversation With U Thant, Secretary General of the United Nations*, Comm. Print, 92d Cong., 2d Sess. (1972). To check: the committee print; USUN to Washington 4526, Mar. 22, 1967 (State, Central File, Pol 27 Viet S); *New York Times*, Mar. 23, 1967. See [[cal.1967-03-14.vietnam]]. Names: U Thant, Goldberg, Katzenbach, Fulbright, Carlson.'
      tags:
      - name:u-thant
      - name:goldberg-arthur-j
      - name:katzenbach-nicholas
      - name:fulbright-j-william
      - name:carlson-frank
- add:
    entry:
      id: cal.1967-03-23.vietnam-congress
      when: Mar. 23
      date: '1967-03-23'
      thread: vietnam-congress
      c: 'Brooke, back from Asia, in the Senate: a critic before, he is now convinced Hanoi will not negotiate "in a meaningful way"; persevere; no widening. Hanoi counts on "a growing division in the American body politic."'
      n: '[113 Cong. Rec., Senate, Mar. 23, 1967](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt6/pdf/GPO-CRECB-1967-pt6-5-2.pdf), 7968–79 (Gibbons''s pages). [[w.gibbons-u-s-government-and]], IV, 595. Names: Brooke.'
      tags:
      - name:brooke-edward-w
- add:
    entry:
      id: cal.1967-03-29.vietnam-support
      when: Mar. 29
      date: '1967-03-29'
      thread: vietnam-support
      c: 'Rostow to Johnson, after meeting Katzenbach and McNaughton, Mar. 27, on Washburn''s committee: skeptical; a continuing group would cost "some of your freedom of action," an implied pledge not to escalate sharply against the North. Instead, private citizens "at some distance from the Government" to issue one moderate statement of support.'
      n: '[[w.gibbons-u-s-government-and]], IV, 605 n.146. To check: Rostow to Johnson, Mar. 29, 1967 (LBJ Library, NSF Memos to the President—Walt Rostow). See [[cal.1967-03-17.vietnam-support]]. Names: Rostow, Johnson, Katzenbach, McNaughton, Washburn.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:mcnaughton-john-t
      - name:washburn-abbott-m
- add:
    entry:
      id: cal.1967-04-19.vietnam
      when: Apr. 19
      date: '1967-04-19'
      thread: vietnam
      c: The United States proposes that both sides pull their forces back ten miles from the DMZ, then talks; the Canadians' plan of Apr. 11 alike. By Cooper's account, an hour later he learns of strikes on Haiphong set for the day, and cannot stop them; Hanoi rejects the proposal the next day.
      n: '[[w.gibbons-u-s-government-and]], IV, 572–73; [[w.cooper-lost-crusade]], 373–74 (the strikes, the rejection). See [[cal.1967-04-18.vietnam]]. Names: Cooper.'
      tags:
      - name:cooper-chester-l
- add:
    entry:
      id: cal.1967-04-20.vietnam-support
      when: Apr. 20
      date: '1967-04-20'
      thread: vietnam-support
      c: 'McPherson to Johnson, after Gardner brings him a California businessman: a telegram of support "to our brave men in Vietnam" for citizens to sign, a committee under Eisenhower and Truman, by Loyalty Day, May 1; "no overt White House involvement." Katzenbach, Valenti and Roche for it. Johnson checks "see me"; not done.'
      n: '[[w.gibbons-u-s-government-and]], IV, 605–06. To check: McPherson to Johnson, Apr. 20, 1967 (LBJ Library, Office Files of Harry McPherson). See [[cal.1967-03-17.vietnam-support]]. Names: McPherson, Johnson, Gardner, Eisenhower, Truman, Katzenbach, Valenti, Roche.'
      tags:
      - name:mcpherson-harry
      - name:johnson-lyndon-b
      - name:gardner-john-w
      - name:eisenhower-dwight-d
      - name:truman-harry-s
      - name:katzenbach-nicholas
      - name:valenti-jack
      - name:roche-john-p
