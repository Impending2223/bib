- add:
    entry:
      id: cal.1966-11-15.vietnam
      when: Nov. 15
      date: '1966-11-15'
      thread: vietnam
      c: 'Tuesday lunch. Johnson orders a group under Katzenbach, with Komer, Rostow, Vance and "a good military man," to meet three times a week "on Vietnam and all its dimensions": the "Non-Group," which meets, Thursdays at five in Katzenbach''s office, from early 1967 to February 1968, without agenda or notes. The dual plan for pacification cabled to Lodge the same day as "final and considered decision."'
      n: '[[w.gibbons-u-s-government-and]], IV, 480–81, 472. To check: Rostow''s notes of the lunch, Nov. 15, 1966 (LBJ Library, Files of Walt W. Rostow, Meetings with the President); Washington to Saigon 85196, Nov. 15, 1966 (State, Central File, Pol 27 Viet S). Names: Johnson, Katzenbach, Komer, Rostow, Vance, Lodge.'
      tags:
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:komer-robert-w
      - name:rostow-walt-w
      - name:vance-cyrus
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1966-12-10.vietnam
      when: Dec. 10
      date: '1966-12-10'
      thread: vietnam
      c: 'Komer''s "Strategic Guidelines for 1967 in Vietnam," endorsed by Rostow, as a draft NSAM: a satisfactory outcome by December 1967, or at least "making it patently clear to all that the war is demonstrably being won"; nine programs, pacification first. Johnson: "I agree. It''s good." Sent to Rusk and McNamara Dec. 12; State, Defense, the Joint Chiefs, CINCPAC and MACV object, and it is never issued.'
      n: 'FRUS 1964–68, IV, doc. [336](https://history.state.gov/historicaldocuments/frus1964-68v04/d336). [[w.gibbons-u-s-government-and]], IV, 487–94. Made public: [[w.pentagon-papers]], IV, 390–400 (1971). Names: Komer, Rostow, Johnson, Rusk, McNamara.'
      tags:
      - name:komer-robert-w
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1966-12-13.vietnam-congress
      when: Dec. 13
      date: '1966-12-13'
      thread: vietnam-congress
      c: After the White House announces a 48-hour truce at Christmas, and perhaps others at New Year's and Tết, Mansfield proposes a cease-fire and a freeze on reinforcements from Christmas to Tết, to test Hanoi's interest in talks. Fulbright agrees.
      n: '[[w.gibbons-u-s-government-and]], IV, 497. To check: *New York Times*, Dec. 14, 1966. See [[cal.1966-12-24.vietnam]]. Names: Mansfield, Fulbright.'
      tags:
      - name:mansfield-mike
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-01-06.vietnam-congress
      when: Jan. 6
      date: '1967-01-06'
      thread: vietnam-congress
      c: 'Johnson with Mansfield on what Hanoi may have signaled through Salisbury. Mansfield''s memorandum the same day: Hanoi is saying it will not say "Uncle"; it will talk, but not until the American withdrawal is assured; "what do you Americans expect to result from negotiations?" Talks unlikely at the present level of fighting.'
      n: '[[w.gibbons-u-s-government-and]], IV, 503 n.71. To check: Mansfield to Johnson, Jan. 6, 1967 (LBJ Library, NSF Name File, Mansfield). See [[cal.1966-12-25.vietnam]]. Names: Johnson, Mansfield, Salisbury.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:salisbury-harrison-e
- add:
    entry:
      id: cal.1967-01-09.vietnam-congress
      when: Jan. 9
      date: '1967-01-09'
      thread: vietnam-congress
      c: 'Johnson''s reply to Mansfield, in Rostow''s draft amended by Rusk: "We don''t rule out that there may be something serious here," but no change in Hanoi''s position; the question whether it will accept "honest self-determination by the people of South Vietnam."'
      n: '[[w.gibbons-u-s-government-and]], IV, 503 n.71. To check: Johnson to Mansfield, Jan. 9, 1967 (LBJ Library, WHCF, Name File, Mansfield). See [[cal.1967-01-06.vietnam-congress]]. Names: Johnson, Mansfield, Rostow, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:mansfield-mike
      - name:rostow-walt-w
      - name:rusk-dean
- add:
    entry:
      id: cal.1967-01-13.vietnam
      when: Jan. 13
      date: '1967-01-13'
      thread: vietnam
      c: 'Salisbury, back from Hanoi, with Rusk and William Bundy at State, the press officer sent out at his insistence: he reports his talk with Phạm Văn Đồng. By Salisbury''s account, Rusk lectured him on the war; Bundy listened. Rusk to Johnson, Jan. 14: some of it "mood music," but Đồng''s remarks point to a "package deal" reached in secret bilateral talks.'
      n: '[[w.gibbons-u-s-government-and]], IV, 500–02 (and Salisbury''s account, CRS interview, Jan. 9, 1979). To check: Rusk to Johnson, "Highlights of Harrison Salisbury Private Report to Me," Jan. 14, 1967 (State, Lot File 85 D 240); [[w.salisbury-time-of-change]], 160–63. See [[cal.1966-12-25.vietnam]]. Names: Salisbury, Rusk, William Bundy, Phạm Văn Đồng, Johnson.'
      tags:
      - name:salisbury-harrison-e
      - name:rusk-dean
      - name:bundy-william
      - name:pham-van-dong
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-01-17.vietnam-congress
      when: Jan. 17
      date: '1967-01-17'
      thread: vietnam-congress
      also:
      - vietnam-sunflower
      c: 'Before a White House dinner, Johnson, dressing in his bedroom, with Mansfield and Dirksen, Rostow and Watson present: "perhaps the most important communication" since he became President, a reply from Hanoi through a representative in a certain capital, under pledge of secrecy. He asks that the Foreign Relations Committee''s public hearings on Vietnam wait "two or three weeks." Dirksen and Mansfield: tell Fulbright and Hickenlooper himself. He reads them a draft resolution on Vietnam; Mansfield: "This is the worst thing you could do"; Dirksen agrees.'
      n: 'FRUS 1964–68, V, doc. [19](https://history.state.gov/historicaldocuments/frus1964-68v05/d19) (Rostow''s notes). [[w.gibbons-u-s-government-and]], IV, 505–06 (by Watson''s notes: 7:30 p.m.; Johnson "wishes we were not there but we are there"). Made public: FRUS 1964–68, V (2002). Check: Rostow has the talk begin about 7:45 p.m. See [[cal.1967-01-10.vietnam-sunflower]]. Names: Johnson, Mansfield, Dirksen, Rostow, Watson, Fulbright, Hickenlooper.'
