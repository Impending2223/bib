      date: '1965-09-17'
      thread: vietnam-congress
      also:
      - defense
      c: The House adopts the conference report on the defense appropriation, the $1.7 billion for Southeast Asia in it, [384–0](https://voteview.com/rollcall/RH0890157).
      n: '[111 Cong. Rec., House, Sept. 17, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt18/pdf/GPO-CRECB-1965-pt18-4-2.pdf), 24262. [[w.gibbons-u-s-government-and]], IV, 38. Check: Gibbons gives 382–0. See [[cal.1965-08-25.vietnam-congress]].'
- add:
    entry:
