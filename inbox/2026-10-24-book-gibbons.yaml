- add:
    entry:
      id: cal.1965-12-30.vietnam-congress
      when: Dec. 30
      date: '1965-12-30'
      thread: vietnam-congress
      also:
      - vietnam-pause
      c: 'Johnson, from the Ranch, to Ball by telephone: fly to Florida and see Fulbright, Mansfield and Dirksen, quietly; tell Fulbright the stories of his exclusion from the White House are "nonsense," most of it "coming from Marcy," and make the peace offensive "a Fulbright proposal"; Hickenlooper too, without seeming to retreat. A second call: Mansfield to tell Sihanouk the United States wants no border incidents.'
      n: 'Ball''s telephone transcripts (LBJ Library, Papers of George Ball, "Presidential Telecons") (Check: not read). [[w.gibbons-u-s-government-and]], IV, 131–32 and n.57 (no record of Ball''s meetings). Names: Johnson, Ball, Fulbright, Mansfield, Dirksen, Marcy, Hickenlooper, Sihanouk.'
      tags:
