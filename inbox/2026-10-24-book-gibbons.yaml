- add:
    entry:
      id: cal.1965-08-25.vietnam-congress
      when: Aug. 25
      date: '1965-08-25'
      thread: vietnam-congress
      also:
      - defense
      c: 'The Senate passes the defense appropriation for fiscal 1966, H.R. 9221, with the $1.7 billion for Southeast Asia, [89–0](https://voteview.com/rollcall/RS0890204). Morse votes for it: the troops there "must have every possible bit of protection." Gruening, who voted against the war''s money in May, for it too; he had talked with Johnson, at his own request, Aug. 19.'
      n: '[111 Cong. Rec., Senate, Aug. 25, 1965](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt16/pdf/GPO-CRECB-1965-pt16-5-1.pdf), 21732. [[w.gibbons-u-s-government-and]], IV, 33, 38. See [[cal.1965-08-04.vietnam-congress]]. Names: Morse, Gruening, Johnson.'
      tags:
      - name:morse-wayne
      - name:gruening-ernest
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-09-09.vietnam-support
      when: Sept. 9
      date: '1965-09-09'
      thread: vietnam-support
      c: 'The Committee for an Effective and Durable Peace in Asia announced, Arthur Dean chairman, 48 members, Acheson, Black, Gilpatric and McCloy among them, Conant, Dillon and Powell too: the President "has acted rightly." Organized at the White House''s initiative.'
      n: '*New York Times*, Sept. 9, 1965. [[w.gibbons-u-s-government-and]], IV, 30. To check: "Arthur Dean Committee" folder (LBJ Library, NSF Country File, Vietnam, Box 195). Names: Dean, Acheson, Black, Gilpatric, McCloy, Conant, Dillon, Powell.'
      tags:
      - name:dean-arthur-h
