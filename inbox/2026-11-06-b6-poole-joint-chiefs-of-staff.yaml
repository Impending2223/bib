      id: cal.1962-10-01.missile-crisis-warnings
      when: Oct. 1
      date: '1962-10-01'
      thread: missile-crisis-warnings
      also:
      - defense
      c: 'The Joint Strategic Survey Council''s revised report on Cuba: the task is to supplant Castro''s regime with an acceptable successor; a blockade will not do it; an invasion is required.'
      n: '[[w.poole-joint-chiefs-of-staff]], 163. Poole cites the N/H of JCS 3204/58, Oct. 3, 1962, and the revised pages in JCS 2304/58, Sept. 19, 1962, as the scan''s text reads them (163 n.21). Check: the paper''s number. Names: Castro.'
      src:
        c: 1a5e3b54
        rows:
