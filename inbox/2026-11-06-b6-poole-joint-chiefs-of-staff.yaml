- add:
    entry:
      id: cal.1961-07-29.berlin-and-vienna-4
      when: July 29
      date: '1961-07-29'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs answer McNamara''s question of May on supporting guerrillas should uprisings follow American action at Berlin: fourteen Special Forces detachments in West Germany, six in West Berlin, 23 at home; European Command could supply 82,500 rebels for thirty days. A guerrilla campaign could grow into general war; conventional operations probably needed too; decide first to do whatever success requires.'
      n: '[[w.poole-joint-chiefs-of-staff]], 148. Poole cites JCSM-502-61, July 29, 1961 (148 n.36). Names: McNamara.'
      src:
        c: 46c555c2
        rows:
        - 'w.poole-joint-chiefs-of-staff 148: all'
        - 'via x.1961-07-29.jcsm-502-61-guerrillas: all'
      tags:
      - name:mcnamara-robert-s
    section: '196107'
- add:
    entry:
      id: cal.1961-08-10.berlin-and-vienna-2
      when: Aug. 10
      date: '1961-08-10'
      thread: berlin-and-vienna
      c: 'Admiral Anderson, Chief of Naval Operations, to the Joint Chiefs: East German uprisings like those of 1953 may come; the Chiefs have not yet weighed what follows; delay in choosing a course could be "disastrous."'
      n: '[[w.poole-joint-chiefs-of-staff]], 148. Poole cites the CNO''s memorandum of Aug. 10, 1961, JCS 1907/350 (148 n.37). Names: Anderson.'
      src:
        c: df4c1db0
        rows:
        - 'w.poole-joint-chiefs-of-staff 148: all'
        - 'via x.1961-08-10.cno-to-jcs-east-german-uprisings: all'
      tags:
      - name:anderson-george-w-jr
    section: '196108'
