    entry:
      id: cal.1961-07-29.berlin-and-vienna-3
      when: July 29
      date: '1961-07-29'
      thread: berlin-and-vienna
      also:
      - defense
      c: 'The Joint Chiefs to McNamara on the Berlin planning: more weight to how nuclear and non-nuclear forces bear on each other, and to Berlin among actions world-wide. Even by mid-1962, conventional forces could not reopen the ground access against Soviet forces in strength. They set out again the sequences of July 12 and 18.'
      n: '[[w.poole-joint-chiefs-of-staff]], 147–48. Poole cites JCSM-508-61, July 29, 1961 (148 n.34); the brief paper of planning guidance the Chiefs also sent is JCSM-515-61, Aug. 3, by the same note. See [[cal.1961-07-12.berlin-and-vienna]]. Names: McNamara.'
      src:
        c: df416f98
        rows:
        - 'w.poole-joint-chiefs-of-staff 147–48: all'
        - 'via x.1961-07-29.jcsm-508-61-berlin-planning: all'
      tags:
