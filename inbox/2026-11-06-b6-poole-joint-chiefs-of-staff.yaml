- add:
    entry:
      id: cal.1962-10-27.missile-crisis-excomm-2
      when: Oct. 27
      date: '1962-10-27'
      thread: missile-crisis-excomm
      c: 'The ExComm from 4 p.m. About 5:40 McNamara reports a U-2''s wreckage and the pilot''s body found near a Soviet-manned SAM site. McNamara: to allow time with the NATO allies, no air attack before Wednesday, Oct. 31, or Thursday, Nov. 1, but only with surveillance kept up and fire returned on anything firing at it; an air strike would have to be all-out, almost certainly leading to an invasion.'
      n: '[[w.poole-joint-chiefs-of-staff]], 180. To check: [[w.kennedy-tapes]], 356, 358, 364 (cited by [[w.poole-joint-chiefs-of-staff]], 180 n.87). See [[cal.1962-10-27.missile-crisis]]. Names: McNamara.'
      src:
