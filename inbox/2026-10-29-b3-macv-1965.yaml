      id: cal.1965-02-16.vietnam-operations
      when: Feb. 16
      date: '1965-02-16'
      thread: vietnam-operations
      c: Vũng Rô Bay, Phú Yên Province. A North Vietnamese ship found in a cove, about 100 tons of arms and ammunition landed,
        sunk by South Vietnamese aircraft. In caves by the shore, some one million rounds of small arms ammunition, 4,000
        mortar rounds, recoilless rifles, submachine guns, grenades, explosives and medicine from Communist factories. The
        first proof of infiltration by sea.
      n: '[[w.macv-command-history-1965]], 12, 54, 149, 478 (the day). To check: ARVN, Special Study on Infiltration, undated
        (cited by [[w.macv-command-history-1965]], 12 n.36).'
      src:
        c: 5e194146
        rows:
        - 'w.macv-command-history-1965 12, 54, 149, 478: all'
        - 'via w.macv-command-history-1965 12 n.36: B-C'
      tags:
      - province:phu-yen
    section: '196502'
