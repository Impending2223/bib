- add:
    entry:
      id: cal.1965-11-27.vietnam-operations
      when: Nov. 27
      date: '1965-11-27'
      thread: vietnam-operations
      c: 'Michelin plantation, Bình Dương Province. A reinforced Viet Cong regiment overruns the South Vietnamese 7th Regiment
        in its bivouac at dawn, as it readies to exploit B-52 strikes in the hills west of the plantation, its armor and artillery
        left behind. Losses: 249 killed, 213 wounded, 140 missing; 60 of the enemy''s bodies recovered.'
      n: '[[w.macv-command-history-1965]], 8, 224–26. To check: MONEVAL, MACV, Nov 65 (cited by [[w.macv-command-history-1965]],
        8 n.23, and 226 n.264); Capt. W. Baxter, former senior adviser, 3d Battalion, 7th Regiment, interviewed by Capt. C.
        Larimer, Jan. 29, 1966 (cited by [[w.macv-command-history-1965]], 225 n.263).'
      src:
