      id: cal.1965-08-21.vietnam-operations
      when: Aug. 21
      date: '1965-08-21'
      thread: vietnam-operations
      c: Starlite ends. MACV's count, some 700 of the enemy killed; an attack on Chu Lai forestalled.
      n: '[[w.macv-command-history-1965]], 162–63. See [[cal.1965-08-18.vietnam]].'
