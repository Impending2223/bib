- add:
    entry:
      id: cal.1965-11-08.vietnam-operations
      when: Nov. 8
      date: '1965-11-08'
      thread: vietnam-operations
      c: 'War Zone D, Hump, the 173d Airborne Brigade''s fifth operation there. The 1st Battalion, 503d Infantry, closes with
        a Viet Cong battalion, fighting too close for supporting fire; the assaults beaten off. Out Nov. 9: 403 of the enemy
        counted killed; Americans and Australians, 51 killed, 89 wounded.'
      n: '[[w.macv-command-history-1965]], 170–71. To check: CO, 173d Abn Bde, Combat Operations After Action Report, Dec.
        19, 1965 (cited by [[w.macv-command-history-1965]], 171 n.26).'
      src:
        c: 4f84c875
        rows:
        - 'w.macv-command-history-1965 170–71: all'
        - 'via w.macv-command-history-1965 171 n.26: all'
