      when: Nov. 21
      date: '1965-11-21'
      thread: vietnam-order-of-battle
      c: 'Westmoreland to CINCPAC: captured documents and prisoners show far larger enemy forces than estimated; his holdings
        revised to 16 confirmed, 4 probable and 1 possible Viet Cong and North Vietnamese main force regiments in the South.'
      n: '[[w.macv-command-history-1965]], 14. To check: COMUSMACV, 210122Z Nov 65 (cited by [[w.macv-command-history-1965]],
        14 n.47, and 44 n.96). See [[cal.1965-11-10.vietnam-2]]. Names: Westmoreland.'
