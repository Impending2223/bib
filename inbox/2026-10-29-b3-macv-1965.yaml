- add:
    entry:
      id: cal.1965-03-16.vietnam-operations
      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam-operations
      c: The Joint Chiefs approve Market Time, a combined American and South Vietnamese patrol against infiltration by sea
        from the DMZ to the Cambodian border, worked out at MACV from Mar. 3, under the Seventh Fleet. To begin, a destroyer,
        four minesweepers, five patrol and reconnaissance aircraft, 16 South Vietnamese ships, 100 junks. By the end of March,
        more than ten American destroyers and minesweepers, 116 South Vietnamese junks and patrol craft, ten American aircraft.
      n: '[[w.macv-command-history-1965]], 54–55. To check: NAVGP, Historical Review, NAVGP Activities, Mar 65 (cited by [[w.macv-command-history-1965]],
        55 n.155). See [[cal.1965-02-16.vietnam-operations]].'
      src:
        c: 4f675de3
        rows:
        - 'w.macv-command-history-1965 54–55: all'
        - 'via w.macv-command-history-1965 55 n.155: all'
    section: '196503'
