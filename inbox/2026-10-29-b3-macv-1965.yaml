      when: Dec. 29
      date: '1965-12-29'
      thread: vietnam-force-levels
      c: 'The 3d Brigade, 25th Infantry Division, flown from Hawaii to Pleiku, begins arriving: the year''s last Army deployment.
        Army strength in South Vietnam at the year''s end, 116,755.'
      n: '[[w.macv-command-history-1965]], 45. To check: MACOI News Release 363-65, Dec. 29, 1965 (cited by [[w.macv-command-history-1965]],
        45 n.103); MACJ1, Strength Report, Jan. 13, 1966 (cited by [[w.macv-command-history-1965]], 45 n.104, for the strength).
        See [[cal.1965-12-11.vietnam-force-levels]].'
