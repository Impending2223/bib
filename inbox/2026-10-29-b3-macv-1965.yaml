patch: b3-macv-1965
by: Claude (b3-macv reading agent, Oct. 29, 2026), from MACV's Command History, 1965
ops:
- add:
    entry:
      id: cal.1965-02-16.vietnam-operations
      when: Feb. 16
      date: '1965-02-16'
      thread: vietnam-operations
      c: Vũng Rô Bay, Phú Yên Province. A North Vietnamese ship found in a cove, about 100 tons of arms and ammunition landed,
        sunk by South Vietnamese aircraft. In caves by the shore, some one million rounds of small arms ammunition, 4,000
        mortar rounds, recoilless rifles, submachine guns, grenades, explosives and medicine from Communist factories. The
        first proof of infiltration by sea.
      n: '[[w.macv-command-history-1965]], 12, 54, 149, 478 (the day). To check: ARVN, Special Study on Infiltration, undated
        (cited by [[w.macv-command-history-1965]], 12 n.36).'
      src:
        c: 5e194146
        rows:
        - 'w.macv-command-history-1965 12, 54, 149, 478: all'
        - 'via w.macv-command-history-1965 12 n.36: B-C'
      tags:
      - province:phu-yen
    section: '196502'
- add:
    entry:
      id: cal.1965-03-10.vietnam-force-levels
      when: Mar. 10
      date: '1965-03-10'
      thread: vietnam-force-levels
      c: 'MACV''s Enclave Study, by its planning staff: a series of well-defended areas with ports and airfields, where the
        American presence could best be kept whatever the Viet Cong do.'
      n: '[[w.macv-command-history-1965]], 38 (the concept, shown to the Army''s Chief of Staff at the briefings of Mar. 7).
        To check: MACJ5, Enclave Study, Mar. 10, 1965 (cited by [[w.macv-command-history-1965]], 38 n.54). See [[cal.1965-03-08.vietnam]].'
      src:
        c: 06e8e51f
        rows:
        - 'w.macv-command-history-1965 38: all'
        - 'via w.macv-command-history-1965 38 n.54: all'
    section: '196503'
- add:
    entry:
      id: cal.1965-03-16.vietnam-operations
      when: Mar. 16
      date: '1965-03-16'
      thread: vietnam-operations
      c: The Joint Chiefs approve Market Time, a combined American and South Vietnamese patrol against infiltration by sea
        from the DMZ to the Cambodian border, worked out at MACV from Mar. 3, under the Seventh Fleet. To begin, a destroyer,
        four minesweepers, five patrol and reconnaissance aircraft, 16 South Vietnamese ships, 100 junks. By the end of March,
        more than ten American destroyers and minesweepers, 116 South Vietnamese junks and patrol craft, ten American aircraft.
      n: '[[w.macv-command-history-1965]], 54–55. To check: NAVGP, Historical Review, NAVGP Activities, Mar 65 (cited by [[w.macv-command-history-1965]],
        55 n.155). See [[cal.1965-02-16.vietnam-operations]].'
      src:
        c: 4f675de3
        rows:
        - 'w.macv-command-history-1965 54–55: all'
        - 'via w.macv-command-history-1965 55 n.155: all'
    section: '196503'
- add:
    entry:
      id: cal.1965-03-21.vietnam-force-levels
      when: Mar. 21
      date: '1965-03-21'
      thread: vietnam-force-levels
      c: 'Westmoreland to the Joint Chiefs, CINCPAC concurring: American combat troops must be ready to secure the major airfields
        and ports soon. A mobile Army brigade for Biên Hòa and Vũng Tàu; a division on the Qui Nhơn–An Khê–Pleiku axis, the
        airmobile division his choice. Enclaves the frame for every deployment, Đà Nẵng the pilot; Qui Nhơn, Nha Trang, Tuy
        Hòa, Phan Thiết and Chu Lai to follow.'
      n: '[[w.macv-command-history-1965]], 38. To check: COMUSMACV, 210200Z Mar 65 (cited by [[w.macv-command-history-1965]],
        38 n.57); MACJ5, Enclave Study, Mar. 10, 1965 (cited by [[w.macv-command-history-1965]], 38 n.54, for the enclave
        concept). See [[cal.1965-03-08.vietnam]]. Names: Westmoreland.'
      src:
        c: 6b7f4c02
        rows:
        - 'w.macv-command-history-1965 38: all'
        - 'via w.macv-command-history-1965 38 n.57: all'
        - 'via w.macv-command-history-1965 38 n.54: D-E'
      tags:
      - name:westmoreland-william
    section: '196503'
- add:
    entry:
      id: cal.1965-03-30.vietnam-force-levels
      when: Mar. 30
      date: '1965-03-30'
      thread: vietnam-force-levels
      c: Westmoreland asks a field command headquarters to control the American and allied forces planned for South Vietnam.
        Task Force Alpha, its answer, activated Aug. 1.
      n: '[[w.macv-command-history-1965]], 39, 41, 98. To check: COMUSMACV, MAC 1724, 301340Z Mar 65 (cited by [[w.macv-command-history-1965]],
        39 n.59). See [[cal.1965-03-21.vietnam-force-levels]]. Names: Westmoreland.'
      src:
