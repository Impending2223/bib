    section: '196511'
- add:
    entry:
      id: cal.1965-12-11.vietnam-force-levels
      when: Dec. 11
      date: '1965-12-11'
      thread: vietnam-force-levels
      c: 'The Secretary of Defense approves Westmoreland''s request after the Saigon briefings of Nov. 28: two brigades of
        the 25th Infantry Division as soon as possible, one flown to Pleiku behind the airmobile division, the other by sea
        to Saigon by Jan. 20, 1966.'
      n: '[[w.macv-command-history-1965]], 36, 45. To check: COMUSMACV, 091157Z Dec 65 (cited by [[w.macv-command-history-1965]],
        45 n.101, for the request); SECDEF, 112125Z Dec 65 (cited by [[w.macv-command-history-1965]], 36 n.40, and 45 n.102).
        See [[cal.1965-11-28.vietnam]]. Names: McNamara, Westmoreland.'
