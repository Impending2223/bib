- add:
    entry:
      id: cal.1965-10-07.vietnam-force-levels
      when: Oct. 7
      date: '1965-10-07'
      thread: vietnam-force-levels
      c: 'CINCPAC''s program for Phase II, from its conference: the 4th Infantry Division for II Corps, a brigade in June
        1966, the division by December; the 25th for III Corps, a brigade by Jan. 31, 1966, the rest by September; the armored
        cavalry regiment in September 1966.'
      n: '[[w.macv-command-history-1965]], 44. To check: CINCPAC, 000347, Program for Phase II, Oct. 7, 1965 (cited by [[w.macv-command-history-1965]],
        44 n.94). See [[cal.1965-09-18.vietnam-force-levels]]. Names: Sharp.'
