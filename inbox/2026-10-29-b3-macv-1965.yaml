        - 'w.macv-command-history-1965 41, 98: B'
        - 'via w.macv-command-history-1965 39 n.59: A'
      tags:
      - name:westmoreland-william
    section: '196503'
- add:
    entry:
      id: cal.1965-04-14.vietnam-force-levels
      when: Apr. 14
      date: '1965-04-14'
      thread: vietnam-force-levels
      c: The Joint Chiefs approve the 173d Airborne Brigade for temporary deployment from Okinawa to South Vietnam; Strike
        Command to replace it as soon as possible with a brigade from home, so that it can go back to the Pacific reserve.
        Westmoreland asks an airborne brigade in its place.
      n: '[[w.macv-command-history-1965]], 39. To check: JCS, 140355Z Apr 65 (cited by [[w.macv-command-history-1965]], 39
        n.62); JCS 009012, 140051Z Apr 65 (cited by [[w.macv-command-history-1965]], 39 n.63, for the replacement); COMUSMACV,
        181314Z Apr 65 (cited by [[w.macv-command-history-1965]], 39 n.64, for Westmoreland''s request). See [[cal.1965-03-21.vietnam-force-levels]].
        Names: Westmoreland.'
      src:
        c: 31d3d7ce
        rows:
        - 'w.macv-command-history-1965 39: all'
        - 'via w.macv-command-history-1965 39 n.62: A'
        - 'via w.macv-command-history-1965 39 n.63: B'
        - 'via w.macv-command-history-1965 39 n.64: C'
      tags:
      - name:westmoreland-william
    section: '196504'
- add:
    entry:
      id: cal.1965-05-11.vietnam-operations
      when: May 11
      date: '1965-05-11'
      thread: vietnam-operations
      c: 'Sông Bé, capital of Phước Long Province. Some four Viet Cong battalions break into the town, a suicide squad into
        the American advisers'' compound; the defenders hold. A Ranger and an infantry battalion sent the next day; the enemy
        withdraws under air attack. Losses: 63 killed, five of them American, 109 wounded, 83 missing; the Viet Cong 297 killed.'
      n: '[[w.macv-command-history-1965]], 220–21, 479 (the day). To check: COMUSMACV MILREP, 170430Z May 65 (cited by [[w.macv-command-history-1965]],
        221 n.256).'
      src:
        c: dd204089
        rows:
        - 'w.macv-command-history-1965 220–21: all'
        - 'w.macv-command-history-1965 479: B'
        - 'via w.macv-command-history-1965 221 n.256: all'
      tags:
      - province:phuoc-long
    section: '196505'
- add:
    entry:
      id: cal.1965-06-27.vietnam-force-levels
      when: June 27
      date: '1965-06-27'
      thread: vietnam-force-levels
      c: 'Westmoreland''s new forecast of requirements to the Joint Chiefs, beyond his request of June 7: seven Marine helicopter
        squadrons, three fighter and three attack squadrons; thirteen airmobile companies and airlift platoons for the infantry
        brigades and the artillery.'
      n: '[[w.macv-command-history-1965]], 35, 41. To check: COMUSMACV, MAC 3283, June 27, 1965 (cited by [[w.macv-command-history-1965]],
        35 n.34, and 41 n.75). See [[cal.1965-06-07.vietnam]]. Names: Westmoreland.'
      src:
        c: 70deecb2
        rows:
        - 'w.macv-command-history-1965 35: A'
        - 'w.macv-command-history-1965 41: B'
        - 'via w.macv-command-history-1965 35 n.34: A'
        - 'via w.macv-command-history-1965 41 n.75: B'
      tags:
      - name:westmoreland-william
    section: '196506'
- add:
    entry:
      id: cal.1965-07-02.vietnam-force-levels
      when: July 2
      date: '1965-07-02'
      thread: vietnam-force-levels
      c: 'Westmoreland to CINCPAC on where the Army''s combat units go: the 2d Brigade, 1st Infantry Division, to Biên Hòa,
        a battalion to Cam Ranh Bay; the 1st Brigade, 101st Airborne, to Đồng Ba Thìn near Nha Trang; the airmobile division
        to Qui Nhơn; the rest of the 1st Infantry Division to III Corps; the 173d at Biên Hòa, a reaction force for the whole
        country. CINCPAC and the Joint Chiefs concur.'
      n: '[[w.macv-command-history-1965]], 41. To check: COMUSMACV 12727, 020836Z Jul 65 (cited by [[w.macv-command-history-1965]],
        41 n.76); CINCPAC, 022101Z Jul 65 (cited by [[w.macv-command-history-1965]], 41 n.77, for the concurrence); JCSM 515-65,
        July 2, 1965 (cited by [[w.macv-command-history-1965]], 41 n.78, for the concurrence). See [[cal.1965-06-27.vietnam-force-levels]].
        Names: Westmoreland.'
      src:
        c: 6dac2e2f
        rows:
        - 'w.macv-command-history-1965 41: all'
        - 'via w.macv-command-history-1965 41 n.76: A-E'
        - 'via w.macv-command-history-1965 41 n.77: F'
        - 'via w.macv-command-history-1965 41 n.78: F'
      tags:
      - name:westmoreland-william
    section: '196507'
- add:
    entry:
      id: cal.1965-07-16.vietnam-force-levels
      when: July 16
      date: '1965-07-16'
      thread: vietnam-force-levels
      also:
      - vietnam-july-decision
      c: 'McNamara in Saigon. Westmoreland''s concept: 44 maneuver battalions in 1965, from enclaves and secure bases, as
        many as possible held for mobile reaction; with them 22 artillery, four Hawk and 13 engineer battalions, 20 Army helicopter
        companies, seven Marine helicopter squadrons: the Phase I forces. For 1966, 24 more maneuver battalions, 14 artillery,
        three Hawk, eight engineer battalions, 12 helicopter companies.'
      n: '[[w.macv-command-history-1965]], 42. To check: SECDEF, 5319, Jul 65 (cited by [[w.macv-command-history-1965]], 42
        n.83); Memo, SECDEF Saigon Trip, Items for Discussion, July 14, 1965 (cited by [[w.macv-command-history-1965]], 42
        n.85). See [[cal.1965-07-02.vietnam-force-levels]]. Names: McNamara, Westmoreland.'
      src:
        c: 752d147b
        rows:
        - 'w.macv-command-history-1965 42: all'
        - 'via w.macv-command-history-1965 42 n.83: A-B'
        - 'via w.macv-command-history-1965 42 n.85: B-D'
      tags:
      - name:mcnamara-robert-s
      - name:westmoreland-william
    section: '196507'
- add:
    entry:
      id: cal.1965-08-02.vietnam-force-levels
      when: Aug. 2
      date: '1965-08-02'
      thread: vietnam-force-levels
      c: 'The 173d Airborne Brigade to stay in South Vietnam for good, not to be replaced by the 1st Brigade, 101st Airborne:
        Westmoreland has the two mobile brigades he asked for a reserve and reaction force.'
      n: '[[w.macv-command-history-1965]], 41. To check: MACV, 1965 Command Chronology (cited by [[w.macv-command-history-1965]],
        41 n.80); DA, 726278, 021449Z Aug 65 (cited by [[w.macv-command-history-1965]], 41 n.81). See [[cal.1965-04-14.vietnam-force-levels]].
        Names: Westmoreland.'
      src:
        c: 9dc9c2d3
        rows:
        - 'w.macv-command-history-1965 41: all'
        - 'via w.macv-command-history-1965 41 n.80: all'
        - 'via w.macv-command-history-1965 41 n.81: all'
      tags:
      - name:westmoreland-william
    section: '196508'
- add:
    entry:
      id: cal.1965-08-06.vietnam-force-levels
      when: Aug. 6
      date: '1965-08-06'
      thread: vietnam-force-levels
      c: 'CINCPAC''s program for the Phase I deployment, from the Honolulu conference: the rest of the 1st Infantry Division
        to III Corps, Oct. 1–7; six artillery battalions by Oct. 2; 13 2/3 light and four medium helicopter companies, Nov.
        15, 1965, to Oct. 1, 1966; two Hawk battalions, Tân Sơn Nhứt and Qui Nhơn, by Oct. 1; three Caribou companies by Dec.
        31.'
      n: '[[w.macv-command-history-1965]], 42–43. To check: CINCPAC, Program for Phase I Deployment to RVN and WESTPAC, Aug.
        6, 1965 (cited by [[w.macv-command-history-1965]], 43 n.89). See [[cal.1965-07-16.vietnam-force-levels]]. Names: Sharp.'
      src:
