      when: Mar. 3
      date: '1965-03-03'
      thread: vietnam-operations
      c: 'Saigon. MACV''s planning conference on a combined American and South Vietnamese patrol against infiltration by sea,
        after Vũng Rô: two kinds of traffic, coastal junks among the thousands off the coast and seagoing trawlers; a committee
        of MACV, the Naval Advisory Group and the Seventh Fleet draws the concept.'
      n: '[[w.macv-command-history-1965]], 54–55. To check: NAVGP, Historical Review, NAVGP Activities, Mar 65 (cited by [[w.macv-command-history-1965]],
        55 n.155). See [[cal.1965-02-16.vietnam-operations]].'
      src:
