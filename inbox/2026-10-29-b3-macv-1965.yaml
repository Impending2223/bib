- add:
    entry:
      id: cal.1965-09-18.vietnam-force-levels
      when: Sept. 18
      date: '1965-09-18'
      thread: vietnam-force-levels
      c: 'Westmoreland''s Phase II force requirements, after the conference in Saigon: two more infantry divisions, an armored
        cavalry regiment, a second field force headquarters, a fourth battalion for the 173d, some 30,000 Army support troops.
        One division on the southern coastal plain of II Corps, the cavalry with it on Route 1; the other in Hậu Nghĩa, northwest
        of Saigon.'
      n: '[[w.macv-command-history-1965]], 43–44. To check: COMUSMACV, MACV Phase II Force Requirements, Sept. 18, 1965 (cited
        by [[w.macv-command-history-1965]], 43 n.92). See [[cal.1965-09-01.vietnam-3]]. Names: Westmoreland.'
      src:
        c: 49c819f3
        rows:
        - 'w.macv-command-history-1965 43–44: all'
        - 'via w.macv-command-history-1965 43 n.92: all'
      tags:
      - name:westmoreland-william
      - province:hau-nghia
    section: '196509'
- add:
    entry:
      id: cal.1965-09-23.vietnam-operations
      when: Sept. 23–29
      date: '1965-09-23'
      thread: vietnam-operations
      c: 'Phù Cũ pass, Bình Định Province. The Viet Cong overrun the post, Sept. 23; the South Vietnamese 41st Regiment''s
        column sent to retake it in Quyết Thắng 165 cut in three by a regiment, the 23d Rangers hit on the way. Air strikes;
        fighting to Sept. 29. Losses: 93 killed, 116 wounded; the enemy''s estimated at 2,050 killed.'
      n: '[[w.macv-command-history-1965]], 7, 223. To check: COMUSMACV MILREP, 270940Z Sep 65 (cited by [[w.macv-command-history-1965]],
        223 n.259); MONEVAL, MACV, Sep 65 (cited by [[w.macv-command-history-1965]], 223 n.260).'
      src:
        c: 218a887b
        rows:
        - 'w.macv-command-history-1965 223: all'
