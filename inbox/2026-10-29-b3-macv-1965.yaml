- add:
    entry:
      id: cal.1965-09-18.vietnam-operations
      when: Sept. 18–19
      date: '1965-09-18'
      thread: vietnam-operations
      c: Gibraltar, northeast of An Khê, in Highland, the 1st Brigade, 101st Airborne's opening of Route 19 for the airmobile
        division. Two companies landed by helicopter meet heavy fire, the rest of the battalion turned back; surrounded overnight,
        relieved the next morning. American losses 13 killed, 44 wounded; the enemy's 226 killed, 9 captured, by MACV's count.
      n: '[[w.macv-command-history-1965]], 167–68. To check: CO, 1st Bde, 101st Abn Div, Combat Operations After Action Report,
        Operation Highland, Dec. 5, 1965 (cited by [[w.macv-command-history-1965]], 167 n.19); CO, 1st Bde, 101st Abn Div,
        Preliminary After Action Report, Operation Gibraltar, 18–21 Sep 65, Sept. 21, 1965 (cited by [[w.macv-command-history-1965]],
        168 n.20).'
      src:
        c: 44d6eb67
        rows:
        - 'w.macv-command-history-1965 167–68: all'
        - 'via w.macv-command-history-1965 167 n.19: A'
        - 'via w.macv-command-history-1965 168 n.20: B-E'
