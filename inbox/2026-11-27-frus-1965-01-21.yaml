      c: 'Johnson with the Democratic chairmen of the Senate committees, 5:40–7:25 p.m. Each reports the timetable of his committee''s major bills; Johnson reviews his efforts to hold down the
        cost of government. More than half the time goes to Vietnam, led by Fulbright. Johnson: he agrees totally with all Fulbright has said and with his review of the problems, but no one in
        the room has an answer.'
      n: '[[w.gibbons-u-s-government-and]], III, 41 and n.103 ("that afternoon"; the notes dictated to Juanita Roberts by O''Brien and by Ramsey Clark, who attended, are by Gibbons''s account
        the only notes of the meeting and give no more on Vietnam). To check: Diary Backup, Jan. 22, 1965, LBJ Library (cited by [[w.gibbons-u-s-government-and]], III, 41 n.103). See [[cal.1965-01-21.vietnam]];
        [[cal.1965-01-21.program]] (the House chairmen "the day before" by Gibbons, Vietnam not discussed). Check: the day: Gibbons sets this the afternoon of the leaders'' meeting, which he dates
        Jan. 22 and FRUS Jan. 21. Names: Johnson, Fulbright.'
      tags:
