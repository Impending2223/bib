      time_zone: America/New_York
      place:
      - washington
      - saigon
      thread: vietnam
      c: 'Rusk to Taylor, Department of State 1509, 7:52 p.m.: the view remains that the dependents should be withdrawn. Taylor to put it to Hương with the substance of the proposed statement
        only, and to say that no decision to evacuate has been taken. The announcement to be made first in Washington; the other governments told here first; a month to carry out the evacuation
        acceptable; with any reprisal, a much stepped-up evacuation of the rest.'
      n: '[FRUS 1964–68, II, doc. 31](https://history.state.gov/historicaldocuments/frus1964-68v02/d31) (answering Saigon 2186; drafted by Unger, cleared by Cooper, McNamara and Rusk, approved
        by William Bundy; Top Secret, Immediate, Nodis). To check: [FRUS 1964–68, II, doc. 28](https://history.state.gov/historicaldocuments/frus1964-68v02/d28) (Taylor''s Saigon 2186, the message
        answered). See [[cal.1965-01-14.vietnam]]; [[cal.1965-01-21.vietnam]] (Johnson to the leaders on the dependents). Names: Rusk, Taylor, Trần Văn Hương.'
