      c: 'Johnson with the congressional leaders of both parties, 10:07 a.m.–12:45 p.m., Russell and Fulbright not asked.{1} A stable government in Saigon first.{2} More American forces not needed
        "short of a decision to go to full-scale war."{3} Johnson opens: "We do not separate Democrats and Republicans in Vietnam." Vietnam is his worst problem, one he "wrestles with all the
        time, day and night." Rusk: political instability is the greatest problem. McNamara puts infiltration since 1959 at 19,000 to 34,000. Long asks why not push into North Vietnam; Dirksen
        cannot understand why the dependents are not brought home, "We are pampering our forces in South Vietnam."{4} Johnson wants procedures for the Administration to think and plan with the
        leaders; he will be frank if nothing reaches the public. Eisenhower''s way of consulting the leaders the best he knew. Rusk has briefed the committees; McNamara goes to the Hill later.
        Johnson will meet any leader at any time.{6} On the dependents he fears Viet Cong attacks on Americans in Saigon, and Hanoi bombs on the city, if the U.S. strikes the North. Taylor and
        others in Saigon oppose sending them home; he has thought for over fourteen months they should come. He has no "Lincoln Cabinet": the decision is still being explored. If women and children
        were lost, the people would hold him responsible.{7} Foreign relations should be dealt with without politics: Kennedy had Republican support, Truman had Vandenberg, "The Administration
        has no mortgage on patriotism." He wants Republicans in on "take-offs rather than merely at the time of crash landings." The responsibility is his; he wants all views. He praises McCone,
        Rusk and McNamara, who gave up over $4 million to run Defense. His aim: a country united in the eyes of the world, a nuclear holocaust avoided, the defense kept.{8} Rusk: Hanoi thinks
        it can win by holding on while the instability grows. The new cabinet is a compromise between civilians and the military. The political lines are kept open for a settlement on the 1954
        or the 1962 agreement; if the Communists will not return to them, "a very difficult time." Laos is a "thermometer" of what is possible: the three factions'' talks may lead to a fourteen-nation
        conference, and a settlement on the 1962 agreements would help in South Vietnam. Johnson, breaking in: friendly states hold back aid for fear the country "goes to pieces politically."{9}
        McNamara: Viet Cong strength estimates are up; infiltration may run near 10,000 a year. South Vietnamese forces to rise by 87,000 in 1965; desertions stay high. To Saltonstall: deserters
        go home, not to the Viet Cong. Killed in 1964: 17,000 Viet Cong, 7,500 South Vietnamese; Americans killed since 1954: 245. To Saltonstall on the disparity: a ten to one advantage is needed
        to win a guerrilla war; more South Vietnamese troops, not more U.S. forces.{10} Dirksen cites Keyes Beech of the *Chicago Daily News* as "a reliable correspondent." Johnson challenges
        that: Beech reported in December that Taylor was returning to Washington, threatening to resign unless the President ordered attacks on the North; Taylor flatly denied it and telephoned
        the White House from Honolulu.{11} Johnson, after Long''s question: he called the leaders to inform them in general and to work out meetings every few weeks, not to go through all the
        details. He warns again against leaks: if reporters learn what the leaders are told, "all would be lost."{12} Long: perhaps he should not be told all the details, but he wants an answer
        why the U.S. does not move against North Vietnam. McNamara: the covert program, South Vietnamese forces trained by the U.S. and now in use, teams dropped in North Vietnam, attacks from
        the sea on its coast. In Laos, reconnaissance flights at Souvanna Phouma''s request: more than 450 facilitated, four U.S. aircraft lost, Pathet Lao forces moving into the Panhandle. The
        recent bombing of the bridge at Ban Ken, not officially confirmed, was by U.S. planes on armed reconnaissance: the bridge was heavily defended and the Lao T-28s could not do it. To Saltonstall,
        whether the aim is Laos or Vietnam: both.{13} McNamara on the dependents: the U.S. political and military officers in Saigon do not want them sent home, for the effect in Southeast Asia
        and on personnel; 1,700 dependents of government personnel, besides those of non-U.S. personnel and some other private Americans.{14} Johnson to Dirksen: for fourteen months he has agreed
        with those who want the dependents brought home; the officers in Saigon still oppose it.{15} Ford shares the "Vandenberg philosophy"; his relations with Rusk, McNamara and McCone are excellent;
        the opposition party will cooperate and take no position harmful to the national interest. He agrees with the course in South Vietnam; the commitment must be kept. With 25,000 to 30,000
        infiltrated since 1959, how can the ratio better 5 to 1 if infiltration keeps rising? Should military action cut it down? He hopes for frequent, regular meetings.{16} Smathers asks why
        the Navy is not used to halt infiltration by sea; some Navy officers, he says, see many unused ways. McNamara: sea infiltration is almost stopped; South Vietnamese ships, under a program
        the U.S. began, patrol all sea areas and stop and search every junk moving south. Part of the land border is under water, with no solution found; infiltration across the water borders
        goes on.{17} Johnson reads parts of a draft press statement, asks for objections, hears none and authorizes its issue. The text is attached to the notes, not printed.{18} Thirteen lawmakers
        attend, among them Mansfield, Dirksen, Long, Smathers, Ford, Laird and McCormack; Johnson says he wants the meeting kept small.{5} The others: Aiken, Kuchel and Saltonstall; Albert, Arends
        and Boggs. With them Humphrey, Rusk, McNamara, McCone, Bundy and O''Brien; Busby, Cater, Moyers, Reedy and Valenti for part.{19}'
      n: '[FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30) (Bromley Smith''s notes, "this morning''s meeting"; the source text lists Jan. 22, FRUS''s
        note 1 has the President''s Daily Diary at 10:07 a.m.–12:45 p.m., Jan. 21; the list of those present is its note 1; the press statement is attached to the notes and not printed; no answer
        to Ford''s question is recorded; the notes pass over the talk on the Congo, Egypt, Indonesia, Pearson''s visit and the European matters, Germany, the defense posture, the Middle East and
        China, defense research, Soviet nuclear testing, the Kennedy Round, nonproliferation and Sino-Soviet relations). [[w.gibbons-u-s-government-and]], III, 39–41 (Jan. 22, 10:00 a.m.–12:40
        p.m.; the attendance, 40 n.101; the covert operations McNamara gives, 40–41; Ford the only direct statement of support, 41); [[w.branch-pillar-of-fire]], 563 (Friday morning, Jan. 22;
        Vietnam the worst problem; the dependents; Rusk on the allies and the instability; Long for bombing the North, Dirksen for the dependents'' return); [[w.logevall-choosing-war]], 314–15
        (the meeting of Jan. 21, the day after the inauguration, no hour: Russell and Fulbright not invited; Mansfield, Dirksen and Ford among the thirteen lawmakers; Johnson, "There are no Democrats
        or Republicans on Vietnam"); [[w.logevall-choosing-war]], 315. [[w.mann-grand-delusion]], 390 (Jan. 21; the Republicans "in on foreign policy take-offs"; McNamara''s figures; Johnson on
        more U.S. forces). Dirksen''s remark: the notes have him say he "could not understand why we did not bring the dependents home" ([FRUS 1964–68, II, doc. 30](https://history.state.gov/historicaldocuments/frus1964-68v02/d30),
        68), not ask it. Check: the day and the hour. FRUS''s note 1 has the source text at Jan. 22 and the President''s Daily Diary (not seen) at Jan. 21, 10:07 a.m.–12:45 p.m.; Gibbons (III,
        39) has Jan. 22, 10:00 a.m.–12:40 p.m., and the Senate Democratic chairmen that afternoon; Branch (563) Friday morning; Logevall (314) and Mann (390) Jan. 21. Check: Branch sets the meeting
        Friday, Jan. 22, by Bromley Smith''s minutes of that date (563). Check: Mrs. Johnson''s diary (230–31) has Johnson at 10 a.m. this day in the Yellow Room with the House leadership and
        the committee chairmen, on the legislative program; [[cal.1965-01-21.program]]. To check: Bromley Smith minutes, LBJ meeting with congressional leaders, Jan. 22, 1965, Box 18-19, McGeorge
        Bundy Office Files, LBJ (cited by [[w.branch-pillar-of-fire]], 563); the President''s Daily Diary, Jan. 21, 1965. See [[cal.1964-12-01.vietnam]] (Johnson''s conference with Taylor in December);
        [[cal.1964-10-19.congress]] (the last meeting with the leaders, October); [[cal.1965-01-13.laos]] (the Ban Ken bridge); [[cal.1965-01-15.vietnam-congress]] (Rusk before Foreign Relations).
        Names: Johnson, Russell, Fulbright, Rusk, McNamara, Mansfield, Dirksen, Long, Smathers, Ford, Laird, McCormack, Saltonstall, Beech, Taylor, Eisenhower, Kennedy, Truman, McCone, Humphrey,
        Souvanna Phouma, Aiken, Kuchel, Albert, Arends, Boggs, Bundy, O''Brien, Busby, Cater, Moyers, Reedy, Valenti.'
