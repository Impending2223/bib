      gloss:
        title: Commentary
        text:
        - 'Logevall (1999): Rusk misstated the Administration''s position on negotiations, and McNamara overstated the results of the covert operations and the South Vietnamese army''s gains;
          the guests favored the hawks, and the meeting began "the campaign of deception on Vietnam" ([[w.logevall-choosing-war]], 314–15).'
        - 'Mann (2001): the briefing was meant to bolster the case for greater intervention, not to take advice; Johnson led the group to believe he still strongly opposed escalation ([[w.mann-grand-delusion]],
          390).'
