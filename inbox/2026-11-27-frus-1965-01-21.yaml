- add:
    entry:
      id: cal.1965-01.vietnam-congress
      when: Jan.
      date: 1965-01
      thread: vietnam-congress
      c: 'Jonathan Moore to William Bundy, "Congressional Attitudes on SVN," undated: "generalized frustration" with the war; most members neither satisfied nor dissatisfied, willing to go along
        with the Executive Branch''s experts. Support adequate for the moment, largely passive. A group of junior Senate liberals, Church, McGovern, Gore, Pell and Nelson, growing in size and
        boldness, for an honorable withdrawal under international safeguards. Without more effort on the Hill, support could erode.'
      n: '[[w.gibbons-u-s-government-and]], III, 39 and n.100 (written in January 1965; Kennedy Library, Thomson Papers, the folder 1-65 to 2-65; the report''s three points; more in Part II, 396–97).
        To check: Moore to William Bundy, "Congressional Attitudes on SVN," Jan. 1965, Thomson Papers, Kennedy Library (cited by [[w.gibbons-u-s-government-and]], III, 39 n.100). See [[cal.1965-01-15.vietnam-congress]].
        Check: the day. Names: Moore, William Bundy, Church, McGovern, Gore, Pell, Nelson.'
