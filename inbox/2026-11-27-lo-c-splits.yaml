      c: 'The residence: Johnson polls McNamara and the Chiefs before the photographers, "a meeting of the minds."{1} By Westmoreland''s account Johnson tells him after the meeting that he has chosen the smaller package, cut almost in half: just over 47,000 men, under a ceiling of 525,000.{2}'
      n: '[[w.branch-at-canaans-edge]], 629–30; [[w.drea-mcnamara-clifford-and-the-2011]], 141 (July 13, Johnson with McNamara, Wheeler and Westmoreland for an increase); [[w.westmoreland-soldier-reports]], 230 (the next day''s news conference: "we have reached a meeting of the minds"); [[w.westmoreland-soldier-reports]], 230. To check: "Generals Agree with President on Build-up Issue," [*New York Times*, July 14, 1967](https://timesmachine.nytimes.com/timesmachine/1967/07/14/issue.html), at 1 (cited by [[w.branch-at-canaans-edge]], 630). See [[cal.1967-07-12.vietnam-force-levels]]. Names: McNamara, Johnson, Westmoreland. Check: Westmoreland has himself, after his mother''s funeral at Columbia on July 12, with the National Security Council in the Cabinet Room, and Johnson deciding then for the lesser of his two packages, cut to just over 47,000 more men under a ceiling of 525,000 (230); whether this meeting.'
