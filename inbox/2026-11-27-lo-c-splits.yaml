- edit:
    id: cal.1962-01-17.china-leadership
    base: 9d8d477e
    set:
      when: Jan. 17
      c: 'Zhou Enlai joins the drafting committee the Center forms to discuss and revise the report Liu Shaoqi is to give the enlarged Central Work Conference;{1} Jan. 17, the Huairen Tang''s back hall, 3 to 6:30 p.m.: Liu Shaoqi, Deng Xiaoping, Chen Boda, Li Fuchun, Bo Yibo, Li Jingquan, Tao Zhu and Song Renqiong speak first.{3} Chen Yun is at the first meeting; the members include Liu, Zhou, Deng Xiaoping, Chen Yun, Li Fuchun, Li Xiannian and Bo Yibo.{4} Zhou, after Peng Zhen: seek the causes in ourselves; the Chairman saw the problems early; listen to the "boatman."{5} Peng Zhen attends.{6} Ke Qingshi asks whether the Twelve-Year Agricultural Program still stands;{7} says 300 million tons of grain is not possible but 250 million is, and that East China alone could produce 200 million by 1967; asks whether Britain is still to be overtaken in fifteen years and whether to go all out.{8} Liu Shaoqi, Zhou Enlai and others reply that the Program was not properly researched and its grain targets not scientific;{9} Deng Xiaoping, that the higher the figures, the harder to reach them.{10}'
