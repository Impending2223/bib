      c: Schlesinger with the President-elect at noon, his Senate office, then Georgetown, by Schlesinger's account.{1} Hodges and Ribicoff settled; Udall and Goldberg nearly.{2} Fulbright the likeliest for State. Kennedy asks after Stevenson for Attorney General;{3} Schlesinger names Harriman to Kennedy for Secretary of State;{6} Kennedy dismisses him as "old hat," by Schlesinger's journal.{7}
