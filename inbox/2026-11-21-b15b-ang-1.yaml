      when: Jan. 21
      date: '1960-01-21'
      thread: vietnam-hanoi
      also:
      - vietnam-diplomacy
      c: 'Võ Nguyên Giáp at a press conference: he has written to the International Commission asking it to press the South Vietnamese authorities to rescind Law 10/59.'
      n: '[[w.guan-vietnamese-communists-relations-with]], 134. Names: Võ Nguyên Giáp.'
      tags:
      - polity:drv
      - name:vo-nguyen-giap
