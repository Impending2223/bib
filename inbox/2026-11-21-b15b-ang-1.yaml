- cite:
    id: cal.1960-02-04.soviet-union
    item: '[[w.guan-vietnamese-communists-relations-with]], 134–135, 140–141 (the Political Consultative Committee, Feb. 4–5; the Vietnamese delegation headed by Trường Chinh, Võ Nguyên Giáp there by NCNA, not VINA; Kang Sheng''s speech, extremely anti-Soviet, says nothing of the struggle in the South, a brief word on U.S. support for the reactionaries in Laos; the Declaration urges all to help the coming East-West talks)'
