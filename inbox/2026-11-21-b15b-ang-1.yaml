      date: '1960-04'
      thread: vietnam-diplomacy
      also:
      - china-leadership
      c: 'Zhou Enlai accepts Phạm Văn Đồng''s invitation: glad to visit Vietnam again, now that the Vietnamese people, led by the Lao Động Party and the government, have won brilliant achievements in socialist construction and strive to fulfil the three-year plan. Not a word of the struggle in the South.'
