    item: '[[w.guan-vietnamese-communists-relations-with]], 144 (bad weather; the delegation rests a day in Nghệ An province)'
- cite:
    id: cal.1960-05-10.china-leadership-3
    item: '[[w.guan-vietnamese-communists-relations-with]], 144 (Hanoi the morning of May 10: the delegation, Chen Yi, Zhang Hanfu, Wang Guangwei, Zhang Yan, Qiao Guanhua, Luo Qingchang, Chen Shuliang; met at the airport by Phạm Văn Đồng, Lê Duẩn, Trường Chinh, Phan Kế Toại, Phạm Hùng and Tôn Đức Thắng, Giáp absent throughout; Hồ receives them at the Presidential Palace; in the afternoon the Thăng Long cigarette, Sao Vàng rubber and Hanoi soap factories, all built with Chinese aid, and their joint rally; a wreath at Mai Dịch)'
- cite:
    id: cal.1960-05-10.china-leadership-4
    item: '[[w.guan-vietnamese-communists-relations-with]], 144–145 (Phạm Văn Đồng''s speech gives China''s aid: railways, irrigation and factories repaired, consumer goods to steady prices, farm-tool and consumer-goods plants, tropical-crop and livestock farms, the Bắc Hưng Hải irrigation system; now metallurgy, chemicals, power and the Red River plans; of 72 factories built with Chinese aid, 31 working. Zhou recalls the American pledge at Geneva not to use force against the Agreements)'
- cite:
    id: cal.1960-05-11.china-leadership
    item: '[[w.guan-vietnamese-communists-relations-with]], 145 (the morning of May 11, the talks between the two governments; China''s economic aid a main subject, by the delegations: Wang Guangwei, of the State Planning Commission, and Fang Yi, China''s economic representative in Vietnam)'
