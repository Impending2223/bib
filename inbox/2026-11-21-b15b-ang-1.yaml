    entry:
      id: cal.1960-04-20.vietnam-hanoi-2
      when: Apr. 20
      date: '1960-04-20'
      thread: vietnam-hanoi
      c: 'Lê Duẩn''s speech for Lenin''s ninetieth birthday ("Leninism and Vietnam''s Revolution"): the South''s people''s democratic revolution comes in a changed world, socialism gaining, the North liberated and the revolution''s firm base; while a lasting peace can be kept, "we can and must guide and restrict within the South" the solving of the contradiction between imperialism and the colonies in Vietnam.'
      n: '[[w.guan-vietnamese-communists-relations-with]], 143. To check: [[w.duan-on-the-socialist-revolution]], I, 9–56 (cited by [[w.guan-vietnamese-communists-relations-with]], 143 n.51). Names: Lê Duẩn.'
      tags:
      - polity:drv
      - name:le-duan
      - ok:fields-place
