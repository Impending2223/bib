- cite:
    id: cal.1960-04.vietnam-hanoi
    item: '[[w.guan-vietnamese-communists-relations-with]], 135 (the Military Obligation Law promulgated and put in force in April; the VPA no longer a volunteer army; a large trained reserve, a smaller standing army)'
