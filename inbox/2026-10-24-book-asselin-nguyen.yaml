      n: 'FRUS 1964–68, VI, docs. [34](https://history.state.gov/historicaldocuments/frus1964-68v06/d34), [37](https://history.state.gov/historicaldocuments/frus1964-68v06/d37). [[w.vietnam-victory-in-vietnam]], 217, 466 n.15 (the attack put off a night by a cable of Jan. 29; Quảng Đà, Phú Yên, Bình Định and Khánh Hòa, not told, attacked as first planned); [[w.cosmas-joint-chiefs-of-staff]], 145; [[w.drea-mcnamara-clifford-and-the-2011]], 180; [[w.staaveren-u-s-air-force]], 292; [[w.nguyen-hanois-war]], 108 (some central provinces a day early). To check: [[w.oberdorfer-tet]]; [[w.wirtz-tet-offensive]]; [[w.schmitz-tet-offensive]]; [[w.willbanks-tet-offensive]]; [[w.villard-1968-tet-offensive-battles]]; [[w.ford-tet-1968]]; [[w.tet-offensive]]; [[w.tra-tet]]; [[w.lung-general-offensives-of-1968]]; [[w.shulimson-u-s-marines-in-1997]]; [[w.bowden-hue-1968]]; [[w.nolan-battle-for-hue]]; [[w.smith-siege-at-hue]]; [[w.ca-mourning-headband-for-hue]]; [[w.braestrup-big-story]]; [[w.hallin-uncensored-war-the-media]]; [[w.hammond-public-affairs]]; [[w.arnett-live-from-the-battlefield]]; [[w.schandler-unmaking-of-a-president]]; [[w.clifford-counsel-to-the-president-2]]; [[w.hoopes-limits-of-intervention]]; [[w.isaacson-wise-men]]; [[w.mcpherson-political-education]]; [[w.johnson-vantage-point]]; [[w.spector-after-tet]]. See [[cal.1967-12-19.vietnam-2]].'
