- edit:
    id: cal.1967-07.vietnam-tet
    base: 62f383fe
    set:
      c: 'The General Staff''s plan for a general offensive and general uprising, put to the Politburo and the Central Military Party Committee: a surprise attack on the cities, Saigon, Huế and Đà Nẵng the main targets, American forces held in the mountains and on the borders. By Nguyen''s account, a meeting of July 18–19: Lê Duẩn and Văn Tiến Dũng put the plan; Hồ Chí Minh questions it and urges guerrilla war widened.'
      n: '[[w.vietnam-victory-in-vietnam]], 207; [[w.nguyen-hanois-war]], 100–102 (the meeting of July 18–19). See [[cal.1967-06.vietnam-tet]]. Names: Lê Duẩn, Văn Tiến Dũng, Hồ Chí Minh.'
      tags:
      - name:le-duan
      - name:van-tien-dung
      - name:ho-chi-minh
- edit:
    id: cal.1967-10.vietnam-tet
    base: f9f5c93d
    set:
      n: '[[w.vietnam-victory-in-vietnam]], 214. What Washington read: the captured documents on the winter–spring campaign, Rostow to Johnson, Dec. 16, [FRUS 1964–68, V, doc. 440](https://history.state.gov/historicaldocuments/frus1964-68v05/d440). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1967-06.vietnam-tet]]. Check: Nguyen, 105, has the Politburo review the plan Oct. 20–24, Trường Chinh presiding, Lê Duẩn absent, and put off approving its general uprising.'
- edit:
    id: cal.1968-01.vietnam-tet
    base: 7555dee1
    set:
      n: '[[w.vietnam-victory-in-vietnam]], 214–15 (quoted, 214); [[w.nguyen-hanois-war]], 108 (the Politburo in December; the plenum). The warning in Washington''s hands: [FRUS 1964–68, VI, doc. 32](https://history.state.gov/historicaldocuments/frus1964-68v06/d32) (editorial note). Made public: the history''s Hanoi edition, 1988 (Check: an earlier printing). See [[cal.1967-06.vietnam-tet]]. Check: Nguyen, 108, puts the plenum outside the capital, in Hòa Bình province.'
- edit:
    id: cal.1968-01-30.vietnam
    base: f5db57c0
