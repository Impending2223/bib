    base: d0d7c8ef
    set:
      n: 'Statement by the President Following Hanoi''s Declaration of Readiness To Begin Discussions, [1968–69 Pub. Papers 492](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=570) (Apr. 3, 1968). FRUS 1964–68, VI, docs. [175](https://history.state.gov/historicaldocuments/frus1964-68v06/d175), [178](https://history.state.gov/historicaldocuments/frus1964-68v06/d178). [[w.cosmas-joint-chiefs-of-staff]], 176, 178; [[w.drea-mcnamara-clifford-and-the-2011]], 225; [[w.nguyen-hanois-war]], 117 (Hanoi''s announcement). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-vietnams-american-war]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-03-31.elections-1968]]. Names: Johnson.'
- edit:
    id: cal.1968-05-03.vietnam
    base: 69c5cb01
    set:
      n: 'The President''s News Conference, [1968–69 Pub. Papers 556](https://www.govinfo.gov/content/pkg/PPP-1968-book1/pdf/PPP-1968-book1.pdf#page=634) (May 3, 1968). FRUS 1964–68, VI, doc. [221](https://history.state.gov/historicaldocuments/frus1964-68v06/d221). [Johnson and Rostow, 1 a.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walt-rostow-may-3-1968), Conversation WH6805-01-13004 (Miller Center). [[w.nguyen-hanois-war]], 118 (Hanoi''s proposal of Paris). See [[cal.1968-03-31.elections-1968]]. Names: Rostow, Rusk, Clifford, Goldberg, Ball, Harriman, Vance, Johnson.'
- edit:
    id: cal.1968-05-13.vietnam
    base: 78b7ffaa
    set:
      n: 'FRUS 1964–68, VI, docs. [230](https://history.state.gov/historicaldocuments/frus1964-68v06/d230), [234](https://history.state.gov/historicaldocuments/frus1964-68v06/d234), [254](https://history.state.gov/historicaldocuments/frus1964-68v06/d254). [[w.cosmas-joint-chiefs-of-staff]], 182; [[w.nguyen-hanois-war]], 115, 121 (the first session; the delegations). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.goodman-lost-peace]]; [[w.thies-when-governments-collide]]; [[w.abramson-spanning-the-century]]; [[w.clifford-counsel-to-the-president-2]]; [[w.johnson-vantage-point]]; [[w.schandler-unmaking-of-a-president]]; [[w.asselin-vietnams-american-war]]. See [[cal.1968-05-03.vietnam]]. Names: Harriman, Vance, Xuân Thủy, Hà Văn Lâu.'
- edit:
    id: cal.1968-09-07.vietnam
    base: 2f231ecc
    set:
      n: 'FRUS 1964–68, VII, doc. [7](https://history.state.gov/historicaldocuments/frus1964-68v07/d7). [[w.nguyen-hanois-war]], 121–29 (Hanoi''s side of the private talks, to the halt), 122 (this meeting). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-05-13.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy. Check: Nguyen, 122, dates the meeting Sept. 8, by Hanoi''s record, and gives Thọ''s lecture "nearly an hour."'
- edit:
    id: cal.1968-09-15.vietnam-paris
    base: 5c36c774
    set:
      n: 'FRUS 1964–68, VII, doc. [14](https://history.state.gov/historicaldocuments/frus1964-68v07/d14). [[w.nguyen-hanois-war]], 122. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy.'
- edit:
    id: cal.1968-09-20.vietnam-paris
    base: 11446d1d
    set:
      c: 'Paris. Harriman and Vance with Lê Đức Thọ and Xuân Thủy in private, on Saigon''s place: an understanding on it "could be a major factor" in a decision to stop the bombing; Thọ: only "could be." Sept. 21, Harriman and Vance to Rusk: let them say "would be the major factor." Thọ and Thủy to the Politburo, Sept. 20, by Nguyen''s account: Washington will accept the NLF, or any party Hanoi names, on Hanoi''s side.'
      n: 'FRUS 1964–68, VII, docs. [24](https://history.state.gov/historicaldocuments/frus1964-68v07/d24), [26](https://history.state.gov/historicaldocuments/frus1964-68v07/d26), [27](https://history.state.gov/historicaldocuments/frus1964-68v07/d27). [[w.nguyen-hanois-war]], 122–23. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Harriman, Vance, Lê Đức Thọ, Xuân Thủy, Rusk.'
- edit:
    id: cal.1968-10-11.vietnam-paris
    base: 53774d78
    set:
      n: 'FRUS 1964–68, VII, doc. [58](https://history.state.gov/historicaldocuments/frus1964-68v07/d58). [[w.nguyen-hanois-war]], 124. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Lê Đức Thọ, Vance.'
- edit:
    id: cal.1968-10-27.vietnam-paris
    base: 227767d3
    set:
      n: 'FRUS 1964–68, VII, docs. [128](https://history.state.gov/historicaldocuments/frus1964-68v07/d128), [129](https://history.state.gov/historicaldocuments/frus1964-68v07/d129). [[w.nguyen-hanois-war]], 128. Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Vance, Rusk.'
- edit:
    id: cal.1968-11-02.vietnam
    base: bb742fcc
    set:
      n: 'FRUS 1964–68, VII, docs. [180](https://history.state.gov/historicaldocuments/frus1964-68v07/d180), [182](https://history.state.gov/historicaldocuments/frus1964-68v07/d182). [[w.nguyen-hanois-war]], 129 (Thiệu''s refusal). Made public: FRUS 1964–68, VII (2003). See [[cal.1968-09-07.vietnam]]. Names: Nguyễn Văn Thiệu, Bunker.'
- edit:
    id: cal.1968-12-03.vietnam
    base: 8f47fe03
    set:
      n: 'FRUS 1964–68, VII, docs. [244](https://history.state.gov/historicaldocuments/frus1964-68v07/d244), [248](https://history.state.gov/historicaldocuments/frus1964-68v07/d248). [[w.drea-mcnamara-clifford-and-the-2011]], 200; [[w.nguyen-hanois-war]], 129 (the dispute over the table). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.diem-in-the-jaws-of]]; [[w.clifford-counsel-to-the-president-2]]; [[w.abramson-spanning-the-century]]. See [[cal.1968-09-07.vietnam]]. Made public: FRUS 1964–68, VII (2003). Names: Clifford, Nguyễn Cao Kỳ, Phạm Đăng Lâm.'
- edit:
    id: cal.1969-01-15.vietnam
    base: 9b4dc8d9
    set:
      n: 'FRUS 1964–68, VII, doc. [282](https://history.state.gov/historicaldocuments/frus1964-68v07/d282). To check: [[w.herring-secret-diplomacy-of-the]]; [[w.asselin-bitter-peace]]; [[w.kimball-nixons-vietnam-war]]. See [[cal.1968-12-03.vietnam]]. Names: Vance, Hà Văn Lâu.'
- add:
    entry:
      id: cal.1961-10.vietnam
      when: Oct.
      date: 1961-10
      thread: vietnam
      c: 'COSVN''s first plenum, enlarged: the strategic hamlets a danger to the revolution in the South; a "continuous offensive," political and armed, "limited offensives and uprisings" toward a general offensive and general uprising. Hanoi declines to go so far.'
      n: '[[w.asselin-hanois-road-to-the]], 110–13; [[w.nguyen-hanois-war]], 60 (the conference, early October). Made public: an English translation, "Draft of COSVN Resolution 1," in the Douglas Pike Collection (Asselin, 111 n.139; Check when taken). Check: Nguyen, 60, has the conference reaffirm Hanoi''s directives in a ten-point mission.'
- add:
    entry:
      id: cal.1962-07-18.vietnam
      when: July 18
      date: '1962-07-18'
      thread: vietnam
      also:
      - laos
      c: 'Lê Duẩn to COSVN on the lesson of Laos: a struggle "in excess of the situation" would have brought other reactions from the imperialists; neutrality for the South a "method," to get the Americans out and a government in Saigon that would be "independent."'
      n: '[[w.asselin-hanois-road-to-the]], 134–36. Made public: the Party''s collected documents, *Văn kiện Đảng toàn tập*, by Asselin''s note (134 n.122; Check the volume and year). Names: Lê Duẩn.'
      tags:
      - name:le-duan
      - place:hanoi
- add:
    entry:
      id: cal.1962-07-19.vietnam
      when: July 19
      date: '1962-07-19'
      thread: vietnam
      c: 'The National Liberation Front proposes, in a public statement: a cease-fire; the American military out; a provisional government of national concord until elections under the Geneva accords; South Vietnam neutral, with Cambodia and Laos, under an international guarantee.'
      n: '[[w.asselin-hanois-road-to-the]], 136–37. See [[cal.1962-07-18.vietnam]]. Check: the statement''s text and where it was printed.'
- add:
    entry:
      id: cal.1963-05-12.china
      when: May 12
      date: '1963-05-12'
      thread: china
      also:
      - vietnam
      c: 'Hanoi. Liu Shaoqi, President of China, on a visit, against a negotiated settlement: the Vietnamese "cannot sleep and eat at ease for a single day so long as the Southern part is not liberated." Xuân Thủy Foreign Minister days before, in Ưng Văn Khiêm''s place.'
      n: 'Washington''s reading: [FRUS 1961–63, V, doc. 324](https://history.state.gov/historicaldocuments/frus1961-63v05/d324) (Ball to Paris, May 21), n.2 (Hong Kong''s summary of the speech, May 14). [[w.asselin-hanois-road-to-the]], 153–54 (all but the day). Names: Liu Shaoqi, Xuân Thủy.'
      tags:
      - name:liu-shao-chi
      - name:xuan-thuy
      - place:hanoi
- add:
    entry:
      id: cal.1964-03-27.vietnam
      when: Mar. 27–28
      date: '1964-03-27'
      thread: vietnam
      c: 'Hanoi. The Special Political Conference, called by the Party''s Secretariat: 320 delegates of the mass organizations, the minorities and the religions. Hồ Chí Minh''s report: the Front''s demands, the Americans out of the South; reunification by peaceful means. Air-defense units put on a war footing.'
      n: 'Hồ Chí Minh''s report, in his *Toàn tập* [Collected Works], vol. 11 (2000), 220–35, by Asselin''s note (187 n.96). Washington''s reading: State''s paper "Hanoi Conference Urges More Work, Ignores Ideology," Apr. 14, 1964 (Asselin, 186 n.92). [[w.asselin-hanois-road-to-the]], 186–88. See [[cal.1963-12.vietnam]]. Names: Hồ Chí Minh.'
      tags:
      - name:ho-chi-minh
      - place:hanoi
- add:
    entry:
      id: cal.1964-07-06.vietnam
      when: July 6
      date: '1964-07-06'
      thread: vietnam
      c: Hanoi puts its navy on a war footing, against the American destroyers' patrols in the Gulf of Tonkin. By the end of July all its armed forces on alert.
      n: '[[w.asselin-hanois-road-to-the]], 189–90. Check: the day, from Asselin alone.'
      tags:
      - place:hanoi
- add:
    entry:
      id: cal.1964-08-12.vietnam
      when: Aug. 12
      date: '1964-08-12'
      thread: vietnam
      c: Seaborn again with Phạm Văn Đồng in Hanoi, with Washington's message after the Gulf of Tonkin, all but its last two points; Đồng "very angry."
      n: '[FRUS 1964–68, I, doc. 304](https://history.state.gov/historicaldocuments/frus1964-68v01/d304) (the message, Aug. 8), n.5 (the meeting, from Seaborn''s report of Aug. 15). [[w.asselin-hanois-road-to-the]], 191. See [[cal.1964-06-18.vietnam]]. Names: Seaborn, Phạm Văn Đồng.'
      tags:
      - name:seaborn-j-blair
      - name:pham-van-dong
      - place:hanoi
- add:
    entry:
      id: cal.1964-10-11.vietnam
      when: Oct. 11
      date: '1964-10-11'
      thread: vietnam
      c: 'The Central Military Party Committee orders the forces in the South to prepare, with units from the North, a campaign of December to March: part of the enemy''s main forces destroyed, the strategic hamlets broken, the liberated areas widened along the Cambodian border and in the Central Highlands.'
      n: '[[w.asselin-hanois-road-to-the]], 204. See [[cal.1964-09.vietnam]].'
      tags:
      - place:hanoi
- add:
    entry:
      id: cal.1964-11-20.vietnam
      when: Nov. 20
      date: '1964-11-20'
      thread: vietnam
      c: The first regiments of the North Vietnamese army, the 18th, 95th and 101st of the 325th Division, begin the march south.
      n: '[[w.asselin-hanois-road-to-the]], 200; [[w.nguyen-hanois-war]], 65–66 (the regiments). See [[cal.1964-09.vietnam]]. Check: Asselin, 200, has prisoners questioned by the Control Commission say some units left in October.'
- add:
    entry:
      id: cal.1967-01.vietnam
      when: Jan.
      date: 1967-01
      thread: vietnam
      c: 'The Thirteenth Plenum. Resolution 13: the diplomatic struggle advanced beside the military; a "spontaneous uprising in order to win a decisive victory in the shortest possible time."'
      n: '[[w.nguyen-hanois-war]], 90. See [[cal.1965-12-27.vietnam-2]].'
- add:
    entry:
      id: cal.1967-07-27.vietnam
      when: July 27
      date: '1967-07-27'
      thread: vietnam
      c: 'Hanoi. The army''s security police arrest Hoàng Minh Chính, of the Institute of Philosophy, who had urged talks with the United States, with professors and journalists: the first arrests of the "Revisionist Anti-Party Affair."'
      n: '[[w.nguyen-hanois-war]], 88, 91, 102. Made public: a defector''s news conference, Apr. 17, 1969 (Nguyen, 92 n.26). Check: Nguyen gives July 27 (91) and July 25 (102).'
      tags:
      - place:hanoi
- add:
    entry:
      id: cal.1967-10.vietnam
      when: Oct.
      date: 1967-10
      thread: vietnam
      c: 'Hanoi. A second wave of arrests, from mid-October, after the Politburo''s session on the offensive: officers of Giáp''s General Staff among them, Nguyễn Văn Vịnh and Lê Trọng Nghĩa; Vũ Đình Huỳnh, once Hồ Chí Minh''s secretary.'
      n: '[[w.nguyen-hanois-war]], 91–92, 105. See [[cal.1967-07-27.vietnam]]. Names: Võ Nguyên Giáp, Hồ Chí Minh.'
      tags:
      - name:vo-nguyen-giap
      - name:ho-chi-minh
      - place:hanoi
- add:
    entry:
      id: cal.1967-12-25.vietnam
      when: Dec. 25
      date: '1967-12-25'
      thread: vietnam
      c: 'Hanoi. The third and largest wave of arrests: party members and others, Vũ Đình Huỳnh''s son Vũ Thư Hiên among them.'
      n: '[[w.nguyen-hanois-war]], 92, 106. See [[cal.1967-07-27.vietnam]].'
      tags:
      - place:hanoi
- add:
    entry:
      id: cal.1968-01-15.vietnam-tet
      when: Jan. 15
      date: '1968-01-15'
      thread: vietnam-tet
      c: 'The day for the general offensive set: the night of Jan. 30–31, the eve of Tet. The commands in the South given a little more than two weeks.'
      n: '[[w.nguyen-hanois-war]], 108. See [[cal.1968-01.vietnam-tet]].'
- add:
    entry:
      id: cal.1968-09-28.vietnam-paris
      when: Sept. 28
      date: '1968-09-28'
      thread: vietnam-paris
      c: 'Lê Đức Thọ and Xuân Thủy to Nguyễn Duy Trinh, a plan for the talks: no one of Thiệu''s government at the table, the NLF alone beside Hanoi; the private meetings kept up until the American election, the business left for a four-party conference.'
      n: '[[w.nguyen-hanois-war]], 123. Made public: Nguyen (2012), from the Foreign Ministry''s chronology for internal circulation (Hanoi, 1987). See [[cal.1968-09-07.vietnam]]. Names: Lê Đức Thọ, Xuân Thủy, Nguyễn Duy Trinh.'
      tags:
      - name:le-duc-tho
      - name:xuan-thuy
      - name:nguyen-duy-trinh
- add:
    entry:
      id: cal.1968-10-03.vietnam-paris
      when: Oct. 3
      date: '1968-10-03'
      thread: vietnam-paris
      c: 'The Politburo to Thọ and Thủy: Johnson will de-escalate whoever wins in November. A four-party conference agreed, if Saigon accepts the NLF as a party; the talks with the Americans to go on apart.'
      n: '[[w.nguyen-hanois-war]], 124. Made public: Nguyen (2012), from the Foreign Ministry''s chronology for internal circulation (Hanoi, 1987). See [[cal.1968-09-07.vietnam]]. Names: Lê Đức Thọ, Xuân Thủy.'
      tags:
      - name:le-duc-tho
      - name:xuan-thuy
      - place:hanoi
- add:
    entry:
      id: cal.1968-10-10.vietnam-paris
      when: Oct. 10
      date: '1968-10-10'
      thread: vietnam-paris
      c: 'The Politburo to COSVN, in secret: new demands for Paris. Saigon and Washington to agree to talk with the NLF before a four-party conference; a longer interval between the halt and the talks.'
      n: '[[w.nguyen-hanois-war]], 124–26. Made public: the Party''s collected documents, *Văn kiện Đảng toàn tập*, vol. 29, by Nguyen''s note (124 n.57; Check the year). See [[cal.1968-10-03.vietnam-paris]].'
      tags:
      - place:hanoi
- add:
    entry:
      id: cal.1968-10-17.china
      when: Oct. 17
      date: '1968-10-17'
      thread: china
      also:
      - vietnam-paris
      c: 'Beijing. Chen Yi to Lê Đức Thọ, on his way home from Paris: in taking four-party talks Hanoi has given Saigon "legal recognition" and accepted "the compromising and capitulationist proposals" of the Soviet revisionists; "there is nothing more to talk about."'
      n: '[[w.nguyen-hanois-war]], 126–27. Made public: [[w.77-conversations-between-chinese]], by Nguyen''s note (126 n.63). See [[cal.1968-10-10.vietnam-paris]]. Names: Chen Yi, Lê Đức Thọ.'
      tags:
      - name:chen-yi
      - name:le-duc-tho
- add:
    entry:
      id: cal.1968-10-20.vietnam-paris
      when: Oct. 20
      date: '1968-10-20'
      thread: vietnam-paris
      c: 'The Politburo, after Thọ''s report, drops the new demands: four-party talks to begin seven to ten days after the halt, before the American election, the delegation to seem in no hurry. Trinh to COSVN: the Politburo keeps the diplomacy and will write the NLF''s statement.'
      n: '[[w.nguyen-hanois-war]], 127. Made public: Trinh''s cable, *Văn kiện Đảng toàn tập*, vol. 29, by Nguyen''s note (127 n.66; Check the year). See [[cal.1968-10-10.vietnam-paris]]. Names: Lê Đức Thọ, Nguyễn Duy Trinh.'
      tags:
      - name:le-duc-tho
      - name:nguyen-duy-trinh
      - place:hanoi
- add:
    entry:
      id: cal.1969-01-01.vietnam-paris
      when: Jan. 1
      date: '1969-01-01'
      thread: vietnam-paris
      c: 'The Politburo to Thọ and Thủy: Nixon has no choice but to de-escalate. At the four-party talks the aim all American forces out of the South; the delegation to seem cooperative, not eager; the military struggle against Thiệu''s government still first.'
      n: '[[w.nguyen-hanois-war]], 130–31. Made public: Nguyen (2012), from the Foreign Ministry''s chronology for internal circulation (Hanoi, 1987). See [[cal.1968-12-03.vietnam]]. Names: Lê Đức Thọ, Xuân Thủy, Nixon, Nguyễn Văn Thiệu.'
      tags:
      - name:le-duc-tho
      - name:xuan-thuy
      - name:nixon-richard-m
      - name:nguyen-van-thieu
      - place:hanoi
