      c: 'Draft Rockefeller''s week-end appeal on television and in the papers: 260,000 pieces of mail at the convention within
        twenty-four hours; within fifty-six hours of the advertisements, more than a million letters and telegrams, some hotels
        still sorting them on the Wednesday.'
