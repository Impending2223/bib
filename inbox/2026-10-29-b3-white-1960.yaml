- add:
    entry:
      id: cal.1960-10-30.elections-1960-5
      when: Oct. 30–Nov. 4
      date: '1960-10-30'
      thread: elections-1960
      c: 'Kennedy''s last week but one, on some four hours'' sleep a night: the Philadelphia suburbs, Oct. 30–31; Los Angeles,
        Nov. 1; San Francisco and the Bay, Nov. 2; Phoenix, Albuquerque, Amarillo, Wichita Falls and Oklahoma City, Nov. 3;
        Virginia, Ohio and Chicago, Nov. 4. In New Mexico: "I would not accuse Mr. Nixon of being barefaced"; in Arizona,
        Goldwater''s "Confederate uniform."'
      n: 'Remarks of Senator John F. Kennedy, Levittown, PA, Shopping Center, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-levittown-pa-shopping-center);
        Speech of Senator John F. Kennedy, East Los Angeles College Stadium, Los Angeles, CA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-east-los-angeles-college-stadium-los-angeles-ca);
        Speech of Senator John F. Kennedy, Cow Palace, San Francisco, CA, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-cow-palace-san-francisco-ca);
        Remarks of Senator John F. Kennedy, Albuquerque, NM, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-albuquerque-nm);
        Remarks of Senator John F. Kennedy, Street Rally, Phoenix, AZ, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-street-rally-phoenix-az);
        Speech of Senator John F. Kennedy, Chicago Auditorium, Chicago, IL, [APP](https://www.presidency.ucsb.edu/documents/speech-senator-john-f-kennedy-chicago-auditorium-chicago-il).
        [[w.white-making-of-the-president]], 338 n.6 (the schedule), 326–27 (the taunts). See [[cal.1960-10-19.elections-1960-2]].
