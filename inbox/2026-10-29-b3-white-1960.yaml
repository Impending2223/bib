      c: Chicago, the Blackstone's Crystal Ballroom. The Republican platform committee, 103 members, two from each State,
        opens in public session, Percy in the chair. From July 20 its subcommittees hear witnesses plank by plank; that on
        national defense meets one morning and hears four.
