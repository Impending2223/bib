      c: 'Kennedy, free of the Senate, opens his campaign, by chartered jet from Friendship Airport, Baltimore, Friday afternoon:
        Presque Isle, Maine; Bangor, Maine; Portland, Maine; then Manchester, N.H. San Francisco by Saturday noon; Anchorage
        and Palmer, Alaska, Saturday night; then, after four hours'' sleep, to Detroit.'
      n: 'Remarks of Senator John F. Kennedy, Presque Isle, Maine, Airport Rally, [APP](https://www.presidency.ucsb.edu/documents/remarks-senator-john-f-kennedy-presque-isle-maine-airport-rally);
