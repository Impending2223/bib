      c: Los Angeles. Lawrence, Pennsylvania's governor, met at the airport the evening of July 9 by John Bailey, who drives
        him to the Biltmore pressing Kennedy's case. July 10, 11 a.m., Kennedy and Lawrence alone at the Biltmore for half
        an hour; late that night Lawrence to Stevenson at the Beverly Hills Hotel, two hours. No word from Lawrence.
