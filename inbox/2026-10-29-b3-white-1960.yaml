      date: '1960-11-09'
      thread: elections-1960
      c: 'Los Angeles, before Nixon wakes at 6:30. His command hears from Hugh Scott that Kennedy''s lead in Pennsylvania
        is past overtaking, and from Michigan that the State, by some 67,000, is Kennedy''s: Nixon cannot be elected.'
      n: '[[w.white-making-of-the-president]], 346. Names: Nixon, Scott, Kennedy.'
