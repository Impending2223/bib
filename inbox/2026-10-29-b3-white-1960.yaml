      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960
      c: 'Hyannis Port, just after three in the morning. Kennedy and his staff watch Nixon''s appearance on television. Salinger
        urges him to the Armory to match it; Kennedy: "Why should he concede? I wouldn''t." He will say nothing until Nixon
        speaks again, and goes to bed near four.'
      n: '[[w.white-making-of-the-president]], 24–25, 345. See [[cal.1960-11-09.elections-1960]]. Names: Kennedy, Salinger,
        Nixon.'
      tags:
      - name:kennedy-john-f
