      c: 'Chicago, Saturday evening. Morton, the national chairman, under pressure from Newport, R.I., has every plank drafted
        so far mimeographed and released: the full platform committee to decide whether to change them to the Fifth Avenue
        terms. Overnight the subcommittees'' planks on farm policy, education and defense are out.'
