      when: July 13
      date: '1960-07-13'
      thread: elections-1960
      c: 'Los Angeles, the day of the balloting. Stevenson, resolved to seek the nomination in earnest, tries all morning
        to reach Daley, who avoids him; at one he reaches Arvey, who finds Daley on the floor at four. Daley, by telephone:
        Stevenson has no support in Illinois''s delegation, not for want of a declared candidacy; nor had he in 1956, when
        Daley held the delegation for him.'
      n: '[[w.white-making-of-the-president]], 167. See [[cal.1960-07-12.elections-1960-6]]. Names: Stevenson, Daley.'
