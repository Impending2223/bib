      date: '1960-07-25'
      thread: republican-party
      also:
      - elections-1960
      - defense
      c: 'Chicago and Newport, R.I., overnight. After midnight Rockefeller''s team renews its threat of a floor fight on defense.
        Nixon''s aides and Newport by telephone through the night; Newport approves some sixty-seven words changed in the
        defense plank: "intensified" efforts, "submarine and ballistic" missiles, "any necessary increased expenditures to
        meet new situations." Rockefeller''s people accept the redraft Tuesday morning.'
      n: '[[w.white-making-of-the-president]], 205. See [[cal.1960-07-25.republican-party]]. Names: Rockefeller, Nixon.'
