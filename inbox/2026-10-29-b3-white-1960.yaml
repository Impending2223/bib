      c: Hyannis Port, 9:30 a.m. Sorensen, the first in, tells Kennedy in his bedroom that California is carried and he is
        President; Salinger after him. Kennedy will claim nothing until Nixon yields.
      n: '[[w.white-making-of-the-president]], 347. See [[cal.1960-11-09.transition-and-staff-2]]. Names: Sorensen, Kennedy,
        Salinger, Nixon. Check: White''s California; the State went to Nixon on the absentee ballots (cal.1960-11-16.elections-1960).'
