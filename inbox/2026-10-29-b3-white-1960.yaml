      when: July 12–13
      date: '1960-07-12'
      thread: elections-1960
      c: 'Los Angeles. Stevenson speaks to Minnesota''s caucus, at its asking, and does not summon it to follow him. In the
        afternoon he takes his seat with Illinois on the floor, to an eruption from floor and galleries. At one in the morning,
        in the Sheraton-West''s LaFayette Room, to some 250 delegates and alternates: "But I have promises to keep."'
      n: '[[w.white-making-of-the-president]], 163–64. See [[cal.1960-07-11.elections-1960]]. Names: Stevenson.'
