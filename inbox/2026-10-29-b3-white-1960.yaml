      when: Oct. 19–21
      date: '1960-10-19'
      thread: elections-1960
      c: 'New York, the Waldorf Towers. Nixon in the Presidential suite, out for the Al Smith dinner only; conferences with
        Herbert Hoover, Roy Howard, Dewey and other elders of the party. Klein opens a press conference in Peacock Alley:
        "I hear some doubts are growing up about Vice-President Nixon''s election, and I want to give you some figures."'
