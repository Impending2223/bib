      when: Oct. 1
      date: '1960-10-01'
      thread: elections-1960
      c: Hyannis Port, Kennedy's last day of rest, by White's account. Five hours with Robert and Joseph Kennedy, Sorensen,
        O'Donnell, O'Brien, Salinger, Harris, Bailey and Clifford, now in charge of the planning for after the election. The
        first debate has cancelled Nixon's edge of experience; an Eisenhower rescue to be expected, and ignored; the Republican
        label to be fixed on Nixon, heir to McKinley, Harding, Hoover, Landon and Dewey. The last three weeks to the Northeast
        and its suburbs; California two days; Oklahoma added.
      n: '[[w.white-making-of-the-president]], 320–21, 326 (the day of rest). See [[cal.1960-09-26.elections-1960]]. Names:
        Kennedy, Robert Kennedy, Joseph Kennedy, Sorensen, O''Donnell, O''Brien, Salinger, Harris, Clifford, Nixon, Eisenhower.'
