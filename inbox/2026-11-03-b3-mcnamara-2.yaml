  - cite:
      id: cal.1963-10-05.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.41 (Kennedy approves the report''s section on coup planning: "no initiative should be taken to encourage actively a change in government"; instructions by the CIA''s channels)'
      units: 'A'
  - src:
      id: cal.1963-10-05.vietnam-2
      rows:
        - 'via x.1963-10-05.forrestal-memorandum-of-conversation-oct-5: A'
  - cite:
