  # === Ch. 3: Aug. 24-Nov. 22, 1963 ===
  - cite:
      id: cal.1963-08-24.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.2–4 (Hilsman''s draft, Harriman''s approval, Forrestal''s message to Hyannis Port; Ball reached on the golf course; Rusk in New York, Helms for the CIA, Gilpatric at home; the cable out Saturday night)'
      units: 'A-D'
  - src:
