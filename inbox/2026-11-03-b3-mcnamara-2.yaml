  - add:
      entry:
        id: cal.1963-09-16.vietnam
        when: Sept. 16
        date: '1963-09-16'
        thread: vietnam
        c: 'The State Department: Rusk, McNamara, McCone and others with two CIA officers back from Saigon on the generals'' plotting: "The substance which they all lack is a comprehensive follow-on plan." McNamara proposes a conciliatory cable to Lodge asking his views; Rusk has one drafted for the President.'
        n: '[Memorandum for the record of a meeting, Sept. 16, 1963, FRUS 1961–63, IV, doc. 113](https://history.state.gov/historicaldocuments/frus1961-63v04/d113) (the officers'' words). [[w.mcnamara-in-retrospect]], ch. 3 at n.22. See [[cal.1963-08-24.vietnam]]. Names: Rusk, McNamara, McCone, Lodge.'
        tags: [name:rusk-dean, name:mcnamara-robert-s, name:mccone-john-a, name:lodge-henry-cabot]
  - cite:
      id: cal.1963-09-17.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.23 (the "conciliatory" cable, CAP 63516, after Kennedy met his closest advisers; McNamara and Taylor to go)'
      units: 'A, C'
  - src:
      id: cal.1963-09-17.vietnam
      rows:
        - 'via x.1963-09-17.kennedy-to-lodge-sept-17-1963: A, C'
  - add:
      entry:
        id: cal.1963-09-17.vietnam-2
        when: Sept. 17
        date: '1963-09-17'
        thread: vietnam
        c: 'Harriman to Forrestal by telephone, before the cable to Lodge goes: he and Hilsman "very much disappointed with draft"; the proposed visit "a disaster," sending "two men opposed to our policy, plus one who wouldn''t stand up." Forrestal agrees.'
        n: '[Memorandum of a telephone conversation, Harriman and Forrestal, Sept. 17, 1963, FRUS 1961–63, IV, doc. 124](https://history.state.gov/historicaldocuments/frus1961-63v04/d124). [[w.mcnamara-in-retrospect]], ch. 3 at n.24 (the two men McNamara and Taylor, the one U. Alexis Johnson). See [[cal.1963-09-17.vietnam]]. Names: Harriman, Forrestal, Hilsman.'
        tags: [name:harriman-w-averell, name:forrestal-michael-v, name:hilsman-roger]
  - add:
      entry:
        id: cal.1963-09-18.vietnam-2
        when: Sept. 18
        date: '1963-09-18'
        thread: vietnam
        c: 'Lodge to the President, Embtel 536: against the McNamara–Taylor visit. Diệm would take it to mean "forgive and forget"; it "would certainly put a wet blanket on those working for a change of government."'
        n: '[Embtel 536, Lodge to the President, Sept. 18, 1963, FRUS 1961–63, IV, doc. 126](https://history.state.gov/historicaldocuments/frus1961-63v04/d126) (the words). [[w.mcnamara-in-retrospect]], ch. 3 at n.25. See [[cal.1963-09-17.vietnam]]. Names: Lodge, Kennedy, McNamara, Taylor, Ngô Đình Diệm.'
        tags: [name:lodge-henry-cabot, name:kennedy-john-f, name:mcnamara-robert-s, name:taylor-maxwell, name:ngo-dinh-diem]
  - add:
      entry:
        id: cal.1963-09-18.vietnam-3
        when: Sept. 18
        date: '1963-09-18'
        thread: vietnam
        c: 'McNamara proposes meeting Lodge and Harkins in Hawaii instead; Kennedy will have him see it on the spot. Kennedy to Lodge, the afternoon: "my need for this visit is very great indeed"; McNamara "will want to speak some hard truths" to Diệm.'
        n: '[Deptel 431, the President to Lodge, Sept. 18, 1963, FRUS 1961–63, IV, doc. 128](https://history.state.gov/historicaldocuments/frus1961-63v04/d128) (Kennedy''s words). [[w.mcnamara-in-retrospect]], ch. 3 at n.26 (McNamara''s proposal; Bundy to Rusk: "the President thinks you have to look at it to see it"). See [[cal.1963-09-18.vietnam-2]]. Names: McNamara, Lodge, Harkins, Kennedy, Ngô Đình Diệm.'
        tags: [name:mcnamara-robert-s, name:lodge-henry-cabot, name:harkins-paul-d, name:kennedy-john-f, name:ngo-dinh-diem]
  - cite:
      id: cal.1963-09-21.vietnam
