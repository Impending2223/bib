        date: '1964-01-22'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-46-64: to ensure victory "the United States must be prepared to put aside many of the self-imposed restrictions which now limit our efforts." Air attacks on the North; American combat forces in the war, South and North.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at nn.14–16 (the words; the proposals; McNamara and Rusk brief the President, who asks the Chiefs for specific proposals). To check: JCSM-46-64, Jan. 22, 1964, [[w.pentagon-papers]], III, 496–499 (cited by [[w.mcnamara-in-retrospect]], ch. 4 n.14). See [[cal.1963-11-26.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1964-02-17.vietnam-congress
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.18 (Sheppard''s question; McNamara: "The kind of war now going on in Vietnam can be won only by the Vietnamese people themselves")'
      units: 'A, D'
  - add:
      entry:
        id: cal.1964-02-21.vietnam-3
        when: Feb. 21
        date: '1964-02-21'
        thread: vietnam
        c: 'Johnson to Lodge, Deptel 1281: "Secretaries Rusk and McNamara, with my approval, have already begun preparing specific plans for pressure against North Vietnam, both in the diplomatic and military fields." McNamara to Saigon early in March; then "we should make definite decisions."'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at n.19. To check: Deptel 1281, President to Lodge, Feb. 21, 1964, FRUS 1964–68, I, 96 (cited by [[w.mcnamara-in-retrospect]], ch. 4 n.19). See [[cal.1963-11-26.vietnam]]. Names: Johnson, Lodge, Rusk, McNamara.'
        tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:rusk-dean, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-02-21.vietnam-4
        when: Feb. 21
        date: '1964-02-21'
        thread: vietnam
        c: 'McNamara to Taylor: the Chiefs to examine actions against North Vietnam "with a view to inducing that government to terminate its support and encouragement of the insurrection in South Vietnam" and curtail the Pathet Lao.'
        n: '[McNamara to Taylor, Feb. 21, 1964, FRUS 1964–68, I, doc. 57](https://history.state.gov/historicaldocuments/frus1964-68v01/d57). [[w.mcnamara-in-retrospect]], ch. 4 at n.20. See [[cal.1964-02-21.vietnam-3]]. Names: McNamara, Taylor.'
        tags: [name:mcnamara-robert-s, name:taylor-maxwell]
  - add:
      entry:
        id: cal.1964-03-02.vietnam-3
        when: Mar. 2
        date: '1964-03-02'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-174-64, the actions against the North asked Feb. 21: air attacks first on the Ho Chi Minh Trail and on military and industrial targets in North Vietnam. Chinese ground units in North Vietnam in significant numbers "unlikely."'
        n: '[JCSM-174-64, FRUS 1964–68, I, doc. 66](https://history.state.gov/historicaldocuments/frus1964-68v01/d66) (the answer to McNamara''s of Feb. 21; Chinese ground units "unlikely"). [[w.mcnamara-in-retrospect]], ch. 4 at nn.16–17 (the priorities). See [[cal.1964-02-21.vietnam-4]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-03.vietnam-2
        when: Mar.
        date: 1964-03
        thread: vietnam
        c: 'Johnson to McNamara and Taylor before they leave for Saigon: "Bob, I want to see about a thousand pictures of you with General Khanh, smiling and waving your arms and showing the people out there that this country is behind Khanh the whole way."'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at nn.21–22. Check: the day, before the departure of Mar. 8 ([[cal.1964-03-08.vietnam]]). Names: Johnson, McNamara, Taylor, Nguyễn Khánh.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:taylor-maxwell, name:nguyen-khanh]
  - cite:
      id: cal.1964-03-08.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at nn.21–22 (several days in mid-March, from the Mekong Delta to Huế, beside Khánh before crowds)'
      units: 'A-B'
  - add:
      entry:
        id: cal.1964-03-09.vietnam
        when: Mar. 9
        date: '1964-03-09'
        thread: vietnam
        c: 'McNamara to the press at Hickam, refueling for Saigon: the situation serious; "We have had three governments in three months"; the Viet Cong''s attacks, terror and harassment greatly increased.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at n.22. To check: remarks to the press, Hickam Air Force Base, Mar. 9, 1964, *Public Statements of Robert S. McNamara*, 1964, III, 970 (cited by [[w.mcnamara-in-retrospect]], ch. 4 n.22). Check: the day; the note dates the remarks Mar. 9, the text puts them on the way out, before the visit of [[cal.1964-03-08.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1964-03-16.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.24 (the government weakened since the coup; Khánh''s appeal neither wide nor deep; withdrawal and neutralization rejected)'
      units: 'B'
  - src:
      id: cal.1964-03-16.vietnam
      rows:
        - 'via x.1964-03-13.draft-memo-secdef-to-pres-south: B'
  - cite:
      id: cal.1964-03-26.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at nn.27–28 (at the President''s request; "the situation in South Vietnam has unquestionably worsened"; "the road ahead in Vietnam is going to be long, difficult and frustrating"; Peiping''s stake: Vietnam "a test case")'
      units: 'A'
  - src:
      id: cal.1964-03-26.vietnam
      rows:
        - 'via x.1964-03-26.mcnamara-speech-james-forrestal-memorial-awards: A'
  - cite:
      id: cal.1964-03-25.latin-america
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.27 (Vietnam in the speech: "it seems to me that we have no choice but to support the South Vietnamese Government and Army by the most effective means available")'
      units: 'A'
  - add:
      entry:
        id: cal.1964-03-29.vietnam
        when: Mar. 29
        date: '1964-03-29'
        thread: vietnam
        also: [press-and-broadcasting]
        c: 'McNamara to Peter Hackes of NBC, in his office: among the options reported to the President, "the initiation of military action outside of South Vietnam, particularly against North Vietnam"; any such course "a supplement to and not a substitute for progress within South Vietnam itself."'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at n.29. To check: interview with Peter Hackes, NBC-TV Sunday Show, Mar. 29, 1964 (cited by [[w.mcnamara-in-retrospect]], ch. 4 n.29). See [[cal.1964-03-16.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-04-24.vietnam
        when: Apr. 24
        date: '1964-04-24'
        thread: vietnam
        c: 'McNamara''s news conference at the Pentagon, asked of Morse''s "McNamara''s War": "This is a war of the United States Government....I don''t object to its being called McNamara''s War. I think it is a very important war and I am pleased to be identified with it and do whatever I can to win it."'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at n.32. To check: news conference, the Pentagon, Apr. 24, 1964, *Public Statements of Robert S. McNamara*, 1964, III, 1210 (cited by [[w.mcnamara-in-retrospect]], ch. 4 n.32). Names: McNamara, Morse.'
        tags: [name:mcnamara-robert-s, name:morse-wayne]
  - add:
      entry:
        id: cal.1964-05-04.vietnam
        when: May 4
        date: '1964-05-04'
        thread: vietnam
        c: 'Khánh with Lodge: Hanoi to be warned that further interference will bring reprisals; would the United States bomb North Vietnam? Johnson has McNamara stop in Saigon on his way back from Bonn.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at n.30. Check: the record of the meeting; Lodge''s report not found in the daybook under May 4. See [[cal.1964-03-16.vietnam]]. Names: Nguyễn Khánh, Lodge, Johnson, McNamara.'
        tags: [name:nguyen-khanh, name:lodge-henry-cabot, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-05-13.vietnam
        when: May 13
        date: '1964-05-13'
        thread: vietnam
        c: 'Saigon. McNamara and Taylor with Khánh, Lodge and Harkins. Khánh: the covert 34A raids ineffective; his weakness in the South a reason to strike the North at once. Before McNamara leaves, Khánh wants no strikes now. Lodge: strike quickly; after another coup "the US should be prepared to run the country, possibly from Cam Ranh Bay."'
        n: '[Lodge, Embtel 2203, May 14, 1964, FRUS 1964–68, I, doc. 153](https://history.state.gov/historicaldocuments/frus1964-68v01/d153); [McNamara, notes for a report to the President, May 14, FRUS 1964–68, I, doc. 154](https://history.state.gov/historicaldocuments/frus1964-68v01/d154) (Cam Ranh Bay). [[w.mcnamara-in-retrospect]], ch. 4 at nn.30–31. See [[cal.1964-05-04.vietnam]]. Names: McNamara, Taylor, Nguyễn Khánh, Lodge, Harkins.'
        tags: [name:mcnamara-robert-s, name:taylor-maxwell, name:nguyen-khanh, name:lodge-henry-cabot, name:harkins-paul-d, place:saigon]
  - add:
      entry:
        id: cal.1964-05-15.vietnam-3
        when: May 15
        date: '1964-05-15'
        thread: vietnam
        c: 'The CIA''s Directorate of Intelligence to the President, Rusk, Bundy and McNamara: the situation "extremely fragile"; no sign the trends are "bottoming out"; if the "tide of deterioration" is not arrested by the end of the year, the anti-Communist position "likely to become untenable."'
        n: '[CIA memorandum, May 15, 1964, FRUS 1964–68, I, doc. 159](https://history.state.gov/historicaldocuments/frus1964-68v01/d159). [[w.mcnamara-in-retrospect]], ch. 4 at n.33. See [[cal.1964-05-13.vietnam]]. Names: Johnson, Rusk, Bundy, McNamara.'
        tags: [name:johnson-lyndon-b, name:rusk-dean, name:bundy-mcgeorge, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-05-19.vietnam
        when: May 19
        date: '1964-05-19'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-426-64: OPLAN 34A has done little, but "the potential of this total program remains high"; continue it through June, July and August. The four months'' extension authorized days later.'
        n: '[JCSM-426-64, FRUS 1964–68, I, doc. 161](https://history.state.gov/historicaldocuments/frus1964-68v01/d161). [[w.mcnamara-in-retrospect]], ch. 4 at n.34 (the extension beyond May 31). Check: the day of the extension. See [[cal.1963-12-21.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1964-05-24.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.35 (Ball''s group''s draft, "use all measures, including the commitment of armed forces"; the NSC without the President; McNamara: go forward with the resolution if combat forces are to be used within two or three months; Taylor, the military would wait for the fall)'
      units: 'A, D-E'
  - src:
      id: cal.1964-05-24.vietnam
      rows:
        - 'via x.1964-05-24.summary-record-of-nsc-meeting-may: A, D-E'
  - add:
      entry:
        id: cal.1964-05-25.vietnam
        when: May 25
        date: '1964-05-25'
        thread: vietnam
        c: 'SNIE 50-2-64, "Probable Consequences of Certain US Actions with Respect to Vietnam and Laos": a reasonable chance that graduated pressures would lead Hanoi to reduce the insurgency; it might hold on.'
        n: '[SNIE 50-2-64, FRUS 1964–68, I, doc. 174](https://history.state.gov/historicaldocuments/frus1964-68v01/d174) (the title). [[w.mcnamara-in-retrospect]], ch. 4 at n.36 (the judgment). See [[cal.1964-05-24.vietnam]].'
  - add:
      entry:
        id: cal.1964-05-26.vietnam-2
        when: May 26
        date: '1964-05-26'
        thread: vietnam
        c: 'The advisers with Johnson on the plan of graduated action: no conclusion. He sends them to Honolulu to talk it over with Lodge, Westmoreland and Sharp.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4 at nn.35–36. Check: the record of the meeting. See [[cal.1964-05-24.vietnam]]. Names: Johnson, Lodge, Westmoreland, Sharp.'
        tags: [name:johnson-lyndon-b, name:lodge-henry-cabot, name:westmoreland-william, name:sharp-u-s-grant]
  - cite:
      id: cal.1964-06-01.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.37 (CINCPAC''s map room; all gloomy but Lodge; the action plan: a resolution, word to Hanoi, graduated pressures, limited air attacks; the resolution put off to September, after the civil rights bill)'
      units: 'A-C'
  - add:
      entry:
        id: cal.1964-06-02.vietnam
        when: June 2
        date: '1964-06-02'
        thread: vietnam
        c: 'The Joint Chiefs, less the chairman, to McNamara, JCSM-471-64: "their first obligation to define a militarily valid objective for Southeast Asia." Two courses: break the North''s will and capability, or the lesser, end its support of the insurgency. No plan for either.'
        n: '[JCSM-471-64, FRUS 1964–68, I, doc. 191](https://history.state.gov/historicaldocuments/frus1964-68v01/d191). [[w.mcnamara-in-retrospect]], ch. 4 at n.38 (the two courses; no plan). See [[cal.1964-06-01.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-06-05.vietnam-3
        when: June 5
        date: '1964-06-05'
        thread: vietnam
        c: 'Taylor to McNamara, CM-1451-64, on the Chiefs'' memorandum: the two alternatives not "an accurate or complete expression of our choices"; the preferred course raises the risk of escalation.'
        n: '[CM-1451-64, FRUS 1964–68, I, doc. 199](https://history.state.gov/historicaldocuments/frus1964-68v01/d199). [[w.mcnamara-in-retrospect]], ch. 4 at n.39. See [[cal.1964-06-02.vietnam]]. Names: Taylor, McNamara.'
        tags: [name:taylor-maxwell, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-06-09.vietnam
        when: June 9
        date: '1964-06-09'
        thread: vietnam
        c: 'The Board of National Estimates to McCone, on the President''s question of the dominoes: the loss of South Vietnam and Laos "profoundly damaging to the US position in the Far East"; Peking would advertise it as proof "that the US is a paper tiger."'
        n: '[Board of National Estimates to McCone, June 9, 1964, FRUS 1964–68, I, doc. 209](https://history.state.gov/historicaldocuments/frus1964-68v01/d209) (the paper tiger). [[w.mcnamara-in-retrospect]], ch. 4 at n.40. See [[cal.1964-06-01.vietnam]]. Names: McCone, Johnson.'
        tags: [name:mccone-john-a, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1964-06.vietnam-2
        when: June
        date: 1964-06
        thread: vietnam
        c: 'For Lodge''s successor in Saigon, McGeorge Bundy, Robert Kennedy and McNamara volunteer, by McNamara''s account. Johnson chooses Taylor.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4. Check: the days. See [[cal.1964-06-23.vietnam]]. Names: Bundy, Robert Kennedy, McNamara, Johnson, Taylor.'
        tags: [name:bundy-mcgeorge, name:kennedy-robert-f, name:mcnamara-robert-s, name:johnson-lyndon-b, name:taylor-maxwell]
  - cite:
      id: cal.1964-06-23.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 (Lodge resigns for the Republican campaign; Taylor and Alex Johnson; Westmoreland for Harkins)'
      units: 'A-B, D'
  - add:
      entry:
        id: cal.1964-07.elections-1964-4
        when: July
        date: 1964-07
        thread: elections-1964
        c: 'Johnson asks McNamara to be his running mate; McNamara says no, by McNamara''s account.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4. Check: the day: "shortly after" Johnson chose Taylor for Saigon. Names: Johnson, McNamara.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-08-01.transition-and-staff
        when: Aug. 1
        date: '1964-08-01'
        thread: transition-and-staff
        c: 'Johnson: McNamara to be his "number one executive vice president in charge of the Cabinet" in his next term.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4. Check: to whom Johnson said it, and where. Names: Johnson, McNamara.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s]
