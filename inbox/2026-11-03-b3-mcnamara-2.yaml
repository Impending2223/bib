  - add:
      entry:
        id: cal.1963-10-25.vietnam-3
        when: Oct. 25
        date: '1963-10-25'
        thread: vietnam
        c: 'Bundy to Lodge, for the President: not to be in the position of thwarting a coup, but "we would like to have option of judging and warning on any plan with poor prospects of success."'
        n: '[McGeorge Bundy to Lodge, Oct. 25, 1963, FRUS 1961–63, IV, doc. 217](https://history.state.gov/historicaldocuments/frus1961-63v04/d217). [[w.mcnamara-in-retrospect]], ch. 3 at n.42. See [[cal.1963-10-25.vietnam-2]]. Names: Bundy, Lodge.'
        tags: [name:bundy-mcgeorge, name:lodge-henry-cabot]
  - cite:
      id: cal.1963-10-29.robert-kennedy
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.43 (McNamara asks who in Saigon heads the coup planning; Taylor and McCone against a coup, McCone''s pitcher "in the box"; Rusk: with Diệm the war would deteriorate)'
      units: 'A-C'
  - src:
      id: cal.1963-10-29.robert-kennedy
      rows:
        - 'via x.1963-10-29.memorandum-of-conference-with-the-president: A-C'
  - add:
      entry:
        id: cal.1963-10-29.vietnam
        when: Oct. 29
        date: '1963-10-29'
        thread: vietnam
        c: 'Meeting with the President, 6 p.m., on the generals'' plot. Kennedy: "the burden of proof should be on the coup promoters" to show they can overthrow Diệm''s government quickly.'
        n: '[Memorandum of a conference with President Kennedy, Oct. 29, 1963, 6 p.m., FRUS 1961–63, IV, doc. 235](https://history.state.gov/historicaldocuments/frus1961-63v04/d235). [[w.mcnamara-in-retrospect]], ch. 3 at n.44. See [[cal.1963-10-29.robert-kennedy]]. Names: Kennedy, Ngô Đình Diệm.'
        tags: [name:kennedy-john-f, name:ngo-dinh-diem]
  - add:
      entry:
        id: cal.1963-10-29.vietnam-2
        when: Oct. 29
        date: '1963-10-29'
        thread: vietnam
        c: 'Bundy to Lodge, after the 6 p.m. meeting: discuss the messages on the plot with Harkins, "whose responsibilities toward any coup are very heavy"; the combined assessment of Lodge, Harkins and the station asked urgently.'
        n: '[McGeorge Bundy to Lodge, Oct. 29, 1963, FRUS 1961–63, IV, doc. 236](https://history.state.gov/historicaldocuments/frus1961-63v04/d236). [[w.mcnamara-in-retrospect]], ch. 3 at n.44. See [[cal.1963-10-29.vietnam]]. Names: Bundy, Lodge, Harkins.'
        tags: [name:bundy-mcgeorge, name:lodge-henry-cabot, name:harkins-paul-d]
  - cite:
      id: cal.1963-10-30.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.45 (and Harkins to Taylor, MACV 2028: not "to change horses too quickly")'
      units: 'A'
  - cite:
      id: cal.1963-10-30.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.45'
      units: 'A-B'
  - cite:
      id: cal.1963-11-01.vietnam-saigon
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.46 (Embtel 841; Lodge: "Tell us what you want and we''ll do it")'
      units: 'A, F'
  - src:
      id: cal.1963-11-01.vietnam-saigon
      rows:
        - 'via x.1963-11-01.lodge-to-depstate-nov-1-1963: A, F'
  - add:
      entry:
        id: cal.1963-11-01.vietnam-2
        when: Nov. 1
        date: '1963-11-01'
        thread: vietnam
        c: 'The White House: Kennedy with his advisers on Saigon. Lodge''s cable 841, on Diệm''s message to Kennedy, reaches the State Department at 9:18 a.m. and the White House at 9:37 a.m., the coup begun.'
        n: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.46–47. Check: the meeting''s hour and those present; no record of it found in FRUS. See [[cal.1963-11-01.vietnam]]. Names: Kennedy, Lodge, Ngô Đình Diệm.'
        tags: [name:kennedy-john-f, name:lodge-henry-cabot, name:ngo-dinh-diem]
  - cite:
      id: cal.1963-11-02.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.47–50 (9:30 a.m.; Forrestal''s flash: the brothers "suicide"; Kennedy "literally blanched")'
      units: 'A-B'
  - add:
      entry:
        id: cal.1963-11-04.vietnam-2
        when: Nov. 4
        date: '1963-11-04'
        thread: vietnam
        c: 'Lodge, Embtel 917: "some divergence between ourselves and yourselves on significance and merit of the coup"; the coup "a remarkably able performance"; experts once for "win with Diem" now say the war "can be drastically shortened."'
        n: '[Embtel 917, Lodge to Rusk, Nov. 4, 1963, FRUS 1961–63, IV, doc. 291](https://history.state.gov/historicaldocuments/frus1961-63v04/d291). [[w.mcnamara-in-retrospect]], ch. 3 at n.52. See [[cal.1963-11-01.vietnam]]. Names: Lodge.'
        tags: [name:lodge-henry-cabot]
  - cite:
      id: cal.1963-11-14.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.54'
      units: 'A-C, F'
  - src:
      id: cal.1963-11-14.vietnam-force-levels
      rows:
        - 'via x.1963-11-14.the-presidents-news-conference-of-nov: A-C, F'
  - cite:
      id: cal.1963-11-20.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.52–53 (McNamara in the chair; Bundy afterward: "The briefings of McNamara tend to be sessions where people try to fool him, and he tries to convince them they cannot")'
      units: 'A-C'
  - add:
      entry:
        id: cal.1963-11-22.assassination-5
        when: Nov. 22
        date: '1963-11-22'
        thread: assassination
        c: 'The Pentagon. McNamara with Bundy, Gordon and Wiesner on the defense budget for January. About 2 p.m., Robert Kennedy by telephone: the President shot; some forty-five minutes later, dead. Robert Kennedy asks McNamara and Taylor to meet the plane at Andrews.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4. See [[cal.1963-11-22.assassination]]. Names: McNamara, Bundy, Gordon, Wiesner, Robert Kennedy, Taylor.'
        tags: [name:mcnamara-robert-s, name:bundy-mcgeorge, name:gordon-kermit, name:wiesner-jerome-b, name:kennedy-robert-f, name:taylor-maxwell]
  - add:
      entry:
        id: cal.1963-11-22.defense
        when: Nov. 22
        date: '1963-11-22'
        thread: defense
        c: 'McNamara and the Joint Chiefs put American forces worldwide on alert after the President''s death.'
        n: '[[w.mcnamara-in-retrospect]], ch. 4. Check: the hour and the level of alert. See [[cal.1963-11-22.assassination-5]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  # === Ch. 4: Nov. 23, 1963-July 29, 1964 ===
  - cite:
      id: cal.1963-11-23.robert-kennedy-2
      item: '[[w.mcnamara-in-retrospect]], ch. 4 (the disagreement over the burial; McNamara: he was President of the fifty States; the site below the Custis-Lee Mansion chosen on a gray, rainy morning; Mrs. Kennedy approves it in the late afternoon)'
      units: 'A-B'
  - check:
      id: cal.1963-11-23.robert-kennedy-2
      text: 'Check: McNamara has himself argue for Washington, walk the cemetery with the superintendent in the morning and choose the spot, and Mrs. Kennedy approve it with him in the late afternoon (ch. 4).'
  - cite:
      id: cal.1963-11-24.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 4 at n.4 (Sunday afternoon, the Vice President''s office in the Executive Office Building)'
      units: 'A'
  - src:
