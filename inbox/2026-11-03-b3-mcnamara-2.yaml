  - cite:
      id: cal.1965-06-05.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.29–30 (Rusk''s office, Saturday afternoon, on Taylor''s telegram; Johnson, Lady Bird away; "The great danger is we''ll pick up a very big problem any day")'
      units: 'A-B, G'
  - check:
      id: cal.1965-06-05.vietnam
      text: 'Check: McNamara gives "We''re looking for no more than a stalemate in the South" as his own words, Rusk having "tried to be hopeful" (ch. 7 at nn.29–30); the meeting in Rusk''s office, Thompson there.'
  - src:
