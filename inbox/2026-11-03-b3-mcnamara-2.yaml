      units: 'A'
  - cite:
      id: cal.1965-03-02.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.8 ("over 100 aircraft" against an ammunition depot; no announcement)'
      units: 'A, C'
  - add:
      entry:
        id: cal.1965-03-06.vietnam-3
        when: Mar. 6
        date: '1965-03-06'
        thread: vietnam
        c: 'McGeorge Bundy to Johnson on his talk with Rusk and McNamara the night before: two of the three think the chances of a turnaround in the South "less than even"; Rusk and McNamara want to show readiness to talk, "always on our own terms"; McNamara "goes a lot further," for real talks in an international meeting.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.18. To check: McGeorge Bundy to the President, Mar. 6, 1965, Memos to the President, vol. 9, Aides Files, McGeorge Bundy, box 3, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.18). See [[cal.1965-02-07.vietnam-2]]. Names: Bundy, Johnson, Rusk, McNamara.'
        tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:rusk-dean, name:mcnamara-robert-s]
  - cite:
      id: cal.1965-03-15.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.13'
      units: 'A-B'
  - add:
      entry:
        id: cal.1965-03.voting-rights-selma
        when: Mar.
        date: 1965-03
        thread: voting-rights-selma
        c: 'McNamara urges Johnson to federalize the Alabama National Guard after Wallace refuses the marchers the State''s protection. Johnson refuses: "That''s what''s wrong with you, Bob. You just don''t understand politics"; violence would turn Alabamians against Wallace. He gives in, by McNamara''s account.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.13–14. Check: the day, between Judge Johnson''s order of Mar. 17 ([[cal.1965-03-17.alabama]]) and the federalization. Names: McNamara, Johnson, Wallace.'
        tags: [name:mcnamara-robert-s, name:johnson-lyndon-b, name:wallace-george-c, state:al]
  - add:
      entry:
        id: cal.1965-03-17.vietnam-force-levels
        when: Mar. 17
        date: '1965-03-17'
        thread: vietnam-force-levels
        c: 'Westmoreland asks another Marine battalion for base security at Đà Nẵng.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.14. Check: the cable. See [[cal.1965-02-22.vietnam]]. Names: Westmoreland.'
        tags: [name:westmoreland-william, place:da-nang]
  - add:
      entry:
        id: cal.1965-03-19.vietnam-force-levels-2
        when: Mar. 19
        date: '1965-03-19'
        thread: vietnam-force-levels
        c: 'Sharp, CINCPAC 192207Z, asks still another Marine battalion.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.14. To check: CINCPAC 192207Z, as cited in [[w.pentagon-papers]], III, 406 (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.14). See [[cal.1965-03-17.vietnam-force-levels]]. Names: Sharp.'
        tags: [name:sharp-u-s-grant]
  - add:
      entry:
        id: cal.1965-03-20.vietnam-force-levels
        when: Mar. 20
        date: '1965-03-20'
        thread: vietnam-force-levels
        c: 'The Joint Chiefs, JCSM-204-65: a Marine division to the northern provinces and an Army division to the central highlands, for offensive operations.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.14. To check: JCSM-204-65, as cited in [[w.pentagon-papers]], III, 406 (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.14). See [[cal.1965-03-17.vietnam-force-levels]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1965-04-01.vietnam-force-levels-2
        when: Apr. 1
        date: '1965-04-01'
        thread: vietnam-force-levels
        c: 'The White House: Rusk, McGeorge Bundy and McNamara question the Chiefs'' two divisions. Johnson defers them; approves the two battalions Westmoreland and Sharp asked and the change of the Marines'' mission from base security to active combat.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.15. To check: McGeorge Bundy, notes of the meeting of Apr. 1, 1965, Papers of McGeorge Bundy, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.15). See [[cal.1965-03-20.vietnam-force-levels]]. Names: Rusk, Bundy, McNamara, Johnson, Westmoreland, Sharp.'
        tags: [name:rusk-dean, name:bundy-mcgeorge, name:mcnamara-robert-s, name:johnson-lyndon-b, name:westmoreland-william, name:sharp-u-s-grant]
  - cite:
      id: cal.1965-04-06.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.16–17 (McCone''s memorandum: the present bombing would not change Hanoi''s policy)'
      units: 'A, C, E, G'
  - src:
      id: cal.1965-04-06.vietnam
      rows:
        - 'via x.1965-04-06.nsam-328-apr-6-1965: A, C, E'
  - add:
      entry:
        id: cal.1965-04-06.vietnam-force-levels
        when: Apr. 6
        date: '1965-04-06'
        thread: vietnam-force-levels
        c: 'The CIA to Johnson: a North Vietnamese battalion in the central highlands, regular units near Đà Nẵng. The Chiefs ask two more brigades, some 8,000 men; Westmoreland seconds them.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.19–20. Check: the CIA''s report and the Chiefs'' request. See [[cal.1965-04-01.vietnam-force-levels-2]]. Names: Johnson, Westmoreland.'
        tags: [name:johnson-lyndon-b, name:westmoreland-william]
  - add:
      entry:
        id: cal.1965-04-07.vietnam-force-levels
        when: Apr. 7
        date: '1965-04-07'
        thread: vietnam-force-levels
        c: 'Taylor, Embtel 3248, learning of the request for two brigades: "It shows a far greater willingness to get into the ground war than I had discerned in Washington during my recent trip." Johnson sends McNamara to Honolulu.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.20. To check: Embtel 3248, Taylor to Rusk, Apr. 7, 1965, Country File, Vietnam, vol. 32, box 16, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.20). See [[cal.1965-04-06.vietnam-force-levels]]. Names: Taylor, Johnson, McNamara.'
        tags: [name:taylor-maxwell, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1965-04.vietnam-3
        when: Apr.
        date: 1965-04
        thread: vietnam
        c: 'Taylor to Rusk: "No amount of bombardment...is going to convince Hanoi to call off its action...without real progress in South Vietnam against the VC. Hanoi must be convinced that the VC cannot win here."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.20–21 ("a few days" before Honolulu). Check: the day and the cable. See [[cal.1965-04-07.vietnam-force-levels]]. Names: Taylor, Rusk.'
        tags: [name:taylor-maxwell, name:rusk-dean]
  - cite:
      id: cal.1965-04-20.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.21–22 (Pacific Command''s headquarters; all agree bombing alone not the answer; Wheeler, Sharp and Westmoreland renew the two divisions, McNamara with Taylor against; 33,000 to 82,000)'
      units: 'A, D-E'
  - src:
      id: cal.1965-04-20.vietnam
      rows:
        - 'via x.1965-04-20.mcnaughton-minutes-of-april-20-honolulu-meeting: A, D'
        - 'via x.1965-04-21.mcnamara-to-johnson-apr-21-1965: E'
  - cite:
      id: cal.1965-04-21.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.22–24 (McNamara: approve promptly, against "a spectacular defeat of GVN or U.S. forces"; tell the leaders; Ball: not "such a hazardous leap into space"; Johnson: "I''ll give you until tomorrow to get me a settlement plan. If you can pull a rabbit out of the hat, I''m all for it")'
      units: 'A-B'
  - add:
      entry:
        id: cal.1965-04-21.vietnam-2
        when: Apr. 21
        date: '1965-04-21'
        thread: vietnam
        c: 'Ball to Johnson, that night, "Should We Try to Move Toward a Vietnamese Settlement Now?": "We must be prepared for a settlement that falls somewhere short of the goals we have publicly stated, but that still meets our basic objectives."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.24–25. To check: Ball to Johnson, Apr. 21, 1965, "Political Track Papers, 4/65," Country File, Vietnam, box 213, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.25). See [[cal.1965-04-21.vietnam-force-levels]]. Names: Ball, Johnson.'
        tags: [name:ball-george-w, name:johnson-lyndon-b]
  - cite:
      id: cal.1965-06-03.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.28'
      units: 'A'
