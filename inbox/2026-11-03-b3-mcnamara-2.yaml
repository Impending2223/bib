      rows:
        - 'via x.1961-11-15.notes-on-the-national-security-council: B-D'
  - add:
      entry:
        id: cal.1961-11-28.vietnam
        when: Nov. 28
        date: '1961-11-28'
        thread: vietnam
        c: 'McNamara to Felt and McGarr, personal: a first meeting at Pacific headquarters, then regular reviews. "Fundamentally, we must adjust ourselves to a perennially unclear political framework and to a policy that for overall national reasons sets limits on military action."'
        n: '[Telegram, McNamara to Felt and McGarr, Def 906345, FRUS 1961–63, I, doc. 289](https://history.state.gov/historicaldocuments/frus1961-63v01/d289). [[w.mcnamara-in-retrospect]], ch. 2 at n.16 (the words). See [[cal.1961-11-15.vietnam]]. Names: McNamara, Felt, McGarr.'
        tags: [name:mcnamara-robert-s, name:felt-harry-d, name:mcgarr-lionel-c]
        src:
          c: 6c542326
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v01/d289: all'
            - 'w.mcnamara-in-retrospect ch. 2 at n.16: B'
            - 'via x.1961-11-28.mcnamara-to-felt-and-mcgarr-def-906345: B'
  - cite:
      id: cal.1961-12-16.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.16 (the first conference in Hawaii: no American combat troops to South Vietnam)'
      units: 'A-B, E'
  - src:
      id: cal.1961-12-16.vietnam
      rows:
        - 'via x.1961-12-18.parker-to-lemnitzer-dec-18-1961: E'
        - 'via x.1961-12-18.martin-to-cottrell-dec-18-1961: E'
  - add:
      entry:
        id: cal.1962-01-13.vietnam-2
        when: Jan. 13
        date: '1962-01-13'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-33-62, for the President: American combat forces would prevent South Vietnam''s loss; a deployment urged. "The United States has clearly stated...that one of its unalterable objectives is the prevention of South Vietnam falling to communist aggression."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.16–17. To check: JCSM-33-62, Jan. 13, 1962, [[w.pentagon-papers]], II, 663–666 (cited by [[w.mcnamara-in-retrospect]], ch. 2 n.17). See [[cal.1961-11-11.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1962-01-27.vietnam
        when: Jan. 27
        date: '1962-01-27'
        thread: vietnam
        c: 'McNamara forwards the Chiefs'' JCSM-33-62 to Kennedy: "I am not prepared to endorse the views of the Chiefs until we have had more experience with our present [training] program in South Vietnam."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at n.17. To check: McNamara, memorandum for the President, Jan. 27, 1962, [[w.pentagon-papers]], II, 662 (cited by [[w.mcnamara-in-retrospect]], ch. 2 n.17). See [[cal.1962-01-13.vietnam-2]]. Names: McNamara, Kennedy.'
        tags: [name:mcnamara-robert-s, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1962-02-05.vietnam
        when: Feb. 5
        date: '1962-02-05'
        thread: vietnam
        c: 'McNamara''s press conference at the Pentagon: Saigon''s actions against "covert aggression" "beginning to be effective"; "it is far too early to predict the eventual outcome."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at n.20. To check: press conference, Feb. 5, 1962, *Public Statements of Robert S. McNamara*, 1962, II, 735–736 (cited by [[w.mcnamara-in-retrospect]], ch. 2 n.20). Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1962-03.vietnam
        when: Mar.
        date: 1962-03
        thread: vietnam
        c: 'McNamara to the Advertising Council in Washington: "success in opposing guerrilla warfare will depend at least as much and probably more upon the political and economic actions and programs than upon the military programs."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.19–20. Check: the day. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1962-03.vietnam-2
        when: Mar.
        date: 1962-03
        thread: vietnam
        c: 'McNamara in the *Washington Post*, eleven days after the Advertising Council: "the application of military force alone will not automatically defeat the Communists unless there is internal economic and social reform."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.19–20. Check: the day. See [[cal.1962-03.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1962-07-23.vietnam-2
        when: July 23
        date: '1962-07-23'
        thread: vietnam
        c: 'McNamara''s news release at Camp H. M. Smith: "Our military assistance to Vietnam is paying off....The Vietnamese armed forces are carrying the war to the Viet Cong with greater initiative and frequency."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at n.21. To check: news release, Camp H. M. Smith, July 23, 1962, *Public Statements of Robert S. McNamara*, 1962, IV, 1589 (cited by [[w.mcnamara-in-retrospect]], ch. 2 n.21). See [[cal.1962-07-23.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1962-07-23.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.23, 25 (Harkins: "There is no doubt we are on the winning side"; the Viet Cong''s military potential gone a year after the South''s forces are fully operational; planning for withdrawal on three years; some 16,000 advisers)'
      units: 'A-B'
  - src:
      id: cal.1962-07-23.vietnam
      rows:
        - 'via x.1962-07-23.record-of-the-sixth-secretary-of: A-B'
  - add:
      entry:
        id: cal.1962-10-09.vietnam
        when: Oct. 9
        date: '1962-10-09'
        thread: vietnam
        c: 'McNamara to the press at Andrews, back from Honolulu: "too early to say that the tide has turned"; "progress is quite apparent."'
        n: '[[w.mcnamara-in-retrospect]], ch. 2 at n.22. To check: remarks to the press, Andrews Air Force Base, Oct. 9, 1962, *Public Statements of Robert S. McNamara*, 1962, IV, 182 (cited by [[w.mcnamara-in-retrospect]], ch. 2 n.22). See [[cal.1962-10-08.vietnam-force-levels]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1963-03-29.vietnam-force-levels
        when: Mar. 29
        date: '1963-03-29'
        thread: vietnam-force-levels
        c: 'McNamara asks Robert Thompson, head of the British Advisory Mission, whether to reduce the advisers. Thompson: if progress holds and an area is cleared during the summer, American strength might come down by 1,000.'
        n: '[Memorandum of conversation, Harriman and Thompson, Apr. 1, 1963, FRUS 1961–63, III, doc. 73](https://history.state.gov/historicaldocuments/frus1961-63v03/d73) (Thompson''s account of his answer; the day not given). [[w.mcnamara-in-retrospect]], ch. 2 at n.26. Check: the day, McNamara''s. See [[cal.1962-07-23.vietnam]]. Names: McNamara, Thompson.'
        tags: [name:mcnamara-robert-s, name:thompson-robert]
        src:
          c: 231b1042
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d73: B'
            - 'w.mcnamara-in-retrospect ch. 2 at n.26: all'
            - 'via x.1963-04-01.memorandum-of-conversation-harriman-and-thompson: B'
  - cite:
      id: cal.1963-05-06.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.27 (Harkins: progress continues; McNamara orders a plan to withdraw 1,000 advisers by the year''s end)'
      units: 'A-C, F'
  - src:
      id: cal.1963-05-06.vietnam-force-levels
      rows:
        - 'via x.1963-05-06.heinz-memorandum-for-the-record-secretary-of-defense-conference: A-C, F'
  - add:
      entry:
        id: cal.1963-08-20.vietnam-force-levels
        when: Aug. 20
        date: '1963-08-20'
        thread: vietnam-force-levels
        c: 'The Joint Chiefs to McNamara, JCSM-629-63, with CINCPAC''s plan to withdraw 1,000 by the end of 1963, as he directed at Honolulu May 6. No units out "for purely psychological purposes" until the political and religious tensions ease; the final decision withheld until late October.'
        n: '[JCSM-629-63, Taylor for the Chiefs, FRUS 1961–63, III, doc. 260](https://history.state.gov/historicaldocuments/frus1961-63v03/d260). [[w.mcnamara-in-retrospect]], ch. 2 at n.28 (the plan; no withdrawal until the crisis subsided; no decision before late October). See [[cal.1963-05-06.vietnam-force-levels]]. Names: McNamara, Taylor.'
        tags: [name:mcnamara-robert-s, name:taylor-maxwell]
        src:
          c: bcd6b4b0
          rows:
            - 'https://history.state.gov/historicaldocuments/frus1961-63v03/d260: all'
            - 'w.mcnamara-in-retrospect ch. 2 at n.28: all'
            - 'via x.1963-08-20.taylor-to-mcnamara-jcsm-629-63: all'
