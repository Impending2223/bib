  - add:
      entry:
        id: cal.1963-09-03.vietnam
        when: Sept. 3
        date: '1963-09-03'
        thread: vietnam
        c: 'Meeting with the President on Vietnam. Kennedy: the French trying to get for Vietnam what was done in Laos, neutralization, which is not working in Laos. Lodge to see Diệm at the earliest opportunity.'
        n: '[Memorandum of a conference with the President, Sept. 3, 1963, FRUS 1961–63, IV, doc. 54](https://history.state.gov/historicaldocuments/frus1961-63v04/d54) (the neutralization). [[w.mcnamara-in-retrospect]], ch. 3 at n.17. See [[cal.1963-08-24.vietnam]]. Names: Kennedy, Lodge, Ngô Đình Diệm.'
        tags: [name:kennedy-john-f, name:lodge-henry-cabot, name:ngo-dinh-diem]
  - cite:
      id: cal.1963-09-06.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.18 (Lodge had still not seen Diệm)'
      units: 'A-C'
  - src:
      id: cal.1963-09-06.vietnam
      rows:
        - 'via x.1963-09-06.conversation-with-president-sept-6-1963: A-C'
