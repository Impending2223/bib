  # === Ch. 5: July 30-Aug. 7, 1964 ===
  - cite:
      id: cal.1964-08-02.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 5 at nn.1–3 (the 34A raid the night of July 30 on two islands; the Maddox attacked at 3:40 p.m., 3:40 a.m. in Washington; the meeting at 11:30 a.m., Vance for Defense: perhaps a local commander''s initiative; no retaliation, a protest, the Turner Joy added to the patrol)'
      units: 'A-B, D-G'
  - add:
      entry:
        id: cal.1964-08-03.vietnam-2
        when: Aug. 3
        date: '1964-08-03'
        thread: vietnam
        c: 'Taylor to Rusk, Embtel 282: no reprisal for the attack on the Maddox "would immediately be construed in Saigon as indication that U.S. flinches from direct confrontation with North Vietnamese."'
        n: '[Embtel 282, FRUS 1964–68, I, doc. 262](https://history.state.gov/historicaldocuments/frus1964-68v01/d262) (11 a.m. Saigon time). [[w.mcnamara-in-retrospect]], ch. 5 at n.4 ("late in the night of August 2," Washington). See [[cal.1964-08-02.vietnam]]. Names: Taylor, Rusk.'
        tags: [name:taylor-maxwell, name:rusk-dean]
  - cite:
      id: cal.1964-08-03.vietnam-congress
      item: '[[w.mcnamara-in-retrospect]], ch. 5 (3 p.m., in closed session; Rusk and McNamara describe the 34A operations, the attack, the decision not to retaliate; the patrols and the raids to go on; no record of the meeting found by McNamara)'
      units: 'A'
  - check:
      id: cal.1964-08-03.vietnam-congress
      text: 'Check: McNamara names Rusk and himself, not Wheeler, and has the committees told of the 34A operations (ch. 5).'
  - cite:
      id: cal.1964-08-04.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 5 at nn.5–10 (the Maddox''s warning at 7:40 a.m., Washington; the plan, four patrol boat bases and two oil depots; 11:40 a.m., McNamara with Rusk, Bundy and the Chiefs, then the NSC and lunch with the President; Herrick''s message; the NSC at 6:15 p.m., the strike authorized; the leaders at 6:45 p.m.; the Ticonderoga''s order at 7:22 p.m.)'
      units: 'A-E'
  - src:
      id: cal.1964-08-04.vietnam
      rows:
        - 'via x.1964-08-04.msg-ctg72-1-041727z-aug-1964: B-C'
        - 'via x.1964-08-04.notes-of-the-nsc-meeting-aug: D-E'
        - 'via x.1964-08-04.jenkins-meeting-notes-aug-4-1964: D'
  - add:
      entry:
        id: cal.1964-08-04.vietnam-2
        when: Aug. 4
        date: '1964-08-04'
        thread: vietnam
        c: 'McNamara to Sharp by secure telephone, 4:08 p.m., recorded. Sharp: "a little doubt on just exactly what went on"; "freak radar echoes"; the ambush attempt "definite." McNamara: "There isn''t any possibility there was no attack, is there?" Sharp: "a slight possibility." McNamara: no strike "until we are damn sure what happened."'
        n: '[[w.mcnamara-in-retrospect]], ch. 5 at n.7. To check: record of the telephone conversation, McNamara and Sharp, Aug. 4, 1964, "Gulf of Tonkin (Miscellaneous)," Country File, Vietnam, box 228, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 5 n.7). See [[cal.1964-08-04.vietnam]]. Names: McNamara, Sharp.'
        tags: [name:mcnamara-robert-s, name:sharp-u-s-grant]
  - add:
      entry:
        id: cal.1964-08-04.vietnam-3
        when: Aug. 4
        date: '1964-08-04'
        thread: vietnam
        c: 'McNamara and Vance with the Chiefs, 4:47 p.m., on the evidence of a second attack: the Turner Joy illuminated and fired on; cockpit lights seen; antiaircraft fire on two American planes; an intercepted message on two boats sunk; Sharp''s judgment. At 5:23 p.m. Sharp to Burchinal: no doubt now.'
        n: '[[w.mcnamara-in-retrospect]], ch. 5 at nn.7–8. To check: Sharp to Burchinal, recording, 5:23 p.m., Aug. 4, 1964, "Gulf of Tonkin (Miscellaneous)," Country File, Vietnam, box 228, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 5 n.8). See [[cal.1964-08-04.vietnam]]. Names: McNamara, Vance, Sharp.'
        tags: [name:mcnamara-robert-s, name:vance-cyrus, name:sharp-u-s-grant]
  - cite:
      id: cal.1964-08-04.vietnam-congress-2
      item: '[[w.mcnamara-in-retrospect]], ch. 5 at n.10 (Rusk: the attack a serious decision, not accidental; Johnson to submit a resolution; several leaders for it)'
      units: 'A-C, F'
