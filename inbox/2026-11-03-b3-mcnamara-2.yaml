  - add:
      entry:
        id: cal.1965-06-08.vietnam-july-decision
        when: June 8
        date: '1965-06-08'
        thread: vietnam-july-decision
        c: 'The Oval Office, the morning, on Westmoreland''s cable. McNamara: "We''re in a hell of a mess."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.32. To check: McGeorge Bundy, notes of the meeting, Papers of McGeorge Bundy, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.32). See [[cal.1965-06-07.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - cite:
      id: cal.1965-06-10.vietnam-july-decision
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.33 ("The American people feel we are withholding information"; Westmoreland to be asked his strategy, the enemy''s response, the casualties)'
      units: 'A'
  - add:
      entry:
        id: cal.1965-06-10.vietnam-july-decision-2
        when: June 10
        date: '1965-06-10'
        thread: vietnam-july-decision
        c: 'Johnson and McNamara by telephone, 6:40 p.m., recorded. McNamara: "In the back of my mind, I have a very definite limitation on commitment in mind, and I don''t think the chiefs do." Johnson: is Westmoreland''s request "just the next step with them up the ladder?" McNamara: "Yes."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.34. To check: [Conversation with Robert McNamara, June 10, 1965, 6:40 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-june-10-1965), Conversation WH6506-02-8117 (Miller Center) (McNamara cites Tape 6506.02, PNO 8). See [[cal.1965-06-10.vietnam-july-decision]]. Names: Johnson, McNamara, Westmoreland.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:westmoreland-william]
  - add:
      entry:
        id: cal.1965-06-16.vietnam-force-levels
        when: June 16
        date: '1965-06-16'
        thread: vietnam-force-levels
        c: 'McNamara''s news conference at the Pentagon, asked of a buildup beyond 70,000 to 75,000: "we will do whatever is necessary to achieve our objective in South Vietnam." The strategy: to convince the North that the guerrilla action "cannot be achieved, and then to negotiate."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.35. To check: news conference, the Pentagon, June 16, 1965, *Public Statements of Robert S. McNamara*, 1965, V, 1794, 1800 (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.35). See [[cal.1965-06-16.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1965-06-16.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.35 (the 70,000 to 75,000 level)'
      units: 'A'
  - cite:
      id: cal.1965-06-21.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.37 (the same words, from the recording)'
      units: 'A-B'
  - src:
      id: cal.1965-06-21.vietnam
      rows:
        - 'via x.1965-06-21.johnson-and-mcnamara-recording-12-15-p-m: A-B'
  - cite:
      id: cal.1965-06-18.vietnam-july-decision
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.39–40 (to the President and Rusk only; "no more" than 100,000)'
      units: 'A'
  - cite:
      id: cal.1965-06-23.vietnam-july-decision
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.40 (Ball: hold at 100,000, retreat to Thailand if forced out; Rusk and McNamara object; Ball and McNamara to write their proposals, a week)'
      units: 'A'
  - add:
      entry:
        id: cal.1965-06-26.vietnam-july-decision
        when: June 26
        date: '1965-06-26'
        thread: vietnam-july-decision
        c: 'McNamara''s draft for the President, after Westmoreland''s latest cable and talks with the Chiefs, to Rusk, McGeorge and William Bundy and Ball: strength enough "to prove to the VC that they cannot win"; 175,000 Americans in 1965, more in 1966; more action against the North; wider diplomatic moves.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.41. To check: McNamara, draft memorandum for the President, June 26, 1965, NSC Meetings File, vol. 3, tab 35, box 1, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.41). See [[cal.1965-06-23.vietnam-july-decision]]. Names: McNamara, Rusk, Bundy, William Bundy, Ball.'
        tags: [name:mcnamara-robert-s, name:rusk-dean, name:bundy-mcgeorge, name:bundy-william, name:ball-george-w]
  - cite:
      id: cal.1965-07-01.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.41–44 (Ball''s, William Bundy''s and McNamara''s papers to the White House the night of July 1; Rusk''s added, unknown to McNamara)'
      units: 'A-B, D-F'
  - cite:
      id: cal.1965-07-02.vietnam-july-decision
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.45'
      units: 'A-C'
  - cite:
      id: cal.1965-07-08.vietnam-july-decision
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.46–47 (the morning subpanel, Bradley, Gilpatric, Kistiakowsky, Larson and McCloy, with Rusk, Thompson, William Bundy and McNamara, all but Larson for "whatever" forces were needed; Hoffman for negotiations; McCloy: "We are about to get our noses bloodied but you''ve got to do it")'
      units: 'A-B'
  - add:
      entry:
        id: cal.1965-07-14.press-and-broadcasting
        when: July 14
        date: '1965-07-14'
        thread: press-and-broadcasting
        also: [program]
        c: 'Johnson to James Cannon and Charles Roberts of *Newsweek*: his goal "to make life better and more enjoyable and more significant"; "I am more sensitive to the injustices we have put on the Negro, for instance, because I see and talk to him more now."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.48. To check: *Newsweek*, Aug. 2, 1965, 20–21 (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.48). Names: Johnson.'
        tags: [name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1965-07-14.vietnam-july-decision
        when: July 14
        date: '1965-07-14'
        thread: vietnam-july-decision
        c: 'Johnson and McNamara by telephone, 6:15 p.m., recorded, before McNamara leaves for Saigon. Johnson: "when we asked for this Tonkin Gulf Resolution, we had no intention of committing this many...ground troops." McNamara: call up reserves and go to Congress for the authority. Rusk would not give up South Vietnam "even if it means going to general war."'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at n.49. To check: Johnson and McNamara, July 14, 1965, 6:15 p.m., Tape 6507.02, PNO 22, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 7 n.49). See [[cal.1965-07-02.vietnam-july-decision]]. Names: Johnson, McNamara, Rusk.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:rusk-dean]
  - cite:
      id: cal.1965-07-16.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.50–51 (July 16–17; Westmoreland: 175,000 by year''s end, 100,000 more in 1966)'
      units: 'A-B'
  - src:
      id: cal.1965-07-16.vietnam-force-levels
      rows:
        - 'via x.1965-07-16.record-of-questions-and-answers: A-B'
  - cite:
      id: cal.1965-07-21.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.52 (the report, dated July 20, presented July 21)'
      units: 'A'
  - src:
      id: cal.1965-07-21.vietnam
      rows:
        - 'via x.1965-07-20.frus-1964-68-iii-171-79: A'
  - cite:
      id: cal.1965-07-27.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 (the program approved; the appropriation held below McNamara''s estimate)'
      units: 'A'
  - cite:
      id: cal.1965-07-28.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 (the midday speech)'
      units: 'A'
  - add:
      entry:
        id: cal.1965-07.vietnam-july-decision-2
        when: July
        date: 1965-07
        thread: vietnam-july-decision
        also: [economy]
        c: 'McNamara''s draft memorandum on the cost, known to a handful: some $10 billion more through fiscal 1966, and a tax increase. Johnson: "What''s your vote count?" McNamara to the Hill: the votes not there. Johnson refuses the tax; the first request held far below the estimate, more in January.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7. Check: the days and the draft; McNamara has neither the Treasury Secretary nor the Council''s chairman told. See [[cal.1965-07-27.vietnam]]. Names: McNamara, Johnson.'
        tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
