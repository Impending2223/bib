  # === Ch. 6: Aug. 8, 1964-Jan. 27, 1965 ===
  - add:
      entry:
        id: cal.1964-02-03.defense
        when: Feb. 3
        date: '1964-02-03'
        thread: defense
        c: 'McNamara before Senate Armed Services, Goldwater among the members: the strategic nuclear weapons in the force to increase over five years; warheads up 74 percent, total megatonnage 31 percent.'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.4–5. Check: the hearing''s record. Names: McNamara, Goldwater.'
        tags: [name:mcnamara-robert-s, name:goldwater-barry-m]
  - check:
      id: cal.1964-05-24.goldwater
      text: 'Check: McNamara, from White, has Goldwater "in early March" muse that at Dien Bien Phu ten years before a low-yield atom bomb might have defoliated the attackers'' cover, and the next day: "carrying the war to North Vietnam—ten years ago we should have bombed North Vietnam, with no risk to our lives" ([[w.mcnamara-in-retrospect]], ch. 6 at n.1; [[w.white-making-of-the-president-1965]], 132–133, not read).'
  - add:
      entry:
        id: cal.1964-03-20.goldwater
        when: Mar. 20
        date: '1964-03-20'
        thread: goldwater
        also: [defense]
        c: 'Goldwater''s "flat charge" that "Secretary of Defense McNamara and the State Department are engaged in unilateral disarmament."'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.3–4. Check: where Goldwater said it. Names: Goldwater, McNamara.'
        tags: [name:goldwater-barry-m, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-04-05.goldwater
        when: Apr. 5
        date: '1964-04-05'
        thread: goldwater
        c: 'Breech, formerly Ford''s executive vice president and a contributor to Goldwater''s campaign, to its finance coordinator, Frank Middleton: "Mr. McNamara...had nothing to do with the plans for the Edsel car or any part of the program." Goldwater goes on making the charge.'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at n.5. To check: Ernest R. Breech to Frank Middleton, Apr. 5, 1964, Robert S. McNamara Papers (cited by [[w.mcnamara-in-retrospect]], ch. 6 n.5). Names: Goldwater, McNamara.'
        tags: [name:goldwater-barry-m, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-08-11.goldwater
        when: Aug. 11
        date: '1964-08-11'
        thread: goldwater
        also: [defense]
        c: 'Goldwater: "Under our present defense leadership, with its utter disregard for new weapons, our deliverable nuclear capacity may be cut down by 90% in the next decade."'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.3–4. Check: where Goldwater said it. See [[cal.1964-03-20.goldwater]]. Names: Goldwater.'
        tags: [name:goldwater-barry-m]
  - add:
      entry:
        id: cal.1964-08-12.vietnam-3
        when: Aug. 12
        date: '1964-08-12'
        thread: vietnam
        also: [elections-1964]
        c: 'Johnson to the American Bar Association in New York: "Some others are eager to enlarge the conflict. They call upon us to supply American boys to do the job that Asian boys should do." The South Vietnamese "have the basic responsibility for the defense of their own freedom."'
        n: 'Remarks in New York City Before the American Bar Association, [1963–64 Pub. Papers 952](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=192) (Aug. 12, 1964). [[w.mcnamara-in-retrospect]], ch. 6 at nn.2–3. See [[cal.1964-08-07.vietnam]]. Names: Johnson.'
        tags: [name:johnson-lyndon-b, city:nyc]
  - add:
      entry:
        id: cal.1964-08-13.vietnam-2
        when: Aug. 13
        date: '1964-08-13'
        thread: vietnam
        c: 'McGeorge Bundy to Johnson with the paper "Next Courses of Action in Southeast Asia," for the noon meeting the next day: from more covert operations to systematic air strikes on the North and its supply lines. Taylor''s Jan. 1, 1965, the target date for any wider action.'
        n: '[McGeorge Bundy to Johnson, Aug. 13, 1964, FRUS 1964–68, I, doc. 313](https://history.state.gov/historicaldocuments/frus1964-68v01/d313) (the covering memorandum). [[w.mcnamara-in-retrospect]], ch. 6 at n.6 (the paper''s courses; the target date). See [[cal.1964-08-07.vietnam]]. Names: Bundy, Johnson, Taylor.'
        tags: [name:bundy-mcgeorge, name:johnson-lyndon-b, name:taylor-maxwell]
  - add:
      entry:
        id: cal.1964-08-14.vietnam
        when: Aug. 14
        date: '1964-08-14'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-701-64, on the paper of Aug. 13: in general accord, provided more serious pressures, attacks on targets in North Vietnam among them, are applied as necessary. McNamara asks them to weigh the economic and military effects of striking the ninety-four targets.'
        n: '[JCSM-701-64, FRUS 1964–68, I, doc. 316](https://history.state.gov/historicaldocuments/frus1964-68v01/d316) (the accord). [[w.mcnamara-in-retrospect]], ch. 6 at nn.7–8 (the ninety-four targets; McNamara''s request). See [[cal.1964-08-13.vietnam-2]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-09-04.vietnam-2
        when: Sept. 4
        date: '1964-09-04'
        thread: vietnam
        c: 'The Chiefs debate the ninety-four targets. Harold K. Johnson, CSAM-472-64: the insurgency "could continue for a long time at its present or an increased intensity even if North Vietnam were completely destroyed"; "the war against the insurgency will be won in South Vietnam and along its frontiers"; the list to be shelved unless the North or China invades.'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at n.8. To check: CSAM-472-64, Sept. 4, 1964, JMF 9155.3, as quoted in History of the Joint Chiefs of Staff, The Joint Chiefs of Staff and the War in Vietnam, 1960–1968, pt. 1, ch. 12, 14–16 (cited by [[w.mcnamara-in-retrospect]], ch. 6 n.8). See [[cal.1964-08-14.vietnam]]. Names: Harold K. Johnson.'
        tags: [name:johnson-harold-k]
  - add:
      entry:
        id: cal.1964-09-06.vietnam-2
        when: Sept. 6
        date: '1964-09-06'
        thread: vietnam
        c: 'Taylor to Rusk, Embtel 768: "only the emergence of an exceptional leader could improve the situation and no George Washington is in sight."'
        n: '[Embtel 768, FRUS 1964–68, I, doc. 339](https://history.state.gov/historicaldocuments/frus1964-68v01/d339). [[w.mcnamara-in-retrospect]], ch. 6 at n.10. See [[cal.1964-08-07.vietnam]]. Names: Taylor, Rusk.'
        tags: [name:taylor-maxwell, name:rusk-dean]
  - add:
      entry:
        id: cal.1964-09-08.vietnam
        when: Sept. 8
        date: '1964-09-08'
        thread: vietnam
        c: 'SNIE 53-64, "Chances for a Stable Government in South Vietnam": "At present the odds are against the emergence of a stable government capable of effectively prosecuting the war in South Vietnam."'
        n: '[SNIE 53-64, FRUS 1964–68, I, doc. 341](https://history.state.gov/historicaldocuments/frus1964-68v01/d341). [[w.mcnamara-in-retrospect]], ch. 6 at n.10. See [[cal.1964-09-06.vietnam-2]].'
  - add:
      entry:
        id: cal.1964-09-08.vietnam-2
        when: Sept. 8
        date: '1964-09-08'
        thread: vietnam
        c: 'The Chiefs'' "talking paper" on the courses of action, discussed with McNamara and Taylor: nothing of Harold K. Johnson''s objections.'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.8–9. Check: the paper. See [[cal.1964-09-04.vietnam-2]]. Names: McNamara, Taylor, Harold K. Johnson.'
        tags: [name:mcnamara-robert-s, name:taylor-maxwell, name:johnson-harold-k]
  - cite:
      id: cal.1964-09-09.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.10–11 (the Air Force chief and the Commandant for immediate strikes; Wheeler, Harold K. Johnson, the Chief of Naval Operations, Westmoreland and Taylor against overstraining Saigon; Johnson: not to "enter our fighter in a ten-round bout when he was in no shape to last the first round")'
      units: 'A-C'
  - add:
      entry:
        id: cal.1964-09.vietnam-6
        when: Sept.
        date: 1964-09
        thread: vietnam
        c: 'Sigma II-64, the Joint War Games Agency''s game: "industrial and military bombing" of North Vietnam "would not quickly cause cessation of the insurgency in South Vietnam"; it "might have but minimal effect on the (low) living standard."'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at n.9 ("mid-September"). To check: Sigma II-64, Final Report, D-14, D-15, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 6 n.9). Check: the days. See [[cal.1964-08-14.vietnam]].'
  - add:
      entry:
        id: cal.1964-09-18.defense
        when: Sept. 18
        date: '1964-09-18'
        thread: defense
        also: [elections-1964]
        c: 'McNamara: "A full-scale nuclear exchange between the United States and the USSR would kill 100 million Americans during the first hour. It would kill an even greater number of Russians, but I doubt that any sane person would call this ''victory.''"'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.4–5. Check: where McNamara spoke. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1964-10-05.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.12–13 (sixty-two pages, by McNamara''s count)'
      units: 'A-B'
  - check:
      id: cal.1964-10-05.vietnam
      text: 'Check: McNamara counts sixty-two pages (ch. 6).'
  - add:
      entry:
        id: cal.1964-10-06.goldwater
        when: Oct. 6
        date: '1964-10-06'
        thread: goldwater
        also: [defense]
        c: 'Goldwater accuses McNamara of "deliberately...phasing out 90% of our nuclear delivery capability."'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.3–4. Check: where Goldwater said it. See [[cal.1964-03-20.goldwater]]. Names: Goldwater, McNamara.'
        tags: [name:goldwater-barry-m, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1964-10-17.vietnam
        when: Oct. 17
        date: '1964-10-17'
        thread: vietnam
        c: 'Westmoreland to Wheeler, MACV 5532: "unless there are reasonable prospects of a fairly effective government in South Vietnam in the immediate offing, then no amount of offensive action by the U.S. either in or outside South Vietnam has any chance by itself of reversing the deterioration now underway."'
        n: '[MACV 5532, FRUS 1964–68, I, doc. 382](https://history.state.gov/historicaldocuments/frus1964-68v01/d382). [[w.mcnamara-in-retrospect]], ch. 6 at n.15 (the words). See [[cal.1964-09-06.vietnam-2]]. Names: Westmoreland, Wheeler.'
        tags: [name:westmoreland-william, name:wheeler-earle]
  - add:
      entry:
        id: cal.1964-10-27.vietnam
        when: Oct. 27
        date: '1964-10-27'
        thread: vietnam
        c: 'The Joint Chiefs to McNamara, JCSM-902-64: a new and intensified program, American air operations over North and South Vietnam, on the premise that "US withdrawal from the RVN or Southeast Asia is not an acceptable course of action." To go to the President at the earliest feasible time.'
        n: '[JCSM-902-64, FRUS 1964–68, I, doc. 388](https://history.state.gov/historicaldocuments/frus1964-68v01/d388) (the premise). [[w.mcnamara-in-retrospect]], ch. 6 at n.14. See [[cal.1964-08-14.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s, name:wheeler-earle]
  - add:
      entry:
        id: cal.1964-11-01.vietnam-3
        when: Nov. 1
        date: '1964-11-01'
        thread: vietnam
        c: 'McNamara with Wheeler on the Chiefs'' memorandum: so strongly do they feel that most would withdraw from South Vietnam if the President decided against more military action.'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at n.15. To check: notes of meeting with General Wheeler, Nov. 1, 1964, Robert S. McNamara Papers, Department of Defense (cited by [[w.mcnamara-in-retrospect]], ch. 6 n.15). See [[cal.1964-10-27.vietnam]]. Names: McNamara, Wheeler.'
        tags: [name:mcnamara-robert-s, name:wheeler-earle]
  - add:
      entry:
        id: cal.1964-11-03.vietnam-2
        when: Nov. 3
        date: '1964-11-03'
        thread: vietnam
        c: 'Taylor to McNamara, Embtel 251, on the Chiefs'' proposals: a departure "from the principle that the Vietnamese fight their own war in SVN."'
        n: '[Embtel 251, FRUS 1964–68, I, doc. 401](https://history.state.gov/historicaldocuments/frus1964-68v01/d401). [[w.mcnamara-in-retrospect]], ch. 6 at n.15. See [[cal.1964-10-27.vietnam]]. Names: Taylor, McNamara.'
        tags: [name:taylor-maxwell, name:mcnamara-robert-s]
  - cite:
      id: cal.1964-11-03.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.15–16 (set up by the President Nov. 2; four weeks; the draft: no guarantee of a non-Communist South Vietnam short of a commitment that could bring "a Korean-scale ground action and possibly even the use of nuclear weapons")'
      units: 'A-D'
  - check:
      id: cal.1964-11-03.vietnam
      text: 'Check: McNamara has Johnson set up the working group on Nov. 2 (ch. 6).'
  - cite:
      id: cal.1964-11-07.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.13 (Rusk, Bundy and McNamara with Ball; no notes found)'
      units: 'A-B'
  - cite:
      id: cal.1964-11-19.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.16 (Rusk''s progress report: three options; no irresistible momentum for any)'
      units: 'A'
  - cite:
      id: cal.1964-12-01.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.17–18 (Humphrey present; the options; Johnson: "I am hesitant to sock my neighbor if my fever is 104 degrees"; Taylor: "I doubt that Hanoi will slap back")'
      units: 'A-C'
  - src:
      id: cal.1964-12-01.vietnam
      rows:
        - 'via x.1964-12-01.mcnaughtons-notes-of-the-meeting-of: A-C'
  - cite:
      id: cal.1964-12-20.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at nn.18–19 (Taylor to the generals: "You people have broken a lot of dishes, and now we have to see how we can straighten out this mess")'
      units: 'B-C'
  - cite:
      id: cal.1964-12-24.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.20 (CAP 64375: "Every time I get a military recommendation it calls for large-scale bombing"; "appropriate military strength on the ground")'
      units: 'D-E'
  - src:
      id: cal.1964-12-24.vietnam
      rows:
        - 'via x.1964-12-30.johnson-to-taylor-cap-64375-dec: D-E'
  - add:
      entry:
        id: cal.1964-12-31.vietnam-2
        when: Dec. 31
        date: '1964-12-31'
        thread: vietnam
        c: 'Taylor''s year-end appraisal, Embtel 2010: "If worse comes to worst...we might seek to disengage from the present...relationship with the GVN, withdrawing the bulk of our advisers," to let it "walk on its own legs and be responsible for its own stumbles."'
        n: '[[w.mcnamara-in-retrospect]], ch. 6 at n.19. To check: Embtel 2010, Taylor to Rusk, Dec. 31, 1964, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 6 n.19). See [[cal.1964-12-24.vietnam]]. Names: Taylor.'
        tags: [name:taylor-maxwell]
  - cite:
      id: cal.1965-01-06.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.21 (some 100,000 guerrillas; no successful antiguerrilla campaign "with less than a 10 to 1 numerical superiority," the ratio never above five to one)'
      units: 'A-C'
  - cite:
      id: cal.1965-01-27.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.22 (the memorandum printed)'
      units: 'A-D'
  - src:
      id: cal.1965-01-27.vietnam-2
      rows:
        - 'via x.1965-01-27.mb-to-lbj-jan-27-1965: A-D'
  - cite:
      id: cal.1965-01-27.vietnam-3
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.22 (the Treaty Room, that morning, with Rusk)'
      units: 'A'
  - cite:
      id: cal.1965-01-27.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 6 at n.22'
      units: 'D-F'
