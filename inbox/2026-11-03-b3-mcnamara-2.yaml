        - 'via x.1963-08-27.attendance-and-summary-the-presidents-meeting: A'
        - 'via x.1963-08-28.bromley-smith-memorandum-of-conference-with: A'
  - cite:
      id: cal.1963-08-28.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.10–12 (the noon meeting; Ball, no choice but a coup; Nolting''s doubts; the evening meeting, 6 p.m., and the three messages to Saigon)'
      units: 'A-B, D, F'
  - src:
      id: cal.1963-08-28.vietnam
      rows:
        - 'via x.1963-08-28.bromley-smith-memorandum-of-conference-with: A-B, D'
        - 'via x.1963-08-28.memorandum-of-a-conversation-aug-28-1963-6-p-m: F'
  - add:
      entry:
        id: cal.1963-08-29.vietnam-4
        when: Aug. 29
        date: '1963-08-29'
        thread: vietnam
        c: 'Meeting with the President on Vietnam. Lodge and Harkins: the war cannot be won under Diệm; Harkins would detach the Nhus from him; Nolting for "one last try with Diem." McNamara: Harkins to urge Diệm to fire his brother; "I see no good alternative on the horizon." Harkins to tell the generals the CIA''s messages are policy; a last approach to Diệm left open.'
        n: '[Memorandum of a conference with the President, Aug. 29, 1963, FRUS 1961–63, IV, doc. 15](https://history.state.gov/historicaldocuments/frus1961-63v04/d15). [[w.mcnamara-in-retrospect]], ch. 3 at nn.13–14 (McNamara''s words, from the recording, n.13; the rest). See [[cal.1963-08-24.vietnam]]. Names: Lodge, Harkins, Ngô Đình Diệm, Nolting, McNamara.'
        tags: [name:lodge-henry-cabot, name:harkins-paul-d, name:ngo-dinh-diem, name:nolting-frederick-e-jr, name:mcnamara-robert-s, name:kennedy-john-f]
  - cite:
      id: cal.1963-08-29.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.14 (the second cable, seen by no one else: "Until the very moment of the go signal for the operation by the Generals, I must reserve a contingent right to change course and reverse previous instructions")'
  - cite:
      id: cal.1963-08-31.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.15 (Rusk: our thinking come full circle; McNamara for restoring communication with Diệm''s government; no instructions to Lodge)'
      units: 'A, F'
  - src:
      id: cal.1963-08-31.vietnam-2
      rows:
        - 'via x.1963-08-31.hilsman-memorandum-of-conversation-aug-31: A, F'
  - cite:
      id: cal.1963-09-02.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.16'
      units: 'A-B'
  - src:
