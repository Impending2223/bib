        - 'via x.1963-09-09.transcript-of-broadcast-on-nbcs-huntley: A-B'
  - cite:
      id: cal.1963-09-10.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.20 (McNamara: "We have been trying to overthrow Diem, but we have no alternatives I am aware of....We should go back to what we were doing three weeks ago"; Harriman against; Taylor and McCone with McNamara)'
  - cite:
      id: cal.1963-09-11.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at n.21 (and Bundy to Rusk: the President inclined to think it the most powerful assessment he had seen)'
      units: 'A-B'
  - src:
      id: cal.1963-09-11.vietnam
