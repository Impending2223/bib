  - cite:
      id: cal.1963-08-26.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.8–11 (Aug. 26: Kennedy against removing Diệm and Nhu for "media pressure"; Taylor against a coup; McNamara''s two questions for Lodge; Kennedy to Hilsman on Nolting, "Maybe logically." Aug. 27: Colby, Krulak; Kennedy, no coup unless likely to succeed. Aug. 28, noon: McNamara, not to go on "as if propelled by momentum"; Ball, Harriman for a coup; Nolting against)'
      units: 'A'
