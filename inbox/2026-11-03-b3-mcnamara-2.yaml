  - add:
      entry:
        id: cal.1963-09-25.vietnam
        when: Sept. 25
        date: '1963-09-25'
        thread: vietnam
        also: [press-and-broadcasting]
        c: 'McNamara on *CBS Reports*, "McNamara and the Pentagon," with Harry Reasoner, the eve of his departure for Saigon: the government''s actions may have alienated important elements of the population. "It is important to recognize it''s a South Vietnamese war. It will be won or lost depending upon what they do."'
        n: '[[w.mcnamara-in-retrospect]], ch. 3 at n.30. To check: *CBS Reports*, "McNamara and the Pentagon," Sept. 25, 1963, *Public Statements of Robert S. McNamara*, 1963, V, 2315–16 (cited by [[w.mcnamara-in-retrospect]], ch. 3 n.30). See [[cal.1963-09-21.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1963-09-26.vietnam
        when: Sept. 26
        date: '1963-09-26'
        thread: vietnam
        c: 'Saigon. McNamara with P. J. Honey of the School of Oriental and African Studies, once for Diệm: Diệm aged and slowed; the regime cannot be liberalized; the war cannot be won with it. A coup or assassination an even chance of something better.'
        n: '[Report by the Secretary of Defense, Sept. 26, 1963, FRUS 1961–63, IV, doc. 150](https://history.state.gov/historicaldocuments/frus1961-63v04/d150). [[w.mcnamara-in-retrospect]], ch. 3 at n.32 (the even chance, "fifty-fifty"). See [[cal.1963-09-21.vietnam]]. Names: McNamara, Ngô Đình Diệm.'
        tags: [name:mcnamara-robert-s, name:ngo-dinh-diem, place:saigon]
  - cite:
      id: cal.1963-09-29.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.34–36 (three hours, then a formal dinner; Nhu absent; Diệm rises to Madame Nhu''s defense; McNamara: "This is not satisfactory")'
      units: 'A-C'
  - src:
      id: cal.1963-09-29.vietnam
      rows:
        - 'via x.1963-09-29.memcon-sept-29-1963-frus-1961: A-C'
  - add:
      entry:
        id: cal.1963-09-30.vietnam
        when: Sept. 30
        date: '1963-09-30'
        thread: vietnam
        c: 'Saigon. McNamara with the papal delegate, Monsignor Asta: under the calm "a ''turning of the screw''"; a police state, torture; students and intellectuals turning to the Viet Cong and to neutralism. If Nhu takes power he will ask the Americans to leave and deal with the Communists.'
        n: '[Memorandum of a conversation by the Secretary of Defense, Saigon, Sept. 30, 1963, FRUS 1961–63, IV, doc. 160](https://history.state.gov/historicaldocuments/frus1961-63v04/d160) (the screw). [[w.mcnamara-in-retrospect]], ch. 3 at n.33. See [[cal.1963-09-21.vietnam]]. Names: McNamara, Ngô Đình Nhu.'
        tags: [name:mcnamara-robert-s, name:ngo-dinh-nhu, place:saigon]
  - add:
      entry:
        id: cal.1963-10-01.vietnam
        when: Oct. 1
        date: '1963-10-01'
        thread: vietnam
        c: 'Taylor to Diệm, letter: the Viet Cong in the north and center "can be reduced to little more than sporadic incidents by the end of 1964"; the Delta by the end of 1965, if the conditions McNamara set are met.'
        n: '[Taylor to Diệm, Oct. 1, 1963, FRUS 1961–63, IV, doc. 163](https://history.state.gov/historicaldocuments/frus1961-63v04/d163). [[w.mcnamara-in-retrospect]], ch. 3 at n.35 (the dates; McNamara quotes "sporadic elements"). See [[cal.1963-09-29.vietnam]]. Names: Taylor, Ngô Đình Diệm, McNamara.'
        tags: [name:taylor-maxwell, name:ngo-dinh-diem, name:mcnamara-robert-s]
  - cite:
      id: cal.1963-10-02.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 3 at nn.37–40 (the hour''s briefing that morning: "we must have a means of disengaging from this area"; the NSC in the evening; Kennedy objects to "by the end of the year"; the statement released by Salinger)'
      units: 'A-D'
  - src:
      id: cal.1963-10-02.vietnam
      rows:
        - 'via x.1963-10-02.mcnamara-and-taylor-report-of-mcnamara: A'
