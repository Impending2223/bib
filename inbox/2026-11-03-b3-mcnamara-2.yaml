  - add:
      entry:
        id: cal.1965-02-19.vietnam-3
        when: Feb. 19
        date: '1965-02-19'
        thread: vietnam
        c: 'Johnson decides that regular strikes against the North will begin. Against McGeorge Bundy''s advice, no public announcement.'
        n: '[[w.mcnamara-in-retrospect]], ch. 7 at nn.6–8. Check: the record of the decision. See [[cal.1965-02-07.vietnam-2]]. Names: Johnson, Bundy.'
        tags: [name:johnson-lyndon-b, name:bundy-mcgeorge]
  - cite:
      id: cal.1965-02-23.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 7 at n.6 (Rusk: "Negotiation as a cover for the abandonment of Southeast Asia to the Communist North cannot be accepted")'
      units: 'A'
