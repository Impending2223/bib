patch: b3-mcnamara-2
by: batch-3 reader, defense group (McNamara, In Retrospect; Clifford, Counsel to the President, witnesses)
ops:
  # === Ch. 1: the appointment, the missile gap, the Bay of Pigs (no notes after n.1: McNamara's recollection) ===
  - add:
      entry:
        id: cal.1960-12-08.transition-and-staff-cabinet-2
        when: Dec. 8
        date: '1960-12-08'
        thread: transition-and-staff-cabinet
        c: 'Robert Kennedy calls McNamara at the Ford Motor Company''s headquarters in Dearborn, about 11 a.m.: Shriver to see him that day. Shriver, at 4 p.m., offers the Treasury, then Defense; McNamara: "I''m not qualified." He agrees to see Kennedy in Washington the next day.'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. See [[cal.1960-11.transition-and-staff-cabinet]]. Names: Robert Kennedy, McNamara, Shriver, Kennedy.'
        tags: [name:kennedy-robert-f, name:mcnamara-robert-s, name:shriver-r-sargent, name:kennedy-john-f]
  - cite:
      id: cal.1960-12-08.transition-and-staff-cabinet
      item: '[[w.mcnamara-in-retrospect]], ch. 1 (the first meeting; McNamara: "I am not qualified"; Kennedy: there are no schools for defense secretaries, and none for presidents)'
      units: 'A, C-D'
  - check:
      id: cal.1960-12-08.transition-and-staff-cabinet
      text: 'Check: McNamara has Shriver offer the Treasury, then Defense, at Dearborn on Thursday, Dec. 8 ([[cal.1960-12-08.transition-and-staff-cabinet-2]]), and Kennedy offer Defense alone at the N Street house the next day, Dec. 9, McNamara proposing that Gates stay on (ch. 1).'
  - cite:
      id: cal.1960-12-13.transition-and-staff-cabinet
      item: '[[w.mcnamara-in-retrospect]], ch. 1 (the letter, carried to the N Street house on the Tuesday; the announcement on the front stoop)'
      units: 'A-B'
  - check:
      id: cal.1960-12-13.transition-and-staff-cabinet
      text: 'Check: McNamara has Kennedy read the letter and hand it to Robert Kennedy: "I think it''s great"; Kennedy: "So do I. Let''s announce it" (ch. 1).'
  - add:
      entry:
        id: cal.1960-12.transition-and-staff-cabinet-5
        when: Dec.
        date: 1960-12
        thread: transition-and-staff-cabinet
        c: 'McNamara refuses Franklin D. Roosevelt Jr. for Secretary of the Navy, by McNamara''s account: "a playboy and totally unqualified." Kennedy: Roosevelt "played a major role" in West Virginia; "I guess I''ll have to take care of him some other way."'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day; McNamara puts it four or five days after the first reports that Roosevelt would be named. See [[cal.1960-11.transition-and-staff-cabinet]]. Names: McNamara, Franklin D. Roosevelt Jr., Kennedy.'
        tags: [name:mcnamara-robert-s, name:roosevelt-franklin-d-jr, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1960-12.transition-and-staff-cabinet-6
        when: Dec.
        date: 1960-12
        thread: transition-and-staff-cabinet
        c: 'At Christmas, from Aspen, Colo., McNamara proposes Connally for Secretary of the Navy to Kennedy in Florida. Kennedy puts Johnson and Rayburn on the line, then: "Bob, I am delighted."'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day. See [[cal.1960-11.transition-and-staff-cabinet]]. Names: McNamara, Connally, Kennedy, Johnson, Rayburn.'
        tags: [name:mcnamara-robert-s, name:connally-john, name:kennedy-john-f, name:johnson-lyndon-b, name:rayburn-sam]
  - cite:
      id: cal.1961-02-06.defense
      item: '[[w.mcnamara-in-retrospect]], ch. 1 (the backgrounder, early afternoon, Sylvester''s ground rules: "if there was a gap, it was in our favor," after days with Gilpatric over the air force''s photographs; the *Evening Star* that afternoon, the *Times*'' front page the next morning)'
      units: 'A-B'
  - add:
      entry:
        id: cal.1961-02.republican-party-congress
        when: Feb.
        date: 1961-02
        thread: republican-party-congress
        also: [defense]
        c: 'After the missile-gap story, Dirksen calls for McNamara''s resignation and asks for a rerun of the presidential election, by McNamara''s account.'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day and Dirksen''s words. See [[cal.1961-02-06.defense]]. Names: Dirksen, McNamara.'
        tags: [name:dirksen-everett, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1961-02.defense-2
        when: Feb.
        date: 1961-02
        thread: defense
        c: 'McNamara offers Kennedy his resignation over the missile-gap story. Kennedy: "Oh, come on, Bob, forget it....It''ll blow over."'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day. See [[cal.1961-02-06.defense]]. Names: McNamara, Kennedy.'
        tags: [name:mcnamara-robert-s, name:kennedy-john-f]
  - add:
      entry:
        id: cal.1961-02.defense-3
        when: Feb.
        date: 1961-02
        thread: defense
        c: 'McNamara''s list of over a hundred studies for the department, "Ninety-nine Trombones": the threats, the forces to meet them, the major weapons, the nuclear strike plan.'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1961-03-28.defense
      item: '[[w.mcnamara-in-retrospect]], ch. 1 (the special defense message, "at the end of March"; $650 million more, for nonnuclear forces)'
      units: 'A, C'
  - cite:
      id: cal.1961-04-04.cuba
      item: '[[w.mcnamara-in-retrospect]], ch. 1 (the meeting at State, some twenty present; Fulbright alone against; McNamara for)'
      units: 'B-C, E'
  - check:
      id: cal.1961-04-04.cuba
      text: 'Check: McNamara has Rusk, "though not enthusiastic," say yes, as he did, and all the Joint Chiefs endorse the plan (ch. 1).'
  - add:
      entry:
        id: cal.1961-04-22.cuba-bay-of-pigs
        when: Apr. 22
        date: '1961-04-22'
        thread: cuba-bay-of-pigs
        c: 'McNamara to Kennedy in the Oval Office: he will go on television and say that all the advisers but one recommended the invasion. Kennedy: "I am the president. I did not have to do what all of you recommended....I am responsible."'
        n: '[[w.mcnamara-in-retrospect]], ch. 1. Check: the day: "the next day," after Kennedy took responsibility on television, by McNamara''s account. See [[cal.1961-04-21.cuba]]. Names: McNamara, Kennedy.'
        tags: [name:mcnamara-robert-s, name:kennedy-john-f]
  # === Ch. 2: Jan. 19, 1961-Aug. 23, 1963 ===
  - cite:
      id: cal.1961-01-19.laos
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.5–9 (the meeting, its emphasis on Laos; the accounts: Clifford''s memorandum, Eisenhower "willing, ''as a last desperate hope, to intervene unilaterally''"; McNamara''s, "President Eisenhower advised against unilateral action by the United States in connection with Laos")'
      units: 'A-C'
  - src:
      id: cal.1961-01-19.laos
