  - cite:
      id: cal.1965-11-03.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.16–17 (the first rough draft of Nov. 3, sent to the President Nov. 7: 350,000 by the end of 1966; a pause of a month; killed in action 500–800 a month; "the odds are even" of "stagnation at a higher level")'
      units: 'A-C'
  - src:
      id: cal.1965-11-03.vietnam-2
      rows:
        - 'via x.1965-11-03.mcnamara-draft-memorandum-for-the-president: A-C'
  - cite:
      id: cal.1965-11-14.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.18–19 (Nov. 14–19, the Ia Drang Valley; the first major battle between American and North Vietnamese forces)'
      units: 'A, D'
  - check:
      id: cal.1965-11-14.vietnam
      text: 'Check: McNamara counts over 1,300 North Vietnamese dead and 300 Americans killed, Nov. 14–19 (ch. 8).'
  - cite:
      id: cal.1965-11-23.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.19 (200,000 more in 1966, 410,000 by its end)'
      units: 'A'
  - src:
      id: cal.1965-11-23.vietnam-force-levels
      rows:
        - 'via x.1965-11-23.westmoreland-to-cincpac-41485-nov-23: A'
  - check:
      id: cal.1965-11-23.vietnam-force-levels
      text: 'Check: McNamara reads the cable as asking 200,000 more troops in 1966, 410,000 by the end of 1966 (ch. 8 at n.19).'
  - cite:
      id: cal.1965-11-24.vietnam-pause
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.22–23'
      units: 'A'
  - cite:
      id: cal.1965-11-28.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.19–20 (Nov. 28–29, with Lodge, Westmoreland, Wheeler and Sharp)'
      units: 'A'
  - add:
      entry:
        id: cal.1965-11-29.vietnam
        when: Nov. 29
        date: '1965-11-29'
        thread: vietnam
        c: 'McNamara to the press, leaving Saigon: "We have stopped losing the war," but the enemy has more than offset his losses; infiltration up, a decision by Hanoi to raise the level of conflict. "It will be a long war."'
        n: '[[w.mcnamara-in-retrospect]], ch. 8 at n.20. To check: remarks to the press upon departing Saigon, Nov. 29, 1965 (cited by [[w.mcnamara-in-retrospect]], ch. 8 n.20). See [[cal.1965-11-28.vietnam]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s, place:saigon]
  - cite:
      id: cal.1965-11-30.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.21 (two choices: a compromise, or Westmoreland''s requests and more bombing; killed in action up to 1,000 a month; a "no decision" in early 1967)'
      units: 'A-B'
  - src:
      id: cal.1965-11-30.vietnam
      rows:
        - 'via x.1965-11-30.mcnamara-to-johnson-nov-30-1965-2: A-B'
  - add:
      entry:
        id: cal.1965-12-03.press-and-broadcasting
        when: Dec. 3
        date: '1965-12-03'
        thread: press-and-broadcasting
        also: [vietnam-support]
        c: 'Mary McGrory in the *Washington Star*: McNamara "regards recent peace demonstrations with neither alarm nor dismay." McNamara: "Our policies become stronger as the result of debate"; to Norman Thomas''s "save her soul": "Do you save your soul by pulling out of a situation, or do you save it by fulfilling your commitments?"'
        n: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.14–15. To check: *Washington Star*, Dec. 3, 1965. Names: McGrory, McNamara.'
        tags: [name:mcgrory-mary, name:mcnamara-robert-s]
  - cite:
      id: cal.1965-12-07.vietnam-pause-2
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.25 (Rusk, Bundy and McNamara to Texas; Johnson: "We''re getting deeper and deeper in. I bogged my car down")'
      units: 'A'
  - cite:
      id: cal.1965-12-18.vietnam-pause
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.26'
      units: 'A'
  - cite:
      id: cal.1965-12-24.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 (the thirty-hour ceasefire from Christmas Eve, the bombing of the North halted)'
      units: 'C'
  - check:
      id: cal.1965-12-24.vietnam
      text: 'Check: McNamara has the White House and Saigon announce the ceasefire Dec. 22 (ch. 8).'
  - add:
      entry:
        id: cal.1965-12-26.vietnam-pause
        when: Dec. 26
        date: '1965-12-26'
        thread: vietnam-pause
        c: 'McNamara, from the Mountain Chalet at Aspen, Colo., through the lodge''s operator, to Johnson at a friend''s house in Round Mountain, Tex.: may he come to the Ranch alone to discuss Vietnam? Johnson agrees.'
        n: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.26–27. See [[cal.1965-12-24.vietnam]]. Names: McNamara, Johnson.'
        tags: [name:mcnamara-robert-s, name:johnson-lyndon-b]
  - cite:
      id: cal.1965-12-27.vietnam-pause
      item: '[[w.mcnamara-in-retrospect]], ch. 8 (from Grand Junction by an Air Force jet, at the Ranch at 6:30 p.m.; dinner with the Johnsons and Luci; three hours by the fire; Johnson agrees to extend the pause indefinitely and mount a diplomatic effort; Rusk, against it, goes along)'
      units: 'A'
  - cite:
      id: cal.1965-12-28.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 (calls from the Ranch''s office after breakfast: Harriman to Eastern Europe, Ball to coordinate, Goldberg to U Thant and the Pope; McNamara back to Aspen after noon)'
      units: 'A, C'
  - cite:
      id: cal.1966-01-12.vietnam-air-war
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.29 (to resume and intensify the bombing, the lines from China included: "bring the enemy to the conference table or cause the insurgency to wither from lack of support")'
      units: 'A'
  - src:
      id: cal.1966-01-12.vietnam-air-war
      rows:
        - 'via x.1966-01-12.cincpac-120205z-sharp-to-the-joint-chiefs: A'
  - cite:
      id: cal.1966-01-17.vietnam-pause
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.33 (McNamara: continue the pause through Tet, "a reasonable time")'
      units: 'A-B'
  - src:
      id: cal.1966-01-17.vietnam-pause
      rows:
        - 'via x.1966-01-17.johnson-and-mcnamara-telephone-conversation-jan: A-B'
  - cite:
      id: cal.1966-01-18.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at nn.29–31 (the Chiefs'' concurrence with Sharp; the same day, an analysis: 4,500 men a month could still come down, despite December''s tonnage, half again the Korean War''s peak month)'
      units: 'A'
  - cite:
      id: cal.1966-01-28.vietnam-pause
      item: '[[w.mcnamara-in-retrospect]], ch. 8 at n.34 (Clifford, Arthur Dean, Allen Dulles and McCloy for resuming the bombing and more troops)'
      units: 'A'
  - src:
      id: cal.1966-01-28.vietnam-pause
      rows:
        - 'via x.1966-01-28.valenti-notes-of-the-meeting-of: A'
  - src: {id: cal.1965-11-29.vietnam, rows: ['via x.1965-11-29.mcnamara-remarks-to-the-press-departing-saigon: all']}
  - add:
      entry:
        id: cal.1965-12-02.vietnam-pause-2
        when: Dec. 2
        date: '1965-12-02'
        thread: vietnam-pause
        c: 'Johnson and McNamara by telephone, recorded, Johnson at the Ranch. McNamara: since Saigon "more and more convinced that we ought definitely to think of some action other than military action as the only program"; raise the budgets and the deployments to meet Westmoreland, but "if we do that by itself, it''s suicide."'
        n: '[[w.mcnamara-in-retrospect]], ch. 8 at n.24 (Tape 6512.01, PNO 5). To check: [Conversation with Robert McNamara, Dec. 2, 1965, 12:15 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-mcnamara-december-2-1965), Conversation WH6512-01-9305 (Miller Center). Check: McNamara has the call "on the afternoon"; the catalogue gives 12:15 p.m. See [[cal.1965-11-30.vietnam]]. Names: Johnson, McNamara, Westmoreland.'
        tags: [name:johnson-lyndon-b, name:mcnamara-robert-s, name:westmoreland-william]
  - src: {id: cal.1965-12-02.vietnam-pause-2, rows: ['via x.1965-12-02.johnson-and-mcnamara-recording-12-15-p-m: all']}
  # === Ch. 9: Jan. 31, 1966-May 19, 1967 ===
  - cite:
      id: cal.1966-01-24.vietnam-force-levels
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at n.3 (the Communists'' decision to go on, time on their side; even with the deployments, "a military standoff at a much higher level" possible in early 1967)'
      units: 'A'
  - src:
      id: cal.1966-01-24.vietnam-force-levels
      rows:
        - 'via x.1966-01-24.mcnamara-to-johnson-the-military-outlook: A'
  - add:
      entry:
        id: cal.1966-04-23.vietnam-force-levels
        when: Apr. 23
        date: '1966-04-23'
        thread: vietnam-force-levels
        c: 'Wheeler to McNamara, by hand: "There have been no shortages in supplies for the troops in Vietnam which have adversely affected combat operations or the health or welfare of the troops."'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at n.6. To check: Wheeler to McNamara, Apr. 23, 1966, Robert S. McNamara Papers, Department of Defense (cited by [[w.mcnamara-in-retrospect]], ch. 9 n.6). Names: Wheeler, McNamara.'
        tags: [name:wheeler-earle, name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1966-05-22.students
        when: May 22
        date: '1966-05-22'
        thread: students
        c: 'McNamara''s commencement address at Chatham College, his daughter Kathy graduating; picketers hoot him.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at n.19. To check: commencement address at Chatham College, May 22, 1966, *Public Statements of Robert S. McNamara*, 1966, VII, 2333 (cited by [[w.mcnamara-in-retrospect]], ch. 9 n.19). Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - add:
      entry:
        id: cal.1966-06.students
        when: June
        date: 1966-06
        thread: students
        c: 'In one week, faculty and students at Amherst College and New York University walk out as McNamara receives honorary degrees.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.19–20. Check: the days. See [[cal.1966-05-22.students]]. Names: McNamara.'
        tags: [name:mcnamara-robert-s]
  - cite:
      id: cal.1966-06-29.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.9–10 (authorized "in late June"; the loss hindered the North only a short time: dispersed fuel, more by rail from China and from Soviet tankers)'
      units: 'A'
  - add:
      entry:
        id: cal.1966-08.students
        when: Aug.
        date: 1966-08
        thread: students
        c: 'Seattle''s airport, McNamara and his family back from climbing Mount Rainier with Jim and Lou Whittaker: a man shouts "Murderer!" and spits on him.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.20–21. Check: the day. Names: McNamara.'
        tags: [name:mcnamara-robert-s, city:seattle]
  - cite:
      id: cal.1966-09-22.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at n.14 (stop "all bombing of North Vietnam the moment we are assured, privately or otherwise, that this step will be answered promptly by a corresponding and appropriate de-escalation")'
      units: 'A'
  - add:
      entry:
        id: cal.1966-10-09.press-and-broadcasting
        when: Oct. 9
        date: '1966-10-09'
        thread: press-and-broadcasting
        also: [vietnam]
        c: 'Neil Sheehan in the *New York Times Magazine*, "Not a Dove, but No Longer a Hawk": after his second tour, for the *Times*, 1965–66, he was "naive in believing the non-communist Vietnamese could defeat the Communist insurgency and build a decent and progressive social structure."'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.21–22. To check: *New York Times Magazine*, Oct. 9, 1966. Names: Sheehan.'
        tags: [name:sheehan-neil]
  - cite:
      id: cal.1966-10-10.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.27–29'
      units: 'A'
  - cite:
      id: cal.1966-10-14.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.8, 27–29 (military operations and pacification under one command first urged, then a clearer line of command, the ambassador keeping it)'
      units: 'A'
  - src:
      id: cal.1966-10-14.vietnam
      rows:
        - 'via x.1966-10-14.mcnamara-to-johnson-oct-14-1966: A'
  - add:
      entry:
        id: cal.1966-11-07.students
        when: Nov. 7
        date: '1966-11-07'
        thread: students
        c: 'Harvard. McNamara, after the Business School and the undergraduates at Quincy House, leaving for Kissinger''s seminar: a crowd of several hundred surrounds and rocks his car on Mill Street. He answers questions from its hood with Michael Ansara of Students for a Democratic Society, then leaves by the tunnels, Barney Frank guiding him.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.20–21 (Dean Munro''s apology, the next day). See [[cal.1966-08.students]]. Names: McNamara, Kissinger.'
        tags: [name:mcnamara-robert-s, name:kissinger-henry-a]
  - add:
      entry:
        id: cal.1966-11-07.vietnam-2
        when: Nov. 7
        date: '1966-11-07'
        thread: vietnam
        c: 'Cambridge, at dinner with Neustadt and other Harvard faculty: McNamara says future scholars will wish to study why the war is not going as hoped, and the study should be made easier. The thought that led to the Pentagon Papers, by his account.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.20–21. See [[cal.1966-11-07.students]]. Names: McNamara, Neustadt.'
        tags: [name:mcnamara-robert-s, name:neustadt-richard-e]
  - cite:
      id: cal.1966-12-02.vietnam-marigold
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at n.13 (raids around Hanoi Dec. 2 and 4, planned for Nov. 10 and put off for weather; the meeting at Warsaw set for Dec. 5)'
      units: 'A-B'
  - cite:
      id: cal.1967-01-10.vietnam-sunflower
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at n.15 (Guthrie with the North Vietnamese chargé, "Le Chang" in McNamara''s spelling, Jan. 10: he listens, nervous, silent)'
      units: 'A'
  - cite:
      id: cal.1967-02-06.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at n.16 (Kosygin in London from Feb. 6, the Tet pause begun; Trinh''s statement)'
      units: 'A-B'
  - cite:
      id: cal.1967-04-27.vietnam-program-5
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.30–31 (Westmoreland''s estimates: two, three or five years with 200,000 more, 100,000 more, or 470,000; Wheeler: all worthwhile fixed targets but the ports soon struck)'
      units: 'A-C'
  - src:
      id: cal.1967-04-27.vietnam-program-5
      rows:
        - 'via x.1967-04-27.mcnaughton-notes-on-discussions-with-the: A-C'
  - cite:
      id: cal.1967-05-02.vietnam-2
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.31–32 (McNamara: reject the Chiefs'' wider bombing but the power plants; limit it below the twentieth parallel)'
      units: 'A-C'
  - cite:
      id: cal.1967-05-19.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 9 at nn.33–34 (the memorandum quoted at length; Rostow: "dangerously strong feelings")'
      units: 'A-C'
  - src:
      id: cal.1967-05-19.vietnam
      rows:
        - 'via x.1967-05-19.pentagon-papers-vol-4-pp-169: A-C'
  - add:
      entry:
        id: cal.1967-05-23.vietnam
        when: May 23
        date: '1967-05-23'
        thread: vietnam
        c: 'The CIA, "The Situation in Vietnam: An Analysis and Estimate": "Despite increasingly effective ''search and destroy'' operations...the Vietnamese Communists have continued to expand their Main Forces, both by infiltration and by local recruitment." Westmoreland holds the crossover point reached.'
        n: '[[w.mcnamara-in-retrospect]], ch. 9 at n.4. To check: CIA Memorandum SC No. 01399/67, May 23, 1967, 1–2 (cited by [[w.mcnamara-in-retrospect]], ch. 9 n.4). See [[cal.1967-05-19.vietnam]]. Names: Westmoreland.'
        tags: [name:westmoreland-william]
  - src: {id: cal.1966-04-23.vietnam-force-levels, rows: ['via x.1966-04-23.wheeler-to-mcnamara-handwritten-note: all']}
  - src: {id: cal.1966-05-22.students, rows: ['via x.1966-05-22.mcnamara-commencement-address-chatham-college: A']}
  - src: {id: cal.1967-05-23.vietnam, rows: ['via x.1967-05-23.cia-memorandum-sc-01399-67-the-situation-in-vietnam: A']}
  # === Ch. 10: May 20, 1967-Feb. 29, 1968 ===
  - cite:
      id: cal.1967-06-05.middle-east
      item: '[[w.mcnamara-in-retrospect]], ch. 10 (at the Pentagon from 7 a.m.; within the hour the War Room''s general: Kosygin on the hot line; McNamara has it patched to the Situation Room and calls the President)'
      units: 'A'
  - cite:
      id: cal.1967-06-12.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.6 (McNamara and Vance against the Chiefs'' plan: "Nothing short of toppling the Hanoi regime will pressure North Vietnam to settle")'
      units: 'A'
  - add:
      entry:
        id: cal.1967-06.vietnam-pennsylvania
        when: June
        date: 1967-06
        thread: vietnam-pennsylvania
        c: 'McNamara, back on a Monday in mid-June, finds Kissinger''s cable from the Pugwash meeting in Paris: Marcovich ready to open a contact with Hanoi. McNamara and McNaughton: explore it "in ways that won''t involve costs or risks." At the Tuesday lunch the next day, Rusk and Johnson: "just another of those blind alleys." McNamara pursues it.'
        n: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.24–25. Check: the days. See [[cal.1967-07-21.vietnam]]. Names: McNamara, Kissinger, Marcovich, McNaughton, Rusk, Johnson.'
        tags: [name:mcnamara-robert-s, name:kissinger-henry-a, name:marcovich-hebert, name:mcnaughton-john-t, name:rusk-dean, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1967-06-17.vietnam
        when: June 17
        date: '1967-06-17'
        thread: vietnam
        c: 'At McNamara''s request through McNaughton, the collection of documents on Vietnam for future scholars begins, under Leslie Gelb of International Security Affairs: memoranda, papers and cables from Defense, State, the CIA and the White House. By early 1969, a study of 7,000 pages, the Pentagon Papers.'
        n: '[[w.mcnamara-in-retrospect]], ch. 10 at n.7. Check: McNamara gives the asking as June 1967, the start June 17. See [[cal.1966-11-07.vietnam-2]]. Names: McNamara, McNaughton, Gelb.'
        tags: [name:mcnamara-robert-s, name:mcnaughton-john-t, name:gelb-leslie-h]
  - cite:
      id: cal.1967-07-07.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.8 (with Katzenbach and Wheeler; optimistic briefings from Westmoreland and Bunker)'
      units: 'A-B'
  - cite:
      id: cal.1967-07-12.vietnam-program-5
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.9 (Johnson: "Are we going to be able to win this goddamned war?")'
      units: 'A'
  - cite:
      id: cal.1967-07-21.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.25–27 (Aubrac and Marcovich in Hanoi from July 21; Hồ ill, sees Aubrac; Phạm Văn Đồng: "We want an unconditional end of bombing")'
      units: 'A'
  - cite:
      id: cal.1967-08-08.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.26 (McNamara: Kissinger''s cable "the most interesting message on the matter of negotiations")'
      units: 'A'
  - cite:
      id: cal.1967-08-09.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.10–20 (seven days in executive session, Aug. 9–29; Stennis, Symington, Jackson, Cannon, Byrd, Smith and others; Johnson to Wheeler later: "Your generals almost destroyed us with their testimony")'
      units: 'A-B'
  - cite:
      id: cal.1967-08-25.vietnam-air-war
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.13–18 (the objectives of the bombing; the limits of the air war; Cannon''s questions)'
      units: 'A'
  - cite:
      id: cal.1967-08-31.vietnam-air-war
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.18 (the unanimous report: "careful controls and restrictive ground rules had resulted in the application of our air power in a manner which was of limited effectiveness")'
      units: 'A'
  - add:
      entry:
        id: cal.1967-08-29.vietnam-air-war
        when: Aug. 29
        date: '1967-08-29'
        thread: vietnam-air-war
        c: 'Helms to Johnson, "Effects of the Intensified Air War Against North Vietnam": more than 10,000 sorties a month against the North since March, 55 percent over 1966, yet "Hanoi continues to meet its own needs and to support its aggression in South Vietnam. Essential military and economic traffic continues to move."'
        n: '[[w.mcnamara-in-retrospect]], ch. 10 at n.21. To check: Helms to Johnson, Aug. 29, 1967, and Rostow''s attachment (cited by [[w.mcnamara-in-retrospect]], ch. 10 n.21). See [[cal.1967-08-09.vietnam]]. Names: Helms, Johnson.'
        tags: [name:helms-richard, name:johnson-lyndon-b]
  - add:
      entry:
        id: cal.1967-09-12.vietnam
        when: Sept. 12
        date: '1967-09-12'
        thread: vietnam
        c: 'Helms to Johnson, in a sealed envelope, with a paper of Sept. 11 by an analyst of the Office of National Estimates, "Implications of an Unfavorable Outcome in Vietnam": "It has not been given and will not be given to any other official of the Government." McNamara never saw it in office, by his account.'
        n: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.22–23. To check: Helms to Johnson, Sept. 12, 1967, and "Implications of an Unfavorable Outcome in Vietnam," Sept. 11, 1967, Country File, Vietnam, box 259/260, NSF, LBJ Library (cited by [[w.mcnamara-in-retrospect]], ch. 10 nn.22–23). Made public: [[w.mcnamara-in-retrospect]] (1995), "only recently" declassified. Names: Helms, Johnson, McNamara.'
        tags: [name:helms-richard, name:johnson-lyndon-b, name:mcnamara-robert-s]
  - cite:
      id: cal.1967-09-12.vietnam-pennsylvania
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.30 (Johnson: why not stop the bombing if it led to prompt and productive discussions; Rusk: "Are we prepared to go through with a series of talks that may not be productive?")'
      units: 'A'
  - cite:
      id: cal.1967-09-20.war-opposition
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.38 (the march on the Pentagon known well ahead)'
      units: 'A'
  - cite:
      id: cal.1967-09-26.vietnam-pennsylvania
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at nn.30–34 (Katzenbach: dialogue for the first time since February, "the tone of the communications was less strident")'
      units: 'A'
  - cite:
      id: cal.1967-10-17.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 10 at n.41 ("I think your policy is as right as ever and that the weight of the evidence from the field is encouraging")'
      units: 'A'
  - cite:
