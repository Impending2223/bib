  - cite:
      id: cal.1961-05-11.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.9–10 (Gilpatric''s task force; Kennedy authorizes 100 more advisers and 400 Special Forces men)'
      units: 'A'
  - check:
      id: cal.1961-05-11.vietnam
      text: 'Check: McNamara has the task force set up in March and its report presented May 8 (ch. 2).'
  - cite:
      id: cal.1961-08-29.laos
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.10 (Rusk for diplomacy and readiness under SEATO''s plan, some 30,000 troops; McNamara: Laos weighed against Berlin and six divisions for Europe, no war in Southeast Asia without total mobilization; Kennedy: no commitment to the plan "without regard to whatever else might happen in the world")'
      units: 'A'
  - src:
      id: cal.1961-08-29.laos
      rows:
        - 'via x.1961-08-29.memorandum-of-conversation-meeting-on-southeast: A'
  - cite:
      id: cal.1961-11-03.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.11 (the report: more advisers, equipment, small numbers of combat troops; "transition from advice to partnership")'
      units: 'A-B'
  - src:
      id: cal.1961-11-03.vietnam
      rows:
        - 'via x.1961-11-03.taylor-paper-attachment-1-the-taylor: A-B'
  - cite:
      id: cal.1961-11-08.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at n.12 (the memorandum, for the Chiefs and Gilpatric: "inclined to recommend" the commitment and the means)'
      units: 'A'
  - src:
      id: cal.1961-11-08.vietnam
      rows:
        - 'via x.1961-11-08.mcnamara-to-kennedy-nov-8-1961-4: A'
  - cite:
      id: cal.1961-11-11.vietnam
      item: '[[w.mcnamara-in-retrospect]], ch. 2 at nn.13–14 (the joint memorandum: "if there is not such an effort, U.S. forces could not accomplish their mission in the midst of an apathetic or hostile population"; Kennedy at the meeting refuses combat forces)'
      units: 'A, C'
  - src:
      id: cal.1961-11-11.vietnam
      rows:
        - 'via x.1961-11-11.rusk-and-mcnamara-to-kennedy-nov: A'
        - 'via x.1961-11-11.lemnitzer-notes-of-a-meeting-at: C'
  - cite:
      id: cal.1961-11-15.vietnam
