  # === Appendix: the Cuban missile crisis, as learned 1989-92 ===
  - add:
      entry:
        id: cal.1962-10-26.missile-crisis-4
        when: Oct. 26
        date: '1962-10-26'
        thread: missile-crisis
        also: [soviet-union]
        c: 'Cuba. Soviet nuclear warheads moved from their storage sites to positions closer to their delivery vehicles, against an American invasion. By the Russian accounts of 1992, 162 warheads on the island, at least 90 of them tactical.'
        n: '[[w.mcnamara-in-retrospect]], appendix at n.2. Made public: Anatoly Dokochaev, "Afterword to Sensational 100 Day Nuclear Cruise," *Krasnaya Zvezda*, Nov. 6, 1992, 2; V. Badurkin, interview with Dimitri Volkogonov, "Operation Anadyr," *Trud*, Oct. 27, 1992, 3 (cited by [[w.mcnamara-in-retrospect]], appendix n.2). See [[cal.1962-10-26.missile-crisis]].'
  - cite:
      id: cal.1962-10-27.soviet-union
      item: '[[w.mcnamara-in-retrospect]], appendix at n.2 (Pliyev''s cable to Malinovsky, the day after the warheads were moved; sent on to Khrushchev, returned "Approved")'
      units: 'A'
  - check:
      id: cal.1962-10-27.soviet-union
      text: 'Check: McNamara, from the Russian press of 1992, has Pliyev''s cable report the warheads moved closer to their delivery vehicles on Oct. 26, and Khrushchev write "Approved" across it (appendix at n.2).'
  - src: {id: cal.1962-10-26.missile-crisis-4, rows: ['via x.1992-11-06.dokochaev-afterword-to-sensational-100-day-nuclear-cruise: all', 'via x.1992-10-27.badurkin-interview-with-volkogonov-operation-anadyr: all']}
