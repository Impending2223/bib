- cite:
    id: cal.1962-07-19.china-leadership
    item: '[[w.yang-shangkun-riji]], II, 196 (July 19, 1962; 下午3时听了无锡工作组的汇报，约1小时，主席处电话告去游泳池开会 ... 6时结束会议: the Wuxi team heard from 3 p.m. for about an hour, then the call to
      the pool; the meeting ended at 6 p.m.; the start, about 4 p.m., is inferred)'
    'on': time
- edit:
    id: cal.1962-07-18.middle-east
    base: ba6f1104
    set:
      c: Iran. The Shah accepts Amini's resignation and his Cabinet's and names Alam Prime Minister. The Embassy attributes Amini's fall to his failure to bring the operating
        budget's deficit down to manageable size; the deficit is at least $110–120 million.
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) and n.1 (July 19; "On July 18, the Shah of Iran accepted the resignation
        of Amini and his Cabinet and appointed Asadollah Alam"; Embassy Tehran telegram 78, July 18; the deficit). The resignation and the naming are one act in the record.
        Split under R17: State''s statement on aid is [[cal.1962-07-18.middle-east-2]]; Komer''s memorandum of July 18 is [[cal.1962-07-18.middle-east-3]]; Komer to Bundy of
        July 19 is [[cal.1962-07-19.middle-east]]. See [[cal.1961-05-04.middle-east]]. Names: Amini, Alam, Pahlavi.'
      tags:
      - name:amini-ali
      - name:alam-assadollah
      - name:pahlavi-mohammed-reza
    kind: correct
- add:
    entry:
      id: cal.1962-07-18.middle-east-2
      when: July 18
      date: '1962-07-18'
      place: washington
      thread: middle-east
      c: 'State''s press statement, after reports that Amini blames the lack of US support for his fall: the United States gave $67.3 million in grants and loans under Amini
        and committed $20 million more for a development loan.'
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) n.1 (Department of State telegram 50 to Tehran, July 18, which records
        the statement). Split under R17: the resignation is [[cal.1962-07-18.middle-east]]. See [[cal.1962-07-18.middle-east]]. Names: Amini. Check: the hour of the statement.'
      tags:
      - name:amini-ali
- add:
    entry:
      id: cal.1962-07-18.middle-east-3
      when: July 18
      date: '1962-07-18'
      place: washington
      thread: middle-east
      c: 'Komer to Kennedy: base policy on saving Amini, the only good Prime Minister Iran has had in years; Amini''s charges of too little US aid are wild; tell the Iranians
        to cover the budget gap with oil revenues and deficit financing, no new money until the budget is pared. The Shah''s refusal to back cuts in the military and civil
        budgets is the real cause. Sent to Bundy with a note: $87.3 million given or pledged to Amini, against a four-year average of $59.4 million.'
      n: 'FRUS 1961–63, XVIII, doc. [5](https://history.state.gov/historicaldocuments/frus1961-63v18/d5) (July 18, 1962; "No indication has been found that the memorandum was
        forwarded to President Kennedy"). See [[cal.1962-07-18.middle-east]]. Names: Komer, Amini, Pahlavi, Bundy, Kennedy.'
      tags:
      - name:komer-robert-w
      - name:amini-ali
      - name:pahlavi-mohammed-reza
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-07-19.middle-east
      when: July 19
      date: '1962-07-19'
      place: washington
      thread: middle-east
      c: 'Komer to Bundy: "We have lost Amini," at least temporarily. The Alam cabinet, tantamount to direct rule by the Shah, will be even less able to cut the deficit of
        at least $110–120 million. Holmes and State: let the Iranians come to us first. Komer and Gaud: tell them again to cover the gap themselves; the Shah to cut the military
        budget back to last year''s level. Komer asks whether Kennedy will say so.'
      n: 'FRUS 1961–63, XVIII, doc. [8](https://history.state.gov/historicaldocuments/frus1961-63v18/d8) (July 19, 1962). Split under R17: the resignation is [[cal.1962-07-18.middle-east]].
        See [[cal.1962-07-18.middle-east]]. Names: Komer, Bundy, Amini, Alam, Pahlavi, Kennedy, Holmes, Gaud.'
      tags:
      - name:komer-robert-w
      - name:bundy-mcgeorge
      - name:amini-ali
      - name:alam-assadollah
      - name:pahlavi-mohammed-reza
      - name:kennedy-john-f
- edit:
    id: cal.1962-07-20.economy
    base: d72baf4d
    set:
      c: Giscard d'Estaing with Kennedy, 10 a.m.; no record of the conversation found. Giscard says afterward that he told the President the French gold purchase was to raise
        the gold ratio of France's reserves from 65 to 70 percent and that Kennedy understood it as a contribution to stabilizing the US balance of payments.{1}
      n: 'FRUS 1961–63, XIII, doc. [258](https://history.state.gov/historicaldocuments/frus1961-63v13/d258) n.1 (Giscard "talked with the President at 10 a.m." by the President''s
        Appointment Book, Kennedy Library; "no other record of the conversation has been found") and text (Giscard to Ball that evening, of "their talk this morning"). [[w.gavin-gold-dollars-and-power]],
        78–80 (not reread). To check: Ball to Kennedy, "Visit of French Finance Minister," July 18, 1962, National Security Files, Kennedy Library; memorandum of conversation
        (luncheon), July 21, 1962 (cited by [[w.gavin-gold-dollars-and-power]], 78 n.70, 79 n.71). Split under R17: Giscard''s meeting with Ball at State, 6 p.m., is [[cal.1962-07-20.economy-3]].
        Names: Giscard d''Estaing, Kennedy.'
      time_zone: America/New_York
      src:
        c: f5c194ed
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v13/d258: 1'
        - 'w.gavin-gold-dollars-and-power 78–80: 1'
        - 'via w.gavin-gold-dollars-and-power 78 n.70: 1'
        - 'via w.gavin-gold-dollars-and-power 79 n.71b: 1'
      tags:
      - name:giscard-destaing-valery
      - name:kennedy-john-f
    kind: correct
- add:
    entry:
      id: cal.1962-07-20.economy-3
      when: July 20
      date: '1962-07-20'
      time_range:
      - 1962-07-20T22:00Z
      - 1962-07-20T22:50Z
      time_zone: America/New_York
      range_basis: record
      place: washington
      thread: economy
      also:
      - europe-and-the-alliance-france
      follows:
      - cal.1962-07-20.economy
      c: 'Giscard d''Estaing with Acting Secretary Ball at State, 6 to 6:50 p.m. Giscard: no unilateral change in the dollar''s parity; a secret approach among the United States,
        Britain, France, Germany and Italy under cover of the OECD, the creditors to abstain from buying gold and to hold their dollars for a time. Ball: minimum gold reserves,
        and a ratio of gold to dollars above them.'
      n: 'FRUS 1961–63, XIII, doc. [258](https://history.state.gov/historicaldocuments/frus1961-63v13/d258) (memorandum of conversation, Washington, July 20, 1962, 6–6:50 p.m.).
        [[w.gavin-gold-dollars-and-power]], 78–80 (not reread). Split under R25b: Giscard''s talk with Kennedy at 10 a.m. is [[cal.1962-07-20.economy]]. See [[cal.1962-07-20.economy]].
        Names: Giscard d''Estaing, Ball.'
      tags:
      - name:giscard-destaing-valery
      - name:ball-george-w
