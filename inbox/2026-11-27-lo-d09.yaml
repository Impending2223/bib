      c: Geneva 日内瓦. Chen Yi 陈毅 meets Krishna Menon again, in the morning. They appear to agree on resuming border talks and begin a joint statement; Menon cannot reach New
        Delhi, for "technical reasons," and it is not issued.
      n: '[[w.chen-yi-nianpu]], 926 (July 23, 1962: 上午，再次会见 ... 梅农: the morning, again meets Menon); [[w.jian-zhou-enlai]], 478 (Chen invites Menon to meet "the next day";
        "the next morning" they "clearly reached some form of agreement" and begin a joint statement; Menon unable to contact New Delhi). Split under R17: the first meeting
        is [[cal.1962-07-22.china-leadership-4]]. See [[cal.1962-07-22.china-leadership-4]]; [[cal.1962-07-23.china-leadership]]. Names: Chen Yi, Menon. Check: the year made
        public.'
      tags:
      - polity:prc
      - polity:india
      - vis:only:prc+india
      - name:chen-yi
      - name:menon-v-k-krishna
