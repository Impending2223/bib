- edit:
    id: cal.1962-07-22.china-leadership-4
    base: 857e6145
    set:
      when: July 22
      c: Geneva. Chen Yi seeks out Krishna Menon, India's chief delegate to the Laos conference, for informal discussions on the border.
      time_range:
      - 1962-07-22T11:00Z
      - 1962-07-22T17:00Z
      time_band: afternoon
      time_zone: Europe/Zurich
      range_basis: record
      n: '[[w.macfarquhar-origins-of-the-cultural]], III, 301; [[w.chen-yi-nianpu]], 926 (Chen Yi meets Menon the afternoon of July 22, and again the morning of July 23); [[w.jian-zhou-enlai]],
        478 (Chen, having met Menon that day, asks him to meet again next day; the next morning some agreement on resuming talks, a joint statement prepared, not issued, Menon
        unable to reach Delhi). Made public: 1968. To check: [[w.brecher-india-and-world-politics]], 170 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 301 n.29a);
        [[w.maxwell-indias-china-war]], 267 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 301 n.29b); [[w.bo-1962]], 185–6 (cited by [[w.macfarquhar-origins-of-the-cultural]],
        III, 301 n.29d); [[w.gopal-jawaharlal-nehru]], 213 (cited by [[w.macfarquhar-origins-of-the-cultural]], III, 301 n.30); [[w.chen-yun-nianpu-1905]], II, 926 (so printed)
        (cited by [[w.jian-zhou-enlai]], 478 n.63a); [[w.zedong-mao-zedong-nianpu]], V, 117 (cited by [[w.jian-zhou-enlai]], 478 n.63b); [[w.zhou-enlai-nianpu-1949]], II, 490
        (cited by [[w.jian-zhou-enlai]], 478 n.63c); [[w.li-lianqing-da-waijiaojia-zhou-enlai]], IV, 316 (cited by [[w.jian-zhou-enlai]], 478 n.63d); [[w.whiting-chinese-calculus-of-deterrence]],
        264 n.19 (cited by [[w.jian-zhou-enlai]], 478 n.64b); Arthur Lall''s review of Maxwell''s *India''s China War*, *The Asian Student*, November 27, 1971 (as Whiting quotes
        it) (cited by [[w.jian-zhou-enlai]], 478 n.64c). Split under R17: the second meeting, the morning of July 23, with the joint statement that was not issued, is [[cal.1962-07-23.china-india-war]].
        The hour: afternoon ([[w.chen-yi-nianpu]], 926: 7月22日 下午，会见 ... 梅农). Names: Chen Yi, Menon. Check: the days; Chen and Menon met July 22 and 23 by the Chen Yi chronology,
        at Chen''s request by Menon''s account.'
    kind: correct
- add:
    entry:
      id: cal.1962-07-23.china-india-war
      when: July 23
      date: '1962-07-23'
      place: geneva
      thread: china-india-war
