ops:
- edit:
    id: cal.1962-07-02.defense
    base: b4ec6f13
    set:
      c: 'Hershey, Pa., the Governors'' Conference, at the President''s urging. McNamara on the reserve reorganization: "far from diminishing the role of the reservist, it
        will give him a new and even more important part"; an hour and a half with the governors'' National Guard committee.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 112. Split under R17: the governors'' vote of July 3 is [[cal.1962-07-03.defense]]. Names: McNamara.'
    kind: correct
- add:
    entry:
      id: cal.1962-07-03.defense
      when: July 3
      date: '1962-07-03'
      place: hershey
      thread: defense
      also:
      - governors
      c: 'Hershey, Pa., the Governors'' Conference. By voice vote, no dissent, the governors adopt a resolution against the reserve reorganization plan: the National Guard
        to keep 400,000; McNamara to restudy it; no action in any State until the Guard''s advisory committee has gone over the details.'
      n: '[[w.kaplan-mcnamara-ascendancy-1961-1965]], 112 ("The next day, by voice vote without dissent"). To check: the resolution, 108 Cong. Rec. A5968 (Aug. 3, 1962) (cited
        by [[w.kaplan-mcnamara-ascendancy-1961-1965]], 112 n.64). Split under R17: McNamara''s address of July 2 is [[cal.1962-07-02.defense]]. See [[cal.1962-07-02.defense]].
        Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- edit:
    id: cal.1962-07-14.georgia-albany
    base: 9f9b4a5f
    set:
      c: 'Mayor Kelley: the Justice Department "collaborating and conspiring with the leaders of the Albany Movement ... to violate existing ordinances of the City of Albany."{1}
        The *Herald*: "City Will Not Back Down on Negro Issue."{4}'
      n: '[[w.branch-parting-the-waters]], 607 (Kelley''s words; the *Herald*''s headline). To check: *Albany Herald*, July 14 at 1 and July 15, 1962, at 1; [*New York Times*,
        July 15, 1962](https://timesmachine.nytimes.com/timesmachine/1962/07/15/issue.html), at 28 (cited by [[w.branch-parting-the-waters]], 607 nn.2, 4). Check: the day of
        Kelley''s statement: Branch cites the papers of July 15 for it (607). Split under R17: the Department''s denial is [[cal.1962-07-15.georgia-albany]]. See [[cal.1962-07-12.georgia-albany]].'
      src:
        c: 5874a875
        rows:
        - 'w.branch-parting-the-waters 607: 1, 4'
        - 'via w.branch-parting-the-waters 607 n.3a: 1'
        - 'via w.branch-parting-the-waters 607 n.3b: 1'
      tags:
      - state:ga
      - city:albany-ga
    kind: correct
    settles:
    - 'Check: the day of Kelley''s statement.'
- add:
    entry:
