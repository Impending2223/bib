        by [[w.branch-parting-the-waters]], 607). Check: the day and the form of the denial: whether Katzenbach''s letter of July 14 is it. Split under R17: Kelley''s charge
        is [[cal.1962-07-14.georgia-albany]]. See [[cal.1962-07-14.georgia-albany]]. Names: Katzenbach.'
      tags:
      - name:katzenbach-nicholas
      - state:ga
      - city:albany-ga
- edit:
    id: cal.1962-07-18.china-leadership
    base: 05225d9c
    set:
      c: 'Afternoon.{1} Mao to Yang Shangkun: whether to take the collective road or the individual one; and his dissatisfaction with the State Planning Commission and the
        Ministry of Commerce; "against dispersionism" again.{2} Yang''s diary that day: "I think the situation grave!! deeply uneasy."{3}'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 18, 1962; [[w.yang-shangkun-riji]], II, 195–196 (July 18, 1962; at the swimming pool, to 6:30 p.m.; at 9 p.m. Yang tells Zhou
        Enlai Mao''s points); [[w.mao-zedong-zhuan]], V, ch. 70 nn.29, 30 (July 18, afternoon, at the pool: Mao to Yang Shangkun: the collective road or the individual one,
        and against dispersionism, the Planning Commission and the Ministry of Commerce; Yang''s diary: "the situation grave" (II, 196)). [[w.jian-zhou-enlai]], 468 (July 18:
        Mao to Yang Shangkun on collective or private farming; unhappy with the Planning Commission and the Commerce Ministry under Zhou); [[w.chen-yun-nianpu-xiuding]], III,
        136 (Mao to Yang Shangkun: the collective road or the individual economy? Yang''s diary: "I feel the matter is very grave!! Most uneasy!"). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]]
        (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], V, ch. 70). Check: the year made public: the diary''s day ([[w.yang-shangkun-riji]], II, 195–196)
        stands, by the 2017 edition''s front matter, in its first edition, [[w.shangkun-yang-shangkun-riji-2]] (2001), not seen. Split under R17: the evening, when Yang sends
        for Zhou Enlai to tell him Mao''s points, is [[cal.1962-07-18.china-leadership-6]] (Yang, II, 195: after supper he rests until 9, then asks Zhou to come; [[w.jian-zhou-enlai]],
        468: at 9:00 p.m. that evening Yang relays "the chairman''s points"). Names: Mao Zedong, Zhou Enlai, Yang Shangkun.'
    kind: correct
