      c: The Justice Department denies Mayor Kelley's charge of collaborating with the Albany Movement. Katzenbach writes Kelley.
      n: '[[w.branch-parting-the-waters]], 607 ("a flurry of denials from the Justice Department"; Katzenbach to Kelley, July 14, 1962, Albany city records, is cited at that
