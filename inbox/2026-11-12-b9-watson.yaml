patch: 2026-11-12-b9-watson
by: Claude (batch 9, Watson, Into the Missile Age; the "already in" rows), Nov. 11, 2026
ops:
- cite:
    id: cal.1960-01-14.space
    item: '[[w.watson-into-the-missile-age]], 397 (President Eisenhower "formally announced the transfer on 14 January 1960," of the personnel and facilities of the Development Operations Division, effective July 1, 1960, the Pershing, Jupiter and Redstone work excepted; not Huntsville, the Saturn booster, the boosters of very high thrust or the second message)'
    units: '?'
- cite:
    id: cal.1960-01-25.cuba
    item: '[[w.watson-into-the-missile-age]], 763 (Jan. 25: Eisenhower "told his advisers that Castro was beginning to behave like a ''madman''"; Watson''s words, not Goodpaster''s; not who was there, Bonsal, the OAS or the quarantine)'
    units: '?'
- cite:
    id: cal.1960-04-26.japan-and-korea
    item: '[[w.watson-into-the-missile-age]], 629 (Rhee "resigned on 27 April 1960," after the March election "marked by fraud and violence," widespread protests and martial law; not Huh Chung or the other days)'
    units: E
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.watson-into-the-missile-age]], 722 (Paris, May 15: Khrushchev, meeting de Gaulle, "demanded that Eisenhower denounce the U-2 flights as a provocation, promise not to continue them, and punish those responsible"; Macmillan not named. That evening Gates, with Herter''s concurrence and the president''s approval, "a limited alert of U.S. forces," a test of long-distance military communications; not "worldwide")'
    units: '?'
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.watson-into-the-missile-age]], 723 (May 16, the four leaders met: Khrushchev "withdrew his invitation for the president to visit the Soviet Union"; Eisenhower "pointed out that he had already ordered the overflights stopped"; not the Élysée, the reading of the demands or "not to be resumed")'
    units: '?'
- cite:
    id: cal.1960-05-15.soviet-union
    item: '[[w.watson-into-the-missile-age]], 723 (May 17: the three Western leaders "convened," but Khrushchev "declined to join them until he received an apology," which "effectively ended the meeting")'
    units: F
- cite:
    id: cal.1960-06-22.japan-and-korea
    item: '[[w.watson-into-the-missile-age]], 639 (the U.S. Senate "followed suit on 22 June and the treaty took effect the next day"; not the vote, the citations, the exchange of ratifications in Tokyo or Kishi)'
    units: '?'
- variant:
    id: cal.1960-06-22.japan-and-korea
    unit: B
    witness: w.watson-into-the-missile-age
    reads: on 18-19 June, the upper house ratified the treaty
    at: '639'
- cite:
    id: cal.1960-06-08.elections-1960
    item: '[[w.watson-into-the-missile-age]], 769 (June 8: Rockefeller "issued a public statement calling for increases in defense programs that he estimated at $3 billion"; not the party''s course, Nixon or Hughes)'
    units: '?'
- cite:
    id: cal.1960-07-13.congo
    item: '[[w.watson-into-the-missile-age]], 761 (the Security Council "on 14 July authorized Secretary General Dag Hammarskjöld to provide military assistance"; a force of troops from African nations, Sweden and Ireland; not Belgium''s withdrawal, the vote or the abstentions)'
    units: '?'
- variant:
    id: cal.1960-07-12.congo-2
    unit: A
    witness: w.watson-into-the-missile-age
    reads: within 50 hours
    at: '761'
- cite:
    id: cal.1960-08-18.cuba
    item: '[[w.watson-into-the-missile-age]], 764 (Aug. 18: Eisenhower "approved a budget of approximately $13 million for the operation and the use of personnel and equipment supplied by DoD," and "wanted no U.S. military personnel used in a combat role"; not the reserve, the condition on the Joint Chiefs, State and the CIA, or the report of Dulles and Bissell)'
    units: '?'
- cite:
    id: cal.1960-11-16.economy
    item: '[[w.watson-into-the-missile-age]], 749 (the directive released Nov. 16: the number of military and civilian dependents abroad to be reduced to "not more than 200,000 at any one time," by 15,000 a month from Jan. 1, 1961; procurement abroad to be cut by "a very substantial amount"; the military dependents estimated at 500,000; not Augusta, aid loans or the gold stock)'
    units: B, C
- cite:
    id: cal.1960-12-13.transition-and-staff-cabinet
    item: '[[w.watson-into-the-missile-age]], 771 (Kennedy "selected Robert S. McNamara, recently appointed president of the Ford Motor Company, as secretary of defense. McNamara''s appointment was announced on 13 December")'
    units: A
- cite:
    id: cal.1961-01-02.laos
    item: '[[w.watson-into-the-missile-age]], 655 (the president "followed the situation in meetings with his advisers, including Gates and Douglas, on 2 and 3 January"; the Laotian national assembly "formally recognized the Boun Oum government on 3 January, giving it full legal status"; not Herter, Dulles or Lemnitzer, nor the vote of 41-0)'
    units: '?'
- add:
    entry:
      id: cal.1960-11-09.economy
      when: Nov. 9
      date: '1960-11-09'
      thread: economy
      c: 'Eisenhower with Anderson, Dillon, Gates, Stans, Martin and others, on the gold. Anderson: the stock $18,116 million, $218 million to go out Thursday, "almost a gold panic." Steps to take alone: fewer dependents abroad, fewer troops, no foreign goods at the exchanges, aid loans tied to American goods. Gates: the military not to be singled out; Eisenhower: no intention of it. Anderson to head a group.'
      n: '[FRUS 1958–60, IV, doc. 57](https://history.state.gov/historicaldocuments/frus1958-60v04/d57) (Goodpaster''s memorandum, drafted Nov. 14). [[w.watson-into-the-missile-age]], 749 (the meeting at the White House on the balance of payments; the talk of overseas dependents; Gates''s assurance from the president that the military would not be turned into "second class citizens"; not the gold, Anderson''s other steps or the group). To check: Memo of conf with Pres (Goodpaster), Nov. 9, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.88). Names: Eisenhower, Anderson, Dillon, Gates, Stans, Martin.'
      tags:
      - name:eisenhower-dwight-d
      - name:anderson-robert-b
      - name:dillon-c-douglas
      - name:gates-thomas-s-jr
      - name:stans-maurice-h
      - name:martin-william-mcchesney-jr
- add:
    entry:
      id: cal.1960-11-15.economy
      when: Nov. 15
      date: '1960-11-15'
      thread: economy
      c: 'Augusta. Eisenhower with Anderson, Gates and others; Goodpaster reads the draft directive on the balance of payments, and it is edited. Dependents abroad, 500,000, Gates; Anderson, a goal of 200,000, a cut of 60 percent. Gates fears the services fuss and Kennedys use of it; Eisenhower: morale will be all right with proper leadership. States embassies to be cut too. Anderson to ask Adenauer $650,000,000 a year; the directive out Wednesday.'
      n: '[FRUS 1958–60, IV, doc. 58](https://history.state.gov/historicaldocuments/frus1958-60v04/d58) (the memorandum by John S. D. Eisenhower). [[w.watson-into-the-missile-age]], 749 (the meeting of Nov. 15: the directive drafted by Goodpaster approved; the reduction of the estimated 500,000 military dependents; Gates on retention and enlistment, 60 percent; Eisenhower on service and "not personal gain"; not Augusta, State, Adenauer or the date of release). To check: Memo of conf with Pres (J. S. D. Eisenhower), Nov. 15, 1960, Staff Notes Nov 60, Box 54, DDED ser, PP (AWF), DDEL (cited by [[w.watson-into-the-missile-age]], 749 n.89). See [[cal.1960-11-13.economy]]. Names: Eisenhower, Anderson, Gates, Goodpaster, Kennedy, Adenauer.'
      tags:
      - name:eisenhower-dwight-d
      - name:anderson-robert-b
      - name:gates-thomas-s-jr
      - name:goodpaster-andrew-j
      - name:kennedy-john-f
      - name:adenauer-konrad
      - state:ga
- add:
    entry:
      id: cal.1961-01-02.laos-2
      when: Jan. 2
      date: '1961-01-02'
      thread: laos
      c: The Defense Department announces "normal precautionary actions" to raise the readiness of forces in the Pacific.
      n: '[[w.watson-into-the-missile-age]], 655 (the announcement; the United States had called for a meeting of the SEATO Council; not the forces or the hour). To check: New York Times, Jan. 1, 2, 3, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.151). See [[cal.1961-01-02.laos]].'
      tags: []
- add:
    entry:
      id: cal.1961-01-04.laos-2
      when: Jan. 4
      date: '1961-01-04'
      thread: laos
      c: 'The SEATO Council meets on Laos: it affirms the goal of a peaceful solution and expresses readiness to fulfill the alliance''s obligations.'
      n: '[[w.watson-into-the-missile-age]], 655 (the Council "met on 4 January"; not the place, the delegates or the text). To check: New York Times, Jan. 5, 11, 12, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.153). Check: the day, by the Council''s communiqué. See [[cal.1961-01-02.laos-2]].'
      tags: []
- add:
    entry:
      id: cal.1961-01-07.laos-3
      when: Jan. 7
      date: '1961-01-07'
      thread: laos
      c: 'The Joint Chiefs, after a "high-level conference" that day, authorize CINCPAC to use U.S. military aircraft, if need be, to airlift supplies into Laos, covert aircraft preferred. Armed T-6s authorized in Laos, no bombs: first against the Communist airlift, then troops, dumps and other military targets.'
      n: '[[w.watson-into-the-missile-age]], 655 (the "high-level conference" held that date). To check: JCS 988337 and 988339 to CINCPAC, Jan. 7, 1961, OSD Hist; New York Times, Jan. 13, 1961 (cited by [[w.watson-into-the-missile-age]], 655 n.154). See [[cal.1961-01-05.laos]].'
      tags: []
