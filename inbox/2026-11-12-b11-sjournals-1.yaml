- add:
    entry:
      id: cal.1960-01-09.elections-1960-nomination
      when: Jan. 9
      date: '1960-01-09'
      thread: elections-1960-nomination
      c: 'Washington, the Majority Leader''s office, 5 p.m. Johnson to Schlesinger: the election thought lost already, with Clark and Proxmire having given the party''s picture as one of "wasters,
        spenders and wild men"; Nixon could beat any Democrat in Texas except Johnson. "The country wants to be comfortable. It doesn''t want to be stirred up." Of his own leadership: "We sought
        the best and did the possible." Asked of his candidacy, he brushes it off: "I would support Stevenson with enthusiasm. I would support Humphrey with enthusiasm. [Pause] I would support
        Kennedy. I would support Symington."'
      n: '[[w.schlesinger-journals]], 64–65. Made public: [[w.schlesinger-journals]] (2007). Names: Johnson, Schlesinger, Nixon, Stevenson, Humphrey, Kennedy. Check: the speaker; the page does
        not name him, the "new leader''s office" and the question of "his candidacy" pointing to Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - name:nixon-richard-m
      - name:stevenson-adlai-e
      - name:humphrey-hubert-h
