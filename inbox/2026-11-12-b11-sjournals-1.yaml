      - city:washington
- add:
    entry:
      id: cal.1960-01-23.elections-1960-nomination
      when: Jan. 23
      date: '1960-01-23'
      thread: elections-1960-nomination
      c: Washington, the Congressional Hotel, before the Jefferson-Jackson Day dinner. Humphrey asks Schlesinger to look at his speech for the evening; Schlesinger finds it too crude and direct
        in its attack on Nixon, and rewrites it at the typewriter. Humphrey uses it that evening "with minor changes."
      n: '[[w.schlesinger-journals]], 65. Made public: [[w.schlesinger-journals]] (2007). Names: Humphrey, Schlesinger, Nixon.'
      tags:
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
      - name:nixon-richard-m
      - city:washington
- add:
    entry:
      id: cal.1960-01-23.elections-1960-nomination-2
      when: Jan. 23
      date: '1960-01-23'
      thread: elections-1960-nomination
      c: 'Washington, the Sheraton Park, about 4:30 p.m. Harriman to Schlesinger: Johnson has been wooing him with "barely concealed remarks about the State Department," but he is not much impressed.
        Schlesinger: he "obviously prefers Humphrey," has given him some money, and thinks little of his chances; he speaks in a "rather friendly way" about Kennedy.'
      n: '[[w.schlesinger-journals]], 65. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Johnson, Humphrey, Kennedy.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
      id: cal.1960-01-23.democratic-party
      when: Jan. 23
      date: '1960-01-23'
      thread: democratic-party
      c: Washington, the Jefferson-Jackson Day dinner, by Schlesinger's journal. Humphrey "stole the show," Kennedy "a close second." Johnson "was a flop; his attack on the Eisenhower administration
        for not balancing the budget fell with a conspicuous thud."
      n: '[[w.schlesinger-journals]], 65. Names: Humphrey, Kennedy, Johnson, Eisenhower.'
      tags:
      - name:humphrey-hubert-h
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - city:washington
- add:
    entry:
      id: cal.1960-05-14.elections-1960-nomination
      when: May 14
      date: '1960-05-14'
      thread: elections-1960-nomination
      c: 'Kennedy, by telephone from a lunch on the road in Maryland, to Schlesinger: Stevenson, if still a candidate, "can get somewhere only over my dead body," so he might as well help Kennedy.
        Kennedy needs 80 to 100 votes, which Stevenson could give him in California and Pennsylvania and help with in Colorado and Minnesota: "He is the essential ingredient in my combination."
        From West Virginia: "it''s absolutely fatal to have southern support. I want to be nominated by the liberals."'
      n: '[[w.schlesinger-journals]], 66–67. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Stevenson.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
      - state:md
- add:
    entry:
      id: cal.1960-05-15.elections-1960-nomination
      when: May 15
      date: '1960-05-15'
      thread: elections-1960-nomination
      c: 'Libertyville, Ill., by telephone. Stevenson to Schlesinger: Blair has pressed him for a year to come out for Kennedy; to do so now "would look as if I were jumping on the bandwagon"
        or "angling for a job." Before the convention he might help "in terms calculated to preserve as much party harmony as possible." The draft pressure mounts, eleven telegrams that morning;
        to callers: "If you do anything about this, you must do it on your own."'
      n: '[[w.schlesinger-journals]], 67. Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger, Kennedy.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - state:il
- add:
    entry:
      id: cal.1960-05-22.elections-1960-nomination
      when: May 22
      date: '1960-05-22'
      thread: elections-1960-nomination
      c: 'Kennedy, by telephone late Sunday afternoon, to Schlesinger, on his talk with Stevenson at Libertyville the day before: pleasant, but Stevenson will do nothing for the moment. Kennedy''s
        fear: Johnson told Stevenson on Monday that, if he stayed aloof, he would be Johnson''s second choice. Kennedy told Stevenson "Lyndon was a chronic liar; that he has been making all sorts
        of assurances to me for years and has lived up to none of them." Party harmony, no problem: "Everyone will come around the day after the convention; and anyone who doesn''t come around
        will be left out and won''t matter."'
      n: '[[w.schlesinger-journals]], 67–68. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Stevenson, Johnson.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:stevenson-adlai-e
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-05-29.elections-1960-nomination
      when: May 29
      date: '1960-05-29'
      thread: elections-1960-nomination
      c: 'Stevenson, by telephone, to Schlesinger: sorry Kennedy felt "regretful" over their talk; he made a "dire mistake" in mentioning Johnson, which drew the only flash of temper from Kennedy.
        Johnson had spoken fiercely against Kennedy when they met in Washington. "I suppose I made a mistake bringing Johnson up; but I thought that, if I were to serve under Kennedy, it might
        be helpful if I could keep a personal in with Johnson."'
      n: '[[w.schlesinger-journals]], 68–69. Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger, Kennedy, Johnson.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-20
      when: July 14
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: 'Los Angeles, about 3:20 p.m., Stevenson''s quarters. The Governor, "visibly shaken," comes out to Schlesinger: Phil Graham has just called him to say Kennedy has chosen Lyndon Johnson
        for Vice President. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 74. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1960-07-14.elections-1960]]. Names: Stevenson, Schlesinger, Kennedy, Johnson.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - city:los-angeles
      - state:ca
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy-3
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      c: 'Hyannis Port, Mass. Kennedy at lunch on his boat with Jacqueline Kennedy, the Radziwills and Schlesinger and his wife, from after 1 to nearly 5, by Schlesinger''s journal. On Nixon,
        whom he feels "much better about": "Nixon is about as far advanced as I was ten years ago"; "no taste." Schlesinger urges a major speech from Castro, to set his foreign policy against
        Nixon''s; Kennedy: "We can''t do anything except through the OAS ... and most of the members of the OAS don''t want to do anything at all."'
      n: '[[w.schlesinger-journals]], 80–82. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Jacqueline Kennedy, Schlesinger, Nixon, Castro.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - name:schlesinger-arthur-m-jr
      - name:nixon-richard-m
      - name:castro-fidel
      - state:ma
- add:
    entry:
      id: cal.1960-08-30.elections-1960-rockefeller
      when: Aug. 30
      date: '1960-08-30'
      thread: elections-1960-rockefeller
      c: 'Lunch. Kissinger to Schlesinger: he saw Rockefeller at Seal Harbor the week before to say he could not help in the fall campaign, and will do nothing that might aid Nixon; Rockefeller
        "appeared low and sunk," disappointed by the response in Chicago. Of the Nixon–Rockefeller talks, Nixon came "armed with polls" to argue him into the Vice Presidential nomination, offering
        the platform, "complete control over foreign policy" and New York State patronage; Rockefeller turned it all down: "He loathes Nixon."'
      n: '[[w.schlesinger-journals]], 84. Made public: [[w.schlesinger-journals]] (2007). Names: Kissinger, Schlesinger, Rockefeller, Nixon.'
      tags:
      - name:kissinger-henry-a
      - name:schlesinger-arthur-m-jr
      - name:rockefeller-nelson
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-08-30.elections-1960-kennedy-3
      when: Aug. 30
      date: '1960-08-30'
      thread: elections-1960-kennedy
      c: 'Kennedy at dinner with Phil and Katharine Graham and Johnson, by Graham''s account to Schlesinger the next day. Over cocktails the talk is of the South. At table Graham raises the northern
        liberals, "the other and more important part" of the coalition. Kennedy: "The trouble with the northern liberals is that they want their arses kissed all the time.... But I can''t spend
        all my time doing it." Graham: he has not been drafted and must be prepared to act himself; Kennedy "wearily agreed."'
      n: '[[w.schlesinger-journals]], 84–85. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Katharine Graham, Johnson, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:graham-katharine
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1960-10-13.elections-1960-kennedy-3
      when: Oct. 13
      date: '1960-10-13'
      thread: elections-1960-kennedy
      c: 'New York, the Carlyle. Schlesinger hands Kennedy a draft for the Alfred E. Smith dinner, afraid it is "too Catholic." Kennedy: "You and Ted keep writing Catholic speeches. I guess I
        am the only Protestant around here." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 89. Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Kennedy, Sorensen.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1960-11-16.transition-and-staff-2
      when: Nov. 16
      date: '1960-11-16'
      thread: transition-and-staff
      c: Dinner of Phil Graham, Galbraith and Schlesinger. Graham "euphorically insistent" on Douglas Dillon for Secretary of the Treasury; he and Schlesinger "had our first serious wrangle in
        years," and Schlesinger leaves for the airport "in a state of extreme irritation." Graham apologizes by telephone the next day. By Schlesinger's journal, Nov. 21.
      n: '[[w.schlesinger-journals]], 93–94. Made public: [[w.schlesinger-journals]] (2007). Names: Galbraith, Schlesinger, Dillon.'
      tags:
      - name:galbraith-john-kenneth
      - name:schlesinger-arthur-m-jr
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1961-02-20.latin-america
      when: Feb. 20
      date: '1961-02-20'
      thread: latin-america
      c: Rio de Janeiro, 5:30 p.m. Schlesinger, Kennedy's personal representative on the Latin American trip with McGovern's Food for Peace mission, calls with Ambassador Cabot on Lacerda, the
        governor of the state that includes Rio. The talk, chiefly of the favelas; Lacerda, like the Archbishop, stresses rural reform to hold more of the people on the land. By Schlesinger's
        journal.
      n: '[[w.schlesinger-journals]], 103–04. Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Kennedy, McGovern.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:mcgovern-george
- add:
    entry:
      id: cal.1961-02-24.latin-america
      when: Feb. 24
      date: '1961-02-24'
      thread: latin-america
      c: 'La Paz, 5 p.m. Schlesinger, for Kennedy, with President Paz Estenssoro. Paz: the Latin American oligarchies resisting change make the revolution more violent when it comes. On Cuba:
        "Castro must be eliminated"; first the economic screws, then an educational campaign on the Castro regime. Schlesinger: the revolution must be protected from the oligarchy of the right
        and from "the conspiracy and sabotage of the left." Paz: with assistance he can deal with his local Communist problem. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 104–06. Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Kennedy, Castro.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-08-23.laos
      when: Aug. 23
      date: '1961-08-23'
      thread: laos
      c: 'The White House. Harriman, with Schlesinger, to Kennedy on the Laos negotiations; both opposed to intervention. On a counterstatement to the Communist manifesto, which Harriman cabled
        from Geneva citing the *New York Times* of Aug. 14: Kennedy on Castro''s literacy drive, "an immense communal effort like this is attractive to people who wish to serve their country";
        Schlesinger to draft a free world manifesto. Kennedy: "the best way to deal with State is to send over memos." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 129. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Kennedy, Castro.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:castro-fidel
      - city:washington
- add:
    entry:
      id: cal.1961-09-19.democratic-party
      when: Sept. 19
      date: '1961-09-19'
      thread: democratic-party
      c: 'Dinner of Wechsler, Rauh, Humphrey and Schlesinger. Wechsler comes from forty-five minutes with Kennedy, delighted by "the new note of impatience with Eisenhower, the Republicans and
        the business community." Humphrey, asked what should be done next: "The first thing I would do is fire Dean Rusk." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 136. Made public: [[w.schlesinger-journals]] (2007). Names: Rauh, Humphrey, Schlesinger, Kennedy, Eisenhower, Rusk.'
      tags:
      - name:rauh-joseph-l-jr
      - name:humphrey-hubert-h
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:eisenhower-dwight-d
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-09-20.program
      when: Sept. 20
      date: '1961-09-20'
      thread: program
      c: 'The White House, dinner with Joseph and Susan Mary Alsop, Schlesinger and his wife, by Schlesinger''s journal. Kennedy on the business community: he understands FDR''s attitude, and
        wishes there were no Cold War, so that he could debate the future of America with businessmen. On the Metropolitan Club, whose Board has reprimanded George Lodge for bringing George Weaver,
        a Negro, to lunch: Robert Kennedy, Lodge, Bartlett and others have resigned; he does not see how anyone could remain. On Berlin: the American people have no conception what a nuclear war
        is like.'
      n: '[[w.schlesinger-journals]], 136–37. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Alsop, Schlesinger, Robert Kennedy.'
      tags:
      - name:kennedy-john-f
      - name:alsop-joseph
      - name:schlesinger-arthur-m-jr
      - name:kennedy-robert-f
      - city:washington
- add:
    entry:
      id: cal.1961-10-17.program
      when: Oct. 17
      date: '1961-10-17'
      thread: program
      c: 'The White House, dinner alone with Kennedy and Jacqueline Kennedy, Schlesinger and his wife, by Schlesinger''s journal. Kennedy on Germany: Adenauer a great man, greater than de Gaulle,
        and the other Germans seem to him terrible; "They act as if they had been our allies." On Eisenhower: "too stupid to know what was going on"; Truman''s appointments excellent "except in
        the National Committee, the regulatory agencies and the Department of Justice." On the Metropolitan Club: he could understand newspapermen who stayed in, not senators, naming Symington
        and Pell, who spoke on civil rights and went there for dinner.'
      n: '[[w.schlesinger-journals]], 139–40. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-10-17.transition-and-staff]]. Names: Kennedy, Jacqueline Kennedy, Schlesinger, Eisenhower,
        Truman.'
      tags:
      - name:kennedy-john-f
      - name:kennedy-jacqueline
      - name:schlesinger-arthur-m-jr
      - name:eisenhower-dwight-d
      - name:truman-harry-s
      - city:washington
- add:
    entry:
      id: cal.1962-01-10.program
      when: Jan. 10
      date: '1962-01-10'
      thread: program
      c: The White House, 10 p.m. Kennedy with Sorensen, Bundy and Schlesinger for a last review of the State of the Union text. Schlesinger finds the domestic section, which he had tried to give
        a philosophical coherence, "reduced again to a laundry list," and urges a paragraph to tie the program together and relate it to the New Frontier; Kennedy agrees. The foreign section and
        the peroration, to a little after 11. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 143–44. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Sorensen, Bundy, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:bundy-mcgeorge
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1962-01-12.program
      when: Jan. 12
      date: '1962-01-12'
      thread: program
      c: 'Schlesinger''s house, informal dinner for Harold Wilson, the Labour leader: Harriman, Fulbright, Morse, Galbraith, Kaysen, Cleveland, Goodwin, Heckscher. They try to smoke Wilson out
        on socialism and the Common Market "but with little success." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 145. Made public: [[w.schlesinger-journals]] (2007). Names: Wilson, Schlesinger, Harriman, Fulbright, Morse, Galbraith, Kaysen, Goodwin.'
      tags:
      - name:wilson-harold
      - name:schlesinger-arthur-m-jr
      - name:harriman-w-averell
      - name:fulbright-j-william
      - name:morse-wayne
      - name:galbraith-john-kenneth
      - name:kaysen-carl
      - name:goodwin-richard-n
      - city:washington
- add:
    entry:
      id: cal.1962-01-18.program
      when: Jan. 18
      date: '1962-01-18'
      thread: program
      c: 'The White House, dinner for Stravinsky. Marshall Field complains that all the good columnists are liberals; Kennedy: "Liberalism and conservatism ... are categories of the thirties,
        and they don''t apply anymore. Our problems today are mostly technical and require above all sophisticated thinking." The trouble with conservatives is that "most of their thinking is
        so naive"; the liberals'' "function ought to be to provide new ideas, and they don''t come up with any." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 146. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1962-03-05.testing
      when: Mar. 5
      date: '1962-03-05'
      thread: testing
      c: 'The White House, dinner with Kennedy, Jacqueline Kennedy and Peter Lawford, by Schlesinger''s journal. Kennedy on the decision to resume testing in April: he called Truman and Eisenhower
        to tell them. Truman, sympathetic, understood how difficult it had been. Eisenhower, "cold and grumpy": "Well, I thought you should have done this a long time ago."'
      n: '[[w.schlesinger-journals]], 150. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Truman, Eisenhower.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:truman-harry-s
      - name:eisenhower-dwight-d
      - city:washington
- add:
    entry:
      id: cal.1962-03-07.cuba-bay-of-pigs
      when: Mar. 7
      date: '1962-03-07'
      thread: cuba-bay-of-pigs
      c: 'The White House, dinner with Kennedy, Jacqueline Kennedy and the Bartletts, by Schlesinger''s journal. Schlesinger reads Kennedy the passage in Nixon''s *Six Crises* that Dulles had
        told Kennedy of the Cuban operation during the campaign. Kennedy: "Of course that is not true. I never heard of the Cuban operation until Dulles and Bissell told me about it at Palm Beach
        after the election." He has Bundy ask Dulles to confirm it; Bundy does, and Dulles does.'
      n: '[[w.schlesinger-journals]], 151. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Nixon, Bundy.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:nixon-richard-m
      - name:bundy-mcgeorge
      - city:washington
- add:
    entry:
      id: cal.1962-04-01.program
      when: Apr. 1
      date: '1962-04-01'
      thread: program
      c: 'Glen Ora, Va., dinner with Kennedy, Schlesinger, his wife and Galbraith, by Schlesinger''s journal. On the Supreme Court: appointing White was one of the hardest decisions, a week''s
        hesitation; he chose him partly for his work for the nomination and election, Paul Freund having been for him too. He once asked Max Freedman to ask Frankfurter whether he would resign
        if they could agree on a successor; Frankfurter: "I guess he decided that he was indispensable to the Court." Nixon''s book shows him a "sick" man. With Galbraith on Laos: no intention
        of ever committing American troops there in force.'
      n: '[[w.schlesinger-journals]], 153–54. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Galbraith, White, Nixon.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:galbraith-john-kenneth
      - name:white-byron-r
      - name:nixon-richard-m
      - state:va
- add:
    entry:
      id: cal.1962-06-04.economy-2
      when: June 4
      date: '1962-06-04'
      thread: economy
      c: 'The President''s office, afternoon: Kennedy with Sorensen and O''Donnell, Schlesinger coming in, on living with business. "I understand better every day why Roosevelt, who started out
        as such a mild fellow, ended up so ferociously anti-business." On the opposition: "There are about ten thousand people in the country involved in this ... They are starting to call me
        the Democratic Hoover. Well, we''re not going to take that." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 156–57. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Sorensen, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1962-06-15.economy
      when: June 15
      date: '1962-06-15'
      thread: economy
      c: 'Sorensen to Schlesinger by telephone, the morning of his speech to the Americans for Democratic Action''s foreign policy conference in Los Angeles: the President is much concerned over
        what he may say and does not wish him to touch on government–business relations. Schlesinger: he is keeping to foreign policy. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 157. Made public: [[w.schlesinger-journals]] (2007). Names: Sorensen, Schlesinger, Kennedy.'
      tags:
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - city:los-angeles
      - state:ca
- add:
    entry:
      id: cal.1962-10-15.defense
      when: Oct. 15
      date: '1962-10-15'
      thread: defense
      c: 'Hickory Hill, convened at McNamara''s, on Soviet cybernetics; John Ford of the CIA, Robert Livingston of the National Institutes of Health and Dana Durand speak. McNamara to Schlesinger:
        no sane western leader can envisage initiating nuclear war; "the Pentagon is full of papers talking about the preservation of a ''viable society'' after nuclear conflict," which "drives
        me mad." "Everyone knows that we won''t go to nuclear war over Berlin. That is why we have to develop a conventional capability." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 171–72. Made public: [[w.schlesinger-journals]] (2007). Names: McNamara, Schlesinger.'
      tags:
      - name:mcnamara-robert-s
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-diplomacy-2
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-diplomacy
      c: 'Washington, the Magnuson house, O Street, Saturday morning. Stevenson to Schlesinger, out of the chauffeur''s hearing: the secret discussions of the week are on Cuba; aerial reconnaissance
        has found offensive missile bases; the President learned it Tuesday morning and told him after lunch that day. The argument all week between a diplomatic and a military solution; pressure
        for an air strike put aside for a quarantine. He must speak early in the week in the Security Council, and asks Schlesinger to begin work on it. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 172–73. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1962-10-20.missile-crisis-diplomacy]]. Names: Stevenson, Schlesinger, Kennedy.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-diplomacy-3
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis-diplomacy
      c: 'Harriman, by telephone from Washington on Wednesday night, to Schlesinger in New York: Khrushchev wants help off the hook, and is sending signals, the letter to Bertrand Russell, the
        orders to Soviet ships to avoid confrontation, the evening with Jerome Hines; Eisenhower ignored such signals after the U-2. "If we do nothing but get tougher and tougher, we will force
        him into counter measures.... We must give him an out." He has not talked to Rusk, who never asks his advice outside the Far East. Schlesinger sends the President a memorandum that night.
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 175–76. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger, Khrushchev, Rusk, Eisenhower.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
      - name:khrushchev-nikita-s
      - name:rusk-dean
      - name:eisenhower-dwight-d
      - city:nyc
- add:
    entry:
      id: cal.1962-10-29.missile-crisis-settlement-2
      when: Oct. 29
      date: '1962-10-29'
      thread: missile-crisis-settlement
      c: 'Kennedy to Schlesinger after the staff meeting, "relaxed and chipper but far from complacent": a pity it all came in a campaign, for the Republicans will now feel compelled to attack
        the settlement; "Too many people will think now that all we have to do in dealing with the Russians is to kick them in the balls...." "They had no business in putting those missiles in
        and in lying to me about it." Of Eisenhower''s two speeches attacking him: "Do you know what has really driven him into this campaign? It is your father and his poll." By Schlesinger''s
        journal.'
      n: '[[w.schlesinger-journals]], 177–78. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1962-10-29.missile-crisis-settlement]]. Names: Kennedy, Schlesinger, Eisenhower.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:eisenhower-dwight-d
      - city:washington
- add:
    entry:
      id: cal.1962-11-01.missile-crisis-settlement
      when: Nov. 1
      date: '1962-11-01'
      thread: missile-crisis-settlement
      c: 'Stevenson complains to Schlesinger: his report to the State Department of Wednesday night on U Thant''s conversations with Castro was in the newspapers by Thursday afternoon. Schlesinger
        tells Kennedy late in the afternoon; Kennedy learns from Manning that the report went out in 100 copies and the papers had it within two hours, and directs him to send each recipient a
        note, signed by Rusk, on the harm done. White House staff are now to report to Salinger each day the newsmen they have talked with. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 178. Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger, Thant, Castro, Kennedy, Manning, Rusk, Salinger.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:u-thant
      - name:castro-fidel
      - name:kennedy-john-f
      - name:manning-robert-j
      - name:rusk-dean
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-11-10.democratic-party
      when: Nov. 10
      date: '1962-11-10'
      thread: democratic-party
      c: Hyde Park, N.Y., the funeral of Eleanor Roosevelt, who died Nov. 7. In the church, Truman, Eisenhower and Kennedy, with Henry Wallace, James Farley, Henry Morgenthau and Frances Perkins;
        Truman, in Schlesinger's words, anguished as never before. Burial in a gentle rain. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 180–81. See [[cal.1962-11-10.economy]]. Names: Roosevelt, Truman, Eisenhower, Kennedy, Schlesinger.'
      tags:
      - name:roosevelt-eleanor
      - name:truman-harry-s
      - name:eisenhower-dwight-d
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - state:ny
- add:
    entry:
      id: cal.1963-01-04.civil-rights-the-executive
      when: Jan. 4
      date: '1963-01-04'
      thread: civil-rights-the-executive
      c: 'Washington, the National Archives, the opening of an exhibition for the centennial of the Emancipation Proclamation. Robert Kennedy gives the speech, derived from one Schlesinger wrote
        for the President to give by television from Palm Beach on Jan. 1, which the President dropped: a segregated city a poor place from which to make an emancipation speech. Rauh, passing
        Schlesinger a note: "Poor Lyndon.... Lyndon must know he is through. Bobby is going to be the next President." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 185. Names: Robert Kennedy, Schlesinger, Kennedy, Rauh, Johnson.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:rauh-joseph-l-jr
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1963-01-10.program
      when: Jan. 10
      date: '1963-01-10'
      thread: program
      c: 'The White House, dinner with Joseph and Susan Mary Alsop, Lee Radziwill and Schlesinger and his wife, by Schlesinger''s journal. Kennedy on his talk the night before with Malraux: the
        talk of European nuclear deterrents and a multilateral force rested on the expectation of a Soviet attack on Europe, "than which nothing is less likely." "What matters ... is the strength
        of the currency. It is this, and not its nuclear weapons, which makes France a factor." People should be thinking of the Far East and a Chinese nuclear capability.'
      n: '[[w.schlesinger-journals]], 185–86. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Alsop, Schlesinger, Malraux.'
      tags:
      - name:kennedy-john-f
      - name:alsop-joseph
      - name:schlesinger-arthur-m-jr
      - name:malraux-andre
      - city:washington
- add:
    entry:
      id: cal.1963-04-08.europe-and-the-alliance
      when: Apr. 8
      date: '1963-04-08'
      thread: europe-and-the-alliance
      c: 'Washington, Monday afternoon. Harriman sworn in as Deputy Under Secretary of State; Ball''s speech recalls the early New Deal. In his new office Harriman to Schlesinger: "This place
        is dead, dead, dead. What I want to do is to give it a little of the crusading spirit of those earlier times." And: "What is wrong with the President when it comes to dealing with the
        Congress? These people spend all their time obstructing and sabotaging his program, and yet he treats them with constant consideration and respect." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 188. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Ball, Schlesinger, Kennedy.'
      tags:
      - name:harriman-w-averell
      - name:ball-george-w
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
      id: cal.1963-11-22.succession-29
      when: Nov. 22
      date: '1963-11-22'
      thread: succession
      c: Andrews Air Force Base, dusk. Schlesinger, with Harriman, Bundy and McNamara in the crowd waiting for the plane from Texas, shakes Johnson's hand as he passes and tells him "of course
        we wanted to do everything we could to help him." By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 203. Names: Schlesinger, Harriman, Bundy, McNamara, Johnson.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:harriman-w-averell
      - name:bundy-mcgeorge
      - name:mcnamara-robert-s
      - name:johnson-lyndon-b
      - state:md
- add:
    entry:
      id: cal.1963-11-23.succession-15
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Bundy to Schlesinger after the 3 o''clock staff meeting: Schlesinger''s letter of resignation, sent the first thing in the morning, reached Johnson during his meeting with Eisenhower;
        Johnson read it and handed it to Bundy: "Please take this letter back and have him withdraw it. And send out instructions that I do not want any letters of resignation." Eisenhower demurred,
        saying he need not accept resignations right away. So the line is that the staff should resign but, "for the time being," Johnson will accept none. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 205–06. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1963-11-23.succession-2]]. Names: Bundy, Schlesinger, Johnson, Eisenhower.'
      tags:
      - name:bundy-mcgeorge
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
      - city:washington
- add:
    entry:
      id: cal.1963-11-26.succession-6
      when: Nov. 26
      date: '1963-11-26'
      thread: succession
      c: 'The White House, Johnson''s office. Johnson to Schlesinger: "I need you far more than John Kennedy ever needed you. He had the knowledge, the skills, the understanding himself. I need
        you to provide those things for me.... I have your letter of resignation and that is fine as a gesture but I reject it as a fact. If you act upon it, I will have you arrested." He asks
        him to stay "at least a year." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 208–09. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1963-11-26.latin-america]]. Names: Johnson, Schlesinger, Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
      id: cal.1963-12-04.succession
      when: Dec. 4
      date: '1963-12-04'
      thread: succession
      c: 'New York. Stevenson to Schlesinger, of his talk with Johnson after the funeral: Johnson said "you should be sitting behind this desk rather than me. You could have been the nominee for
        Vice President if you had come out for Kennedy in Los Angeles. But you kept your word to me that you wouldn''t back any of the candidates.... But I haven''t forgotten." And: "I want you
        to play a big role in the formation of policy." Stevenson told Johnson and Fortas that Rusk and Bundy should be kept. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 211. Made public: [[w.schlesinger-journals]] (2007). Names: Stevenson, Schlesinger, Johnson, Rusk, Bundy, Kennedy.'
      tags:
      - name:stevenson-adlai-e
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:kennedy-john-f
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1963-12-05.latin-america
      when: Dec. 5
      date: '1963-12-05'
      thread: latin-america
      c: 'Washington, lunch and again later in the day. Moyers to Schlesinger on the proposed Under Secretaryship for the Western Hemisphere; asked of Mann, Schlesinger: able, but a "disaster,"
        a free enterprise ideologist who does not believe in the Alliance for Progress, a return to John Foster Dulles; Robert Kennedy might be urged instead. Moyers: sure Johnson would give Robert
        Kennedy anything he wanted. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 213. Made public: [[w.schlesinger-journals]] (2007). Names: Moyers, Schlesinger, Mann, Robert Kennedy, Johnson.'
      tags:
      - name:moyers-bill
      - name:schlesinger-arthur-m-jr
      - name:mann-thomas-c
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1963-12-15.vietnam
      when: Dec. 15
      date: '1963-12-15'
      thread: vietnam
      c: 'Forrestal to Schlesinger, over a drink: Johnson, silent in the formal discussions of Vietnam, had once told him privately that he believed in the unconditional support of Diem and that
        "you fellows in the White House" were making a great mistake in trying to disengage from him. On Friday: "Don''t you think that the situation in Vietnam is more hopeless today than it
        has ever been before"-a remark Forrestal reads as a sign Johnson holds to his earlier views. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 215. Made public: [[w.schlesinger-journals]] (2007). Names: Forrestal, Schlesinger, Johnson.'
      tags:
      - name:forrestal-michael-v
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - city:washington
- add:
    entry:
      id: cal.1964-07-15.robert-kennedy
      when: July 15
      date: '1964-07-15'
      thread: robert-kennedy
      c: 'Robert Kennedy and Schlesinger fly to the Cape together for a party off Hyannis Port. Kennedy is "philosophical" about the vice presidency; he thinks of a year at Oxford. On Johnson:
        the first twenty-four hours after the assassination left wounds that will take long to heal; Shriver''s efforts then only made it worse ("if I wanted him to intervene I was capable of
        asking him"). The worst thing Johnson has said, told by Salinger: that the deaths of Trujillo and Diem and what happened to Kennedy "may have been divine retribution." By Schlesinger''s
        journal.'
      n: '[[w.schlesinger-journals]], 228. Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Schlesinger, Johnson, Shriver, Salinger, Kennedy.'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:shriver-r-sargent
      - name:salinger-pierre
      - name:kennedy-john-f
      - state:ma
- add:
    entry:
      id: cal.1961-04-08.cuba-2
      when: Apr. 8
      date: '1961-04-08'
      thread: cuba
      c: Washington, Saturday morning. Schlesinger to Rusk with misgivings about the Cuban operation. Rusk shares them; he has wanted to write up a balance sheet on the project, plans to do so
        over the weekend, and will try to talk to the President about it on Monday. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 110, 119. Made public: [[w.schlesinger-journals]] (2007). Names: Schlesinger, Rusk.'
      tags:
      - name:schlesinger-arthur-m-jr
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-04-15.cuba-3
      when: Apr. 15
      date: '1961-04-15'
      thread: cuba
      c: 'The White House, Saturday. Rusk, Berle, Bundy, Bissell and Schlesinger with Kennedy on the next step, the Cuban appeal to the UN having brought an emergency session of the Security Council.
        Bundy, in what Kennedy calls "Scarlet Pimpernel" discussions: "Mr. President, do you realize that you are surrounded by five ex-professors?" By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 111. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-15.cuba]]. Names: Rusk, Bundy, Bissell, Schlesinger, Kennedy.'
      tags:
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:bissell-richard-m-jr
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
      id: cal.1961-04-18.cuba-bay-of-pigs-3
      when: Apr. 18
      date: '1961-04-18'
      thread: cuba-bay-of-pigs
      c: 'The President''s office, after the lunch with Reston. O''Donnell suggests the line: the Cuban insurgents should say they have achieved their basic objectives, supply and reinforcement,
        and vanish into the hills. Kennedy is still turning over the idea of evacuating the patriots from the beaches; Bundy fears that would give evidence of U.S. intervention with no gain. Bundy:
        Dulles had more misgivings than he ever expressed to the President, out of loyalty to Bissell; he himself could not accept Bissell''s estimates of such a situation again. By Schlesinger''s
        journal.'
      n: '[[w.schlesinger-journals]], 113. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-18.cuba-3]]. Names: O''Donnell, Kennedy, Bundy, Dulles, Bissell, Schlesinger.'
      tags:
      - name:odonnell-kenneth-p
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1961-04-19.cuba-bay-of-pigs-3
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: 'The White House, past 1 a.m. Bundy telephones Schlesinger, just in bed: the President wants him. In the President''s office, Kennedy, Johnson, Rusk, McNamara and Lemnitzer in white tie
        for the Congressional ball, with Bundy and Rostow, read dispatches from Cuba; talk of a concealed U.S. air strike in the morning. Kennedy on the Revolutionary Council: "One member is threatening
        suicide. Others want to be put on the beachhead. All are furious with the CIA." He wants Berle to go down to them, or Schlesinger if not Berle; to Schlesinger: "You ought to go with Berle."
        The meeting breaks up about 2:00. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 113–14. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-19.cuba-bay-of-pigs]]. Names: Bundy, Schlesinger, Kennedy, Johnson, Rusk, McNamara,
        Lemnitzer, Rostow.'
      tags:
      - name:bundy-mcgeorge
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:rostow-walt-w
      - city:washington
- add:
    entry:
      id: cal.1961-04-21.cuba-bay-of-pigs-3
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba-bay-of-pigs
      c: 'The President''s breakfast with Rusk, Salinger, Bundy, Sorensen, Goodwin and Schlesinger, to prepare the press conference on Cuba. Kennedy: "There is only one person in the clear [in
        Cuba]—that''s Bill Fulbright." Of Schlesinger''s memorandum against the expedition: "Arthur wrote me a memorandum that will look pretty good when he gets around to writing his book on
        my administration—only he better not publish that memorandum while I''m still alive!" By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 118. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-04-21.cuba]]. Names: Rusk, Salinger, Bundy, Sorensen, Goodwin, Schlesinger, Kennedy, Fulbright.'
      tags:
      - name:rusk-dean
      - name:salinger-pierre
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:fulbright-j-william
      - city:washington
- add:
    entry:
      id: cal.1961-04-21.cuba-bay-of-pigs-4
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba-bay-of-pigs
      c: 'The President''s office, later in the day, Schlesinger coming to say goodbye before leaving for Italy. Johnson, sitting by the desk, invites him in. Schlesinger: the most effective way
        to restore world confidence would be a quick and visible reorganization of the CIA. Johnson agrees; he cannot understand how Dulles and Bissell could be so wrong, Dulles having said in
        that very office that he was much more confident of the Cuban operation than he had ever been of Guatemala. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 118. Made public: [[w.schlesinger-journals]] (2007). Names: Johnson, Schlesinger, Dulles, Bissell.'
      tags:
      - name:johnson-lyndon-b
      - name:schlesinger-arthur-m-jr
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - city:washington
- add:
    entry:
      id: cal.1961-07-28.berlin-and-vienna
      when: July 28
      date: '1961-07-28'
      thread: berlin-and-vienna
      c: 'Kissinger to Schlesinger, Friday morning: he feels excluded by Bundy, who urged him not to come down full time though Kennedy had asked, has never asked his advice nor answered his memoranda
        on Berlin, and never made clear what Kennedy wanted when he asked to see him. Schlesinger will find out the President''s views of his usefulness. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 124. Made public: [[w.schlesinger-journals]] (2007). Names: Kissinger, Schlesinger, Bundy, Kennedy.'
      tags:
      - name:kissinger-henry-a
      - name:schlesinger-arthur-m-jr
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-09-02.testing
      when: Sept. 2
      date: '1961-09-02'
      thread: testing
      c: 'Rusk calls a meeting on taking the Soviet resumption of tests to the UN: Cleveland, Bohlen, Dean, McCloy and Schlesinger. Dean, McCloy and Bohlen argue against: nothing gained, and freedom
        of action restricted. McCloy to Cleveland on world opinion: "I don''t believe in world opinion. The only thing that matters is power." He believes the Russians "have been cheating us all
        along." Bohlen disputes him. Rusk proposes a meeting with the President on Tuesday. By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 134. Made public: [[w.schlesinger-journals]] (2007). See [[cal.1961-09-01.testing]]. Names: Rusk, Cleveland, Dean, McCloy, Schlesinger. Check: the day; the
        page has the meeting "the next morning" after the talk with Kennedy of Friday, Sept. 1.'
      tags:
      - name:rusk-dean
      - name:cleveland-j-harlan
      - name:dean-arthur-h
      - name:mccloy-john-j
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1963-03-07.soviet-union-2
      when: Mar. 7
      date: '1963-03-07'
      thread: soviet-union
      c: 'Harriman''s, dinner for Ambassador Dobrynin, with Rostow, Charles Thayer, Michael Forrestal and Schlesinger. Harriman, directing the talk, makes two points. First, that the United States
        and the USSR have a common interest in restraining Communist China: it draws little reaction. Second, on testing: Kennedy''s problem in gaining ratification of a test ban unless he can
        show the national interests fully protected; it would be easier for Khrushchev to go up to six on-site inspections than for Kennedy to go down to three. "The point seemed to register with
        Dobrynin." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 186–87. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Dobrynin, Rostow, Forrestal, Schlesinger, Kennedy, Khrushchev.'
      tags:
      - name:harriman-w-averell
      - name:dobrynin-anatoly
      - name:rostow-walt-w
      - name:forrestal-michael-v
      - name:schlesinger-arthur-m-jr
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - city:washington
- add:
    entry:
      id: cal.1963-06-07.testing
      when: June 7
      date: '1963-06-07'
      thread: testing
      c: Bundy, Rostow, Kaysen, Sorensen and Schlesinger meet on Sorensen's draft of the President's speech on peace for June 10, which contains the announcement of a moratorium on nuclear testing.
        Neither Rusk nor McNamara, so far as Schlesinger can tell, has seen the draft or knows of the announcement. The five think the speech fine and suggest only minor changes; State and Defense
        are informed in the afternoon. Sorensen flies to Honolulu, where the President addresses the Mayors' Conference the next day. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 194. Made public: [[w.schlesinger-journals]] (2007). Names: Bundy, Rostow, Kaysen, Sorensen, Schlesinger, Rusk, McNamara.'
      tags:
      - name:bundy-mcgeorge
      - name:rostow-walt-w
      - name:kaysen-carl
