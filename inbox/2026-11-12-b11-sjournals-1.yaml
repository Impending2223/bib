- add:
    entry:
      id: cal.1963-06-18.testing
      when: June 18
      date: '1963-06-18'
      thread: testing
      c: 'Lunch of Harriman, Ray Cline and Schlesinger, on Harriman''s impending mission to Moscow. Harriman: "Each of the nations has an urgent political interest. We want to get the Russian
        troops out of Cuba. The British want a test ban agreement. The Russians want a guarantee against the nuclear armament of Germany—and I agree with them on this point." He has no belief
        in the multilateral nuclear force and would go quite far to meet the Soviet wishes on Germany to get movement elsewhere, such as the test ban; none of the three optimistic of an agreement.
        By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 195. Made public: [[w.schlesinger-journals]] (2007). Names: Harriman, Schlesinger.'
      tags:
      - name:harriman-w-averell
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1963-10-23.program
      when: Oct. 23
      date: '1963-10-23'
      thread: program
      c: Kennedy calls Schlesinger in, hands him a draft Sorensen wrote for Amherst on Saturday, which seems to him "thin and stale," and asks him to try his hand at it. Schlesinger writes a speech
        on the place of the arts in a democracy. By Schlesinger's journal.
      n: '[[w.schlesinger-journals]], 202. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Sorensen, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:sorensen-theodore-c
      - name:schlesinger-arthur-m-jr
      - city:washington
- add:
    entry:
      id: cal.1963-10-26.program
      when: Oct. 26
      date: '1963-10-26'
      thread: program
      c: 'Amherst. Kennedy takes Schlesinger with him, having invited him by telephone on Friday night. On the plane north he works over Schlesinger''s draft, toning down the fancier passages
        and adding an opening section of his own on the obligations of young men of privilege. On Eisenhower''s reminiscences, on the way: "Apparently he never did anything wrong. When we come
        to writing the memoirs of this administration, we''ll do it differently." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 202. Made public: [[w.schlesinger-journals]] (2007). Names: Kennedy, Schlesinger, Eisenhower.'
      tags:
      - name:kennedy-john-f
      - name:schlesinger-arthur-m-jr
      - name:eisenhower-dwight-d
      - state:ma
- add:
    entry:
      id: cal.1963-12-23.elections-1964-vice-presidency
      when: Dec. 23
      date: '1963-12-23'
      thread: elections-1964-vice-presidency
      c: 'Robert Kennedy to Schlesinger, in their talks of the past days, on bargaining with Johnson: the Kennedys'' power rests on their relation to the big-city machines, Daley, Green, Buckley,
        Crotty; Johnson will have to consult them about the Vice Presidency, and they will have some say on the Secretary of State of the next cabinet. "I will be perfectly willing to ask President
        Johnson what his plans are for the State Department before we decide the role we are going to play in the campaign." A nominal role or a real one: "It may make a difference, for example,
        whether Jackie appears with Johnson at the last big rally, or whether she goes to Europe in the autumn for her health." By Schlesinger''s journal.'
      n: '[[w.schlesinger-journals]], 217. Made public: [[w.schlesinger-journals]] (2007). Names: Robert Kennedy, Schlesinger, Johnson, Daley. Check: the day; the entry is headed Dec. 23 and speaks
        of "several talks."'
      tags:
      - name:kennedy-robert-f
      - name:schlesinger-arthur-m-jr
      - name:johnson-lyndon-b
      - name:daley-richard-j
- cite:
    id: cal.1960-07-12.elections-1960-6
    item: '[[w.schlesinger-journals]], 71–73 (the entry headed July 13: Humphrey calls the Minnesota caucus to order at 10:30 a.m., Kennedy and the other candidates having addressed it the day
      before; Stevenson, who has agreed to come, enters to a crowd that "went wild" and speaks, "polished, graceful, courtly, charming, rather noncommittal"; at 6 o''clock Stevenson comes to the
      floor, "The galleries went mad" and on the floor "there was pandemonium"; invited to the rostrum, he repeats his Biltmore joke ("the last man to survive") and the demonstration "quieted
      down almost instantly"; not the Sheraton-West meeting)'
    units: '?'
- check:
    id: cal.1960-07-12.elections-1960-6
    text: 'Check: the day and the hour: [[w.schlesinger-journals]], 71–73, has the Minnesota caucus at 10:30 a.m. and the floor appearance at 6 o''clock in the entry headed July 13; this entry
      has the afternoon of July 12 for the floor.'
- cite:
    id: cal.1960-06.democratic-party
    item: '[[w.schlesinger-journals]], 69–70 (the journal of June 16: Cleveland''s story that Galbraith, Rauh, Commager and Schlesinger were coming out for Kennedy, two days after Stevenson stayed
      with the Schlesingers on June 5, and Winship''s in the Globe the next day; Saltonstall''s letter for the group to sign; Schlesinger''s own statement once the story broke, that Stevenson
      was best qualified but, he not being a candidate, he was for Kennedy; not the statement''s text or its day, nor Stevenson''s partisans or Marian Schlesinger)'
    units: '?'
- cite:
    id: cal.1960-06-12.elections-1960
    item: '[[w.schlesinger-journals]], 70–71 (Hyannis Port on Sunday, June 12, with Galbraith, Marian Schlesinger and Schlesinger from noon to about 4: Kennedy "regards Johnson as his main opponent
      now," calls him a "riverboat gambler," and on Addison''s disease says he takes medication only at times of fatigue or stress; not the vice presidency, Humphrey, Reuther or Conway)'
    units: '?'
- cite:
    id: cal.1960-07-13.elections-1960-3
    item: '[[w.schlesinger-journals]], 73 (Robert Kennedy''s 8:30 staff meeting before the balloting, in the journal entry headed July 14: the states run through for "the rock-bottom Kennedy tally,"
      about 740 votes, 21 short of a majority; "if Jack had 720 votes by Washington, enough votes would shift"; not the words "If we don''t win tonight, we''re dead" or Washington''s delegates)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960-los-angeles-4
    item: '[[w.schlesinger-journals]], 74 (at Kennedy headquarters after the nomination, Schlesinger urges conciliation of the Stevenson people; Kennedy: "Arthur, human nature requires that you
      allow us 48 hours. Adlai has given us a rough time over the last three days"; the page gives no hour and has neither Doyle nor McCarthy; the journal entry is headed July 14)'
    units: '?'
- cite:
    id: cal.1960-07-14.elections-1960
    item: '[[w.schlesinger-journals]], 75–76 (Graham''s account to Schlesinger at dinner on July 15: Kennedy called Johnson early Thursday and called on him about 10:30 without raising the ticket;
      after 3 o''clock he telephoned him to ask him to go on it; Robert Kennedy came to Rayburn, then into Johnson''s suite, saying Johnson would face a floor fight and should withdraw; Graham
      got Kennedy on the telephone, who said it was too late, his statement already released; not the nomination by acclamation)'
    units: '?'
- cite:
    id: cal.1960-09-14.elections-1960
    item: '[[w.schlesinger-journals]], 89 (the Liberal Party banquet of Sept. 14: both Kennedy and Stevenson asked Schlesinger for their speeches that night and he wrote both, "a fact I have carefully
      kept secret"; Stevenson''s speech "a great success in the evening, but so was Kennedy''s")'
    units: B
- cite:
    id: cal.1960-10-11.elections-1960-kennedy
    item: '[[w.schlesinger-journals]], 85–87 (the lunch at the Carlyle after Jacqueline Kennedy''s call to bring Schlesinger to New York for debate preparation: Kennedy on Nixon in the debates,
      the studio cooled to almost 60 degrees, NBC; Schlesinger''s offer to join the group weighed against the publicity that Stevenson''s "ace speech writer" was taking over; "Think it over till
      Thursday"; Schlesinger''s talk with Cox on Oct. 4 and with Martin on the senatorial group''s hold on speeches, and Nixon''s line on a party of "Schlesinger, Galbraith and Bowles"; not "Ted
      is indispensable to me" or the day by name)'
    units: '?'
- cite:
    id: cal.1960-10-13.elections-1960-kennedy
    item: '[[w.schlesinger-journals]], 88 (the noon press conference staged by Saltonstall, attended by guests from Bette Davis to Van Wyck Brooks; Kennedy a little late, "shook hands all around,
      said a few words" and held an impromptu press conference)'
    units: B, C
- cite:
    id: cal.1960-10-13.elections-1960-kennedy-2
    item: '[[w.schlesinger-journals]], 88 (lunch on the 34th floor with Galbraith, Sorensen and Schlesinger, a couple of hours of possible debate questions "mostly" on the offshore islands, Kennedy
      "a little nervous about the Q—M issue"; "I think we had better delay any decision about you"; not the elevator remark)'
    units: A
- cite:
    id: cal.1960-10-20.elections-1960-kennedy
    item: '[[w.schlesinger-journals]], 90–91 (two telephone calls on the 20th, the day after the Smith dinner: Kennedy thinks he has "everything made except the religious issue," and action against
      Castro must be multilateral, with the other American republics; the Smith dinner remark is varied; not Nixon''s inroads among suburban Catholics, which the page gives as the Kennedy people''s
      reckoning, not Kennedy''s)'
    units: B, D
- variant:
    id: cal.1960-10-20.elections-1960-kennedy
    unit: E
    witness: w.schlesinger-journals
    reads: 'Kennedy, ironically entertained that the high Catholic audience at the Smith dinner had applauded Nixon a good deal more than it had applauded him: "It all goes to show ... that, when
      the chips are down, money counts more than faith"'
    at: '90'
- cite:
    id: cal.1960-10-20.cuba
    item: '[[w.schlesinger-journals]], 90 (Schlesinger read in the evening papers a "jingoistic Kennedy statement on Cuba, promising support to the fighters for freedom" after hearing Kennedy''s
      views that action be multilateral; "I later learned from Jack that Dick Goodwin had put this statement out without clearing with him"; the page does not give the statement''s words)'
    units: '?'
- cite:
    id: cal.1960-10-23.elections-1960-kennedy
    item: '[[w.schlesinger-journals]], 91 (Kennedy had been trying to call Schlesinger from Madison, Wisconsin, as he was leaving for Chicago; Schlesinger called back; Kennedy wanted Reston and
      Lippmann told that by support he meant moral and psychological support, not political or military, within the OAS; Reston not reached (on the Nixon train); Lippmann the next day not impressed,
      thinking "the Kennedy people had been trying to play the issue both ways and deserved to be called on it"; not the words "support from our Government")'
    units: B, C
- cite:
    id: cal.1960-12-01.transition-and-staff-2
    item: '[[w.schlesinger-journals]], 94–97 (the journal of Dec. 1: Evelyn Lincoln''s appointment for noon in the Senate office, Georgetown after, Lovett to lunch; Kennedy''s talk of Freeman,
      Goldberg and Udall, Fulbright ("I judge ... Bill is currently ahead for State"), then "What about Adlai for Attorney General?"; Kennedy: "I think I''ll call [Blair] tonight"; not Hodges
      or Ribicoff, nor Stevenson''s preference for the UN)'
    units: A, D, E, G
- cite:
    id: cal.1960-12-01.transition-and-staff-cabinet-3
    item: '[[w.schlesinger-journals]], 95 (after Schlesinger''s pitch for Youngman at Treasury, "What about Averell?" and Kennedy "something to the general effect that he was too old hat"; the
      page does not say for which post)'
    units: B, C
- cite:
    id: cal.1961-01-09.transition-and-staff
    item: '[[w.schlesinger-journals]], 102 (Kennedy''s visit to 109 Irving Street on Jan. 9, Secret Service and police around the house, about 300 people in the cold, arriving about 2:20 and leaving
      shortly before 5; Schlesinger with him 2:30 to 3:30, then Surrey''s tax task force, Chayes, Bundy, Stratton and Wiesner; Bundy proposes Seaborg for the AEC and, after talking with Kennedy,
      calls him from the house; the page does not say he offered it, nor mention the Legislature, the Overseers or Bundy''s post; Schlesinger''s appointment as Special Assistant is a footnote)'
    units: '?'
- cite:
    id: cal.1961-03-28.cuba
    item: '[[w.schlesinger-journals]], 108 (late in the afternoon Schlesinger sees the President on the Cuba piece; he is "surprisingly generous," asks whether "if not in execution" is not "snide"
      and suggests omitting it; "What do you think about this damned invasion?" "I think about it as little as possible"; they agree the weak part of the case lies in the theory of an immediate
      local response to a landing; not the Herald Tribune reporter)'
    units: A, B, C
- cite:
    id: cal.1961-04-04.cuba
    item: '[[w.schlesinger-journals]], 108 (the "penultimate Cuba meeting" Tuesday late afternoon in a small conference room beside Rusk''s office at State: Fulbright, not at earlier meetings,
      denounces the operation as excessive and hazardous, "an excellent old-American speech"; McNamara favors it; not the hour, Rusk''s position, the others'' votes, Hawkins or the President''s
      wish)'
    units: '?'
- cite:
    id: cal.1961-04-04.cuba-2
    item: '[[w.schlesinger-journals]], 108–09 (3:30 "today" in the entry headed April 5: Schlesinger with Bonsal, Berle and Miró Cardona, to persuade him to give the program more social and economic
      content ("It is foolish if the Cuban Revolutionary Council turns out to be to the right of the New Frontier"); the program full of appeals to the foreign investor, bankers and the dispossessed
      owner and nothing for the worker or the farmer; Miró agrees, but half his Miami audience takes him for a Communist when he speaks of social justice; not the Negro or the move to New York)'
    units: '?'
- check:
    id: cal.1961-04-04.cuba-2
    text: 'Check: the day: [[w.schlesinger-journals]], 108–09, puts the meeting with Bonsal, Berle and Miró Cardona at 3:30 "today," in the entry headed Apr. 5, after the State Department meeting
      of Tuesday, Apr. 4.'
- cite:
    id: cal.1961-04-06.press-and-broadcasting
    item: '[[w.schlesinger-journals]], 109 (Thursday morning Gil Harrison sent over the pseudonymous "Our Men in Miami," a careful and substantially accurate account of CIA activities in Miami;
      Schlesinger handed it to the President, who "soon sent me word that he hoped it could be stopped"; Schlesinger "called Gil," who "accepted the suggestion promptly and without questions";
      not Karl Meyer or the words attributed to Kennedy and Harrison)'
    units: '?'
- check:
    id: cal.1961-04-06.press-and-broadcasting
    text: 'Check: [[w.schlesinger-journals]], 109, has Schlesinger hand the article to Kennedy, who "sent me word that he hoped it could be stopped," and then "call[ ] Gil," not see the publisher;
      the words "Stop it" and the quoted tribute to Harrison are not on the page.'
- cite:
    id: cal.1961-04-07.cuba-2
    item: '[[w.schlesinger-journals]], 109–10 ("Thursday morning opened with the usual Cuba meeting"; on Friday morning ("this morning") Goodwin and Schlesinger breakfast to see whether one more
      try could reverse the decision, and Bundy and Rostow, joining them, discourage it; at the end of the afternoon Kennedy has decided, having "pared down the operation from an invasion to a
      mass infiltration"; not Goodwin to Rusk or Rusk''s words)'
    units: C
- variant:
    id: cal.1961-04-07.cuba-2
    unit: D
    witness: w.schlesinger-journals
    reads: 'Kennedy: "If we have to get rid of those 800 men, it is much better to dump them in Cuba than in the United States"'
    at: '110'
- cite:
    id: cal.1961-04-08.cuba
    item: '[[w.schlesinger-journals]], 110 (Saturday, Apr. 8: Schlesinger at the U.S. Delegation to the UN in New York; Stevenson "wholly disapproves of the project, objects to the fact that he
      was given no opportunity to comment on it, and believes it will cause infinite trouble," but is "substantially the good soldier about it and is prepared to try and make the best possible
      U.S. case"; the page does not mention Barnes, a briefing or Stevenson''s leaving it thinking nothing would happen)'
    units: '?'
- cite:
    id: cal.1961-04-12.cuba-2
    item: '[[w.schlesinger-journals]], 110–11 ("our last Cuba meeting" on the 12th, with no hour: Kennedy again stresses making it as much as possible a Cuban operation; asks sharply whether the
      Revolutionary Council understands that U.S. recognition must await a secure position in Cuba and that there will be no overt U.S. intervention; Berle and Schlesinger to put this to Cardona
      the next day; not Bissell''s revision, the aircraft or the no-go times)'
    units: '?'
- cite:
    id: cal.1961-04-18.cuba-3
    item: '[[w.schlesinger-journals]], 112–13 (Tuesday lunch with Reston, whom Schlesinger had seen Monday; Kennedy: "I probably made a mistake in keeping Allen Dulles on"; "I made a mistake in
      putting Bobby in the Justice Department. He is wasted there.... Bobby should be in the CIA"; defeat "would be an incident, not a disaster"; Stewart Alsop''s drink before the lunch; the page
      does not give "no Marines")'
    units: A, B, D
- cite:
    id: cal.1961-04-19.cuba-3
    item: '[[w.schlesinger-journals]], 113–17 (Apr. 19: Berle and Schlesinger fly south by MATS and reach Opa-locka at 8:15; six Council members in fatigues (Miró Cardona, Ray, Varona, Hevia,
      Carrillo, Maseo) with Bender of the CIA; Varona''s and Ray''s indictment of the CIA; past 10 Washington says the operation is substantially over; Schlesinger telephones the White House twice
      and Kennedy wants the Council brought there; in the Cabinet Room late in the afternoon Kennedy expresses regret and explains "why he had decided against American intervention"; the page
      does not give "till six" or "you are all free men")'
    units: '?'
- cite:
    id: cal.1961-04-28.opinion
    item: '[[w.schlesinger-journals]], 121 (the journal of May 7: an advance on the new Gallup poll, brought by Evelyn Lincoln on May 3, "showing Kennedy at an unprecedented 82 percent of approval";
      Kennedy: "The worse I do, the more popular I get")'
    units: '?'
- cite:
    id: cal.1961-05-03.cuba-bay-of-pigs
    item: '[[w.schlesinger-journals]], 120–21 (Kennedy, May 3 late afternoon, "cool and composed"; Evelyn Lincoln comes in with "an advance on the new Gallup poll, showing Kennedy at an unprecedented
      82 percent of approval"; Kennedy: "It''s just like Eisenhower. The worse I do, the more popular I get"; the remarks on a British prime minister and on his charm are not on the page)'
    units: C
- variant:
    id: cal.1961-05-03.cuba-bay-of-pigs
    unit: D
    witness: w.schlesinger-journals
    reads: 'Kennedy, waving a sheaf of cables from Lemnitzer apparently urging intervention in Laos: "If it hadn''t been for Cuba ... we might be about to intervene in Laos now"; "I might have
      taken this man''s advice seriously"'
    at: '120'
- cite:
    id: cal.1961-07-20.testing
    item: '[[w.schlesinger-journals]], 122–23 (Thursday afternoon, July 20: Bundy, Sorensen and Schlesinger with the President on the test ban strategy; Kennedy "obviously unconvinced that the
      military gains will make up for the political losses"; "It cannot be said that I''m hot for it myself"; the pressure from the Joint Committee on Atomic Energy; the page names Schlesinger''s
      rewrite of Murrow''s memorandum to Bowles, not Murrow''s and Schlesinger''s proposals, the Geneva talks, Dean or the neutrals)'
    units: '?'
- cite:
    id: cal.1961-08-08.testing
    item: '[[w.schlesinger-journals]], 126–28 (Tuesday, Aug. 8: the National Security Council hears the Panofsky Panel; Lemnitzer for the Chiefs, "we do see urgency in testing for small-yield
      weapons development" but no objection to "a reasonable delay"; exchanges on the neutron bomb with Foster, Wiesner, Taylor, Bradbury, and McCloy: postpone to the first of the year; Kennedy:
      "We can''t jeopardize [the test ban treaty] by giving indications that we intend to resume testing"; the page does not give Dulles or the agreement on "within a reasonable time")'
    units: '?'
- cite:
    id: cal.1961-08-31.testing
    item: '[[w.schlesinger-journals]], 130–32 (Thursday morning''s meeting before the congressional leaders at 10:45 (Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow,
      Fisher, Bundy, Scoville and Schlesinger present): Rusk proposes a statement announcing the decision to resume; Kennedy, after a call from Stevenson, turns it into preparations ordered; Johnson:
      "it would be a good thing if you let Khrushchev take the heat for a few days"; Murrow against the statement; the page does not give the White House statement''s text)'
    units: '?'
- cite:
    id: cal.1961-09-01.testing
    item: '[[w.schlesinger-journals]], 132–33 (Friday, Sept. 1: McCloy, Dean, Bundy and Schlesinger with Kennedy at 11, the statement for Dean to issue written by Schlesinger; at 3 Bundy''s call
      that a Soviet test seems to have taken place; two statements brought to Kennedy at the Mansion, in a bathrobe: McCloy for announcing resumption, Murrow and Schlesinger against; he "was not
      inclined to announce our resumption at this point but did not know how much longer he could refrain"; later he decides against the Security Council: "It would look hypocritical")'
    units: '?'
- cite:
    id: cal.1961-09-05.testing
    item: '[[w.schlesinger-journals]], 135 (Sept. 5: on the plane down from Otis, Mac Bundy tells Schlesinger that the President has been "harder and harder to restrain"; when the third Soviet
      test was reported "today," "the statement was released (without much consultation among his advisers) at five this afternoon")'
    units: '?'
- cite:
    id: cal.1962-01-11.program
    item: '[[w.schlesinger-journals]], 144 (the morning of the speech: Kennedy reads the new domestic paragraph in bed about 9:30; by Bundy''s later account, at the last moment Sorensen says "I
      really don''t see much need for that new paragraph"; Bundy: "I think you should say it"; Kennedy: "I think so too," and does; the paragraph reaches the Times''s "Quotation of the Day"; the
      page gives none of the speech''s contents)'
    units: '?'
- cite:
    id: cal.1962-02-22.robert-kennedy-trip
    item: '[[w.schlesinger-journals]], 147–48 (Berlin, Feb. 22: Brandt, Clay and Lightner meet Robert Kennedy at the airport; a motorcade to the Rathaus and a crowd of perhaps 100,000; Robert
      Kennedy''s impromptu speech ("They will let their balloons come over—but not their people"); the Free University speech in the evening, "We have not forgotten those in East Germany"; Schlesinger''s
      talk with Brandt on the Wall)'
    units: '?'
- cite:
    id: cal.1962-09-17.mississippi-ole-miss
    item: '[[w.schlesinger-journals]], 166 (Monday, Sept. 17, Schlesinger at Justice about 6:30: Guthman''s draft statement; Katzenbach, in the background, sees "no reason to issue a statement
      at that time"; Robert Kennedy agrees with him, the statement deferred, and he talks with his people "about the best mode of protecting the Negro student when he tried to register"; the page
      has Schlesinger add "a quotation from the Mississippi Legislature in 1832," not a resolution)'
    units: B, C
- cite:
    id: cal.1962-09-29.mississippi-ole-miss
    item: '[[w.schlesinger-journals]], 167–71 (the first of Kennedy''s telephone calls to Barnett, of which the page gives "only his half of the dialogue": Kennedy: "Here''s my problem, Governor
      ... under the Constitution I have to carry out the law"; Watkins is to come to Washington; the Court''s order gives Barnett until Tuesday; Barnett thanks him "for your help on the poultry
      problem"; Barnett to "tell ''em to cool off and you can sneak him in"; the page does not give the day or the hours)'
    units: '?'
- check:
    id: cal.1962-09-29.mississippi-ole-miss
    text: 'Check: the day: [[w.schlesinger-journals]], 167–71, has Schlesinger write the presidential statement on the Saturday after Robert Kennedy''s request on Friday, then be called back from
      the Cosmos Club to the President''s office as Kennedy was about to telephone Barnett ("the Court''s order ... gives you till Tuesday"); the entry heading gives no day; the page''s call is
      the one in which Barnett is to send Watkins to Washington, which may be the 2 p.m. call or another.'
- cite:
    id: cal.1962-10-22.missile-crisis-3
    item: '[[w.schlesinger-journals]], 175 (Monday, Oct. 22: the President tells Schlesinger to go to New York to work with Stevenson; at 11 Schlesinger meets Rusk, Robert Kennedy "and others,"
      who read his draft for the Security Council, "generally applauded"; "The President called for a few omissions—including a passage threatening an American strike if the Cuban build-up persisted";
      to New York after lunch; the page gives neither the Oval Office nor the other names nor Robert Kennedy''s words)'
    units: '?'
- cite:
    id: cal.1962-10-29.missile-crisis
    item: '[[w.schlesinger-journals]], 174 (Monday, Oct. 22, 10 a.m.: Schlesinger asks why the Russians did it; Kennedy gives three reasons (bring Russia and China closer; "radically redefine
      the setting in which the Berlin situation would be reopened after the election"; "deal the U.S. a tremendous political blow"); not the three reasons the policy worked)'
    units: '?'
- check:
    id: cal.1962-10-29.missile-crisis
    text: 'Check: the day of the three reasons the Soviets moved: [[w.schlesinger-journals]], 174, has Kennedy give them to Schlesinger at about 10 a.m. on Monday, Oct. 22 (Russia and China closer;
      the setting for Berlin after the election; "a tremendous political blow"), not on Oct. 29.'
- cite:
    id: cal.1963-05-04.alabama-birmingham
    item: '[[w.schlesinger-journals]], 189 (Saturday, May 4: a group of ADA local leaders, brought in by O''Donnell, see the President for 45 minutes; the photograph in that morning''s Times of
      a police dog lunging at a Negro made him "sick" but there was "nothing he could constitutionally do"; he questioned the demonstration''s timing: "I am not asking for patience"; the page
      does not give Marshall or Dolan)'
    units: A
- cite:
    id: cal.1963-05-24.civil-rights-the-executive
    item: '[[w.schlesinger-journals]], 191–93 (Robert Kennedy''s account to Schlesinger on Monday, June 3, of the meeting with Baldwin on Friday (the day not named): about a dozen Negroes, mostly
      writers and performers, at the Kennedy apartment, "nearly three hours"; Jerome Smith''s opening; Lena Horne; Belafonte and the lawyer for King afterward)'
    units: '?'
- cite:
    id: cal.1963-06-22.civil-rights-bill
    item: '[[w.schlesinger-journals]], 195–98 (Saturday morning, the Attorney General having asked Schlesinger to come: the Cabinet Room, King, Wilkins, Farmer, Whitney Young and A. Philip Randolph;
      Kennedy against the march before the bill was even in committee: "We want success in Congress, not just a big show at the Capitol"; King: "It is not a matter of either/or, but of both/and";
      Kennedy on Bull Connor, the Gallup poll (approval 60 to 47) and Negro children in school; the page does not give the number of leaders, a request to call off the march or the Rose Garden)'
    units: '?'
- cite:
    id: cal.1963-08-15.march-on-washington-2
    item: '[[w.schlesinger-journals]], 200 ("I saw the President briefly on the 15th": "a little concern about the March on Washington, scheduled for the 28th, on the grounds that it might not
      be large enough"; the leaders are committed to 100,000; if the turnout falls materially short, it will persuade some members of Congress that the demand is greatly exaggerated)'
    units: A, B, C
- cite:
    id: cal.1963-11-26.latin-america
    item: '[[w.schlesinger-journals]], 208 (Schlesinger and Goodwin at the East Room meeting of Latin American diplomats "called to enable Johnson to reaffirm our national commitment to the Alliance
      for Progress"; Johnson reads "fairly well a few remarks prepared by Dick"; Jackie came down and attended; the page does not give her wish or the pledge''s words)'
    units: '?'
- cite:
    id: cal.1963-11-27.succession
    item: '[[w.schlesinger-journals]], 210 (Schlesinger in Mrs. Johnson''s box, invited by Cliff Carter by telephone after midnight and by Lady Bird in the morning; Johnson "delivered it with
      dignity and force"; "The reference to the civil rights bill and the appeal against hate won the loudest applause"; Robert Kennedy "pale, somber and inscrutable")'
    units: '?'
- cite:
    id: cal.1963-12-05.robert-kennedy
    item: '[[w.schlesinger-journals]], 211–13 (Dec. 5, "a melancholy flight to Boston on the Caroline" with Robert Kennedy, Edward Kennedy and Evelyn Lincoln, "to incorporate the Kennedy Memorial
      Library"; Robert Kennedy does not like "taking a job which was really based on the premise of waiting around for someone to die"; Schlesinger''s first reaction negative; also his advice
      to stay at Justice and then private life, the FBI''s "revolt," and Johnson''s intention in due course to make McNamara Secretary of State; not Dolan)'
    units: A, B, C, D
- cite:
    id: cal.1963-12-13.robert-kennedy
    item: '[[w.schlesinger-journals]], 214 (Robert Kennedy''s proposal, in a memorandum, to lift the travel restrictions everywhere, Cuba included, after Schlesinger told him that afternoon of
      State''s meeting (the proposal from Abba Schwartz with Harriman''s backing); "I don''t see how we can prosecute every student who wants to see Cuba"; the page does not give Martin or Ball)'
    units: '?'
- cite:
    id: cal.1963-12-13.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 214–15 (late afternoon, Goodwin and Schlesinger with Robert Kennedy: "The important thing for us to do now is to stick together. Our power will last for
      just eleven months. It will disappear the day of the election"; "There are a hundred men scattered through the government who are devoted to the purposes"; "He knows all about politics and
      nothing about human beings"; Schlesinger "more and more persuaded that he should go for the vice presidency"; the page has no Harriman or Mann and not "After November 5th we''ll all be dead")'
    units: '?'
- cite:
    id: cal.1964-01-27.transition-and-staff
    item: '[[w.schlesinger-journals]], 224 ("On January 27 I submitted my resignation. It was accepted with alacrity. LBJ received it at 8 P.M. Monday evening, and his letter of acceptance was
      in my hands by noon the next day," drafted, Schlesinger believes, by Moyers; not Goldman)'
    units: B
- cite:
    id: cal.1964-07-16.elections-1964-johnson
    item: '[[w.schlesinger-journals]], 228–29 (Galbraith "summoned to Washington by LBJ" on July 15, "three hours with him that evening and another hour the next morning"; Johnson went through
      eighteen vice presidential possibilities, narrowed to six: Humphrey, Kennedy, McNamara, Stevenson, McCarthy, Shriver; he complained of the Kennedy people''s coldness; the page has no breakfast,
      Mrs. Johnson, the poverty bill or Humphrey''s friendliness)'
    units: '?'
- check:
    id: cal.1964-07-16.elections-1964-johnson
    text: 'Check: the length and the day: [[w.schlesinger-journals]], 228, has three hours with Johnson on the evening of July 15 and another hour the next morning, not two hours at breakfast.'
- cite:
    id: cal.1964-07-29.robert-kennedy
    item: '[[w.schlesinger-journals]], 229–30 (Wednesday meeting as Robert Kennedy told it to Schlesinger on July 29 and again on Aug. 2: Johnson nervous, outlined the vice presidential requirements
      and said "In my judgment, you don''t have them"; he would then help Kennedy get anything he wanted, "any place in the cabinet, any embassy, London, Paris, Moscow," and was sure Kennedy would
      be President some day; Kennedy not interested in anything at the moment; the page has no campaign management and no hour)'
    units: '?'
- cite:
    id: cal.1964-07-29.robert-kennedy-2
    item: '[[w.schlesinger-journals]], 230 ("Mac Bundy called him up the next day" and suggested he put out a statement withdrawing from the vice presidential contest on his own initiative, good
      for the President, the party and Kennedy; Kennedy: it wasn''t true, and it would be hard to explain to his supporters)'
    units: '?'
- check:
    id: cal.1964-07-29.robert-kennedy-2
    text: 'Check: the day: [[w.schlesinger-journals]], 230 (Aug. 2), has Bundy''s call "the next day," after the Wednesday meeting of July 29, i.e. July 30.'
- cite:
    id: cal.1963-11-23.assassination-6
    item: '[[w.schlesinger-journals]], 204–05 (the casket arrives in the East Room from Bethesda before the 5:15 a.m. note, Jacqueline Kennedy and Robert Kennedy following, a priest saying a few
      words; Robert Kennedy asks Nancy Tuckerman and Schlesinger to go in, look at the bier and say whether the casket should be open or shut; "Nancy and I told this to Bobby and voted to keep
      the casket closed. When Bill Walton agreed, Bobby gave instructions that it should be closed"; the page does not say he had it opened)'
    units: A, C
- cite:
    id: cal.1963-11-25.succession-3
    item: '[[w.schlesinger-journals]], 207–08 (the entry headed Nov. 25: "My guess is that he will be pretty good on issues, and that in some respects he will be more liberal than JFK")'
    units: A
- cite:
    id: cal.1963-12-05.assassination-3
    item: '[[w.schlesinger-journals]], 214 (Dec. 5: Robert Kennedy, asked about Oswald, "there could be no serious doubt that he was guilty, but there was still argument whether he did it by himself
      or as part of a larger plot, whether organized by Castro or by gangsters"; the FBI thought him alone, McCone thought two people involved in the shooting)'
    units: A, B
- cite:
    id: cal.1963-12-30.transition-and-staff
    item: '[[w.schlesinger-journals]], 218–19 (the entry headed Dec. 30: Johnson "a quick study in the sense that he can be briefed effectively before a meeting, but that, unlike JFK, he does
      not retain what he has been told beyond the meeting"; "Policy for Johnson has always been determined by the balance of political pressures. Now he must begin to examine the merits of policy
      per se, and he is not intellectually or psychologically prepared to do this")'
    units: A, B
- cite:
    id: cal.1964-08-26.elections-1964-2
    item: '[[w.schlesinger-journals]], 231–32 (Schlesinger in the Minnesota delegation when Johnson announced the choice; Freeman, asked when Humphrey had had the word: "so far as he knew, Hubert
      had known nothing definite until he went to the White House that day"; of their hour together: "Whatever they talked about, I bet that Hubert had to sign it in blood"; the page has no Dodd,
      the Cabinet Room or the hour)'
    units: '?'
