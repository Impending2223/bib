patch: 2026-11-12-b10-pilot-mao-1962-10
by: 'Claude (batch 10, the foreign pilot, the PRC: *Mao Zedong nianpu 1949–1976*, V, October 1962, from the owner''s Drive epub of the 2013 set), Nov. 12, 2026'
ops:
# ---------------------------------------------------------------- the leadership at home
- add:
    entry:
      id: cal.1962-10-01.china
      when: Oct. 1
      date: '1962-10-01'
      thread: china
      c: 'Peking, Tiananmen, 10 a.m. Mao Zedong, with Liu Shaoqi, Dong Biwu, Zhu De, Zhou Enlai, Deng Xiaoping and others, at the rally for the People''s Republic''s thirteenth anniversary; reviews the parade. Watches the fireworks from the gate tower at night.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 1, 1962. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-01.china-2
      when: Oct. 1
      date: '1962-10-01'
      thread: china
      c: 'Mao Zedong to Zhou Enlai: see to the safety of the central leaders; strengthen the guard. Zhou forms a nine-man leading group for security, Luo Ruiqing its head, Xie Fuzhi his deputy.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 1, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-08.china
      when: Oct. 8
      date: '1962-10-08'
      thread: china
      c: 'Mao Zedong reads the Central Committee General Office''s bulletin of Oct. 4, no. 348, "A case of fear of the enemy": in August a commune Party secretary at Shuangquan, Bei''an, Heilongjiang, fires at wolves by night; cadres and commune members take it for an enemy attack and flee. Mao sends it to Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Luo Ruiqing and Xie Fuzhi: "此事拟在常委会上谈一谈" (this to be talked over at the Standing Committee).'
      n: '*Qingkuang jianbao* (情况简报), no. 348, Oct. 4, 1962, "恐''敌''病一例." [[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1962 ("同日"). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-10.china
      when: Oct. 10
      date: '1962-10-10'
      thread: china
      c: 'Zhongnanhai, the Yinian Tang, afternoon. Mao Zedong receives Cambodia''s departing ambassador (兰·涅特 in the Chinese); Zhou Enlai present. Mao: China and Cambodia friends, each supporting the other; Cambodia''s struggle under Prince Sihanouk right, and much of the world behind it; "你们会胜利的" (you will win).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 10, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Norodom Sihanouk. Check: the ambassador''s name in Khmer or French.'
      tags: [name:mao-zedong, name:zhou-enlai, name:norodom-sihanouk, polity:prc, polity:cambodia]
- add:
    entry:
      id: cal.1962-10-14.china
      when: Oct. 14
      date: '1962-10-14'
      thread: china
      c: 'Zhongnanhai, the Juxiang Shuwu, evening. Mao Zedong calls Zhou Enlai and others to a meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 14, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none; the border with India the likeliest).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-15.china
      when: Oct. 15
      date: '1962-10-15'
      thread: china
      c: 'Zhongnanhai, the Yinian Tang, evening. Mao Zedong calls Zhou Enlai and others to a meeting again.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 14, 1962 (the entry for Oct. 14: "十五日晚上，又在颐年堂召集周恩来等开会"). See [[cal.1962-10-14.china]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-20.china
      when: Oct. 20
      date: '1962-10-20'
      thread: china
      c: 'Zhongnanhai, the Juxiang Shuwu, 7 p.m., the first day of the war with India. Mao Zedong calls Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping and others to a meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1962. See [[cal.1962-10-20.india-and-china]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-21.china
      when: Oct. 21
      date: '1962-10-21'
      thread: china
      c: 'Zhongnanhai, 7 p.m. Mao Zedong with Zhou Enlai.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1962 (the entry for Oct. 20: "二十一日晚七时，同周恩来谈话"). See [[cal.1962-10-20.china]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-22.china
      when: Oct. 22
      date: '1962-10-22'
      thread: china
      c: 'Zhongnanhai, the Juxiang Shuwu, 7 p.m. Mao Zedong calls Zhou Enlai and others to a meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1962 (the entry for Oct. 20: "二十二日晚七时，在中南海菊香书屋召集周恩来等开会"). See [[cal.1962-10-20.china]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-26.china
      when: Oct. 26
      date: '1962-10-26'
      thread: china
      c: 'Zhongnanhai, the Juxiang Shuwu, evening. Mao Zedong calls Zhou Enlai and others to a meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 26, 1962. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-27.china
      when: Oct. 27
      date: '1962-10-27'
      thread: china
      c: 'Zhongnanhai, the Juxiang Shuwu, evening. Mao Zedong calls Zhou Enlai and others to a meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 27, 1962. See [[cal.1962-10-26.china]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai. Check: the subject (the nianpu gives none).'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc]
- add:
    entry:
      id: cal.1962-10-30.china
      when: Oct. 30
      date: '1962-10-30'
      thread: china
      c: 'Luo Ruiqing, a report: the Second Ministry of Machine Building to aim at exploding the first atomic bomb in 1964, two years off; beyond any one ministry. Proposed: a special committee under the Center to direct the atomic industry, Zhou Enlai in overall charge, with He Long, Li Fuchun, Zhang Aiping, Li Xiannian, Bo Yibo, Lu Dingyi, Nie Rongzhen, Luo Ruiqing, Zhao Erlu, Liu Jie, Sun Zhiyuan, Duan Junyi and Gao Yang. Liu Shaoqi has agreed in principle.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 3, 1962 (the report, of Oct. 30, as Mao Zedong read it). Made public: 2013. Names: Zhou Enlai.'
      tags: [name:zhou-enlai, polity:prc]
# ---------------------------------------------------------------- Vietnam
- add:
    entry:
      id: cal.1962-10-05.vietnam-hanoi
      when: Oct. 5
      date: '1962-10-05'
      thread: vietnam-hanoi
      also: [china]
      c: 'Zhongnanhai, the Yinian Tang, afternoon. Mao Zedong receives a Vietnamese military delegation led by Võ Nguyên Giáp; Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Ye Jianying, Luo Ruiqing and Xiao Xiangrong present. Mao: imperialism reaches too far, "十个指头按十只跳蚤，结果是一个也抓不到" (ten fingers on ten fleas: in the end it catches none); in the South Hanoi holds one of America''s fingers; five or ten more years and America may have to compromise at a Geneva conference, or intervene further; an attack on the North must reckon with the South''s guerrillas, Laos, Thailand, China and Korea; "美国还不敢轻易下手" (America does not yet dare move lightly).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1962. Made public: 2013. To check: [[w.jian-maos-china-and-the]], 207. Names: Mao Zedong, Võ Nguyên Giáp, Zhou Enlai.'
      tags: [name:mao-zedong, name:vo-nguyen-giap, name:zhou-enlai, polity:prc, polity:drv, polity:us, polity:laos, polity:thailand, polity:dprk]
# ---------------------------------------------------------------- the war with India
- add:
    entry:
      id: cal.1962-10-02.south-asia
      when: Oct. 2
      date: '1962-10-02'
      thread: south-asia
      also: [china]
      c: 'Zhongnanhai, the Yinian Tang, afternoon. Mao Zedong chairs the Politburo Standing Committee on the border conflict with India. Decided: a note to India on Oct. 3, the two sides to meet on Oct. 15 as before proposed, either side free to put its views.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 2, 1962 (and n. 110: the proposal of Sept. 13, talks from Oct. 15 in Peking, then Delhi, each side''s forces back 20 kilometers). Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-08.south-asia
      when: Oct. 8
      date: '1962-10-08'
      thread: south-asia
      also: [china]
      c: 'Afternoon. Mao Zedong calls Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Chen Yi, He Long, Nie Rongzhen and Luo Ruiqing together on the border conflict with India.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1962. See [[cal.1962-10-02.south-asia]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-08.south-asia-2
      when: Oct. 8
      date: '1962-10-08'
      thread: south-asia
      also: [china]
      c: 'The PLA''s General Staff, India''s forces being ready for a large attack: a preliminary order (预先号令) to annihilate the Indian troops at Kejielang (克节朗), there since August.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1962 (and n. 114, August). See [[cal.1962-10-08.south-asia]]. Made public: 2013.'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-08.south-asia-3
      when: Oct. 8
      date: '1962-10-08'
      thread: south-asia
      also: [china, soviet-union]
      c: 'Peking. Zhou Enlai to the Soviet Ambassador, Chervonenko: if India''s forces attack, China will defend itself resolutely. India uses Soviet-made "米格式直升机" (MiG helicopters) to drop supplies in the western and eastern sectors; it tells on China''s soldiers at the front.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 8, 1962. See [[cal.1962-10-08.south-asia]]. Made public: 2013. Names: Zhou Enlai.'
      tags: [name:zhou-enlai, polity:prc, polity:ussr, polity:india]
- add:
    entry:
      id: cal.1962-10-17.south-asia
      when: Oct. 17
      date: '1962-10-17'
      thread: south-asia
      also: [china]
      c: '1:30 p.m. Mao Zedong calls Liu Shaoqi, Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi, He Long, Nie Rongzhen, Luo Ruiqing and others together on a counterattack in self-defense against India''s attacks.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 17, 1962 ("同日"). See [[cal.1962-10-08.south-asia]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-17.south-asia-2
      when: Oct. 17
      date: '1962-10-17'
      thread: south-asia
      also: [china]
      c: '11 p.m. Mao Zedong signs the Central Military Commission''s order to annihilate the invading Indian troops: "中央决定进行反击战役" (the Center has decided on a counterattack). The Tibet Military Region''s forces first to crush the Indian attack at Kejielang, north of the McMahon line, then to destroy any reinforcements; the Xinjiang frontier forces to crush the Indian attack, then destroy the Indian troops in the Galwan valley and at Hongshantou (红山头). The counterattack to open along the whole line at dawn, Oct. 19.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 17, 1962 ("同日"; afterwards, undated, put back to dawn, Oct. 20, at the Tibet Military Region''s proposal). See [[cal.1962-10-17.south-asia]]. Made public: 2013. Names: Mao Zedong.'
      tags: [name:mao-zedong, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-22.south-asia
      when: Oct. 22
      date: '1962-10-22'
      thread: south-asia
      also: [china]
      c: 'Peking. The Defense Ministry''s spokesman: India''s troops having crossed the McMahon line, taken large tracts of Chinese territory and attacked China''s frontier forces in strength, China''s frontier forces, "to prevent India''s troops coming back and attacking again," "没有必要再受这条非法的麦克马洪线的约束" (need no longer be bound by this illegal McMahon line).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1962. See [[cal.1962-10-20.india-and-china]]. To check: the statement''s published text.'
      tags: [polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-23.south-asia
      when: Oct. 23
      date: '1962-10-23'
      thread: south-asia
      also: [china]
      c: 'Zhongnanhai, the Juxiang Shuwu, 5 a.m. Mao Zedong calls Zhou Enlai and others together on ending the armed conflict with India. Decided: a statement by the central government proposing an end to the fighting and renewed talks; Zhou to direct its drafting. After 10 p.m. a second meeting; the statement adopted.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 23, 1962. See [[cal.1962-10-17.south-asia]]. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags: [name:mao-zedong, name:zhou-enlai, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-24.south-asia
      when: Oct. 24
      date: '1962-10-24'
      thread: south-asia
      also: [china]
      c: 'Peking. The government''s statement, three proposals: the boundary to be settled by talks; meanwhile each side to respect the line of actual control along the whole border and pull its forces 20 kilometers back from it. India agreeing, China to withdraw its frontier forces in the east to north of that line; in the middle and west neither side to cross it; officials to negotiate the disengagement. The two Prime Ministers to meet again: Nehru welcome in Peking, or Zhou Enlai to go to Delhi. Zhou to Nehru, by letter: respond.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 24, 1962. See [[cal.1962-10-23.south-asia]]. To check: the statement''s published text. Names: Nehru, Zhou Enlai.'
      tags: [name:nehru-jawaharlal, name:zhou-enlai, polity:prc, polity:india]
- add:
    entry:
      id: cal.1962-10-24.south-asia-2
      when: Oct. 24
      date: '1962-10-24'
      thread: south-asia
      also: [china]
      c: 'The PLA''s General Staff, to accord with the government''s statement: the frontier forces to stop the pursuit, not yet to cross the Tawang river (达旺河), and to concentrate north of it to await orders.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 24, 1962. See [[cal.1962-10-24.south-asia]]. Made public: 2013.'
      tags: [polity:prc, polity:india]
