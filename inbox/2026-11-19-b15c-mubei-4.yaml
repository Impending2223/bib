      when: May 14
      date: '1962-05-14'
      thread: china-leadership
      c: The secretariat of Zhejiang's 浙江 provincial grain conference prints its conference documents. For the grain year 1961–62 procurement is 4.58 billion jin, unified sales 3.45 billion, net transfer out 1.13 billion; 300,000 town people on supply are mobilized to return to farming. The disasters are severe, and procurement is adjusted to 4.37 billion; after provincial sales 960 million go up to the Center and 21 million jin, outside the plan, to Sichuan 四川. Though supply is tight in town and country and some villages see flight and ruin, the year is a little better than the year before.
      n: '[[w.yang-jisheng-mubei]], I, 467. Made public: 2008. To check: Zhejiang provincial grain conference secretariat 全省糧食會議秘書處, "Liangshi huiyi wenjian" 《糧食會議文件》, printed May 14, 1962 (cited by [[w.yang-jisheng-mubei]], I, 467 n.6). Check: the day of the conference; May 14, 1962 is the date of the secretariat''s printing.'
