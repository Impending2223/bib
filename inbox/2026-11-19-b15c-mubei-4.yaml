      thread: china-leadership
      c: Fan Zhizhong 樊執中 reports on the breaking of law and discipline by cadres of Nanping 南屏 commune, Hechuan 合川 county. Of 496 casualties, 42 were hanged, driven to death or buried alive, 62 beaten injured or maimed, and 392 died of forced work or withheld meals while ill. 387 households were fined, 12,400 yuan in all. Zhang Shaorong 張紹榮 of Bailu 白鹿 district took 7 sweet potatoes, was bound and hung from a tree and fined 20 yuan; his wife paid 19 yuan to have him let down, and the cadres spent 5 yuan of the fines on wine and food and ate beside him.
      n: '[[w.yang-jisheng-mubei]], I, 225. Made public: 2008. To check: Fan Zhizhong 樊執中, "Fan Zhizhong tongzhi guanyu Hechuan xian Nanping gongshe ganbu weifa luanji de yixie fanying" 《樊執中同志關於合川縣南屏公社幹部違法亂紀情況的一些反映》, Nov. 13, 1960 (the text prints 1961), Provincial Committee general office received no. 7266, circulated by the secretariat Nov. 14, 1960 (cited by [[w.yang-jisheng-mubei]], I, 225 n.88). Check: the text (I, 225) prints Fan''s report as of Nov. 13, 1961; the note (n.88) as of Nov. 13, 1960, circulated Nov. 14, 1960.'
