      c: In the evening Zhou Enlai 周恩來 holds the national conference on the grain question, and stresses that the provinces must press procurement. Vice-Premier Li Xiannian 李先念 criticizes Hebei 河北 for completing its procurement extremely slowly.
      n: '[[w.yang-jisheng-mubei]], I, 545–546. The words: 10月5日晚 (I, 545–546). Made public: 2008. Names: Zhou Enlai, Li Xiannian. Check: the day; the page gives the conference as of the evening of Oct. 5 and its place not at all.'
