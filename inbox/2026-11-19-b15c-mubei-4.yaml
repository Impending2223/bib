      c: The Jilin 吉林 provincial committee forwards the Siping 四平 prefectural committee's forwarding of the Lishu 梨樹 county committee's bulletin on the Heshan 河山 commune committee's repeating the error of "equalization and transfer" in carrying out policy 《中共吉林省委批轉四平地委批轉梨樹縣委「關於河山公社黨委在貫徹政策中重犯一平二調錯誤的通報」》 (document Jifa [61] no. 306). It says that since last winter the committee has circulated several bulletins on repeating the error, insisting that no Party organization or comrade may again raise the communist wind and that the three-level collective ownership of the commune and the members' own property must be upheld; a few Party organizations and cadres have turned a deaf ear.
