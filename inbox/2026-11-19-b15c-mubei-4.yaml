      c: 'Zhang Shiying 張士英 writes Wu De 吳德, Zhao Lin 趙林 and the Jilin 吉林 provincial committee''s secretariat a report on developing ginseng production in Fusong 撫松 county 《撫松縣發展人參生產問題的報告》. Since 1958, with grain self-sufficiency stressed in the ginseng districts and growing left chiefly to the state and the communes, output has fallen sharply: 81,741 jin in 1957 in the chief area, 23,518 in 1961, 28.77 percent. Members'' incomes have fallen and people leave the ginseng districts hoping to find a place with good farming where they can eat their fill.'
