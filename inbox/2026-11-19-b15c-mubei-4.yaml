      c: In the Liaocheng 聊城, Dezhou 德州 and Huimin 惠民 prefectures of Shandong 山東, 16,700 people starve in June 1961 and 35,600 in September; by October in Liaocheng alone 100,000 have left to beg, 985 have sold sons or daughters and 869 wives have remarried; some grassroots organizations are wholly paralysed.
