      when: Aug. 12
      date: '1961-08-12'
      thread: china-leadership
      c: A prefectural committee's 地委 disease-and-pest-elimination office 除害滅病辦公室 issues a brief on the investigation of illness in some communes of Fuling 涪陵 and Wulong 武隆 counties 《關於涪陵、武隆部份公社當前疾病調查情況簡報》. In ten communes of Pingqiao 平橋 and Yajiang 鴨江 districts of Wulong, January to June, four communes had death rates of 4 to 5 percent, three of 5 to 6, two of 6 to 7, and Shunxing 順興 commune, the highest, 8.28 percent; the ten lost 3,362 people, 6.23 percent of their population. At Wuma 五馬 commune's hospital in Fuling grain is short, cooking often stops, salt water stands for vegetables, and a patient dies every day; patients in hospital earn few work points and draw little grain, and live worse on leaving.
      n: '[[w.yang-jisheng-mubei]], I, 208, 216. Made public: 2008. To check: Prefectural disease-and-pest-elimination office 地委除害滅病辦公室, "Guanyu Fuling, Wulong bufen gongshe jibing diaocha qingkuang jianbao" 《關於涪陵、武隆部份公社疾病調查情況簡報》, Aug. 12, 1961 (cited by [[w.yang-jisheng-mubei]], I, 208 n.42; I, 216 n.66).'
