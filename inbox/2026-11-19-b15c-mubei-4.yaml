      id: cal.1961-01-17.china-leadership-6
      when: Jan. 17
      date: '1961-01-17'
      thread: china-leadership
      c: 'The party group of the Hebei 河北 agriculture department makes its initial examination of the blind-commanding wind 《關於瞎指揮風的初步檢查(討論稿)》. Rice transplanted: 5.86 million mu in 1958 with 3.13 million harvested, 46.6 percent abandoned; in 1959 4.5 million planned, 2.9 million done and 2.57 million harvested, 11 percent abandoned; in 1960 5 million planned, 2.9 million done, under 2 million harvested. In 1960 Cang 滄 county, by the plan from above, put 600,000 mu east of the canal to rice with 7.6 million jin of seed; for lack of water only 120,000 mu were harvested, 1.2 million jin of rice, under a sixth of the seed. The "high-yield square" movement is Hebei''s creation: in 1959–60 the slogan "no land without squares," and a field meeting held by the department at Tang 唐 county to see 300,000 mu of wheat squares and 80,000 mu of sweet-potato squares. For 1960 the province set 15 million mu of sweet potatoes, raised to 17, 22 and finally 20 million, though below seed and land were kept for the 18 million of 1959; some places pressed it by asking whether one obeys the Party and is loyal, and sweet potatoes were planted in summer, in plowed-up land and where corn and beans had been pulled.'
      n: '[[w.yang-jisheng-mubei]], I, 536. Made public: 2008. To check: Party group of the Hebei Agriculture Department 河北省農業廳黨組, "Guanyu xiazhihui feng de chubu jiancha (taolun gao)" 《關於瞎指揮風的初步檢查(討論稿)》, Jan. 17, 1961 (cited by [[w.yang-jisheng-mubei]], I, 536 n.13; I, 536 n.14).'
      src:
