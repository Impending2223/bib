      id: cal.1962-05-27.china-leadership-3
      when: May 27
      date: '1962-05-27'
      thread: china-leadership
      c: Zhou Yi 周頤, deputy secretary-general of the Sichuan 四川 provincial committee, reports on odds and ends of the Xichang 西昌 area 《關於西昌地區點滴情況彙報》. Along the road through Xichang, Dechang 德昌 and Miyi 米易 he sees stretches of idle fields, said to come in part from years of too many deaths and no one to plough. At Jinchuan 錦川 commune, sixth brigade, Xichang, a middle-aged woman, Diao Yongxiang 刁永相, has starved on the road. At Zishi 紫石 commune, sixth and seventh brigades, Ya'an 雅安, a woman beaten helpless for stealing food lies on the road; wheat fields have weeds as high as the wheat; patients are still many and deaths continue, a third of the commune dead by the people's account. In Ya'an he sees many badly swollen patients; asked why they do not go to hospital they say that conditions are bad and they die faster there.
      n: '[[w.yang-jisheng-mubei]], I, 209, 216. The words: 醫院條件很壞,在那裏死得更快些 (I, 216). Made public: 2008. To check: Zhou Yi 周頤, Sichuan Provincial Committee deputy secretary-general, "Guanyu Xichang diqu diandi qingkuang baogao" 《關於西昌地區點滴情況彙報》, May 27, 1962, general office receipt [62] no. 2290 (cited by [[w.yang-jisheng-mubei]], I, 216 n.68).'
