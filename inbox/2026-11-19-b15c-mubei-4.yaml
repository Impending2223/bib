      c: The Jilin 吉林 provincial committee approves and forwards the report of Oct. 30 on the free movement of people (document Jifa [61] no. 462), and orders strict control and a stop to it. It says that in the hard winter those who have fled famine and need help are to be looked after as fit; no one is to be starved or frozen; the fear that so doing will draw more is not to hold.
