      when: Oct. 30
      date: '1961-10-30'
      thread: china-leadership
      c: 'The party groups of the Jilin 吉林 public security department and civil affairs department report to the provincial committee on resolutely stopping the free movement of people 《關於堅決制止自由流動人口的意見報告》. Since the start of the year 230,000 have flowed into Jilin: 48,700 and more into the cities, where they were received and sent back; over 180,000 into villages and mines. Of the 48,700, over 23,000 are from the provinces inside the Pass and 25,700 from the three Northeastern provinces; of those from inside the Pass Shandong people are 60 percent; of those from Heilongjiang and Liaoning, Liaoning people are most. The 180,000 are mostly peasants bringing their families to relatives and friends.'
      n: '[[w.yang-jisheng-mubei]], I, 357. Made public: 2008. To check: Party group of the Jilin Public Security Department 吉林省公安廳黨組 and party group of the Jilin Civil Affairs Department 吉林省民政廳黨組, "Guanyu jianjue zhizhi ziyou liudong renkou de yijian baogao" 《關於堅決制止自由流動人口的意見報告》, Oct. 30, 1961 (cited by [[w.yang-jisheng-mubei]], I, 357 n.42).'
