      c: The Guangdong 廣東 public security department holds a meeting of the public security bureau chiefs of the coastal counties at Lufeng 陸豐, relaying the spirit of relaxing the conditions for leaving for Hong Kong. One item allows people in six counties and cities beside Hong Kong and Macao, Hui 惠, Dong 東, Bao 寶 and others, to leave by a few fixed, armed, unofficially open ports.
