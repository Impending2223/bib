      when: June 5
      date: '1962-06-05'
      thread: china-leadership
      place: canton
      c: Zhao Ziyang 趙紫陽, Lin Liming 林李明, Zeng Sheng 曾生 and the city committee's acting first secretary Zhao Wucheng 趙武成 and deputy mayor and public security head Li Guangxiang 李廣祥 meet at the home of the governor, Chen Yu 陳郁. The Canton-Kowloon railway police report that 10,000 or 20,000 are gathered at the East Station, that a police car sent to keep order has been overturned and burned, and that some police have been seized; deputy mayor Sun Leyi 孫樂宜, at the scene urging the crowd, is in danger. Zeng Sheng proposes calling in troops for martial law; some object that the question is whether it is a contradiction among the people or one with the enemy. Tao Zhu 陶鑄, back from Guangxi 廣西, rules that with the police cars smashed and burned it is a contradiction with the enemy; all agree to use the army.
      n: '[[w.yang-jisheng-mubei]], I, 426, 429. Made public: 2008. To check: Sources of the section on the flight to Hong Kong: the online article 《魚米之鄉的大逃亡》 and 《揭秘43年前逃港風潮 驚動周恩來總理》, http://www.cec.cn, Dec. 26, 2005 (cited by [[w.yang-jisheng-mubei]], I, 426 n.22). Names: Tao Zhu. Check: the day and the hour; the book gives the meeting after the disorder at the East Station on June 5 and before the troops of June 6.'
