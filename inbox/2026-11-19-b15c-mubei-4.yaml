      id: cal.1961-01-20.china-leadership-7
      when: Jan. 20
      date: '1961-01-20'
      thread: china-leadership
      c: 'Li Shuren 李樹仁, a cadre of the Jiangsu 江蘇 provincial committee, writes Vice-Governor Chen 陳, Minister Feng 逄, the provincial committee''s general office and the Huaiyin 淮陰 city committee and prefectural committee that some brigades of Wangxing 王興 commune are starving. At Yanhe 沿河 brigade the carrots, collective and private, will last to the Spring Festival and the sweet-potato leaves, 2,000 jin, at half a jin a head a day, four or five days; 10 of the provincial work group''s 28 cadres at the commune have edema. Teams dock the little ration members have, by six means: openly (at Liang-Huai 兩淮 brigade''s eighth team the sweet-potato chips, 40 percent of the ration, were withheld when January''s grain was issued); by turning ration grain to other uses, as the half jin a day given to workers at the water-works site and the grain a team head ate on a trip to sell firewood, spread over the households; by deducting for shrinkage and scale loss; by keeping the fractions, giving members whole numbers; by issuing a 30-day ration for December''s 31 days; and by deducting what was lost in hauling and storage. Wangxing had gone through four months of the three-anti campaign with a work group stationed in it.'
      n: '[[w.yang-jisheng-mubei]], I, 385. Made public: 2008. To check: Li Shuren 李樹仁, a Provincial Committee cadre, letter to Vice-Governor Chen 陳, Minister Feng 逄, the Provincial Committee general office, and the Huaiyin city committee and prefectural committee, Jan. 20, 1961 (the text names it; no note) (cited by [[w.yang-jisheng-mubei]], I, 385 n.t1).'
