      id: cal.1961.china-leadership-29
      when: 1961, spring
      date: '1961'
      at: before 1961-03
      thread: china-leadership
      c: 'Sun Qingzhen 孫慶真, with the provincial political and legal work group inspecting the quality of arrests and indictments by the Laiyang 萊陽 county procuratorate, finds in the files two cases of selling human flesh; both defendants are demobilized soldiers. One says that in two years he dug up bodies newly buried after starvation more than ten times, a body yielding over ten jin of flesh; at first, with his whole family near death, they ate human flesh several times and did not starve; later he boiled the flesh and sold it at the fair as beef. The other says he boiled bodies and sold them as beef seven or eight times in two years, and that several others sold human flesh and stole more bodies than he. The Laiyang procuratorate says that in 1959 and 1960 digging up of bodies occurred from time to time through the county: seven or eight cases solved, five or six not.'
      n: '[[w.yang-jisheng-mubei]], I, 455–456. Made public: 2008. To check: Xiao Gan 蕭甘 (read 蕭磊 at I, 455), "Wo suo zhidao de ''teshu anjian''" 《我所知道的「特殊案件」》, *Yanhuang chunqiu* 2010 no. 7 (cited by [[w.yang-jisheng-mubei]], I, 455 n.28). Check: the day; the book gives "spring 1961," and the page (I, 455) closes the passage with the note to Xiao Lei''s article of 2010.'
