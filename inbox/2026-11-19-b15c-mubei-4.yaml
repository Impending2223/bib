      id: cal.1962-04.china-leadership-3
      when: Apr.
      date: 1962-04
      thread: china-leadership
      c: Official statistics of Guangzhou 廣州 and 93 counties give 35,834 people with edema and 64,461 with emaciation in April 1962. In Guangzhou and the Shantou 汕頭 and Zhaoqing 肇慶 prefectures edema and emaciation patients in March number 63,839, 20.4 percent more than in February; Haifeng 海豐 county has 5,553 in early April, over 2,000 more than in March.
