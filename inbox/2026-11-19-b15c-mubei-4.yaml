      when: June 6
      date: '1962-06-06'
      thread: china-leadership
      place: canton
      c: Troop trucks drive one after another to the Canton 廣州 East Station. A battalion of the PLA in full arms seals the station at both ends and drives the crowd out; another detachment pushes from inside; the city government's loudspeaker trucks broadcast that the open border is a rumor and urge the crowd to leave. Dozens of agitators are seized and most of the crowd disperses at once; by that night over 1,600 have been arrested. Tao Zhu 陶鑄 takes the incident for Kuomintang agents' rumor-mongering, and the army throughout the province is put on high alert.
      n: '[[w.yang-jisheng-mubei]], I, 426, 429–430. The words: 至當天晚上,有1,600多人被捕 (I, 430). Made public: 2008. To check: Sources of the section on the flight to Hong Kong: the online article 《魚米之鄉的大逃亡》 and 《揭秘43年前逃港風潮 驚動周恩來總理》, http://www.cec.cn, Dec. 26, 2005 (cited by [[w.yang-jisheng-mubei]], I, 426 n.22). Names: Tao Zhu.'
