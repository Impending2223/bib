      c: The Wudian 武店 commune committee reports on its rectification work 《武店公社黨委關於整風整社工作情況的報告》. At Zhaolou 趙樓 brigade the deputy brigade head, Zhao, says the masses are slaves and will not do without beating, cursing and withheld meals; in 1960 he beat over 30 people, some injured, some put to death. Of the commune's 1,163 cadres of production-group level and above, 265 broke discipline, 22.2 percent. They bound, hung, detained, docked grain or meals from, or laid forced labor on 1,285 people, of whom 9 were put to death; meals were withheld from 1,622 households, 3,760 people.
