      c: 'The general office of the Zhejiang 浙江 provincial committee reports on the "equalization and transfer" and its refunds in the province 《全省一平二調情況和兌現情況》. By the statistics of March 1961 the total of "equalization and transfer" since communization is 201.848 million yuan, an average of over 36 yuan taken without pay from each peasant household: land, labor, oxen, houses, tools, cooking utensils and cash.'
