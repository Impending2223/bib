      when: Jan. 16
      date: '1961-01-16'
      thread: china-leadership
      c: The Wenjiang 溫江 work corps 工作團 of the Sichuan 四川 provincial committee's rectification corps reports to the provincial committee and the prefectural committee on the cadres' serious breaking of law and discipline brought out at the five-level cadre meeting of Jintang 金堂 county 《金堂縣五級幹部會議揭發出有關幹部嚴重違法亂紀情況的報告》. It gives cases of 1960. At Longwang 龍王 commune on Dec. 13 a member who went to the mess hall to ask help for his sick child was accused of theft, beaten and his house searched, and cut his throat, but lived. On Dec. 14 at Zhupian 竹篇 commune a teacher found Luo Longli 羅龍利 stealing a chicken, bound him and his mother, beat him three times and emptied his father's house; Luo jumped into a well and lived, and his father hanged himself on the 15th. In Zhupian district from Feb. to Nov. 1960 six members were beaten to death, 83 killed themselves after being hung and beaten, and one starved on withheld meals. In Zhupian commune from Jan. to Dec. 241 members were hung and beaten, 265 had meals withheld, 230 households were searched, 99 were put to hard labor, 68 were fined and 27 sent to labor teams; 17 died and 3 were maimed.
      n: '[[w.yang-jisheng-mubei]], I, 222–223. Made public: 2008. To check: Sichuan Provincial Committee rectification work group, Wenjiang group 省委溫江工作團, "Jintang xian wu-ji ganbu huiyi jielu chu youguan ganbu yanzhong weifa luanji xingwei de qingkuang baogao" 《金堂縣五級幹部會議揭發出有關幹部嚴重違法亂紀行為的情況報告》, Jan. 16, 1961, general office receipt [61] no. 447, Sichuan Provincial Archives file 2617 (cited by [[w.yang-jisheng-mubei]], I, 223 n.84).'
