      when: Apr. 8
      date: '1961-04-08'
      thread: china-leadership
      c: The Dianjiang 墊江 work group 工作組 of the Sichuan 四川 provincial committee's inspection corps reports on the recovery of stolen goods and money in the third stage of rectification at Jiefeng 界楓 commune 《關於界楓公社整風整社第三階段貪盜贓款追退工作情況報告》. The commune has 177 people exposed for theft, 137 of them production-team heads and above, 77 percent of the thieves and 82 percent of the cadres. At Shihua 石花 district the brigade head, Xia, in daylight and on the pretext of confiscating a rich peasant's property, took from the old upper-middle peasant Xia Bingsheng 夏炳盛 two quilts, three mosquito nets, 110 jin of tung seed, 20 jin of hemp, 1 jin of lacquer, 2 jin of red pepper and 1.5 jin of tobacco leaf, leaving not even a straw mat.
      n: '[[w.yang-jisheng-mubei]], I, 219–220. Made public: 2008. To check: Provincial Committee inspection corps, Dianjiang work group 省委檢查團墊江工作組, "Guanyu Jiefeng gongshe zhengfeng zhengshe di san jieduan tandao zangkuan zhuitui gongzuo qingkuang baogao" 《關於界楓公社整風整社第三階段貪盜贓款追退工作情況報告》, Apr. 8, 1961 (cited by [[w.yang-jisheng-mubei]], I, 220 n.79).'
