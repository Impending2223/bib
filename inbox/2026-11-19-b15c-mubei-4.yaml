      id: cal.1962-01-21.china-leadership-2
      when: Jan. 21
      date: '1962-01-21'
      thread: china-leadership
      c: The Jiangjin 江津 prefectural committee reports on edema 《關於腫病情況的彙報》. To Jan. 20 the number of patients is over twice that of the same time last year. From Jan. 1 to 15 5,743 people die in the prefecture, 2.1 percent more than in the 15 days before.
