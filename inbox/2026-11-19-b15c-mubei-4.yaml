      id: cal.1961-07-16.china-leadership-6
      when: July 16
      date: '1961-07-16'
      thread: china-leadership
      c: Zeng Shaowen 曾紹文, head of the Zhejiang 浙江 provincial grain department 糧食廳, reports on grain work 《關於糧食工作問題》 to the national conference of grain bureau chiefs. Upward transfers of grain were 2.398 billion jin in the grain years 1955–57 and 3.359 billion in 1958–60; procurement of about 30 percent of output is suitable, but it was 40.9 percent in 1958 and 43.2 percent in 1959; in the 23 key grain counties the burden a mu was 220 jin in 1957, 260 in 1958, 290 in 1959. For 1960–61 procurement is cut to 5 billion jin, unified sales to 3.6 billion, the net hand-over to 1.4 billion. If rural rations were put back to the level of 1955, the province, besides failing the Center's transfer, would have to bring in 1.131 billion jin; at the level of 1957, 108 million.
      n: '[[w.yang-jisheng-mubei]], I, 466–467. Made public: 2008. To check: Zeng Shaowen 曾紹文, head of the Zhejiang Provincial Grain Department 浙江省糧食廳, report at the national conference of grain bureau chiefs, "Guanyu liangshi gongzuo wenti" 《關於糧食工作問題》, July 16, 1961, Zhejiang Provincial Archives, 1961, J132-13-7, pp. 22–28 (cited by [[w.yang-jisheng-mubei]], I, 467 n.5).'
