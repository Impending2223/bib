      when: Oct. 6
      date: '1961-10-06'
      thread: china-leadership
      c: Liu Zihou 劉子厚, the governor, at the national grain conference, telephones Zhang Dakai 章達開, Li Yannong 李硯農 and Wan Xiaotang 萬曉塘 in Hebei 河北 an urgent message on pressing procurement. First settle the task of 3.3 billion jin as firm, not to be striven for but resolutely met; cadres at all levels must be given thorough ideological work, to understand that in the present conditions people must eat a bit less and give a bit more; mobilize, do mass work, and resolutely finish this year's procurement.
      n: '[[w.yang-jisheng-mubei]], I, 546. Made public: 2008. To check: Liu Zihou 劉子厚 to comrades Zhang Dakai 章達開, Li Yannong 李硯農 and Wan Xiaotang 萬曉塘, the prefectural committees'' first secretaries, "Guanyu wubi zhuajin zhenggou gongzuo de jinji dianhua" 《關於務必抓緊徵購工作的緊急電話》, Oct. 6, 1961 (the names as the OCR and the page give them) (cited by [[w.yang-jisheng-mubei]], I, 546 n.36).'
