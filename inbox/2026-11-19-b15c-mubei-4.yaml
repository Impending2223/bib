      id: cal.1962-03.china-leadership-7
      when: Mar.
      date: 1962-03
      thread: china-leadership
      c: 'The Guangdong 廣東 border defense work conference 邊防工作會議, chaired by Kou Qingyan 寇慶延, head of the political and legal committee 政法委員會, sets the guiding thought of relaxing the border: relax the measure, open more channels, and raise by plan and organization the proportion leaving. It proposes to break the limit of 50 persons a day (kept since 1958, when the Hong Kong authorities balanced entry and exit); Bao''an county''s channels are to rise from 5 to 11; the power to approve trips to Hong Kong goes down from the county public security bureau to communes and brigades, and fishing, family-visit and work permits are given beside passes; the border counties adopt a "three-five" rule: 5 crossings a month, 5 jin of goods brought back, worth no more than 5 yuan.'
      n: '[[w.yang-jisheng-mubei]], I, 426–427. Made public: 2008. To check: Sources of the section on the flight to Hong Kong: the online article 《魚米之鄉的大逃亡》 and 《揭秘43年前逃港風潮 驚動周恩來總理》, http://www.cec.cn, Dec. 26, 2005 (cited by [[w.yang-jisheng-mubei]], I, 426 n.22). Check: the day; the book gives "March 1962."'
