      when: Mar. 10
      date: '1962-03-10'
      thread: china-leadership
      c: 'A record of Mar. 10, 1962 gives Guangdong''s hunger. In Dongguan 東莞 county 9 communes still cannot arrange their living: at Shatian 沙田 commune 81 households, 234 people, are out of grain; at Wangniudun 望牛墩 commune 1,096 households, 2,227 people, have had almost no ration since March. In eight counties, Jieyang 揭陽, Chaoyang 潮陽, Puning 普寧, Huilai 惠來, Dabu 大埔, Haifeng 海豐, Meixian 梅縣 and Wuhua 五華, by incomplete count 9,468 households are out of grain, 731 people are begging or fleeing, 2,463 pieces of furniture have been sold and 25 children, and there is one suicide.'
      n: '[[w.yang-jisheng-mubei]], I, 405. Made public: 2008. To check: "Yumi zhi xiang de da wangmin: Guangdong san nian da jihuang qingkuang" 《魚米之鄉的大逃亡——廣東三年大饑荒情況》, online, [xgc2000.com] (New Observer) (cited by [[w.yang-jisheng-mubei]], I, 405 n.11). Check: the issuer of the record; the book gives "historical materials" and the article it takes them from.'
