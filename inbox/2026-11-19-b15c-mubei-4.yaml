      thread: china-leadership
      c: 'The Shunde 順德 county committee submits its summary report on the four-level cadre meeting 《中共順德縣委四級幹部會議總結報告》. Death rates in Shunde, normally 0.7 to 0.8 percent, were 1.9 percent in 1958, 1.23 percent in 1959 and 1.77 percent in 1960. The meeting holds that, besides bad arrangements for living, cadres treating members as enemies is a chief cause of the many deaths: binding, beating and withholding rations. In spring 1958 the county committee member Wu Ying 吳英 laid down four rules: no rain capes in the rain; no slow walking; no urinating or nursing a child in work time; no meal for those who fall short.'
