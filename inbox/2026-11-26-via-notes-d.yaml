patch: 2026-11-26-via-notes-d
by: reader (via-notes batch d)
ops:
  - cite:
      id: cal.1963-08-21.vietnam
      item: '[[w.moyar-triumph-forsaken]], 232 n.6 (the generals'' document, New York Herald Tribune, Aug. 29: the commanders proposed martial law and obtained it)'
      'on': Martial law.
  - check:
      id: cal.1961-05-16.laos
      text: 'Check: FRUS 1961–63, XXIV, docs. 87 and 91, read, put the opening off from May 12 to May 16 and set it for 5 p.m. Geneva time (doc. 91, Secto 146, May 15); neither reports the session held, and neither names Harriman.'
  - check:
      id: cal.1961-06-03.berlin-and-vienna
      text: 'Check: FRUS 1961–63, V, doc. 83 (June 3, 12:45 p.m.) bears out the meeting only; the treaty, Western rights in Berlin and the six months are in XIV, doc. 32 (V, doc. 87), the Laos agreement in XXIV, doc. 107 and V, doc. 87; Reston''s remark is in none of the three.'
