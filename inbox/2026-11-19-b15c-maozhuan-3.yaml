    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.75 (Apr. 1 the Ninth Congress opens in Peking under Mao''s chairmanship; Mao: ''I hope our congress will go well, will be a united congress, a victorious
      one''; after the Eighth Congress things are now pretty clear in political line, organizational line and thought, so a united congress and, on that ground, victory, and after it greater victory
      in the whole country; Lin Biao 林彪 then gives the Central Committee''s political report, in eight parts (the preparation of the Cultural Revolution; its course; doing struggle, criticism
      and reform well; its policies; the final victory of our revolution; the consolidation and building of the Party; relations of our country with foreign countries; the whole Party and people
      to unite for greater victory); the book dates the Congress Apr. 1–24, in two stages, Apr. 1–14 the report and the constitution, Apr. 15–24 the election, with three plenary sessions; no figure
      of delegates or members, n.75)'
    units: E
