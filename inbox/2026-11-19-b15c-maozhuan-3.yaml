    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 (from Apr. 15 the delegates prepare and hold the preliminary vote for the election of the Central Committee: by the presidium''s Regulations on electing
      the Ninth Central Committee the 45 groups nominate, the presidium''s secretariat draws up one list of candidates, after consultation and a preliminary vote a list is drawn again and put
      to the presidium, which makes the formal list for the Congress; Lin Biao''s and Jiang Qing''s sides contest hard for candidates, so the consultation runs on and the vote and closing intended
      for Apr. 21 cannot be held; the book gives neither Mao''s meeting nor the count of nominations)'
- cite:
    id: cal.1969-04-23.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.80 (Apr. 23 Mao calls the members of the Cultural Revolution Group''s liaison meeting, of the Military Commission''s Office Group and the group
      convenors; five names are added, 279 in all, 170 members and 109 alternates, as the formal candidates; Mao: ''make it clear: many good ones are not on the list, those on it are not all good'';
      most are on the Committee for the first time, only 53 of the Eighth Congress''s old ones, the new over two hundred, not one in five; industrial workers and peasants are more, mind that they
      do not leave production, if they do they are like us; the book does not give that they would collapse in a year or that the enlarged presidium was in the chair, n.80)'
    units: B
