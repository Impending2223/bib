      stage is past: ''the first year opens, the second sees an outline and fixes a base, next year ends: that is the cultural revolution''; he proposes to go to Hubei and Hunan; most of those
      present oppose his going to Wuhan, where the fighting is grave and safety not assured; Mao: ''I do not fear disorder, I go''; Yang Chengwu to go with him; Wang Dongxing to get the special
