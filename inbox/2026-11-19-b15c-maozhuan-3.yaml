    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.60 (July 22 Jiang Qing, receiving the Henan rebels'' delegates: ''a Henan revolutionary organization has put forward the slogan "attack by argument,
      defend by arms", and the slogan is right''; ''do not be naive, to lay down your arms when they will not lay down theirs and hold lances and swords at you is wrong, you will suffer, young
      revolutionaries will suffer; Wuhan has this case now'', n.60; the book says Lin Biao and Jiang Qing seized on the ''July 20 incident'' to incite further)'
    units: A, C
