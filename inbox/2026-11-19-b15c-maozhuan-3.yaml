    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (May 4–26 at Peking the Politburo meets in enlarged session under Liu Shaoqi to criticize Peng Zhen, Luo Ruiqing, Lu Dingyi and Yang Shangkun; on
