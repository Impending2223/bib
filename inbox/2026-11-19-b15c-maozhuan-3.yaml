      when: Aug. 1
      date: '1966-08-01'
      thread: china-leadership
      c: The *Renmin ribao* 人民日报 prints the editorial "The whole country should be a great school of Mao Zedong Thought" 《全国都应该成为毛泽东思想的大学校》, giving the main points of Mao's May 7 comment on the
        army as a school. To do as Mao says will raise the people's proletarian consciousness, revolutionize thought and break with all the old ideas, culture, customs and habits.
      n: '[[w.mao-zedong-zhuan]], VI, ch. 74 (n.40). To check: *Renmin ribao* 《人民日报》, Aug. 1, 1966 (the editorial "The whole country should be a great school of Mao Zedong Thought" 《全国都应该成为毛泽东思想的大学校》)
