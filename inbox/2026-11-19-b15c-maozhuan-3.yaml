    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.79 (Oct. 12, to the Albanian delegation under Shehu, n.79: ''this is a good chance to examine the cadres''; some cadres do not approach the masses
      or lower cadres, are officials and lords, I have no way to deal with them, in so big a country I have never seen 99 percent of the people, ''this time the masses do it to them''; ''why we
      do not fear disorder: if you do not let it be disorderly, the contradictions cannot come out''; ''since late September more have united than not; they have had enough, I think workers, peasants,
      schools and offices rather do not want to go on; to settle everything needs some months more''; ''next year or the year after we hold a party congress, to build the Party anew'')'
    units: C, I
