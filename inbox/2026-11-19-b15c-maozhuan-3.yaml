    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.26 (early Feb. 1966, by Wu Lengxi''s 吴冷西 recollection: the group of five, Lu Dingyi 陆定一, Kang Sheng 康生, Zhou Yang 周扬 and Wu with Peng Zhen 彭真, met
      to study the academic discussion, resolved to put it under the Center''s leadership, cool it and make ''a hundred flowers'' real, and drafted the outline for the Standing Committee; day
      and members present not given)'
