- add:
    entry:
      c: On Mao's view seven Politburo "life meetings" are held, at which Chen Yi, Tan Zhenlin and Xu Xiangqian, and Li Fuchun, Li Xiannian, Ye Jianying and Nie Rongzhen, are criticized. Jiang
        Qing and others attack them as a "bourgeois restoration current," later called the "February counter-current." The Politburo then stops meeting, the Cultural Revolution Group's liaison
        meeting taking its place.
      date: '1967-02-25'
      id: cal.1967-02-25.china-leadership-5
      n: '[[w.mao-zedong-zhuan]], VI, ch. 76 (the book dates the seven meetings from Feb. 25 to Mar. 18; no day of any one is given; in late April Mao agrees to let several of the marshals, with
        Zhu De and Chen Yun, stand on Tiananmen for the May Day parade, which eased their position). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition
        ([[w.mao-zedong-zhuan]], VI, ch. 76). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Names: Chen Yi 陈毅, Tan Zhenlin 谭震林, Xu Xiangqian 徐向前,
        Li Fuchun 李富春, Li Xiannian 李先念, Ye Jianying 叶剑英, Nie Rongzhen 聂荣臻, Jiang Qing 江青, Mao Zedong 毛泽东. Check: the days of the seven meetings, the book giving only the span.'
      src:
        c: 8a8d6eb2
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 76: all'
