    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (Oct. 1, the seventeenth anniversary: a rally and march of a million at Tiananmen Square, Mao present; Lin Biao''s speech there: the struggle between
      the proletarian revolutionary line represented by Mao and the bourgeois line goes on; those who hold to the wrong line are a handful, who will fail)'
- cite:
