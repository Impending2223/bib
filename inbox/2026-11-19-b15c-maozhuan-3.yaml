    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.61 (July 27 Lin Biao presides over the meeting that decides first, inside the leadership, to remove Chen Zaidao and Zhong Hanhua; Yang Chengwu''s
      杨成武 recollection: Lin''s key words, ''Wuhan is not Wuhan''s question alone but the whole country''s'', ''we must grasp and make a big article of it'', to criticize the ''Liu–Deng line with
      guns'' and ''seize the handful in the army'', meaning those in the army taking the capitalist road; the book reads this as Lin''s aim to clear the army of those he counts as alien, n.61)'
    units: A, B, C, D
