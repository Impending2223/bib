    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.48 (Aug. 1967 (the day by the note, Aug. 16, a record of Mao''s talk with two Albanian experts, Vanjel Moisiu 万捷尔·莫依修 and Miftar Muzhi 缪非特·穆希 in
