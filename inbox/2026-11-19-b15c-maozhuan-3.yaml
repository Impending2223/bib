    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.12 (that evening, as he watches the fireworks from the tower, Mao talks with the Australian communist leader Hill: pointing at the students in the
      square, imperialism and revisionism fear these students, so do some of our cadres, Central Committee members, Politburo members, provincial, prefectural and county secretaries among them,
      who would call out the army, but the army cannot be moved, so they would call out workers and peasants against the students, n.12)'
    units: E
