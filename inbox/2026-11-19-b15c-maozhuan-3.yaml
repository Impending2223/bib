- cite:
    id: cal.1967-08-01.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.62 (Aug. 1 the *Hongqi* editorial for the army''s fortieth anniversary, ''The proletariat must firmly hold the gun'' 《无产阶级必须牢牢掌握枪杆子》: ''not long
      ago a handful in the Party and the army in the Wuhan area taking the capitalist road joined up to suppress the proletarian revolutionaries''; ''a criticism of the handful in the Party and
      the army most deeply taking the capitalist road is now rising nationwide, this is the great direction of the struggle'', n.62, the issue given as *Hongqi* 1967, no. 12; the book does not
      give ''fight them stinking'')'
