    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.71 (in Hunan, Sept. 18, to Li Yuan, Hua Guofeng and Zhang Boseng, n.71: ''the rebels in schools must learn policy too, what is this talk of me as
      the core''; ''both sides are workers, one left, one conservative, I cannot make it out; the more you press, the more they resist''; ''clearing cadres needs a mass movement; a mass movement
      has a law, it turns back when its time comes'')'
    units: C, D, E, F, H
