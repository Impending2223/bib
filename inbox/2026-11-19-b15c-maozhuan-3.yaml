    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Feb. 23 the Military Commission issues the instruction on the army''s energetic help to the localities in the spring plowing and production 《关于军队大力支援地方抓好春耕生产的指示》;
      the book gives title and day only)'
    units: A
- cite:
    id: cal.1967-02-28.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Feb. 27, because Guangdong''s provincial first secretary has of his own accord ''yielded power'' to the rebels, Zhou Enlai writes to Mao proposing
      military control of Guangdong and of Yunnan, in like confusion, and Mao approves; Mar. 10 the Center decides on military control of Jiangsu, the factions there not able to unite; the book
      does not give the liaison meeting''s resolution, the heads or the preparation of a three-in-one committee)'
    units: D
- cite:
    id: cal.1967-03-16.china-leadership-3
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Mar. 16 and Mar. 20 Mao approves in turn the Peking Garrison Command''s proclamation for the control of plants and mines needing it and Nie Rongzhen''s
      聂荣臻 proposal for the military takeover of the research institutes of the ministries of the defense industry and of the Academy of Sciences'' institutes doing defense work; the book gives
      no word of the Center''s note forwarding)'
- cite:
    id: cal.1967-03-20.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Mar. 20 Mao approves Nie Rongzhen''s proposal for the military takeover of the research institutes of the ministries of the defense industry and
      of the Academy of Sciences'' institutes doing defense work; the book does not give Zhou''s report of Mar. 18, the National Defense Science and Technology Commission, or the words ''return
      to the Premier'')'
- cite:
    id: cal.1967-07-19.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (July 19 the rebels broadcast over the loudspeakers in all three towns of Wuhan the tape of Xie Fuzhi''s and Wang Li''s speeches at the Water Conservancy
      and Electric Power College, and Wang Li''s ''four points'': the Military Region''s main direction in supporting the left is wrong, the ''Workers'' Headquarters'' is to be rehabilitated,
      the rebels are revolutionary leftists, the ''Million Heroes'' a conservative organization; this enrages the ''Million Heroes''; the book gives no hour)'
    units: B
