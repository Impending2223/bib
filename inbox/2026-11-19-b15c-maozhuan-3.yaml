      and plays chiefly Jiang''s talk; the summary written up after, Jiang unhappy with the first draft, given to Zhang Chunqiao 张春桥 to revise, Chen Boda 陈伯达 joining, then sent to Mao; its claim
      of a ''black line'' ruling the cultural front for sixteen years and call for a socialist revolution on that front, n.27)'
