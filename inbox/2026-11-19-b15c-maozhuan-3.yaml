    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 (the book gives Aug. 10 as the first of five days, Aug. 10, 14, 20, 28 and Sept. 1, on which the Center, State Council, Military Commission and Cultural
      Revolution Group approve the founding of the revolutionary committees of Yunnan, Fujian, Guangxi, Tibet and Xinjiang, in that order; no word of Mao''s comment or of the Kunming Military
      Region''s list)'
- cite:
    id: cal.1968-08-17.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.25 (Aug. 17, the commander of the Peking Garrison, Wen Yucheng 温玉成, explains to Mao why workers'' propaganda teams are sent: the Peking students
      do not fear the army, only the workers, for they have felt out the army''s bottom, a policy of ''five nots''; the army has no way with the students, the workers are tougher; the book names
      no one else present and gives no hour, n.25)'
- to-check:
    id: cal.1968-08-17.china-leadership
    add: Wen Yucheng 温玉成, report to Mao Zedong 毛泽东 (汇报记录), Aug. 17, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.25)
- cite:
    id: cal.1968-08-19.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.26 (Aug. 19, in a talk with the members of the Cultural Revolution Group''s liaison meeting on the universities: rely on the activists among teachers,
      students and workers, but that is not enough; where a school does not do struggle, criticism and reform and only fights its own civil war, the army and the workers must go in, the army fewer
      and the workers more, or half and half, but there must be workers; he watches the ''free and easy'' men, the majority, who are against civil war; to call the other side Kuomintang one must
      have proof; ''it is time'' for this second half of the year, a meeting in September or October, a work conference or plenum, half the members enough; Yao Wenyuan asks what is to be prepared,
      Mao: great criticism, clearing the class ranks, Party consolidation, cut salaries and send office staff down; the book does not mention Shanghai''s workers, n.26)'
    units: A, B
- to-check:
    id: cal.1968-08-19.china-leadership
    add: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group's liaison meeting 中央文革碰头会 (record 谈话记录), Aug. 19, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.26)
- src:
