    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.58, 65 (Sept. 9 evening Mao''s long talk with Yang Chengwu, Zhang Chunqiao and Yu Lijin at Shanghai, n.58, n.65: ''our cultural revolution so far
      has two prospects: better, or the country splits; at Nanjing, Wuxi, Peking two great factions, irreconcilable, everywhere two; if we cannot unite, would the country fall into disorder and
      long division as after the 1911 revolution?''; ''why so many cadres now no good? too many dragged out, the Red Guards swept the cadres too much''; seven provinces'' and cities'' revolutionary
      committees good, ten more to be settled before the year''s end; ''Long Qian over-did it, jet plane, kneeling, beating, placards''; ''Wang Li in his talk at Wuhan was so fierce''; ''the core
      is recognized in practice by the masses, not self-appointed'')'
    units: B, C
