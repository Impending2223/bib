    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.59, 74 (Sept. 20 to Zeng Siyu, Liu Feng, Fang Ming and Zhang Chunqing of the Wuhan Military Region and Hubei, n.74, n.59: ''the last time Wang
      Li and the others, settling the Million Heroes, did not listen to me, did not speak first to the troops and do the work, but hurried to the masses to declare, with a bias, and did not see
      me, and stirred a hornets nest, worrying''; ''before the Spring Festival, a little over four months, the country basically settled''; ''the Ninth Congress next autumn, September, or in January
      the year after at the latest''; ''I do not like the four titles you give me, great leader, great teacher, great commander, great helmsman, just call me Chairman Mao''; ''Deng Xiaoping, to
      be kept? he fought some wars, he is not a Kuomintang man, and has no black cultivation'')'
