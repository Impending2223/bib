    id: cal.1967-08-01.china-leadership
    add: '*Hongqi* 《红旗》 1967, no. 12 (the editorial ''The proletariat must firmly hold the gun'') (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.62)'
- cite:
    id: cal.1967-08-25.china-leadership-3
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.67 (Aug. 25 at 1 a.m. Zhou Enlai sees Yang Chengwu alone, just come to Peking from Mao at Shanghai, gives him his view of the recent run of events,
      in particular Wang Li''s ''Aug. 7 speech'', hands him a record of it to take to Mao at once, and speaks of ''seizing the handful in the army'' in the *Hongqi* editorial drafted under Guan
      Feng; ''how can this go on? I fear a chain reaction; two things cannot be shaken, the Center''s leadership and the army''s prestige''; the book then gives Zhou''s later words to foreign
      guests on the extreme-left current of 1967, n.67; it does not give the details of the entry''s A or that Zhou sends Yang to Shanghai)'
    units: B
