    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.23 (Mao to Yang Shangkui 杨尚奎 and Fang Zhichun 方志纯 of Jiangxi, soon after the Shanghai meeting of Dec. 1965, the day by the note; place not given;
      on Luo Ruiqing 罗瑞卿: proud and sharp; once told to take a governorship in a province, he would not; army work no longer possible, a transfer to local work, not necessarily Jiangxi; the book
      adds that Luo was not yet to be wholly overthrown)'
