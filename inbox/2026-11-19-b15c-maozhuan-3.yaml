      had such power, ''forced onto Liangshan'', agreeing against his will, the first time in his life on a major question; the aim to overthrow the right in the whole Party and country and to
      sweep away ox-demons again in seven or eight years; a Zhong Kui 钟馗 of the 1960s; the ''friend'' is Lin Biao, his speech of May 18, n.52)'
