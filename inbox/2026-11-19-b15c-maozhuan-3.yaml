- cite:
    id: cal.1969-02-07.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.64 (Feb. 7, in a talk with the members of the Cultural Revolution Group''s liaison meeting, Mao on drafting the Congress report: when the first
      draft is out there is a way, it is only to overturn it all and write again; let a few do it, Chen Boda 陈伯达 at the head, with Zhang Chunqiao 张春桥 and Yao Wenyuan 姚文元, Lin Biao 林彪 in command;
      the meeting can be held once the text is written; he does not approve talk of ''milestones'' (Marxism''s third milestone); the same meeting discusses the figures of the third five-year plan;
      the report to be handed in by Feb. 20 and the Congress to open Mar. 15; the book does not put the day or the hour of the ''three supports'' discussion of the entry, n.64)'
