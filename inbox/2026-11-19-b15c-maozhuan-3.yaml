    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.6 (Jan. 10 Jiang Qing sends Mao two Xinhua dispatches, the Shanghai rebels'' ''general attack on the bourgeois reactionary line'' and the Urgent
      Notice of the Workers'' General Headquarters and others in the *Wenhui bao* and *Jiefang ribao*; the first gives four signs of the very good situation at Shanghai; Mao the same day passes
      both to Chen Boda and the Cultural Revolution Group: both very good; in two or three days draft for the Center, the State Council and the Military Commission a telegram of congratulation
      to the Shanghai rebel bodies, saying their line and acts are right and calling on the Party, government, army and people to learn from Shanghai''s experience, n.6)'
