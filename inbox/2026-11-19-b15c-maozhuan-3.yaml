      reads out Mao''s instruction word by word, ''today''s meeting is to convey an important decision of Chairman Mao''; Wang Li and Guan Feng are then isolated; Qi Benyu later, by Mao''s instruction
      at a meeting, also arrested, n.68)'
    units: B
