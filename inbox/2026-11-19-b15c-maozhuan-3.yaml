- cite:
    id: cal.1969-03-15.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.60, 69 (Mar. 15 Mao''s long talk to the members of the Cultural Revolution Group''s liaison meeting on carrying out policy: too many seized and
      shut up, too few freed; those who stood on the wrong side must be given a way out; Qian Weichang 钱伟长 and Liang Sicheng 梁思成 as models; a history is no matter, a man is a history; investigators
      at large without aim; why not have a man confess himself; release everyone not guilty of murder, arson, poison or sabotage, a few reactionary slogans are nothing; the ''February counter-current''
      not to be mentioned in the report, those who erred in the winter of 1966 and the spring of 1967 not understanding the Red Guards'' attacks; the Congress is to be a united one, men of the
      ''counter-current'' are to be allowed on the rostrum, n.60; the same record: the report is not done, a few days'' delay in opening does not matter, a month was given to Chen Boda, a fortnight
      to you, so open on Apr. 1, n.69; the book does not give the entry''s list of those present or its themes)'
