- cite:
    id: cal.1967-01-16.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.9 (Jan. 16 Mao at the enlarged Standing Committee meeting, n.9: some of our cadres have turned in a dozen years; the left''s seizing power is good,
      the right''s not; the left grows fast, Shanghai''s left workers early last Nov. a thousand and more, a million early this Jan., with the students the main force; ''before, the army won the
      realm, now workers and peasants win it themselves, the army helps''; let the masses elect new cadres, factory heads and secretaries, ''takeover, only politics, not the work, the same men
      do it and we supervise'', which the book says was mostly not done)'
