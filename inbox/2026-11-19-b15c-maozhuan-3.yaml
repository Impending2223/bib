    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.43 (Jan. 13, in the Great Hall of the People, Mao 毛泽东 meets Liu Shaoqi 刘少奇 alone; Liu: the responsibility for the error of line is his, the cadres
      are good, the old cadres a treasure of the Party, the cadres to be freed soon; he asks to resign as head of state, from the Standing Committee and as head of the editorial committee of the
      *Selected Works*, and to farm with his family at Yan''an or at home; at parting Mao sees him to the door and tells him to study well and take care of his health; at home Liu says Mao did
      not criticize his errors, n.43; the book says nothing of Mao''s having Liu brought)'
    units: B, C
