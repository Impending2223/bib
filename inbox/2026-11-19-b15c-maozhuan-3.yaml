    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.64 (Sept. 4, after hearing the Cultural Revolution Group, Mao on how to control the situation, n.64: ''an order not to seize guns, good''; ''free
      a great batch of cadres, right''; ''some fight-criticize meetings very cruel, why so; cadres who erred mostly carried out the bourgeois reactionary line, and long cut themselves off from
      the masses, now the masses want revenge; it is nothing great, not kneeling to the enemy'')'
    units: D
