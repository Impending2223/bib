    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.17 (Oct. 16 Chen Boda''s long speech ''Two lines in the proletarian cultural revolution'', the conference''s main report: the struggle of the two
      lines goes on, the Sixteen Points corrected the earlier bourgeois line, but a wrong line may take other forms; some, a few, comrades think themselves old revolutionaries, are officials and
      gentry, forget their revolutionary history, and will not let the masses touch them; ''a handful'' of power-holders on the capitalist road and many muddled; printed with Mao''s approval;
      the day of the printing not given, n.17)'
