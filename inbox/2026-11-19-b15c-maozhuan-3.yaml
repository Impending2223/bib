- cite:
    id: cal.1966-11-17.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 17–21 at Peking the forum of the heads in charge of industry of some provinces and cities and of the State Council''s departments, on Chen Boda''s
      draft for factories and mines; the members dislike its leave to form factions in factories and for students to link up in them, and write a revised draft: ''in the seventeen years the industrial
      and communications front in the main carried out Chairman Mao''s revolutionary line''; large-scale industry is continuous and cooperative, no stopping production for revolution, only by
      stages and in batches; workers join in only in spare time, the eight-hour day not to be invaded; students not to go to factories to link up)'
    units: A, D, E
- add:
    entry:
      id: cal.1966-11-21.china-leadership-2
      when: Nov. 21
      date: '1966-11-21'
      thread: china-leadership
      c: 'Chen Boda 陈伯达, seeing the forum''s revised draft, sends for Gu Mu 谷牧 and Yu Qiuli 余秋里 and rebukes them: we who write have no power or rank, small folk whom nobody looks up to, Deng Xiaoping
        did not, now you do not; you have torn the draft to shreds, write one yourselves if you can.'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 (n.28; the place not given). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI,
        ch. 75). To check: [[w.womende-zhou-zongli]], 26, 27, 46 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.28); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same
        passage. See [[cal.1966-11-17.china-leadership-2]]. Names: Chen Boda 陈伯达, Gu Mu 谷牧, Yu Qiuli 余秋里, Deng Xiaoping 邓小平.'
