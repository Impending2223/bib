    id: cal.1966-07-29.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (July 29 at the Great Hall of the People 人民大会堂, Peking, the meeting of cultural-revolution activists among teachers and students of the colleges and
      middle schools: Li Xuefeng reads the Municipal Committee''s decision, withdrawing the teams; Liu Shaoqi, Zhou Enlai, Deng Xiaoping and others speak and take the responsibility for sending
