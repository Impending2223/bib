- add:
    entry:
      c: 'The Renmin ribao, Hongqi and Jiefangjun bao print the joint editorial ''March forward along the road opened by the October Socialist Revolution'' for the revolution''s fiftieth anniversary:
        the first statement, in six points, of the ''theory of continuing revolution under the dictatorship of the proletariat''. Classes and class struggle persist throughout socialism; a handful
        in the Party taking the capitalist road represents the bourgeoisie; the Cultural Revolution is the chief way; its program in ideology is ''fight self, criticize revisionism''.'
      date: '1967-11-06'
      id: cal.1967-11-06.china-leadership-4
      n: '[[w.mao-zedong-zhuan]], VI, ch. 76 (the day and the paper as the book gives them; the book names the theory and sums it in six points, of which the entry gives four, and says it was
        Mao''s wish to sum up the Cultural Revolution in theory as it prepared the Ninth Congress and the rectification of the Party). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first
        edition (2003), for the same passage; *Renmin ribao* 《人民日报》, *Hongqi* 《红旗》 and *Jiefangjun bao* 《解放军报》, joint editorial ''March forward along the road opened by the October Socialist Revolution''
        《沿着十月社会主义革命开辟的道路前进》, Nov. 6, 1967.'
      src:
        c: 779a4dad
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 76: all'
      tags:
      - polity:prc
      - vis:only:prc
      thread: china-leadership
      when: Nov. 6
- add:
    entry:
      c: 'At the enlarged Politburo meeting Chen Boda charges that the outline of the industry-and-transport group''s report was sent out without his being consulted, a "surprise attack." Zhou
        Enlai answers: he told them to write it, it was done by night, there was no time to ask opinions.'
      date: '1966-12-06'
      id: cal.1966-12-06.china-leadership-3
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.30 (Gu Mu''s 谷牧 recollection: the meeting of Dec. 6 on the outline printed and sent up Nov. 23; the place and the hour not given). Made public: 1990
        ([[w.womende-zhou-zongli]], 27–28, cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.30). To check: [[w.womende-zhou-zongli]], 27–28 (Gu Mu''s recollection, cited by [[w.mao-zedong-zhuan]],
        VI, ch. 75 n.30). See [[cal.1966-12-04.china-leadership]]. Names: Chen Boda 陈伯达, Zhou Enlai 周恩来.'
      src:
        c: 10efe0d3
