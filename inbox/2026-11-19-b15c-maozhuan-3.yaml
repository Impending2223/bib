    item: '[[w.mao-zedong-zhuan]], VI, ch. 78 (in June, on Mao''s view, the Military Commission''s Office Group holds a forum to discuss ''preparing for war''; the book says nothing of its plan,
      of Huang Yongsheng and Wu Faxian, or of the outline of the Fourth Five-Year Plan)'
- cite:
    id: cal.1969-06-12.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 78 (June 12, on Mao''s instruction, the Center issues the document ''Several questions to watch in propagating the image of Chairman Mao'' 《关于宣传毛主席形象应注意的几个问题》:
      propaganda at home now does not stress politics, pursues form, boasts and wastes; hereafter no more Mao badges may be made without the Center''s approval, the papers are not to use Mao''s
      portrait as a regular headpiece, no ''loyalty-ization'' movement, no feudal buildings, no formalist ''asking instructions in the morning, reporting in the evening'', reading quotations before
      meals or bowing to Mao''s portrait)'
    units: A, B, C
- cite:
    id: cal.1969-06-26.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 78 nn.5, 11 (the day he leaves Wuhan, June 26, Mao says to Hubei''s Zeng Siyu 曾思玉 and the others: ''I did not come to talk work with you, I came to rest,
      being busy at Peking'', n.5; in the record of the talk with Zeng Siyu, Liu Feng 刘丰, Zhang Tixue 张体学 and Fang Ming 方铭, n.11: before going down the main thing is to learn policy and make the
      policy clear; those in custody, all to be freed, whatever their rank, a nationwide question; the special-case groups are very dangerous, afraid of being right they twist men into counterrevolutionaries;
      a group worked one or two years with nothing and prefers to be left; he does not wholly oppose special-case groups, which need men of experience, older, with the masses; in Henan, it is
      said, half the first secretaries of districts and counties are working again, a good experience; the book puts Mao at the East Lake guesthouse, Meiling No. 1, May 31 to June 26, not on his
      train)'
