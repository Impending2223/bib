- cite:
    id: cal.1967-07-17.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.51 (July 17 morning at his lodging, Mao hears Xie Fuzhi and Wang Li on the cultural revolution in Sichuan, Yunnan, Guizhou and elsewhere, and studies
      the problems of Wuhan; present Zhou Enlai, Yang Chengwu, Wang Dongxing, Yu Lijin and Zheng Weishan; when Xie says the Hubei rebels want to overthrow Chen Zaidao: ''whatever the errors, big
      or small, once acknowledged, no one is to be overthrown; if after acknowledging they are overthrown, that is their error; we came to guard Chen; Chen Zaidao and Meng Futang are not to be
      overthrown''; ''I do not see Hubei as worse than Hunan and Jiangxi''; ''no fear of the Red Guards, whichever faction, all now borrow my signboard''; ''the Million Heroes keep their name,
      to be put on the right track; the three sides to reach an agreement and issue a statement; the Workers'' General Headquarters to be rehabilitated, the headmen still held to be freed today
      or tomorrow''; ''the army makes mistakes fast, corrects them fast''; ''I came out to rest a bit, a year in Peking; on the 13th I heard a million people swam, so the idea'', n.51)'
    units: B, C, D
- to-check:
    id: cal.1967-07-17.china-leadership
    add: Mao Zedong 毛泽东, interjections while hearing Xie Fuzhi 谢富治 and Wang Li 王力 (record 插话记录), July 17, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.51)
- src:
    id: cal.1967-07-17.china-leadership
    rows:
    - 'via w.mao-zedong-zhuan VI, ch.76 n.51: B, C, D'
- cite:
    id: cal.1967-07-18.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.52, 53 (July 18 evening Mao calls Chen Zaidao and Zhong Hanhua to his lodging; present Zhou Enlai, Xie Fuzhi, Yang Chengwu, Wang Li, Zheng Weishan,
      Yu Lijin, Wang Dongxing and Li Zuopeng, first commissar of the Navy; ''Sichuan is very grave, Wuhan is different'': because the storming was fierce, to keep the ''eight articles''; once
      they came out the army had heart, so they arrested people and dissolved organizations; once the ''ten articles'' came out the rebels had heart again; to Xie, Wang and Yu: work harder, organize
      support for the military region, not overthrow it; before the statement is issued both sides meet; ''all workers, why this side so right and that so left?''; to Chen and Zhong: never admit
      to being ''three-anti elements''; Zhang Tixue not to be used no more?; the main thing now is work on the army and the Million Heroes; the talk ended at 10 p.m., Mao saw Chen and the others
      to the corridor and made the staff shake hands with them: ''you cannot overthrow your commander again, can you? I will not'', n.52, n.53)'
    units: B, D, E, F
- to-check:
    id: cal.1967-07-18.china-leadership
    add: Mao Zedong 毛泽东, talk with Chen Zaidao 陈再道, Zhong Hanhua 钟汉华 and others (record 谈话记录), July 18, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.52)
- src:
    id: cal.1967-07-18.china-leadership
