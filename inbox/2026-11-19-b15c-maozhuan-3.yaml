    - 'via w.mao-zedong-zhuan VI, ch.77 n.26: A, B'
- cite:
    id: cal.1968-08-22.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.27 (Aug. 22 Mao approves Yao Wenyuan''s article for *Hongqi*, whose title ''Under the leadership of the working class, do struggle, criticism and
      reform well'' 《在工人阶级的领导下，认真搞好斗、批、改》 he changes to ''The working class must lead everything'' 《工人阶级必须领导一切》; he adds that the first task is to set up revolutionary committees of the three-in-one,
      usually done together with great criticism and the clearing of the class ranks; he strikes the stock phrase ''unprecedented'' and writes: do not say ''unprecedented'' hereafter; the greatest
      cultural revolutions in history were the invention of fire, the invention of the steam engine and the founding of Marxism-Leninism, not ours; the book does not give the drafts, the fortnightly
      *Hongqi* or the date of printing, n.27)'
- to-check:
    id: cal.1968-08-22.china-leadership-2
    add: Mao Zedong 毛泽东, revisions and comment on the draft of Yao Wenyuan's 姚文元 article 'The working class must lead everything' (manuscript 手稿), Aug. 22, 1968 (cited by [[w.mao-zedong-zhuan]],
      VI, ch. 77 n.27)
- cite:
    id: cal.1968-09-07.china-leadership-4
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.28 (Aug. 10, 14, 20, 28 and Sept. 1 the Center, State Council, Military Commission and Cultural Revolution Group approve the revolutionary committees
      of Yunnan, Fujian, Guangxi, Tibet and Xinjiang, so that 29 provinces, autonomous regions and municipalities, Taiwan excepted, have them, ''the mountains and rivers of the whole country red''
      as it was then called; Sept. 7 the *Renmin ribao* and the *Jiefangjun bao* print jointly the editorial ''Long live the all-round victory of the Great Proletarian Cultural Revolution'' 《无产阶级文化大革命的全面胜利万岁》:
      it marks the whole movement''s entry, nationwide, on the stage of struggle, criticism and reform, n.28)'
    units: B
