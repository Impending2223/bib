      id: cal.1968-02-02.china-leadership-3
      n: '[[w.mao-zedong-zhuan]], VI, ch. 77 (the day by the book; the book gives no place on the line, no number of the dead or hurt and no author of the attack, and goes on to Zhou Enlai''s
        report of Feb. 4 on the Xuzhou area).'
