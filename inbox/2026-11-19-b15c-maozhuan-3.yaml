    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.38, 51, 52 (Oct. 31 Mao speaks at the closing session on three questions: clearing the class ranks, to be pressed and kept to policy, ''steady,
      accurate and hard'', evidence and not confession, no beating, no ''jet planes''; the scholars not to be overdone, Feng Youlan 冯友兰, Jian Bozan 翦伯赞 and Wu Han 吴晗 have some use, and he names
      Hua Luogeng, Zhao Jibin, Ren Jiyu, Zhou Gucheng, Liu Dajie, Tan Jiazhen, Su Buqing and Yang Rongguo; the older comrades, one criticism, two protection, three watching, naming Tan Qilong
      谭启龙 and Jiang Weiqing 江渭清 among those felled in the provinces, who may be given something to do in some years; on the ''February counter-current'': to call it small is wrong, it is a big
      matter, to call it very grave is also wrong, a natural thing since they had differing views and spoke them openly, as Politburo members, vice-premiers and some Military Commission vice-chairmen;
      and he reserves on expelling Deng Xiaoping, ''there are differences from Liu Shaoqi'', he says a few good words for him, n.38, n.51; the plenum approves the report of the Central special
      case examination group of Oct. 18 and decides to expel Liu from the Party for ever, strip him of all posts, and go on settling accounts with him and his associates, the book giving this
      as the plenum''s resolution of the last day; the communique, printed in the *Renmin ribao* Nov. 2, says the plenum decides to convene the Ninth Congress at a suitable time, n.52; the book
      says Liu knew nothing of the report and had no right to defend himself)'
