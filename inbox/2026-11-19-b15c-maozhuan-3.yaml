      much is unreliable, hearsay; investigating inside and outside has brought out nothing in a long time; some students have no experience, some have factionalism, and one side lays out the
      other; ''do not push the responsibility down, do not blame those below, who told us not to run it''; the book gives no hall, hour or the decisions of the entry, n.10)'
