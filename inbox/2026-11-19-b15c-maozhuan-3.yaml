      run it, Chen Yi as head, Tan Zhenlin and Xu Xiangqian deputy heads''; Zhou Enlai urges him not to be so angry and makes a self-criticism; it is decided to hold meetings of criticism, ''life
      meetings'', of the three, who stop work and examine themselves; from Feb. 25 to Mar. 18 seven Politburo ''life meetings'' criticize Chen Yi, Tan Zhenlin, Xu Xiangqian and also Li Fuchun,
      Li Xiannian, Ye Jianying and Nie Rongzhen, Jiang Qing and others attacking them fiercely as a ''bourgeois restoration countercurrent'', called after the ''February countercurrent''; then
