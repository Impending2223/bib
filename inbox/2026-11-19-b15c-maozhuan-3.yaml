    entry:
      c: 'Lin Biao, that afternoon: this movement is in a sense a movement to criticize cadres; cadres long in power, told only of glory and great achievements and not allowed to hear of faults,
        must degenerate; this time the masses are roused to criticize them.'
      date: '1966-12-06'
      id: cal.1966-12-06.china-leadership-4
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.30 (Gu Mu''s recollection: ''that afternoon''s session'' of Dec. 6; the place not given). Made public: 1990 ([[w.womende-zhou-zongli]], 27–28, cited
        by [[w.mao-zedong-zhuan]], VI, ch. 75 n.30). To check: [[w.womende-zhou-zongli]], 27–28 (Gu Mu''s recollection, cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.30). See [[cal.1966-12-06.china-leadership-3]].
        Names: Lin Biao 林彪.'
