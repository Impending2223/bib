- cite:
    id: cal.1966-08-05.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.60 (the next day Mao writes the passage later headed ''Bombard the Headquarters: My Big-Character Poster'': the first Marxist-Leninist poster and
      the commentator''s article, how fine; for over fifty days leaders from the Center to the localities did the reverse, on the reactionary bourgeois side, a dictatorship of the bourgeoisie,
      beating down the proletarian movement, white terror; recalls the right deviation of 1962 and the ''left in form, right in essence'' of 1964; the text printed in the *Renmin ribao*, Aug.
      5, 1967, n.60)'
    units: B, C, E
- to-check:
    id: cal.1966-08-05.china-leadership
    add: '*Renmin ribao* 《人民日报》, Aug. 5, 1967, printing "Bombard the Headquarters: My Big-Character Poster" 《炮打司令部——我的一张大字报》 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.60)'
- cite:
    id: cal.1966-08-05.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.43 (during the plenum Mao adds a note on the commentator''s article, ''Hail a big-character poster of Peking University'', that a wrong leadership
      that harms the revolution should not be accepted unconditionally but firmly resisted, n.43)'
