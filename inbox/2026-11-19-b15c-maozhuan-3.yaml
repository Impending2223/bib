      date: '1966-06-15'
      thread: china-leadership
      c: Nanchang 南昌. Mao's train stops at the station; on the train he receives several leaders of the Jiangxi Party committee 江西省委. The movement is an exercise in opposing and preventing revisionism;
        the young, untried in revolutionary war and short of political experience, should be put through great winds and waves and see the world, to become firm successors of the proletarian cause;
        he means to drill the troops through it.
      n: '[[w.mao-zedong-zhuan]], VI, ch. 74 (after the departure from Hangzhou of June 15 and before the arrival at Changsha of June 16; the leaders not named; n.49). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]]
