    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.76 (Sept. 16, in Zhou Enlai''s talk to the representatives of the ''Heaven faction'' of the Peking colleges, the record n.76, as the book quotes
      it: ''with you our words have always not worked, while wrong estimates and extreme-left things spread without legs over the whole country; still now the ''handful in the army'' is being
      seized everywhere, many mass organizations are still fighting a ''civil war'', individualism, small-group-ism, anarchism, ''doubt everything'', ''overthrow everything'' show in your words
      and deeds, this is petty-bourgeois fanaticism and wholly wrong''; the book names the Heaven faction''s representatives only, not the Earth faction)'
