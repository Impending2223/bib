    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Peng Zhen, Lu Dingyi, Kang Sheng, Wu Lengxi and others fly specially to Wuhan to report to Mao; told that the Standing Committee has discussed and
      approved the outline, he voices no objection at once, asks only whether Wu Han 吴晗 is anti-Party and anti-socialist, says Wu may go on as vice-mayor, and on the ''rectification of the left''
      says: three years later; Peng and the others took Mao to agree; the Center transmitted the outline formally Feb. 12)'
    units: D, F, G
- cite:
    id: cal.1966-02-12.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (the Center formally transmits the outline 《汇报提纲》 Feb. 12)'
    units: A
- add:
    entry:
      id: cal.1966-03-11.china-leadership-4
      when: Mar. 11
      date: '1966-03-11'
      thread: china-leadership
      c: 'Xu Liqun 许立群, executive deputy head of the Central Propaganda Department, on Peng Zhen''s 彭真 view, telephones a responsible official of the Shanghai Party committee''s propaganda department:
        why was Yao Wenyuan''s 姚文元 article published with no notice to the Department?'
      n: '[[w.mao-zedong-zhuan]], VI, ch. 74 (the day by the book, which gives the call as what Mao took up Mar. 28–30; the caller''s place and the Shanghai man''s name not given). Made public:
        [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI, ch. 74). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003),
        for the same passage. Names: Xu Liqun 许立群, Peng Zhen 彭真, Yao Wenyuan 姚文元. Check: whether this is the exchange of [[cal.1966-03-11.china-leadership-3]], where a Shanghai propaganda head
        asks Peng Zhen for guidelines and is rebuffed (MacFarquhar); the book has the call from Peking to Shanghai, on Peng''s view, as a rebuke.'
      tags:
      - polity:prc
      - name:peng-zhen
      - name:yao-wenyuan
      - ok:fields-place
      - vis:only:prc
      src:
        c: e39618db
        rows:
        - 'w.mao-zedong-zhuan VI, ch. 74: all'
- cite:
    id: cal.1966-03-17.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Mar. 17–20 at Hangzhou 杭州, Mao calls an enlarged meeting of the Standing Committee; present Mao, Liu Shaoqi, Zhou Enlai, with the first secretaries
      of the regional bureaus and officials of the Center; Deng Xiaoping, on his inspection of the northwestern third front, asks leave; the agenda not told beforehand, at the opening only the
      question of a delegation to the CPSU''s 23rd Congress, and whatever else was to be said)'
    units: A, C
- cite:
    id: cal.1966-03-17.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.27 (in March Mao revises the summary three times; at the first revision he adds that the lesson of the past dozen years was that ''we seized hold
      late''; the day of the first revision not given, n.27)'
    units: G
