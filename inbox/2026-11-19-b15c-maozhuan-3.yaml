    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.4 (Jan. 6 the Workers'' General Headquarters and other rebel bodies hold in the People''s Square at Shanghai the meeting to overthrow thoroughly
      the Shanghai committee headed by Chen Pixian and Cao Diqiu; Chen, Cao, Wei Wenbo, Yang Xiguang and other Shanghai and East China leaders are denounced; afterwards the committee''s and the
      municipal government''s offices are made to stop work and the rebels'' headquarters ''for grasping revolution and promoting production'' take over their functions, real power at Shanghai
      passing to Zhang Chunqiao and Yao Wenyuan, n.4)'
