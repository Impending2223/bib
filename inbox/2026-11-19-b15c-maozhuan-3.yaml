- cite:
    id: cal.1967-01-08.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.5 (Jan. 8 Mao on the takeover of the two Shanghai papers, n.5: ''this is a great revolution, one class overthrowing another'', whose effect on all
      East China and the provinces and cities will be very great; if the Shanghai revolutionary forces unite the whole country has hope; ''do not believe that without a butcher Zhang we must eat
      hairy pig''; ''to make a revolution one must first make opinion''; the Propaganda, Culture and Education ministries could not manage it, nor could we, ''once the Red Guards rose it was managed'';
      ''the seizure by the two papers is a national question, we support their rebellion''; ''grasp revolution, promote production, do not leave your posts to make revolution''; the main points
      printed in the editors'' note of the *Renmin ribao*, Jan. 9, to the Shanghai groups'' address to the people)'
    units: B, C
