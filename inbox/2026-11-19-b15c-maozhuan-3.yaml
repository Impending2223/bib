    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 nn.39, 40 (Mao''s comment, the day by the note, on a report of the General Logistics Department sent by Lin Biao: the army is to be a great school
      learning politics, military affairs and culture, and joining in the cultural revolution against the bourgeoisie; the other trades, the Party and government organs too, are to criticize the
      bourgeoisie; the school system to be shortened, education made revolutionary; the *Renmin ribao* publishes its main points in an editorial, n.40; later called the ''May 7 directive'' 《五七指示》)'
    units: C
