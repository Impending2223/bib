    at: peking
    basis: n
    note: 'the book: Yang Chengwu, just come from Mao at Shanghai "to Peking" (n.67), is seen by Zhou alone at 1 a.m.'
- add:
    entry:
      c: From Aug. 20, under the banner of "smashing the four olds," forced house searches, insults and beatings spread widely in Peking, Shanghai, Tianjin and other large and middle cities. Some
        of those branded "five black categories" are beaten to death, many sent back by force to their home places.
      date: '1966-08-20'
      id: cal.1966-08-20.china-leadership-4
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 (the book gives ''from the 20th'' (of Aug. 1966), after the rally of Aug. 18; no figures and no places beyond the three cities; the book calls the
        Red Guards mostly enthusiastic, politically naive, in a frenzy, with little notion of policy or law). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same
        passage. Check: the days, the book giving only ''from the 20th''.'
