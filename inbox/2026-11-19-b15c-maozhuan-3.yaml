        June 1966, in *Wo yu Mao Zedong de jiaowang* 《我与毛泽东的交往》, Shanxi renmin chubanshe, Nov. 1993, 41 (cited by [[w.mao-zedong-zhuan]], VI, ch. 74 n.49); [[w.xianzhi-mao-zedong-zhuan-1949]],
