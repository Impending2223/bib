    item: '[[w.mao-zedong-zhuan]], VI, ch. 78 n.17 (the evening of Sept. 16 Xinhua issues the Slogans for celebrating the twentieth anniversary of the People''s Republic 《庆祝中华人民共和国成立二十周年口号》, 29
