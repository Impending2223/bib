    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Jan. 25 the *Renmin ribao* prints the ''No. 1 Notice'' of the Shanxi Revolutionary Rebel General Command 山西革命造反总指挥部, formed of 25 bodies including
      the Shanxi revolutionary workers'' ''Dare-to-die Column'', which had announced the seizure of power on Jan. 14; the book does not give the editorial of the entry)'
- add:
    entry:
      c: The Renmin ribao prints the "No. 1 Notice" of the Qingdao Revolutionary Rebel Committee, which on Jan. 22 announced its seizure of power.
