    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.35, 37 (Oct. 13 the enlarged Twelfth Plenum opens under Mao''s chairmanship, 133 attending, of whom 59 are Central Committee members and alternates,
      50 members after ten alternates are raised to replace the dead and 9 alternates, the other 74 the members of the Group''s liaison meeting, of the Military Commission''s office group, the
      heads of provinces and great military regions and of the Center''s organs; Zhou: the plenum is called to prepare the Ninth Congress; the agenda four items, the principles and method of choosing
      delegates to the Ninth Congress, amending the draft constitution, the situation, the report of the special case groups, n.35; Mao on the situation, putting questions for discussion and no
      conclusion: there are two views, that the Eleventh Plenum''s resolution is basically right and that it is not so sure; he warned then and again at the October work conference; a show of
      hands is one thing, real agreement another; many comrades have not passed the test; the Central and alternate members, the masses do not forgive, as with Zhang Dingcheng 张鼎丞; the errors
      are there, the main responsibility is the Center''s and his, not the localities'' and not the army''s; it needs about three years, by next summer about done, n.37; the book gives no place
      for the plenum)'
    units: C, D
