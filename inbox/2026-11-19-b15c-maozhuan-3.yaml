    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.19 (Jan. 22 Mao''s talk with the senior officers at the enlarged meeting of the Military Commission''s liaison group, n.19: many resentful of the
      rebels'' storming of army organs; Xu Shiyou: why should old cadres of decades be dunce-capped; Li Tianhuan: we cannot work now; Mao: support the rebels, though few; our basic line, the side
      of the revolutionary left, ''not intervening was false''; against ''jet plane'' treatment, hours long, of Liao Hansheng, Liu Zhijian and Su Zhenhua, ''not civilized''; do not go too far,
