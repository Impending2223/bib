    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.29 (Nov. 22 Zhou Enlai and Li Fuchun report to Mao; Mao''s points: the cultural revolution in factories and mines to go by stages and in batches;
      the eight-hour working day not to be invaded, workers to make revolution only in spare time; after the paper is out Gu Mu is to take a team to Shanghai, Tianjin and Shenyang to hear the
