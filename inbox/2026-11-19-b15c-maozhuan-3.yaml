- cite:
    id: cal.1966-10-25.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 nn.16, 21 (Oct. 25 Mao''s speech to the conference, the summing up, n.21: first the history of the first and second fronts, set up because after Stalin''s
      death Malenkov could not hold and revisionism came; he took the second front before the Eleventh Plenum so that others might gain standing among the masses and the country not be shaken
      when he went to see Marx; it had not gone well; now changed, but the Red Guards do not yet know; the alarm at the Twenty-three Articles; his warning in Sept. and Oct. of 1965 that Peking
      might go revisionist; ''Peking''s problem can now be said to be basically solved''; second, the cultural revolution, only five months old, perhaps two five-month periods more; ''the movement
      reached your own heads''; ''who wants to overthrow you? I do not, nor perhaps the Red Guards''; the first stage''s speeches abnormal, n.16)'
    units: B, C, D, F
