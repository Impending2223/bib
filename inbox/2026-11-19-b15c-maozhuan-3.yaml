- cite:
    id: cal.1966-12-26.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.35 (Dec. 26, Mao''s seventy-third birthday: at short notice that evening dinner at the swimming pool at Zhongnanhai 中南海 for Jiang Qing, Chen Boda,
      Zhang Chunqiao, Wang Li, Guan Feng, Qi Benyu and Yao Wenyuan, without Lin Biao, Zhou Enlai, Tao Zhu, Kang Sheng or Li Fuchun; the meal as usual four dishes and a soup, a small bowl of noodles
      each, baked sweet potatoes and boiled maize; before it Mao spoke at length, with no formal record: Wang Li''s account: socialist revolution had reached a new stage, the USSR had restored
      capitalism, whether the proletariat can hold power after taking it is the new central question, the fortress is most easily breached from within; the May 16 notice, the broadcast poster
      and the Red Guard link-up joined the whole revolution into one; the struggle with the bourgeois reactionary line goes on; there are those who must be made to rein in at the cliff''s edge;
      revolutionary movements in modern China all began with the students; at table he raised his cup ''to the all-round class struggle throughout the country'', n.35)'
    units: A, B, C, D, E, F, G, H
