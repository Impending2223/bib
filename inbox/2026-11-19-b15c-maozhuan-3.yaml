- cite:
    id: cal.1967-09-16.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.69 (Sept. 16 Mao leaves Shanghai by train for Peking by way of Hangzhou, Nanchang, Changsha, Wuhan and Zhengzhou, talking with the heads of each
      province on the way; in Zhejiang, to Nan Ping and Chen Liyun, n.69: Long Qian and Ruan Xianbang have errors, are to be helped, not beaten to death, cadres are not landlords, no kneeling,
      jet planes, house searches, tall hats, placards; ''I cannot make out why one factory, one school divides in two, both sides have backers''; ''left in form, right in fact'', the first year
      of the movement past, the second three months gone, July, Aug., Sept., ''by the Spring Festival, I think, perhaps an outline'')'
    units: C, F
- to-check:
    id: cal.1967-09-16.china-leadership
    add: Mao Zedong 毛泽东, talk with Nan Ping 南萍 and Chen Liyun 陈励耘 (record 谈话记录), Sept. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.69)
