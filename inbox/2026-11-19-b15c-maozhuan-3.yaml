- cite:
    id: cal.1967-03-10.china-leadership-3
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Mar. 10 the Center, the factions of Jiangsu''s mass organizations not for the moment able to unite, decides on military control of Jiangsu province;
      the book does not give the telegram, the two teams or the committee''s set-up)'
- cite:
    id: cal.1967-07-14.china-leadership-6
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Xie Fuzhi and Wang Li reach Wuhan on the 14th; against Zhou Enlai''s instruction not to appear in public for the time, they go that night to Hubei
      University and meet a group of rebels, whom they support; next day the rebels hold a great parade welcoming them to settle Wuhan''s question; the book does not give the Red Guards from Chongqing,
      the wall posters or the slogans)'
- cite:
    id: cal.1967-07-20.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (July 20 at dawn more than 200 delegates of the ''Million Heroes'' come to Baihua No. 2 of the East Lake guesthouse to demand answers of Wang Li;
      Chen Zaidao and Xie Fuzhi come out, promise to receive them in the afternoon; as the delegates are about to go, several hundred more, most of them soldiers, rush into the East Lake guesthouse,
      in a state of feeling beat Chen Zaidao, rush into the rooms and drag Wang Li off to the Military Region compound; the book does not give Mao''s lodging, the letter of Lin Biao and Jiang
      Qing or Mao''s leaving)'
