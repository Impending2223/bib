    id: cal.1966-07-24.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.55 (July 24, at a talk mainly with members of the Central Cultural Revolution Group: no work teams, perhaps observers to look into things and not
      give orders; withdraw them, suspend the ''black gang''; leftist students and teachers form revolutionary committees and run it themselves; fight and reform, fight those in power in the Party
      on the capitalist road and the academic authorities; the *Renmin ribao*, the Propaganda Department, the Culture Ministry and the Peking Municipal Committee were not in our hands; some comrades
      fear the masses, n.55; the place not given)'
    units: B, C, D, E, F, G, H
