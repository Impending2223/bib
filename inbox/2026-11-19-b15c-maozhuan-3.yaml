    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.73 (at Wuhan, Sept. 19, to Yang Chengwu, Zhang Chunqiao, Wang Dongxing and Yu Lijin, n.73: ''a ninth congress to be held, I plan next autumn, at
      the least in January the year after''; ''free a batch of cadres, use a batch boldly, most cadres are good''; ''the Central Committee to be enlarged, fresh blood, among the delegates too'';
      ''will there be a National People''s Congress, when?''; ''the Party organs and government organs should be much reduced'')'
