    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.79 (Apr. 14 the second plenary session of the Congress, Mao presiding, hears nine speakers, Zhou Enlai, Chen Boda, Kang Sheng, Huang Yongsheng,
      Wang Hongwen 王洪文, Chen Yonggui 陈永贵, Sun Yuguo 孙玉国, Wei Fengying 尉凤英 and Ji Dengkui 纪登奎; Sun, a front-line soldier from Zhenbao against the Soviet invaders, is applauded standing by Mao as
      he comes up and when he finishes, and Mao shakes his hand and says: ''tanks, armored cars, guns and planes we want all of them, but we depend chiefly on the courage of the infantry''; the
      session passes the political report and the revised Party constitution; the book gives no afternoon and does not say the papers went to the secretariat for editing, n.79)'
