    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Apr. 16 Zhou Enlai, Deng Xiaoping, Peng Zhen, Chen Yi 陈毅, Ye Jianying 叶剑英 and the heads of the Center bureaus come again to Hangzhou for the enlarged
      Standing Committee meeting Mao calls; Liu Shaoqi, on his journey to Pakistan, Afghanistan and Burma, reaches Hangzhou only on the 20th)'
    units: A
- cite:
    id: cal.1966-04-22.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 nn.35, 36 (Apr. 22 Mao''s long speech: not Wu Han''s question alone; a struggle that touches souls, men ''in the court'' in the Center and in the
      regions, provinces and cities, the army too; ''on Feb. 3 it was hurry hurry'' with a group paper; at Wuhan ''on rectifying the left I did not agree''; revisionism in China: two possibilities,
      none or some, early or late; n.35, and n.36 for ''revisionism not only in the cultural world, the Party, government and army will breed it, and above all the Party and army'', Wang Renzhong''s
      diary of Apr. 29, the day of the remark not given)'
    units: A, B, D, E, G
