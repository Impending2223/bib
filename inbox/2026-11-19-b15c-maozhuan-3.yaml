    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.1, 2 (the joint editorial of the *Renmin ribao* and the *Hongqi*, the first joint editorial of the Center''s two chief organs, ''Carry the great
      proletarian cultural revolution through to the end'': 1967 the year of all-round class struggle, of a general attack by the proletariat and other revolutionary masses on the handful in the
      Party on the capitalist road and the ox-demons in society, of deeper criticism of the bourgeois reactionary line, of decisive victory for fight-criticize-reform; the new situation: workers
      and peasants have risen and founded their own revolutionary organizations; the cultural movements of modern China began with students and developed to workers'' and peasants'' movements,
      ''an objective law'', nn.1, 2)'
