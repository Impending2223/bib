- cite:
    id: cal.1966-09-30.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.14 (Wang Li''s account, interview of 1983: Chen Boda and Zhang Chunqiao drafted Lin Biao''s speech with ''bourgeois counterrevolutionary line'',
      Mao already agreeing to the text; Tao Zhu said ''counterrevolutionary'' was too heavy, and it was changed to ''bourgeois anti-revolutionary line'', which Mao agreed and Lin spoke on Tiananmen;
      that evening in the Beijing Hall, as they gathered to drive to the fireworks, Zhang Chunqiao told Mao the phrase made no sense grammatically and proposed changing it back; Mao: do not change
      it back, say from now on ''thoroughly criticize the bourgeois reactionary line''; the *Hongqi* editorial was changed to Mao''s wording; Zhou Enlai was not at his side and did not know, n.14)'
    units: A, B, C, D, E, F
