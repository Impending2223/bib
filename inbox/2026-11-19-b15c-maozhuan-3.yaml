- cite:
    id: cal.1969-04-02.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.76 (from Apr. 2 the Congress meets in groups on the political report and the draft revision of the Party constitution; the draft keeps the ''Cultural
      Revolution'' and its theory, and writes in: ''Comrade Lin Biao is Comrade Mao Zedong''s close comrade-in-arms and successor''; the clause''s history in Zhang Yaoci''s 张耀祠 account, n.76)'
    units: A
- cite:
    id: cal.1969-04-11.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.77 (Apr. 11 Mao''s speech at the meeting of the Congress secretariat and the group convenors: shall the groups go on to the end or hold a plenary
      session; the plan is a plenary session in the middle to pass the report and the constitution, then the election and a last plenary to close; the Beijing group''s bulletin says one tendency
      hides another, in cleaning the class ranks there is the tendency to widen it, understandable since the Center ordered the cleaning, in history there are many such cases; the principal contradiction
      was set at the Second Plenum of the Seventh Committee as that of proletariat and bourgeoisie but not often said or said openly; so a Cultural Revolution again; call it great or not, let
      historians decide; touched the superstructure from the Center to factories, offices and schools; the army to be careful; at Nankou eight men made a case file and made the Party secretary
      a dog spy, handed to the masses to check he was a good man; case-makers'' material is not accurate; once shut up it is hard to let out, one must give a reason; leading comrades are to treat
      widening as a main matter; the list of the Central Committee to come from below, from the groups, then the large groups; he proposes electing the old comrades named; the book gives no hall
      or those present, n.77)'
    units: C, D, E
