    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.41, 44 (Jan. 17, four days after Mao''s meeting with Liu in the text, nn.41 and 44 give the record of his talk with a foreign party''s delegation:
      of Wang Ming 王明, he is still a Central Committee member and will probably not be elected at the next congress; Liu and Deng, he thinks, should be; the struggle with Liu began in the summer
      of 1964 and the Twenty-three Articles of 1965 were its result; place, hour and the delegation not given)'
    units: J
