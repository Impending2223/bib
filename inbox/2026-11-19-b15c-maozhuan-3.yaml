      VI, ch. 74 n.43)
- cite:
    id: cal.1966-08-06.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Aug. 6, in a small circle, Mao makes a first settling of the adjusted list of Central leaders and their order, the day after writing the poster and
      the day before it is printed for the plenum)'
- cite:
    id: cal.1966-08-06.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Lin Biao, resting at Dalian 大连, had telegraphed leave of absence before the plenum; Mao told him to come to Peking, and he joined the plenum midway
      on Aug. 6)'
- cite:
    id: cal.1966-08-07.china-leadership-5
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Aug. 7 the poster text, headed ''Bombard the Headquarters: My Big-Character Poster'', is printed and issued to the plenum, which it took wholly by
      surprise and which it turned from its agenda)'
    units: A
- cite:
    id: cal.1966-08-08.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (Aug. 8 the plenum adopts the Decision on the Great Proletarian Cultural Revolution 《关于无产阶级文化大革命的决定》, the Sixteen Points: the movement''s aim to bring
      down those in power in the Party taking the capitalist road, to criticize the reactionary academic ''authorities'' and bourgeois ideology; dare, trust the masses, ''no fear of disorder'';
      struggle by argument, not force; the key points the cities'' cultural and educational units and the leading Party and government organs; ''grasp revolution, promote production'')'
    units: B
- cite:
    id: cal.1966-08-08.china-leadership-7
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 (the same day Lin Biao, receiving members of the Cultural Revolution Group, ''heats it further'': the world to be turned upside down, with uproar,
      great winds and waves, so that the bourgeoisie cannot sleep for half a year, nor the proletariat)'
    units: B
- cite:
    id: cal.1966-08-12.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.61 (Aug. 12 the Plenum closes; on its last day it elects six more members and three alternates of the Politburo and a Standing Committee enlarged
      to eleven, in the order Mao Zedong, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun, Lin Biao second and Liu eighth; no vice-chairmen
      are re-elected, and thereafter only Lin is called vice-chairman, not Liu, Zhou, Zhu or Chen Yun; two more secretaries of the Secretariat are elected; Mao''s closing speech: the Ninth Congress
      to be got ready, ''perhaps next year at a suitable time''; whether the Plenum''s decisions are right will be seen in practice, and they are to be carried out by those present and absent;
      the reshuffle of the Politburo, its Standing Committee, the Secretariat guarantees it; the erring to be given a way out; there are parties outside the Party and cliques inside it; had the
      plenum not been held, matters would have been much worse; n.61)'
    units: A, F, I, J, K
