    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (Oct. 7 the Center puts into order and sends on ''Chairman Mao''s important instructions on his inspection of North, Central-South and East China''
      《毛主席视察华北、中南和华东地区时的重要指示》, the first time since the January seizures that the Center sends down a rather systematic account by Mao of the Cultural Revolution; the tour lasted two months and
