    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 (Mar. 21 the Standing Committee of the Politburo decides to give the materials on Liu Shaoqi''s arrest in the 1920s to the Wang Guangmei special case
      group 王光美专案组 for investigation; under the control of Jiang Qing 江青, Kang Sheng 康生, Xie Fuzhi 谢富治 and others the group becomes in fact the Liu Shaoqi–Wang Guangmei special case group; the
      book does not say when the group was set up)'
    units: B
- cite:
    id: cal.1967-03-23.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.46 (Mar. 23, after making some changes in Qi Benyu''s 戚本禹 article ''Patriotism or national betrayal?'' 《爱国主义还是卖国主义》, Mao writes on it ''read; very
      well written''; the article''s unnamed ''biggest person in authority taking the capitalist road'' and ''ambitious individual and plotter like Khrushchev'' were plainly Liu; after it ran
      in *Hongqi* and the *Renmin ribao* the criticism of Liu rose sharply; the book gives no issue number, no date of the article and no list of Mao''s changes, n.46)'
