      unity of Mao and Liu is the surety of its core, that if Liu has erred the two should talk frankly, Liu may self-criticize but Liu must not be brought down; Mao: for the whole, the two are
      of one mind; one person''s case is complex and cannot yet be settled; Zhang''s plan best put off, n.45)'
