- cite:
    id: cal.1969-03-22.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.61 (Mar. 22, in a talk with the members of the Cultural Revolution Group''s liaison meeting, to which Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian
      and Nie Rongzhen (down at their factories) were called: ''long since we met, you have done well; you should change over, Nankou, Xinhua and the Erqi works are all big plants''; will you
      study international questions; Nie not only the defense commission, Ye only the military science academy, look wider, military, political, home, abroad; old men have eaten more rice and
      have experience, the ''little turnips'' look down on you, ''I do not agree''; the ''February counter-current'' is not to be in the report; no Group member''s name in it, only Mao''s and
      Liu Shaoqi''s, only Liu''s bourgeois revisionist line; the comrades who erred this time erred less than Wang Ming; at the Seventh Congress not one was lost; as for Jiang Weiqing 江渭清, Tan
      Qilong 谭启龙, Zhang Pinghua 张平化, Zhao Ziyang 赵紫阳 and Huo Shilian 霍士廉, study what is seriously wrong, and if nothing but this time''s error, free them in time, n.61)'
