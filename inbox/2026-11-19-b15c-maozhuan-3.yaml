    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.30 (the outline, printed and sent up Nov. 23 by Gu Mu, goes Dec. 4 to the enlarged Politburo meeting under Lin Biao, where Lin Biao, Kang Sheng,
      Jiang Qing, Chen Boda, Zhang Chunqiao and Wang Li attack it fiercely, over three half-days: the industrial system''s problems worse than the cultural and educational, Zhang Chunqiao to Gu
      Mu: ''your speech speaks for a handful of capitalist-roaders''; on Dec. 6 Chen Boda calls it a surprise attack, Zhou: ''I asked them to write it, a night job, no time to consult''; Lin that
      afternoon: this movement is in a sense a movement to criticize cadres; Gu Mu''s recollection, n.30)'
    units: B, C
- to-check:
    id: cal.1966-12-04.china-leadership
    add: '[[w.womende-zhou-zongli]], 27, 28 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.30)'
- cite:
    id: cal.1966-12-09.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.31 (Dec. 9 the Center''s meeting passes the draft ''Ten provisions on grasping revolution and promoting production'', newly drafted by Chen Boda
      and others, and sends it down to county and regiment level and to enterprises and institutions for discussion: the eight-hour day to be kept; outside it, apart from a weekly talk on production,
      the masses arrange the cultural revolution themselves; workers may form revolutionary organizations; they may link up within their city in spare time; students may go to factories by plan
      in the workers'' spare time, n.31)'
    units: C
