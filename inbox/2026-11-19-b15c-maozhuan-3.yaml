- cite:
    id: cal.1967-08-16.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.63 (Aug. 16 Mao''s talk with two Albanian experts, n.63: the movement is meant to last three years, the first to rouse, the second basically to
      win, the third to clear up; ''Kapo and Balluku came in January and February, I wanted them to stay to April, I said Feb., Mar. and Apr. would show an outline; now with Apr. to July and Aug.
      it is to be lengthened, three years from last June''; ''some places still to be disorderly for a time, disorder is good; if there were no great disorder the contradictions could not come
      out''; ''the cadres brought down are few'')'
- to-check:
    id: cal.1967-08-16.china-leadership
    add: Mao Zedong 毛泽东, talk with two Albanian experts 阿尔巴尼亚专家 (record 谈话记录), Aug. 16, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.63)
- cite:
    id: cal.1967-08-25.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.68 (Aug. 25 at 1 a.m. Zhou Enlai sees Yang Chengwu, just come from Shanghai, and gives him the record of Wang Li''s talk of Aug. 7, to take at once
      to Mao, and speaks of the *Hongqi* editorial drafted by Guan Feng that calls for ''pulling out the handful in the army''; Yang flies that morning to Shanghai; Mao, smoking, hears him in
      silence and says go and rest, I shall think; next morning: ''Wang, Guan and Qi are wreckers of the cultural revolution, not good men; you report to the Premier alone, have them seized, the
      Premier to be responsible for handling it''; read over: ''then go back and have the Premier act at once''; he adds, ''Qi is to be left for now, to make a self-criticism, to win one over'';
      at noon on the 26th Yang is back at Peking and reports to Zhou alone, n.68)'
    units: A, B, C, E, F, H, I
