- cite:
    id: cal.1966-10-24.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.20 (Oct. 24, in the evening, hearing the conference''s reports, Mao makes many interjections to put the leading cadres at ease: ''I did not foresee
      that one poster of Nie Yuanzi''s, one Red Guard, one national link-up would make so large a thing''; ''never admit anti-Party, anti-socialist, could one then work?''; to Li Jingquan: do
      not admit it, to put the Center bureaus, provinces and cities down and have students succeed them, would that do?; ''Liu''s and Deng''s posters should not be put in the streets, let them
      make revolution, do not forbid it, tell the students to read Lu Xun''s *Ah Q*''; ''do not wipe out comrade Shaoqi with one stroke''; ''Liu and Deng act in the open, not in secret''; ''Liu
      and Deng are to be allowed to change; they say I mix mud, then I do''; n.20)'
    units: D, E, G
