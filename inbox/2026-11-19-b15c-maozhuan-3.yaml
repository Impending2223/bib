    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.4 (in March Mao puts the points the book quotes: the basic experience of the revolutionary committees is three, a representative of the revolutionary
      cadres, of the army and of the revolutionary masses, the revolutionary three-in-one; unified leadership, break up the overlapping administrative organs, cut staff and simplify administration,
      a revolutionized leading group in touch with the masses; the most basic point in reforming the state organs is contact with the masses; the *Renmin ribao*, *Hongqi* and *Jiefangjun bao*
      editorial ''Revolutionary committees are good'' 《革命委员会好》, Mar. 30, prints them in bold type; the book dates the sayings ''in March'', n.4)'
