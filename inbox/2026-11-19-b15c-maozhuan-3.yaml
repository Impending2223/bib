    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.59, 65 (Feb. 19, in a talk with the members of the Cultural Revolution Group''s liaison meeting and Chen Yi, Li Fuchun, Li Xiannian, Xu Xiangqian,
      Nie Rongzhen and Ye Jianying: you old marshals look into international questions, Chen Yi in command, with Xu, Nie and Ye; to Li Fuchun and the others, the five-year plan has two years to
      run, are you working on it?; in many fields there must be reform, how to do socialism we do not understand; go down and look about, come early and go home late, or take your bedding and
      stay a week or so; give attention to investigation at home, collect materials and give opinions, n.59; to Chen Boda: your report is nearly written? is Feb. 20 for handing it in likely?;
      you three are to see Lin Biao together, n.65; the book gives no hall or hour)'
