- cite:
    id: cal.1967-09-30.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.77 (Sept. 30, at Peking, to the Albanian party and government delegation, n.77: ''part of China''s affairs is done tolerably, part not well; if
      all were done well why a cultural revolution? there is a dark side, which is to be changed''; ''last summer those for what we say, for the cultural revolution, were a minority; the workers
      had not risen, the students oppressed, the left could not stand, the Red Guards had just broken through''; ''now the workers have risen, the revolutionaries are the majority, in most provinces'';
      ''from the first half of last year to Feb. this year I put the situation more gravely, I said the first possibility of this struggle was defeat, the second victory; now an outline can be
      seen, the first possibility is victory, not defeat''; a reflection of the class struggle of society in the Party)'
    units: C, D, F, G, H, I, J, K, L
