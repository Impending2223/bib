    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.39 (late in the plenum Lin Biao and Jiang Qing jointly open a violent criticism of the ''February counter-current'', attacking in the group meetings
      Chen Yi, Xu Xiangqian, Nie Rongzhen, Ye Jianying and others; Lin says at the plenum that it was the gravest anti-Party incident since the Eleventh Plenum and a rehearsal of capitalist restoration;
      the book gives no day for either; after the plenum Kang Sheng proposes to compile materials on the ''February counter-current'' for the Ninth Congress, Jiang Qing backs him and materials
      are gathered; Mao does not agree and it is dropped (Wu Faxian''s account, n.39))'
