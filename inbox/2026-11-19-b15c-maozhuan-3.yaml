    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 nn.28–31 (Mar. 18: on ''highest and liveliest'' in speaking of Mao Zedong Thought, ''don''t put it that way'', and no ''peak'', n.28; and, n.29, that
      a batch more should be brought down, Jian Bozan 翦伯赞, Hou Wailu 侯外庐 and the like, ''not too many''; at a small meeting during the Hangzhou meeting, the day not given, Mao reproaches the *Renmin
      ribao* for much muck, for backing ghost plays and for praising Hai Rui, and Wu Lengxi 吴冷西, its head, as half a Marxist, n.31; Wang Renzhong''s diary has him on Cao Cao 曹操 and Sima Yi 司马懿,
      who decided on the moment, n.30)'
