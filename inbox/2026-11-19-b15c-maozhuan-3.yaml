    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.34 (a few days after Oct. 1 Mao formally receives the Albanian party and government delegation under Balluku and speaks of the Cultural Revolution:
      there are Kuomintang remnants on the mainland, some got into the central and local leading organs, this time they were cleaned out one by one by the Party, government, army and people themselves,
      which will keep quiet for ten to twenty years; not all were done cleanly or rightly, not a few must still be rehabilitated; when the masses move they are not so civilized, there is armed
      fighting, beating, tall hats, ''jet planes'', they need leading; the cadres who erred are a contradiction among the people, not the enemy''s; two contradictions, the enemy''s and the people''s,
      which made this harder than war; the book gives no hall, hour or those present, n.34)'
    units: D
