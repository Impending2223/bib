    add: Chen Zaidao 陈再道, account of Mao's handshake with the guesthouse staff on the evening of July 18, 1967, in *Chen Zaidao huiyilu* (xia) 《陈再道回忆录》（下）, Jiefangjun chubanshe, July 1991, 322
      (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.53)
- cite:
    id: cal.1967-07-20.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.54 (July 20 at dawn some two hundred delegates of the ''Million Heroes'' come to Baihua No. 2 at the East Lake to ask Wang Li to answer questions;
      Chen Zaidao and Xie Fuzhi come out and promise to see them in the afternoon; as they are leaving several hundred, mostly soldiers, rush in, beat Chen Zaidao and seize Wang Li to take him
      to the military region compound; they did not know Mao was at Wuhan nor that he lived in the guesthouse, nor went toward Meiling No. 1; Lin Biao and Jiang Qing that day write Mao jointly
      that the Wuhan situation is bad, his safety threatened, he should move early; the letter carried by plane by Qiu Huizuo, head of the General Logistics Department; Mao for a time took it
      very seriously, whether Chen Zaidao and the Million Heroes had risen in a ''riot'', and decided to leave at once; called the ''July 20 incident'', n.54)'
    units: A, B, D, E, F
- to-check:
    id: cal.1967-07-20.china-leadership
    add: Yang Chengwu 杨成武, account of the letter of Lin Biao and Jiang Qing to Mao of July 20, 1967, in *Yang Chengwu jiangjun zishu* 《杨成武将军自述》, Liaoning renmin chubanshe, Aug. 1997, 284 (cited
      by [[w.mao-zedong-zhuan]], VI, ch. 76 n.54)
- cite:
    id: cal.1967-07-21.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 (July 21 at 2 a.m. Mao leaves the East Lake guesthouse for the airport, arranged by Zhou Enlai, who had come specially to Wuhan; at 11 a.m. he flies
      to Shanghai and lodges at the Hongqiao guesthouse, his first flight since 1958; he stays at Shanghai nearly two months, to Sept. 16; at Shanghai he cannot sleep and asks those about him
      whether it was as they said; if Chen Zaidao had mutinied could they have got out)'
    units: A, B, C
- cite:
    id: cal.1967-07-24.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.55 (July 24 evening, as Yang Chengwu tells it, n.55: Mao gives him his errand for the second return to Peking and asks: did he know Chen Zaidao,
      what is he like; Yang: not before liberation, a good man, relations good; ''will he oppose me?'' ''no one will oppose you''; ''if Chen and Zhong wanted to get me, we could not have got out
      of Wuhan''; Mao: have Premier Zhou bring Chen Zaidao, Zhong Hanhua, Division Commander Niu and Commissar Cai to the Jingxi Hotel; and tell Chen three things: if you are in error, examine
      yourself; study; take care of your safety)'
    units: A, F, G
- to-check:
    id: cal.1967-07-24.china-leadership
    add: Yang Chengwu 杨成武, account of Mao's talk with him on the evening of July 24, 1967, in *Yang Chengwu jiangjun zishu* 《杨成武将军自述》, Liaoning renmin chubanshe, Aug. 1997, 289–290 (cited by [[w.mao-zedong-zhuan]],
      VI, ch. 76 n.55)
- cite:
    id: cal.1967-07-25.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.56, 57 (July 25 Mao drafts the reply of the Center to the Party committee of the Wuhan Military Region, n.56: ''for cadres who have made serious
      errors, including you and comrade Chen Zaidao whom the broad revolutionary masses want to overthrow, if they no longer hold to the errors, correct them in earnest and are understood by the
      masses, they may still stand up and join the revolutionary ranks''; Chen Zaidao writes in his memoirs that without Mao''s word ''comrade'' Lin Biao and the rest could have done for them
      easily, n.57)'
    units: C
