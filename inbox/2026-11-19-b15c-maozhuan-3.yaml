    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.30 (Sept. 19 the report of the Cultural Revolution Group''s liaison meeting''s discussion on convening the enlarged Twelfth Plenum, sent to Mao:
      what is it to settle, first prepare the Ninth Congress, second sum up some experience of the Cultural Revolution, third set up a Central Revolutionary Committee in substance and in organization,
