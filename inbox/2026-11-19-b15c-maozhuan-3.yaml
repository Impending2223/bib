    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 nn.32, 33 (Mar. 28–30 at Shanghai Mao talks several times with Kang Sheng, Jiang Qing, Zhang Chunqiao and others and sharply condemns the February
      Outline; on Mar. 30, n.32: the Propaganda Department a ''Palace of the King of Hell'', ''overthrow the King of Hell, free the little devils''; the Tenth Plenum had resolved on class struggle;
      where central organs do wrong he has always urged the localities to rebel and attack the Center, more ''Sun Wukongs'' to make havoc in heaven; ''if they shield bad men'' the Propaganda Department
      and the Peking committee are to be dissolved, and the group of five; n.33: ''we are all old'', the cultural revolution a long task not finished in his lifetime)'
    units: C, D, E, F
