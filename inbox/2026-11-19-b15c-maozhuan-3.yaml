    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.7 (Aug. 28, in a talk with Tang Pingzhu 唐平铸 and Hu Chi 胡痴, who had just gone to take charge of the *Renmin ribao*, n.7: students no longer care
      for ''fight, criticize, reform'', which he said himself, their hearts are out of school, they want to sweep away the ox-demons in society; to let those who wish to go go, leaving a few in
      turn to mind the schools, and to give out letters of introduction to all, left or right; food for those from outside; the movement to last past the year''s end, to the Spring Festival first;
      140,000 students from outside had come to Peking by this day)'
