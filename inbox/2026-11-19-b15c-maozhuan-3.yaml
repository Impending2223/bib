    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.70 (in Jiangxi, Sept. 17, to Cheng Shiqing and others, n.70: ''so many cadres down, good or bad? now the thought of the extreme left, doubt everything,
      must be criticized; there are not many but they have great energy and are tied up with bad men in society; we do not speak only for the conservatives, it is to educate the left; in all,
      unite the majority''; ''not a core to rally round, but a program; I lean to more people''; ''the front of attack to be smaller, of education wider, the left included'')'
    units: G, H, I
