- cite:
    id: cal.1966-11-14.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 14, afternoon, at the Diaoyutai 钓鱼台, Mao calls a meeting attended by some members of the Standing Committee and members of the Cultural Revolution
      Group; he affirms Zhang Chunqiao''s way of dealing with it, ''first the facts, then the concept'', and tells Chen Boda to draft a document on how the cultural revolution is to be carried
      on in factories and mines)'
    units: B
