    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.78 (Oct. 3, to Noumazalay, n.78: ''the cultural revolution is to remake part of our state machine''; of cadres: ''all I ask of you is one thing,
      put down the bureaucratic airs, treat people equally, no scolding at every turn''; ''this year and more of great criticism has given the cadres a fright''; ''anarchism has also grown much,
      it is good that it is exposed, we can educate''; to Noumazalay''s remark that foreigners say China is very disorderly: ''when it has been disorderly a while it will not be, even if asked,
      they have had enough''; ''two sides in one factory and fighting so fiercely, no reason; when they have fought enough they will not want to, the heads isolated; a word from the Center is
      a way down, too early is no good''; ''it is like a body covered with boils, squeeze out the pus and it is healthier'')'
    units: C, D, H
