    add: Chen Zaidao 陈再道, remark on the word "comrade" in Mao's telegram of July 25, 1967, in *Chen Zaidao huiyilu* (xia) 《陈再道回忆录》（下）, Jiefangjun chubanshe, July 1991, 363 (cited by [[w.mao-zedong-zhuan]],
      VI, ch. 76 n.57)
- cite:
    id: cal.1967-08-07.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.66 (Aug. 7, in the evening, Wang Li, just back from Wuhan to a great welcome and elated, sends for representatives of the Foreign Ministry''s ''revolutionary
      rebel liaison station'' and incites them to seize the power of the Ministry: ''diplomacy, it frightens, no one else can do it, you make it mysterious, only a few experts; is diplomacy so
      hard? I think handling the Red Guards'' internal problems is much harder; can the Red Guards not do diplomacy?''; ''the Ministry''s Party committee not touched? so great a revolution and
      the committee not moved? why may it not be moved?''; ''to haul Chen Yi out, the main direction is right, why may they not haul him?''; ''I think you have not got the power now, with some
      power you have prestige''; the rebels then smash the Ministry and ''seize'' the committee''s power; Aug. 22 at night the foreign-affairs rebels and Peking Red Guards storm and burn the British
      chargé''s office, the gravest breach of law toward foreigners since the founding, n.66)'
    units: A, B, C, D
- to-check:
    id: cal.1967-08-07.china-leadership
    add: Wang Li 王力, talk on the seizure of power in the Foreign Ministry 关于外交部夺权问题的讲话 (record 讲话记录), Aug. 7, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.66)
