    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.38 (Mao''s talk with the Albanian party and government delegation under Shehu, no place given: he may be called by Marx before long; Marx''s and
      Engels''s heirs took their party from them, as Khrushchev took Lenin''s; for China two possibilities, the first that revisionism takes Peking, the second a part divides; ''we are at dusk'',
      so he would put the bourgeois restoration right while he still has breath)'
