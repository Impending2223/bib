- cite:
    id: cal.1967-07-14.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.48 (July 14 3 a.m. Mao leaves Peking by special train, the first time away since his return of July 18, 1966; on the way, to Yang Chengwu, Wang
      Dongxing and Zheng Weishan, n.48: after the army came in, not knowing the situation, with little inquiry, errors were unavoidable; the ''eight articles'' arrested too many and banned some
      revolutionary organizations that should not have been, which pressed down; so Lin Biao drafted the ''ten articles'', after which those pressed rose again, a back-and-forth; ''back and forth
      is good''; ''I see Hunan and Jiangxi, Jiujiang, Nanchang, Lushan and Ganzhou, after the great armed fights, the situation very good and the battle lines clearer''; ''the PLA cannot collapse,
      if it did what would we rely on''; ''the cadres in the majority are good, Hebei''s cadres will have a great reversal of verdicts; I backed Liu Zihou; he stands forth, Yan Dakai will be easy'')'
    units: A, D, E, H
- to-check:
    id: cal.1967-07-14.china-leadership
    add: Mao Zedong 毛泽东, talk with Yang Chengwu 杨成武, Wang Dongxing 汪东兴 and Zheng Weishan 郑维山 (record 谈话记录), July 14, 1967 (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.20)
