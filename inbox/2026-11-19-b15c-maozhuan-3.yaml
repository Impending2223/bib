    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.13 (June 20 in the text, the record in n.13 dated June 21: Mao receives Tanzania''s President Nyerere 尼雷尔, who speaks of the tools imperialism uses
      inside an African state it would overturn; Mao: we kept some of the better Kuomintang men because we had no professors, teachers, journalists, artists or speakers of foreign languages, and
      some were planted by the Kuomintang in our factories, offices and army; not every professor, teacher or technician is bad, a part is very bad; the Cultural Revolution is clearing them out,
      the good kept and the bad kicked out; the book gives no place or those present)'
    units: D
