    id: cal.1967-11-05.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.81 (Nov. 5 Mao''s talk with the members of the Cultural Revolution Group''s liaison meeting, n.81: ''in fact this cultural revolution is rectifying
      the Party, the Youth League, the army, also workers, youth, women, students''; ''after fighting for more than a year, many bad men have come out; now a party is to be fought out''; ''bad
      men cannot be cleared out at one stroke; rectification of the Party cannot be wholly done before the Ninth Congress; after it, on the new program and rules, rectify and build the Party afresh'';
      ''our Party takes in new blood; workers, poor peasants, Red Guard activists to be taken in; too much carbon dioxide in the old blood''; he asks for several articles to canvass opinions on
      the Ninth Congress, to go out in Nov., the views to be gathered in Dec. and a directive issued; the Center and the Group issue three documents on it)'
    units: A, D, E, F, G, J, K
