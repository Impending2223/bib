- cite:
    id: cal.1966-12-21.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.33 (Mao''s talk with the Polish guest Yang Li 杨力, Dec. 21, n.33: to oppose Khrushchev''s revisionism alone is not enough, our own party''s revisionism
      too, or China will change its color; what was done was patching and mending, not class struggle as a whole; begin with the students and cadres, then the factories and villages, organize
      workers and peasants; not one man''s question but one class against another; eighty percent of our members joined after 1948, some bourgeois speculators; ''they fear the Red Guards''; organize
      Red Guards in factories and villages, ''who wins is not yet decided''; place and those present not given)'
    units: D, E, F, G
