- cite:
    id: cal.1966-11-09.china-leadership-3
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (early Nov. some Shanghai factory organizations, led by Wang Hongwen 王洪文 of No. 17 Cotton Mill, link up to set up the ''Shanghai Workers'' Revolutionary
      Rebel General Headquarters'' 上海工人革命造反总司令部; the Shanghai Party committee, on the Center''s rule against cross-trade organizations in factories and mines, does not recognize it and tries to
      educate the workers; Wang and the others call that ''suppressing revolutionary rebellion''; the date of the founding not given)'
- cite:
    id: cal.1966-11-10.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (Nov. 10, before dawn Wang Hongwen leads more than two thousand workers to board a train by force at Shanghai North Station to petition at Peking;
      the train is stopped at Anting by order of the railway bureau; at noon the workers lie on the rails, cutting the Shanghai–Nanjing line for nearly thirty-one hours, so that thirty-six trains
      cannot leave Shanghai; they demand that the headquarters be recognized as a lawful revolutionary organization, the journey to Peking a revolutionary act, and the East China Bureau and the
      Shanghai committee wholly to answer for the result)'
- variant:
    id: cal.1966-11-10.china-leadership-2
    unit: A
    witness: w.mao-zedong-zhuan
    reads: the boarding at Shanghai North Station before dawn on the 10th, the lying on the rails at Anting at noon that day, the line cut nearly thirty-one hours and thirty-six trains held
    at: VI, ch. 75
- cite:
    id: cal.1966-11-10.china-leadership-3
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 (the Anting incident brought no word from Mao at first; Zhou Enlai presides over an enlarged meeting of the Standing Committee, which, on the principles
      the Center had laid down, has Chen Boda wire the East China Bureau and the Shanghai committee not to compromise with the headquarters, and to persuade the workers who had been taken in or
      swept along)'
- add:
    entry:
      id: cal.1966-11-13.china-leadership-3
      when: Nov. 13
      date: '1966-11-13'
      thread: china-leadership
      c: Shanghai Cultural Square 上海文化广场. Zhang Chunqiao 张春桥, the Cultural Revolution Group's deputy head, sent to deal with the Anting incident, talks with delegates of the workers, with no consultation
        of the East China Bureau or the Shanghai committee. The Shanghai workers have risen, a good thing and what the Center hopes; the cultural revolution in Shanghai's factories and mines may
        be ahead of the country; the Shanghai Workers' Revolutionary Rebel General Headquarters 上海工人革命造反总司令部 may go on existing.
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 (n.25; the talk''s summary, Nov. 13). To check: Zhang Chunqiao 张春桥, summary of the talk with the workers'' delegates at the Shanghai Cultural Square
        上海文化广场 (座谈纪要), Nov. 13, 1966 (cited by [[w.mao-zedong-zhuan]], VI, ch. 75 n.25); [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage. Names: Zhang Chunqiao
