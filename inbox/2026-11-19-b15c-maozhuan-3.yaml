- cite:
    id: cal.1966-08-01.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.57 (Aug. 1 the Eleventh Plenum opens at Peking, Mao presiding; Deng Xiaoping announces the agenda in four items, a decision on the proletarian cultural
      revolution; the major decisions and measures since the Tenth Plenum; the formal confirmation of the May Politburo meeting''s personnel changes; the communiqué; the session first set for
      five days; Liu Shaoqi reports on the Center''s work and again takes the responsibility for the work teams; Chen Boda''s speech; Mao''s interjections that necessity hides in accident, that
      the poster of Nie Yuanzi and its broadcast brought the disorder, and that the decision should be made, to be overturned only at the next plenum, n.57)'
    units: B, C, D, E, F, G
