- cite:
    id: cal.1966-10-28.china-leadership-2
    item: '[[w.mao-zedong-zhuan]], VI, ch. 75 n.15 (the Central Work Conference, called on Mao''s proposal and held under his chairmanship from Oct. 9, he writing on Zhou Enlai''s request on its
      length ''three days are not enough, seven are needed'', in fact ran twenty days and ended on the 28th, n.15; the book does not give Zhou''s rules or his closing speech)'
- add:
    entry:
      c: The Renmin ribao reprints the "Message to All Shanghai Citizens" of the Workers' General Headquarters and others; its editors' note publishes the main content of Mao's talk of Jan. 8
        on the seizure of power in the two Shanghai papers.
      date: '1967-01-09'
      id: cal.1967-01-09.china-leadership-7
      n: '[[w.mao-zedong-zhuan]], VI, ch. 76 n.5 (the day by the book; the note''s record is Mao''s talk of Jan. 8, 1967; the book gives the lines of the talk quoted and no title of the editors''
        note). To check: [[w.xianzhi-mao-zedong-zhuan-1949]], the first edition (2003), for the same passage; *Renmin ribao* 《人民日报》, Jan. 9, 1967 (the reprint of the ''Message to All Shanghai
        Citizens'' 《告上海全市人民书》 with the editors'' note) (cited by [[w.mao-zedong-zhuan]], VI, ch. 76 n.5). Names: Mao Zedong 毛泽东.'
