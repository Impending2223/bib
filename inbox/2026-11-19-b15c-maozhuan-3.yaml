    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 (the day after the meeting of Apr. 23 the Congress holds its third plenary session; by secret ballot with candidates equal in number to places it
      elects the Ninth Central Committee and then closes; the book gives neither the hours nor the number of delegates or votes nor the meeting with Zhou Enlai afterward)'
- cite:
    id: cal.1969-04-28.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.81–84 (Apr. 28, under Mao''s chairmanship, the First Plenum of the Ninth Central Committee elects a Politburo of 25 members in all, Lin Biao''s
      and Jiang Qing''s groups'' leading members almost all among them, only 12 of the Eighth Politburo''s 30 (the three dead not counted) continuing; of 277 votes cast for Politburo members Mao,
      Lin Biao, Zhou Enlai and Kang Sheng have all, Chen Boda 275, Huang Yongsheng 274, Jiang Qing 270, Wu Faxian and Ye Qun more than Zhang Chunqiao and Yao Wenyuan, n.81; for the Standing Committee
      Mao, Lin, Zhou, Kang Sheng and Chen Boda are elected, Jiang Qing getting 150 votes, Huang Yongsheng 130 and the other nominees under 35, n.82; Mao continues chairman of the Central Committee,
      Lin vice-chairman; Mao speaks briefly: only the old words, unity, so as to win greater victory; the socialist revolution goes on, with things still undone, struggle, criticism and reform,
      and some years on perhaps another revolution; without the Cultural Revolution it would not do, the foundation is not firm, in a fairly large majority of factories leadership is not in the
      hands of true Marxists or of the workers; consolidate the dictatorship of the proletariat in every factory, village, office and school, one by one; and on the Zhenbao clash of Mar. 2 and
      after, n.83, ''prepare for war: we do not strike out, do not be provoked, if you invite me I will not go, but if you come I shall deal with you'', n.84; the same day the new Politburo passes
      the Military Commission''s list, Mao chairman, Lin Biao, Liu Bocheng, Chen Yi, Xu Xiangqian, Nie Rongzhen and Ye Jianying vice-chairmen, and the Office Group''s, Huang Yongsheng head and
      Wu Faxian deputy head, which takes the Commission''s daily work; the book gives no hour, no list of the Politburo''s names and no alternates)'
    units: D, E, F, G
