    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.10 (May 11 by the note, Mao''s speech on armed fighting, rebellion and other questions: to rectify the ranks and catch the bad is basically right;
      since he said the Cultural Revolution continues the Kuomintang–Communist war a batch of Kuomintang bad men have been caught, to go on but under control, with a point at which to put on the
      brakes; the Sixteen Points define a current counterrevolutionary as one who kills, burns, poisons or destroys state property, a few reactionary slogans need not mean arrest; unless real
      spies or real counterrevolutionaries, do not leave men without a way out; protect or suppress the masses is the root difference between Communists and Kuomintang; the book gives no hour,
      place or those present)'
