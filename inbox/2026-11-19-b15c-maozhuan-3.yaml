    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.34 (Apr. 9–12 Kang Sheng relays Mao''s talks at the Secretariat meeting; Peng Zhen is criticized, he and some others present make preliminary self-criticisms
      and ''agree to the Chairman''s criticism and instructions''; decided: a Center notice to criticize the group of five''s outline thoroughly and withdraw it, and a drafting group for cultural
      revolution documents, Chen Boda head, Jiang Qing and Liu Zhijian 刘志坚 deputies, Kang Sheng adviser, to go to Mao and the Standing Committee for approval; the report of Apr. 12, n.34)'
    units: C, E
