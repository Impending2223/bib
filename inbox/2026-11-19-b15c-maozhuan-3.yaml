    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.33 (Oct. 1, on the Tiananmen rostrum, to Mehmet Shehu''s defense minister Beqir Balluku 巴卢库, who says the Cultural Revolution has won a great victory:
      the working class already rules everything in the main cities, in most of the countryside the peasants rule; until the first half of this year the students were the vanguard, now they lag;
      asked whether the Party''s congress is soon, Mao: yes, to sum up work and elect the leadership; every factory, commune, school and office is to be reformed, the masses to be roused to reform;
      the book gives no ''rest room'' and nothing of Feb. 1967, n.33)'
    units: B, C
