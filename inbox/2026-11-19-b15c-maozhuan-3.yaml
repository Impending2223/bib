      when: Dec. 15
      date: '1966-12-15'
      thread: china-leadership
      c: Lin Biao 林彪 presides over the enlarged Politburo meeting, which passes the Center's draft directive on the proletarian cultural revolution in the villages. The point is the handful in
        the Party in power on the capitalist road and the unreformed landlords, rich peasants, counterrevolutionaries, bad elements and rightists; great airing, great blooming, wall posters, great
        debates, great democracy; teams and communes may link up in slack production time, and revolutionary students may go down to link up.
      n: '[[w.mao-zedong-zhuan]], VI, ch. 75 (n.32; the place not given). Made public: [[w.xianzhi-mao-zedong-zhuan-1949]] (2003), by the text of the second edition ([[w.mao-zedong-zhuan]], VI,
