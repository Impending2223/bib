      is to be done or not, you say no question, I say there is a question; did the Eleventh Plenum decide rightly to do it, are the achievements the main thing or the faults, which takes in the
      Red Guards and the ''three supports and two militaries''; and whether the handful in the central and local leadership ought to fall, that question exists; the book gives no hall, hour or
      Lin Biao''s presence, n.36)'
