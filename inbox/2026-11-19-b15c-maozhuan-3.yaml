- cite:
    id: cal.1968-07-03.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.18 (July 3, with Mao''s approval, the Center, State Council, Military Commission and Cultural Revolution Group issue the notice ''July 3 Notice''
      《七·三布告》, six points quoted in full: stop armed fighting at once, remove fortifications, leave the strongpoints, those on the rail lines first; restore at once, unconditionally, all traffic
      on the Liuzhou Railway Bureau''s line; return unconditionally the aid goods for Vietnam seized; return unconditionally the arms and equipment of the PLA seized; outsiders and the youths
      who have flowed back to the cities from the country and hills to go back to their places and units; those with proof of murder, arson, wrecking of transport, raiding of prisons, theft of
      state secrets or private radio sets to be punished by law, n.18)'
    units: A, B
- src:
    id: cal.1968-07-03.china-leadership
    rows:
    - 'via w.mao-zedong-zhuan VI, ch.77 n.18: A, B'
- cite:
    id: cal.1968-07-12.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.14, 21 (July 12 by the notes, Mao''s talk with the members of the Cultural Revolution Group''s liaison meeting, on Shaanxi: how were these provinces
      ''liberated'', by sweeping away Hu Zongnan 胡宗南; the Northeast was put in a sack and not one escaped; without the Cultural Revolution these bad men would not have come out; those inside our
      ranks cannot be made out at once, a factory needs months; the Cultural Revolution has the spirit of socialist revolution, a mass movement from below, n.14; the same record, n.21: most are
      ''free and easy'' men, ''you want to fight, go and fight, I won''t come''; none of this is among the entry''s units)'
- to-check:
    id: cal.1968-07-12.china-leadership
    add: Mao Zedong 毛泽东, talk with the members of the Cultural Revolution Group's liaison meeting 中央文革碰头会 (record 谈话记录), July 12, 1968 (cited by [[w.mao-zedong-zhuan]], VI, ch. 77 n.14)
- cite:
    id: cal.1968-07-24.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.19 (July 24, on Mao''s instruction, the Center, State Council, Military Commission and Cultural Revolution Group issue the notice ''July 24 Notice''
      《七·二四布告》 on Shaanxi, six points quoted in full: the July 3 Notice, approved by Mao in person, is to be carried out and not defied; stop the armed fighting at once, dissolve all professional
      armed fighting teams, remove fortifications, strongpoints and checkpoints; return seized cash and goods; restore at once the interrupted trains, boats, roads, post and telegraph; return
      the PLA''s seized arms; those with proof of murder, arson, robbery, destruction of state property, interruption of transport and communication, private radio sets, raids on prisons and labor
      farms, release of convicts, and the men behind the scenes, to be punished by law under the dictatorship of the proletariat, n.19)'
    units: A, B, C
- src:
    id: cal.1968-07-24.china-leadership
    rows:
    - 'via w.mao-zedong-zhuan VI, ch.77 n.19: A, B, C'
- cite:
    id: cal.1968-07-28.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.22 (before dawn on July 28 Mao summons the five, Nie Yuanzi 聂元梓 of Peking University, Kuai Dafu 蒯大富 of Tsinghua, Tan Houlan 谭厚兰 of Peking Normal,
      Han Aijing 韩爱晶 of Peking Aeronautics and Wang Dabin 王大宾 of Peking Geology; Lin Biao, Zhou Enlai, Chen Boda, Kang Sheng and Jiang Qing and others present; the talk from 3:30 to 8:30 in the
      morning, five hours; to Kuai''s talk of a ''black hand'' behind the workers: ''the black hand is I''; two years and no struggle, no criticism, no reform, ''struggle yes, but you do armed
      fighting''; four ways, military control, split in two (one side a city each), all go out and ''struggle, criticize, leave'', or the workers withdraw and the students may fight on ''ten thousand
      years''; he made a recording that day against their taking from it what suits them; the workers will intervene, dictatorship of the proletariat; when Kuai came late, Han said Kuai could
      not control his side and Mao: ''first kill this tiger''; Jiang Qing, Lin Biao and the five speak; the book names no other person present, n.22)'
    units: A, C, D, E, F
- src:
    id: cal.1968-07-28.china-leadership
    rows:
    - 'via w.mao-zedong-zhuan VI, ch.77 n.22: A, C, D, E, F'
- cite:
    id: cal.1968-08-08.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 n.24 (Aug. 8 Mao receives the members of the Cultural Revolution Group''s liaison meeting and Wu De 吴德 and talks of the universities: it will not
      do to rely on the students to settle things; the students hold no industry, no farms, no transport and no troops, they can only make a noise; the ''five great leaders'' are not trusted by
      the masses, the workers, peasants and soldiers, the students or most of their own side, only a few hundred are held by them; the students must work twenty or thirty years to win trust; the
      book does not mention the workers'' teams or urging union of the two sides, n.24)'
    units: D, E
