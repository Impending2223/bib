    item: '[[w.mao-zedong-zhuan]], VI, ch. 77 nn.11, 49 (May 8, in a talk with the members of the Cultural Revolution Group''s liaison meeting 中央文革碰头会, Mao: we fixed one rule at Yan''an, no killing,
      most not arrested; go by evidence and corroboration, not confession, since pressed men confess and the pressing grows; the Party''s history has its lessons, the AB Corps in Jiangxi, the
      arrests of Social Democrats in Fujian, the Reorganization Clique and the Third Party in E-Yu-Wan, n.11; the same record, n.49: the materials gathered on Liu Shaoqi are not all to be believed
      (his plotting with the Americans in the winter of 1946 and the sending of Shen Qizhen 沈其震 to Truman and Acheson through Stuart is a fabrication), Zhou doubts the account of Liu''s visit
      to Nanjing before the war, and no killing is best, the survivors can work and can testify; the book says nothing of the marshals, the cadres ''ninety-five percent good'' or the ''Wu Hao
      notice'')'
    units: C, D
