    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.58 (Aug. 1, Mao''s letter to the Red Guards of the Tsinghua middle school, praising their ''spirit of revolutionary rebellion'' in three posters;
      ''to rebel against reactionaries is justified'', warm support; the same for all who take the same revolutionary attitude; unite all who can be united; those who have made grave errors to
