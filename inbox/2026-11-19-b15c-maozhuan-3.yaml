    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.26 (early Feb., by Wu Lengxi''s recollection: the Standing Committee members in Peking, Liu Shaoqi 刘少奇, Zhou Enlai 周恩来 and Deng Xiaoping 邓小平, met
      on the outline and agreed it, with no mention of the Lushan meeting in articles of the discussion, and sent the group to Wuchang to report to Mao, who would decide; day, chair not given)'
