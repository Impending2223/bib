- cite:
    id: cal.1966-08-04.china-leadership
    item: '[[w.mao-zedong-zhuan]], VI, ch. 74 n.59 (Aug. 4 Mao summons an enlarged meeting of the Standing Committee and criticizes the leaders of the first line: the Center went against its own
      order stopping classes for half a year, and when people rose put them down; the mass line, trust in the masses, Marxism-Leninism all false; standing plainly on the bourgeois side against
      the proletariat; Liu Shaoqi says that in Peking the main responsibility is his, Mao: you ran a dictatorship in Peking, a directional error, in fact the bourgeois stand; Ye Jianying''s millions
      of troops, Mao: the ghosts are right here; at the end Mao ends the plenary meeting for the day, the group meetings to hear it relayed, n.59)'
    units: B, C, D, E, F, G, H, I, J, K, L
