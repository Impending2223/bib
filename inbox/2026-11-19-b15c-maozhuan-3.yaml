    item: '[[w.mao-zedong-zhuan]], VI, ch. 76 nn.11, 12 (Feb. 3 Mao''s talk with Hysni Kapo and Beqir Balluku: for many years the struggle in the Party was not open; at the conference of 7,000
      in Jan. 1962 he said revisionism would overthrow us and if we did not take care China would become a fascist dictatorship in several years to several decades; in the five years 1962 to 1966
      only some single questions and single persons were taken up; no form had been found to expose our dark side openly, as a whole, from below; the decisive battle not yet finished, Feb., Mar.
      and Apr. the time of decision, solving all may take to next Feb., Mar., Apr. or longer; only by rousing the masses is there a way; the kinds of men in the Party who show themselves: old
      cadres of the democratic revolution, those who joined after liberation, men taken over from the Kuomintang, sons of the bourgeoisie, landlords and rich peasants; the anarchism now abroad,
