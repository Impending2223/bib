patch: b3-macv-1968-2
by: Claude (b3-macv reading agent, Nov. 3-4, 2026), from MACV's Command Histories
ops:
- add:
    entry:
      id: cal.1968-01-10.vietnam-operations
      when: Jan. 10
      date: '1968-01-10'
      thread: vietnam-operations
      c: York I, the 1st Cavalry's planned assault into western Đỗ Xá, cancelled as major forces are readied for northern
        I Corps. York, recast in December 1967, was to go on into the A Shau valley and western Quảng Trị from mid-February.
      n: '[[w.macv-command-history-1968]], 24.'
      src:
        c: e2a31255
        rows:
        - 'w.macv-command-history-1968 24: all'
    section: '196801'
- add:
    entry:
      id: cal.1968-02-04.vietnam-tet
      when: Feb. 4
      date: '1968-02-04'
      thread: vietnam-tet
      c: 'Westmoreland''s guidance to his commanders: the enemy''s countrywide offensive "has been blunted and stopped," his
        forces turned back with enormous losses; but in many areas he has withheld main force and North Vietnamese units,
        above all in III Corps, and can attack again.'
      n: '[[w.macv-command-history-1968]], 26. To check: COMUSMACV to III MAF et al., 040655Z Feb 68 (cited by [[w.macv-command-history-1968]],
        34 n.18). Names: Westmoreland.'
      src:
        c: 43a9f338
        rows:
        - 'w.macv-command-history-1968 26: all'
      tags:
      - name:westmoreland-william
    section: '196802'
- add:
    entry:
      id: cal.1968-02-24.vietnam-khe-sanh
      when: Feb. 24
      date: '1968-02-24'
      thread: vietnam-khe-sanh
      c: Westmoreland directs his new MACV Forward headquarters to take over MACV's planning for operations in northern I
        Corps, York II into the A Shau valley among them; relieving Khe Sanh (Pegasus) and attacking the bases in the A Shau
        (Delaware) planned.
      n: '[[w.macv-command-history-1968]], 24. Names: Westmoreland.'
      src:
        c: b4b01786
        rows:
        - 'w.macv-command-history-1968 24: all'
      tags:
      - name:westmoreland-william
      - place:a-shau-valley
    section: '196802'
- add:
    entry:
      id: cal.1968-04-01.vietnam-3
      when: Apr. 1
      date: '1968-04-01'
      thread: vietnam
      c: Westmoreland, "Pressure on Enemy," to the Seventh Air Force and his commanders, reviewing the two months since Tet;
        pressure on the enemy needed to achieve a major turn in the war. In late April he calls for a higher tempo and the
        greatest sustained effort.
      n: '[[w.macv-command-history-1968]], 26–27. To check: COMUSMACV to 7AF, 011403Z Apr 68, "Pressure on Enemy" (cited by
        [[w.macv-command-history-1968]], 35 n.19). Names: Westmoreland.'
      src:
        c: b557fad4
        rows:
        - 'w.macv-command-history-1968 26–27: all'
      tags:
      - name:westmoreland-william
    section: '196804'
- add:
    entry:
      id: cal.1968-05-06.vietnam-may-offensive
      when: May 6
      date: '1968-05-06'
      thread: vietnam-may-offensive
      c: The day after the enemy's second general offensive opens on Saigon, Huế, Quảng Trị and Đông Hà, Westmoreland writes
        III MAF's commander on keeping relentless pressure on the enemy.
      n: '[[w.macv-command-history-1968]], 28–29. Names: Westmoreland.'
      src:
        c: 223a2d18
        rows:
        - 'w.macv-command-history-1968 28–29: all'
      tags:
      - name:westmoreland-william
    section: '196805'
- add:
    entry:
      id: cal.1968-07-27.vietnam
      when: July 27
      date: '1968-07-27'
      thread: vietnam
      c: Abrams's operational guidance to his major commanders, intelligence pointing to strong attacks in mid-August; the
        enemy to be anticipated with every intelligence effort and met with maximum combat reaction.
      n: '[[w.macv-command-history-1968]], 30. Names: Abrams.'
      src:
        c: b15fdff3
        rows:
        - 'w.macv-command-history-1968 30: all'
      tags:
      - name:abrams-creighton
    section: '196807'
- add:
    entry:
      id: cal.1968-02-25.vietnam-205000-2
      when: Feb. 25
      date: '1968-02-25'
      thread: vietnam-205000
      c: MACV's requirements, presented to Wheeler on his visit of Feb. 22–25 and refined into a force package, carried by
        courier to Sharp ahead of the conference with Wheeler's party at CINCPAC.
      n: '[[w.macv-command-history-1968]], 225. Names: Wheeler, Sharp.'
      src:
        c: f27c8e8b
        rows:
        - 'w.macv-command-history-1968 225: all'
      tags:
      - name:wheeler-earle
      - name:sharp-u-s-grant
    section: '196802'
- add:
    entry:
      id: cal.1968-03-31.vietnam-205000-2
      when: Mar. 31
      date: '1968-03-31'
      thread: vietnam-205000
      c: 'Westmoreland to the Joint Chiefs and Sharp, after seeing Wheeler at Clark Mar. 24: his troop requirements reviewed.
        For USARV a separate light infantry brigade (the 3d Brigade, 82d Airborne, 4,502), a mechanized brigade (4,769) and
        an armored cavalry squadron (1,030), 10,301 combat spaces, seven battalions; for the Seventh Air Force two F-100 squadrons,
        938.'
      n: '[[w.macv-command-history-1968]], 226–27. See [[cal.1968-03-24.vietnam-205000]]. Names: Westmoreland, Sharp, Wheeler.'
      src:
        c: c2f6cf18
        rows:
        - 'w.macv-command-history-1968 226–27: all'
      tags:
      - name:westmoreland-william
      - name:sharp-u-s-grant
      - name:wheeler-earle
    section: '196803'
- add:
    entry:
      id: cal.1968-04-06.vietnam-force-levels
      when: Apr. 6
      date: '1968-04-06'
      thread: vietnam-force-levels
      c: The Joint Chiefs approve 24,500 more spaces, a new ceiling of 549,500 in South Vietnam, promulgated by McNamara's
        successor as Southeast Asia Deployment Program 6. Apr. 8, the Marine squadron and the two fighter squadrons ordered.
      n: '[[w.macv-command-history-1968]], 227–28 (the deployments: the 3d Brigade, 82d Airborne, in the country, 4,724; the
        3d Brigade, 5th Mechanized Division, July, 4,967; the 1/18 Armored Cavalry Squadron, August, 1,030, later deleted;
        the 174th and 120th Tactical Fighter Squadrons, May, Phù Cát and Phan Rang). Names: Clifford. Check: the History says
        "SECDEF."'
      src:
        c: 11e4c116
        rows:
        - 'w.macv-command-history-1968 227–28: all'
      tags:
      - name:clifford-clark
    section: '196804'
- add:
    entry:
      id: cal.1968-04-06.vietnam-force-levels-2
      when: Apr. 6
      date: '1968-04-06'
      thread: vietnam-force-levels
      c: The Joint Chiefs defer Program 5's civilianization schedule about six months, Tet having emptied the labor force
        (by Mar. 9 only 80 percent of the 33,800 civilians back at work). Dec. 10, they cut the 12,545 civilianized spaces
        from Program 6, to the ceiling of 549,500.
      n: '[[w.macv-command-history-1968]], 230, 233.'
      src:
        c: dabddb55
        rows:
        - 'w.macv-command-history-1968 230, 233: all'
    section: '196804'
- add:
    entry:
      id: cal.1968-03-17.vietnam
      when: Mar. 17
      date: '1968-03-17'
      thread: vietnam
      c: The first class of 25 mobile advisory teams for the Regional and Popular Forces begins training at USARV's school
        at Dĩ An, Phase I of the advisory buildup Westmoreland approved Dec. 15, 1967, in a 30-point package; 353 teams planned
        by Dec. 31, 1968.
      n: '[[w.macv-command-history-1968]], 235–36. Names: Westmoreland.'
      src:
        c: cdabdad6
        rows:
        - 'w.macv-command-history-1968 235–36: all'
      tags:
      - name:westmoreland-william
    section: '196803'
- add:
    entry:
      id: cal.1968-03-30.vietnam-force-levels
      when: Mar. 30
      date: '1968-03-30'
      thread: vietnam-force-levels
      c: The first of four infantry battalions Westmoreland asked accelerated arrives by air; the last three close by Apr.
        15, with 13 infantry company packets.
      n: '[[w.macv-command-history-1968]], 238–39. Names: Westmoreland.'
      src:
        c: 98fa6983
        rows:
        - 'w.macv-command-history-1968 238–39: all'
      tags:
      - name:westmoreland-william
    section: '196803'
- add:
    entry:
      id: cal.1968-03-05.vietnam-force-levels
      when: Mar. 5
      date: '1968-03-05'
      thread: vietnam-force-levels
      c: The Joint Chiefs approve the 101st Airborne Division's phased conversion to an airmobile division within existing
        assets; more helicopter production recommended to McNamara Feb. 27. Redesignated the 101st Airborne Division (Airmobile),
        the 1st Cavalry the 1st Cavalry Division (Airmobile), Aug. 26.
      n: '[[w.macv-command-history-1968]], 240–42, 245. Names: McNamara.'
      src:
        c: 02edfab6
        rows:
        - 'w.macv-command-history-1968 240–42, 245: all'
      tags:
      - name:mcnamara-robert-s
    section: '196803'
- add:
    entry:
      id: cal.1968-02-21.vietnam-operations
      when: Feb. 21
      date: '1968-02-21'
      thread: vietnam-operations
      c: Westmoreland approves reconfiguring the seven infantry battalions of the riverine and land-based brigades of the
        9th Division. The division moves from Bear Cat to Đồng Tâm by the end of July.
      n: '[[w.macv-command-history-1968]], 242–43. Names: Westmoreland.'
      src:
        c: 1afe5bf7
        rows:
        - 'w.macv-command-history-1968 242–43: all'
      tags:
      - name:westmoreland-william
      - province:dinh-tuong
    section: '196802'
- add:
    entry:
      id: cal.1968-02-13.vietnam-205000-3
      when: Feb. 13
      date: '1968-02-13'
      thread: vietnam-205000
      c: The Joint Chiefs direct the 27th Marine Regimental Landing Team flown to Vietnam from California, 5,200 men, to arrive
        at Đà Nẵng by Feb. 26; the 3d Brigade, 82d Airborne, from Fort Bragg, N.C., by the same day, closing in I Corps on
        schedule.
      n: '[[w.macv-command-history-1968]], 245, 247.'
      src:
        c: 9216846c
        rows:
        - 'w.macv-command-history-1968 245, 247: all'
      tags:
      - place:da-nang
    section: '196802'
- add:
    entry:
      id: cal.1968-07-22.vietnam-force-levels
      when: July 22
      date: '1968-07-22'
      thread: vietnam-force-levels
      c: 'The Joint Chiefs ask Sharp whether the 27th Marines can go home by Aug. 15. Abrams: they hold vital defenses at
        Đà Nẵng, where an attack is expected in the next 30 to 45 days; a full regiment must relieve them first.'
      n: '[[w.macv-command-history-1968]], 247. Names: Sharp, Abrams.'
      src:
        c: 2961169e
        rows:
        - 'w.macv-command-history-1968 247: all'
      tags:
      - name:sharp-u-s-grant
      - name:abrams-creighton
      - place:da-nang
    section: '196807'
- add:
    entry:
      id: cal.1968-08-17.vietnam-force-levels
      when: Aug. 17
      date: '1968-08-17'
      thread: vietnam-force-levels
      c: Sharp directs the HAWK missile units in the country relocated so that others can leave; Aug. 19, Abrams orders the
        6th Battalion, 56th Artillery, from Saigon to Chu Lai, all moves by Oct. 31. The 6th Battalion, 71st Artillery, home
        in October.
      n: '[[w.macv-command-history-1968]], 245–46. Names: Sharp, Abrams.'
      src:
        c: c4e1c1d6
        rows:
        - 'w.macv-command-history-1968 245–46: all'
      tags:
      - name:sharp-u-s-grant
      - name:abrams-creighton
      - place:chu-lai
    section: '196808'
- cite:
    id: cal.1968-01-29.vietnam-tet
    item: '[[w.macv-command-history-1968]], 376, 1027 (the truce''s terms not to apply in I Corps or in North Vietnam south
      of Vinh; elsewhere a 36-hour stand-down, 6 p.m. Jan. 29 to 6 a.m. Jan. 31; Westmoreland''s plea that any stand-down
      be as short as possible)'
    units: A, E
- check:
    id: cal.1968-01-29.vietnam-tet
    text: 'Check: MACV''s History, 376, has Saigon release the statement at noon on Jan. 29, Westmoreland concurring.'
- add:
    entry:
      id: cal.1968-01-19.vietnam-operations
      when: Jan. 19
      date: '1968-01-19'
      thread: vietnam-operations
      c: Pershing ends in Bình Định, begun Feb. 11, 1967; 5,401 of the enemy counted killed. The 1st Cavalry Division goes
        north, arriving in Quảng Trị Jan. 21 and beginning Jeb Stuart against Base Area 101.
      n: '[[w.macv-command-history-1968]], 386, 379. See [[cal.1967-02-13.vietnam-operations]].'
      src:
        c: 801937b4
        rows:
        - 'w.macv-command-history-1968 386, 379: all'
      tags:
      - province:binh-dinh
      - province:quang-tri
    section: '196801'
- add:
    entry:
      id: cal.1968-02-05.vietnam-tet-2
      when: Feb. 5
      date: '1968-02-05'
      thread: vietnam-tet
      c: Trần Hưng Đạo begins in the Saigon area under the Joint General Staff's direct control, six Vietnamese Marine, five
        airborne and four Ranger battalions; Feb. 1–5 the turn from the Viet Cong's attacks to the allies' initiative.
      n: '[[w.macv-command-history-1968]], 390.'
      src:
        c: 1b0720ff
        rows:
        - 'w.macv-command-history-1968 390: all'
      tags:
      - place:saigon
    section: '196802'
- add:
    entry:
      id: cal.1968-02-05.vietnam-tet-3
      when: Feb. 5
      date: '1968-02-05'
      thread: vietnam-tet
      c: Cần Thơ cleared, the Viet Cong routed from the university buildings; Vĩnh Long city secured Feb. 8 with South Vietnamese
        and American reinforcements. In IV Corps the offensive had struck 13 of the 16 province capitals in 48 hours from
        about 2:30 a.m. Jan. 31.
      n: '[[w.macv-command-history-1968]], 397.'
      src:
        c: 00780c8e
        rows:
        - 'w.macv-command-history-1968 397: all'
      tags:
      - place:can-tho
      - place:vinh-long
    section: '196802'
- add:
    entry:
      id: cal.1968-02-26.vietnam-operations
      when: Feb. 26
      date: '1968-02-26'
      thread: vietnam-operations
      c: After Huế, the 1st Marine Division's Task Force X-Ray begins Houston on the Thừa Thiên–Quảng Nam border.
      n: '[[w.macv-command-history-1968]], 381.'
      src:
        c: 4ee54588
        rows:
        - 'w.macv-command-history-1968 381: all'
      tags:
      - province:thua-thien
      - province:quang-nam
    section: '196802'
- add:
    entry:
      id: cal.1968-03-10.vietnam-operations
      when: Mar. 10
      date: '1968-03-10'
      thread: vietnam-operations
      c: Yellowstone, the 25th Division in War Zone C from Dec. 8, 1967, ends; its major fight Jan. 1–2, its heaviest in February
        and early March. Some 3,800 of the enemy counted killed.
      n: '[[w.macv-command-history-1968]], 391. Check: the figure, the copy reading "3, BoZ".'
      src:
        c: eb917c2a
        rows:
        - 'w.macv-command-history-1968 391: all'
      tags:
      - place:war-zone-c
      - province:tay-ninh
    section: '196803'
- add:
    entry:
      id: cal.1968-03-17.vietnam-operations
      when: Mar. 17
      date: '1968-03-17'
      thread: vietnam-operations
      c: The 1st Brigade, 9th Division, leaves Trương Công Định, begun Mar. 7, for People's Road, to open Route 4 in Định
        Tường; it ends July 30, 239 of the enemy killed and the road open. Route 4 had been cut at 62 places Feb. 6–8.
      n: '[[w.macv-command-history-1968]], 397, 399–400.'
      src:
        c: 8087941c
        rows:
        - 'w.macv-command-history-1968 397, 399–400: all'
      tags:
      - province:dinh-tuong
    section: '196803'
- add:
    entry:
      id: cal.1968-05-17.vietnam-operations-2
      when: May 17
      date: '1968-05-17'
      thread: vietnam-operations
      c: Carentan II, the 101st Airborne north of Huế, ends with 2,100 of the enemy killed; Nevada Eagle begins in Thừa Thiên,
        two of its brigades with the 3d Brigade, 82d Airborne.
      n: '[[w.macv-command-history-1968]], 380.'
      src:
        c: e587464e
        rows:
        - 'w.macv-command-history-1968 380: all'
      tags:
      - province:thua-thien
    section: '196805'
- add:
    entry:
      id: cal.1968-05-25.vietnam-operations
      when: May 25
      date: '1968-05-25'
      thread: vietnam-operations
      c: The 3d Brigade, 101st Airborne, sent to Kontum by Westmoreland's order to preempt the offensive of the 325C North
        Vietnamese Division and elements of the 2d, found in western Kontum in May.
      n: '[[w.macv-command-history-1968]], 387. Names: Westmoreland. Check: the day, the copy reading "ZS May".'
      src:
        c: ef14a588
        rows:
        - 'w.macv-command-history-1968 387: all'
      tags:
      - name:westmoreland-william
      - province:kon-tum
    section: '196805'
- add:
    entry:
      id: cal.1968-06-01.vietnam-may-offensive
      when: June 1
      date: '1968-06-01'
      thread: vietnam-may-offensive
      c: The 6th and 7th Vietnamese Marine Battalions engage an enemy element trying to leave Saigon; 182 killed, 11 detained.
        June 5–6, near the Phú Thọ race track, the 35th Ranger Battalion blocks another breaking out, 135 killed.
      n: '[[w.macv-command-history-1968]], 393.'
      src:
        c: 0ad20b7e
        rows:
        - 'w.macv-command-history-1968 393: all'
      tags:
      - place:saigon
    section: '196806'
- add:
    entry:
      id: cal.1968-06-10.vietnam-operations
      when: June 10
      date: '1968-06-10'
      thread: vietnam-operations
      c: Muscatine, in Quảng Ngãi with the 11th Light Infantry Brigade, ends; 1,129 of the enemy killed.
      n: '[[w.macv-command-history-1968]], 382. Check: the figure, the copy reading "I, U9".'
      src:
        c: d02ffb0e
        rows:
        - 'w.macv-command-history-1968 382: all'
      tags:
      - province:quang-ngai
    section: '196806'
- add:
    entry:
      id: cal.1968-07-22.vietnam-force-levels-2
      when: July 22–Aug. 5
      date: '1968-07-22'
      thread: vietnam-force-levels
      c: The first increment of the Royal Thai Army Volunteer Force arrives, replacing the Queen's Cobras after eleven months;
        under II Field Force. The second due about Jan. 1, 1969.
      n: '[[w.macv-command-history-1968]], 393.'
      src:
        c: 1b68eb35
        rows:
        - 'w.macv-command-history-1968 393: all'
    section: '196807'
- add:
    entry:
      id: cal.1968-08-04.vietnam-operations
      when: Aug. 4–19
      date: '1968-08-04'
      thread: vietnam-operations
      c: Somerset Plain/Lam Sơn 246, the 1st Brigade, 101st Airborne, and the 3d Regiment, 1st South Vietnamese Division,
        in the A Shau valley; 133 of the enemy killed.
      n: '[[w.macv-command-history-1968]], 382.'
      src:
        c: f759944e
        rows:
        - 'w.macv-command-history-1968 382: all'
      tags:
      - place:a-shau-valley
    section: '196808'
- add:
    entry:
      id: cal.1968-08-23.vietnam-operations
      when: Aug. 23
      date: '1968-08-23'
      thread: vietnam-operations
      c: Two enemy battalions attack the Đức Lập Special Forces camp and for a time hold about half its bunkers; the CIDG
        drives them out, the camp reinforced by the 47th South Vietnamese Regiment and the 503d Airborne.
      n: '[[w.macv-command-history-1968]], 388.'
      src:
        c: '72974630'
        rows:
        - 'w.macv-command-history-1968 388: all'
      tags:
      - province:quang-duc
    section: '196808'
- add:
    entry:
      id: cal.1968-09-01.vietnam-force-levels
      when: Sept. 1
      date: '1968-09-01'
      thread: vietnam-force-levels
      c: The 3d Brigade, 101st Airborne, in III Corps and the 3d Brigade, 82d Airborne, in I Corps begin to exchange places,
        to regroup the 101st's three brigades in I Corps for conversion to airmobile.
      n: '[[w.macv-command-history-1968]], 394. See [[cal.1968-03-05.vietnam-force-levels]].'
      src:
        c: 9293f727
        rows:
        - 'w.macv-command-history-1968 394: all'
    section: '196809'
- add:
    entry:
      id: cal.1968-09-04.vietnam-operations
      when: Sept. 4
      date: '1968-09-04'
      thread: vietnam-operations
      c: Champaign Grove begins 37 kilometers west-southwest of Quảng Ngãi city under Task Force Galloway, troops of the 11th
        Light Infantry Brigade.
      n: '[[w.macv-command-history-1968]], 382.'
      src:
        c: 59f7fc99
        rows:
        - 'w.macv-command-history-1968 382: all'
      tags:
      - province:quang-ngai
    section: '196809'
- add:
    entry:
      id: cal.1968-09.vietnam-operations
      when: Sept.
      date: 1968-09
      thread: vietnam-operations
      c: Lam Sơn 260 on Vinh Lộc island, the 101st Airborne, Regional and Popular Forces, South Vietnamese units and combined
        naval units, cordon and sweep with selective psychological operations; 311 Viet Cong captured.
      n: '[[w.macv-command-history-1968]], 382. Check: the day (the History: mid-September)s.'
      src:
        c: 1cf00632
        rows:
        - 'w.macv-command-history-1968 382: all'
      tags:
      - province:thua-thien
    section: '196809'
- add:
    entry:
      id: cal.1968-10-11.japan-and-korea-korean-troops
      when: Oct. 11
      date: '1968-10-11'
      thread: japan-and-korea-korean-troops
      also:
      - vietnam-operations
      c: Baek Ma 9 begins at 6 a.m., the Korean 9th (White Horse) Division, 25 infantry companies, six artillery battalions;
        Oct. 13, its anniversary, 204 of the enemy killed in Khánh Hòa.
      n: '[[w.macv-command-history-1968]], 387.'
      src:
        c: 0104841b
        rows:
        - 'w.macv-command-history-1968 387: all'
      tags:
      - province:khanh-hoa
    section: '196810'
- add:
    entry:
      id: cal.1968-10-07.vietnam-operations
      when: Oct. 7–8
      date: '1968-10-07'
      thread: vietnam-operations
      c: Toàn Thắng, eight kilometers northeast of Trảng Bàng, Hậu Nghĩa. The 2d Battalion, 12th Infantry, engaged, the 3d
        Battalion, 187th Infantry, reinforcing; 147 of the enemy killed, seven detained.
      n: '[[w.macv-command-history-1968]], 395.'
      src:
        c: e8079077
        rows:
        - 'w.macv-command-history-1968 395: all'
      tags:
      - province:hau-nghia
    section: '196810'
- add:
    entry:
      id: cal.1968-11-11.vietnam-operations
      when: Nov. 11
      date: '1968-11-11'
