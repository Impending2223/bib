      when: July 8
      date: '1968-07-08'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Presidium (Politburo) on Czechoslovakia, by Brezhnev''s note: Shvestka (the Czechoslovak Politburo''s man) given instructions to propose an editing; the letter to be translated and discussed Monday or Tuesday; the signatories listed, Bulgaria''s party, Hungary''s Socialist Workers'' party, the SED, the Polish party, with the CPSU; the district conferences.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 321–22 (№ 78, "Был Президиум" (there was a Presidium), July 8), 343–44 nn.114–16 (the editors: the letter and the district conferences of the Czechoslovak party). Made public: 2016. To check: the protocol of the Politburo for July 8, and which Presidium is meant, the Czechoslovak or the Soviet (the note says only "Президиум"); the letter is that of the five parties. Names: Brezhnev.'
