      - vis:only:ussr+uar
- add:
    entry:
      id: cal.1968-04-22.soviet-union-leadership
      when: Apr. 22–24
      date: '1968-04-22'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Talks with the party-government delegation of the DRV under Phạm Văn Đồng (Apr. 20–26, by the Politburo''s decision of Apr. 4). Brezhnev''s sketches for his statement: the Soviet decision on the main requests given, the rest to be taken up; Hanoi asks five surface-to-air missile regiments; of the DRV''s initiative for contacts, if worked out in detail and made public, the Soviet Union will take it up with a large political and diplomatic effort, and the contacts with the United States should be held in Moscow; daily consultations; might the Vietnamese settle on a basis of contacts between North and South, the Americans isolated; doubts on China, which might at some stage strike a bargain with the United States; Haiphong''s defense, advisers to be sent or Vietnamese specialists to come; the DRV asks that Vietnam not become a cause of dispute.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 316–18 (№ 74, "Наброски... к выступлению во время переговоров" (sketches for his speech during the talks), Apr. 22–24), 343 n.108 (the editors: the delegation in the USSR Apr. 20–26). Made public: 2016. To check: the Soviet and Vietnamese records; the sketches are Brezhnev''s, not what was said. Names: Phạm Văn Đồng, Brezhnev.'
      tags:
      - polity:ussr
      - polity:drv
