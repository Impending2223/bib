- add:
    entry:
      id: cal.1966-06-16.soviet-union-leadership
      when: June 16
      date: '1966-06-16'
      thread: soviet-union-leadership
      c: 'The Politburo. Brezhnev''s notes for it: a state reserve of bread, 30 to 35 million tons; grain purchases abroad in 1966 and 1967; the decision on procurement; the failure in building, a resolution to be discussed. Out of the protocol, the Ukrainian party allowed its own Politburo. Also in his notes for de Gaulle''s visit: the talks in the Supreme Soviet''s hall, de Gaulle to speak from the Mossovet balcony, "Встречать мне или нет" (whether I am to meet him).'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 136–37 (№№ 31–32, Brezhnev''s notes for the Politburo of June 16: "На ПБ" (for the Politburo)), 172 nn.29–34 (the editors: the Politburo of June 16 allowed the Ukrainian party a Politburo, without a protocol entry, and took up the grain reserve and purchases; de Gaulle''s visit June 20–July 1 by the Politburo''s decisions of Apr. 14 and 22; his Mossovet balcony speech of June 21). Made public: 2016. To check: the protocol of June 16. Names: Brezhnev, de Gaulle.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:de-gaulle-charles
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-06-20.soviet-union-leadership
      when: June 20
      date: '1966-06-20'
      thread: soviet-union-leadership
      also:
      - europe-and-the-alliance-france
      c: 'Moscow. De Gaulle''s state visit begins (June 20–July 1). Brezhnev''s list of the questions for the talks: the frontiers in Europe, including the line between the GDR and the Federal Republic, "незыблемости" (inviolable), and what de Gaulle has said of it and when; the Paris and Brussels agreements and the position of the Soviet friends; the French troops in West Germany; the nonproliferation of nuclear arms and the Soviet position; general disarmament; the Moscow–Paris line of direct communication; the Elysée-style reception in the Kremlin, the theater, the guest to speak first by custom. In the talks, by the editors: de Gaulle on the frontiers and German arms, the end of fighting in Vietnam and a return to the Geneva Accords of 1954, a conference on European security with the GDR''s status disputed, no nuclear states beyond the five.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 137–38 (№ 33, "О прямой линии связи" (on the direct line) and the notes for the talks), 172, 177–78 nn.29, 35–40, 93–98 (the editors: the visit; the talks'' content; the agreements of June 30). Made public: 2016. To check: the Soviet record of the talks with de Gaulle; the notes are the list of questions, not the answers. Names: de Gaulle, Brezhnev.'
      tags:
      - polity:ussr
      - polity:fr
      - name:brezhnev-leonid
      - name:de-gaulle-charles
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-08-18.soviet-union-leadership
      when: Aug. 18
      date: '1966-08-18'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Yalta. Brezhnev and Ponomarev with the leaders of the Italian Communist party under Longo, with Pajetta, Alicata and Scoccimarro. Brezhnev''s notes of Longo''s words: the Italians believe the United States cannot win by arms, and the petty bourgeois that it cannot leave beaten; an Italian delegation to Vietnam; talk of aid to Vietnam among the people; whether the Soviet Union can speak of help to Vietnam by it and the socialist countries; a conference on European security of the parties, a collective study of questions, meetings and symposia where the Soviet Union might take the initiative; the 50th anniversary of the October Revolution to be analyzed; the joining of the Communist and Social Democratic parties; the party press losing money, L''Unità''s 290,000 copies, and a request for material help.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 151–53 (№ 35, "Заметки Л.И. на переговорах с итальянск. тт. (Ялта, 18.8.66)" (notes of the talks with the Italian comrades, Yalta, Aug. 18, 1966)), 179 n.110 (the editors: Brezhnev and Ponomarev with Longo, Pajetta, Alicata and Scoccimarro; Longo''s question on a delegation to Vietnam). Made public: 2016. To check: the Italian record. Names: Longo, Pajetta, Brezhnev, Ponomarev.'
      tags:
      - polity:ussr
      - polity:italy
      - name:brezhnev-leonid
      - name:ponomarev-boris-n
      - vis:only:ussr+italy
- add:
    entry:
      id: cal.1966-09-10.soviet-union-leadership
      when: Sept. 10
      date: '1966-09-10'
      thread: soviet-union-leadership
      c: 'Moscow. Ulbricht with Brezhnev (visit Sept. 10–11). Brezhnev''s notes of his words: the GDR going to its congress with questions at home and abroad; socialism to be built to 1975, no talk of communism; the price of raw materials; the gap with the West widening and no means for the growing links with it, only oil and metal in the deliveries and not the computers and automatic lines the GDR needs, the western tilt to be stopped; oil above all, 10 million tons in 1970 and 16 by 1975, natural gas, 30 locomotives and not 15; computers, a few Ural-16 and Minsk-23 in 1967–68, a third generation; Bonn tied to the United States over Vietnam, the idea being that a strong United States in Asia will push the question in Europe; no military threat, a political and economic struggle; the GDR to pass laws on citizenship and the protection of its citizens.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 154–61 (№ 36, Brezhnev''s notes of Ulbricht''s statement, Sept. 10), 176, 179–80 nn.71, 119–28 (the editors: the visit Sept. 10–11 by the Politburo''s decision of Sept. 8; the congress; the oil; his plan to visit Yugoslavia; a conference on European security not now realistic). Made public: 2016. Names: Ulbricht, Brezhnev.'
      tags:
      - polity:ussr
      - polity:gdr
      - name:brezhnev-leonid
      - name:ulbricht-walter
      - vis:only:ussr+gdr
- add:
    entry:
      id: cal.1966-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1966-10-15'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Brezhnev, Kosygin, Suslov, Andropov and others with Gomułka and Cyrankiewicz (Oct. 10–15; talks Oct. 10, 14 and 15). His notes of Gomułka on the 15th: the Vietnam war, "в рамках Вьетнама" (within Vietnam) by Hanoi''s statement, and the Soviet position; one party (the Vietnamese Workers'' party) "диктует условия интернационализма" (dictates the terms of internationalism) in the form of aid, without regard for the others'' opinions; a joint appeal of all who give aid, and consultation on how to get out of the war; what is happening in China, the "cultural revolution," a struggle inside the party, the revolution a screen, hard to analyze.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 161–62 (№ 37, Brezhnev''s notes made during Gomułka''s speech, Oct. 15), 175, 180 nn.62–64, 135–37 (the editors: the Polish delegation Oct. 10–15 by the Politburo''s decision of Oct. 8; the Soviet side named; the Polish memorandum handed at the Warsaw Pact leaders'' meeting). Made public: 2016. To check: the Polish record. Names: Gomułka, Cyrankiewicz, Brezhnev, Kosygin, Suslov, Andropov.'
      tags:
      - polity:ussr
      - polity:poland
      - name:brezhnev-leonid
      - name:gomu-ka-w-adys-aw
      - name:kosygin-aleksei
      - name:suslov-mikhail-a
      - name:andropov-yuriy-vladimirovich
      - name:cyrankiewicz-jozef
      - vis:only:ussr+poland
- add:
    entry:
      id: cal.1966-10-21.soviet-union-leadership
      when: Oct. 21
      date: '1966-10-21'
      thread: soviet-union-leadership
      also:
      - vietnam
      - china
      c: 'Moscow. Brezhnev closes the meeting of the leaders of the parties, governments and defense ministers of Hungary, the GDR, Mongolia, Bulgaria, Poland, Romania, the USSR and Czechoslovakia, with Dorticós of Cuba, after their visit to Baikonur. Reports by Gromyko on the General Assembly and his Oct. 10 talks with Johnson and Rusk, and by Gomułka on the plans for a conference of European parties. Brezhnev''s sketches: China, everything military, the "красной охраны" (red guard) staffs headed by soldiers; Johnson''s proposals tell of two sides, an impression abroad that the matter rests on Vietnam, while Vietnamese resistance, joint aid and America''s isolation and trouble at home go on; aid to Vietnam to continue, military, economic and political; the dispute with China no longer only with the Chinese party; the European parties'' meeting, Austria perhaps not suitable; thanks to Kádár, Novotný, Ulbricht, Zhivkov, Dorticós, Ceauşescu and Tsedenbal for their appraisal of the defense effort.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 162–65 (№ 38, Brezhnev''s sketches for his closing speech, Oct. 21), 178, 180–81 nn.107, 138–42 (the editors: the visit to Baikonur Oct. 19–20; the meeting of Oct. 21 in Moscow and the reports; Vienna named by the Poles and French as the seat of the European parties'' meeting, Karlovy Vary chosen in February 1967). Made public: 2016. To check: the records of the meeting; the sketches are his, not the speech. Names: Brezhnev, Gromyko, Gomułka, Dorticós, Kádár, Novotný, Ulbricht, Zhivkov, Ceauşescu, Tsedenbal, Johnson, Rusk.'
