      id: cal.1965-12-15.soviet-union-leadership
      when: Dec. 15
      date: '1965-12-15'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Boumédiène, the Algerian head of state, on his visit Dec. 13–18. Brezhnev''s notes: "мы чувствуем нажим империалистов" (we feel the imperialists'' pressure); the Algerian events a moral success for imperialism; Boumédiène''s requests; the French Communist party not to attack him; the regime changed without democratic institutions.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 116 (№ 22, Brezhnev''s notes, Dec. 15–16), 130 nn.141–42 (the editors: the visit Dec. 13–18 by the Presidium''s decision of Dec. 11; the army''s removal of Ben Bella in June). Made public: 2016. To check: the requests, not set down in the notes. Names: Boumédiène, Brezhnev.'
