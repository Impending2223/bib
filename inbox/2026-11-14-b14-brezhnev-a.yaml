      id: cal.1968-04-19.soviet-union-leadership
      when: Apr. 19
      date: '1968-04-19'
      thread: soviet-union-leadership
      also:
      - middle-east
      c: 'Brezhnev with Riad, the UAR Foreign Minister, on the Middle East. His notes: "Мы все сделали — чтобы урегулировать конфликт" (we have done all to settle the conflict), "Все ли?" (all?); whether to go back to the Security Council with a new resolution, which might be worse and weaker than Resolution 242 of Nov. 22, 1967; the Council must take responsibility for carrying it out; Arab unity, a sickness to overcome by patient work; the contacts with Jarring useful; strengthen the Arab Socialist Union, resting on the working class and the loyal intelligentsia.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 315–16 (№ 73, "Рабочие записи... во время беседы с М. Риалом 19 апреля" (notes during the talk with M. Riad, Apr. 19)), 343 nn.105–107 (the editors: Resolution 242; Riad''s talks with Jarring in 1967–68, Jarring special envoy of the Secretary-General). Made public: 2016. To check: the Egyptian record. Names: Riad, Brezhnev.'
      tags:
      - polity:ussr
