- add:
    entry:
      id: cal.1965-12-02.soviet-union-leadership
      when: Dec. 2
      date: '1965-12-02'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'The Presidium. Brezhnev''s list for it and the session of Dec. 4: a Plenum to be called (Dec. 6, Baibakov''s report on the plan and the budget); Kádár to be received in Moscow (Dec. 11–13); Novotný''s invitation to a short rest in Czechoslovakia, declined by letter on Dec. 9; measures on Vietnam, the trip there; the Timiryazev Academy''s order to be handed on Dec. 3, Mikoyan to hand it; the group drafting the congress report. Dec. 5, by the editors: a message of support for the Vietnamese people for Hồ Chí Minh, through the ambassador in Hanoi, with a delegation to follow.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 105 (№ 18, Brezhnev''s notes "относящиеся к повестке заседаний Президиума ЦК КПСС 2 и 4 декабря" (for the agenda of the Presidium''s sessions of Dec. 2 and 4)), 117 (№ 24, the notes of Dec. 7 on Vietnam: a first letter to the Vietnamese, a public campaign for volunteers, the sale of submarines, consultations with the friends on help, a trip to Vietnam, a letter to Mao), 124, 128–29, 131 nn.88, 113–16, 146–48 (the editors: the Presidium of Dec. 2 called the Plenum, fixed Kádár''s visit and the Timiryazev award; Dec. 5 the instruction to Hanoi approved; Dec. 23 a Polish proposal for a conference on Vietnam). Made public: 2016. To check: the protocols of Dec. 2, 4 and 5. Names: Brezhnev, Kádár, Novotný, Mikoyan, Hồ Chí Minh.'
