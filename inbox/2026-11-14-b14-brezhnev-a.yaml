- add:
    entry:
      id: cal.1966-11-14.soviet-union-leadership
      when: Nov. 14
      date: '1966-11-14'
      thread: soviet-union-leadership
      c: Sofia. The 9th Congress of the Bulgarian Communist party opens, with Zhivkov in the chair; Brezhnev heads the CPSU delegation (Kulakov, Lyashko, Rusakov, Organov), greeted warmly, and the Politburo of the CPSU elected to the honorary presidium. The report's first part on the international situation and the movement, in it China and the terms of a new international meeting. Brezhnev's notes of the weak speeches, Romania, Mongolia, Finland, Italy, the GDR, Yugoslavia, and the strong, the African delegates, Spain, France. He spoke with Suslov of the funeral of Ignatov, dead that day.
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 165–66 (№ 39, Brezhnev''s notes in Sofia, Nov. 14–19), 181 nn.143–45 (the editors: the congress, printed in the note as Dec. 14–19, and Ignatov''s death Nov. 14, buried in the Kremlin wall). Made public: 2016. Check: the dates of the congress, Nov. 14–19 by the book''s own heading, Dec. 14–19 by the editors'' note 143. Names: Zhivkov, Brezhnev, Suslov, Ignatov.'
      tags:
      - polity:ussr
      - polity:bulgaria
      - name:brezhnev-leonid
      - name:zhivkov-todor
      - name:suslov-mikhail-a
- add:
    entry:
      id: cal.1966-12-07.soviet-union-leadership
      when: Dec. 7–8
      date: '1966-12-07'
      thread: soviet-union-leadership
      also:
      - china
      c: 'Moscow. Brezhnev with Kim Il Sung, who is in the USSR in the first half of December with a party-government delegation of the DPRK. Brezhnev''s notes of the Korean side: the aim, frank talks; their party conference of Oct. 5–12 held in difficult conditions of the "cultural revolution," against left and right opportunism, electric power dependent on water; Kim reported to the Politburo after meeting Brezhnev (at Vladivostok, May 20–21). His own notes of what to answer: the shipments across China to stop; do not touch the Chinese in their "cultural" revolution, let them fight among themselves, the Soviet party to carry the banner of Marxism-Leninism, for interference might consolidate them; the call for a communist conference to be thought out better, or the Chinese will lay the split on the CPSU; more visits of other parties to Korea.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 167–69 (№№ 40–41, Brezhnev''s notes, Dec. 7–8; № 41 "вероятно... переговоров с партийно-правительственной делегацией КНДР во главе с Ким Ир Сеном" (probably the talks with the party-government delegation of the DPRK under Kim Il Sung)), 181 nn.146–50 (the editors: the visit by the Politburo''s decision of Dec. 4; Kim and Brezhnev at Vladivostok May 20–21; the Korean conference of Oct. 5–12; Korean pilots sent to Vietnam). Made public: 2016. To check: the Korean record. Names: Kim Il Sung, Brezhnev.'
      tags:
      - polity:ussr
      - polity:dprk
      - name:brezhnev-leonid
      - name:kim-il-sung
      - vis:only:ussr+dprk
- add:
    entry:
      id: cal.1967-03-13.soviet-union-leadership
      when: Mar. 13
      date: '1967-03-13'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Zhivkov and the Bulgarian party-government delegation (Mar. 13–15), the first talk. Brezhnev''s notes of Zhivkov''s words: the time come for a new stage in drawing the economies together, cooperation in production, direct links between enterprises, perhaps one planning organ, even as an experiment, and one price level; Bulgaria spends 30 percent of its capital investment on energy, to go to 33, has poor coal and sees no way but gas and oil from the Soviet Union; it imports 80 million dollars'' worth of metal and chemical raw material and is "в долгах" (in debt), and a cut in the pace would bring unemployment; the Kremikovtsi works, ore, coke and metal; timber talks with Mongolia and Guinea; political and ideological cooperation good; the military closeness, and what if something happens to Romania or Yugoslavia. Brezhnev''s own list before: reference papers for talks with the delegations coming for the 50th anniversary, Japan, Cuba, the UAR, Korea, Italy, France, Romania, Yugoslavia.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 195–97 (№№ 49–50, Brezhnev''s notes: № 50 "Краткая запись выступления Т. Живкова на первой беседе" (a short record of Zhivkov''s speech at the first talk)), 274 n.86 (the editors: Zhivkov on timber from Mongolia and Guinea). Made public: 2016. To check: the Bulgarian record; the Soviet side''s answers, not set down. Names: Zhivkov, Brezhnev.'
      tags:
      - polity:ussr
      - polity:bulgaria
      - name:brezhnev-leonid
      - name:zhivkov-todor
      - vis:only:ussr
- add:
    entry:
      id: cal.1967-03-17.soviet-union-leadership
      when: Mar. 17
      date: '1967-03-17'
      thread: soviet-union-leadership
      c: 'Brezhnev with Ceauşescu and Maurer of Romania, on the draft treaty on the nonproliferation of nuclear weapons, Ceauşescu having come to Moscow for this talk. Brezhnev''s notes: unity is needed on disarmament; there will be states with and without nuclear arms; the Soviet Union keeps its weapon as the guarantor of the security of the socialist states; the treaty limits the non-nuclear states in the peaceful use of atomic energy; public opinion to be mobilized to press the United States; the treaty to be worked out with all interested states. Maurer: what follows from this is the political echo, since the socialist states bring it, and "зачем нам обеднять наши позиции" (why impoverish our own positions) just because the Americans disagree.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 198–99 (№ 52, "Беседа с т. Чаушеску" (talk with Comrade Ceauşescu), Mar. 17), 275 nn.95–97 (the editors: Ceauşescu came expressly to discuss Romania''s position on the nonproliferation treaty; the Romanian side tied the treaty to a disarmament agreement; the treaty approved by the General Assembly June 12, 1968). Made public: 2016. To check: the Romanian record. Names: Ceauşescu, Maurer, Brezhnev.'
      tags:
      - polity:ussr
      - polity:romania
      - name:brezhnev-leonid
      - name:ceausescu-nicolae
      - vis:only:ussr+romania
- add:
    entry:
      id: cal.1967-05-22.soviet-union-leadership
      when: May 22–23
      date: '1967-05-22'
      thread: soviet-union-leadership
      also:
      - berlin-and-vienna
      c: 'Moscow. Brezhnev receives a delegation of the Communist party of Germany (KPD, banned in the Federal Republic) under Max Reimann. Brezhnev''s notes of what is said: the Soviet "твердая позиция" (firm position) dispelled illusions in West Germany; the SED congress and the Karlovy Vary conference landmarks, and the GDR''s treaties with Poland, Czechoslovakia and Hungary; the Federal government''s policy unchanged in substance, the Social Democrats brought in as support; unions and workers beginning to see they can fight the emergency laws and for democratization, the intelligentsia against the laws; a firm line against the Kiesinger government; neo-Nazi influence to be watched even at the top of the Social Democratic leadership, and a difference between Brandt and Wehner; a Soviet invitation to the metalworkers'' union leaders.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 214–17 (№ 56, "Рабочие записи... во время встречи с делегацией ЦК Компартии Германии во главе с М. Рейманом" (notes during the meeting with the delegation of the German Communist party under M. Reimann), May 22–23), 282 nn.180–186 (the editors: the SED congress, the Karlovy Vary conference of Apr. 24–26, the emergency laws, Romania the exception to the firm position). Made public: 2016. To check: the German record. Names: Reimann, Brezhnev, Kiesinger, Brandt, Wehner.'
      tags:
      - polity:ussr
      - polity:frg
