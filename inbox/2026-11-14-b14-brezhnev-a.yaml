- add:
    entry:
      id: cal.1968-04-09.soviet-union-leadership
      when: Apr. 9–10
      date: '1968-04-09'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Plenum of the Central Committee. Brezhnev''s report, "Об актуальных проблемах международного положения и о борьбе КПСС за сплоченность мирового коммунистического движения" (on current problems of the international situation and the CPSU''s struggle for the unity of the world communist movement). Brezhnev''s notes of the discussion: Grishin; Shelest, to make public that Maurer laid a wreath on Mannerheim''s grave; Kunaev, the Chinese building a television center near the border and a call for propaganda work and merging the ideological institutes; Tolstikov, admission to the colleges and expelling people from the country; Masherov, Rashidov, Kulichenko, Shcheremetov, Nuriev, Katushev, Fedoseev, Miroshnichenko, Markov, Kebin, praised or scored by his marks. The Politburo had taken up on Apr. 1 Johnson''s statement on Vietnam, the events in Czechoslovakia and the Vietnamese delegation''s coming.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 302–03 (№ 72, Brezhnev''s notes at the Plenum, Apr. 9–10), 339 nn.44–46 (the editors: the Politburo of Apr. 1; the report; the Plenum of Apr. 9–10). Made public: 2016. To check: the Plenum''s stenogram; the notes are Brezhnev''s marks of the speakers, not their words. Names: Brezhnev, Grishin, Shelest, Kunaev, Maurer.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:shelest-petr-e
- add:
    entry:
      id: cal.1968-09-05.soviet-union-leadership
      when: Sept. 5
      date: '1968-09-05'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'The Politburo, Brezhnev''s notes dated only September, after the Czechoslovak leaders'' return from Moscow (Aug. 23–26): "все говорят о единстве" (they all speak of unity), a harmful slogan, unity with whom; the petty bourgeoisie the force the counterrevolution used; Czechoslovak propaganda played up Smrkovský''s speech, not Svoboda''s, Černík''s and Husák''s; the Western press says Dubček set fire to nationalism and gave ground to the anti-socialist forces; the fraternal parties, to hear each country''s ambassador in the Politburo and keep a line for each; powerful transmitters at Brest to cover Europe; ambassadors to sit on the military councils; Yugoslavia the center of revisionist theory, to be broken; socialist ambassadors to be received more often; Romania, relations sharpened, some contact needed, no open criticism. The Politburo of Sept. 5 took up Baibakov''s paper on wider economic ties with Bulgaria.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 322–24 (№ 79, Brezhnev''s notes, September 1968), 344 nn.117–24 (the editors: the Politburo of Sept. 5 on Bulgaria; the letter to Romania of Aug. 24 and the suspended tourist exchange; the decisions of Čierna nad Tisou, July 29–Aug. 1, and the Moscow talks, Aug. 23–26). Made public: 2016. Check: the day, which the editors give only for the Bulgarian item; the rest of the notes may belong to a later session. To check: the protocol of Sept. 5. Names: Smrkovský, Svoboda, Černík, Husák, Dubček, Baibakov, Brezhnev.'
