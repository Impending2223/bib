patch: 2026-11-14-b14-brezhnev-a
by: 'Claude (batch 14, reader 1: Brezhnev''s workbooks, vol. I, Oct. 1964–Dec. 1969), Nov. 14, 2026'
ops:
- cite:
    id: cal.1964-10-14.soviet-union
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 38–41 (№ 1, Brezhnev''s notes for his speech at the Presidium, Oct. 13–14: the Plenums not held; the memorandum for the Plenum, its slight of the party organs; Voronov''s contempt for the Secretariat''s members; a cult of Khrushchev in the place of the one before; no right to an opinion; Ryazan and the corn; the want of an industrial line, ministries and no metallurgy; his four years and four months in the Presidium and one ten-minute call; the press, radio and television to be set right; the notes, not the words as spoken)'
    units: '?'
- add:
    entry:
      id: cal.1964-10-15.soviet-union-leadership
      when: Oct. 15
      date: '1964-10-15'
      thread: soviet-union-leadership
      c: 'Moscow. Meeting of the secretaries of the republics'' central committees, the krai committees and the obkoms, called on Brezhnev''s initiative the day after the Plenum, to carry its decision to the party aktiv. His notes: thanks for "мужество" (courage) and the Presidium''s support; the Presidium and Plenum criticized Khrushchev''s style and method and the cult of his person, and took up his request to be relieved for age and health; the line of the 20th–22nd Congresses, the Program, peaceful coexistence and the unity of the movement unchanged; not to reduce the matter narrowly to the cult; then the obkoms, supply, the grain plans, potatoes. Aktiv meetings followed Oct. 15–17 in every republic, krai and oblast, Moscow and Leningrad.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 42–43 (№ 2, Brezhnev''s notes "К совещанию" (for the meeting)), 65 n.21 (the editors: the meeting, called on his initiative; the aktiv meetings Oct. 15–17). Made public: 2016. To check: the stenogram or the minutes of the meeting, not printed in the volume. Names: Brezhnev, Khrushchev.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:khrushchev-nikita-s
      - vis:only:ussr
- cite:
    id: cal.1964-10-22.soviet-union-leadership
    item: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 47–48 (№ 3, Brezhnev''s list for the day, in the book dated not earlier than Oct. 17 and the 22nd by the items: the reception of Tsedenbal and what the press is to say of it; the trip to Belovezhskaya Pushcha; "О тов. Хрущеве", of Khrushchev, his housing and keep; a foreign-policy commission of Suslov, Andropov, Ponomarev, Gromyko, Semichastny and Ilichev; the ambassadors of the socialist states to be received; the Presidium to meet that day on the finished questions, not on personnel; the methods of the release; the editors, I, 68 nn.51–55: Protocol of Oct. 22, the meeting with the Poles in Belovezhskaya Pushcha, Khrushchev''s keep fixed, the Foreign Policy Commission formed, the Presidium that day)'
    units: '?'
- add:
    entry:
      id: cal.1964-10-24.soviet-union-leadership
      when: Oct. 24
      date: '1964-10-24'
      thread: soviet-union-leadership
      c: 'Belovezhskaya Pushcha, noon Moscow time. Brezhnev, Kosygin and Andropov meet Gomułka, Cyrankiewicz and Kliszko, on the relations of the CPSU and the Polish party and the cooperation of the two states. Brezhnev''s list beforehand: "Не будет ли отклонения влево" (will there be a swing to the left), "Не будет ли уступок китайцев" (will there be concessions to the Chinese), "Не отмечены заслуги т. Хрущева" (Khrushchev''s services not marked).'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 54–55 (№ 5, the week''s days, "Суб. — 24 — Б-Пуща", the Poles'' places and the list of doubts; no record of the talk itself); I, 47–48 (№ 3, the plan to take Andropov by train), 68 n.51 (the editors: the Presidium of Oct. 22 decides the meeting, Brezhnev, Kosygin and Andropov for the Soviet side, Gomułka, Cyrankiewicz and Kliszko for the Polish; held Oct. 24). Made public: 2016. To check: the Soviet and Polish records of the meeting; whether the doubts are the Poles'' questions or Brezhnev''s own (the notes do not say). Names: Brezhnev, Kosygin, Andropov, Gomułka, Cyrankiewicz, Kliszko, Khrushchev.'
