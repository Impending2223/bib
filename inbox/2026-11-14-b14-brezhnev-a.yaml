- add:
    entry:
      id: cal.1964-11-11.soviet-union-leadership
      when: Nov. 11
      date: '1964-11-11'
      thread: soviet-union-leadership
      also:
      - cuba
      c: 'Guevara, at the head of the Cuban delegation (Nov. 5–18), with Brezhnev, a hard talk. The pressure from Khrushchev''s side is conceded as "в прошлому" (the past) and Cuba puts its questions in the new conditions: can the Soviet Union state publicly that an attack on Cuba is an attack on the whole socialist camp; the government statement on Vietnam is weak; Fidel''s last letter asks support from the camp or at least the Soviet Union, military and economic help. Fidel''s own question: will the Soviet Union go to war with America. Brezhnev''s note of the answer: roughly this, the point is that the Americans understand it.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 58–59 (№ 7, Brezhnev''s notes, "Тяжелый разговор" (a hard talk)), 72 nn.103–106 (the editors: the delegation in the USSR Nov. 5–18, the talk with Guevara Nov. 11; Khrushchev''s last letter to Castro of Apr. 28, 1964, Castro''s of July 4; the TASS statement on Vietnam of Sept. 22). Made public: 2016. To check: the Soviet and Cuban records of the talk; the notes after "Рауль" are struck out and not printed in full. Names: Guevara, Brezhnev, Khrushchev, Castro.'
      tags:
      - polity:ussr
      - polity:cuba
      - name:brezhnev-leonid
      - name:guevara-ernesto
      - name:khrushchev-nikita-s
      - name:castro-fidel
      - vis:only:ussr+cuba
- add:
    entry:
      id: cal.1964-11-26.soviet-union-leadership
      when: Nov. 26
      date: '1964-11-26'
      thread: soviet-union-leadership
      c: 'The Presidium. Brezhnev''s list for the session: the Rostov and Kuban obkoms, Kazakhstan, Malinovsky''s report on the Army, the award of the Order of Lenin to Uzbekistan and to one oblast; articles in the foreign press "подрывающих основы коммунизма" (undermining the foundations of communism) and silence at home; Albania in the Political Consultative Committee and the Commander-in-Chief''s report; the Poles on a conference on European security (Gromyko); Kovalev for Zakharov in Finland; Gromyko''s trip to the General Assembly and the hot line. Decided that day, by the editors: delegations of the Supreme Soviet to Turkey under Podgorny and to the UAR under Shelepin.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 51–52 (№ 3, "Заметки к заседанию Президиума ЦК КПСС 26 ноября 1964 г." (notes for the session of Nov. 26)), 70–71 nn.81–92 (the editors: the Presidium of Nov. 26 on the two delegations; Yusupov''s request to be relieved, Dec. 7, Kunaev elected; Skryabin and Solomentsev, Vorobyev; the Consultative Committee, Jan. 18–23, 1965; the Polish proposal and the reply of Nov. 19; Kovalev for Zakharov, Dec. 11; Gromyko and the Moscow–Washington line). Made public: 2016. To check: the protocol of Nov. 26; the notes are Brezhnev''s list, not the decisions. Names: Brezhnev, Malinovsky, Gromyko, Podgorny, Shelepin.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:malinovsky-rodion-y
      - name:gromyko-andrei
      - name:podgorny-nikolai-v
      - name:shelepin-aleksandr-n
      - vis:only:ussr
- add:
    entry:
      id: cal.1964-12-15.soviet-union-leadership
      when: Dec. 15
      date: '1964-12-15'
      thread: soviet-union-leadership
      c: 'The Presidium on Khrushchev''s keep, replacing the decision of Oct. 22. Brezhnev''s note of his asks: the household staff kept at pay, a canteen subsidy of 100 rather than 70, no removal from the house until a flat is given. The Presidium''s answer: a Central Committee pension of 500 rubles (5,000 of the old money), the Kremlin canteen, the Fourth Chief Directorate''s clinic for him and his wife only, a dacha on the Istra River for the one at Semenovskoe, a flat in town being found, a Volga car.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 62 (№ 9, "Хрущев Н.С. Просит" (Khrushchev asks) and "Хрущеву"), 73–74 nn.124–128 (the editors: the Presidium''s decision of Dec. 15 amends that of Oct. 22; the pension 500 rubles, in old and new money; the dacha on the Istra; the Fourth Chief Directorate for him and his wife). Made public: 2016. Names: Khrushchev, Brezhnev.'
      tags:
      - polity:ussr
      - name:khrushchev-nikita-s
      - name:brezhnev-leonid
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-04-06.soviet-union-leadership
      when: Apr. 6
      date: '1965-04-06'
      thread: soviet-union-leadership
      c: 'Warsaw. Brezhnev, at the head of the Soviet delegation (Apr. 5–9), with Gomułka and the Polish leaders. His notes of the Polish side''s account: the elections to the local councils and the Sejm, the country cut into 80 districts; housing, the state to stop building after 1970 and turn to cooperative building, rent low (a zloty and two groszy a square meter), the state paying some 4 billion 600 million zlotys toward the upkeep of houses in 1964, the cooperative member to put down 15 to 22 percent of the flat''s cost, "массовый переход" (a mass shift) taken as the general line; capital investment planned two years ahead, the director''s bonus fund to be turned to the chief tasks; weak design bureaus, orders paid for by the plant.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 80–81 (№ 14, "Записки Л.И. Брежнева — с беседы с польскими друзьями (т. Гомулкой и др.) в Варшаве. 6 апреля 1965 года" (the cover note)), 119 n.24 (the editors: the delegation in Poland Apr. 5–9, by the Presidium''s decision of Mar. 19). Made public: 2016. Names: Brezhnev, Gomułka.'
      tags:
      - polity:ussr
      - polity:poland
      - name:brezhnev-leonid
      - name:gomu-ka-w-adys-aw
      - vis:only:ussr+poland
- add:
    entry:
      id: cal.1965-05-14.soviet-union-leadership
      when: May 14
      date: '1965-05-14'
      thread: soviet-union-leadership
      c: 'Brezhnev receives Shastri, the Indian Prime Minister, in Moscow (Shastri''s visit May 12–19). His notes of Shastri''s words: thanks for the reception, he will speak frankly and "не как дипломат" (not as a diplomat); India''s policy friendship with all peoples, peace and peaceful coexistence, nonalignment as Nehru proclaimed it, and cooperation with the Soviet Union in foreign policy; the Chinese aggression, Indonesia''s bad position, Pakistan''s attack ("Знаете ли Вы их цели" (do you know their aims)); he has come at a hard moment for support, or he will have trouble carrying out his policy. The notes were sent on with a request to keep them in his personal archive.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 83–84 (№ 16, Brezhnev''s notes; the cover note: "принимал премьер-министра Индии Л.Б. Шастри" (received the Prime Minister of India)), 120 nn.36–41 (the editors: the visit May 12–19 by the Presidium''s decision of May 4; the Sino-Indian border war of 1962; the Beijing–Jakarta axis; the first stage of the Indo-Pakistani conflict). Made public: 2016. Names: Shastri, Brezhnev, Nehru.'
      tags:
      - polity:ussr
      - polity:india
      - name:brezhnev-leonid
      - name:shastri-lal-bahadur
      - name:nehru-jawaharlal
      - vis:only:ussr+india
- add:
    entry:
      id: cal.1965-05-24.soviet-union-leadership
      when: May 24–25
      date: '1965-05-24'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. Talks of Brezhnev with Kádár and the Hungarian delegation, on Kádár''s letter of Apr. 29 (economic and foreign relations, the Warsaw Pact and Comecon). Brezhnev''s outline for his own part: at home, the obkoms united and the raikoms restored, the March Plenum on the village held, a Plenum on industry to come, perhaps one more, the Fifth Five-Year Plan in hand, the next Plenum to call the 23rd Congress, "видимо Февраль 1966" (probably February 1966), the mood in party and people good. Abroad: peaceful coexistence, the struggle for peace, help to peoples fighting for independence, the unity of the camp and the movement; Romania in "особое положение" (a special position); a long disagreement with China to be lived with; Vietnam, "наша помощь значительна" (our help is considerable), Hanoi counting on a military victory, information almost none, "поехать бы к ним" (we should go to them) and the volunteers; de Gaulle might help to shake NATO; the Warsaw Pact "важный инструмент международной политики" (an important instrument of international policy), its command to be put in order; whether to call an international conference of the parties; Tito''s visit June 18.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 84–88 (№ 17, Brezhnev''s notes, dated May 24–25), 121–22 nn.42–57 (the editors: Kádár''s letter of Apr. 29; the talks in Moscow May 24–25; the Plenums of Mar. 24–26, Sept. 27–29 and Dec. 6; the 23rd Congress; the Presidium''s decision of May 11 on Turkey; Kádár''s questions on the Warsaw Pact command). Made public: 2016. To check: whether the outline is for the talks with Kádár or with the Hungarian delegation as a whole (the notes do not name him; the editors'' note 42 ties the item to his letter). Names: Kádár, Brezhnev, Tito, de Gaulle.'
      tags:
      - polity:ussr
      - polity:hungary
      - name:brezhnev-leonid
      - name:tito-josip-broz
      - name:kadar-janos
      - name:de-gaulle-charles
      - vis:only:ussr+hungary
- add:
    entry:
      id: cal.1965-07-08.soviet-union-leadership
      when: July 8
      date: '1965-07-08'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'The Presidium. On Brezhnev''s report, further aid to the DRV and the supply of special property and repair plants there, after the talks with Le Thanh Nghi in early July (the agreement of July 10); the Soviet delegation to the Romanian party''s 4th Congress approved, Brezhnev, Andropov, Komyakhov, Egorychev and Zhigalin, and Ceauşescu told that day; changes in the Council of Ministers'' resolutions of Apr. 1 on farm purchase, a 50 percent bonus on the prices of wheat and rye. Brezhnev''s note of July 4: the Presidium, the Foreign Ministry and the Defense Ministry to exchange views on the steps on Vietnam, political and military.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 93 (№ 18, the notes of July 4 and the list for the Presidium, "На Президиум ЦК 15 июля" (for the Presidium of July 15) and the congress documents), 122–23, 127 nn.58, 75, 79, 95 (the editors: the Presidium of July 8 on aid to the DRV, the Romanian congress delegation, the farm prices; Ceauşescu''s invitation of May 22; the talks with Le Thanh Nghi). Made public: 2016. To check: the protocol of July 8. Names: Brezhnev, Andropov, Ceauşescu.'
      tags:
      - polity:ussr
      - polity:drv
      - name:brezhnev-leonid
      - name:andropov-yuriy-vladimirovich
      - name:ceausescu-nicolae
      - vis:only:ussr
- add:
    entry:
      id: cal.1965-09-07.soviet-union-leadership
      when: Sept. 7
      date: '1965-09-07'
      thread: soviet-union-leadership
      c: 'Moscow. Brezhnev with Novotný, who heads the Czechoslovak party-government delegation (Sept. 6–15). Brezhnev''s notes of Novotný''s words: industry up 8.7 percent in seven months, the grain, beet, hops and potato crops short by 900,000 tons of grain, bread to be bought abroad; the plan for capital building not met; ahead of the Czechoslovak congress, housing and goods; on the two economies, cooperation, a spindleless spinning machine, 1,400 machine tools delivered of 14,000, artificial leather; credits for ore enrichment, copper, lead, fertilizer; the arms, to keep the L-29 trainer and the armored carrier, 17 air regiments for the 20; trade among the socialist states falling, trade with the Federal Republic profitable, a meeting of the first secretaries on the policy toward Bonn; Ulbricht "всех поучает, всех критикует" (teaches and criticizes everyone); the Chinese "стремятся спровоцировать" (seek to provoke) a clash of the USSR and the United States; the Vietnamese "упускают политическую сторону" (miss the political side).'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 107–10 (№ 19, Brezhnev''s notes; the editors call the record after the opening inexact), 129–30 nn.122–131 (the editors: the visit Sept. 6–15; Novotný''s figures and proposals; the Czechoslovak congress of May 30–June 6, 1966; the Algiers youth festival not held). Made public: 2016. Names: Novotný, Brezhnev, Ulbricht.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:novotny-antonin
      - name:ulbricht-walter
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1965-09-27.soviet-union-leadership
      when: Sept. 27
      date: '1965-09-27'
      thread: soviet-union-leadership
      c: 'The Plenum of the Central Committee, first day: Kosygin''s report on improving the management of industry, planning and economic incentives. Brezhnev''s notes: a gradual transition to the new structure; Gosplan to be an organ of the Government and the Central Committee with some legislative powers, its chairman a member of the Presidium; a committee for the military-industrial questions under the Council of Ministers; a coordinating committee; length of service and bonuses; the cross-branch enterprises to be given to ministries; a question on the editor of Pravda.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 114–16 (№ 21, Brezhnev''s notes, "вероятно, сделанные во время доклада А.Н. Косыгина" (probably made during Kosygin''s report)), 130 nn.135–140 (the editors: Kosygin''s proposals on Gosplan, the military-industrial commission of 1957, the bonuses). Made public: 2016. To check: the Plenum''s stenogram and the report as printed in Pravda, Sept. 28. Names: Kosygin, Brezhnev.'
      tags:
      - polity:ussr
      - name:kosygin-aleksei
      - name:brezhnev-leonid
- add:
    entry:
      id: cal.1965-10-12.soviet-union-leadership
      when: Oct. 12
      date: '1965-10-12'
      thread: soviet-union-leadership
      c: 'The Presidium, without a record in the protocol, on Novotný''s letter of Oct. 2: 800,000 tons of grain for the first half of 1966 and an invitation to Brezhnev to visit Czechoslovakia. Andropov, Baibakov and Patolichev to consider the grain favorably and draft a reply; Brezhnev''s visit to go ahead in mid-October. Also that day: the materials for the report to the 23rd Congress to be prepared within a month under the members of the Presidium and the secretaries, every question of principle to come to the Presidium. Brezhnev spoke with Novotný and told Chervonenko in Prague.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 91 (№ 18, "12 октября 1965 г. говорил с тов. Новотным" (Oct. 12, spoke with Comrade Novotný) and the Prague ambassador told), 122–23 nn.61, 70–71 (the editors: the Presidium of Oct. 12, no protocol entry; the grain of Oct. 14; the talk with Novotný not in the reception-room secretaries'' log). Made public: 2016. To check: the protocol of Oct. 14 on the grain. Names: Novotný, Brezhnev, Andropov, Baibakov, Patolichev, Chervonenko.'
      tags:
      - polity:ussr
      - polity:czechoslovakia
      - name:brezhnev-leonid
      - name:novotny-antonin
      - name:andropov-yuriy-vladimirovich
      - name:baibakov-nikolai-k
      - name:chervonenko-stepan-v
      - vis:only:ussr+czechoslovakia
- add:
    entry:
      id: cal.1965-10-13.soviet-union-leadership
      when: Oct. 13
      date: '1965-10-13'
      thread: soviet-union-leadership
      also:
      - vietnam
      c: 'Moscow. First talk of the Soviet leaders with Phạm Văn Đồng''s party-government delegation of the DRV (Oct. 12–18; talks Oct. 13–15 and 18). Present for the Soviet side Brezhnev, Mazurov, Andropov, Kuznetsov, Zakharov, Skachkov and the ambassador Shcherbakov. Brezhnev opens with the Chinese position, the delegation having stopped in China. The DRV''s requests: air defense strengthened, lost arms made good, instructors, arms for the South; economic goods, 5,000 tons of aluminum, 1,000 machine tools, 2,000 trucks, 1,000 small power plants, and a long-term credit of 150 million rubles; delivery by sea, Haiphong''s port built up. Phạm Văn Đồng: the Americans mean to stay in the South; they do not avoid contacts, a French contact and U Thant''s letter, Nkrumah''s envoy not received, Nasser''s five conditions, unification gradual; the Chinese for talks in principle but the conditions not ripe; no unity of action, the hindrance the differences of the CPSU and the Chinese party. Brezhnev''s own remarks on negotiations not set down.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 99–104 (№ 18, Brezhnev''s notes, "Переговоры с Фам Ван Донгом" (talks with Phạm Văn Đồng), Oct. 13), 127 nn.92–100 (the editors: the delegation Oct. 12–18, talks Oct. 13–15 and 18 by the Presidium''s decision of Sept. 28; the talks with Le Thanh Nghi in July; U Thant''s letter; Nasser''s five conditions of Sept. 9). Made public: 2016. To check: the Soviet and Vietnamese records of the talks; the identity of the DRV chief of staff named in the notes. Names: Phạm Văn Đồng, Brezhnev, Mazurov, Andropov, Nasser, U Thant.'
