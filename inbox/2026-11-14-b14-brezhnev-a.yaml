      id: cal.1968-07-04.soviet-union-leadership
      when: July 4
      date: '1968-07-04'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Telephone. Chervonenko, the ambassador in Prague, to Brezhnev: the Soviet assessment is right, the picture in general right; the district conferences more or less satisfactory, and everyone elected a member of the Presidium; he agrees with the Soviet judgment of the "Two Thousand Words" and of the Czechoslovak reply on it; at Ostrava Kovalčík was elected, Pepich released and the commander from Ostrava taken for the Interior Ministry, under Bilak. Gomułka called at 1:40 p.m. Brezhnev''s other calls that day noted: Chazov, Churaev, Gromyko, and Vinogradov received.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 320–21 (№ 77, "т. Червоненко С.В. у телефона" (Comrade Chervonenko at the telephone), July 4). Made public: 2016. To check: Chervonenko''s reports to the Politburo; what Gomułka said. Names: Chervonenko, Brezhnev, Gomułka.'
