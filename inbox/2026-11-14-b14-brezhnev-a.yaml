- add:
    entry:
      id: cal.1966-04-27.soviet-union-leadership
      when: Apr. 27
      date: '1966-04-27'
      thread: soviet-union-leadership
      c: 'Tashkent. Brezhnev, flown in with Kosygin the day after the earthquake, hears Novikov, chairman of the government commission, and holds the meeting on the damage. His notes: some 10,800 families to be moved, tents numbered and registered, lump-sum payments watched for abuse; the people to be housed for at least two or three years, bricks from the whole country, a strong design bureau and a building industry, designs from Kishinev and Azerbaijan, all the republics and even cities to help, building cut elsewhere in the republic for now, large administrative buildings for several offices; a bold plan for the center.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 133–34 (№ 27, "Доклад тов. Новикова И.Т. в Ташкенте" (Comrade Novikov''s report in Tashkent); № 28, "Совещание в Ташкенте после землетрясения" (the meeting in Tashkent after the earthquake), Apr. 27), 170 nn.2–5 (the editors: the quake Apr. 26, 28 to 36 thousand buildings down, over 300,000 homeless; Brezhnev and Kosygin there Apr. 26–28; the commission set up by the Politburo Apr. 26; the resolution of June 14). Made public: 2016. Names: Brezhnev, Kosygin, Novikov.'
      tags:
      - polity:ussr
      - name:brezhnev-leonid
      - name:kosygin-aleksei
      - vis:only:ussr
- add:
    entry:
      id: cal.1966-05-04.soviet-union-leadership
      when: May 4
      date: '1966-05-04'
      thread: soviet-union-leadership
      c: 'The Politburo. Brezhnev''s agenda of May 3 for it: the texts of the open letter to the district electoral commissions for the Supreme Soviet elections and the appeal to the voters; preparation of the Warsaw Pact Consultative Committee at Bucharest and a meeting of the defense and foreign ministers; Brezhnev''s trip to Romania (May 10–13, to meet Ceauşescu); Kosygin''s trip to the UAR and the questions of Nasser (May 10–18); a meeting with Kim Il Sung; grain procurement for the year; trade with Singapore; the materials for the Plenum (May 25–27); the reply to the Turks on Patolichev''s trip; relations with Brazil; the delegation to open a road in Czechoslovakia. All twelve items taken up that day, by the editors.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 134–35 (№ 29, "Повестка ПБ на 3 мая" (the Politburo''s agenda for May 3), Brezhnev''s notes for the session), 170–71 nn.6–18 (the editors: the Politburo of May 4; the Bucharest meeting July 4–6; the trips to Romania and the UAR; Kim Il Sung''s request for an unofficial meeting, held at Vladivostok May 20–21). Made public: 2016. To check: the protocol of May 4. Names: Brezhnev, Kosygin, Ceauşescu, Nasser, Kim Il Sung, Patolichev.'
