- add:
    entry:
      id: cal.1967-06-12.soviet-union-leadership
      when: June 12
      date: '1967-06-12'
      thread: soviet-union-leadership
      also:
      - middle-east
      c: 'Moscow. Brezhnev, with other leaders, receives Boumédiène, who has flown in after the Six-Day War. Brezhnev''s list for the talks: how the operation began and its results, what the Soviet Union and the UAR have done in concert, how to end the conflict, the unity of the Arab world, a meeting of the leaders themselves, the use of the Security Council and General Assembly, a meeting of the four powers, the slogan of liquidating Israel unpopular and the straits, whether a quick settlement or delay serves, whether to renew the war now, the region closed to Soviet forces, recognition of the GDR by all as a blow to imperialism. The Algerian''s account, as Brezhnev noted it: the Arabs lost the first battle, the progressive forces most of all; Israel is an imperialist base and the Americans and British have interests in the East; the defeat may turn Arab anger against their allies and cost the Soviet Union its revolutionary standing in the Third World, and the Soviet Union should ask whether to revise peaceful coexistence; the aim at least the withdrawal of troops. Delivered by the 11th: MiG-21s and MiG-17s to Cairo and Algiers, 90 MiG-17s ready to go to the UAR.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 221–24 (№ 58, "К переговорам с Бумедьеном — 12го июня" (for the talks with Boumédiène, June 12) and the notes of the talks; the notes of the aircraft, June 11), 283 n.192 (the editors: urgent help to the armed forces of the UAR, Syria and Algeria on the Politburo''s decisions). Made public: 2016. To check: the Soviet and Algerian records of the talks; which of the notes are Brezhnev''s questions and which Boumédiène''s words (the book does not mark them). Names: Boumédiène, Brezhnev, Nasser.'
