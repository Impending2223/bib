- add:
    entry:
      id: cal.1964-10-29.soviet-union-leadership
      when: Oct. 29
      date: '1964-10-29'
      thread: soviet-union-leadership
      also:
      - china
      c: 'The Presidium on the invitations for Nov. 7: whether the Chinese party-government delegation is to come, with those of the other socialist parties, and Yugoslavia, Albania; directives approved for talks by the high-frequency line that day, Brezhnev with Gomułka, Dej and Novotný, Podgorny with Kádár and Ulbricht, Suslov with the Bulgarians. Brezhnev''s notes of the replies: Gomułka, invite the Chinese, at the top level, to be called "просто делегация Польши" (simply a delegation of Poland) on the Polish side, thanks for the word from China; Novotný, invite them, a refusal would be used against the Soviet party and Czechoslovakia, take part in the festival at the top, Albania not; Dej (by the editors'' guess), welcomes the moment and means to use it "умно" (cleverly), the Chinese long seeking contact and a way out, Romania will send a delegation. A call set for the next morning.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 56–57 (№ 6, "Готовить директивы для переговоров" (prepare directives for the talks) and the replies), 72 nn.100–102 (the editors: the Presidium of Oct. 29 took up the paper of the Central Committee''s department and the Foreign Ministry on the Chinese delegation, held consultations that day with the leaders of the fraternal parties on their coming for Nov. 7, approved the directives for the high-frequency talks, and gave them to Brezhnev, Podgorny and Suslov; on Albania, 102). Made public: 2016. To check: the Presidium''s protocol of Oct. 29; the Polish, Czechoslovak and Romanian accounts of the calls. Names: Brezhnev, Gomułka, Dej, Novotný, Podgorny, Kádár, Ulbricht, Suslov.'
      tags:
