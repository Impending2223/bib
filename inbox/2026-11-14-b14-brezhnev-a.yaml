- add:
    entry:
      id: cal.1968-03-06.soviet-union-leadership
      when: Mar. 6
      date: '1968-03-06'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Sofia. The Warsaw Pact''s Political Consultative Committee meets. Zhivkov opens, Gomułka presides; the Soviet delegation Brezhnev, Kosygin, Grechko, Rusakov and Puzanov, with Suslov. Three questions: the nonproliferation treaty, Vietnam, and a staff and military council for the Joint Command. Ceauşescu tries to change the third item of the agenda, citing an agreed agenda, "получил отпор" (met a rebuff). Brezhnev speaks, then a recess, then Ceauşescu.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 301–02 (№ 72, Brezhnev''s notes, "1968 г. 6 марта София. Заседание ПКК" (Mar. 6, 1968, Sofia, session of the Consultative Committee)), 339 nn.42–43 (the editors: the Soviet delegation; the three questions). Made public: 2016. To check: the stenogram or the Warsaw Pact records of the session; the notes do not say what Brezhnev or Ceauşescu said. Names: Zhivkov, Gomułka, Brezhnev, Kosygin, Grechko, Suslov, Ceauşescu.'
