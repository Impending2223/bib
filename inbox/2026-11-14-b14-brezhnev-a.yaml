- add:
    entry:
      id: cal.1968-01-22.soviet-union-leadership
      when: Jan. 22
      date: '1968-01-22'
      thread: soviet-union-leadership
      also:
      - soviet-union-czechoslovakia
      c: 'Telephone. Kádár to Brezhnev on his weekend (Jan. 20–21) in Slovakia with Dubček, now first secretary: the talk began with the Novotný invitation to the hunt, which Dubček said Novotný had told no one of in the Politburo; Kádár and Brezhnev had held the same view on dividing the posts, but not under pressure; Dubček, in a hard place, wants to go to the USSR first, for a few days, to consult, but must first speak at home; the nationalities question to be handled warily; cadres judged by their present work, not by their part against Novotný; calm about the talk in the country; the celebration (Feb. 22) to be at a level matching the others''; the writers'' union without a chairman. Brezhnev''s impression of Dubček: thin and pale, wants rest, an honest man who will keep to the line.'
      n: '[[w.brezhnev-rabochie-i-dnevnikovye]], I, 294–96 (№ 72, Brezhnev''s notes of the telephone talk with Kádár of Jan. 22), 336 nn.5–8 (the editors: the Jan. 5 plenum of the Czechoslovak party divided the posts and elected Dubček; Brezhnev''s call with Kádár of Dec. 13, 1967; Dubček in the USSR unofficially Jan. 29–30). Made public: 2016. To check: the Hungarian record, and Kádár''s own report of the talk with Dubček. Names: Kádár, Dubček, Brezhnev, Novotný.'
