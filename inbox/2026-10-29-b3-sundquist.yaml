        Subcomm. on Education of the S. Comm. on Labor and Public Welfare*, 88th Cong. 96–97, 100–01 (1964) (cited by [[w.sundquist-politics-and-policy]],
        211 n.166). See [[cal.1963-12-18.school-aid]]. Names: Morse, Keppel.'
