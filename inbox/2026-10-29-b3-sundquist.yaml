        Names: Kennedy, Ngô Đình Nhu.'
      c: 'News conference, on Nhu''s "too many American troops": troops would go home the day after Saigon asked. "We are
        hopeful that the situation in South Viet-Nam would permit some withdrawal in any case by the end of the year, but
        we can''t possibly make that judgment at the present time." "A long, hard struggle to go." On civil rights: "we are
        considering whether any additional proposals will be made to the Congress. And the final decision should be made in
        the next few days"; a legal remedy, so that the aggrieved need not "take to the streets."'
