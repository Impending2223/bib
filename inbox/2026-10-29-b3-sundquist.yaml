      when: 'Dec. 12'
      date: '1963-12-12'
      thread: school-aid
      c: 'House adopts the vocational education conference report. Frelinghuysen''s motion to recommit, to strike the work-study
        program and the residential schools, fails, [180–193](https://voteview.com/rollcall/RH0880108). Johnson had joined
