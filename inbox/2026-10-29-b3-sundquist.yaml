      when: 'Mar. 22'
      date: '1960-03-22'
      thread: medicare
      also:
      - republican-party-congress
      c: 'The Republican leaders at the White House, by the notes of the meeting. Flemming outlines a voluntary plan of medical
        care for the aged, the States to run it with federal and State money. Dirksen: "This will be a small hole through
        which all will be driven"; Halleck: "If people were dying right and left for lack of medical care you''d read about
        it in the papers." Eisenhower defers the decision; Flemming''s testimony to Ways and Means put off.'
      n: '[[w.sundquist-politics-and-policy]], 302–03. To check: notes on the leadership meeting, Mar. 22, 1960, McPhee Files,
        Eisenhower Papers, Eisenhower Library (cited by [[w.sundquist-politics-and-policy]], 302 n.45). Names: Flemming, Dirksen,
        Halleck, Eisenhower.'
      tags:
