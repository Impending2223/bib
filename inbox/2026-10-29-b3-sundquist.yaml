      when: 'Feb.'
      date: '1965-02'
      thread: republican-party-congress
      also:
      - voting-rights
      - republican-party
      c: 'Five Republican governors, four Senators and twenty-two Representatives, Romney, Scranton, Javits, Kuchel and Lindsay
        among them: "How long will Congress and the American people be asked to wait while this administration studies and
        restudies Dr. King''s request for new federal legislation." "Republicans march with them." Kuchel puts the statement
        in the Record Mar. 1.'
      n: 'Kuchel, [111 Cong. Rec. 3746–47](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt3/pdf/GPO-CRECB-1965-pt3-8-1.pdf#page=26)
