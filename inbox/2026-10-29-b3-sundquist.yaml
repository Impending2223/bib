      when: 'July 30'
      date: '1964-07-30'
      thread: school-aid
      c: 'Morse''s subcommittee hears Keppel on Morse''s bill, aid to school districts by their numbers of needy children
        through the impacted-areas laws. Keppel finds flaws and asks time; Morse: the administration "stalling," "dragging
        its heels."'
