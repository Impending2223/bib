      thread: poverty
      c: 'Heller to the departments and agencies concerned, by memorandum: fifty-eight proposals, most from Labor and HEW,
        under the label "Widening Participation in Prosperity." Three approaches: to prevent entry into poverty, to promote
        exits from it, to ease the lot of those who cannot leave it.'
      n: '[[w.sundquist-politics-and-policy]], 137. See [[cal.1963-05-01.poverty]]. Names: Heller.'
      tags:
