      when: 'Feb. 4'
      date: '1964-02-04'
      thread: poverty
      c: 'Shriver''s first meeting on the poverty bill, all day: Wirtz, Heller, Gordon, Cohen, Ylvisaker, Boone, Harrington,
        Yarmolinsky. Community action to start everywhere, not in a few demonstration areas, action before the plans are done;
        Wirtz for jobs.'
