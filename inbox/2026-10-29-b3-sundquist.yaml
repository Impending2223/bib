- add:
    entry:
      id: cal.1963-12.poverty
      when: 'Dec.'
      date: '1963-12'
      thread: poverty
      c: 'Cannon of the Budget Bureau, by memorandum: ten demonstration areas, a "development corporation" in each to plan
        the programs and spend the money. In a week of mid-December community action takes the whole $500 million set aside
        for the poverty bill; Ylvisaker brings the Ford-supported agencies'' heads to breakfast with the bureau''s staff.'
      n: '[[w.sundquist-politics-and-policy]], 138–39. See [[cal.1963-11-23.poverty-2]].'
