      when: 'Jan.'
      date: '1964-01'
      thread: poverty
      c: 'Wirtz, by memorandum on the staff''s outline of Jan. 21: poverty is lack of income, and income comes from jobs;
        the war on poverty to begin with employment.'
      n: '[[w.sundquist-politics-and-policy]], 141. See [[cal.1963-12-29.poverty]]. Names: Wirtz.'
      tags:
