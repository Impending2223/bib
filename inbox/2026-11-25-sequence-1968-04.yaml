- edit:
    id: cal.1968-04-05.civil-disorders-king-2
    base: 5576b8e2
    set:
      n: '[[w.johnson-white-house-diary]], 652 (Lady Bird Johnson''s account; Connally''s words in her paraphrase). Her agents then ask that she arrive late and ride a minibus; Johnson, by telephone, "thought I should go on to Hemisfair." Order: after [[cal.1968-04-05.press-and-broadcasting|the Ranch tour]], by Mrs. Johnson''s diary (651–52: supper in the yard at 6; "After my guests had left," calls to Lynda and to Liz Carpenter, then "I talked to John Connally and then I had a conference call"). Names: Connally, Lady Bird Johnson, Carpenter.'
