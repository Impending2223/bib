- edit:
    id: cal.1968-04-04.robert-kennedy-campaign-3
    base: a06146cf
    set:
      n: '[[w.schlesinger-robert-kennedy-and-his]], 876. Order: after [[cal.1968-04-04.robert-kennedy-campaign-2|the call to Coretta King]]: from the rally Kennedy "went straight back to the Marott Hotel" and telephoned her ([[w.witcover-85-days]], 142); the militants "waited for him now," and "Kennedy finally arrived" ([[w.schlesinger-robert-kennedy-and-his]], 876). To check: John Lewis, interview by Jean Stein, Sept. 9, 1968, 7, Stein Papers; [[w.vanden-heuvel-on-his-own]], 338 (cited by [[w.schlesinger-robert-kennedy-and-his]], 876 n.3). See [[cal.1968-04-04.robert-kennedy]]. Names: Robert Kennedy, John Lewis.'
- follows:
    id: cal.1968-04-04.robert-kennedy-campaign-3
    add:
    - cal.1968-04-04.robert-kennedy-campaign-2
- edit:
    id: cal.1968-04-04.robert-kennedy-campaign
    base: c0bdd8ce
    set:
      n: '[[w.thomas-robert-kennedy]], 367–68. Thomas notes Warren Rogers doubted Braden''s story (471). The time is the first day''s. Order: after [[cal.1968-04-04.robert-kennedy-campaign-3|the meeting with the militants]], by [[w.schlesinger-robert-kennedy-and-his]], 876–77 ("After the meeting," Kennedy to Greenfield that King''s death was not the worst thing, then "Harvey Lee Oswald"; early in the morning the blanket over Greenfield). See [[cal.1968-04-04.robert-kennedy]]. Names: Robert Kennedy, Walinsky, Greenfield, Braden.'
