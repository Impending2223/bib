    set:
      n: '[[w.johnson-white-house-diary]], 658–59 (Lady Bird Johnson''s account). Legge''s words as Mrs. Johnson gives them; he had said the same to her privately. Order: after [[cal.1968-04-09.conservation|Goliad]], by Mrs. Johnson''s diary (658: from the chapel "loaded onto the bus, and drove on to Gonzales"; "It was 2 o''clock when we reached Gonzales"). Names: Lady Bird Johnson.'
