    base: ffc475ee
    set:
      n: '[[w.shesol-mutual-contempt]], 446; [[w.witcover-85-days]], 134 (the Democratic fund-raiser in Philadelphia: Kennedy calls Tate "one of the greatest mayors in the United States"; "to see if he''s smiling"; not the text on Johnson). Order: after [[cal.1968-04-02.robert-kennedy-campaign-primaries|O''Donnell''s talk with Tate]] ("prior to the dinner") and [[cal.1968-04-02.robert-kennedy-campaign|the Palestra]] ("That same afternoon, before the Tate dinner"), by Witcover (134–35). To check: Speech, Apr. 2, 1968, RFK Speeches, 1965–1968, Reading Copies, box 9, JFK Library (cited by [[w.shesol-mutual-contempt]], 446). Names: Robert Kennedy, Johnson.'
