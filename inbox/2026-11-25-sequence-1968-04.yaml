- edit:
    id: cal.1968-04-04.robert-kennedy-campaign-4
    base: a23a9a90
    set:
      n: '[[w.sorensen-counselor]], 463–64 (Sorensen''s account, written in 2008; the notes quoted in part; Kennedy''s staff inserted the language into their draft that night). Order: after [[cal.1968-04-04.robert-kennedy|the Indianapolis rally]], by Sorensen (463: Kennedy spoke in Indianapolis; "He then telephoned me"); not placed against the call to Coretta King or the militants. See [[cal.1968-04-04.robert-kennedy]]. Names: Sorensen, Robert Kennedy, King.'
