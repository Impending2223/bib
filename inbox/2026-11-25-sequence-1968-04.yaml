    base: 17af0349
    set:
      n: '[[w.shesol-mutual-contempt]], 446; [[w.witcover-85-days]], 133 (Camden: "We take pride in President Johnson, who brought to final fulfillment the policies of thirty years, and who yesterday sacrificed personal political considerations to win the peace"; not the Schlesinger line). Order: after [[cal.1968-04-01.robert-kennedy-campaign-3|the Overseas Press Club]], by Witcover (132–33: the press conference "the next morning"; "That day, Kennedy flew to Philadelphia" for the suburbs "and a stop in Camden"). To check: Speech drafts, Mar. 30 and Apr. 1, 1968, RFK Speeches, 1965–1968, Reading Copies, box 9, JFK Library (cited by [[w.shesol-mutual-contempt]], 446). Names: Robert Kennedy, Johnson, Schlesinger.'
