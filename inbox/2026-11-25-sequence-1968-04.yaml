    text: 'Check: the day; Witcover (145–46) puts this meeting about 10:30 p.m. the night before the funeral, after the 9 p.m. meeting ([[cal.1968-04-08.robert-kennedy-campaign-decision]]), and the meeting with King''s associates after it, until nearly 3 a.m.'
