- edit:
    id: cal.1968-04-07.civil-disorders-king-2
    base: 45cd6cbc
    set:
      n: '[[w.clifford-counsel-to-the-president-2]], 531; [[w.califano-triumph-and-tragedy-of]], 281 (after leaving Westmoreland at Andrews; along 7th and 14th Streets Northwest); [[w.longley-lbjs-1968]], 127 (low over 7th and 14th Streets). Order: after [[cal.1968-04-07.civil-disorders-king-4|the Mass]], by the [President''s Daily Diary, Apr. 7, 1968](https://catalog.archives.gov/id/192479), images 3, 5 (LBJ Library; National Archives Catalog): out of St. Dominic''s 1:15 p.m.; the helicopter, Westmoreland and Clifford aboard, from the South Lawn 4:16 p.m. Names: Clifford, Johnson.'
