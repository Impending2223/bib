patch: reopen-foreign-2
by: Claude (the reopened sources, Foreign, second run; Oct. 23, 2026)
ops:
  - edit:
      id: cal.1965-10-19.vietnam
      base: 5d98acac
      set:
        n: '[Project CHECO, *The Siege at Plei Me* (Hq. PACAF, Feb. 24, 1966)](https://archive.org/details/DTIC_ADA487855), 1–2 (DTIC ADA487855; the attack from 1900, Oct. 19, the full assault at 2300; four CIDG companies and a 12-man Special Forces team). [[w.carland-united-states-army-in]]; [[w.vinh-loc-why-pleime]]; [[w.coleman-pleiku]]; [[w.saliba-death-in-the-highlands]]; [[w.vietnam-victory-in-vietnam]], 158–59 (the 33d Regiment''s siege to draw a relief column into the 320th''s ambush, and the Americans after it). See [[cal.1965-07-28.vietnam]].'
  - edit:
      id: cal.1965-10-23.vietnam
      base: d9fe6d0f
      set:
        n: '[Project CHECO, *The Siege at Plei Me*](https://archive.org/details/DTIC_ADA487855), 5–6 (the ambush at 1815, Oct. 23; the column into the camp Oct. 25). See [[cal.1965-10-19.vietnam]].'
  - edit:
      id: cal.1965-02-24.vietnam
      base: c8454751
      set:
        n: '[Project CHECO, *The War in Vietnam, 1965* (Hq. PACAF, Jan. 25, 1967)](https://archive.org/details/DTIC_ADA586319), 17 (DTIC ADA586319): a Ranger company and a CIDG company trapped on Route 19, lifted out by Army helicopters, USAF jets covering. Check: the report puts it "near the An Khe Pass in Binh Dinh Province", the entry (and its tag) at the Mang Yang pass; the jets'' bases not in the report. See [[cal.1965-02-22.vietnam]].'
  - add:
      entry:
        id: cal.1967-08-10.vietnam-program-5
        when: Aug. 10
        date: '1967-08-10'
        thread: vietnam-program-5
        also: [defense]
        c: 'McNamara to Wheeler: the forces of JCSM 416-67 approved for planning, within a ceiling of 525,000 men in South Vietnam. Program 4, 484,472; added in fiscal 1968, 47,296; civilianization, 6,768 less. Five more destroyers for gunfire support; a battleship under study.'
        n: 'McNamara''s memorandum for the Chairman of the Joint Chiefs, Aug. 10, 1967, quoted in [[w.def-u-s-viet-rels-iv-c-6-b]], 212–14. Made public: [[w.pentagon-papers]], IV (1971; Check the page); NARA''s release of 2011. See [[cal.1967-07-07.vietnam]]. Names: McNamara, Wheeler.'
        tags: [name:mcnamara-robert-s, name:wheeler-earle]
  - edit:
      id: cal.1967-08-14.vietnam-program-5
      base: 9a4e5787
      set:
        c: 'Program 5 published: 47,296 men more, to an authorized strength of 525,000.'
        n: '[[w.def-u-s-viet-rels-iv-c-6-b]], 214 ("formally published on 14 August"). Made public: [[w.pentagon-papers]], IV (1971; Check the page); NARA''s release of 2011. See [[cal.1967-08-10.vietnam-program-5]].'
