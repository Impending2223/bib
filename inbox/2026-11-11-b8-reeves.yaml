patch: 2026-11-11-b8-reeves
by: 'Claude, batch 8 reader (Reeves, President Kennedy: Profile of Power)'
ops:
- add:
    entry:
      id: cal.1961-01-29.economy-2
      when: Jan. 29
      date: '1961-01-29'
      thread: economy
      c: 'Heller gives an on-the-record press briefing on anti-recession measures. A reporter: "How can we judge a stimulating effect without knowing the cost?" Kennedy
        to Heller: "How did you answer that?" "Fast talk and rapid gestures." "Good job."'
      n: '[[w.reeves-president-kennedy]], 56. Check: whether this is the briefing of Jan. 26 ([[cal.1961-01-26.economy]]); Reeves has that one on background (54–55)
        and this one on the record, on Jan. 29. Names: Heller.'
      tags:
      - name:heller-walter-w
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-03-20.laos-3
      when: Mar. 20–21
      date: '1961-03-20'
      thread: laos
      c: 'Rostow, delegated to brief reporters on background: the President is resolved to face down the Communists in Laos, and the Soviets too. *New York Times*,
        Mar. 21, front page: "U.S. READY TO FACE ALL RISKS TO BAR RED RULE OF LAOS."'
      n: '[[w.reeves-president-kennedy]], 75. Check: the day; Reeves gives the headline of Mar. 21 and no day for the briefing. See [[cal.1961-03-20.laos]]. Names:
        Rostow.'
      tags:
      - name:rostow-walt-w
- add:
    entry:
      id: cal.1961-03.laos-2
      when: Mar.
      date: 1961-03
      thread: laos
      c: 'Winthrop Brown, Ambassador to Laos, with the President for almost an hour. Kennedy: "What do you think, you, the Ambassador?" Brown: "Laos is hopeless";
        "The king is a total zero." Phoumi never near a battlefield. Kong Le "just a disgruntled soldier, a patriot." Souvanna Phouma the only Lao with a chance of
        pulling the country together.'
      n: '[[w.reeves-president-kennedy]], 74. Check: the month and the day; Reeves places the lunch with Lippmann ([[cal.1961-03-20.laos]]) "five days later." Names:
        Brown.'
      tags:
      - name:brown-winthrop-g
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-12.space-2
      when: Apr. 12
      date: '1961-04-12'
      thread: space
      c: 'Kennedy to Johnson, chairman of the Space Council, by 10 a.m., after Gagarin: "Is there any place where we can catch them? ... Can we put a man on the moon
        before them? Can we leapfrog? ... If somebody can just tell me how to catch up!"'
      n: '[[w.reeves-president-kennedy]], 85–86. See [[cal.1961-04-12.space]]. Names: Johnson.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-3
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: 'Glen Ora, 5:15 a.m. Rusk to Kennedy: the invasion has begun; the CIA wants Navy jets from the *Essex* over the beach. Kennedy: "No." No Navy jets, no more
        B-26s; the *Essex* and the destroyers farther away, over the horizon.'
      n: '[[w.reeves-president-kennedy]], 91. Check: the hour; Reeves has the landing begun thirty minutes before the call. See [[cal.1961-04-17.cuba]]. Names: Rusk.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
- add:
    entry:
      id: cal.1961-04-29.vietnam
      when: Apr. 29
      date: '1961-04-29'
      thread: vietnam
      c: 'The National Security Council, on Vietnam. Kennedy lists the reasons for a stand there: a more unified nation, a million refugees from the North, a larger
        and better-trained army, access to the sea, no border with China. Working paper: "Program of Action to Prevent Communist Domination of South Vietnam," twenty-three
        pages, by Gilpatric and Lansdale; their recommendations put to the President that day.'
      n: '[[w.reeves-president-kennedy]], 116–17. Check: that the meeting was the NSC; the day. See [[cal.1961-04-29.laos]], [[cal.1961-05-11.vietnam]]. Names: Gilpatric,
        Lansdale.'
      tags:
      - name:kennedy-john-f
      - name:gilpatric-roswell-l
      - name:lansdale-edward-g
- add:
    entry:
      id: cal.1961-07-25.berlin-and-vienna-2
      when: July 25
      date: '1961-07-25'
      thread: berlin-and-vienna
      c: 'The White House pool, almost an hour, Kennedy with Sidey of *Time*, on Berlin and the speech that night: "That son of a bitch won''t pay any attention to
        words. He has to see you move."'
      n: '[[w.reeves-president-kennedy]], 199. See [[cal.1961-07-25.berlin-and-vienna]]. Names: Sidey.'
      tags:
      - name:kennedy-john-f
      - name:sidey-hugh
- add:
    entry:
      id: cal.1962-04-04.robert-kennedy
      when: Apr. 4
      date: '1962-04-04'
      thread: robert-kennedy
      c: 'The CIA''s formal request to the FBI to forgo prosecution of Giancana and Maheu in the wiretap case: "Any prosecution in the matter would endanger sensitive
        sources and methods used in a duly authorized intelligence project and would not be in the national interest."'
      n: '[[w.reeves-president-kennedy]], 292 ("Two weeks later" than Hoover''s visit of Mar. 22). See [[cal.1962-03-22.transition-and-staff]], [[cal.1962-05-07.robert-kennedy]].
        Names: Giancana, Maheu.'
      tags:
      - name:giancana-sam
      - name:maheu-robert-a
- add:
    entry:
      id: cal.1963-06-19.laos
      when: June 19
      date: '1963-06-19'
      thread: laos
      c: 'Kennedy with Rusk and McNamara, 5 p.m., on Southeast Asia: their seventeen-page paper. "The root of the problem in Southeast Asia is the aggressive effort
        of the North Vietnamese to establish Communist control in Laos and South Viet-Nam." A program of "graduated increases in US political and military pressure";
        its third phase "the initiation of military action against North Vietnam."'
      n: '[[w.reeves-president-kennedy]], 528–29. See [[cal.1963-06-25.laos]]. Names: Rusk, McNamara.'
      tags:
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1961-06-16.berlin-and-vienna
      when: June 16
      date: '1961-06-16'
      thread: berlin-and-vienna
      c: Kennedy, back in Washington and working from his bedroom, calls in Acheson and asks him to prepare a plan to counter the Soviet pressure on Berlin.
      n: '[[w.reeves-president-kennedy]], 181. Check: the day; Reeves has it "one of the first things he did" on his return, June 16. See [[cal.1961-06-15.berlin-and-vienna]].
        Names: Acheson.'
      tags:
      - name:kennedy-john-f
      - name:acheson-dean-g
