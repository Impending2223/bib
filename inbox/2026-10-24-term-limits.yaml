patch: term-limits
by: Claude (term limits agent, Oct. 24, 2026)
ops:
- edit:
    id: cal.1965-08-17.state-constitutions-mo
    base: 8ab3d79a
    set:
      n: '[*Official Manual, State of Missouri, 1965–1966*, 1296–1297](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/38202). No. 1, H.J.R. 3, [*Laws of Missouri*, 1965, 676](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/57106): Mo. Const. art. IV, § 17 repealed and enacted anew, "No person shall be elected governor more than twice, and no person who has held the office of governor, or acted as governor, for more than two years of a term to which some other person was elected to the office of governor shall be elected to the office of governor more than once"; effective Sept. 16, 1965, [*Laws of Missouri*, 1965, pt. III, 815](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56755). The bar it replaced, § 17 (1945): "The governor and state treasurer shall not be eligible for election as their own successors," [*Official Manual*, 1945–1946, 159](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/23064). See [[cal.1964-12-30.legislatures-mo]].'
- edit:
    id: cal.1965-09-30.alabama-al
    base: 6e341064
    set:
      n: '[*Journal of the House*, Third Special Session, 1965, 51](https://archive.org/details/alabama-house-journal-1965-special-b/page/n562). Steve Flowers, ["The 1965 special succession session"](https://www.alreporter.com/2020/05/13/opinion-the-1965-special-succession-session/), *Alabama Political Reporter*, May 13, 2020. The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]; [[w.frady-wallace]]. Names: Wallace.'
- edit:
    id: cal.1966-02-24.elections-1966
    base: acb8c965
    set:
      n: 'The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). To check: [[w.carter-politics-of-rage-1995]]; [[w.lesher-george-wallace]]. See [[cal.1965-03-20.alabama]]. Names: George Wallace, Lurleen Wallace.'
- edit:
    id: cal.1966-05-03.elections-1966
    base: 1883cec9
    set:
      n: 'Votes: Wikipedia, "1966 Alabama gubernatorial election"; [Ala. *Official and Statistical Register*, 1967, 557–559](https://archive.org/details/alabama-official-statistical-register-1967/page/n558). The bar: Ala. Const. § 116 (1901), "no one of said officers shall be eligible as his own successor": [[w.thorpe-federal-and-state-constitutions]], [I, 197](https://archive.org/details/federalstatecons01thor/page/197/mode/1up) (the bar). To check: [[w.carter-politics-of-rage-1995]]; [[w.jeffries-bloody-lowndes]]. Names: George Wallace, Patterson, Lurleen Wallace, Richmond Flowers, James Clark, Folsom, Wilson Baker, Elliott.'
- edit:
    id: cal.1966-05-03.state-constitutions-ok
    base: b3a3552b
    set:
      n: '[Okla. State Election Bd., *Election Results, 1958–1966*, p. 60–61](https://oklahoma.gov/content/dam/ok/en/elections/election-results/results-prior-to-1980/1958-1966-results.pdf#page=60). The amendment, State Question 436: [enrolled H.J.R. 515 (1965), 1–2](https://www.sos.ok.gov/documents/questions/436.pdf), Okla. Const. art. VI, § 4: "No person shall be elected Governor more than two times in succession"; its § 3, "This law shall take effect after the general election to be held in 1966." The provision it replaced, art. VI, § 4 (1907): the governor "shall not be eligible immediately to succeed" himself, [[w.thorpe-federal-and-state-constitutions]], [VII, 4288–4289](https://archive.org/details/federalstatecons07thor/page/4288/mode/1up). See [[cal.1964-11-03.state-constitutions-ok]]; [[cal.1965-01-21.states-and-cities-ok]].'
- edit:
    id: cal.1966-11-08.state-constitutions-la
    base: 8b53073d
    set:
      n: '[Wikipedia, "Caesars Superdome"](https://en.wikipedia.org/wiki/Caesars_Superdome); [Wikipedia, "John McKeithen"](https://en.wikipedia.org/wiki/John_McKeithen). Check: La. Secretary of State, returns. The bar the amendment lifted: La. Const. of 1921, art. V, § 3, "nor shall any person elected Governor be eligible as his own immediate successor," [*Constitution of the State of Louisiana* (1921), 17–18](https://archive.org/details/cu31924030492163). Check: the amendment''s text and vote not read. To check: [[w.peirce-deep-south-states-of]]. Names: McKeithen.'
- edit:
    id: cal.1967-11-04.governors-la
    base: 00c21a8b
    set:
      n: 'Votes: [Wikipedia, "1968 Louisiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Louisiana_gubernatorial_election), from the Secretary of State''s *Primary Election Returns*, 1967; [Wikipedia, "Dutch Morial"](https://en.wikipedia.org/wiki/Dutch_Morial). The bar before: La. Const. of 1921, art. V, § 3, [*Constitution of the State of Louisiana* (1921), 17–18](https://archive.org/details/cu31924030492163). Check: the Secretary of State''s returns. To check: [[w.peirce-deep-south-states-of]]; [[w.fairclough-race-and-democracy]]. See [[cal.1966-11-08.state-constitutions-la]]. Names: McKeithen, Rarick, Morial.'
- edit:
    id: cal.1968-05-04.governors-nc
    base: 12539aec
    set:
      n: '[N.C. *Manual*, 1969, 291](https://archive.org/details/northcarolinama1969nort/page/n306); Wikipedia, ["1968 North Carolina gubernatorial election"](https://en.wikipedia.org/wiki/1968_North_Carolina_gubernatorial_election). The bar: N.C. Const. art. III, § 2, as amended 1962, "nor shall a person elected to either of these two offices be eligible for election to the next succeeding term of the same office," [*Constitution of North Carolina*, a literal print as of Jan. 1, 1969, 25](https://archive.org/details/constitutionofno00nort); the amendment ratified Nov. 6, 1962, [[w.sanders-amendments-to-the-constitution]], [14](https://archive.org/details/amendmentstocons00sand). Check: that Broughton declined the runoff. To check: [[w.luebke-tar-heel-politics]]; [[w.bass-transformation-of-southern-politics-1976]]. Names: Moore, Scott, Broughton, Hawkins, Gardner.'
- edit:
    id: cal.1968-05-14.governors-wv
    base: ab85c4b9
    set:
      n: 'Votes: [Wikipedia, "1968 West Virginia gubernatorial election"](https://en.wikipedia.org/wiki/1968_West_Virginia_gubernatorial_election), from Our Campaigns. The bar: W. Va. Const. art. VII, § 4, as amended 1902, "The governor shall not be eligible to said office for the four years next succeeding the term for which he was elected," [*West Virginia Blue Book*, 2004, 393](https://archive.org/details/bwb_P7-BUY-760); the succession amendment refused Nov. 8, 1966, 142,265 to 260,352, ratified Nov. 3, 1970, 213,758 to 157,597, same, 429. Check: the Secretary of State''s *Official Returns of the Primary Election*, 1968. To check: [[w.peirce-border-south-states]]. Names: Smith, Sprouse, Moore, Underwood.'
- edit:
    id: cal.1968-06-18.governors-in
    base: f9d01597
    set:
      n: 'Votes: [Wikipedia, "1968 Indiana gubernatorial election"](https://en.wikipedia.org/wiki/1968_Indiana_gubernatorial_election), from *America Votes 8* (Check: the conventions'' proceedings; Indiana''s *Election Report* prints the general only). The bar: Ind. Const. art. 5, § 1 (1851), the governor "shall not be eligible more than four years in any period of eight years": [[w.thorpe-federal-and-state-constitutions]], [II, 1081](https://archive.org/details/federalstatecons02thor/page/1081/mode/1up) (the bar; Check: the text as it read in 1968). To check: [[w.peirce-great-lakes-states-of]]. See [[cal.1964-06-09.governors-in]]. Names: Whitcomb, Bowen, Butz, Branigin.'
- edit:
    id: cal.1968-11-05.governors-mo
    base: 2f59e9f9
    set:
      n: 'Votes: [Mo. *Official Manual*, 1969–70, 1197](https://mdh.contentdm.oclc.org/digital/collection/bluebook/id/41030). The amendment: H.J.R. 3, [*Laws of Missouri*, 1965, 676](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/57106), Mo. Const. art. IV, § 17: "No person shall be elected governor more than twice"; adopted Aug. 17, 1965, effective Sept. 16, 1965, [*Laws of Missouri*, 1965, pt. III, 815](https://mdh.contentdm.oclc.org/digital/collection/molaws/id/56755). See [[cal.1965-08-17.state-constitutions-mo]]. To check: [[w.peirce-great-plains-states-of]]. See [[cal.1964-08-04.governors-mo]]. Names: Hearnes, Roos.'
