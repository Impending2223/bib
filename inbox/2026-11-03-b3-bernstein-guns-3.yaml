      id: cal.1966-01-11.program
      when: Jan. 11
      date: '1966-01-11'
      thread: program
      c: 'The State of the Union. Califano, Valenti and Moyers in a "final meeting" with Johnson, his "last round of
        comments"; Califano writes through the night. At the Mayflower Goodwin finishes his draft at dawn, after almost
        thirty-six hours, a White House doctor''s injection keeping him going, by Goodwin''s account.'
      n: '[[w.bernstein-guns-or-butter]], 321. To check: Califano, Oral History Interview, LBJ Library (cited by
        [[w.bernstein-guns-or-butter]], 321 n.1); [[w.goodwin-remembering-america]], 423–24 (cited by
        [[w.bernstein-guns-or-butter]], 321 n.1). See [[cal.1965-11-27.program]]. Names: Califano, Valenti, Moyers, Johnson,
        Goodwin.'
      tags:
