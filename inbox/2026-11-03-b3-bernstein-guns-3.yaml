      when: July 14
      date: '1960-07-14'
      thread: elections-1960
      c: 'Los Angeles. Johnson, waiting to see Kennedy, to O''Brien, who will run the campaign: "I am going to do everything
        humanly possible to help this man and to help this ticket. ... Move me everywhere and anywhere you can. I am
        totally committed." By O''Brien''s account.'
      n: '[[w.bernstein-guns-or-butter]], 5. Check: the day; Bernstein gives "during the convention." To check: O''Brien,
        Oral History Interview, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 5 n.2). See [[cal.1960-07-14.elections-1960]].
        Names: Johnson, Kennedy, O''Brien.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-john-f
      - name:obrien-lawrence-f
      src:
        c: ac21506d
        rows:
        - 'w.bernstein-guns-or-butter 5: all'
        - 'via w.bernstein-guns-or-butter 5 n.2d: all'
