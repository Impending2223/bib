      when: Nov. 24
      date: '1963-11-24'
      thread: assassination
      c: 'Katzenbach to Johnson, through Thornberry: he is "very concerned that everyone know that Oswald was guilty." An
        independent commission: Whittaker and Prettyman, retired judges, and Dewey, "to make it non-partisan."'
      n: '[[w.bernstein-guns-or-butter]], 22. To check: Jenkins to Johnson, Nov. 24, 1963, Assassination of John F. Kennedy
        File, LBJ Library (cited by [[w.bernstein-guns-or-butter]], 22 n.2). Names: Katzenbach, Johnson, Thornberry,
        Dewey.'
      tags:
      - name:katzenbach-nicholas
      - name:johnson-lyndon-b
      - name:thornberry-william-h
      - name:dewey-thomas-e
      src:
        c: 03265759
        rows:
        - 'w.bernstein-guns-or-butter 22: all'
- add:
    entry:
      id: cal.1963-11-25.assassination-5
      when: Nov. 25
      date: '1963-11-25'
      thread: assassination
      c: 'Katzenbach to Moyers, a memorandum: act now "to head off speculation or Congressional hearings of the wrong sort."
        The public "to be satisfied that Oswald was the assassin; that he did not have confederates who are still at
        large." The Dallas police''s Communist plot and the Iron Curtain press''s right-wing conspiracy "ought to be cut off."
        A "complete and thorough FBI report," or "a Presidential Commission of unimpeachable personnel."'
      n: '[[w.bernstein-guns-or-butter]], 22. To check: Katzenbach to Moyers, Nov. 25, 1963, Moyers Papers, LBJ Library (cited
        by [[w.bernstein-guns-or-butter]], 22 n.2). See [[cal.1963-11-24.assassination-4]]. Names: Katzenbach, Moyers.'
      tags:
      - name:katzenbach-nicholas
      - name:moyers-bill
      src:
        c: 6eaf272f
        rows:
        - 'w.bernstein-guns-or-butter 22: all'
        - 'via w.bernstein-guns-or-butter 22 n.2c: all'
