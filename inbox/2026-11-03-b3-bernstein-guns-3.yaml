- add:
    entry:
      id: cal.1966-07-09.program
      when: July 9
      date: '1966-07-09'
      thread: program
      also:
      - vietnam-support
      c: 'Goldman to Johnson: the "axiom of American history that wars tend to throw back progressive programs": the Civil
        War followed by Grantism, World War I by Harding, World War II by the 80th Congress, the Korean War by
        Eisenhowerism. He offers statements putting Vietnam "in a larger setting." Johnson approves; nothing comes of them.'
      n: '[[w.bernstein-guns-or-butter]], 562–63. To check: Goldman to Johnson, July 9, 1966, Vietnam Reference File, LBJ
        Library (cited by [[w.bernstein-guns-or-butter]], 563 n.1); [[w.goldman-tragedy-of-lyndon-johnson]]. Names:
        Goldman, Johnson.'
      tags:
      - name:goldman-eric-f
      - name:johnson-lyndon-b
      src:
        c: 51f93dbc
        rows:
        - 'w.bernstein-guns-or-butter 562–63: all'
        - 'via w.bernstein-guns-or-butter 563 n.1f: A-B'
- add:
    entry:
      id: cal.1966-10-17.program
      when: Oct. 17
      date: '1966-10-17'
      thread: program
      also:
      - vietnam-asian-trip
      c: 'About to leave for Asia, Johnson calls Califano to his bedroom: "You''re going to be the President. ... We have
        to get all this legislation passed." He loads him up with instructions, and with cufflinks, lighters and an
        electric toothbrush, by Califano''s account.'
      n: '[[w.bernstein-guns-or-butter]], 319. Check: the day; Bernstein gives "in 1966 when the President was about to
        leave for Southeast Asia." To check: Califano, Oral History Interview, LBJ Library (cited by
        [[w.bernstein-guns-or-butter]], 319 n.1). Names: Johnson, Califano.'
      tags:
      - name:johnson-lyndon-b
      - name:califano-joseph-a-jr
      src:
        c: 71b0179e
        rows:
        - 'w.bernstein-guns-or-butter 319: all'
        - 'via w.bernstein-guns-or-butter 319 n.1a: all'
# --- Prologue, "The Vice Presidency," pp. 3-14, nn.1-4 (pp. 543-44)
