- cite:
    id: cal.1965-04-11.school-aid
    item: '[[w.johnson-white-house-diary]], 258–59 (the signing at the Junction schoolhouse, about 4 p.m., some three hundred present, Miss Kate Deadrich Loney beside him, the pen to her; Carl Albert and Senator McCarthy there; not the Stat. or the Titles)'
