    item: '[[w.johnson-white-house-diary]], 251 (at the Congressional reception, "when the news came that the Reverend Reeb had died, Lyndon and I excused ourselves for a helpless, painful talk with Mrs. Reeb"; not Humphrey, the father or the telephone)'
