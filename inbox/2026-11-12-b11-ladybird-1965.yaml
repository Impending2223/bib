- cite:
    id: cal.1965-04-07.vietnam
    item: '[[w.johnson-white-house-diary]], 256 (at Johns Hopkins, at 9: "We will not be defeated. We will not grow tired"; the Mekong and the billion dollars, as she gives them, "dwarf even our own TVA"; Eugene Black not named)'
    units: B
