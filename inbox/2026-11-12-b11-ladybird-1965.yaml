- cite:
    id: cal.1965-04-17.vietnam
    item: '[[w.johnson-white-house-diary]], 260–61 (at noon, to about forty reporters at the Ranch, a statement she takes for a countermove to Fulbright''s speech; the visits of Ayub Khan and Shastri postponed to early fall; not the quoted words)'
