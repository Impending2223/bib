patch: 2026-11-12-b11-ladybird-1965
by: 'Claude (batch 11, share: Lady Bird Johnson, A White House Diary, 1965), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1965-01-04.democratic-party
      when: Jan. 4
      date: '1965-01-04'
      thread: democratic-party
      c: Russell Long wins the Senate Democrats' Number Two place, vacated by Humphrey, against Pastore and Monroney.
      n: '[[w.johnson-white-house-diary]], 214–15 (Mrs. Johnson''s account: "just won"; she had it in the day, watching the Chamber that night; not the vote or the hour). Made public: 1970. To check: the Congressional Record, Jan. 4, 1965. Names: Long, Pastore, Monroney, Humphrey. Check: the day.'
      tags:
      - name:long-russell-b
      - name:pastore-john-o
      - name:monroney-almer-s
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-01-06.congress
      when: Jan. 6
      date: '1965-01-06'
      thread: congress
      c: The Rayburn statue, by Felix de Weldon, the Texas State Society's gift, dedicated in the new Rayburn House Office Building, 10 a.m. Patman presides. Lady Bird Johnson speaks. The President comes in as a surprise visitor before she does. Everett Hutchinson presents the statue, McCormack accepts it.
      n: '[[w.johnson-white-house-diary]], 216 (Mrs. Johnson''s account, with her words: "I''m a Democrat, without suffix, prefix or apology"). To check: the Congressional Record, Jan. 6, 1965. Names: Rayburn, Patman, McCormack, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rayburn-sam
      - name:patman-wright
      - name:mccormack-john-w
      - state:tx
- add:
    entry:
      id: cal.1965-01-14.poverty
      when: Jan. 14
      date: '1965-01-14'
      thread: poverty
      c: 'In the Queen''s Room, Shriver presents to Lady Bird Johnson and Liz Carpenter a detailed analysis of Operation Head Start: 100,000 children of five and six, before the first grade in September, an eight-week course. He raises Operation VISTA, the domestic Peace Corps. She asks which to take up.'
      n: '[[w.johnson-white-house-diary]], 219. Made public: 1970. Names: Shriver, Carpenter, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:shriver-r-sargent
      - name:carpenter-liz
- add:
    entry:
      id: cal.1965-01-14.transition-and-staff
      when: Jan. 14
      date: '1965-01-14'
      thread: transition-and-staff
      c: 'A farewell party for Martha and Luther Hodges, about 7:15 p.m., the Yellow Oval Room: the Cabinet and wives, ten of the top staff and wives. Lady Bird Johnson speaks. The Cabinet gives them a silver tray. The Hodgeses are going back to North Carolina.'
      n: '[[w.johnson-white-house-diary]], 219–20. Made public: 1970. Names: Hodges, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:hodges-luther-h
      - state:nc
- add:
    entry:
      id: cal.1965-01-15.trade
      when: Jan. 15
      date: '1965-01-15'
      thread: trade
      also:
      - europe-and-the-alliance
      c: 'At the LBJ Ranch: Rusk, McGeorge Bundy and Canada''s Paul Martin land, then Prime Minister and Mrs. Pearson. Informal remarks at the hangar to the newspapermen. At dinner, with Connally, the talk is of Churchill, in a coma and said to be past hope.'
      n: '[[w.johnson-white-house-diary]], 220–22. See [[cal.1965-01-16.trade]]. Made public: 1970. To check: the President''s Daily Diary, Jan. 15, 1965. Names: Pearson, Rusk, Bundy, Connally.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:pearson-lester-b
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:connally-john
      - state:tx
- add:
    entry:
      id: cal.1965-01-18.democratic-party
      when: Jan. 18
      date: '1965-01-18'
      thread: democratic-party
      c: 'The pre-inaugural dinners: about three thousand at the Sheraton Park, renamed "Sheraton Texas," Connally introducing the President; eighteen hundred, the President''s Club, at the Shoreham. Brief stops, humorous remarks, ending: "Now is the time for hope and rededication." Humphrey at the two others.'
      n: '[[w.johnson-white-house-diary]], 223–24. To check: 1965 Pub. Papers. Names: Connally, Humphrey, Marks.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connally-john
      - name:humphrey-hubert-h
      - name:marks-leonard-h
- add:
    entry:
      id: cal.1965-01-18.transition-and-staff
      when: Jan. 18
      date: '1965-01-18'
      thread: transition-and-staff
      c: 'The inaugural gala, the Armory; Richard Adler directs. Of the contemporary politics, Bobby Darin''s "Mack the Knife" for the Secretary of Defense, and Hitchcock''s message, ostensibly to the Republicans of Nov. 4: "do you have that ''morning after'' feeling?"'
      n: '[[w.johnson-white-house-diary]], 224–25 (Mrs. Johnson''s account). Made public: 1970. Names: McNamara.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1965-01-18.transition-and-staff-2
      when: Jan. 18
      date: '1965-01-18'
      thread: transition-and-staff
      c: The Distinguished Ladies' Reception, the National Gallery of Art, about 3 p.m., five thousand women; Lady Bird Johnson receives, diplomats' wives in native dress.
      n: '[[w.johnson-white-house-diary]], 222 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-01-20.transition-and-staff-2
      when: Jan. 20
      date: '1965-01-20'
      thread: transition-and-staff
      c: The inaugural parade, 2:30 to 5, fifty-two bands and fifteen thousand marchers, Howard Burris chairman; the President reviews it behind a glass barrier at the White House. On the avenue he halts the procession to shake hands with the Southwest Texas State band. Governors, labor leaders and Cabinet wives come by the stand; McNamara, Wheeler, Shriver, Farley and Billy Graham among them.
      n: '[[w.johnson-white-house-diary]], 227–29 (Mrs. Johnson''s account; the McNamaras and Wheeler "while the military units were going by"). Names: McNamara, Wheeler, Shriver, Graham.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:wheeler-earle
      - name:shriver-r-sargent
      - name:graham-billy
- add:
    entry:
      id: cal.1965-01-20.democratic-party-2
      when: Jan. 20
      date: '1965-01-20'
      thread: democratic-party
      c: 'The inaugural balls, from 9:15: the Mayflower, the Statler-Hilton, the Armory (13,000), the Shoreham, "full of Minnesotans," the Sheraton Park, the Texans'' ball. At the last the President: "Never have so many paid so much to dance so little! ... One thing I can say about the Great Society—it sure is crowded."'
      n: '[[w.johnson-white-house-diary]], 229–30 (Mrs. Johnson''s account). See [[cal.1965-01-20.democratic-party]]. Made public: 1970. Names: Johnson. Check: the Shoreham ball, which the diary has full of Minnesotans and the entry of this day has Daley introducing Johnson at a Democratic party there.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-01-20.transition-and-staff-3
      when: Jan. 20
      date: '1965-01-20'
      thread: transition-and-staff
      c: 'The Interfaith Prayer Service, the National City Christian Church, from a quarter of 9: the Johnsons, the Court, the Cabinet and the principal figures of government; brief prayers by ministers of many faiths, a Roman Catholic Monsignor who came with Archbishop Lucey among them. Not an empty seat.'
      n: '[[w.johnson-white-house-diary]], 224. Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-01-21.program
      when: Jan. 21
      date: '1965-01-21'
      thread: program
      also:
      - congress
      c: 'The Yellow Room, 10 a.m.: Johnson with the House leadership and the committee chairmen, on how to start the legislative program: McCormack, Albert, Boggs, Humphrey; Busby, Valenti, Moyers, Cater, O''Brien; Smith, Rivers, Mills, Patman, Teague, Mahon. After the Congressmen leave, to O''Brien: "John Kennedy is watching us up in heaven and we are going to wrap up all of his legislation and put it in a package and tie it up and label it JFK."'
      n: '[[w.johnson-white-house-diary]], 230–31 (Mrs. Johnson, called in to greet them). See [[cal.1965-01-21.vietnam]]. To check: the President''s Daily Diary, Jan. 21, 1965. Names: McCormack, Albert, Boggs, Humphrey, Busby, Valenti, Moyers, O''Brien, Smith, Mills, Patman, Mahon, Johnson. Check: whether the meeting is the leaders'' of 10:07 a.m. to 12:45 on Vietnam.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mccormack-john-w
      - name:albert-carl
      - name:boggs-hale
      - name:humphrey-hubert-h
      - name:busby-horace
      - name:valenti-jack
      - name:moyers-bill
      - name:patman-wright
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1965-01-24.succession
      when: Jan. 24
      date: '1965-01-24'
      thread: succession
      c: 'Bethesda Naval Hospital. Johnson''s doctors tell Lady Bird Johnson they are strongly opposed to his going to Churchill''s funeral next Saturday: he would be weak and open to infection, and they skirt the word "pneumonia." She thinks it wise not to go. Johnson, a quiet patient, signs letters and the Budget Message.'
      n: '[[w.johnson-white-house-diary]], 231–32 (Mrs. Johnson''s account; Dr. Wilbur Gould). See [[cal.1965-01-24.europe-and-the-alliance]]. Made public: 1970. Names: Johnson, Valenti. Check: the day Johnson signed the Budget Message; [[cal.1965-01-25.economy]].'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:valenti-jack
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-01-27.europe-and-the-alliance
      when: Jan. 27
      date: '1965-01-27'
      thread: europe-and-the-alliance
      c: 'Johnson, at a 5:30 press conference in his bedroom, to a small group of newspapermen: the doctors have warned him against going to London, being susceptible to reinfection. He names Rusk, the Chief Justice and Ambassador Bruce to represent him.'
      n: '[[w.johnson-white-house-diary]], 232. See [[cal.1965-01-24.europe-and-the-alliance]]. Made public: 1970. To check: 1965 Pub. Papers; the President''s Daily Diary, Jan. 27, 1965. Names: Rusk, Warren, Bruce, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:warren-earl
      - name:bruce-david-k-e
      - name:churchill-winston-s
- add:
    entry:
      id: cal.1965-01-27.transition-and-staff
      when: Jan. 27
      date: '1965-01-27'
      thread: transition-and-staff
      c: Johnson names the Acting Attorney General, Katzenbach, Attorney General, and Ramsey Clark Deputy Attorney General. He calls Katzenbach, who comes with his wife a little past 7 to the family quarters; he and Johnson talk of making Washington a law-abiding city.
      n: '[[w.johnson-white-house-diary]], 232–34 (Mrs. Johnson''s account: "the other decision" of the day). See [[cal.1965-01-28.transition-and-staff]]. Made public: 1970. Names: Katzenbach, Clark, Johnson. Check: the day, Mrs. Johnson''s Jan. 27 against the entry of Jan. 28.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:clark-ramsey
- add:
    entry:
      id: cal.1965-01-27.press-and-broadcasting
      when: Jan. 27
      date: '1965-01-27'
      thread: press-and-broadcasting
      c: 'Luci Johnson''s interview with a Chilean newspaperwoman, who sold it to Ebony, runs in a long article; the wire services summarize it. Luci on race: "the problem will be solved only when Negroes are neither loved, hated nor accepted"; politics once the most despicable activity, her view changed by Kennedy''s assassination.'
      n: '[[w.johnson-white-house-diary]], 232–33 (Mrs. Johnson''s account; Luci''s words as she quotes them). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1965-02-03.conservation
      when: Feb. 3
      date: '1965-02-03'
      thread: conservation
      c: 'Laurance Rockefeller and Mrs. Rockefeller to coffee with Lady Bird Johnson: why he has put his life, mind and money into beautification and recreation. He is to chair the National Conference on Beauty that Johnson is calling for mid-May.'
      n: '[[w.johnson-white-house-diary]], 234. Made public: 1970. Names: Rockefeller, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
- add:
    entry:
      id: cal.1965-02-03.poverty
      when: Feb. 3
      date: '1965-02-03'
      thread: poverty
      c: 'About 4 p.m., Lady Bird Johnson''s tea in the Blue Room, at Shriver''s asking, for some thirty: the War on Poverty''s Advisory Council, five Cabinet members, Celebrezze, Freeman, Katzenbach, Udall and Wirtz, and Mrs. McNamara. Singletary, Job Corps director: applications about six thousand a day. Galbraith and A. Philip Randolph present. Shriver asks her to sponsor Head Start, an honorary chairmanship.'
      n: '[[w.johnson-white-house-diary]], 234–35 (Mrs. Johnson''s account). Made public: 1970. Names: Shriver, Celebrezze, Freeman, Katzenbach, Udall, Wirtz, Galbraith, Randolph, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:shriver-r-sargent
      - name:celebrezze-anthony-j
      - name:freeman-orville-l
      - name:katzenbach-nicholas
      - name:udall-stewart-l
      - name:wirtz-w-willard
      - name:galbraith-john-kenneth
      - name:randolph-a-philip
- add:
    entry:
      id: cal.1965-02-03.civil-rights-organizations
      when: Feb. 3
      date: '1965-02-03'
      thread: civil-rights-organizations
      c: The Shoreham. Johnson receives the Democratic Legacy Award of the Anti-Defamation League of B'nai B'rith; he arrives about 10 p.m. in a business suit, without dinner, met by Dore Schary and Abe Feinberg, and speaks.
      n: '[[w.johnson-white-house-diary]], 235–36. To check: 1965 Pub. Papers. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-04.soviet-union-un
      when: Feb. 4
      date: '1965-02-04'
      thread: soviet-union-un
      c: 'Stevenson, waiting to see Johnson, who is held on the telephone, talks with Lady Bird Johnson, who brings a birthday cake: the failure of Russia and others to pay their UN dues for peace-keeping, the Congo and perhaps Gaza; then China.'
      n: '[[w.johnson-white-house-diary]], 236 (Mrs. Johnson''s account: "he talked seriously to me"). Made public: 1970. Names: Stevenson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1965-02-04.republican-party-congress
      when: Feb. 4
      date: '1965-02-04'
      thread: republican-party-congress
      also:
      - program
      c: 'Dirksen at the family quarters, late afternoon, with Johnson in the West Hall for some two hours. Dirksen: "You don''t mind if we denounce you once in a while, do you, Lyndon?" Johnson on his years as Minority Leader under Eisenhower: with the President when he thought him right, against him "with dignity," and no "ugly things about him, nor about his wife, nor about his dog, nor his grandchildren."'
      n: '[[w.johnson-white-house-diary]], 237 (Mrs. Johnson, who left them and returned). Made public: 1970. To check: the President''s Daily Diary, Feb. 4, 1965. Names: Dirksen, Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:dirksen-everett
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-02-05.conservation
      when: Feb. 5
      date: '1965-02-05'
      thread: conservation
      c: 'Lady Bird Johnson''s Women Do-er''s Luncheon, the kick-off of the beautification program: Mary Lasker speaks, "masses of flowers where the masses pass." Senator Neuberger and Mrs. Udall among the guests.'
      n: '[[w.johnson-white-house-diary]], 237–38. Names: Neuberger, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:neuberger-maurine-b
- add:
    entry:
      id: cal.1965-02-05.students
      when: Feb. 5
      date: '1965-02-05'
      thread: students
      c: 'In the Diplomatic Reception Room, Johnson to the more than a hundred students of the Senate Youth Program, sponsored by the Hearst Foundation: why he wants them in government; out of office, he says, he will spend his retirement promoting their interest in it.'
      n: '[[w.johnson-white-house-diary]], 237–38 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-02-08.press-and-broadcasting
      when: Feb. 8
      date: '1965-02-08'
      thread: press-and-broadcasting
      c: Lady Bird Johnson interviewed by six reporters of U.S. News & World Report, from 11, at Grant's Cabinet table in the Treaty Room, about two hours; a stenographer and a tape recorder.
      n: '[[w.johnson-white-house-diary]], 238–39 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-02-09.white-house
      when: Feb. 9
      date: '1965-02-09'
      thread: white-house
      c: John Walker of the National Gallery tells Lady Bird Johnson the transparency she has is a real Copley, of a boy with a squirrel, which she will ask to borrow; he and Mr. Fosburgh favor buying Thomas Sully's portrait of Fanny Kemble for the White House, at $25,000.
      n: '[[w.johnson-white-house-diary]], 239–40 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-02-11.conservation
      when: Feb. 11
      date: '1965-02-11'
      thread: conservation
      c: 'The Committee on Beautification meets with Lady Bird Johnson, Blue Room tea, then the Red Room: Udall, Mary Lasker, Libby Rowe of the National Capital Planning Commission, Owings, Gruen, Walter Washington, Tobriner, Horsky, Boutin, Rogers, Walton, Laurance Rockefeller. She reads Lord Bryce on the capital. The Mall a showcase for the people; the city''s small triangles and squares planted by neighborhood and business volunteers. Norfolk offers five hundred azaleas, Freeman shrubs. Udall names small committees.'
      n: '[[w.johnson-white-house-diary]], 240–42 (Mrs. Johnson''s account). Names: Udall, Rockefeller, Washington, Boutin, Rogers, Walton, Freeman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:rockefeller-laurance-s
      - name:washington-walter-e
      - name:boutin-bernard-l
      - name:rogers-william-p
      - name:walton-william
      - name:freeman-orville-l
- add:
    entry:
      id: cal.1965-02-12.program
      when: Feb. 12
      date: '1965-02-12'
      thread: program
      c: 'Lincoln''s birthday luncheon at the White House, Eric Goldman''s idea, for Lincoln scholars, actors who have played him and heads of the State Civil War Centennial Commissions. In the East Room Johnson receives the Gold Medal of the U.S. Civil War Centennial Commission; his luncheon speech: "love justice, extend liberty, remember you may be wrong, but act when you believe you''re right." Then a wreath at the Lincoln Memorial.'
      n: '[[w.johnson-white-house-diary]], 242–43 (Mrs. Johnson''s account; Mary McGrory the next day: Johnson "had kidnapped Lincoln"). To check: 1965 Pub. Papers. Names: Goldman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:goldman-eric-f
      - name:mcgrory-mary
- add:
    entry:
      id: cal.1965-02-12.transition-and-staff
      when: Feb. 12
      date: '1965-02-12'
      thread: transition-and-staff
      c: 'At 5 p.m. Lady Bird Johnson with Clark Clifford, Bill Heath and Busby on the Lyndon Baines Johnson Library: the University of Texas wants his papers, and proposes land, a building and a School of Political Science or Public Affairs named for him, at several million dollars. At 11 Heath dines with Johnson and Lynda Bird; Johnson shows as much interest in the school as the library.'
      n: '[[w.johnson-white-house-diary]], 243–44. Made public: 1970. Names: Clifford, Busby, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:busby-horace
      - state:tx
- add:
    entry:
      id: cal.1965-02-18.white-house
      when: Feb. 18
      date: '1965-02-18'
      thread: white-house
      c: 'Lady Bird Johnson with Mr. West at the warehouse where the White House furniture not in use is kept: what Mrs. Kennedy''s committees accepted in 1961 and did not place; Theodore Roosevelt''s of 1902, stored in the Truman renovation; the Truman and Eisenhower pieces sent there by Mrs. Kennedy.'
      n: '[[w.johnson-white-house-diary]], 245 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:kennedy-jacqueline
      - name:truman-harry-s
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-03-03.poverty
      when: Mar. 3
      date: '1965-03-03'
      thread: poverty
      c: Ringling Brothers' circus for six thousand poor children chosen by the United Givers Fund; Lady Bird Johnson, their guest, seated among them, with the press and television in front of her.
      n: '[[w.johnson-white-house-diary]], 246–47 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-03-09.conservation
      when: Mar. 9
      date: '1965-03-09'
      thread: conservation
      c: 'Lady Bird Johnson''s Beautification Committee, second meeting, the Yellow Room: Owings shows the Mall''s history and his plan, a sculpture garden, no cars on the Mall, tunnels, a reflecting pool at the Capitol end. Then by minibus: pansies on the Mall, a park triangle at Maryland and Virginia Avenues, Greenleaf Gardens, where she speaks briefly.'
      n: '[[w.johnson-white-house-diary]], 248–50 (Mrs. Johnson''s account). See [[cal.1965-02-11.conservation]]. Names: Udall, Washington, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:udall-stewart-l
      - name:washington-walter-e
- add:
    entry:
      id: cal.1965-03-09.program
      when: Mar. 9
      date: '1965-03-09'
      thread: program
      c: Connally, in town, joins the Johnsons at the ninth Congressional reception, 6:30 p.m., and after the Congressional guests leave stays in the bedroom with Johnson for a long talk.
      n: '[[w.johnson-white-house-diary]], 250 (Mrs. Johnson''s account). Made public: 1970. Names: Connally, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:connally-john
- add:
    entry:
      id: cal.1965-03-11.latin-america
      when: Mar. 11
      date: '1965-03-11'
      thread: latin-america
      c: 'Lunch at the Venezuelan Embassy, Mrs. Tejera Paris hostess, for the wives of the Latin American Ambassadors; Lady Bird Johnson guest of honor, riding with Mrs. Sevilla-Sacasa, wife of the dean of the Corps. The State Department''s precedence difficulties: Venezuela has no relations with some neighbors.'
      n: '[[w.johnson-white-house-diary]], 250–51 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-03-15.voting-rights-10
      when: Mar. 15
      date: '1965-03-15'
      thread: voting-rights
      c: 'From 6 p.m. the address is brought to Johnson a page at a time. He scratches out lines and gives directions to Valenti; at about 7 he calls for the close of the State of the Union: "Let''s talk about teaching the Mexicans in Cotulla, the first job I had after I left college." The teleprompter is not finished.'
      n: '[[w.johnson-white-house-diary]], 252–54 (Mrs. Johnson''s account; the bracket "[the State of the Union]" is hers). See [[cal.1965-03-15.voting-rights]]. Made public: 1970. Names: Valenti, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:valenti-jack
- add:
    entry:
      id: cal.1965-03-15.congress
      when: Mar. 15
      date: '1965-03-15'
      thread: congress
      c: 'After the address Mrs. Johnson goes to the Speaker''s office, the leadership there, then upstairs: Governor and Mrs. LeRoy Collins, Valenti, O''Brien, the Busbys and other staff go over the evening with her. All think it a wonderful speech and delivery; one or two, as she, thought it long.'
      n: '[[w.johnson-white-house-diary]], 253–54 (Mrs. Johnson''s account). See [[cal.1965-03-15.voting-rights]]. Made public: 1970. Names: Collins, Valenti, O''Brien, Busby, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:collins-leroy
      - name:valenti-jack
      - name:busby-horace
- add:
    entry:
      id: cal.1965-03-15.white-house
      when: Mar. 15
      date: '1965-03-15'
      thread: white-house
      c: Mr. West and Mr. Ketchum with Lady Bird Johnson on a letter from Mr. duPont, offering a lovely Aubusson rug from Mrs. Edward Hutton; they decide to accept it, alternates being needed for the Red Room and the Green Room, and one for Mary Lasker's rug in the Blue Room.
      n: '[[w.johnson-white-house-diary]], 251 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-03-28.conservation
      when: Mar. 28
      date: '1965-03-28'
      thread: conservation
      c: 'The White House announces Mary Lasker''s gift: 9,300 azalea bushes, flowering dogwood and other plants for Pennsylvania Avenue.'
      n: '[[w.johnson-white-house-diary]], 254 (Mrs. Johnson''s account, from Camp David). To check: the White House release. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-04-10.poverty
      when: Apr. 10
      date: '1965-04-10'
      thread: poverty
      c: 'Camp Gary, San Marcos, Tex.: the Job Corps camp dedicated in the old auditorium, nearly a hundred boys in residence. Singletary introduces Shriver; Pickle introduces Connally, who introduces the President. Three Corps members speak. Johnson ends with Lincoln and Kennedy looking down on the day.'
      n: '[[w.johnson-white-house-diary]], 257–58 (Mrs. Johnson''s account; she notes Johnson was Texas director of the NYA, which Pickle and Connally had worked for or been paid by). To check: 1965 Pub. Papers. Names: Shriver, Pickle, Connally, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:shriver-r-sargent
      - name:pickle-james-j
      - name:connally-john
      - name:kennedy-john-f
      - state:tx
- add:
    entry:
      id: cal.1965-04-11.intelligence
      when: Apr. 11
      date: '1965-04-11'
      thread: intelligence
      c: At the Junction schoolhouse, after the signing, Johnson tells the newspapermen he has named Admiral Raborn head of the CIA and Richard Helms his Deputy.
      n: '[[w.johnson-white-house-diary]], 259 ("the second big news of the day"). See [[cal.1965-04-11.school-aid]]. Names: Raborn, Helms, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:raborn-william-f-jr
      - name:helms-richard
- add:
    entry:
      id: cal.1965-04-11.elections-1968-johnson
      when: Apr. 11
      date: '1965-04-11'
      thread: elections-1968-johnson
      c: 'At the Ranch, on the boat, Johnson tells Carl Albert and Senator McCarthy he is going to be a teacher and come back there to live. Mrs. Johnson: he is more and more enthusiastic about it.'
      n: '[[w.johnson-white-house-diary]], 259–60 (Mrs. Johnson''s account). Made public: 1970. Names: Albert, McCarthy, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:albert-carl
      - name:mccarthy-eugene-j
      - state:tx
- add:
    entry:
      id: cal.1965-04-16.elections-1968-johnson
      when: Apr. 16
      date: '1965-04-16'
      thread: elections-1968-johnson
      c: The Ranch. Johnson talks more and more of retiring. Mrs. Johnson, for the first time, "about convinced" he could.
      n: '[[w.johnson-white-house-diary]], 260 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1965-04-19.program
      when: Apr. 19
      date: '1965-04-19'
      thread: program
      c: The Ranch. Johnson spends some three hours on the telephone talking foreign problems with McGeorge Bundy, then a long session with Dale Malechek on the Ranch.
      n: '[[w.johnson-white-house-diary]], 261. Made public: 1970. Names: Bundy, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - state:tx
- add:
    entry:
      id: cal.1965-04-19.vietnam-support
      when: Apr. 19
      date: '1965-04-19'
      thread: vietnam-support
      c: 'Aboard Air Force One, to four reporters of the pool, on Vietnam: "If they bomb our barracks or the Saigon Embassy, we never hear anything about it; but if we bomb a radar installation or munitions depot or a bridge, the papers give us hell for it." Of China and Russia saying stop: "It is not all right to bomb people in the North, but it is O.K. to invade the South." How can a Senator, a newspaperman or a student tie the hands of American military men?'
      n: '[[w.johnson-white-house-diary]], 261–62 (Mrs. Johnson''s account, aboard). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - polity:prc
      - polity:ussr
- add:
    entry:
      id: cal.1965-04-19.south-carolina
      when: Apr. 19
      date: '1965-04-19'
      thread: south-carolina
      c: Columbia, S.C. Johnson and Lady Bird Johnson stop on the way from the Ranch to Washington for a memorial service for Senator Olin Johnston, dead the day before, in the State Capitol, where his body lies in state in the rotunda. Governor and Mrs. Russell meet them at the airport. His minister and the Governor speak.
      n: '[[w.johnson-white-house-diary]], 262–63 (Mrs. Johnson''s account). See [[cal.1965-04-22.south-carolina-sc]]. Names: Johnston, Russell, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:johnston-olin-d
      - name:russell-donald-s
      - state:sc
      - city:columbia
- add:
    entry:
      id: cal.1965-04-20.europe-and-the-alliance
      when: Apr. 20
      date: '1965-04-20'
      thread: europe-and-the-alliance
      c: Prime Minister Aldo Moro of Italy arrives; arrival ceremonies on the South Grounds.
      n: '[[w.johnson-white-house-diary]], plates following 278 (the caption: "Arrival ceremonies for Italian Prime Minister Aldo Moro on the South Grounds, April 20"). To check: 1965 Pub. Papers. Names: Moro.'
      tags:
      - name:moro-aldo
- add:
    entry:
      id: cal.1965-04-21.europe-and-the-alliance
      when: Apr. 21
      date: '1965-04-21'
      thread: europe-and-the-alliance
      c: Moro's return reception at the Italian Embassy, Ambassador Fenoaltea hosting; Johnson and Lady Bird Johnson receive in a crush that lasts little more than thirty minutes.
      n: '[[w.johnson-white-house-diary]], 263–64 (Mrs. Johnson''s account). See [[cal.1965-04-20.europe-and-the-alliance]]. Names: Moro, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:moro-aldo
- add:
    entry:
      id: cal.1965-04-21.vietnam-support
      when: Apr. 21
      date: '1965-04-21'
      thread: vietnam-support
      c: 'Dinner at the White House for Max Freedman of the Manchester Guardian, with George McGhee, over from Germany: a united Europe, which de Gaulle has prevented. Johnson sums up Vietnam and the ten-year course of the struggle for Freedman, so that his readers will hear it.'
      n: '[[w.johnson-white-house-diary]], 264 (Mrs. Johnson''s account: "I knew he was working"). Made public: 1970. Names: McGhee, de Gaulle, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcghee-george-c
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1965-04-27.defense
      when: Apr. 27
      date: '1965-04-27'
      thread: defense
      c: 'Dinner for Governor and Mrs. Allan Shivers, then forty-five minutes portal to portal at the U.S. Chamber of Commerce''s annual dinner honoring McNamara; Johnson says a few words on how he depends on McNamara. Mrs. Johnson: Johnson and Shivers, who fought in Texas in 1956, are friends again.'
      n: '[[w.johnson-white-house-diary]], 264–65 (Mrs. Johnson''s account). To check: 1965 Pub. Papers. Names: McNamara, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - state:tx
- add:
    entry:
      id: cal.1965-05-04.program
      when: May 4
      date: '1965-05-04'
      thread: program
      c: 'The first National Medal for Literature, to Thornton Wilder for the whole body of his work, at a White House gathering of authors, publishers and critics. Mrs. Johnson: one of the cultural events of which Eric Goldman and Roger Stevens are the midwives.'
      n: '[[w.johnson-white-house-diary]], 266–67 (Mrs. Johnson''s account; the day follows "Tuesday, May 4"). To check: 1965 Pub. Papers. Names: Goldman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:goldman-eric-f
- add:
    entry:
      id: cal.1965-05-05.poverty
      when: May 5
      date: '1965-05-05'
      thread: poverty
      c: Lady Bird Johnson at the Trinity AME Zion Church, Cardozo, Washington, to see a pilot Head Start project, three- to five-year-olds with a medical examination and a hot meal a day. She goes so that Sunday's announcement of Head Start for 600,000 children in about two thousand communities gets more attention.
      n: '[[w.johnson-white-house-diary]], 267–69 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - city:washington
- add:
    entry:
      id: cal.1965-05-05.program
      when: May 5
      date: '1965-05-05'
      thread: program
      also:
      - latin-america-dominican-republic
      c: The Diplomatic Reception, black tie, the whole Corps, 114 countries. At 9 the OAS is to meet on whether to join the United States in sending troops to the Dominican Republic; the OAS members leave at nine, Johnson shortly after. Sevilla-Sacasa, the dean of the Corps, first in the line; photographs of each couple jam it.
      n: '[[w.johnson-white-house-diary]], 268–69 (Mrs. Johnson''s account). See [[cal.1965-05-06.latin-america]]. Names: Johnson. Check: the hour of the OAS meeting.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-05-05.soviet-union
      when: May 5
      date: '1965-05-05'
      thread: soviet-union
      c: At the Diplomatic Reception, Dobrynin and Rusk sit on the sofa in the Red Room for over an hour, talking quietly.
      n: '[[w.johnson-white-house-diary]], 268. Names: Dobrynin, Rusk.'
      tags:
      - name:dobrynin-anatoly
      - name:rusk-dean
- add:
    entry:
      id: cal.1965-05-06.congress
      when: May 6
      date: '1965-05-06'
      thread: congress
      c: The Congressional Club's annual brunch, the Shoreham, a thousand present; Mrs. O'Konski, the Republican chairman, and Mrs. Holifield, her Democratic co-chairman, meet Lady Bird Johnson in conductors' caps. The theme is her Whistlestop; the club gives her the original of the cartoon of the Lady Bird Special train.
      n: '[[w.johnson-white-house-diary]], 269–70 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-05-11.conservation
      when: May 11
      date: '1965-05-11'
      thread: conservation
      c: Virginia. Lady Bird Johnson's "Landscape-Landmark Tour" by bus, with the Cabinet wives but Mrs. Rusk, the Laurance Rockefellers, Roger Stevens, Rex Whitten of the Bureau of Public Roads, Nash Castro and California State Senator Fred Farr; forty reporters follow on a press bus. She dedicates the Dumfries Wayside Shelter with Governor Harrison and plants a dogwood. Interstate 95 against Highway One, with its billboards. Monticello, then Abingdon.
      n: '[[w.johnson-white-house-diary]], 270–73 (Mrs. Johnson''s account). Names: Rockefeller, Harrison, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:rockefeller-laurance-s
      - state:va
- add:
    entry:
      id: cal.1965-05-11.program
      when: May 11
      date: '1965-05-11'
      thread: program
      c: 'Abingdon, Va. Lady Bird Johnson presents the Barter Theatre award to Roger Stevens, in front of the cast of Julius Caesar: a Virginia ham, a scholarship for two young actors, an acre on the mountain.'
      n: '[[w.johnson-white-house-diary]], 272–73 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - state:va
- add:
    entry:
      id: cal.1965-05-18.japan
      when: May 18
      date: '1965-05-18'
      thread: japan
      c: The return reception for President and Mrs. Chung Hee Park of Korea at the Mayflower, thousands of guests in a room meant for hundreds.
      n: '[[w.johnson-white-house-diary]], 274–75 (Mrs. Johnson''s account). See [[cal.1965-05-17.japan-and-korea]]. Names: Park, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:park-chung-hee
- add:
    entry:
      id: cal.1965-06-01.program
      when: June 1
      date: '1965-06-01'
      thread: program
      c: 'Washington Cathedral, Luci Johnson''s graduation from National Cathedral School. Johnson speaks from the floor, not the pulpit: after a few words on homework, asking pardon of the girls for the solemn talk of an old man, a foreign policy speech. He kisses Luci and sits through the ceremony.'
      n: '[[w.johnson-white-house-diary]], 277–78 (Mrs. Johnson''s account). To check: 1965 Pub. Papers. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-06-01.republican-party
      when: June 1
      date: '1965-06-01'
      thread: republican-party
      c: 'A stag party at the White House for General Eisenhower, some fifty men. Eisenhower and Johnson put their heads in at the door of the Reception Room, where Mrs. Johnson is with the decorators. Mrs. Johnson: glad they can be friends.'
      n: '[[w.johnson-white-house-diary]], 279. Made public: 1970. To check: the President''s Daily Diary, June 1, 1965. Names: Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-06-03.states-and-cities
      when: June 3
      date: '1965-06-03'
      thread: states-and-cities
      c: 'St. Thomas, V.I. Lady Bird Johnson gives the commencement address at the College of the Virgin Islands, its first, eleven graduates, Governor Paiewonsky introducing her: train the islands'' young at home to keep their brains and talent. She stands in the reception line an hour and a half, perhaps two thousand people.'
      n: '[[w.johnson-white-house-diary]], 280–82 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-06-10.conservation
      when: June 10
      date: '1965-06-10'
      thread: conservation
      c: On the Potomac, on a hired boat, Lady Bird Johnson films for ABC's beautification program with John Secondari. The engine fails; the boat drifts toward shore and the Secret Service takes her off by police boat.
      n: '[[w.johnson-white-house-diary]], 283–84 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-06-10.white-house
      when: June 10
      date: '1965-06-10'
      thread: white-house
      c: Rebekah Harkness, giving the White House a portable stage for the East Room, to cocktails at 6 with two of her Foundation's officers; Jo Mielziner, who designed it, and a model; all aluminum, a third the weight of the present one.
      n: '[[w.johnson-white-house-diary]], 284–85 (Mrs. Johnson''s account). Names: Johnson.'
      tags:
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-06-15.transition-and-staff
      when: June 15
      date: '1965-06-15'
      thread: transition-and-staff
      c: 'In the East Room at 5:30 Lady Bird Johnson, for the President, receives the Inaugural Committee''s workers: a gold medallion for him, a silver one for the Vice President, the first copy of a book to pay the Inauguration''s expenses. Johnson looks in for under five minutes: "the best Inauguration any President ever had." Humphrey stays and speaks: "I enjoyed every living minute."'
      n: '[[w.johnson-white-house-diary]], 287–88 (Mrs. Johnson''s account). Names: Humphrey, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-06-17.space-2
      when: June 17
      date: '1965-06-17'
      thread: space
      c: The Rose Garden. Johnson pins NASA Exceptional Service Medals on McDivitt, White and Charles W. Mathews, before their families and a garden full of press; the astronauts give him a small flag carried on their sixty-two orbits. He calls them "the Christopher Columbuses of the twentieth century." He asks them and their families to stay the night.
      n: '[[w.johnson-white-house-diary]], 288–89 (Mrs. Johnson''s account). See [[cal.1965-06-17.space]]. To check: 1965 Pub. Papers. Names: McDivitt, White, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:mcdivitt-james-a
      - name:white-edward-h-ii
- add:
    entry:
      id: cal.1965-06-17.crime-and-hijacking
      when: June 17
      date: '1965-06-17'
      thread: crime-and-hijacking
      c: Thomas E. Dewey, at the White House, hours of the day with Johnson on crime in the District of Columbia, as a model for the nation. At dinner after midnight Johnson, Dewey, Humphrey, White, McDivitt and Mathews; Johnson has Dewey stay the night.
      n: '[[w.johnson-white-house-diary]], 290–92 (Mrs. Johnson''s account). See [[cal.1965-06-17.space]]. Made public: 1970. Names: Dewey, Humphrey, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:dewey-thomas-e
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1965-07-02.press-and-broadcasting
      when: July 2
      date: '1965-07-02'
      thread: press-and-broadcasting
      c: 'St. Matthew''s Cathedral, 2 p.m.: Luci Baines Johnson baptized a Catholic by Father James Montgomery, Johnson, Mrs. Johnson and Lynda present with a few friends. Mrs. Johnson''s two-sentence statement, left with Liz Carpenter for the press in "another fifteen minutes or so": she "has been taking instructions from Father James Montgomery since last September." Less than fifteen minutes; no camera in sight.'
      n: '[[w.johnson-white-house-diary]], 292–94 (Mrs. Johnson''s account; the statement as she quotes it). Made public: 1970. Names: Carpenter, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:carpenter-liz
- add:
    entry:
      id: cal.1965-07-02.program
      when: July 2
      date: '1965-07-02'
      thread: program
      c: 'Aboard Air Force One, New York to Austin, Johnson with Carl Albert, in the main cabin: "If Martin Luther King wants to catch up with me, he has got to get up early and march fast." Thurgood Marshall for Solicitor General, then perhaps the Court. Howard Smith in the way of the Area Redevelopment bill; Albert: "I want to wait a few more Thursdays." Johnson: "We can''t beat the Russians with Judge Smith in charge"; the program by Oct. 3, next year transportation, and out "before Easter." Proudest: Catholics, Protestants and Jews together in the Education Bill.'
      n: '[[w.johnson-white-house-diary]], 294–95 (Mrs. Johnson''s account; Senator Morse and Ambassador Lodge also aboard on the way up). Made public: 1970. Names: Albert, King, Marshall, Smith, Johnson. Check: the Area Redevelopment bill, so named by Mrs. Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:albert-carl
      - name:king-martin-luther-jr
      - name:marshall-thurgood
      - name:smith-howard-w
- add:
    entry:
      id: cal.1965-07-13.transition-and-staff
      when: July 13
      date: '1965-07-13'
      thread: transition-and-staff
      c: 'News conference, watched at the Ranch: Leonard Marks named to head the USIA, replacing Carl Rowan; Penelope Thunberg a Tariff Commissioner. Asked whether Rusk may resign: "None whatever. ... He sits to my right in the Cabinet Room, he ranks first in the Cabinet, and he ranks first with me."'
      n: '[[w.johnson-white-house-diary]], 295–96 (Mrs. Johnson''s account, from the television). See [[cal.1965-07-13.court]]. To check: 1965 Pub. Papers. Names: Marks, Rowan, Rusk, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:marks-leonard-h
      - name:rowan-carl-t
      - name:rusk-dean
- add:
    entry:
      id: cal.1965-07-16.transition-and-staff
      when: July 16
      date: '1965-07-16'
      thread: transition-and-staff
      c: National Cathedral, the funeral service for Adlai Stevenson, some two thousand present; Judge Carl McGowan's eulogy. Johnson attends with Mrs. Johnson, Luci and Fulbright. Before it, in the hall, Johnson with Fulbright on Stevenson's successor.
      n: '[[w.johnson-white-house-diary]], 298–99 (Mrs. Johnson''s account). See [[cal.1965-07-14.transition-and-staff]]. Names: Stevenson, Fulbright, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:stevenson-adlai-e
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1965-07-16.court-fortas
      when: July 16
      date: '1965-07-16'
      thread: court-fortas
      c: 'The Truman Balcony, after 9 p.m.: Johnson, Mrs. Johnson, Abe and Carol Fortas. Johnson goes over possible Ambassadors to the UN: Clark Clifford, then Arthur Goldberg. Then to Fortas, a place on the Supreme Court if a vacancy comes; Fortas moved, quiet, grateful.'
      n: '[[w.johnson-white-house-diary]], 299–300 (Mrs. Johnson''s account). See [[cal.1965-07-14.transition-and-staff]]. Made public: 1970. Names: Fortas, Clifford, Goldberg, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:fortas-abe
      - name:clifford-clark
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1965-07-17.alabama
      when: July 17
      date: '1965-07-17'
      thread: alabama
      c: 'Lunch at the White House for the Steinbecks and the Grahams: Billy Graham on his meetings in Dothan, Montgomery and Birmingham, all integrated and peaceful, the largest eighteen thousand; the national wire carried nothing. Then to Camp David.'
      n: '[[w.johnson-white-house-diary]], 301 (Mrs. Johnson''s account of Graham''s). Names: Graham, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:graham-billy
      - state:al
- add:
    entry:
      id: cal.1965-07-18.crime-and-hijacking
      when: July 18
      date: '1965-07-18'
      thread: crime-and-hijacking
      c: 'Camp David. Katzenbach, to Mrs. Johnson by the pool, on crime in the District: a $100,000 insurance policy on each policeman, college men for the force or night courses, two-way radios; young first offenders to training homes, repeaters down from 70 percent, she thinks, to 30 or 40. Johnson wants the war on crime "won yesterday."'
      n: '[[w.johnson-white-house-diary]], 302–03 (Mrs. Johnson''s account). Made public: 1970. Names: Katzenbach, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
- add:
    entry:
      id: cal.1965-07-18.press-and-broadcasting
      when: July 18
      date: '1965-07-18'
      thread: press-and-broadcasting
      c: Camp David. Johnson wants John Chancellor for the Voice of America; Mrs. Johnson urges him to consider the USIA post. Chancellor, bowling with them, solemnly says he will consider it.
      n: '[[w.johnson-white-house-diary]], 303. Made public: 1970. Names: Chancellor, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:chancellor-john
- add:
    entry:
      id: cal.1965-07-21.court-fortas
      when: July 21
      date: '1965-07-21'
      thread: court-fortas
      c: 'Fortas to Mrs. Johnson: his decision of Friday night, not to accept a Supreme Court post. He is responsible for his firm''s forty-two lawyers and about 168 people; "If the President was faced with any real troubles, I would want to be around to help him." She asks if it is irrevocable; Johnson must soon appoint.'
      n: '[[w.johnson-white-house-diary]], 304 (Mrs. Johnson''s account). Made public: 1970. Names: Fortas, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:fortas-abe
- add:
    entry:
      id: cal.1965-07-21.press-and-broadcasting
      when: July 21
      date: '1965-07-21'
      thread: press-and-broadcasting
      c: 'Dinner on the Truman Balcony: Johnson, Mrs. Johnson, James Hagerty of ABC, Moyers and the Valentis, on the Press Secretary''s job. Hagerty: get someone who understands television, as Robert Montgomery for Eisenhower; advice to Moyers on the timing and number of releases. With Mrs. Johnson, on the ABC beautification show.'
      n: '[[w.johnson-white-house-diary]], 305–06 (Mrs. Johnson''s account). Made public: 1970. Names: Hagerty, Moyers, Valenti, Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:hagerty-james-c
      - name:moyers-bill
      - name:valenti-jack
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1965-08-12.poverty
      when: Aug. 12
      date: '1965-08-12'
      thread: poverty
      c: 'New Jersey. Lady Bird Johnson sees Head Start at the Cleveland Elementary School, Newark, and at Lambertville, with Shriver, Governor and Mrs. Hughes and Mayor Addonizio; a press conference in the classroom. Her point: eight weeks are "a drop in the bucket." At Morven, tea in a tent for several hundred New Jersey educators, clergymen and Head Start officials.'
      n: '[[w.johnson-white-house-diary]], 308–11 (Mrs. Johnson''s account). Names: Shriver, Hughes, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:shriver-r-sargent
      - name:hughes-richard-j
      - state:nj
      - city:newark
- add:
    entry:
      id: cal.1965-08-12.conservation
      when: Aug. 12
      date: '1965-08-12'
      thread: conservation
      c: A ceremony, all the Hoover family present, making Herbert Hoover's birthplace a historical site.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, of Johnson''s day, as he told it that night). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-12.program
      when: Aug. 12
      date: '1965-08-12'
      thread: program
      c: Dinner on the Sequoia for thirty-five Ambassadors from countries scattered round the world, three and a half hours, Johnson moving about the boat to cover the crowd.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, as Johnson told it at Andrews). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-08-12.economy
      when: Aug. 12
      date: '1965-08-12'
      thread: economy
      c: Johnson, in the day, a fiscal talk with Henry Fowler.
      n: '[[w.johnson-white-house-diary]], 311 (Mrs. Johnson, of Johnson''s day, as he told it). Made public: 1970. Names: Fowler, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:fowler-henry-h
- add:
    entry:
      id: cal.1965-09-02.transition-and-staff
      when: Sept. 2
      date: '1965-09-02'
      thread: transition-and-staff
      c: Independence, Mo. Lady Bird Johnson, Bill Heath, Max Brooks and Roy White inspect the Truman Library for the Johnson Library; Truman gives the tour, Mrs. Truman and Dr. Philip Brooks with them, then lunch at the Old Apple Farm. No press at the airstrip; a few cameras at the Library.
      n: '[[w.johnson-white-house-diary]], 312–14 (Mrs. Johnson''s account). See [[cal.1965-02-12.transition-and-staff]]. Names: Truman, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:truman-harry-s
      - state:mo
- add:
    entry:
      id: cal.1965-09-02.program
      when: Sept. 2
      date: '1965-09-02'
      thread: program
      c: 'Abilene, Kan. The same party at the Eisenhower Library a few minutes before the 4:30 closing, Dr. William Aeschbacher the director; cameras and microphones at the front. Dedicated two years before, not yet open to scholars. Mrs. Johnson''s view: the legislation, the decisions, to be displayed dramatically; library and museum to be melded.'
      n: '[[w.johnson-white-house-diary]], 314–15 (Mrs. Johnson''s account). See [[cal.1965-02-12.transition-and-staff]]. Names: Eisenhower, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:eisenhower-dwight-d
      - state:ks
- add:
    entry:
      id: cal.1965-09-07.succession
      when: Sept. 7
      date: '1965-09-07'
      thread: succession
      c: 'The Ranch, about 4 a.m. Johnson has "awful pains in his stomach"; he forbids calling Dr. Burkley until dawn, who thinks kidney stones. An electrocardiogram. Mrs. Johnson is to go on to the Garden Club meeting at Jackson Hole; Johnson is to rest and return to Washington. His feeling: "as long as we really knew nothing, we should say nothing."'
      n: '[[w.johnson-white-house-diary]], 316–17 (Mrs. Johnson''s account). Made public: 1970. Names: Burkley, Johnson. Check: the hour and the diagnosis, a gall bladder attack, Oct. 5.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:burkley-george-g
      - state:tx
- add:
    entry:
      id: cal.1965-09-07.conservation
      when: Sept. 7
      date: '1965-09-07'
      thread: conservation
      c: 'Jackson Hole, Wyo. The American Forestry Association''s dinner for about five hundred; Senator Clinton Anderson receives its Distinguished Service Award. During the dinner Johnson telephones Mrs. Johnson from the Ranch: X-rays, Dr. Hurst; it sounds like gallstones; he will keep his appointments and make no more or any statement; tests next day. Laurance Rockefeller introduces her.'
      n: '[[w.johnson-white-house-diary]], 318–20 (Mrs. Johnson''s account). Made public: 1970. Names: Anderson, Rockefeller, Hurst, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:anderson-clinton-p
      - name:rockefeller-laurance-s
      - name:hurst-e-h
      - state:wy
- add:
    entry:
      id: cal.1965-09-10.states-and-cities
      when: Sept. 10
      date: '1965-09-10'
      thread: states-and-cities
      c: 'Johnson leaves the White House about 5 p.m. for New Orleans, to survey the damage of Hurricane Betsy; back about 1 a.m., he checks the Departments by telephone: food flown in, medicine and cots.'
      n: '[[w.johnson-white-house-diary]], 320 (Mrs. Johnson''s account; she reached the White House a little before midnight). Made public: 1970. To check: the President''s Daily Diary, Sept. 10, 1965. Names: Johnson. Check: the day, which Mrs. Johnson''s Sept. 11 entry gives by the hours before 1 a.m.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:la
      - city:new-orleans
- add:
    entry:
      id: cal.1965-10-03.program
      when: Oct. 3
      date: '1965-10-03'
      thread: program
      c: 'New York. The Goldbergs'' dinner for the Johnsons in their Waldorf Towers suite: the Nelson Rockefellers, the McCormacks, the Rusks, Cardinal Spellman, Fanfani, U Thant, the Mansfields, the Javitses, Robert Kennedy, Mayor Wagner and others. Goldberg recites a Hebrew prayer for peace. Spellman offers a gift for the Johnson Library. Demonstrators below, against Vietnam and the Dominican Republic.'
      n: '[[w.johnson-white-house-diary]], 323–24 (Mrs. Johnson''s account). See [[cal.1965-10-03.desegregation-schools]]. Made public: 1970. Names: Goldberg, Rockefeller, McCormack, Rusk, Spellman, Fanfani, Mansfield, Javits, Kennedy, Wagner, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:goldberg-arthur-j
      - name:rockefeller-nelson
      - name:mccormack-john-w
      - name:rusk-dean
      - name:spellman-francis
      - name:fanfani-amintore
      - name:mansfield-mike
      - name:javits-jacob-k
      - name:kennedy-robert-f
      - name:wagner-robert-f-jr
      - city:new-york
- add:
    entry:
      id: cal.1965-10-05.succession
      when: Oct. 5
      date: '1965-10-05'
      thread: succession
      c: At 5:30 Mrs. Johnson tells Liz Carpenter and Bess Abell that at 6 Moyers will announce Johnson's gall bladder attack of Labor Day night and operation at Bethesda Thursday night, Friday morning. She will stay at the hospital the two weeks; invitations are canceled.
      n: '[[w.johnson-white-house-diary]], 324 (Mrs. Johnson''s account). See [[cal.1965-10-08.succession]]. Names: Carpenter, Moyers, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:carpenter-liz
      - name:moyers-bill
- add:
    entry:
      id: cal.1965-10-06.congress
      when: Oct. 6
      date: '1965-10-06'
      thread: congress
      c: At 5 the East Room, a reception for the new Democratic members of the 89th Congress. Johnson welcomes and thanks them; Larry O'Brien shows by charts the seventy bills of January, their progress, and the four yet to come to the floor.
      n: '[[w.johnson-white-house-diary]], 326 (Mrs. Johnson''s account). Names: O''Brien, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:obrien-lawrence-f
- add:
    entry:
      id: cal.1965-10-06.europe-and-the-alliance
      when: Oct. 6
      date: '1965-10-06'
      thread: europe-and-the-alliance
      c: Upstairs at the White House, the Jacob Epstein bust of Churchill accepted from his wartime friends, Harriman's idea. Harriman's tribute; Johnson speaks briefly; Sir Patrick Dean replies; Mrs. Johnson speaks. Among the donors Ambassador Bruce, Spaatz, Anderson and Eaker; Churchill's grandson.
      n: '[[w.johnson-white-house-diary]], 327 (Mrs. Johnson''s account). Names: Harriman, Bruce, Dean, Churchill, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:bruce-david-k-e
      - name:dean-patrick
- add:
    entry:
      id: cal.1965-10-11.foreign-aid
      when: Oct. 11
      date: '1965-10-11'
      thread: foreign-aid
      c: 'Bethesda. Clark Clifford with Johnson on aid to foreign countries and the UN. Johnson: of Goldberg, "we have got a billion dollars in chips in your pile and don''t you put them in until you can win the hand." "I am just like a dog on a point."'
      n: '[[w.johnson-white-house-diary]], 328. Made public: 1970. Names: Clifford, Goldberg, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:clifford-clark
      - name:goldberg-arthur-j
- add:
    entry:
      id: cal.1965-10-11.soviet-union
      when: Oct. 11
      date: '1965-10-11'
      thread: soviet-union
      c: Bethesda. Rusk, an hour with Johnson, brings good wishes from the leaders of the Soviet Union and brings him up to date on a number of matters.
      n: '[[w.johnson-white-house-diary]], 328. Made public: 1970. Names: Rusk, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:rusk-dean
      - polity:ussr
- add:
    entry:
      id: cal.1965-10-21.vietnam-support
      when: Oct. 21
      date: '1965-10-21'
      thread: vietnam-support
      c: 'Bethesda, leaving the hospital, Johnson stops in a ward of Marines wounded in Vietnam: "when I feel pretty blue at night, and I issue the orders that you carry out, I do it with a heavy heart." Patients at the windows: "Good luck, Mr. President." "The military is behind you."'
      n: '[[w.johnson-white-house-diary]], 329 (Mrs. Johnson''s account). See [[cal.1965-10-08.succession]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1965-10-30.white-house
      when: Oct. 30
      date: '1965-10-30'
      thread: white-house
      c: 'The Ranch. Peter Hurd''s portrait of Johnson, unpacked two days before, unveiled to him and the Hurds: Johnson can find nothing good in it; Mrs. Johnson dislikes the violet background, the figure and the hands. Hurd to rework the background and reduce it, omitting the hands, and perhaps leave the Capitol dome lighted.'
      n: '[[w.johnson-white-house-diary]], 330–32 (Mrs. Johnson''s account). Made public: 1970. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1965-11-02.elections-1965
      when: Nov. 2
      date: '1965-11-02'
      thread: elections-1965
      c: Johnson City, Tex. Johnson and Lady Bird Johnson vote first, 8 a.m., the Pedernales Electric Co-op Building, before the press and flashing cameras, Judge McNatt handing them the ballots. Then he leads some twenty cars of press over ranch roads, and telephones instructions about a sick cow, a cattle guard, a fence crew.
      n: '[[w.johnson-white-house-diary]], 332–33 (Mrs. Johnson''s account). See [[cal.1965-11-02.state-constitutions-tx]]. Names: Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - state:tx
- add:
    entry:
      id: cal.1965-11-03.economy
      when: Nov. 3
      date: '1965-11-03'
      thread: economy
      c: 'The Ranch. Johnson, on a long drive and then at dinner with Moyers and the newspaper people, in discussing foreign affairs: "this country is in trouble because we cannot any longer make things bigger and better than other countries. We have put Germany and Japan back in business and they are selling their heads off."'
      n: '[[w.johnson-white-house-diary]], 336. Made public: 1970. Names: Moyers, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:moyers-bill
      - polity:frg
- add:
    entry:
      id: cal.1965-12-14.south-asia
      when: Dec. 14
      date: '1965-12-14'
      thread: south-asia
      c: 'The state dinner for Ayub Khan, 137 guests. His toast, to Johnson as "a friend": relations "to a certain extent, been soiled" through lack of understanding of each other''s difficulties; the war with "our big neighbor, India." Bhutto at Mrs. Johnson''s left. After dinner Johnson takes Ayub and some Ministers upstairs for about thirty minutes.'
      n: '[[w.johnson-white-house-diary]], 337–40 (Mrs. Johnson''s account). See [[cal.1965-12-14.india-and-china]]. To check: 1965 Pub. Papers. Names: Ayub Khan, Bhutto, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:ayub-khan-mohammad
      - name:bhutto-zulfikar-ali
- add:
    entry:
      id: cal.1965-12-20.europe-and-the-alliance-2
      when: Dec. 20
      date: '1965-12-20'
      thread: europe-and-the-alliance
      c: 'The state dinner for Chancellor Erhard. Johnson, in his toast: a Commission to Europe shortly on joint explorations in space; "There will be peace in Vietnam the very moment that others are ready to stop their attacks." Erhard, in German: the United States is making great sacrifices for the security of Vietnam, "But that is also our security. ... I feel ashamed, because what we can contribute is very modest."'
      n: '[[w.johnson-white-house-diary]], 341–42 (Mrs. Johnson''s account). See [[cal.1965-12-20.europe-and-the-alliance]]. To check: 1965 Pub. Papers. Names: Erhard, Schroeder, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      - name:erhard-ludwig
      - name:schroder-gerhard
- cite:
