    text: 'Check: Mrs. Johnson''s diary (232–34) has Johnson naming Katzenbach Attorney General and Ramsey Clark Deputy on Jan. 27, Katzenbach and his wife at the family quarters that evening; [[cal.1965-01-27.transition-and-staff]].'
