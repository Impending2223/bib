- cite:
    id: cal.1965-03-15.voting-rights
    item: '[[w.johnson-white-house-diary]], 252–54 (the address to Congress at 9 p.m., forty-two minutes, two rising ovations in it; the Cotulla close; "open your polling places to all your people"; J. Edgar Hoover and four clergymen in her gallery; not the title)'
