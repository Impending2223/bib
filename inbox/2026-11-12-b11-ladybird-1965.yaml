    id: cal.1965-05-21.program
    item: '[[w.johnson-white-house-diary]], 275–77 (the lunch for the Hirshhorns, the Roger Stevenses, the Dillon Ripleys, the Sam Harrises, the Abe Fortases; Stevens: the building ten million, Hirshhorn a million toward it; Johnson came in and said the White House should have one of the Eakins, not the contract words)'
