- cite:
    id: cal.1965-05-02.latin-america
    item: '[[w.johnson-white-house-diary]], 265 (Mrs. Johnson, at the Ranch, watched a twenty-minute news clip of "his TV report to the nation on the Dominican Republic": to save lives, to prevent a Communist takeover; not the words)'
