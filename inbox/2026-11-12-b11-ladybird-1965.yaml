- cite:
    id: cal.1965-10-05.program
    item: '[[w.johnson-white-house-diary]], 325 (the stag dinner of Oct. 5, one of a series; guests David Susskind, Wayne Dehoney, Barnaby Keeney; Gregory Peck and Hugh O''Brian among the men in Johnson''s bedroom near one o''clock; not Fowler or the speaker-writer)'
    units: '?'
- cite:
    id: cal.1965-10-06.health
    item: '[[w.johnson-white-house-diary]], 326 (the East Room signing, 10 a.m., "the $340 million bill providing grants to regional medical centers"; Lister Hill, Mary Lasker; "a bunch of little Mayos"; not the Stat. or three years)'
    units: '?'
- cite:
    id: cal.1965-10-08.succession
    item: '[[w.johnson-white-house-diary]], 324 (Oct. 5, 5:30: Moyers "would announce briefly" at 6 that Johnson had had a gall bladder attack on Labor Day night and would enter Bethesda Thursday night, operated on Friday morning; not the Humphrey understanding)'
    units: '?'
- cite:
    id: cal.1965-10-21.cities-and-housing
    item: '[[w.johnson-white-house-diary]], 329 (Oct. 21: "The Rent Subsidy Bill had been scuttled"; Johnson''s face darkened; not the vote)'
    units: '?'
- cite:
    id: cal.1965-11-03.transition-and-staff
    item: '[[w.johnson-white-house-diary]], 334–35 (O''Brien sworn Postmaster General on the porch of the Hye post office, a country store; Gronouski sworn at the Ranch)'
    units: '?'
- cite:
    id: cal.1965-12-14.india-and-china
    item: '[[w.johnson-white-house-diary]], 336–39 (the arrival ceremony, the state dinner, Johnson and Ayub Khan upstairs about thirty minutes; not the joint statement)'
    units: A
