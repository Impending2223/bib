    entry:
      id: cal.1968-05-28.elections-1968-6
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      also:
      - students
      c: 'University of Denver. Rockefeller: protest has healthy purposes, but protesters "must respect the proper methods and limits"; with Columbia''s officials, reason over muscle.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-05-28.elections-1968-7
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      c: New Jersey. Governor Hughes concedes McCarthy might win 20 delegates; McCarthy's announced goal, 15.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1376. Names: Hughes, McCarthy.'
      tags:
      - name:hughes-richard-j
      - name:mccarthy-eugene-j
      - state:nj
- add:
    entry:
      id: cal.1968-05-28.elections-1968-8
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      c: Tennessee. Governor Ellington, for Humphrey, will withdraw as favorite son after the State convention of June 28 and poll the delegation; its 51 votes expected for Humphrey.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Names: Ellington, Humphrey.'
      tags:
      - name:ellington-buford
      - name:humphrey-hubert-h
      - state:tn
- add:
    entry:
      id: cal.1968-05-28.elections-1968-state-conventions
      when: May 28
      date: '1968-05-28'
      thread: elections-1968-state-conventions
      c: Delaware's Republican delegation elects Clayton Harrison, the State chairman, for Nixon, and Harry Haskell, the national committeeman, for Rockefeller, its cochairmen; eight for Nixon, four for Rockefeller, by report.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. CQ prints "delegation to the Republican National Committee" (1383); the convention meant. Names: Nixon, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
      - state:de
- add:
    entry:
      id: cal.1968-05-28.elections-1968-9
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      c: 'California. The *Sacramento Bee*: Rafferty''s headquarters selling $100 chances on a $3,000 sports car and other prizes for the "Rafferty Rallies" of June 2; a confidential memorandum: no publicity, lest it be taken for "a ''raffle'' or a ''lottery.''" A lottery unlawful in the State.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1372. Names: Rafferty.'
      tags:
      - name:rafferty-max
      - state:ca
- add:
    entry:
      id: cal.1968-05-29.elections-1968
      when: May 29
      date: '1968-05-29'
      thread: elections
      also:
      - china
      c: 'McCarthy on China: a new policy needed for a settlement in Vietnam; "abandon the fantasy" of Formosa''s return to the mainland; recognition, the "basic requirement"; trade; a "free and reciprocal" cultural exchange; the military posture reassessed; China urged to sign the test ban treaty.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1379. McCarthy: "For too long America has acted as if China did not exist" (1379). Names: McCarthy.'
      tags:
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1968-05-29.elections-1968-2
      when: May 29
      date: '1968-05-29'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'California. McCarthy''s spokesmen put his outlays in the State at $850,000, $250,000 of it given after Oregon; a Kennedy aide, Kennedy''s at $900,000, "within $20,000 one way or the other." Printed in the *Los Angeles Times*, May 30. The *New York Times*, June 3: McCarthy near $1 million, Kennedy probably over $2 million.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1371.'
      tags:
      - state:ca
- add:
    entry:
      id: cal.1968-05-29.elections-1968-3
      when: May 29
      date: '1968-05-29'
      thread: elections-1968
      also:
      - jobs-and-wages
      c: 'Washington. Humphrey to the National Alliance of Businessmen: 200,000 "needy young people" to be hired for the summer.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-05-29.elections-1968-4
      when: May 29
      date: '1968-05-29'
      thread: elections-1968
      c: Reagan "personally pleased and gratified" with his 22.8 percent in Oregon; Nixon's "impressive and solemn victory" will draw the uncommitted and favorite-son delegations.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1380. Names: Reagan, Nixon.'
      tags:
      - name:reagan-ronald
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-05-29.elections-1968-5
      when: May 29
      date: '1968-05-29'
      thread: elections-1968
      c: 'Rockefeller to Wyoming Republicans: Nixon lost in 1960 from a strong position, carrying Illinois "until he got to Chicago," New York until New York City, Pennsylvania until Philadelphia; nothing since to put him "in a better position to do that job."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-05-29.elections-1968-6
      when: May 29
      date: '1968-05-29'
      thread: elections-1968
      c: 'Las Vegas. Rockefeller about two hours in private with Nevada''s Republican delegates: "at least half of the 12 votes" informally his, the *Las Vegas Sun* reports May 30. The delegation uncommitted to the convention.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:nv
- add:
    entry:
      id: cal.1968-05-29.elections-1968-state-conventions
      when: May 29
      date: '1968-05-29'
      thread: elections-1968-state-conventions
      c: Nebraska's Republican delegation elects Hruska, for Nixon, its chairman, unanimously.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Hruska, Nixon.'
      tags:
      - name:hruska-roman-l
      - name:nixon-richard-m
      - state:ne
- add:
    entry:
      id: cal.1968-05-30.elections-1968-2
      when: May 30
      date: '1968-05-30'
      thread: elections-1968
      also:
      - amendments
      c: 'Gettysburg. Humphrey''s Memorial Day address: the vote at 18, indirectly; war "thrust upon us," and youth asking whether it may be "invoked by fathers when it must be fought by sons denied any part in the calling of it."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-05-30.elections-1968-3
      when: May 30
      date: '1968-05-30'
      thread: elections-1968
      also:
      - economy-surcharge
      c: Dallas, the Texas Republican State Committee's dinner. Nixon praises Johnson for accepting a $6 billion cut, to "restore confidence in the dollar"; the three Democrats to back it, the liberal Democrats' votes in the House "being withheld"; glad Johnson "agrees with me" on the vote at 18.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Names: Nixon, Johnson.'
      tags:
      - name:nixon-richard-m
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-05-30.elections-1968-4
      when: May 30
      date: '1968-05-30'
      thread: elections-1968
      c: 'A Wallace aide: Wallace to resume his campaign June 6, after a month''s seclusion since his wife''s death; Maine, Massachusetts and Maryland, then fund-raising speeches in 11 Southern cities. His aides: on the ballot in 22 States, five more virtually assured.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Wallace.'
      tags:
      - name:wallace-george-c
- add:
    entry:
      id: cal.1968-05-31.elections-1968-2
      when: May 31
      date: '1968-05-31'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'San Francisco. Robert Kennedy: McCarthy''s "great crusade" a "campaign to distort me and stop me," of the McCarthy committee''s advertisement charging him with the original commitment in Vietnam, the Dominican Republic and the Bay of Pigs. "If blame is to be assessed, that Administration and I have to take responsibility"; he spoke out on Vietnam in 1965.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1370. June 1, in the debate, McCarthy says he had canceled the advertisement (1370). Names: Robert Kennedy, McCarthy.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - state:ca
      - city:san-francisco
- add:
    entry:
      id: cal.1968-05-31.elections-1968-3
      when: May 31
      date: '1968-05-31'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'San Diego. McCarthy on Kennedy''s word that he would abide by the California result: "the threat of a child holding his breath" no threat "anyone ought to honor very much."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1370. Kennedy, Los Angeles, May 29: Oregon a "setback I could ill afford"; he "would abide by the results of the California primary" (1370). Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:ca
- add:
    entry:
      id: cal.1968-05-31.republican-party
      when: May 31
      date: '1968-05-31'
      thread: republican-party
      also:
      - elections-1968
      c: 'The Ripon Society''s report on Reagan, 16,000 words: "unqualified for any national post requiring a high degree of administrative or diplomatic responsibility," the vice presidency included; "simplistic" at home, preoccupied with military force abroad; no "puppet on a string."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1380. Names: Reagan.'
      tags:
      - name:reagan-ronald
- add:
    entry:
      id: cal.1968-05-31.elections-1968-4
      when: May 31
      date: '1968-05-31'
      thread: elections-1968
      c: 'Reagan''s press conference, on the Ripon Society''s report: "I''ve been attacked by extremist groups before and I''ve never bothered to answer."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1380. See [[cal.1968-05-31.republican-party]]. Names: Reagan.'
      tags:
      - name:reagan-ronald
- add:
    entry:
      id: cal.1968-05-31.elections-1968-5
      when: May 31
      date: '1968-05-31'
      thread: elections-1968
      c: 'Atlanta. Nixon, after meeting the Southern Republican State chairmen: "I''m not asking the Southern chairmen for commitments"; Stewart of Oklahoma and Robertson of Tennessee read endorsements; Thurmond calls him "a great man," short of endorsing; Callaway named his Southern regional chairman. At his news conference, on Rockefeller''s charge that he lacks executive experience: Rockefeller has little in foreign affairs; "the man behind must always see that he can knock down the man in front."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Holshouser of North Carolina and Carpenter of Virginia had endorsed him already (1382). See [[cal.1968-05-31.elections-1968]]. Names: Nixon, Thurmond, Callaway, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:thurmond-strom
      - name:callaway-howard-h
      - name:rockefeller-nelson
- add:
    entry:
      id: cal.1968-05-31.elections-1968-6
      when: May 31
      date: '1968-05-31'
      thread: elections-1968
      c: 'The *Boston Globe*''s survey of New England''s Republican delegates, published May 31: Rockefeller 70, Nixon 25, uncommitted 3, of the six States'' 98 votes.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-06-01.elections-1968-2
      when: June 1
      date: '1968-06-01'
      thread: elections-1968
      c: 'Fayetteville, Ark., the University of Arkansas''s commencement. Humphrey''s "youths'' bill of rights": the vote at 18; a larger role for students; a college education for every American; ways to serve.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Check: Fayetteville; CQ names the university only. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:ar
- add:
    entry:
      id: cal.1968-06-01.elections-1968-3
      when: June 1
      date: '1968-06-01'
      thread: elections-1968
      c: 'Humphrey''s office: an Issues Task Force, Robert Nathan, once chairman of Americans for Democratic Action, its coordinator; Brzezinski for foreign policy; Doak Barnett an "after Vietnam Task Force."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Humphrey, Brzezinski, Barnett.'
      tags:
      - name:humphrey-hubert-h
      - name:brzezinski-zbigniew
      - name:barnett-a-doak
- add:
    entry:
      id: cal.1968-06-01.elections-1968-4
      when: June 1
      date: '1968-06-01'
      thread: elections-1968
      c: Percy would accept the vice presidency with Nixon if "released" by the people of Illinois and the State's party leaders; Nixon has named him among several considered.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Names: Percy, Nixon.'
      tags:
      - name:percy-charles-h
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-06-01.elections-1968-state-conventions-3
      when: June 1
      date: '1968-06-01'
      thread: elections-1968-state-conventions
      c: Orlando. Florida's Republican State convention re-elects Cramer national committeeman, Governor Kirk's candidate, Nathaniel Reed, withdrawing; Paula Hawkins national committeewoman. The State chairman Murfin and Cramer keep the party; the delegation virtually assured for Nixon.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Cramer, Kirk, Nixon.'
      tags:
      - name:cramer-william-c
      - name:kirk-claude-r-jr
      - name:nixon-richard-m
      - state:fl
- add:
    entry:
      id: cal.1968-06-01.elections-1968-5
      when: June 1
      date: '1968-06-01'
      thread: elections-1968
      c: 'North Carolina''s Republican runoff for the Senate: Somers, the Rowan County solicitor, over Zimmerman, 8,018 to 5,329, 60.1 percent; fewer than five percent of the State''s 375,807 registered Republicans voting. Ervin his opponent.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1378. CQ''s figures, from 1,962 of 2,191 precincts; the runoff''s cost about $415,000 (1378). Check: the State canvass. Names: Ervin.'
      tags:
      - name:ervin-sam-j-jr
      - state:nc
- add:
    entry:
      id: cal.1968-06-01.elections-1968-6
      when: June 1
      date: '1968-06-01'
      thread: elections-1968
      c: Lansing. Humphrey asks Michigan's Democratic State convention for its support.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Edward Kennedy urged the convention to stay uncommitted until after California; Cavanagh for Robert Kennedy (1382); undated. Check: Lansing; CQ does not name the place. See [[cal.1968-06-02.elections-1968-state-conventions]]. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
      - state:mi
- add:
    entry:
