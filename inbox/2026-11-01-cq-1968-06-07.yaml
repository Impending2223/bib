      when: June 2
      date: '1968-06-02'
      thread: elections
      also:
      - robert-kennedy-campaign
      c: 'ABC, *Issues and Answers*. Robert Kennedy: after California he and McCarthy might "join together" those wanting "a new direction"; ready to join forces to stop Humphrey.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1370. Names: Robert Kennedy, McCarthy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-02.elections-1968-2
      when: June 2
      date: '1968-06-02'
      thread: elections-1968
      c: 'CBS, *Face the Nation*. McCarthy: "I will not join with him in order to stop Hubert Humphrey"; he might support Humphrey or Kennedy, as the issues are clarified.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1371. Names: McCarthy, Humphrey, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:humphrey-hubert-h
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1968-06-02.elections-1968-3
      when: June 2
      date: '1968-06-02'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'McCarthy: Kennedy''s "scare tactics"; his word in the debate that McCarthy''s plan would "take 10,000 black people and move them into Orange County" "a crude distortion of my proposals."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1371. See [[cal.1968-06-01.elections-1968]]. Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
