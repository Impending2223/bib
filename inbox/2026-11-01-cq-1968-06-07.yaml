      c: On Robert Kennedy's death, the candidates for President suspend their campaigns indefinitely.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1369. See [[cal.1968-06-05.robert-kennedy]]. Names: Robert Kennedy.'
      tags:
