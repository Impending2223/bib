- add:
    entry:
      id: cal.1968-06-04.elections-1968-2
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'California''s House primaries, the south. 17th District, King retiring, Democratic: Glenn Anderson, former lieutenant governor, over John Gibson, 25,552 to 15,983, 35.5 percent, six others; Republican: Joe Blatchford over Richard Howard, 10,351 to 9,828, 34.1 percent, three others. 19th: Holifield over George Medina, 54,215 to 17,365, 75.7 percent. 21st: Hawkins over David Scott, 61,564 to 5,347, 83.7 percent, two others. 22nd: Corman over Mildred Simon, 64,808 to 11,441, 85.0 percent; Republican: Joe Holt, former Representative, over Bruce Thabit, 24,863 to 10,121, 55.3 percent, two others. 26th: Rees over Nathan Holden, 78,127 to 23,739, 76.7 percent. 27th: Reinecke over Jim Miller, 63,350 to 4,315, 88.9 percent, William Gale 3,561, 5.0 percent. 28th: Bell over Carl Miciak, 82,024 to 7,159, 92.0 percent. 29th: Brown over Eddie Ramirez, 47,291 to 14,823, 65.8 percent, Peter Lynch 9,783, 13.6 percent; Republican: Bill Orozco over Edward Ashdown, 23,400 to 5,980, 71.5 percent, Raymond Giandomenico 3,343, 10.2 percent. 31st: Charles Wilson over Ben Wyatt, 49,457 to 14,218, 57.3 percent, four others. 34th, Republican: Bill Teague over Lawrence Stafford, 39,807 to 12,601, 76.0 percent. 35th: Utt over William Dougherty, 89,843 to 16,182, 74.9 percent, Robert Jones 13,974, 11.6 percent. 37th, Republican: Mike Schaefer over Jack McClure, 29,274 to 7,541, 75.4 percent, James Wucher 1,998, 5.2 percent. 38th, Republican: Robert Hunter over Lee Badger, 27,781 to 21,502, 53.8 percent, R. L. Read 2,382, 4.6 percent.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1373–75. CQ''s figures, from almost complete returns; every incumbent opposed renominated; the north''s races not printed (1373). CQ''s list of the nominees, every district (1374). Check: the State''s *Statement of Vote*. Names: King, Glenn Anderson, Holifield, Hawkins, Corman, Rees, Reinecke, Bell, Brown, Wilson, Utt.'
      tags:
      - name:king-cecil-r
      - name:anderson-glenn-m
      - name:holifield-chet
      - name:hawkins-augustus-f
      - name:corman-james-c
      - name:rees-thomas-m
      - name:reinecke-edwin
      - name:bell-alphonzo
      - name:brown-george-e-jr
      - name:wilson-charles-h
      - name:utt-james-b
      - state:ca
- add:
    entry:
      id: cal.1968-06-04.elections-1968-3
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'New Jersey''s delegate primaries. Democratic: the uncommitted organization slate headed by Governor Hughes 61 of the 80 places, McCarthy''s slate 19, in the 5th, 7th and 12th Districts; a slate pledged to Jesse Gray beaten at large. Republican: Case''s uncommitted organization slate all 40 places, most of them thought for Rockefeller; the Essex County Reform Republicans beaten at large and in three districts.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1376. No count of the write-ins for President: Nixon''s backers claim 50,000, after spending $80,000; Rockefeller''s under 10,000 (1376). Mercer County might give McCarthy one more (1376). See [[cal.1968-06-04.elections-1968]]. Names: Hughes, McCarthy, Case, Rockefeller.'
      tags:
      - name:hughes-richard-j
      - name:mccarthy-eugene-j
      - name:case-clifford-p
      - name:rockefeller-nelson
      - state:nj
- add:
    entry:
      id: cal.1968-06-04.elections-1968-4
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'New Jersey''s House primaries, the incumbents opposed all renominated. 9th District, Republican: Peter Moraites, the Assembly''s majority leader, over Mary Louis Rhea, 12,225 to 1,350, 90.1 percent. 10th, Republican: Celestino Clemente, the organization''s, over Robert Citrino of the Essex County Reform Republicans, 12,640 to 11,619, 52.1 percent, Nicholas Molino not reported. 11th, Republican: George Wallhauser Jr. over Donald MacArt, 11,627 to 5,819, 66.6 percent, Jack Burmeister not reported; Minish over Jerry Burmeister. 1st, Democratic: Thomas Higgins. 2nd, Democratic: David Dichter. 3rd, Republican: Marcus Daly. 8th, Republican: Richard DeMarco. 13th: Gallagher renominated; 14th: Daniels.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1376–77. CQ''s figures, incomplete returns; returns for three districts only (1376). Check: the counts, the State''s *Results of the Primary Election*. Names: Minish, Gallagher, Daniels.'
      tags:
      - name:minish-joseph-g
      - name:gallagher-cornelius-e
      - name:daniels-dominick-v
      - state:nj
- add:
    entry:
      id: cal.1968-06-04.robert-kennedy-campaign
      when: June 4
      date: '1968-06-04'
      thread: robert-kennedy-campaign
      also:
      - elections-1968
      c: 'Los Angeles, a statement hours before the shooting. Robert Kennedy: the South Dakota result "confirm[s] absolutely that the people of this nation want a change"; it is Humphrey''s home State, "a major effort was made there in his behalf."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1377. South Dakota, from 1,582 of 1,587 precincts: the Kennedy slate 32,157, 49.7 percent; the Johnson slate, for Humphrey, 19,304, 29.9; McCarthy''s 13,215, 20.4; at least 24 of the 26 votes his. Nixon''s slate unopposed, 71,042 (1377). See [[cal.1968-06-04.elections-1968]]. Names: Robert Kennedy, Humphrey.'
      tags:
      - name:kennedy-robert-f
      - name:humphrey-hubert-h
      - state:ca
      - city:los-angeles
- add:
    entry:
      id: cal.1968-06-04.elections-1968-5
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'South Dakota''s House primaries. 1st District, Democratic: Frank Denholm over Boyd Bennett, 14,973 to 10,099, 59.7 percent; Reifel the incumbent. 2nd, Republican: Berry over Robert Schumacher, a State representative, 28,224 to 16,172, 63.6 percent.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1377. CQ''s figures, complete but unofficial (1377). Check: the State canvass. Names: Reifel, Berry.'
      tags:
      - name:reifel-ben
      - name:berry-e-y
      - state:sd
- add:
    entry:
      id: cal.1968-06-04.elections-1968-6
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'Alabama''s Democratic runoff. For the Senate, Hill retiring: James Allen, former lieutenant governor, over Selden, 198,443 to 190,928, 51.0 percent, a 7,515-vote margin. 5th District: Walter Flowers over Richard Manley, 23,844 to 20,709, 53.5 percent.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1378. CQ''s figures: the Senate from 99 percent of 4,159 precincts; the 5th from 359 of 560 (1378). Allen on Selden''s "Washington crowd"; Selden produces Quayle''s strategy paper for Allen, "a puppet of the New York crowd" (1378). Check: the State canvass. Names: Hill, Allen, Selden.'
      tags:
      - name:hill-lister
      - name:allen-james-b
      - name:selden-armistead-i-jr
      - state:al
- add:
    entry:
      id: cal.1968-06-04.elections-1968-7
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'Montana''s House primaries. 1st District: Olsen over Harriet Miller, Superintendent of Public Instruction, 30,359 to 20,302, 59.9 percent; Republican: Richard Smiley over Wayne Montgomery, 23,045 to 9,603, 70.6 percent. 2nd, Democratic: Robert Kelleher over Gerald Hudson, 16,232 to 7,065, 69.7 percent; Battin unopposed.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1378. CQ''s figures, almost complete returns (1378). Check: the State''s official canvass. See [[cal.1968-06-04.governors-mt]]. Names: Olsen, Battin.'
      tags:
      - name:olsen-arnold
      - name:battin-james-f
      - state:mt
- add:
    entry:
      id: cal.1968-06-04.elections-1968-8
      when: June 4
      date: '1968-06-04'
      thread: elections-1968
      c: 'Mississippi''s House primaries, the four incumbents opposed renominated. 1st District: Abernethy over Thelma Barnes, a Negro civil rights worker, 27,502 to 8,343, 76.7 percent. 3rd: Griffin over Bob Mitchell, 25,537 to 3,361, 79.4 percent, David Perkins 2,278, 7.1 percent, E. L. McDaniel, once Grand Dragon of the United Klans, 994, 3.1 percent. 4th: Montgomery over Clarence Hall Jr., 18,474 to 4,248, 81.3 percent. 5th: Colmer over J. C. Killingsworth, 15,060 to 1,159, 85.4 percent, Jim Holaday 816, 4.6 percent, J. H. C. Thomas Sr. 595, 3.4 percent.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1379. CQ''s figures, partial returns: the 1st from 158 of 336 precincts, the 3rd 229 of 315, the 4th 200 of 510, the 5th 333 of 487 (1379). Check: the State canvass. Names: Abernethy, Griffin, Montgomery, Colmer.'
      tags:
      - name:abernethy-thomas-g
      - name:griffin-charles-h
      - name:montgomery-gillespie-v
      - name:colmer-william-m
      - state:ms
- add:
    entry:
      id: cal.1968-06-05.assassination
      when: June 5
      date: '1968-06-05'
      thread: assassination
      also:
      - robert-kennedy-campaign
      c: 'The Senate Appropriations subcommittee, then the full committee: an amendment to the Treasury-Post Office bill, H.R. 16489, for Secret Service protection of the major candidates for President and Vice President, the Secretary to consult the four leaders and a fifth they choose; $2 million added, $400,000 for fiscal 1968. Reported, S. Rept. 1165. Monroney: secret hearings before the shooting; Johnson asked for the funds three weeks before.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1368. The White House, 1 p.m.: a detail with each announced candidate, Humphrey''s already; none for Reagan (1368). See [[cal.1968-06-05.robert-kennedy]]. Names: Monroney, Johnson.'
      tags:
      - name:monroney-almer-s
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-06-05.assassination-2
      when: June 5
      date: '1968-06-05'
      thread: assassination
      also:
      - robert-kennedy-campaign
      c: Ramsey Clark orders the FBI to assist California's authorities, under Title I of the Civil Rights Act of 1968; no evidence of a conspiracy, he says.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1367, 1369. Title I made it a federal crime to injure "any person because he is...a candidate for elective office" (1369). Sirhan charged at a secret arraignment, 7 a.m., six counts of assault with intent to murder, bail $250,000 (1367). Check: the day of the order. See [[cal.1968-06-05.robert-kennedy]]. Names: Clark.'
      tags:
      - name:clark-ramsey
      - state:ca
- add:
    entry:
      id: cal.1968-06-06.assassination
      when: June 6
      date: '1968-06-06'
      thread: assassination
      also:
      - robert-kennedy-campaign
      c: The Senate, meeting though a member has died, passes the Treasury-Post Office bill with the Secret Service amendment, 75–0. Hall objects to taking it up in the House without conference; Mahon has H.J. Res. 1292, protection for the rest of fiscal 1968, adopted by voice vote, the Senate following minutes later. The bill to conference.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1368. Mansfield: the family had told him "this is what Bob would like to have done" (1368). Check: the roll call on Voteview. See [[cal.1968-06-05.assassination]]. Names: Hall, Mahon, Mansfield.'
      tags:
      - name:hall-durward-g
      - name:mahon-george-h
      - name:mansfield-mike
