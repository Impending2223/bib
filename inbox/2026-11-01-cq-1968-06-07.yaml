      c: Washington. Humphrey to the Textile Workers Union of America's convention; the union endorses him, unanimously.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
