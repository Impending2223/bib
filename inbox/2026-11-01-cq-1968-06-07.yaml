      when: June 2
      date: '1968-06-02'
      thread: opinion
      also:
      - elections-1968
      c: 'California. The State Poll, by secret ballot: Kuchel 51.5 percent, Rafferty 45.6, the rest for the other three.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1372. See [[cal.1968-05-22.opinion-2]]. Names: Kuchel, Rafferty.'
      tags:
      - name:kuchel-thomas-h
      - name:rafferty-max
      - state:ca
- add:
    entry:
      id: cal.1968-06-02.elections-1968-4
      when: June 2
      date: '1968-06-02'
      thread: elections-1968
      c: Montoya endorses Humphrey.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Stokes of Cleveland also for Humphrey; undated (1381). Names: Montoya, Humphrey.'
      tags:
      - name:montoya-joseph-m
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-06-03.elections-1968-2
      when: June 3
      date: '1968-06-03'
      thread: elections-1968
      c: 'Milwaukee. Rockefeller predicts he will win the nomination and the election: "the tide has turned." To Negro leaders: the party should "make a choice," "not just pay off political debts." His aides: television spots attacking Nixon from mid-June.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Rockefeller, Nixon.'
      tags:
      - name:rockefeller-nelson
      - name:nixon-richard-m
      - state:wi
