patch: 2026-11-01-cq-1968-06-07
by: reader (Claude), CQ Weekly Report, June 7, 1968
ops:
- add:
    entry:
      id: cal.1968-05-10.republican-party
      when: May 10
      date: '1968-05-10'
      thread: republican-party
      c: 'Washburn, the Republican National Committee''s finance director, lists the only authorized fund drives credited to the States'' quotas: $10 sustaining memberships; associates, $1,000 and $3,000; the House-Senate dinners, Mar. 5 in Washington and Aug. 4 in Miami; the Boosters Club; the Congressional Committee Newsletter, $25.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1380.'
- add:
    entry:
      id: cal.1968-05-17.elections-1968
      when: May 17
      date: '1968-05-17'
      thread: elections
      c: Newark. Nixon at a Republican fund-raising dinner; his backers after New Jersey's delegates.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1376. Check: the dinner''s sponsor and Nixon''s words; CQ gives the date and place only. Names: Nixon.'
      tags:
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1968-05-22.opinion-2
      when: May 22
      date: '1968-05-22'
      thread: opinion
      also:
      - elections-1968
      c: 'California. The *Los Angeles Times* State Poll, released May 22: for the Republican nomination for the Senate, Kuchel 50 percent, Rafferty 33, the rest undecided; Cranston over Rafferty, 49 to 32.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1372. Names: Kuchel, Rafferty, Cranston.'
      tags:
      - name:kuchel-thomas-h
      - name:rafferty-max
      - name:cranston-alan
      - state:ca
- add:
    entry:
      id: cal.1968-05-24.elections-1968-2
      when: May 24
      date: '1968-05-24'
      thread: elections-1968
      c: 'Idaho. District Judge Alfred C. Hagan, on the Wallace forces'' suit: the American Independent party has a constitutional right to the ballot, but the court will not set a way onto it contrary to the statutes.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Hagan: he did "not feel" the right required the court "to legislate a practical method" (1383). Names: Wallace.'
      tags:
      - name:wallace-george-c
      - state:id
- add:
    entry:
      id: cal.1968-05-25.elections-1968-state-conventions-2
      when: May 25
      date: '1968-05-25'
      thread: elections-1968-state-conventions
      c: Pennsylvania's Republican delegation, 64 votes, elects Governor Shafer its chairman; he will be its favorite son, to keep it united.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Shafer: "keep the delegation united so Pennsylvania''s voice can be heard loud and clear" (1383). Names: Shafer.'
      tags:
      - name:shafer-raymond-p
      - state:pa
- add:
    entry:
      id: cal.1968-05-26.elections-1968
      when: May 26
      date: '1968-05-26'
      thread: elections
      c: 'California. Rafferty to a sportsmen''s rally: the State "the pornography capital of the nation"; a strict federal gun law opposed in his text, a ban on interstate shipment of handguns favored in his remarks. Of Cranston: "heaven forbid this kind of man."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1372. Rafferty on mail-order rifles: to be "controlled by the dealers themselves" (1372). Names: Rafferty, Cranston.'
      tags:
      - name:rafferty-max
      - name:cranston-alan
      - state:ca
- add:
    entry:
      id: cal.1968-05-27.elections-1968-2
      when: May 27
      date: '1968-05-27'
      thread: elections-1968
      c: Missouri. Governor Hearnes withdraws as favorite son; for Humphrey, unofficially.
      n: '[[w.cq-weekly-report]], June 7, 1968, 1382. Names: Hearnes, Humphrey.'
      tags:
      - name:hearnes-warren-e
      - name:humphrey-hubert-h
      - state:mo
- add:
    entry:
      id: cal.1968-05-27.elections-1968-3
      when: May 27
      date: '1968-05-27'
      thread: elections-1968
      c: 'Missouri. The *St. Louis Post-Dispatch*: 13 of the 14 Republican delegates chosen for Nixon, one uncommitted; most of the 10 still to be chosen expected for him; Reagan the second choice.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1383. Names: Nixon, Reagan.'
      tags:
      - name:nixon-richard-m
      - name:reagan-ronald
      - state:mo
- add:
    entry:
      id: cal.1968-05-28.elections-1968-4
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      also:
      - robert-kennedy-campaign
      c: 'University of California at Davis. McCarthy''s seven points for "an open America": work or an assured income, the ghettos'' people in their institutions, mass transit, six million housing units in five years, medical care in the central cities, training for minorities, schools. Kennedy''s approach to the cities a new "ghetto paternalism": "Certainly apartheid offers no solution."'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1370–71, 1379. Check: whether the charge against Kennedy (1370–71, "On May 28") was made at Davis (1379). Names: McCarthy, Robert Kennedy.'
      tags:
      - name:mccarthy-eugene-j
      - name:kennedy-robert-f
      - state:ca
- add:
    entry:
      id: cal.1968-05-28.elections-1968-5
      when: May 28
      date: '1968-05-28'
      thread: elections-1968
      also:
      - labor
      c: 'Humphrey to the International Ladies Garment Workers'' convention: elect a liberal Congress, "the ''how'' of social progress in America depends on a lot more than the Presidency"; campaign forums promised. Its 951 delegates endorse him before he speaks.'
      n: '[[w.cq-weekly-report]], June 7, 1968, 1381. Names: Humphrey.'
      tags:
      - name:humphrey-hubert-h
