- edit:
    id: cal.1964-08-05.vietnam-7
    base: e5cee5a9
    set:
      n: '[110 Cong. Rec. 18,075](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-2-1.pdf) (1964) (Senate, Aug. 5, 1964); [110 Cong. Rec. 18,252](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-2-2.pdf) (1964) (House, Aug. 5, 1964). After the message: [[cal.1964-08-05.vietnam]]. After [[cal.1964-08-05.vietnam-congress|the meeting in Mansfield''s office]], where it was agreed that Fulbright would introduce the resolution in the Senate "later that day" ([[w.mann-grand-delusion]], 357). The Senate sat from noon to 7:39 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=1), [D391](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=389). The House sat from noon to 4:58 p.m.: [Daily Digest, D3](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=1), [D393](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=391). [[w.dallek-flawed-giant]], 153 (the resolution sent to Congress the same day). See [[cal.1964-08-02.vietnam]]. Names: Fulbright, Hickenlooper, Russell, Saltonstall, Morgan.'
- edit:
    id: cal.1964-08-06.vietnam-congress
    base: 31f5ce57
    set:
      n: '[110 Cong. Rec. 18442–47](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf#page=2) (Aug. 7, 1964) (Morse, "the predated declaration of war," 18442; Gruening with him, 18447; the length of Morse''s speech not given). [110 Cong. Rec. 18458–59](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf#page=18) (Aug. 7, 1964). [110 Cong. Rec. 18456–57](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-4-1.pdf#page=16) (Aug. 7, 1964). [110 Cong. Rec. 18410–11](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf#page=72) (Aug. 6, 1964). [110 Cong. Rec. 18,399–471](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf) (1964) (Aug. 6–7). [[w.gibbons-u-s-government-and]], II, 316–25; [[w.mcnamara-in-retrospect]], ch. 5 at n.13 (Cooper and Fulbright: "That is the way I would interpret it"). [[w.mann-grand-delusion]], 361–66; [[w.woods-fulbright]], 354–55 (Nelson; Gruening, "a predated declaration of war"; McGovern; Fulbright: "very unwise under any circumstances to put a large land army on the Asian Continent"); [[w.logevall-choosing-war]], 203–04 (Morse and Gruening alone raised serious objections; Morse spoke Aug. 5, 6 and 7); [[w.zaroulis-who-spoke-up]], 22–23 (nine hours in the Senate, Morse''s overnight break and attack; Gruening; Nelson''s amendment and Fulbright''s answer; Aiken, Brewster, Church, Cooper, Gore, Javits, McGovern voting aye despite doubts). After [[cal.1964-08-06.vietnam|the joint hearing]], which sat from 9 a.m. (McNamara, in that entry''s note): the Senate met at noon, [110 Cong. Rec. 18,339](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf#page=1) (1964), and Fulbright reported the resolution from Foreign Relations, [110 Cong. Rec. 18,341](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt14/pdf/GPO-CRECB-1964-pt14-3-2.pdf#page=3) (1964), before the debate. Check: Logevall, 204, gives "a predated declaration of war" to Gruening, not Morse; he has Nelson announce an amendment to avoid "a direct military involvement," which Fulbright moved against as unnecessary ("the last thing we want to do is to become involved in a land war in Asia"). See [[cal.1964-08-06.vietnam]]. Names: Nelson, Fulbright, Morse, Gore, Aiken, Mansfield, McGovern, Brewster, Cooper, Russell, Gruening.'
- edit:
    id: cal.1964-08-10.vietnam
    base: e5b2e166
    set:
      n: 'Statute (K–J Cong. II.J.2). Remarks Upon Signing Joint Resolution of the Maintenance of Peace and Security in Southeast Asia, [1963–64 Pub. Papers 946](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=186) (Aug. 10, 1964). [FRUS 1964–68, I, doc. 308](https://history.state.gov/historicaldocuments/frus1964-68v01/d308) (editorial note). [[w.kaplan-mcnamara-ascendancy-1961-1965]], 523; [[w.zaroulis-who-spoke-up]], 23 (signed Aug. 10 before the cameras). After [[cal.1964-08-10.vietnam-commitments|the 12:35 p.m. meeting in the Cabinet Room]]: Bundy''s call of 9:50 a.m. has "the signing at four" ([[cal.1964-08-10.vietnam-5]]). See [[cal.1964-08-02.vietnam]]. Names: Johnson.'
- edit:
    id: cal.1964-08-25.mississippi-3
    base: 6210e884
    set:
      n: '[[w.branch-pillar-of-fire]], 472–73; [[w.kotz-judgment-days]], 219. Check: Kotz gives more than thirty Freedom Democrats smuggled in, and Johnson''s words to the three loyal regulars as "You saved your state" (219). That night, after the compromise: [[cal.1964-08-25.mississippi]]. After [[cal.1964-08-25.mississippi-4|the Freedom Democrats'' vote against the compromise]], held "earlier Tuesday evening" ([[w.kotz-judgment-days]], 219); Rauh returns the credentials after the delegates'' vote to reject ([[w.branch-pillar-of-fire]], 470–72). To check: *Washington Post*, Aug. 27, 1964, at 2 (cited by [[w.branch-pillar-of-fire]], 472); Interview with Joseph Rauh, Oct. 17, 1983 (cited by [[w.branch-pillar-of-fire]], 472); Belfrage, Freedom Summer, pp. 252–54 (cited by [[w.branch-pillar-of-fire]], 472); *Washington Post*, Aug. 26, 1964, at 6 (cited by [[w.branch-pillar-of-fire]], 472); Fred Berger of Natchez, Randolph Holladay of Picayune, and Douglas Wynn of Greenville. Mills, This Little Light, p. 131 (cited by [[w.branch-pillar-of-fire]], 472); [Conversation with DOUGLAS WYNN, 9:33 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-douglas-wynn-august-26-1964), Conversation WH6408-38-5209 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 472); [Conversation with WALTER JENKINS, 9:33 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-walter-jenkins-august-26-1964-1), Conversation WH6408-38-5210 (Miller Center) (cited by [[w.branch-pillar-of-fire]], 472); Walter Adams to Walter Jenkins, Sept. 1, 1964, PL1/ST24, Box 81, LBJ Library (cited by [[w.branch-pillar-of-fire]], 472); [[w.dittmer-local-people]], 299 (cited by [[w.branch-pillar-of-fire]], 473). See [[cal.1964-08-25.mississippi]]. Names: Paul Johnson, Rauh, Jenkins, Watson, Johnson.'
- edit:
    id: cal.1964-08-25.mississippi-4
    base: bbf75beb
    set:
      n: '[[w.kotz-judgment-days]], 219. On the compromise: [[cal.1964-08-25.mississippi]]. After [[cal.1964-08-25.democratic-party|the talks in Humphrey''s suite]]: from there the leaders go with King to the basement of Union Temple Baptist, where the delegates vote to reject ([[w.branch-pillar-of-fire]], 470). To check: Joseph Rauh, interviewed by Anne Romaine, 1966, 339–52 (cited by [[w.kotz-judgment-days]], 219 n.71). See [[cal.1964-08-25.mississippi]]. Names: Martin Luther King, Henry, Baker.'
- edit:
    id: cal.1964-08-27.elections-1964-2
    base: 807f6e5b
    set:
      n: 'Remarks Before the National Convention Upon Accepting the Nomination, [1963–64 Pub. Papers 1009](https://www.govinfo.gov/content/pkg/PPP-1964-book1/pdf/PPP-1964-book1.pdf#page=249) (Aug. 27, 1964). [[w.zelizer-fierce-urgency-of-now]], 155 ("Most Americans want medical care for older citizens. And so do I"); [[w.kotz-judgment-days]], 222 ("Every American has the right to be treated as a person"); [[w.dallek-flawed-giant]], 161 (the acceptance set for Aug. 27, his fifty-sixth birthday); [[w.young-two-suns-of-the]], 140 (a listless speech; Jenkins: applause after every line; the *Times*: "Death by Boredom"); [[w.goldberg-barry-goldwater]], 212 (Johnson''s acceptance, Aug. 27, 1964: the choice "between courage and timidity"; not the mandate''s words or the program); [[w.johnson-white-house-diary]], 192 (Johnson accepts the nomination before the convention on the night of Aug. 27, "the answer to my letter"; not the words). After [[cal.1964-08-27.elections-1964-3|Humphrey''s acceptance]]: "When Humphrey finished, LBJ addressed the delegates" ([[w.young-two-suns-of-the]], 140). See [[cal.1964-08-24.elections-1964]]; [[cal.1964-05-22.program]]. Names: Johnson.'
- edit:
    id: cal.1964-08-04.vietnam-tonkin
    base: 1d047383
    set:
      n: '[[w.cosmas-joint-chiefs-of-staff-2012]], 107. After [[cal.1964-08-04.vietnam-tonkin-12|the National Security Council]], which agreed on the strikes at 6:15 p.m.: the line''s "after the Pierce Arrow order"; the strike order went out at 7:22 p.m. by McNamara''s account (in the note of [[cal.1964-08-04.vietnam]]), and the deployment message is dated 050043Z, 8:43 p.m. in Washington (Cosmas''s note, below). Check: the B-57s'' day of arrival. To check: JCS 7729 to CINCPAC, CINCSTRIKE and CINCSAC, 050043Z Aug 64 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 107 n.24); NMCC OPSUM 102-64, Aug. 5, 1964 (cited by [[w.cosmas-joint-chiefs-of-staff-2012]], 107 n.24). See [[cal.1964-08-02.vietnam]].'
