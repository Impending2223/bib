# Batch 3 resumed (Nov. 4, 2026), reader "advisers": Woods, *J. William Fulbright, Vietnam, and the Search for a
# Cold War Foreign Policy* (1998; w.woods-j-william-fulbright-vietnam), pp. 141-181 (1967-68) set against the
# calendar; the papers of government on pp. 132-136 (R8); the witnesses of the notes behind b3-woods-2's and -3's
# entries and cites. The owner's copy, born-digital text (printed page = PDF page - 8). The Record read on
# govinfo for the days cited. New entries claimed in the ledger (b3-woods-4); the rest additive. Ops on
# b3-woods-2's ids wait until that patch lands. The book-check: notes/book-checks/woods-j-william-fulbright-vietnam.md.
patch: b3-woods-4
by: Claude (batch 3 resumed, advisers group; Woods, J. William Fulbright, Vietnam)
ops:
- add:
    entry:
      id: cal.1966-01-28.vietnam-air-war
      when: Jan. 28
      date: '1966-01-28'
      thread: vietnam-air-war
      c: 'Rostow, head of State''s policy planning staff, to Harriman: a war of attrition in the South; bomb the North,
        its oil stores and its power plants; mine Haiphong harbor. "I would use our air power as our equivalent to guerrilla
        warfare."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 133. Check: Woods writes of a conversation; the note cites a paper of
        Rostow''s to Harriman. To check: Rostow to Harriman, Jan. 28, 1966, Harriman Papers, box 499, Library of Congress
        (cited by [[w.woods-j-william-fulbright-vietnam]], 133 n.28). Names: Rostow, Harriman.'
      tags:
      - name:rostow-walt-w
      - name:harriman-w-averell
- add:
    entry:
      id: cal.1966-04-29.vietnam
      when: Apr. 29
      date: '1966-04-29'
      thread: vietnam
      c: 'Lodge to Johnson: Vietnam "was not going to be stable in our meaning of the word for a long, long time." No matter:
        the United States can still succeed; Vietnam can "evolve."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 132–33. FRUS 1964–68, IV, prints no such paper of this day. To check:
        Lodge to Johnson, Apr. 29, 1966, NSF, Memos to the President, box 7, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]],
        133 n.27). Names: Lodge, Johnson.'
      tags:
      - name:lodge-henry-cabot
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1966-05-10.vietnam-air-war-2
      when: May 10
      date: '1966-05-10'
      thread: vietnam-air-war
      c: 'Harriman to Rusk: to step up the bombing of the North unwise while political chaos threatens the South. Rusk of
        the same mind, by Woods''s account.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 133. To check: Harriman to Rusk, May 10, 1966, Harriman Papers, box 499,
        Library of Congress (cited by [[w.woods-j-william-fulbright-vietnam]], 133 n.30). See [[cal.1966-05-10.vietnam]].
        Names: Harriman, Rusk.'
      tags:
      - name:harriman-w-averell
      - name:rusk-dean
- add:
    entry:
      id: cal.1966-05-12.vietnam-elections
      when: May 12
      date: '1966-05-12'
      thread: vietnam-elections
      c: '"Principles Governing U.S. Operations Concerning Elections and Constitutional Assembly in South Vietnam": the
        embassy to "monitor" the elections to a constituent assembly; no "anti-Americanism"; the NLF and its fellow travelers
        kept out.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 157 (Woods''s account of the paper). To check: the paper, May 12, 1966,
        NSF, Memos to the President, box 7, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]], 157 n.22). Check:
        the words of the paper; FRUS 1964–68, IV, prints none of this day.'
- add:
    entry:
      id: cal.1966-05-14.vietnam-congress
      when: May 14
      date: '1966-05-14'
      thread: vietnam-congress
      c: 'Fulbright to Oscar Fendler: "If they had an honest election in South Vietnam they would tell us to go home, but
        there is not a chance to have an honest election when we control all modes of transportation ... and for all practical
        purposes dominate the country."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 157. Check: Woods sets the letter among the events of 1967; the note
        dates it May 14, 1966. To check: Fulbright to Oscar Fendler, May 14, 1966, Fulbright Papers (SPF), series 48:18,
        box 48:1, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 157 n.23). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-04.intelligence
      when: Apr.
      date: 1966-04
      thread: intelligence
      c: 'Marcy to Fulbright: the lead article of *Foreign Affairs*''s spring issue, "The Faceless Viet Cong," the NLF a
        "contrived political mechanism" of Hanoi, is by George A. Carver, an analyst of the CIA, named as neither.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 134. Check: the day. Check: Woods''s note (134 n.35) cites a UPI item
        of Mar. 7, 1962. Names: Marcy, Fulbright, Carver.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
      - name:carver-george-a-jr
- add:
    entry:
      id: cal.1966-04.intelligence-2
      when: Apr.
      date: 1966-04
      thread: intelligence
      c: Fulbright to Raborn, Director of Central Intelligence, on Carver's article. Raborn will do nothing about it and
        promise nothing of his analysts' writing in future.
      n: '[[w.woods-j-william-fulbright-vietnam]], 134. Check: the days of the letters. To check: Russell to Fulbright,
        Apr. 30, 1966, Fulbright Papers (SPF), series 48:3, box 16:3, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]],
        134 n.36). Names: Fulbright, Raborn, Carver, Marcy.'
      tags:
      - name:fulbright-j-william
      - name:raborn-william-f-jr
      - name:carver-george-a-jr
      - name:marcy-carl
- add:
    entry:
      id: cal.1966-04-30.intelligence
      when: Apr. 30
      date: '1966-04-30'
      thread: intelligence
      c: 'Russell to Fulbright, after a month of Fulbright''s asking that three of Foreign Relations join his CIA subcommittee:
        no. Armed Services wrote the law creating the CIA and the National Security Council; it keeps the oversight.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 135. To check: Russell to Fulbright, Apr. 30, 1966, Fulbright Papers
        (SPF), series 48:3, box 16:3, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 135 n.41).
        Names: Russell, Fulbright.'
      tags:
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-05-17.intelligence
      when: May 17
      date: '1966-05-17'
      thread: intelligence
      c: Foreign Relations, in executive session, 14 to 5, orders reported an original resolution for a Select Committee
        on Intelligence Operations. Fulbright, Mansfield and McCarthy for it; McCarthy its sponsor, Marcy its drafter. Three
        members each from Foreign Relations, Armed Services and Appropriations, to watch the intelligence work of every
        agency, the CIA's among it.
      n: 'Daily Digest, [112 Cong. Rec. D235](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=233)
        (the vote); the committee took the proposal up May 12 without acting, [D226](https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=224).
        [[w.woods-j-william-fulbright-vietnam]], 135 (the three Senators; the sponsor and the drafter; the members). To
        check: Marcy to McCarthy, Oct. 8, 1965, Marcy Papers, box 5, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]],
        135 n.42). Names: Fulbright, Mansfield, McCarthy, Marcy.'
      tags:
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:mccarthy-eugene-j
      - name:marcy-carl
- add:
    entry:
      id: cal.1966-06-01.intelligence
      when: June 1
      date: '1966-06-01'
      thread: intelligence
      c: 'Rostow to Johnson: Raborn''s "very strong opposition" to the compromise, a subcommittee of Foreign Relations to
        get from the Director of Central Intelligence whatever it asks; Mansfield, to avoid a floor fight, to bring it to
        Johnson; Russell against, Fulbright''s group wanting sources and methods. Johnson, by hand: "Because they leak!
        See Dominican Rep. testimony."'
      n: '[FRUS 1964–68, XXXIII, doc. 250](https://history.state.gov/historicaldocuments/frus1964-68v33/d250). [[w.woods-j-william-fulbright-vietnam]],
        136 (Raborn''s plea to Johnson and Russell). Made public: FRUS 1964–68, XXXIII. See [[cal.1966-05-17.intelligence]].
        Names: Rostow, Johnson, Raborn, Mansfield, Russell, Fulbright.'
      tags:
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      - name:raborn-william-f-jr
      - name:mansfield-mike
      - name:russell-richard-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-06-13.intelligence
      when: June 13
      date: '1966-06-13'
      thread: intelligence
      c: 'Fulbright to Raborn: "What I wish to know is whether a Subcommittee of the Foreign Relations Committee, created
        for the purpose of keeping itself informed of the activities of the CIA in fields related to the foreign policy
        of the United States, would be able to receive without restriction information on the same basis as that now supplied
        to the Subcommittees" of Armed Services and Appropriations.'
      n: '[FRUS 1964–68, XXXIII, doc. 250](https://history.state.gov/historicaldocuments/frus1964-68v33/d250), n.2 (the
        letter quoted). Made public: FRUS 1964–68, XXXIII. See [[cal.1966-06-01.intelligence]]. Names: Fulbright, Raborn.'
      tags:
      - name:fulbright-j-william
      - name:raborn-william-f-jr
- add:
    entry:
      id: cal.1966-06-29.intelligence
      when: June 29
      date: '1966-06-29'
      thread: intelligence
      c: 'Fulbright''s staff, "Memorandum for Possible Use during Debate on CIA Resolution": the leaks of Foreign Relations
        not denied; none, it holds, touched the national security.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 136 n.48. To check: the memorandum, June 29, 1966, Fulbright Papers (SPF),
        series 48:3, box 16:3, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 136 n.48). Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1966-07-01.intelligence
      when: July 1
      date: '1966-07-01'
      thread: intelligence
      c: 'Hoover to Tolson: at a going-away party for Thomas Mann, Raborn, Johnson and Hoover agree that Fulbright is in
        a conspiracy to "disrupt intelligence operations" across the executive branch.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 136. Check: the day of the party. To check: Hoover to Tolson, July 1,
        1966, "Hoover''s Official and Confidential File," FBI (cited by [[w.woods-j-william-fulbright-vietnam]], 136 n.47).
        Names: Hoover, Tolson, Mann, Raborn, Johnson, Fulbright.'
      tags:
      - name:hoover-j-edgar
      - name:tolson-clyde-a
      - name:mann-thomas-c
      - name:raborn-william-f-jr
      - name:johnson-lyndon-b
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-01-22.vietnam-congress
      when: Jan. 22
      date: '1967-01-22'
      thread: vietnam-congress
      c: 'Fulbright on *Meet the Press*: Kỳ''s government responsible for the murder of a member of the constituent assembly,
        one of its 117, who had backed talks with the NLF.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 157. To check: "Notes on Senator Fulbright Meet the Press Interview,"
        Jan. 24, 1967, Harriman Papers, box 462, Library of Congress (cited by [[w.woods-j-william-fulbright-vietnam]],
        157 n.25). Names: Fulbright, Nguyễn Cao Kỳ.'
      tags:
      - name:fulbright-j-william
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1967-02.vietnam-congress-3
      when: Feb., late
      date: 1967-02
      thread: vietnam-congress
      c: Saigon. At a rally, militant Catholic youths burn Fulbright and others in effigy. South Vietnam's ambassador delivers
        an official protest of Fulbright's charge.
      n: '[[w.woods-j-william-fulbright-vietnam]], 157. Check: the days. To check: "Fulbright, Others Burned in Effigy at
        Rally in Saigon," *Arkansas Gazette*, Feb. 26, 1967; Fulbright to Trần Văn Đỗ, Mar. 3, 1967, Fulbright Papers (SPF),
        series 48:18, box 53:4, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 157 n.26). See
        [[cal.1967-01-22.vietnam-congress]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-02.middle-east
      when: Feb., early
      date: 1967-02
      thread: middle-east
      c: 'David Ness, deputy chief of mission in Cairo, to Fulbright: the Middle East on the edge of war; Arab nationalism,
        the Palestinian exiles, Nasser''s ambition; Battle to leave in March, no successor chosen; the administration unaware.
        Help asked.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 150. Check: the day. Names: Fulbright, Nasser, Battle.'
      tags:
      - name:fulbright-j-william
      - name:nasser-gamal-abdel
      - name:battle-lucius-d
- add:
    entry:
      id: cal.1967-02-03.middle-east
      when: Feb. 3
      date: '1967-02-03'
      thread: middle-east
      c: 'Fulbright to Ness: "I will try to get the word through [to the White House and State Department] in the best way
        I can. I need not tell you that things are testy here in Washington these days, and one has to watch his step."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 150. To check: Fulbright to David G. Ness, Feb. 3, 1967, Fulbright Papers
        (SPF), series 48:11, box 35:5, University of Arkansas; "U.S. Ignored Crisis Signs in Mideast," *Baltimore Sun*,
        June 11, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 150 n.1). See [[cal.1967-02.middle-east]]. Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-03-04.vietnam-congress
      when: Mar. 4
      date: '1967-03-04'
      thread: vietnam-congress
      c: 'Marcy to Bader: Symington has told Marcy in private that his conviction that the United States belongs in Vietnam
        is crumbling under Fulbright''s attacks.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 145. To check: Marcy to Bader, Mar. 4, 1967, Marcy Papers, box 7, RG
        46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 145 n.12). Names: Marcy, Symington, Fulbright.'
      tags:
      - name:marcy-carl
      - name:symington-william-s
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-03-07.vietnam-congress
      when: Mar. 7
      date: '1967-03-07'
      thread: vietnam-congress
      c: 'Fulbright in the Senate puts in a letter to Johnson of Mar. 6 from 800 former Peace Corps volunteers: Vietnam
        policy "seriously undermining the contribution America can make"; an "erosion of trust in our Government." Fulbright:
        the war''s "destructive effects" on American life beyond it; "the disillusion and alienation of the socially conscious
        younger generation."'
      n: '[113 Cong. Rec. 5635](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt5/pdf/GPO-CRECB-1967-pt5-1-1.pdf#page=63)
        (Senate, Mar. 7, 1967). [[w.woods-j-william-fulbright-vietnam]], 156 (the letter put in the Record). Names: Fulbright,
        Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-03-13.vietnam-congress
      when: Mar. 13
      date: '1967-03-13'
      thread: vietnam-congress
      c: 'Fulbright in the Senate, "Fallacies of Vietnam Policies": he puts in a letter from a second lieutenant in Saigon,
        the name withheld. A civil war; "I think we are meddling, in someone elses affair"; "The domino theory is not a
        valid one in this case."'
      n: '[113 Cong. Rec. 6427–29](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt5/pdf/GPO-CRECB-1967-pt5-5-2.pdf#page=47)
        (Senate, Mar. 13, 1967). Woods (145 n.9) cites these pages for Fulbright''s questions to Russell on the declaration
        of war: see [[cal.1967-02-28.vietnam-supplemental]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-03-21.vietnam-congress
      when: Mar. 21
      date: '1967-03-21'
      thread: vietnam-congress
      c: 'Russell to General L. O. Grice, a constituent: "Our great difficulty is that we are fighting the kind of war our
        enemy wants and not using all of the resources that are available to us."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 145. To check: Russell to Grice, Mar. 21, 1967, Dictation Series, Vietnam
        folder, Russell Papers, Russell Library (cited by [[w.woods-j-william-fulbright-vietnam]], 145 n.11). Names: Russell.'
      tags:
      - name:russell-richard-b
- add:
    entry:
      id: cal.1967-05.democratic-party
      when: May, early
      date: 1967-05
      thread: democratic-party
      c: Citizens for Kennedy-Fulbright, of New York, to go into New Hampshire's primary, the objections notwithstanding.
      n: '[[w.woods-j-william-fulbright-vietnam]], 148–49. Check: the day; reported in the *Arkansas Gazette*, May 5, 1967.
        To check: "RFK-Fulbright Group to Ignore Objections, Run in New Hampshire," *Arkansas Gazette*, May 5, 1967 (cited
        by [[w.woods-j-william-fulbright-vietnam]], 149 n.21). See [[cal.1967-04-18.robert-kennedy]].'
- add:
    entry:
      id: cal.1967-05-08.vietnam-congress
      when: May 8
      date: '1967-05-08'
      thread: vietnam-congress
      c: 'Marcy to Aiken, a speech for him: an "Asian" settlement; if the nations of the region will not carry their share
        in Vietnam, the United States to withdraw by degrees.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 146. Check: the day Aiken gave the speech; Woods: the Senate, late spring.
        To check: Marcy to Aiken, May 8, 1967, Marcy Papers, box 7, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]],
        146 n.16). Names: Marcy, Aiken.'
      tags:
      - name:marcy-carl
      - name:aiken-george-d
- add:
    entry:
      id: cal.1967-05.vietnam-congress
      when: May
      date: 1967-05
      thread: vietnam-congress
      c: 'From near Tuy Hòa, Lt. (j.g.) Karl Phaler, adviser to the Vietnamese Coastal Force, to Fulbright: the Delta''s
        farmers "mangled by air strikes," villagers "killed and burned out by our friendly Korean mercenaries"; "How then
        have we come to be killing so many in such a dubious cause?"'
      n: '[[w.woods-j-william-fulbright-vietnam]], 141–42. Check: the day; Woods''s note dates the letter May 17, the day
        of the reply. To check: Phaler to Fulbright, May 17, 1967, Fulbright Papers (SPF), series 48:18, box 53:1, University
        of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 142 n.2). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-05-17.vietnam-congress-2
      when: May 17
      date: '1967-05-17'
      thread: vietnam-congress
      c: 'Fulbright to Phaler: "I agree with everything you have written, and am ashamed of the fact that I have been unable
        to persuade this Administration to make a reasonable and timely offer of negotiations so that we might bring this
        tragic conflict to an end."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 142. To check: Fulbright to Phaler, May 17, 1967, Fulbright Papers (SPF),
        series 48:18, box 53:1, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 142 n.3). See
        [[cal.1967-05.vietnam-congress]]. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-05-18.vietnam-congress-3
      when: May 18
      date: '1967-05-18'
      thread: vietnam-congress
      c: 'Marcy, "Summary Proposal for Disengagement in Vietnam": the aim not "freedom" and "democracy" but "to maintain
        such base facilities there [in the Pacific] as will protect the sea and air routes of the area from domination by
        hostile forces, and to do so without involving American manpower in combat with the manpower of Asia."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 146–47. Check: perhaps the paper behind Fulbright''s lunch with Russell
        this day, [[cal.1967-05-18.vietnam-congress]]. To check: the paper, May 18, 1967, Marcy Papers, box 7, RG 46, National
        Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 147 n.18). Names: Marcy.'
      tags:
      - name:marcy-carl
- add:
    entry:
      id: cal.1967-05.vietnam-congress-2
      when: May
      date: 1967-05
      thread: vietnam-congress
      c: 'Fulbright to reporters: "These are our elections, not the kind anticipated under the Geneva accords." Pacification,
        paid for by the United States, a means to buy the people''s votes for a government friendly to it.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 158. Check: the day, before the *Washington Post* of May 19; Woods sets
        the remarks after South Vietnam''s elections of September. To check: Carolyn Lewis, "Fulbright Calls Vietnam Pacification
        ''Political,''" *Washington Post*, May 19, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 158 n.28). Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-05-23.middle-east-six-day-war
      when: May 23
      date: '1967-05-23'
      thread: middle-east-six-day-war
      c: 'Rusk with Foreign Relations, a long session on the Middle East. Johnson determined to avoid a clash with the Soviet
        Union and to see the crisis settled in peace. By Rusk''s account to the British the next day: all agree the United
        States cannot stay out and the Arabs cannot drive Israel into the sea; any action multilateral, the United Nations
        used to the full.'
      n: '[113 Cong. Rec. 13788](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-8-1.pdf#page=104)
        (Clark, Senate, May 24, 1967: "yesterday ... after a long session in the Foreign Relations Committee of the Senate
        with Secretary of State Dean Rusk"). [FRUS 1964–68, XIX, doc. 53](https://history.state.gov/historicaldocuments/frus1964-68v19/d53)
        (Rusk to Thomson, May 24). [[w.woods-j-william-fulbright-vietnam]], 151 (Rusk to Fulbright and the other leaders;
        Johnson''s aim). Check: Woods has the leaders called to the State Department. To check: Fulbright to Irma Jennings,
        May 22, 1967, Fulbright Papers (SPF), series 48:18, box 52:2, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]],
        151 n.3). See [[cal.1967-05-22.middle-east]]. Names: Rusk, Johnson, Clark, Fulbright.'
      tags:
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:clark-joseph-s
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-05-24.middle-east-six-day-war
      when: May 24
      date: '1967-05-24'
      thread: middle-east-six-day-war
      c: 'The National Security Council, noon, on the Middle East. Rusk: serious, not yet desperate. Johnson, of Symington''s
        and Fulbright''s statements that the United States cannot manage two crises at once, a choice between Israel and
        Vietnam: Rusk to tell Mansfield "this kind of music in the Senate is just what Kosygin wants to hear." Rusk: "doves
        have become hawks, and vice versa." McNamara: no substance to "the Fulbright/Symington notion."'
      n: '[FRUS 1964–68, XIX, doc. 54](https://history.state.gov/historicaldocuments/frus1964-68v19/d54) (Saunders''s record).
        [[w.woods-j-william-fulbright-vietnam]], 151 (the two Senators; Rusk''s remark). Made public: FRUS 1964–68, XIX.
        Names: Rusk, Johnson, Symington, Fulbright, Mansfield, Kosygin, McNamara.'
      tags:
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:symington-william-s
      - name:fulbright-j-william
      - name:mansfield-mike
      - name:kosygin-aleksei
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-05.middle-east-six-day-war-2
      when: May, late
      date: 1967-05
      thread: middle-east-six-day-war
      c: 'Fulbright to reporters: "hypocritical" of Johnson to ask Israel''s restraint while he bombs North Vietnam. Fulbright
        and Symington: the United States, held down in Vietnam, in no position to mediate in the Middle East or to protect
        its "vital interests" there.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 151. Check: the days; Woods has the remark two days after Rusk''s meeting
        with the leaders; Johnson spoke of the two Senators'' statements at the National Security Council of May 24. Names:
        Fulbright, Johnson, Symington.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:symington-william-s
- add:
    entry:
      id: cal.1967-05-24.middle-east-six-day-war-2
      when: May 24
      date: '1967-05-24'
      thread: middle-east-six-day-war
      also:
      - vietnam-congress
      c: 'Fulbright in the Senate, "The Situation in the Middle East": a matter for the United Nations; the one binding
        American commitment there to support what it does. The United States kept from leading "partly for lack of influence
        in the region, but even more because of its primary preoccupation with the war in Vietnam"; the Soviet Union to
        lead for peace through the United Nations, and to help mediate in Vietnam too.'
      n: '[113 Cong. Rec. 13788](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt10/pdf/GPO-CRECB-1967-pt10-8-1.pdf#page=104)
        (Senate, May 24, 1967). [[w.woods-j-william-fulbright-vietnam]], 152 (the Soviet Union''s good offices for Vietnam).
        Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-05.vietnam-congress-3
      when: May, last week
      date: 1967-05
      thread: vietnam-congress
      c: Geneva, the Pacem in Terris conference. Fulbright a keynote speaker; Clark and Pell there. Peace kept in the past
        by a balance of power; the United States now the power upsetting it, for seemingly noble ends; the United Nations
        to mediate, the World Bank and other bodies to see to the poorer nations. "We pay lip service to Darwin, but, in
        our heart of hearts, how many of us really believe that we are not fallen gods but unusually precocious apes?"
      n: '[[w.woods-j-william-fulbright-vietnam]], 146–48. Check: the day; Fulbright on *Meet the Press* from Pacem in Terris,
        by satellite, May 28 (the daybook). To check: the speech as printed, 113 Cong. Rec. 15018 (Senate, June 7, 1967)
        (cited by [[w.woods-j-william-fulbright-vietnam]], 148 n.20). Names: Fulbright, Clark, Pell.'
      tags:
      - name:fulbright-j-william
      - name:clark-joseph-s
      - name:pell-claiborne-d
- add:
    entry:
      id: cal.1967-06-06.vietnam-congress
      when: June 6
      date: '1967-06-06'
      thread: vietnam-congress
      also:
      - vietnam-elections
      c: 'Fulbright in the Senate puts in the Legislative Reference Service''s comparison of South Vietnam''s new constitution
        with that of 1956: "little reason for optimism"; it "only perpetuates the political grievances of a decade ago";
        "under the guise of protecting the ''national interest,''" political life to be "regulated to suit the whim of the
        government in power."'
      n: '[113 Cong. Rec. 14758](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt11/pdf/GPO-CRECB-1967-pt11-6-1.pdf#page=34)
        (Senate, June 6, 1967). [[w.woods-j-william-fulbright-vietnam]], 157 (Fulbright''s warning to the Senate). Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-06-09.middle-east-six-day-war
      when: June 9
      date: '1967-06-09'
      thread: middle-east-six-day-war
      c: 'Marcy, "Possible Security Council Resolution": by Woods''s account of the view of Fulbright and Marcy, the two
        powers to guarantee free passage in the Gulf of Aqaba in return for Israel''s withdrawal; the Soviet Union''s good
        offices to bring Hanoi to talks.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 152. Check: the paper''s words. To check: the paper, June 9, 1967, Marcy
        Papers, box 7, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 152 n.5). Names: Marcy,
        Fulbright.'
      tags:
      - name:marcy-carl
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07.democratic-party-3
      when: July
      date: 1967-07
      thread: democratic-party
      c: 'Some fifty former delegates to the Democratic National Convention, gathered by Citizens for Kennedy-Fulbright,
        in a public letter to Johnson: do not run in 1968; "millions of Democrats will be unable to support Democratic candidates
        in local, state or national elections."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 149. Check: the day. To check: "''Help Party, Don''t Run,'' Dissenters
        Tell Johnson," *Washington Evening Star*, July 31, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 149 n.22).
        See [[cal.1967-05.democratic-party]]. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1967-07-14.foreign-aid
      when: July 14
      date: '1967-07-14'
      thread: foreign-aid
      c: 'Rusk before Foreign Relations in open session on the foreign aid bill, S. 1872, the committee having cut some
        $200 million. Fulbright: "When you talk about building a peace, do you consider the 12,000 deaths in Vietnam and
        the 70,000 wounded? That doesn''t seem to be a typical figure of building a peace."'
      n: 'Daily Digest, [113 Cong. Rec. D343](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=341)
        (the hearing). [[w.woods-j-william-fulbright-vietnam]], 159. To check: "Senate''s Cuts in Aid Irk Rusk," *Chicago
        Tribune*, July 15, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 159 n.33). Names: Rusk, Fulbright.'
      tags:
      - name:rusk-dean
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-19.vietnam-commitments
      when: July 19
      date: '1967-07-19'
      thread: vietnam-commitments
      c: 'Judiciary''s Subcommittee on Separation of Powers opens hearings on the scope of its study: Hartke, Hruska, Thurmond
        and Stennis; Fulbright''s statement read for him by Tillman, of his staff.'
      n: 'Daily Digest, [113 Cong. Rec. D353](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=351).
        Check: Woods (153) has Fulbright testify himself, then tell the press he sees a growing wish in the Senate to reclaim
        its prerogatives, before leaving for Idaho. See [[cal.1967-07-14.vietnam-commitments]]. Names: Hartke, Hruska, Thurmond,
        Stennis, Fulbright.'
      tags:
      - name:hartke-rupert-v
      - name:hruska-roman-l
      - name:thurmond-strom
      - name:stennis-john-c
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07.vietnam-congress
      when: July, before the 22d
      date: 1967-07
      thread: vietnam-congress
      c: Idaho. Fulbright floats the Middle Fork of the Salmon River with Doolittle and executives of the Potlatch Forests
        company; midway he has the canoes put ashore and a helicopter called; back in Washington by July 22.
      n: '[[w.woods-j-william-fulbright-vietnam]], 153–54. Check: the days. To check: "Fulbright Cuts Float Trip Short,"
        *Arkansas Democrat*, July 22, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 154 n.11). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-26.foreign-aid
      when: July 26
      date: '1967-07-26'
      thread: foreign-aid
      c: McNamara before Foreign Relations, in executive session, on the military assistance in S. 1872.
      n: 'Daily Digest, [113 Cong. Rec. D368](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt29/pdf/GPO-CRECB-1967-pt29-1.pdf#page=366).
        [[w.woods-j-william-fulbright-vietnam]], 159 (Rusk and McNamara before the committee after its cuts). See [[cal.1967-07-14.foreign-aid]].
        Names: McNamara.'
      tags:
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1967-08-14.foreign-aid
      when: Aug. 14
      date: '1967-08-14'
      thread: foreign-aid
      c: 'The Senate takes up the Foreign Assistance Act of 1967, S. 1872. Fulbright: "I do not take particular pleasure
        in presenting a $2.7 billion foreign aid bill to the Senate only 2 weeks after the American people have been told
        by the President that they must pay a 10-percent war tax." The committee''s cuts near three-quarters of a billion;
        Church''s amendment against arms aid where military spending hurts development.'
      n: '[113 Cong. Rec. 22549](https://www.govinfo.gov/content/pkg/GPO-CRECB-1967-pt17/pdf/GPO-CRECB-1967-pt17-3-2.pdf#page=16)
        (Senate, Aug. 14, 1967). [[w.woods-j-william-fulbright-vietnam]], 159 (the cuts; Church''s amendment; Fulbright:
        the administration warned, the price now due). See [[cal.1967-07-14.foreign-aid]]. Names: Fulbright, Church.'
      tags:
      - name:fulbright-j-william
      - name:church-frank
- add:
    entry:
      id: cal.1967-09.vietnam-air-war
      when: Sept., by the 10th
      date: 1967-09
      thread: vietnam-air-war
      also:
      - vietnam-congress
      c: 'Fulbright to reporters on the bombing near the Chinese border: "I think it''s very dangerous and extremely stupid."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 159. Check: the day, before the *Washington Star* of Sept. 10. To check:
        "Fulbright Calls Raid Widening a Great Risk," *Washington Star*, Sept. 10, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]],
        159 n.32). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-09.vietnam-congress-4
      when: Sept., by the 25th
      date: 1967-09
      thread: vietnam-congress
      c: 'Fulbright: the Security Council to take up Vietnam, call for a cease-fire and reconvene the Geneva Conference.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 147 n.19. Check: the day, before the *Christian Science Monitor* of Sept.
        25. To check: "Fulbright Wants UN to Rule on Vietnam," *Christian Science Monitor*, Sept. 25, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]],
        147 n.19). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-10-24.middle-east-six-day-war-aftermath
      when: Oct. 24
      date: '1967-10-24'
      thread: middle-east-six-day-war-aftermath
      c: 'Johnson with Eban, 5:44 to 6:32 p.m., Rostow, Christian, Battle, Harman and Evron there. Johnson: the aid cut;
        the wish to "come home," from Saigon, Berlin or elsewhere; "The voices of isolation are increasing in intensity
        and effectiveness." By the notes Woods quotes: "We are almost back to the Gerald Nye days when the monstrous munitions
        maker was on every school child''s tongue"; a Senator for leaving Southeast Asia "because they are not our kind
        of people."'
      n: '[FRUS 1964–68, XIX, doc. 488](https://history.state.gov/historicaldocuments/frus1964-68v19/d488) (Battle''s memorandum).
        [[w.woods-j-william-fulbright-vietnam]], 152 (the notes). Made public: FRUS 1964–68, XIX. To check: "Notes on the
        President''s Meeting with Abba Eban et al.," Oct. 24, 1967, Meeting Notes File, box 2, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]],
        152 n.6). Names: Johnson, Eban, Rostow, Christian, Battle, Harman.'
      tags:
      - name:johnson-lyndon-b
      - name:eban-abba-s
      - name:rostow-walt-w
      - name:christian-george
      - name:battle-lucius-d
      - name:harman-avraham
- add:
    entry:
      id: cal.1967-11.vietnam-congress-2
      when: Nov., mid-month
      date: 1967-11
      thread: vietnam-congress
      c: 'Commander Cowles, in the Pentagon''s flag plot at the time of the Tonkin Gulf incidents, to Fulbright: his doubts
        of the second attack.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 169–70. Check: the day. To check: Naval Inspector General to the Secretary
        of the Navy, Feb. 24, 1968, Fulbright Papers (SPF), series 48:1, box 9:1, University of Arkansas; Marcy to Jones,
        Feb. 28, 1968, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 170 n.38). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-12.vietnam-congress
      when: Dec., before the 10th
      date: 1967-12
      thread: vietnam-congress
      c: 'Lt. (j.g.) John White, in 1964 aboard the *Pine Island*, to the Associated Press: no North Vietnamese torpedoes
        fired in the second attack; the *Maddox*''s sonarman reported none.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 166. Check: the day; Woods: mid-December; the *Arkansas Gazette* of Dec.
        10. To check: "Red Boats Fired No Shots in Tonkin, Ex-officer Says," *Arkansas Gazette*, Dec. 10, 1967 (cited by
        [[w.woods-j-william-fulbright-vietnam]], 166 n.21).'
- add:
    entry:
      id: cal.1967-12-14.elections-1968-2
      when: Dec. 14
      date: '1967-12-14'
      thread: elections-1968
      c: Marcy to McCarthy. Marcy, staff director of Foreign Relations, writing speeches for McCarthy's campaign from December,
        by Woods's account.
      n: '[[w.woods-j-william-fulbright-vietnam]], 176. To check: Marcy to McCarthy, Dec. 14, 1967, Marcy Papers, box 7,
        RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 176 n.63). Names: Marcy, McCarthy.'
      tags:
      - name:marcy-carl
      - name:mccarthy-eugene-j
- add:
    entry:
      id: cal.1967-12.vietnam-congress-2
      when: Dec., mid-month
      date: 1967-12
      thread: vietnam-congress
      c: 'Fulbright releases parts of William Bundy''s testimony in executive session a year and more before: State had
        drafted the Tonkin Gulf resolution months before the incidents.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 167. Check: the day; Woods: mid-December. To check: "War Resolution Drawn
        Up Early," *Arkansas Gazette*, Dec. 22, 1967 (cited by [[w.woods-j-william-fulbright-vietnam]], 167 n.23). Names:
        Fulbright, Bundy.'
      tags:
      - name:fulbright-j-william
      - name:bundy-william
- add:
    entry:
      id: cal.1968-01.vietnam-congress
      when: Jan., early
      date: 1968-01
      thread: vietnam-congress
      c: 'Fulbright: the staff of Foreign Relations to inquire into the Gulf of Tonkin incidents; McNamara and the other
        officials to testify in open hearing when the time comes.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 167. Check: the day. Names: Fulbright, McNamara.'
      tags:
      - name:fulbright-j-william
      - name:mcnamara-robert-s
- add:
    entry:
      id: cal.1968-01-21.vietnam-congress
      when: Jan. 21
      date: '1968-01-21'
      thread: vietnam-congress
      c: 'Fulbright on Clifford''s appointment: not committed in public to the war, he can bring Johnson to stop the bombing
        of the North "without embarrassment"; "I feel that I could speak with him and have an opportunity to try to persuade
        him. In any case, I think he would listen." Hanoi, he is "quite sure," wants the war ended.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 171. Check: the day and the occasion; Fulbright on *Meet the Press* Jan.
        21 (the daybook). To check: "Hanoi Desires End to War, Fulbright Feels ''Quite Sure,''" *Arkansas Gazette*, Jan.
        22, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]], 171 n.44). Names: Fulbright, Clifford, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:clifford-clark
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01.japan-and-korea-pueblo
      when: Jan., by the 26th
      date: 1968-01
      thread: japan-and-korea-pueblo
      also:
      - vietnam-congress
      c: 'Pine Bluff, Ark. Fulbright on the *Pueblo*: "An intelligence ship off your coast is very irritating. People for
        some reason just don''t like eavesdropping. ... I can tell you now that I don''t think there will be any 24-hour
        resolution on this incident."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 167. Check: the day. To check: "U.S. Ambitions Assailed," *Pine Bluff
        Commercial*, Jan. 26, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]], 167 n.27). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-01-27.press-and-broadcasting
      when: Jan. 27
      date: '1968-01-27'
      thread: press-and-broadcasting
      also:
      - vietnam-congress
      c: 'The *Washington Post*, "Midwife to History," Wiggins its editor: "We feel that the country should have all the
        facts on what happened in the Tonkin Gulf in August, 1964."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 168. To check: "Midwife to History," *Washington Post*, Jan. 27, 1968
        (cited by [[w.woods-j-william-fulbright-vietnam]], 168 n.29). Names: Wiggins.'
      tags:
      - name:wiggins-james-r
- add:
    entry:
      id: cal.1968-02-01.vietnam-congress
      when: Feb. 1
      date: '1968-02-01'
      thread: vietnam-congress
      c: 'Fulbright to Erich Fromm: "There is literally a miasma of madness in the city, enveloping everyone in the administration
        and most of those in Congress"; "I am at a loss for words to describe the idiocy of what we are doing."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 168. To check: Fulbright to Fromm, Feb. 1, 1968, Fulbright Papers (SPF),
        series 48:18, box 54:5, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 168 n.31). Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-02-06.press-and-broadcasting
      when: Feb. 6
      date: '1968-02-06'
      thread: press-and-broadcasting
      also:
      - vietnam-tet
      c: 'The *Wall Street Journal*, "Vietnam: The American Dilemma": "What, indeed, is the U.S. trying to save" in Vietnam?
        "If the Saigon government ... doesn''t really have the support of most of the people or the ability to save them
        from nation-wide terror and murder, how good is it?"'
      n: '[[w.woods-j-william-fulbright-vietnam]], 161. To check: "Vietnam: The American Dilemma," *Wall Street Journal*,
        Feb. 6, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]], 161 n.4).'
- add:
    entry:
      id: cal.1968-02.vietnam-congress
      when: Feb., by the 7th
      date: 1968-02
      thread: vietnam-congress
      also:
      - press-and-broadcasting
      c: 'Fulbright to reporters, Rusk on television but not before the committee in open session: the programs "more or
        less controlled exhibitions"; the administration "can do everything except say to [Lawrence] Spivak what the questions
        will be"; Spivak, if he objected, "knows that he will be dropped from the list."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 162. Check: the day, before the *Washington Post* of Feb. 7. To check:
        "Fulbright Hits ''Show,''" *Washington Post*, Feb. 7, 1968; Marcy to Gore, Feb. 5, 1968, Marcy Papers, box 8, RG
        46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 162 n.5–6). Names: Fulbright, Rusk.'
      tags:
      - name:fulbright-j-william
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-02.press-and-broadcasting-2
      when: Feb., before the 16th
      date: 1968-02
      thread: press-and-broadcasting
      also:
      - vietnam-congress
      c: 'NBC. Brinkley asks Fulbright whether Rusk should be replaced: no "personal judgment"; Rusk never wanted terms
        short of North Vietnam''s unconditional surrender. Brinkley, after: Fulbright incensed that Rusk, just on *Meet
        the Press*, still will not testify in open session.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 162. Check: the day. To check: Bob Fleming to Johnson, Feb. 16, 1968,
        WHCF, box 287, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]], 162 n.7). Names: Brinkley, Fulbright,
        Rusk.'
      tags:
      - name:brinkley-david
      - name:fulbright-j-william
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-02-08.vietnam-congress
      when: Feb. 8
      date: '1968-02-08'
      thread: vietnam-congress
      c: 'Temple to Johnson: by State''s legal adviser, Congress cannot require an officer of the executive to appear; one
        who does may set what limits he chooses.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 163 n.10. To check: Larry Temple to Johnson, Feb. 8, 1968, WHCF, box
        342, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]], 163 n.10). See [[cal.1968-02-07.vietnam-congress]].
        Names: Temple, Johnson.'
      tags:
      - name:temple-larry
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-02.vietnam-congress-2
      when: Feb., mid-month
      date: 1968-02
      thread: vietnam-congress
      c: 'Mansfield to Fulbright: perhaps Rusk would appear in public on the foreign aid bill. Fulbright: tell the President
        that unless Rusk comes to the Hill there will be no foreign aid bill to discuss.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 163. Check: the day. To check: Manatos to Johnson, Feb. 15, 1968, WHCF,
        box 287; Mansfield to Johnson, Feb. 19, 1968, NSF, Country File, Vietnam, box 102, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]],
        163 n.10). See [[cal.1968-02-07.vietnam-congress]]. Names: Mansfield, Fulbright, Rusk, Johnson.'
      tags:
      - name:mansfield-mike
      - name:fulbright-j-william
      - name:rusk-dean
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-02.vietnam-congress-3
      when: Feb., late
      date: 1968-02
      thread: vietnam-congress
      c: 'Johnson to Rusk: he must go before Foreign Relations and the cameras again; everyone to do his duty to keep the
        public behind the war. Rusk agrees, bitter at Fulbright, at Marcy and at Johnson, by Woods''s account.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 163. Check: the day. To check: McPherson to Johnson, Feb. 26, 1968, WHCF,
        Confidential File, box 34, LBJ Library (cited by [[w.woods-j-william-fulbright-vietnam]], 163 n.11). Names: Johnson,
        Rusk, Fulbright, Marcy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:fulbright-j-william
      - name:marcy-carl
- add:
    entry:
      id: cal.1968-02-12.republican-party-congress
      when: Feb. 12
      date: '1968-02-12'
      thread: republican-party-congress
      c: 'Los Angeles, the Lincoln Club. Representative Robert Taft Jr.: Fulbright so far from the President on Vietnam
        that it is "proper to ask whether the nation might not best be served by his voluntary withdrawal" from the chairmanship
        of Foreign Relations.'
      n: '[114 Cong. Rec. 4009](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-1-1.pdf#page=57)
        (House, Feb. 26, 1968: the remarks as Taft put them in). Names: Taft, Fulbright.'
      tags:
      - name:taft-robert-jr
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-02-26.republican-party-congress
      when: Feb. 26
      date: '1968-02-26'
      thread: republican-party-congress
      c: House. Taft, answering Stephen Young's attack in the Record, puts in his remarks of Feb. 12 at Los Angeles on Fulbright's
        chairmanship and William S. White's column of the day.
      n: '[114 Cong. Rec. 4009](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-1-1.pdf#page=57)
        (House, Feb. 26, 1968). See [[cal.1968-02-12.republican-party-congress]]. Names: Taft, Young, Fulbright.'
      tags:
      - name:taft-robert-jr
      - name:young-stephen-m
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-02-26.press-and-broadcasting-3
      when: Feb. 26
      date: '1968-02-26'
      thread: press-and-broadcasting
      also:
      - vietnam-congress
      c: 'William S. White in the *Washington Post*, "Fulbright Inquiry Called Jar at the United States, Whitewash of Hanoi":
        "The violently dovish chairman of the Senate Foreign Relations Committee, J. William Fulbright, is employing its
        apparatus for a masked attack upon American policy in Vietnam where all his open assaults have failed."'
      n: '[114 Cong. Rec. 4009](https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt4/pdf/GPO-CRECB-1968-pt4-1-1.pdf#page=57)
        (House, Feb. 26, 1968: the column as Taft put it in). [[w.woods-j-william-fulbright-vietnam]], 170. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1968-03-14.press-and-broadcasting
      when: Mar. 14
      date: '1968-03-14'
      thread: press-and-broadcasting
      c: William Randolph Hearst Jr. announces in his papers that the Hearst Corporation is changing its stand on the war.
      n: '[[w.woods-j-william-fulbright-vietnam]], 172. To check: Lee Williams to Fulbright, Mar. 14, 1968, Fulbright Papers
        (SPF), series 48:18, box 55:1, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 172 n.49).'
- add:
    entry:
      id: cal.1968-03-22.elections-1968-2
      when: Mar. 22
      date: '1968-03-22'
      thread: elections-1968
      c: 'Marcy to the staff of Foreign Relations: no political activity.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 176. To check: Marcy to the staff, Mar. 22, 1968, Fulbright Papers (SPF),
        series 48:3, box 16:5, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 176 n.63). See
        [[cal.1967-12-14.elections-1968-2]]. Names: Marcy.'
      tags:
      - name:marcy-carl
- add:
    entry:
      id: cal.1968-03.elections-1968-4
      when: Mar., last week
      date: 1968-03
      thread: elections-1968
      c: Little Rock. Fulbright files for a fifth term, on foot from his hotel to the Democratic State Headquarters and
        the courthouse, reporters asking whether he will support Johnson, whether Arkansans will punish his dissent, whether
        the Negro vote that elected Rockefeller will count.
      n: '[[w.woods-j-william-fulbright-vietnam]], 174. Check: the day. Names: Fulbright, Johnson, Rockefeller.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rockefeller-winthrop
      - state:ar
- add:
    entry:
      id: cal.1968-03-31.vietnam-congress
      when: Mar. 31
      date: '1968-03-31'
      thread: vietnam-congress
      c: Cleveland, the evening. Fulbright stops his speech on Vietnam so that he and his audience can watch Johnson's address.
      n: '[[w.woods-j-william-fulbright-vietnam]], 173. Check: Woods has Clifford tell Fulbright of a bombing halt shortly
        before he left Washington; Clifford, of the 20th parallel, Mar. 30: [[cal.1968-03-30.vietnam-congress]]. To check:
        [[w.berman-william-fulbright-and-the]], 97 (cited by [[w.woods-j-william-fulbright-vietnam]], 173 n.51). Names:
        Fulbright, Johnson, Clifford.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:clifford-clark
- add:
    entry:
      id: cal.1968-04-01.vietnam-congress-2
      when: Apr. 1
      date: '1968-04-01'
      thread: vietnam-congress
      c: Fulbright, Lee Williams urging him, telephones Johnson to congratulate him and offers to help start the peace talks;
        Johnson thanks him and accepts.
      n: '[[w.woods-j-william-fulbright-vietnam]], 173–74. To check: Memo for the Files, Apr. 1, 1968, Williams Papers (cited
        by [[w.woods-j-william-fulbright-vietnam]], 174 n.54). Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-01.vietnam-congress-3
      when: Apr. 1
      date: '1968-04-01'
      thread: vietnam-congress
      c: 'Fulbright to reporters: "I think this is a very useful move by the President. I think the President''s statement
        shows he is really determined to bring about peace, a liquidation of the war." Hanoi "extremely foolish" not to
        answer at once.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 174. Check: the day. To check: "Fulbright Hails President Johnson''s
        Vietnam Peace Proposal," *Fort Smith Southwest Times Record*, Apr. 2, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]],
        174 n.56). See [[cal.1968-04-01.vietnam-congress]]. Names: Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-02.vietnam-congress
      when: Apr. 2
      date: '1968-04-02'
      thread: vietnam-congress
      c: 'Marcy with Igor Bubnov of the Soviet Embassy: "absolutely certain" that Johnson means it about peace.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 174. To check: Marcy, memorandum of conversation, Apr. 2, 1968, Marcy
        Papers, box 8, RG 46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 174 n.55). Names: Marcy,
        Johnson.'
      tags:
      - name:marcy-carl
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-04-17.vietnam-congress
      when: Apr. 17
      date: '1968-04-17'
      thread: vietnam-congress
      c: 'Ashmore to Fulbright: back from Hanoi, where he was the night of Johnson''s address, he finds Washington''s door
        as closed to compromise as a year before; Rusk still asks Hanoi''s de-escalation for a full halt.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 174. To check: Ashmore to Fulbright, Apr. 17, 1968, Fulbright Papers
        (SPF), series 48:18, box 54:1, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 174 n.57).
        Names: Ashmore, Fulbright, Johnson, Rusk.'
      tags:
      - name:ashmore-harry
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:rusk-dean
- add:
    entry:
      id: cal.1968-04-25.elections-1968-2
      when: Apr. 25
      date: '1968-04-25'
      thread: elections-1968
      c: 'Fulbright to Martha Gellhorn, in Kenya, of Johnson''s address: "[N]o one can say at this time whether it was a
        ploy or trick or whether he means it." A good chance that "Hubert will withdraw at the last moment in favor of Johnson,
        who will be nominated by acclamation."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 176–77. To check: Fulbright to Gellhorn, Apr. 25, 1968, Fulbright Papers
        (SPF), series 48:18, box 54:5, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 177 n.66).
        Names: Fulbright, Johnson, Humphrey.'
      tags:
      - name:fulbright-j-william
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1968-05-01.elections-1968-2
      when: May 1
      date: '1968-05-01'
      thread: elections-1968
      c: Little Rock. Jim Johnson, once of the State's Supreme Court, files against Fulbright for the Senate on the last
        day.
      n: '[[w.woods-j-william-fulbright-vietnam]], 174. Names: Johnson, Fulbright.'
      tags:
      - name:johnson-james-d
      - name:fulbright-j-william
      - state:ar
- add:
    entry:
      id: cal.1968-05-01.elections-1968-3
      when: May 1
      date: '1968-05-01'
      thread: elections-1968
      c: 'Fulbright to Cyrus Eaton, of Jim Johnson: "He is a man of no character, but with a considerable ability for inflammatory
        demagoguery"; "If there are riots this summer, as expected, he can be a dangerous opponent."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 174–75. To check: Fulbright to Eaton, May 1, 1968, Fulbright Papers (SPF),
        series 2:1, box 5:5, University of Arkansas (cited by [[w.woods-j-william-fulbright-vietnam]], 175 n.58). Names:
        Fulbright, Johnson.'
      tags:
      - name:fulbright-j-william
      - name:johnson-james-d
      - state:ar
- add:
    entry:
      id: cal.1968-06.elections-1968-10
      when: June, mid-month
      date: 1968-06
      thread: elections-1968
      c: 'Fulbright names Ben Grinage, a Pine Bluff, Ark., minister and civil rights worker, to his campaign staff. Grinage:
        Fulbright''s record on civil rights "indefensible," but no worse than the rest of the delegation''s.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 177. Check: the day; reported in the *Arkansas Gazette*, June 12, 1968.
        To check: "Grinage to Be Aide to Senator Fulbright," *Arkansas Gazette*, June 12, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]],
        177 n.67). Names: Fulbright.'
      tags:
      - name:fulbright-j-william
      - state:ar
- add:
    entry:
      id: cal.1968-07.elections-1968-5
      when: July, by the 26th
      date: 1968-07
      thread: elections-1968
      c: 'Jim Johnson''s campaign: Fulbright "the pin-up boy of Hanoi," aiding the enemy, answerable for American casualties.
        Fulbright: the label "utter trash and hogwash."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 177. Check: the day; Fulbright''s answer in the *Pine Bluff Commercial*
        of July 26. To check: "Fulbright Calls ''Hanoi Pin-Up Boy'' Label ''Utter Trash and Hogwash,''" *Pine Bluff Commercial*,
        July 26, 1968 (cited by [[w.woods-j-william-fulbright-vietnam]], 177 n.68). Names: Johnson, Fulbright.'
      tags:
      - name:johnson-james-d
      - name:fulbright-j-william
      - state:ar
- add:
    entry:
      id: cal.1966-12.vietnam-congress-2
      when: Dec.
      date: 1966-12
      thread: vietnam-congress
      c: 'Random House publishes Fulbright''s *The Arrogance of Power*: the Johns Hopkins lectures, with an eight-point
        plan. An end to the bombing of the North; the NLF a party to negotiations; American troops into defensible enclaves
        before withdrawal; Southeast Asia neutralized.'
      n: '[[w.woods-j-william-fulbright-vietnam]], 143–44 (by June 1967, 100,000 copies sold; in the end over 400,000; Tillman
        its editor). Check: the day. To check: [[w.fulbright-arrogance-of-power]]. See [[cal.1966-04-21.vietnam]]. Names:
        Fulbright.'
      tags:
      - name:fulbright-j-william
- add:
    entry:
      id: cal.1967-07-24.vietnam-commitments
      when: July 24
      date: '1967-07-24'
      thread: vietnam-commitments
      c: 'Marcy to Morse, of the national commitments resolution the staff of Foreign Relations has worked on since June:
        it will "unite the hawks and the doves, the North and the South, and the liberals and conservatives—all acting in
        glorious defense of the Constitution."'
      n: '[[w.woods-j-william-fulbright-vietnam]], 152. To check: Marcy to Morse, July 24, 1967, Marcy Papers, box 7, RG
        46, National Archives (cited by [[w.woods-j-william-fulbright-vietnam]], 152 n.7). See [[cal.1967-07-14.vietnam-commitments]].
        Names: Marcy, Morse.'
      tags:
      - name:marcy-carl
      - name:morse-wayne
