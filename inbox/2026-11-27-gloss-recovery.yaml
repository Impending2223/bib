patch: gloss-recovery
by: 'Claude (gloss recovery, R19b: commentary the audits struck, put back as glosses)'
ops:
- edit:
    id: cal.1965-11-10.china-leadership
    base: 48690f21
    set:
      gloss:
        title: Commentary
        text:
        - 'Commentary. Liu Shaoqi chronology (1996): Yao Wenyuan''s article "opened the prelude" to the Cultural Revolution ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 628).'
        - Estimates of the Cultural Revolution's dead (the thread's matter, set on its first entry, Yao Wenyuan's article, by the owner's rule of Nov. 21, 2026).
        - 'Yang Jisheng: the cleansing of the class ranks, the "one strike, three anti" and the hunt for the "May 16" elements together cost over 2 million abnormal deaths, twenty times the cadres who died abnormally in the Cultural Revolution; those killed in mass slaughters by the authorities not fewer than 300,000 ([[w.yang-jisheng-tiandi-fanfu]], II, 633, 685). In Guangxi, of the 89,700 dead with names and addresses reported in 1984, 79,000 killed in organized massacres; on a total of 100,000, 80,000 massacred (II, 676).'
        - 'The estimates Yang gives: Ding Shu, 30 million struggled in the cleansing and 500,000 dead; Andrew Walder and Su Yang, from over 1,500 county gazetteers, some 36 million persecuted in the countryside, 750,000 to 1.5 million killed, as many maimed; the official history, 100 million implicated ([[w.yang-jisheng-tiandi-fanfu]], II, 600). For the "one strike, three anti": Wang Rui, 20,000 to 30,000 killed; Ding Shu, 100,000, or 150,000 to 200,000 (II, 632).'
        - 'Dikötter, after Ding Shu and Jonathan Unger: in the cleansing of the class ranks, in the great majority of the more than 2,000 counties more than a hundred people beaten to death or driven to suicide, in some four to five hundred; in Guangdong, by one estimate, 40,000 unnatural deaths ([[w.dikotter-cultural-revolution]], 189). After Su Yang: in the Cultural Revolution more than 400,000 people systematically exterminated in villages across the country, neighbours killing neighbours (223). The hunt for the "May Sixteenth" elements, from 1967, may alone have implicated as many as 3.5 million (235, 240).'
- edit:
    id: cal.1966-08-05.china-leadership
    base: b2216dea
    set:
      gloss:
        title: Commentary
        text:
        - 'Liu Shaoqi chronology (1996): Mao''s poster is "aimed chiefly at" Liu Shaoqi ([[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 648).'
- edit:
    id: cal.1964-05-06.civil-rights-bill
    base: 9a5ba3c5
    set:
      gloss:
        title: Commentary
        text:
        - 'Larry O''Brien, recalling it later (as Purdum, 2014, reports it): the day "shook hell out of them" ([[w.purdum-idea-whose-time-has-2014]], 278).'
- add-words:
    id: cal.1964-05-06.civil-rights-bill
    after: end
    words: 'John Stewart''s diary of the day: "It will be somewhat of a minor miracle if the pro-civil rights forces can get themselves back in order and push ahead with some degree of resolution and determination."'
    item: '[[w.purdum-idea-whose-time-has-2014]], 278–79'
- edit:
    id: cal.1964-06-07.states-and-cities-us
    base: 01b0cad6
    set:
      gloss:
        title: Commentary
        text:
        - 'Hess and Broder (1967): at Cleveland an "attempted power play by the Governors to block the nomination of Goldwater" collapsed "in a tragicomedy of conflicting ambitions, inept communication and bad politics" ([[w.hess-republican-establishment]], 31–32).'
- edit:
    id: cal.1964-12-28.china-leadership
    base: d7c2f54e
    set:
      gloss:
        title: Commentary
        text:
        - 'Mao to Edgar Snow (Dec. 10, 1970): Liu Shaoqi had "strenuously opposed" the first point, on those in authority taking the capitalist road, "right at the meeting" ([[w.macfarquhar-origins-of-the-cultural]], III, 431 and n.1).'
        - 'Hu Qiaomu (as MacFarquhar gives it, 1997): Liu did not directly oppose the point but only talked of the overlapping of contradictions among the people and those between the people and the enemy (III, 431).'
- edit:
    id: cal.1968-09-10.elections-1968
    base: 1501b3da
    set:
      gloss:
        title: Commentary
        text:
        - 'Chester, Hodgson and Page (1969): George Christian "still insists" that the New Orleans speech had been written a week before Humphrey''s statement, that Johnson went over the text on the plane with two speech-writers, and that Humphrey''s statement was never mentioned. Larry O''Brien, Humphrey''s manager, hearing this: "That isn''t how I remember it" ([[w.chester-american-melodrama]], 633–34).'
- edit:
    id: cal.1966-08-19.jobs-and-wages-airlines
    base: c42dad55
    set:
      gloss:
        title: Commentary
        text:
        - 'Califano (1991): IAM president Siemiller "irresponsibly—but correctly" bragged that the settlement "destroy[ed] all existing wage and price guidelines"; so far as organized labor was concerned, the guideposts "were indeed dead" ([[w.califano-triumph-and-tragedy-of]], 146).'
