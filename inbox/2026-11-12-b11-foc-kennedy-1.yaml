      - elections-1960-religion
      c: 'San Francisco, the airport. Kennedy''s press conference: the short session of Congress, the $1.25 minimum wage lost in conference, Khrushchev''s coming visit, and the anti-Catholic literature.'
      n: '[[w.communications-freedom-of-communications-part]], 96–99. See [[cal.1960-09-02.elections-1960]]. Names: Kennedy, Khrushchev.'
