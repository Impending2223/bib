      when: Aug. 26
      date: '1960-08-26'
      thread: elections-1960-kennedy
      also:
      - defense
      c: Detroit, the VFW convention. Kennedy, a past commander of the Massachusetts post named for his brother, hails the convention's resolution for more defensive strength.
      n: '[[w.communications-freedom-of-communications-part]], 50–54. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:mi
      - city:detroit
