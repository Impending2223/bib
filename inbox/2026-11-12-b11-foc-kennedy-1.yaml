      when: Aug. 5
      date: '1960-08-05'
      thread: elections-1960-kennedy
      also:
      - immigration
      c: 'New York, the Overseas Press Club. Kennedy''s press conference with the foreign-language press, his first speech since the convention: immigration policy and the captive nations.'
      n: '[[w.communications-freedom-of-communications-part]], 3–4. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ny
      - city:nyc
- add:
    entry:
      id: cal.1960-08-06.immigration
      when: Aug. 6
      date: '1960-08-06'
      thread: immigration
      also:
      - elections-1960-kennedy
      c: 'Hyannis Port, Mass. Kennedy to national leaders of civic and fraternal organizations, 21 national origins, with Williams and the Democratic nationalities division: a Democratic administration will give "high priority" to the platform plank on immigration and naturalization law; "I shall insist that this pledge be given high priority." Statements to the Chinese-American citizens (Gung-Hsing Wang of Chicago calls on him) and to the Hellenic communities issue from the same meeting.'
      n: '[[w.communications-freedom-of-communications-part]], 6–12 (the release printed three times, 7, 9 and 11). Names: Kennedy, Williams.'
      tags:
      - name:kennedy-john-f
      - name:williams-g-mennen
      - state:ma
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      also:
      - immigration
      c: 'Hyannis Port, Mass. Kennedy, statement to Lithuanian-American leaders: a Democratic administration "shall continue to refuse to recognize this forced annexation" of Lithuania by the Soviets in 1940. He notes the Republican administration''s March quotas left out a Lithuanian quota.'
      n: '[[w.communications-freedom-of-communications-part]], 4–5. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ma
      - polity:ussr
- add:
    entry:
      id: cal.1960-08-06.elections-1960-kennedy-2
      when: Aug. 6
      date: '1960-08-06'
      thread: elections-1960-kennedy
      c: 'Hyannis Port, Mass. Kennedy, statement to Polish-American leaders: flood relief for "whole families starving in Poland," and American aid in consumer goods and cultural exchanges; the Republican administration''s aid "too little and too late."'
      n: '[[w.communications-freedom-of-communications-part]], 5–6. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ma
- add:
    entry:
      id: cal.1960-08-09.voting-rights-2
      when: Aug. 9
      date: '1960-08-09'
      thread: voting-rights
      also:
      - elections-1960-kennedy
      c: 'Kennedy''s statement on the Senate''s action on civil rights: the Republicans'' intention is "to use civil rights legislation to block" federal aid to education, housing, medical help for the aged and the minimum wage. Dirksen himself moved April 1 to table the Government Contracts Commission proposal.'
      n: '[[w.communications-freedom-of-communications-part]], 12. See [[cal.1960-08-09.voting-rights]]. Names: Kennedy, Dirksen.'
      tags:
      - name:kennedy-john-f
      - name:dirksen-everett
      - city:washington
- add:
    entry:
      id: cal.1960-08-10.jobs-and-wages
      when: Aug. 10
      date: '1960-08-10'
      thread: jobs-and-wages
      also:
      - elections-1960-kennedy
      c: 'Senate. Kennedy opens debate on the Fair Labor Standards Amendments of 1960: the minimum wage from $1.10 to $1.25 for 21½ million workers, coverage to 5 million more.'
      n: '[[w.communications-freedom-of-communications-part]], 13–21. See [[cal.1960-08-18.jobs-and-wages]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - city:washington
- add:
    entry:
