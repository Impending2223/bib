      when: Aug. 17
      date: '1960-08-17'
      thread: elections-1960-kennedy
      c: 'By telephone to the National Association of County Officials, Miami, Fla. Kennedy''s greetings: the sixties'' problems not "exclusively Federal"; "enough to go around" for every level of government.'
      n: '[[w.communications-freedom-of-communications-part]], 23. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:fl
