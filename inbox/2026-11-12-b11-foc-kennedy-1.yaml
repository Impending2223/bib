      date: '1960-08-30'
      thread: elections-1960-kennedy
      also:
      - defense
      c: 'Washington, Senate Office Building. Kennedy''s press conference: a four-man group for nonpartisan consultations on national security, Nitze chairman, with Bruce, Gilpatric and James A. Perkins. Questions on its work and on Symington''s group.'
      n: '[[w.communications-freedom-of-communications-part]], 57–64. Names: Kennedy, Nitze, Bruce, Gilpatric, Symington.'
