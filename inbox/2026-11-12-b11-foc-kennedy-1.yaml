      when: Sept. 4
      date: '1960-09-04'
      thread: elections-1960-kennedy
      c: 'Detroit, the airport, on arrival from Alaska. Kennedy: Portland, Maine, Friday; San Francisco, Saturday noon; Alaska, Saturday night. "This country cannot afford ... 4 more years of a do-nothing Republican leadership."'
      n: '[[w.communications-freedom-of-communications-part]], 109. See [[cal.1960-09-02.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
