      date: '1960-08-30'
      thread: elections-1960-kennedy
      also:
      - labor
      c: Remarks to the New York State AFL-CIO, from Washington, where the minimum wage conference keeps him. He accepts its endorsement.
      n: '[[w.communications-freedom-of-communications-part]], 64–66. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ny
