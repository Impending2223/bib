      when: Aug. 30
      date: '1960-08-30'
      thread: jobs-and-wages
      also:
      - elections-1960-kennedy
      c: Kennedy announces the failure of the House and Senate conferees on the minimum wage. He had backed Prouty's compromise; the other Republicans refused the $1.25 Senate bill and the milder Prouty amendment Eisenhower endorsed.
      n: '[[w.communications-freedom-of-communications-part]], 57. See [[cal.1960-08-18.jobs-and-wages]]. Names: Kennedy, Prouty, Eisenhower.'
