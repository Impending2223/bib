      when: Aug. 29
      date: '1960-08-29'
      thread: elections-1960-kennedy
      c: Kennedy's statement greeting Americans of the Jewish faith on the high holy days, as the year 5721 begins.
      n: '[[w.communications-freedom-of-communications-part]], 56. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
- add:
    entry:
