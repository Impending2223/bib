      thread: elections-1960-kennedy
      also:
      - testing
      c: 'Anchorage, Alaska, the Westward Hotel. Kennedy''s press conference: voter registration, after talking to Frank Thompson, and nuclear testing, not to be resumed "at this particular time"; atmospheric tests easy to police.'
      n: '[[w.communications-freedom-of-communications-part]], 105–109. See [[cal.1960-09-02.elections-1960]]. Names: Kennedy, Thompson.'
      tags:
      - name:kennedy-john-f
      - name:thompson-frank-jr
