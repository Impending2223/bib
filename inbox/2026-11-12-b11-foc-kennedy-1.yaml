    text: 'Check: "last major speech on farm policy"; [[w.communications-freedom-of-communications-part]], 319–24 prints Kennedy''s farm-policy speech at the National Plowing Contest, Sioux Falls, the same day, before Mitchell.'
- cite:
    id: cal.1960-09-27.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 366 (Painesville, Hellriegel''s Inn, Sept. 27: Kennedy thanks DiSalle, Lausche, Young and Cook "for their kindness in coming with us today"; not the hour or Lausche''s request)'
- cite:
    id: cal.1960-09.elections-1960-6
    item: '[[w.communications-freedom-of-communications-part]], 226 (Texarkana, Ark.-Tex., the fairgrounds, Sept. 13: Kennedy names Fulbright and McClellan and "members of the House and Senate from both of these States" as his companions; not the whole delegation)'
- check:
    id: cal.1960-09.elections-1960-6
    text: 'Check: the day; Sept. 13 by [[w.communications-freedom-of-communications-part]], 226, if this is the Texarkana appearance.'
- cite:
    id: cal.1960-09.elections-1960-kennedy
    item: '[[w.communications-freedom-of-communications-part]], 61 (the press conference of Aug. 30, Washington: Kennedy hopes for the advice of retired generals and admirals, among them Carney, Taylor, Ridgway and Gavin; not a campaign speech)'
