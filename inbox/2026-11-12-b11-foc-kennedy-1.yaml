      - name:benson-ezra-taft
      - state:ia
- add:
    entry:
      id: cal.1960-08-21.elections-1960-kennedy-2
      when: Aug. 21
      date: '1960-08-21'
      thread: elections-1960-kennedy
      also:
      - farm
      c: Des Moines, Iowa, the auditorium. Kennedy's press conference after the farm conference, on the Midwest trip, the milk price and farm policy.
      n: '[[w.communications-freedom-of-communications-part]], 32–35. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ia
- add:
    entry:
      id: cal.1960-08-23.elections-1960-kennedy
      when: Aug. 23
      date: '1960-08-23'
      thread: elections-1960-kennedy
      c: 'Telegram to the 61st VFW encampment, Detroit: Kennedy cannot come because the Senate votes Tuesday at 2 p.m. on medical care for the aged. VFW officials wire back that "your fellow veterans respect and understand" his giving priority to the legislative program.'
      n: '[[w.communications-freedom-of-communications-part]], 39. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:mi
      - city:detroit
- add:
    entry:
      id: cal.1960-08-24.elections-1960-kennedy
      when: Aug. 24
      date: '1960-08-24'
      thread: elections-1960-kennedy
      c: 'Alexandria, Va., George Washington High School Stadium. Kennedy at a Democratic rally with Johnson and Governor Almond: the issue is the experience of the whole nation in eight years, not who can "stand up to Khrushchev."'
      n: '[[w.communications-freedom-of-communications-part]], 41–46. Names: Kennedy, Johnson, Khrushchev.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:khrushchev-nikita-s
      - state:va
