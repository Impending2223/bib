      date: '1960-09-05'
      thread: labor
      c: 'Kennedy''s Labor Day message: "I pledge that, if elected, I will not serve any special interest." He will welcome the counsel of the American labor movement.'
      n: '[[w.communications-freedom-of-communications-part]], 109–110. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
