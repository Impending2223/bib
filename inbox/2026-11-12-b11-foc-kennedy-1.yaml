      date: '1960-09-03'
      thread: elections-1960-kennedy
      c: 'Anchorage, Alaska, the airport. Kennedy: "I would start my campaign in the State of Alaska" if nominated, "a pledge I meant to keep." Bartlett, Gruening and Rivers with him.'
      n: '[[w.communications-freedom-of-communications-part]], 99. See [[cal.1960-09-02.elections-1960]]. Names: Kennedy, Bartlett, Gruening.'
