      when: Aug. 17
      date: '1960-08-17'
      thread: medicare
      c: 'Kennedy to Clinton Anderson, by letter, disappointed in the Senate Finance Committee''s failure to report an adequate bill on medical care for the aged: no pay-as-you-go financing.'
      n: '[[w.communications-freedom-of-communications-part]], 21–22. See [[cal.1960-08-23.medicare]]. Names: Kennedy, Anderson.'
      tags:
      - name:kennedy-john-f
      - name:anderson-clinton-p
      - city:washington
