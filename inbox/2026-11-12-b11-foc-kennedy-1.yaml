      date: '1960-09-05'
      thread: elections-1960-kennedy
      c: Michigan State Fair, Detroit. Kennedy, to what he calls a nonpartisan audience, on the fair at Palmer, Alaska, two days before, and "the interdependence of the American economy," farmers and workers prosperous together.
      n: '[[w.communications-freedom-of-communications-part]], 114–115. See [[cal.1960-09-05.elections-1960]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
