    text: 'Check: the words; [[w.communications-freedom-of-communications-part]], 185 prints Kennedy: "She told me. You would have to ask her."'
- cite:
    id: cal.1960-09-12.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 206–18 (the speech to the Greater Houston Ministerial Association, Rice Hotel; "I believe in an America where the separation of church and state is absolute," 208; the question period, 211)'
- cite:
    id: cal.1960-09-14.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 238–41 (Kennedy''s speech accepting the Liberal Party''s nomination, Commodore Hotel, New York; not Schlesinger''s hand in it)'
- cite:
    id: cal.1960-09-22.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 325–28 (Corn Palace, Mitchell, S. Dak., Sept. 22; the day and the place; not "last major speech" or the words after it)'
