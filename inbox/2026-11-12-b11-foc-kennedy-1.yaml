      date: '1960-08-21'
      thread: elections-1960-kennedy
      also:
      - farm
      c: 'Des Moines, Iowa. The Kennedy–Johnson Midwest Farm Conference, Humphrey calling on the speakers, with Johnson, Symington, Freeman and Loveless. Kennedy''s remarks: farm income the "No. 1 domestic problem"; farm purchasing power cut some 20 percent in Benson''s and Nixon''s eight years.'
      n: '[[w.communications-freedom-of-communications-part]], 29–31, 36–38. Names: Kennedy, Johnson, Humphrey, Symington, Freeman, Loveless, Nixon, Benson.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
