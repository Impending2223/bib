      when: Aug. 14
      date: '1960-08-14'
      thread: medicare
      also:
      - elections-1960-kennedy
      c: Hyde Park, N.Y. Kennedy's speech at the memorial program on the twenty-fifth anniversary of the Social Security Act's signing, Mrs. Roosevelt present.
      n: '[[w.communications-freedom-of-communications-part]], 18–20. See [[cal.1960-08.elections-1960-8]]. Names: Kennedy, Roosevelt.'
      tags:
      - name:kennedy-john-f
      - name:roosevelt-eleanor
      - state:ny
