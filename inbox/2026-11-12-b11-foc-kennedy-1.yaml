      when: Aug. 26
      date: '1960-08-26'
      thread: elections-1960-kennedy
      c: By telephone to the AMVET convention, Miami Beach, Fla., from Detroit with Swainson beside him. The struggle is in "the Congo, Cuba, Latin America, Africa, Asia," not Western Europe.
      n: '[[w.communications-freedom-of-communications-part]], 54–55. Names: Kennedy, Swainson.'
      tags:
      - name:kennedy-john-f
      - name:swainson-john-b
      - state:fl
