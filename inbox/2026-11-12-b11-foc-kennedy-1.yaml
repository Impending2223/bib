      also:
      - cuba
      c: 'Pontiac, Mich., Oakland Park. Kennedy: the average unemployment check, $31 a week, in "the richest country in the world"; Havana''s American Ambassador, three years before, "the second most powerful man in Cuba."'
      n: '[[w.communications-freedom-of-communications-part]], 115–116. See [[cal.1960-09-05.elections-1960]]. Names: Kennedy.'
