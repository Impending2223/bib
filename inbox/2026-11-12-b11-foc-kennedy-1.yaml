    entry:
      id: cal.1960-08-01.farm
      when: Aug. 1
      date: '1960-08-01'
      thread: farm
      also:
      - elections-1960-kennedy
      c: 'Hyannis Port, Mass. Eight Democratic Governors and Senators (Loveless, Docking, Herseth, Nelson, Freeman, Burdick, Proxmire, Humphrey) issue from Kennedy''s headquarters a joint statement on farm policy: Nixon, "in the short span of 48 hours since his nomination," has repudiated Benson''s program. Kennedy adds a statement of his own on the same subject.'
      n: '[[w.communications-freedom-of-communications-part]], 1–3. Names: Kennedy, Humphrey, Freeman, Loveless, Docking, Herseth, Nelson, Burdick, Proxmire, Nixon, Benson.'
      tags:
      - name:kennedy-john-f
      - name:humphrey-hubert-h
      - name:freeman-orville-l
      - name:loveless-herschel-c
      - name:docking-george
