- cite:
    id: cal.1960-08-09.voting-rights
    item: '[[w.communications-freedom-of-communications-part]], 12 (Kennedy''s statement of Aug. 9: the Republicans'' intention "to use civil rights legislation to block" federal aid to education, housing, medical help for the aged and the minimum wage; Dirksen''s motion of April 1 to table; not the vote or the day''s sitting)'
- cite:
    id: cal.1960-08-18.jobs-and-wages
    item: '[[w.communications-freedom-of-communications-part]], 23 (Kennedy''s release on the Senate''s vote of 62 to 34: $1.25 by the third year, coverage of about four million more employees; not the exclusions or the House bill)'
- cite:
    id: cal.1960-08.elections-1960-8
    item: '[[w.communications-freedom-of-communications-part]], 18 (Kennedy''s speech at Hyde Park, Aug. 14, the twenty-fifth anniversary of the Social Security Act: "I am grateful to you, Mrs. Roosevelt, for allowing me" there; the day and the place; not a call on her or her support)'
- cite:
    id: cal.1960-08-20.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 24–28 (Kennedy''s press conference with Truman at the Truman Library, Independence, 12:25 p.m., Saturday, Aug. 20; Truman: "they nominated this man, and I am going to support him" (25); Symington speaks at it (28); not the forty minutes or the steps)'
- check:
    id: cal.1960-08-20.elections-1960
    text: 'Check: the words; [[w.communications-freedom-of-communications-part]], 25 prints Truman: "they nominated this man, and I am going to support him. What are you going to do about that?"'
- cite:
    id: cal.1960-08-23.medicare
    item: '[[w.communications-freedom-of-communications-part]], 40–41 (Kennedy''s Senate statement for the Anderson–Kennedy amendment, nine million of the aged, and his release after its defeat: "the threat of a White House veto" and one Republican for it; not the vote count)'
- cite:
    id: cal.1960-09-01.civil-rights-the-executive
    item: '[[w.communications-freedom-of-communications-part]], 68–77 (the joint statement with twenty-three Senators, pledging a bill early in the next session; "a stroke of his pen," 69; the separate statement asking Clark and Celler to draft it, 70; the press conference, 5:15 p.m., 70–77)'
- cite:
    id: cal.1960-09-02.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 78–104 (Sept. 2: Manchester, N.H., 78, and Presque Isle, Maine, 80, airport rallies, Bangor, 82, Portland Stadium, 91; Sept. 3: San Francisco airport, 95, Palmer, 100, The Edgewater, Anchorage, 101; the stops and the days; not the aircraft or the hours)'
- check:
    id: cal.1960-09-02.elections-1960
    text: 'Check: the order of the Sept. 2 stops; [[w.communications-freedom-of-communications-part]], 78 prints Manchester first, and at Portland Kennedy says he will speak that night and then go to Washington (83).'
- cite:
    id: cal.1960-09-05.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 111–14 (Cadillac Square, Detroit, Labor Day; the words at 113: "The new frontier is not what I promise I am going to do for you. The new frontier is what I ask you to do for our country."; not that he left his text)'
- cite:
    id: cal.1960-09-06.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 121–62 (Sept. 6: Pocatello, press conference at the Bannock Hotel, 121, speech at the high school auditorium, 125, Spokane, 132, Seattle, Civic Auditorium, and the statewide television question period, 134; Sept. 7: Eugene, 145, Salem, 148, Portland, Civic Auditorium, 158)'
- cite:
    id: cal.1960-09-08.elections-1960
    item: '[[w.communications-freedom-of-communications-part]], 163–93 (Sept. 8: Dunsmuir, 163, Red Bluff, 165, Richmond, 170; Sept. 9: Shrine Auditorium, Los Angeles, 189; the words at 190: "I have come 3,000 miles and I am not chasing butterflies."; the stops and the days; not the hours or leaving his text)'
- check:
    id: cal.1960-09-08.elections-1960
    text: 'Check: the words; [[w.communications-freedom-of-communications-part]], 190 prints "I have come 3,000 miles and I am not chasing butterflies."'
- cite:
    id: cal.1960-09-09.elections-1960-religion
    item: '[[w.communications-freedom-of-communications-part]], 182–87 (Kennedy''s press conference at the Lockheed Air Terminal, Burbank, Sept. 9; the questions on Peale and religion, 183–84; the expected child, 185)'
