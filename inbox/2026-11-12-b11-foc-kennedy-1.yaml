      when: Aug. 26
      date: '1960-08-26'
      thread: middle-east
      also:
      - elections-1960-kennedy
      c: 'New York, the Statler Hilton. Kennedy to the Zionist convention: "First, I propose that the new President reaffirm our sincere friendship for all the peoples of the Middle East."'
      n: '[[w.communications-freedom-of-communications-part]], 46–50. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      - state:ny
      - city:nyc
