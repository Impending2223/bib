      date: '1960-08-31'
      thread: trade
      c: 'Kennedy to Governor Hollings, by letter: willing to meet him and industry leaders on textile imports, which have doubled for cotton cloth in the year''s first six months. The Democratic platform pledges international fair labor standards.'
      n: '[[w.communications-freedom-of-communications-part]], 66–67. Names: Kennedy, Hollings.'
      tags:
      - name:kennedy-john-f
