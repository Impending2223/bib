- add:
    entry:
      id: cal.1960-12-04.vietnam
      when: Dec. 4
      date: '1960-12-04'
      thread: vietnam
      c: 'Durbrow, three weeks after the coup: the situation "highly dangerous to US interests." The Viet Cong gaining in the countryside; "widespread popular dissatisfaction" with Diệm''s government. Should Diệm not act, the task of "identifying and supporting alternate leadership."'
      n: '[FRUS 1958–60, I, doc. 257](https://history.state.gov/historicaldocuments/frus1958-60v01/d257). [[w.miller-misalliance]], 213. See [[cal.1960-10-14.vietnam]]. Names: Durbrow, Diệm.'
      tags:
      - name:durbrow-elbridge
      - name:ngo-dinh-diem
    section: '196012'
- add:
    entry:
      id: cal.1961-09-18.vietnam
      when: Sept. 18
      date: '1961-09-18'
      thread: vietnam
      c: Shortly after midnight. About three Viet Cong battalions take Phước Vĩnh, capital of Phước Thành province, and hold it for hours; the province chief and his assistant executed in the market place. The first provincial capital taken.
      n: FRUS 1961–63, I, docs. [135](https://history.state.gov/historicaldocuments/frus1961-63v01/d135) (Nolting, Sept. 20), [138](https://history.state.gov/historicaldocuments/frus1961-63v01/d138). [[w.miller-misalliance]], 227. See [[cal.1961-01-28.vietnam]].
      tags:
      - province:binh-duong
    section: '196109'
- add:
    entry:
      id: cal.1961-09-30.vietnam
      when: Sept. 30
      date: '1961-09-30'
      thread: vietnam
      c: 'Diệm, in the evening, to Felt, McGarr, and Nolting: a bilateral defense treaty with the United States, "like the one with Taiwan." His fear: Laos, infiltration, SEATO held back by Britain and France.'
      n: '[FRUS 1961–63, I, doc. 142](https://history.state.gov/historicaldocuments/frus1961-63v01/d142) (Nolting, Oct. 1). [[w.miller-misalliance]], 227. See [[cal.1961-01-28.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 649–50 (1971). Names: Diệm, Felt, McGarr, Nolting.'
      tags:
      - name:ngo-dinh-diem
      - name:felt-harry-d
      - name:mcgarr-lionel-c
      - name:nolting-frederick-e-jr
    section: '196109'
- add:
    entry:
      id: cal.1961-11-17.vietnam
      when: Nov. 17
      date: '1961-11-17'
      thread: vietnam
      c: 'Nolting to Diệm, 5 p.m.: Kennedy''s decisions on the Taylor report, a partnership; more American help, reforms of the government asked. Diệm''s first question, combat troops. Vietnam "did not want to be a protectorate."'
      n: '[FRUS 1961–63, I, doc. 266](https://history.state.gov/historicaldocuments/frus1961-63v01/d266) (Nolting, Nov. 18). [[w.miller-misalliance]], 229–30. See [[cal.1961-01-28.vietnam]]. Names: Nolting, Kennedy, Diệm.'
      tags:
      - name:nolting-frederick-e-jr
      - name:kennedy-john-f
      - name:ngo-dinh-diem
      - place:saigon
    section: '196111'
- add:
    entry:
      id: cal.1962-02-02.vietnam
      when: Feb. 2
      date: '1962-02-02'
      thread: vietnam
      c: 'Hilsman''s "A Strategic Concept for South Vietnam," for Taylor: the Viet Cong cut off from the villages; zones of strategic villages, province by province; the villages tied "into the network of government administration and control."'
      n: '[FRUS 1961–63, II, doc. 42](https://history.state.gov/historicaldocuments/frus1961-63v02/d42). [[w.miller-misalliance]], 240–41. See [[cal.1961-01-28.vietnam]]. Names: Hilsman, Taylor.'
      tags:
      - name:hilsman-roger
      - name:taylor-maxwell
    section: '196202'
- add:
    entry:
      id: cal.1963-05-12.vietnam
      when: May 12
      date: '1963-05-12'
      thread: vietnam
      c: 'Front page of the *Washington Post*: Nhu would like half of the 12,000 to 13,000 American military in South Vietnam to leave.'
      n: 'FRUS 1961–63, III, docs. [122](https://history.state.gov/historicaldocuments/frus1961-63v03/d122) (Rusk to Nolting, May 13: protest to Diệm), [88](https://history.state.gov/historicaldocuments/frus1961-63v03/d88) (Nhu in private, Apr. 12: 500 to 4,000 fewer Americans). [[w.miller-misalliance]], 253–59. See [[cal.1961-01-28.vietnam]]. Names: Nhu.'
      tags:
      - name:ngo-dinh-nhu
    section: '196305'
- add:
    entry:
      id: cal.1963-05-17.vietnam
      when: May 17
      date: '1963-05-17'
      thread: vietnam
      c: 'Diệm''s government and the embassy announce agreement on counterinsurgency funds for 1963, the strategic hamlets first: up to 2.3 billion piastres from the government, some $55 million in American commodities. The present level of advisers still needed; to lighten as security improves.'
      n: 'The joint communiqué, [FRUS 1961–63, III, doc. 127](https://history.state.gov/historicaldocuments/frus1961-63v03/d127) (editorial note); [[w.current-documents-1963]], 854–55. [[w.miller-misalliance]], 254–55, 259–60. See [[cal.1961-01-28.vietnam]]. Names: Diệm.'
      tags:
      - name:ngo-dinh-diem
      - place:saigon
    section: '196305'
- add:
    entry:
      id: cal.1963-06-08.vietnam
      when: June 8
      date: '1963-06-08'
      thread: vietnam
      c: 'The Women''s Solidarity Movement''s motion of June 7 released: the demonstrating Buddhists "exploited and controlled by communism"; the government to "expel all foreign agitators whether they wear monks'' robes or not."'
      n: FRUS 1961–63, III, docs. [157](https://history.state.gov/historicaldocuments/frus1961-63v03/d157) (Trueheart; the motion in its note), [160](https://history.state.gov/historicaldocuments/frus1961-63v03/d160) (Trueheart with Diệm, June 8). [[w.miller-misalliance]], 269–70. See [[cal.1963-05-08.vietnam]].
      tags:
      - place:saigon
    section: '196306'
- add:
    entry:
      id: cal.1963-06-16.vietnam
      when: June 16
      date: '1963-06-16'
      thread: vietnam
      c: 'The government''s Interministerial Committee and the Buddhist delegation issue a joint communiqué after talks of June 14–16: the national and Buddhist flags; religious associations taken out of Ordinance No. 10; a committee to re-examine the Buddhists'' complaints; a pardon for those in the movement.'
      n: '[FRUS 1961–63, III, doc. 178](https://history.state.gov/historicaldocuments/frus1961-63v03/d178) (editorial note). [[w.miller-misalliance]], 273. See [[cal.1963-05-08.vietnam]].'
      tags:
      - place:saigon
    section: '196306'
- add:
    entry:
      id: cal.1963-07-11.vietnam
      when: July 11
      date: '1963-07-11'
      thread: vietnam
      c: 'Nhu meets the generals at the Joint General Staff. By four of their reports: he asks their support, criticizes the government, promises "active" assignments; by one, he speaks of a "lightning" coup.'
      n: '[FRUS 1961–63, III, doc. 220](https://history.state.gov/historicaldocuments/frus1961-63v03/d220) (Rice to Rusk, July 15). [[w.miller-misalliance]], 286–87. See [[cal.1963-05-08.vietnam]]. Names: Nhu.'
      tags:
      - name:ngo-dinh-nhu
      - place:saigon
    section: '196307'
- add:
    entry:
      id: cal.1963-09-17.vietnam
      when: Sept. 17
      date: '1963-09-17'
      thread: vietnam
      c: 'Kennedy to Lodge: the highest-level meeting approves a program of pressures for reforms and changes of personnel. "No good opportunity for action to remove present government in immediate future." Lodge''s comment asked.'
      n: '[FRUS 1961–63, IV, doc. 125](https://history.state.gov/historicaldocuments/frus1961-63v04/d125) (CAP 63516). [[w.miller-misalliance]], 299. See [[cal.1963-05-08.vietnam]]. Made public: [[w.def-u-s-viet-rels]], Book 12, 545–47 (1971). Names: Kennedy, Lodge.'
      tags:
      - name:kennedy-john-f
      - name:lodge-henry-cabot
    section: '196309'
- add:
    entry:
      id: cal.1963-09-29.vietnam
      when: Sept. 29
      date: '1963-09-29'
      thread: vietnam
      c: 'Gia Long Palace, 2:30 to 5:30 p.m. Diệm with McNamara, Taylor, Lodge, and Harkins: two hours on the war and the strategic hamlets. McNamara on the political crisis and Madame Nhu''s declarations: American officers "little soldiers of fortune."'
      n: '[FRUS 1961–63, IV, doc. 158](https://history.state.gov/historicaldocuments/frus1961-63v04/d158). [[w.miller-misalliance]], 300–01. See [[cal.1963-09-21.vietnam]]. Made public, in part: [[w.pentagon-papers]], vol. 2, 749–51 (1971). Names: Diệm, McNamara, Taylor, Lodge, Harkins, Trần Lệ Xuân.'
      tags:
      - name:ngo-dinh-diem
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:lodge-henry-cabot
      - name:harkins-paul-d
      - name:tran-le-xuan
      - place:saigon
    section: '196309'
- add:
    entry:
      id: cal.1963-10-05.vietnam
      when: Oct. 5
      date: '1963-10-05'
      thread: vietnam
      c: Conein with Dương Văn Minh at Minh's headquarters, cleared by Lodge. Minh must know the American position on a change of government; no support asked, only assurance it will not be thwarted. Three plans, the first the assassination of Nhu and Ngô Đình Cẩn, Diệm kept in office.
      n: '[FRUS 1961–63, IV, doc. 177](https://history.state.gov/historicaldocuments/frus1961-63v04/d177). [[w.miller-misalliance]], 311–12. See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 767–68 (1971). Names: Conein, Dương Văn Minh, Lodge, Nhu, Ngô Đình Cẩn, Diệm.'
      tags:
      - name:conein-lucien
      - name:duong-van-minh
      - name:lodge-henry-cabot
      - name:ngo-dinh-nhu
      - name:ngo-dinh-can
      - name:ngo-dinh-diem
      - place:saigon
    section: '196310'
- add:
    entry:
      id: cal.1963-10-09.vietnam
      when: Oct. 9
      date: '1963-10-09'
      thread: vietnam
      c: 'CIA to Lodge, thoughts "discussed with President": "While we do not wish to stimulate coup, we also do not wish to leave impression that U.S. would thwart a change of government or deny economic and military assistance to a new regime if it appeared capable of increasing effectiveness of military effort ..."'
      n: '[FRUS 1961–63, IV, doc. 192](https://history.state.gov/historicaldocuments/frus1961-63v04/d192); [doc. 182](https://history.state.gov/historicaldocuments/frus1961-63v04/d182) (CAP 63560, Oct. 5: no active covert encouragement to a coup; contacts with possible alternative leadership). [[w.miller-misalliance]], 311. See [[cal.1963-05-08.vietnam]]. Made public: [[w.pentagon-papers]], vol. 2, 769 (1971). Names: Lodge.'
      tags:
      - name:lodge-henry-cabot
      - name:kennedy-john-f
    section: '196310'
- add:
    entry:
      id: cal.1963-10-27.vietnam
      when: Oct. 27
      date: '1963-10-27'
      thread: vietnam
      c: 'Lodge with Diệm, a Sunday, by plane and helicopter to Dalat. No idea of Lodge''s accepted; asked for one thing to reassure American opinion, Diệm offers nothing. Lodge: Diệm "cut off from present" and "simply unbelievably stubborn."'
      n: 'FRUS 1961–63, IV, docs. [221](https://history.state.gov/historicaldocuments/frus1961-63v04/d221) (Lodge, Oct. 28), [220](https://history.state.gov/historicaldocuments/frus1961-63v04/d220). [[w.miller-misalliance]], 316–17. See [[cal.1963-05-08.vietnam]]. Names: Lodge, Diệm.'
      tags:
      - name:lodge-henry-cabot
      - name:ngo-dinh-diem
      - place:dalat
    section: '196310'
