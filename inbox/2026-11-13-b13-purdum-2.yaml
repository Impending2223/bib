      id: cal.1964-07-02.civil-rights-bill-8
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'The House, 402 of 435 present, one hour on H. Res. 789. Madden: the Rules Committee shows no lack of confidence
        in its chairman, but it was time to end the "shenanigans and delays." Smith, fifteen minutes: "The bell has tolled";
        the bill a "monstrous instrument of oppression"; King''s demonstrations to bring "mob violence"; "hordes of beatniks,
        misfits and agitators from the North." Whitener: July 2, 1964 will be marked as the day of the greatest violence
        to the Constitution. McCulloch, with his fact sheet: the bill will not tell banks whom to lend to, owners to whom
        to sell, nor require quotas; "twenty million Americans can, for the first time, dream some dreams." Lindsay''s tribute;
        the House rises. Weltner, who voted no in February, changes his vote: "We can accept the verdict of the nation."
        Celler: "Further delay ... would be fatal"; Smith first on his feet to applaud him.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 318–19. To check: 110 Cong. Rec. 15870–96 (July 2, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
        318–19 nn.). See [[cal.1964-07-02.civil-rights-bill]]. Names: Madden, Smith, Whitener, McCulloch, Lindsay, Weltner,
        Celler. Check: the hour of the debate.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 318–19: all'
        c: 69d90827
      tags:
      - name:madden-ray-j
      - name:smith-howard-w
      - name:whitener-basil-l
      - name:mcculloch-william-m
      - name:lindsay-john-v
      - name:celler-emanuel
- add:
