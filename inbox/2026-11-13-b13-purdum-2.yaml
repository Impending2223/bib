    entry:
      id: cal.1964-05-08.civil-rights-bill-5
      when: May 8
      date: '1964-05-08'
      thread: civil-rights-bill
      also:
      - republican-party-congress
      c: 'Afternoon. Pro-civil-rights Republicans of both Houses meet McCulloch on whether liberal Senators should offer
        strengthening amendments. McCulloch: "I don''t believe a useful purpose is served to try to make the House-passed
        bill stronger. ... Four months before it was passed, we could not have passed it." To Javits, on state elections
        in Title I: he gave that up to "get the show on the road"; not against all amendments, "We aren''t that pig-headed";
        the talk is big "so we don''t have a wide hole in the dike." Copenhaver, the House Judiciary Republican counsel:
        with St. Augustine and each day of the filibuster, Republican support in the House grows shakier; the House could
        not pass the present bill today.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 283. Names: McCulloch, Javits, Copenhaver.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 283: all'
        c: 18aa5ce6
      tags:
      - name:mcculloch-william-m
      - name:javits-jacob-k
