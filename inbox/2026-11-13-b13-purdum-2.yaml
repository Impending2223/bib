      id: cal.1964-04-18.civil-rights-bill-3
      when: Apr. 18
      date: '1964-04-18'
      thread: civil-rights-bill
      c: 'Robert Kennedy, asked by a reporter after the meeting whether he felt as he had in the fall, when he would have
        dropped the Equal Employment Opportunity Commission if the bill needed it: "I haven''t changed my mind." Ellender
        is glad, and hopes he will drop other titles. Two hours later, the aides asked, the Department: Kennedy "for Title
        VII as it stands." Humphrey: "We are not going to take out Title VII." The Leadership Conference briefly in a tailspin.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 263–64. To check: New York Times, Apr. 19, 1964 (cited by [[w.purdum-idea-whose-time-has-2014]],
        264 n.). Names: Kennedy, Ellender, Humphrey, Rauh, Mitchell. Check: the day of Humphrey''s statement; the hour.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 263–64: all'
        c: 205b0631
