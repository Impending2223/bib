      when: Apr. 16
      date: '1964-04-16'
      thread: civil-rights-bill
      c: 'Evening. Humphrey''s and Kuchel''s staff analysis: the civil rights forces can ultimately get sixty-four of the
        sixty-seven votes needed for cloture, not all of them yet nailed down. Dirksen still listed as "doubtful."'
