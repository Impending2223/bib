      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'The White House, 2:05 p.m. Albert''s message, taken by Juanita Roberts, to the President in the Cabinet meeting:
        "We are voting on the bill. Will be over in about ten minutes — fifteen at the most — we are past the danger point."
        Moments later Desautels sends in a slip, "House passed the bill: 289 yeas, 126 nays." Johnson interrupts the meeting
        to read it.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 319–20. To check: President''s Daily Diary, July 2, 1964, LBJL (cited by
        [[w.purdum-idea-whose-time-has-2014]], 320 n.). See [[cal.1964-07-02.program]]. Names: Albert, Johnson.'
      src:
