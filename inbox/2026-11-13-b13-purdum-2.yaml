      id: cal.1964-07-02.civil-rights-bill-9
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'Johnson to Robert Kennedy by telephone, about an hour after Luce''s call; Kennedy just back from Warsaw and West
        Berlin, where he dedicated John F. Kennedy Platz. If the bill is signed today, a difficult holiday weekend, Negroes
        running all over the South to every hotel, motel and restaurant with the Fourth of July and firecrackers: put it
        off to Monday? Johnson: "I think it will be late today." He has promised to sign it when it reaches him, and Halleck,
        to sign before the holiday weekend and so that the Republicans can be present; he does not answer, and telephones
        five others.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 313–14. To check: TPR, Johnson, vol. 8, 350–59 (cited by [[w.purdum-idea-whose-time-has-2014]],
        314 n.). Names: Johnson, Kennedy, Halleck. Check: the hour.'
