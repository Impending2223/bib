      id: cal.1964-04-29.civil-rights-bill-8
      when: Apr. 29
      date: '1964-04-29'
      thread: civil-rights-bill
      c: 'A reception room outside the Senate chamber. Dirksen, with clergy lobbying the Senators: "I fairly scream and
        hope that I can get some work done," to Rabbi Irving Rosenbaum of Chicago; to a priest asking him to decide by conscience:
        "I would make it no other way." To Bishop B. Julian Smith, who says that if he would paint his face black and go
        with him into the world for two days he would not have to say a word: "Must I do that? After thirty years in Congress,
        can''t I evaluate the importance of legislation?" "The best thing you can do is say a prayer for me."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 268–69. To check: Mackaman, *Long Hard Furrow*, 96 (cited by [[w.purdum-idea-whose-time-has-2014]],
        269 n.). Names: Dirksen. Check: the day; Purdum, 269, has the Johnson meeting ''on this same Wednesday,'' Apr. 29,
        and gives the clergy''s visits after the convocation of Apr. 28.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 268–69: all'
        c: 4c74cc6f
      tags:
      - name:dirksen-everett
      - city:chicago
      - state:il
