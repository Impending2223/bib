      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'Johnson to O''Brien by telephone, after the call to Albert, on the signing in the East Room, which he leaves to
        O''Brien: "Just as long as ... you''re in charge of it, I''ll feel relieved, and I don''t want to know."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 320. To check: TPR, Johnson, vol. 8, 379 (cited by [[w.purdum-idea-whose-time-has-2014]],
        320 n.). Names: Johnson, O''Brien. Check: the hour.'
