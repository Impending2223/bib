      id: cal.1964-05-07.civil-rights-bill-5
      when: May 7
      date: '1964-05-07'
      thread: civil-rights-bill
      c: 'The bipartisan floor leaders'' group, morning. Humphrey: a bigger vote on the Mansfield-Dirksen jury trial amendment
        than Morton''s would show the sixty-seven for cloture. "If we can produce sixty-four votes, we are okay. But if
        we only secure forty-nine votes, then we have had it." Rauh: the Leadership Conference still opposes direct dealing
        with Dirksen. Humphrey: "It is not pleasant for Tommy Kuchel and myself to have it appear that Dirksen is writing
        the ticket. I want the bill passed." The Conference should be out getting votes; he saw conservative Republicans
        taking on their leader in the cloakroom the evening before.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 279. To check: Horn, log, 161, EMDP (cited by [[w.purdum-idea-whose-time-has-2014]],
        279 n.). Names: Humphrey, Rauh, Kuchel, Dirksen.'
      src:
        rows:
