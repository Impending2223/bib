      id: cal.1964-06-24.civil-rights-the-executive
      when: June 24
      date: '1964-06-24'
      thread: civil-rights-the-executive
      c: 'A penciled note by Dick Nelson on the early draft of the signing statement, which has Goldman''s paean to summer,
        "ballots, not bullets," and strong words on the violence in Mississippi, passing on Johnson''s view: "Get Doug Cater
        and Dick Goodwin to start working on this, hard. I like it but I don''t want to go this strong on Mississippi at
        this time." At least six drafts in all; Goldman, Goodwin, Cater and Moyers had a hand.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 320–21. To check: Bill Moyers Files, Box 125, LBJL (cited by [[w.purdum-idea-whose-time-has-2014]],
        321 n.). Names: Johnson, Goldman, Goodwin, Cater, Moyers.'
