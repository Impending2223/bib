      id: cal.1964-05-08.civil-rights-bill-4
      when: May 8
      date: '1964-05-08'
      thread: civil-rights-bill
      c: 'Atlanta, breakfast with the Georgia General Assembly. Johnson, of his family''s southern roots: "My office is
        not a single trust for a single section or a single state." The civil rights bill: "because the Constitution requires
        it, because justice demands it." Quotes Atticus Haygood of Emory, 1880: no "divine call to stand eternal guard by
        the grave of dead issues." More than half a million along the motorcade route in Atlanta; forty thousand in the
        square at Gainesville. Lynda Bird Johnson pays tribute to "my beloved friend Dick Russell, who helped raise me";
        Russell is elsewhere in Atlanta, at the Junior Chamber of Commerce.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 282. To check: [1963–64 Pub. Papers 330] (May 8, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
        282 n.). See [[cal.1964-05-08.civil-rights-bill]]. Names: Johnson, Russell, Lynda Bird Johnson. Check: the hour
        of the breakfast.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 282: all'
        c: 957d9578
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
      - name:johnson-lynda-bird
      - state:ga
      - city:atlanta
