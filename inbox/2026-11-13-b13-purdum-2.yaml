      id: cal.1964-05-18.civil-rights-bill
      when: May 18
      date: '1964-05-18'
      thread: civil-rights-bill
      c: 'The bipartisan floor leaders'' group. Liberals grumble at the deal with Dirksen, who has put into Title VII a
        limit of coverage to firms with workers twenty weeks a year; Rauh fears migrant farm workers will go unprotected.
        Clark: "There are no public cheers from me on any of this. You may find some sullen acquiescence on my part."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 292. To check: Horn, log, 198, EMDP (cited by [[w.purdum-idea-whose-time-has-2014]],
