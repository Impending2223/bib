      id: cal.1964-04-13.civil-rights-bill-4
      when: Apr. 13
      date: '1964-04-13'
      thread: civil-rights-bill
      c: 'Senate, shortly before midnight. Smathers, saying he understands how high passions run among black Americans,
        tells of the Marine Corps officers'' mess: some could not enter certain areas to eat and ate Spam while the aviators
        ate steak. Humphrey asks whether either of them knows what it is to be told he cannot come into a restaurant: the
        harm is humiliation, "the lack of a sense of dignity." Of the mess: "a dictatorship called the military establishment."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 259–60. To check: 110 Cong. Rec. 7799 (Apr. 13, 1964) (cited by [[w.purdum-idea-whose-time-has-2014]],
        259 n.). Names: Smathers, Humphrey. Check: the hour.'
