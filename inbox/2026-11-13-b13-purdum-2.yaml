      id: cal.1964-05-01.civil-rights-bill-4
      when: May 1
      date: '1964-05-01'
      thread: civil-rights-bill
      c: 'Senate. A twenty-minute exchange between Russell and Javits, who has suggested that white southern juries would
        not do even justice in civil rights cases. Russell, on his feet: Javits always suggests there is "something fundamentally
        evil and sinful about people living in the South," with "a little sneer on his face." Kitty Genovese, nearly forty
        neighbors at their windows: "I say that couldn''t happen in the South." Javits says he meant no offense; they shake
        hands.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 272–73. To check: New York Times, May 2, 1964 (cited by [[w.purdum-idea-whose-time-has-2014]],
        272 n.). Names: Russell, Javits.'
