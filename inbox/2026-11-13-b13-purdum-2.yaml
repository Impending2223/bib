- add:
    entry:
      id: cal.1964-07-02.civil-rights-bill-16
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-bill
      c: 'Johnson to Reedy and Moyers by telephone, on the hour for the television address at the signing: the White House
        asked for 7:00 p.m., the networks prefer 6:45, which they say brings a larger audience. Johnson: "Six forty-five
        is four-forty-five in a good part of our country, George"; "They''re selfish bastards" who want public affairs in
        the afternoon and "don''t want to give up that night primary time."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 320. To check: TPR, Johnson, vol. 8, 384 (cited by [[w.purdum-idea-whose-time-has-2014]],
        320 n.). Names: Johnson, Reedy, Moyers. Check: the hour; whether it is the call of 1:44 p.m. in [[cal.1964-07-02.civil-rights-bill-6]].'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 320: all'
        c: 4e3c0db3
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:moyers-bill
- add:
    entry:
      id: cal.1964-07-02.civil-rights-the-executive
      when: July 2
      date: '1964-07-02'
      thread: civil-rights-the-executive
      c: 'Busby to Moyers, by memorandum, on the draft of the signing address: he objects to the President''s saying he
        signs because "the moral law of a just God" forbids segregation. "The thought must be in the speech"; but it is
        hard to support with specifics for Southern clergy, Catholic and Protestant, and the President''s use of "a just
        God" invites challenge to "cite chapter and verse." He suggests "Morality forbids it," or "The weight of the moral
        beliefs of our society forbids it." The address as given has "Morality forbids it."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 321. To check: Bill Moyers Files, Box 125, LBJL (cited by [[w.purdum-idea-whose-time-has-2014]],
        321 n.). Names: Busby, Moyers, Johnson.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 321: all'
        c: 81b79bca
      tags:
      - name:busby-horace
      - name:moyers-bill
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-07-03.civil-rights-bill-2
      when: July 3
      date: '1964-07-03'
      thread: civil-rights-bill
      c: 'The Ranch. Johnson, waking late, calls Robert Kennedy first. The mail on the bill: "It runs about 70–50"; "I don''t
        tell that figure to anybody." Kennedy: Governor Paul Johnson of Mississippi has called for noncompliance until the
        courts have tested the law; Johnson might call him to say Mississippi will obey if the courts uphold it. "It''s
        been relatively calm"; in Jackson, for the first time, some Negroes and whites sit down together.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 325. To check: TPR, Johnson, vol. 8, 400–01 (cited by [[w.purdum-idea-whose-time-has-2014]],
        325 n.). Names: Johnson, Kennedy, Paul Johnson. Check: the hour.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 325: all'
        c: 9b62d647
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-robert-f
      - name:johnson-paul-b-jr
      - state:ms
      - city:jackson
- add:
    entry:
      id: cal.1964-07-03.civil-rights-bill-3
      when: July 3
      date: '1964-07-03'
      thread: civil-rights-bill
      c: 'Johnson to Governor Paul Johnson of Mississippi by telephone, on the advice he gave the civil rights leaders the
        night before: "Let''s take this thing slow and easy ... and kind of adjust to it instead of making mass invasions
        and mass violations." The Governor: the success of the thing depends on how fast some Negro leaders like to move,
        and they could make it "mighty, mighty rough." Johnson: "you keep a stiff upper lip, and if you need me, call me."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 326. Names: Johnson, Paul Johnson. Check: the hour.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 326: all'
        c: c988d201
      tags:
      - name:johnson-lyndon-b
      - name:johnson-paul-b-jr
      - state:ms
- add:
    entry:
      id: cal.1964-07-03.civil-rights-bill-4
      when: July 3
      date: '1964-07-03'
      thread: civil-rights-bill
      c: 'C. C. McDonald, an old Texas friend, to Johnson by telephone: "You became president yesterday. That was your most
        wonderful hour. It only comes to a president about every forty years."'
      n: '[[w.purdum-idea-whose-time-has-2014]], 326. Names: Johnson. Check: the hour; Purdum gives the name as McDonald,
        of Wichita Falls.'
      src:
        rows:
        - 'w.purdum-idea-whose-time-has-2014 326: all'
        c: 3d73d6bd
