      id: cal.1964-04-17.civil-rights-bill
      when: Apr. 17
      date: '1964-04-17'
      thread: civil-rights-bill
      c: 'The bipartisan floor leaders'' group on whether to deal with Dirksen''s amendments, or take any at all: test cloture
        on acceptable ones, or hold out for the whole bill? Katzenbach: once any amendment is accepted, "we''ve lost our
        virginity." Humphrey to reporters: if the Senate has not begun voting on amendments by next week he will ask for
        round-the-clock sessions.'
      n: '[[w.purdum-idea-whose-time-has-2014]], 263. To check: Horn, log, 102, EMDP (cited by [[w.purdum-idea-whose-time-has-2014]],
        263 n.). Names: Humphrey, Katzenbach, Dirksen.'
