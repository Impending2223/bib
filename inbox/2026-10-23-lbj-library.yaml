    entry:
      id: cal.1964-06-22.vietnam
      when: June 22
      date: '1964-06-22'
      thread: vietnam
      c: 'NSAM 308: Manning, Assistant Secretary of State for Public Affairs, to run a program of public information on Southeast Asia, drawing on every agency. Johnson: "I am not satisfied with the performance of the several departments in this area."'
      n: '[NSAM No. 308](https://history.state.gov/historicaldocuments/frus1964-68v01/d219) (June 22, 1964). [[w.gibbons-u-s-government-and]], II, 274. See [[cal.1964-06-15.vietnam]]. Made public: *Declassified Documents*, 1984, 001493 (FRUS''s source note). Names: Manning, Johnson.'
