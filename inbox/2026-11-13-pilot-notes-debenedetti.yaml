      when: Jan. 11
      n: '[[w.gibbons-u-s-government-and]], IV, 168–69; [[w.debenedetti-american-ordeal]], 145 (the meeting at Bennett''s
        apartment, Jan. 11; Coffin executive secretary; the new name in April). To check: [[w.hall-because-of-their-faith]]
        (cited by [[w.gibbons-u-s-government-and]], IV, 169 n.166); William Sloane Coffin, *Once to Every Man* (1977) (cited
        by [[w.gibbons-u-s-government-and]], IV, 169 n.166). Check: the day of its founding. Settled: Jan. 11, by the page
        (145: the meeting "on 11 January"). See [[cal.1966-01-23.war-opposition]]. Names: Coffin, John C. Bennett, Martin
        Luther King.'
