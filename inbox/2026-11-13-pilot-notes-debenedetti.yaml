- edit:
    id: cal.1964-12.war-opposition
    base: 0c505aec
    set:
      n: '[[w.debenedetti-american-ordeal]], 102; 426 n.79 (the day: Lippmann''s column "On Viet-Nam," Dec. 22, 1964, one
        of three pieces the note cites). Settled: Dec. 22, 1964, by 426 n.79. Check: the day on publication (the note gives
        the column''s date in the Lippmann Papers), and that the quoted words are from it. To check: Lippmann, "On Viet-Nam,"
        Dec. 22, 1964, reel 10, Lippmann Papers, Yale (cited by [[w.debenedetti-american-ordeal]], 426 n.79). Check: the day.
        Names: Lippmann.'
      date: '1964-12-22'
      when: Dec. 22
- edit:
    id: cal.1967-05.democratic-party-2
    base: 5143dd07
    set:
      n: '[[w.debenedetti-american-ordeal]], 182; 440 n.59 (the days: the national board meeting, May 19–21, 1967). Settled:
        May 19–21, 1967, by 440 n.59. To check: "Foreign Policy Statement," adopted at the national board meeting, May 19–21,
        1967, Americans for Democratic Action records, SHSW (cited by [[w.debenedetti-american-ordeal]], 440 n.59). Check:
        the day; DeBenedetti: "late in the spring." Names: Galbraith.'
      date: '1967-05-19'
      when: May 19–21
