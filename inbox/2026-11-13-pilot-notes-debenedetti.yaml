patch: pilot-notes-debenedetti
by: 'Claude (reader; the notes pilot of Nov. 13, 2026: DeBenedetti and Chatfield, An American Ordeal, the endnotes read against
  the loose entries)'
ops:
- edit:
    id: cal.1960-03.testing
    base: 8a05e208
    set:
      n: '[[w.debenedetti-american-ordeal]], 45; 416 n.52 (the days: the Bear Mountain meeting, Mar. 10–13). Settled: the
        days, Mar. 10–13, by 416 n.52. To check: Lewis Coser et al., "The Committee of Correspondence: A Statement," Mar.
        1960, Committee of Correspondence folder, Social Protest Project, Bancroft (cited by [[w.debenedetti-american-ordeal]],
        416 n.52). Check: the days. Names: Muste.'
      date: '1960-03-10'
      when: Mar. 10–13
- edit:
    id: cal.1960-05.testing-2
    base: 22acfc59
    set:
      n: '[[w.debenedetti-american-ordeal]], 47–48; 416 n.58 (the day: the board''s policy statement, May 26, 1960). Settled
        for the board''s act: May 26, 1960, by 416 n.58. Check: the day of the withdrawals; 416 n.60 cites Gilmore''s letter
        to SANE of June 27, 1960. To check: SANE Board of Directors, policy statement "Standards for SANE Membership," May
        26, 1960, SANE Washington Logbook, 1960–62 (cited by [[w.debenedetti-american-ordeal]], 416 n.58); Robert Gilmore
        to SANE, June 27, 1960, in *Survival*, July 11, 1960, at 3 (cited by [[w.debenedetti-american-ordeal]], 416 n.60).
        Check: the day; DeBenedetti: "late that month." Names: Cousins, Muste.'
      date: '1960-05-26'
      when: May 26
- edit:
    id: cal.1962-10.missile-crisis-2
    base: c8fd8510
    set:
      n: '[[w.debenedetti-american-ordeal]], 60; 418 n.23 (the day: SANE''s statement "The U.S.-Cuban Crisis," dated Oct.
        24, 1962). Settled: Oct. 24, 1962, by 418 n.23. To check: SANE, "The U.S.-Cuban Crisis," Oct. 24, 1962 (cited by [[w.debenedetti-american-ordeal]],
        418 n.23). Check: the day.'
      date: '1962-10-24'
      when: Oct. 24
- edit:
    id: cal.1963-09.war-opposition
    base: 0fce70d5
