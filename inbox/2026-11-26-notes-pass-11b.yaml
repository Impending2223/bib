patch: notes-pass-11b
by: 'Claude (reader; the notes pass, batch 11b: R33a, building on the entry from its cites)'
ops:
- add-words:
    id: cal.1961-05-02.china-leadership
    after: end
    words: 'At the meeting he apologises to his fellow villagers: "we beg for your pardon."'
    item: '[[w.dikotter-maos-great-famine]], 120 n.18'
- add-words:
    id: cal.1961-05-02.china-leadership
    after: end
    words: On the deaths at Huaminglou, where hundreds die each month, Liu gives a normal death rate as below 1 percent, in general 0.8, and a normal birth rate as 2 percent.
    item: '[[w.dikotter-maos-great-famine]], 329 n.19'
- add-words:
    id: cal.1961-05-09.china-leadership
    after: end
    words: His report covers Hebei as well. Since the urgent letter and the draft Sixty Articles the peasants' zeal is high and household sidelines spread; their chief fear is that the policy will not be kept. In Henan over two million still have edema and disease, and many animals have died. The mess-halls are Sichuan's "two smokes" (cooked once in the hall, again at home) and Shaanxi's "five bads" (short rations, labor and time wasted, no meals in the rain, mush all year). In eastern Henan edema fell 40 to 50 percent within a month of letting members cook at home. He proposes restoring handicrafts and breaking the blockades between counties and communes.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1804–1805'
- add-words:
    id: cal.1961-05-30.china-leadership
    after: end
    words: 'He speaks to the East China area meeting of the State Council Finance and Trade Office''s foreign trade conference. Farm procurement is better loose than tight. The wage bill has risen from 13.7 billion yuan in 1956 to 26.3 billion. The state shops are like "the King of Hell keeping a wine shop": who dares go in?'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 89–90'
- add-words:
    id: cal.1961-05-31.china-leadership
    after: end
    words: Three of the four grain crises since 1949 came from the towns' growth. Three years have added over 25 million workers, the towns now at 130 million. Twenty million sent down would save 3 billion jin of grain the first year, 9 billion the second.
    item: '[[w.chen-yun-nianpu-xiuding]], III, 90–92'
- add-words:
    id: cal.1961-06-16.china-leadership-2
    after: end
    words: The plan is on Chen Yun's proposal.
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 369'
- names:
    id: cal.1961-06-16.china-leadership-2
    add:
    - Chen Yun
    tags:
    - name:chen-yun
- add-words:
    id: cal.1961-06-16.china-leadership-2
    after: end
    words: The base is 129 million townspeople at the end of 1960; the towns may only lose people, none be added. Urban grain sales are to fall to 48 to 49 billion jin for 1961–62, 3 to 4 billion less.
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 412–413'
- add-words:
    id: cal.1961-06-16.china-leadership-2
    after: end
    words: The first 10 million are to save 2 million tonnes of grain, Dikötter writes.
    item: '[[w.dikotter-maos-great-famine]], 238 n.37'
- add-words:
    id: cal.1961-10-20.china-leadership
    after: end
    words: 'Deng gives the Standing Committee''s line: Khrushchev is set on isolating China, the People''s Republic and the Party; his open abuse of Albania is in fact abuse of China, which cannot go unanswered: "we will not attack unless attacked; if attacked, we will surely counterattack."'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1665'
- add-words:
    id: cal.1961-10-20.china-leadership
    after: end
    words: Zhu De attends.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1817'
- names:
    id: cal.1961-10-20.china-leadership
    add:
    - Khrushchev
    - Zhu De
    tags:
    - name:khrushchev-nikita-s
    - name:zhu-de
- add-words:
    id: cal.1961-10.china-leadership-2
    after: end
    words: 'Chen Yun chairs it at the Fragrant Hills, Peking, a forum of inquiry that decides nothing; the Ministry of Coal and the six big mining bureaus report. With 50 billion jin of grain, 20 million dan of cotton and 4 billion jin of meat in hand, the state could turn the corner. Powers to be divided: what goes to the Center the provinces do not take, what goes to the provinces the Center does not take, "well water not to trespass on river water."'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 110–112'
- add-words:
    id: cal.1961-12-16.china-leadership-3
    after: end
    words: 'Deng Xiaoping presides on Dec. 16 and 18. Dec. 16: the Secretariat takes up the preparations for the Central Work Conference and its report to Mao and the Politburo Standing Committee, with a selection of Center documents since 1958 and "Mao Zedong on the general line of socialist construction and the struggle between the two lines." Deng: for the errors of recent years the Center is responsible first, the provinces second. Dec. 18: the Seven Thousand Cadres conference is to open early next year to unite the Party''s thinking.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1676–1678'
- add-words:
    id: cal.1961-12-16.china-leadership-3
    after: end
    words: Peng Zhen attends the Dec. 16 meeting.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 164'
- names:
    id: cal.1961-12-16.china-leadership-3
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1962-01-11.china-leadership
    after: end
    words: From the afternoon of Jan. 29, at Mao's call, the conference becomes a "venting" meeting of criticism and self-criticism. Zhou Enlai, Zhu De and Lin Biao also speak.
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1683'
- add-words:
    id: cal.1962-01-11.china-leadership
    after: end
    words: Zhou Enlai and Deng Xiaoping examine themselves, for the State Council and the Secretariat. Lin Biao says the difficulties of recent years came of not doing as Mao said. Chen Yun does not speak.
    item: '[[w.chen-yun-nianpu-xiuding]], III, 119–120'
- add-words:
    id: cal.1962-01-11.china-leadership
    after: end
    words: 'Liu''s report and speech take up Peng Dehuai: the specifics of his letter to Mao are partly true, and a letter to the Party''s Chairman is no crime; but he has long led a small clique in the Party and alone cannot be rehabilitated. Mao interjects: "as long as it is not collusion with a foreign country."'
    item: '[[w.peng-dehuai-nianpu]], 771'
- names:
    id: cal.1962-01-11.china-leadership
    add:
    - Lin Biao
    - Peng Dehuai
    tags:
    - name:lin-biao
    - name:peng-dehuai
- add-words:
    id: cal.1962-02-08.china-leadership-3
    after: end
    words: 'He tells the Shaanxi delegation: the conference is a great victory, not to be underrated; the blame for the errors of these years lies first with the Center. Party life has been abnormal, men saying "only three parts" to one another; the danger is not wrong words but silence. Over 90 percent of a policy organ''s time should go to inquiry. The Guanzhong plain''s grain was at best 6.9 billion jin, 5.4 billion a year on average, and 3.8 billion last year. Four ways out: more output, imports, fewer townspeople, eating less; imports are limited, 10 billion jin last year.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 120–122'
- add-words:
    id: cal.1962-02-21.china-leadership-3
    after: end
    words: The meeting finds a deficit of 3 billion yuan in the 1962 budget, more once the water is squeezed out of the revenue of 1958–61, and decides a recovery period is needed. Liu Shaoqi says the Seven Thousand conference did not sound the difficulties, men fearing to say all black; it is an extraordinary period, to be met with extraordinary measures. He proposes a full State Council meeting for Chen Yun to speak at more; Chen Yun agrees and asks that the ministries' Party groups attend, with Li Fuchun and Li Xiannian to relay the meeting.
    item: '[[w.chen-yun-nianpu-xiuding]], III, 124–125'
- add-words:
    id: cal.1962-02-21.china-leadership-3
    after: end
    words: Chen Yun's speech is warmly received; Liu tells him, "I firmly support you."
    item: '[[w.jian-zhou-enlai]], 463'
- names:
    id: cal.1962-02-21.china-leadership-3
    add:
    - Liu Shaoqi
    - Li Fuchun
    - Li Xiannian
    tags:
    - name:liu-shaoqi
    - name:li-fuchun
    - name:li-xiannian
- add-words:
    id: cal.1962-02-28.china-leadership-3
    after: end
    words: 'Deng Xiaoping presides. Control commissions are to be mostly full-time; thirty to fifty men from the Center are to go about against suppression of democracy and decentralism; members are one day to be elected by Party congresses, with a code for them. On industry he tells Li Fuchun: less iron and steel, more timber and small tools for the villages; the Seventy Articles on industry, with their responsibility, accounting and cooperation systems, to cut staff on the five fixings.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1693'
- add-words:
    id: cal.1962-02-28.china-leadership-3
    after: end
    words: 'Peng Zhen attends the 316th meeting. It decides that the Planning and Economic Commissions are to support agriculture and carry out the Seventy Articles; Xinhua''s domestic branches are to be led chiefly by the head office, and Renmin ribao printed in more copies. Peng: Party committees to take hold of line, policy and plan; production the key to the sharp tensions of town and country, worker and peasant; a Party committee meeting each quarter, as Mao says.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 176'
- names:
    id: cal.1962-02-28.china-leadership-3
    add:
    - Deng Xiaoping
    - Li Fuchun
    - Peng Zhen
    tags:
    - name:deng-xiaoping
    - name:li-fuchun
    - name:peng-zhen
- add-words:
    id: cal.1962-04-23.china-leadership
    after: end
    words: 'Ma Mingfang, third secretary of the Northeast Bureau, reports on the Northeast; Zhou Enlai on the Finance and Economics Group''s talks. By Yang''s notes, Zhou: the Northeast to strive to cut 2 billion yuan, the Northeast a picture of the whole country. Liu: the urban population must be cut, an orderly retreat.'
    item: '[[w.yang-shangkun-riji]], II, 149–150'
- add-words:
    id: cal.1962-04-23.china-leadership
    after: end
    words: Zhu De attends.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1835'
- names:
    id: cal.1962-04-23.china-leadership
    add:
    - Ma Mingfang
    - Zhou Enlai
    - Zhu De
    tags:
    - name:ma-mingfang
    - name:zhou-enlai
    - name:zhu-de
- add-words:
    id: cal.1962-05-07.china-leadership
    after: end
    words: The Xilou and May meetings follow Liu's line of "retreat enough" and, on Chen Yun's views, take the more thorough measures, "extraordinary measures for an extraordinary time."
    item: '[[w.yang-jisheng-mubei]], II, 1175'
- add-words:
    id: cal.1962-05-07.china-leadership
    after: end
    words: 'At the close Deng Xiaoping names two central tasks: 20 million fewer townspeople, and better work in the production teams.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 133'
- names:
    id: cal.1962-05-07.china-leadership
    add:
    - Chen Yun
    tags:
    - name:chen-yun
- add-words:
    id: cal.1962-05-11.china-leadership
    after: end
    words: 'Deng Xiaoping speaks, and Liu Shaoqi sums up; the conference ends. By Yang''s notes of Zhou''s speech: cutting 20 million is like moving a country; the Seven Thousand conference''s long-range targets cannot stand; the summer harvest is poor; imports are to be held within 700 million dollars; staff are to be cut by 10 to 10.7 million and the towns by 10 million, mostly within a year.'
    item: '[[w.yang-shangkun-riji]], II, 169–171'
- names:
    id: cal.1962-05-11.china-leadership
    add:
    - Liu Shaoqi
    - Deng Xiaoping
    tags:
    - name:liu-shaoqi
    - name:deng-xiaoping
- add-words:
    id: cal.1962-05-24.china-leadership-3
    after: end
    words: The Finance Group's plan lowers 1962's gross industrial and farm output from 140 billion yuan to 130 billion. Zhou asks that Li Fuchun, then at Shanghai, report to Mao at Hangzhou; failing that, Tian Jiaying or Lin Ke is to give him the report's gist.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 290–292'
- names:
    id: cal.1962-05-24.china-leadership-3
    add:
    - Tian Jiaying
    - Lin Ke
    tags:
    - name:tian-jiaying
    - name:lin-ke
- add-words:
    id: cal.1962-06-20.china-leadership-3
    after: end
    words: 'Luo Ruiqing and Chen Yi report on the Taiwan authorities'' plan for a "counterattack on the mainland." Deng: whatever comes is met in kind, big with big, middle with middle, small with small, none with none; the time to educate and rouse the people; "this episode does us good."'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1711'
- names:
    id: cal.1962-06-20.china-leadership-3
    add:
    - Luo Ruiqing
    - Chen Yi
    tags:
    - name:luo-ruiqing
    - name:chen-yi
- add-words:
    id: cal.1962-07-07.china-leadership-3
    after: end
    words: 'By the Chen Yun nianpu, some days after Chen Yun''s talk Mao tells a small meeting he very much disagrees with Chen Yun''s view, but that Chen Yun, a Standing Committee member, did no organizational wrong in putting it to the Party''s Chairman. Mao criticizes Deng Zihui and Tian Jiaying: their "dividing the fields to go it alone" breaks up the collective economy.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 135–136'
- names:
    id: cal.1962-07-07.china-leadership-3
    add:
    - Deng Zihui
    - Tian Jiaying
    tags:
    - name:deng-zihui
    - name:tian-jiaying
- add-words:
    id: cal.1962-08-02.china-leadership-2
    after: end
    words: The "comrades" are those to attend the Central Work Conference at Beidaihe, Aug. 6–24. The letter recommends the responsibility field (output fixed to the plot, duty to the person); in the Qiaoxi brigade, grain rose 81 percent in 1961 over 1960, and at least 80 percent of the peasants, perhaps over 90, back it.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 331–332'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: 'Liu says the May conference overrated single farming at 20 percent; nationwide it is 10 percent at most. Mao is harsh with Deng Zihui and raises the old account of cutting 200,000 co-ops. Mao adds a contradiction: copying from abroad against self-reliance.'
    item: '[[w.mao-zedong-zhuan]], V, ch. 70 n.45'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: 'Deng Xiaoping: educating cadres is a great matter, and building the Party''s leading core; some cores have problems.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1721'
- add-words:
    id: cal.1962-08-11.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 210'
- names:
    id: cal.1962-08-11.china-leadership
    add:
    - Peng Zhen
    tags:
    - name:peng-zhen
- add-words:
    id: cal.1962-08-18.china-leadership
    after: end
    words: The report calls for "tit-for-tat struggles against the Indian encroachment."
    item: '[[w.jian-zhou-enlai]], 479'
- add-words:
    id: cal.1962-08-18.china-leadership
    after: end
    words: The report is not printed for the Central Work Conference at Beidaihe, only for the Politburo Standing Committee, Peng Zhen and Yang Shangkun.
    item: '[[w.jianguo-yilai-mao-zedong]], XVI, 361 n.2'
- names:
    id: cal.1962-08-18.china-leadership
    add:
    - Peng Zhen
    - Yang Shangkun
    tags:
    - name:peng-zhen
    - name:yang-shangkun
