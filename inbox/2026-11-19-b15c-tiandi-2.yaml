    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 203–204 (the same day Chen Yongkang 陳永康 and He Fangfang 何方方 post 〈揪出鉆進我們肝臟的牛鬼蛇神!〉, which finds the work group wrong in direction and line;
      Liu receives its head Gou Deyuan and three others and says "this poster is not like kind criticism," "now they attack you, the enemy has come out, the snake is out of its hole,
      and destroying it is easier," and tells them to use the contradictions, win the majority, isolate the minority, and defeat them one by one)'
