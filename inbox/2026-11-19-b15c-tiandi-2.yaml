      c: Peking Normal University 北京師范大學. That night the work group has the students who opposed it besieged and struggled against, files black material on them, caps them "rightist,"
        "anti-Party" and "counter-revolutionary," and restricts their liberty.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 199. The words: 當晚 (I, 199). Made public: 1967. To check: Hongweibing shoudu sansi 紅衛兵首都三司, ed., *Tianfan difu kai er kang: wuchanjieji
        wenhua dageming dashiji (1963.12–1967.10.1)* 《天翻地覆慨而慷——無產階級文化大革命大事記》 (Peking, 1967), 49–53 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 199 n.25). See [[cal.1966-06-20.china-leadership-11]].'
