      c: Central Institute of Finance and Economics 中央財經學院, Peking. Ten young teachers of the Finance Department and some of its students hold a mass meeting exposing the problems of
        the department and the institute and pointing at the work group sent by the Ministry of Commerce 商業部. The Party committee and the work group call it a counter-revolutionary incident,
        a frenzied attack on the Party, and make the ten teachers counter-revolutionaries; the group holds two struggle meetings, afternoon and evening, to force an admission of an "anti-Party
        program."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 198. The words: 下午和晚上連續兩次 (I, 198). Made public: 1967. To check: 八八隊金教「6.16」戰斗組〈憤怒控訴資面級反動路線對我們的迫害〉, 紅代會中央財學院北京公社八八戰斗隊 *Beijing gongshe*
        《北京公社》, Apr. 20, 1967 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 198 n.22).'
