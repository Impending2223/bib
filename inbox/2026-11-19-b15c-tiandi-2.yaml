      time_zone: Asia/Shanghai
      thread: china-leadership
      c: Tsinghua University 清華大學, Peking. The Peking committee tells the university's Party committee by telephone that a work group will enter. In the afternoon Zhou Chiping 周赤萍, deputy
        leader of the group, arrives; at 8 p.m. in the committee's office he meets its three deputy secretaries, Liu Bing 劉冰, Hu Jian 胡健 and Ai Zhisheng 艾知生, asks if they are a "black
        gang", and declares that from now the group leads the school and the committee stops work.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 192. The words: 晚8點 (I, 192). Made public: 2008. To check: Liu Bing 劉冰, *Fengyu suiyue: 1964–1976 de Qinghua* 《風雨歲月——1964-1976年的清華》 (Dangdai
        Zhongguo chubanshe 當代中國出版社, 2008), 53 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 192 n.8).'
      src:
