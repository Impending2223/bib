      c: Chongwen District 崇文區, Peking. Guided by the local police station and the residents' committee, Red Guards of Girls' Middle School no. 15 search the home of Li Wenbo 李文波 at
        121 Guangqumen Inner Street, beating him and his wife Liu Wenxiu 劉文秀; on the 25th they hold a struggle meeting and shut the couple upstairs all day without food, water or the
        toilet. Li seizes a kitchen knife and wounds a Red Guard, then jumps to his death; Liu is taken to the public security bureau.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 269. Made public: 2010. To check: Zhou Enlai 周恩來, speech at the second meeting of the Red Guard representatives of the capital''s colleges
        and middle schools, Sept. 10, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 269 n.55).'
