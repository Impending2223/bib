      place: peking
      thread: china-leadership
      c: Workers' Stadium 工人體育場, Peking. Ye Jianying 葉劍英, at a rally of 100,000 of the army, says of Lin Biao 林彪 that he has followed Mao from the Nanchang rising of 1927 and Jinggangshan
        in 1928, knows Mao Zedong Thought best of the senior cadres, is the youngest and healthiest of the leaders at 59; "we must publicize the health of Chairman Mao and Comrade Lin
