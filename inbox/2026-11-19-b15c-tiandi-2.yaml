      c: 'Evening. Liu Shaoqi 劉少奇 talks to his daughter Liu Tao 劉濤, who reports on Dec. 26, 1966: make Kuai Dafu 蒯大富 a live target to shoot at; make his side a minority, since only by
        criticizing them down is the work group''s position secured; "if the bourgeoisie gives us no democracy, we give them none." Liu Shaoqi later does not own the talk.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 194. The words: 7月3日晚上 (I, 194). Made public: 1966. To check: Liu Tao 劉濤, 〈造劉少奇的反,跟著毛主席幹一輩子革命——我的初步檢查〉, Dec. 26, 1966, printed in Qinghua
        daxue *Jinggangshan bao* 《井崗山報》, Dec. 31, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 194 n.11). Names: Liu Shaoqi.'
