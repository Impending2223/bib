- cite:
    id: cal.1966-06-09.china-leadership-3
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 192 (June 9 the work group of 513 under Ye Lin 葉林, deputy director of the State Economic Commission 國家經委, enters Tsinghua and takes over
      all power in the school; the Party committee stopped work the evening before)'
