- cite:
    id: cal.1966-05-19.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 201 (at the Central-South region''s mobilization meeting for the cultural revolution 中南地區文化革命動員大會 Tao Zhu says that a minority of the bourgeois
      intellectuals are better remolded, most are not thoroughly remolded, and some have not given up the capitalist road and attack the Party and socialism whenever they can)'
