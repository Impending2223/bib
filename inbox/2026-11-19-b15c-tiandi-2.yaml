- cite:
    id: cal.1967-04-22.china-leadership-2
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 285–286 (a blood-letter of Peng Xiaomeng 彭小蒙 of the Red Flag fighting group of the middle school attached to Peking University, asking
      Mao to forgive the young who erred in the revolution, reaches Mao through the son of Wang Dongxing 汪東興, and he decides to release those held; on Apr. 22 Zhou, Jiang Qing and the
      whole Cultural Revolution Group receive some of the United Action members, and Jiang tells them "you are to go home today by the Chairman''s decision; you did well; go on studying,
      join the cultural revolution, stand in the right line"; each is given a book, and they cheer Chairman Mao and "Aunt Jiang Qing"; Mao says afterward: "arrest, I agreed to it; release,
      I agreed too" (July 1968))'
