      c: Xi'an Jiaotong University 西安交通大學, Xi'an. After Li Shiying 李世英 posts "Ten Crimes of the Work Group" on June 6, the work group fixes the "June 6 incident" as counter-revolutionary
        and holds struggle meetings against him three days running. He swallows a mass of sleeping pills and is saved at hospital; the group holds back his note and says that "with 700
        million people, one dead is nothing."
