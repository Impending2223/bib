- cite:
    id: cal.1967-01-25.china-leadership-6
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 285 (in late January 1967 on the Cultural Revolution Group''s order the rebel organizations of Peking''s colleges and some factory rebels,
      with the help of the public security organs, act suddenly on the United Action Committee''s headquarters at the middle school attached to Peking University and on the core members
      at the schools, and arrest over 100; the Committee is then formally made a "counter-revolutionary organization" and banned, two months after its formal founding; before this it
      had stormed the Public Security Ministry six times, Dec. 16 and 28, 1966, Dec. 31, Jan. 6 and 11, with the slogans "burn Xie Fuzhi," "fry Jiang Qing in oil," "down with the Third
      Headquarters," "Liu Shaoqi forever")'
