      when: July 13
      date: '1966-07-13'
      place: peking
      thread: china-leadership
      c: 'The college group of the Peking cultural and educational system 北京市文教系統大學組, from its preliminary sorting of 24 colleges: 31,877 are classed left, 57,235 middle and 10,211 rightist,
        of 99,323. The work groups'' own estimate of the rightists is far higher: over nine-tenths of the Party committees and over six-tenths of the cadres above department head in
        the 24 are rated class 3 or 4.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 199–200. Made public: 2008. To check: Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese
        University Press, Hong Kong, 2008), 166 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 200 n.28).'
