- cite:
    id: cal.1966-06-18.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 202 (June 18, 9 to 11 a.m. 上午9時至11時, the departments of chemistry, biology, Eastern languages, Western languages, Chinese and radio electronics
      and other units struggle against over 60 people, among them "key" persons, Party and League cadres and teachers "with problems," and two "reactionary students": faces blackened,
      tall hats, kneeling, a few beaten; the work group fixes it a "counter-revolutionary incident"; Yang thinks the excesses could have been corrected by policy and guidance)'
- variant:
    id: cal.1966-06-18.china-leadership-5
    unit: A
    witness: w.yang-jisheng-tiandi-fanfu
    reads: at Peking University the struggle meetings of the morning of June 18 held over 60 people, not about forty besides Lu Ping
    at: I, 202
- cite:
    id: cal.1966-06-18.china-leadership-6
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 202 (that night the Peking University work group writes a brief to the Center, the *Beijing daxue wenhua geming jianbao* no. 9 北京大學文化革命簡報第九號,
      which finds that it is mainly bad people deliberately making trouble, and very likely an organized, planned conspiracy)'
- variant:
    id: cal.1966-06-18.china-leadership-6
    unit: A
    witness: w.yang-jisheng-tiandi-fanfu
    reads: the work group's brief of that night, Bulletin no. 9, judges the affair mainly the doing of bad elements making trouble on purpose, and quite possibly an organized, planned
      conspiracy; it does not play down its political bearing
    at: I, 202
- cite:
    id: cal.1966-06-20.china-leadership-5
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 202 (June 19 Liu Shaoqi 劉少奇 forwards the bulletin in the Center''s name with the comment that the Center thinks the work group''s way of
      handling the disorder is correct and timely, and that any unit where such a thing occurs may follow Peking University''s way; the bulletin is issued on the 20th; the work groups
      then press the students harder, and in the few days about June 20 thirty-nine Peking colleges see students against the work groups and the groups against the masses; Mao, hearing
      the work group had fixed the incident as counter-revolutionary, says the June 18 incident was a revolutionary one (undated))'
- variant:
    id: cal.1966-06-20.china-leadership-5
    unit: A
    witness: w.yang-jisheng-tiandi-fanfu
    reads: Liu forwards Bulletin no. 9 in the Center's name on June 19, with the comment; the bulletin goes down on the 20th
    at: I, 202
