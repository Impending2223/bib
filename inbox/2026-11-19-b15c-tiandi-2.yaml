    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 285 (in mid-January 1967 with Mao''s agreement the United Action Committee is fixed as a reactionary organization; Mao: "these heads must
      not be free to act; they must be gathered and given education and remolding")'
