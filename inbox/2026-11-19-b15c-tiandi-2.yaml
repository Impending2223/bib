      id: cal.1966-07-23.china-leadership-6
      when: July 23
      date: '1966-07-23'
      place: peking
      thread: china-leadership
      c: The work group of the girls' middle school attached to Peking Normal University 北京師范大學女附中, Peking, begins the "intensive training" of its cadres and teachers, even the nearly
        retired and the half-retired sick, on the "four cleanups" model, to settle their "bathing and coming downstairs." Each cadre and teacher is followed by a "left" student, who
        may call on him at any time to confess; the group tells these students his class and main materials.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 206–207. Made public: 1967. To check: Xin Beida gongshe 02621 zhidui diaochazu 新北大公社02621支隊調查組, 《清算鄧小平在幹部、教師問題上「打擊一大片,保護一小撮」的資產階級反動路線》 (Apr.
        1967) (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 207 n.49). See [[cal.1966-07.china-leadership-20]].'
