- add:
    entry:
      id: cal.1966-06-23.china-leadership-8
      when: June 23
      date: '1966-06-23'
      thread: china-leadership
      c: 'Liu Shaoqi 劉少奇, forwarding for the Center the Central-South Bureau''s 中南局 report on the cultural revolution and the Northwest Bureau''s 西北局 plan, writes that when the ox-demons
        and snake-spirits come out to attack, there is no haste to strike back: tell the left to stand firm, and the leaders must judge the heat; when most are exposed, organize the
        counterattack in time. Anti-Party, antisocialist middle-school and college students must be pulled out; among graduating senior-middle students some may, with the city committee''s
        approval, be criticized, struggled against and capped. The Central-South report says to catch 1 percent rightists among students.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 200–201. Made public: 1967. To check: Bu Weihua 卜偉華, *Zalan jiu shijie: wenhua dageming de dongluan yu haojie* 《砸爛舊世界——文化大革命的動亂與浩劫》 (Chinese
        University Press, Hong Kong, 2008), 165 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 200 n.29). Names: Liu Shaoqi.'
      src:
        c: 13161fed
        rows:
        - 'w.yang-jisheng-tiandi-fanfu I, 200–201: all'
        - 'via w.yang-jisheng-tiandi-fanfu I, 200 n.29: all'
      tags:
      - polity:prc
      - vis:only:prc
      - name:liu-shaoqi
