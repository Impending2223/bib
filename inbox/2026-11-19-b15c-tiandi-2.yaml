- cite:
    id: cal.1966-06.china-leadership-9
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 228 (from June Chen Boda 陳伯達 drafts the Decision at Diaoyutai 釣魚臺 building 14 with Wang Li 王力, Guan Feng 關鋒, Yin Da 尹達 and Mu Xin 穆欣; Mao
      in Shanghai keeps in touch with the drafting group and revises more than twenty times; on his return to Peking he says it is broadly right but too long and must be revised by other
      hands)'
