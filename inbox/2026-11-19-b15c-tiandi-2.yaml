      id: cal.1966-06-24.china-leadership-7
      when: June 24
      date: '1966-06-24'
      place: peking
      thread: china-leadership
      c: Tsinghua University 清華大學, Peking. The work group holds a debate meeting with Kuai Dafu 蒯大富, and he has the better of it; he seizes on Zhou Chiping's 周赤萍 words that "we represent
        Mao Zedong Thought." Wang Guangmei 王光美, hearing it over a direct line to her residence, says Kuai is rampant, "waving the red flag to oppose the red flag," and his arrogance
        must be put down.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 194. Made public: 2016. To check: Mi Hedu 米鶴都, *Suiyue liusha* 《歲月流沙》 (publisher, year and page not given) (cited by [[w.yang-jisheng-tiandi-fanfu]],
        I, 194 n.10).'
      src:
