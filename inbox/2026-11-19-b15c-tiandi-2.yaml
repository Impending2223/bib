      date: '1966-07-03'
      thread: china-leadership
      c: 'Xie Yutian 解玉田, deputy head of the Shanxi committee''s propaganda department, relays Wei Heng''s instruction to the departments concerned: in colleges, middle schools, offices
        and among teachers and students, divide people into left, middle, right and reactionary, and "finish in haste." Many who posted, and many seen as "backward," "unruly" or of poor
        origin, are made rightists or counter-revolutionaries; a third of teachers and students are so made.'
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 210–211. Made public: 2015. To check: Shi Minggang 石名崗, *Wenge zhong de Shanxi* (2015), 74 (cited by [[w.yang-jisheng-tiandi-fanfu]], I,
