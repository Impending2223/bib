- add:
    entry:
      id: cal.1966-06-23.china-leadership-7
      when: June 23
      date: '1966-06-23'
      place: peking
      thread: china-leadership
      c: Li Xuefeng 李雪峰, first secretary of the new Peking committee 北京市委, speaks at its work conference at the Peking Hotel 北京飯店. The situation is excellent; reactionary forces, views
        and actions have come out in every school; "if there are counter-revolutionaries, it is nothing; arrest them and be done." To support or oppose the new committee is now the mark
        of supporting or opposing the Party. The rightists who drive out the work teams must be cleaned up; if Communists do not stand up, Nagy will come to power. He calls for "catching
        the swimming fish" and "resisting interference."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 199. The words: 「抓游魚」「反干擾」 (I, 199). Made public: 1998.'
      src:
        c: 9f5e9bec
        rows:
