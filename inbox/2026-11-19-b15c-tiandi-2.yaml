      c: At the Peking middle schools' meeting to criticize the bourgeois line Jiang Qing 江青 says of the West City, East City and Haidian Pickets that a handful of the young ones have
        carried out the bourgeois reactionary line, "who think themselves nobility by blood"; Zhou Rongxin 周榮鑫, Yong Wentao 雍文濤 and Wang Renzhong 王任重 are responsible and are to show
        the students how they backed this handful as gendarmes. She asks the students to treat the erring young "to cure the sickness and save the patient," and to topple the middle-aged
        and old, the diehards behind the scenes. Zhou Rongxin and Yong Wentao are made to stand with bowed heads before the platform.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 280. Made public: 1966. To check: Zhongyang shouzhang zai quanguo zai Jing zaofanpai pipan fandong luxian dahui shang de jianghua 〈中央首長在全國在京造反派批判反動路線大會上的講話〉,
        Dec. 17, 1966 (cited by [[w.yang-jisheng-tiandi-fanfu]], I, 280 n.71). Names: Jiang Qing.'
