- cite:
    id: cal.1966-06-17.china-leadership-8
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 203 (June 17 the new work group under Gou Deyuan enters the first middle school attached to Peking Normal University, where Liu Pingping
      is a student; almost 90 percent of its cadres are made "ox-demons" and "black gang," 77 percent of the class teachers struggled against, besieged or sent to labor reform, some
      tortured)'
