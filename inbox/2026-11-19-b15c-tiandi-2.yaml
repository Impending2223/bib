      when: Aug. 6
      date: '1966-08-06'
      place: peking
      thread: china-leadership
      c: Tianqiao Theatre 天橋劇場, Peking. A great debate on the couplet. Jiang Qing 江青, present, proposes altering it to "father revolutionary, son carries on; father reactionary, son
        rebels," top line "It Should Be So"; the Red Guards do not accept it. Kang Sheng 康生, adviser to the Cultural Revolution Group, says the essence of all the arguing is whether
        there is to be a class line, Mao Zedong's, not whether the couplet needs a few words changed; "I admire you."
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 248. Made public: 2016. See [[cal.1966-08-02.china-leadership-6]]. Names: Jiang Qing, Kang Sheng, Mao Zedong.'
