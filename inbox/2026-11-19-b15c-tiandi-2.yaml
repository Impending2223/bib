      thread: china-leadership
      c: 'The Hunan committee 湖南省委 calls a meeting of the secretaries of the prefectures, autonomous prefectures and cities and the heads of the provincial departments. Zhang Pinghua
        張平化 says the situation has changed and it is time to strike back, and formally sets the province to catching "black ghosts" 抓黑鬼. Wang Yanchun 王延春 says: "so this is how the cultural
        revolution is done."'
