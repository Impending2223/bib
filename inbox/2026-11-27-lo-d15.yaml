      c: 'Wallace at the White House, on his telegram of the night before.{1} Johnson asks him to declare for universal suffrage, to permit peaceful assembly, and to call a biracial meeting.{2}
        Seymore Trammell with Wallace; Katzenbach, Valenti and Goodwin with Johnson. Johnson, joking that Wallace and King "have something in common," keeps him two hours: "You can''t stop a fever
        by putting an icepack on your head." He shows him a newspaper picture of a trooper kicking a Negro demonstrator.{6}'
      n: 'The President''s News Conference, [1965 Pub. Papers 274](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=350) (Mar. 13, 1965) (what he told the press he
        asked of Wallace). [President''s Daily Diary, Mar. 13, 1965](https://catalog.archives.gov/id/192452), images 1, 2, 3 (LBJ Library; National Archives Catalog). [[w.garrow-bearing-the-cross]],
        407–08; [[w.dallek-flawed-giant]], 216–17; [[w.branch-at-canaans-edge]], 94–98; [[w.mann-walls-of-jericho]], 456–58 (the meeting); [[w.kotz-judgment-days]], 304 (just before noon, Saturday,
        Mar. 13; "something in common" with King); [[w.kotz-judgment-days]], 304–06 (just before noon, with Seymore Trammell; two hours; "You can''t stop a fever by putting an icepack on your
        head"; "Don''t you shit me, George Wallace"; "George Wallace—He Hated"; Katzenbach, Valenti and Goodwin with Johnson); [[w.bernstein-guns-or-butter]], 231 (three hours in the Oval Office;
        Burke Marshall: "He really had Wallace impressed"). Check: Bernstein, 231, has three hours in the Oval Office; Kotz, 305, two. Check: Branch, 98, has three hours and fifteen minutes;
        Dallek, 217, "nearly three hours," and 216 the afternoon. To check: [[w.carter-politics-of-rage-1995]]; Wallace to Johnson, Mar. 12, 1965, and Lee White to Johnson, Mar. 13, 1965, WHCF: EX/HU2/ST1; Memo, Selma, Mar. 13, 1965, Legislative
        Background: Voting Rights Act, 1965; Douglass Cater to Johnson, n.d. (Mar. 12 or 13, 1965); Katzenbach to Johnson, Mar. 13, 1965; Talking Points, n.d. (Mar. 12 or 13, 1965), Diary Backup,
        LBJ Library (cited by [[w.dallek-flawed-giant]], 216 n.91). See [[cal.1965-03-07.voting-rights]]. The meeting is dated by [[w.kotz-judgment-days]], 304 ("just before noon"). Names: Wallace,
        Katzenbach, Valenti, Goodwin, Martin Luther King. Check: Mann, 456, gives "Saturday, March 12."'
