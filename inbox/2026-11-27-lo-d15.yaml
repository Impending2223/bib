      c: 'The Rose Garden, 3:45 p.m. Johnson''s news conference: "What happened in Selma was an American tragedy"; the voting bill to go to Congress Monday; if State officials will not register
        citizens, federal officials will. He tells of urging Wallace to declare for universal suffrage, to assure peaceful assembly and to call a biracial meeting: "we are not in agreement on a good
        many things." Katzenbach speaks on background. Wallace at his side, by Garrow''s and Mann''s accounts.'
      n: 'The President''s News Conference, [1965 Pub. Papers 274](https://www.govinfo.gov/content/pkg/PPP-1965-book1/pdf/PPP-1965-book1.pdf#page=350) (Mar. 13, 1965) (275–77, 280; not Wallace''s
        presence). The time and the place: the Papers'' note, the Rose Garden, "3:45 p.m." (281). [[w.kotz-judgment-days]], 306–07 (not Katzenbach or Wallace); [[w.bernstein-guns-or-butter]],
        231 (the three requests; "We are not in agreement on a good many things"); [[w.branch-at-canaans-edge]], 98 (the thirty-eighth press conference, outdoors; universal suffrage); [[w.garrow-bearing-the-cross]],
        407–08 (Johnson escorts Wallace into the Rose Garden to watch; the bill Monday; the tragedy; the three requests); [[w.mann-walls-of-jericho]], 458 (Wallace "just behind his right shoulder";
        the bill; universal suffrage). Check: Branch, 98, has Wallace leave after speaking to the reporters; Bernstein, 231, has the press conference "immediately afterward." The order: after [[cal.1965-03-13.voting-rights-selma-3]],
        Kotz, 306 (Wallace to the reporters in the hallway; then "At 3:45 p.m. the president walked into the Rose Garden"). See [[cal.1965-03-13.voting-rights]]. Names: Johnson, Wallace, Katzenbach.'
      tags:
      - name:wallace-george-c
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
