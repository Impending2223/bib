      n: '[111 Cong. Rec. 5388–90](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf#page=3) (1965) (Mar. 18, 1965) (Mansfield''s motion for himself and Dirksen; Eastland; Stennis); [111 Cong. Rec. 5402–03](https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt4/pdf/GPO-CRECB-1965-pt4-9-2.pdf#page=17)
        (1965) (the vote, 67 to 13). [[w.branch-at-canaans-edge]], 124 (the Senate''s instruction; Eastland; thirteen against); [[w.mann-walls-of-jericho]], 467 (the referral; Stennis and Eastland);
        [[w.kotz-judgment-days]], 317 (to report by Apr. 9; twelve Southerners and Margaret Chase Smith against; not Stennis or Eastland); [[w.bernstein-guns-or-butter]], 237 (Eastland: a deadline
        "unheard of"). The order: after [[cal.1965-03-18.voting-rights-3]], the Record''s (the bill read twice, then the motion, 5388). Check: Bernstein, 237, gives the vote to instruct the
        committee as 63 to 13. See [[cal.1965-03-17.voting-rights]]. Names: Mansfield, Dirksen, Smith, Stennis, Eastland.'
