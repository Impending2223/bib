- edit:
    id: cal.1965-07-08.vietnam-july-decision
    base: a00895c8
    kind: correct
    settles:
    - 'Check: Dallek, 272, names Clifford among the panel; FRUS, doc. 55, does not.'
    set:
      c: 'The Vietnam panel, Bradley, Gilpatric, Kistiakowsky, Larson and McCloy, meets at the State Department from 11 a.m. with Rusk, McNamara, Thompson and William Bundy: the stakes "very high
        indeed," Larson excepted;{1} all but Larson for putting in the forces needed.{2} A plenary after lunch. Larson for a move in the UN or serious negotiations, the rest not; Hoffman, in the
        plenary, with him; Acheson and Dean vehement against, Dean: no time to "turn over our Far East policy to the UN."{3}'
      n: '[FRUS 1964–68, III, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v03/d55) (the panel''s highlights: Bradley, Gilpatric, Kistiakowsky, Larson and McCloy; its n.1:
        the panels met separately on the morning of July 8 and jointly after lunch). [[w.mcnamara-in-retrospect]], ch. 7 at nn.46–47 (the morning subpanel, Bradley, Gilpatric, Kistiakowsky, Larson
        and McCloy, with Rusk, Thompson, William Bundy and McNamara, all but Larson for "whatever" forces were needed; Hoffman for negotiations; McCloy: "We are about to get our noses bloodied
        but you''ve got to do it"). Check: Dallek, 272, names Clifford among the panel of former officials; FRUS, doc. 55, does not. The morning panel and the plenary are dated by FRUS, doc. 55
        n.1. See [[cal.1965-07-01.vietnam]]. Names: Acheson, Bradley, Gilpatric, McCloy, Rusk, McNamara, William Bundy, Kistiakowsky, Larson, Thompson, Hoffman, Dean.'
      src:
        c: bcb62c90
        rows:
        - 'w.mcnamara-in-retrospect ch. 7 at nn.46–47: 1, 2'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v03/d55: 1'
      tags:
      - name:acheson-dean-g
      - name:bradley-omar-n
      - name:gilpatric-roswell-l
      - name:mccloy-john-j
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-william
      - name:kistiakowsky-george-b
      - name:larson-arthur
      - name:thompson-llewellyn-e
      - name:hoffman-paul-g
      - name:dean-arthur-h
