        1965," and Johnson''s "Hubert better damn sight not use it" July 26 (the White House Daily Diary). To check: [[w.evans-lyndon-b-johnson]], 551 (cited by [[w.gibbons-u-s-government-and]],
        III, 431 n.131). See [[cal.1965-07-27.vietnam]]. Names: Humphrey.'
