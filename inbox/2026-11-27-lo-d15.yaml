      c: 'After Goldberg''s swearing-in, the Cabinet Room: Rusk, Ball, McNamara, Wheeler, Bundy, Raborn and Helms, Lodge, Goldberg, Clifford, Humphrey. How to explain the escalation to the public,
        Congress and the world.{1} By Califano''s account.{3}'
      n: '[FRUS 1964–68, III, doc. 87](https://history.state.gov/historicaldocuments/frus1964-68v03/d87) (notes of the meeting, Cabinet Room, July 26, 1965, 12:30–3:15 p.m.; its n.1: Bundy''s
        agenda for the meeting held a plan for Congressional consultation and a public announcement of the build-up). [[w.califano-triumph-and-tragedy-of]], 40; [[w.clifford-counsel-to-the-president-2]],
        421 (Monday, July 26, the meetings from shortly after noon to 7 p.m., the public and Congressional aspects of the announcement among their subjects; Clifford repeats his case; not the
        Cabinet Room, the swearing-in, the members or the hour). To check: Bundy to Johnson, July 26, 1965, 11:30 a.m., with "Agenda. Meeting at 12:00, Monday, July 26, 1965," LBJ Library (cited
        by [[w.califano-triumph-and-tragedy-of]], 40 n.24). The night''s calls to the Situation Room are Califano''s, 40 (1:00, 3:30 and 7:35 a.m.), dated July 27 there. Names: Rusk, Ball, McNamara,
        Wheeler, Bundy, Raborn, Helms, Lodge, Goldberg, Clifford, Humphrey, Johnson.'
