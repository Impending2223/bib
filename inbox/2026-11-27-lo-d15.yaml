      range_basis: record
      c: 'The meeting with the congressional leaders. Johnson, reading from a wire service''s advance report of the speech Humphrey is to make that night, rebukes him: by Evans and Novak''s account,
        a cutting rebuke, a moment or two.'
      n: '[[w.gibbons-u-s-government-and]], III, 431 ("During the meeting with the congressional leaders ... reading to the group from a wire service statement"; the rebuke, from Evans and Novak).
        The range: the meeting began at 6:30 p.m. (FRUS 1964–68, III, doc. 94), and the President''s meeting with Rusk and others began at 8:30 p.m. "immediately after" it (431). The order: after
        [[cal.1965-07-27.vietnam-july-decision-3]], the meeting it was made at. To check: [[w.evans-lyndon-b-johnson]], 551 (cited by [[w.gibbons-u-s-government-and]], III, 431 n.131). See [[cal.1965-07-27.vietnam-humphrey]].
