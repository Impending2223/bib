      c: The White House, 6:15 p.m. Johnson receives Acheson, Dean, Lovett, Cowles, Bradley and McCloy, of the panels of former officials, and their recommendations.{1} No choice but to put in
        the forces needed and explain it to the country.{2} Johnson laments;{3} by William Bundy's account, Acheson tells him to press on.{4}
      n: '[FRUS 1964–68, III, doc. 55](https://history.state.gov/historicaldocuments/frus1964-68v03/d55) (n.1: "President Johnson met in the White House at 6:15 p.m. on July 8 with Dean Acheson,
        Arthur Dean, and Robert Lovett of the Europe panel; John Cowles of the Latin America panel; and General Bradley and McCloy of the Vietnam panel," from William Bundy''s manuscript history,
        chap. 27, p. 15). [[w.dallek-flawed-giant]], 272–73 (the panel''s advice; Johnson''s lament; Acheson: no choice but to press on); [[w.barrett-uncertain-warriors]], 39–40 (the Wise Men
        with Johnson: his long complaint; Acheson to Truman, July 10: Johnson "had no choice except to press on"). The order: after [[cal.1965-07-08.vietnam-july-decision]], the panels'' meetings
        of the day (FRUS, doc. 55 n.1). To check: William Bundy''s manuscript history, chap. 27, 15–21, LBJ Library (cited by [[w.dallek-flawed-giant]], 273). See [[cal.1965-07-01.vietnam]]. Names:
        Acheson, Dean, Lovett, Bradley, McCloy, William Bundy, Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:acheson-dean-g
      - name:dean-arthur-h
      - name:lovett-robert-a
      - name:bradley-omar-n
      - name:mccloy-john-j
      - name:bundy-william
