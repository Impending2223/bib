      c: 'The White House, the East Room, the evening. Johnson, to some fifty members of Congress at the tenth briefing on Vietnam, on Selma: "The ghost of Lincoln is moving up and down the corridors
        rather regularly these days." He has Katzenbach explain his statement to the press; Representative John Bell Williams of Mississippi attacks it. McNamara and Rusk on Vietnam.'
      n: '[[w.branch-at-canaans-edge]], 88–89; [[w.johnson-white-house-diary]], 251 (the congressional reception at 6:30; the briefings for the men; "It was 9:30 when they emerged"; not the remarks).
        The time: the reception''s, 6:30 p.m., Washington''s clock (Lady Bird Johnson''s diary, 251), the remarks prefacing the briefing (Branch, 89). The order: after [[cal.1965-03-11.civil-rights-the-executive-2]],
        Branch, 89 (the Attorney General explains "the judgment he had just rendered at a press conference"). To check: [*New York Times*, Mar. 13, 1965](https://timesmachine.nytimes.com/timesmachine/1965/03/13/issue.html),
        at 12 (cited by [[w.branch-at-canaans-edge]], 89). See [[cal.1965-03-07.voting-rights]]. Names: Johnson, Katzenbach, Williams, McNamara, Rusk.'
      tags:
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:williams-john-b
      - name:mcnamara-robert-s
      - name:rusk-dean
