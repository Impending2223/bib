- edit:
    id: cal.1965-03-05.civil-rights-organizations
    base: 7d0f3b22
    kind: correct
    set:
      c: 'Atlanta, Frazier''s café. SNCC''s executive committee meets from before 10 p.m. Friday, on King''s march from Selma.{1} Silas Norman, the Selma project''s director: SNCC should lend
        walkie-talkies for the road, cooking utensils and medical help;{2} Forman and others: a course of SNCC''s own. The committee votes to put its dissent in a letter to King; Norman and Ivanhoe
        Donaldson draft it that night.{3}'
      time: 1965-03-06T02:45Z
      n: '[[w.branch-at-canaans-edge]], 29–31; 29 n. (the minutes, "9:45 p.m., March 5, 1965"). The time: 9:45 p.m., Atlanta''s clock, the hour the minutes bear as Branch''s note cites them; the committee
        "convened before ten o''clock Friday night" (29). The time is the first night''s; the Friday meeting is dated by Branch, 29. To check: Minutes, SNCC executive committee meeting, Mar. 5, 1965, SNCC Papers, King Library and Archives (cited by [[w.branch-at-canaans-edge]], 29–31). See [[cal.1965-03-07.voting-rights]].
        Names: Forman, Martin Luther King.'
      src:
        c: c9bcc09d
        rows:
        - 'w.branch-at-canaans-edge 29–31: 1, 2, 3'
        - 'via w.branch-at-canaans-edge 29 n.basement-of-fraziers: 1'
      tags:
      - name:forman-james
      - name:king-martin-luther-jr
    unset:
    - time_approx
- add-words:
    id: cal.1965-03-06.civil-rights-organizations
    after: Atlanta, Frazier's café.
    words: 'The debate on the letter to King runs through Saturday: Bond for a bare notice of where SNCC will and will not cooperate; Cox and Forman for its dissent set out; Lewis, almost alone,
      for the march: "If these people want to march, I''m going to march with them."'
    item: '[[w.branch-at-canaans-edge]], 40–41'
