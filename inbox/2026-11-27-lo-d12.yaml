      c: 'Johnson to O''Brien, 7:25 p.m., after the Senate''s vote: thank Smathers and Long for their work on the tax bill; the conference ahead, the gasoline tax; how the civil rights
        bill goes in the House. Each day''s delay costs the economy $30 million.'
