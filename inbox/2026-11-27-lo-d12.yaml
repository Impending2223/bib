      c: 'Salinger''s last press briefing, put off from 4 to 6 p.m.: he says only that he is resigning at once to return to California and will announce an important decision the next
        day. The briefing impersonal; afterward correspondents come into his office one by one to wish him luck. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 346–48 (the briefing "postponed" from 4 to 6 p.m., 346; his words to the press, 347; the correspondents one by one, 347–48). The hour is the postponed
        schedule''s. See [[cal.1964-03-19.transition-and-staff]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
