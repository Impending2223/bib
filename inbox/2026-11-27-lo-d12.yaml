- edit:
    id: cal.1964-04-12.china-leadership-4
    base: bfdfe8bf
    set:
      c: 'Lanzhou, their second night there.{4} A telephone call from the Central Committee''s General Office: Deng Xiaoping to bring a few people from Lanzhou to Changsha at once, Mao
        to hold a meeting there. With no large airfield at Lanzhou or Xi''an, they are to fly by way of the military airfield at Wugong.{5}'
      place: lanzhou
      time_range:
      - 1964-04-12T11:00Z
      - 1964-04-12T14:00Z
      time_band: evening
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 744–745 (the call "the second night at Lanzhou"; Wugong). The flight to Changsha is the next morning, Apr. 13, by the Mao and Deng nianpu
        ([[w.zedong-mao-zedong-nianpu]], V, Apr. 10 and 13, 1964; [[w.deng-xiaoping-nianpu-1904]], III, 1809); Wu dates the flight Apr. 12 (745). Made public: 1999. See [[cal.1964-04-07.china-leadership-2]].
        Names: Deng Xiaoping, Mao Zedong. Check: the day: by Wu''s dates the call is the night of Apr. 11.'
      src:
        c: 74d5259d
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 744–745: 4, 5'
    unset:
    - variants
    kind: correct
- tag:
    id: cal.1964-04-12.china-leadership-4
    remove:
    - name:kang-sheng
    - name:peng-zhen
    - name:wu-lengxi
- add-words:
    id: cal.1964-04-13.china-leadership-11
    after: end
    words: By way of the military airfield at Wugong, they reach Changsha at noon. Peng Zhen takes the rest of the group on to Xi'an.
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 745'
