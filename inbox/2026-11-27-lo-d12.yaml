- edit:
    id: cal.1964-02-07.cuba-2
    base: a6cfe662
    set:
      c: 'The White House, the Cabinet Room, 9 a.m., Rusk presiding, on the fishing boats and Guantánamo''s water; McNamara, Ball, Robert Kennedy, Taylor, Bundy, Mann and McCone among
        those there.{1} Rusk: the seven juveniles back to Cuba; a stiff fine for the captain and the boat seized. McCone: cut the water pipes. Mann: deny the Cubans the base''s $5 million
        in wages, but dismiss no workers unless there is sabotage.{2} The President joins at about 10:05: using their own water "a mild slap on the wrist"; every firm move short of war
        to be studied, and the group to meet again at 4.{3}'
      n: 'Valenti''s notes of the meeting at 9 a.m., [FRUS 1964–68, XXXII, doc. 229](https://history.state.gov/historicaldocuments/frus1964-68v32/d229) (the Cabinet Room; the President
        joins at about 10:05 a.m., by the Daily Diary, n.2). To check: Robert Kennedy, oral history interview by John Bartlow Martin, May 14, 1964, I, 34, JFK Library (cited by [[w.schlesinger-robert-kennedy-and-his]],
        636 n.75). See [[cal.1964-02-06.cuba]]. Names: Rusk, McNamara, Ball, Robert Kennedy, Taylor, Bundy, Mann, McCone, Johnson.'
      time_zone: America/New_York
      src:
        c: '19035268'
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v32/d229: 1, 2, 3'
      gloss:
        title: Commentary
        text:
        - 'Robert Kennedy (May 14, 1964): a "rather violent" argument with Mann at the meeting; his demand for the facts brought an adjournment, and when it met again that afternoon
          McCone conceded the boats may simply have arrived there ([[w.schlesinger-robert-kennedy-and-his]], 636).'
    kind: correct
    settles:
    - 'Check: Schlesinger''s argument over the fishermen'
