      n: '[[w.zedong-mao-zedong-nianpu]], V, Feb. 27, 1964. [[w.lengxi-shinian-lunzhan-1956-1966]], 670–675 (the first of three talks with Kim Il Sung, Feb. 27, the day before Wu and
        Deng returned from Vietnam; Mao put three proposals, talks again, a meeting of 17 parties, a world conference of 81 or 100-odd, the talks in October or September or August but
        not July; the CPSU plenum and its letter of Feb. 12; the Soviet ambassador to Pyongyang''s call on Kim before he left; Mao expects the CPSU to hold two hands, a "decisive rebuff"
        and Romania as mediator; the Korean side: Pak Kum-chol, Kim Chang-man and Pak Yong-guk; Wu was not at the talk and read the record); [[w.yang-shangkun-riji]], II, 355–356 (Feb.
        27, 1964; 5 to 8:30 p.m.: Yang meets (接) Kim Il Sung''s party, at the talks, Mao''s reception and dinner; the place not named; Liu, Peng and Li Fuchun not named); [[w.peng-zhen-nianpu-1902]],
        IV, 321 (Feb. 27 and 29, 1964; Diaoyutai; Peng Zhen, with Li Fuchun, Yang Shangkun and others, accompanies Mao, Liu Shaoqi and others in meeting Kim Il Sung, asking the Korean
        views on the Center''s reply to the CPSU''s letter of Nov. 29, 1963); [[w.lengxi-shinian-lunzhan-1956-1966]], 673. The range is Yang''s span, 5 to 8:30 p.m., for his meeting
        Kim''s party, the talk, and Mao''s reception and dinner (II, 355–56); the Mao nianpu has the afternoon. Made public: 1999. Check: Wu (671) has "most of the Standing Committee"
        at the three talks with Kim Il Sung, the Chinese side headed by Mao, Zhou Enlai being abroad; Deng Xiaoping was in Vietnam on Feb. 27. Names: Mao Zedong, Kim Il Sung, Liu Shaoqi,
        Peng Zhen, Li Fuchun, Yang Shangkun, Pak Kum-chol, Kim Chang-man, Pak Yong-guk. Check: the Korean names (Chinese: Pu Jinzhe, Jin Changman, Pu Yongguo).'
