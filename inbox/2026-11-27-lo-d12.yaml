- edit:
    id: cal.1964-02-11.civil-rights-bill-2
    base: 089865c9
    set:
      c: 'The day after the House vote.{1} The Oval Office, late afternoon: Johnson for wearing out the Southerners in round-the-clock sessions, Justice for cloture.{2} Robert Kennedy,
        Katzenbach, Burke Marshall, O''Brien and Salinger are in the Oval Office with Johnson.{7} Katzenbach: Justice has pledged McCulloch that no title will be traded away in the Senate.{8}'
      n: '[[w.kotz-judgment-days]], 112–14 (Katzenbach''s account; the late-afternoon meeting, Johnson for wearing out the Southerners, Justice for cloture); [[w.whalen-longest-debate]],
        124–27 (Robert Kennedy, Katzenbach, Marshall, O''Brien and Salinger; Katzenbach on the pledge to McCulloch); [[w.purdum-idea-whose-time-has-2014]], 202 (the strategy session
        with O''Brien, Katzenbach and Marshall); [[w.whalen-longest-debate]], 125. Kotz (112–13) has the Oval Office meeting in the late afternoon, hours before the reception. Names:
        Johnson, Katzenbach, Robert Kennedy, Burke Marshall, O''Brien, Salinger.'
      src:
        c: c9c26cd0
        rows:
        - 'w.kotz-judgment-days 112–14: 1, 2'
        - 'via w.kotz-judgment-days 113 n.2a: 1, 2'
        - 'w.whalen-longest-debate 124–27: 1, 2'
        - 'via x.1964-02-11.lbj-diary-backup-box-4: 1, 2'
        - 'w.purdum-idea-whose-time-has-2014 202: ?'
        - 'w.whalen-longest-debate 125: 7, 8'
    unset:
    - variants
    kind: correct
