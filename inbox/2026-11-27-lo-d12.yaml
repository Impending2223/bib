- edit:
    id: cal.1964-04-12.china-leadership-6
    base: 37c6c8af
    set:
      date: '1964-04-13'
      when: Apr. 13–14
      c: Changsha. The evening of Apr. 13 and the morning of the 14th, Wu Lengxi redrafts the telegram to Khrushchev from Mao's four points, then Deng Xiaoping, Wang Renzhong, Zhang
        Pinghua and Kang Sheng discuss and amend it. Some want it fuller, some two plain paragraphs; Deng has Wu make a long and a short draft for discussion in the afternoon and then
        for Mao.
      time_range:
      - 1964-04-13T11:00Z
      - 1964-04-13T14:00Z
      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 747 ("that evening and the next morning"; the two drafts; Wu''s days Apr. 12 and 13); [[w.zedong-mao-zedong-nianpu]], V, Apr. 13 and
        14, 1964 (the meeting Apr. 13, afternoon; Apr. 14, 3:30 p.m., Mao on the first draft, a meeting at 5); [[w.deng-xiaoping-nianpu-1904]], III, 1809 (Apr. 14, 1964; 上午, Deng revises
        the telegram; 下午, hears Mao''s comments). The Mao nianpu and the Deng nianpu put the redrafting the evening of Apr. 13 and the morning of Apr. 14. The time is the first day''s.
        Made public: 1999. See [[cal.1964-04-13.china-leadership]]. Names: Deng Xiaoping, Kang Sheng, Mao Zedong, Wu Lengxi, Wang Renzhong, Zhang Pinghua.'
      src:
        c: 6ee2a8be
        rows:
        - 'w.lengxi-shinian-lunzhan-1956-1966 747: all'
        - 'w.zedong-mao-zedong-nianpu V, Apr. 13 and 14, 1964: date'
        - 'w.deng-xiaoping-nianpu-1904 III, 1809: date'
    kind: correct
