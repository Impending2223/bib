- edit:
    id: cal.1964-02-10.civil-rights-bill-3
    base: 62a85ef7
    set:
      c: 'Johnson and Robert Kennedy by telephone, 9:07 p.m., on the House''s vote.{1} Johnson: "Congratulations."{2} Kennedy: "I thought it was wonderful—290 to 130, you can''t do better
        than that."{3} The pressure now on the Senate.{4} Johnson: Kennedy to work out with O''Brien and Mansfield how to put the bill straight on the Senate calendar.{5}'
      n: '[Johnson and Robert Kennedy, 9:07 p.m.](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation), Conversation
        WH6402-14-2034 (Miller Center). [[w.shesol-mutual-contempt]], 162; [[w.whalen-longest-debate]], 122 (his calls that evening: also Celler, Halleck, O''Hara, McCormack, Corman,
        Roosevelt, Keogh, Thompson, Katzenbach and Rodino; not McCulloch); [[w.purdum-idea-whose-time-has-2014]], 201–02 (the 9:07 p.m. call, less than an hour after the vote, O''Brien
        with Johnson; "Congratulations," its speaker not given; "I thought it was wonderful—290 to 130" Johnson''s; Kennedy on the pressure on the Senate; Johnson: work with O''Brien
        and Mansfield to put the bill on the Senate calendar); [[w.risen-bill-of-the-century]], 163–64 (Johnson to Kennedy: "get together with Larry and Mike Mansfield in the morning";
        Justice to run it). After the House''s vote (the sources above). The Miller Center has the call at 9:07 p.m. Check: Purdum, 202, gives Johnson the words "I thought it was wonderful—290
        to 130," and "Congratulations" no speaker (*The Presidential Recordings: Lyndon B. Johnson*, IV, 451–52, cited 357). Check: Risen, 163–64, puts the call "the morning after the
        vote"; the Miller Center''s summary of this call has the meeting with O''Brien and Mansfield. See [[cal.1964-02-10.civil-rights-bill]]. Names: Johnson, Robert Kennedy.'
      time: 1964-02-11T02:07Z
      time_zone: America/New_York
      src:
        c: '33447845'
        rows:
        - 'https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-robert-kennedy-and-office-conversation: 1, 2, 3, 4, 5'
        - 'w.shesol-mutual-contempt 162: 1, 2, 3, 4'
        - 'via w.shesol-mutual-contempt 162 n.very-nice: 1, 2, 3, 4'
        - 'w.whalen-longest-debate 122: 1'
        - 'via x.1964-02-10.lbj-diary-backup-box-4: 1'
        - 'w.purdum-idea-whose-time-has-2014 201–02: 4, 5'
        - 'w.risen-bill-of-the-century 163–64: 5'
    kind: correct
    settles:
    - 'Check: Risen, 163–64, puts Johnson''s call to Robert Kennedy'
