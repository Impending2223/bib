      c: 'The White House, 5 p.m., the President with the group of an informal meeting just before, and Rusk, Ball, Nitze, Wilson of USIA and Sorensen, on the fishing boats and Guantánamo''s
        water. The crews to go free, not fined; the captains fined; the boats not forfeited. On the base''s Cuban workers McNamara strongly for dismissal, Taylor with him; Robert Kennedy
        strongly against: an overreaction, hurting loyal Cubans; McCone with him; Bundy for the second course. Johnson chooses the first, the dismissal.'
      n: 'FitzGerald''s record of the 5 p.m. meeting, [FRUS 1964–68, XXXII, doc. 235](https://history.state.gov/historicaldocuments/frus1964-68v32/d235) (drafted Feb. 8). To check: Robert
        Kennedy, oral history interview by John Bartlow Martin, May 14, 1964, I, 34–37, JFK Library; Schlesinger, journal, Mar. 11, 1964 (cited by [[w.schlesinger-robert-kennedy-and-his]],
        636 n.76). See [[cal.1964-02-07.cuba-2]]. Names: Johnson, Rusk, Ball, Nitze, Sorensen, McNamara, Taylor, Robert Kennedy, McCone, Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:ball-george-w
      - name:nitze-paul
      - name:sorensen-theodore-c
      - name:mcnamara-robert-s
      - name:taylor-maxwell
      - name:kennedy-robert-f
      - name:mccone-john-a
      - name:bundy-mcgeorge
      gloss:
        title: Commentary
        text:
        - 'Robert Kennedy (May 14, 1964): Mann, for discharging the workers, "sounded like Barry Goldwater making a speech at the Economic Club"; Kennedy lost, and by his account it
          was the last meeting of substance on foreign affairs he was asked to ([[w.schlesinger-robert-kennedy-and-his]], 636).'
