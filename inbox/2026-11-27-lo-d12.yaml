      n: '[[w.lengxi-shinian-lunzhan-1956-1966]], 769–770 (the note drafted after the return of Apr. 20 on the lines Deng Xiaoping had worked out on the road; Mao "approved it on the
        26th", his words); [[w.jianguo-yilai-mao-zedong]], XVII, 242–243 (Apr. 26, 1964; Mao''s note to Kang Sheng and Wu Lengxi on their letter of Apr. 25 sending the draft, written
        at 12:05 a.m. Apr. 26 (四月二十六日上午零时五分); no place given; the note renamed the note of the editorial department); [[w.mao-zedong-zhuan]], V, ch. 71 (the digest of the CPSU documents,
        with an editors'' note, printed Apr. 27 with Mao''s approval (n.40)). [[w.lengxi-shinian-lunzhan-1956-1966]], 769. Made public: 1999. To check: Kang Sheng and Wu Lengxi to Mao
        Zedong, letter of Apr. 25, 1964 sending the draft Renmin ribao editors'' note on the CPSU''s February plenum documents (cited by [[w.jianguo-yilai-mao-zedong]], XVII, 242 n.1).
