        1964 (the Changsha meeting, afternoon); [[w.deng-xiaoping-nianpu-1904]], III, 1809 (Apr. 13, 1964; Mao asks Deng to tell Zhou Enlai his view of the trade talks). The Mao nianpu
        and the Deng nianpu date the meeting Apr. 13, and the call is that evening. Made public: 1999. See [[cal.1964-04-13.china-leadership]]. Names: Deng Xiaoping, Zhou Enlai, Mao
        Zedong.'
