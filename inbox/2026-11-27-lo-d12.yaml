- edit:
    id: cal.1964-02-03.civil-rights-bill
    base: 75c3b347
    set:
      c: 'House, in Committee of the Whole on the civil rights bill, the amendments begin. Title I, voting: nine Southern amendments defeated; two by Southern Republicans accepted, a
        three-judge court for defendants as for the Attorney General, and Puerto Rico within the bill.{1} The last teller vote of the day, on Dowdy''s amendment that no vote be counted
        but a living elector''s, cast in person in his precinct, fails 117 to 124.{2}'
      n: '[110 Cong. Rec. 1709](https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-4-1.pdf#page=34) (1964) (Feb. 3, 1964: the last teller vote of the day).
        [[w.bernstein-guns-or-butter]], 51; [[w.whalen-longest-debate]], 109 (Feb. 3, six Southern amendments defeated, Poff''s and Cramer''s accepted, the last teller vote 117–124;
        Feb. 4, three more defeated); [[w.purdum-idea-whose-time-has-2014]], 189–90 (Title I on Feb. 3: Poff''s amendment, a three-judge court for defendants, 100 to 68 standing, and
        Cramer''s, Puerto Rico, accepted; Purdum calls Poff a Virginia Democrat; Smith''s, 55 to 155, "over the next two days"; not the nine Southern amendments); [[w.risen-bill-of-the-century]],
        158 (Feb. 3, Willis''s amendment to strike Title I''s three-judge court defeated; not the other amendments). See [[cal.1964-01-31.civil-rights-bill]].'
      src:
        c: 003be192
        rows:
        - 'w.bernstein-guns-or-butter 51: 1'
        - 'w.whalen-longest-debate 109: 1'
        - 'via x.1964-02-03.congressional-record-1677: 1'
        - 'w.purdum-idea-whose-time-has-2014 189–90: ?'
        - 'w.risen-bill-of-the-century 158: ?'
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt2/pdf/GPO-CRECB-1964-pt2-4-1.pdf#page=34: 2'
