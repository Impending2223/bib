      c: 'The diplomatic reception, evening: Johnson pulls up two chairs in the middle of the room with Katzenbach. "How the hell are you going to get cloture?" Katzenbach''s list: fifty-eight;
        the other nine from some fourteen senators. Johnson: "Hayden''s never going to vote for cloture."'
      n: '[[w.kotz-judgment-days]], 112–14 (Katzenbach''s account); [[w.whalen-longest-debate]], 127 (two hours after the Oval Office meeting, the two chairs; Katzenbach''s list, "9
        of these 14"); [[w.johnson-white-house-diary]], 70–71 (the diplomatic reception in the evening, Johnson at it until 9:30; not the talk of cloture); [[w.purdum-idea-whose-time-has-2014]],
        209–10 (Johnson corners Katzenbach at the reception: cloture, round-the-clock sessions, Hayden; Katzenbach''s estimate, fifty-seven to sixty "with reasonable ease"); [[w.risen-bill-of-the-century]],
        163 (Feb. 11, at a White House reception Johnson takes Katzenbach aside, two chairs together). To check: Katzenbach, interview by Kotz; Katzenbach, oral history, LBJ Library;
        Katzenbach, "Toward a More Just America for All," in Thomas W. Cowger and Sherwin J. Markman, eds., *Lyndon Johnson Remembered* (2003), 125–38 (cited by [[w.kotz-judgment-days]],
        113–14 nn.2–3). See [[cal.1964-02-11.civil-rights-bill-2]]. Names: Johnson, Katzenbach, Hayden. Check: Risen, 163, has Johnson ask "How do you plan to get this bill enacted in
        the Senate?", Katzenbach''s count fifty-seven to sixty votes for cloture "fairly easily" and seventy-four potential votes, and seven more needed from fourteen senators who have
        voted at least once for cloture. Check: Kotz, 112, puts the Oval Office meeting several hours before the reception; Whalen, 127, two hours.'
      tags:
      - name:johnson-lyndon-b
      - name:katzenbach-nicholas
      - name:hayden-carl
