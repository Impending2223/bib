        Center; dated Feb. 7). [[w.zelizer-taxing-america]], 204 (the $30 million). The order: after the Senate''s vote, [[cal.1964-02-07.economy]]. See [[cal.1964-02-07.economy-2]].
        Names: Johnson, O''Brien, Smathers, Long.'
