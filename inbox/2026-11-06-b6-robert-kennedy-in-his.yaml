      when: Jan., late
      date: 1964-01
      thread: robert-kennedy
      c: 'London, by Robert Kennedy''s account. Robert Kennedy telephones Macmillan; a letter from Macmillan: President Kennedy
        the greatest public official he had ever met.'
      n: '[[w.robert-kennedy-in-his]], 262 (to Martin, 1964: "when I was in London this last time"; the editors'' date, January
        1964). See [[cal.1964-01-23.robert-kennedy]]. Check: the day; the letter''s date. Names: Robert Kennedy, Macmillan,
        John F. Kennedy.'
