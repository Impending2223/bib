      c: 'The night before Dallas, by Robert Kennedy''s later account. Kennedy to his wife: Johnson "incapable of telling
        the truth." Kennedy then thinking, by the same account, of McNamara for the nomination of 1968.'
      n: '[[w.robert-kennedy-in-his]], 26, 46 (to Schlesinger, Feb. 27, 1965, and to Martin, Feb. 29, 1964). See [[cal.1963-11-21.assassination]].
        Names: John F. Kennedy, Jacqueline Kennedy, Johnson, McNamara, Robert Kennedy.'
