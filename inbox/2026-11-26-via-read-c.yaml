  - primary:
      id: cal.1961-04-06.cuba-bay-of-pigs
      text: 'Cuba Study Group, Memorandum No. 1 to President Kennedy, "Narrative of the Anti-Castro Cuban Operation Zapata" (June 13, 1961), [FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231), par. 30 (the plan for the strikes on D-2 with the diversionary landing; limited strikes on D-Day) and the passage on the Apr. 6 meeting.'
      on: 'a guerrilla landing on D-2.'
  - src:
      id: cal.1961-04-06.cuba-bay-of-pigs
      row: 'https://history.state.gov/historicaldocuments/frus1961-63v10/d231'
      on: 'the strikes limited;'
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107'
      'on': 'Mao to Tian Jiaying: three investigation groups of seven, led by Chen Boda (Guangdong), Hu Qiaomu (Hunan) and Tian (Zhejiang), each with his 1930 "On Investigation Work";'
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107'
      'on': one team to the worst brigade, one to the best, ten to fifteen days;
  - cite:
      id: cal.1961-01-20.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 106–107'
      'on': then to report to him at Guangzhou and study industry there a month.
  - cite:
      id: cal.1961-01-21.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 83–88'
      'on': rectification in stages over the country.
  - cite:
      id: cal.1961-03-13.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 215–216'
      'on': 'Mao, 8 a.m., to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, by Tao Zhu: the two egalitarianisms, between teams in a brigade and between members in a team, "two extremely grave questions," to be studied in person; Deng and Peng to spend ten days in Miyun, Shunyi, Huairou: are they "still unclear"?'
  - cite:
      id: cal.1961-03-23.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 225–227'
      'on': 'The Center sends the Party''s regional bureaus and provincial committees a letter on conducting investigation seriously, with Mao''s 1930 essay "Investigation Work": county committees and above, first secretaries first, to study Mao''s method and make going down to the base, in person, for systematic typical inquiry the first task of leadership.'
  - cite:
      id: cal.1961-04-15.china-leadership-5
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–302'
      'on': to be printed that day for the Hunan three-level cadre conference and discussed there;
  - cite:
      id: cal.1961-05-06.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317'
      'on': 'Mao to Li Jingquan, for Chen Zhengren at Pingquan commune, Jianyang: Chen''s letter of May 1 received;'
  - cite:
      id: cal.1961-05-06.china-leadership-3
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 316–317'
      'on': 'To Li: why no letter? Has he been out to investigate? The Center''s list of topics went out Apr. 25; the May 4 notice puts the conference off to May 20 for fuller inquiry, so Peking can go further than Guangzhou.'
  - cite:
      id: cal.1961-05-07.china-leadership
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 318–319'
      'on': supply only for the "five guarantees" households and the needy; work points as in the higher cooperatives, output contracted to the teams, work to groups.
  - cite:
      id: cal.1961-05-09.china-leadership-7
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 320–323'
      'on': 'Mao has Hu Qiaomu''s letter of May 8 on the Hunan investigation group sent to the bureaus and committees for reference. Hu: with the Hunan committee the group has made first revisions to the Sixty Articles; Shaoshan commune''s mess halls are down from 112 to 6;'
  - cite:
      id: cal.1961-05-14.china-leadership-2
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336'
      'on': Mao has Zhang Pinghua's letter of May 13 on his investigation at a brigade of Wenjiashi commune sent to the bureaus and committees for reference.
  - cite:
      id: cal.1961-05-14.china-leadership-2
      item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 332–336'
      'on': the mass line, every matter settled with the masses; no committee may go without investigation, and a few men shut in a room making "policies that kill people" are "absolutely forbidden."
