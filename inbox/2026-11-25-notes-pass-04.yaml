- add-words:
    id: cal.1962-10-22.missile-crisis-4
    after: end
    words: 'Humphrey is flown in by a military plane, with Hickenlooper from Iowa; Hale Boggs is brought from the Gulf by helicopter and jet. Halleck is informed, not consulted. Kennedy to Dirksen: tonight he will get re-elected. Kennedy: he himself was for an air strike or an invasion last Tuesday.'
