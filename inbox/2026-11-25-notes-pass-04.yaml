- add-words:
    id: cal.1962-10-27.missile-crisis
    after: end
    words: 'Dobrynin''s report written that night: the generals "spoiling for a fight"; the Jupiters out in four to five months, nothing said publicly; an answer by Sunday. Robert Kennedy sees him at 7:45 p.m. at the Justice Department.'
    item: '[[w.dobrynin-in-confidence]], 89–91'
- add-words:
    id: cal.1962-10-27.missile-crisis
    after: end
    words: Saturday afternoon Sorensen, with Robert Kennedy and Thompson, urges the President to answer the first letter and delay the reply to the second twenty-four to forty-eight hours.
    item: '[[w.sorensen-counselor]], 300–01'
