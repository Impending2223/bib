    - name:acheson-dean-g
    - name:johnson-lyndon-b
- add-words:
    id: cal.1961-08-01.transition-and-staff
    after: end
    words: The press story was Anthony Lewis's in the *Times* of July 3.
    item: '[[w.navasky-kennedy-justice]], 362–63'
- names:
    id: cal.1961-08-01.transition-and-staff
    add:
    - Lewis
    tags:
    - name:lewis-anthony
- add-words:
    id: cal.1961-08-31.testing
    after: end
    words: 'The meeting, with the leaders, is Thursday morning at 10:45. Present: Johnson, Rusk, McNamara, Seaborg, Dulles, Lemnitzer, Taylor, Bohlen, Murrow, Fisher, Bundy and Schlesinger. Rusk proposes a statement announcing the decision to resume; Kennedy, after a call from Stevenson, turns it into preparations ordered. Johnson: Khrushchev should take the heat for a few days. Murrow is against a statement.'
    item: '[[w.schlesinger-journals]], 130–32'
- names:
    id: cal.1961-08-31.testing
    add:
    - Johnson
    - Rusk
    - McNamara
    - Seaborg
    - Dulles
    - Lemnitzer
    - Taylor
    - Bohlen
