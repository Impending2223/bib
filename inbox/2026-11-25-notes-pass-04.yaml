patch: notes-pass-04
by: 'Claude (reader; the notes pass, batch 04: R33a, building on the entry from its cites)'
ops:
- add-words:
    id: cal.1960-12-07.china-leadership
    after: end
    words: 'Afternoon, the enlarged Politburo. Deng: the greatest gain, "agreement through consultation"; Khrushchev and the CPSU criticized; neither side wants a split; the argument ended for a stage, not finished.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1603–1604'
- add-words:
    id: cal.1960-12-07.china-leadership
    after: end
    words: Peng Zhen and Zhu De attend.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 83'
- names:
    id: cal.1960-12-07.china-leadership
    add:
    - Peng Zhen
    - Zhu De
    - Khrushchev
    tags:
    - name:peng-zhen
    - name:zhu-de
    - name:khrushchev-nikita-s
- add-words:
    id: cal.1960-12-16.robert-kennedy
    after: end
    words: The announcement, with Dillon's, is on the front steps at N Street.
    item: '[[w.odonnell-johnny-we-hardly-knew]], 273'
- add-words:
    id: cal.1960-12-16.robert-kennedy
    after: end
    words: Clifford, against the appointment, goes to Joseph Kennedy.
    item: '[[w.clifford-counsel-to-the-president-2]], 336–38'
- add-words:
    id: cal.1960-12-16.robert-kennedy
    after: end
    words: Joseph Kennedy is for it.
    item: '[[w.robert-kennedy-in-his]], 73–74'
- names:
    id: cal.1960-12-16.robert-kennedy
    add:
    - Clifford
    - Joseph Kennedy
    tags:
    - name:clifford-clark
    - name:kennedy-joseph-p
- add-words:
    id: cal.1960-12-19.china-leadership-3
    after: end
    words: Chen Yi and First Deputy Premier Nhiek Tioulong sign a protocol on economic and technical aid, a supplementary protocol to the aid agreement of June 21, 1956, an air-transport agreement and notes on Chinese railway and farm experts.
    item: '[[w.zhonghua-renmin-gongheguo-waijiao-2001]], 177'
- add-words:
    id: cal.1960-12-19.china-leadership-3
    after: end
    words: Zhu De attends the signing.
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1789'
- check:
    id: cal.1960-12-19.china-leadership-3
    text: 'Check: Chen Yi''s chronology ([[w.chen-yi-nianpu]], 848–849) has a shipping agreement where the Foreign Ministry''s history has an air-transport agreement (177).'
- names:
    id: cal.1960-12-19.china-leadership-3
    add:
    - Chen Yi
    - Nhiek Tioulong
    - Zhu De
    tags:
    - name:chen-yi
    - name:nhiek-tioulong
    - name:zhu-de
- add-words:
    id: cal.1960-12-24.china-leadership
    after: end
    words: 'Chen Yun speaks from his three months'' inquiry: a billion yuan for higher grain purchase prices; oil-seed, pig, poultry and egg prices raised. Mao: socialist construction not to be rushed, half a century; 1961 a year of seeking truth from facts.'
    item: '[[w.chen-yun-nianpu-xiuding]], III, 60–61'
- add-words:
    id: cal.1960-12-24.china-leadership
    after: end
    words: Peng Zhen and Zhu De attend.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 86'
- names:
    id: cal.1960-12-24.china-leadership
    add:
    - Chen Yun
    - Peng Zhen
    - Zhu De
    tags:
    - name:chen-yun
    - name:peng-zhen
    - name:zhu-de
- add-words:
    id: cal.1960-12-26.china-leadership
    after: end
    words: 'Mao: he no longer chairs the Politburo and "practically never speaks" at the Central Committee; Liu Shaoqi has run its routine since 1956. Yan Mingfu, Zhu Jueren, Sudarikov and Rakhmanin are present; the greetings are from the CPSU Central Committee and Khrushchev.'
    item: '[[w.brothers-in-arms]], 365–369'
- names:
    id: cal.1960-12-26.china-leadership
    add:
    - Liu Shaoqi
    - Khrushchev
    - Yan Mingfu
    - Sudarikov
    tags:
    - name:liu-shaoqi
    - name:khrushchev-nikita-s
    - name:yan-mingfu
    - name:sudarikov
- add-words:
    id: cal.1961-01-09.china-leadership
    after: end
    words: 'Mao adds "no investigation, no right to speak." Liu Zihou reports on two Hebei counties; Mao: the false Communist, the real Kuomintang.'
    item: '[[w.mao-zedong-zhuan]], V, ch. 67 n.7'
- add-words:
    id: cal.1961-01-09.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 91'
- names:
    id: cal.1961-01-09.china-leadership
    add:
    - Peng Zhen
    - Liu Zihou
    tags:
    - name:peng-zhen
    - name:liu-zihou
- add-words:
    id: cal.1961-01-09.transition-and-staff
    after: end
    words: Kennedy is at the house from about 2:20 to shortly before 5, about 300 people in the cold outside; after Schlesinger, Surrey's tax task force, Chayes, Bundy, Stratton and Wiesner see him.
    item: '[[w.schlesinger-journals]], 102'
- add-words:
    id: cal.1961-01-09.transition-and-staff
    after: end
    words: The address is his "Farewell to Massachusetts," drafted by Sorensen.
    item: '[[w.sorensen-counselor]], 219–20'
- names:
    id: cal.1961-01-09.transition-and-staff
    add:
    - Surrey
    - Sorensen
    tags:
    - name:surrey-stanley-s
    - name:sorensen-theodore-c
- add-words:
    id: cal.1961-01-18.china-leadership
    after: end
    words: 'Liu Shaoqi and Chen Yun also speak: Liu on the Moscow conference, Chen Yun on planning, agriculture, the market and grain. Liu: Mikoyan and Kozlov came Nov. 26 to feel China out with the lure of restored aid.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 445–448'
- add-words:
    id: cal.1961-01-18.china-leadership
    after: end
    words: 'Mao: Khrushchev rushed to Bucharest, fearing the three articles; the 81-party meeting a great success; unity now, even with parties that cursed China.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 449–451'
- names:
    id: cal.1961-01-18.china-leadership
    add:
    - Liu Shaoqi
    - Chen Yun
    - Khrushchev
    - Mikoyan
    - Kozlov
    tags:
    - name:liu-shaoqi
    - name:chen-yun
    - name:khrushchev-nikita-s
    - name:mikoyan-anastas
    - name:kozlov-frol-r
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: Liu Shaoqi presides on the 20th, 22nd and 23rd.
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 508'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: 'Deng Xiaoping, in speeches of the 19th and 23rd, makes a self-criticism for the Secretariat: investigation a basic, permanent method.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1623'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: 'The conference in effect began Mar. 10: the Three South conference at Canton under Mao, the Three North at Peking under Liu, Zhou Enlai, Chen Yun and Deng, the Three North going to Canton Mar. 14. Zhu De attends.'
    item: '[[w.zhu-de-nianpu-xinbian]], III, 1800–1801'
- add-words:
    id: cal.1961-03-15.china-leadership-2
    after: end
    words: Zhou speaks on the 19th, 20th and 22nd; Peng Zhen attends.
    item: '[[w.zhou-enlai-nianpu-1949]], II, 398–99'
- names:
    id: cal.1961-03-15.china-leadership-2
    add:
    - Liu Shaoqi
    - Zhou Enlai
    - Chen Yun
    - Zhu De
    - Peng Zhen
    tags:
    - name:liu-shaoqi
    - name:zhou-enlai
    - name:chen-yun
    - name:zhu-de
    - name:peng-zhen
- add-words:
    id: cal.1961-03-23.china-leadership-3
    after: end
    words: 'The letter holds: "No investigation, no right to speak."'
    item: '[[w.macfarquhar-origins-of-the-cultural]], III, 48'
- add-words:
    id: cal.1961-03-23.china-leadership-3
    after: end
    words: Then Liu Shaoqi goes to Changsha and Ningxiang, Zhu De to Sichuan, Hunan and Shaanxi, Deng Xiaoping and Peng Zhen to Shunyi and Huairou.
    item: '[[w.peng-dehuai-nianpu]], 763'
- names:
    id: cal.1961-03-23.china-leadership-3
    add:
    - Liu Shaoqi
    - Zhu De
    - Deng Xiaoping
    - Peng Zhen
    tags:
    - name:liu-shaoqi
    - name:zhu-de
    - name:deng-xiaoping
    - name:peng-zhen
- add-words:
    id: cal.1961-04-19.cuba
    after: end
    words: 'The Chiefs'' order to Dennison goes at 0337: pilots to carry as little identification as possible. Lemnitzer: "go guerrilla"; Burke, prodded by Robert Kennedy, asks an hour of air cover.'
    item: '[[w.poole-joint-chiefs-of-staff]], 115'
- names:
    id: cal.1961-04-19.cuba
    add:
    - Dennison
    - Lemnitzer
    - Robert Kennedy
    tags:
    - name:dennison-robert-l
    - name:lemnitzer-lyman-l
    - name:kennedy-robert-f
- add-words:
    id: cal.1961-04-22.china-leadership-2
    after: end
    words: 'The Laotian side: Souvanna Phouma and Souphanouvong. Dinner on the 22nd, talks the morning of the 23rd, Chen Yi at them, "in a cordial and friendly atmosphere"; common views reached.'
    item: '[[w.chen-yi-nianpu]], 868'
- names:
    id: cal.1961-04-22.china-leadership-2
    add:
    - Souphanouvong
    - Chen Yi
    tags:
    - name:souphanouvong
    - name:chen-yi
- add-words:
    id: cal.1961-04-26.china-leadership-2
    after: end
    words: Deng Xiaoping sends it, on Mao's wish, as Zhongfa [61] 323 to the bureaus and committees, with four enclosures, titled "several important documents the Chairman commented on."
    item: '[[w.yang-jisheng-mubei]], II, 1173'
- add-words:
    id: cal.1961-04-26.china-leadership-2
    after: end
    words: 'Hu''s letter of Apr. 14, from Shaoshan: in three brigades of the former Dongjiao commune at Xiangxiang, 707 dead from October 1958 to March 1961, 13.5 percent of their people; in two brigades nearby, about 20 percent over three years.'
    item: '[[w.jianguo-yilai-zhongyao-wenxian]], XIV, 300–315'
- names:
    id: cal.1961-04-26.china-leadership-2
    add:
    - Deng Xiaoping
    tags:
    - name:deng-xiaoping
- add-words:
    id: cal.1961-04-28.opinion
    after: end
    words: 'May 3: Evelyn Lincoln brings Kennedy an advance of the poll, which Schlesinger''s journal has at 82 percent.'
    item: '[[w.schlesinger-journals]], 121'
- names:
    id: cal.1961-04-28.opinion
    add:
    - Lincoln
    tags:
    - name:lincoln-evelyn
- add-words:
    id: cal.1961-05-25.space
    after: end
    words: 'Defense: $100 million for the ROAD divisions, $138 million for Army and Marine equipment, the Marines raised to 190,000.'
    item: '[[w.poole-joint-chiefs-of-staff]], 65'
- add-words:
    id: cal.1961-05-25.space
    after: end
    words: Kennedy departs from his text to add a note of urgency, and inserts "this decade" himself.
    item: '[[w.sorensen-counselor]], 336–37'
- names:
    id: cal.1961-05-25.space
    add:
    - Sorensen
    tags:
    - name:sorensen-theodore-c
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: 'Khrushchev: the treaty "in December of this year." Kennedy: "Then it will be a cold winter."'
    item: '[[w.prezidium-tsk-kpss-1954]], III, 171–215'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: In the garden walk Khrushchev holds to three inspections a year, with a veto.
    item: '[[w.fursenko-khrushchevs-cold-war]], 360–64'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: 'On China, Khrushchev presses its U.N. seat and Taiwan; Kennedy: the Soviets may get to know the Chinese "even better."'
    item: '[[w.chang-friends-and-enemies]], 231–32'
- add-words:
    id: cal.1961-06-03.berlin-and-vienna
    after: end
    words: On Laos both to press their clients to work with the Commission; Khrushchev to do his utmost for a truly neutral government.
    item: '[[w.guan-vietnamese-communists-relations-with]], 194'
- add-words:
    id: cal.1961-06-10.china-leadership-3
    after: end
    words: 'Deng presides, on the anniversary and university entrance. To Lu Dingyi on making intellectuals'' world-view a political question, Deng: the "left" again, some members capping others for their own ends; enough that they support the Party''s leadership.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1645'
- add-words:
    id: cal.1961-06-10.china-leadership-3
    after: end
    words: Peng Zhen attends; Liu Shaoqi's speech for the anniversary and college admissions are on the agenda.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
- names:
    id: cal.1961-06-10.china-leadership-3
    add:
    - Deng Xiaoping
    - Lu Dingyi
    - Peng Zhen
    - Liu Shaoqi
    tags:
    - name:deng-xiaoping
    - name:lu-dingyi
    - name:peng-zhen
    - name:liu-shaoqi
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: 'Mao: sum up eleven years of building, which may take another eleven; read Stalin''s *Economic Problems of Socialism in the USSR* again.'
    item: '[[w.mao-zedong-zhuan]], V, ch. 68 n.19'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: When Li Fuchun says the plan must first meet farming and the market, Mao says Chen Yun held before that the market comes first, many opposed it and he kept silent; now back on that track.
    item: '[[w.chen-yun-nianpu-xiuding]], III, 93'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: After Mao, Li Fuchun, Zhou Enlai and Li Xiannian speak.
    item: '[[w.yang-shangkun-riji]], II, 41'
- add-words:
    id: cal.1961-06-12.china-leadership
    after: end
    words: Peng Zhen attends.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
- names:
    id: cal.1961-06-12.china-leadership
    add:
    - Chen Yun
    - Li Fuchun
    - Zhou Enlai
    - Li Xiannian
    - Peng Zhen
    tags:
    - name:chen-yun
    - name:li-fuchun
    - name:zhou-enlai
    - name:li-xiannian
    - name:peng-zhen
- add-words:
    id: cal.1961-06-12.china-leadership-3
    after: end
    words: 'June 12, afternoon: Liu Shaoqi, with Soong Ching-ling, Dong Biwu, Zhu De and Zhou Enlai, meets the delegation. Liu: shortcomings and errors, joined to two years of calamity, have added to the losses; cadres must know the laws of socialist economic development.'
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 526'
- add-words:
    id: cal.1961-06-12.china-leadership-3
    after: end
    words: Talks with Zhou, Li Fuchun, Luo Ruiqing, Luo Guibo, Fang Yi and He Wei. The communiqué records "complete identity of views"; the South's struggle against American aggression and Diệm a sacred right.
    item: '[[w.guan-vietnamese-communists-relations-with]], 196–197'
- add-words:
    id: cal.1961-06-12.china-leadership-3
    after: end
    words: Peng Zhen attends Zhou's banquet.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 133'
- names:
    id: cal.1961-06-12.china-leadership-3
    add:
    - Liu Shaoqi
    - Song Qingling
    - Dong Biwu
    - Zhu De
    - Li Fuchun
    - Luo Ruiqing
    - Luo Guibo
    - Fang Yi
    - Peng Zhen
    tags:
    - name:liu-shaoqi
    - name:song-qingling
    - name:dong-biwu
    - name:zhu-de
    - name:li-fuchun
    - name:luo-ruiqing
    - name:luo-guibo
    - name:fang-yi
    - name:peng-zhen
- add-words:
    id: cal.1961-06-17.china-leadership-2
    after: end
    words: 'The Secretariat sits 10 a.m. to 2 p.m., Deng presiding, Zhou attending, on coal: Guo Hongtao reports for the State Economic Commission, Wang Heshou adds. Deng: industry far more complex than farming, "no bottom in our hearts"; regulations only after investigation.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1645'
- add-words:
    id: cal.1961-06-17.china-leadership-2
    after: end
    words: 'Peng Zhen: these years advance and retreat without an overall plan; heavy industry''s retreat to be planned, not rash.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 134–135'
- names:
    id: cal.1961-06-17.china-leadership-2
    add:
    - Deng Xiaoping
    - Guo Hongtao
    - Wang Heshou
    - Peng Zhen
    tags:
    - name:deng-xiaoping
    - name:guo-hongtao
    - name:wang-heshou
    - name:peng-zhen
- add-words:
    id: cal.1961-07-06.china-leadership-2
    after: end
    words: 'Liu Shaoqi presides, 3 to 7 p.m. Nie Rongzhen and Zhang Jingfu report; Liu, Zhou, Deng Xiaoping, Kang Sheng, Peng Zhen and Li Fuchun speak; Mao is absent. Liu: a good document, but the work is biased toward blind command, to be corrected. Deng: it is to be tried and amended into "a constitution for scientific work."'
    item: '[[w.macfarquhar-origins-of-the-cultural]], III, 98–99'
- names:
    id: cal.1961-07-06.china-leadership-2
    add:
    - Liu Shaoqi
    - Zhang Jingfu
    - Deng Xiaoping
    - Kang Sheng
    - Peng Zhen
    - Li Fuchun
    tags:
    - name:liu-shaoqi
    - name:zhang-jingfu
    - name:deng-xiaoping
    - name:kang-sheng
    - name:peng-zhen
    - name:li-fuchun
- add-words:
    id: cal.1961-07-20.china-leadership-3
    after: end
    words: 'Peng Zhen, with Yang Shangkun, hears Qian Ying: reviews for cadres who erred in work, not for degenerates; production the center of work in the villages. Peng: the "left" and "right" labels on cadres not off production removed and no more pinned. He also hears Li Weihan (Luo Mai), Xu Bing and Ping Jiesan: the national bourgeoisie mostly reformable, by Mao''s word; posts kept or raised, the wrongly treated restored, unpaid fixed interest paid.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 141–142'
- names:
    id: cal.1961-07-20.china-leadership-3
    add:
    - Peng Zhen
    - Yang Shangkun
    tags:
    - name:peng-zhen
    - name:yang-shangkun
- add-words:
    id: cal.1961-07-24.berlin-and-vienna
    after: end
    words: At the Cabinet meeting in the Berlin crisis Robert Kennedy, with Ribicoff and Goldberg, proposes raising income taxes; Kennedy tells O'Donnell he will not mention it now to Bobby. Heller and Samuelson argue against.
    item: '[[w.odonnell-johnny-we-hardly-knew]], 315–16, 343'
- add-words:
    id: cal.1961-07-24.berlin-and-vienna
    after: end
    words: No national emergency; the call-up postponed to September; Acheson and Johnson kept out.
    item: '[[w.fursenko-khrushchevs-cold-war]], 371–72'
- names:
    id: cal.1961-07-24.berlin-and-vienna
    add:
    - Ribicoff
    - Goldberg
    - Samuelson
    - Acheson
    - Johnson
    tags:
