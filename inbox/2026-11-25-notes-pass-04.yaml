    id: cal.1962-10-16.missile-crisis
    after: end
    words: 'Kennedy, in pajamas: "He can''t do this to me!"'
    item: '[[w.thomas-robert-kennedy]], 209'
- add-words:
    id: cal.1962-10-16.missile-crisis
    after: end
    words: He calls Sorensen into the Oval Office with the U-2 news and asks for copies of his two public warnings on Soviet offensive weapons in Cuba. Johnson sits in the ExComm. Taylor is for a series of strikes and a blockade.
    item: '[[w.sorensen-counselor]], 285–86'
