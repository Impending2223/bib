    after: end
    words: 'The Presidium dictates and approves it, Protocol 62, to be broadcast at 5 p.m. Radio Moscow announces it while the ExComm meets to draft a reply to the first letter. Thompson: Khrushchev''s advisers had talked him into trying for the trade.'
