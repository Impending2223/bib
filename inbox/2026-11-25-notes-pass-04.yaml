- add-words:
    id: cal.1962-10-20.missile-crisis
    after: end
    words: Robert Kennedy telephones him in Chicago. With Admiral Burkley at his bedside he says he has a temperature and a cold and that the press is to be told he returns on Burkley's advice; Salinger gets a note, "Slight upper respiratory." Johnson, in Hawaii, also returns with "a cold." Stevenson proposes a course and dissents at the Oval Office meeting at 2:30 p.m.; Rusk's handwritten summary; Kennedy for the blockade.
    item: '[[w.odonnell-johnny-we-hardly-knew]], 364–65'
