- add-words:
    id: cal.1961-09-01.testing
    after: end
    words: 'At the Mansion Kennedy, in a bathrobe, gets two statements: McCloy for announcing resumption, Murrow and Schlesinger against. He is "not inclined to announce our resumption at this point" but does not know how much longer he can refrain.'
    item: '[[w.schlesinger-journals]], 132–33'
- names:
    id: cal.1961-09-01.testing
    add:
    - Kennedy
    - Murrow
    - Schlesinger
    - McCloy
    tags:
    - name:kennedy-john-f
    - name:murrow-edward-r
    - name:schlesinger-arthur-m-jr
    - name:mccloy-john-j
- add-words:
    id: cal.1961-09-15.china-leadership
    after: end
    words: 'In Wu Lengxi''s account the afternoon is at Mao''s residence, the Standing Committee on the CPSU''s draft Programme: Lu Dingyi, Wang Jiaxiang, Liu Ningyi, Zhang Hanfu, Peng Zhen, Yang Shangkun and Wu present, Deng Xiaoping for the first half. Lu: the "state" and the "party of the whole people" drop the dictatorship of the proletariat. Mao: two years'' struggle did not hold Khrushchev; prepare for a fight at the Twenty-second Congress.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 459–467'
- names:
    id: cal.1961-09-15.china-leadership
    add:
