patch: 2026-11-12-b11-salinger
by: Claude (batch 11 reader, Salinger, With Kennedy)
ops:
- add:
    entry:
      id: cal.1960-04-06.elections-1960-primaries-3
      when: Apr. 6
      date: '1960-04-06'
      thread: elections-1960-primaries
      c: Milwaukee, the day after the Wisconsin primary. Kennedy, angry that the press has made six districts to four a poor showing, has Bailey and Salinger stay an extra day to call in the reporters.
        They try to convince them he won against the odds; the impression of a poor showing lingers. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 33–34. Check: the day (the book says "an extra day" after the primary). See [[cal.1960-04-05.elections-1960]]. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - state:wi
      - city:milwaukee
- add:
    entry:
      id: cal.1960-04.elections-1960-religion
      when: Apr.–May
      date: 1960-04
      thread: elections-1960-religion
      also:
      - elections-1960-primaries
      c: On a train from Bluefield, W.Va., to Indianapolis. Salinger, breakfasting two tables from Billy Graham, asks him to sign a statement of Protestant ministers for religious tolerance; he says he
        would. Sorensen telephones him two days running before reaching him; Graham refuses, on the ground that he should not interfere in the election. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 34–35. Check: the day (the work gives none; West Virginia''s primary was May 10). Names: Salinger, Graham, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:graham-billy
      - name:sorensen-theodore-c
      - state:wv
      - state:in
- add:
    entry:
      id: cal.1960-07-04.elections-1960-los-angeles
      when: July 4
      date: '1960-07-04'
      thread: elections-1960-los-angeles
      c: 'Los Angeles. Kennedy and Robert Kennedy would ignore the Connally–Edwards charge; Salinger urges a quick reply. Kennedy''s physicians and he agree a statement: an adrenal insufficiency under control
        for many years, which none of his doctors considers Addison''s disease. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 40–41. Check: the day (Salinger puts the Connally–Edwards press conference on the convention''s first day; see [[cal.1960-07-04.elections-1960-2]]). Names: Salinger,
        Kennedy, Robert Kennedy, Connally.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:connally-john
- add:
    entry:
      id: cal.1960-07-12.elections-1960-los-angeles-2
      when: July 12
      date: '1960-07-12'
      thread: elections-1960-los-angeles
      c: 'Los Angeles. Told that Johnson will skip the Texas caucus Kennedy is to address, Salinger spends half an hour telling reporters that Johnson is backing out of a debate. Philip Graham of the *Washington
        Post* telephones: "Never tear something down in such a way that you can''t put it back together again." Salinger reads it as a sign Johnson may be Kennedy''s running mate. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 41–42. Check: the day. See [[cal.1960-07-12.elections-1960-2]]. Names: Salinger, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1960-07-14.elections-1960-los-angeles-21
      when: July 14–15
      date: '1960-07-14'
      thread: elections-1960-los-angeles
      c: Los Angeles, the Biltmore, that night. John S. Knight's story says Johnson forced Kennedy to take him; Salinger denies it under his own name. Rayburn, through Moyers, wants a denial in Kennedy's
        name and a call to Knight; Salinger and Robert Kennedy draft the statement, and Robert Kennedy telephones Knight, whose confidence in the story is shaken. By Salinger's memorandum of the week after.
      n: '[[w.salinger-with-kennedy]], 44–45. Names: Salinger, Rayburn, Moyers, Robert Kennedy, Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
      - name:rayburn-sam
      - name:moyers-bill
- add:
    entry:
      id: cal.1960-07-15.elections-1960-los-angeles-3
      when: July 15
      date: '1960-07-15'
      thread: elections-1960-los-angeles
      c: Los Angeles. Salinger spends most of the day backgrounding newspapermen on the vice-presidential nomination as Robert Kennedy had outlined it. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 45. Names: Salinger, Robert Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
- add:
    entry:
      id: cal.1960-07-16.elections-1960-los-angeles
      when: July 16
      date: '1960-07-16'
      thread: elections-1960-los-angeles
      also:
      - press-and-broadcasting
      c: '*New York Herald Tribune*, Earl Mazo: the story of the vice-presidential nomination Salinger calls the most authoritative. Mazo knew Robert Kennedy had not seen Johnson before Kennedy did.'
      n: '[[w.salinger-with-kennedy]], 45. Names: Salinger, Robert Kennedy, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:johnson-lyndon-b
- cite:
    id: cal.1960-07-04.elections-1960-2
    item: '[[w.salinger-with-kennedy]], 40 (the press conference of Connally and India Edwards: Kennedy has Addison''s disease and may prove physically unfit; not the words quoted or the day)'
    units: '?'
- check:
    id: cal.1960-07-04.elections-1960-2
    text: 'Check: the day: [[w.salinger-with-kennedy]], 40, puts the Connally–Edwards press conference "on the first day of the convention" (July 11).'
- cite:
    id: cal.1960-07-12.elections-1960-2
    item: '[[w.salinger-with-kennedy]], 41–42 (Kennedy accepts an invitation to address the Texas delegation; the rumor of a challenge to a debate; the debate before a joint caucus of the Massachusetts
      and Texas delegations, "a draw"; not the telegram, the press conference or the hour)'
    units: '?'
- cite:
    id: cal.1960-07-13.elections-1960
    item: '[[w.salinger-with-kennedy]], 43 (the model home outside the Sports Arena with Robert Kennedy, O''Brien, O''Donnell and Smith; Wyoming''s fifteen votes; not the totals)'
    units: '?'
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-5
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: 'Hyannis Port, shortly after midnight. Hagerty telephones Salinger: Nixon will concede, and a congratulatory telegram from Eisenhower is on its way. Half an hour later he calls back: Nixon has
        changed his mind; forget the telegram. Salinger agrees to say nothing until he hears again. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 47. Names: Hagerty, Salinger, Nixon, Eisenhower.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-11-09.elections-1960-count-6
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960-count
      c: Hyannis Port, shortly before noon. Hagerty thanks Salinger again for holding the Eisenhower wire; another will follow Nixon's concession. Klein has told him Nixon will concede at the Ambassador
        Hotel at 1 p.m. Eastern. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 50. Names: Hagerty, Salinger, Klein, Nixon, Eisenhower.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:klein-herbert-g
      - name:nixon-richard-m
      - name:eisenhower-dwight-d
- cite:
    id: cal.1960-11-09.elections-1960-count-2
    item: '[[w.salinger-with-kennedy]], 50–51 (Klein, not Nixon, reads the concession on the television set at Ambassador Kennedy''s house; not that Nixon called the press conference)'
    units: A, C, D
- cite:
    id: cal.1960-11-09.elections-1960-11
    item: '[[w.salinger-with-kennedy]], 49–50 (the call at 8:30 a.m.; Sorensen first to reach Kennedy; Salinger finds them in an upstairs bathroom; no claim until Nixon concedes on television)'
    units: C, D
- variant:
    id: cal.1960-11-09.elections-1960-11
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Sorensen "was the first to reach JFK with the news" and was "perched on the edge" of the tub, "reading him the late returns"; the AP desk man''s call said "Your man has carried Minnesota
      and is elected"'
    at: 49–50
- variant:
    id: cal.1960-11-09.elections-1960-11
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: the AP bureau''s call woke him at 8:30; five minutes later he was racing to Hyannis Port'
    at: '49'
- cite:
    id: cal.1960-11-09.transition-and-staff
    item: '[[w.salinger-with-kennedy]], 51 (Kennedy to Salinger, on the walk to the staff meeting at his father''s house the next morning: "I want you to stay on as my Press Secretary"; Hatcher his second;
      not the other appointments)'
    units: '?'
- cite:
    id: cal.1960-11-18.cuba
    item: '[[w.salinger-with-kennedy]], 54 (Dulles and Bissell tell the President-elect of the exile force training on a plantation on Guatemala''s Pacific coast; not Radio Swan, the FRD or the plan)'
    units: '?'
- check:
    id: cal.1960-11-18.cuba
    text: 'Check: the day: [[w.salinger-with-kennedy]], 54, has Dulles and Bissell tell the President-elect "for the first time on November 17."'
- add:
    entry:
      id: cal.1960-12-27.press-and-broadcasting
      when: Dec. 27
      date: '1960-12-27'
      thread: press-and-broadcasting
      c: 'Palm Beach. After weeks of discussion Kennedy agrees to live television at his press conferences. Bundy and Sorensen think it too hazardous, and Rusk, once named, argues against. Kennedy: "This
        is the right thing," and "We should be able to go around the newspapers if that becomes necessary." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 56. Names: Kennedy, Salinger, Bundy, Sorensen, Rusk.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:rusk-dean
- add:
    entry:
      id: cal.1960-12-27.press-and-broadcasting-2
      when: Dec. 27
      date: '1960-12-27'
      thread: press-and-broadcasting
      c: Salinger meets five hours with the top news executives of the television networks on live coverage of the President's press conferences. All are enthusiastic.
      n: '[[w.salinger-with-kennedy]], 56. Check: the place (not given). Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1960-12.press-and-broadcasting-2
      when: Dec., after the 27th
      date: 1960-12
      thread: press-and-broadcasting
      c: 'Palm Beach Towers. Salinger announces live television at the President''s press conferences, the first on Jan. 25, and the ground rules; reporters must stay to the end. The correspondents protest.
        Lawrence of the *Times*: "as you plunge deeper and deeper into matters about which you know absolutely nothing . . ." Salinger shouts back that it is the President''s press conference and the decision
        final. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 57–58. Check: the day (after the decision of Dec. 27; "just after lunch"). See [[cal.1961-01-25.press-and-broadcasting]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1960-12-10.transition-and-staff-cabinet-3
      when: Dec. 10
      date: '1960-12-10'
      thread: transition-and-staff-cabinet
      c: 'Palm Beach. The *Washington Post* has Rusk as Secretary of State under a page-one banner. Kennedy orders Salinger to find the leaker by the day''s end. After asking Bundy, Sorensen, Shriver, O''Brien
        and O''Donnell, Salinger reports: "You." Kennedy had spoken of it to Philip Graham the night before and not told him to hold it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 60–61. Check: the day (the book gives none; see [[cal.1960-12-10.transition-and-staff-cabinet]]). Names: Salinger, Kennedy, Rusk, Bundy, Sorensen, O''Brien, O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:bundy-mcgeorge
      - name:sorensen-theodore-c
      - name:obrien-lawrence-f
      - name:odonnell-kenneth-p
- cite:
    id: cal.1960-12-10.transition-and-staff-cabinet
    item: '[[w.salinger-with-kennedy]], 60–61 (the Post''s page-one banner on Rusk; Kennedy had talked with Graham the night before; not the place or the day)'
    units: '?'
- add:
    entry:
      id: cal.1960-12-31.soviet-union
      when: Dec. 31
      date: '1960-12-31'
      thread: soviet-union
      c: Palm Beach. The Soviet Embassy telephones Salinger's suite to dictate Khrushchev's New Year greeting to the President-elect. Salinger's son Marc passes the call to Merriman Smith, who takes it
        down; Smith and Arrowsmith of the AP bring it to Salinger at the Palm Beach Country Club about 2 a.m., and he gives it to Kennedy in the morning. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 61–62. Names: Khrushchev, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-01.press-and-broadcasting-2
      when: Jan.
      date: 1961-01
      thread: press-and-broadcasting
      c: 'Washington, the Sheraton Park. Lunch of three hours with Merriman Smith, Folliard, Donovan and Brandt. Folliard: "You''re turning the presidential press conferences into a sideshow." Salinger
        refuses to tell them where the President goes or with whom, and to have reporters name their papers on television; agreement only on the Inaugural arrangements and the press pool. By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 58–59. Check: the day (after the return to Washington the week after New Year''s). Names: Salinger.'
      tags:
      - name:salinger-pierre
- cite:
    id: cal.1961-01-21.farm
    item: '[[w.salinger-with-kennedy]], 124 (Kennedy''s first act as President an order doubling the surplus food ration and extending it to areas of high unemployment; four million beneficiaries by the
      Agriculture specialist''s count; not the number)'
    units: '?'
- add:
    entry:
      id: cal.1961-01-21.press-and-broadcasting
      when: Jan. 21
      date: '1961-01-21'
      thread: press-and-broadcasting
      also:
      - farm
      c: Salinger's first briefing as Press Secretary, on the order doubling the surplus food ration. An Agriculture specialist gives the cost as $36 million a month, $9 for each of four million beneficiaries;
        two hours later he finds the $9 is for a family of four, and Salinger gives the press $9 million. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 124. See [[cal.1961-01-21.farm]]. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-01-23.press-and-broadcasting-2
      when: Jan. 23
      date: '1961-01-23'
      thread: press-and-broadcasting
      also:
      - defense
      - soviet-union
      c: An aide of Admiral Burke brings Salinger the Chief of Naval Operations' speech for that week, hostile to the Soviet Union. Salinger takes the draft to Sorensen and Bundy, who agree Burke should
        tone it down, with the RB-47 fliers' release pending. Burke softens it; a leak from his staff says the White House is muzzling the military. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 136. Names: Burke, Salinger, Sorensen, Bundy.'
      tags:
      - name:salinger-pierre
      - name:burke-arleigh-a
      - name:sorensen-theodore-c
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-01-24.soviet-union
      when: Jan. 24
      date: '1961-01-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'David Wise of the *New York Herald Tribune* telephones Salinger: the Soviets will free Captains Olmstead and McKone. Salinger says the story is correct and its early publication could end the
        deal; Wise telephones Jock Whitney, and the *Tribune* holds it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 140–41. Names: Salinger, Whitney.'
      tags:
      - name:salinger-pierre
      - name:whitney-john-h
- cite:
    id: cal.1961-01-25.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 138, 140–41 (the first press conference, the first on live television, in the State Department auditorium; the top story the release of Olmstead and McKone, free
      five hours; Kennedy afterward: "How many people do you think saw it?"; the audience 60 million; not the other business)'
    units: A, B
- add:
    entry:
      id: cal.1961-01-25.press-and-broadcasting-2
      when: Jan. 25
      date: '1961-01-25'
      thread: press-and-broadcasting
      c: 'National Press Club. Salinger: "we intend to have an open information policy within the confines of national security." Many correspondents read a forewarning of censorship; at the President''s
        first press conference, five hours later, a question quotes it.'
      n: '[[w.salinger-with-kennedy]], 153. Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-02-10.berlin-and-vienna-2
      when: Feb. 10
      date: '1962-02-10'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 3:16 a.m. Salinger calls the White House regulars in by telephone and announces the exchange of Abel for Powers, made at 8:16 a.m. in Berlin on the Glienicker Bridge. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 122. See [[cal.1962-02-10.berlin-and-vienna]]. Names: Salinger, Powers, Abel.'
      tags:
      - name:salinger-pierre
      - name:powers-francis-gary
- cite:
    id: cal.1962-02-10.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 122 (the exchange on the Glienicker Bridge, 8:16 a.m. in Berlin; not Pryor or Donovan)'
    units: '?'
- cite:
    id: cal.1962-02-14.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 116 (the hour-long tour; CBS''s proposal, NBC and ABC demand tapes; Kennedy overrules Salinger, so CBS shares it; not the audience)'
    units: '?'
- variant:
    id: cal.1962-02-14.press-and-broadcasting
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Mrs. Kennedy''s hour-long tour was carried by CBS and, at Kennedy''s ruling, shared with NBC and ABC'
    at: '116'
- cite:
    id: cal.1962-12-17.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 114–15 (the hour in his own office with Lawrence of ABC, Herman of CBS and Vanocur of NBC, on all networks, evening; Lawrence''s question and the answer; the title
      given as "A Conversation with the President")'
    units: B
- cite:
    id: cal.1963-09-02.vietnam
    item: '[[w.salinger-with-kennedy]], 114 (the exclusive for CBS''s change to a thirty-minute news; half an hour filmed, mostly on Vietnam, cut to twelve minutes; by Salinger the praise of Diem was cut;
      not the place or the words)'
    units: '?'
- cite:
    id: cal.1962-05.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 118 (Kennedy tells Salinger several times to cancel the subscription, then orders McNally; the story hits the papers; for months copies bootlegged; after the Estes
      and stockpile stories; not the month)'
    units: A
- add:
    entry:
      id: cal.1961-04-10.cuba-bay-of-pigs-2
      when: Apr. 10
      date: '1961-04-10'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy to Salinger in his office, a week before the invasion, on the press stories of the exile brigade: "I can''t believe what I''m reading! Castro doesn''t need agents over here. All he has
        to do is read our papers." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 146. Check: the day ("a week before the invasion"). Names: Kennedy, Salinger, Castro.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1961-04-16.cuba-bay-of-pigs
      when: Apr. 16
      date: '1961-04-16'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy telephones Salinger: stay close to home that night; if the press asks about "a military affair in the Caribbean," say he knows only what he has read in the newspapers. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 145. Check: the day (the book says "tonight"; the landing was Apr. 17). Names: Kennedy, Salinger.'
      tags: &id001
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1961-04-17.cuba-bay-of-pigs-4
      when: Apr. 17
      date: '1961-04-17'
      thread: cuba-bay-of-pigs
      c: '3:30 a.m. The Army duty officer in the Situation Room telephones Salinger: the first units of the exile brigade are landing. To avoid the look of extraordinary activity, Salinger is to come in
        at his usual hour. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 145. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1961-04-15.cuba-bay-of-pigs-3
      when: Apr. 15
      date: '1961-04-15'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Salinger at his briefing, on the air raids: "our only information comes from the wire service stories we have read. We have no direct relations with Cuba and therefore have no firsthand information."
        Stevenson at the UN says the pilots defected. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 146–47. See [[cal.1961-04-15.cuba]]. Names: Salinger, Stevenson.'
      tags:
      - name:salinger-pierre
      - name:stevenson-adlai-e
- add:
    entry:
      id: cal.1961-04-19.cuba-bay-of-pigs-4
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'Kennedy to Salinger on the afternoon of the third day: cancel the weekend on the carrier *Independence*; forty correspondents had been arranged. "We really blew this one. How could that crowd
        at CIA and the Pentagon be this wrong?" The press will "give us a hell of a pounding." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 148. Check: the day ("the afternoon of the third day"). Names: Kennedy, Salinger.'
      tags: *id001
- add:
    entry:
      id: cal.1961-04-19.cuba-bay-of-pigs-5
      when: Apr. 19
      date: '1961-04-19'
      thread: cuba-bay-of-pigs
      c: 'The White House, after the congressional reception. The Cabinet Room meeting with Rusk, McNamara, Dulles, Bissell and Lemnitzer ends at 4 a.m.: the CIA and Pentagon say the cause is hopeless unless
        American forces are committed, and Kennedy refuses. Kennedy then walks the South Grounds for forty-five minutes while O''Donnell and Salinger watch from a window. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 148–49. Check: the day (the meeting followed the reception of Apr. 18; Salinger''s order puts the reception on the night after the third day; see [[cal.1961-04-18.cuba-bay-of-pigs]]).
        Names: Kennedy, Rusk, McNamara, Dulles, Bissell, Lemnitzer, O''Donnell, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - name:lemnitzer-lyman-l
      - name:odonnell-kenneth-p
- cite:
    id: cal.1961-04-21.cuba
    item: '[[w.salinger-with-kennedy]], 154 (the press conference two days after the surrender: no useful national purpose in going into Cuba; asked if Rusk and Bowles had opposed, "the facts will come
      out in due time"; not the responsibility or the hundred fathers)'
    units: '?'
- add:
    entry:
      id: cal.1961-04-21.cuba-bay-of-pigs-5
      when: Apr. 21
      date: '1961-04-21'
      thread: cuba-bay-of-pigs
      also:
      - press-and-broadcasting
      c: 'The President''s office, after the press conference. Kennedy to Salinger: "What the hell do they want me to do — give them the roll call vote? I can''t go into that without compromising everybody
        involved." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 154. Names: Kennedy, Salinger.'
      tags: *id001
- add:
    entry:
      id: cal.1961-04-22.press-and-broadcasting
      when: Apr. 22
      date: '1961-04-22'
      thread: press-and-broadcasting
      also:
      - cuba-bay-of-pigs
      c: 'Mid-morning. Kennedy, angry at the morning papers: "The publishers have to understand that we''re never more than a miscalculation away from war." Salinger suggests he say so to the publishers
        on Apr. 27; Kennedy agrees and sends Salinger''s memorandum to Sorensen to draft the speech. Salinger later calls the advice bad. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 154–55. Check: the day (the morning after the press conference). See [[cal.1961-04-27.press-and-broadcasting]]. Names: Kennedy, Salinger, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:sorensen-theodore-c
- cite:
    id: cal.1961-04-27.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 155–57 (the address to the ANPA Bureau of Advertising; the editorials read it as a rebuke and a forewarning of censorship; Daniels''s letter)'
    units: A, B
- add:
    entry:
      id: cal.1961-05-09.press-and-broadcasting-2
      when: May 9
      date: '1961-05-09'
      thread: press-and-broadcasting
      c: The President's office. Kennedy with seven newspaper executives, among them Ferree and McKnight of the publishers' and editors' societies, Catledge and McKelway. He shows dispatches that breached
        security and proposes a representative of their own in Washington to advise on security; they accept no new restrictions, voluntary or official, without a declaration of emergency. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 158–59. Names: Kennedy, Salinger.'
      tags: *id001
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-4
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 'Vienna, the morning of Salinger''s arrival. Kharlamov, Khrushchev''s spokesman, and Salinger agree through interpreters on handling the joint communiqués. Kharlamov: he has met Mrs. Jarvis and
        will speak to Adzhubei about her plan for a debate on American television. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 176–77. Names: Kharlamov, Salinger, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1961-06-03.berlin-and-vienna-5
      when: June 3
      date: '1961-06-03'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: 'Vienna, the Hofburg, evening. After the first day''s talks Salinger and Kharlamov write a two-paragraph communiqué calling them "frank, courteous, and wide-ranging." At the joint briefing to some
        1,200 reporters Salinger reads it; Kharlamov has "nothing to add" so the next day''s meeting may be "fruitful." Chalmers Roberts asks if Salinger accepts that word: "I will stand with the statement
        I made at the outset." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 179–80. Names: Salinger, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1961-06-04.berlin-and-vienna-3
      when: June 4
      date: '1961-06-04'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: Vienna, the Soviet Embassy, while the leaders meet upstairs. Salinger, Kharlamov and Lucy Jarvis of NBC tentatively set June 24 in New York for a televised debate with Adzhubei. Salinger proposes
        that Kharlamov and Adzhubei visit Washington, and a series of filmed television exchanges between Kennedy and Khrushchev; Kharlamov will put it to Khrushchev. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 180–81. Names: Salinger, Kharlamov, Adzhubei, Kennedy, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:adzhubei-aleksei
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-06-04.berlin-and-vienna-4
      when: June 4
      date: '1961-06-04'
      thread: berlin-and-vienna
      also:
      - press-and-broadcasting
      c: Vienna. After the last session Kennedy has Salinger invite Reston to the embassy and gives him a candid statement of his views. He tells Salinger to stay behind and counter the euphoria among American
        reporters; Salinger backgrounds the by-liners as they file, and leaves for London in the early hours of June 5. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 182. Names: Kennedy, Salinger, Reston.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:reston-james
- cite:
    id: cal.1961-06-04.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 182 (Kennedy has Reston come to the embassy for "an extremely candid statement"; not the words)'
    units: '?'
- add:
    entry:
      id: cal.1961-06-24.soviet-union
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: New York, the Hotel Carlyle. At Mrs. Jarvis's lunch before the debate Salinger meets Adzhubei and Bolshakov for the first time. The Russians promise a rebroadcast in the Soviet Union and look forward
        to their Washington visit. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 184. Check: the day (the book gives June 24 only as the date tentatively agreed at Vienna; the debate is on a Saturday, the next day a Sunday).'
      tags:
      - name:salinger-pierre
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-06-24.soviet-union-2
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'NBC''s *The Nation''s Future*, an hour: Salinger and Harrison Salisbury of the *Times* against Adzhubei and Kharlamov on a free press. Salinger on the Gagarin flight: no Soviet reporter saw it;
        Shepard''s was open to five hundred. Adzhubei: "We are modest people. First we fly, then we write about it." The Russians later do not rebroadcast it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 184–86. Check: the day. Names: Salinger, Salisbury, Adzhubei, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:salisbury-harrison-e
      - name:adzhubei-aleksei
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1961-06-24.soviet-union-3
      when: June 24
      date: '1961-06-24'
      thread: soviet-union
      c: 'Falls Church, Salinger''s home, night. Barbecue for Adzhubei, Kharlamov, Bolshakov and Sagatelyan, with Murrow, Merriman Smith and Tubby; they watch the debate together. Five minutes after it
        ends Kennedy telephones from the White House: "You and Salisbury were great," and "I thought you won hands down." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 186. Check: the day. Names: Salinger, Kennedy, Adzhubei, Kharlamov, Bolshakov, Murrow.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - name:murrow-edward-r
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1961-06-25.soviet-union
      when: June 25
      date: '1961-06-25'
      thread: soviet-union
      c: 'The presidential yacht *Patrick J.* on the Potomac. Kharlamov to Salinger: "grave concern" in the Soviet Union over the pace of disarmament talks; Kennedy is harder to bring to the table than
        Eisenhower. Salinger replies that McCloy has instructions to explore the widest agreement. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 186–87. Check: the day ("the next day, a Sunday"). Names: Kharlamov, Salinger, McCloy, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:mccloy-john-j
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-06-26.soviet-union
      when: June 26
      date: '1961-06-26'
      thread: soviet-union
      c: 'The White House. Kennedy with Adzhubei and Kharlamov for more than an hour, Bolshakov and Salinger present. On Khrushchev''s forecast that the Soviet Union will pass the United States in 1978:
        the high jumper''s bar. Berlin: the 10,000 troops are "token in nature," a commitment to be maintained; Adzhubei: let us have a token force of seventeen nurses. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 187–88. Check: the day ("the next morning, the last day of their visit"). Names: Kennedy, Adzhubei, Kharlamov, Bolshakov, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
      - name:kharlamov-mikhail-a
- cite:
    id: cal.1961-09.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 191–93 (Salinger''s room at the Carlyle, Saturday, 7:15 p.m., the night after the arrival and before the UN speech; Bolshakov brings Kharlamov, Gromyko''s press spokesman;
      "The storm in Berlin is over"; Khrushchev''s message: the danger of an incident too great to delay a settlement long, a summit at Kennedy''s time)'
    units: A, B, C
- check:
    id: cal.1961-09.berlin-and-vienna
    text: 'Check: the day: [[w.salinger-with-kennedy]], 191, 195, has the meeting on Saturday, Sept. 23 ("the night of September 23"); [[w.fursenko-khrushchevs-cold-war]], 397, Sept. 24.'
- add:
    entry:
      id: cal.1961-09-23.soviet-union
      when: Sept. 23
      date: '1961-09-23'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: 'New York, the Carlyle. Salinger to Kharlamov: Khrushchev has given interviews to Sulzberger, Lippmann and Pearson, and Kennedy will receive a Soviet editor. Kharlamov: a bad time, fifteen Soviet
        correspondents bound for the UN have been refused visas. Salinger will try to clear that if Kharlamov arranges the interview; Adzhubei or Sutukov of *Pravda*. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 193. Check: the day (see [[cal.1961-09.berlin-and-vienna]]). Names: Salinger, Kharlamov, Adzhubei, Sulzberger, Lippmann.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:adzhubei-aleksei
      - name:sulzberger-c-l
      - name:lippmann-walter
- add:
    entry:
      id: cal.1961-09-24.berlin-and-vienna
      when: Sept. 24
      date: '1961-09-24'
      thread: berlin-and-vienna
      also:
      - soviet-union
      - laos
      c: New York, the Carlyle, 1 a.m. Kennedy, back from a Broadway play, hears Khrushchev's message from Salinger; this is his first word of it. "If Khrushchev is ready to listen to our views on Germany,
        he's not going to recognize the Ulbricht regime." At 1:30 he telephones Rusk for half an hour; Salinger takes down Kennedy's oral reply, for Kharlamov, with a first test of Soviet good faith in
        Laos. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 193–94. Check: the day (the call comes after the Saturday night, Sept. 23). Names: Kennedy, Salinger, Rusk, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1961-09-25.soviet-union
      when: Sept. 25
      date: '1961-09-25'
      thread: soviet-union
      c: New York, the Carlyle, the morning of the UN address. Kennedy approves the typescript of his reply; half an hour later Salinger reads it to Kharlamov and Bolshakov. Salinger then tells them Tubby
        finds no security reason for withholding the Soviet correspondents' visas; Kharlamov will follow through on an Adzhubei interview. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 195–96. Check: the day ("minutes before he left for the UN"; Kharlamov had been told to come at 11:30 the morning after the meeting). Names: Kennedy, Salinger, Kharlamov,
        Bolshakov, Tubby, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:kharlamov-mikhail-a
      - name:bolshakov-georgi
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1961-09-29.soviet-union-2
      when: Sept. 29
      date: '1961-09-29'
      thread: soviet-union
      c: 'Newport. Bolshakov telephones Salinger from New York: he must see him at once, and would charter a plane. Salinger asks him to wait, telephones Kennedy and Rusk, who is with Gromyko in New York;
        they guess an answer on Laos and agree he should not come to Newport. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 197–98. Names: Bolshakov, Salinger, Kennedy, Rusk, Gromyko.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:kennedy-john-f
      - name:rusk-dean
      - name:gromyko-andrei
- add:
    entry:
      id: cal.1961-09-29.elections-1962
      when: Sept. 29
      date: '1961-09-29'
      thread: elections-1962
      also:
      - press-and-broadcasting
      c: 'Newport Naval Station, Salinger''s briefing. Asked for the President''s reaction to Nixon''s decision to run for governor of California: "He does not." Asked for his own: "No." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 197. Check: the day (Nixon announced Sept. 27; see [[cal.1961-09-27.elections-1962]]). Names: Salinger, Nixon, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-09-27.elections-1962-2
      when: Sept. 27
      date: '1961-09-27'
      thread: elections-1962
      c: 'Kennedy to Salinger, on first learning of Nixon''s decision to run for governor of California: "He''s only running to stay alive politically," and "He hasn''t a chance of winning, but even if
        he did the risks are too great for the advantages he might win." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 197. Check: the day (the book says "after first learning"). Names: Kennedy, Salinger, Nixon.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-09-30.soviet-union
      when: Sept. 30
      date: '1961-09-30'
      thread: soviet-union
      c: New York, the Waldorf-Astoria. Salinger and Rusk, who has just finished with Gromyko, wonder what Bolshakov has. After the Carlyle meeting Salinger shows Rusk the letter at 7:30 p.m.; Rusk takes
        it to Washington to read again. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 198–99. Check: Salinger''s account has the letter back at La Guardia at 7:30 the next morning. Names: Salinger, Rusk, Gromyko, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:rusk-dean
      - name:gromyko-andrei
      - name:bolshakov-georgi
- cite:
    id: cal.1961-09-29.soviet-union
    item: '[[w.salinger-with-kennedy]], 198–99 (Bolshakov at the Carlyle, 3:30 p.m., Sept. 30, with a twenty-six-page letter from Khrushchev to Kennedy, Berlin and Laos; only Bolshakov, Gromyko, Kennedy,
      Rusk and Salinger know; the interview offer)'
    units: '?'
- add:
    entry:
      id: cal.1961-10-01.soviet-union
      when: Oct. 1
      date: '1961-10-01'
      thread: soviet-union
      c: Newport. Salinger gives Kennedy Khrushchev's letter two hours after his return from church. Kennedy telephones Rusk; they agree to answer promptly, within the week, through Bolshakov and Salinger.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 199–200. Check: the day ("the next morning" after Sept. 30; Sunday). Names: Salinger, Kennedy, Rusk, Khrushchev, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:rusk-dean
      - name:khrushchev-nikita-s
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1961-11-20.soviet-union
      when: Nov. 20
      date: '1961-11-20'
      thread: soviet-union
      c: Falls Church. Dinner at Salinger's for Adzhubei, newly in Washington for the interview, with Barsukov, Bolshakov and Guthrie of the State Department. Adzhubei says the Soviet Union and the United
        States should settle things without heeding their allies; Guthrie asks if East Germany and China would then be dropped, and he changes the subject. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 200–01. Names: Adzhubei, Salinger, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:adzhubei-aleksei
      - name:bolshakov-georgi
- cite:
    id: cal.1961-11-25.berlin-and-vienna
    item: '[[w.salinger-with-kennedy]], 202–06 (the interview at Hyannis Port, 10:20 a.m., two hours; Adzhubei''s cable of Nov. 28; printed that day in the Moscow edition of Izvestia, in full but for one
      changed answer)'
    units: A
- variant:
    id: cal.1961-11-25.berlin-and-vienna
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Adzhubei kept his promise to print it verbatim "with one exception": Khrushchev''s 1959 visit "not completely satisfactory" in the transcript became in Izvestia "wrecked and brought
      to nothing by the well-known actions of the then American administration"; printed Nov. 28 in the Moscow edition'
    at: 205–06
- add:
    entry:
      id: cal.1961-11-25.berlin-and-vienna-2
      when: Nov. 25
      date: '1961-11-25'
      thread: berlin-and-vienna
      c: 'Hyannis Port, after the Adzhubei interview. Kennedy to Salinger: "That might have been a mistake," and "Your arrogant Russian friend got in as many shots as I did." After reading the transcript
        he agrees with Salinger that Adzhubei''s polemics strengthened his answers. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 204–05. Names: Kennedy, Salinger, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-18.soviet-union-2
      when: Jan. 18
      date: '1962-01-18'
      thread: soviet-union
      c: 'Washington, the Hay-Adams bar. Bolshakov to Salinger: Khrushchev agrees to a series of television exchanges with Kennedy; the invitation to Salinger and his family to visit Adzhubei in Moscow
        in April is official; the Kremlin would welcome Robert Kennedy on a European tour that summer. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 208–09. See [[cal.1962-01-18.soviet-union]]. Names: Bolshakov, Salinger, Khrushchev, Kennedy, Robert Kennedy, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:khrushchev-nikita-s
      - name:kennedy-robert-f
      - name:adzhubei-aleksei
- cite:
    id: cal.1962-01-18.soviet-union
    item: '[[w.salinger-with-kennedy]], 208–09 (Bolshakov that evening: Khrushchev has agreed to the television exchanges; the invitation to Salinger, and to Robert Kennedy; not the Presidium)'
    units: '?'
- add:
    entry:
      id: cal.1962-01-18.press-and-broadcasting
      when: Jan. 18
      date: '1962-01-18'
      thread: press-and-broadcasting
      c: 'The Metropolitan Club. Reston to Salinger: Kennedy''s way of doing business is too informal; the White House should keep a record for historians of visitors, off-the-record talks and the course
        of decisions. Salinger will keep only a general record of comings and goings. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 208. Names: Reston, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:reston-james
- add:
    entry:
      id: cal.1962-01-18.press-and-broadcasting-2
      when: Jan. 18
      date: '1962-01-18'
      thread: press-and-broadcasting
      c: White House dinner in honor of Stravinsky's eightieth birthday. After the guests leave Kennedy brings Salinger, a pianist, to play for Stravinsky, who walks out before the end; Bernstein stays.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 209. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-01-18.soviet-union-3
      when: Jan. 18
      date: '1962-01-18'
      thread: soviet-union
      c: 'The President''s office, shortly before midnight. Kennedy to Salinger on Bolshakov''s messages: go ahead with the television exchanges; delay the answer on Moscow; decline Robert Kennedy''s invitation,
        "quietly and before the Russians announce it," since he should not be in the picture; he will have the Adzhubeis to lunch. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 209. Names: Kennedy, Salinger, Robert Kennedy, Bolshakov, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bolshakov-georgi
      - name:kennedy-robert-f
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-21.soviet-union
      when: Jan. 21
      date: '1962-01-21'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: '*New York Times*, page one, Max Frankel: the Soviet invitation to the Attorney General. Reston had warned Robert Kennedy the night before that the story would break, its source a Russian. Kennedy
        doubts it, and suspects a State Department career man; only Rusk, Bohlen and Kohler beyond the family knew. The *Daily News* prints Bolshakov: the refusal "a direct affront to the Soviet Union."
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 209–10. Names: Reston, Robert Kennedy, Rusk, Bohlen, Kohler, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:reston-james
      - name:kennedy-robert-f
      - name:rusk-dean
      - name:bohlen-charles-e
      - name:kohler-foy-d
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1962-01-23.soviet-union
      when: Jan. 23
      date: '1962-01-23'
      thread: soviet-union
      c: Night. Salinger with Bolshakov on the television exchange. Kharlamov is to negotiate for Khrushchev; Murrow and Salinger for Kennedy, in Paris on Jan. 28–29. Salinger will say he goes to meet Murrow
        and information officers. Bolshakov, sore over the Robert Kennedy affair, denies a Russian source; Salinger tells him the Adzhubeis are asked to lunch on Jan. 30. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 210. Names: Salinger, Bolshakov, Kharlamov, Murrow, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:kharlamov-mikhail-a
      - name:murrow-edward-r
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-01-28.soviet-union
      when: Jan. 28
      date: '1962-01-28'
      thread: soviet-union
      also:
      - press-and-broadcasting
      c: Paris. Salinger at Orly gives reporters his cover story; Kharlamov, arriving an hour later, tells the same. That night at Minister Lyon's cocktail party Kharlamov calls Molotov "a political cadaver"
        and denies a Kremlin crisis. Baraduc of the French Foreign Office eavesdrops, and argues with Kharlamov over Soviet and French expulsions of correspondents. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 210–11. Check: the day (the book gives Jan. 28–29 for the talks, the party "that night"). Names: Salinger, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
- add:
    entry:
      id: cal.1962-01-29.soviet-union
      when: Jan. 29
      date: '1962-01-29'
      thread: soviet-union
      c: 'Paris, the Soviet Embassy. Salinger, Murrow and Kharlamov agree on four hours'' talks on a series of thirty-minute joint television programs, the first on March 18, simultaneous at noon in Washington
        and 7 p.m. in Moscow, each side filming its principal on March 9 or 10. The first theme: "What Kind of World I Would Like to Live In." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 211–12. Check: the day ("the next morning" after the cocktail party). Names: Salinger, Murrow, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
      - name:murrow-edward-r
- add:
    entry:
      id: cal.1962-01-29.soviet-union-2
      when: Jan. 29
      date: '1962-01-29'
      thread: soviet-union
      c: 'Paris, after the talks. Salinger asks Kharlamov whether the Soviet Union would negotiate a direct "hot line" between Moscow and Washington; he will find out in Moscow. By Salinger''s account:
        the Russians agreed only after the missile crisis.'
      n: '[[w.salinger-with-kennedy]], 212–13. Check: the day. Names: Salinger, Kharlamov.'
      tags:
      - name:salinger-pierre
      - name:kharlamov-mikhail-a
- cite:
    id: cal.1962-01-30.soviet-union
    item: '[[w.salinger-with-kennedy]], 213–14 (the lunch at the White House for the Adzhubeis; Bolshakov translating; Salinger present; the Oval Room talk after it)'
    units: A
- variant:
    id: cal.1962-01-30.soviet-union
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: after the lunch, in the Oval Room, Kennedy to Adzhubei and Bolshakov on Berlin, on Southeast Asia (Laos, South Vietnam) and on nuclear testing; Cuba is not named'
    at: '214'
- add:
    entry:
      id: cal.1962-01-30.press-and-broadcasting
      when: Jan. 30
      date: '1962-01-30'
      thread: press-and-broadcasting
      also:
      - soviet-union
      c: 'Salinger at his briefing after the Adzhubeis leave: the talk was "informal and wide-ranging"; Kennedy knows he is communicating with Khrushchev through his son-in-law. He announces his own visit
        to the Soviet Union in two months for a freer exchange of information; he has State''s clearance and plans no call on Khrushchev. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214. Names: Salinger, Kennedy, Khrushchev, Adzhubei.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:adzhubei-aleksei
- add:
    entry:
      id: cal.1962-02-13.soviet-union
      when: Feb. 13
      date: '1962-02-13'
      thread: soviet-union
      c: 'Bolshakov tells Salinger that Khrushchev accepts all the arrangements for the television exchange but the date: May 25, not March 18. Salinger agrees. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214. Names: Bolshakov, Salinger, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:bolshakov-georgi
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-02-28.soviet-union
      when: Feb. 28
      date: '1962-02-28'
      thread: soviet-union
      also:
      - press-and-broadcasting
      - testing
      c: 'New York, the Carlyle. Salinger with Kintner of NBC, Goodman, Stanton of CBS and Hagerty for ABC. They grumble at not being told sooner, and agree to run the first exchange on May 25. During it
        Bundy telephones: Kennedy will announce atmospheric tests on March 2; the networks agree to the time. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 214–15. Names: Salinger, Hagerty, Bundy, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-04-05.soviet-union
      when: Apr. 5
      date: '1962-04-05'
      thread: soviet-union
      c: 'Washington. Kennedy and Bundy with Salinger on the script of the first television exchange; Mrs. Kennedy and Mrs. Khrushchev might appear. At the Hay-Adams bar at 6:30 Bolshakov tells Salinger
        his government wants to call off the exchange: Kennedy resumes nuclear tests. Kennedy, angry, thinks first of cancelling Salinger''s visit; on Bohlen''s advice the cancellation is to be joint and
        unexplained. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 215–17. Names: Kennedy, Bundy, Salinger, Bolshakov, Bohlen, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:bolshakov-georgi
      - name:bohlen-charles-e
      - name:sorensen-theodore-c
- check:
    id: cal.1962-03.soviet-union
    text: 'Check: the day: [[w.salinger-with-kennedy]], 216–17, has Bolshakov bring the Soviet decision to call off the exchange to Salinger at the Hay-Adams bar on Apr. 5, after the March 2 speech.'
- cite:
    id: cal.1962-03.soviet-union
    item: '[[w.salinger-with-kennedy]], 216–17 (Bolshakov: the exchange is called off because of the American decision to resume nuclear tests; Kennedy''s reply; not the words, Gromyko or the inspections)'
    units: '?'
- add:
    entry:
      id: cal.1962-05-01.soviet-union
      when: May 1
      date: '1962-05-01'
      thread: soviet-union
      c: 'The Soviet Embassy. Salinger lunches with the new ambassador, Dobrynin, four days before leaving for Moscow. Dobrynin: Khrushchev''s letters to Kennedy will now go through him, not Bolshakov and
        Salinger; he wants the widest relationship with Americans in and out of government. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 220–21. Check: the day ("four days before my departure" on May 5). Names: Dobrynin, Salinger, Khrushchev, Kennedy, Bolshakov.'
      tags:
      - name:salinger-pierre
      - name:dobrynin-anatoly
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:bolshakov-georgi
- add:
    entry:
      id: cal.1962-05.berlin-and-vienna
      when: May
      date: 1962-05
      thread: berlin-and-vienna
      c: 'Bonn. On Salinger''s visit to confer with American and West German information officers, Adenauer''s two press conferences read as against further American–Soviet talks on Berlin. Foreign Minister
        Schroeder summons Salinger to the chancellery: Adenauer was misunderstood. Salinger thinks the press read him rightly and cables Schroeder''s explanation to Kennedy. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 222. Check: the day (before the arrival in Moscow on May 11). Names: Salinger, Schroeder, Adenauer, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:schroeder-gerhard
      - name:adenauer-konrad
      - name:kennedy-john-f
- cite:
    id: cal.1963-02.defense
    item: '[[w.salinger-with-kennedy]], 239–40 (Kennedy''s memo to Shoup: send Roosevelt''s letter back as his own discovery; he will ask Salinger for a report on the staff''s fitness; Shoup replies with
      a hike from Camp Lejeune; not the twenty hours)'
    units: B
- add:
    entry:
      id: cal.1963-02.defense-5
      when: Feb., first week
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: After a *Washington Post* item quoting General McHugh that a daily fifty-mile hike would be "loads of fun," Salinger tells the press the President thinks it fitting that McHugh join the Camp Lejeune
        march. McHugh denies he volunteered and accuses Salinger of self-serving motives. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 241. Check: the day (the book says the first week of February and gives no day). Names: Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-02.defense-6
      when: Feb., first week
      date: 1963-02
      thread: defense
      also:
      - press-and-broadcasting
      c: 'General McHugh accepts a rumored challenge from General Clifton, put out by Salinger through a UPI reporter, and announces a fifty-mile hike of White House personnel only: himself, Clifton, Captain
        Shepard and Salinger, who is to choose the route. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 241. Check: the day. Names: Salinger, Clifton.'
      tags:
      - name:salinger-pierre
      - name:clifton-chester-v-jr
- add:
    entry:
      id: cal.1963-02-12.defense
      when: Feb. 12
      date: '1963-02-12'
      thread: defense
      also:
      - press-and-broadcasting
      c: 'Salinger telephones Snider of the President''s Council on Physical Fitness: the hike craze is out of hand, and the Council should warn the unfit. Snider asks if he speaks for the President; Salinger:
        for himself, with the President aware of his interest. The Council issues its statement at 11; at his noon briefing Salinger, with Sorensen''s help, cancels his hike. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 245–47. Check: the day (the book gives "the next morning" after Monday''s cover-story search; its calendar names "Black Tuesday"). Names: Salinger, Sorensen.'
      tags:
      - name:salinger-pierre
      - name:sorensen-theodore-c
- cite:
    id: cal.1963-02.defense-3
    item: '[[w.salinger-with-kennedy]], 245–47 (the Council''s statement at 11 and Salinger''s noon briefing cancelling the hike set for Feb. 15: "I may be plucky but I am not stupid"; Kennedy told him
      to find a convincing reason; not that the President advised the announcement)'
    units: '?'
- cite:
    id: cal.1963-02.defense-4
    item: '[[w.salinger-with-kennedy]], 243 (on Sunday Robert Kennedy sets out on a fifty-mile hike to Camp David with Guthman and Hackett; only he goes the distance; not the time)'
    units: '?'
- add:
    entry:
      id: cal.1962-10-16.missile-crisis-warnings
      when: Oct. 16
      date: '1962-10-16'
      thread: missile-crisis-warnings
      also:
      - press-and-broadcasting
      c: 'Kennedy, in a black mood, to Salinger in his office: he will see Gromyko Thursday, who comes on his own initiative; heavy traffic of Rusk, McNamara, Stevenson and the Chiefs this week, and if
        the press reads something into it Salinger is to deny that anything special is going on. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 249–50. Names: Kennedy, Salinger, Gromyko, Rusk, McNamara.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:rusk-dean
      - name:mcnamara-robert-s
- cite:
    id: cal.1962-10-19.missile-crisis-warnings
    item: '[[w.salinger-with-kennedy]], 251 (Phillips of State warns of the Allen and Scott story; Kent of the *Sun-Times* asks about the 18th Parachute Corps standing by for a jump on Cuba; Salinger goes
      to the President in his suite, Kennedy in his undershorts, O''Donnell with him)'
    units: B
- variant:
    id: cal.1962-10-19.missile-crisis-warnings
    unit: C
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "You call Kent right back," and "tell him he''s wrong. We are not planning to invade Cuba."'
    at: '251'
- variant:
    id: cal.1962-10-19.missile-crisis-warnings
    unit: D
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Kennedy to O''Donnell: "You call McNamara and tell him to straighten out Allen and Scott."'
    at: '251'
- cite:
    id: cal.1962-10-19.missile-crisis-warnings-2
    item: '[[w.salinger-with-kennedy]], 251 (Salinger finds O''Donnell alone in the suite after Kennedy has left for the $100-a-plate dinner at McCormick Place: "You''re going to have to cut me in pretty
      quick")'
    units: A, B
- variant:
    id: cal.1962-10-19.missile-crisis-warnings-2
    unit: C
    witness: w.salinger-with-kennedy
    reads: 'Salinger: O''Donnell: "The President may have to develop a cold somewhere along the line tomorrow. If he does, we''ll cancel out the rest of the trip and head back to Washington."'
    at: '251'
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-9
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Chicago, the Sheraton-Blackstone. At Salinger''s 9:15 briefing Western Union''s man calls him to the President''s suite: Kennedy, in pajamas, with O''Donnell, Powers and Dr. Burkley, says he has
        a temperature and a cold and writes the bulletin on hotel stationery: "99.2 degrees temperature. Upper respiratory infection. Doctor says he should return to Washington." Salinger reads it to the
        reporters; no one questions it. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 252. Names: Kennedy, Salinger, O''Donnell, Powers.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:odonnell-kenneth-p
      - name:powers-david-f
- cite:
    id: cal.1962-10-20.missile-crisis
    item: '[[w.salinger-with-kennedy]], 252 (the "medical bulletin" of a temperature and cold; the flight from Chicago at 11 a.m., at the White House 1:30; not the choice of the quarantine)'
    units: '?'
- add:
    entry:
      id: cal.1962-10-20.missile-crisis-warnings-2
      when: Oct. 20
      date: '1962-10-20'
      thread: missile-crisis-warnings
      also:
      - press-and-broadcasting
      c: '10:08 p.m. Folliard of the *Washington Post* tells Salinger that Lippmann has said at a party to the Post''s editor that we are on the brink of war. Salinger calls Kennedy: "This town is a sieve."
        He asks how long it can hold; Salinger: through that night and maybe the next day. Kennedy: Bundy will fill Salinger in in the morning. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 253. Names: Salinger, Kennedy, Lippmann, Bundy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:lippmann-walter
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-9
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: '9 a.m., the Situation Room. Bundy tells Salinger that the country is on the brink of nuclear war: the missiles are not yet operational; a blockade is the probable course; Kennedy should decide
        that day and announce it on television the next. Bundy shows the aerial photographs and a chronology. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 253–54. Names: Bundy, Salinger, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:bundy-mcgeorge
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-10
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Shortly before noon. Salinger with Colonel Justice Chambers of the Office of Emergency Planning: the emergency information plan is set going; a standby alert of the communications system, instructions
        for the pool of correspondents who would go with the President, and plans to call part of the fifteen-member Censorship Advisory Board to Washington. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 257. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-warnings
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis-warnings
      also:
      - missile-crisis-quarantine
      c: 'The Cabinet Room, ExComm, which Kennedy has told Salinger to attend. Deleted from the address after debate: a proposal for a summit with Khrushchev. "Quarantine" chosen over "blockade." Approved:
        Don Wilson''s plan for ten Atlantic-coast radio stations to broadcast to Cuba in Spanish by night, Salinger to ask them. Acheson to brief de Gaulle and NATO, Bruce Macmillan, Dowling Adenauer. By
        Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 258–59. Names: Kennedy, Salinger, Khrushchev, Acheson, de Gaulle, Macmillan, Adenauer, Bruce.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:khrushchev-nikita-s
      - name:acheson-dean-g
      - name:de-gaulle-charles
      - name:macmillan-harold
      - name:adenauer-konrad
      - name:bruce-david-k-e
- add:
    entry:
      id: cal.1962-10-21.missile-crisis-11
      when: Oct. 21
      date: '1962-10-21'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: Salinger's house, Falls Church, afternoon. Salinger, Sylvester of Defense and Manning of State agree that Sylvester handles military announcements and Manning diplomatic ones, and nothing comes
        from either without White House approval. A three-way telephone line is installed that afternoon. UPI's Don May finds them together in Manning's office. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 260. Names: Salinger, Sylvester, Manning.'
      tags:
      - name:salinger-pierre
      - name:sylvester-arthur
      - name:manning-robert-j
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - press-and-broadcasting
      c: Morning. Salinger asks Minow of the FCC to clear the ground for the use of ten radio stations; Minow returns from New York and telephones the managers to stand by for a White House call at 6 p.m.
        By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 261. Names: Salinger, Minow.'
      tags:
      - name:salinger-pierre
      - name:minow-newton-n
- cite:
    id: cal.1962-10-22.missile-crisis-17
    item: '[[w.salinger-with-kennedy]], 262 (at exactly noon Salinger asks Fleming of ABC, for the networks, for time at 7 p.m. on a subject of "the highest national urgency"; the announcement to the correspondents;
      the answer "all networks, all live")'
    units: A, B
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine-2
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - missile-crisis
      c: 'Afternoon. Kennedy gives Salinger a backgrounder for the questions after the address: a quarantine over an air strike because no strike is certain to hit every site; the missiles'' secrecy and
        the Russians'' denials; proof only since Tuesday; the Turkish bases not the same as Cuba''s missiles. "The next move is up to the Russians." By Salinger''s account, from his notes of the direct
        quotes.'
      n: '[[w.salinger-with-kennedy]], 262–63. Names: Kennedy, Salinger.'
      tags: &id002
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-34
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: '4:10 p.m., Salinger''s briefing. Asked if the President''s cold was "a diplomatic illness," Salinger: "The President definitely had a degree of temperature in Chicago." Is it gone? "No, he is
        fine." By Salinger''s account, met with incredulity.'
      n: '[[w.salinger-with-kennedy]], 263. Names: Salinger, Kennedy.'
      tags: *id002
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-quarantine-3
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis-quarantine
      also:
      - cuba
      c: 6 p.m. Salinger telephones the managers of ten radio stations, Ralf Brent of WRUL first, with the President's request, by FCC counsel's wording, that they give their transmitters to the government
        from sunset to sunrise for Spanish broadcasts, voluntarily and with their costs paid. The cables are already at their doors. All agree. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 264. Names: Salinger, Kennedy.'
      tags: *id002
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-35
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      - soviet-union
      c: 'Salinger puts Sagatelyan of Tass in the pool at the President''s office for the address: "I want to be sure that you read the President loud and clear." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 264. Names: Salinger, Kennedy.'
      tags: *id002
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-36
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'After the address, the White House press room, the largest press crowd of Salinger''s tenure but for the assassination. In fifteen minutes he takes a hundred questions. The President stays in
        Washington "for the foreseeable future"; Congress "I have not heard that subject discussed"; Kennedy did not call Gromyko a liar; he and Johnson cancel their political tours. Next move if the quarantine
        fails: "I am not in charge of speculation." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 266–67. Names: Salinger, Kennedy, Gromyko, Johnson.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:gromyko-andrei
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1962-10-22.missile-crisis-37
      when: Oct. 22
      date: '1962-10-22'
      thread: missile-crisis
      also:
      - press-and-broadcasting
      c: 'Night. Salinger sends for the White House correspondents who would go with the President if Washington were evacuated: never more than fifteen minutes away. He telephones Bill Steven of the *Houston
        Chronicle*, chosen executive officer of the Censorship Advisory Board, to fly to Washington. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 267. Names: Salinger.'
      tags:
      - name:salinger-pierre
- add:
    entry:
      id: cal.1962-10-31.missile-crisis-settlement
      when: Oct. 31
      date: '1962-10-31'
      thread: missile-crisis-settlement
      also:
      - soviet-union
      c: 'Washington, the Rive Gauche. Salinger lunches with Yuri Zhukov of *Pravda* and Bolshakov. Salinger: the secret missiles and the lies to Kennedy a harsh blow; Khrushchev must remove missiles and
        launchers. Zhukov: neither side must show weakness; he sounds out a summit, which Reston thought premature the day before, and complains of State''s report that Castro told Latin American Communists
        to sabotage, and of the film *We''ll Bury You*. No separate treaty with East Germany after the elections. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 281–82. Names: Salinger, Zhukov, Bolshakov, Reston, Castro, Khrushchev.'
      tags:
      - name:salinger-pierre
      - name:zhukov-yuri-a
      - name:bolshakov-georgi
      - name:reston-james
      - name:castro-fidel
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1962-10-23.press-and-broadcasting
      when: Oct. 23
      date: '1962-10-23'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: '6 p.m. Salinger meets news-industry leaders: McKelway of the *Star* and AP, Gallagher, Thomason of UPI, Merriman Smith, Hagerty for ABC, Blair Clark, McAndrew, Sylvester and Manning. He asks them
        to avoid information that helps the enemy, and promises twelve points the next day and a twenty-four-hour Pentagon news desk. Gallagher and McAndrew resent the suggestion of censorship and the barring
        of reporters from blockade ships and Guantánamo. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 288–89. Names: Salinger, Hagerty, Sylvester, Manning, Smith.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:sylvester-arthur
      - name:manning-robert-j
- add:
    entry:
      id: cal.1962-10-23.press-and-broadcasting-2
      when: Oct. 23
      date: '1962-10-23'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: 'After the news leaders leave, Salinger asks Hagerty to stay: he lays out the censorship plans for full war and asks him to head them. Hagerty, reluctant, agrees to head an advisory committee,
        and proposes Byron Price. Salinger takes him to Kennedy, who thanks him; Price is to be called on standby and will serve if full censorship comes. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 289–90. Names: Salinger, Hagerty, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:hagerty-james-c
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-24.press-and-broadcasting
      when: Oct. 24
      date: '1962-10-24'
      thread: press-and-broadcasting
      also:
      - missile-crisis-quarantine
      c: 'Salinger hands the press a memorandum of twelve categories of information "vital to our national security" that the Defense Department will not release: plans for forces, estimates of capability
        and targets, intelligence, movements, alert, dispersal, missile numbers, command posts, airlift. It asks "caution and discretion"; editors in doubt may call the Pentagon''s News Desk. Salinger:
        it binds no editor. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 290–92. Names: Salinger.'
      tags:
      - name:salinger-pierre
- cite:
    id: cal.1962-10-25.republican-party-congress
    item: '[[w.salinger-with-kennedy]], 292–93 (Van Zandt after a New York briefing announces the Bucharest story, on the wires at 11, forty-five minutes before Defense; Kennedy outraged that he was given
      it; not Hughes or Idlewild)'
    units: '?'
- variant:
    id: cal.1962-10-25.republican-party-congress
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: ExComm had ordered the Bucharest news released through Defense at the end of the morning, with the news that a dozen Soviet ships had turned back; Van Zandt announced it forty-five
      minutes early'
    at: '293'
- add:
    entry:
      id: cal.1962-10-24.missile-crisis-quarantine
      when: Oct. 24
      date: '1962-10-24'
      thread: missile-crisis-quarantine
      also:
      - press-and-broadcasting
      c: Shortly before 1 a.m. Salinger releases the photographs of the missiles in Cuba, which he had been unable to get ExComm to release; Ambassador Bruce had shown them on British television, and the
        *Times* of London's military editor had called them a fabrication. Salinger tells Kennedy it is untenable to show them in Britain and keep them classified at home. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 293–94. Names: Salinger, Bruce, Kennedy.'
      tags:
      - name:salinger-pierre
      - name:bruce-david-k-e
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1962-10-27.press-and-broadcasting
      when: Oct. 27
      date: '1962-10-27'
      thread: press-and-broadcasting
      also:
      - defense
      c: At Kennedy's order, angry that people at Defense and State put out what the press is asked not to print, Sylvester has all Defense officials report in memoranda their press contacts, the questions
        and their answers. A like rule follows at State four days later, which Salinger and Manning think a mistake; State suspends it within a month. The press protests it as censorship. By Salinger's
        account.
      n: '[[w.salinger-with-kennedy]], 294–95. Names: Kennedy, Salinger, Sylvester, Manning.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:sylvester-arthur
      - name:manning-robert-j
- add:
    entry:
      id: cal.1962-10-29.press-and-broadcasting
      when: Oct. 29
      date: '1962-10-29'
      thread: press-and-broadcasting
      c: 'Sylvester to Richard Fryklund of the *Washington Star*: covering the blockade was harder than covering World War II. "The generation of news by the government becomes one weapon in a strained
        situation. The results, in my opinion, justify the means." Newspaper societies condemn it; "generation of news" becomes "management of the news." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 285, 295–96. Check: the day (the book has the interview "the day after Chairman Khrushchev announced" the withdrawal, and gives Oct. 29). Names: Sylvester, Salinger.'
      tags:
      - name:salinger-pierre
      - name:sylvester-arthur
- cite:
    id: cal.1962-02-21.vietnam
    item: '[[w.salinger-with-kennedy]], 323 (the press guidance of Feb. 21, 1962, "Cable 1006," drafted for State, Defense and USIA: cooperation with the press, an appeal to the correspondents'' good faith,
      the war "a Vietnamese one" with Americans only training, advising and supporting; not the text, the Ambassador''s decision on missions or the bans)'
    units: '?'
- cite:
    id: cal.1963-07-07.press-and-broadcasting
    item: '[[w.salinger-with-kennedy]], 327 (the telegram to Kennedy signed by Halberstam, Browne, Sheehan and Kalisher: nine newsmen attacked by plainclothes police at a pagoda, one knocked down and kicked,
      a camera smashed; they ask him to protest)'
    units: D
- add:
    entry:
      id: cal.1963-04-29.vietnam
      when: Apr. 29
      date: '1963-04-29'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: 'Kennedy alone with John Mecklin, the embassy''s information officer, back from surgery, whom Salinger sent in after Don Wilson''s calls: Mecklin''s account of the mounting troubles with the press
        in Saigon. Kennedy is impressed, but doubts any press policy there will succeed. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 326. Names: Kennedy, Salinger.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
- add:
    entry:
      id: cal.1963-04-29.vietnam-2
      when: Apr. 29
      date: '1963-04-29'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: After the Mecklin meeting, with Bundy, Kennedy has Salinger draft a new press guideline for Saigon to replace cable 1006; it is to go in a secret memorandum, by Sylvester to Nolting and Harkins
        in Honolulu. It gives the field more leeway with reporters, says the President was consulted, and urges caution in describing the situation. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 326. Check: the day ("after the meeting"). Names: Kennedy, Salinger, Bundy, Sylvester, Nolting, Harkins.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:bundy-mcgeorge
      - name:sylvester-arthur
      - name:nolting-frederick-e
      - name:harkins-paul-d
- add:
    entry:
      id: cal.1963-07-08.vietnam-2
      when: July 8
      date: '1963-07-08'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: On the correspondents' telegram of July 7 Salinger recommends, and Kennedy agrees, that Manning go to Saigon for a survey. Several hours after the President's, Salinger's telegram to the correspondents
        says the embassy has protested and Manning will be there the next week. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 327. Check: the day ("several hours after" the President received the telegram). See [[cal.1963-07-07.press-and-broadcasting]]. Names: Salinger, Kennedy, Manning.'
      tags:
      - name:salinger-pierre
      - name:kennedy-john-f
      - name:manning-robert-j
- add:
    entry:
      id: cal.1963-11-23.succession-16
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      also:
      - transition-and-staff
      c: '8 a.m., the White House. Johnson telephones Salinger, asleep in the third-floor quarters: "I want you to stay on the job. I need you more than he ever did." Salinger agrees. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 331. Names: Johnson, Salinger.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-23.succession-17
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      also:
      - press-and-broadcasting
      c: 8:30 a.m. Johnson and Salinger agree that Salinger takes personal charge of the press arrangements for the funeral and that Kilduff moves to the Executive Office Building to help Reedy. Salinger's
        briefings twice daily are split between the funeral and Johnson's activities. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 332. Names: Johnson, Salinger, Reedy.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:reedy-george-e
- add:
    entry:
      id: cal.1963-11.transition-and-staff-2
      when: Nov., first week
      date: 1963-11
      thread: transition-and-staff
      c: 'Salinger tells Johnson he should consider replacing him with his own man as soon as possible, and names Reedy and Carl Rowan. Johnson: "I want you to stay with me as long as you can." By Salinger''s
        account.'
      n: '[[w.salinger-with-kennedy]], 333. Check: the day ("the first week"). Names: Salinger, Johnson, Reedy.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:reedy-george-e
- cite:
    id: cal.1963-12-07.economy
    item: '[[w.salinger-with-kennedy]], 337 (the first press conference, impromptu: at the end of Salinger''s morning briefing he announces that the President would like the reporters in for coffee; twenty
      or thirty regulars; radio and television not told in time)'
    units: A
- add:
    entry:
      id: cal.1963-12-29.europe-and-the-alliance-4
      when: Dec. 29
      date: '1963-12-29'
      thread: europe-and-the-alliance
      c: 'The Stonewall school gymnasium, after Van Cliburn. Johnson over the loudspeaker calls Salinger to the piano; Erhard shakes his hand. Johnson: "I don''t know what I would have done without him,
        night and day, over this past month." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 336. Check: the day (the book has the visit "shortly before Christmas"). Names: Johnson, Salinger, Erhard, Van Cliburn.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:erhard-ludwig
- cite:
    id: cal.1963-12-29.europe-and-the-alliance-3
    item: '[[w.salinger-with-kennedy]], 336 (the barbecue in the gym of Stonewall High School for Erhard; Van Cliburn plays Chopin to some six hundred)'
    units: B
- cite:
    id: cal.1964-01-10.latin-america-panama
    item: '[[w.salinger-with-kennedy]], 334–35 (Velarde, Chiari''s press secretary, asks that the two presidents talk; Johnson will renegotiate the treaty, not at gunpoint, once order is restored; the call
      set up through Salinger; the page places it "late in 1964")'
    units: '?'
- variant:
    id: cal.1964-01-10.latin-america-panama
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: Velarde telephones Salinger from Chiari''s office at an agreed time, with Salinger in Johnson''s office, and each hands the telephone to his president'
    at: '335'
- check:
    id: cal.1964-01-10.latin-america-panama
    text: 'Check: the day: [[w.salinger-with-kennedy]], 334–35, puts the call "late in 1964," after Salinger left the White House on Mar. 19, 1964.'
- add:
    entry:
      id: cal.1963-12.soviet-union
      when: Dec.
      date: 1963-12
      thread: soviet-union
      c: 'Washington. A high official of the Soviet Embassy asks Salinger to lunch the same day: Khrushchev, who knows and trusts him, wants his estimate of the new President. Salinger: Johnson is as interested
        in peace as Kennedy. The official says Khrushchev wept at Kennedy''s death. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 335. Check: the day ("shortly after the death of President Kennedy"). Names: Salinger, Khrushchev, Johnson.'
      tags:
      - name:salinger-pierre
      - name:khrushchev-nikita-s
      - name:johnson-lyndon-b
- cite:
    id: cal.1964-02-29.defense
    item: '[[w.salinger-with-kennedy]], 337–38 (Johnson''s first live television press conference, in the International Conference Room at State, behind a desk; not the business)'
    units: '?'
- cite:
    id: cal.1964-03-15.vietnam
    item: '[[w.salinger-with-kennedy]], 338 (Salinger''s advice that Johnson go on television for an hour with leading network reporters, as Kennedy did in December 1962; it "went off on March 15, 1964";
      not the words or the taping)'
    units: '?'
- add:
    entry:
      id: cal.1964-03-17.elections-1964-primaries-2
      when: Mar. 17
      date: '1964-03-17'
      thread: elections-1964-primaries
      also:
      - robert-kennedy
      c: 'Salinger tells Robert Kennedy and O''Donnell he will resign once a California lawyer clears his eligibility for the Senate primary. Kennedy: "Run only if you can win." O''Donnell: "an interesting
        idea, but I don''t think you''ve got the guts." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 345. Names: Salinger, Robert Kennedy, O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:kennedy-robert-f
      - name:odonnell-kenneth-p
- cite:
    id: cal.1964-03.robert-kennedy
    item: '[[w.salinger-with-kennedy]], 345 (that evening Salinger calls on Jacqueline Kennedy: "I know you''ll win," and Robert Kennedy comes by later: "you can count on my help"; not the three weeks)'
    units: '?'
- check:
    id: cal.1964-03.robert-kennedy
    text: 'Check: the day: [[w.salinger-with-kennedy]], 345, has the talk on Mar. 17, a Tuesday.'
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Washington, the Sans Souci, lunch with Bob Six and Harding Lawrence of Continental Air Lines. A California lawyer telephones: Salinger is "entirely eligible" to run. Salinger: "All right," and
        "I''m running." He tells O''Donnell at another table that he is on his way to the President''s office to resign. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 345–46. Check: the day ("the next day" after Mar. 17; the calendar has the resignation Mar. 19). See [[cal.1964-03-19.transition-and-staff]]. Names: Salinger, O''Donnell.'
      tags:
      - name:salinger-pierre
      - name:odonnell-kenneth-p
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries-2
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Justice Goldberg, telephoned by Salinger, is aghast: a Virginia voter can hardly run for the Senate from California. A half hour later, after a clerk looks into it, he calls back: Salinger is
        eligible, but if the case reaches the Supreme Court Goldberg must disqualify himself. By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 346. Check: the day. Names: Salinger, Goldberg.'
      tags:
      - name:salinger-pierre
      - name:goldberg-arthur-j
- cite:
    id: cal.1964-03-19.transition-and-staff
    item: '[[w.salinger-with-kennedy]], 346–47 (Salinger tells Jenkins and Moyers; Johnson sees him at 3:30; the letter of resignation at 5; Reedy named at once; Johnson gives him a filing fee in cash,
      Salinger saying $450 and Johnson hearing $250)'
    units: '?'
- variant:
    id: cal.1964-03-19.transition-and-staff
    unit: A
    witness: w.salinger-with-kennedy
    reads: 'Salinger: the call at lunch comes the day after Mar. 17; Johnson sees him at 3:30 p.m., he hands in the letter at 5 and flies to San Francisco at 10 that night; on his last day, in another chapter,
      Merriman Smith''s delegation comes at 4 p.m. and he resigns at 6 p.m. (the book dates that day Mar. 19)'
    at: 346–47, 125
- add:
    entry:
      id: cal.1964-03-19.press-and-broadcasting
      when: Mar. 19
      date: '1964-03-19'
      thread: press-and-broadcasting
      c: '4 p.m. Merriman Smith leads a delegation of correspondents into Salinger''s office to protest what he and others take for a violation of the White House press corps'' rights. Salinger: "Give me
        just two hours." He resigns at 6. By Salinger''s account; the subject is not given.'
      n: '[[w.salinger-with-kennedy]], 125. Check: the day (the book dates his last day Mar. 19, but see 345–47). See [[cal.1964-03-19.transition-and-staff]]. Names: Salinger.'
      tags: &id003
      - name:salinger-pierre
- add:
    entry:
      id: cal.1964-03-18.elections-1964-primaries-3
      when: Mar. 18
      date: '1964-03-18'
      thread: elections-1964-primaries
      c: 'Salinger''s last call from the White House, to Governor Brown, who has come out for Cranston. Brown is dead set against him: too late, and a primary fight drains Democratic money. Salinger asks
        him only to say he favors Cranston; Brown: "If I''m for somebody, I''m not going to stand on the sidelines." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 348. Check: the day. Names: Salinger, Brown, Cranston.'
      tags:
      - name:salinger-pierre
      - name:brown-edmund-g
      - name:cranston-alan
- add:
    entry:
      id: cal.1964-03-19.elections-1964-primaries
      when: Mar. 19
      date: '1964-03-19'
      thread: elections-1964-primaries
      also:
      - elections-1964
      c: San Francisco, the Fairmont, 4 a.m. arrival. With Don Bradley and his brother Herbert, Salinger in ten hours gets the sixty-five signatures on his nominating petition and $25,000 in unrefundable
        loans from five friends. Goldstein and Kopp are to argue his eligibility without fee; 7,000 posters are ordered. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 349. Check: the day (the filing deadline in the book is Mar. 19). Names: Salinger, Bradley.'
      tags: *id003
- add:
    entry:
      id: cal.1964-03.elections-1964-primaries-3
      when: Mar., after the 19th
      date: 1964-03
      thread: elections-1964-primaries
      also:
      - specials
      c: 'Secretary of State Frank Jordan refuses to put Salinger on the ballot: not ninety days a member of the California Democratic Party. Goldstein and Kopp ask the State Supreme Court for a writ of
        mandamus, arguing the Democratic Party is national, and produce his Virginia party records. On the eighth day the court rules he complied "substantially" and orders the name placed on the ballot.
        By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 350–51. Check: the day (the book gives "the eighth day" after the filing).'
      tags:
      - name:salinger-pierre
      - name:jordan-frank-m
- cite:
    id: cal.1964-06-02.elections-1964-ca
    item: '[[w.salinger-with-kennedy]], 353 (the primary on June 2; Salinger''s margin; Murphy the Republican nominee over Kaiser)'
    units: '?'
- variant:
    id: cal.1964-06-02.elections-1964-ca
    unit: B
    witness: w.salinger-with-kennedy
    reads: 'Salinger: "My final margin on June 2, 1964, was 174,000."'
    at: '353'
- add:
    entry:
      id: cal.1964-05.elections-1964-primaries-8
      when: May, mid
      date: 1964-05
      thread: elections-1964-primaries
      c: San Diego, NBC affiliate KOGO, statewide. Salinger and Cranston debate before Howard K. Smith and a panel of reporters, who dwell on the carpetbagger charge and on Cranston's soliciting from inheritance
        tax appraisers; Salinger judges he held his own on state, national and international affairs. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 352–53. Check: the day ("mid-May"). Names: Salinger, Cranston.'
      tags:
      - name:salinger-pierre
      - name:cranston-alan
- add:
    entry:
      id: cal.1964-05.elections-1964-primaries-9
      when: May
      date: 1964-05
      thread: elections-1964-primaries
      c: A day or two after Engle's withdrawal without an endorsement, George Dixon and his wife and Jerry Waldie speak to Mrs. Engle for Salinger; she says on television that he is her choice to succeed
        her husband. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 353. Check: the day (the calendar has Engle withdrawing Apr. 28; see [[cal.1964-06-02.elections-1964-ca]]). Names: Salinger, Engle.'
      tags:
      - name:salinger-pierre
      - name:engle-clair
- check:
    id: cal.1964-08-04.congress
    text: 'Check: the day: [[w.salinger-with-kennedy]], 356, has Salinger in Premier Khanh''s office in Saigon on Aug. 3 when the call came that Engle was dead.'
- cite:
    id: cal.1964-08-04.congress
    item: '[[w.salinger-with-kennedy]], 357 (Brown''s intention to appoint him at once; the midnight charter flight from California with more than a hundred Democrats on Aug. 4; the oath from Hayden on
      Aug. 5 after more than two hours'' debate led by Dirksen; Kuchel for him; seated conditionally pending the Rules Committee, which voted the next week to seat him; not the vote or the date of Engle''s
      death)'
    units: B
- add:
    entry:
      id: cal.1964-08-27.elections-1964-atlantic-city-2
      when: Aug. 27
      date: '1964-08-27'
      thread: elections-1964-atlantic-city
      also:
      - elections-1964-vice-presidency
      c: Atlantic City. At the request of Johnson and Humphrey, Salinger, not yet a qualified California voter and so no delegate, seconds Humphrey's nomination for Vice President. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 358. Check: the day ("the last week in August"). Names: Salinger, Johnson, Humphrey.'
      tags:
      - name:salinger-pierre
      - name:johnson-lyndon-b
      - name:humphrey-hubert-h
- add:
    entry:
      id: cal.1964-08.elections-1964-freedom-democrats-2
      when: Aug., last week
      date: 1964-08
      thread: elections-1964-freedom-democrats
      c: Atlantic City, the California caucus. Under Humphrey's lead in working out the Mississippi compromise, Salinger argues against seating the full Freedom delegation, which he thinks would provoke
        a walkout of white southern delegations; he holds the token seating and the rule against future discrimination the most that could be won. By Salinger's account.
      n: '[[w.salinger-with-kennedy]], 358. Check: the day. Names: Salinger, Humphrey.'
      tags:
      - name:salinger-pierre
      - name:humphrey-hubert-h
- cite:
    id: cal.1964-11-03.elections-1964-2
    item: '[[w.salinger-with-kennedy]], 361 (Murphy beats Salinger by 216,643 votes; Johnson carries California by 1,292,769; not the other races)'
    units: E
- cite:
    id: cal.1964-11-03.cities-and-housing
    item: '[[w.salinger-with-kennedy]], 361 (Proposition 14 carried by 2,130,713; Salinger spoke against it in every appearance; Murphy took no position)'
    units: '?'
- add:
    entry:
      id: cal.1964-11-03.elections-1964-6
      when: Nov. 3
      date: '1964-11-03'
      thread: elections-1964
      c: 'Election night, late. Robert Kennedy, elected in New York, telephones Salinger, beaten by Murphy: "My brother would have been proud of the way you lost." By Salinger''s account.'
      n: '[[w.salinger-with-kennedy]], 362. Names: Robert Kennedy, Salinger, Murphy.'
      tags:
      - name:salinger-pierre
      - name:kennedy-robert-f
      - name:murphy-george
- cite:
    id: cal.1961-05-31.latin-america
    item: '[[w.salinger-with-kennedy]], 172–73 (in the press room at the Crillon Salinger tells reporters that Rusk will not come "because of the situation in the Dominican Republic," then names the assassination
      of Trujillo; the news was out within the hour; Kennedy angry; Rusk on the telephone during the dinner: "Are you out of your mind?")'
