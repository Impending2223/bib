- add:
    entry:
      id: cal.1963-11-23.succession
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Johnson''s first intelligence briefing, from McCone, in Bundy''s office in the White House basement: nothing to decide at once; South Vietnam the one concern, by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 22. Names: Johnson, McCone, McGeorge Bundy.'
      tags:
      - name:johnson-lyndon-b
      - name:mccone-john-a
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1963-11-23.succession-2
      when: Nov. 23
      date: '1963-11-23'
      thread: succession
      c: 'Eisenhower down from Gettysburg: the better part of an hour with Johnson in the Executive Office Building; then, in the outer office, his advice written out in longhand and dictated to Alice Boyce, by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 31. Names: Eisenhower, Johnson.'
      tags:
      - name:eisenhower-dwight-d
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-25.succession
      when: Nov. 25
      date: '1963-11-25'
      thread: succession
      c: 'Johnson to some forty governors, 8:30 p.m., in his office in the Executive Office Building, late from de Gaulle: the States the federal government''s partners; the tax cut and the civil rights bill; "I need your heart and your hand."'
      n: 'Remarks to State Governors After President Kennedy''s Funeral, [1963–64 Pub. Papers 4](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=88) (Nov. 25, 1963). [[w.johnson-vantage-point]], 28–29 (forty governors; the tax cut and the civil rights bill). Names: Johnson, de Gaulle. Check: Johnson calls the talk off the record, its full text never released, and quotes words of it the Public Papers'' text lacks (28).'
      tags:
      - name:johnson-lyndon-b
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1963-11-25.europe-and-the-alliance-france
      when: Nov. 25
      date: '1963-11-25'
      thread: europe-and-the-alliance-france
      c: 'De Gaulle with Johnson after the funeral: the two countries'' differences exaggerated; France knows it can count on the United States if attacked. Johnson had just read a report of de Gaulle telling an allied ambassador the contrary, by his account. Another meeting set for early in the new year.'
      n: 'Remarks to State Governors After President Kennedy''s Funeral, [1963–64 Pub. Papers 4](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=88) (Nov. 25, 1963) (the talk; another meeting set). [[w.johnson-vantage-point]], 23–24. Names: de Gaulle, Johnson.'
      tags:
      - name:de-gaulle-charles
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1963-11-26.soviet-union
      when: Nov. 26
      date: '1963-11-26'
      thread: soviet-union
      c: 'Mikoyan with Johnson, 11:35 a.m., Harriman, Thompson and McGeorge Bundy present. A letter for Khrushchev: "I have been in full accord with the policies of President Kennedy." Castro''s subversion in Latin America; no American plan to invade Cuba.'
      n: 'FRUS 1961–63, V, docs. [380](https://history.state.gov/historicaldocuments/frus1961-63v05/d380), [381](https://history.state.gov/historicaldocuments/frus1961-63v05/d381); XI, doc. [380](https://history.state.gov/historicaldocuments/frus1961-63v11/d380). [[w.johnson-vantage-point]], 24–25. Made public: the letter, [[w.johnson-vantage-point]], 25. Names: Mikoyan, Johnson, Harriman, Thompson, McGeorge Bundy, Khrushchev, Kennedy, Castro.'
      tags:
      - name:mikoyan-anastas
      - name:johnson-lyndon-b
      - name:harriman-w-averell
      - name:thompson-llewellyn-e
      - name:bundy-mcgeorge
      - name:khrushchev-nikita-s
      - name:kennedy-john-f
      - name:castro-fidel
- add:
    entry:
      id: cal.1963-11-26.latin-america
      when: Nov. 26
      date: '1963-11-26'
      thread: latin-america
      c: 'Johnson to the Latin American representatives at the White House, Mrs. Kennedy present at her wish: the Alliance for Progress reaffirmed, "all the energies of my Government" pledged to it.'
      n: 'Remarks on the Alliance for Progress to Representatives of the Countries of Latin America, [1963–64 Pub. Papers 6](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=90) (Nov. 26, 1963). [[w.johnson-vantage-point]], 22 (Mrs. Kennedy). Names: Johnson, Jacqueline Kennedy.'
      tags:
      - name:johnson-lyndon-b
      - name:kennedy-jacqueline
- add:
    entry:
      id: cal.1963-12-17.succession
      when: Dec. 17
      date: '1963-12-17'
      thread: succession
      c: 'Johnson to the UN General Assembly: "the assassin''s bullet which took his life did not alter his Nation''s purpose"; a world "safe for diversity, and free from hostility."'
      n: 'Address Before the General Assembly of the United Nations, [1963–64 Pub. Papers 61](https://www.govinfo.gov/content/pkg/PPP-1963-book2/pdf/PPP-1963-book2.pdf#page=145) (Dec. 17, 1963). [[w.johnson-vantage-point]], 23. Names: Johnson.'
      tags:
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1964-08-25.elections-1964-2
      when: Aug. 25
      date: '1964-08-25'
      thread: elections-1964
      c: 'Johnson, alone at his desk, 10:40 to 11:06 a.m., writes out a statement that he will not run: "I have learned after trying very hard that I am not that voice or that leader." Read to Reedy ("just give the country to Goldwater"), to Jenkins, and to A. W. Moursund of the Texas delegation; Mrs. Johnson against it, in a note. That afternoon he decides to accept, by his account.'
      n: '[[w.johnson-vantage-point]], 96–98 (the times from Juanita Roberts''s note for the file, 97 n.). Made public: there. See [[cal.1964-03-10.elections-1964]]. Names: Johnson, Reedy, Goldwater, Jenkins, Lady Bird Johnson.'
      tags:
      - name:johnson-lyndon-b
      - name:reedy-george-e
      - name:goldwater-barry-m
      - name:jenkins-walter-w
      - name:johnson-lady-bird
- add:
    entry:
      id: cal.1965-12-07.vietnam-pause
      when: Dec. 7
      date: '1965-12-07'
      thread: vietnam-pause
      c: 'The LBJ Ranch: Rusk, McNamara and McGeorge Bundy with Johnson on McNamara''s report and a pause in the bombing. Johnson: "I don''t want to take off till I know I can get back." By his account he asks twice whether the bombing could be resumed if Hanoi did nothing; they assure him it could.'
      n: '[FRUS 1964–68, III, doc. 223](https://history.state.gov/historicaldocuments/frus1964-68v03/d223). [[w.johnson-vantage-point]], 235. Bibliography: [[cal.1965-12-24.vietnam]]. Names: Rusk, McNamara, McGeorge Bundy, Johnson.'
      tags:
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:bundy-mcgeorge
      - name:johnson-lyndon-b
      - ok:thread-first
- add:
    entry:
      id: cal.1967-10-03.elections-1968
      when: Oct. 3
      date: '1967-10-03'
      thread: elections-1968
      c: 'Johnson to Rusk, McNamara, Rostow, Helms and Christian, after a meeting on the Middle East, arms control and Vietnam, nothing to leave the room: what would it do to the war if he announced he would not run? "If it were set either way today, the decision would be that he would not run."'
      n: '[FRUS 1964–68, V, doc. 341](https://history.state.gov/historicaldocuments/frus1964-68v05/d341). [[w.johnson-vantage-point]], 428. Made public: Johnson''s memoir (1971); the notes, FRUS 1964–68, V (2002). Names: Johnson, Rusk, McNamara, Rostow, Helms, Christian.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:mcnamara-robert-s
      - name:rostow-walt-w
      - name:helms-richard
      - name:christian-george
- add:
    entry:
      id: cal.1967-11.elections-1968
      when: Nov.
      date: 1967-11
      thread: elections-1968
      c: 'Westmoreland, home from Saigon, after dinner in the family quarters: would the men in Vietnam think themselves let down if Johnson announced he would not run? "Mr. President, I do not believe so," by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 429, 434. See [[cal.1967-10-03.elections-1968]]. Names: Westmoreland, Johnson. Check the day.'
      tags:
      - name:westmoreland-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-01-17.elections-1968
      when: Jan. 17
      date: '1968-01-17'
      thread: elections-1968
      c: 'Johnson goes to the Capitol for the State of the Union without the statement withdrawing from the race, Christian''s, from Busby''s draft: "I have prayerfully concluded that I will not be a candidate for reelection." He would not have read it, he writes; Christian told to keep it up to date.'
      n: '[[w.johnson-vantage-point]], 429–30. See [[cal.1967-10-03.elections-1968]]. Names: Johnson, Christian, Busby.'
      tags:
      - name:johnson-lyndon-b
      - name:christian-george
      - name:busby-horace
- add:
    entry:
      id: cal.1968-03-19.vietnam-205000
      when: Mar. 19
      date: '1968-03-19'
      thread: vietnam-205000
      c: 'The Tuesday lunch, 1:01 p.m.: Goldberg''s proposal of a full halt in the bombing; Rusk for a de facto halt above the panhandle and a de facto response. Clifford: Goldberg''s "fruitless"; call in the senior advisers again. Johnson agrees; a draft of the address by Mar. 21.'
      n: '[FRUS 1964–68, VI, doc. 142](https://history.state.gov/historicaldocuments/frus1964-68v06/d142). [[w.johnson-vantage-point]], 409. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Goldberg, Rusk, Clifford, Johnson.'
      tags:
      - name:goldberg-arthur-j
      - name:rusk-dean
      - name:clifford-clark
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-20.vietnam-205000
      when: Mar. 20
      date: '1968-03-20'
      thread: vietnam-205000
      c: 'The address, in the Cabinet Room, 5:08 p.m.: Humphrey, Rusk, Clifford, Goldberg, Fortas, McGeorge and William Bundy. Rusk: no proposal without some cessation of the bombing; Clifford: stop north of the 20th parallel for restraint at the DMZ; Goldberg for a full halt; Fortas against any pause. Johnson asks for the peace proposals to be studied apart from the speech.'
      n: '[FRUS 1964–68, VI, doc. 147](https://history.state.gov/historicaldocuments/frus1964-68v06/d147). [[w.johnson-vantage-point]], 411–13. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Humphrey, Rusk, Clifford, Goldberg, Fortas, McGeorge Bundy, William Bundy, Johnson.'
      tags:
      - name:humphrey-hubert-h
      - name:rusk-dean
      - name:clifford-clark
      - name:goldberg-arthur-j
      - name:fortas-abe
      - name:bundy-mcgeorge
      - name:bundy-william
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-27.vietnam-205000
      when: Mar. 27
      date: '1968-03-27'
      thread: vietnam-205000
      c: 'Mansfield with Johnson at the White House in the evening, at length: parts of the address read to him; the bombing to end north of the 20th parallel, by Johnson''s account.'
      n: '[[w.johnson-vantage-point]], 419. Mansfield''s account, in the Senate: [[cal.1968-04-02.vietnam]]. See [[cal.1968-02-27.vietnam]]. Names: Mansfield, Johnson.'
      tags:
      - name:mansfield-mike
      - name:johnson-lyndon-b
- add:
    entry:
      id: cal.1968-03-30.elections-1968
      when: Mar. 30
      date: '1968-03-30'
      thread: elections-1968
      c: 'Busby''s new version of the statement withdrawing from the race, sent while Johnson goes over the last draft of the address in the Cabinet Room. He slides it across the table to Christian: the peroration, by his account.'
      n: '[[w.johnson-vantage-point]], 431. See [[cal.1967-10-03.elections-1968]]. Names: Busby, Johnson, Christian.'
      tags:
      - name:busby-horace
      - name:johnson-lyndon-b
      - name:christian-george
- add:
    entry:
      id: cal.1968-08-19.soviet-union
      when: Aug. 19
      date: '1968-08-19'
      thread: soviet-union
      c: 'Dobrynin hands Rusk a note: Moscow "positive" to Johnson''s wish to meet the Soviet leaders in the Soviet Union, in the first ten days of October; a joint announcement proposed. Rostow cables it to Johnson, flying to Detroit. Back at the White House that night, Johnson agrees with Rusk and Rostow to announce it Aug. 21, by his account.'
      n: '[FRUS 1964–68, XIV, doc. 286](https://history.state.gov/historicaldocuments/frus1964-68v14/d286). [[w.johnson-vantage-point]], 487. Made public: FRUS 1964–68, XIV (2001). Names: Dobrynin, Rusk, Johnson, Rostow.'
      tags:
      - name:dobrynin-anatoly
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:rostow-walt-w
