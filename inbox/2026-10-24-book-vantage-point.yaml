- edit:
    id: cal.1967-06-23.soviet-union
    base: 80ed9f57
    set:
      n: 'Remarks Following the President''s First Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 644](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=712) (June 23, 1967); Remarks Following the President''s Second Meeting With Chairman Kosygin at Glassboro, New Jersey, [1967 Pub. Papers 650](https://www.govinfo.gov/content/pkg/PPP-1967-book1/pdf/PPP-1967-book1.pdf#page=718) (June 25, 1967). FRUS 1964–68, XIV, docs. [228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228)–[237](https://history.state.gov/historicaldocuments/frus1964-68v14/d237); XI, doc. [198](https://history.state.gov/historicaldocuments/frus1964-68v11/d198); V, doc. [217](https://history.state.gov/historicaldocuments/frus1964-68v05/d217). [Johnson and Eisenhower](https://millercenter.org/the-presidency/secret-white-house-tapes/conversation-dwight-eisenhower-june-26-1967), Conversation WH6706-02-11914 (Miller Center). [President''s Daily Diary, June 23, 1967](https://catalog.archives.gov/id/192469), images 4, 6, 7, 14, 15; [June 25](https://catalog.archives.gov/id/192471), images 9, 10, 11, 15 (LBJ Library; National Archives Catalog). Made public: the memoranda of conversation, FRUS 1964–68, XIV (2001). [[w.drea-mcnamara-clifford-and-the-2011]], 366–367; [[w.poole-joint-chiefs-of-staff-2012]], 37; [[w.johnson-vantage-point]], 256–57, 481–85 (all but Rusk with Gromyko and the call to Eisenhower). To check: [[w.dobrynin-in-confidence]]; [[w.schwartz-lyndon-johnson-and-europe]]; [[w.zubok-failed-empire]]; [[w.dallek-flawed-giant]]. See [[cal.1966-10-10.soviet-union]]. Names: Johnson, Kosygin, McNamara, Phạm Văn Đồng, Rusk, Gromyko, Eisenhower.'
      c: 'Glassboro, N.J., Hollybush, the house of the president of Glassboro State College: Johnson and Kosygin, June 23 and 25, their only meeting. The Middle East: Kosygin, Israel''s troops back to the armistice lines, the Gulf of Aqaba to the International Court; "unless you do this there will be a war." Johnson: talks on ABMs and ICBMs; when and where might McNamara meet Soviet representatives? Kosygin: offensive weapons too. June 23, Kosygin: Phạm Văn Đồng''s answer, received at lunch: stop the bombing and Hanoi will go to the conference table at once. June 25, Johnson gives him a message for Hanoi: the bombing might stop, with immediate discussions after. Rusk with Gromyko, June 23, on nonproliferation. Johnson to Eisenhower, June 25, by telephone.'
