- add-words:
    id: cal.1963-01.states-and-cities
    after: 'Rockefeller''s budget, a record, balanced by higher fees for liquor licenses and auto registrations, the Republican leaders not consulted: fees, he says, not taxes, and Kennedy''s failed growth to blame.'
    words: He had won reelection on a promise of no new taxes; registration charges had not risen since 1923, liquor taxes since 1934.
    item: '[[w.smith-on-his-own-terms]], 393'
- add-words:
