    after: end
    words: In the interview Nhu puts "at least 50 percent" of the advisers as "not absolutely necessary," too many of them "daredevils" impatient to attack the enemy. He asks no full withdrawal and no end of aid; he answers a Pentagon spokesman of two days before, on cutting forces within one to three years.
