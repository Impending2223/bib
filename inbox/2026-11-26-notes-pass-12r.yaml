      thread: vietnam
      time_range:
      - 1963-08-24T23:00Z
      - 1963-08-25T02:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      c: 'Early evening. Gilpatric telephones Taylor at his quarters, Fort Myer, from his Maryland farm: Forrestal has told him the substance of the cable, for information, not Defense concurrence, the President having approved it. Gilpatric outlines it; both are concerned at its substance and at the handling.'
      n: '[[w.taylor-swords-and-plowshares]], 292 ("the early evening of August 24"; Taylor''s account). See [[cal.1963-08-24.vietnam]]. Names: Gilpatric, Taylor, Forrestal.'
      tags:
      - name:gilpatric-roswell-l
      - name:taylor-maxwell
      - name:forrestal-michael-v
- add:
    entry:
      id: cal.1963-08-24.vietnam-6
      when: Aug. 24
      date: '1963-08-24'
      place: fort-myer
      thread: vietnam
      follows:
      - cal.1963-08-24.vietnam-5
      - cal.1963-08-24.vietnam
      time_range:
      - 1963-08-24T23:00Z
      - 1963-08-25T02:00Z
      time_band: evening
      time_zone: America/New_York
      range_basis: record
      c: Later that evening. General Krulak of the Joint Staff brings Taylor a copy of the dispatched cable at his house, Fort Myer; Taylor had called the Pentagon for it. By Taylor's account he reads it as the work of the anti-Diệm group at State, got out while the principal officials were away.
      n: '[[w.taylor-swords-and-plowshares]], 292 ("later in the evening"; Taylor''s account). See [[cal.1963-08-24.vietnam]]. Names: Krulak, Taylor, Ngô Đình Diệm.'
      tags:
      - name:krulak-victor-h
      - name:taylor-maxwell
      - name:ngo-dinh-diem
