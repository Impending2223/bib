    after: 'Taylor for the Joint Chiefs, before Foreign Relations: for the treaty, with safeguards.'
    words: 'The four safeguards: continuing underground tests; modern laboratories and scientists; facilities to resume atmospheric tests promptly if needed; better means of monitoring the treaty.'
