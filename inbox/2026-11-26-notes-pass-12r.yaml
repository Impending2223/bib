    text: 'Check: Chang, 249 and 251, gives Taylor''s words before "the Senate hearings," with no committee and no day; its notes 43 and 47 cite both Foreign Relations (*Nuclear Test Ban Treaty*, 274–75, 337, 342, 397) and the Preparedness Subcommittee (*Military Aspects*, 676–77, 707, 738).'
