      also:
      - vietnam
      c: 'Halberstam in the *New York Times*: Lodge is dissatisfied with Richardson, the CIA''s station chief in Saigon; Richardson had not disobeyed the ambassador.'
      n: '[[w.moyar-triumph-forsaken]], 252 (Halberstam gives "the matter wider circulation" two days after Reston''s remark to McCone). To check: [*New York Times*, Oct. 4, 1963](https://timesmachine.nytimes.com/timesmachine/1963/10/04/issue.html) (cited by [[w.moyar-triumph-forsaken]], 252 n.40). See [[cal.1963-10-02.press-and-broadcasting]]. Names: Halberstam, Lodge, Richardson.'
      tags:
