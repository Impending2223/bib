    after: end
    words: Dikötter has Peking send it, 1,500 strong. It interrogates, denounces in public meetings and tortures some 2,000 of the company's employees; hundreds are accused, from "speculation" to "moral decadence"; fourteen commit suicide; it is announced that "power had been seized by counter-revolutionaries."
    item: '[[w.dikotter-cultural-revolution]], 22'
- add-words:
