      c: Shortly before 3 p.m. The Royal Bank of Canada tells its Havana office that the money needs only Donovan's signature to be released. Castro lets two more planeloads leave; the last three are cleared.
      n: '[[w.guthman-we-band-of-brothers]], 136 ("shortly before the 3 p.m. deadline"). See [[cal.1962-12-24.cuba-2]]. Names: Donovan, Castro.'
