        c: '*Puyallup Tribe v. Department of Game of Washington*, [391 U.S. 392](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391392/usrep391392.pdf): Washington may regulate the Indians'' fishing at their treaty grounds, "in common with" others, in the interest of conservation. Medicine Creek Treaty, 1854; set nets for salmon and steelhead on the Puyallup and Nisqually rivers. Whether the ban on set nets was reasonable and necessary left to the State court; the regulation must not discriminate against the Indians. Douglas for the Court. Argued Mar. 25–26.'
        n: 'Opinion, Nos. 247 and 319 (with *Kautz v. Department of Game*). Names: Douglas.'
