      set:
        also: [court]
        tags: [state:wa]
        c: 'Eight arrested outside the Supreme Court after five of its windows are broken. The Campaign''s members protest, for its Indian contingent, the ruling of May 27 in *Puyallup Tribe v. Department of Game*, [391 U.S. 392](https://tile.loc.gov/storage-services/service/ll/usrep/usrep391/usrep391392/usrep391392.pdf): Washington may regulate net fishing for salmon by the Indians.'
        n: '[[w.cq-weekly-report]], June 7, 1968, 1384 (the arrests, the windows, the Indian contingent, a ruling on net fishing in Washington); [[w.mcknight-last-crusade]], 131 (the demonstration, the five windows, a ruling on net fishing). Neither names the case. The opinion of May 27 is the ruling they describe: Washington, salmon, set nets, the Indians'' treaty right. See [[cal.1968-05-27.court]]. Check: the day of the demonstration (McKnight cites the Washington papers of May 31); who broke the windows (McKnight: teenagers who may not have been from Resurrection City); the hour.'
