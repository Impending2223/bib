    after: end
    words: The morning breakfast at 8 a.m. is with Morse, Collins, Simkin and his cabinet advisers; Wirtz is opposed to calling the parties in, Connor unenthusiastic. At 1 p.m. in the Cabinet Room he asks for "a noninflationary settlement" and tells them to remember "our boys in Vietnam," then sends them to Room 275 of the Executive Office Building. Afterward he opens a back channel unknown to Wirtz and Connor, Goldberg for the union and Clifford for the companies. That afternoon he sees Eisenhower, who joins him before the press. The postponement is announced at 9 p.m.; Abel is alone with Johnson later.
