- add-words:
    id: cal.1965-07-27.vietnam
    after: end
    words: 'Johnson: he could ask Congress for "great sums of money," call up reserves, increase the draft and declare an emergency, but does not "want to be dramatic and cause tension"; more troops to come "out of forces in this country," the money by his transfer authority until January.'
    item: '[[w.dallek-flawed-giant]], 276'
- add-words:
    id: cal.1965-07-22.vietnam
    after: end
    words: 'Johnson asks whether Congress and the people will go along with 600,000 men and billions of dollars 10,000 miles away; Resor: the Gallup Poll shows them "basically behind our commitment."'
    text: FRUS 1964–68, III, doc. [76](https://history.state.gov/historicaldocuments/frus1964-68v03/d76)
    item: '[[w.herring-lbj-and-vietnam]], 129'
- check:
    id: cal.1965-07-22.vietnam
    text: 'Check: Herring, 129, puts Johnson''s question on 600,000 men and Resor''s answer at a meeting of July 27; FRUS, doc. 76, records them at this meeting.'
- check:
    id: cal.1965-07-27.vietnam
    text: 'Check: Herring, 129, puts Johnson''s question on 600,000 men and Resor''s answer here; FRUS 1964–68, III, doc. 76, records them on July 22 ([[cal.1965-07-22.vietnam]]).'
- add-words:
    id: cal.1965-07-27.vietnam
    after: end
    words: Asked whether the military is on board, Wheeler nods.
