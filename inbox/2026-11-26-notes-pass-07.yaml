- edit:
    id: cal.1965-09-30.china-leadership-4
    base: a6d1e363
    kind: correct
    set:
      c: 'Zhou receives Chaerul Saleh, head of Indonesia''s provisional People''s Consultative Congress, Sept. 30 and Oct. 1.{1} China still wants the Asian-African conference to meet and succeed; but obstacles stand: U.S.–Soviet cooperation, and use of the U.N., from outside and inside, to wreck it and lower its anti-imperialist, anti-colonial key. The Bandung spirit cannot fail;{2} if no second conference, it will be raised higher.{3}'
      n: '[[w.zhou-enlai-nianpu-1949]], II, 758 (Sept. 30–Oct. 1, 1965); [[w.zhou-enlai-waijiao-huodong]], 480 (Sept. 30, 1965; 5:30 p.m., Fujian Hall, Great Hall of the People; the delegation of Indonesia''s provisional People''s Consultative Congress under Chaerul Saleh (哈鲁尔·萨勒) and its vice-chairman Ali Sastroamidjojo, and the vice-chairman of the Gotong Royong parliament Subamia (苏巴米亚) and his wife); [[w.zhou-enlai-waijiao-huodong]], 480–81 (Oct. 1, 1965; 5:45 p.m., Building 17, Diaoyutai guesthouse; talks with Chaerul Saleh, chairman of Indonesia''s provisional People''s Consultative Congress, and vice-chairman Ali Sastroamidjojo); [[w.zhonghua-renmin-gongheguo-waijiao]], 57 (Sept. 27–Oct. 4, 1965; Chaerul Saleh''s delegation, Sept. 27 to Oct. 4; Mao, Liu Shaoqi and Zhou each receive it; Zhou on the obstacles to the conference); [[w.jian-zhou-enlai]], 528 (Zhou''s second conversation with the delegation, Oct. 1 by the record the note names, "October 2" in the text: by the foreign news "the coup by a committee of right-wing generals had failed" in Jakarta, and Sukarno''s "guards had organized a revolutionary committee to control the situation"); [[w.chen-yi-nianpu]], 1125 (Sept. 30, 1965, afternoon; Chen Yi present at Zhou''s reception of the delegation of the provisional People''s Consultative Congress led by Chaerul Saleh 哈鲁尔·萨勒, Ali Sastroamidjojo and 威路约·普斯波尤多, and of Subamia 苏巴米亚, Vice-Chairman of the Gotong Royong parliament, and his wife); [[w.chen-yi-nianpu]], 1126 (Oct. 1, 1965, afternoon; Chen Yi in Zhou''s talks with Chaerul Saleh, Ali Sastroamidjojo and 威路约·普斯波尤多). Made public: 1993. The time is the first day''s. The *Waijiao dashiji*, III, 57, and the Chen Yi chronology, 1125, name him Chaerul Saleh (哈鲁尔·萨勒). To check: Premier Zhou''s second conversation with delegation of Indonesian Provisional People''s Consultative Conference, October 1, 1965, 105-01687-02, Chinese Foreign Ministry Archive (cited by [[w.jian-zhou-enlai]], 528 n.36). Names: Zhou Enlai, Chaerul Saleh.'
- add-words:
