      c: 'Fred Graham, legal correspondent of the *New York Times*, on *White v. Crook*: women''s jury service "another windfall from the civil rights movement," as the ban on sex discrimination in employment had been; the new standard would void the exclusion laws of South Carolina and Mississippi and could oblige twenty-six other States to drop lesser limits.'
      n: '[[w.branch-at-canaans-edge]], 437; 889 (the note: the column''s title and day). To check: Fred Graham, "The Law: Rights Case Yields Dividend for Women," [*New York Times*, Feb. 13, 1966](https://timesmachine.nytimes.com/timesmachine/1966/02/13/issue.html), at IV-8 (cited by [[w.branch-at-canaans-edge]], 889). See [[cal.1966-02-07.alabama]].'
      tags:
      - polity:us
      - state:alabama
