    after: end
    words: 'Mao: "I do not believe it is only Wu Han''s problem ... there are people in the court, in every great region and every province and city"; on rectifying the left at Wuhan, "I do not agree." Peng Zhen asks through Mao''s secretary Xu Yefu for twenty minutes with him; Mao will not see him.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 125–26'
