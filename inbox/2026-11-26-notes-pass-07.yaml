- add-words:
    id: cal.1965-08-30.steel
    after: 'With the Steelworkers'' contract to run out Sept. 1 (Check), Johnson brings Abel of the union and Cooper of United States Steel to the White House with Wirtz and Connor: a shutdown put off eight days, the bargaining moved to Washington.'
    words: In the Cabinet Room at 1 p.m., before photographers, Johnson asks for "a noninflationary settlement," tells them to remember "our boys in Vietnam," and sends them to Room 275 of the Executive Office Building, his suite as Vice President.
    item: '[[w.califano-triumph-and-tragedy-of]], 90'
- add-words:
    id: cal.1965-08-30.steel
    after: On television that evening.
    words: The announcement at 9 p.m., Abel and Cooper beside Johnson; the talks to resume at 10.
    item: '[[w.califano-triumph-and-tragedy-of]], 91'
- cite:
    id: cal.1965-08-30.steel-2
    item: '[[w.dallek-flawed-giant]], 305'
    'on': 'After the meeting, Johnson''s secret channel: Goldberg to the union, Clifford, counsel to Republic Steel, to the companies;'
- add:
    entry:
      id: cal.1965-08-30.steel-3
      when: Aug. 30
      date: '1965-08-30'
      time: 1965-08-30T12:00Z
      time_zone: America/New_York
      place: washington
      thread: steel
      also:
      - labor-disputes
      c: 'Breakfast at the White House, 8 a.m.: Johnson with Morse and Collins, back from Pittsburgh without a settlement, Simkin, Wirtz and Connor, on calling the steel parties in. Wirtz against, Connor unenthusiastic; Morse and Collins for direct pressure. Morse: "We''ll never settle the steel case on that basis," the 3.2 percent guidelines.'
      n: '[[w.califano-triumph-and-tragedy-of]], 90; [[w.dallek-flawed-giant]], 305 (Morse''s words; the four pessimistic). See [[cal.1965-08-30.steel]]. Names: Johnson, Morse, Collins, Simkin, Wirtz, Connor.'
      tags:
      - polity:us
      - name:johnson-lyndon-b
      - name:morse-wayne
      - name:collins-leroy
      - name:simkin-william-e
      - name:wirtz-w-willard
      - name:connor-john-t
- add:
