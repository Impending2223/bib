    - name:ye-jianying
    - name:liu-zhijian
- add-words:
    id: cal.1966-07-22.china-leadership-9
    after: end
    words: They say they come "on the orders of the Chairman" to learn from the students.
    item: '[[w.dikotter-cultural-revolution]], 67'
- check:
    id: cal.1966-07-22.china-leadership-9
    text: 'Check: Dikötter, 67, has Jiang Qing and Chen Boda at Peking University "two days" after the Group''s visit to Kuai Dafu, and has them overturn there the work team''s verdict on the students condemned a month before; Pu Weihua, 177, has the work team attacked at the rallies of July 25 and 26.'
- add-words:
    id: cal.1966-07-22.china-leadership-9
    after: end
    words: They set the work group aside and deal only with Nie Yuanzi and a few others.
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 177'
