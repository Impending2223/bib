- add-words:
    id: cal.1966-05-05.china-leadership
    after: end
    words: 'By Pu Weihua''s account Mao speaks too of the "peeling of bamboo shoots": from 1921 to 1966, forty-five years, scores of Central Committee members cast out, Chen Duxiu, Qu Qiubai, Li Lisan, Wang Ming, Zhang Guotao, Zhang Wentian, Gao Gang, Rao Shushi, Peng Dehuai, Luo Ruiqing, Peng Zhen and others, and some still beside us not found out.'
