    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1924'
    'on': time
- add-words:
    id: cal.1966-07-22.china-leadership-7
    after: end
    words: 'Chen Boda again proposes ending the work groups and most oppose. Deng: teach the work groups to work, "some schools without a work team may not do"; Peking University has no Party committee to take over, "I do not agree to withdrawing the work groups." Liu: most work groups are good; some should not be driven off. Ye Jianying and Liu Zhijian, for the army, oppose withdrawing them.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 175'
- names:
    id: cal.1966-07-22.china-leadership-7
    add:
    - Chen Boda
