    item: '[[w.pu-weihua-zalan-jiu-shijie]], 69'
- add-words:
    id: cal.1966-04-14.china-leadership-2
    after: end
    words: 'His first note that morning, to Zhou, Deng, Peng Zhen and Kang Sheng: "some revisions, please consider." At 8:30 a.m. he writes Jiang Qing; at 9 a.m. Zhou, Deng and Peng Zhen, who may come on the 16th, the regional bureaus to decide whether to send men.'
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 246–47'
