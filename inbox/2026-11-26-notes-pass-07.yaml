- add-words:
    id: cal.1966-03-18.china-leadership
    after: end
    words: 'The afternoon, at the Liu villa on the southwest shore of West Lake: Liu Shaoqi and Zhou Enlai there, Deng away; Peng Zhen, Kang Sheng, Chen Boda and Wu Lengxi sitting in; the bureaus'' secretaries not at this session. All agree with Mao; Peng Zhen explains that the second telephone report to him was only another idea for his reference. Decided: the Party sends no delegation to the 23rd Congress; Peng Zhen to have the Liaison Department tell the Soviet embassy.'
    item: '[[w.lengxi-shinian-lunzhan-1956-1966]], 937–39'
