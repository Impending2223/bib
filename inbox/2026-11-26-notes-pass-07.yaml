    item: '[[w.pu-weihua-zalan-jiu-shijie]], 40–42'
- add-words:
    id: cal.1966-02-02.china-leadership
    after: end
    words: 'By the attendees'' later recollection she says: a black line opposed to Mao''s thought has held power over the arts for seventeen years and must go, the army to lead; Zhou Enlai''s "separate first, then merge" for national music is wrong; the Peking committee, Zhou Yang, Lin Mohan and Xia Yan are attacked; *The East Is Red* is criticized.'
