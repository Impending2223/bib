    after: end
    words: The work group is to hold the daily layout and direct Xinhua and the broadcast stations on foreign news, its members to enter May 31, with Wu Lengxi and the other deputy editors-in-chief keeping their posts for the time. Mao writes on the letter that night "agreed to this."
    item: '[[w.shaoqi-liu-shaoqi-nianpu-chronology]], II, 638–639'
- add-words:
    id: cal.1966-05-29.china-leadership
    after: end
    words: The work group's members are Mu Xin, Qian Dixian, Shang Like, Zhu Yuepeng and Yang Ding, with Lu Ying and Shao Yihua from Shanghai later.
