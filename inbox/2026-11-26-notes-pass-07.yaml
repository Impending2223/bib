      c: 'Honolulu. Westmoreland puts his recommendations for more troops to Sharp: 102 battalions, up from the 71 agreed with McNamara the summer before, 79 American and 23 allied; American strength in 1966 of 429,000; as much weight on the support units, signal, engineer, aircraft and port battalions. By Westmoreland''s account.'
