    words: Some 5,000 take part in Wuhan's eleventh annual cross-Yangtze swimming competition; Wang Renzhong and six guards of the Hubei First Independent Division are in the water with him; the swim takes an hour and five minutes.
    item: '[[w.macfarquhar-maos-last-revolution]], 81–82'
