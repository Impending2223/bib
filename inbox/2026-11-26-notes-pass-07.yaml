    text: 'Check: MacFarquhar, *Origins*, III, 458, has Mao summon Kang Sheng, Jiang Qing and Zhang Chunqiao on Mar. 28 and 30; the Peng Zhen chronology, IV, 476, has Mao talk with Kang Sheng on the 28th and 29th.'
- add-words:
    id: cal.1966-03-28.china-leadership-2
    after: end
    words: Kang Sheng reports that Peng Zhen and the Five-Man Group "held back" the articles of the "left," Guan Feng and Qi Benyu, and that Peng faulted the *Wenhui bao*.
    item: '[[w.peng-zhen-nianpu-1902]], IV, 476'
- add-words:
    id: cal.1966-03-28.china-leadership-2
    after: end
    words: 'Told how Peng Zhen, through Xu Liqun, telephoned Yang Yongzhi of Shanghai''s Propaganda Department to ask why Yao Wenyuan''s article went out without word to the Department, Kang says: "this is aimed at the Chairman." Mao: without a cultural revolution the old, middle and young will all be purged. Mao vetoes the delegation to the CPSU''s Twenty-third Congress that the Standing Committee members in Peking had approved, "they agree, I don''t," against Liu Shaoqi''s "going or not is no great matter"; he calls the draft joint communiqué with the Japanese Communists a "headless notice" and rewrites it to name the CPSU. By Kang''s account to the enlarged Politburo, May 5–6, Mao also calls Deng Tuo a traitor, wants Jian Bozan named, and finds Lu Ping unfit to lead Peking University.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 66–67'
