    item: '[[w.herring-lbj-and-vietnam]], 133–34'
- add-words:
    id: cal.1965-08-05.vietnam
    after: Safer's film on the CBS evening news, Aug. 5.
    words: 'Safer: the operation burned 150 houses, wounded three women, killed a baby, wounded a Marine, took four prisoners, four old men.'
    item: '[[w.gibbons-u-s-government-and]], IV, 69'
- check:
    id: cal.1965-08-05.vietnam
    text: 'Check: Gibbons, IV, 69, by Halberstam, puts Johnson''s telephone call to Stanton the next day, Aug. 6.'
- add-words:
    id: cal.1965-08-06.china-leadership
    after: end
    words: 'Peng Zhen speaks: after sixteen years abroad Li is back to join the patriotic anti-imperialist ranks, an important "choice and turning point" of his political life; the policy toward Kuomintang men in Taiwan and abroad is unchanged, patriots one family, early or late, free to come and go; all who will come back are welcome.'
