      when: Aug. 30
      date: '1965-08-30'
      place: washington
      thread: steel
      also:
      - labor-disputes
      c: 'Later that evening Johnson has Abel to his office alone: Abel must keep his promises as far as he can, but the national interest comes first; if Abel puts it first, Johnson will put Abel''s interests first when he can.'
      n: '[[w.califano-triumph-and-tragedy-of]], 91 ("Later that evening," after the 9 p.m. announcement). See [[cal.1965-08-30.steel]]. Names: Johnson, Abel.'
      tags:
