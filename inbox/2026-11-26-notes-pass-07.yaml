      n: '[[w.zhou-enlai-nianpu-1949-2020]], III, 36 (June 9–12, 1966: 其间，分别与...谈话). Made public: 2020. Check: the days; and whether the chronology''s edition of 1997 prints the talks. See [[cal.1966-06-09.china-leadership]]. Names: Zhou Enlai, Tao Zhu, Liu Lantao, Kang Sheng, Wang Dongxing, Jiang Qing.'
