patch: notes-pass-07
by: 'Claude (reader; the notes pass, batch 07: R33a, building on the entry from its cites)'
ops:
- add-words:
    id: cal.1965-07-21.vietnam
    after: end
    words: 'Fifteen advisers meet in the Cabinet Room at 10:40 a.m.: McNamara, Rusk, Vance, McGeorge and William Bundy, Wheeler, Ball, Unger, Helms, Raborn, Lodge, Rowan, McNaughton, Moyers, Valenti. Johnson comes in at 11:30 and rises just after 1 p.m.; the fifteen meet again at 2:30, Johnson in before 2:40, Ball opening: "We cannot win, Mr. President."'
    item: '[[w.valenti-very-human-president]], 319–21, 323, 332–33'
- check:
    id: cal.1965-07-21.vietnam
    text: 'Check: Valenti, 333, has Ball say support in Korea "stabilized at 50 percent."'
- add-words:
    id: cal.1965-07-21.vietnam
    after: end
    words: 'Morning: McNamara leads off with a map, Wheeler joining in; Ball foresees "a perilous voyage," but "if the decision is to go ahead, I''m committed." Afternoon: Rusk, McNamara, McGeorge Bundy, Lodge and Wheeler urge going ahead.'
    item: '[[w.mann-grand-delusion]], 449–50'
- add-words:
    id: cal.1965-07-21.vietnam
    after: end
    words: 'Ball, with charts of the Korean War, warns of a long war: support there fell from 56 to 30 percent as casualties rose; no one answers. McGeorge Bundy: the nation "seemed in the mood to accept grim news."'
    item: '[[w.herring-lbj-and-vietnam]], 129'
- add-words:
    id: cal.1965-07-21.vietnam
    after: end
    words: Clifford, called at 3 p.m., joins the afternoon session under way in the Cabinet Room and says nothing; it ends shortly after 5 p.m.
    item: '[[w.clifford-counsel-to-the-president-2]], 411–13'
