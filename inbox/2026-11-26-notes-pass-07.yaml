    after: end
    words: 'Zhou: the teams might be "temporarily recalled and the masses thus be allowed to carry out the movement by themselves."'
    item: '[[w.jian-zhou-enlai]], 547'
- add-words:
    id: cal.1966-07-19.china-leadership
    after: end
    words: 'By Li Xuefeng''s recollection, at the Huairen Hall: Liu: their way "is truly setting masses against masses ... we have materials here"; Kang Sheng: "we have materials too"; Chen Boda and Deng quarrel; Jiang Qing comes in quietly and sits on a sofa by the minute-takers. Deng: you say we fear the masses, go to the front and try.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 213'
- check:
    id: cal.1966-07-19.china-leadership
    text: 'Check: the day of the Huairen Hall meeting: Li Xuefeng puts it on July 18, afternoon; Yang Jisheng, I, 213 n.70, by the Zhou and Mao chronologies, on July 19.'
