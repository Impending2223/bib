    tags:
    - name:qi-benyu
- add-words:
    id: cal.1966-05-18.china-leadership
    after: end
    words: 'Lin: "the other comrades of the Standing Committee asked me to speak first," meaning Zhou Enlai, by Qi Benyu''s later account to Yu Ruxin.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 162 n.10'
- check:
    id: cal.1966-05-18.china-leadership
    text: 'Check: Teiwes, 62 n.10, cites the *Renmin ribao* of May 18, 1978, that Zhang Chunqiao worked on the coup formula and gathered the speech''s material, and doubts it.'
- names:
    id: cal.1966-05-18.china-leadership
    add:
    - Zhou Enlai
    tags:
    - name:zhou-enlai
- add-words:
    id: cal.1966-05-21.china-leadership-2
    after: end
    words: 'Zhou: Yang Shangkun cannot compare with the other three, cannot make weather of his own, only "held on to legs," Liu''s and Deng''s; Lu Dingyi found through the "husband-and-wife shop," his wife writing anonymous letters for six years; the "Four Families" have taken many positions, and uncovering them is a victory of the "bamboo-shoot-stripping policy." Lin Biao interjects: either they strip us or we strip them.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 132, 149, 152'
- add-words:
    id: cal.1966-05-21.china-leadership-2
    after: end
    words: 'On keeping integrity in later years he makes loyalty to Mao the test: disloyalty in later years "wipes out all at a stroke."'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 159'
- add-words:
    id: cal.1966-05-21.china-leadership-2
    after: end
    words: 'No verdict is final at the coffin or after cremation: Qu Qiubai a traitor, his "Superfluous Words"; Li Xiucheng a traitor; Qu to be moved out of Babaoshan and Li''s Loyal King''s palace at Suzhou pulled down.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], II, 695, 697'
