- add-words:
    id: cal.1966-01-12.program-2
    after: end
    words: 'At about 7:15 a.m. Valenti, Moyers, Watson, Jacobsen and Califano, not Goodwin, are called to the bedroom: the draft to be reorganized and cut by a third. That afternoon in the Oval Office Johnson goes over it with Clifford and Fortas, calling revisions to Valenti and Califano by speaker phone; Goodwin declines to go to the Capitol.'
    item: '[[w.califano-triumph-and-tragedy-of]], 117–18'
