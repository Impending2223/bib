      thread: china-luo-ruiqing
      c: Ye Jianying, chairing the meeting against Luo Ruiqing, has Luo shown the materials on his "small circle" and Liang Biye's record of denunciation; Luo does not sleep all night.
      n: '[[w.yang-jisheng-tiandi-fanfu]], I, 144 (the jump "the next morning"). Made public: 2016. Check: the day; Yang dates it only by the jump of the next morning, Mar. 18. See [[cal.1965-12-08.china-leadership]]. Names: Ye Jianying, Luo Ruiqing.'
      tags:
      - polity:prc
      - vis:only:prc
      - name:ye-jianying
      - name:luo-ruiqing
- add-words:
    id: cal.1966-03-18.china-leadership-3
    after: end
    words: 'After breakfast someone telephones that the meeting is off; in despair he jumps. At Hangzhou Mao asks why he jumped: "no backbone"; Liu Shaoqi: a jump should be head first, his was feet first; Deng Xiaoping: he "jumped like an ice lolly"; Ye Jianying recites lines on the general''s leap.'
    item: '[[w.yang-jisheng-tiandi-fanfu]], I, 144–45'
- names:
    id: cal.1966-03-18.china-leadership-3
