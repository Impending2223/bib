    words: Her letter of June 29 received; she had better stay in Shanghai a while, as Wei Wenbo and Chen Pixian advise; two receptions of foreign guests this month. Since leaving Hangzhou June 15 he has lived ten-odd days in a cave in the west, the Dishuidong at Shaoshan, with little news, and came to Wuhan on the 28th.
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 283, 286'
