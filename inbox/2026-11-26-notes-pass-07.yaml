    item: '[[w.peng-zhen-nianpu-1902]], IV, 436'
- add-words:
    id: cal.1965-09-11.china-leadership-3
    after: end
    words: 'Peng Dehuai: a Communist, he obeys; but he has erred and no one heeds him; he had asked to investigate in the villages, and asks not to go to the third front, having no experience of it. The Military Commission''s enlarged meeting charged him with "mountain-stronghold" sectarianism, Liu Shaoqi at the meeting of ten thousand with illicit relations with foreign countries. Peng Zhen: the verdict cannot be reversed; go and work in peace. Peng Dehuai: let the Ninth Congress next year remove him from the Politburo.'
