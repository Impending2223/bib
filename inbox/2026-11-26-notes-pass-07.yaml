    after: end
    words: 'Mao: Wu Han and Jian Bozan, Party members, are anti-Communist, in truth Kuomintang; the schools, papers, journals and publishers to be looked at for whose hands hold them; the bourgeois academic authorities criticized in earnest and young ones trained; the young not to be feared for breaking "the law," their manuscripts not held back.'
