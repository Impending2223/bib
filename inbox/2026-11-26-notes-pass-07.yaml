    words: Jiang Qing's letter of June 29 had reached him; she had better stay in Shanghai as Wei Wenbo and Chen Pixian advise. Since leaving Hangzhou June 15 he had lived ten-odd days in a cave in the west and come to Wuhan June 28.
    item: '[[w.jianguo-yilai-mao-zedong]], XVIII, 283–287'
- add-words:
    id: cal.1966-07-08.china-leadership
    after: end
    words: The letter is shown to Zhou Enlai and Wang Renzhong, then at Wuhan; Zhou takes it to Jiang Qing at Shanghai, and its contents are told to Lin Biao at Dalian at Mao's request. It is kept wholly secret.
