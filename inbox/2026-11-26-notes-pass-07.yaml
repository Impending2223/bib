- add-words:
    id: cal.1966-06-09.china-leadership
    after: end
    words: 'Chen Boda also reports. Liu Shaoqi asks how the schools are to be done: some seize power, some criticize the academic authorities, then the teaching system is reformed; for the factories and villages, whether to join the cultural revolution to the "four clean-ups." The discussion reaches no clear view on work groups.'
