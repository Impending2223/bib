    - name:liu-shaoqi
    - name:deng-xiaoping
- add-words:
    id: cal.1966-03-20.china-leadership
    after: end
    words: 'Peng Zhen is there. Mao: we were kept in the dark.'
    item: '[[w.peng-zhen-nianpu-1902]], IV, 473–474'
- add-words:
    id: cal.1966-03-20.china-leadership
    after: end
    words: 'Mao: the Center is better as an "empty monarch republic," holding only the great policies; the factories it has taken up to go back to the localities.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 63'
- add-words:
    id: cal.1966-03-20.china-leadership
    after: end
    words: '*Qianxian* is Wu Han''s and Jian Bozan''s front; Yao Wenyuan, Qi Benyu and Yin Da are the new authorities; Qi Benyu, criticizing Luo Ergang, is a staff member of the Center''s office of letters and visits.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 64'
- check:
