    id: cal.1966-08-01.china-leadership
    after: end
    words: The Plenum raises the Standing Committee from seven to eleven, Tao Zhu, Chen Boda, Kang Sheng and Li Fuchun added; the order is Mao, Lin Biao, Zhou Enlai, Tao Zhu, Chen Boda, Deng Xiaoping, Kang Sheng, Liu Shaoqi, Zhu De, Li Fuchun, Chen Yun. Tao Zhu, Chen Boda, Kang Sheng, Xu Xiangqian, Nie Rongzhen and Ye Jianying are added to the Politburo.
