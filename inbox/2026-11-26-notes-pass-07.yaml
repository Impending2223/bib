- add-words:
    id: cal.1966-05-25.china-leadership
    after: end
    words: The poster, "What are Song Shuo, Lu Ping and Peng Peiyun doing in the cultural revolution?", goes up at 2 p.m. on the east wall of the big dining hall; Song deputy head of the Peking committee's university department, Lu the university's Party secretary and president, Peng its deputy Party secretary. Among the seven Zhao Zhengyi and Yang Keming. It calls for wiping out "all ox-demons and snake-spirits, all Khrushchev-style counter-revolutionary revisionists."
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 125–26'
- add-words:
    id: cal.1966-05-25.china-leadership
    after: end
    words: 'Among those Zhou sends Zhang Yan, deputy director of the State Council''s Foreign Affairs Office. At midnight, on Chen Boda''s instructions, Li Xuefeng, Peking''s new first secretary, speaks at the university to 800 Party and League members: struggle in order.'
