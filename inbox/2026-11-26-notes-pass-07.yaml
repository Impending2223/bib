    after: end
    words: 'Peng Zhen presides. The Secretariat agrees in principle to the request of Chen Boda, Zhou Yang, Hu Sheng and others on the tasks of the Central Institute of Marxism-Leninism, centered on the Party''s history and Mao Zedong Thought; Mao has named Dong Biwu chairman, Chen Boda in charge, with Zhou Yang, Hu Qiaomu and Tian Jiaying. Peng''s six points on the third front: 6.7 million at work besides the Railways Ministry, a force bigger than the army, to be put in order under the Construction Commission; supplies under the Planning Commission, delivered to the door, 10 percent saved; new projects held in check.'
