    words: 'By Kang Sheng''s later account, Peng asks to speak first: he never opposed the Chairman, he shielded Deng Tuo, not Wu Han, and his error was "letting go." Kang speaks against him from September 1965 to March 1966, then Chen Boda on his past.'
