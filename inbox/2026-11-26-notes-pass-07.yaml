    after: end
    words: The poster goes up at 6 a.m., with Gao Shukui among the signers. Another poster, "Who is Guo Yingqiu?", asks whether the plan for Peking Garrison men to lodge at the People's University over the holidays was a plot of Peng Zhen's. Sun says opposing the work group is opposing the new committee and the Center.
