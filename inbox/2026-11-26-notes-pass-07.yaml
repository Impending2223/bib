    after: end
    words: 'Deng: the age structure of Party organizations and leaders is a problem; the young must be put in leading posts, the League cadres first renewed, those under county level not over thirty; League members in villages may reach 25 percent, in cities 30.'
    item: '[[w.deng-xiaoping-nianpu-1904]], III, 1871'
- add-words:
    id: cal.1965-08-09.china-leadership-3
    after: end
    words: 'It is the Secretariat''s 399th meeting; Peng Zhen is there. Peng: League members at a quarter of the rural youth of age are about right, more among workers, in shops and schools; 30 to 40 million members not too many; the League to work among the children of landlords and rich peasants and the youth of well-to-do middle peasants.'
