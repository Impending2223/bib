- add-words:
    id: cal.1966-03-30.china-leadership
    after: end
    words: 'In the afternoon. Mao: whoever shields anti-Communist intellectuals is a scholar-tyrant; Qi Benyu, Guan Feng, Yin Da, Mu Xin, Yao Wenyuan and Sun Daren to be protected; Guo Moruo and Fan Wenlan kept; Zhou Enlai and Peng Zhen to be told to be on guard against bourgeois intellectuals.'
    item: '[[w.pu-weihua-zalan-jiu-shijie]], 67–68'
- add-words:
    id: cal.1966-03-30.china-leadership
