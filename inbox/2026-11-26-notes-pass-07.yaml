    id: cal.1966-07-19.china-leadership
    after: end
    words: 'Liu says that this way of theirs truly sets masses against masses, "we have materials"; Kang Sheng: "we have materials too"; Chen Boda and Deng quarrel; Jiang Qing slips in and sits on a sofa. Chen Boda''s proposal followed a call from Shanghai to Wang Li in late June against the old organs sending work groups.'
