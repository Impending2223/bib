    words: 'Wu Han, historian and vice-mayor of Peking, charged with speaking through Hai Rui for the overthrown imperialists, landlords, rich peasants, counter-revolutionaries, bad elements and rightists, against the dictatorship of the proletariat: "a poisonous weed."'
