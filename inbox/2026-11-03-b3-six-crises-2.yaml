      when: Oct. 27
      date: '1960-10-27'
      thread: elections-1960
      c: 'NBC. Elmer Peterson on the Western States: "The tendency has changed rather dramatically to Kennedy."'
      n: '[[w.nixon-six-crises]], 359 (the broadcast quoted). To check: NBC, Elmer Peterson''s report, Oct. 27, 1960 (cited
        by [[w.nixon-six-crises]], 359). Names: Kennedy.'
      src:
