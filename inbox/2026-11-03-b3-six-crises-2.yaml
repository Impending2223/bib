      id: cal.1960-11-02.elections-1960-5
      when: Nov. 2
      date: '1960-11-02'
      thread: elections-1960
      c: 'Reston''s column in the *Times*: "Eisenhower is engaged in a rescue operation but it is very late in the game to
        reverse the forces now moving with Senator Kennedy."'
      n: '[[w.nixon-six-crises]], 359 (the column quoted). To check: James Reston''s column, *New York Times*, Nov. 2, 1960
        (cited by [[w.nixon-six-crises]], 359). Names: Reston, Eisenhower, Kennedy.'
      src:
        c: ee3c5c4d
