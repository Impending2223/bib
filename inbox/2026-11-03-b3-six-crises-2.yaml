- add:
    entry:
      id: cal.1960-10-29.elections-1960-2
      when: Oct. 29 or after
      date: '1960-10-29'
      thread: elections-1960
      c: 'Reston, by letter, to Henry Arnold of Philadelphia, a Nixon supporter who had written ten days before the election
        to complain of his coverage: "I''m afraid we differ about Korea, Radford, Nixon, Knowland, Bridges, etc. You like
        their policy, and I don''t."'
      n: '[[w.nixon-six-crises]], 397 (the letter quoted). To check: Reston to Henry Arnold (cited by [[w.nixon-six-crises]],
        397). Names: Reston, Radford, Nixon, Knowland, Bridges. Check: the day of the reply.'
      src:
        c: 1422682d
        rows:
        - 'w.nixon-six-crises 397: all'
        - 'via w.nixon-six-crises 397 n.text: all'
      tags:
      - name:reston-james
      - name:radford-arthur-w
      - name:nixon-richard-m
      - name:knowland-william-f
      - name:bridges-henry-s
- add:
    entry:
      id: cal.1960-11-09.elections-1960-12
      when: Nov. 9
      date: '1960-11-09'
      thread: elections-1960
      c: 'Los Angeles to Andrews, Md., in a chartered Pan American 707, after two hours'' delay. On the plane the reporters''
        note: "we have toured the land with a champ." At Andrews, late, in the rain: Morton, John Eisenhower for the President,
        Herter with the Cabinet members in Washington, several hundred supporters. Nixon, unprepared: "it is in defeat rather
        than victory that real friendship and loyal support is put to the test."'
      n: '[[w.nixon-six-crises]], 399–401 (the note and the remarks as the papers reported them, quoted). To check: the reporters''
        note, signed "Your Camp Followers" (cited by [[w.nixon-six-crises]], 400); the next morning''s papers (cited by [[w.nixon-six-crises]],
        401). See [[cal.1960-11-09.elections-1960]]. Names: Nixon, Morton, John Eisenhower, Herter.'
      src:
        c: c1a3a67a
        rows:
        - 'w.nixon-six-crises 399–401: all'
        - 'via w.nixon-six-crises 400 n.text: B'
        - 'via w.nixon-six-crises 401 n.text: D'
      tags:
      - name:nixon-richard-m
      - name:morton-thruston-b
      - name:eisenhower-john-s-d
      - name:herter-christian-a
- add:
    entry:
      id: cal.1960-11-17.elections-1960
      when: Nov. 17–19
      date: '1960-11-17'
      thread: elections-1960
      c: Nassau, three days, by Nixon's account, after two more days at Key Biscayne. Then back to Washington, the holiday
        cut short.
      n: '[[w.nixon-six-crises]], 410–11. See [[cal.1960-11-11.elections-1960]]. Names: Nixon. Check: the days; Nixon gives
        two more days in Florida after Nov. 14, then three in Nassau.'
      src:
        c: 4c3c4642
        rows:
        - 'w.nixon-six-crises 410–11: all'
      tags:
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-01-13.elections-1960
      when: Jan. 13
      date: '1961-01-13'
      thread: elections-1960
      c: 'Baltimore. Cardinal Cushing, in a speech, names Nixon "good will man of the year": "During the recent campaign .
        . . he never exploited the religious or any other issue that would tend to divide the American people."'
      n: '[[w.nixon-six-crises]], 421 (the speech quoted). To check: Cushing''s speech at Baltimore, Jan. 13, 1961 (cited
        by [[w.nixon-six-crises]], 421). Names: Cushing, Nixon.'
      src:
        c: f7db6c7a
        rows:
        - 'w.nixon-six-crises 421: all'
        - 'via w.nixon-six-crises 421 n.text: all'
      tags:
      - name:cushing-richard-g
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1961-01-21.republican-party
      when: Jan. 21
      date: '1961-01-21'
      thread: republican-party
      c: 'Nixon and his wife leave Washington for a month''s holiday: to Florida in the AVCO company''s plane, at Earl Blaik''s
        offer; then the Bahamas: Lindsey Hopkins''s house at Coral Harbour, Perkins McGuire''s at Eleuthera, Elmer Bobst''s
        yacht *Elisa V*; Rebozo with them. Restless, by his account, after about two weeks.'
      n: '[[w.nixon-six-crises]], 417–18, 423. Names: Nixon, Blaik, Rebozo. Check: the length of the stay.'
      src:
        c: dc76fa09
        rows:
        - 'w.nixon-six-crises 417–18, 423: all'
      tags:
      - name:nixon-richard-m
      - name:blaik-earl-h
      - name:rebozo-charles-g
- add:
    entry:
      id: cal.1961-02.republican-party-2
      when: Feb.
      date: 1961-02
      thread: republican-party
      also:
      - elections-1962
      c: 'Washington, back from the Bahamas, by Nixon''s account. He weighs his finances and the offers: Jack Dreyfus urges
        New York; others a foundation, a university, a corporation. He chooses California and the law: Adams, Duque & Hazeltine
        of Los Angeles, its senior partner Earl Adams.'
      n: '[[w.nixon-six-crises]], 423–24, 424 n.16. See [[cal.1961-02.elections-1962]]. Names: Nixon. Check: the day; Nixon
        back in California at the end of February (425).'
      src:
        c: 8d4b91bd
        rows:
        - 'w.nixon-six-crises 423–24: all'
        - 'w.nixon-six-crises 424 n.16: D'
      tags:
      - name:nixon-richard-m
