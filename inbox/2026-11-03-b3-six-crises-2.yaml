      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960
      c: 'Joseph Alsop''s column: "a surge toward the Democrats that may well be strong enough to produce a fairly dramatic
        vote on Election Day."'
      n: '[[w.nixon-six-crises]], 359 (the column quoted). To check: Joseph Alsop''s column, Oct. 24, 1960 (cited by [[w.nixon-six-crises]],
        359). Names: Alsop.'
      src:
        c: b7ddd1e4
        rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-f: all'
      tags:
      - name:alsop-joseph
