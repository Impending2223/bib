      when: Oct. 31
      date: '1960-10-31'
      thread: elections-1960
      c: 'Rowland Evans, *New York Herald Tribune*: "Kennedy''s private polls show an increasingly upward trend. Ohio, tipping
        toward the Senator at better than 52 to 48. California—moving his way."'
      n: '[[w.nixon-six-crises]], 359 (the report quoted). To check: *New York Herald Tribune*, Oct. 31, 1960 (cited by [[w.nixon-six-crises]],
        359). Names: Evans, Kennedy.'
      src:
