patch: b3-six-crises-2
by: 'Claude (batch 3 resumed, b3-1960: Richard M. Nixon, Six Crises)'
ops:
- add:
    entry:
      id: cal.1960-10-20.elections-1960
      when: Oct. 20
      date: '1960-10-20'
      thread: elections-1960
      c: 'NBC''s "Election Countdown." Leon Pearson: Kennedy leading in States with 326 electoral votes, 180 three weeks before;
        Nixon in States with 105, from 162.'
      n: '[[w.nixon-six-crises]], 359 (the broadcast quoted). To check: NBC, "Election Countdown," Oct. 20, 1960 (cited by
        [[w.nixon-six-crises]], 359). Names: Kennedy, Nixon.'
      src:
        c: 41f9424e
        rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-a: all'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-10-24.elections-1960-3
      when: Oct. 24
      date: '1960-10-24'
      thread: elections-1960
      c: 'The *New York Times*, on its study of polls and interviews with voters in 50 States: "the Kennedy tide, if unchecked,
        would be enough to elect him."'
      n: '[[w.nixon-six-crises]], 359 (the report quoted). To check: *New York Times*, Oct. 24, 1960 (cited by [[w.nixon-six-crises]],
        359). Names: Kennedy.'
      src:
        c: e67de5ab
        rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-e: all'
      tags:
      - name:kennedy-john-f
- add:
