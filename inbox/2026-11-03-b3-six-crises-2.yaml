      id: cal.1961-12-02.latin-america
      when: Dec. 2
      date: '1961-12-02'
      thread: latin-america
      c: 'Venezuela, two weeks before Kennedy''s arrival, by Nixon''s account: the government rounds up known Communists and
        left-wing agitators, shuts the Communist offices and several student organizations, suspends a newspaper.'
      n: '[[w.nixon-six-crises]], 223 n.3 (the newspaper "Clarion," as Nixon spells it). The visit: [[cal.1961-12-16.latin-america]].
        Names: Kennedy. Check: the day; Nixon gives "two weeks before his scheduled arrival."'
      src:
        c: c9a8a55b
        rows:
        - 'w.nixon-six-crises 223 n.3: all'
      tags:
      - name:kennedy-john-f
