    entry:
      id: cal.1960-10-25.elections-1960-7
      when: Oct. 25–Nov. 7
      date: '1960-10-25'
      thread: elections-1960
      c: '*Newsweek*: forty of fifty Washington correspondents and political writers predict Kennedy''s election, most by
        substantial margins; ten Nixon''s, most by narrow ones. Kennedy to carry 21 States with 278 electoral votes, Nixon
        159, 100 undecided. Ernest K. Lindley: "Kennedy will be elected by a substantial margin."'
      n: '[[w.nixon-six-crises]], 359 (the magazine quoted). To check: *Newsweek*, the issue (cited by [[w.nixon-six-crises]],
        359). Names: Kennedy, Nixon. Check: the issue; Nixon puts it in the two weeks before the election.'
      src:
        c: c67a7ee6
        rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-j: all'
      tags:
      - name:kennedy-john-f
      - name:nixon-richard-m
- add:
    entry:
      id: cal.1960-10-25.elections-1960-8
      when: Oct. 25–Nov. 7
      date: '1960-10-25'
      thread: elections-1960
      c: '*Time*: a two-to-one Kennedy margin in electoral votes; "the likeliest forecasts seem to run from a close Nixon
        victory to a Kennedy electoral landslide."'
      n: '[[w.nixon-six-crises]], 359–60 (the magazine quoted). To check: *Time*, the issue (cited by [[w.nixon-six-crises]],
        359). Names: Kennedy, Nixon. Check: the issue; Nixon puts it in the two weeks before the election.'
      src:
        c: cb21a4f3
