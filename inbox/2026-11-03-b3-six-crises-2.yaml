      date: '1960-10-25'
      thread: elections-1960
      c: '*U.S. News & World Report* predicts "Kennedy-Johnson, with electoral votes to spare."'
      n: '[[w.nixon-six-crises]], 359 (the forecast quoted). To check: *U.S. News & World Report*, the issue (cited by [[w.nixon-six-crises]],
        359). Names: Kennedy, Johnson. Check: the issue; Nixon puts it in the two weeks before the election.'
