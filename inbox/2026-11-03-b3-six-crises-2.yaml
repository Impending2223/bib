      c: Venezuela. Demonstrations from the announcement of Kennedy's visit, early in December; three policemen killed.
      n: '[[w.nixon-six-crises]], 223 n.3. The visit: [[cal.1961-12-16.latin-america]]. Names: Kennedy. Check: the days.'
