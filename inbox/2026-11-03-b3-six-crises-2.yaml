    entry:
      id: cal.1961-12.latin-america-peru
      when: Dec.
      date: 1961-12
      thread: latin-america-peru
      c: Two Peruvian students, former Communists by their own account, tell of the Communists' organization of the San Marcos
        riots against Nixon in 1958, and apologize to him publicly for their part.
      n: '[[w.nixon-six-crises]], 231 n.4. Names: Nixon. Check: the day and the place.'
      src:
        c: fb7f4bb9
        rows:
        - 'w.nixon-six-crises 231 n.4: all'
      tags:
      - name:nixon-richard-m
