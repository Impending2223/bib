        conference at Newport is of Aug. 1. To check: The Reminiscences of Meade Alcorn, June 5, 1967, Columbia University
        Oral History Collection (cited by [[w.kallina-kennedy-v-nixon]], 161 n.9); Excerpts from News Conference Held by Vice
