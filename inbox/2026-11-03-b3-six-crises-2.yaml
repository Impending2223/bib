      when: Nov. 7
      date: '1960-11-07'
      thread: elections-1960
      c: 'Election eve. Sam Lubell, the pollster: "Kennedy will win in an uneven sweep across the country."'
      n: '[[w.nixon-six-crises]], 359 (the forecast quoted). To check: Sam Lubell''s forecast, Nov. 7, 1960 (cited by [[w.nixon-six-crises]],
        359). Names: Kennedy. Check: where Lubell said it; Nixon names no paper or broadcast.'
      src:
        c: c5b3e725
        rows:
        - 'w.nixon-six-crises 359: all'
        - 'via w.nixon-six-crises 359 n.text-c: all'
      tags:
