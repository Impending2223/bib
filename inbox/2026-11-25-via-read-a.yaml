- check:
    id: cal.1962-06-10.missile-crisis
    text: 'Check: the protocol (I, 567–68) lists Gromyko, Malinovsky and the general staff among those present and has Rashidov''s report on the trip, "go for the decision," the draft resolution approved; not the hour, "Castro satisfied" or "unanimously." The editors (I, 1102 n.4) have twelve submarines, for patrol off the American coast, and nothing of a submarine base or of missiles in reserve.'
- check:
    id: cal.1962-08-22.missile-crisis
    text: 'Check: FRUS prints McCone''s "Proposed Plan of Action for Cuba," Aug. 21, attached to the memorandum of the meeting with the President of Aug. 23 (X, doc. 385): Cuba a possible location for MRBMs; at that meeting McCone, surface-to-air and 350-mile offensive missiles probably not to be told apart. FRUS has no record of a meeting of Aug. 22.'
