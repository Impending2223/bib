patch: 2026-11-25-via-read-a
by: agent
ops:
- primary:
    id: cal.1960-03-08.voting-rights
    text: '[106 Cong. Rec. 4933–34](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt4/pdf/GPO-CRECB-1960-pt4-6-1.pdf#page=105) (1960) (Mar. 8, 1960; Johnson on ending the round-the-clock sessions).'
    'on': Johnson ends the Senate's round-the-clock sessions, Mar. 8.
- primary:
    id: cal.1960-03-08.voting-rights
    text: '[106 Cong. Rec. 5118](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt4/pdf/GPO-CRECB-1960-pt4-8-1.pdf#page=37) (1960) (Mar. 10, 1960; the cloture vote, 42–53).'
    'on': 'Mar. 10: cloture on the Douglas–Javits motion refused, [42–53](https://voteview.com/rollcall/RS0860249).'
- primary:
    id: cal.1960-03-08.voting-rights
    text: '[106 Cong. Rec. 5181–82](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt4/pdf/GPO-CRECB-1960-pt4-8-1.pdf#page=100) (1960) (Mar. 10, 1960; the motion to table the Case amendment, 55–38).'
    'on': Case's amendment, letting the Attorney General sue to protect any civil right, tabled, [55–38](https://voteview.com/rollcall/RS0860250).
- primary:
    id: cal.1960-03-24.voting-rights
    text: '[106 Cong. Rec. 6452–55](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt5/pdf/GPO-CRECB-1960-pt5-8-1.pdf#page=28) (1960) (Mar. 24, 1960; the motion to refer, to report by Mar. 29; the vote, 86–5, 6455).'
    'on': The Senate sends it to Judiciary with orders to report by Mar. 29, [86–5](https://voteview.com/rollcall/RS0860261);
- primary:
    id: cal.1960-04-08.voting-rights
    text: '[106 Cong. Rec. 7810](https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt6/pdf/GPO-CRECB-1960-pt6-8-1.pdf#page=96) (1960) (Apr. 8, 1960; the vote, 71–18).'
    'on': Senate passes H.R. 8601 as amended, [71–18](https://voteview.com/rollcall/RS0860284), the Senators of nine southern States against.
- cite:
    id: cal.1960-10-15.soviet-union
    item: '[[w.prezidium-tsk-kpss-1954]], I, 445 (Nkrumah: no other path for Africa but socialism; nothing of Hammarskjöld)'
    'on': 'Of Nkrumah in New York: "there is no other path for Africa except socialism," but no vote against Hammarskjöld.'
- check:
    id: cal.1960-04-07.soviet-union
    text: 'Check: the protocol (I, 438) has the unsigned letter of Mar. 5 read at the session, Khrushchev, Suslov, Mikoyan and Ignatov speaking, on weak political-educational work among the command staff and "reports among officers," perhaps; the order to improve it and the system of reporting what the commanders say are Fursenko and Naftali''s (270).'
- cite:
    id: cal.1961-05.berlin-and-vienna
    item: '[[w.prezidium-tsk-kpss-1954]], I, 500 (Khrushchev reads out Ambassador Kroll''s message to Bonn)'
    'on': the Presidium also reads the West German Ambassador's correspondence with Bonn.
- check:
    id: cal.1961-05.berlin-and-vienna
    text: 'Check: the stenogram (I, 503) has Khrushchev on a memorandum presented to the French government on the German talks at the NATO session, setting out the views of four states, not all the members; "the papers France delivered to NATO" is Fursenko and Naftali''s (374).'
- check:
    id: cal.1962-07-01.berlin-and-vienna
    text: 'Check: the protocol (I, 569) lists Mikoyan among those present at the session of July 1; "Mikoyan absent" is Fursenko and Naftali''s (441).'
- check:
    id: cal.1962-11-16.soviet-union
    text: 'Check: the protocol (I, 646) heads the item "on the message of the U.S. President R. Kennedy on further steps on Cuba"; it names neither Castro''s letter to U Thant nor the order to fire, which are Fursenko and Naftali''s (306).'
- src:
    id: cal.1962-10-04.cuba
    row: https://www.intelligence.senate.gov/wp-content/uploads/2024/08/sites-default-files-94465.pdf#page=158
    'on': 'Mongoose meeting, Robert Kennedy in the chair: the President dissatisfied with the lack of sabotage;'
- src:
    id: cal.1960-05-20.vietnam-congress
    row: https://history.state.gov/historicaldocuments/frus1958-60v01/d166
    'on': 'Williams to Mansfield: the MAAG not doubled. ... which the ICC approved Apr. 19;'
- primary:
    id: cal.1961-06-13.cuba
    text: '[FRUS 1961–63, X, doc. 231](https://history.state.gov/historicaldocuments/frus1961-63v10/d231) (Memorandum No. 1 from the Cuba Study Group to the President, June 13, 1961).'
    'on': The Cuba Study Group reports.
- primary:
    id: cal.1960-10-14.vietnam
    text: '[FRUS 1958–60, I, doc. 202](https://history.state.gov/historicaldocuments/frus1958-60v01/d202) (the Acting Secretary of State to the Embassy, Oct. 7, 1960: the suggestions, removal of the Nhus and Tuyen first).'
    'on': 'Durbrow reads Diệm a paper of suggestions, cleared by State Oct. 7: send his brother Nhu and Trần Kim Tuyến abroad;'
- primary:
    id: cal.1960-10-14.vietnam
    text: '[FRUS 1958–60, I, doc. 205](https://history.state.gov/historicaldocuments/frus1958-60v01/d205) (Durbrow, Oct. 15, 1960: the memorandum read and handed to Diệm on the 14th, with the notes on the transfer of Nhu and Tuyến).'
    'on': 'Durbrow reads Diệm a paper of suggestions, cleared by State Oct. 7: send his brother Nhu and Trần Kim Tuyến abroad;'
- primary:
    id: cal.1960-10-14.vietnam
    text: '[FRUS 1958–60, I, doc. 205](https://history.state.gov/historicaldocuments/frus1958-60v01/d205) (the suggestion that the National Assembly be authorized to investigate any department).'
    'on': let the Assembly investigate officials.
