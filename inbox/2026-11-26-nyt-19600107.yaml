- add-words:
    id: cal.1960-01-06.congress
    after: end
    words: Brunsdale of North Dakota is sworn into the Senate, and Kyl of Iowa into the House. Rayburn, on his seventy-eighth birthday and the start of his sixteenth year as Speaker, brings down the gavel at noon, and the House spends much of its session on speeches for him.
