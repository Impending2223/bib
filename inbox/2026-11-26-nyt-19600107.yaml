      c: Judge Boyd Sloan of the Federal District Court, saying he is bound by previous decisions, rules for H. D. Coke, a Birmingham Negro insurance man, and orders an end to segregation by screens or otherwise at the Atlanta Airport restaurant. Hollowell, Coke's lawyer, will draw up an injunction; City Attorney Jack Savage says the city will decide next week whether to appeal.
