- add:
    entry:
      id: cal.1960-01-06.program-2
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: program
      c: Hagerty tells newsmen Eisenhower will deliver an abbreviated State of the Union message, under forty minutes against fifty to fifty-five for the full text, which will be read in the Senate and House after he leaves the Capitol. It is the first "short-form" message, he says; Eisenhower's health had nothing to do with it. White House sources say it will deal more with world matters than domestic, urging the non-Communist nations to pool resources for underdeveloped lands, and will call for a balanced budget.
      n: 'Felix Belair Jr., "President Gives Message Today," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Hagerty, Eisenhower.'
      tags:
      - name:hagerty-james-c
      - name:eisenhower-dwight-d
      follows:
