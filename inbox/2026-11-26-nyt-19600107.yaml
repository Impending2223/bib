      - democratic-party
      c: Senator Lausche says he will fight Gov. DiSalle's plan to commit Ohio's sixty-four Democratic convention votes to Kennedy by running in the May 3 primary as a favorite son pledged to him, calling it undemocratic and with "no sense of democracy." He may enter a slate of delegates committed to himself, depending on whether he can line one up before the Feb. 3 filing deadline; he has not said whom he supports, and is widely assumed to favor Johnson.
      n: '"Lausche Opposes Plan on Kennedy," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Lausche, DiSalle, Kennedy, Johnson.'
      tags:
