      c: Rayburn, at a news conference, says a House majority for a civil rights bill has only to sign a petition to discharge the Rules Committee from the bill the Judiciary Committee approved in 1959; 219 signatures are needed. He has never signed one and does not advocate it. He expects no tax cut, a minimum wage between $1.10 and $1.25, and "farm legislation of some sort," and pledges to cooperate with Eisenhower "on everything he advocates that we think is right."
      n: 'John D. Morris, "Democrats Seek to Force Action on Civil Rights Bill," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 14. Russell Baker, "Congress Chiefs Emphasize Amity as Session Opens," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 13. Names: Rayburn, Eisenhower.'
      tags:
      - name:rayburn-sam
      - name:eisenhower-dwight-d
