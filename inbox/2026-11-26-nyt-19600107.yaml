- add:
    entry:
      id: cal.1960-01-06.japan-and-korea-far-east
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: japan-and-korea-far-east
      also:
      - vietnam
      c: Diplomatic sources tell the *Times* that Eisenhower is considering visits to Japan, Korea, Taiwan and the Philippines on his way home from Moscow next June, flying eastward across Siberia. Hagerty knows of no such plans; papers are circulating in the Government on countries that might be on a Far Eastern itinerary. South Vietnam and Thailand have also been mentioned, and Kishi is expected to raise a visit when he comes to Washington this month to sign the revised security treaty.
      n: 'E. W. Kenworthy, "President Weighs Stops in Far East After Soviet Trip," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. Names: Eisenhower, Hagerty, Kishi.'
      tags:
      - name:eisenhower-dwight-d
      - name:hagerty-james-c
      - name:kishi-nobusuke
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-france
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: europe-and-the-alliance-france
      c: White House announces that De Gaulle will arrive in Washington Apr. 22 after a visit to Canada, and will be Eisenhower's guest until Apr. 25. He will spend a day in New York and three more days "in other cities." The talks are assumed to be at Camp David; French and U.S. officials say the plans beyond Washington and New York are not firm.
      n: 'William J. Jorden, "De Gaulle to Visit U.S. Late in April," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. Names: De Gaulle, Eisenhower.'
      tags:
      - name:de-gaulle-charles
      - name:eisenhower-dwight-d
