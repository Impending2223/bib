      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: immigration
      c: Walter introduces a bill in the House to authorize the expulsion or deportation of any alien convicted of illegal possession of marijuana. He cites two recent Federal District Court cases in Southern California that he says "involved Mexican marijuana peddlers"; the Ninth Circuit, he says, "completely misconstrued the law" in letting the two aliens remain.
      n: '"Marijuana Bill Filed," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 13. "Washington Proceedings," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 13. Names: Walter.'
