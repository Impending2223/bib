    entry:
      id: cal.1960-01-06.crime-and-hijacking-14
      when: Jan. 6
      date: '1960-01-06'
      place: mamaroneck-ny
      thread: crime-and-hijacking
      c: Vandals paint four large swastikas in black enamel on the walls and windows of the Westchester Jewish Center, Mamaroneck, N.Y., and leave a cardboard sign about "certain business practices" and "unchallenged" agents who "seek to devalue our currency." Rabbi Irving Koslowe, head of the congregation, says teen-agers might be responsible; Police Chief Jerry Geary calls it the work of a "nut."
      n: '"City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
