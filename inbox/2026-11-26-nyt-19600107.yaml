      when: Jan. 6
      date: '1960-01-06'
      place: albany
      thread: elections-1960-nixon
      also:
      - elections-1960-rockefeller
      - republican-party
      c: 'Senator Mahoney, Republican leader of the New York Senate, endorses Nixon for the Republican nomination, "absolutely," as "the only candidate we have and a good one." Asked whether he would steer clear of Nixon as Rockefeller appears to, he says: "I would never ignore the next President of the United States." He then adds that he speaks "as of today."'
      n: 'Warren Weaver Jr., "Nixon Is Endorsed by Mahoney, But Senator Adds, ''As of Today''," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 14. Names: Nixon, Rockefeller.'
      tags:
      - name:nixon-richard-m
      - name:rockefeller-nelson
