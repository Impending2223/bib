      when: Jan. 6
      date: '1960-01-06'
      place: hamburg
      thread: europe-and-the-alliance-federal-republic
      c: Max Brauer, Socialist Lord Mayor of Hamburg, calls the Government's proposed amendment against anti-Semitism inadequate, the first reaction to it.
      n: Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2.
      tags:
      - polity:frg
      follows:
      - cal.1960-01-06.europe-and-the-alliance-federal-republic
