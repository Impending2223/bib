- add:
    entry:
      id: cal.1960-01-06.latin-america-trip
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: latin-america-trip
      c: 'White House announces Eisenhower''s ten-day trip to Brazil, Argentina, Chile and Uruguay, with Mrs. Eisenhower: Brazil Feb. 23–26, Argentina Feb. 26–29, Chile Feb. 29–Mar. 2, Uruguay Mar. 2–3, with stops at Ramey Air Force Base, Puerto Rico. Milton Eisenhower, Herter, Rubottom and five members of the National Advisory Committee on Inter-American Affairs will go. The trip is to "publicly reflect" his "deep interest in all the countries of the New World."'
      n: 'E. W. Kenworthy, "President Weighs Stops in Far East After Soviet Trip," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. "Washington Proceedings," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 13. Names: Dwight D. Eisenhower, Milton Eisenhower, Herter, Rubottom.'
      tags:
      - name:eisenhower-dwight-d
      - name:eisenhower-milton-s
      - name:herter-christian-a
      - name:rubottom-roy-r-jr
- add:
    entry:
      id: cal.1960-01-06.latin-america-peru
      when: By Jan. 6
      date: '1960-01-06'
      place: washington
      thread: latin-america-peru
      c: Peru's Government is understood to have called in the U.S. Ambassador, Achilles, to express disappointment that Peru is not on Eisenhower's itinerary. Officials say Peru was ruled out because a visit would require one to Ecuador, whose capital, Quito, stands at 9,300 feet; Eisenhower has had to avoid such heights since his heart attack in 1955. Officials give no support to speculation that Nixon's reception at Lima in 1958 was the reason, but concede that the mob attack on his motorcade at Caracas was the main reason Venezuela is left out.
      n: 'E. W. Kenworthy, "President Scans Trip to Far East," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. Check: the day. Names: Achilles, Nixon.'
      tags:
      - name:achilles-theodore-c
      - name:nixon-richard-m
