      c: Aiken of Vermont and Capehart of Indiana, Republican Senators who made separate trips to Latin America during the congressional recess, say Eisenhower's trip will improve relations with Latin America and predict he will be warmly received.
      n: 'E. W. Kenworthy, "President Scans Trip to Far East," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. Names: Aiken, Capehart.'
      tags:
      - name:aiken-george-d
      - name:capehart-homer-e
