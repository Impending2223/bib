      c: Johnson calls on Senate committee chairmen to give up the usual leisurely pace of the winter months and put their machinery at full speed, and says the Senate will keep longer hours than usual at the start of a session. He and Rayburn say they want to end the session before the Democratic convention opens in Los Angeles July 11, and oppose continuing it after the conventions.
