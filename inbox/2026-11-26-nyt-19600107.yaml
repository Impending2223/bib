      when: By Jan. 6
      date: '1960-01-06'
      place: bonn
      thread: europe-and-the-alliance-federal-republic
      c: Karl Marx, editor of the German Jewish weekly, blames the Adenauer Government for having sought "too many compromises" in dealing with the revival of Nazism, and calls for greater efforts to combat the spread of anti-Semitism.
      n: 'Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day. Names: Adenauer.'
      tags:
      - name:adenauer-konrad
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic-5
      when: By Jan. 6
      date: '1960-01-06'
      place: bonn
      thread: europe-and-the-alliance-federal-republic
      c: Van Damm, secretary general of the Central Council of Jews in Germany, calls for "more fighting activity against the powers of destruction."
      n: 'Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic-6
      when: Jan. 6
      date: '1960-01-06'
      place: berlin
      thread: europe-and-the-alliance-federal-republic
      c: The governing board of West Berlin's Free University announces that proceedings have started to expel four neo-Nazi students who took part in the illegal torchlight demonstration last Saturday.
      n: Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2.
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic-7
      when: Jan. 6
      date: '1960-01-06'
      place: berlin
      thread: europe-and-the-alliance-federal-republic
      also:
      - berlin-and-vienna
      c: The West Berlin Justice Department asks the Allied powers for permission to apply an Allied Control Council law banning Nazi activity against seventeen youths arrested the day before on charges of neo-Nazi activity, so that the participants in a Nazi-style torchlight parade can be tried if West German laws prove inapplicable.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2.'
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking
      when: By Jan. 6
      date: '1960-01-06'
      place: kiel
      thread: crime-and-hijacking
      c: Swastikas and anti-Semitic slogans are daubed on automobiles and houses in several places in Kiel, the police say.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-2
      when: By Jan. 6
      date: '1960-01-06'
      thread: crime-and-hijacking
      c: Three youths are arrested in Bavaria for neo-Nazi vandalism. Seidel, Minister-President of Bavaria, says twelve cases of vandalism have occurred in the state since Christmas.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-3
      when: By Jan. 6
      date: '1960-01-06'
      thread: crime-and-hijacking
      c: In St. Wendel, in the Saar, a 19-year-old youth is arrested while trying to smear swastikas on a wall.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-4
      when: By Jan. 6
      date: '1960-01-06'
      thread: crime-and-hijacking
      c: The police open investigations in four French cities after swastikas and anti-Semitic slogans are daubed on walls and on the homes of Jews, according to Reuters dispatches.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:fr
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-5
      when: By Jan. 6
      date: '1960-01-06'
      thread: crime-and-hijacking
      c: Three big swastikas are smeared on the royal telegraph station at the summer residence of King Frederik of Denmark at Graasten, and a sports club building at Soenderborg is also smeared.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:denmark
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-6
      when: By Jan. 6
      date: '1960-01-06'
      place: brussels
      thread: crime-and-hijacking
      c: In Brussels, the star of David is painted on the walls of two cafes reported to be the haunts of wartime Nazi collaborators.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:belgium
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-7
      when: By Jan. 6
      date: '1960-01-06'
      place: milan
      thread: crime-and-hijacking
      c: In Milan, the police arrest twenty young members of the extreme Right-wing New European Order and confiscate masses of Nazi literature and uniforms.
      n: '"Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:italy
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-8
      when: Jan. 6
      date: '1960-01-06'
      place: vienna
      thread: crime-and-hijacking
      c: Reports from four Austrian communities say swastikas and slogans have appeared on churches, public buildings and homes.
      n: '"New Incidents in Austria," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2.'
      tags:
      - polity:austria
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-9
      when: By Jan. 6
      date: '1960-01-06'
      place: buenos-aires
      thread: crime-and-hijacking
      c: Swastikas and scribbled inscriptions such as "Death to Jews" and "Jews get out" appear in Argentina.
      n: '"Argentina Reports Swastikas," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:argentina
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-10
      when: Jan. 6
      date: '1960-01-06'
      place: bogota
      thread: crime-and-hijacking
      c: A synagogue and two buildings in a fashionable Bogotá district are painted with swastikas.
      n: '"Swastikas in Colombia," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2.'
      tags:
      - polity:colombia
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic-8
      when: Jan. 6
      date: '1960-01-06'
      place: geneva
      thread: europe-and-the-alliance-federal-republic
      c: The World Council of Churches denounces "mischievous anti-Semitic propaganda" in a statement from its Geneva headquarters, signed by Franklin Clark Fry, chairman of its central committee, and Visser 't Hooft, general secretary. It hopes "this dangerous recrudescence of anti-Semitism may be suppressed from the outset" and expresses "deep sympathy with the Jewish people." Fry says he believes the outbreak is "a passing phase."
      n: '"World Church Unit Denounces Bigotry," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 4.'
- add:
    entry:
      id: cal.1960-01-06.soviet-union-8
      when: Jan. 6
      date: '1960-01-06'
      place: moscow
      thread: soviet-union
      c: The Soviet press takes notice of anti-Semitic incidents in West Germany but is silent about their echoes in other Western countries. Several newspapers carry short items headed "The rats are crawling from their nests"; *Pravda* says reprisals by Bonn against "progressive" Germans are going hand in hand with increasing anti-Semitism.
      n: '"Soviet Notes Bigotry," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:ussr
      - polity:frg
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-11
      when: Jan. 6
      date: '1960-01-06'
      place: flat-rock-nc
      thread: crime-and-hijacking
      c: 'Carl Sandburg, in a birthday interview at his Flat Rock home on his 82nd birthday, says he is opposed to capital punishment but favors the death sentence for any man caught painting a swastika on a synagogue: "The swastika stands not for the murder of an individual or a few individuals, but for the death of a race. It is the symbol of race murder."'
      n: '"Sandburg Favors Death For Swastika Painters," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - state:nc
- add:
    entry:
      id: cal.1960-01-06.states-and-cities
      when: Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: states-and-cities
      also:
      - crime-and-hijacking
      c: A resolution is introduced in the New York City Council calling on the Police Department to mobilize all available security forces, including Transit Authority policemen, police cadets and auxiliaries, to guard the city's 3,364 churches and synagogues against "Nazi-like desecration and defilement." Sharkey, majority leader, is chief sponsor, with Ross of the Bronx and Weiss of Manhattan; it is referred to the General Welfare Committee, for expected action Tuesday.
      n: 'Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Sharkey.'
      tags:
      - name:sharkey
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1960-01-06.states-and-cities-2
      when: Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: states-and-cities
      c: The city's Commission on Intergroup Relations, in a statement by its chairman, Marrow, calls on the schools, the police, the courts, churches and parents to help correct bias in the city. It says it has known "for some time" that anti-Semitic attitudes were growing more antagonistic, and will expand its work in neighborhoods where defacement has occurred.
      n: Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
      tags:
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1960-01-06.states-and-cities-3
      when: By Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: states-and-cities
      c: Mayor Wagner denounces the swastika daubing as shameful and un-American after a swastika on a wall of Temple Emanu-El and three similar incidents in Queens, directs Police Commissioner Kennedy to investigate, and instructs the Commission on Intergroup Relations to inquire and report to him.
      n: 'Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day. Names: Wagner.'
      tags:
      - name:wagner-robert-f-jr
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1960-01-06.states-and-cities-4
      when: By Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: states-and-cities
      c: 'Cardinal Spellman, on his return from his Christmastide visit to U.S. troops overseas, denounces the current wave of anti-Semitism as "deplorable": "it should be condemned by every decent citizen and right-thinking individual."'
      n: 'Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day. Names: Spellman.'
      tags:
      - name:spellman-francis
      - city:nyc
- add:
    entry:
      id: cal.1960-01-06.crime-and-hijacking-12
      when: Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: crime-and-hijacking
      c: Four 12-year-old boys are arrested as juvenile delinquents and charged with malicious mischief in the destruction of eighty window panes at the Rush Temple African Methodist Episcopal Zion Church, Jamaica, Queens; they admit using the church for target practice and are released to their parents.
      n: Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
      tags:
      - city:nyc
      - state:ny
- add:
    entry:
      id: cal.1960-01-06.civil-rights-organizations
      when: By Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: civil-rights-organizations
      c: 'The National Council of Christians and Jews issues an appeal to all Americans to repudiate the anti-Jewish manifestations as "the work of minds that are making religion a target." Its president, Lewis Webster Jones, makes the appeal public: "We call on all Americans to repudiate the Nazi-inspired acts of terrorism and hate."'
      n: 'Charles G. Bennett, "City Action Urged to Combat Bigots," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day.'
