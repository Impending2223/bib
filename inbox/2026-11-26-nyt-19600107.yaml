      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: defense
      also:
      - congress
      c: 'Gates makes public his memorandum, issued the week before, asking the Joint Chiefs to keep him "promptly" informed of "any issue on which a difference of opinion is developing." He tells newsmen he will sit with the Chiefs in formal session rather than wait for their differences to reach him through the chairman, and will advise Eisenhower where they cannot agree. Asked about Taylor''s criticisms, he says: "I guess I am not as wise as General Taylor."'
      n: 'Jack Raymond, "Gates Acts to Nip Policy Disputes of Joint Chiefs," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 6. Names: Gates, Taylor, Eisenhower.'
      tags:
      - name:gates-thomas-s-jr
      - name:taylor-maxwell
      - name:eisenhower-dwight-d
      follows:
      - cal.1960-01-06.defense-3
- add:
    entry:
      id: cal.1960-01-06.defense-2
      when: By Jan. 6
      date: '1960-01-06'
      place: norfolk-va
      thread: defense
      c: Gates returns from a two-day meeting at Atlantic Fleet headquarters, Norfolk, with the Joint Chiefs, the service secretaries and field commanders from all over the world, where the question of the chiefs' differences arose.
      n: 'Jack Raymond, "Gates Acts to Nip Policy Disputes of Joint Chiefs," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 6. Check: the days. Names: Gates.'
      tags:
      - name:gates-thomas-s-jr
- add:
    entry:
      id: cal.1960-01-06.defense-3
      when: Jan. 6
      date: '1960-01-06'
      place: nyc
      thread: defense
      c: Taylor, the retired Army Chief of Staff, criticizes the state of U.S. defense in New York; the charge that most provokes Gates is that the Soviet Union is two years ahead in long-range ballistic missiles. His book, *The Uncertain Trumpet*, goes on sale; it asks an end to the Joint Chiefs, to be replaced by a single chief, and says that from 1955 to 1959 the Chiefs sent the Secretary of Defense at least twenty-three split papers.
      n: 'Jack Raymond, "Gates Acts to Nip Policy Disputes of Joint Chiefs," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 6. Names: Taylor, Gates.'
      tags:
      - name:taylor-maxwell
      - name:gates-thomas-s-jr
      - city:nyc
- add:
    entry:
      id: cal.1960-01-06.defense-4
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: defense
      also:
      - congress
      c: Bush, Republican of Connecticut and a member of the Armed Services Committee, says the country's defenses are "impregnable" and must stay so until "an effective, controlled disarmament is negotiated."
      n: 'Jack Raymond, "Gates Acts to Nip Policy Disputes of Joint Chiefs," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1. Names: Bush.'
      tags:
      - name:bush-prescott-s
      - state:ct
- add:
    entry:
      id: cal.1960-01-06.defense-5
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: defense
      also:
      - congress
      c: Dodd, Democrat of Connecticut and a member of the Appropriations and Aeronautical and Space Sciences Committees, says the proposed defense budget "fails to make needed increases" for military programs.
      n: 'Jack Raymond, "Gates Acts to Nip Policy Disputes of Joint Chiefs," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1. Names: Dodd.'
      tags:
      - name:dodd-thomas-j
      - state:ct
- add:
    entry:
      id: cal.1960-01-06.cuba
      when: Jan. 6
      date: '1960-01-06'
      place: havana
      thread: cuba
      also:
      - latin-america
      c: Cuba takes over under the Agrarian Reform Law about 70,000 acres of farm and pasture land of the U.S.-owned Manatí Sugar Company on the north coast of Oriente Province. The company also has extensive cane lands subject to seizure under the law after the present crop is harvested.
      n: '"Cuba Seizes U. S.-Owned Land," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:cuba
- add:
    entry:
      id: cal.1960-01-06.cuba-2
      when: Jan. 6
      date: '1960-01-06'
      place: havana
      thread: cuba
      c: 'Castro''s Education Ministry announces that Cuban high school boys and girls must learn to bear arms: a military-training program, with army officers instructing the physical-education teachers, to support the new People''s Militia. The first university student brigade, of about 400 men and women, is finishing field exercises in the Sierra Maestra; Castro is to preside at the graduation.'
      n: '"Cuban High Schools Get Army Program," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Castro.'
      tags:
      - name:castro-fidel
- add:
    entry:
      id: cal.1960-01-06.cuba-3
      when: Jan. 6
      date: '1960-01-06'
      place: havana
      thread: cuba
      c: The Cuban Government pardons about 1,200 common prisoners for Epiphany.
      n: '"Cuban High Schools Get Army Program," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
- add:
    entry:
      id: cal.1960-01-06.cuba-4
      when: By Jan. 6
      date: '1960-01-06'
      place: havana
      thread: cuba
      c: About 300 Cuban Navy men are detained in a clean-up operation, "usually well informed sources" say. The press bureau of the Ministry of Armed Forces says it has no information.
      n: '"Cuban High Schools Get Army Program," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day.'
- add:
    entry:
      id: cal.1960-01-06.trade
      when: Jan. 6
      date: '1960-01-06'
      place: new-delhi
      thread: trade
      also:
      - south-asia
      c: McNally, assistant director in the Department of Commerce, tells a press conference that the U.S. trade mission, arrived for a six-week tour, finds that India's recent measures have created a favorable climate for American private investment and trade. It is the fourth such mission the U.S. Government has sponsored; the U.S. accounts for nearly 21 percent of India's foreign trade.
      n: '"U. S. Mission Hails Indian Trade Moves," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
- add:
    entry:
      id: cal.1960-01-06.middle-east
      when: Jan. 6
      date: '1960-01-06'
      place: jerusalem
      thread: middle-east
      also:
      - soviet-union
      c: Ben-Gurion tells the Knesset that arms deliveries from the Soviet Union to the United Arab Republic and Iraq are still flowing despite Khrushchev's disarmament appeal at the United Nations.
      n: '"Soviet Aid to Arabs Seen," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Ben-Gurion, Khrushchev.'
      tags:
      - name:ben-gurion-david
      - name:khrushchev-nikita-s
- add:
    entry:
      id: cal.1960-01-06.testing
      when: Jan. 6
      date: '1960-01-06'
      place: london
      thread: testing
      also:
      - europe-and-the-alliance-britain
      c: Fifty-eight prominent Britons sign an appeal to the United States to renew its suspension of nuclear weapons testing. The Campaign for Nuclear Disarmament, which issues it, calls Washington's decision not to renew the suspension a setback to the progress of 1959 and a threat to hopes for advance toward disarmament.
      n: '"Britons in Plea to U. S.," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
- add:
    entry:
      id: cal.1960-01-06.canada
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: canada
      also:
      - trade
      - european-community
      c: U.S. and Canadian officials end high-level talks on trade and tariff policies in Washington, in preparation for the thirteen-nation economic conference in Paris next week. Canada's Finance Minister, Fleming, and Trade and Commerce Minister, Churchill, lead their delegation; Treasury Secretary Anderson and Under Secretary of State Dillon the U.S. side. Both governments are reported ready to take a unified stand against discrimination by the Common Market or the Outer Seven; no firm decisions are reached.
      n: '"U. S. and Canada End Trade-Bloc Talks," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Anderson, Dillon.'
      tags:
      - name:anderson-robert-b
      - name:dillon-c-douglas
- add:
    entry:
      id: cal.1960-01-06.soviet-union-2
      when: Jan. 6
      date: '1960-01-06'
      place:
      - belgrade
      - moscow
      thread: soviet-union
      c: Vukmanović-Tempo, Politburo member of the Yugoslav Communist party and chairman of the Yugoslav Trade Union Federation, flies to Moscow in a special plane with his wife and two sons, on what he calls a combination holiday-business trip. He says he hopes to talk with Soviet trade union and political leaders, Khrushchev if possible; the invitation was extended last summer by Grishin of the Soviet Central Trades Union Council. It is the first visit to Moscow by a top-ranking Yugoslav since early 1958.
      n: 'Paul Underwood, "Yugoslav Leader Visiting Moscow," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Khrushchev, Grishin.'
      tags:
      - name:khrushchev-nikita-s
      - name:grishin
- add:
    entry:
      id: cal.1960-01-06.soviet-union-3
      when: Jan. 6
      date: '1960-01-06'
      place: belgrade
      thread: soviet-union
      also:
      - europe-and-the-alliance-britain
      c: The Yugoslav Government denies London press reports that Gen. Jan Frey-Bielecki, chief of the Polish Air Force, has fled to Yugoslavia. The reports were linked with Warsaw's expulsion last month of the Yugoslav military attaché, Col. Nikola Pejnovic, and his assistant, Maj. Svetozar Pazin.
      n: '"Belgrade Denies Pole Fled," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:poland
- add:
    entry:
      id: cal.1960-01-06.soviet-union-4
      when: Jan. 6
      date: '1960-01-06'
      place: warsaw
      thread: soviet-union
      c: '*Trybuna Ludu*, the Polish Communist party newspaper, accuses Stefan Cardinal Wyszyński, Primate of Poland, of "conscience" in opposing birth control and abortion, and of "tolerating the theft of state property." It says his criticism of the 1956 law legalizing abortions under certain conditions contradicts "the elementary foundations of legality."'
      n: '"Wyszynski Scored Over Birth Control," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Wyszyński.'
      tags:
      - name:wyszynski-stefan-cardinal
      - polity:poland
- add:
    entry:
      id: cal.1960-01-06.soviet-union-5
      when: Jan. 6
      date: '1960-01-06'
      place: rome
      thread: soviet-union
      also:
      - europe-and-the-alliance
      c: Italy's President, Gronchi, with an inflamed throat and a touch of fever, postpones his five-day official visit to the Soviet Union, due to begin tomorrow by air with Foreign Minister Pella and fifteen officials. The postponement is expected to be brief; the visit may take place at the end of the month or early in February.
      n: '"Gronchi, Ailing, Defers Visit to Soviet Union," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Names: Gronchi.'
      tags:
      - name:gronchi-giovanni
- add:
    entry:
      id: cal.1960-01-06.soviet-union-6
      when: By Jan. 6
      date: '1960-01-06'
      place: rome
      thread: soviet-union
      c: The Continentale news agency reports widespread arrests of Jews in Rumania, accused of "illegal Zionist activities," particularly in Cluj, Bucharest and Iassy. Twenty-five men accused of "Zionist espionage" are to go on trial soon, the agency says, and several Rumanian rabbis loyal to the Communist regime have denounced Zionism as "a manifestation of imperialism."
      n: '"Jews'' Arrest Reported," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 2. Check: the day.'
      tags:
      - polity:romania
- add:
    entry:
      id: cal.1960-01-06.soviet-union-7
      when: Jan. 6
      date: '1960-01-06'
      place: moscow
      thread: soviet-union
      also:
      - south-asia
      - indonesia
      c: India's Ambassador, Menon, hands Khrushchev an invitation to visit India on his way to Indonesia next month. Khrushchev says he hopes to take advantage of it, and expresses warm thanks, Tass reports. A meeting with Nehru would let the two discuss India's border dispute with Communist China.
      n: '"India Invites Russian," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Khrushchev, Nehru.'
      tags:
      - name:khrushchev-nikita-s
      - name:nehru-jawaharlal
- add:
    entry:
      id: cal.1960-01-06.soviet-union-leadership
      when: Jan. 6
      date: '1960-01-06'
      place: moscow
      thread: soviet-union-leadership
      c: '*Pravda* lashes out at agricultural shortcomings in the Stavropol region, where Bulganin has headed the Economic Council since his ouster from the Premiership: it delivered only 172,000 of 230,000 tons of meat scheduled by Dec. 20.'
      n: '"Bulganin Area Scored," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
- add:
    entry:
      id: cal.1960-01-06.canada-2
      when: Jan. 6
      date: '1960-01-06'
      place: quebec
      thread: canada
      c: 'Leaders of the National Union, Quebec''s governing party, meet to choose a provincial Premier to succeed Sauvé, who died Saturday. Four candidates are in the running: Prévost, Provincial Secretary; Rivard, Attorney General; Barrette, Minister of Labor; and Johnson, Minister of Hydraulic Resources. The party appears split; a decision is expected tomorrow.'
      n: Raymond Daniell, "Quebec Leaders Seek a Premier," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
- add:
    entry:
      id: cal.1960-01-06.cyprus
      when: Jan. 6
      date: '1960-01-06'
      place: london
      thread: cyprus
      also:
      - europe-and-the-alliance-britain
      c: Britain announces that a conference on Cyprus will begin in London Jan. 16 to conclude the agreements for independence by Feb. 19, the planned date. Makarios, President-elect, and Kutchuk, Vice-President-elect, will attend; Greece and Turkey will be represented by their Foreign Ministers, Averoff-Tossizza and Zorlu, Britain by Selwyn Lloyd. It is to settle a treaty of guarantee, a treaty of common defense, and the limits of two British bases, at Akrotiri and Dhekelia.
      n: 'Lawrence Fellows, "Cyprus Talks Set in London Jan. 16," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Makarios, Kutchuk, Lloyd.'
      tags:
      - name:makarios-iii
      - name:kutchuk-fazil
      - name:lloyd-selwyn
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-france-2
      when: Jan. 6
      date: '1960-01-06'
      place: paris
      thread: europe-and-the-alliance-france
      also:
      - economy-franc
      c: The removal of Finance Minister Pinay from the Cabinet is reliably reported to be under consideration. His conflict with De Gaulle and Premier Debré has reached an acute stage; he disagrees with them on government controls over the economy, on budgetary spending and on De Gaulle's attitude to the Atlantic alliance and European unity. Baumgartner, Governor of the Bank of France, is put forward as a successor; the Cabinet meeting next week is thought the likely occasion.
      n: 'Henry Giniger, "France Is Reported Considering Pinay''s Removal From Cabinet," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 4. Names: De Gaulle, Debré.'
      tags:
      - name:de-gaulle-charles
      - name:debre-michel
- add:
    entry:
      id: cal.1960-01-06.africa-algeria-morocco
      when: Jan. 6
      date: '1960-01-06'
      place: rabat
      thread: africa-algeria-morocco
      also:
      - europe-and-the-alliance-france
      c: French quarters in Rabat object to the new U.S.–Moroccan agreement on the Voice of America relay station in Tangier, which bars its use by third parties and ends France's right to three hours a day of broadcasts; France was not told of U.S. intentions during the talks, they say. An authoritative Moroccan source says there are "no plans" to use the station for Morocco's position on Algeria or Mauritania.
      n: Thomas F. Brady, "France Opposes U. S. Radio Accord," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
      tags:
      - polity:fr
      - polity:morocco
- add:
    entry:
      id: cal.1960-01-06.africa-algeria-morocco-2
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: africa-algeria-morocco
      also:
      - europe-and-the-alliance-france
      c: State Department officials say France has made no formal protest against the U.S.–Moroccan agreement on the Voice of America station at Tangier, but has made inquiries about it before, during and after the negotiations.
      n: Thomas F. Brady, "France Opposes U. S. Radio Accord," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance
      when: Jan. 6
      date: '1960-01-06'
      place: madrid
      thread: europe-and-the-alliance
      c: Franco names Pilar Primo de Rivera, head of the Falange's women's section and daughter of the late dictator Miguel Primo de Rivera, Countess of Castillo de la Mota, an official bulletin announces.
      n: '"Falangist Leader Named Countess," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:spain
- add:
    entry:
      id: cal.1960-01-06.middle-east-2
      when: Jan. 6
      date: '1960-01-06'
      place: baghdad
      thread: middle-east
      c: Hundreds of thousands march for more than six hours through Baghdad in Army Day celebrations, which coincide with the restoration of party political life; Communists join other organizations. Premier Kassim, on a platform outside the Defense Ministry, receives an ovation. Parties must be licensed by the Interior Minister and may not be run on military lines, under the associations law he issued last week-end.
      n: '"Iraqis Greet Finish of Curb on Politics," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:iraq
- add:
    entry:
      id: cal.1960-01-06.middle-east-3
      when: Jan. 6
      date: '1960-01-06'
      place: tel-aviv
      thread: middle-east
      c: 'An Israeli military spokesman denies a report from Amman that two Israeli jet planes had penetrated twenty-five miles into Jordanian territory and been chased by a Jordanian fighter: "There is no truth in the Jordanian report."'
      n: '"Israel Denies Air Intrusion," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:israel
      - polity:jordan
- add:
    entry:
      id: cal.1960-01-06.defense-6
      when: Jan. 6
      date: '1960-01-06'
      place: cape-canaveral
      thread: defense
      c: 'An Atlas intercontinental ballistic missile is fired tonight from Cape Canaveral, Fla., in a test flight aimed at a target 5,500 miles away: the first launching there in two weeks. The Dec. 18 firing flew the full 6,325-mile range, the fourteenth straight success since July.'
      n: '"Atlas Test Resumed," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - state:fl
      time_range:
      - 1960-01-07T03:00Z
      - 1960-01-07T05:00Z
      time_band: night
      time_zone: America/New_York
      range_basis: record
- add:
    entry:
      id: cal.1960-01-06.africa
      when: Jan. 6
      date: '1960-01-06'
      place: accra
      thread: africa
      also:
      - europe-and-the-alliance-britain
      c: Macmillan, on the first day of his African tour, is received by Nkrumah at Accra with a guard of honor and a restrained welcome from Ghanaian crowds. Nkrumah hopes the tour will strengthen relations between Ghana and Britain and between Africa and the world; Macmillan says he has come "to see and learn." The procession avoids downtown Accra.
      n: 'Homer Bigart, "Macmillan Finds Ghana Friendly," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Macmillan, Nkrumah.'
      tags:
      - name:macmillan-harold
      - name:nkrumah-kwame
      time_range:
      - 1960-01-06T06:00Z
      - 1960-01-06T12:00Z
      time_band: morning
      time_zone: Africa/Accra
      range_basis: record
- add:
    entry:
      id: cal.1960-01-06.africa-2
      when: Jan. 6
      date: '1960-01-06'
      place: accra
      thread: africa
      also:
      - europe-and-the-alliance-britain
      - africa-rhodesia
      c: Macmillan and Nkrumah meet privately for an hour and a quarter. A brief communiqué calls the talk "informal and very friendly"; it took up the Volta River project and the general African situation, and the talks are to resume tomorrow. Nkrumah is expected to press the case for immediate freedom for Britain's remaining East African possessions, and to urge release of Dr. Banda, the imprisoned Nyasaland nationalist.
      n: 'Homer Bigart, "Macmillan Finds Ghana Friendly," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Macmillan, Nkrumah.'
      tags:
      - name:macmillan-harold
      - name:nkrumah-kwame
      follows:
      - cal.1960-01-06.africa
      time_range:
      - 1960-01-06T22:00Z
      - 1960-01-07T00:00Z
      time_band: night
      time_zone: Africa/Accra
      range_basis: record
- add:
    entry:
      id: cal.1960-01-06.africa-3
      when: Jan. 6
      date: '1960-01-06'
      place: accra
      thread: africa
      also:
      - africa-rhodesia
      c: Baako, Ghana's Minister of Information, answering British reporters who ask how his Government can criticize repressive measures in Nyasaland while it uses preventive detention, says the Nkrumah regime has done more for Ghana in two years than the British did in a hundred; challenged, he says he meant a comparison with any two years of British rule. He says that if Ghanaians dislike the detention without trial of two Opposition leaders and "about forty or fifty" others, they could defeat the Government in the next election.
      n: 'Homer Bigart, "Macmillan Finds Ghana Friendly," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Nkrumah.'
      tags:
      - name:nkrumah-kwame
- add:
    entry:
      id: cal.1960-01-06.africa-rhodesia
      when: Jan. 6
      date: '1960-01-06'
      place: salisbury
      thread: africa-rhodesia
      c: T. Cavanagh, general secretary of the Federal Trades Union Congress, reports that the Governments of Southern Rhodesia and Northern Rhodesia have turned down Federal Prime Minister Welensky's suggestion of a round-table conference on African advancement. Welensky had written to him that the territorial governments could not agree.
      n: '"Rhodesians Reject Talks," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:rhodesia
- add:
    entry:
      id: cal.1960-01-06.africa-rhodesia-2
      when: Jan. 6
      date: '1960-01-06'
      place: london
      thread: africa-rhodesia
      also:
      - europe-and-the-alliance-britain
      c: The British Government is considering offering immunity to witnesses who appear before the Monckton commission on the Federation of Rhodesia and Nyasaland, urged to guarantee them against punishment under the laws of Southern Rhodesia and Nyasaland. The commission, appointed by Macmillan, is expected to begin hearings in Africa about the middle of next month.
      n: '"Witness Immunity Studied," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Macmillan.'
      tags:
      - name:macmillan-harold
- add:
    entry:
      id: cal.1960-01-06.africa-4
      when: By Jan. 6
      date: '1960-01-06'
      place: johannesburg
      thread: africa
      c: Twenty-five South African industrialists, financiers and business men form the South African Foundation to "sell" South Africa to the world, prepared to spend at least $1,500,000 a year; the Government spends $1,500,000 a year on its State Information Office. Among them are Oppenheimer of the Anglo American Corporation, Van Eck, Rupert, Engelhard of Engelhard Industries, de Kock of the Reserve Bank and Holloway, formerly Ambassador to the U.S. and Britain. Engelhard is to chair its American committee; branches are to be set up in London and New York.
      n: 'Leonard Ingalls, "South Africa Business Men Plan Drive to Win World''s Goodwill," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day.'
      tags:
      - polity:south-africa
- add:
    entry:
      id: cal.1960-01-06.africa-5
      when: Jan. 6
      date: '1960-01-06'
      place: newark
      thread: africa
      c: Engelhard says in Newark that a "very one-sided story" about South Africa is being disseminated by various news media, and that its racial issue is comparable to that in the southern States and "in fact, less acute than in some of these states." He says he will direct his attention to increasing U.S. concerns' interest in the South African economy.
      n: '"News Biased, Engelhard Says," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - state:nj
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-france-3
      when: Jan. 6
      date: '1960-01-06'
      place: lakenheath
      thread: europe-and-the-alliance-france
      also:
      - defense
      - europe-and-the-alliance-britain
      c: Twenty-two North American F-100-D Super Sabres of the 493d Squadron, 48th Tactical Fighter Wing, arrive at Lakenheath, Suffolk, from Chaumont, France, led by Col. Victor E. Warford; two more squadrons will follow by mid-month. They move under De Gaulle's decision last spring that only nuclear weapons under his control may be stored on French soil; more than 100 U.S. aircraft have gone to Britain since. The Air Force keeps publicity to a minimum.
      n: 'Walter H. Waggoner, "22 U. S. Aircraft Shift to England," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: De Gaulle.'
      tags:
      - name:de-gaulle-charles
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-britain
      when: Jan. 6
      date: '1960-01-06'
      place: lakenheath
      thread: europe-and-the-alliance-britain
      also:
      - defense
      c: Four magistrates conditionally discharge eighty-two members of the Direct Action Committee Against Nuclear Warfare, all pleading guilty through one lawyer to obstructing the police, after their arrest last Saturday at a demonstration against the Thor rocket base at Harrington.
      n: Walter H. Waggoner, "22 U. S. Aircraft Shift to England," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-britain-2
      when: Jan. 6
      date: '1960-01-06'
      place: london
      thread: europe-and-the-alliance-britain
      also:
      - europe-and-the-alliance-federal-republic
      c: 'As the *Times* reports it: Conservative, Labor and Liberal Members of Parliament foresee bitter hostility in the Commons to measures that strengthen West Germany''s military position in the Atlantic Alliance, and to any Government policy seeking German reunification. Bevan''s illness is cited as a reason to expect a violent but diffuse Socialist attack; he is in a hospital after a major operation and will be out for at least eight weeks.'
      n: Drew Middleton, "Britons Opposing a Stronger Bonn," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).
- add:
    entry:
      id: cal.1960-01-06.press-and-broadcasting
      when: By Jan. 6
      date: '1960-01-06'
      place: london
      thread: press-and-broadcasting
      also:
      - europe-and-the-alliance-federal-republic
      c: 'The *Daily Mail*, in an editorial on the revival of a Hitlerite attitude in Germany: "If we allow it to grow, we shall deserve what will surely come to us."'
      n: 'Drew Middleton, "Britons Opposing a Stronger Bonn," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day.'
- add:
    entry:
      id: cal.1960-01-06.china-foreign
      when: By Jan. 6
      date: '1960-01-06'
      place: shanghai
      thread: china-foreign
      also:
      - indonesia
      c: Fang Fang, vice chairman of the Overseas Chinese Affairs Commission, at a meeting in Shanghai on the situation of the Chinese in Indonesia, says a budget has been fixed for resettling "at least" 600,000 overseas Chinese in 1960. The Government will "receive all returned overseas Chinese, whether there are half a million or several million," he is quoted as saying in the Communist daily *Kung Pao*; Hainan alone could take 500,000.
      n: 'Tillman Durdin, "Red China Invites Indonesia Aliens," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day. Names: Fang Fang.'
      tags:
      - name:fang-fang
- add:
    entry:
      id: cal.1960-01-06.indonesia
      when: Jan. 6
      date: '1960-01-06'
      place: jakarta
      thread: indonesia
      also:
      - china-foreign
      c: China's Ambassador, Huang Chen, presents Chinese proposals orally to Foreign Minister Subandrio in a ninety-minute meeting on the conflict over Chinese aliens in Indonesia. Subandrio calls them constructive but declines to give details; another meeting is set for Sunday. Indonesia insists the ban on aliens in retail trade in rural areas, in force since Jan. 1, will not be withdrawn.
      n: 'Bernard Kalb, "Peiping Offers Proposals," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Huang Chen, Subandrio.'
      tags:
      - name:huang-chen
      - name:subandrio
- add:
    entry:
      id: cal.1960-01-06.indonesia-2
      when: By Jan. 6
      date: '1960-01-06'
      place: jakarta
      thread: indonesia
      c: Lt. Col. Suharto, war administrator in West Kalimantan, defers the Jan. 1 deadline of the ban on Chinese retail traders until Mar. 31 in about a dozen rural districts, reports say; the cooperatives that are to take over have not flourished.
      n: 'Bernard Kalb, "Peiping Offers Proposals," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day. Names: Suharto.'
      tags:
      - name:suharto
- add:
    entry:
      id: cal.1960-01-06.indonesia-3
      when: By Jan. 6
      date: '1960-01-06'
      place: jakarta
      thread: indonesia
      c: Subandrio cancels an on-the-spot survey of the implementation of the ban in West Java, which was to begin a five-day tour Jan. 12, an apparent result of the talks at the Foreign Ministry.
      n: 'Bernard Kalb, "Peiping Offers Proposals," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day. Names: Subandrio.'
      tags:
      - name:subandrio
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-2
      when: Jan. 6
      date: '1960-01-06'
      place: copenhagen
      thread: europe-and-the-alliance
      c: Denmark announces that it will not allow the U.S. nuclear freighter *Savannah* to visit unless Washington supplies full information about its safety equipment. The Danes would not let the atomic submarine *Nautilus* call last year because U.S. authorities refused details of the shielding of its reactor.
      n: '"Danes Wary of Nuclear Ship," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:denmark
- add:
    entry:
      id: cal.1960-01-06.economy-2
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: economy
      c: The Internal Revenue Service gives Schneider, assistant director of its Public Information Division, a $500 award, with $90 withheld for income taxes, for conceiving the "Teaching Taxes" program, a course in preparing an income-tax return given in more than 22,600 high schools and colleges.
      n: '"A U. S. Tax Instructor Wins $410 After Taxes," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
- add:
    entry:
      id: cal.1960-01-06.laos
      when: By Jan. 6
      date: '1960-01-06'
      place: vientiane
      thread: laos
      c: Laotian officials say more than 500 Laotian youths have been kidnapped from their villages in south Laos by rebels, to be trained in North Vietnamese camps.
      n: '"Reds Said to Seize Laotians," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day.'
      tags:
      - polity:laos
- add:
    entry:
      id: cal.1960-01-06.korea
      when: Jan. 6
      date: '1960-01-06'
      place: seoul
      thread: korea
      c: Korean newspapers urge that South Korean courts be given jurisdiction over off-duty offenses by U.S. servicemen, to prevent a repeat of the head-shaving of two Korean prostitutes at a U.S. Army camp last Saturday, on orders of Capt. John W. McEnery; the *Chosun Ilbo* says that otherwise "our trust in United States forces" will not be solid. The United States has no status-of-forces treaty with Korea. Moon In Koo, chief of the Justice Ministry's Prosecution Section, says "strong protest should be made through diplomatic channels."
      n: '"Koreans Ask U. S. Pact," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 6.'
      tags:
      - polity:rok
- add:
    entry:
      id: cal.1960-01-06.africa-algeria-morocco-3
      when: By Jan. 6
      date: '1960-01-06'
      place: algiers
      thread: africa-algeria-morocco
      c: The French High Command says Capt. Ali Ben Messaoud, commander of the nationalist rebel forces in southern Algeria, has been killed by another rebel commander, Si Salah, chief of the sector covering the Algiers region. A French military spokesman says a captured rebel, Abdelkader, gave the news, and that Ben Messaoud had been condemned to death by National Liberation Front leaders for killing his predecessor, Col. Tayeb Djoghlali.
      n: '"Algerian Rebel Slain," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Check: the day of the killing.'
      tags:
      - polity:algeria
      - polity:fr
- add:
    entry:
      id: cal.1960-01-06.japan
      when: Jan. 6
      date: '1960-01-06'
      place: yokosuka
      thread: japan
      c: A fire destroys a hospital at Yokosuka, killing eight adults and eight newborn infants; a faulty kerosene stove is said to have caused it.
      n: '"Japan Hospital Fire Kills 16," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html).'
      tags:
      - polity:japan
      time_range:
      - 1960-01-06T13:00Z
