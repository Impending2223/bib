      id: cal.1960-01-06.soviet-union
      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: soviet-union
      c: Eisenhower, Mrs. Eisenhower, Nixon, Administration officials and congressional leaders of both parties attend a service at the National Presbyterian Church, Washington, marking the opening of Congress. Afterward he tells church officials, speaking without text, that talk of "the accomplishments of atheistic communism" is matched by too little account of "what we stand for," and that the plans for a new church ought to be talked about "just as much as Russia talks about its sputniks."
      n: 'Felix Belair Jr., "President Gives Message Today," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). "Washington Proceedings," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 13. Names: Eisenhower, Nixon.'
      tags:
      - name:eisenhower-dwight-d
      - name:nixon-richard-m
