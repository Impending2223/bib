- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic
      when: Jan. 6
      date: '1960-01-06'
      place: bonn
      thread: europe-and-the-alliance-federal-republic
      also:
      - civil-rights-organizations
      c: 'The Federal Cabinet, meeting with Adenauer, decides to ask Parliament for immediate adoption of an amendment to the Penal Code aimed at anti-Semitism: whoever incites hatred of groups by nationality, race or religion, or slanders them, is to get at least three months'' imprisonment and may be fined. Parliament considered the amendment last month, but it was dropped after Deputies of almost all parties objected to singling out Jews. The Cabinet expects court sentences in pending cases of racial prejudice to "correspond to the seriousness of the offenses."'
      n: 'Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 2. Names: Adenauer.'
      tags:
      - name:adenauer-konrad
      - polity:frg
      time_range:
      - 1960-01-06T11:00Z
      - 1960-01-06T17:00Z
      time_band: afternoon
      time_zone: Europe/Berlin
      range_basis: record
- add:
    entry:
      id: cal.1960-01-06.europe-and-the-alliance-federal-republic-2
      when: Jan. 6
      date: '1960-01-06'
      place: bonn
      thread: europe-and-the-alliance-federal-republic
      c: At a news conference an Interior Ministry spokesman says there is "no conclusive evidence" of central organization or direction of the anti-Semitic incidents. Von Eckardt, the Government's chief spokesman, says the Cabinet will discuss next week what steps to take against the extreme Right-wing German Reich party; two of its members, both 25, are under arrest for the desecration of the Cologne synagogue on Christmas morning.
      n: Sydney Gruson, "Bonn Plans Curb on Anti-Semitism," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 2.
      tags:
      - polity:frg
      - ok:fields-time
      follows:
      - cal.1960-01-06.europe-and-the-alliance-federal-republic
