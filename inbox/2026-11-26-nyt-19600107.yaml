- add:
    entry:
      id: cal.1960-01-06.elections-1960-primaries
      when: Jan. 6
      date: '1960-01-06'
      place: los-angeles
      thread: elections-1960-primaries
      also:
      - elections-1960-kennedy
      - elections-1960-religion
      c: Gov. Edmund G. Brown says he has not decided what to do if Kennedy contests the California Democratic primary. He will decide after a caucus of Democratic legislators at Bakersfield in two or three weeks, and says neither he nor anyone acting for him has discussed a deal to swing California to Kennedy. A favorite-son candidate, he agrees that a ticket with two Roman Catholics would be undesirable, as would "both candidates from the Middle West."
      n: '"Brown Undecided on a Kennedy Fight," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html). Names: Brown, Kennedy.'
      tags:
      - name:brown-edmund-g
      - name:kennedy-john-f
      - state:ca
