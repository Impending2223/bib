      c: Johnson, at a news conference, calls the last session one of the most productive he has served in, and says this one will be as well. "Of course, you wouldn't be candid if you didn't say people were actuated by political motives in an election year," he says, but reports that it will concern only politics are "grossly exaggerated."
      n: 'Russell Baker, "Congress Chiefs Emphasize Amity as Session Opens," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 13. Names: Johnson, Rayburn.'
