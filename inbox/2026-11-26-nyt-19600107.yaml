      when: Jan. 6
      date: '1960-01-06'
      place: washington
      thread: latin-america-trip
      also:
      - congress
      c: 'Fulbright, chairman of the Senate Foreign Relations Committee, on Eisenhower''s decision to go: "Our relations with Latin America have been deteriorating for several years. I hope he will be able to repair them in this trip."'
      n: 'E. W. Kenworthy, "President Scans Trip to Far East," [*New York Times*, Jan. 7, 1960](https://timesmachine.nytimes.com/timesmachine/1960/01/07/issue.html), at 1, 4. Names: Fulbright.'
      tags:
      - name:fulbright-j-william
