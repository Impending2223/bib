      c: Laos. By September the Americans and their allies hold the Plain of Jars and stand at the gates near the Vietnamese border, Bản Ban and Nong Het. At the end of the month the Vietnamese troops are ordered back to rest and refit, leaving a little over a battalion with the Lao to hold a springboard; the Lao and Vietnamese decide on a counteroffensive, Campaign 139.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 242–43. See [[cal.1969-10-25.vietnam-hanoi]]. Check: the days; the history gives the month and "cuối tháng 9-1969".'
      tags:
