- add:
    entry:
      id: cal.1969.vietnam-pacification
      when: 1969, early
      date: '1969'
      thread: vietnam-pacification
      also:
      - vietnam-hanoi
      c: 'Nixon puts a three-phase pacification and development plan into force in the South. Phase 1, building pacification, runs from the start of 1969 to June 1970; phase 2, special pacification, July 1970–June 1971; phase 3, community self-defense and rural development, from July 1971. The 1969 target: kill 30 percent of the 98,763 local revolutionary cadres the enemy has found; by mid-1970, secure 60 percent of the land. The history dates "accelerated pacification" Nov. 1968–June 1969 and the "rural development" phase July 1969–June 1970.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 52, 74–75 and n. 1. Names: Nixon. Check: the plans day and its phases; the historys two datings of the first stages differ (p. 52 against p. 74 n. 1).'
      tags:
      - 'polity:us'
      - 'name:nixon-richard-m'
      at: before 1969-01
- add:
    entry:
      id: cal.1969-04.laos
      when: Apr., late–June
      date: 1969-04
      thread: laos
      also:
      - vietnam-hanoi
      c: Laos. Vang Paos special forces and the right-wing army, directed by the Americans, open three operations, Samakkhi (Solidarity) I, II and III, to take Xieng Khoảng town and the ground round the Plain of Jars. The Lao Peoples Liberation Armys 1st and 701st Battalions, with the local forces and guerrillas of Mường Khun, stop and wear them down, and they fall back to Sam Thong and Long Tieng.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 239. Check: the days; the history gives "cuối tháng 4-1969 đến tháng 6-1969".'
      tags:
      - 'polity:laos'
      - 'polity:pathet-lao'
      place: plain-of-jars
      at: before 1969-04-21
- add:
    entry:
      id: cal.1969-06-28.laos
      when: June 28–July 1
      date: '1969-06-28'
      thread: laos
      also:
      - vietnam-hanoi
      c: 'Mường Sủi. The Vietnamese and Lao forces take all of Mường Sủi and pursue the remnants to the Salaphu Khun junction, threatening Sam Thong and Long Tieng; the campaign ends. By their count the long-held defenses are broken. Khamtay Siphandone says it shows the Lao–Vietnamese forces can beat the "intensified special war"; UPI, June 28, calls it the Americans costliest battle in Laos since the start of 1969.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 240 and n. 1. See [[cal.1969-06-23.vietnam-hanoi]]. Check: the words; the history renders Khamtay and UPI in Vietnamese.'
      tags:
      - 'polity:laos'
      - 'polity:pathet-lao'
- add:
    entry:
      id: cal.1969-07-31.laos
      when: July 31
      date: '1969-07-31'
      thread: laos
      also:
      - vietnam-hanoi
      c: Laos. Under cover of American air and artillery, a mixed force from Sam Thong–Long Tieng and Vang Vieng, Vang Paos men, the right-wing army and 5,000 Thais, 18 battalions and 52 companies of special forces in all, opens Kou Kiet and drives into the center of the Plain of Jars. The rains have flooded the defenders works; the advance is fast, with villages burned.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 241–42 and n. 1. Check: the day of the opening; the history gives "cuối tháng 7-1969" and, for the attack, July 31.'
      tags:
      - 'polity:laos'
      - 'polity:pathet-lao'
      - 'polity:thailand'
      - 'ok:fields-place'
      place: plain-of-jars
