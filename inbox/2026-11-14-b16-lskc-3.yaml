      id: cal.1969.vietnam-hanoi-4
      when: 1969, mid
      date: '1969'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Central Military Party Committee orders the army to tighten organization, raise quality and trim the standing forces. The 377th and 375th Air Defense Divisions, the 269th Bridge and Ferry Engineer Regiment and the 268th and 278th SAM Regiments are dissolved to reinforce the guard of key places, the fighting in southern Military Region 4 and Route 559; the Navy and the northern regions and schools cut staff and send over 13,000 to the fighting units. Group 500, from the south bank of the Gianh to the 17th parallel, with seven truck, eight engineer and two 37 mm battalions, a pipeline battalion and its stations, is folded into Group 559.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 194–95, 212. Made public: 2013. Check: the day; the history says "từ mùa hè năm 1969" for the order (p. 194) and "giữa năm 1969" for Group 500 (p. 212).'
      tags:
      - 'polity:drv'
      - 'vis:only:drv'
      at: before 1969-05
