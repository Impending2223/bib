      at: before 1969-12-01
- cite:
    id: cal.1969-05-11.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 121–22, 127 (Đắk Tô 2 to its close: June 26, 4,135 out of action, 88 vehicles and 103 aircraft destroyed, hundreds of prisoners; the history names the new tactic of continuous encirclement and attack, "bao vây tiến công liên tục", first used here, its figures its own; the summer phase May 11–June 20: 29 battalions and equivalents put out of action, in Central Trung Bộ 150 strategic hamlets and 90 resettlement areas broken, 200,000 people freed)'
    units: A
- cite:
    id: cal.1969-05-11.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 126–27 (the history says Nixon was forced by the pressure to order Abrams to stop operations against positions held by the North Vietnamese and to speed Vietnamization; no day given)'
    units: A
- cite:
    id: cal.1969-08-11.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 136–37 (the phase ends Sept. 15: tens of thousands out of action, hundreds of aircraft and thousands of vehicles destroyed, 193 vessels sunk or burned, 284 guns destroyed, by the history''s count)'
    units: A
- cite:
    id: cal.1969-10-29.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 152 and n. 1 (the campaign ends Dec. 5: Task Forces 220 and 53 and a mixed infantry and ranger task force put out of action, 103 aircraft (mostly helicopters), 87 vehicles (24 armored), 29 guns and mortars and 35 depots destroyed or damaged, by the historys count)'
    units: A
- cite:
    id: cal.1969.vietnam-hanoi-2
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 218–19 (Route 559 carried 170,000 tons into the South in 1969, 29 percent more than in 1968, among it hundreds of thousands of rifles, B-40 and B-41 rockets, recoilless guns, hundreds of millions of rounds and thousands of radios; over 80,000 troops marched south over the Trường Sơn that year; in the dry season of 1968–69 tankers brought in only some 90 tons of fuel against a need of 500)'
    units: A
- cite:
    id: cal.1969-07-25.vietnam
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 29 and n. (the Guam statement of July 1969, named by Laird, Jan. 14, 1970, the Nixon Doctrine, applied to Asia by Vietnamization)'
    units: A
- cite:
    id: cal.1969-03-18.vietnam-operations
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 248 ("hoạt động bữa ăn," the B-52 attack on the Cambodian border region, Mar. 18, the start of the widening of the war into Cambodia; from Mar. 1969 to Apr. 1970 over 3,630 B-52 sorties on Cambodia, 60 percent of the B-52 sorties in Indochina)'
    units: A
- cite:
    id: cal.1969-09-26.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 264 (from September 1969 the Saigon 21st Division, a Marine brigade, four Ranger battalions and river groups with air support open the first sweep to take U Minh and fail)'
    units: A
- cite:
    id: cal.1969-01-13.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 166–67 (the Secretariat''s directive on cultivating and holding up good people and good deeds, "bước vào năm 1969" (at the start of 1969): prompt praise, booklets, propaganda and study; not its number or day, or Hồ Chí Minh''s badge)'
    units: A, C
- cite:
    id: cal.1969-05-08.vietnam-hanoi
    item: '[[w.lich-su-khang-chien-chong-my]], VI, 83–90 (the Politburo''s session of May 10 on the situation and the new tasks and its resolution, after *Văn kiện Đảng toàn tập*, XXX, 128–32: the Americans forced to de-escalate and "Vietnamize," the aims to make them withdraw and the Saigon army collapse; not the plenum, the diplomatic outline or Lê Duẩn''s speech)'
    units: B, C
