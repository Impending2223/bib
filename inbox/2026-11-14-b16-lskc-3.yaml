- add:
    entry:
      id: cal.1969-01-10.vietnam-hanoi
      when: Jan. 10
      date: '1969-01-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Chư Pa, Gia Lai, in the Highlands. Three battalions of the Saigon 42d Regiment, one of the 47th Regiment, 23d Division, and two Ranger battalions, with artillery, aircraft and some American infantry, open Bình Tây 48 against the base, 38 km northwest of Pleiku. The Highlands forces, forewarned, hit the landing; Bình Tây 49 is caught in an ambush, Bình Tây 50 from Phú Yên beaten in its turn. Twenty days: 2,500 out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 98–100. Check: the end of the fighting; the history gives 20 days and its own figures.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: chu-pa
- add:
    entry:
      id: cal.1969-01-24.vietnam-hanoi
      when: Jan. 24
      date: '1969-01-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cô Ca Va, west of Trị–Thiên. The 9th Marines, 3d Marine Division, and five battalions of the Saigon 1st Division, some 7,000 men with air and artillery, open Dewey Canyon against the Route 559 depots and roads. The 5th Regiment, the 3d Sapper Battalion, the way stations and the western guerrillas hold them. After 18 days: 2,863 out of action, 49 aircraft shot down or destroyed, six guns.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 100–101. Check: the end of the fighting and the figures; the history gives 18 days.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: co-ca-va
- add:
    entry:
      id: cal.1969-01-25.vietnam-paris
      when: Jan. 25
      date: '1969-01-25'
      thread: vietnam-paris
      also:
      - vietnam-hanoi
      c: 'Paris. The first plenary session of the four-party conference opens: the DRV, the Front, the United States, Saigon. Xuân Thủy heads the DRV, Lê Đức Thọ special adviser; Trần Bửu Kiếm the Front, Nguyễn Thị Bình and Trần Hoài Nam deputies; Nguyễn Cao Kỳ Saigon, Phan Đăng Lâm deputy.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 101–2 and n. 1. See [[cal.1969-01-18.vietnam-paris]]. Names: Xuân Thủy, Lê Đức Thọ, Nguyễn Thị Bình, Nguyễn Cao Kỳ, Trần Bửu Kiếm, Trần Hoài Nam, Phan Đăng Lâm. Check: the history says the United States was admitted to treat the Front as an official and lawful party; its note names Harriman at the head of the American side, where Lodge had been named Jan. 5 (see [[cal.1969-01-05.vietnam]]).'
      tags:
      - 'polity:drv'
      - 'polity:us'
      - 'name:xuan-thuy'
      - 'name:le-duc-tho'
      - 'name:nguyen-thi-binh'
      - 'name:nguyen-cao-ky'
      place: paris
- add:
    entry:
      id: cal.1969-02-22.vietnam-hanoi-2
      when: Feb. 22
      date: '1969-02-22'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Mỹ Tho and Đồng Tâm. At night Regiment 1, with Artillery Battalion 309F, raids the town and the base: dozens of Saigon and American troops out of action, 12 aircraft and six guns destroyed or damaged.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 111. See [[cal.1969-02-22.vietnam-hanoi]]. The words: "đêm 22-2-1969" (the night of Feb. 22, 1969). Check: the regiment''s region; the history says Regiment 1 of the delta forces and does not number it.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: my-tho
      time_range:
      - '1969-02-22T14:00Z'
      - '1969-02-22T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-02-26.vietnam-hanoi
      when: Feb. 26
      date: '1969-02-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Đồng Dù, Củ Chi, the base of the American 25th Division. At 2:30 a.m. Battalion 3 of the Miền command''s sappers and Battalion 28 of the 7th Division''s, under Nguyễn Cụ, deputy chief of the Miền''s sappers, cut seven wire fences and attack. In 30 minutes the division headquarters, signal area, radar, two artillery positions, 100 bunkers and 29 shelters are destroyed. Over 1,200 out of action, 179 vehicles, 12 guns and dozens of aircraft destroyed or damaged.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 107–8. See [[cal.1969-02-22.vietnam-hanoi]]. The words: "Hai giờ 30 phút ngày 26-2-1969" (2:30, Feb. 26, 1969). Check: the figures; the history gives its own. Nguyễn Cụ, called Nguyễn Tư Cường, has no name entry.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: dong-du
      time: '1969-02-25T18:30Z'
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1969-02-24.vietnam-hanoi
      when: Feb. 24
      date: '1969-02-24'
      thread: vietnam-hanoi
      c: 'Bình Phú, on the edge of Bến Tre town. At night a sapper company of the Bến Tre provincial command, with an inside agent, raids the base of the 2d Battalion, 10th Regiment, Saigon army: 120 out of action. Another company destroys five American 105 mm guns at Đồng Cò and Chợ Giữa. The secret cells then lead villagers of the town''s edge to rise and break some strategic hamlets.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 111. See [[cal.1969-02-22.vietnam-hanoi]]. The words: "Đêm 24-2-1969" (the night of Feb. 24, 1969).'
      tags:
      - 'polity:drv'
      place: binh-phu-ben-tre
      time_range:
      - '1969-02-24T14:00Z'
      - '1969-02-24T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-02.vietnam-hanoi
      when: Feb.
      date: 1969-02
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Eastern Nam Bộ. The 5th Division and local forces strike repeatedly around Biên Hòa and Long Bình; Regiment 33 hits a Royal Thai battalion at Bầu Cối, southeast of the Long Bình district post. Saigon sends six strategic reserve battalions to relieve the inner ring and the 3d Airmobile Cavalry Brigade to hold the outer.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 108. Check: the days; the history gives only the month.'
      tags:
      - 'polity:drv'
      - 'polity:thailand'
      place: bau-coi
- add:
    entry:
      id: cal.1969-02.vietnam-hanoi-2
      when: Feb.
      date: 1969-02
      thread: vietnam-hanoi
      c: The Mekong Delta. Artillery raids on airfields and depots; Regiment 2, less Battalion 263, ambushes at the Chợ Gạo canal and Gò Công and destroys a Saigon Civil Guard company; sappers and engineers hit river convoys, seven craft destroyed and hundreds of tons of fuel.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 110–11. See [[cal.1969-02-22.vietnam-hanoi]]. Check: the days; the history gives the month.'
      tags:
      - 'polity:drv'
      place: mekong-delta
- add:
    entry:
      id: cal.1969-03-17.vietnam-hanoi
      when: Mar. 17
      date: '1969-03-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Dầu Tiếng, Thủ Dầu Một. Twelve battalions of the American 25th and 1st Divisions, the 11th Armored Cavalry in the van, some 10,000 men, open Atlas Wedge to break the encirclement and relieve the base. Allied air and artillery drop over 1,500 tons on the Michelin plantation and villages Mar. 18–28. Eastern Nam Bộ''s Tây Ninh–Bình Long–Biên Hòa campaign hits Trà Cao and Nước Trong: over 2,000 out of action, nine mixed companies hurt, over 200 vehicles, 20 aircraft.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 109–10. Check: the day and the figures; the history gives its own.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: dau-tieng
- add:
    entry:
      id: cal.1969-03-18.vietnam-operations
      when: Mar. 18
      date: '1969-03-18'
      thread: vietnam-operations
      c: 'The American air force is ordered to bomb Cambodia. Nixon calls it the first turning point in the administration''s conduct of the war.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 109 and n. 1. Names: Nixon. Check: the order; the history gives the day and Nixon''s judgment through Joseph A. Amter, *Lời phán quyết về Việt Nam*, a Vietnamese edition (Quân đội nhân dân, 1985), 277.'
      tags:
      - 'polity:us'
      - 'name:nixon-richard-m'
- add:
    entry:
      id: cal.1969-03.vietnam-hanoi
      when: Mar., late
      date: 1969-03
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Route 13, Bình Long. Allied forces pull out of Trà Cao and Lộc Giang and open Montana to cut the Liberation forces'' road east and west of the Saigon River and restore the interprovincial defense line. Local forces ambush and close in; the operation fails.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 110. Check: the days; the history gives "cuối tháng 3-1969".'
      tags:
      - 'polity:drv'
      - 'polity:us'
      - 'ok:fields-place'
      at: before 1969-03-21
- add:
    entry:
      id: cal.1969-03-17.vietnam-hanoi-2
      when: Mar. 17
      date: '1969-03-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: West Quảng Trị. Group 7 of the Quảng Trị command and Regiment 8, with local forces and the people south of Hướng Hóa, defeat the Lam Sơn 271 operation, five allied battalions after the depots and corridor at Tam Tanh and A Giới.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 113 and n. 1. Check: the end; the history prints "31-4-1969".'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: tam-tanh
- add:
    entry:
      id: cal.1969-04.vietnam-hanoi-3
      when: Apr.
      date: 1969-04
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'From Region 6 southward the Liberation forces fight 934 actions: a Saigon force of two battalions, three American groups, a subsector headquarters and six pacification teams hurt; over 150 aircraft shot down or destroyed, 346 vehicles, 74 river craft sunk. The 5th, 7th and 9th Divisions strike toward Route 13, Tây Ninh and Dầu Tiếng; the 5th, from Long Khánh and Định Quán, hits the Saigon 18th Division''s headquarters.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 113–14. Check: the days; the history gives the month and its own figures.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      - 'ok:fields-place'
- add:
    entry:
      id: cal.1969-05-05.vietnam-hanoi
      when: May 5
      date: '1969-05-05'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Đồng Pan. Regiment 174 of the 5th Division attacks the base and hurts the battalion holding it; the rest falls back to Bầu Cỏ, Tây Ninh. The same day Regiment 141 of the 7th Division hits Tà Tê and north of Route 13 without success, the American 1st Cavalry''s two brigades keeping the road.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 115–16.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: dong-pan
- add:
    entry:
      id: cal.1969-05-08.vietnam-hanoi-3
      when: May 8–9
      date: '1969-05-08'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Suối Tầm Bung and Route 20. Regiment 5 of the 5th Division attacks the Saigon 18th Division''s task forces 43 and 52 and beats their sweep. The 5th Division then keeps on the 18th in Bà Rịa and Long Khánh and hurts Task Force 52 badly.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 116–17.'
      tags:
      - 'polity:drv'
      place: suoi-tam-bung
- add:
    entry:
      id: cal.1969-05-11.vietnam-hanoi-2
      when: May 11
      date: '1969-05-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Eastern Nam Bộ, the summer offensive''s first day. The 7th Division and sappers hurt the American 11th Armored Cavalry west and southwest of Hớn Quản and raid the 3d Brigade, 1st Airmobile Cavalry, at Tếch Ních; the town and Route 13 are threatened and eight airborne battalions sent up. In Tây Ninh the 9th Division hits bases around the Holy See and Vườn Điều; the strategic reserve and the American 25th''s 1st Brigade come to relieve.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 116. See [[cal.1969-05-11.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: hon-quan
- add:
    entry:
      id: cal.1969-05-12.vietnam-hanoi-2
      when: May 12
      date: '1969-05-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region V, at night. Sappers and mortar teams strike the HAWK missile position at Sơn Trà, Đà Nẵng, the 1st Marine Regiment''s headquarters at Hầm Xẻ, the 11th Brigade at Gò Hội, Quảng Ngãi, and the 5th Marine Regiment at An Hòa, Quảng Đà.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 117–18. See [[cal.1969-05-11.vietnam-hanoi]]. The words: "đêm 12-5-1969" (the night of May 12, 1969).'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: son-tra
      time_range:
      - '1969-05-12T14:00Z'
      - '1969-05-12T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-05-19.vietnam-hanoi
      when: May 19
      date: '1969-05-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Lòng Tàu River. For Hồ Chí Minh''s birthday, Group 10, the Rừng Sác sappers, sink two tankers, of 7,000 and 15,000 tons, in 30 minutes. The group, cut off and encircled, feeds itself and makes its own arms.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 117. Names: Hồ Chí Minh.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      - 'name:ho-chi-minh'
      place: long-tau-river
- add:
    entry:
      id: cal.1969-05.vietnam-hanoi-2
      when: May
      date: 1969-05
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 6. Sappers hit the Saigon 44th Regiment at Sông Mao, Bình Thuận, a ranger camp at Lương Sơn and the subsector and gun position at Kim Ngọc. On Routes 1, 8 and 11 and north and south of Hòa Đa, the regional forces and local units stop Task Force 1/5, a Saigon mechanized infantry group: hundreds out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 118. Check: the days; the history gives the month.'
      tags:
      - 'polity:drv'
      - 'ok:fields-place'
- add:
    entry:
      id: cal.1969-06-15.vietnam-hanoi
      when: June 15–16
      date: '1969-06-15'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Long Thành. The district''s local forces and guerrillas hurt a battalion of the Royal Thai Black Panther Division.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 117.'
      tags:
      - 'polity:drv'
      - 'polity:thailand'
      place: long-thanh
- add:
    entry:
      id: cal.1969.vietnam-hanoi
      when: '1969'
      date: '1969'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Supreme Command moves the 1st Division (Regiments 95C, 101C and 209) and Regiments 33, 174, 10 and 20 from the Highlands front and Region V into eastern Nam Bộ.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 93 and n. 1; 105 n. 1. Made public: 2013. Check: the day; the history dates it to 1969 and gives the division moved from the Highlands.'
      tags:
      - 'polity:drv'
      - 'vis:only:drv'
- add:
    entry:
      id: cal.1969.vietnam-hanoi-2
      when: '1969'
      date: '1969'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - laos
      c: 'The North''s support for the year: 81,090 cadres and soldiers to the South, among them artillery, engineer and signal units, 13 infantry battalions, 99 infantry companies and 35 sapper platoons; 52,424 tons of arms, supplies, food and medicine; $34,888,629. To Laos 40,200 volunteer troops, 28,701 tons and 41,300,488 Vietnamese đồng.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 93 and n. 1. Made public: 2013. To check: *Thống kê số liệu về cuộc kháng chiến chống Mỹ, cứu nước (1954–1975)*, in the Ministry of Defense archive (cited by [[w.lich-su-khang-chien-chong-my]], VI, 93 n.).'
      tags:
      - 'polity:drv'
      - 'vis:only:drv'
- add:
    entry:
      id: cal.1969-05-17.vietnam-hanoi
      when: May 17–23
      date: '1969-05-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ngọc Dơ Lang range, Kon Tum. In Đắk Tô 2, the 66th Regiment and others surround and hurt the Saigon 22d Ranger Battalion.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 121. See [[cal.1969-05-11.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: ngoc-do-lang
- add:
    entry:
      id: cal.1969-05-24.vietnam-hanoi-2
      when: May 24
      date: '1969-05-24'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Plây Thông Breng, Hill 668. In Đắk Tô 2, Battalion 9 of the 66th Regiment hurts the 2d Battalion of the Saigon strike force: over 300 out of action. About then 250 of its 1st Battalion are put out of action: the campaign''s highest rate of kill.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 121. See [[cal.1969-05-11.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: plei-thong-breng
- add:
    entry:
      id: cal.1969-05-31.vietnam-hanoi
      when: May 31
      date: '1969-05-31'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Hill 875. In Đắk Tô 2, the 66th Regiment and Battalion 3 of the 28th close round the Saigon 11th and 23d Ranger Battalions on the hill and attack in turn; hundreds out of action. The Saigon command pulls back to call air and artillery, the attackers close up each time. The history notes that Regiment 174 beat the American 173d Airborne''s 2d Battalion on the same hill, Nov. 1967.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 121–22. See [[cal.1969-05-11.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: hill-875
- add:
    entry:
      id: cal.1969-05-10.vietnam-hanoi-3
      when: May 10–11
      date: '1969-05-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'A Lưới–A Bia valley, west of Huế. The American and Saigon commands decide on Apache Snow: five battalions, the 1st, 2d and 3d of the 187th Brigade, 101st Airborne, and two of the Saigon 1st Division. The 3d Battalion, Lt. Col. Weldon Honeycutt, searches round A Bia from posts at Hills 337 and 1,087, and is ambushed on the saddle north of the mountain: dozens out of action.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 123–24 and n. 1. Check: the day of the decision, May 10, and of the ambush, May 10–11; the history gives "ngày 10-5-1969" for the first and "các ngày 10 và 11-5" for the second.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: a-bia
- add:
    entry:
      id: cal.1969-05-12.vietnam-hanoi-3
      when: May 12
      date: '1969-05-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'A Bia. In the morning B-52s and other bombers carpet the mountain. Three companies of the 3d Battalion, 187th, move north in several columns into Regiment 8''s prepared positions; heavy rain and mud. Company C loses 37; Company B is drawn into a second ambush.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 124. The words: "Sáng 12-5-1969" (the morning of May 12, 1969).'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: a-bia
      time_range:
      - '1969-05-11T22:00Z'
      - '1969-05-12T04:00Z'
      time_band: morning
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-05-17.vietnam-hanoi-2
      when: May 17
      date: '1969-05-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: A Bia. The American command sends the 1st Battalion, 506th, up to take Hill 900; the rain holds it, and the attack stops again.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 124.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: a-bia
- add:
    entry:
      id: cal.1969-05-19.vietnam-hanoi-2
      when: May 19
      date: '1969-05-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'A Bia. Lt. Gen. Melvin Zais, the 101st Airborne''s commander, orders the 2d Battalions of the 501st and 502d and the 2d Battalion, 3d Regiment, Saigon 1st Division, to encircle the mountain from northeast, southeast and southwest, to cut supply and retreat.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 124–25.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: a-bia
- add:
    entry:
      id: cal.1969-05-23.vietnam-hanoi
      when: May 23
      date: '1969-05-23'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: A Bia. After 13 days and nights, short of food and ammunition and cut off from replacements, the Trị–Thiên forces withdraw. The history counts 1,500 of the 187th Brigade out of action and nearly a million pounds of bombs and shells on the defenders; its notes give American dead as 430 in a week (Amter) and 70 killed and 372 wounded in ten days (Pimlott). The troops call it Hamburger Hill.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 125–26 and n. 1. Check: the figures; the history gives its own and two American writers'' counts, VI, 125 n. 1.'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: a-bia
- add:
    entry:
      id: cal.1969-05-21.vietnam-congress
      when: May 21
      date: '1969-05-21'
      thread: vietnam-congress
      c: 'Edward Kennedy on the assault on Hamburger Hill: immoral and senseless; American lives not to be spent for the army''s pride.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 126. Names: Kennedy. Check: the day and the words; the history renders an AP story dated May 21, 1969 in Vietnamese, and the calendar''s own record of the speech should be read.'
      tags:
      - 'polity:us'
      - 'name:kennedy-edward-m'
- add:
    entry:
      id: cal.1969-06-27.vietnam
      when: June 27
      date: '1969-06-27'
      thread: vietnam
      also:
      - press-and-broadcasting
      c: '*Life* prints photographs of 241 Americans killed in a week''s fighting; the history puts them at A Bia and says the public was angered and sickened.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 126. Check: the history''s reading: the issue showed one week''s dead in Vietnam, and the history ties it to A Bia.'
      tags:
      - 'polity:us'
- add:
    entry:
      id: cal.1969-09-04.vietnam-hanoi-5
      when: Sept. 4
      date: '1969-09-04'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The Provisional Revolutionary Government, its Advisory Council, the National Liberation Front''s Central Committee and the Alliance of National, Democratic and Peace Forces hold a joint conference on the memorial and mourning for Hồ Chí Minh. It cables the Party''s Central Committee: the South pledges to fight on until the Americans leave and the Saigon regime falls.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 134–35 and n. 1. See [[cal.1969-09-02.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - 'polity:drv'
      - 'name:ho-chi-minh'
      - 'ok:fields-place'
- add:
    entry:
      id: cal.1969-09-08.vietnam-hanoi-2
      when: Sept. 8
      date: '1969-09-08'
      thread: vietnam-hanoi
      also:
      - vietnam-paris
      c: 'The South''s Provisional Revolutionary Government, the Front''s Central Committee and the Alliance hold the memorial for Hồ Chí Minh and issue an appeal to the South''s army and people to turn grief into strength.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 135. See [[cal.1969-09-08.vietnam-hanoi]]. Names: Hồ Chí Minh.'
      tags:
      - 'polity:drv'
      - 'name:ho-chi-minh'
- add:
    entry:
      id: cal.1969-08-11.vietnam-hanoi-2
      when: Aug. 11
      date: '1969-08-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Eastern Nam Bộ, the autumn offensive''s first night. The 7th Division''s artillery hits a Saigon ranger camp at Lộc Ninh, 100 out of action; the command''s sappers hit the Chơn Thành subsector and the Tếch Ních base of the Saigon 9th Regiment; the 5th Division''s sappers the Bù Na ranger training camp and then the Bù Đăng subsector, three strategic hamlets broken. At Tây Ninh the 88th Regiment attacks an airborne group and fails, with heavy losses; sappers of the 1st Division''s 2d Regiment take the Lôvêa cluster from the Saigon 2d Battalion, 8th Airborne, which falls back to Suối Dây.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 131–32. See [[cal.1969-08-11.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: loc-ninh
      time_range:
      - '1969-08-11T14:00Z'
      - '1969-08-11T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-08-12.vietnam-hanoi
      when: Aug. 12
      date: '1969-08-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 13, Bình Long. At night Liberation forces ambush the Saigon 15th Armored Cavalry Regiment, many vehicles destroyed, six prisoners; the same day they destroy an American motorized group at Tân Khai and fight several ambushes west of Hớn Quản, three mechanized companies badly hurt.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 131. See [[cal.1969-08-11.vietnam-hanoi]]. The words: "đêm 12-8-1969" (the night of Aug. 12, 1969).'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: hon-quan
      time_range:
      - '1969-08-12T14:00Z'
      - '1969-08-12T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
      range_basis: record
- add:
    entry:
      id: cal.1969-08-11.vietnam-hanoi-3
      when: Aug. 11
      date: '1969-08-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Binh Thuận, Region 6. Forces raid the Sông Mao base and badly hurt a battalion of the Saigon 44th Regiment; Saigon moves its reserves to Bình Thuận, and local forces ambush vehicles on Routes 1 and 20.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 132–33. See [[cal.1969-08-11.vietnam-hanoi]]. Check: the place; the history names the province, Bình Thuận.'
      tags:
      - 'polity:drv'
      place: phan-thiet
- add:
    entry:
      id: cal.1969-08-12.vietnam-hanoi-2
      when: Aug. 12–16
      date: '1969-08-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bến Tre. The people and forces of Giồng Trôm, Mỏ Cày and Châu Thành combine attack and uprising, destroy pacification support forces and break some strategic hamlets. In the delta the artillery raids Mỹ Tho, Cai Lậy, Cái Bè, An Hữu and the Bình Đức base, and the Mỹ Tho commandos hit the Saigon 6th Armored Regiment''s base. The history judges the phase''s early stage weak.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 133. See [[cal.1969-08-11.vietnam-hanoi]]. Check: the days of the Mỹ Tho actions; the history gives the phase only.'
      tags:
      - 'polity:drv'
      place: ben-tre
- add:
    entry:
      id: cal.1969-12.vietnam-hanoi-2
      when: Dec., winter
      date: 1969-12
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: The Miền command, at the start of the winter, decides to withdraw the main force of eastern Nam Bộ to the border for refit, leaving a few units, among them the 320th Regiment, to scatter and build guerrilla warfare among the hamlets.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 141. Made public: 2013. Check: the day; the history gives the winter of 1969.'
      tags:
      - 'polity:drv'
      - 'vis:only:drv'
      at: before 1969-12-21
- add:
    entry:
      id: cal.1969-11-11.vietnam-hanoi
      when: Nov. 11
      date: '1969-11-11'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Ô Môi, Long Mạnh canal, Long Tiên, Cai Lậy. Regiment 1 of Region 8 ambushes the Saigon 7th Division''s 20th Battalion: hundreds killed or captured, 200 weapons taken; the local forces then break up nearly all the civil defense units in ten villages of Cai Lậy.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 144.'
      tags:
      - 'polity:drv'
      place: long-tien-cai-lay
- add:
    entry:
      id: cal.1969-11.vietnam-hanoi
      when: Nov., late
      date: 1969-11
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Mỹ Tho. Companies 1 and 3 of Battalion 514C ambush seven Civil Guard companies on Route 20; Company 2 raids at Chợ Bưng, Châu Thành, on Route 4: 17 pacification teams destroyed and 27 engineer vehicles. Region 8''s task for the last months is set as breaking the pacification program.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 144–45 and n.. Check: the days; the history gives "cuối tháng 11-1969".'
      tags:
      - 'polity:drv'
      place: my-tho
      at: before 1969-11-21
- add:
    entry:
      id: cal.1969-11.vietnam-hanoi-2
      when: Nov., late
      date: 1969-11
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Route 26. A sapper team under Lê Văn Phích brings down the Bình Chánh bridge, 100 meters, closing the road for two months.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 146 and n. 1. Check: the province; the history does not name it.'
      tags:
      - 'polity:drv'
      place: binh-chanh-bridge
      at: before 1969-11-21
- add:
    entry:
      id: cal.1969-12-10.vietnam-hanoi
      when: Dec. 10
      date: '1969-12-10'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Cái Bè, Mỹ Tho. The Saigon 9th and 7th Divisions, four Ranger battalions and 20 heavy guns sweep west of Route 20 to Mỹ Thiện to break the base. Region 8, the province and district forces and the people fight on; at Hội Cư the province guard company hurts a company, at Hậu Mỹ Nam Battalion 216A another. After 15 days the sweep is called off.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 145.'
      tags:
      - 'polity:drv'
      place: my-thien
- add:
    entry:
      id: cal.1969-12.vietnam-hanoi-3
      when: Dec., winter
      date: 1969-12
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bến Tre, Kiến Phong, An Giang. Battalions 516 and 560 destroy two companies at Mỏ Cày and hurt a Civil Guard company at Minh Đức; local forces kill 48 pacification officials at Phước Hiệp and Định Thủy and 88 rural-development cadres at Thạnh Phú; Bến Tre''s commandos set mines and grenades in the town, 147 killed. In Kiến Phong a battalion at Rạch Bà Lương stops a sweep; at Canal Ba a platoon under Tư Văn of 20 men holds off three attacks.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 145–47. Check: the days and the figures; the history gives the winter phase.'
      tags:
      - 'polity:drv'
      place: ben-tre
      at: before 1969-12-21
- add:
    entry:
      id: cal.1969-09-02.vietnam-hanoi-2
      when: Sept. 2
      date: '1969-09-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bà Hòn, Region 9. Ten Saigon battalions sweep the area; the Region''s forces fight it off.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 147. Check: the end of the sweep.'
      tags:
      - 'polity:drv'
      place: ba-hon
- add:
    entry:
      id: cal.1969-09-19.vietnam-hanoi
      when: Sept. 19
      date: '1969-09-19'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Chương Thiện, Region 9. Nine Saigon battalions and five river combat groups open a sweep; the Region''s forces fight it off.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 147. Check: the end of the sweep.'
      tags:
      - 'polity:drv'
      place: chuong-thien
- add:
    entry:
      id: cal.1969-09-26.vietnam-hanoi
      when: Sept. 26
      date: '1969-09-26'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: U Minh Thượng, Region 9. Saigon opens a sweep with 23 battalions, the long sweeps of Bà Hòn, Chương Thiện and U Minh Thượng aimed at the border, the supply corridor and the Regions preparations for spring 1970. Fifty guerrilla teams, 200 men, ambush river craft on the Ông Đốc; hundreds out of action, dozens of boats sunk or badly hurt.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 147–48. Check: the end of the sweep; the history gives the period only.'
      tags:
      - 'polity:drv'
      place: u-minh
- add:
    entry:
      id: cal.1969-11-02.vietnam-hanoi
      when: Nov. 2
      date: '1969-11-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Ka Te, Hill 936, Quảng Đức. At 4 a.m. the 66th Regiment storms the base from its trenches, after five days of closing in; in 15 minutes the garrison is destroyed. Nearly 200 out of action, 14 aircraft shot down, six 105 mm and 155 mm guns taken.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 150–51. See [[cal.1969-10-29.vietnam-hanoi]]. The words: "Bốn giờ sáng ngày 2-11-1969" (4 a.m., Nov. 2, 1969).'
      tags:
      - 'polity:drv'
      - 'polity:us'
      place: ka-te
      time: '1969-11-01T20:00Z'
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1969-11-02.vietnam-hanoi-2
      when: Nov. 2–6
      date: '1969-11-02'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Đức Lập and Đắk Song. On the campaigns main axis the Fronts forces surround Đức Lập to draw the Saigon forces out toward Đắk Song and destroy them.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-10-29.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: duc-lap
- add:
    entry:
      id: cal.1969-11-09.vietnam-hanoi
      when: Nov. 9
      date: '1969-11-09'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bu Prăng to Đức Lập. With artillery in support the infantry takes a series of posts along the line. The 66th Regiment presses west of Bu Prăng and Hills 882 and 883; Saigon sends Task Force 220 and two reconnaissance companies to relieve.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-10-29.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: bu-prang
- add:
    entry:
      id: cal.1969-11-17.vietnam-hanoi
      when: Nov. 17
      date: '1969-11-17'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bu Prăng. Saigons Task Force 220, sent to relieve the base, is badly hurt by the 66th Regiment.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-11-09.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: bu-prang
- add:
    entry:
      id: cal.1969-11-21.vietnam-hanoi-2
      when: Nov. 21
      date: '1969-11-21'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bu Prăng. Saigon puts Task Force 22 in place of 220; the 66th Regiment, Battalion 37 and Sapper Company 60 meet it and hurt it, and it falls back south of the base.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 151. See [[cal.1969-11-17.vietnam-hanoi]].'
      tags:
      - 'polity:drv'
      place: bu-prang
- add:
    entry:
      id: cal.1969-11-30.vietnam-hanoi
      when: Nov. 30
      date: '1969-11-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bu Prăng. Sappers take the Task Force 22 headquarters and the base, held completely by the Fronts forces.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 151–52. See [[cal.1969-11-21.vietnam-hanoi-2]].'
      tags:
      - 'polity:drv'
      place: bu-prang
- add:
    entry:
      id: cal.1969-12.vietnam-hanoi-4
      when: Dec., winter
      date: 1969-12
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Region 6 and Tuyên Đức. Region 6s sappers raid the rear base of the Saigon 44th Regiment, 23d Division, at Sông Lũy, Bình Thuận. At Đức Trọng and on Route 21 the main force and local forces hurt many Civil Guard companies, take some posts and help the people break strategic hamlets along Routes 20 and 21.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 149. Check: the days; the history gives the winter phase.'
      tags:
      - 'polity:drv'
      place: song-luy
      at: before 1969-12-21
- add:
    entry:
      id: cal.1969-01-25.vietnam-saigon
      when: Jan. 25
      date: '1969-01-25'
      thread: vietnam-saigon
      also:
      - vietnam-hanoi
      c: Saigon. More than 10,000 people of different classes, parties and religions march to demand that the United States end the war and withdraw its and its allies troops, that Thiệu, Kỳ and Hương resign, and that a peace government be formed. Seminars and petitions follow in Saigon, Đà Nẵng, Huế, Cần Thơ and other towns.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 155–56. Check: the day and the number; the history gives them in its own account, with no Saigon or American source.'
      tags:
      - 'polity:rvn'
      place: saigon
- add:
    entry:
      id: cal.1969-05.vietnam-saigon
      when: May
      date: 1969-05
      thread: vietnam-saigon
      also:
      - vietnam-hanoi
      c: Saigon. 11,000 airport and railway workers strike, hindering supply of American and Saigon units.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 156. Check: the days; the history gives the month.'
      tags:
      - 'polity:rvn'
      place: saigon
- add:
    entry:
      id: cal.1969-07.vietnam-saigon
      when: July
      date: 1969-07
      thread: vietnam-saigon
      also:
      - vietnam-hanoi
      c: Saigon. Thiệus government makes students take military training in the summer vacation; over 30,000 demonstrate and petition. The police shoot the student Thái Văn Hiền, and a military vehicle runs down Nguyễn Mạnh Hùng. Students strike and meet in Đà Lạt, Huế and Cần Thơ against military training in the schools.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 157–58. Check: the days; the history gives the month for the order and none for the deaths.'
      tags:
      - 'polity:rvn'
      - 'ok:fields-at'
      place: saigon
- add:
    entry:
      id: cal.1969-08.vietnam-saigon
      when: Aug.
      date: 1969-08
      thread: vietnam-saigon
      also:
      - vietnam-hanoi
      c: Saigon. The bus companys workers strike; 1,000 delegates elected at the congresses of 118 unions back them, and workers of Esso, Caltex, the cosmetics firm, the Mic tobacco works and Grall Hospital strike in support. By early 1970 over 30,000 workers of 64 plants are out; 40 military ships and hundreds of flights are held up. In Feb. 1970 the Thủ Đức depots workers strike, drawing 7,000 more.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 156–57. Check: the days; the history gives Aug. 1969 for the start and 1970 for the rest.'
      tags:
      - 'polity:rvn'
      place: saigon
- add:
    entry:
      id: cal.1969.vietnam-saigon
      when: 1969, mid
      date: '1969'
      thread: vietnam-saigon
      also:
      - vietnam-hanoi
      c: The Saigon–Gia Định Party Committee moves the lawyer Trần Ngọc Liễng, a sympathizer, to found the Progressive National Force, of Saigon officials weary of war and not hostile to the revolution, to press Thiệu to end the war.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 158. Made public: 2013. Check: the day; the history says "giữa năm 1969".'
      tags:
      - 'polity:drv'
      - 'vis:only:drv'
      - 'ok:fields-place'
      at: before 1969-05
- add:
    entry:
      id: cal.1970-01.vietnam-hanoi
      when: Jan.
      date: 1970-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'The Party Central Committees 18th plenum meets in Hanoi on the direction of the leadership of the revolution in the South in the new stage. It affirms the gains of 1968 and 1969, criticizes shortcomings, judges that Vietnamization will continue and the war may spread north, to Laos and Cambodia, and in the main agrees with the Politburos April 1969 estimate of two courses. The tasks: press the military and political attack with diplomacy; the countryside the main direction; build the rear, including the fuel pipeline; the North ready to fight and support the South, Laos and Cambodia.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 158–62. Made public: 2013. Check: the days; the history gives "tháng 1-1970". The calendars span ends Jan. 19, 1970.'
      tags:
      - 'polity:drv'
