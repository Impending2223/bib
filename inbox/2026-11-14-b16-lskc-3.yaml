      when: '1969'
      date: '1969'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Fuel pipeline across the Trường Sơn. After a survey from mid-1968, Construction Site 18 lays the first stretch, 42 km through Vinh, Nam Đàn and Linh Cảm, the center of a line run north and south. By 1971 nearly 1,000 km is laid and working, in two branches, one over the Cổng Trời pass along Route 12 into Laos, one across the Gianh by Routes 10 and 18 to north of Route 9.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 216–17. Made public: 2013. Check: the day; the history gives the three years 1969–71.'
