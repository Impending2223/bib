      c: American B-52s are ordered to strike Base Area 353 in Cambodia, the Parrots Beak and the Fishhook, where Abrams believes the Central Office for South Vietnam sits; Nixon agrees to Abramss proposal. The history takes the second quotation from Joseph Amter.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 247–48 and n. 1. Names: Nixon. Check: the day; the history says "giữa tháng 2-1969" and the strikes follow the early spring offensive.'
