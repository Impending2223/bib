      c: Route 559. Group 559, with Group 500, clears the main pass sectors on Routes 12 and 20 and opens branches 20c, 20d and bypasses; the General Staff adds engineers to open Route 18, a new crossing toward Route 9; Quảng Bình mobilizes 20,000 laborers to build Route 10 to join Routes 18 and 16; river stretches are used to float cargo down.
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 211. Check: the days; the history gives "những tháng đầu của năm 1969".'
