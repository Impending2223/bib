      c: 'Nixons eight-point address on Vietnam: American troops to leave on conditions, both sides, the United States and the DRV, to de-escalate and withdraw together from the South, the Saigon government to stay as it is. The history sets it against the Fronts ten points.'
      n: '[[w.lich-su-khang-chien-chong-my]], VI, 225. See [[cal.1969-05-08.vietnam-hanoi-2]]. To check: Nixon, *Public Papers* (1969), the address of May 14. Names: Nixon. Check: the points; the history gives no detail and the American record should be read.'
