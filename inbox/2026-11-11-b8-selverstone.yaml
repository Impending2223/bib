patch: 2026-11-11-b8-selverstone
by: 'Claude (batch 8 reader, Selverstone, The Kennedy Withdrawal: the ''already in'' rows)'
ops:
- cite:
    id: cal.1961-01-06.berlin-and-vienna
    item: '[[w.selverstone-kennedy-withdrawal]], 20 (Khrushchev, Jan. 6, to a closed session of Kremlin officials on the meeting of Communist parties: wars of national liberation "inevitable" and "sacred";
      Kennedy treats it as a statement of Soviet intentions)'
    units: A, B
- cite:
    id: cal.1961-01-30.program
    item: '[[w.selverstone-kennedy-withdrawal]], 21 (the address to Congress, Jan. 30: the tide "unfavorable," the economy "in trouble")'
    units: A, B
- cite:
    id: cal.1961-05-25.space
    item: '[[w.selverstone-kennedy-withdrawal]], 29 (the address to a joint session, May 25, "Urgent National Needs"; the freedom doctrine)'
    units: A
- cite:
    id: cal.1961-08-13.berlin-and-vienna
    item: '[[w.selverstone-kennedy-withdrawal]], 31 (the Soviet Union and the GDR, beginning Aug. 13, stop all traffic through the center of the city)'
    units: A
- cite:
    id: cal.1961-10-11.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 36 (the press conference, Oct. 11: Taylor to visit Vietnam; troops to await his return)'
    units: B
- cite:
    id: cal.1961-10-18.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 38 (Taylor''s trip begins Oct. 18; the Mekong flood, over 200,000 homes destroyed)'
    units: A, C
- cite:
    id: cal.1961-12-08.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 48 (the State Department "White Paper," compiled by Jorden, released Dec. 8)'
    units: A
- cite:
    id: cal.1962-01-11.program
    item: '[[w.selverstone-kennedy-withdrawal]], 52 (the first State of the Union, Jan. 11, 1962)'
    units: A
- cite:
    id: cal.1962-02-08.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 55 (MACV comes into existence Feb. 8; Harkins raised to four stars)'
    units: A, B
- cite:
    id: cal.1962-02-14.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 57 (the news conference: "not sent combat troops in the generally understood sense of the word"; members of both parties briefed on the advisers)'
    units: A, B, C
- cite:
    id: cal.1962-02-20.vietnam-congress
    item: '[[w.selverstone-kennedy-withdrawal]], 58 (Harriman before Foreign Relations in executive session, Feb. 20: no combat troops in Vietnam; Morse and Gore uncomfortable)'
    units: A, B
- cite:
    id: cal.1962-02-27.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 63–64 (two South Vietnamese air force pilots bomb the Independence Palace, Feb. 27; Diệm survives)'
    units: A
- cite:
    id: cal.1963-01-02.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 98 (Jan. 2: 1,200 ARVN troops and their advisers against about 340 guerrillas; over sixty ARVN and three Americans dead; downed U.S. helicopters; MACV deems
      it a success)'
    units: A, B, C, E
- cite:
    id: cal.1963-05-08.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 118 (the Huế radio station crowd, the Buddhist flag against the decree on flags, troops, Diệm blames the Communists; 126, 133 refer back to the May 8 incident)'
    units: A, B, D
- cite:
    id: cal.1963-05-12.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 126 (May 12: the *Washington Post*''s front-page story on Nhu''s wish that the United States halve its 12,000 to 13,000 advisers)'
    units: A
- cite:
    id: cal.1963-06-11.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 133 (Quảng Đức''s self-immolation, June 11)'
    units: A
- cite:
    id: cal.1963-08-21.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 142 (the GVN declares martial law, ransacks the pagodas, arrests Buddhist and student protesters; Lodge arrives after)'
    units: B, C, D
- cite:
    id: cal.1963-08-28.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 143 (Aug. 28: Ball and Harriman "already beyond the point of no return," the question "how do we make this coup successful")'
    units: B
- cite:
    id: cal.1963-08-29.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 143–44 (Kennedy''s letter to Lodge the next day: "When we go, we must go to win, but it will be better to change our minds than to fail")'
    units: A
- cite:
    id: cal.1963-09-05.vietnam-congress
    item: '[[w.selverstone-kennedy-withdrawal]], 150 (Hilsman before the Far East Subcommittee, Sept. 5, two hours: "far-reaching doubts"; "heavy sledding" in the aid debate)'
    units: A, B, C
- cite:
    id: cal.1963-09-09.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 147–48, 152 (Huntley and Brinkley, Sept. 9: the domino image affirmed three times; aid cuts "would not be helpful at this time")'
    units: A, B, C
- cite:
    id: cal.1963-09-09.vietnam-saigon
    item: '[[w.selverstone-kennedy-withdrawal]], 152 (Lodge with Diệm, Sept. 9, on Senate statements about suspending aid)'
    units: A
- cite:
    id: cal.1963-09-10.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 154 (Krulak and Mendenhall brief Kennedy, Sept. 10: the war going well in the countryside, politics scathing in the cities; Kennedy wonders whether they
      visited the same country)'
    units: A, B, C
- cite:
    id: cal.1963-09-15.alabama
    item: '[[w.selverstone-kennedy-withdrawal]], 158 (Sunday, Sept. 15: a church bombing in Birmingham kills four young girls; two boys shot dead in the streets that day)'
    units: B, C, D
- cite:
    id: cal.1963-09-17.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 158–59 (Kennedy to Lodge: "no good opportunity for action to remove present government in immediate future"; pressures to be applied; the day of the letter
      not given)'
    units: B
- cite:
    id: cal.1963-09-26.vietnam-congress
    item: '[[w.selverstone-kennedy-withdrawal]], 163 (Sept. 26: McGovern urges Kennedy to withdraw, the second senator after Morse)'
    units: A
- cite:
    id: cal.1963-11-01.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 196 (Nov. 1: the generals launch the coup that afternoon; Diệm and Nhu flee the Gia Long Palace, are picked up in Cholon the next morning and murdered in
      an armored personnel carrier)'
    units: A, D
- cite:
    id: cal.1964-01-30.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 217 (Jan. 30: Khánh overthrows the Minh junta in a bloodless coup; the neutralization fears he used)'
    units: A, B
- cite:
    id: cal.1964-01-16.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 218 (Johnson approves the 34A operations, to begin Feb. 1, "the greatest return for the least risk"; the day of approval not given)'
    units: A
- cite:
    id: cal.1964-02-21.vietnam
    item: '[[w.selverstone-kennedy-withdrawal]], 219 (Los Angeles, Feb. 21: aggression "directed and supplied by outside enemies," "a deeply dangerous game")'
    units: A
- variant:
    id: cal.1963-05-08.vietnam
    unit: C
    witness: w.selverstone-kennedy-withdrawal
    reads: killed and injured over twenty Vietnamese citizens
    at: '118'
- check:
    id: cal.1963-05-08.vietnam
    text: 'Check: Selverstone, 118, gives "killed and injured over twenty," not eight killed.'
- variant:
    id: cal.1963-08-21.vietnam
    unit: A
    witness: w.selverstone-kennedy-withdrawal
    reads: On the night of August 21, the GVN declared martial law, ransacked the pagodas
    at: '142'
- check:
    id: cal.1963-08-21.vietnam
    text: 'Check: Selverstone, 142, puts the raids and martial law on the night of Aug. 21, not Aug. 20–21.'
