      date: '1960-03-25'
      thread: china-leadership
      c: 'Tianjin, the meeting''s evening session; Deng Xiaoping reports the morning''s talks on the seventeen questions. Mao: "dare to think, speak, act" not without limit; grain everywhere has wrecked forestry and fishing; steel short, so small plants: "the center does not reach into your pocket, nor you into ours."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 25, 1960. Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
