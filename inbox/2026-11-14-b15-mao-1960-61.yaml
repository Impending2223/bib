      c: The Politburo agrees in the main with the delegation on the draft statement of the parties' conference, with twenty amendments, and passes Liu Shaoqi's speech; the delegation to settle the text (Zhou Enlai's telegram, 11 p.m. Nov. 8, after his talk with Mao). Mao that evening at Chervonenko's reception for the forty-third anniversary.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 8, 1960 (and Nov. 7). Made public: 2013. Names: Liu Shaoqi, Zhou Enlai, Mao Zedong, Chervonenko.'
