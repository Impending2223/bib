      c: 'The Yinian Tang, 5:50 p.m. Zhou Enlai reports to Mao the analysis of the delegation''s request on signing the Moscow statement (Chen Yi, Li Fuchun, He Long, Li Xiannian, Tan Zhenlin, Chen Boda, Bo Yibo, Luo Ruiqing, Wu Xiuquan, Zhou Yang): five cases; the likeliest, no secret resolution but the Twentieth Congress in the statement. The regional bureaus'' secretaries called to Peking for an enlarged Politburo.'
