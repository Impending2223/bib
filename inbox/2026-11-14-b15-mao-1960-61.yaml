      c: '*Hongqi* prints "Long Live Leninism," for Lenin''s ninetieth anniversary, drafted by Chen Boda and read by Mao Apr. 14–16: revisionism the main danger; peace and war, two hands. Of fifteen pages naming Mao, four left; Khrushchev''s name added on two; Mao strikes out his "paper tiger" of 1946. *Renmin ribao* reprints it Apr. 20.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, mid-Apr. 1960. Names: Chen Boda, Mao Zedong, Khrushchev, Deng Xiaoping. Check: Mao''s changes to the draft, secret until 2013.'
