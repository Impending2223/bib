      when: May 19
      date: '1960-05-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao, on the train past Zhuzhou, has Yang Shangkun tell Deng Xiaoping: mass meetings everywhere to back the Soviet stand on the four-power summit (broken up May 17), Peking''s the next day. May 20, 3.2 million march and meet in Peking.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 19, 1960, and note 72. Made public: 2013. Names: Mao Zedong, Yang Shangkun, Deng Xiaoping.'
