- add:
    entry:
      id: cal.1960-03-03.china-leadership
      when: Mar. 3
      date: '1960-03-03'
      thread: china-leadership
      c: Canton, Jijingkeng, evening. Mao's meeting of twenty-four (Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu, Tao Zhu, the ministers reading economics at Canton, the five Central-South first secretaries) on Guangdong's directive on five faults in the communes (haste to pass to commune ownership, the "levelling and transfers," the "communist wind" again, unpaid shares, waste), Jilin's report on technical revolution, Guizhou's on the mess halls, and Mao's drafts forwarding them. All agree to send them out.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 3, 1960 (and Mar. 1, 4). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu, Tao Zhu, Wang Renzhong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:li-fuchun
      - name:kang-sheng
      - name:tao-zhu
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-03.china-leadership-2
      when: Mar. 3
      date: '1960-03-03'
      thread: china-leadership
      also:
      - soviet-union
      - south-asia
      c: 'Canton, evening. Mao, Zhou Enlai, Li Fuchun, Kang Sheng and Hu Qiaomu on the draft oral notice of the Central Committee to the CPSU on the dispute with India: China keeps its view of the dispute''s causes and of the three parties'' stands; the CPSU''s criticisms not accepted; "let each keep its own view" and wait for the facts. Chen Yi reads it to the Soviet Ambassador, Mar. 10.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 3, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Kang Sheng, Hu Qiaomu, Chen Yi.'
