      c: 'The Qinzheng Hall. Mao receives the Cuban economic mission under Ernesto Guevara, President of the National Bank, at dinner; Zhou Enlai, Li Xiannian, Geng Biao present. Two Canadian banks left unnationalized: tactics, China has some too; reforms not too fast, to keep the petty and national bourgeoisie of Latin America.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 19, 1960. Made public: 2013. Names: Mao Zedong, Guevara, Zhou Enlai, Li Xiannian, Geng Biao.'
