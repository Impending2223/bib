      date: '1960-11-28'
      thread: china-leadership
      c: 'Mao drafts the Center''s comment on Gansu''s fourth report on the Emergency Letter, in the third person: Mao read it twice; he shares the fate of all who will correct errors; he too erred: the Beidaihe resolution''s three or four years for the passage to ownership by the whole people unreal; now seven years at least, twenty for pay by work; never again "levelling and transfers."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960. Made public: 2013. Names: Mao Zedong.'
