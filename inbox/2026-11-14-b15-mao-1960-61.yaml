      date: '1960-05-28'
      thread: china-leadership
      c: Shanghai, on the train. Mao receives Knud Jespersen, chairman of the Danish Communist Party, and his wife; Kang Sheng and Yang Shangkun present. The Moscow Declaration of 1957 the only one, now dropped by many parties; the seventeen parties' appeal wrong in important parts.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 28, 1960. Made public: 2013. Names: Mao Zedong, Jespersen, Kang Sheng, Yang Shangkun.'
