      date: '1960-10-22'
      thread: china-leadership
      also:
      - china
      c: 'The Yinian Tang. Mao receives Edgar Snow, at dinner; Gong Peng, Rewi Alley and George Hatem present. China too little studies America: the Academy should have an institute on it. Quemoy and Matsu in Kennedy''s and Nixon''s debates: China lets Chiang hold them, will not cut, even send, supplies; it wants all Taiwan and the Pescadores; perhaps two more spans of eleven years. A visit to America, perhaps at ninety-seven.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 22, 1960. Made public: 2013. Names: Mao Zedong, Snow, Gong Peng, Rewi Alley, George Hatem, Kennedy, Nixon, Chiang Kai-shek. Check: what Snow printed of it, *The Other Side of the River* (1962).'
