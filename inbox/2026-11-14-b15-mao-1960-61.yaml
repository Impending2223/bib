      c: The Huairen Tang, evening. Mao's meeting of the Standing Committee and the heads of the Ninth Plenum's groups on the plenum's order; Zhou Enlai on his visit to Burma and on Laos.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 12, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Ke Qingshi, Li Jingquan, Li Xuefeng, Liu Lantao, Tao Zhu, Song Renqiong.'
