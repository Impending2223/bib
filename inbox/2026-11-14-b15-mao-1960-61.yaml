      - name:stalin-joseph
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-21.china-leadership
      when: Nov. 21
      date: '1961-11-21'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Yinian Tang, evening. Mao with Chen Boda and others on the state of things since the Twenty-second Congress and theory: articles to be prepared; Chen proposes one, "The Historical Fate of Leninism."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 21, 1961. Made public: 2013. Names: Mao Zedong, Chen Boda.'
      tags:
      - polity:prc
