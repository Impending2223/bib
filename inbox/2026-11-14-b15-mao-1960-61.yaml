      c: 'Shanghai. Mao with Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Kang Sheng and Wang Jiaxiang on the delegation to Bucharest. Its line in six phrases: hold to unity, hold to principle, learn the facts, strike after being struck, argue with reason, leave room. June 12, the Center through Wu Xiuquan to the Soviet Ambassador: Peng Zhen, Kang, Wang and Xu Jianguo; two days at Moscow, talks with Khrushchev first if wished.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 11, 1960, and note 88. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Kang Sheng, Wang Jiaxiang, Wu Xiuquan, Xu Jianguo, Khrushchev.'
