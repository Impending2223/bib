      id: cal.1961-01-25.china-leadership
      when: Jan. 25
      date: '1961-01-25'
      thread: china-leadership
      c: 'The Juxiang Shuwu, evening. The Politburo Standing Committee (Mao, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping; Peng Zhen and Yang Shangkun attending): the work while Mao is away; Zhou on his talks with the GDR''s trade delegation. Mao leaves by train for the south.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 25, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Yang Shangkun.'
