      date: '1960-04-30'
      thread: china-leadership
      c: 'Tianjin, on the train. Mao with Tan Zhenlin, Liao Luyan, Liu Zihou and Wan Xiaotang after the rural work conference. Tan: the deaths in Fuyang, Anhui, isolated, rations above the reports. Mao: the real state unknown, to the center and to the provinces; grain hidden "because poor."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 30, 1960. Made public: 2013. Names: Mao Zedong, Tan Zhenlin, Liao Luyan, Liu Zihou, Wan Xiaotang, Yang Shangkun.'
