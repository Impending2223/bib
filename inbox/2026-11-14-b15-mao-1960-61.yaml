      when: Jan. 24
      date: '1961-01-24'
      thread: china-leadership
      also:
      - japan
      c: Mao receives Kuroda Hisao, adviser to the Japan Socialist Party, Tanaka Toshio and the Diet members Matsumoto Shichiro and Okada Haruo; Liao Chengzhi present. Mourning for Asanuma, who grasped the heart of Japan's relation to America; Japan stayed away from the "foreign ministers' talks" of the Philippines, Taiwan, South Korea and South Vietnam, fearing its people.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 24, 1961. Made public: 2013. Names: Mao Zedong, Kuroda Hisao, Tanaka Toshio, Matsumoto Shichiro, Okada Haruo, Liao Chengzhi, Asanuma.'
