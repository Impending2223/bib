      when: Jan. 9
      date: '1961-01-09'
      thread: china-leadership
      c: 'The Yinian Tang. Mao''s meeting of the Standing Committee and the regional secretaries on Hu Qiaomu''s draft "Three Main Rules and Eight Points" for Party and government cadres and the order of the work conference and the Ninth Plenum. Mao''s rules: start from the facts; raise the political level (exchange of equal values, pay by work); practice democratic centralism; the points in the positive ("speak kindly," not "beatings to be punished"). Whether to issue them now, when power is to be taken back in a fifth of the counties: to be discussed.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 9, 1961. Made public: 2013. Names: Mao Zedong, Hu Qiaomu, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Li Fuchun, Li Xiannian, Tan Zhenlin, Bo Yibo, Ke Qingshi, Li Jingquan, Tao Zhu.'
