      when: Feb. 27–29
      date: '1960-02-27'
      thread: china-leadership
      c: Canton, Jijingkeng, the evenings. Mao reads the drafts of the fourth volume of his *Selected Works*, with Kang Sheng, Hu Qiaomu and Tian Jiaying.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 27, 1960 (and Feb. 28, 29). Made public: 2013. Names: Mao Zedong, Kang Sheng, Hu Qiaomu, Tian Jiaying.'
