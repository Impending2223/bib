- add:
    entry:
      id: cal.1961-02-05.china-leadership
      when: Feb. 5
      date: '1961-02-05'
      thread: china-leadership
      c: 'Hangzhou, evening. Tian Jiaying reports to Mao his inquiry at the Hehe brigade, Weitang commune, Jiaxing county, Zhejiang: rice down from over 400 jin a mu to 291, chiefly the "five winds"; the brigade too big, eleven teams; the members against the mess halls. (Mao with the Zhejiang committee, Feb. 6 and 8: counties and communes too big, made for those above, not the masses.)'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 5, 1961 (and Feb. 6, 8). Made public: 2013. Names: Tian Jiaying, Mao Zedong, Jiang Hua.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-08.china-leadership
      when: Feb. 8
      date: '1961-02-08'
      thread: china-leadership
      also:
      - europe-and-the-alliance-france
      - africa-algeria-morocco
      c: 'Hangzhou, the Nanping pool. Mao receives François Mitterrand, senator, president of the UDSR; Hu Yuzhi present. The walls between France and China (ideology, systems, diplomacy, trade) not high, for a time; no relations now, that too for a time; America''s refusal no hurry. Algeria: negotiate as equals; independence recognized and all French troops out, then the million French can live with the eight million Muslims. China''s difficulties can be overcome, given time and peace.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 8, 1961. Made public: 2013. Names: Mao Zedong, Mitterrand, Hu Yuzhi, de Gaulle.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:mitterrand-francois
      - name:de-gaulle-charles
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-19.china-leadership
      when: Feb. 19
      date: '1961-02-19'
      thread: china-leadership
      c: 'Canton, evening. Chen Boda reports his inquiry and gives Mao the "Notes of an inquiry at some production teams of Guangdong''s communes": the small teams to be called production teams, the accounting units brigades; rich and poor villages forced together to be parted; levelling among teams and members now the question.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 19, 1961. Made public: 2013. Names: Chen Boda, Mao Zedong.'
      tags:
      - polity:prc
      - name:chen-boda
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-02-25.china-leadership
      when: Feb. 25
      date: '1961-02-25'
      thread: china-leadership
      c: 'Canton, Jijingkeng. Mao''s meeting with Tao Zhu, Chen Boda, Hu Qiaomu, Liao Luyan, Zhao Ziyang and Tian Jiaying: a set of working regulations for the rural communes, drafted by Mar. 10; Tao in charge, Chen deputy, Liao and Tian to write. Communes, brigades and teams all too big; three levels: commune, brigade, team. Peng Zhen''s proposed Party paper on grain not to go: "the center should issue fewer papers."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 25, 1961. Made public: 2013. Names: Mao Zedong, Tao Zhu, Chen Boda, Hu Qiaomu, Liao Luyan, Zhao Ziyang, Tian Jiaying, Peng Zhen.'
      tags:
      - polity:prc
