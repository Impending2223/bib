      when: Nov. 3
      date: '1960-11-03'
      thread: china-leadership
      c: 'The Center''s Emergency Directive Letter on the communes'' present policies (the "Twelve Articles"), revised by Mao and sent by telegram that afternoon: three-level ownership on the production brigade "unchanged at least seven years," to 1967; pay by work "at least twenty years"; household pigs encouraged; grain to "pass the test" by 1967; every cadre to study it in classes three winters running.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 3, 1960. Made public: 2013. To check: the Emergency Directive Letter (Twelve Articles), Nov. 3, 1960. Names: Mao Zedong, Zhou Enlai, Li Fuchun, Tan Zhenlin, Liao Luyan, Chen Zhengren, Chen Boda.'
