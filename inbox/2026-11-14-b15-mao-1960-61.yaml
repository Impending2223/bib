      c: 'Mao has Peng Dehuai''s letter of Jan. 2 printed for the conference: fifteen months'' reading since October 1959; the Soviet textbook''s third edition worse than the second and the first, "a technical economics," material incentives and experts stressed, peaceful transition seeping in.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 10, 1961. Made public: 2013. Names: Mao Zedong, Peng Dehuai.'
