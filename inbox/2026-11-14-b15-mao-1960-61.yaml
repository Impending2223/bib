      when: Dec. 24
      date: '1960-12-24'
      thread: china-leadership
      c: 'Peking. The Central Work Conference opens (to Jan. 13, 1961): the rectification of the communes and the "five winds," the 1961 plan, the report on the Moscow conference. Its minutes (sent out Jan. 20) add to the Twelve Articles: rectification at the bad communes first; whatever was levelled and transferred paid back in kind, 2.5 billion yuan from the state for it; the grain purchase price raised, not the sale price; private plots from 5 to 7 percent; pigs chiefly private; side lines and rural fairs allowed.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 24, 1960 (the entry for Dec. 24, 1960–Jan. 13, 1961). Made public: 2013. Names: Mao Zedong.'
