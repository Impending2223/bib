      id: cal.1961-03-13.china-leadership
      when: Mar. 13
      date: '1961-03-13'
      thread: china-leadership
      c: 'Mao, 8 a.m., to Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen and the Three North conference, by Tao Zhu: the two egalitarianisms, between teams in a brigade and between members in a team, "two extremely grave questions," to be studied in person; Deng and Peng to spend ten days in Miyun, Shunyi, Huairou: "you are still unclear on them, are you not?"'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Peng Zhen, Tao Zhu.'
