      when: June 21
      date: '1961-06-21'
      thread: china-leadership
      also:
      - japan
      c: The Yinian Tang. Mao receives the Japan Communist Party's Diet members' delegation under Shiga Yoshio, of its Politburo; Peng Zhen and Liao Chengzhi present. A party's past errors its property; "absolutism" allows none; Yan'an's "unity, criticism, unity"; Stalin killed his opponents.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 21, 1961. Made public: 2013. Names: Mao Zedong, Shiga Yoshio, Peng Zhen, Liao Chengzhi, Stalin.'
      tags:
      - polity:prc
