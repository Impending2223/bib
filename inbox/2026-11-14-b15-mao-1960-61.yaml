      date: '1961-01-03'
      thread: china-leadership
      c: 'The Yinian Tang, 10:20 p.m. Mao''s meeting of the Standing Committee, the departments and the regional bureaus hears Li Fuchun on the 1961 plan: the 1960 plan one for industry and transport, farming squeezed, targets high, power sent down too far; steel for 1961 at 19.5, 19 or 18.7 million tons. Mao: as coal, ore and transport allow.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 3, 1961. Made public: 2013. Names: Mao Zedong, Li Fuchun, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Li Xiannian, Tan Zhenlin, Chen Boda, Bo Yibo.'
