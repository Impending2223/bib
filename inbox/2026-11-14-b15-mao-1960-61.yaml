    entry:
      id: cal.1961-06-15.china-leadership
      when: June 15
      date: '1961-06-15'
      thread: china-leadership
      also:
      - vietnam-hanoi
      c: 'The Yinian Tang. Mao receives the DRV government delegation under Phạm Văn Đồng; Zhou Enlai and Luo Guibo present. No thanks for the experts: an internationalist duty; Vietnam on China''s southern front and the camp''s, and China above all bound to help.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 15, 1961. Made public: 2013. Names: Mao Zedong, Phạm Văn Đồng, Zhou Enlai, Luo Guibo.'
