      thread: china-leadership
      c: 'The Yinian Tang. Mao''s meeting of the Standing Committee and the regional bureaus'' first and second secretaries: the bureaus on the villages'' food and the rectification of the communes; how the work conference is to go. Mao: counties, communes and brigades about three good, five middling, two bad in ten, some of the bad with power seized; cadres in six classes, the first two counterrevolutionaries, the third the "dead bureaucrats," indirect allies of the enemy.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 23, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Tan Zhenlin, Chen Boda, Ke Qingshi, Zeng Xisheng, Tao Zhu, Wang Renzhong, Song Renqiong, Li Xuefeng, Li Jingquan, Liu Zihou.'
