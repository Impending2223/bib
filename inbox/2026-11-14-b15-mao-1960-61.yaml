      thread: china-leadership
      c: 'Peking, the Great Hall. The National People''s Congress opens its second session, Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao and Deng Xiaoping present: Li Fuchun on the 1960 plan (agriculture the base, industry the lead, steel the key), Li Xiannian on the budget. Mao had met the Standing Committee on it at 1:30.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 30, 1960. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Li Fuchun, Li Xiannian, Xu Bing.'
