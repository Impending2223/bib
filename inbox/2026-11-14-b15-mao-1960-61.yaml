      when: June 16
      date: '1961-06-16'
      thread: china-leadership
      also:
      - indonesia
      c: 'The Yinian Tang. Mao receives D. N. Aidit, chairman of the Indonesian Communist Party; Liu Shaoqi, Deng Xiaoping, Peng Zhen, Wang Jiaxiang present. Peaceful transition: perhaps a few in a hundred, the rest by arms. China still offers Chiang peace, never dropped; he fears it, and America fears it. Socialism new to China: eleven years without a full set of policies.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 16, 1961. Made public: 2013. Names: Mao Zedong, Aidit, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Wang Jiaxiang, Chiang Kai-shek.'
