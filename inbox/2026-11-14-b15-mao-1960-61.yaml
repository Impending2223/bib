      when: Feb. 1
      date: '1960-02-01'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao to Khrushchev, answering his letter of Jan. 23: China will send Kang Sheng, Liu Xiao, its Ambassador, and Wu Xiuquan to the Warsaw Treaty''s Political Consultative Committee, as observers.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 1, 1960. Made public: 2013. Names: Mao Zedong, Khrushchev, Kang Sheng, Liu Xiao, Wu Xiuquan.'
