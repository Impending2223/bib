- add:
    entry:
      id: cal.1960-01-06.china-leadership-2
      when: Jan. 6
      date: '1960-01-06'
      thread: china-leadership
      also:
      - china
      c: 'Mao on the *Qingbao jianxun* of Dec. 23, 1959, for Liu, Zhou, Zhu, Lin, Deng and Peng "to discuss international questions": America''s new moves on China after the Soviet–American talks; its effort to lower Chiang''s standing. Mao: Chiang fights to join international bodies; China, for three, five, ten years, indifferent to them all: "America comes to us, not we to America."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 6, 1960. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - polity:us
      - polity:roc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-07.china-leadership
      when: Jan. 7–17
      date: '1960-01-07'
      thread: china-leadership
      c: 'Shanghai. The enlarged Politburo meets, Mao presiding: the Politburo, the provinces'' first secretaries, the central departments. Reports: Li Fuchun, the 1960 plan and the three- and eight-year projections (approved); Lin Biao, defense; Nie Rongzhen, science; Lu Dingyi, education. 1960 to be another leap: steel 18.4 million tons, grain 600 billion jin; Britain overtaken by 1962; in eight years, the four modernizations and the passage to ownership by the whole people. Mess halls, urban communes. Mao''s opening, Jan. 7: the plan above all; the "frontier" weapons to be had in eight years, "kept, not used"; the Soviet textbook''s material incentives.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 7, 1960 (the entries for Jan. 7–17 and Jan. 7). Made public: 2013. Names: Mao Zedong, Li Fuchun, Lin Biao, Nie Rongzhen, Lu Dingyi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:li-fuchun
      - name:lin-biao
      - name:nie-rongzhen
      - name:lu-dingyi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-09.china-leadership
      when: Jan. 9
      date: '1960-01-09'
      thread: china-leadership
      c: 'Shanghai, the enlarged Politburo, after Ke Qingshi, Tao Zhu and Li Jingquan. Mao: productive forces to be freed still; the "communist wind" took the pigs; a reserve of grain; grain bought beyond the quota to be returned; water; timber wasted.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 9, 1960. Made public: 2013. Names: Mao Zedong, Ke Qingshi, Tao Zhu, Li Jingquan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:ke-qingshi
      - name:tao-zhu
      - name:li-jingquan
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-12.china-leadership
      when: Jan. 12
      date: '1960-01-12'
      thread: china-leadership
      c: 'The Central Committee to the Communist Youth League''s Secretariat, on the campaign to study Mao''s works: the formal slogan "study Marxism–Leninism, study Mao Zedong''s works"; "study Mao Zedong Thought" at home in ordinary use; the two not set side by side, Mao''s thought being Marxism–Leninism.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 12, 1960. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-13.china-leadership
      when: Jan. 13
      date: '1960-01-13'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Wu Xiuquan, on Mao''s instruction, sees Chervonenko that evening with words for Khrushchev, approved by the Standing Committee: thanks for his letter of Jan. 8 on the cut of 1.2 million men; the Central Committee supports the step; imperialism has not given up its plans for war, so the camp''s defense to be strengthened.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 13, 1960. Made public: 2013. Names: Mao Zedong, Wu Xiuquan, Chervonenko, Khrushchev.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:chervonenko-stepan-v
      - name:khrushchev-nikita-s
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1960-01-17.china-leadership
      when: Jan. 17
      date: '1960-01-17'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Shanghai, the enlarged Politburo''s last session; Mao speaks. One decision, the plan: steel 18.35 million tons for the National People''s Congress, 20 million the second account. The center''s departments and the provinces to read the Soviet *Textbook of Political Economy*, critically. Khrushchev''s trip to America good and bad; Sino-Soviet unity to be kept; "peaceful transition" opportunist, to be answered in articles; Lenin''s ninetieth anniversary, Apr. 22 (Deng). War inevitable while the bourgeoisie lasts, avoidable for a long time.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 17, 1960. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1960-01-22.china-leadership
      when: Jan. 22
      date: '1960-01-22'
      thread: china-leadership
      also:
      - china
      c: Peking, Diaoyutai, evening. The Politburo Standing Committee, Liu Shaoqi in the chair, on China and Burma and other matters. Zhou Enlai reports it to Mao at Hangzhou, Jan. 23, and meets Ne Win at the airport, Jan. 24.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 23, 1960 (Zhou''s report of the meeting of the evening before). Made public: 2013. Names: Liu Shaoqi, Zhou Enlai, Mao Zedong, Ne Win.'
      tags:
