      c: 'The Center to Liu Shaoqi, Deng Xiaoping and Peng Zhen, 11:30 p.m. (Zhou Enlai''s draft, approved by Mao and the enlarged Politburo; Mao''s meeting with the regional secretaries, 10:15): the peoples and parties fear a split; seek compromise and sign; if need be, the 1957 Declaration''s sentence on the Twentieth Congress; a statement either way. Nov. 29 the Soviets yield on four points; Liu signs Dec. 1.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960. Made public: 2013. Names: Zhou Enlai, Mao Zedong, Liu Shaoqi, Deng Xiaoping, Peng Zhen, Ke Qingshi, Zeng Xisheng, Tao Zhu.'
