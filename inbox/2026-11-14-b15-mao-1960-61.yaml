      - soviet-union
      c: 'Beidaihe, 11 a.m. The work conference''s last plenary session; Mao speaks. Hồ Chí Minh''s peacemaking "basically" welcome, his order of steps (the two parties, a preparatory committee, all the parties) the best of it. Ninety percent good people. At home: grain, autumn sowing wide and thin as well as close, "it rains when it will, the mother marries when she will: all on ourselves."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 10, 1960. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh.'
