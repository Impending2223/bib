      thread: china-leadership
      c: 'Mao writes the "Ten-Year Summary": eight years of copying foreign experience; from the "Ten Great Relationships" of 1956 a Chinese line begun; the general line and the leap, 1958; the communes found workable, their disorders; the targets of 1958–59 too high, the mistakes now to be owned.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 18, 1960. Made public: 2013. To check: *Jianguo yilai Mao Zedong wengao*, the "Ten-Year Summary". Names: Mao Zedong.'
