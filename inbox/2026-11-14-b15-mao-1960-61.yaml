      n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 9, 1960 (and Aug. 8, note 102). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Hồ Chí Minh, Liu Shaoqi, Peng Zhen, Wang Jiaxiang.'
