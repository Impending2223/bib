      c: 'The Qinzheng Hall, 5:30 p.m. Mao gives a dinner for Hồ Chí Minh, Lê Duẩn and others; Zhou Enlai, Zhu De, Deng Xiaoping, Peng Zhen, Chen Yi and others present. The eighty-one parties'' conference good: agreement, unity kept; "first peace, then quarrel, then peace." Ho''s cigarette again: since Bucharest the Soviets have thrown big ones, the experts, the petrol; at Moscow sixty-odd parties attacked China.'
