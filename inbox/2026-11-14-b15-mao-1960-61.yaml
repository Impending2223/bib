    entry:
      id: cal.1961-10-30.china-leadership
      when: Oct. 30
      date: '1961-10-30'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai, Building 12. The Standing Committee, Mao presiding, on the delegation''s request: to the congress''s open charges against Albania a silent protest, no articles; the regional first secretaries to meet Nov. 4. The same day Mao passes the Center''s directive on rural work: the team as the unit by inquiry and trial only, not yet general.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 30, 1961. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-02.china-leadership
      when: Nov. 2
      date: '1961-11-02'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai, Building 12, evening. The Politburo Standing Committee, Mao presiding, hears Peng Zhen on the Twenty-second Congress since Zhou Enlai''s return: a report on it to be made to the cadres.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 2, 1961. Made public: 2013. Names: Mao Zedong, Peng Zhen, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-05.china-leadership
      when: Nov. 5
      date: '1961-11-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai, evening. The enlarged Standing Committee with the regional first secretaries, Mao presiding: their meeting from Nov. 6 to take up the team as the accounting unit, grain, the Twenty-second Congress, and whether the National People''s Congress meets on time. Mao: at the congress Khrushchev exposed himself, peace with the enemy.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 5, 1961. Made public: 2013. Names: Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-12.china-leadership
      when: Nov. 12
      date: '1961-11-12'
      thread: china-leadership
      c: 'Diaoyutai, evening. The enlarged Standing Committee hears Deng Xiaoping and others on the regional secretaries'' meeting. Mao: no National People''s Congress session; instead, after the work conference of Dec. 20, a meeting of county secretaries, two a county, three a prefecture, four a province and a bureau, reporting Jan. 8: a small rectification; the center''s mistakes of these years to be told, "we bare our hearts first"; discipline, the whole before the part; ten days.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 12, 1961. Made public: 2013. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-14.china-leadership
      when: Nov. 14
      date: '1961-11-14'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'The Yinian Tang. Mao, Liu Shaoqi, Zhou Enlai and Deng Xiaoping give a dinner for Hồ Chí Minh, back from the Twenty-second Congress; Peng Zhen and Yang Shangkun present. Ho asks Mao and Liu to Vietnam again. Khrushchev against Albania is against China, Vietnam, Korea, the Japanese and Indonesian parties. Stalin "seven parts merit, three error": socialism built, Hitler beaten; the border undefended in 1941; the purge widened, seventy percent of the Seventeenth Congress.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Yang Shangkun, Hồ Chí Minh, Khrushchev, Stalin.'
      tags:
      - polity:prc
      - polity:drv
      - name:mao-zedong
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:deng-xiaoping
      - name:peng-zhen
      - name:ho-chi-minh
      - name:khrushchev-nikita-s
      - name:stalin-joseph
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1961-11-14.china-leadership-2
      when: Nov. 14
      date: '1961-11-14'
      thread: china-leadership
      c: Mao approves the Center's directive on socialist education in the villages, drafted by Tian Jiaying and passed by the Secretariat that afternoon.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 14, 1961. Made public: 2013. Names: Mao Zedong, Tian Jiaying.'
      tags:
