      c: 'Peking, the Qinzheng Hall, evening. Mao receives Hồ Chí Minh, back from Moscow; Liu Shaoqi, Zhou Enlai, Peng Zhen, Luo Ruiqing, and Hoàng Văn Hoan, Nguyễn Xuân Thủy and Võ Nguyên Giáp. Ho on the Soviet complaints: the east wind, the hundred flowers, the communes, the leap, the paper tiger, Genghis Khan''s tomb. Mao: easy to settle between the parties; offer the cigarette, do not throw it; since 1958 the Soviets'' joint fleet, the long-wave station, Port Arthur, refused.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 19, 1960. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh, Liu Shaoqi, Zhou Enlai, Peng Zhen, Luo Ruiqing, Hoàng Văn Hoan, Nguyễn Xuân Thủy, Võ Nguyên Giáp, Khrushchev.'
