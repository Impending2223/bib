      when: Apr. 19
      date: '1961-04-19'
      thread: china-leadership
      also:
      - cuba
      c: Nanchang. Mao receives the Cuban cultural delegation under Armando Hart Dávalos, Minister of Education; Chu Tunan and Shao Shiping present. American imperialism the greatest, oppressing all; Mao once a teacher, driven to revolution; intellectuals to be won and remolded, by persuasion.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 19, 1961. Made public: 2013. Names: Mao Zedong, Hart Dávalos, Chu Tunan, Shao Shiping. Check: the minister''s name: 达瓦洛斯 in the chronology.'
      tags:
      - polity:prc
