      id: cal.1961-03-01.china-leadership
      when: Mar. 1
      date: '1961-03-01'
      thread: china-leadership
      c: 'Mao initials Zhou Enlai''s letter: grain short by over 4.4 billion jin in the first half-year and 3 billion in the third quarter; 10 billion jin to be imported this year, 5.24 billion under contract, 5 billion in negotiation.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 1, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
