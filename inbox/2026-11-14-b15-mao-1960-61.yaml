    entry:
      id: cal.1961-01-20.china-leadership
      when: Jan. 20
      date: '1961-01-20'
      thread: china-leadership
      c: 'Mao to Tian Jiaying: three investigation groups of seven, led by Chen Boda (Guangdong), Hu Qiaomu (Hunan) and Tian (Zhejiang), each with his 1930 "On Investigation Work"; one team to the worst brigade, one to the best, ten to fifteen days; then to report to him at Canton and study industry there a month. He talks with Chen and Hu Jan. 22.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 20, 1961 (and Jan. 22). Made public: 2013. Names: Mao Zedong, Tian Jiaying, Chen Boda, Hu Qiaomu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - vis:only:prc
