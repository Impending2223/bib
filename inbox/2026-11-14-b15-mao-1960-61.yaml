- add:
    entry:
      id: cal.1960-03-04.china-leadership
      when: Mar. 4
      date: '1960-03-04'
      thread: china-leadership
      c: 'Mao''s drafts for the Center, sent to Liu Shaoqi and Deng Xiaoping for the Central Committee: Guangdong''s directive on the five faults, to be copied by every province and discussed down to the communes; Guizhou''s report on the mess halls, "to be copied without exception," a leap in five to ten years toward communism. The Politburo passes them, Mar. 5; they go out by air to the first secretaries.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 4, 1960 (and Mar. 3). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-07.china-leadership
      when: Mar. 7
      date: '1960-03-07'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Canton, evening. Mao receives Chervonenko, the new Soviet Ambassador; Yang Shangkun present. Ideology "leads the economy"; the Seven-Year Plan in four or five years good for the world; China poor, must hurry; the doubters of the general line, the leap and the communes inside and outside the Party not without reason: it is still to be proven, as the October Revolution was; urban communes being tried.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 7, 1960. Made public: 2013. Names: Mao Zedong, Chervonenko, Yang Shangkun.'
      tags:
      - polity:prc
      - polity:ussr
      - name:mao-zedong
      - name:chervonenko-stepan-v
      - vis:only:prc+ussr
- add:
    entry:
      id: cal.1960-03-08.china-leadership
      when: Mar. 8
      date: '1960-03-08'
      thread: china-leadership
      c: Mao revises Liu Shaoqi's draft directive of the Center on urban people's communes ("an active attitude" to trials and spread), adding that they will center on the big factory, the street and the offices and schools, with several kinds of ownership.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 8, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-15.china-leadership
      when: Mar. 15–17
      date: '1960-03-15'
      thread: china-leadership
      c: 'Hangzhou to Ningbo and back, on the train. Mao''s meeting of the first secretaries of East China (Ke Qingshi, Zeng Xisheng, Shu Tong, Jiang Weiqing, Jiang Hua, Yang Shangkui, Ye Fei), with Tan Zhenlin, and Li Jingquan from Mar. 16. Mao''s fourteen questions: mechanization and automation; mess halls for 80 percent; urban communes everywhere this year; the five faults; grain the key; coal, iron and steel, small plants in every county; aid to farming; schools; the forty articles early; the four pests. Mar. 17, at Ningbo: five movements (technical revolution, mess halls, urban communes, city aid to the villages, health).'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1960 (the entry for Mar. 15–17; and Mar. 16, 17). Made public: 2013. Names: Mao Zedong, Ke Qingshi, Zeng Xisheng, Shu Tong, Jiang Weiqing, Jiang Hua, Yang Shangkui, Ye Fei, Tan Zhenlin, Li Jingquan.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:ke-qingshi
      - name:tan-zhenlin
      - name:li-jingquan
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-15.china-leadership-2
      when: Mar. 15
      date: '1960-03-15'
      thread: china-leadership
      c: 'Mao''s comments for the Center on three reports, sent to Liu Shaoqi and Deng Xiaoping for the Central Committee: on the mess halls (to be "grasped hard" twice this year); Hunan''s on farming; Shandong''s on the hungry counties, cadres sent to twenty backward counties, and leaders who fail "removed at once." The Center passes them Mar. 18.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-16.china-leadership
      when: Mar. 16
      date: '1960-03-16'
      thread: china-leadership
      c: 'Mao drafts the Center''s directive on health work: the patriotic health campaign, slack in two years of the leap, revived, with results in 1960–62; and its comment on technical revolution, a great movement to be summed up by May. Both to Liu Shaoqi and Deng Xiaoping for issue.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 16, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-18.china-leadership
      when: Mar. 18
      date: '1960-03-18'
      thread: china-leadership
      also:
      - south-asia
      c: Hangzhou, the Hangzhou Hotel, evening. Mao receives B. P. Koirala, Prime Minister of Nepal (on Nepal with Zhou Enlai and Chen Yi that morning). China wants not an inch of Nepal's land, or India's; the boundary to be marked, with a strip on both sides unpatrolled and no regular troops; a treaty of friendship and nonaggression like Burma's if Nepal wishes; self-reliance first.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 18, 1960. Made public: 2013. Names: Mao Zedong, Koirala, Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:nepal
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yi
      - name:koirala-bisweswar-prasad
      - vis:only:prc+nepal
- add:
    entry:
      id: cal.1960-03-21.china-leadership
      when: Mar. 21
      date: '1960-03-21'
      thread: china-leadership
      c: 'Mao on the Foreign Ministry''s draft telegram to the Ambassador at Ulan Bator (China welcomes a treaty of friendship and cooperation; Zhou Enlai to sign it there): agreed; copies to the Soviet Union, Korea and Vietnam; if Korea and Vietnam want such treaties, or treaties of alliance with military aid, that too may do. For the Center to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 21, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:mongolia
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1960-03-22.china-leadership
      when: Mar. 22
      date: '1960-03-22'
      thread: china-leadership
      c: 'Jinan. Mao''s comment for the Center on the Anshan Party committee''s report on technical revolution: Anshan''s steel works, once for one-man management and the "Magnitogorsk constitution," has made an "Anshan constitution" (mass movement, Party committee leadership, cadres in labor and workers in management).'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. Made public: 2013. Names: Mao Zedong.'
