- add:
    entry:
      id: cal.1961-04-25.china-leadership
      when: Apr. 25
      date: '1961-04-25'
      thread: china-leadership
      c: 'Hangzhou, 9 a.m. Mao to Deng Xiaoping: a notice calling a work conference at Peking May 15 (the drafting committee of the Sixty Articles May 9), to finish Canton''s work: the members'' and cadres'' views, the Sixty Articles revised, the "five winds"; meanwhile ten to fifteen days'' inquiry into mess halls, grain, supply, hills and forests, draught animals, repayment, handicrafts, supply cooperatives. Settled that evening with Zhou Enlai, Deng and Tian Jiaying.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 25, 1961. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Zhou Enlai, Tian Jiaying.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-04-26.china-leadership
      when: Apr. 26
      date: '1961-04-26'
      thread: china-leadership
      c: 'Peking. The Secretariat, Deng Xiaoping presiding, hears Mao''s views: the Sixty Articles in part wrongly put; ownership not settled (the draught animals to brigade or team?); the mess halls, once "socialism''s heart," "if the masses are unhappy, down this year or next"; most supply systems untenable; the Twelve Articles not carried out, repayment incomplete; the peasants the losers.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 26, 1961. Made public: 2013. Names: Deng Xiaoping, Mao Zedong.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-07.china-leadership
      when: May 7
      date: '1961-05-07'
      thread: china-leadership
      c: 'Mao, 4 a.m., has Zhou Enlai''s telephone report from Handan sent to every bureau and province: nearly all members want to cook at home, and Zhou is arranging the mess halls'' closing; supply only for the "five guarantees" households and the needy; work points as in the higher cooperatives, output contracted to the teams, work to groups.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 7, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-13.china-leadership
      when: May 13
      date: '1961-05-13'
      thread: china-leadership
      c: 'Mao sends round Deng Xiaoping''s and Peng Zhen''s telephone report of May 10 on a month''s inquiry near Peking, in Shunyi and Huairou: smaller communes and brigades have roused the members; most teams for nine-tenths of contracted output sold, one kept, and of the surplus four sold, six kept.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 13, 1961. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
