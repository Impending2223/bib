      thread: china-leadership
      also:
      - africa-algeria-morocco
      c: Wuchang, the Hongshan Hotel. Mao receives the delegation of the Algerian Provisional Government under Krim Belkacem, Vice Premier and Foreign Minister; Yang Shangkun and Ji Pengfei present. Support "not only moral but material"; independence only by fighting; talk and fight both.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 17, 1960. Made public: 2013. Names: Mao Zedong, Krim Belkacem, Yang Shangkun, Ji Pengfei, Li Qiang.'
