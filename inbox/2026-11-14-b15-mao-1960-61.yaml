      thread: china-leadership
      c: 'Deng Zihui reports to Mao on his inquiries in Fenyang, Shijiazhuang and Wuxi, September–October: the communes'' system to be adjusted further, three-level ownership on the brigade fixed, the small teams some autonomy, private plots and side lines, pay honored; regulations for the communes proposed.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 21, 1960. Made public: 2013. Names: Deng Zihui, Mao Zedong.'
