      c: 'Tianjin, on the train. Mao receives Blas Roca, general secretary of Cuba''s Popular Socialist Party, and his wife; Deng Xiaoping, Yang Shangkun, Wu Xiuquan present. The Cuban revolution "a nail at America''s side," of world meaning. On the party''s draft program: more on the national bourgeoisie and Latin America; wages with output; free medicine promised too soon in China, half-free better.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 29, 1960. Made public: 2013. Names: Mao Zedong, Blas Roca, Deng Xiaoping, Yang Shangkun, Wu Xiuquan.'
