      c: 'The Huairen Tang. The enlarged Politburo, Zhou Enlai presiding, with the regional bureaus'' first and second secretaries: the five cases. If the statement keeps the Twentieth Congress, most against signing, a few for. That evening Zhou reports to Mao''s meeting.'
