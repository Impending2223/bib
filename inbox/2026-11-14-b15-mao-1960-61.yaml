      - name:peng-zhen
      - name:stalin-joseph
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-30.china-leadership
      when: June 30
      date: '1961-06-30'
      thread: china-leadership
      c: 'The Great Hall. The rally for the Party''s fortieth anniversary, Zhou Enlai in the chair; Liu Shaoqi speaks. Mao, revising his draft (of June 23, after the Standing Committee on the celebrations that day): a great socialist state "a very long time" off, communism "a longer historical period"; socialism not "deep-rooted"; China "on the road to standing up," not "to wealth and power."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 30, 1961 (and late June, June 23). Names: Mao Zedong, Zhou Enlai, Liu Shaoqi. Check: Mao''s changes to the speech, secret until 2013; the speech as printed.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:liu-shaoqi
- add:
    entry:
      id: cal.1961-07-08.china-leadership
      when: July 8
      date: '1961-07-08'
      thread: china-leadership
      c: 'Bengbu, on the train. Zeng Xisheng reports to Mao on Anhui''s "responsibility fields": every member now cares for output, not the team leader alone; the faults, self-interest, yearly readjustment. Mao: if you find no fault, spread it; if it truly helps, do more. (July 6 at Tianjin, to Liu Zihou''s proposal of the team as the accounting unit: "try it"; July 7, Shandong already does it.)'
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 8, 1961 (and July 6, 7). Made public: 2013. Names: Mao Zedong, Zeng Xisheng, Liu Zihou.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-07-13.china-leadership
      when: July 13
      date: '1961-07-13'
      thread: china-leadership
      also:
      - korea
      - soviet-union
      - testing
      c: Hangzhou, the Wang Villa. Mao receives Kim Il Sung, at lunch; Zhou Enlai, Chen Yi and Jiang Hua present. Will war come? Both sides fear, imperialism more; it attacks only if the camp splits; Khrushchev "much improved." Tests cannot really stop; conventional forces not to be cut; nuclear weapons perhaps banned, like gas; the next war conventional. China is making the bomb, the year uncertain; it would need tens, hundreds. July 14, Mao returns the call; Kim leaves July 15.
      n: '[[w.zedong-mao-zedong-nianpu]], V, July 13, 1961 (and July 14). Made public: 2013. Names: Mao Zedong, Kim Il Sung, Zhou Enlai, Chen Yi, Jiang Hua, Khrushchev.'
      tags:
      - polity:prc
      - polity:dprk
      - name:mao-zedong
      - name:kim-il-sung
      - name:zhou-enlai
      - name:chen-yi
      - name:khrushchev-nikita-s
      - vis:only:prc+dprk
- add:
    entry:
      id: cal.1961-08-16.china-leadership
      when: Aug. 16
      date: '1961-08-16'
      thread: china-leadership
      also:
      - africa
      c: 'Hangzhou, the Wang Villa. Mao receives Kwame Nkrumah, President of Ghana, at dinner; Zhou Enlai present; at 11:30 p.m. he returns the call. Nkrumah: in visiting the socialist states he casts Ghana''s lot with socialism. Mao: China''s experience for reference only; do not copy, as China once did.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 16, 1961. Made public: 2013. Names: Mao Zedong, Nkrumah, Zhou Enlai, Zhou Jianren.'
      tags:
      - polity:prc
      - polity:ghana
      - name:mao-zedong
      - name:nkrumah-kwame
      - name:zhou-enlai
      - vis:only:prc+ghana
- add:
    entry:
      id: cal.1961-08-18.china-leadership
      when: Aug. 18
      date: '1961-08-18'
      thread: china-leadership
      also:
      - latin-america
      c: 'Hangzhou, evening. Mao receives João Goulart, Vice President of Brazil, and his party; Chen Yi present. Goulart: Brazil''s policy changing, he heads a mission to begin trade, the first Latin American leader in office to visit. Mao: the obstacle only American imperialism, its government and monopolies, not its people; trade first, then political relations.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 18, 1961. Made public: 2013. Names: Mao Zedong, Goulart, Chen Yi.'
      tags:
      - polity:prc
      - polity:brazil
      - name:mao-zedong
      - name:goulart-joao
      - name:chen-yi
      - vis:only:prc+brazil
- add:
    entry:
      id: cal.1961-08-23.china-leadership
      when: Aug. 23–Sept. 16
      date: '1961-08-23'
      thread: china-leadership
      c: 'Lushan. The Central Work Conference, Mao presiding (its order set by the enlarged Standing Committee with the regional first secretaries, Aug. 23): grain, markets, the plans for 1961–62 and industry, the regulations for state enterprises and the higher schools, the training of cadres. Adopted: the Center''s directive on industry ("retreat where we must, and enough"; seven years of "adjust, consolidate, fill out, raise," three with adjustment first); the "Seventy Articles" on industry; the "Sixty Articles" on the higher schools; the decision on training cadres. Coal over 500 million and steel over 15 million tons for the two years; 1961''s steel from 11 to 8.5 million.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 23, 1961 (the entries for Aug. 23–Sept. 16 and Aug. 23). Made public: 2013. To check: the Working Regulations for State Industrial Enterprises (draft), Sept. 1961. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-08-31.china-leadership
      when: Aug. 31
      date: '1961-08-31'
      thread: china-leadership
      c: 'Lushan. The enlarged Standing Committee, Mao presiding. Deng Xiaoping on industry: the plans mostly no plans; output and building "mostly paralyzed"; adjustment the center of the eight characters, two or three years, "only a full retreat lets us adjust." Li Fuchun on the plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Aug. 31, 1961. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Li Fuchun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:li-fuchun
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-01.china-leadership
      when: Sept. 1
      date: '1961-09-01'
      thread: china-leadership
      c: 'Lushan. Mao''s meeting of the regional first secretaries. Zhou Enlai: coal 500 million and steel 15 million tons for the two years. Mao: not pessimistic, a refilling, like the Red Army''s after the Long March, its 20,000 grown to 1.2 million. Chen Yun''s small meetings by industry to bring out the questions: agreed.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 1, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - name:chen-yun
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-05.china-leadership
      when: Sept. 5
      date: '1961-09-05'
      thread: china-leadership
      c: 'Lushan, the work conference. Deng Xiaoping, asked by the Standing Committee Sept. 4 to speak before leaving for the Korean party''s Fourth Congress: the last three years, above all two; the aims of three years'' adjustment; methods; central unity with management by levels; "with one understanding, it is easy."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 4, 1961 (and Sept. 5). Made public: 2013. Names: Deng Xiaoping, Mao Zedong.'
      tags:
      - polity:prc
      - name:deng-xiaoping
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-15.china-leadership
      when: Sept. 15
      date: '1961-09-15'
      thread: china-leadership
      c: 'Lushan. The enlarged Standing Committee, Mao presiding: on the "four highs" (targets, estimates, procurement, allotments), ownership and distribution "no breach of faith with the people"; "we have retreated to the limit, to the valley floor; now climb steadily." The directive on industry, the higher schools'' regulations and the decision on cadres passed by the enlarged Secretariat, approved (Peng Zhen''s letter).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 15, 1961. Made public: 2013. Names: Mao Zedong, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-23.china-leadership
      when: Sept. 23
      date: '1961-09-23'
      thread: china-leadership
      also:
      - europe-and-the-alliance-britain
      c: 'Wuchang, the East Lake guesthouse. Mao receives Field Marshal Montgomery, at dinner; Wang Renzhong present (Mao had talked with Xiong Xianghui and Pu Shouchang the day before on Montgomery''s wish to know his successor). China twelve years on: no experience of socialism; in 1949 the economy, the land, the imperialists'' remnants; the future always bright, the road made by walking; floods and drought.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 23, 1961 (and Sept. 22). Made public: 2013. Names: Mao Zedong, Montgomery, Wang Renzhong, Xiong Xianghui, Pu Shouchang.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:montgomery-of-alamein-bernard-l
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-24.china-leadership
      when: Sept. 24
      date: '1961-09-24'
      thread: china-leadership
      also:
      - europe-and-the-alliance-britain
      c: 'Wuchang. Mao sees Montgomery again; Wang Renzhong present. One five-year plan left, to meet Marx at seventy-three. His successor: "clearly Liu Shaoqi," the first vice-chairman; after Liu, "not my affair." No war with America wanted; with conventional arms China can cope. Nuclear weapons will not be used: the more made, the less nuclear war.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 24, 1961. Made public: 2013. Names: Mao Zedong, Montgomery, Wang Renzhong, Liu Shaoqi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:montgomery-of-alamein-bernard-l
      - name:liu-shaoqi
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-26.china-leadership
      when: Sept. 26
      date: '1961-09-26'
      thread: china-leadership
      c: 'Handan, on the train. Mao hears the Hebei and Shandong committees (Liu Zihou, Zhou Xing) on the "big contract": production on the "feet" (the team), distribution on the "waist" (the brigade), egalitarianism; the "three contracts and one reward," 1,128 accounts in a Baoding brigade, "scholasticism"; a Tang county commune that never pooled at the brigade grew every year.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 26, 1961. Made public: 2013. Names: Mao Zedong, Liu Zihou, Zhou Xing.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-09-28.china-leadership
      when: Sept. 28
      date: '1961-09-28'
      thread: china-leadership
      also:
      - cuba
      c: The Qinzheng Hall, evening. Mao receives Osvaldo Dorticós, President of Cuba; Liu Shaoqi, Zhou Enlai, Chen Yi present. Cuba "a surprise to America, not a pleasant one"; China fought twenty-two years and can handle a conventional war; economic building something new, learned slowly.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 28, 1961. Made public: 2013. Names: Mao Zedong, Dorticós, Liu Shaoqi, Zhou Enlai, Chen Yi.'
      tags:
      - polity:prc
      - polity:cuba
      - name:mao-zedong
      - name:dorticos-torrado-osvaldo
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:chen-yi
      - vis:only:prc+cuba
- add:
    entry:
      id: cal.1961-09-29.china-leadership
      when: Sept. 29
      date: '1961-09-29'
      thread: china-leadership
      c: 'Mao to the Standing Committee and others, with Geng Changsuo''s letter and the Shandong, Hubei, Hebei and Handan papers: severe egalitarianism remains, "what the Sixty Articles lack": production with the team, distribution with the brigade. His view: "three-level ownership, the team the base," the team, not the brigade, the accounting unit; to be settled at the December work conference after inquiry by every level.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 29, 1961. Made public: 2013. Names: Mao Zedong, Geng Changsuo.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
