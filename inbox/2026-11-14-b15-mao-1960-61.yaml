      thread: china-leadership
      c: 'Mao''s note for the Three South conference on his "On Investigation Work" (spring 1930), against "book worship," lost thirty years and found in January at the Revolutionary Museum, from the Longyan prefecture: printed for the meeting.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 11, 1961. Made public: 2013. Names: Mao Zedong.'
