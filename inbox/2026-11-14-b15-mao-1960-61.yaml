      id: cal.1961-04-16.china-leadership
      when: Apr. 16
      date: '1961-04-16'
      thread: china-leadership
      c: 'Changsha, the Rong Garden, evening. Mao''s meeting with Liu Shaoqi, Tao Zhu, Wang Renzhong, Hu Qiaomu and others: the mess halls, all agree, the thing most cut off from the masses and least liked, a hindrance to output and to famine relief. (Apr. 15, Mao had Hu''s inquiry on the mess halls printed for Hunan''s three-level cadre meeting.)'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 16, 1961 (and Apr. 15). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Tao Zhu, Wang Renzhong, Hu Qiaomu, Zhang Pinghua.'
