      c: 'Zhengzhou. Mao receives Iraqi cultural and workers'' delegations and the trade unions of Iran and Cyprus; Yang Shangkun and Liu Ningyi present. Iraq''s revolution of July 14, 1958 frightened imperialism: the landing in Lebanon the next day.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 9, 1960. Made public: 2013. Names: Mao Zedong, Yang Shangkun, Liu Ningyi. Check: what the press printed of the talk.'
