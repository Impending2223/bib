    entry:
      id: cal.1961-01-23.china-leadership
      when: Jan. 23
      date: '1961-01-23'
      thread: china-leadership
      c: 'The Yinian Tang. Mao with the Panchen Lama; Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Li Weihan and Zhang Jingwu present. Tibet''s "left" to be corrected: mutual-aid teams, no cooperatives; the three thousand patriotic notables kept, given posts; some thousands of lamas to stay in study; Communists to study the religions.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 23, 1961. Made public: 2013. Names: Mao Zedong, Panchen Lama, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping, Li Weihan, Zhang Jingwu.'
