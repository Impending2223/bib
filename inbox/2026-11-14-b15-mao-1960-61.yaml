- add:
    entry:
      id: cal.1961-03-05.china-leadership
      when: Mar. 5
      date: '1961-03-05'
      thread: china-leadership
      c: 'Canton. The enlarged Standing Committee, Mao presiding; Zhou Enlai on industry and supply. Mao on the communes since the second Zhengzhou meeting: before Lushan the facts known, after it the fight on the right silenced the truth (Henan''s 24 billion jin reported as over 40) and brought high estimates, high procurement; the fight on the left, four months, cut off by Peng Dehuai; Anhui, Shandong, Henan, Gansu too late to care for the people''s food.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 5, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Peng Dehuai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Tao Zhu.'
