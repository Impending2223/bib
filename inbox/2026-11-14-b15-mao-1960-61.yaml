      thread: china-leadership
      also:
      - south-asia
      - soviet-union
      c: 'Wuchang, evening. Zhou Enlai and Chen Yi report to Mao on their visits to Burma, India, Nepal, Cambodia and Vietnam; Sino-American relations, Sino-Soviet unity. Mao to Zhou, the same day: Eisenhower''s statement of May 11 on the U-2 "very important."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 16, 1960. Made public: 2013. Names: Zhou Enlai, Chen Yi, Mao Zedong, Eisenhower.'
