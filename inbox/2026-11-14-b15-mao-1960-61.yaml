      c: 'Mao on the points of Kuusinen''s speech of Apr. 22 at Moscow for Lenin''s anniversary (dogmatism behind the times; new weapons make war impossible; sober statesmen in the imperialist camp): "this must be criticized"; an article, "A Discussion with Comrade Kuusinen," for a few at the center first, then perhaps in print or for senior cadres only. To Yang Shangkun, Deng Xiaoping and Chen Boda.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, late Apr. 1960. Made public: 2013. Names: Mao Zedong, Kuusinen, Yang Shangkun, Deng Xiaoping, Chen Boda.'
