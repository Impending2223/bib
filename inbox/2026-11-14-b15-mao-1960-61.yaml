      when: Mar. 14
      date: '1961-03-14'
      thread: china-leadership
      c: 'Canton. The enlarged Standing Committee, Mao presiding, with the Three North conference''s men arrived (Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen and the regional secretaries): the draft regulations, too long and too mixed, to be revised; the meeting to end on the 20th.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 14, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Ke Qingshi, Li Jingquan, Li Xuefeng, Liu Lantao, Tao Zhu, Song Renqiong.'
