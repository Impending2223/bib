      c: 'Mao and Chen Yun, evening. Chen had written Oct. 3, after eight days at Tianjin and seven at Jinan with the Hebei and Shandong committees: he would go to Hebei, Shandong, Henan, northern Jiangsu and northern Anhui to learn the famine and how it is borne, and the conditions of recovery in two or three years, and report.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Oct. 6, 1960 (and Chen''s letter of Oct. 3). Made public: 2013. Names: Mao Zedong, Chen Yun.'
