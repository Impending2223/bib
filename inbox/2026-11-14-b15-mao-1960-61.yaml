    entry:
      id: cal.1961-01-14.china-leadership
      when: Jan. 14–18
      date: '1961-01-14'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Huairen Tang. The Ninth Plenum of the Eighth Central Committee, Mao presiding. Deng Xiaoping on the Moscow conference: the delegation approved, the Statement and the Appeal endorsed. Li Fuchun on the plans for 1960 and 1961; Chen Yun on steel and grain. Agriculture first; building cut; "adjust, consolidate, fill out, raise"; rural markets revived; rectification by stages; six regional bureaus of the Center set up. (The Standing Committee hears the groups Jan. 15 and 17.) The communique, revised by Mao Jan. 20, printed Jan. 21.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 14, 1961 (the entry for Jan. 14–18; and Jan. 15, 20). Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Li Fuchun, Chen Yun, Liu Shaoqi. Check: the communique as printed, *Renmin ribao*, Jan. 21, 1961; the plenum itself secret until then.'
      tags:
      - polity:prc
