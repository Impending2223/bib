      n: '[[w.zedong-mao-zedong-nianpu]], IV, Sept. 7, 1960, and note 114. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Khrushchev, Eisenhower, Adenauer.'
