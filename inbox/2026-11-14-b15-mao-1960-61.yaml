    entry:
      id: cal.1961-03-15.china-leadership
      when: Mar. 15
      date: '1961-03-15'
      thread: china-leadership
      c: 'Canton, morning. Zeng Xisheng and Tan Qilong report to Mao on Anhui''s "responsibility fields." Mao: "Try it! If it goes wrong, make a self-criticism"; a billion jin more grain would be a big thing. Zeng telephones Anhui: "it has reached the top." Mao later, through Ke Qingshi: on a small scale. (Mar. 18 Tian Jiaying sends him Susong county''s report on contracting output to households; Mao passes it to Zeng and the Standing Committee.)'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1961 (and Mar. 18). Made public: 2013. Names: Mao Zedong, Zeng Xisheng, Tan Qilong, Ke Qingshi, Tian Jiaying.'
