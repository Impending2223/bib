      when: Nov. 15
      date: '1960-11-15'
      thread: china-leadership
      c: 'Mao to Zhou Enlai, on the report of ten thousand central cadres sent down: amid the "fine situation," a time to speak at length of the bad third of the country: bad men in power, beatings and deaths, grain down, hunger, the democratic revolution unfinished, feudal forces at work. The same day Lin Biao''s letter of Nov. 10 (troops not to report on the localities to the Party, lest the army interfere) to be followed.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Li Fuchun, Xiao Hua.'
