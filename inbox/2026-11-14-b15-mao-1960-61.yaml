      when: July 5
      date: '1960-07-05'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Beidaihe. The Central Work Conference opens (July 5–Aug. 10), on the world and on cutting back at home: the enlarged Politburo Standing Committee, Mao presiding, hears Peng Zhen on Bucharest and first secretaries on farms and factories. Mao: agriculture truly the base, squeezed ten years; rest and food for the people; the communes'' three levels of ownership; industry''s front shortened; 30 million tons of steel in 1962 with the full range of kinds, no 100 million by 1969. The conference''s directives: grain and steel first; "all the Party to farming, to grain"; an urgent drive for purchase for export; building cut; one account in the plans, not two; the frontier weapons.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, July 5, 1960 (and the entry for July 5–Aug. 10). Made public: 2013. Names: Mao Zedong, Peng Zhen, Liu Shaoqi, Zhu De, Chen Yun, Deng Xiaoping, Dong Biwu, Li Fuchun, He Long, Li Xiannian, Ke Qingshi, Li Jingquan, Tan Zhenlin, Lu Dingyi, Chen Boda, Kang Sheng, Bo Yibo, Wang Jiaxiang.'
