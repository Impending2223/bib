      date: '1960-12-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Yinian Tang, evening. Chervonenko and two counselors bring Mao the CPSU''s greetings on his birthday; Yang Shangkun present. Mao: the Moscow conference good, the drafting commission''s work much; argument "not a bad thing"; a plenum in January to back the two documents; industry''s front to be shortened in 1961, heavy industry and building above all.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 26, 1960. Made public: 2013. Names: Mao Zedong, Chervonenko, Yang Shangkun.'
