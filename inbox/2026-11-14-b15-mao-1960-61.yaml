    item: '[[w.zedong-mao-zedong-nianpu]], IV, June 5, 1960 (the CPSU''s letter of June 2 as Peking read it: a meeting of the twelve ruling parties at Bucharest during the Romanian party''s congress, a Warsaw Treaty session after, China, Korea and Mongolia as observers; Mao, with Kang Sheng and Yang Shangkun, would rather a later and wider meeting, of sixty-odd parties, in November, with a declaration drafted first by the two parties)'
    units: '?'
- cite:
    id: cal.1960-06.soviet-union
    item: '[[w.zedong-mao-zedong-nianpu]], IV, June 23, 1960, and note 95 (June 22, Khrushchev''s attack on the Chinese delegation under Peng Zhen; June 23, the CPSU''s letter of June 21 answering "Long Live Leninism," handed to the delegation after the other parties had it, and the draft communique; June 24, the twelve parties'' meeting; at Shanghai, Mao, Liu Shaoqi, Zhou Enlai and Chen Yun on the letter and communique, June 23–27)'
    units: '?'
- cite:
    id: cal.1960-06-18.japan-and-korea-far-east
    item: '[[w.zedong-mao-zedong-nianpu]], IV, June 16, 1960 (the shelling decided at Shanghai by the enlarged Standing Committee, June 16; the Fujian front''s message, June 17, of shelling to "greet and see off" Eisenhower, on the eve of his arrival June 17 and at his leaving June 19)'
    units: '?'
- cite:
    id: cal.1960-07.china
    item: '[[w.zedong-mao-zedong-nianpu]], IV, July 16, 1960 (the Soviet government''s note of July 16 recalling the experts; on July 25, before China answered, word that all would begin leaving July 28 and be gone by Sept. 1)'
    units: '?'
- cite:
    id: cal.1960-08.vietnam-hanoi
    item: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 9, 1960, and note 102 (Hồ Chí Minh at Beidaihe from Aug. 7, "to make peace," with the Lao Động party''s points proposed to the Soviet and Chinese parties; Zhou Enlai and Deng Xiaoping talk with him Aug. 8–9, Mao Aug. 10; he goes on to Moscow and is back in Peking Aug. 19)'
    units: '?'
- cite:
    id: cal.1960-11.soviet-union
    item: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 28, 1960 (Peking''s side: the delegation under Liu Shaoqi and Deng Xiaoping; Deng''s speech Nov. 14; the Center''s instruction Nov. 17 not to sign unless the statement is changed, then, Nov. 28, after two days of the enlarged Politburo, to seek compromise; Nov. 29 the Soviets drop the charge of factionalism, the cult of personality and a secret resolution and keep the Twentieth Congress in the Declaration''s words; Liu signs Dec. 1)'
    units: '?'
- cite:
    id: cal.1961-06.vietnam-hanoi-3
    item: '[[w.zedong-mao-zedong-nianpu]], IV, June 15, 1961 (Mao receives Phạm Văn Đồng''s government delegation at Peking, June 15: China''s aid an internationalist duty, Vietnam the camp''s southern front)'
    units: '?'
- cite:
    id: cal.1961-10-17.berlin-and-vienna
    item: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 18, 1961 (Peking''s side of the congress: Zhou Enlai leads the delegation; on Khrushchev''s open attack on the Albanian party in his report, Mao approves, Oct. 18, a passage for Zhou''s greetings against it; Oct. 19 the Standing Committee prints the report in summary only; Zhou back Oct. 24)'
    units: '?'
