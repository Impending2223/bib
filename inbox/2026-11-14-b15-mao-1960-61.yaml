      c: 'Mao approves Zhou Enlai''s proposal of Oct. 31: a team under Zhang Hanfu and Ye Jizhuang to negotiate trade and the aid projects anew with the Soviet Union, in Peking if possible.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 5, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Zhang Hanfu, Ye Jizhuang.'
