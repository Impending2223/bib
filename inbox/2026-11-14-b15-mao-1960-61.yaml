      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 8, 1960 (and June 5). Made public: 2013. Names: Mao Zedong, Kang Sheng, Yang Shangkun, Zhou Enlai, Liu Shaoqi, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Ke Qingshi, Li Jingquan, Ulanhu, Tao Zhu.'
