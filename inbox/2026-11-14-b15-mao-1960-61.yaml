      - name:deng-xiaoping
      - name:peng-zhen
      - name:ho-chi-minh
      - name:le-duan
      - vis:only:prc+drv
- add:
    entry:
      id: cal.1961-10-18.china-leadership
      when: Oct. 18
      date: '1961-10-18'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Zhongnanhai, Mao''s house by the pool. Mao, Liu Shaoqi, Deng Xiaoping and Yang Shangkun on the passage the delegation would add to Zhou Enlai''s greetings to the Twenty-second Congress, against Khrushchev''s open attack on the Albanian party in his report: Mao agrees.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 18, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping, Yang Shangkun, Zhou Enlai, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:zhou-enlai
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-19.china-leadership
      when: Oct. 19
      date: '1961-10-19'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Standing Committee, Mao presiding, at his house: an enlarged Politburo to hear the Center''s line on the Twenty-second Congress and its support for the Albanian party; Khrushchev''s report to be printed in summary only.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 19, 1961. Made public: 2013. Names: Mao Zedong, Khrushchev.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-20.china-leadership
      when: Oct. 20
      date: '1961-10-20'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Huairen Tang. The enlarged Politburo, the Central Committee members in Peking, Liu Shaoqi presiding: the open attack on Albania aimed at China. Deng Xiaoping reports: not foreseen; the delegation''s greetings answered it (open, one-sided charges against a brother party no help to unity).'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 20, 1961. Made public: 2013. Names: Liu Shaoqi, Deng Xiaoping, Mao Zedong.'
      tags:
      - polity:prc
      - name:liu-shaoqi
      - name:deng-xiaoping
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-21.china-leadership
      when: Oct. 21
      date: '1961-10-21'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Standing Committee, Mao presiding: whether to print the Albanian Central Committee''s statement; wait, and ask the delegation, which agrees. Mao: Copernicus, Galileo, the bourgeois revolutions of France, Holland and Belgium were isolated at first.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 21, 1961. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-22.china-leadership
      when: Oct. 22
      date: '1961-10-22'
      thread: china-leadership
      c: 'Mao with Deng Zihui on the change of the basic accounting unit. Deng: the team, for decades. Mao: the brigade not even to be thought of for thirty or fifty years. Will it bring farming alone? Deng: no. Mao gives him Hebei''s rules for the "big contract" in distribution; Deng writes back: good, for the whole country.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 22, 1961. Made public: 2013. Names: Mao Zedong, Deng Zihui.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
