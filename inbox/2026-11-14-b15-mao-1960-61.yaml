      thread: china-leadership
      c: 'The Yinian Tang. Song Renqiong and Li Xuefeng report the Northeast and North China groups. Mao: raise the grain purchase price only, not the sale price, a gap of a billion yuan a year, to end the unequal exchange with the peasants; repayment for what was levelled and transferred, in kind, "even to bankruptcy": "Marxists must never expropriate the laborers."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 30, 1960. Made public: 2013. Names: Mao Zedong, Song Renqiong, Li Xuefeng.'
