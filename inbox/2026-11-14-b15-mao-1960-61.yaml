      - cuba
      c: Zhengzhou. Mao receives labor delegations of Chile, Colombia, Costa Rica and Ecuador, writers and jurists of Argentina, Brazil, Chile, Ecuador and Peru, and Major Gálvez, Inspector General of Cuba's army; Yang Shangkun and Liu Ningyi present. China's place and Latin America's much the same.
