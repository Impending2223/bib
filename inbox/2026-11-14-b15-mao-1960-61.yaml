      when: Mar. 10–13
      date: '1961-03-10'
      thread: china-leadership
      c: Canton. Mao's "Three South" conference of the East China, Central-South and Southwest bureaus and their provinces, on the communes' system and regulations (its order set that morning with Ke Qingshi, Li Jingquan, Tao Zhu, Chen Boda and Hu Qiaomu). In Peking, Mar. 11–13, Liu Shaoqi, Zhou Enlai, Chen Yun and Deng Xiaoping hold the "Three North" conference on the same; at Peking's suggestion the two join at Canton Mar. 14.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 10, 1961 (the entry for Mar. 10–13). Made public: 2013. Names: Mao Zedong, Ke Qingshi, Li Jingquan, Tao Zhu, Chen Boda, Hu Qiaomu, Liu Shaoqi, Zhou Enlai, Chen Yun, Deng Xiaoping.'
