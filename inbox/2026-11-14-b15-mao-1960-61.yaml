      when: May 15
      date: '1961-05-15'
      thread: china-leadership
      also:
      - laos
      c: 'The enlarged Politburo Standing Committee, Mao presiding, on the villages and the Geneva conference on Laos: Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Liao Luyan, Tian Jiaying.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 15, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Liao Luyan, Tian Jiaying.'
