      c: '*Renmin ribao*, editorial, "Hold High the Revolutionary Banner of the Moscow Declaration," revised by Mao at Bengbu, 3 a.m.: over 90 percent of mankind revolutionary; lasting peace only when imperialism and capitalism are gone and classes ended.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 29, 1960. Names: Mao Zedong. Check: Mao''s changes, secret until 2013.'
