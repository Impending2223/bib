patch: 2026-11-14-b15-mao-1960-61
by: 'Claude (batch 15, reader 1: *Mao Zedong nianpu 1949–1976*, IV (1960, Jan.–June 1961) and V (July–Dec. 1961), from the owner''s Drive epub of the 2013 set), Nov. 14, 2026'
ops:
- add:
    entry:
      id: cal.1960-01-06.china-leadership
      when: Jan. 6
      date: '1960-01-06'
      thread: china-leadership
      c: 'Shanghai, the Culture Club, afternoon. Mao presides at an enlarged meeting of the Politburo Standing Committee on the agenda of the enlarged Politburo meeting: it opens Jan. 7. Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu and five provincial first secretaries present. (Mao had asked Liu and Deng by letter, Jan. 1, to move the meeting from Nanking, at Ke''s and Li Fuchun''s wish.)'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 6, 1960 (and Jan. 1). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Lin Biao, Deng Xiaoping, Peng Zhen, Yang Shangkun, Ke Qingshi, Li Jingquan, Tao Zhu, Li Fuchun, Wang Renzhong, Ouyang Qin, Lin Tie, Zhang Zhongliang.'
      tags:
