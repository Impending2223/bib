      date: '1960-03-22'
      thread: china-leadership
      also:
      - south-asia
      c: 'Mao''s comment "On the anti-China question," on the embassy''s report of China''s fair in East Pakistan and the crowds at its pavilion in New Delhi: the "great anti-China" chorus imperialists, reactionaries and revisionists, perhaps 5, at most 10 percent of mankind, and intermittent; when China''s output nears theirs America will have to recognize it and trade. Sent out by the Center as a directive Mar. 25, down to the communes.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 22, 1960. Made public: 2013. Names: Mao Zedong.'
