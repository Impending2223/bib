      date: '1960-05-22'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Hangzhou, the Nanping pool. Mao''s meeting: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua. After the summit''s break: imperialism unchanged; Khrushchev "twelve changes in an hour," pushed by America; the fight with the CPSU by articles, "pointing at the mulberry to curse the locust," and no break. The enlarged Politburo at Shanghai June 8 (the three-year plan, the world), the Eighth Congress''s third session in late June.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 22, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua, Khrushchev.'
