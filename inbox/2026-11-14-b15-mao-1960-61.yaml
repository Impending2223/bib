      date: 1960-12
      thread: china-leadership
      c: 'Mao approves Zhou Enlai''s draft directive of the Center (Dec. 6) on the grave state of parts of Shandong, Henan, Gansu and Guizhou (Zunyi and Bijie): cadres'' waste, graft, lawlessness, "careless of the people''s lives"; some of it counterrevolution, feudal forces seizing local power, "the sharpest class struggle in the villages." "Do it."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, early Dec. 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
