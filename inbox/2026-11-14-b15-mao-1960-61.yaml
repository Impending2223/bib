      - japan
      c: Shanghai. Mao and Zhou Enlai receive the Japanese writers' delegation under Noma Hiroshi; Ke Qingshi present. The Japanese people's fight against the security treaty, against America and its agent Kishi, larger than anyone expected last year; the strikes political.
