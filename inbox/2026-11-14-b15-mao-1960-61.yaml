      date: '1960-04-15'
      thread: china-leadership
      c: The Yinian Tang, evening. Mao receives the delegation of Mongolia's Great Hural, its chairman at the head; Lin Boqu present. Every nation has its strengths; China still a land of handicrafts, mechanization just begun; ten years' building, much not yet learned.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 15, 1960. Made public: 2013. Names: Mao Zedong, Lin Boqu. Check: the delegation''s head, 贾尔卡赛汗 in the chronology, chairman of the Great Hural.'
