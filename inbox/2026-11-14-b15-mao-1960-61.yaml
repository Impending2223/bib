      when: Sept. 30
      date: '1961-09-30'
      thread: china-leadership
      also:
      - south-asia
      c: The Qinzheng Hall. Mao receives King Mahendra of Nepal and the Queen; Liu Shaoqi, Zhu De, Zhou Enlai, He Long, Chen Yi and their wives present. Buddhism from Nepal; Xuanzang and Faxian went there; Nepal a very good neighbor.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Sept. 30, 1961. Made public: 2013. Names: Mao Zedong, Mahendra, Liu Shaoqi, Wang Guangmei, Zhu De, Zhou Enlai, Deng Yingchao, He Long, Chen Yi.'
      tags:
      - polity:prc
      - polity:nepal
      - name:mao-zedong
