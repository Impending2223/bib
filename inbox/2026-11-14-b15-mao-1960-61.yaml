      when: Mar. 13
      date: '1961-03-13'
      thread: china-leadership
      c: 'Canton, the Three South conference; Mao speaks: the two egalitarianisms to be solved, or the masses'' zeal will not be roused; a set of regulations for the communes, heard now, decided after further inquiry.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 13, 1961. Made public: 2013. Names: Mao Zedong.'
