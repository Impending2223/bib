      date: '1960-05-21'
      thread: china-leadership
      also:
      - korea
      - soviet-union
      c: 'Hangzhou, the Nanping pool, evening. Mao receives Kim Il Sung; Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Kang Sheng, Chen Boda, Wang Jiaxiang and others present. Korea and Albania with China; the seventeen parties'' meeting at Rome and the Warsaw meeting revisionist and aimed at China; Kim: Khrushchev told him in 1955 not to oppose America. The U-2 forced Khrushchev to Paris to expose, not to meet. Twenty years of peace good; but two hands; atomic bombs for all.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 21, 1960. Made public: 2013. Names: Mao Zedong, Kim Il Sung, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Ke Qingshi, Lu Dingyi, Chen Boda, Kang Sheng, Wang Jiaxiang, Yang Shangkun, Jiang Hua, Khrushchev.'
