      thread: china-leadership
      c: Jinan, the airport. Mao receives trade-union and women's delegations of fourteen Latin American and African countries; Liu Changsheng present. "We stand on one front"; America says it cannot see the people's China, yet calls it bad every day.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 3, 1960. Made public: 2013. Names: Mao Zedong, Liu Changsheng, Cao Mengjun. Check: what the press printed of the talk.'
