    entry:
      id: cal.1961-10-24.china-leadership
      when: Oct. 24
      date: '1961-10-24'
      thread: china-leadership
      also:
      - soviet-union
      c: Mao, Liu Shaoqi, Zhu De and Deng Xiaoping meet Zhou Enlai at the airport, back from Moscow; at the Yinian Tang the Politburo and the Secretariat in Peking hear him on the Twenty-second Congress and the delegation's talk with Khrushchev and others, Oct. 22. The Albanian statement to be printed.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 24, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhu De, Deng Xiaoping, Zhou Enlai, Khrushchev.'
      tags:
