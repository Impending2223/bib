      thread: china-leadership
      c: 'The Yinian Tang. Mao''s meeting hears the work conference''s groups; four days more for them, on grain, prices and markets. Mao: nine in ten county, commune and brigade cadres good, one bad (enemies come in, the degenerate, the dead bureaucrats, these last "inside the people"); the muddled can wake, like King Zhuang of Chu''s bird.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Dec. 27, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Deng Xiaoping, Peng Zhen, Tan Zhenlin, Chen Boda, Ke Qingshi, Tao Zhu, Li Jingquan.'
