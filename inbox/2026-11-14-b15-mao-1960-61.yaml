    entry:
      id: cal.1961-03-23.china-leadership
      when: Mar. 23
      date: '1961-03-23'
      thread: china-leadership
      c: 'Canton, the work conference''s plenary session. Mao gives Hu Qiaomu''s draft its title, "Letter of the Central Committee to the Bureaus and the Provincial Committees on Earnest Investigation" (down to the counties, regiments, big factories, universities), and speaks on "On Investigation Work," section by section: a Marxist–Leninist line not easily made.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 23, 1961. Made public: 2013. Names: Mao Zedong, Hu Qiaomu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-25.china-leadership
      when: Mar. 25
      date: '1961-03-25'
      thread: china-leadership
      c: 'Mao on the telegram of the Gongcheng county delegates to the Guilin prefecture''s cadre meeting: grave deaths in the prefecture, Party branches wrecked, many sick still to be saved. To Tao Zhu for Liu Jianxun: deal with it at once; the region to send a senior man; "I have seen your telegram."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 25, 1961. Made public: 2013. Names: Mao Zedong, Tao Zhu, Liu Jianxun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:tao-zhu
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-28.china-leadership
      when: Mar. 28
      date: '1961-03-28'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Mao revises Zhou Enlai''s draft oral answer of the Central Committee to the CPSU''s letter of Mar. 21 (a million tons of grain and 500,000 tons of sugar on loan, the grain kept as China''s reserve): thanks; if the harvest or the purchases abroad go well, the Soviets released from the reserve; Mao adds: if not, it stays China''s reserve. (Mao and Zhou on the reply to Khrushchev, Mar. 24.)'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 28, 1961 (and Mar. 24). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Khrushchev.'
