      when: Jan. 13
      date: '1961-01-13'
      thread: china-leadership
      c: 'The Huairen Tang. Mao closes the Central Work Conference: "make investigation and study the fashion"; each leader to study a brigade or two, a commune, a factory; "clear facts, great resolve, right methods"; "go bankrupt to pay the debts": the laborer never expropriated; building cut, no new works this year; socialism not to be built in such haste.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 13, 1961. Made public: 2013. Names: Mao Zedong.'
