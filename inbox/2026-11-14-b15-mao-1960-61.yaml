      c: 'Peking Hotel. Mao and Liu Shaoqi at the Cuban Ambassador''s reception for the revolution''s second anniversary. To the Ambassador, Santos, on the tension with America since Dec. 30: against American troops, guerrilla war, not head on; "America is a bone, not meat": bite it a piece at a time.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 6, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Santos.'
