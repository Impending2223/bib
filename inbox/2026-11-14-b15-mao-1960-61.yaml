      when: Mar. 24
      date: '1960-03-24'
      thread: china-leadership
      c: 'Tianjin, on the train. Mao opens the Tianjin meeting: Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Chen Boda, Bo Yibo, ministers, and the first secretaries of North and Northeast China, Hubei, Henan and Gansu. His seventeen questions (the fourteen of Hangzhou, the anti-China question and the main contradiction): urban communes everywhere, "now I am a leftist"; the five faults in the rural communes "rather serious."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 24, 1960. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Peng Zhen, Li Fuchun, Li Xiannian, Chen Boda, Bo Yibo, Ulanhu, Lin Tie, Wang Renzhong, Wu Zhipu, Zhang Zhongliang.'
