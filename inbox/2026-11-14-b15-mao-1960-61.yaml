      when: Apr., late
      date: 1960-04
      thread: china-leadership
      c: 'Mao''s comment for the Center on Guangdong''s report on the "five many" (meetings, papers, forms...): "like a great earthquake"; every first secretary down to the prefectures to read it and act. Sent out Apr. 28. And on Deng Xiaoping''s draft on Nie Rongzhen''s letter on the "four modernizations" in the press: do ten, "say five, even one or two," the most secret not at all.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, late Apr. 1960. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Nie Rongzhen.'
