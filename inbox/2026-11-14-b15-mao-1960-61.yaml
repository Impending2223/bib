    entry:
      id: cal.1961-10-05.china-leadership
      when: Oct. 5
      date: '1961-10-05'
      thread: china-leadership
      also:
      - south-asia
      c: 'Diaoyutai, evening. Mao returns King Mahendra''s call; Zhou Enlai with him. The boundary all agreed, "fair," the King says. Mao: equals, no great-power chauvinism; China still poor, fifty or a hundred years to do well.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 5, 1961. Made public: 2013. Names: Mao Zedong, Mahendra, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:nepal
