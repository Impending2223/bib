      when: Mar. 4
      date: '1961-03-04'
      thread: china-leadership
      also:
      - soviet-union
      - cuba
      c: 'Canton, the Xiaodao guesthouse. The enlarged Politburo Standing Committee, Mao presiding (Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Tao Zhu, Hu Qiaomu): the world; the first draft of the communes'' working regulations; the Soviet offer of a million tons of grain on loan and the shipment through of 500,000 tons of Cuban sugar.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 4, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Chen Boda, Tao Zhu, Hu Qiaomu.'
