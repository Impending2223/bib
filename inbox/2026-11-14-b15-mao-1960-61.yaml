- add:
    entry:
      id: cal.1961-01-18.china-leadership
      when: Jan. 18
      date: '1961-01-18'
      thread: china-leadership
      c: 'The Huairen Tang, the Ninth Plenum''s last session; Mao speaks. Too little investigation; the "communist wind" not known; Lushan''s fight on the right broke the fight on the left; last year the center''s leaders were absorbed abroad. One account only; equal exchange, pay by work; repay the "communist wind." Steel to stay at 18.45 million tons (Ye Jianying''s and Li Weihan''s view): quality now, not quantity. "On the economy we lack experience"; can it be learned in twenty years, not twenty-eight?'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 18, 1961. Made public: 2013. Names: Mao Zedong, Ye Jianying, Li Weihan, Li Fuchun.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:ye-jianying
      - name:li-fuchun
      - vis:only:prc
