- add:
    entry:
      id: cal.1960-01-24.china-leadership
      when: Jan. 24
      date: '1960-01-24'
      thread: china-leadership
      also:
      - south-asia
      c: 'Mao to Zhou Enlai: the government''s note to India of Dec. 26, 1959 (the whole boundary, west, middle and east, never delimited; talks), printed in *Renmin ribao* Jan. 3, to be read and discussed by every Party and League organization, by a notice of the Propaganda Department; factories yes, the villages perhaps not. For the Standing Committee to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Jan. 24, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - polity:india
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
