      thread: china-leadership
      also:
      - africa
      c: 'Zhengzhou. Mao receives public figures, peace workers and trade-union, youth and student delegations of twelve African countries; Yang Shangkun and Liu Ningyi present. Africa''s two hundred million uniting, waking: imperialism will have to go.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 7, 1960. Made public: 2013. Names: Mao Zedong, Yang Shangkun, Liu Ningyi. Check: what the press printed of the talk.'
