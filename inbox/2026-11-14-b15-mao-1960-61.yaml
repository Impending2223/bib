      when: Nov. 15
      date: '1960-11-15'
      thread: china-leadership
      c: 'Mao drafts the Center''s directive on the "five winds," with Wang Renzhong''s reports on Mianyang county: in a few months the "communist wind," exaggeration, coercion, cadres'' privilege and blind orders on production to be stopped, the "communist wind" first.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 15, 1960. Made public: 2013. Names: Mao Zedong, Wang Renzhong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1960-11-16.china-leadership
      when: Nov. 16
      date: '1960-11-16'
      thread: china-leadership
      also:
      - soviet-union
      c: 'The Huairen Tang, evening. Mao, Zhou Enlai, Chen Yi, Li Fuchun and Chen Boda on the delegation''s telegram: since Nov. 14 many parties name the Chinese as factionalists; to sign unchanged would be surrender; unless the points in dispute go, no signature, and a statement. Agreed: prepare for the worst. The Politburo, Zhou presiding, agrees Nov. 17; his telegram, read by Mao: no signature without changes, even if only China, or China and Albania, refuse, at the cost of blockade and a local war in the Far East.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 16, 1960 (and Nov. 17). Made public: 2013. Names: Mao Zedong, Zhou Enlai, Chen Yi, Li Fuchun, Chen Boda, Deng Xiaoping, Liu Shaoqi, Peng Zhen.'
