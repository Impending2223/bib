      - soviet-union
      c: 'Beidaihe, the beach, 6 a.m. Mao with Hồ Chí Minh, Hoàng Văn Hoan and Nguyễn Xuân Thủy; a swim at eight; breakfast; Liu Shaoqi, Zhou Enlai, Deng Xiaoping present. Ho''s points "basically good," he a "messenger of peace." At Bucharest a communique to be signed unchanged: "father and son." Revisionism to be fought; China''s own, a tenth, could make "a Chinese Khrushchev" in twenty or forty years: "if so, fight us."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Aug. 10, 1960. Made public: 2013. Names: Mao Zedong, Hồ Chí Minh, Hoàng Văn Hoan, Nguyễn Xuân Thủy, Liu Shaoqi, Zhou Enlai, Deng Xiaoping, Yang Shangkun.'
