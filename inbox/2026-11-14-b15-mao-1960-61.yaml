- add:
    entry:
      id: cal.1961-03-15.china-leadership-2
      when: Mar. 15–23
      date: '1961-03-15'
      thread: china-leadership
      c: 'Canton. The Central Work Conference, Mao presiding: the regional bureaus'' and provinces'' secretaries. It adopts the draft Working Regulations for the Rural People''s Communes (the "Sixty Articles"), the Center''s letter to all members on discussing them, and its letter on investigation. Deng Xiaoping, reporting it Mar. 27 and 29: the two egalitarianisms; the commune''s power held down; the brigade the main accounting unit, part of the ownership with the team; the higher cooperatives'' rules restored. Mao: the first time since the communes that the center sat down together on farming.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 15, 1961 (the entry for Mar. 15–23). Made public: 2013. To check: the Working Regulations for the Rural People''s Communes (draft), Mar. 1961. Names: Mao Zedong, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1961-03-21.china-leadership
      when: Mar. 21
      date: '1961-03-21'
      thread: china-leadership
      c: Canton. The Politburo Standing Committee (Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping; Peng Zhen attending) on the third draft of the Sixty Articles. The conference adopts them Mar. 22.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Mar. 21, 1961 (and Mar. 22). Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Peng Zhen.'
