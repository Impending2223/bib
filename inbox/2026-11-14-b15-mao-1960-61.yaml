      c: Wuchang. Mao receives the delegations of the Japan–China Friendship Association, Sohyo and others, and Cuban, Brazilian and Argentine delegations; Yang Shangkun and Liao Chengzhi present. The new Japanese–American security treaty a military alliance against China, the Soviet Union and Asia's peoples.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 14, 1960. Made public: 2013. Names: Mao Zedong, Yang Shangkun, Liao Chengzhi. Check: what the press printed of the talk.'
