      c: 'Mao on an internal report of May 15, Liao Wenyi on an American, Japanese and Liao plot for "Taiwan independence" (America has chosen Liao to rule Taiwan; Fulbright writes him to stand ready): "Inform Mr. Chiang of this."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May None, 1960. Made public: 2013. Names: Mao Zedong, Liao Wenyi, Fulbright, Chiang Kai-shek. Check: the channel to Chiang; Fulbright''s letters, Liao''s claim only.'
