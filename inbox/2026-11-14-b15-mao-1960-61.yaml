      date: '1960-06-18'
      thread: china-leadership
      c: 'Shanghai, the enlarged Politburo''s closing session; Mao speaks. Targets for 1962 to the Eighth Congress''s third session: steel 28.5 million tons (not the inner 32), iron 32, coal 500, electricity 85 billion kwh, fertilizer 4.5 million tons; Zhou Enlai: grain about 550 billion jin, cotton 45 million dan. "Do more, say less." On the "Ten-Year Summary": Soviet experience fit for China still to be copied.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 18, 1960. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Li Fuchun.'
