      c: 'Shanghai, on the train. Mao with Ke Qingshi, Chen Pixian, Zhao Erlu and Chen Zhengren on Khrushchev: the Twentieth Congress peaceful transition and Stalin attacked, the Twenty-first war to be rooted out of society; Khrushchev should not have spoken at Berlin before Eisenhower.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 29, 1960. Made public: 2013. Names: Mao Zedong, Ke Qingshi, Chen Pixian, Zhao Erlu, Chen Zhengren, Khrushchev.'
