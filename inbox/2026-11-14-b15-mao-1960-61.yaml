- add:
    entry:
      id: cal.1961-05-21.china-leadership
      when: May 21–June 12
      date: '1961-05-21'
      thread: china-leadership
      c: 'Peking, the Huairen Tang. The Central Work Conference, Mao presiding (put off from May 15; its order set by the enlarged Standing Committee that evening). The Sixty Articles revised: whether a team keeps a mess hall "wholly for the members to decide"; the supply part of distribution dropped. Rules adopted: nine measures to cut town population and grain sales (Zhou Enlai''s, June 6); repayment for levelling and transfers; forty articles on commerce, thirty-five on handicrafts, eighteen on forests. Twenty million fewer in the towns in three years, ten this year; steel for 1961 cut from 18 to 11 million tons. Mao, May 21: repayment, 80 or 90 percent by next spring, some 20 billion yuan in all.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 21, 1961 (the entries for May 21–June 12 and May 21; and June 6). Made public: 2013. Names: Mao Zedong, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-05-23.china-leadership
      when: May 23
      date: '1961-05-23'
      thread: china-leadership
      c: 'The Yinian Tang. The enlarged Standing Committee with the regional first secretaries, Mao presiding. Repayment, in one year or two or three: "Marxism cannot expropriate the laborer"; 20 billion yuan taken from the peasants; without full repayment the communes no red flag; "the Communist Party is the Communist Party after all."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 23, 1961. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-04.china-leadership
      when: June 4
      date: '1961-06-04'
      thread: china-leadership
      c: 'Mao sends Liu Shaoqi''s draft directive (by the Center''s culture and education group) to the work conference through Deng Xiaoping: "Resistance University" political schools to train educated youth for work in the villages, where the third-class communes show that without them socialism cannot be built nor the landlords'' return prevented.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 4, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Deng Xiaoping.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:liu-shaoqi
      - name:deng-xiaoping
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-08.china-leadership
      when: June 8
      date: '1961-06-08'
      thread: china-leadership
      c: 'Zhongnanhai, Mao''s house by the pool. The enlarged Standing Committee with the regional first secretaries, Mao presiding. Mao: at the Zhengzhou and Beidaihe meetings "primary school," now "middle school"; the fight on the right after Lushan carried below the counties; the mess halls; "the three leans," of land, men and beasts, the punishment, "the center and I responsible, I first"; the purges of the Jiangxi soviet; Wang Shiwei''s killing wrong.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 8, 1961. Made public: 2013. Names: Mao Zedong, Peng Dehuai, Wang Shiwei, Zhang Guotao.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-dehuai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-12.china-leadership
      when: June 12
      date: '1961-06-12'
      thread: china-leadership
      c: 'The Huairen Tang. Mao closes the work conference: the Zhengzhou meetings hurried, he did not yet understand socialism; after Lushan the resolution on Peng, Huang, Zhang and Zhou should not have gone below the counties: good men, truth-tellers made "right opportunists," even "counterrevolutionaries"; his six points of 1959 "a fart"; the "five big drives" of 1960 the "communist wind" again; Beidaihe of 1960 abroad, the Twelve Articles the turn.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 12, 1961. Made public: 2013. Names: Mao Zedong, Peng Dehuai, Huang Kecheng, Zhang Wentian, Zhou Xiaozhou.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-dehuai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-06-13.china-leadership
      when: June 13
      date: '1961-06-13'
      thread: china-leadership
      also:
      - indonesia
      - china
      c: 'The Qinzheng Hall, evening. Mao receives Sukarno, President of Indonesia; Liu Shaoqi and Zhou Enlai present. While Chiang''s man is in the United Nations, China stays out: eleven years waited, eleven more no matter. One step only: Taiwan returned, China in; its system may stay for its people to settle; one seat, not two like the Ukraine''s. (June 15, a farewell breakfast at Diaoyutai: "the counterrevolutionaries will not spare you.")'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 13, 1961 (and June 15). Made public: 2013. Names: Mao Zedong, Sukarno, Liu Shaoqi, Zhou Enlai, Chiang Kai-shek.'
      tags:
      - polity:prc
      - polity:indonesia
      - name:mao-zedong
      - name:sukarno
      - name:liu-shaoqi
      - name:zhou-enlai
      - name:chiang-kai-shek
      - vis:only:prc+indonesia
