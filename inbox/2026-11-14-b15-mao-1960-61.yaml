    entry:
      id: cal.1961-10-06.china-leadership
      when: Oct. 6
      date: '1961-10-06'
      thread: china-leadership
      c: The Yinian Tang, evening. Mao's meeting of the regional first secretaries and the Hubei, Guangxi and Hebei secretaries (Wang Renzhong, Liu Jianxun, Liu Zihou), called Oct. 3–4 through Deng Xiaoping and Peng Zhen "to make clear the great question of the team as the base."
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 6, 1961 (and Oct. 3, 4). Made public: 2013. Names: Mao Zedong, Wang Renzhong, Liu Jianxun, Liu Zihou, Deng Xiaoping, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-07.china-leadership
      when: Oct. 7
      date: '1961-10-07'
      thread: china-leadership
      c: 'The Center''s directive on the basic accounting unit in the villages, titled and approved by Mao: by most accounts the team (the old small team), not the brigade, the better unit, ending production in one and distribution in the other; every level to inquire in person through late October and early November, a trial brigade or two a county, no general change; the December work conference to decide.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 7, 1961. Made public: 2013. Names: Mao Zedong, Peng Zhen.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:peng-zhen
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-07.china-leadership-2
      when: Oct. 7
      date: '1961-10-07'
      thread: china-leadership
      also:
      - japan
      c: The Qinzheng Hall. Mao receives the Japan–China Friendship Association's delegation, Japanese educators and other guests; Liao Chengzhi and Liu Ningyi present. Apart from the pro-American monopolies and militarists, Japan's people China's true friends.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 7, 1961. Made public: 2013. Names: Mao Zedong, Liao Chengzhi, Liu Ningyi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-10-12.china-leadership
      when: Oct. 12
      date: '1961-10-12'
      thread: china-leadership
      also:
      - vietnam-hanoi
      - soviet-union
      c: 'The Yinian Tang. The Politburo Standing Committee at 6 p.m.; then Mao, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping and Peng Zhen give a dinner for Hồ Chí Minh and Lê Duẩn on their way to the Soviet Twenty-second Congress. Mao: South Vietnam''s situation very good, the Vietnamese party''s work good. Ho: forms of struggle there new to Vietnam, and to China.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Oct. 12, 1961. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, Peng Zhen, Hồ Chí Minh, Lê Duẩn.'
      tags:
      - polity:prc
      - polity:drv
