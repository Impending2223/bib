      thread: china-leadership
      c: Hangzhou. Mao receives the Albanian parliamentary delegation under Haxhi Lleshi, chairman of the Presidium of the People's Assembly (Xi Zhongxun and Ji Pengfei report their talks first); Saifuddin and Yang Shangkun present. The Japanese–American alliance aimed at China and the Soviet Union; America would isolate China and cannot; at most a tenth of the world against it.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 7, 1960. Made public: 2013. Names: Mao Zedong, Haxhi Lleshi, Xi Zhongxun, Ji Pengfei, Saifuddin, Yang Shangkun.'
