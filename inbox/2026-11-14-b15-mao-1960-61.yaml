      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-17.china-leadership
      when: Nov. 17
      date: '1961-11-17'
      thread: china-leadership
      also:
      - indonesia
      - soviet-union
      c: The Yinian Tang. Mao, Zhou Enlai and Deng Xiaoping give a dinner for D. N. Aidit, back from the Twenty-second Congress; Yang Shangkun and Liu Ningyi present. The congress against Stalin, the "anti-Party group," Albania and China; Khrushchev rules by feudal methods. Stalin's merit chief; his two errors toward China, backing the "left" line and opposing the war with Chiang after Japan's surrender. Imperialism feared Stalin, not Khrushchev.
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 17, 1961. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Deng Xiaoping, Yang Shangkun, Liu Ningyi, Aidit, Khrushchev, Stalin.'
      tags:
      - polity:prc
