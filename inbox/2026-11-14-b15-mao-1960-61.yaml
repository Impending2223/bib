      - africa
      c: The Yinian Tang, evening. Mao receives the South African Communist Party's delegation under its chairman, Yusuf Dadoo; Wu Xiuquan present. Africa's revolution risen, new since the war; a core needed, the democratic revolution first.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Nov. 3, 1960. Made public: 2013. Names: Mao Zedong, Dadoo, Wu Xiuquan.'
