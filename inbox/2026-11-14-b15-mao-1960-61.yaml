      - soviet-union
      c: 'Zhengzhou, on the train, 5:30 p.m. Mao with Deng Xiaoping, Chen Boda, Wang Jiaxiang, Yang Shangkun and Hu Sheng (called from Peking May 9) on international questions and Khrushchev''s recent speeches: some articles to be written.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 10, 1960. Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Chen Boda, Wang Jiaxiang, Yang Shangkun, Hu Sheng, Khrushchev.'
