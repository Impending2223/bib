      when: Feb. 26
      date: '1960-02-26'
      thread: china-leadership
      also:
      - south-asia
      c: 'Canton, the Xiaodao guesthouse. Mao, with Zhou Enlai, Kang Sheng, Luo Ruiqing and Hu Qiaomu, on Zhou''s reply to Nehru (talked over with Kang and Hu the evening before). Nehru had asked Zhou, Feb. 5, to Delhi before the end of March; Zhou''s answer, Feb. 27: he will come in April.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 25, 1960, and note 15. Made public: 2013. Names: Mao Zedong, Zhou Enlai, Kang Sheng, Luo Ruiqing, Hu Qiaomu, Nehru.'
