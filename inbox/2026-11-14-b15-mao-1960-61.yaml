      - cuba
      c: Zhengzhou, on the train. Mao receives Major Gálvez of Cuba again, at lunch; Deng Xiaoping, Wang Jiaxiang, Yang Shangkun present. The Cuban revolution of world meaning; the question is how to make it secure; it must resist imperialism to the end.
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 10, 1960. Made public: 2013. Names: Mao Zedong, Gálvez, Deng Xiaoping, Wang Jiaxiang, Yang Shangkun.'
