- add:
    entry:
      id: cal.1960-02-09.china-leadership
      when: Feb. 9
      date: '1960-02-09'
      thread: china-leadership
      c: 'Canton, Jijingkeng. Mao, with Chen Boda, Hu Sheng, Deng Liqun, Tian Jiaying, and from Feb. 4 Tao Zhu and Hu Qiaomu, finishes the Soviet *Textbook of Political Economy* (third edition, second volume), read and talked through since Dec. 10, 1959, at Hangzhou, on the train and at Canton. Its last talk: Stalin''s two "errors" not proven; relations among men in production to keep changing; the textbook''s incentives, "a wife, a villa, a car, a piano, a television."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 9, 1960 (and Jan. 2–5, Feb. 4–8). Made public: 2013. Names: Mao Zedong, Chen Boda, Hu Sheng, Deng Liqun, Tian Jiaying, Tao Zhu, Hu Qiaomu.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:chen-boda
      - name:tao-zhu
      - vis:only:prc
