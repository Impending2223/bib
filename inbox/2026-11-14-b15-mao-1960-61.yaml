      - name:chen-boda
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-23.china-leadership
      when: Nov. 23
      date: '1961-11-23'
      thread: china-leadership
      also:
      - japan
      c: 'Mao receives Doki Tsuyoshi, of the Japan Communist Party''s Secretariat and editor of *Akahata*, and Anzai Kuji; Liao Chengzhi, Liu Ningyi, Wu Lengxi present. The JCP judges for itself, asks no foreigner: very good. Foreign experience to be studied, failures above all; China''s twenty-four years to unite its party; a general line needs concrete policies.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 23, 1961. Made public: 2013. Names: Mao Zedong, Doki Tsuyoshi, Anzai Kuji, Liao Chengzhi, Liu Ningyi, Wu Lengxi.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-11-30.china-leadership
      when: Nov. 30
      date: '1961-11-30'
      thread: china-leadership
      c: 'The Yinian Tang, evening. The Politburo Standing Committee, Mao presiding: the last days; the meetings with the other parties. Mao proposes a ten-year plan built on the seven-year plan.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Nov. 30, 1961. Made public: 2013. Names: Mao Zedong.'
      tags:
      - polity:prc
      - name:mao-zedong
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-20.china-leadership
      when: Dec. 20
      date: '1961-12-20'
      thread: china-leadership
      c: 'Peking. The Central Work Conference of the regional, provincial and central leaders opens (to Jan. 10, 1962), on the situation at home and abroad, the 1962 and long-term plans, commerce, the basic accounting unit and the Party, to prepare the enlarged work conference; Mao: seven fronts for 1962, industry, farming, commerce, schools, army, government, Party. That evening, the Yinian Tang, his meeting of the Standing Committee and the regional first secretaries: first for local power, now for central unity; the detours of these years the center''s first, then the provinces''; the four highs, the "big drives," the supply system, the mess halls the center''s, "wrong," and a precious asset.'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 20, 1961 (the entries for Dec. 20, 1961–Jan. 10, 1962 and Dec. 20). Made public: 2013. Names: Mao Zedong, Deng Xiaoping, Zhou Enlai.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:deng-xiaoping
      - name:zhou-enlai
      - vis:only:prc
- add:
    entry:
      id: cal.1961-12-26.china-leadership
      when: Dec. 26
      date: '1961-12-26'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Diaoyutai, Building 12, evening. Mao hears the conference''s groups. "The empire settled by unity" (Mencius): China settles its own part only; to every country open, no subversion, whatever its government; the Soviets'' seven or eight ways (tapping, rumor, bribes, interference, subversion, the experts withdrawn, relations cut), none of them China''s. Khrushchev "bullies the weak, fears the strong." China will not split with the Soviets: "you withdraw an ambassador, I do not."'
      n: '[[w.zedong-mao-zedong-nianpu]], V, Dec. 26, 1961. Made public: 2013. Names: Mao Zedong, Khrushchev, Chen Boda.'
      tags:
      - polity:prc
      - name:mao-zedong
      - name:khrushchev-nikita-s
      - name:chen-boda
      - vis:only:prc
- cite:
