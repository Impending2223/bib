    entry:
      id: cal.1961-04-24.china-leadership
      when: Apr. 24
      date: '1961-04-24'
      thread: china-leadership
      also:
      - laos
      c: 'Hangzhou, the Hangzhou Hotel, evening. Mao receives Souvanna Phouma and Prince Souphanouvong, brought by Zhou Enlai that afternoon; Chen Yi and Wu Xiuquan present. Souvanna will answer the call of the Geneva co-chairmen, Gromyko and Home, for a cease-fire with a statement and talks with Vientiane on its means. Mao: the statement good, the Savannakhet group invited to Khang Khay; they want peace now only because of nine months'' fighting; keep alert.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Apr. 24, 1961. Made public: 2013. Names: Mao Zedong, Souvanna Phouma, Souphanouvong, Zhou Enlai, Chen Yi, Wu Xiuquan, Gromyko, Home.'
