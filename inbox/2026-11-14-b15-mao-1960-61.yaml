      c: 'Beidaihe. The enlarged Standing Committee, Mao presiding, on the world and output. Zhou Enlai: 8.8 million tons of steel in the half year, 44 percent of the plan. Mao: "ally with the Soviet Union, oppose imperialism"; no split; Khrushchev damns the communes as Dulles does, and the leap, the army''s ways, cadres at labor; "his socialism and ours."'
