      when: May 27
      date: '1960-05-27'
      thread: china-leadership
      also:
      - europe-and-the-alliance-britain
      c: 'Shanghai, the Culture Club. Mao receives Field Marshal Montgomery at dinner; Ke Qingshi present. Not hot war, not coexistence: "cold-war coexistence." Britain and France stronger welcome, America, West Germany and Japan restrained; the threat to China from America and Japan. Montgomery: foreign troops home, the occupation of Europe ended, Taiwan settled; he will rouse opinion; Mao agrees, but America "yields not an inch."'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, May 27, 1960. Made public: 2013. Names: Mao Zedong, Montgomery, Ke Qingshi.'
      tags:
      - polity:prc
      - name:mao-zedong
