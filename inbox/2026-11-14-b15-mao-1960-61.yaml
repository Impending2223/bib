      when: Feb. 10–11
      date: '1960-02-10'
      thread: china-leadership
      also:
      - soviet-union
      c: 'Canton. Kang Sheng reports to Mao on the Warsaw Treaty meeting of Feb. 4 at Moscow, attended with Liu Xiao and Wu Xiuquan as observers (Khrushchev''s new cut in forces, his stand for the summit, the Declaration). Feb. 11, the Xiaodao guesthouse: Kang reports again to Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Li Fuchun, He Long, Nie Rongzhen, Luo Ruiqing, Chen Boda and others; the afternoon, the questions it raises discussed.'
      n: '[[w.zedong-mao-zedong-nianpu]], IV, Feb. 10, 1960, and note 12. Made public: 2013. Names: Kang Sheng, Mao Zedong, Liu Xiao, Wu Xiuquan, Khrushchev, Zhou Enlai, Lin Biao, Deng Xiaoping, Peng Zhen, Li Fuchun, He Long, Nie Rongzhen, Tan Zheng, Luo Ruiqing, Chen Boda, Ke Qingshi, Li Jingquan, Tao Zhu, Li Xuefeng, Liu Lantao, Yang Shangkun, Hu Qiaomu.'
