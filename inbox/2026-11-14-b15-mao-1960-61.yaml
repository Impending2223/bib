      n: '[[w.zedong-mao-zedong-nianpu]], IV, June 16, 1960, and note 90. Made public: 2013. Names: Mao Zedong, Liu Shaoqi, Zhou Enlai, Zhu De, Chen Yun, Lin Biao, Deng Xiaoping, He Long, Nie Rongzhen, Luo Ruiqing, Eisenhower.'
