      c: Khánh Hòa. After 38 days of an operation by 2,500 Saigon main-force men with air and artillery, under Gen. Tôn Thất Đính, on the base area in the Tô Hạp river basin, Đính orders the withdrawal, the plan given up. The people had blocked the paths with crossbows, stone traps and spike pits; the guerrillas of the highlands sniped at the columns; hundreds of Saigon soldiers dead, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 260–61. Names: Tôn Thất Đính. Check: the day: the history gives 38 days from the opening, June 1 ([[cal.1963-06-01.vietnam-hanoi-2]]), which makes about July 8.'
