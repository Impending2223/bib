- add:
    entry:
      id: cal.1961-06-19.vietnam
      when: June 19
      date: '1961-06-19'
      thread: vietnam
      also:
      - vietnam-saigon
      c: Kennedy sends a "special economic mission" under Eugene Staley of the Stanford Research Institute to South Vietnam, June 19, to help Diệm draw up the pacification program. After nearly a month of talks with Saigon officials and with Diệm, the mission reports to Kennedy at the end of July.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 16. Names: Eugene Staley. Check: the history dates the mission''s start June 19; the Staley report is [[cal.1961-07-14.vietnam]].'
      tags:
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1961-09-17.vietnam-2
      when: Sept. 17
      date: '1961-09-17'
      thread: vietnam
      also:
      - vietnam-saigon
      c: A British advisory mission on administration and policy, led by Robert Thompson, the counterguerrilla expert of Malaya, arrives Sept. 17 at Diệm's invitation as adviser on pacification.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 168. Names: Robert Thompson. Check: the history gives "Sept. 17" without the arrival; the American record not read.'
      tags:
      - polity:us
      - name:thompson-robert
- add:
    entry:
      id: cal.1961-04.vietnam-saigon
      when: Apr.
      date: '1961-04'
      thread: vietnam-saigon
      also:
      - vietnam
      c: Saigon changes its military regions into tactical zones, each under a main-force corps with its local forces and supporting arms; below the zone, tactical areas, sectors (provinces) and subsectors (districts). Saigon–Gia Định a "capital special zone". American advisers and supporting units, the helicopter and air transport units above all, are put down to the zones.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 25. Check: the day.'
      tags:
      - polity:rvn
      - polity:us
      - ok:fields-place
- add:
    entry:
