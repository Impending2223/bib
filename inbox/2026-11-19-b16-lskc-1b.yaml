    units: C
- variant:
    id: cal.1964-08-25.vietnam
    unit: C
    witness: w.lich-su-khang-chien-chong-my
    reads: the Military Council, by Nguyễn Xuân Oánh and Nghiêm Xuân Hồng, declares Aug. 25 it agrees to withdraw the Vũng Tàu charter
    at: III, 357
