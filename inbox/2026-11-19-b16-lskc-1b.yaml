      place: luong-quoi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 23 a platoon of Giồng Trôm district's armed force destroys a Civil Guard platoon at Lương Quới, on its way from Giồng Trôm to the town.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364. Check: the clock.'
