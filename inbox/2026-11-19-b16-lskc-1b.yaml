      c: Bình Định. After the Rhade battalion's sweep Unit 2/9 ambushes at Đất Dài and destroys a squad, forcing it to withdraw; the people then break up the Gò Nĩ concentration camp and free the area west of the An Lão river.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379–80. Check: the day.'
      tags:
      - polity:drv
