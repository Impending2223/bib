      when: Nov.
      date: '1960-11'
      place: gia-le
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Khánh Hòa. In November the province's armed force destroys the Gia Lê post and 5,000 people of the Bố Lạng, Gia Lê and Thác Trại zones rise and break the controls. In the same month the Cây Dầu post zone is broken and the areas of Tà Lương and Suối Hai are freed.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 375. Check: the days; two acts, the history gives them in one passage without days.'
