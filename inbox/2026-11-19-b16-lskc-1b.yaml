      when: May
      date: '1963-05'
      place: kontum
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Kon Tum. Regiment 42 of the Saigon army sweeps the base area north of Kon Tum, to relieve the pressure on the Đắk Pét post and to back the Civil Guard in holding strategic hamlets. Battalion 407 (sappers) joins Battalion 200 and the sweep is beaten: hundreds put out of action, many arms and goods taken, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 245. Check: the day; the history does not date the sweep and puts it after the Đắk Pét attack of May 1963.'
