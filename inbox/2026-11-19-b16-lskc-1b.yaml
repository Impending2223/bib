      also:
      - vietnam-hanoi
      c: American pilots are ordered to bomb as they see fit in the Pathet Lao's zone, June 14, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 369. Check: the order itself not read here.'
