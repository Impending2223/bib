      date: '1960-09'
      place: ky-sanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. In September, backed by the Tam Kỳ district's armed work team, the people of Kỳ Sanh commune rise, kill the oppressors and free Tú Mỹ hamlet, the first in the province's plain.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 377. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
