      place: muc-thinh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Định. In March four guerrillas of Vân Canh district, who have worked loose the rail with metal pipes and rattan cords, pull a rail out as a Saigon military train reaches Mục Thịnh; the engine runs off the track.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 354. Check: the day; the history''s sentence breaks off at the engine.'
