      date: '1964-09'
      place: quang-ngai
      thread: vietnam-hanoi
      also:
      - vietnam-saigon
      c: Quảng Ngãi. In September over 20,000 people of Tư Nghĩa, Nghĩa Hành, Bình Sơn and Sơn Tịnh districts go into Quảng Ngãi town and surround the province offices, against the military dictatorship and the draft, and for an end to American intervention.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 357–58. Check: the day.'
      tags:
      - polity:drv
