      place: tuy-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      - vietnam
      c: Phú Yên. The guerrillas of Tuy Hòa take an American adviser alive in broad daylight.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 361. Check: the day, the time of day and the adviser''s name, against the American record.'
