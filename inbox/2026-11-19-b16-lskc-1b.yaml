      c: Bình Thuận. After hurting the Phi Long and Phi Hổ strongpoints, the province's troops with Bắc Bình district's ambush a convoy of military goods at Bàu Sen, on Route 1, and destroy a Civil Guard company and four Self-Defense platoons sweeping, taking 160 infantry weapons. They then strike the Bình Lâm post and hurt a Civil Guard company there.
