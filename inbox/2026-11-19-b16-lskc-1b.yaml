      c: 'Quảng Nam. In May, at the time of the Măng Xim fight, the province''s local forces and guerrillas go down to the stretch of Route 1: 32 hamlets of 12 communes west of Tam Kỳ rise and take power; some targets in the town are raided and the Mò O strongpoint destroyed.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 253. Check: the day; the history puts it at the time of the Măng Xim fight, May 4–15.'
