      c: Tây Ninh. Battalions 1 and 2 of the Central Office's main-force regiment, code Q761, hold their ceremony of making themselves known in the Dương Minh Châu war zone, Feb. 9.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 47. Check: the history prints 9-2-1961 but dates the Central Office''s decision to form the regiment July 1961; a second ceremony, Feb. 9, 1962, at Trảng Dài, names it Regiment 1 (see [[cal.1962-02-09.vietnam-hanoi]]); the year of this one may be a misprint.'
