      when: Dec.
      date: '1964-12'
      place: ba-dua
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. In December Military Region 8 destroys the Ba Dừa subsector.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 387. Check: the day; the American record has Thăng Long 27 taking Ba Dừa from the Viet Cong, Nov. 21 ([[cal.1964-11-21.vietnam-operations]]).'
      tags:
      - polity:drv
