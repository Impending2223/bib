      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Trị–Thiên. June 12 Kon Sâm kills a Saigon major with a poisoned crossbow bolt in the hamlet of Kon Kô.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351. Check: the place.'
      tags:
      - polity:drv
      - ok:fields-place
