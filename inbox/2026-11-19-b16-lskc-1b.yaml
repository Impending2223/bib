      thread: laos
      also:
      - vietnam-hanoi
      c: Under American pressure Souvanna Phouma lets Thailand send troops openly into Laos, Dec. 19, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 369. Names: Souvanna Phouma. Check: the American record not read.'
      tags:
