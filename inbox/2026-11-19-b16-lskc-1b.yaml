      place: bau-coi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. Apr. 3 Regiment 1 (Q761) catches a Saigon commando company in a mobile attack at Bàu Cói, north of Bà Đen.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 345–46.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-11-18.vietnam-hanoi
      when: Nov. 18
      date: '1964-11-18'
      place: cha-lo
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      - laos
      c: Quảng Bình. American aircraft bomb the Cha Lo area, in the west, Nov. 18. Company 3, Battalion 14 (antiaircraft artillery), 325th Division, Military Region 4, under the company commander Lê Hữu Mai and the political officer Nguyễn Viết Xuân, fires back. Xuân is badly wounded and urges the gunners on; the gun-squad leader Nguyễn Duy Dĩnh keeps command with his clothes on fire.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 370. Names: Lê Hữu Mai, Nguyễn Viết Xuân, Nguyễn Duy Dĩnh. Check: the American record not read.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-05-03.laos
      when: May 3
      date: '1964-05-03'
      thread: laos
      also:
      - vietnam-hanoi
      c: Phoumi asks the SEATO armies to intervene in Laos, by the history's account, at the Americans' direction.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 369. Names: Phoumi Nosavan. Check: the history prints "3-5-1964" ahead of events of June; the American record not read.'
      tags:
      - polity:drv
      - name:phoumi-nosavan
