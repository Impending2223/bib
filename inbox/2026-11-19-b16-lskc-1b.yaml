      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Đà. May 28 Battalion 1 of the province's local troops attacks and destroys two Civil Guard companies and seven Self-Defense platoons at Duy Xuyên.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 434.'
      tags:
      - polity:drv
