    entry:
      id: cal.1960-03-30.vietnam-hanoi-3
      when: Mar. 30
      date: '1960-03-30'
      place: binh-ba
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bà Rịa. The evening of Mar. 30 Company 40, the province's armed force, marches to a point 100 m from the three posts (Civil Guard, Civil Guard rural force and military police) at the Bình Ba rubber plantation, on Route 2, 8 km north of Bà Rịa. Two squads block the relief on both ends of Route 2; the rest in three prongs hit the posts with grenades and satchel charges. Eight weapons and over a ton of ammunition taken, the military police post chief seized, by the history's count. The rising of the rubber workers of Xà Bang, Xuân Sơn, Ngãi Giao and Sông Cầu follows.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 346–47. Check: the hour of the attack; the history gives the evening of the march to the assembly point.'
      tags:
      - polity:drv
      time_range:
      - 1960-03-30T11:00Z
      - 1960-03-30T14:00Z
      time_band: evening
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-04-06.vietnam-hanoi
      when: Apr. 6
      date: '1960-04-06'
      place: dat-do
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bà Rịa. The night of Apr. 6 the Đất Đỏ district's armed propaganda team destroys the Civil Guard post of Long Mỹ commune and takes four weapons, by the history's count. The people rise, beat drums and clappers and burn the commune council's house; the Saigon side in the place flees to the district seat. The team then works along Routes 52 and 23, backing the risings of Đất Đỏ, Long Hội Mỹ, Long Tân, Long Điền and An Ngãi.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 347.'
      tags:
      - polity:drv
      time_range:
      - 1960-04-06T14:00Z
      - 1960-04-06T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
