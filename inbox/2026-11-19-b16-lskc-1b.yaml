      date: '1960-09-23'
      place: tan-thach
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 23 Company 261, formed in June, ambushes a Civil Guard platoon at Tân Thạch, Châu Thành, on its way from Mỹ Tho to the town, and destroys it.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364. Check: the clock.'
