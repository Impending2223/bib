      when: Sept. 20
      date: '1960-09-20'
      place: hiep-duc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Nam. Sept. 20 the province''s armed force with the district''s armed work team attacks the Hiệp Đức district seat: a Civil Guard company destroyed, all its arms taken, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 377.'
      tags:
      - polity:drv
