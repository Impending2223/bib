      - polity:rvn
- add:
    entry:
      id: cal.1964-09.vietnam-hanoi
      when: Sept.
      date: '1964-09'
      place: quang-ngai
      thread: vietnam-hanoi
      also:
      - vietnam-saigon
      c: Quảng Ngãi. In September over 20,000 people of Tư Nghĩa, Nghĩa Hành, Bình Sơn and Sơn Tịnh districts go into Quảng Ngãi town and surround the province offices, against the military dictatorship and the draft, and for an end to American intervention.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 357–58. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-01.vietnam-hanoi-4
      when: Jan.
      date: '1964-01'
      place: kien-tuong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Kiến Tường. At the end of 1963 and the start of 1964, with Diệm down and Saigon in crisis, the province presses its acts and frees all of zone 4, most of zone 6 and four communes of zone 8 (Vĩnh Thạnh, Vĩnh Lợi, Vĩnh Đại, Hưng Điền).
      n: '[[w.lich-su-khang-chien-chong-my]], III, 359. Check: the day; the history gives "the end of 1963 and the start of 1964".'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-10.vietnam-hanoi-2
      when: Oct.
      date: '1964-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Region 5. In October the region has a flood without equal in a hundred years: thousands of villages under water, food and crops swept away, hunger threatening. Saigon sweeps with motor boats and amphibious vehicles and bombs the crowded villages. The Region Committee and command hold to the plan of operations and relieve the flooded; the North and the Nam Bộ provinces send food and medicine, hundreds of trucks and boats through the blockade.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 387–88. Check: the day; the American record has the aid mission''s flood relief of Nov. 17 ([[cal.1964-11-17.vietnam]]), the flood of the central coast in November.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-4
      when: Dec.
      date: '1964-12'
      place: ba-dua
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. In December Military Region 8 destroys the Ba Dừa subsector.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 387. Check: the day; the American record has Thăng Long 27 taking Ba Dừa from the Viet Cong, Nov. 21 ([[cal.1964-11-21.vietnam-operations]]).'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12-30.vietnam-hanoi-3
      when: Dec. 30–31
      date: '1964-12-30'
      place: long-khanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long Khánh. The province's local troops overturn a Saigon train, Dec. 30 or 31.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 387. Check: the day; the history gives "Dec. 30 and 31" for this act and the Đồng Sổ ambush together.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-5
      when: Dec.
      date: '1964-12'
      place: tam-ky
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. In December, at the time of the An Lão fight, the province's armed forces raid the Saigon side in Tam Kỳ town, and the people of the area rise and break the strategic hamlets, widening the area they hold to the edge of the town.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 392. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-6
      when: Dec.
      date: '1964-12'
      place: quang-nam
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. In December, at the time of the An Lão fight, the province's armed forces shell the Cây Xanh strongpoint, near Tam Kỳ.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 392. Check: the day; the place of Cây Xanh not given beyond the province.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-7
      when: Dec.
      date: '1964-12'
      place: phu-yen
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phú Yên. In December, with armed attack and political struggle, the province beats a Saigon sweep into Tuy Hòa and Đồng Xuân districts.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 393. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-12.vietnam-hanoi-8
      when: Dec.
      date: '1964-12'
      place: khanh-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Khánh Hòa. In December the province's armed force destroys the Phú Thọ post and breaks the hold on Ninh Phú, Ninh Đa and Vạn Hưng communes; the people rise and free 11 communes of Diên Khánh and Ninh Hòa.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 393. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-02-07.vietnam-hanoi-2
      when: Feb. 7
      date: '1965-02-07'
      place: dong-hoi
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: Quảng Bình. Feb. 7 the Air Defense–Air Force command, on the Politburo's and the Central Military Party Committee's alert, puts units on alert from early morning. At 1:53 p.m. the radar of Company 2, Radar Regiment 290 (Lương Hữu Sắt, Nguyễn Đặng Tuất), picks up the first flight, from the Phú Hội dunes, bombing Đồng Hới town. The antiaircraft guns of the 325th and 341st Infantry Divisions, two navy patrol boats at Nhật Lệ and the militia shoot down three American aircraft, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 404–05. Names: Lương Hữu Sắt, Nguyễn Đặng Tuất. Check: the clock; the American record not read ([[cal.1965-02-07.vietnam]] has the day''s strikes).'
      tags:
      - polity:drv
      time: '1965-02-07T06:53Z'
      time_zone: Asia/Bangkok
- add:
    entry:
      id: cal.1965-02-08.vietnam-hanoi-2
      when: Feb. 8
      date: '1965-02-08'
      place: ho-xa
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Quảng Bình. Feb. 8 American aircraft with the South Vietnamese air force under Nguyễn Cao Kỳ strike Hồ Xá, Vĩnh Linh, and Đồng Hới town. The air defense of the two areas, warned in time, shoots down three over Vĩnh Linh and two over Đồng Hới: eight in the two days, by the history''s count. The 37-mm battalion of Lại Đạt and Nguyễn Nghị goes from Vinh to Đồng Hới; Regiment 234''s 14.5-mm machine guns and two battalions of the artillery officers'' school go to Vĩnh Linh and Quảng Bình.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 405–06. Names: Nguyễn Cao Kỳ. Check: the American record not read; the place field takes the first target.'
      tags:
      - polity:drv
      - name:nguyen-cao-ky
- add:
    entry:
      id: cal.1965-02-11.vietnam-hanoi
      when: Feb. 11
      date: '1965-02-11'
      place: ho-xa
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Quảng Bình. Feb. 11 American aircraft hit Hồ Xá, the Vĩnh Linh area, Cồn Cỏ island, Đồng Hới and near places. The air defense shoots down an F8U and takes the pilot, Maj. Robert Shumaker, on Lý Ninh hill; at the Gianh port Company 54 and the machine-gun units, the river fishermen''s self-defense and the militia down two. Quảng Bình''s total for the day: six aircraft, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 406. Check: the pilot''s name is printed in the history in Vietnamese transcription ("Rôbơt Sumếchcơ"); the American record not read.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-04-03.vietnam-hanoi
      when: Apr. 3
      date: '1965-04-03'
      place: ham-rong
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Thanh Hóa. Apr. 3, the Air Defense–Air Force command having decided the night before to use fighters at the Hàm Rồng bridge, American aircraft bomb the Đò Lèn bridge in the morning; the antiaircraft of Regiment 234 and the local forces shoot down an F4 in the first minute. At 10 a.m. they bomb the Hàm Rồng bridge area, and two flights of MiG-17s of the 921st Fighter Regiment, under Phạm Ngọc Lan and Trần Hanh, go up with the ground defense: after a flight of 20 minutes they have shot down two F8s and return safe. At 12:50 p.m. a second raid on the bridge; the antiaircraft fights nearly two hours, a militia machine-gun crew under Phạm Gia Huấn downs a plane. Eight American aircraft down in the day, by the history''s count. Apr. 3 becomes the day of the Vietnamese People''s Air Force.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 410. Names: Phạm Ngọc Lan, Trần Hanh, Phạm Gia Huấn. Check: the American record ([[cal.1965-04-03.vietnam]]) has the two F-105s lost to MiGs on Apr. 4, not F-8s on Apr. 3; the clock times are Hanoi''s.'
      tags:
      - polity:drv
      time: '1965-04-03T03:00Z'
      time_zone: Asia/Bangkok
- add:
    entry:
      id: cal.1965-04-04.vietnam-hanoi-2
      when: Apr. 4
      date: '1965-04-04'
      place: pha-ghep
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Thanh Hóa. Apr. 4, at 8:20 a.m., American aircraft bomb the Ghép ferry on the Yên River, as three antiaircraft companies of Regiment 234 from Nghệ An, sent overnight to the Hàm Rồng, are crossing: the guns are fired from their tow vehicles. Thirty minutes: three aircraft shot down, a pilot taken. At 9:30 a.m. a second raid: Companies 2 and 5 of the regiment and a machine-gun crew, with the militia of both banks, set seven aircraft afire, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 411. Check: the clock; the history gives Hanoi''s hours; the American record not read.'
      tags:
      - polity:drv
      time: '1965-04-04T01:20Z'
      time_zone: Asia/Bangkok
- add:
    entry:
      id: cal.1965-04-04.vietnam-hanoi-3
      when: Apr. 4
      date: '1965-04-04'
      place: ham-rong
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Thanh Hóa. Apr. 4 American aircraft raid the Hàm Rồng bridge in waves: at 8:30 a.m. an F-105 is shot down at once; at 9:30 a second raid; at 10:05 a third, driven off by the fire of patrol boats 120 and 186 and the batteries of Regiments 228, 280 and 234 and the militia, the bombs falling at random on the villages. A flight under Trần Hanh attacks the rear of the F-105s and in four minutes of air fighting shoots down two. The bridge stands.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 411–12. Names: Trần Hanh. Check: the clock; the American record has two F-105s lost to MiGs, Apr. 4 ([[cal.1965-04-03.vietnam]], [[cal.1965-04-04.vietnam-air-war]]).'
      tags:
      - polity:drv
      time: '1965-04-04T01:30Z'
      time_zone: Asia/Bangkok
- add:
    entry:
      id: cal.1965-02-21.vietnam-saigon
      when: Feb. 21
      date: '1965-02-21'
      place: saigon
      thread: vietnam-saigon
      also:
      - vietnam
      c: Saigon. Phan Khắc Sửu, chief of state, signs a decree naming Trần Văn Minh acting commander in chief in Nguyễn Khánh's place, Feb. 21, under pressure of the young generals who overthrew Khánh the day before. Khánh is out after 13 months.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 395. Names: Phan Khắc Sửu, Trần Văn Minh, Nguyễn Khánh. Check: the American record not read; compare [[cal.1965-02-20.vietnam-saigon]].'
      tags:
      - name:phan-khac-suu
      - name:tran-van-minh
      - name:nguyen-khanh
      - polity:rvn
