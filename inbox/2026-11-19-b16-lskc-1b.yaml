      id: cal.1962-04-20.vietnam-hanoi
      when: Apr. 20
      date: '1962-04-20'
      place: dien-ngoc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. Apr. 20 a Saigon commando company and nearly a platoon of Civil Guard and Self-Defense men surround a squad of seven sappers under Lê Tấn Hiền and Võ Như Hưng, with three cadres of Điện Bàn, in Hamlet 4, Điện Ngọc commune. The ten fight all day, from a dry well in the middle of a field, against a force 50 times theirs; at night they draw the Saigon side off and get out with the wounded. Over 100 of the Saigon side killed, by the history's count; four of the ten dead, one wounded.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 173–74. Names: Lê Tấn Hiền, Võ Như Hưng.'
      tags:
      - polity:drv
      - ok:fields-time
