- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-2
      when: Feb., mid
      date: '1960-02'
      place: thoi-hoa-ben-cat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thủ Dầu Một. In mid-February, as the garrison of the Thới Hòa post, Bến Cát, has just drawn its pay, the commune's Party branch with the men inside holds a drinking party, collects the guns and, when the garrison is drunk, kills the oppressors and calls on the rest to give up. Outside the people with the soldiers' families go to the post to win their men over. The post is taken with all its arms, the commune guards disbanded, the government offices burned and a commune self-defense force built. Thới Hòa is the province's spearhead.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 344. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-3
      when: Feb., early
      date: '1960-02'
      place: tay-ninh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. In early February the province sets up Battalion 14; Châu Thành district sets up Company 40, Gò Dầu and Trảng Bàng Company 33A, Bến Cầu Company 61 and Dương Minh Châu district Company 31A.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 333. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-4
      when: Feb.
      date: '1960-02'
      place: cu-chi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Gia Định. From February many country places of Gia Định rise and take the hamlets. At Củ Chi the district committee orders "all rise together, break up the countryside": with the district''s armed team the people go into the commune information houses and tear up Diệm''s portraits, the three-stripe flags and the anticommunist slogans; thousands demonstrate on Routes 7 and 15 with leaflets and banners; the commune and hamlet heads flee. By March the people hold Phú Mỹ Hưng and Nhuận Đức communes, parts of An Nhơn Tây and Trung Lập and the north of Củ Chi.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 348–49. Check: the day; the history gives "from February" and the district committee''s order undated.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-5
      when: Feb.
      date: '1960-02'
      place: cu-chi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gia Định. In the same time the Region's armed unit C13, working in Củ Chi, Bình Chánh, Nhà Bè, Duyên Hải, Thủ Đức and Dĩ An districts, destroys the An Hòa, Tân Thạnh Tây, Trung Hòa and An Nhơn Tây posts and the Bến Mương restaurant, to back the people's rising.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 348. Check: the days; the history gives no dates; the place field takes the first district.'
      tags:
      - polity:drv
