      c: 'Bến Tre. At the end of April and the start of May the province''s military board takes Companies 1 and 2 of the main force to the Thạnh Phong base, Thạnh Phú district, to train: covered L-shaped bunkers, fire at helicopters and M113s, mobile attack and ambush from squad to company, on the model of Ấp Bắc.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 269–70. Check: the day.'
      tags:
      - polity:drv
