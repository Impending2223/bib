    entry:
      id: cal.1965-06.vietnam-hanoi-4
      when: June
      date: '1965-06'
      place: duc-co
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Gia Lai. After the ambush on Route 19 west, Regiment 320 besieges the Đức Cơ special forces camp and ambushes the force sent to relieve it: 40 vehicles destroyed, by the history''s count. The province''s and districts'' local forces help the guerrillas and people break the strategic hamlets from Thanh An to Đức Cơ.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 432. Check: the day; the history gives none; the American record has the Đức Cơ battle ([[cal.1965-06.vietnam-operations]], [[cal.1965-08-01.vietnam-operations]]).'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-07.vietnam-hanoi-3
      when: July
      date: '1965-07'
      place: tam-ky
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Nam. In July the province''s armed force destroys the field command post of the Saigon 2d Division in the middle of Tam Kỳ town and fights on the road from the An Tân bridge to the Ông Bộ bridge: hundreds of Saigon soldiers and many American advisers killed, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 433. Check: the day; the history puts it after the second Ba Gia fight of July 5.'
      tags:
      - polity:drv
