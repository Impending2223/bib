      c: Region 6. Battalion 840 of the region takes the Hằng Tổ strongpoint by surprise and ambushes a column of 21 military vehicles on Route 21, to draw Saigon forces off, and helps the Bahnar to kill oppressors and break up a concentration zone.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 260. Check: the day; the history gives neither the date nor the province.'
