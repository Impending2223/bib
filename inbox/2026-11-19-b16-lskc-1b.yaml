      c: Kiến Tường. Saigon's long operation Đức Thắng 23, which struck south Mộc Hóa Mar. 19, strikes along the Năm Ngàn canal, June 20. The Provincial Committee and the military board order the main, local and guerrilla forces to lie in wait and strike the columns.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 273. See [[cal.1963-03-19.vietnam-hanoi]].'
      tags:
      - polity:drv
