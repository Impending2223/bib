      - vietnam-saigon
      c: Saigon. Aug. 18–22 pupils and students hold a large symposium condemning the Americans and Khánh and demanding that the Vũng Tàu charter be cancelled. It opens the street struggle against the charter in the cities.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 357. Names: Nguyễn Khánh. Check: the place of the symposium; the history gives the city only by the next sentence.'
      tags:
      - name:nguyen-khanh
      - polity:rvn
