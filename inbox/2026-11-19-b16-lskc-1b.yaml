      date: '1960-09-23'
      place: cau-nha-thuong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The night of Sept. 23 the town's self-defense destroys the Self-Defense post at the Nhà Thương bridge and takes the arms of the guard at the Cái Cối bridge. The town had been empty and the shops shut that day on a rumor that the Viet Cong would attack in force.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364. Check: the hour.'
