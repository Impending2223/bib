- add:
    entry:
      id: cal.1961-02-09.vietnam-hanoi
      when: Feb. 9
      date: '1961-02-09'
      place: duong-minh-chau
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. Battalions 1 and 2 of the Central Office's main-force regiment, code Q761, hold their ceremony of making themselves known in the Dương Minh Châu war zone, Feb. 9.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 47. Check: the history prints 9-2-1961 but dates the Central Office''s decision to form the regiment July 1961; a second ceremony, Feb. 9, 1962, at Trảng Dài, names it Regiment 1 (see [[cal.1962-02-09.vietnam-hanoi]]); the year of this one may be a misprint.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-08-10.vietnam-hanoi-2
      when: Aug. 10
      date: '1961-08-10'
      place: gia-truc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 6. A squad of Battalion 120 of the military region, with Pi Năng Tắc, lures Saigon troops into a "stone trap" laid at the Gia Trúc pass, on the Tương River bank, and fires as the stones are brought down from the mountain: over 80 killed or wounded, by the history''s count. Fighters cover the Saigon side and two helicopters carry the dead out that day.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 161–62. Names: Pi Năng Tắc. Check: the province of the pass; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-12-29.vietnam-hanoi-2
      when: Dec. 29
      date: '1961-12-29'
      place: hon-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rạch Giá. Saigon sweeps Châu Thành district with thousands of men, regular, Civil Guard and Self-Defense, Dec. 29. The district Party office, the district troops, militia and guerrillas hold three days, then shut themselves in the Hòn cave, halfway up Hòn Đất. Saigon, led by American advisers, surrounds the hill; poison in the stream, fire and smoke into the cave; up to 32 assaults beaten off in a day. The U Minh Battalion marches from An Biên to break the siege and the districts of Hà Tiên, Giồng Riềng and Gò Quao attack posts to draw the Saigon side off. After ten days Saigon withdraws, hundreds of dead and wounded with it, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 164–65. Check: the last day of the ten.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1962-01-09.vietnam-hanoi
      when: Jan. 9
      date: '1962-01-09'
      place: hon-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rạch Giá. Phan Thị Ràng (Tư Phùng), the district's youth cadre, dies Jan. 9 under torture. She had carried water into the Hòn cave to the besieged force, and was taken.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 165. Names: Phan Thị Ràng. Check: the place of her death; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1963-06-16.vietnam-2
      when: June 16
      date: '1963-06-16'
      place: xa-loi
      thread: vietnam
      also:
      - vietnam-saigon
      c: Saigon. The morning of June 16, by the history's count some 700,000 people and Buddhists go into the streets together to the Xá Lợi pagoda, where the body of Thích Quảng Đức lies. The special police disperse them with tear gas and dogs; many wounded and arrested.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 312. Names: Thích Quảng Đức. Check: the figure is the history''s ("70 vạn"); the joint communiqué of the same day is [[cal.1963-06-16.vietnam]].'
      tags:
      - polity:drv
      - name:thich-quang-duc
      time_range:
      - '1963-06-15T22:00Z'
      - '1963-06-16T04:00Z'
      time_band: morning
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1963-10-15.vietnam-saigon
      when: Oct. 15
      date: '1963-10-15'
      thread: vietnam-saigon
      also:
      - vietnam-operations
      c: Hậu Nghĩa province is set up, Oct. 15, from the districts of Củ Chi and Trảng Bàng (Tây Ninh) and Đức Hòa and Đức Huệ (Long An).
      n: '[[w.lich-su-khang-chien-chong-my]], III, 279 n.1. Check: the history''s note gives the date; the decree not read.'
      tags:
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1963.vietnam-hanoi-2
      when: '1963, second half'
      date: '1963'
      at: before 1963-07
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 5. In the second half of 1963 its people and armed forces open a peak period of activity: they beat the sweeps and destroy more posts and bases in Quảng Nam, Quảng Ngãi, Bình Định and Phú Yên. With the main forces they have the worst oppressors punished.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 249. Check: the history prints "the second half of 1968", a misprint for 1963.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1963.vietnam-hanoi-3
      when: '1963'
      date: '1963'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. Battalion 95 of Regiment 2, with a sapper unit, attacks the Long Lếch strongpoint, west of Gia Vụt, and destroys an infantry company and an artillery platoon of the Saigon army.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 249. Check: the day; the history puts it at the time of the liberation of Phổ An and Phổ Quang, which it dates elsewhere to Apr. 28, and after the coup of November.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1964-04-03.vietnam-hanoi
      when: Apr. 3
      date: '1964-04-03'
      place: bau-coi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. Apr. 3 Regiment 1 (Q761) catches a Saigon commando company in a mobile attack at Bàu Cói, north of Bà Đen.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 345–46.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-11-18.vietnam-hanoi
      when: Nov. 18
      date: '1964-11-18'
      place: cha-lo
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      - laos
      c: Quảng Bình. American aircraft bomb the Cha Lo area, in the west, Nov. 18. Company 3, Battalion 14 (antiaircraft artillery), 325th Division, Military Region 4, under the company commander Lê Hữu Mai and the political officer Nguyễn Viết Xuân, fires back. Xuân is badly wounded and urges the gunners on; the gun-squad leader Nguyễn Duy Dĩnh keeps command with his clothes on fire.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 370. Names: Lê Hữu Mai, Nguyễn Viết Xuân, Nguyễn Duy Dĩnh. Check: the American record not read.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-05-03.laos
      when: May 3
      date: '1964-05-03'
      thread: laos
      also:
      - vietnam-hanoi
      c: Phoumi asks the SEATO armies to intervene in Laos, by the history's account, at the Americans' direction.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 369. Names: Phoumi Nosavan. Check: the history prints "3-5-1964" ahead of events of June; the American record not read.'
      tags:
      - polity:drv
      - name:phoumi-nosavan
