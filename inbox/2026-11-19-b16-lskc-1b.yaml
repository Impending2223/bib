      when: 'Nov., late'
      date: '1963-11'
      place: long-tan-long-thanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Biên Hòa. In late November the unit's agitation among the troops brings the garrison of the Long Tân post to lay down its arms; cadres go down to the hamlets and the people rise and take power. Over 1,000 young men are signed up for the armed force in the same time.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 296. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
