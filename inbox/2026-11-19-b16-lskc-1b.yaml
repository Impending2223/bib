    entry:
      id: cal.1960-06.vietnam-hanoi-2
      when: June
      date: '1960-06'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Company 261 of the province's armed force is formed in June.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364 n.1. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1960-11.vietnam-hanoi-2
      when: Nov.
      date: '1960-11'
      place: khanh-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Khánh Hòa. In November the province's forces break the Cây Dầu post zone, and the areas of Tà Lương and Suối Hai are freed.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 375. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11.vietnam-hanoi-3
      when: Nov.
      date: '1960-11'
      place: phuoc-tan-son-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phú Yên. In November the province's armed force opens a campaign to free the highlands of Sơn Hòa district. The armed work teams back the people of Phước Tân commune, who kill the oppressors, end Saigon's rule and set up a self-government board; Quang Hiển, Tân Vinh, Phước Thuận, Đá Mài and Phú Mỡ follow. By the end of the year the west of the district is held, 13,000 people free.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 380–81. Check: the days.'
      tags:
      - polity:drv
      - ok:fields-at
- add:
    entry:
      id: cal.1963.vietnam-hanoi-9
      when: '1963, early'
      date: '1963'
      at: before 1963-01
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Military Region 4. In early 1963, on the region''s direction, the armed forces of Nghệ An, Hà Tĩnh and Quảng Bình open a drive to "build the reserve force": better militia, self-defense and local troops, and the registering and training of reservists. At Vĩnh Linh, on the line with the South, the Party committee and the Region command order vigilance and readiness without answering provocation.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 116. Check: the day.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
