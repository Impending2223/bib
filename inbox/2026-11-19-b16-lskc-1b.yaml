      place: phuoc-tuy
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bà Rịa, Long Khánh. From March the destroying of the strategic hamlets goes fast: Bình Lộc, Bảo Chánh, Bảo Vinh and Suối Cát are freed, and the freed area spreads to the Route 2 region, Châu Thành and Long Đất.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 360. Check: the day; the history gives no end to the stretch.'
