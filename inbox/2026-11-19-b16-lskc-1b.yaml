      when: June
      date: '1960-06'
      place: binh-dinh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Định. The provincial Party congress, June, resolves that armed struggle shall back the political movement of the masses more strongly.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379 n.1 (the resolution, in the Bình Định Party History Board''s archive). Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
