    entry:
      id: cal.1963-09.vietnam-hanoi-6
      when: Sept.
      date: '1963-09'
      place: cau-van
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. In September, with the main force's new Company 3 and Thạnh Phú's troops, a raid hurts Civil Guard Company 854 heavily at Cầu Ván, Giao Thạnh commune, and the people of some strategic hamlets of the district rise and break them.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 272. Check: the day; the history dates it "in the same time" as the Mỹ Nhơn and Sơn Phú fights of Sept. 2 and 9.'
      tags:
      - polity:drv
- add:
    entry:
