      c: Cần Thơ. The province's troops with Phụng Hiệp district's destroy four posts and break the strategic hamlets where Châu Thành, Phụng Hiệp and Kế Sách districts meet.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 360. Check: the day.'
