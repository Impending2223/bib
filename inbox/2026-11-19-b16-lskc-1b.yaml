      when: Oct.–Dec.
      date: '1963-10'
      place: ba-dua
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. In the stretch of October to December Battalion 261 besieges the Ba Dừa strongpoint, south of Route 4, and its garrison surrenders. The posts of Long Trung, Long Khánh, Long Tiên, Tam Bình, Cẩm Sơn and Xuân Sơn are abandoned; the battalion goes on to free Đông Hòa and Hiệp Đức.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 282. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1963-11.vietnam-hanoi-5
      when: 'Nov., late'
      date: '1963-11'
      place: long-thanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Biên Hòa. In late November, after the Route 15 ambush, a party of Long Thành''s troops in Saigon uniforms drives into the Đờ La post in the post commander''s own car and takes it: the post chief and the hamlet chief seized.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 295–96. Check: the day; the place of Đờ La.'
      tags:
      - polity:drv
      - ok:fields-place
