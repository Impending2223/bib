      c: Saigon. The Saigon government holds an exhibition of the armed forces' "achievements" before the City Hall, with modern arms, for the national day. Commandos of Team 155 throw grenades at the helicopter on show and kill Maj. Phan Bội Ngọc, who was giving the commentary; the exhibition is closed that day.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 185. Names: Phan Bội Ngọc. Check: the American record not read.'
