      c: Region 6. Battalion 840 of the region takes the Hằng Tổ strongpoint by surprise and destroys a column of 21 military vehicles on Route 21, by the history's count, to draw Saigon forces off, and helps the Bahnar to kill oppressors and break up a concentration zone.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 260. Check: the day; the place.'
