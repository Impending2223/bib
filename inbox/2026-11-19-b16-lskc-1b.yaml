      c: 'Quảng Ngãi, Bình Định. In the stretch of July to October the two provinces hold 1,524 direct struggles against the Saigon side, over a million people in all, and destroy strategic hamlets 1,876 times: over 400 of the 900 built, by the history''s count.'
