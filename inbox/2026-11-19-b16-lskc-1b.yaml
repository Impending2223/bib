    entry:
      id: cal.1960-09-24.vietnam-hanoi-3
      when: Sept. 24
      date: '1960-09-24'
      place: chau-phu
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 24 in Châu Phú commune, Giồng Trôm, Chống, commander of the Civil Guard company and a man of the Party inside, gathers his company to collect their guns for inspection; a squad of Company 261 in Civil Guard dress walks into the post and takes the arms as the soldiers are called on to give up; the people raze the post. Another party takes the Nhà Thờ post by lam taxi without a shot.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364. Check: the hour; the history places it with the rising at 5 p.m. of Sept. 24.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-24.vietnam-hanoi-4
      when: Sept. 24
      date: '1960-09-24'
      place: ba-lai-river
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bến Tre. About Sept. 24 the communes of Phong Nẫm, Phong Mỹ, Châu Bình and Châu Hòa, with the armed force and men inside, force the surrender and raze the posts along the Ba Lai river: a large free area, 100 weapons and over 100 prisoners taken. Over the night of Sept. 24 hundreds of thousands in nearly 100 communes beat drums and clappers, burn torches and march round the posts; 20 posts of Giồng Trôm give up their arms, 10 of Ba Tri are destroyed or surrender, and dozens in Châu Thành, Bình Đại and Thạnh Phú.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 365. Check: the day; the history gives "the same time" as the Châu Phú fight of Sept. 24.'
      tags:
      - polity:drv
      time_range:
      - '1960-09-24T14:00Z'
      - '1960-09-24T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-10-03.vietnam-hanoi
      when: Oct. 3
      date: '1960-10-03'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Oct. 3 the province sends Company 261 from Giồng Trôm to help in Mỏ Cày, where Saigon holds firm. Over the Hàm Luông with men inside it takes the Cái Quao post and frees An Định commune, goes on to Hương Mỹ; the Self-Defense men of the Tân Trung post flee; Minh Đức post is besieged and surrenders. In north Mỏ Cày the district's platoon forces the Thanh Tân and Tân Phú Tây posts and isolates Cái Mơn; a series of communes, Catholic ones too, rise.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 365. Check: the day of each post; the history gives Oct. 3 for the move.'
      tags:
      - polity:drv
