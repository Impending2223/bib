- add:
    entry:
      id: cal.1960-02-24.vietnam-hanoi-2
      when: Feb. 24
      date: '1960-02-24'
      place: cay-me-my-tho
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. Unit 514, the province's armed force, dressed as Saigon troops, lies in ambush at Cây Me, Long An commune, Châu Thành, on Route 4, for the truck carrying the garrison's pay, Feb. 24. The attack is not carried out.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-25.vietnam-hanoi-3
      when: Feb. 25
      date: '1960-02-25'
      place: my-tho
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. The province calls the rising in all its communes, Feb. 25. In Long An commune, Châu Thành, the chosen point, the people with the province's armed force burn the watch post and seize the hamlet chiefs and neighborhood heads for a warning. Along the Nguyễn Văn Tiếp canal, from Hưng Thạnh to Thiên Hộ, they beat drums and wooden clappers and tear down the neighborhood signs and anticommunist slogans. Battalion 514 does armed propaganda in seven communes. The political force too weak, the province does not take control.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-25.vietnam-hanoi-4
      when: Feb. 25
      date: '1960-02-25'
      place: go-cong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gò Công. The night of Feb. 25 an armed team in East Gò Công and Vàm Láng kills the village representative Chớ and hangs banners urging the rising. The Saigon side finds the team, kills four and takes one. The rising fails.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335. Check: the history gives Chớ''s post as "đại diện" (representative) only.'
      tags:
      - polity:drv
      time_range:
      - '1960-02-25T14:00Z'
      - '1960-02-25T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-03-30.vietnam-hanoi-3
      when: Mar. 30
      date: '1960-03-30'
      place: binh-ba
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bà Rịa. The evening of Mar. 30 Company 40, the province's armed force, marches to a point 100 m from the three posts (Civil Guard, Civil Guard rural force and military police) at the Bình Ba rubber plantation, on Route 2, 8 km north of Bà Rịa. Two squads block the relief on both ends of Route 2; the rest in three prongs hit the posts with grenades and satchel charges. Eight weapons and over a ton of ammunition taken, the military police post chief seized. The rising of the rubber workers of Xà Bang, Xuân Sơn, Ngãi Giao and Sông Cầu follows.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 346–47. Check: the hour of the attack; the history gives the evening of the march to the assembly point.'
      tags:
      - polity:drv
      time_range:
      - '1960-03-30T11:00Z'
      - '1960-03-30T14:00Z'
      time_band: evening
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-04-06.vietnam-hanoi
      when: Apr. 6
      date: '1960-04-06'
      place: dat-do
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bà Rịa. The night of Apr. 6 the Đất Đỏ district's armed propaganda team destroys the Civil Guard post of Long Mỹ commune and takes four weapons. The people rise, beat drums and clappers and burn the commune council's house; the Saigon side in the place flees to the district seat. The team then works along Routes 52 and 23, backing the risings of Đất Đỏ, Long Hội Mỹ, Long Tân, Long Điền and An Ngãi.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 347.'
      tags:
      - polity:drv
      time_range:
      - '1960-04-06T14:00Z'
      - '1960-04-06T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-04.vietnam-hanoi-2
      when: Apr.
      date: '1960-04'
      place: long-khanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Long Khánh. From April, moved by the Bà Rịa rising, the people of many places rise to kill the oppressors, break the controls and take the commune and hamlet governments, in various degrees.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 347. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-05-06.vietnam-hanoi
      when: May 6
      date: '1960-05-06'
      place: can-tho
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Cần Thơ. May 6 four Saigon battalions sweep Rạch Ông Dựa, Trường Thành, Ô Môn. The Tây Đô Battalion with Ô Môn''s district force beats the sweep: 200 killed, six taken, 30 weapons and much equipment, by the history''s count. The first large sweep the province beats.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 341–42.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-06-12.vietnam-hanoi
      when: June 12
      date: '1960-06-12'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Trị–Thiên. June 12 Kon Sâm kills a Saigon major with a poisoned crossbow bolt in the hamlet of Kon Kô.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351. Check: the history does not name the province of Kon Kô.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1960-07.vietnam-hanoi-3
      when: July
      date: '1960-07'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thừa Thiên. In July the guerrillas and young men of La Đụt kill three Saigon men from the A Lưới post and take three weapons.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351. Check: the day.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1960-07.vietnam-hanoi-4
      when: July
      date: '1960-07'
      place: quang-tri-province
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Trị. In July the province's local troops destroy the Tuồi Muồi post and a platoon. The rising spreads, mostly south of Route 9.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10.vietnam-hanoi
      when: Oct.
      date: '1960-10'
      place: thua-thien
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Thừa Thiên. In October, as Saigon troops drive the people into concentration camps and the people flee to the forest and ask for arms, the Provincial Committee calls the rising everywhere. The province''s armed force begins by killing the Cần Lao party''s canton chief at Khe Tranh. Two large struggles of tens of villages follow at Hương Lâm and Phong Lâm: the two canton chiefs killed, the Saigon government declared abolished, self-government and guerrilla squads set up. Saigon pulls out of Tuồi Muồi, Tà Rụt, Trại Cá, Sa Trần and Ly Tông and draws back to A So, A Lưới, Nam Đông and Khe Tre.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351–52. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-11.vietnam-hanoi-2
      when: Nov. 11
      date: '1960-11-11'
      place: tuy-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phú Yên. The night of Nov. 11 a team of Tuy Hòa district enters the house of Nguyễn Y Chi, the district police, and kills him in bed.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 381. Check: the history says Nguyễn Ân, hamlet chief of Hòa Xuân, was killed too on the road to Lạc Long hamlet, no day given.'
      tags:
      - polity:drv
      time_range:
      - '1960-11-11T14:00Z'
      - '1960-11-11T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-12-22.vietnam-hanoi
      when: Dec. 22
      date: '1960-12-22'
      place: hoa-thinh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Phú Yên. The night of Dec. 22 the rising of Hòa Thịnh commune, Tuy Hòa, the Provincial Committee''s trial point. The district''s armed work teams in three prongs hit the Civil Guard platoon at the Mỹ Xuân market, the commune council''s seat at Mỹ Điền and the commune deputy''s house at Phú Hữu: the platoon wiped out, all its arms taken; the deputy Tín seized; the council seized at a year-end party. A mass meeting at Mỹ Xuân declares the commune''s government abolished and a self-government set up. The first commune of Phú Yên''s plain taken.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 381–82. Check: the hour.'
      tags:
      - polity:drv
      time_range:
      - '1960-12-22T14:00Z'
      - '1960-12-22T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-07-17.vietnam-hanoi
      when: July 17
      date: '1960-07-17'
      place: hoai-duc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bình Thuận. July 17 a reconnaissance team under Phạm Hoài Chương goes to prepare the ground for the attack on the Hoài Đức subsector. The Provincial Committee had decided on a secret, surprise attack to break the Bắc Ruộng camp and take the people to the base by the end of July. The command: Phạm Hoài Chương, chief; Lê Triều, commissar; Nguyễn Thành and Nguyễn Thanh Đức, deputies.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 373. Names: Phạm Hoài Chương. Check: the day of the decision.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-07-28.vietnam-hanoi-2
      when: July 28
      date: '1960-07-28'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. The afternoon of July 28 all the forces of the Hoài Đức attack, Unit 2/9, three men of Tánh Linh district and 100 porters, march to the assembly point.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 373. Check: the place of the assembly point; the history gives none.'
      tags:
      - polity:drv
      - ok:fields-place
      time_range:
      - '1960-07-28T04:00Z'
      - '1960-07-28T10:00Z'
      time_band: afternoon
      time_zone: Asia/Ho_Chi_Minh
