      c: Nghệ An. 12:30 p.m., Aug. 5, eight American aircraft bomb Cửa Hội. The antiaircraft of the navy's ships and of the shore shoot down one, 2 km west of Hòn Mắt island.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 368. Check: the clock is Hanoi''s; compare [[cal.1964-08-05.vietnam]].'
