      c: Bình Thuận. By the middle of the year the province's troops with Tánh Linh district's beat a sweep by two Civil Guard companies led by the Tánh Linh district chief at Suối Kết, and the people of the hamlets rise.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 260. Check: the day.'
