      when: 'Apr., early'
      date: '1963-04'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam
      c: Bến Tre. In early April the Provincial Committee holds an enlarged conference. Since the new year Saigon has swept nearly every district and set up 129 more strategic hamlets; the freed area is narrower, the armed force weak, the main force dispersed. The conference holds it wrong not to fight the sweeps by arms. It decides to train and arm the two main-force companies, add a third and a support company, make the signal, scout, sapper and engineer platoons companies, fix the commands, and sets the "Ấp Bắc" emulation drive of the Central Office's Military Committee for the province.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 268–69. Made public: 2013. Check: the day; the history does not give the conference''s place.'
      tags:
      - polity:drv
      - vis:only:drv
