      when: July 30
      date: '1960-07-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Thuận. 2 p.m., July 30, the unit of the Hoài Đức attack holds its ceremony of setting out.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 373.'
      tags:
      - polity:drv
      - ok:fields-place
      time: 1960-07-30T06:00Z
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1961-02-09.vietnam-hanoi
      when: Feb. 9
      date: '1961-02-09'
      place: duong-minh-chau
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. Battalions 1 and 2 of the Central Office's main-force regiment, code Q761, hold their ceremony of making themselves known in the Dương Minh Châu war zone, Feb. 9.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 47. Check: the history prints 9-2-1961 but dates the Central Office''s decision to form the regiment July 1961; a second ceremony, Feb. 9, 1962, at Trảng Dài, names it Regiment 1 (see [[cal.1962-02-09.vietnam-hanoi]]); the year of this one may be a misprint.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1961-08-10.vietnam-hanoi-2
      when: Aug. 10
      date: '1961-08-10'
      place: gia-truc
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Region 6. A squad of Battalion 120 of the military region, with Pi Năng Tắc, lures Saigon troops into a "stone trap" laid at the Gia Trúc pass, on the Tương River bank, and fires as the stones are brought down from the mountain: over 80 killed or wounded, by the history''s count. Fighters cover the Saigon side and two helicopters carry the dead out that day.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 161–62. Names: Pi Năng Tắc. Check: the province of the pass; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1962-01-01.vietnam-hanoi-2
      when: Jan. 1
      date: '1962-01-01'
      place: hon-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rạch Giá. After three days against the Saigon sweep of Châu Thành district that began Dec. 29, the district Party office, the district troops, militia and guerrillas shut themselves in the Hòn cave, halfway up Hòn Đất. Saigon, led by American advisers, surrounds the hill; poison in the stream, fire and smoke into the cave; up to 32 assaults beaten off in a day. The U Minh Battalion marches from An Biên to break the siege and the districts of Hà Tiên, Giồng Riềng and Gò Quao attack posts to draw the Saigon side off. After ten days Saigon withdraws, hundreds of dead and wounded with it, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 164–65. Check: the day: the history has the force hold out three days against the sweep begun Dec. 29 ([[cal.1961-12-29.vietnam-hanoi]]) before it goes into the cave, and gives no day; it counts ten days of fighting, the last not given.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1962-01-09.vietnam-hanoi
      when: Jan. 9
      date: '1962-01-09'
      place: hon-dat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Rạch Giá. Phan Thị Ràng (Tư Phùng), the district's youth cadre, dies Jan. 9 under torture. She had carried water into the Hòn cave to the besieged force, and was taken.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 165. Names: Phan Thị Ràng. Check: the place of her death; the history gives none.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1963-06-16.vietnam-2
      when: June 16
      date: '1963-06-16'
      place: xa-loi
      thread: vietnam
      also:
      - vietnam-saigon
      c: Saigon. The morning of June 16, by the history's count some 700,000 people and Buddhists go into the streets together to the Xá Lợi pagoda, where the body of Thích Quảng Đức lies. The special police disperse them with tear gas and dogs; many wounded and arrested.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 312. Names: Thích Quảng Đức.'
      tags:
      - polity:drv
