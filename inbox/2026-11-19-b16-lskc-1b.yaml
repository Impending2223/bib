      c: Bình Định. The provincial Party congress, June, resolves that armed struggle shall back the political movement of the masses more strongly.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379 n.1. Made public: 2013. Check: the day; the resolution is cited from the Bình Định Party History Board''s archive.'
