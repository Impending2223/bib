      when: Feb. 17
      date: '1964-02-17'
      thread: vietnam-34a
      also:
      - vietnam-hanoi
      c: The aerial reconnaissance of North Vietnam under OPLAN 34A, to gather intelligence and find the air defenses, radar, military bases and depots, is stepped up, Feb. 17, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 362. Check: the day, against the American record.'
      tags:
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1960-02-24.vietnam-hanoi-2
      when: Feb. 24
      date: '1960-02-24'
      place: cay-me-my-tho
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. Unit 514, the province's armed force, dressed as Saigon troops, lies in ambush at Cây Me, Long An commune, Châu Thành, on Route 4, for the truck carrying the garrison's pay, Feb. 24. The attack is not carried out.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-25.vietnam-hanoi-3
      when: Feb. 25
      date: '1960-02-25'
      place: my-tho
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Mỹ Tho. The province calls the rising in all its communes, Feb. 25. In Long An commune, Châu Thành, the chosen point, the people with the province's armed force burn the watch post and seize the hamlet chiefs and neighborhood heads for a warning. Along the Nguyễn Văn Tiếp canal, from Hưng Thạnh to Thiên Hộ, they beat drums and wooden clappers and tear down the neighborhood signs and anticommunist slogans. Battalion 514 does armed propaganda in seven communes. The political force too weak, the province does not take control.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02-25.vietnam-hanoi-4
      when: Feb. 25
      date: '1960-02-25'
      place: go-cong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gò Công. The night of Feb. 25 an armed team in East Gò Công and Vàm Láng kills the village representative Chớ and hangs banners urging the rising. The Saigon side finds the team, kills four and takes one, by the history's count. The rising fails.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 335.'
      tags:
      - polity:drv
      time_range:
      - 1960-02-25T14:00Z
      - 1960-02-25T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
