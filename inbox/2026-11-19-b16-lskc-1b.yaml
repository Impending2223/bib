      when: Nov.
      date: '1960-11'
      place: an-lao
      thread: vietnam
      also:
      - vietnam-hanoi
      c: Bình Định. In November Saigon sweeps Đá Bàn, An Lão district, and kills 32 villagers, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379. Check: the day.'
      tags:
      - polity:rvn
- add:
    entry:
      id: cal.1960-12.vietnam
      when: 'Dec., late'
      date: '1960-12'
      place: an-lao
      thread: vietnam
      also:
      - vietnam-hanoi
      c: Bình Định. At the end of December a Saigon battalion of Rhade troops under Đinh Ngô, brought from Quảng Ngãi, sweeps, robs and burns the communes of An Dân, An Lạc and An Vịnh, An Lão district.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379. Check: the day.'
      tags:
      - polity:rvn
- add:
    entry:
      id: cal.1960-12.vietnam-hanoi
      when: 'Dec., late'
      date: '1960-12'
      place: dat-dai
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bình Định. After the Rhade battalion's sweep Unit 2/9 ambushes at Đất Dài and destroys a squad, by the history's count, and forces the battalion to withdraw; the people then break up the Gò Nĩ concentration camp and free the area west of the An Lão river.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379–80. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
