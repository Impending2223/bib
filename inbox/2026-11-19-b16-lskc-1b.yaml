      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Trị. In July the province's local troops destroy the Tuồi Muồi post and a platoon. The rising spreads, mostly south of Route 9.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10.vietnam-hanoi
      when: Oct.
      date: '1960-10'
      place: thua-thien
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Thừa Thiên. In October, as Saigon troops drive the people into concentration camps and the people flee to the forest and ask for arms, the Provincial Committee calls the rising everywhere. The province''s armed force begins by killing the Cần Lao party''s canton chief at Khe Tranh. Two large struggles of tens of villages follow at Hương Lâm and Phong Lâm: the two canton chiefs killed, the Saigon government declared abolished, self-government and guerrilla squads set up. Saigon pulls out of Tuồi Muồi, Tà Rụt, Trại Cá, Sa Trần and Ly Tông and draws back to A So, A Lưới, Nam Đông and Khe Tre.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 351–52. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-11-11.vietnam-hanoi-2
      when: Nov. 11
      date: '1960-11-11'
      place: tuy-hoa
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phú Yên. The night of Nov. 11 a team of Tuy Hòa district enters the house of Nguyễn Y Chi, the district police, and kills him in bed.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 381. Check: the history says Nguyễn Ân, hamlet chief of Hòa Xuân, was killed too on the road to Lạc Long hamlet, no day given.'
