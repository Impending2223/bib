      when: Dec. 24
      date: '1964-12-24'
      thread: laos
      also:
      - vietnam-hanoi
      c: Souvanna Phouma agrees to American bombing of the north–south transport corridor along the Vietnam–Laos border, Dec. 24, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 369. Names: Souvanna Phouma. Check: compare the first armed reconnaissance of Dec. 21 ([[cal.1964-12-21.laos]]).'
      tags:
      - polity:drv
      - name:souvanna-phouma
- add:
    entry:
      id: cal.1965-07-20.vietnam-hanoi-2
      when: July 20
      date: '1965-07-20'
      place: bu-dop
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Phước Long. July 20 Regiment 1 attacks the Bù Đốp commando training center. After three hours it takes the post and all its arms and equipment; the search not thorough, hidden Saigon men fire on the column as it leaves, and 20 are killed or wounded. Saigon abandons Bù Gia Mập too.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 435–36. Check: the history gives Bù Gia Mập''s abandonment without a day.'
      tags:
      - polity:drv
      - ok:fields-place
