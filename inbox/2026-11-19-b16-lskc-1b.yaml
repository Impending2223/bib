      when: Sept.
      date: '1960-09'
      place: quang-nam
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Nam. In September, the province's new companies H29 and H30 with the Region's armed forces attack the Ga Lâu post (Hiên) and the Sáu post (Giằng) and destroy four platoons, taking many arms, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 377. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
