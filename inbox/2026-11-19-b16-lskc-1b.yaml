      c: 'Thủ Dầu Một. At the end of the year the secret Party branch in the Bến Tượng strategic hamlet leads a sudden rising: the worst oppressors killed, the Self-Defense men disarmed, the fence cut, the ditch filled, and the families go home in parties. The hamlet is broken for good.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 298. Check: the day.'
