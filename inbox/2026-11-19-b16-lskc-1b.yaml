- add:
    entry:
      id: cal.1965-05-28.vietnam-hanoi
      when: May 28
      date: '1965-05-28'
      place: ba-gia
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Ngãi. The night of May 28 the forces of the Ba Gia campaign (western Sơn Tịnh) move to their hiding places: Regiment 1 of Military Region 5 (Battalions 40, 60, 90, with a support battalion), the independent Battalion 45, under Lê Hữu Trữ and Nguyễn Đình Trọng, in the main direction; Battalion 83 and two district companies, militia and guerrillas in the second, Battalion 83 pressed against the Nghĩa Hành district seat. Chu Huy Mân, commander and commissar of the Region, is the campaign''s commander. Against them at Ba Gia the Saigon 1st Battalion, 51st Regiment, with Ranger Battalions 37 and 39 and the 2d Battalion of the 51st nearby.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 422–23. Made public: 2013. Names: Chu Huy Mân, Lê Hữu Trữ, Nguyễn Đình Trọng. Check: the night''s hour; the history gives the units'' order of battle in the preceding page, III, 422–23; the campaign''s order is not dated.'
      tags:
      - polity:drv
      - vis:only:drv
      time_range:
      - '1965-05-28T14:00Z'
      - '1965-05-28T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-05-29.vietnam-hanoi-2
      when: May 29
      date: '1965-05-29'
      place: ba-gia
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. May 29 the sappers of Regiment 1 with a Sơn Tịnh district platoon hit the Self-Defense men of Phước Lộc village; Saigon's guns at Ba Gia fire to help them and the company at Núi Tròn comes back to relieve them. Two companies of the 1st Battalion, 51st Regiment, under Capt. Nguyễn Văn Ngọc with two American advisers, come down from Gò Cao and are met at Diên Niên and Lộc Thọ by Battalion 90, hidden in Sơn Nam commune. At 9:50 a.m. the battalion is surrounded; at 10:45 it is finished. Two advisers killed, Ngọc and 217 taken; 270 killed and wounded in the five hours; 200 weapons and 4 trucks taken, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 423–25. Names: Nguyễn Văn Ngọc. Check: the clock is Saigon''s; the American record has the first fight at Ba Gia, [[cal.1965-05-29.vietnam-operations]].'
      tags:
      - polity:drv
      time: '1965-05-29T01:50Z'
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-05-29.vietnam-hanoi-3
      when: May 29
      date: '1965-05-29'
      place: nghia-hanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. May 29, in the second direction south of the Trà Khúc, Battalion 83 of the province surrounds and attacks the Nghĩa Hành district seat and threatens the Saigon troops at the Tư Nghĩa district seat, so that local forces can punish oppressors.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 425.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-30.vietnam-hanoi
      when: May 30
      date: '1965-05-30'
      place: ba-gia
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Ngãi. May 30 Saigon forms a task force from the 3d Marine Battalion, Ranger Battalions 37 and 39 and the 2d Battalion of the 51st Regiment, and sends it up from Sơn Tịnh with 20 GMC trucks and 12 M113s under hundreds of bombing sorties, at 9:30 a.m. At 1 p.m. the Ranger Battalion 39 reaches the foot of Chóp Nón hill, the 2d Battalion and the Marines Phước Lộc village. Regiment 1 meets them: Battalion 60 on Mả Tổ hill, Battalion 45 behind the Rangers, Battalion 40 on the west edge of Phước Lộc. Two hours: the Marine battalion mostly destroyed, the 2d Battalion hurt; by 7 p.m. the rest are drawn into Chóp Nón, hill 47, Mả Tổ and Phước Lộc.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 425–27. Check: the clock is Saigon''s; the American record has "May 30, three more battalions committed and beaten" ([[cal.1965-05-29.vietnam-operations]]).'
      tags:
      - polity:drv
      time: '1965-05-30T01:30Z'
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-05-30.vietnam-hanoi-2
      when: May 30
      date: '1965-05-30'
      place: ba-gia
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Ngãi. The night of May 30–31 Regiment 1 goes on: Battalion 60 takes hill 47 and Mả Tổ from the 3d Marine Battalion and captures it whole; Battalion 40 fights trench by trench in Phước Lộc, where the 2d Battalion of the 51st Regiment makes a stand in the strategic hamlet''s trenches, and the rest withdraw; Battalion 45 with artillery takes Chóp Nón by hand-to-hand fighting that ends at 3:30 a.m., May 31, destroying Ranger Battalion 31. In three days: four Saigon battalions hurt, 916 killed (four American advisers) and 65 taken, 200 weapons taken, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 427–29. Check: the clock is Saigon''s; the figures are the history''s ("a combined task force" destroyed); the American Defense Department record quoted by the history, III, 429.'
      tags:
      - polity:drv
      time_range:
      - '1965-05-30T14:00Z'
      - '1965-05-30T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-05-30.vietnam-hanoi-3
      when: May 30
      date: '1965-05-30'
      place: nghia-hanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. The night of May 30 part of Battalion 83 raids the Ranger Battalion 37 around the town on the Vệ river and drives it up to Hành Đức, Nghĩa Hành district, where the local forces hurt it more and hold it.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 429–30. Check: the place of the raid is the town on the Vệ river (Quảng Ngãi town or Nghĩa Hành); the history''s words are "around the town on the Vệ river".'
      tags:
      - polity:drv
      time_range:
      - '1965-05-30T14:00Z'
      - '1965-05-30T16:00Z'
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
