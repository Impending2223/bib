- edit:
    id: cal.1960-09-24.vietnam-hanoi
    base: 49f3c580
    set:
      c: 'Bến Tre. Sept. 21–22 the province feints with tens of thousands of people; Sept. 24, 5 p.m., drums and clappers sound everywhere and that night the people of nearly 100 communes demonstrate and besiege posts: 20 posts of Giồng Trôm give up their arms, 10 of Ba Tri are destroyed or surrender, and dozens in Châu Thành, Bình Đại and Thạnh Phú, by the history''s count. Mỹ Tho''s second wave begins that night.'
