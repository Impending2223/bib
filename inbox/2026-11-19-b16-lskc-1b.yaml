      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Kiến Tường. At the end of 1963 and the start of 1964, with Diệm down and Saigon in crisis, the province presses its acts and frees all of zone 4, most of zone 6 and four communes of zone 8 (Vĩnh Thạnh, Vĩnh Lợi, Vĩnh Đại, Hưng Điền).
      n: '[[w.lich-su-khang-chien-chong-my]], III, 359. Check: the day; the history gives "the end of 1963 and the start of 1964".'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1964-10.vietnam-hanoi-2
      when: Oct.
      date: '1964-10'
      thread: vietnam-hanoi
      also:
      - vietnam
      c: 'Region 5. In October the region has a flood without equal in a hundred years: thousands of villages under water, food and crops swept away, hunger threatening. Saigon sweeps with motor boats and amphibious vehicles and bombs the crowded villages. The Region Committee and command hold to the plan of operations and relieve the flooded; the North and the Nam Bộ provinces send food and medicine, hundreds of trucks and boats through the blockade.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 387–88. Check: the day; the American record has the aid mission''s flood relief of Nov. 17 ([[cal.1964-11-17.vietnam]]), the flood of the central coast in November.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
