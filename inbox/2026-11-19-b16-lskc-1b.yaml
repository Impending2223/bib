      c: Phước Long. July 20 Regiment 1 attacks the Bù Đốp commando training center. After three hours it takes the post and all its arms and equipment; the search not thorough, hidden Saigon men fire on the column as it leaves, and 20 are killed or wounded, by the history's count. Saigon abandons Bù Gia Mập too.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 435–36. Check: the history gives Bù Gia Mập''s abandonment without a day.'
