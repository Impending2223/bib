- add:
    entry:
      id: cal.1965-05-28.vietnam-hanoi
      when: May 28
      date: '1965-05-28'
      place: ba-gia
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Ngãi. The night of May 28 the forces of the Ba Gia campaign (western Sơn Tịnh) move to their hiding places: Regiment 1 of Military Region 5 (Battalions 40, 60, 90, with a support battalion), the independent Battalion 45, under Lê Hữu Trữ and Nguyễn Đình Trọng, in the main direction; Battalion 83 and two district companies, militia and guerrillas in the second, Battalion 83 pressed against the Nghĩa Hành district seat. Chu Huy Mân, commander and commissar of the Region, is the campaign''s commander. Against them at Ba Gia the Saigon 1st Battalion, 51st Regiment, with Ranger Battalions 37 and 39 and the 2d Battalion of the 51st nearby.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 422–23. Made public: 2013. Names: Chu Huy Mân, Lê Hữu Trữ, Nguyễn Đình Trọng. The battle: [[cal.1965-05-29.vietnam-operations]].'
      tags:
      - polity:drv
      - vis:only:drv
      time_range:
      - 1965-05-28T14:00Z
      - 1965-05-28T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-05-29.vietnam-hanoi-3
      when: May 29
      date: '1965-05-29'
      place: nghia-hanh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. May 29, in the second direction south of the Trà Khúc, Battalion 83 of the province surrounds and attacks the Nghĩa Hành district seat and threatens the Saigon troops at the Tư Nghĩa district seat, so that local forces can punish oppressors.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 425. See [[cal.1965-05-29.vietnam-operations]].'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-30.vietnam-hanoi-3
      when: May 30
      date: '1965-05-30'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Ngãi. The night of May 30 part of Battalion 83 raids the Ranger Battalion 37 around the town on the Vệ river and drives it up to Hành Đức, Nghĩa Hành district, where the local forces hurt it more and hold it, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 429–30. Check: the place: the history says only "around the town on the Vệ river." See [[cal.1965-05-29.vietnam-operations]].'
      tags:
      - polity:drv
      - ok:fields-place
      time_range:
      - 1965-05-30T14:00Z
      - 1965-05-30T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1965-06.vietnam-hanoi
      when: 'June, early'
      date: '1965-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Central Highlands. In early June part of Regiment 12 raids the Ea Nu strongpoint, beats the relief and cuts Route 7 from Mlá to Ea Nu; the rest of the regiment fights on Route 19 and cuts it from Măng Giang to An Khê.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 431. Check: the day; the place.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-06.vietnam-hanoi-2
      when: June
      date: '1965-06'
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Central Highlands. In June Regiment 10 goes deep on Route 21, stops the supply convoy of Saigon's II Corps, destroys the escort company and takes or burns over 100 tons of rice, by the history's count. Routes 19, 7 and 21 are cut at the same time.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 431. Check: the day; the place.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-07.vietnam-hanoi-3
      when: July
      date: '1965-07'
      place: tam-ky
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Quảng Nam. In July the province''s armed force destroys the field command post of the Saigon 2d Division in the middle of Tam Kỳ town and fights on the road from the An Tân bridge to the Ông Bộ bridge: hundreds of Saigon soldiers and many American advisers killed, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 433. Check: the day; the history puts it after the second Ba Gia fight of July 5.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-05-28.vietnam-hanoi-2
      when: May 28
      date: '1965-05-28'
      place: duy-xuyen
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Quảng Đà. May 28 Battalion 1 of the province's local troops attacks and destroys two Civil Guard companies and seven Self-Defense platoons at Duy Xuyên, by the history's count.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 434.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1965-06.vietnam-hanoi-3
      when: June
      date: '1965-06'
      place: tan-rai
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Lâm Đồng. The province's local forces besiege and attack the Tân Rai commando camp and force the American special forces in it to flee.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 434. Check: the day; the history gives none, between acts of May 28 and June 27.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-2
      when: 'Feb., mid'
      date: '1960-02'
      place: thoi-hoa-ben-cat
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Thủ Dầu Một. In mid-February, as the garrison of the Thới Hòa post, Bến Cát, has just drawn its pay, the commune's Party branch with the men inside holds a drinking party, collects the guns and, when the garrison is drunk, kills the oppressors and calls on the rest to give up. Outside the people with the soldiers' families go to the post to win their men over. The post is taken with all its arms, the commune guards disbanded, the government offices burned and a commune self-defense force built. Thới Hòa is the province's spearhead.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 344. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-3
      when: 'Feb., early'
      date: '1960-02'
      place: tay-ninh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Tây Ninh. In early February the province sets up Battalion 14; Châu Thành district sets up Company 40, Gò Dầu and Trảng Bàng Company 33A, Bến Cầu Company 61 and Dương Minh Châu district Company 31A.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 333. Made public: 2013. Check: the day.'
      tags:
      - polity:drv
      - vis:only:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-4
      when: Feb.
      date: '1960-02'
      place: cu-chi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Gia Định. From February many country places of Gia Định rise and take the hamlets. At Củ Chi the district committee orders "all rise together, break up the countryside": with the district''s armed team the people go into the commune information houses and tear up Diệm''s portraits, the three-stripe flags and the anticommunist slogans; thousands demonstrate on Routes 7 and 15 with leaflets and banners; the commune and hamlet heads flee. By March the people hold Phú Mỹ Hưng and Nhuận Đức communes, parts of An Nhơn Tây and Trung Lập and the north of Củ Chi.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 348–49. Check: the day; the history gives "from February" and the district committee''s order undated.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-02.vietnam-hanoi-5
      when: Feb.
      date: '1960-02'
      place: cu-chi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Gia Định. In the same time the Region's armed unit C13, working in Củ Chi, Bình Chánh, Nhà Bè, Duyên Hải, Thủ Đức and Dĩ An districts, destroys the An Hòa, Tân Thạnh Tây, Trung Hòa and An Nhơn Tây posts and the Bến Mương restaurant, to back the people's rising.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 348. Check: the days; the place.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-01.vietnam-hanoi-3
      when: Jan.
      date: '1960-01'
      place: saigon
      thread: vietnam-hanoi
      also:
      - vietnam
      c: Saigon. In January young people of Saigon hang a red flag with the hammer and sickle in the Bến Thành market.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 349. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-03.vietnam-hanoi-3
      when: Mar.
      date: '1960-03'
      place: muc-thinh
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bình Định. In March four guerrillas of Vân Canh district, who have worked loose the rail with metal pipes and rattan cords, pull a rail out as a Saigon military train reaches Mục Thịnh: the engine and 16 cars go into the ravine, 100 soldiers killed and tens of tons of goods destroyed, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 354–55. Check: the day.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-23.vietnam-hanoi-3
      when: Sept. 23
      date: '1960-09-23'
      place: tan-thach
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 23 Company 261, formed in June, ambushes a Civil Guard platoon at Tân Thạch, Châu Thành, on its way from Mỹ Tho to the town, and destroys it, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-23.vietnam-hanoi-4
      when: Sept. 23
      date: '1960-09-23'
      place: luong-quoi
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 23 a platoon of Giồng Trôm district's armed force destroys a Civil Guard platoon at Lương Quới, on its way from Giồng Trôm to the town, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-23.vietnam-hanoi-5
      when: Sept. 23
      date: '1960-09-23'
      place: cau-nha-thuong
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The night of Sept. 23 the town's self-defense destroys the Self-Defense post at the Nhà Thương bridge and takes the arms of the guard at the Cái Cối bridge. The town had been empty and the shops shut that day on a rumor that the Viet Cong would attack in force.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364.'
      tags:
      - polity:drv
      time_range:
      - 1960-09-23T14:00Z
      - 1960-09-23T16:00Z
      time_band: night
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-09-24.vietnam-hanoi-2
      when: Sept. 24
      date: '1960-09-24'
      place: binh-chanh-bridge
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The afternoon of Sept. 24, after Saigon has pulled two battalions out of Giồng Trôm into the town, the people of Lương Hòa, Long Mỹ and Bình Hòa communes float coconut-trunk rafts with explosive down the stream and bring down the Bình Chánh bridge, cutting the road from the town to Giồng Trôm.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364.'
      tags:
      - polity:drv
      time_range:
      - 1960-09-24T04:00Z
      - 1960-09-24T10:00Z
      time_band: afternoon
      time_zone: Asia/Ho_Chi_Minh
- add:
    entry:
      id: cal.1960-09-24.vietnam-hanoi-3
      when: Sept. 24
      date: '1960-09-24'
      place: chau-phu-giong-trom
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Sept. 24 in Châu Phú commune, Giồng Trôm, Chống, commander of the Civil Guard company and a man of the Party inside, gathers his company to collect their guns for inspection; a squad of Company 261 in Civil Guard dress walks into the post and takes the arms as the soldiers are called on to give up; the people raze the post. Another party takes the Nhà Thờ post by lam taxi without a shot.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364. Check: the hour; the history places it with the rising at 5 p.m. of Sept. 24.'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-09-24.vietnam-hanoi-4
      when: Sept. 24
      date: '1960-09-24'
      place: ba-lai-river
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: 'Bến Tre. About Sept. 24, in the same time as the Châu Phú fight, the communes of Phong Nẫm, Phong Mỹ, Châu Bình and Châu Hòa, with the armed force and men inside, force the posts along the Ba Lai river to surrender and raze them: a large free area, 100 weapons and over 100 prisoners taken, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], II, 365. Check: the day: the history gives "the same time" as the Châu Phú fight of Sept. 24. See [[cal.1960-09-24.vietnam-hanoi]].'
      tags:
      - polity:drv
- add:
    entry:
      id: cal.1960-10-03.vietnam-hanoi
      when: Oct. 3
      date: '1960-10-03'
      place: ben-tre
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. Oct. 3 the province sends Company 261 from Giồng Trôm to help in Mỏ Cày, where Saigon holds firm. Over the Hàm Luông with men inside it takes the Cái Quao post and frees An Định commune, goes on to Hương Mỹ; the Self-Defense men of the Tân Trung post flee; Minh Đức post is besieged and surrenders. In north Mỏ Cày the district's platoon forces the Thanh Tân and Tân Phú Tây posts and isolates Cái Mơn; a series of communes, Catholic ones too, rise.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 365. Check: the day of each post; the history gives Oct. 3 for the move.'
      tags:
      - polity:drv
- add:
    entry:
