      c: 'Biên Hòa. At the end of November Long Thành district''s troops with the guerrillas of its communes and hamlets ambush on Route 15 a main-force unit sweeping to widen its base and move the people: many killed, among them the subsector chief, by the history''s count.'
      place: long-thanh
- edit:
    id: cal.1963-08-24.vietnam-3
    base: 9bbee4da
    set:
      c: Saigon. Some 1,200 students of the Polytechnic, 700 of the School of Pharmacy and over 1,200 of the Law School leave exams and classes, Aug. 24, and rally against the Diệm government. Aug. 25 several thousand students and pupils hold a large rally at the Bến Thành market; the police break it up, the student Quách Thị Trang killed, nearly 200 taken to the Quang Trung training center.
