- add:
    entry:
      id: cal.1961-09-17.vietnam-2
      when: Sept. 17
      date: '1961-09-17'
      thread: vietnam
      also:
      - vietnam-saigon
      c: A British advisory mission on administration and policy under Thompson, the British counterguerrilla expert of Malaya, invited by Diệm as adviser on pacification, Sept. 17, by the history's account.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 168. Names: Thompson. Check: the day, against the British and American records: the history does not say whether Sept. 17 is the invitation or the arrival, and gives the name as "Tômxơn" only.'
      tags:
      - name:thompson-robert
      - polity:uk
      - polity:rvn
- add:
    entry:
      id: cal.1961-04.vietnam-saigon
      when: Apr.
      date: '1961-04'
      thread: vietnam-saigon
      also:
      - vietnam
      c: Saigon changes its military regions into tactical zones, each under a main-force corps with its local forces and supporting arms; below the zone, tactical areas, sectors (provinces) and subsectors (districts). Saigon–Gia Định a "capital special zone". American advisers and supporting units, the helicopter and air transport units above all, are put down to the zones.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 25. Check: the day.'
      tags:
      - polity:rvn
      - polity:us
      - ok:fields-place
- add:
    entry:
      id: cal.1963.vietnam-saigon
      when: '1963, early'
      date: '1963'
      at: before 1963-01
      thread: vietnam-saigon
      also:
      - vietnam
      c: In early 1963 the provinces of the Mekong delta are separated from the 3d tactical zone to make a 4th.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 25 n.1. Check: the day.'
      tags:
      - polity:rvn
      - ok:fields-place
- add:
    entry:
      id: cal.1962-04.vietnam
      when: Apr.
      date: '1962-04'
      thread: vietnam
      also:
      - vietnam-saigon
      c: 'From April Saigon and the Americans carry out over the whole South the program of gathering the people into "strategic hamlets", after trials in some places in Tây Ninh, Bình Dương, Biên Hòa and Quảng Ngãi. The aim: 10 million peasants in 16,000 of 17,000 hamlets planned, and a pacification apparatus, with American advisers alongside, from the center to the provinces.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 26. Check: the day. See [[cal.1962-03-16.vietnam]].'
      tags:
      - polity:rvn
      - polity:us
      - ok:fields-place
