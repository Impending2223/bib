      c: Central Highlands. In early June part of Regiment 12 raids the Ea Nu strongpoint, beats the relief and cuts Route 7 from Mlá to Ea Nu; the rest of the regiment fights on Route 19 and cuts it from Măng Giang to An Khê.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 431. Check: the day; the history names no province.'
      tags:
      - polity:drv
      - ok:fields-place
- add:
    entry:
      id: cal.1965-06.vietnam-hanoi-2
      when: June
      date: '1965-06'
      place: dak-lak
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Central Highlands. In June Regiment 10 goes deep on Route 21, stops the supply convoy of Saigon's II Corps, destroys the escort company and takes or burns over 100 tons of rice. Routes 19, 7 and 21 are cut at the same time.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 431. Check: the day; the province of the road; the history names none.'
      tags:
