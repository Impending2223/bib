      when: Aug. 21
      date: '1964-08-21'
      place: hue
      thread: vietnam-hanoi
      also:
      - vietnam-saigon
      c: Huế, Đà Nẵng. From Aug. 21 pupils and students go into the streets against the signing of the Vũng Tàu charter by "the Americans and Khánh". Slogans against "those who sell Đà Nẵng to the Americans as a base".
      n: '[[w.lich-su-khang-chien-chong-my]], III, 357. Check: the history says Huế and Đà Nẵng; the place field names Huế only.'
