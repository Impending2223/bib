      when: Sept. 24
      date: '1960-09-24'
      place: binh-chanh-bridge
      thread: vietnam-hanoi
      also:
      - vietnam-operations
      c: Bến Tre. The afternoon of Sept. 24, after Saigon has pulled two battalions out of Giồng Trôm into the town, the people of Lương Hòa, Long Mỹ and Bình Hòa communes float coconut-trunk rafts with explosive down the stream and bring down the Bình Chánh bridge, cutting the road from the town to Giồng Trôm.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 364.'
