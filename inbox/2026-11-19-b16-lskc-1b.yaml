      when: Aug. 5
      date: '1964-08-05'
      place: gianh-river
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      - vietnam
      c: Quảng Bình. Aug. 5 a flight of eight American aircraft, coming from the west behind the mountains, bombs the Gianh river port. The antiaircraft posts and navy ships with the militia of Cảnh Dương commune shoot down one into the sea and hit another.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 368. Check: the hour; the history places the flight after the Cửa Hội raid of 12:30.'
      tags:
      - polity:drv
      - ok:fields-time
- add:
    entry:
      id: cal.1964-08-05.vietnam-hanoi-3
      when: Aug. 5
      date: '1964-08-05'
      place: hon-gai
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      - vietnam
      c: Quảng Ninh. Aug. 5 a flight of eight American aircraft dives on Hòn Gai and Bãi Cháy. An A4 is hit and falls into the sea at Hà Tu; its pilot, Lt. Everett Alvarez, parachutes. Sgt. Nguyễn Kim Bảo of the Northeast Military Region, with two border guards on a boat for Cô Tô island, and local militia including Bác Lộc, take him alive.
      n: '[[w.lich-su-khang-chien-chong-my]], III, 368. Names: Nguyễn Kim Bảo. Check: the hour; Alvarez''s name as the history prints it, "I. Anvơrét"; compare [[cal.1964-08-05.vietnam]].'
      tags:
      - polity:drv
      - ok:fields-time
