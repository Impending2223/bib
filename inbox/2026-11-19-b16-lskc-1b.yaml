    entry:
      id: cal.1965-04-04.vietnam-hanoi-2
      when: Apr. 4
      date: '1965-04-04'
      place: pha-ghep
      thread: vietnam-hanoi
      also:
      - vietnam-air-war
      c: 'Thanh Hóa. Apr. 4, at 8:20 a.m., American aircraft bomb the Ghép ferry on the Yên River, as three antiaircraft companies of Regiment 234 from Nghệ An, sent overnight to the Hàm Rồng, are crossing: the guns are fired from their tow vehicles. Thirty minutes: three aircraft shot down, a pilot taken, by the history''s count. At 9:30 a.m. a second raid: Companies 2 and 5 of the regiment and a machine-gun crew, with the militia of both banks, set seven aircraft afire, by the history''s count.'
      n: '[[w.lich-su-khang-chien-chong-my]], III, 411. See [[cal.1965-04-03.vietnam]].'
      tags:
      - polity:drv
      time: 1965-04-04T01:20Z
      time_zone: Asia/Bangkok
