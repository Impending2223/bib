      c: Bình Định. At the end of December a Saigon battalion of Rhade troops under Đinh Ngô, brought from Quảng Ngãi, sweeps, robs and burns the communes of An Dân, An Lạc and An Vinh, An Lão district.
      n: '[[w.lich-su-khang-chien-chong-my]], II, 379. Check: the day.'
