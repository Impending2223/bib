      id: cal.1960-07-27.elections-1960
      when: July 27
      date: '1960-07-27'
      thread: elections-1960
      c: 'Chicago, late at night after the nomination. Nixon and some twenty party leaders on second place: Morton, Judd and Lodge left,
        by Nixon''s account; Judd asks to be passed over; Morton recommends Lodge, as Eisenhower does. Stratton asks for a man for the
        farm vote; Nixon: "If you ever let them [the Democrats] campaign only on domestic issues, they''ll beat us—our only hope is
        to keep it on foreign policy." Lodge chosen.'
      n: '[[w.kallina-kennedy-v-nixon]], 94–95. To check: The Reminiscences of Robert Finch, June 19, 1967, Columbia University Oral
        History Collection; Carleton Kent and Joseph Albright, "Why Leaders Picked Lodge," Chicago Sun-Times, July 29, 1960 (cited by
        [[w.kallina-kennedy-v-nixon]], 95 n.37); [[w.nixon-six-crises]], 341–42; [[w.nixon-rn]], 216. Names: Nixon, Morton, Judd, Lodge,
        Eisenhower, Stratton.'
