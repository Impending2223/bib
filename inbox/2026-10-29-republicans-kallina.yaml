      c: 'Wisconsin''s primary night on CBS. Elmo Roper: religion "the single most important issue in the election there today"; Cronkite
        asks Kennedy about the religious cast of the vote. Robert Kennedy berates Cronkite, then calls Grayson Kirk of Columbia and
        Thomas Watson of IBM to have the IBM-CBS analysis of the vote by religion withheld. Kennedy calls Stanton, the president of
        CBS, to remind him that as President he would name the FCC''s members.'
      n: '[[w.kallina-kennedy-v-nixon]], 59. To check: Transcript, "What Happened in Wisconsin," CBS-TV, Apr. 5, 1960, RFK Papers, JFK
        Library (cited by [[w.kallina-kennedy-v-nixon]], 59 n.28). See [[cal.1960-04-05.elections-1960]]. Names: Cronkite, Kennedy,
        Robert Kennedy, Kirk, Stanton. Check: the day of Kennedy''s call to Stanton; Kallina gives none (59).'
      tags:
      - name:cronkite-walter
      - name:kennedy-john-f
      - name:kennedy-robert-f
      - name:kirk-grayson
      - name:stanton-frank
