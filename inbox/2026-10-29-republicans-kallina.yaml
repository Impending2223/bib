        by the Kennedys, Robert Kennedy at the last. Morse: "Ohio doesn''t have a Favorite Son. It has a Favorite Stooge."'
      n: '[[w.kallina-kennedy-v-nixon]], 53–54. To check: John Bailey OHI, Apr. 10, 1964, JFK Library; New York Times, Jan. 6, 1960;
        William H. Hessler, "How Kennedy Took Ohio," Reporter, Mar. 3, 1960, 21–22 (cited by [[w.kallina-kennedy-v-nixon]], 54 n.10);
        [[w.odonnell-johnny-we-hardly-knew]], 148–52. Names: DiSalle, Kennedy, Robert Kennedy, Morse. Check: the day; Kallina gives
        early January (54).'
      tags:
