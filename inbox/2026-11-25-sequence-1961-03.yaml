- edit:
    id: cal.1961-03-01.school-aid-2
    base: bce66668
    set:
      n: 'The President''s News Conference of March 1, 1961, [1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193) (Mar. 1, 1961). [[w.graham-uncertain-triumph]], 19–20. Check: Graham, 234 n.54, cites the Papers at 154–55, the conference of Mar. 8. After [[cal.1961-03-01.peace-corps|the order]]: "I have today signed an Executive order providing for the establishment of a Peace Corps," the President says in opening the conference ([1961 Pub. Papers 135](https://www.govinfo.gov/content/pkg/PPP-1961-book1/pdf/PPP-1961-book1.pdf#page=193)). Names: Kennedy.'
- edit:
    id: cal.1961-03-09.economy-2
    base: 35404abd
    set:
      n: '[[w.white-making-of-the-president]], 374. After [[cal.1961-03-09.democratic-party|Truman]]: "then," in White''s account of the day (374). Names: Kennedy, Seaborg, Wiesner, Bell. Check: the day; White gives a Thursday in "early winter of 1961"; the Laos meeting with Felt ([[cal.1961-03-09.laos]]), the House''s feed grain vote and Nkrumah''s visit the day before ([[cal.1961-03-08.africa]]) are of Mar. 9.'
- edit:
    id: cal.1961-03-09.europe-and-the-alliance
    base: 0fe2a0fe
    set:
      n: '[[w.white-making-of-the-president]], 375. After [[cal.1961-03-09.economy-2|the session with Seaborg]]: "Then," in White''s account of the day (375). Names: Finletter, Kennedy. Check: the day; White gives a Thursday in "early winter of 1961"; the Laos meeting with Felt ([[cal.1961-03-09.laos]]), the House''s feed grain vote and Nkrumah''s visit the day before ([[cal.1961-03-08.africa]]) are of Mar. 9.'
- edit:
