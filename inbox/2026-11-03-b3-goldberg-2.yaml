      c: 'Before the convention. Members of the John Birch Society, not an official sponsor, mail every Republican delegate
        a postcard: "Nominate anybody you please. I''m voting for Goldwater."'
      n: '[[w.goldberg-barry-goldwater]], 144. Check: the day. Names: Goldwater.'
