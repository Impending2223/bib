      when: July
      date: 1960-07
      thread: goldwater
      also:
      - elections-1960
      c: 'By July, Goldwater''s strategists count a hundred delegates firm or leaning to him on the first ballot, two hundred
        more for second place. Shadegg''s estimate: as many as 275 first-ballot votes, sixty-seven firm. Goldwater: "We can''t
        win, but we might make a respectable showing."'
      n: '[[w.goldberg-barry-goldwater]], 144 (the count; the words); [[w.goldberg-barry-goldwater]], 144 n.143 (Shadegg''s
        estimate: besides Arizona, Louisiana and South Carolina, scattered support in thirteen delegations; Hall, Nixon''s
        adviser, put Goldwater''s strength at three hundred; Goldwater "counted 59 at the top"). To check: [[w.shadegg-what-happened-to-goldwater]],
        32 (cited by [[w.goldberg-barry-goldwater]], 144 n.144, for the words). Names: Shadegg, Goldwater.'
      src:
        c: 73cca7b6
        rows:
        - 'w.goldberg-barry-goldwater 144: all'
        - 'w.goldberg-barry-goldwater 144 n.143: B'
      tags:
      - name:shadegg-stephen
      - name:goldwater-barry-m
      - name:hall-leonard-w
