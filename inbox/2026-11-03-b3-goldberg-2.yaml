      when: Mar. 31
      date: '1960-03-31'
      thread: goldwater
      also:
      - elections-1960
      c: 'Goldwater to Rehnquist: Nixon "our man," but for six weeks "Dick has shown a decided tendency to drift far to the
        left, along the New Deal-Fair Deal lines . . . [and] we must employ means to get him back on the right track"; opposition
        will have "a decided affect on him."'
      n: '[[w.goldberg-barry-goldwater]], 144. To check: Barry Goldwater to William Rehnquist, Mar. 31, 1960, Box 506, Goldwater
        Collection, Barker History Center (cited by [[w.goldberg-barry-goldwater]], 144 n.141). Goldwater, later: Arizona''s
        deserting him for Nixon then would have been "a humbling political repudiation" ([[w.goldwater-with-no-apologies]],
        103, cited by [[w.goldberg-barry-goldwater]], 144 n.142). Arizona pledges its votes to Goldwater, Louisiana too; Texas''s
        Republicans name him for Vice President (Goldberg, 144; no days given). See [[cal.1960-03-28.goldwater]]. Names: Goldwater,
        Rehnquist, Nixon.'
      src:
        c: 4566296f
        rows:
        - 'w.goldberg-barry-goldwater 144: all'
      tags:
      - name:goldwater-barry-m
      - name:rehnquist-william-h
      - name:nixon-richard-m
      - state:az
