    at: '208'
- cite:
    id: cal.1965-07-27.medicare
    item: '[[w.dallek-flawed-giant]], 209 (Congress passes the bill after over 500 minor Senate amendments and a conference
      committee; not the day or the votes)'
    units: '?'
- variant:
