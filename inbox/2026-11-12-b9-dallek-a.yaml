    witness: w.dallek-flawed-giant
    reads: Congress passed Medicare on July 28
    at: '209'
- cite:
    id: cal.1965-02-06.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 247–48 (after Pleiku, the NSC meeting with congressional leaders; Johnson announces
      the air attack; Mansfield alone dissents, urging negotiation; not the hour, the number or the quotations)'
    units: '?'
- cite:
    id: cal.1965-02-07.vietnam-2
    item: '[[w.dallek-flawed-giant]], 247–49 (Bundy, after three days in Vietnam: "without new U.S. action defeat appears
      inevitable" (247); not the flight home, "the next year or so"; Johnson to Taylor, Feb. 8, afternoon: "I have today decided
      that we will carry out our December plan for continuing action against North Vietnam")'
    units: D
- cite:
    id: cal.1965-02-08.vietnam-congress-3
    item: '[[w.dallek-flawed-giant]], 248 (the leaders join the NSC meeting; Johnson''s words; Ford asks whether the aim is
      only to react to Viet Cong provocations; Johnson closes by asking that no one call it a broadening of the war; not the
      hour or the meeting''s number)'
    units: B
- cite:
    id: cal.1965-02-10.vietnam
    item: '[[w.dallek-flawed-giant]], 249 (Qui Nhơn, Feb. 10: Johnson authorizes only a retaliatory attack while Kosygin is
      in Hanoi; no mention of "continuing action"; "killing twenty-one Americans", for which see Variant)'
    units: A
- variant:
    id: cal.1965-02-10.vietnam
    unit: B
    witness: w.dallek-flawed-giant
    reads: the Viet Cong struck another U.S. base at Qui Nhon on the central coast of South Vietnam, killing twenty-one Americans
    at: '249'
- cite:
    id: cal.1965-02-13.vietnam-2
    item: '[[w.dallek-flawed-giant]], 250–51 (Ball and Thompson urge that Hanoi will never give up the struggle for the South
      unless it faces "a crushing military defeat" (250); the memorandum given to Johnson Feb. 13 (251); not Bundy''s and
      McNamara''s views)'
    units: '?'
- cite:
    id: cal.1965-02-13.vietnam-3
    item: '[[w.dallek-flawed-giant]], 251 (Ball''s account: Feb. 13, Johnson has him go through the memorandum point by point,
      thanks him, hands it back without comment; not who else was present)'
    units: '?'
- cite:
    id: cal.1965-02-16.vietnam-air-war
    item: '[[w.dallek-flawed-giant]], 251 (Bundy to Johnson, Feb. 16, after the discussion "of yesterday": "the firmness of
      your own decision to order continuing action" and "the wisdom of a public declaration of that policy by you"; not that
      the two were confused)'
    units: '?'
- cite:
    id: cal.1965-02-16.vietnam-3
    item: '[[w.dallek-flawed-giant]], 252 (the meeting of the 16th: "I''m just hoping out of hope that they''ll draw people
      in Saigon together"; not the hours or the other words)'
    units: '?'
- cite:
    id: cal.1965-02-17.vietnam-3
    item: '[[w.dallek-flawed-giant]], 252 (Johnson turns on the 17th to Eisenhower for reassurance; Ike gives emphatic support;
      not the place, the hours or the words)'
    units: '?'
- cite:
    id: cal.1965-04-24.latin-america
    item: '[[w.dallek-flawed-giant]], 262–63 (the constitutionalist countercoup of Apr. 24; aimed at restoring constitutional
      rule and possibly Bosch; on the 27th the rebels ask Bennett to mediate and he refuses; not Reid''s resignation, Molina
      Ureña or Caamaño)'
    units: '?'
- cite:
    id: cal.1965-04-28.latin-america-dominican-republic-2
    item: '[[w.dallek-flawed-giant]], 263–64 (the meeting with the congressional leaders on the 28th, two hours after Bennett''s
      cable: Raborn''s "positive identification of three ring-leaders of the Rebels as Castro-trained agents"; Johnson: "no
      alternative," "we can''t waste one moment"; Dirksen and McCormack concerned about the Communist threat; not the hour,
      the room or the other speakers)'
    units: C
- cite:
    id: cal.1965-04-30.latin-america
    item: '[[w.dallek-flawed-giant]], 264 (the broadcast of the evening of the 30th: "people trained outside the Dominican
      Republic are seeking to gain control"; an OAS mission to arrange a cease-fire)'
    units: E
- cite:
    id: cal.1965-04-30.latin-america-dominican-republic
    item: '[[w.dallek-flawed-giant]], 264 (the early-morning meeting of the 30th with his national security advisers: continuing
      violence the prelude to a Communist regime; Bundy: a Castro victory "the worst political disaster we could possibly
      suffer," a press conference with "indisputable evidence"; not the divisions, Martin or Rusk)'
    units: '?'
- cite:
    id: cal.1965-05-02.latin-america
    item: '[[w.dallek-flawed-giant]], 265 (the report to the nation, a few hours after the congressional briefing; the revolt
      "taken over and really seized and placed into the hands of a band of Communist conspirators"; not the troops ordered)'
    units: A, B
- cite:
    id: cal.1965-05-02.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 265–66, 269 (the congressional briefing of May 2 on the Dominican Republic: Fulbright
      asks "Is Bosch a Communist?"; Johnson: "I can''t live in the Hemisphere" if he sends Marines, "if I don''t, I can''t
      live at home"; to the leaders, "in the midst of the Dominican crisis": "Congress ought to show the world that it really
      backs up his policies"; not the hour or the press report of Fulbright)'
    units: '?'
- cite:
    id: cal.1965-05-06.latin-america
    item: '[[w.dallek-flawed-giant]], 267 (the Dominican factions sign a cease-fire on May 5; two days later a Dominican general
      sets up a five-man "Government of National Reconstruction," which the rebels refuse to accept; not the Act''s name or
      the generals'' names)'
    units: '?'
- cite:
    id: cal.1965-08-31.latin-america
    item: '[[w.dallek-flawed-giant]], 267 (the OAS committee wins agreement on Aug. 29 to an "Act of Dominican Reconciliation":
      a provisional government, free elections within nine months; Dallek''s day is the agreement, the entry''s the signing)'
    units: '?'
- cite:
    id: cal.1966-06-01.latin-america
    item: '[[w.dallek-flawed-giant]], 267 (June 1, 1966: Balaguer over Bosch, 57 percent to 39; the left sees U.S. intimidation,
      the administration a victory for constitutional government; not the decimals, Bonnelly or the turnout)'
    units: '?'
- cite:
    id: cal.1965-04-20.vietnam
    item: '[[w.dallek-flawed-giant]], 268 (the Honolulu conference of Apr. 20 agrees on two Army brigades, three more Marine
      battalions and logistical troops for two divisions, 82,000 by mid-June; McNamara reports it on the 21st; Ball alone
      excepts, and Johnson gives him until morning for "a settlement plan"; not who attended)'
    units: E
- cite:
    id: cal.1965-06-07.vietnam
    item: '[[w.dallek-flawed-giant]], 270–71 (June 7: the U.S. command in Saigon reports ARVN''s disintegration and the likely
      collapse of the government without U.S. and third-country forces; Westmoreland asks 82,000 to 175,000, 41,000 at once
      and 52,000 more, forty-four battalions; "defensive posture," "take the war to the enemy"; not the units named, the Joint
      Chiefs or Sharp)'
    units: '?'
- cite:
    id: cal.1965-07-27.vietnam
    item: '[[w.dallek-flawed-giant]], 276 (the NSC meeting on the 27th: Johnson could ask Congress for money, call up reserves,
      declare an emergency, but did not "want to be dramatic and cause tension"; more troops out of forces in this country,
      money by his transfer authority until January)'
    units: A
- cite:
    id: cal.1965-07-27.vietnam-july-decision-3
    item: '[[w.dallek-flawed-giant]], 276 (the meeting with the congressional leaders immediately after the NSC: Johnson repeats
      his determination to avoid dramatics and asks them not "to talk about what is going on"; "Let me appeal to you as Americans
      to show your patriotism by not talking to the press"; not Mansfield, Long or the others)'
    units: '?'
- to-check:
    id: cal.1965-07-27.vietnam
    add:
    - NSC Meeting, July 27, 1965; congressional leadership meeting, July 27, 1965, Meeting Notes File (cited by [[w.dallek-flawed-giant]],
      276 n.106)
- cite:
    id: cal.1965-08-05.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 286 (Johnson to the NSC on the 5th: "We are getting only bad things from the press";
      a U.S. Information Agency officer: only "a minority of the correspondents cause trouble"; not McNamara, Rusk or Taylor)'
    units: A
- cite:
    id: cal.1965-08-05.vietnam
    item: '[[w.dallek-flawed-giant]], 286 (the Safer report on CBS that night, a Marine, a Zippo lighter, a thatched hut;
      Johnson wakes Stanton to complain that the network had "shat on the American flag" and asks how CBS could employ "a
      Communist like Safer"; not the day of the burning or the hour of the broadcast)'
    units: D
- cite:
    id: cal.1965-12-05.economy
    item: '[[w.dallek-flawed-giant]], 303 (the Federal Reserve''s raising of the discount rate from 4 to 4.5 percent; Johnson
      publicly objects: better if the Fed had waited until the budget estimates in January)'
    units: '?'
- variant:
    id: cal.1965-12-05.economy
    unit: A
    witness: w.dallek-flawed-giant
    reads: On December 6, the Federal Reserve announced an increase in the discount rate banks paid on loans from 4 to 4.5
      percent
    at: '303'
- cite:
    id: cal.1965-09-03.steel
    item: '[[w.dallek-flawed-giant]], 305 (Sept. 3: Johnson announces the settlement live on network television; Heller to
      Johnson: "''Masterful'' is the word"; not Abel, Cooper or the terms)'
    units: '?'
- cite:
    id: cal.1966-01-27.economy
    item: '[[w.dallek-flawed-giant]], 306 (the economic message of Jan. 27, with the State of the Union message and the press
      conference after it, presses the guideposts: "When 200,000 of our fellow citizens are risking their lives in the defense
      of freedom overseas, the Government''s duty is to ask those who enjoy a comfortable prosperity at home to exercise responsibly
      their freedom to set prices and wages"; not the figures)'
    units: F
- cite:
    id: cal.1966-09-08.economy
    item: '[[w.dallek-flawed-giant]], 310 (Sept. 8: "additional steps we consider necessary to assure the continuing health
      and strength of the economy"; cuts in federal spending on structures and equipment, none to "make the poor carry the
      burden of fighting inflation"; no surcharge on income taxes; not the form of the message, the credit or the sums)'
    units: '?'
- cite:
    id: cal.1967-01-24.economy
    item: '[[w.dallek-flawed-giant]], 311 (the budget message to Congress: a deficit of $2.1 billion; a temporary 6 percent
      surcharge on corporate and individual income taxes from July 1, 1967, for two years; not the other figures)'
    units: '?'
- cite:
    id: cal.1966-03-02.transportation
    item: '[[w.dallek-flawed-giant]], 314–15 (Mar. 2: the transportation message to Congress; a department with the Federal
      Aviation Agency, the Coast Guard, the Bureau of Public Roads, the Maritime Administration, the safety functions of the
      CAB and the ICC under a National Transportation Safety Board; a Traffic Safety Act; highway accidents costing 50,000
      lives a year; not the figures of the Act or the employees)'
    units: A
- cite:
    id: cal.1966-10-15.transportation
    item: '[[w.dallek-flawed-giant]], 316–17 (the signing at the White House on Oct. 15; the Maritime Administration left
      out of the department, Meany''s pressure on the House; Johnson keeps the shipping interests and unions from the ceremony;
      not the citation of the Act or the number of agencies)'
    units: B
- cite:
    id: cal.1966-08-19.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 321 (Aug. 19: the Senate passes the bill with only fifty-three supporting votes; twenty-five
      senators absent; Ribicoff: "the most imaginative proposal in the whole area"; not the votes against)'
    units: '?'
- cite:
    id: cal.1966-10-14.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 321 (Oct. 14: the House approves the demonstration cities bill, 178 to 141; not the
      bill''s number or the recommittal vote)'
    units: '?'
- cite:
    id: cal.1966-10-06.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 321 (Oct. 6, press conference: no domestic problem "more critical than rebuilding our
      cities"; demonstration cities "one of the most important pieces of legislation for the good of all American mankind
      that we can act upon this session"; not the Speaker''s meeting)'
    units: '?'
- cite:
    id: cal.1966-10-18.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 322 (the bill''s final votes: "A 38 to 22 margin in the Senate"; Dallek gives no day)'
    units: A
- cite:
    id: cal.1966-10-20.cities-and-housing
    item: '[[w.dallek-flawed-giant]], 322 (the final votes: a 142 to 126 vote in the House; Dallek gives no day)'
    units: '?'
- cite:
    id: cal.1966-08-09.open-housing
    item: '[[w.dallek-flawed-giant]], 326 (the House approves the bill on Aug. 9 with limits on what constituted housing discrimination;
      the President''s statement praises the action and puts the best face on the fair housing provision; not the vote or
      the bill''s number)'
    units: '?'
- cite:
    id: cal.1966-06-01.civil-rights-the-executive
    item: '[[w.dallek-flawed-giant]], 327 (the White House civil rights conference of June 1–2, "To Fulfill These Rights";
      Katzenbach''s task force of August a response to it and to the summer riots; not the chairmen, Johnson''s words or SNCC)'
    units: '?'
- cite:
    id: cal.1966-06-09.opinion
    item: '[[w.dallek-flawed-giant]], 336 (June 9: "Our standing is down and likely to drop further," Moyers to Johnson; the
      approval rating between 46 and 50 percent in June; not the pollsters or the rest)'
    units: '?'
- to-check:
    id: cal.1966-06-09.opinion
    add:
    - Panzer to Redmon, May 4, 1966; Moyers to LBJ, May 19, 1966; Harris Survey, May 16, 1966; Gallup Poll, May 26, 1966,
      WHCF (cited by [[w.dallek-flawed-giant]], 336 n.120)
- cite:
    id: cal.1966-10-17.vietnam
    item: '[[w.dallek-flawed-giant]], 338 (the seventeen-day trip to Asia, Oct. 17 to Nov. 2; he says shortly before he has
      no plans to campaign when he returns)'
    units: A
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.dallek-flawed-giant]], 339 (Nov. 8: the Republicans gain 47 House seats, to 248 to 187; three Senate seats,
      64 to 36; eight governorships, a 25 to 25 split of the States)'
    units: G
- cite:
    id: cal.1966-11-08.governors
    item: '[[w.dallek-flawed-giant]], 339 (eight governorships to the Republicans, a 25 to 25 split of the States)'
    units: J
- cite:
    id: cal.1965-12-07.vietnam-pause-2
    item: '[[w.dallek-flawed-giant]], 343 (the meeting with advisers at his ranch on Dec. 7: "We mustn''t take off into the
      wild blue yonder"; he asks whether there is evidence the Communists are "getting ready for a peace offer," Rusk and
      McNamara think not; not who was present)'
    units: B
- cite:
    id: cal.1965-12-17.vietnam
    item: '[[w.dallek-flawed-giant]], 343–44 (the meeting with senior advisers on Dec. 17: willing "to take any gamble on
      stopping the bombing" if there were any chance of a result; a pause from Dec. 22 to Jan. 22; the Pentagon could use
      "weather as an excuse and Christmas as a factor"; not the hours or the others)'
    units: '?'
- cite:
    id: cal.1965-12-18.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 344 (the meeting of the next day: a pause contained "serious military risks"; McNamara:
      "We have been too optimistic"; Fortas and Clifford speak against a pause; Johnson: "We''ll take the pause"; not the
      hours or who else was present)'
    units: F, G
- cite:
    id: cal.1965-12-21.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 344 (Dec. 21: a pause "more a sign of weakness than anything else. All we''ll get is
      distrust from our allies, despair from the troops, and disgruntled generals"; not the hours or who was present)'
    units: '?'
- cite:
    id: cal.1965-12-27.vietnam
    item: '[[w.dallek-flawed-giant]], 345–46 (Johnson agrees to a bombing pause on Dec. 27; McNamara spends three hours with
      him at the ranch that evening and presses a longer pause; Taylor urges a longer halt; not the call or "several more
      days")'
    units: '?'
- cite:
    id: cal.1965-12-28.vietnam
    item: '[[w.dallek-flawed-giant]], 346–47 (a "peace offensive": from Dec. 28 messages to dozens of countries and envoys
      to capitals, Humphrey to Tokyo, Manila and New Delhi, Harriman to Warsaw, Goldberg to the Vatican, Paris and London;
      the Ambassador to Burma informs the North Vietnamese consul general in Rangoon)'
    units: A, C
- cite:
    id: cal.1965-12-28.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 346 (Johnson tells Ball he is "inspiring, stimulating and ''shoving''"; no time limit
      on the pause; Ball not to let "them" talk him out of anything; not the hour or the rest)'
    units: '?'
- cite:
    id: cal.1965-12-30.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 347 (Johnson asks Ball to talk to Fulbright, Mansfield and Hickenlooper; to tell Fulbright
      the peace initiative "is just an execution of what Fulbright has talked about"; Mansfield, "doing what Mansfield has
      said"; Hickenlooper not to think "we are retreating"; not Dirksen, Florida or Sihanouk)'
    units: '?'
- cite:
    id: cal.1966-01-12.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 348 (Ball before the Foreign Relations Committee on Jan. 12; Johnson told him to stress
      that the door was "open for any of their suggestions"; Ball after: the committee didn''t "see any solution other than
      the course being followed," but not convinced it was wise; not the hours, the telephone or Fulbright)'
    units: '?'
- cite:
    id: cal.1966-01-24.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 349 (Jan. 24, the Democratic congressional leaders: Mansfield argues against resuming
      the bombing and warns against a conflict with China; Boggs against an indefinite pause; McCormack thought the suspension
      made the U.S. and the President look weak; not the hours or the quotations)'
    units: '?'
- cite:
    id: cal.1966-01-25.vietnam
    item: '[[w.dallek-flawed-giant]], 349 (the meeting of the 25th, with Fulbright present: Fulbright and Mansfield urge a
      continued lull, Fulbright saying we were now "properly accused of taking the place of the French"; Dirksen: "do what
      is necessary to win"; Russell: "Go all the way"; not the room, the hours or the other speakers)'
    units: D, G, H
- cite:
    id: cal.1966-01-27.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 350 (in one meeting between Jan. 26 and 30, Dallek''s note n.29 the meeting of Jan.
      27: "I don''t want to back out—and look like I''m reacting to the Fulbrights"; "If you let them run you out of the front
      yard, they''ll run you out of the house"; "We will lose a good part of the Senate"; not the hours or who was present)'
    units: '?'
- cite:
    id: cal.1966-01-28.vietnam-pause
    item: '[[w.dallek-flawed-giant]], 350–51 (the meeting with advisers and the "wise men" Clifford, Dean, Dulles and McCloy:
      "A year ago, by 504 to 2, the Congress told the President to do what was necessary in Vietnam. Today they could muster
      probably forty votes"; the Majority Leader and the Chairman of Foreign Relations against the general policy of that
      resolution; Wheeler, Taylor, Dean and Clifford on the will of the Communists; Johnson: "we have to resume bombing";
      not the hours or the date, for which Dallek''s note n.30 gives Jan. 28)'
    units: B, D
- cite:
    id: cal.1966-01-29.vietnam-pause-2
    item: '[[w.dallek-flawed-giant]], 351 (in meetings with advisers before the announcements of Jan. 31: "We have to demonstrate
      to people that we are not Goldwater"; the renewed bombing would put "the Fulbrights and the Morses under the table and
      the hard liners will take over—unless we take initiatives"; not the hours or who was present)'
    units: '?'
- cite:
    id: cal.1966-01-31.vietnam
    item: '[[w.dallek-flawed-giant]], 351 (Jan. 31: Johnson announces renewed bombing and says the end of the pause did "not
      mean the end of our pursuit of peace"; asks for an immediate meeting of the U.N. Security Council; expresses "full sympathy"
      with the Pope''s appeal; not the hour, the television or Goldberg)'
    units: '?'
- cite:
    id: cal.1966-01-28.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 352 (Jan. 28, Senate Foreign Relations hearing: Fulbright says he had never seen so
      much apprehension in the country over a military involvement)'
    units: B
- cite:
    id: cal.1966-02-04.vietnam
    item: '[[w.dallek-flawed-giant]], 352 (Feb. 4: Fulbright''s committee begins hearings on the war, with unprecedented live
      gavel-to-gavel coverage by the three networks; not the witness)'
    units: '?'
- cite:
    id: cal.1966-01-31.robert-kennedy
    item: '[[w.dallek-flawed-giant]], 353 (Jan. 31: Robert Kennedy says military action alone in Vietnam would assure nothing;
      "new programs of education, land reform, public health, [and] political participation" offered the best hope of "achieving
      our aims in Vietnam"; not the words of the entry)'
    units: '?'
- cite:
    id: cal.1966-02-24.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 356 (Feb. 24, the day after Humphrey returned: he briefs the President and the leaders;
      Johnson: "If you choose, you can repeal the resolution. I think I have the authority without the resolution"; Dirksen:
      repeal "wouldn''t get four votes"; Johnson puzzled why dissenters "can''t do their dissenting in private"; 360: a congressman
      afterward on the briefing''s "no indication whatsoever" of troop increases; not Humphrey''s "Tide of battle has turned"
      or the hour)'
    units: D
- cite:
    id: cal.1966-03-10.vietnam
    item: '[[w.dallek-flawed-giant]], 358–59 (Mar. 10: the Saigon government dismisses Thi and forces him to leave the country
      for four months; Washington accepts without protest, Ky and Thieu assuring that this would solve their problem; not
      the Directorate, Lodge or Mar. 9)'
    units: '?'
- variant:
    id: cal.1966-03-10.vietnam
    unit: A
    witness: w.dallek-flawed-giant
    reads: General Nguyen Chanh Thi, Commander of the Central Highlands
    at: '358'
- cite:
    id: cal.1966-03-12.vietnam-us
    item: '[[w.dallek-flawed-giant]], 359 (Mar. 12, Johnson to a group of State governors: "Make no mistake about the Comm[unists]";
      "McCarthy''s methods were wrong—but the threat is greater now than in his day"; not the briefers or the resolution)'
    units: '?'
- cite:
    id: cal.1966-04-02.vietnam
    item: '[[w.dallek-flawed-giant]], 360 (Apr. 2, advisers: "make every effort to keep Ky. But be ready to make terrible
      choice. Perhaps take a stand in Thailand—or take someone else other than Ky"; 361: Ky asks Lodge for transport planes
      to suppress the rebels in Danang and Hue, Lodge agrees, Johnson tells him to keep U.S. troops out of the riot area;
      not Trí Quang)'
    units: A
- cite:
    id: cal.1966-04-04.vietnam-struggle-3
    item: '[[w.dallek-flawed-giant]], 360 (the meeting two days later: Johnson "rather have someone we can control... than
      a communist takeover"; Taylor against "a Tri Quang government"; "Ky is gone, the last gasp. ... Let''s get a government
      we can appoint and support"; not the hours or who was present)'
    units: E, F
- cite:
    id: cal.1966-04-25.vietnam
    item: '[[w.dallek-flawed-giant]], 363 (the meeting of Apr. 25: "to continue roughly along present lines. ... We shall
      stay on course and explore with Lodge a cautious Track B"; the embassy to tell Saigon support is contingent on unity
      and effectiveness; not the attendees or Rostow''s record)'
    units: B
- cite:
    id: cal.1966-05-06.vietnam-struggle
    item: '[[w.dallek-flawed-giant]], 363 (May 6: Ky announces he would hold power until elections in 1967; Rusk wanted to
      threaten to leave Vietnam if Ky did not give control to an assembly; Johnson rejected it)'
    units: '?'
- cite:
    id: cal.1966-05-10.vietnam
    item: '[[w.dallek-flawed-giant]], 363 (May 10, Johnson to the NSC: "we are committed and we will not be deterred"; Rusk
      had wanted to threaten to leave if Ky did not give control to an assembly)'
    units: F
- cite:
    id: cal.1966-05-12.vietnam-congress-2
    item: '[[w.dallek-flawed-giant]], 367 (May 12, to congressional Democrats at the National Guard Armory: pleased to be
      with "so many of my very old friends as well as some members of the Foreign Relations Committee"; McPherson the next
      day: the speech "harsh, uncompromising, over-militant")'
    units: B
- cite:
    id: cal.1966-05-09.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 370 (Fulbright''s conciliatory note of May 9 after Johnson''s objection at a White House
      reception to the characterization of himself as "arrogant": "never at any time have I spoken, or even thought, of you
      in connection with arrogance"; referring to nations; hope that his viewpoint, differing from that of "some of your advisers,"
      can be of help)'
    units: '?'
- cite:
    id: cal.1966-05-27.vietnam-congress
    item: '[[w.dallek-flawed-giant]], 370–71 (May 27: a cordial reply written by Moyers; aggressive powers "freely permitted
      ... to use direct or indirect force against smaller and weaker states"; the policy his and not that of "my ''advisers''";
      "our differences of policy have [not] erased the friendship we have shared for so long")'
    units: '?'
- cite:
    id: cal.1966-08-08.vietnam
    item: '[[w.dallek-flawed-giant]], 376 (Aug. 8: the New York Times reports a Pentagon study predicting eight years to win
      the war unless forces were increased to 750,000, and then five; not partial mobilization or the reserves)'
    units: '?'
- cite:
    id: cal.1966-07-20.vietnam-prisoners
    item: '[[w.dallek-flawed-giant]], 377 (the press conference of July 20: an improved economy, steps toward an orderly democratic
      election, ten-fold enemy losses; "we shall persist")'
    units: A
- cite:
    id: cal.1966-08-13.vietnam
    item: '[[w.dallek-flawed-giant]], 379 ("The following week" after the Times story of Aug. 8: Westmoreland meets Johnson
      at the Texas ranch and assures him, "we''re going to win this war for you without mobilization"; not the day or Honolulu)'
    units: '?'
- cite:
    id: cal.1966-09-11.vietnam
    item: '[[w.dallek-flawed-giant]], 380 (Sept. 11: the election of a constituent assembly in South Vietnam, an 80 percent
      turnout; one U.S. senator called the results "a shattering blow to the Viet Cong")'
    units: '?'
- cite:
    id: cal.1966-10-15.vietnam
    item: '[[w.dallek-flawed-giant]], 383, 387 (the NSC meeting of Oct. 15: the administrative compromise between military
      and civilian authorities given 90 to 120 days before the program is put fully under military control; McNamara: pacification
      to date a "basic disappointment" (383); Oct. 15, to McNamara and Wheeler: limits on bombing around Hanoi and Haiphong
      held, new targets agreed (387))'
    units: D
- cite:
    id: cal.1966-11-11.vietnam
    item: '[[w.dallek-flawed-giant]], 387 (Nov. 11: Johnson commits to stabilizing troop deployments to South Vietnam and
      the bombing in the North; pacification "critical to the success of our effort"; a committee on Vietnam meeting three
      times a week; not the figures)'
    units: '?'
- cite:
    id: cal.1966-12-02.vietnam-marigold
    item: '[[w.dallek-flawed-giant]], 389 (Dec. 2, the day word of North Vietnamese interest in talks reached Washington:
      U.S. planes strike military installations around Hanoi, the first attacks near the city since the POL raids in June;
      Dec. 4 again; MARIGOLD)'
    units: B
- cite:
    id: cal.1966-12-13.vietnam
    item: '[[w.dallek-flawed-giant]], 389–90 (the meeting of Dec. 9, by Rostow: "carry forward with what was necessary but
      at this particular moment not to expand our targeting"; Dec. 13 and 14 even larger raids against Hanoi; not who was
      present)'
    units: C
