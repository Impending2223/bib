patch: 2026-11-12-b9-dallek-a
by: 'Claude (batch 9 reader, Dallek, Flawed Giant, pp. 19–389: the ''already in'' rows)'
ops:
- add:
    entry:
      id: cal.1965-04-29.latin-america-dominican-republic-4
      when: Apr. 29
      date: '1965-04-29'
      thread: latin-america-dominican-republic
      also:
      - press-and-broadcasting
      c: 'Johnson, evening, with Mohr of the *New York Times*. Mohr: his first-day story on the Marine landing was "a journalistic
        mistake" in not giving more emphasis to the guarded report by Mann and Ball that some Communists had been identified
        among the rebels. Johnson disagrees: hopeless to think anyone would believe him; he did not land Marines to put down
        a communist threat.'
      n: '[[w.dallek-flawed-giant]], 264 ("The next evening," after the statement of Apr. 28). To check: LBJ conversations,
        Apr. 29–May 5, 1965, Krock Papers (cited by [[w.dallek-flawed-giant]], 264 n.69). See [[cal.1965-04-28.latin-america]].
        Names: Johnson, Mann, Ball. Check: the day (Dallek: "the next evening"; his note covers Apr. 29–May 5).'
      src:
        c: 31329fd0
        rows:
        - 'w.dallek-flawed-giant 264: all'
      tags:
      - name:johnson-lyndon-b
      - name:mann-thomas-c
      - name:ball-george-w
- add:
    entry:
      id: cal.1966-07-18.vietnam-congress
      when: July 18
      date: '1966-07-18'
      thread: vietnam-congress
      c: 'Johnson to the congressional leaders: "Viet Cong morale had been lowered by U.S. successes." The Viet Cong recruit
        teenagers 12 to 16; food rations cut in each unit; their transportation system broken. The war might be over by June
        1967: "We see a slackening off"; "General Westmoreland will get all he needs."'
      n: '[[w.dallek-flawed-giant]], 377 ("A week later" than the meeting of July 11). To check: Meeting Notes, July 18, 19,
        1966, Tom Johnson Papers, LBJ Library (cited by [[w.dallek-flawed-giant]], 377 n.118). See [[cal.1966-07-11.vietnam-congress]].
        Names: Johnson, Westmoreland. Check: the day (Dallek''s note gives July 18, 19).'
      src:
        c: 95c9e2a8
        rows:
        - 'w.dallek-flawed-giant 377: all'
      tags:
      - name:johnson-lyndon-b
      - name:westmoreland-william
- add:
    entry:
      id: cal.1966-08-01.press-and-broadcasting-2
      when: Aug. 1
      date: '1966-08-01'
      thread: press-and-broadcasting
      also:
      - vietnam
      c: 'Johnson with Sherrod of *Time-Life*, forty minutes, for Sherrod''s memorandum. The war: "It looks pretty good, improving
        all the time, but we''ve got a long way to go"; of 14,000 villages "maybe a hundred" taken care of; 700,000 men or
        a million, "we are going to do the job." Half the interview against the press, the *Times*, Lippmann, Reston, Halberstam.'
      n: '[[w.dallek-flawed-giant]], 378–79 (Sherrod''s memorandum). To check: Sherrod to George P. Hunt, Oct. 1, 1966, LBJ
        Files, Robert Sherrod Papers, NASA Archives (cited by [[w.dallek-flawed-giant]], 379 n.122). See [[cal.1966-08-01.vietnam]].
        Names: Johnson, Lippmann, Reston.'
      src:
        c: ef3e1bf9
        rows:
        - 'w.dallek-flawed-giant 378–79: all'
      tags:
      - name:johnson-lyndon-b
      - name:lippmann-walter
      - name:reston-james
- cite:
    id: cal.1965-04-08.medicare
