- add-words:
    id: cal.1968-02-07.vietnam-khe-sanh
    after: end
    words: 'Johnson on the MIGs: "Go in and get those MIGs at Phuc Yen." Wheeler: as soon as the weather permits.'
    text: '[FRUS 1964–68, VI, doc. 60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60)'
- add-words:
    id: cal.1968-02-07.vietnam-khe-sanh
    after: end
    words: 'Johnson asks for plans for more men. Wheeler: Australia cannot send more, Korea''s light division is doubtful, the Thai troops are in training. McNamara: 6,400 military beds in South Vietnam, 2,900 held by American troops and 1,100 by Vietnamese civilians.'
    text: '[FRUS 1964–68, VI, doc. 60](https://history.state.gov/historicaldocuments/frus1964-68v06/d60)'
