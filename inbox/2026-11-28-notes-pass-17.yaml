- add-words:
    id: cal.1968-01-29.vietnam-khe-sanh
    after: end
    words: 'At the meeting Johnson asks each Chief for his views on the strategy now pursued in South Vietnam. Wheeler and the Chiefs: everything asked has been granted; Westmoreland can cope with any contingency.'
    item: '[[w.berman-lyndon-johnsons-war]], 141 (each to give "his views concerning the validity of the strategy"; the Chiefs agreed "that everything which had been asked for had been granted")'
