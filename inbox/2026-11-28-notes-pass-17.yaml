    base: e035a7a1
    set:
      c: 'The CIA Inspector General, Earman, interviews Edwards on the plots against Castro, for the Inspector General''s report on the plots. Edwards''s account in the report: with Bissell present he briefed Dulles and Cabell on the plan, and Dulles merely nodded. Edwards, 1975: he told them the truth.'
