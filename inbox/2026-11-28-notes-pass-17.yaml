    words: 'In the East Room an unusually large group from Congress, the Cabinet, civil rights leaders and the press. Johnson: all America is outraged by King''s assassination and by "the looting and burning that defiles our democracy"; "Violence cannot redress a solitary wrong or remedy a single unfairness." He appeals to Congress to enact the twenty social-justice programs he recommended this year.'
    item: '[[w.johnson-white-house-diary]], 661–62 (Apr. 11: word "sometime during the course of the day" of the signing "in the East Room at 5" of the Civil Rights Bill "passed yesterday by the House"; the Johnsons enter "to prolonged clapping," an unusually large group from Congress, the Cabinet, Civil Rights leaders and the press; Johnson''s speech: all America outraged by the assassination of Martin Luther King and by "the looting and burning that defiles our democracy"; "Violence cannot redress a solitary wrong or remedy a single unfairness"; he appeals to Congress to enact the twenty programs he recommended this year; the diary does not mention open housing or the Act''s titles)'
