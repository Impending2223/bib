- edit:
    id: cal.1968-04-04.democratic-party
    base: 0d203e30
    set:
      c: Washington, the Democratic congressional campaign committees' fund-raising dinner, in progress when word comes that King has been shot.{1} Humphrey, at the head table, is handed a note that King has been shot and a second that he has died; he writes a brief eulogy, delivers it, and announces that the dinner is over.{2} The Johnsons were to attend, she in evening dress; Johnson cancels his plans for the evening and postpones the trip to Hawaii.{3}
