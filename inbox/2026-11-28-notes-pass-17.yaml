    after: end
    words: Upstairs Johnson tells Clifford, Harriman and Bill White that early that morning he had conferred the Medal of Freedom on them and seventeen others, twenty in all; he reads Clifford's and Harriman's citations and gives them to them; White's is to be sent.
    item: '[[w.johnson-white-house-diary]], 776, 779–81 (Jan. 20: the Cliffords'' lunch for about sixty, the crowd on the lawn with signs; "Lyndon told us that early this morning he had conferred the Medal of Freedom on Clark and Averell and Bill White and seventeen others. He read Clark''s citation and Harriman''s and gave them to them"; Bill White''s would be sent to him; on the porch Johnson said into Ray Scherer''s microphone that he had been part of Washington for more than thirty years and would come back to visit; then Andrews and Air Force One; that morning Johnson showed her citations for Mary Lasker and Laurance Rockefeller, of "a list of about twenty names": twenty medals that day in all, three of them named at the lunch; not Rusk or Rostow, not Bethesda for the house)'
