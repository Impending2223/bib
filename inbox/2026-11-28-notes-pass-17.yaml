    words: 'Westmoreland: Harriman "will have a hand with four aces and the enemy will have two deuces." Clifford asks on what conditions a cease-fire would be acceptable: "I do not see any acceptable cease-fire. We would just like the North Vietnamese to go home and turn in their weapons."'
    item: '[[w.clifford-counsel-to-the-president-2]], 531–32 (Westmoreland: Harriman "will have a hand with four aces and the enemy will have two deuces"; on a cease-fire, "We would just like the North Vietnamese to go home and turn in their weapons")'
