- edit:
    id: cal.1968-02-20.vietnam
    base: b26fecd8
    set:
      c: 'The Senate Foreign Relations Committee, in closed session, on the Gulf of Tonkin attacks of August 1964: McNamara and Wheeler before Fulbright''s committee.{1} McNamara: the second attack, Aug. 4, took place.{2} McNamara: the suggestion that the government induced the incident "monstrous."{4} Fulbright: "I regret it more than anything I have ever done in my life, that I was the vehicle which took that resolution to the floor." Morse: "a confused bungle."{5} The session runs seven and a half hours.{6} Fulbright reads Captain Herrick''s cables of Aug. 3 and Aug. 4, 1964, the second saying many reported contacts and torpedoes fired "appear doubtful."{7} Fulbright tells McNamara he never meant to leave the impression that he was deliberately trying to deceive the committee; Mansfield, Pell and Symington say the same.{8}'
      src:
        c: c1da5774
        rows:
        - 'https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=50: 1'
        - 'w.mann-grand-delusion 578–80: 1, 2, 4, 5'
        - 'via w.mann-grand-delusion 580 n.29: 1, 2, 4, 5'
        - 'w.cq-weekly-report Mar. 1, 1968, 384: 1, 2, 4'
        - 'w.mcnamara-in-retrospect ch. 5 at n.18: 1, 8'
        - 'via x.1968-02-20.the-gulf-of-tonkin-the-1964: 1'
        - 'w.woods-j-william-fulbright-vietnam 168–69: 1, 2, 4, 6, 7'
        - 'via x.1968-02-20.the-gulf-of-tonkin-the-1964: 1, 2, 4'
        - 'via x.1968-02-25.finney-mcnamara-destroyers-nyt: 1, 2, 4'
        - 'via x.1968-02-21.fulbright-hints-northwest-arkansas-times: 1, 2, 4'
        - 'w.woods-fulbright 477–78: 1, 2, 4, 6, 7'
        - 'w.zaroulis-who-spoke-up 154: ?'
