patch: 2026-11-12-b10-church-plots
by: 'Claude (batch 10, share 2: the Church Committee''s interim report, Congo, Trujillo and Diem chapters), Nov. 12, 2026'
ops:
- add:
    entry:
      id: cal.1960-08.congo-lumumba
      when: Aug.
      date: 1960-08
      thread: congo-lumumba
      c: 'Bissell to Tweedy, chief of the CIA''s Africa Division, by Tweedy''s testimony in 1975: there is "policy agreement, in Washington that Lumumba must be removed from the position of control and influence in the Congo," and among the means "indeed assassination." Tweedy is to start the station exploring it.'
      n: '[[w.sen-church-alleged-assassination-plots]], 19–20 (testimony of Sept. 9 and Oct. 9, 1975: the first talk "probably" shortly before the Dulles cable of Aug. 26, "shortly before or shortly after," the two "totally in tandem"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-08-25.congo]]. Names: Bissell, Tweedy, Lumumba. Check: the day.'
      tags:
      - name:bissell-richard-m-jr
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-08-24.congo-lumumba
      when: Aug. 24
      date: '1960-08-24'
      thread: congo-lumumba
      also:
      - congo
      c: 'The station at Léopoldville to headquarters: anti-Lumumba leaders approached Kasavubu "with plan assassinate Lumumba." Kasavubu "refused agree saying he reluctant resort violence and no other leader sufficient stature replace Lumumba."'
      n: '[[w.sen-church-alleged-assassination-plots]], 15 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Aug. 24, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 15). See [[cal.1960-08-18.congo-lumumba]]. Names: Kasavubu, Lumumba.'
      tags:
      - name:kasavubu-joseph
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-06.congo-lumumba
      when: Sept. 6
      date: '1960-09-06'
      thread: congo-lumumba
      c: Léopoldville. Two CIA officers meet a high-level Congolese politician close to the station, the day after Kasavubu dismisses Lumumba. On the station officer's remark that Lumumba "in opposition is almost as dangerous as in office," he "indicated understood and implied might physically eliminate Lumumba." The station officer offers help with the new government's program and promises technicians.
      n: '[[w.sen-church-alleged-assassination-plots]], 17 (the station''s cable of Sept. 7, which the report quotes; the report gives the meeting as "the day after Kasavubu deposed Lumumba"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Sept. 7, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 17). See [[cal.1960-08-24.congo-lumumba]]. Names: Lumumba, Kasavubu. Check: the day: the report dates the meeting by Kasavubu''s dismissal of Sept. 5; the cable is of Sept. 7.'
      tags:
      - name:lumumba-patrice
      - name:kasavubu-joseph
      - name:devlin-lawrence-r
- add:
    entry:
      id: cal.1960-09-08.congo-lumumba
      when: Sept. 8
      date: '1960-09-08'
      thread: congo-lumumba
      also:
      - congo
      c: 'Special Group. Gray to Dulles: he hopes "Agency people in the field are fully aware of the top-level feeling in Washington that vigorous action would not be amiss."'
      n: '[[w.sen-church-alleged-assassination-plots]], 62 (the Special Group minutes, quoted). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, Sept. 8, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 62). See [[cal.1960-08-25.congo]]. Names: Gray, Dulles.'
      tags:
      - name:gray-gordon
      - name:dulles-allen-w
- add:
    entry:
      id: cal.1960-09-13.congo-lumumba
      when: Sept. 13
      date: '1960-09-13'
      thread: congo-lumumba
      c: 'Tweedy to the station at Léopoldville: "Lumumba talents and dynamism appear overriding factor in reestablishing his position each time it seems half lost. In other words each time Lumumba has opportunity have last word he can sway events to his advantage."'
      n: '[[w.sen-church-alleged-assassination-plots]], 17 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Leopoldville, Sept. 13, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 17). See [[cal.1960-09-06.congo-lumumba]]. Names: Tweedy, Lumumba.'
      tags:
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-15.congo-lumumba
      when: Sept. 15
      date: '1960-09-15'
      thread: congo-lumumba
      c: 'The day after Mobutu''s coup, Devlin cables headquarters that he is advising a Congolese effort to "eliminate" Lumumba, whom he fears the UN''s custody has strengthened: "Only solution is remove him from scene soonest."'
      n: '[[w.sen-church-alleged-assassination-plots]], 17 (the cable; Devlin is "Victor Hedgman" in the report). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Sept. 15, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 17). See [[cal.1960-09-06.congo-lumumba]]. Names: Devlin, Mobutu, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:mobutu-joseph-d
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-17.congo-lumumba
      when: Sept. 17
      date: '1960-09-17'
      thread: congo-lumumba
      c: 'Léopoldville. A CIA operative meets a Congolese senator, who asks for small arms for troops lately arrived in the area: the senator "reluctantly agrees Lumumba must go permanently." The operative will "explore possibility obtaining arms" and recommends that headquarters "have [arms] supplies ready to go at nearest base pending [United States] decision that supply warranted and necessary."'
      n: '[[w.sen-church-alleged-assassination-plots]], 17–18 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Sept. 17, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 18). See [[cal.1960-09-15.congo-lumumba]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-20.congo-lumumba
      when: Sept. 20
      date: '1960-09-20'
      thread: congo-lumumba
      c: Devlin warns a key Congolese leader of coup plots by Lumumba, Gizenga and Mulele, and "urged arrest or other more permanent disposal of Lumumba, Gizenga, and Mulele."
      n: '[[w.sen-church-alleged-assassination-plots]], 18 (the cable; the report calls Gizenga and Mulele Lumumba''s lieutenants). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Sept. 20, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 18). See [[cal.1960-09-17.congo-lumumba]]. Names: Devlin, Lumumba, Gizenga.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
      - name:gizenga-antoine
- add:
    entry:
      id: cal.1960-09-21.congo-lumumba
      when: Sept. 21
      date: '1960-09-21'
      thread: congo-lumumba
      also:
      - congo
      c: 'The 460th NSC meeting, Eisenhower present. Dulles: Mobutu "appeared to be the effective power in the Congo for the moment but Lumumba was not yet disposed of and remained a grave danger as long as he was not disposed of."'
      n: '[[w.sen-church-alleged-assassination-plots]], 62–63 (the minutes, quoted; Boggs, who wrote them, "did not interpret" the remark "as referring to assassination"; Bissell, not present, reads it as "one possible means"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, 460th NSC meeting, Sept. 21, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 62). See [[cal.1960-09-21.middle-east]], [[cal.1960-09-19.congo]]. Names: Dulles, Eisenhower, Mobutu, Lumumba.'
      tags:
      - name:dulles-allen-w
      - name:eisenhower-dwight-d
      - name:mobutu-joseph-d
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-22.congo-lumumba
      when: Sept. 22
      date: '1960-09-22'
      thread: congo-lumumba
      c: 'Tweedy to Devlin and his "colleague," on the restricted PROP channel: "you and colleague understand we cannot read over your shoulder as you plan and assess opportunities. Our primary concern must be concealment [American] role, unless outstanding opportunity emerges which makes calculated risk first class bet." If "support for prop objectives" proves essential, a third-country national is to be the agent.'
      n: '[[w.sen-church-alleged-assassination-plots]], 23–24 (the cables of Sept. 22; Tweedy, by his testimony, calls "PROP objectives" an assassination attempt and the colleague Scheider (Gottlieb)). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Tweedy to Leopoldville, Sept. 22, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 24). See [[cal.1960-09-19.congo]], [[cal.1960-09-26.congo-lumumba]]. Names: Tweedy, Devlin.'
      tags:
      - name:tweedy-bronson
      - name:devlin-lawrence-r
      - name:gottlieb-sidney
- add:
    entry:
      id: cal.1960-09-27.congo-lumumba
      when: Sept. 27
      date: '1960-09-27'
      thread: congo-lumumba
      c: 'Devlin to Tweedy, PROP channel: he made contact with Gottlieb the day before; they are "on same wavelength." "Believe most rapid action consistent with security indicated." He lists his plans, the first an agent to "take refuge with Big Brother," Lumumba by Tweedy''s account, as "inside man to brush up details to razor edge"; he will proceed on them "unless instructed to contrary."'
      n: '[[w.sen-church-alleged-assassination-plots]], 25, 27 (the cable of Sept. 27; Scheider is Gottlieb). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Tweedy, Sept. 27, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 27). See [[cal.1960-09-26.congo-lumumba]]. Names: Devlin, Tweedy, Gottlieb, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:tweedy-bronson
      - name:gottlieb-sidney
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-09-30.congo-lumumba
      when: Sept. 30
      date: '1960-09-30'
      thread: congo-lumumba
      c: 'Devlin to Tweedy: "No really airtight op possible with assets now available." He urges headquarters to authorize "exploratory conversations" to learn whether his agent will take the part of active agent or cut-out, and asks headquarters to reply at once.'
      n: '[[w.sen-church-alleged-assassination-plots]], 28 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Tweedy, Sept. 30, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 28). See [[cal.1960-09-27.congo-lumumba]]. Names: Devlin, Tweedy.'
      tags:
      - name:devlin-lawrence-r
      - name:tweedy-bronson
- add:
    entry:
      id: cal.1960-09-30.congo
      when: Sept. 30
      date: '1960-09-30'
      thread: congo
      also:
      - congo-lumumba
      c: 'The deputy chief of the CIA''s Africa Division to Léopoldville: "you are authorized have exploratory talks with [agent] to assess his attitude toward possible active agent or cutout role." "Hope * * * for moderate haste."'
      n: '[[w.sen-church-alleged-assassination-plots]], 28 (the cable; Tweedy and the deputy, by testimony, treat the agent as a possible assassin). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Deputy Chief, Africa Division, to Leopoldville, Sept. 30, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 28). See [[cal.1960-09-30.congo-lumumba]]. Names: Devlin.'
      tags:
      - name:devlin-lawrence-r
- add:
    entry:
      id: cal.1960-10-06.congo-lumumba
      when: Oct. 6
      date: '1960-10-06'
      thread: congo-lumumba
      c: 'Bissell and Tweedy to the station, not to be discussed with State Department representatives or operational contacts: the CIA is "conducting contingency planning for Congo at request policy echelons," to support "elements in armed opposition to Lumumba"; "contemplated action includes provision arms, supplies and perhaps some training to anti-Lumumba resistance groups."'
      n: '[[w.sen-church-alleged-assassination-plots]], 18 (the cable, in a note). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Leopoldville, Oct. 6, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 18). See [[cal.1960-09-17.congo-lumumba]]. Names: Bissell, Tweedy, Lumumba.'
      tags:
      - name:bissell-richard-m-jr
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10-07.congo-lumumba
      when: Oct. 7
      date: '1960-10-07'
      thread: congo-lumumba
      c: 'Devlin to Tweedy: he had "exploratory conversation" with the agent; "although did not pick up ball, believe he prepared take any role necessary within limits security accomplish objective." If headquarters think the agent''s circumstances bar him, he asks for "qualified third country national."'
      n: '[[w.sen-church-alleged-assassination-plots]], 28–29 (the cables of Oct. 7). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Tweedy, Oct. 7, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 28). See [[cal.1960-09-30.congo]], [[cal.1960-10-05.congo-lumumba]]. Names: Devlin, Tweedy.'
      tags:
      - name:devlin-lawrence-r
      - name:tweedy-bronson
- add:
    entry:
      id: cal.1960-10-07.congo
      when: Oct. 7
      date: '1960-10-07'
      thread: congo
      also:
      - congo-lumumba
      c: 'Tweedy to Devlin, having "had good discussion your colleague" (Gottlieb, who left the Congo Oct. 5): "be assured did not expect prop objectives be reached in short period." A third-country national operative may be sent for him to assess; if suitable, a senior case officer on temporary duty would "run this op * * * under your direction."'
      n: '[[w.sen-church-alleged-assassination-plots]], 29 (the cable; the report has "Joe" and the colleague as Scheider (Gottlieb)). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Tweedy to Leopoldville, Oct. 7, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 29). See [[cal.1960-10-07.congo-lumumba]]. Names: Tweedy, Devlin, Gottlieb.'
      tags:
      - name:tweedy-bronson
      - name:devlin-lawrence-r
      - name:gottlieb-sidney
- add:
    entry:
      id: cal.1960-10-11.congo-lumumba
      when: Oct. 11
      date: '1960-10-11'
      thread: congo-lumumba
      c: 'Devlin to headquarters: the UN Secretary-General''s special representative says arrest by Congolese authorities is "just a trick to assassinate Lumumba." The station "has consistently urged [Congolese] leaders arrest Lumumba in belief Lumumba will continue be threat to stability Congo until removed from scene."'
      n: '[[w.sen-church-alleged-assassination-plots]], 42 (the cable, in a note). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Oct. 11, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 42). See [[cal.1960-09-20.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10-15.congo-lumumba
      when: Oct. 15
      date: '1960-10-15'
      thread: congo-lumumba
      c: 'Tweedy to the station, by the normal channel, shared with the embassy: "only direct action we can now stand behind is to support immobilizing or arresting [Lumumba], desirable as more definitive action might be. Any action taken would have to be entirely Congolese."'
      n: '[[w.sen-church-alleged-assassination-plots]], 31 (the cable, drafted by a desk officer and released over Tweedy''s name). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Leopoldville, Oct. 15, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 31). See [[cal.1960-10-11.congo-lumumba]]. Names: Tweedy, Lumumba.'
      tags:
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10-15.congo
      when: Oct. 15
      date: '1960-10-15'
      thread: congo
      also:
      - congo-lumumba
      c: 'Tweedy to Devlin, PROP channel, eyes only, not to the ambassador: "As stumbling bloc [Lumumba] represents increasingly apparent," "his disposition spontaneously becomes number one consideration." The channel "remains highest priority." Tweedy asks his view of a commando-type group to abduct Lumumba, and of a senior case officer sent to "concentrate entirely this aspect."'
      n: '[[w.sen-church-alleged-assassination-plots]], 31 (the cable; Tweedy''s deputy, by affidavit, holds it controlling over the cable of the normal channel). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Tweedy to Leopoldville, Oct. 15, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 31). See [[cal.1960-10-15.congo-lumumba]]. Names: Tweedy, Devlin, Lumumba.'
      tags:
      - name:tweedy-bronson
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10-26.congo-lumumba
      when: Oct. 26
      date: '1960-10-26'
      thread: congo-lumumba
      c: 'Devlin to headquarters: should the moderates fail to get a majority were Parliament reopened, the "pressures for [Lumumba''s] return will be almost irresistible."'
      n: '[[w.sen-church-alleged-assassination-plots]], 18 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Oct. 26, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 18). See [[cal.1960-10-11.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10-28.congo-lumumba
      when: Oct. 28
      date: '1960-10-28'
      thread: congo-lumumba
      c: 'Devlin to headquarters: a Congolese in touch with the CIA "implied he trying have [Lumumba] killed but added this most difficult as job would have be done by African with no apparent involvement white man."'
      n: '[[w.sen-church-alleged-assassination-plots]], 18 (the cable, in a note). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Oct. 28, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 18). See [[cal.1960-10-26.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-10.congo-lumumba
      when: Oct., late
      date: 1960-10
      thread: congo-lumumba
      c: 'Bissell asks Michael Mulroney, a senior CIA officer, to go to the Congo "to eliminate Lumumba," by Mulroney''s testimony in 1975: to kill him. Mulroney says he "would absolutely not have any part of killing Lumumba." By Bissell''s first account, he asked Mulroney "to investigate the possibility of killing Lumumba."'
      n: '[[w.sen-church-alleged-assassination-plots]], 38, 40 (testimony of June 9 and Sept. 11, 1975, and of Bissell, June 11, 1975; the report puts the request in early October, after Devlin''s of Oct. 17, and "late October" in a note; "Michael Mulroney" is the report''s name). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-10-15.congo]]. Names: Bissell, Lumumba. Check: the day: Mulroney, "in October 1960," "late October" (31 n.3); the cable of Oct. 29 tells the station he will soon arrive.'
      tags:
      - name:bissell-richard-m-jr
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-11-02.congo-lumumba
      when: Nov. 2
      date: '1960-11-02'
      thread: congo-lumumba
      c: 'Headquarters to Léopoldville: QJ/WIN, a foreign agent with a criminal record, is to go to the Congo on a mission that "might involve a large element of personal risk." "In view of the extreme sensitivity of the objective" he is not told what is wanted, only to "spot, assess, and recommend some dependable, quick-witted persons for our use." The cable is to be "reduced to cryptic necessary notes and destroyed after the first reading."'
      n: '[[w.sen-church-alleged-assassination-plots]], 43 (the cable; the report calls QJ/WIN "a foreign citizen with a criminal background, recruited in Europe"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to Leopoldville, Nov. 2, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 43). See [[cal.1960-10-07.congo]].'
- add:
    entry:
      id: cal.1960-11-03.congo-lumumba
      when: Nov. 3
      date: '1960-11-03'
      thread: congo-lumumba
      c: Mulroney arrives at Léopoldville. Devlin tells him "a virus in the safe," by Mulroney's testimony in 1975; Mulroney takes it for a lethal agent.
      n: '[[w.sen-church-alleged-assassination-plots]], 41 (testimony of June 9 and Sept. 11, 1975; the station''s cable of Nov. 4 reports the arrival; Devlin recalls no talk of the assassination plan with Mulroney). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Nov. 4, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 41); CIA cable, deputy chief, Africa Division, to the station, Oct. 29, 1960 (Mulroney to arrive "in furtherance this project") (cited by [[w.sen-church-alleged-assassination-plots]], 41). See [[cal.1960-10.congo-lumumba]]. Names: Devlin.'
      tags:
      - name:devlin-lawrence-r
- add:
    entry:
      id: cal.1960-11-13.congo-lumumba
      when: Nov. 13
      date: '1960-11-13'
      thread: congo-lumumba
      c: 'Léopoldville to headquarters: "Local operational circumstances require immediate expedition of QJ/WIN travel to Leopoldville." No reason is given. A cable of Nov. 11 had asked the same.'
      n: '[[w.sen-church-alleged-assassination-plots]], 43 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Nov. 13 and 11, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 43). See [[cal.1960-11-02.congo-lumumba]].'
- add:
    entry:
      id: cal.1960-11-14.congo-lumumba
      when: Nov. 14
      date: '1960-11-14'
      thread: congo-lumumba
      c: 'Devlin to Tweedy, PROP channel: "Target has not left building in several weeks," the house guarded "day and night" by Congolese and UN troops; "concentric rings of defense make establishment of observation post impossible." A CIA agent says Lumumba''s followers in Stanleyville want him to break out and go there by car; the station "has several possible assets to use in event of breakout and studying several plans of action."'
      n: '[[w.sen-church-alleged-assassination-plots]], 33, 48 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station officer to Tweedy, Nov. 14, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 34). See [[cal.1960-10-15.congo]]. Names: Devlin, Tweedy, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-11-21.congo-lumumba
      when: Nov. 21
      date: '1960-11-21'
      thread: congo-lumumba
      c: QJ/WIN arrives at Léopoldville. He returns to Europe in late December.
      n: '[[w.sen-church-alleged-assassination-plots]], 43 (the cables of Nov. 29 and Dec. 9). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Nov. 29, 1960; Director to Leopoldville, Dec. 9, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 43). See [[cal.1960-11-02.congo-lumumba]].'
- add:
    entry:
      id: cal.1960-11.congo
      when: Nov., late
      date: 1960-11
      thread: congo
      also:
      - congo-lumumba
      c: CIA officers from the African stations meet with Bissell and Tweedy. Devlin briefs them on the Congo, Lumumba's flight from Léopoldville included; he recalls no talk of assassinating Lumumba.
      n: '[[w.sen-church-alleged-assassination-plots]], 51 (Devlin''s testimony of Aug. 21, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-11-14.congo-lumumba]]. Names: Bissell, Tweedy, Devlin, Lumumba. Check: the day.'
      tags:
      - name:bissell-richard-m-jr
      - name:tweedy-bronson
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-11-28.congo-lumumba
      when: Nov. 28
      date: '1960-11-28'
      thread: congo-lumumba
      c: The day after Lumumba's escape from the UN guard, the station cables that it is "working with [Congolese government] to get roads blocked and troops alerted [block] possible escape route." The report finds the cable shows the station ignorant of how he left.
      n: '[[w.sen-church-alleged-assassination-plots]], 48 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Nov. 28, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 48). See [[cal.1960-11-27.congo]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-11-29.congo-lumumba
      when: Nov. 29
      date: '1960-11-29'
      thread: congo-lumumba
      c: 'Devlin to Tweedy: QJ/WIN has begun a plan to "pierce both Congolese and U.N. guards" at Lumumba''s residence and "provide escort out of residence." With Lumumba gone to Stanleyville, QJ/WIN is "anxious go Stanleyville and expressed desire execute plan by himself without using any apparat."'
      n: '[[w.sen-church-alleged-assassination-plots]], 44 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station officer to Tweedy, Nov. 29, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 44). See [[cal.1960-11-28.congo-lumumba]]. Names: Devlin, Tweedy, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:tweedy-bronson
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-11-30.congo-lumumba
      when: Nov. 30
      date: '1960-11-30'
      thread: congo-lumumba
      c: 'The chief of the Africa Division to Devlin: "Concur QJ/WIN go Stanleyville * * *. We are prepared consider direct action by QJ/WIN but would like your reading on security factors. How close would this place [United States] to the action?"'
      n: '[[w.sen-church-alleged-assassination-plots]], 44 (the cable, which "could have been interpreted as an assassination order"; the report finds "no clear evidence" that QJ/WIN was in any assassination plan). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Chief of Africa Division to Station Officer, Nov. 30, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 44). See [[cal.1960-11-29.congo-lumumba]], [[cal.1960-11.congo-lumumba]]. Names: Devlin.'
      tags:
      - name:devlin-lawrence-r
- add:
    entry:
      id: cal.1960-12-14.congo-lumumba
      when: Dec. 14
      date: '1960-12-14'
      thread: congo-lumumba
      c: 'Léopoldville. QJ/WIN reports that WI/ROGUE, a CIA asset, offered him $300 a month to join an intelligence net and be a member of an "execution squad." Devlin''s cable of Dec. 17 is "concerned by [WI/ROGUE] free wheeling and lack security": he will keep him "on probation," but "if continue have difficulties, believe [WI/ROGUE] recall best solution."'
      n: '[[w.sen-church-alleged-assassination-plots]], 47 (the cable of Dec. 17; the report finds an unauthorized act "unconnected to any CIA operation," though not definitively; Devlin: "I am sure he was never asked to go out and execute anyone"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Dec. 17, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 47). See [[cal.1960-11-30.congo-lumumba]]. Names: Devlin.'
      tags:
      - name:devlin-lawrence-r
- add:
    entry:
      id: cal.1961-01-12.congo-lumumba
      when: Jan. 12
      date: '1961-01-12'
      thread: congo-lumumba
      c: 'Devlin to headquarters: the army garrison at Léopoldville "will mutiny within two or three days unless drastic action taken satisfy complaints"; a mutiny would "almost certainly" bring Lumumba back to power. He urges headquarters to consider an immediate reaction. By the ordinary channel; no mention of assassination.'
      n: '[[w.sen-church-alleged-assassination-plots]], 49 (the cable, which "made no reference, even indirectly, to assassination"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Jan. 12, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 49). See [[cal.1960-12-14.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-01-13.congo-lumumba
      when: Jan. 13
      date: '1961-01-13'
      thread: congo-lumumba
      c: 'Devlin to headquarters: "Station and Embassy believe present government may fall within few days. Result would almost certainly be chaos and return [Lumumba] to power." Reopening Parliament under the UN would "almost certainly insure [Lumumba] victory in Parliament"; "refusal take drastic steps at this time will lead to defeat of [United States] policy in Congo."'
      n: '[[w.sen-church-alleged-assassination-plots]], 49 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Jan. 13, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 49). See [[cal.1961-01-12.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-01-14.congo-lumumba
      when: Jan. 14
      date: '1961-01-14'
      thread: congo-lumumba
      c: A Congolese government leader tells Devlin that Lumumba is to be moved from the Thysville camp to Bakwanga, in the province of his "sworn enemy." Devlin reports it Jan. 17.
      n: '[[w.sen-church-alleged-assassination-plots]], 49 (the cable and information report of Jan. 17, 1961). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Jan. 17, 1961; CIA information report, Jan. 17, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 49). See [[cal.1961-01-13.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-01-16.congo-lumumba
      when: Jan. 16
      date: '1961-01-16'
      thread: congo-lumumba
      c: 'Devlin to headquarters, after learning Lumumba is to go to Bakwanga: "It now more important than ever support those single elements which can strengthen fabric overall * * * opposition [Lumumba]." "Wish assure HQS we trying shore up * * * defenses only in terms our own objectives deny Congo govt control [Lumumba]."'
      n: '[[w.sen-church-alleged-assassination-plots]], 50 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Leopoldville to Director, Jan. 16, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 50). See [[cal.1961-01-14.congo-lumumba]]. Names: Devlin, Lumumba.'
      tags:
      - name:devlin-lawrence-r
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-01-19.congo-lumumba
      when: Jan. 19
      date: '1961-01-19'
      thread: congo-lumumba
      c: 'Elisabethville. The CIA base chief to headquarters: "Thanks for Patrice. If we had known he was coming we would have baked a snake." His sources gave "no advance word whatsoever" of the flight; the central government "does not plan to liquidate Lumumba."'
      n: '[[w.sen-church-alleged-assassination-plots]], 51 (the cable; the report reads it as showing the CIA had no advance knowledge of the transfer). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Elisabethville to Director, Jan. 19, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 51). See [[cal.1961-01-17.congo]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1961-02-10.congo-lumumba
      when: Feb. 10
      date: '1961-02-10'
      thread: congo-lumumba
      c: 'Elisabethville. The CIA base to headquarters, three days before Katanga announces the death: "Lumumba fate is best kept secret in Katanga." Its several sources give different accounts of how he died.'
      n: '[[w.sen-church-alleged-assassination-plots]], 51 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Elisabethville to Director, Feb. 10, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 51). See [[cal.1961-01-19.congo-lumumba]]. Names: Lumumba.'
      tags:
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-07-21.congo-lumumba
      when: July 21
      date: '1960-07-21'
      thread: congo-lumumba
      also:
      - congo
      c: 'The NSC, Eisenhower absent. Dulles: in Lumumba "we were faced with a person who was a Castro or worse"; "It is safe to go on the assumption that Lumumba has been bought by the Communists; this also, however, fits with his own orientation."'
      n: '[[w.sen-church-alleged-assassination-plots]], 57 (the minutes, quoted; Robert H. Johnson, the note-taker, attended; July 15''s meeting, also without the President, held the same attitude). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: NSC minutes, July 21, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 57). See [[cal.1960-08-18.congo-2]]. Names: Dulles, Lumumba.'
      tags:
      - name:dulles-allen-w
      - name:lumumba-patrice
      - name:johnson-robert-h
- add:
    entry:
      id: cal.1960-09.congo-lumumba
      when: Sept.
      date: 1960-09
      thread: congo-lumumba
      c: 'Tweedy and his deputy meet Scheider, the CIA scientist, and ask him to take toxic materials to the Congo and give the station officer headquarters'' instruction: "to mount an operation, if he could do it securely * * * to either seriously incapacitate or eliminate Lumumba," by Scheider''s testimony in 1975. He leaves within a week.'
      n: '[[w.sen-church-alleged-assassination-plots]], 21 (Scheider''s testimony of Oct. 7 and 9, 1975, which remembers the talk "very clearly"; Tweedy, shown the cables, found it "perfectly clear" he had met Scheider; "Scheider" is Gottlieb). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1960-09-22.congo-lumumba]]. Names: Tweedy, Lumumba, Gottlieb. Check: the day: after Sept. 19 and before Scheider''s arrival Sept. 26, by his testimony of leaving "within a week."'
      tags:
      - name:tweedy-bronson
      - name:lumumba-patrice
      - name:gottlieb-sidney
- add:
    entry:
      id: cal.1961-01-11.congo-lumumba
      when: Jan. 11
      date: '1961-01-11'
      thread: congo-lumumba
      c: 'William Harvey, in a memorandum to the CIA''s Finance Division to arrange the accounting for QJ/WIN''s work in the Congo: "QJ/WIN was sent on this trip for a specific, highly sensitive operational purpose which has been completed." Mulroney, by his testimony in 1975, reads it to mean that with Lumumba in Congolese hands "the reason for the mounting of the project * * * had become moot."'
      n: '[[w.sen-church-alleged-assassination-plots]], 44 (the memorandum; Harvey did not recall its meaning; a memorandum of Jan. 31 on payments to QJ/WIN is noted at 43). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum for the Finance Division, Harvey, Jan. 11, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 44). See [[cal.1960-12-14.congo-lumumba]]. Names: Harvey, Lumumba.'
      tags:
      - name:harvey-william-k
      - name:lumumba-patrice
- add:
    entry:
      id: cal.1960-02-10.latin-america-dominican-republic
      when: Feb. 10
      date: '1960-02-10'
      thread: latin-america-dominican-republic
      c: Special Group. The Eisenhower administration gives "high level consideration to a program of covert aid to Dominican dissidents."
      n: '[[w.sen-church-alleged-assassination-plots]], 192 (the report''s words for the Special Group''s minutes). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, Feb. 10, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 192). Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-04-14.latin-america-dominican-republic
      when: Apr. 14
      date: '1960-04-14'
      thread: latin-america-dominican-republic
      c: 'Herter to Eisenhower, by memorandum, a contingency plan for the Dominican Republic: if matters worsen, "the United States would immediately take political action to remove Trujillo from the Dominican Republic as soon as a suitable successor regime can be induced to take over with the assurance of U.S. political, economic, and—if necessary—military support."'
      n: '[[w.sen-church-alleged-assassination-plots]], 192 (the memorandum quoted). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Herter to the President, Apr. 14, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 192). See [[cal.1960-02-10.latin-america-dominican-republic]]. Names: Herter, Eisenhower, Trujillo.'
      tags:
      - name:herter-christian-a
      - name:eisenhower-dwight-d
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-04-21.latin-america-dominican-republic
      when: Apr. 21
      date: '1960-04-21'
      thread: latin-america-dominican-republic
      c: 'Herter to Gates, Secretary of Defense, by letter: the President has approved the contingency plan for the Dominican Republic of Herter''s memorandum of Apr. 14.'
      n: '[[w.sen-church-alleged-assassination-plots]], 192 (the report: "In April 1960 President Eisenhower approved"; "Presidential approval indicated in Herter letter to Secretary of Defense Gates, 4/21/60"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Letter, Herter to Gates, Apr. 21, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 192). See [[cal.1960-04-14.latin-america-dominican-republic]]. Names: Herter, Eisenhower. Check: the day of the approval, which the letter indicates.'
      tags:
      - name:herter-christian-a
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-06-16.latin-america-dominican-republic
      when: June 16
      date: '1960-06-16'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station in Ciudad Trujillo: Dearborn, the deputy chief of mission, to be the "communications link" between the Dominican dissidents and the CIA, with the "unofficial approval" of Rubottom, Assistant Secretary of State for Inter-American Affairs.'
      n: '[[w.sen-church-alleged-assassination-plots]], 192 (the cable, "unofficial" in italics; Ambassador Farland had introduced Dearborn to the dissident leaders before leaving in May). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, June 16, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 192). See [[cal.1960-04-14.latin-america-dominican-republic]]. Names: Rubottom, Trujillo.'
      tags:
      - name:rubottom-roy-r-jr
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-06-21.latin-america-dominican-republic
      when: June 21
      date: '1960-06-21'
      thread: latin-america-dominican-republic
      c: Farland reportedly suggests sites for airdrops of rifles to the dissidents, at a meeting with an officer of the CIA's Western Hemisphere Division.
      n: '[[w.sen-church-alleged-assassination-plots]], 193 (the CIA memorandum of June 21; the report says the dissidents asked Farland for sniper rifles at a cocktail party). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, June 21, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 193). See [[cal.1960-06-16.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-06.latin-america-dominican-republic
      when: June, about the end
      date: 1960-06
      thread: latin-america-dominican-republic
      c: 'Rubottom with Col. J. C. King, chief of the CIA''s Western Hemisphere Division, by a CIA memorandum of June 28 and King''s handwritten notes: King raises questions, among them: "Would it provide a small number of sniper rifles or other devices for the removal of key Trujillo people from the scene?" His notes have Rubottom answer "yes." Neither recalls the meeting.'
      n: '[[w.sen-church-alleged-assassination-plots]], 193 (King''s question and answer as the report quotes them; their affidavits of July 29, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, June 28, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 193). See [[cal.1960-06-21.latin-america-dominican-republic]]. Names: Rubottom, King, Trujillo. Check: the day: the report has the meeting "around the end of June" and dates the memorandum June 28.'
      tags:
      - name:rubottom-roy-r-jr
      - name:king-j-c
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-07-01.latin-america-dominican-republic
      when: July 1
      date: '1960-07-01'
      thread: latin-america-dominican-republic
      c: 'CIA memorandum to Cabell, acting Director of Central Intelligence, prepared for King''s signature: an opposition leader asked Farland for arms, which presumably "would be used against key members of the Trujillo regime." It recommends 12 sterile rifles with telescopic sights and 500 rounds: "Approval for delivery of these arms has been given by Assistant Secretary of State Roy Rubottom." Helms, as acting DDP, concurs; Cabell approves.'
      n: '[[w.sen-church-alleged-assassination-plots]], 193–194 (the memorandum quoted; the concurrence and approval from the CIA Inspector General''s report, 26, undated). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, July 1, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-06.latin-america-dominican-republic]]. Names: Cabell, Rubottom, Helms, Trujillo.'
      tags:
      - name:cabell-charles-p
      - name:rubottom-roy-r-jr
      - name:helms-richard
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-07-01.latin-america
      when: July 1
      date: '1960-07-01'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'CIA headquarters to Dearborn: the plan to airdrop 12 telescopically sighted rifles into the Dominican Republic. Can the dissidents realign the sights if the drop throws them off?'
      n: '[[w.sen-church-alleged-assassination-plots]], 194 (the cable; the rifles were never furnished). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to Dearborn, July 1, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-07-01.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-07-14.latin-america-dominican-republic
      when: July 14
      date: '1960-07-14'
      thread: latin-america-dominican-republic
      c: 'Dearborn, through the station, to CIA headquarters: the dissident leaders are against any further action until the OAS resolves the Venezuelan complaint against Trujillo; they believe strong OAS action could bring the fall without their own effort.'
      n: '[[w.sen-church-alleged-assassination-plots]], 194 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, July 14, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-07-01.latin-america]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-07-14.latin-america
      when: July 14
      date: '1960-07-14'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'Dearborn to Rubottom, by letter: the dissidents are "in no way ready to carry on any type of revolutionary activity in the foreseeable future except the assassination of their principal enemy."'
      n: '[[w.sen-church-alleged-assassination-plots]], 195 (the letter quoted). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Letter, Dearborn to Rubottom, July 14, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 195). See [[cal.1960-07-14.latin-america-dominican-republic]]. Names: Rubottom, Trujillo.'
      tags:
      - name:rubottom-roy-r-jr
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-08-26.latin-america-dominican-republic
      when: Aug. 26
      date: '1960-08-26'
      thread: latin-america-dominican-republic
      c: 'Dearborn to Mallory, Deputy Assistant Secretary of State, by cable, on a meeting between a dissident leader and a consulate political officer: the leader has lost enthusiasm for an assassination attempt and speaks of an invasion from Venezuela.'
      n: '[[w.sen-church-alleged-assassination-plots]], 194 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to Mallory, Aug. 26, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-07-14.latin-america]], [[cal.1960-08-26.latin-america]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-09-08.latin-america-dominican-republic
      when: Sept. 8
      date: '1960-09-08'
      thread: latin-america-dominican-republic
      c: Special Group. The use of high-level emissaries, from within and outside the government, to persuade Trujillo to abdicate.
      n: '[[w.sen-church-alleged-assassination-plots]], 194, 196 (the report''s words; it cites the minutes with Mann''s letter to Dearborn of Oct. 10; none of the efforts worked). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, Sept. 8, 1960; letter, Mann to Dearborn, Oct. 10, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 194). See [[cal.1960-08-26.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-10-27.latin-america-dominican-republic
      when: Oct. 27
      date: '1960-10-27'
      thread: latin-america-dominican-republic
      c: 'Dearborn to Mann, by letter, on plans to force Trujillo out: "it will be best for us, for the OAS, and for the Dominican Republic if the Dominicans put an end to Trujillo before he leaves this island." "I would favor destroying Trujillo as being the first necessary step in the salvation of my country and I would regard this, in fact, as my Christian duty."'
      n: '[[w.sen-church-alleged-assassination-plots]], 195 (the letter, answering Mann''s request for his comments). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Letter, Dearborn to Mann, Oct. 27, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 195). See [[cal.1960-09-08.latin-america-dominican-republic]]. Names: Mann, Trujillo.'
      tags:
      - name:mann-thomas-c
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-10.latin-america-dominican-republic
      when: Oct.
      date: 1960-10
      thread: latin-america-dominican-republic
      c: 'A CIA memorandum, "Plans of the Dominican Internal Opposition and Dominican Desk for Overthrow of the Trujillo Government": plans "which appear feasible and which might be carried out * * * covertly by CIA with a minimal risk of exposure." About 300 rifles and pistols, ammunition and grenades to a cache 14 miles east of Ciudad Trujillo; a remote-control detonating device "which could be planted by the dissidents in such manner as to eliminate certain key Trujillo henchmen."'
      n: '[[w.sen-church-alleged-assassination-plots]], 196 (the memorandum). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memorandum, Oct. 1960, "Plans of the Dominican Internal Opposition and Dominican Desk for Overthrow of the Trujillo Government" (cited by [[w.sen-church-alleged-assassination-plots]], 196). See [[cal.1960-10-27.latin-america-dominican-republic]]. Names: Trujillo. Check: the day.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1960-12-29.latin-america-dominican-republic
      when: Dec. 29
      date: '1960-12-29'
      thread: latin-america-dominican-republic
      c: Special Group. Bissell presents a broad plan of covert support to anti-Trujillo exile groups and internal dissidents, and says the actions "would not, of themselves, bring about the desired result in the near future, lacking some decisive stroke against Trujillo himself." The Group approves.
      n: '[[w.sen-church-alleged-assassination-plots]], 196 (the minutes quoted). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, Dec. 29, 1960 (cited by [[w.sen-church-alleged-assassination-plots]], 196). See [[cal.1960-10.latin-america-dominican-republic]]. Names: Bissell, Trujillo.'
      tags:
      - name:bissell-richard-m-jr
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-01-12.latin-america-dominican-republic
      when: Jan. 12
      date: '1961-01-12'
      thread: latin-america-dominican-republic
      c: 'Mann to Merchant, by memorandum, through Merchant''s special assistant Scott: the dissidents have "consistently asked us to supply them with ''hardware''" and, "rather persistently," for "exotic items and devices." He suggests token quantities of items such as small explosive devices, for "sabotage potential"; "there would be no thought of toppling the GODR" by them. It does not mention assassination.'
      n: '[[w.sen-church-alleged-assassination-plots]], 197 (the memorandum, drafted Jan. 11; by Merchant''s notes the Special Group of the same day "agreed in terms of Tom Mann''s memo"; the findings, 272, say it did not mention assassination). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Mann to Merchant, Jan. 12, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 197). See [[cal.1961-01-12.latin-america]]. Names: Mann, Merchant, Trujillo.'
      tags:
      - name:mann-thomas-c
      - name:merchant-livingston-t
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-01-19.latin-america-dominican-republic
      when: Jan. 19
      date: '1961-01-19'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to Dearborn, the last day of the Eisenhower administration: approval has been given for supplying arms and other material to the Dominican dissidents.'
      n: '[[w.sen-church-alleged-assassination-plots]], 197 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Jan. 19, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 197). See [[cal.1961-01-12.latin-america]]. Names: Eisenhower.'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1961-01-31.latin-america-dominican-republic
      when: Jan. 31
      date: '1961-01-31'
      thread: latin-america-dominican-republic
      c: 'Dearborn to the State Department''s special assistant for CIA liaison: the dissidents are "delighted" about the decision to deliver "exotic equipment."'
      n: '[[w.sen-church-alleged-assassination-plots]], 197 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to the special assistant, Jan. 31, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 197). See [[cal.1961-01-19.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-02-10.latin-america-dominican-republic
      when: Feb. 10 and 15
      date: '1961-02-10'
      thread: latin-america-dominican-republic
      c: New York. CIA officials meet Dominican dissident leaders, Feb. 10 and 15. The leaders say repeatedly that "the key to the success of the plot * * * would be the assassination of Trujillo." They ask for ex-FBI agents to plan and carry out his death, cameras that fire projectiles, a slow-working chemical to pass by a handshake, rifle silencers; they propose poison, an ambush, firearms and grenades, and a bomb along the route of his evening walk.
      n: '[[w.sen-church-alleged-assassination-plots]], 198 (the CIA memoranda for the record of Feb. 13 and 16; the report finds no record the CIA answered the requests). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA memoranda for the record, Feb. 13 and 16, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 198). See [[cal.1961-01-31.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-02-14.latin-america-dominican-republic
      when: Feb. 14
      date: '1961-02-14'
      thread: latin-america-dominican-republic
      c: Special Group, with McNamara, Gilpatric, Bowles, Bundy, Dulles, Bissell and Cabell. Dulles and Bissell brief the new members on the past year's projects. "Dominican Republic—Mr. Bundy asked that a memorandum be prepared for higher authority on the subject of what plans can be made for a successor government to Trujillo."
      n: '[[w.sen-church-alleged-assassination-plots]], 203 (the minutes; McNamara recalls no mention of assassination plans, Bissell no detail). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, Feb. 14, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 203). See [[cal.1961-02-10.latin-america-dominican-republic]]. Names: McNamara, Bowles, Bundy, Dulles, Bissell, Cabell, Trujillo.'
      tags:
      - name:mcnamara-robert-s
      - name:gilpatric-roswell-l
      - name:bowles-chester
      - name:bundy-mcgeorge
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - name:cabell-charles-p
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-13.latin-america-dominican-republic
      when: Mar. 13–15
      date: '1961-03-13'
      thread: latin-america-dominican-republic
      c: 'A dissident in the Dominican Republic asks, Mar. 13, for fragmentation grenades "for use during the next week or so," passed to CIA headquarters Mar. 14. Mar. 15: a further request, for 50 fragmentation grenades, five rapid-fire weapons and ten 64-mm. antitank rockets.'
      n: '[[w.sen-church-alleged-assassination-plots]], 198 (the station''s cable of Mar. 15; the report finds no evidence any were supplied). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Mar. 15, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 198). See [[cal.1961-02-10.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-15.latin-america-dominican-republic
      when: Mar. 15
      date: '1961-03-15'
      thread: latin-america-dominican-republic
      c: 'The station to headquarters: Dearborn asks for three .38-caliber pistols for several dissidents.'
      n: '[[w.sen-church-alleged-assassination-plots]], 199 (the cable; Dearborn testified he asked for one pistol, for a contact''s family''s safety). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Mar. 15, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 199). See [[cal.1961-03-13.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-16.latin-america-dominican-republic
      when: Mar. 16
      date: '1961-03-16'
      thread: latin-america-dominican-republic
      c: 'Dearborn to the State Department''s special assistant for CIA liaison, by letter: "the members of our club are now prepared in their minds to have a picnic but do not have the ingredients for the salad." Asked "to furnish three or four pineapples for a party," he "could remember nothing in my instructions that would have allowed me to contribute this ingredient." By his testimony in 1975, the pineapples were probably the grenades.'
      n: '[[w.sen-church-alleged-assassination-plots]], 199 (the letter; Dearborn''s testimony of July 29, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Letter, Dearborn to the special assistant, Mar. 16, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 199). See [[cal.1961-03-13.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-20.latin-america-dominican-republic
      when: Mar. 20
      date: '1961-03-20'
      thread: latin-america-dominican-republic
      c: 'The station to headquarters: the dissidents ask for five M3 machine guns, by pouch, for killing Trujillo in his mistress''s apartment: "To do they need five M3 or comparable machine guns, and 1500 rounds ammo for personal defense in event fire fight. Will use quiet weapons for basic job."'
      n: '[[w.sen-church-alleged-assassination-plots]], 201 (the cable; the number of rounds as the page prints it). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Mar. 20, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 201). See [[cal.1961-03-16.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-24.latin-america-dominican-republic
      when: Mar. 24
      date: '1961-03-24'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station: the timing for an assassination is wrong; "mere disposal of Trujillo may create more problems than solutions." Avoid "precipitous action by the internal dissidents until opposition group and HQS are better prepared"; machine guns will be delivered once the dissidents can receive them. The same cable: the pistols and ammunition are being pouched; Dearborn is not to be told.'
      n: '[[w.sen-church-alleged-assassination-plots]], 201 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Mar. 24, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 201). See [[cal.1961-03-20.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-26.latin-america-dominican-republic
      when: Mar. 26
      date: '1961-03-26'
      thread: latin-america-dominican-republic
      c: 'The station to headquarters: it asks to pass three .30-caliber M1 carbines, left in the consulate by Navy personnel in August 1960, to the dissidents. Dearborn concurs.'
      n: '[[w.sen-church-alleged-assassination-plots]], 200 (the cable and Dearborn''s testimony of July 29, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Mar. 26, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 200). See [[cal.1961-03-24.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-03-31.latin-america-dominican-republic
      when: Mar. 31
      date: '1961-03-31'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station: it approves passing the carbines to the dissidents.'
      n: '[[w.sen-church-alleged-assassination-plots]], 200 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Mar. 31, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 200). See [[cal.1961-03-26.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-05.latin-america-dominican-republic
      when: Apr. 5
      date: '1961-04-05'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station: ask Dearborn not to say in his correspondence with State that the carbines and ammunition are being passed to the dissidents. The station replies Apr. 6 that he has not.'
      n: '[[w.sen-church-alleged-assassination-plots]], 201 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Apr. 5, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 201). See [[cal.1961-03-31.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-07.latin-america-dominican-republic
      when: Apr. 7
      date: '1961-04-07'
      thread: latin-america-dominican-republic
      c: The three carbines are passed to the contact of the dissidents' action group.
      n: '[[w.sen-church-alleged-assassination-plots]], 200 (the cables of Apr. 8 and 26; the report calls the carbines "a token show of support"). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cables, headquarters to station, Apr. 8, 1961; station to headquarters, Apr. 26, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 200). See [[cal.1961-03-31.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-04-07.latin-america
      when: Apr. 7
      date: '1961-04-07'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'A pouch waiver is requested, on behalf of the chief of the Western Hemisphere Division, for "four M3 machine guns and 240 rounds of ammunition on a priority basis for issuance to a small action group to be used for self protection": "desirable if for no other reason than to assure this important group''s continued cooperation with and confidence in this Agency''s determination to live up to its earlier commitments to the group."'
      n: '[[w.sen-church-alleged-assassination-plots]], 202 (the request). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Pouch restriction waiver request and certification, Apr. 7, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 202). See [[cal.1961-04-07.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-10.latin-america-dominican-republic
      when: Apr. 10
      date: '1961-04-10'
      thread: latin-america-dominican-republic
      c: Bissell, as DDP, approves the pouching of four M3 machine guns to the Dominican Republic.
      n: '[[w.sen-church-alleged-assassination-plots]], 202 (the waiver request, signed). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Pouch restriction waiver request, Apr. 7, 1961, approved Apr. 10 (cited by [[w.sen-church-alleged-assassination-plots]], 202). See [[cal.1961-04-07.latin-america]]. Names: Bissell.'
      tags:
      - name:bissell-richard-m-jr
- add:
    entry:
      id: cal.1961-04-10.latin-america
      when: Apr. 10
      date: '1961-04-10'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'Walter Elder, assistant to the Director, by memorandum: "Mr. Dulles wants no action on drops of leaflets or arms in the Dominican Republic taken without his approval." Elder testifies it was meant to avoid "unusual planes shot down" before the Cuban invasion.'
      n: '[[w.sen-church-alleged-assassination-plots]], 202 (the memorandum; Elder''s testimony of Aug. 13, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Elder, Apr. 10, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 202). See [[cal.1961-04-10.latin-america-dominican-republic]]. Names: Dulles.'
      tags:
      - name:dulles-allen-w
- add:
    entry:
      id: cal.1961-04-17.latin-america-dominican-republic
      when: Apr. 17
      date: '1961-04-17'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station: it is most important that the machine guns not be passed without additional headquarters approval.'
      n: '[[w.sen-church-alleged-assassination-plots]], 205 (the cable; the Bay of Pigs invasion had failed; the guns reached the station Apr. 19, and the instruction was repeated Apr. 20). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Apr. 17, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 205). See [[cal.1961-04-10.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-20.latin-america-dominican-republic
      when: Apr. 20
      date: '1961-04-20'
      thread: latin-america-dominican-republic
      c: 'CIA headquarters to the station: hold the machine guns in custody. The decision is "based on judgment that filling a vacuum created by assassination now bigger question than ever view unsettled conditions in Caribbean area."'
      n: '[[w.sen-church-alleged-assassination-plots]], 206 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, headquarters to station, Apr. 20, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 206). See [[cal.1961-04-17.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-25.latin-america-dominican-republic
      when: Apr. 25
      date: '1961-04-25'
      thread: latin-america-dominican-republic
      c: 'The station to headquarters: an American in the Dominican Republic, a cut-out to the dissidents, says Antonio de la Maza will attempt the assassination between Apr. 29 and May 2, with the three carbines from the consulate and whatever else is at hand. The dissidents press for the machine guns.'
      n: '[[w.sen-church-alleged-assassination-plots]], 206 (the cable; headquarters answers that there is no approval to pass more arms and asks the dissidents be told the United States is not ready for the aftermath). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Apr. 25, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 206). See [[cal.1961-04-20.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-04-27.latin-america-dominican-republic
      when: Apr. 27
      date: '1961-04-27'
      thread: latin-america-dominican-republic
      c: 'The station to headquarters: "We doubt statement U.S. government not now prepared to cope with aftermath will dissuade them from attempt."'
      n: '[[w.sen-church-alleged-assassination-plots]], 206 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Apr. 27, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 206). See [[cal.1961-04-25.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-04-30.latin-america-dominican-republic
      when: Apr. 30
      date: '1961-04-30'
      thread: latin-america-dominican-republic
      c: 'Dearborn to headquarters: the dissidents say the assassination will be attempted in the first week of May, with three carbines, four to six 12-gauge shotguns and other small arms; they will go ahead with what they have. "Owing to far-reaching political implications involved in release or non-release of requested items, Headquarters may wish discuss foregoing with State Department."'
      n: '[[w.sen-church-alleged-assassination-plots]], 206 (the cable; the report says the dissidents want the machine guns still). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, Apr. 30, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 206). See [[cal.1961-04-27.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-02.latin-america-dominican-republic
      when: May 2
      date: '1961-05-02'
      thread: latin-america-dominican-republic
      c: 'A draft cable, to go to Dulles with Bissell''s recommendation and signed off by a CIA officer of the Western Hemisphere Division: "Since it appears that opposition group has committed itself to action with or without additional support * * * station authorized pass ref. A items [the machine guns] to opposition member for their additional protection on their proposed endeavor." Never sent.'
      n: '[[w.sen-church-alleged-assassination-plots]], 207 (the draft; Bissell''s testimony of July 22, 1975). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Draft CIA cable, headquarters to station, May 2, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 207). See [[cal.1961-04-30.latin-america-dominican-republic]]. Names: Bissell, Dulles.'
      tags:
      - name:bissell-richard-m-jr
      - name:dulles-allen-w
- add:
    entry:
      id: cal.1961-05-03.latin-america-dominican-republic
      when: May 3
      date: '1961-05-03'
      thread: latin-america-dominican-republic
      c: 'Berle, chairman of the Interagency Task Force on Latin America, with a CIA officer of the Western Hemisphere Division. "On cross examination it developed that the real plan was to assassinate Trujillo and they wanted guns for that purpose." Berle: "we did not wish to have anything to do with any assassination plots anywhere, any time." The officer says he feels the same.'
      n: '[[w.sen-church-alleged-assassination-plots]], 208 (Berle''s memorandum of conversation; copies to Coerr and the special assistant). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum of conversation, Berle, May 3, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 208). See [[cal.1961-05-02.latin-america-dominican-republic]]. Names: Berle, Trujillo.'
      tags:
      - name:berle-adolf-a
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-04.latin-america-dominican-republic
      when: May 4
      date: '1961-05-04'
      thread: latin-america-dominican-republic
      c: 'Special Group. Dulles refers to recent reports of a new anti-Trujillo plot, says "we never know if one of these is going to work or not," and asks the status of contingency planning should the plot come off. Bundy: it is covered in the Cuba paper to be discussed at a high level soon.'
      n: '[[w.sen-church-alleged-assassination-plots]], 208 (the minutes). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, May 4, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 208). See [[cal.1961-05-03.latin-america-dominican-republic]]. Names: Dulles, Bundy, Trujillo.'
      tags:
      - name:dulles-allen-w
      - name:bundy-mcgeorge
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-10.latin-america-dominican-republic
      when: May 10–13
      date: '1961-05-10'
      thread: latin-america-dominican-republic
      c: Dearborn is in Washington, recalled to help draft contingency plans for the Dominican Republic. He meets State Department personnel and, at the White House, Goodwin and Schlesinger; he leaves thinking Goodwin has read the cables.
      n: '[[w.sen-church-alleged-assassination-plots]], 209 (Dearborn''s testimony of July 29, 1975: in Washington "at least from May 10 through May 13"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1961-05-04.latin-america-dominican-republic]]. Names: Goodwin, Schlesinger. Check: the days of the meeting at the White House.'
      tags:
      - name:goodwin-richard-n
      - name:schlesinger-arthur-m-jr
- add:
    entry:
      id: cal.1961-05-12.latin-america-dominican-republic
      when: May 12
      date: '1961-05-12'
      thread: latin-america-dominican-republic
      c: 'Two State Department drafts of a "Program of Covert Action for the Dominican Republic": one an expanded offer of small explosive devices and arms, the other not recommending arms inside the country. Attached to the second, a one-page list by the special assistant: "The USG should not lend itself to direct political assassination." "We would be encouraging the action, supplying the weapons, effecting the delivery, and then turning over only the final execution to (unskilled) local triggermen."'
      n: '[[w.sen-church-alleged-assassination-plots]], 210–211 (the drafts; one bears "5/12/61"; the special assistant "believes he wrote" the list). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: State Department drafts, "Program of Covert Action for the Dominican Republic," May 12, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 210). See [[cal.1961-05-10.latin-america-dominican-republic]].'
- add:
    entry:
      id: cal.1961-05-13.latin-america-dominican-republic
      when: May 13
      date: '1961-05-13'
      thread: latin-america-dominican-republic
      c: 'A State Department document, "Program of Covert Action for the Dominican Republic," prepared at Goodwin''s request: the CIA''s station has passed "three (3) .38 Cal revolvers and three (3) carbines with accompanying ammunition" to the opposition for "their projected efforts to neutralize TRUJILLO." The first direct evidence that anyone on the White House staff was told arms had been passed. Goodwin circles the passage, "neutralize" underscored.'
      n: '[[w.sen-church-alleged-assassination-plots]], 210–211 (the document, with Goodwin''s testimony of July 18, 1975; Scott sent Bowles a copy May 19). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: State Department document, May 13, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 210). See [[cal.1961-05-12.latin-america-dominican-republic]]. Names: Goodwin, Trujillo.'
      tags:
      - name:goodwin-richard-n
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-15.latin-america-dominican-republic
      when: May 15
      date: '1961-05-15'
      thread: latin-america-dominican-republic
      c: 'Coerr, Acting Assistant Secretary of State for Inter-American Affairs, to Bowles, "Covert Action Programs Authorized With Respect to the Dominican Republic": the standing Special Group approvals for covert aid to the dissidents. No recommendation; the Special Group is to review them and tell the agencies where they stand.'
      n: '[[w.sen-church-alleged-assassination-plots]], 210 (the memorandum). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Coerr to Bowles, May 15, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 210). See [[cal.1961-05-13.latin-america-dominican-republic]]. Names: Bowles, Trujillo.'
      tags:
      - name:bowles-chester
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-15.latin-america
      when: May 15
      date: '1961-05-15'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'Bundy to Goodwin, forwarding a State paper, "The Current Situation in and Contingency Plans for the Dominican Republic": the dissidents are "increasingly determined to oust Trujillo by any means, and their plans in this regard are well advanced." Dearborn is to tell them that if they form "an acceptable provisional government" at their own initiative "any reasonable request for assistance from the U.S. will be promptly and favorably answered."'
      n: '[[w.sen-church-alleged-assassination-plots]], 211 (the memorandum and its attachment). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Bundy to Goodwin, May 15, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 211). See [[cal.1961-05-15.latin-america-dominican-republic]]. Names: Bundy, Goodwin, Trujillo.'
      tags:
      - name:bundy-mcgeorge
      - name:goodwin-richard-n
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-16.latin-america-dominican-republic
      when: May 16
      date: '1961-05-16'
      thread: latin-america-dominican-republic
      c: 'Dearborn to the State Department, to Coerr: an urgent request from the dissidents for the machine guns; the attempt is set for the night of May 16, chances of success 80 percent, the guns would lessen the risk of failure. The dissidents say that if it fails for lack of them the United States will be held responsible and never forgiven. Dearborn told them he was reasonably sure authorization could not be had.'
      n: '[[w.sen-church-alleged-assassination-plots]], 208–209 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to the Department, May 16, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 209). See [[cal.1961-05-15.latin-america]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-16.latin-america
      when: May 16
      date: '1961-05-16'
      thread: latin-america
      also:
      - latin-america-dominican-republic
      c: 'The State Department to Dearborn: keep to the same line until he has instructions clearly cleared in advance by State itself. Approved by Under Secretary Bowles.'
      n: '[[w.sen-church-alleged-assassination-plots]], 209 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, the Department to Dearborn, May 16, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 209). See [[cal.1961-05-16.latin-america-dominican-republic]]. Names: Bowles.'
      tags:
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-05-16.cuba-2
      when: May 16
      date: '1961-05-16'
      thread: cuba
      also:
      - latin-america-dominican-republic
      c: 'Kennedy approves the NSC''s Record of Actions of May 5: the United States is not to initiate the overthrow of Trujillo before it knows what government would succeed him.'
      n: '[[w.sen-church-alleged-assassination-plots]], 209 (the Record of Actions "approved by the President, 5/16/61"; the findings, 215, repeat it). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: NSC Record of Actions, May 5, 1961, approved May 16 (cited by [[w.sen-church-alleged-assassination-plots]], 209). See [[cal.1961-05-05.cuba]]. Names: Kennedy, Trujillo.'
      tags:
      - name:kennedy-john-f
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-17.latin-america-dominican-republic
      when: May 17
      date: '1961-05-17'
      thread: latin-america-dominican-republic
      c: 'The State Department to Dearborn, at Goodwin''s request: keep in mind the President''s view, from the NSC of May 5, that the United States should not initiate the overthrow of Trujillo before knowing what government would succeed him.'
      n: '[[w.sen-church-alleged-assassination-plots]], 212 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, the Department to Dearborn, May 17, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 212). See [[cal.1961-05-16.cuba-2]]. Names: Goodwin, Trujillo.'
      tags:
      - name:goodwin-richard-n
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-18.latin-america-dominican-republic
      when: May 18
      date: '1961-05-18'
      thread: latin-america-dominican-republic
      c: Special Group. Cabell notes that the dissidents press for the small arms in American hands in the Dominican Republic, and asks whether the Group's feeling that they should not be passed stands. "The members showed no inclination to take a contrary position at this time."
      n: '[[w.sen-church-alleged-assassination-plots]], 208 (the minutes; the report notes no meeting took up the matter between May 4 and May 18). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Special Group minutes, May 18, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 208). See [[cal.1961-05-04.latin-america-dominican-republic]]. Names: Cabell.'
      tags:
      - name:cabell-charles-p
- add:
    entry:
      id: cal.1961-05-21.latin-america-dominican-republic
      when: May 21
      date: '1961-05-21'
      thread: latin-america-dominican-republic
      c: 'Dearborn to the State Department: for over a year State''s representatives have nurtured the effort to overthrow Trujillo and helped the dissidents; it is "too late to consider whether United States will initiate overthrow of Trujillo." He asks guidance.'
      n: '[[w.sen-church-alleged-assassination-plots]], 212 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to the Department, May 21, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 212). See [[cal.1961-05-17.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-24.latin-america-dominican-republic
      when: May 24
      date: '1961-05-24'
      thread: latin-america-dominican-republic
      c: 'The State Department drafts a reply to Dearborn, not sent: the United States wants credit among the dissidents and in Latin America, yet to keep clear of intervention and of "any political assassination which might occur"; the first aim "cannot, repeat not, easily override" the second. Goodwin finds it "too negative" and will draft another.'
      n: '[[w.sen-church-alleged-assassination-plots]], 212 (the draft; Achilles to Bowles, May 24). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Draft cable, the Department to Dearborn, May 24, 1961; memorandum, Achilles to Bowles, May 24, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 212). See [[cal.1961-05-21.latin-america-dominican-republic]]. Names: Goodwin, Bowles.'
      tags:
      - name:goodwin-richard-n
      - name:bowles-chester
- add:
    entry:
      id: cal.1961-05-26.latin-america-dominican-republic
      when: May 26
      date: '1961-05-26'
      thread: latin-america-dominican-republic
      c: Bowles to Bundy, by memorandum, "following up on our discussion of the Dominican Republic at yesterday's meeting of the Special Group," with a draft telegram to Dearborn. The minutes of May 25 do not show any such discussion.
      n: '[[w.sen-church-alleged-assassination-plots]], 212 (the memorandum). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Memorandum, Bowles to Bundy, May 26, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 212). See [[cal.1961-05-24.latin-america-dominican-republic]]. Names: Bowles, Bundy. Check: whether the Special Group took up the Dominican Republic on May 25: the minutes do not show it.'
      tags:
      - name:bowles-chester
      - name:bundy-mcgeorge
- add:
    entry:
      id: cal.1961-05-27.latin-america-dominican-republic
      when: May 27
      date: '1961-05-27'
      thread: latin-america-dominican-republic
      c: 'Dearborn to the State Department: the dissident group no longer asks for arms and accepts that it must make do with what it has.'
      n: '[[w.sen-church-alleged-assassination-plots]], 209 (the cable, in a note). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, Dearborn to State, May 27, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 209). See [[cal.1961-05-16.latin-america-dominican-republic]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-30.latin-america-dominican-republic
      when: May 30
      date: '1961-05-30'
      thread: latin-america-dominican-republic
      c: 'The CIA station to headquarters, after the cable of May 29: "HQ aware extent to which U.S. government already associated with assassination. If we are to at least cover up tracks, CIA personnel directly involved in assassination preparation must be withdrawn." Dearborn sends his own reply.'
      n: '[[w.sen-church-alleged-assassination-plots]], 214 (the cable; Dearborn took the May 29 cable as no change of policy, the station officer as a retreat from support). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, station to headquarters, May 30, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 214). See [[cal.1961-05-29.latin-america]]. Names: Trujillo.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-05-31.latin-america-dominican-republic
      when: May 31
      date: '1961-05-31'
      thread: latin-america-dominican-republic
      c: 'Cable to the CIA station: destroy all records of contacts with the dissidents and related matters, except the contingency plans and the cable of May 29 to Dearborn. By the next days all CIA personnel are out of the Dominican Republic; Dearborn is back in Washington.'
      n: '[[w.sen-church-alleged-assassination-plots]], 214 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Cable, headquarters to station, May 31, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 214). See [[cal.1961-05-30.latin-america]]. Names: Trujillo. Check: the sender: the report says "The State Department cabled the CIA station," citing a cable from headquarters.'
      tags:
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1961-06-01.latin-america-dominican-republic
      when: June 1
      date: '1961-06-01'
      thread: latin-america-dominican-republic
      c: 'Robert Kennedy dictates four pages of notes on the Dominican Republic: "The great problem now is that we don''t know what to do because we don''t (sic) what the situation is and this shouldn''t be true, particularly when we have known that this situation was pending for some period of time." The notes show no concern for the propriety of the American part.'
      n: '[[w.sen-church-alleged-assassination-plots]], 215 (the notes quoted; a State memorandum for the files of June 1 records the meetings of the days after the killing, with Kennedy, Johnson, Rusk, McNamara and Robert Kennedy). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Notes dictated by Robert F. Kennedy, June 1, 1961; State Department memorandum for the files, June 1, 1961 (cited by [[w.sen-church-alleged-assassination-plots]], 215). See [[cal.1961-05-30.latin-america]]. Names: Robert Kennedy, Trujillo.'
      tags:
      - name:kennedy-robert-f
      - name:trujillo-rafael
- add:
    entry:
      id: cal.1963-10-05.vietnam-saigon
      when: Oct. 5
      date: '1963-10-05'
      thread: vietnam-saigon
      c: 'The CIA station in Saigon to the Director, on Conein''s talk with Dương Văn Minh: Minh has three courses for a change of government, one the assassination of Nhu and Ngô Đình Cẩn. The station has told Lodge that "we do not set ourselves irrevocably against the assassination plot, since the other two alternatives mean either a blood bath in Saigon or a protracted struggle."'
      n: '[[w.sen-church-alleged-assassination-plots]], 220 (the cable; Lodge and Trueheart, the deputy chief of mission, were told; the other two courses were encirclement of Saigon and a confrontation of military units). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Saigon to Director, Oct. 5, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 220). See [[cal.1963-10-05.vietnam]]. Names: Conein, Dương Văn Minh, Nhu, Ngô Đình Cẩn, Lodge, Trueheart.'
      tags:
      - name:conein-lucien
      - name:duong-van-minh
      - name:ngo-dinh-nhu
      - name:ngo-dinh-can
      - name:lodge-henry-cabot
      - name:trueheart-william-c
- add:
    entry:
      id: cal.1963-10-05.vietnam-6
      when: Oct. 5
      date: '1963-10-05'
      thread: vietnam
      c: 'McCone, Director of Central Intelligence, to Saigon: "we certainly cannot be in the position of stimulating, approving, or supporting assassination, but on the other hand, we are in no way responsible for stopping every such threat of which we might receive even partial knowledge. We certainly would not favor assassination of Diem." Best approach "hands off"; "we naturally interested in intelligence on any such plan."'
      n: '[[w.sen-church-alleged-assassination-plots]], 221 (the cable, which McCone, by his testimony of June 6, 1975, wrote after a private meeting with the President and the Attorney General in which assassination was not discussed). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Saigon, Oct. 5, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 221). See [[cal.1963-10-05.vietnam-saigon]]. Names: McCone, Ngô Đình Diệm. Check: the day of McCone''s meeting with the President and Robert Kennedy, which the report does not give.'
      tags:
      - name:mccone-john-a
      - name:ngo-dinh-diem
- add:
    entry:
      id: cal.1963-10-06.vietnam
      when: Oct. 6
      date: '1963-10-06'
      thread: vietnam
      c: 'McCone to Saigon: "McCone directs that you withdraw recommendation to ambassador (concerning assassination plan) under McCone instructions, as we cannot be in position actively condoning such course of action and thereby engaging our responsibility therefore."'
      n: '[[w.sen-church-alleged-assassination-plots]], 221 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Director to Saigon, Oct. 6, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 221). See [[cal.1963-10-05.vietnam-6]]. Names: McCone.'
      tags:
      - name:mccone-john-a
- add:
    entry:
      id: cal.1963-10-07.vietnam
      when: Oct. 7
      date: '1963-10-07'
      thread: vietnam
      c: 'The CIA station in Saigon to headquarters: "Action taken as directed." Trueheart, also present at the first recommendation, has had the withdrawal conveyed to him; Lodge "commented that he shares McCone''s opinion."'
      n: '[[w.sen-church-alleged-assassination-plots]], 221 (the cable). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: CIA cable, Saigon to CIA, Oct. 7, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 221). See [[cal.1963-10-06.vietnam]]. Names: Trueheart, Lodge, McCone.'
      tags:
      - name:trueheart-william-c
      - name:lodge-henry-cabot
      - name:mccone-john-a
- add:
    entry:
      id: cal.1963-10.vietnam
      when: Oct., about the 20th
      date: 1963-10
      thread: vietnam
      c: 'Lodge tells Conein of McCone''s answer on assassination, by Conein''s testimony of June 20, 1975. Conein then tells Đôn the United States opposes assassination; Đôn: "Alright, you don''t like it, we won''t talk about it anymore."'
      n: '[[w.sen-church-alleged-assassination-plots]], 221 (Conein''s testimony, not in his After-Action Report; "around October 20"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-10-07.vietnam]]. Names: Lodge, Conein, McCone, Trần Văn Đôn. Check: the day.'
      tags:
      - name:lodge-henry-cabot
      - name:conein-lucien
      - name:mccone-john-a
      - name:tran-van-don
- add:
    entry:
      id: cal.1963-10-24.vietnam-2
      when: Oct. 24
      date: '1963-10-24'
      thread: vietnam
      c: Conein receives money and keeps it in a safe in his house.
      n: '[[w.sen-church-alleged-assassination-plots]], 222 (a note to the report''s account of the money he brings the generals Nov. 1; Lodge cabled State Oct. 29 and 30 that a request for funds should be anticipated). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-10-23.vietnam-saigon]]. Names: Conein, Lodge.'
      tags:
      - name:conein-lucien
      - name:lodge-henry-cabot
- add:
    entry:
      id: cal.1963-11-01.vietnam-saigon-4
      when: Nov. 1
      date: '1963-11-01'
      thread: vietnam-saigon
      c: Saigon. The coup under way, an aide to Đôn tells Conein to bring all the money he can to the Joint General Staff headquarters. He brings 3 million piasters, about $42,000, which Đôn takes to buy food for his troops and pay death benefits to those killed in the coup.
      n: '[[w.sen-church-alleged-assassination-plots]], 222 (Conein''s testimony of June 20, 1975; the report''s note puts the money in his hands from Oct. 24; the findings, 256, call it money given "after the coup had begun"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-11-01.vietnam]]. Names: Conein, Trần Văn Đôn.'
      tags:
      - name:conein-lucien
      - name:tran-van-don
- add:
    entry:
      id: cal.1963-11-02.vietnam-saigon
      when: Nov. 2
      date: '1963-11-02'
      thread: vietnam-saigon
      c: Saigon. 6:20 a.m. Diệm telephones Đôn at the Joint General Staff headquarters and offers to surrender if he and Nhu are given safe conduct to an airport; soon after he offers to surrender unconditionally and orders the Presidential Guard to stop firing. An escort waits at the palace at 8:00; he and Nhu are not there.
      n: '[[w.sen-church-alleged-assassination-plots]], 223 (Conein''s After-Action Report of Nov. 1, as the report gives it). Made public: the Church Committee''s interim report, Nov. 20, 1975. To check: Conein After-Action Report, Nov. 1, 1963 (cited by [[w.sen-church-alleged-assassination-plots]], 223). See [[cal.1963-11-01.vietnam]]. Names: Diệm, Trần Văn Đôn, Nhu, Conein.'
      tags:
      - name:ngo-dinh-diem
      - name:tran-van-don
      - name:ngo-dinh-nhu
      - name:conein-lucien
- add:
    entry:
      id: cal.1963-11-02.vietnam-5
      when: Nov. 2
      date: '1963-11-02'
      thread: vietnam
      c: Saigon. About 10:30 a.m. Conein, back at the Joint General Staff headquarters on the President's order to locate Diệm, asks Minh where he is. Minh says they are behind the headquarters and that they "had died by their own hand"; he offers to show Conein the bodies, who declines.
      n: '[[w.sen-church-alleged-assassination-plots]], 223 (Conein''s testimony of June 20, 1975, which doubts Catholics would take their own lives in a church; the report: "The details of Diem''s and Nhu''s deaths are not known"). Made public: the Church Committee''s interim report, Nov. 20, 1975. See [[cal.1963-11-02.vietnam-saigon]]. Names: Conein, Dương Văn Minh, Diệm, Nhu. Check: the hour: "about 10:30 a.m." by Conein.'
      tags:
      - name:conein-lucien
      - name:duong-van-minh
      - name:ngo-dinh-diem
      - name:ngo-dinh-nhu
- cite:
    id: cal.1960-08-18.congo-lumumba
    item: '[[w.sen-church-alleged-assassination-plots]], 14–15 (the station''s cable of Aug. 18: "Congo experiencing classic Communist effort takeover government," "little time left in which take action to avoid another Cuba"; the station''s objective, "replacing Lumumba with pro Western Group"; Tweedy''s reply, "your and our belief Lumumba must be removed if possible"; not the telegram number, Guinea, the plan to organize an opposition, or the ambassador)'
    units: '?'
- variant:
    id: cal.1960-08-18.congo-lumumba
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: '"there may be little time left in which take action to avoid another Cuba" (no "or Guinea")'
    at: '14'
- cite:
    id: cal.1960-08-19.congo-lumumba
    item: '[[w.sen-church-alleged-assassination-plots]], 15 (the words, "You are authorized proceed with operation"; signed by Bissell, the DDP; not the telegram number or the ambassador)'
    units: B
- cite:
    id: cal.1960-08-25.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 15–16, 60 (the Special Group minutes of Aug. 25 quoted: Gray, the President "had expressed extremely strong feelings on the necessity for very straightforward action"; planning "would not necessarily rule out ''consideration'' of any particular kind of activity which might contribute to getting rid of Lumumba"; Dulles''s cable of Aug. 26, "his removal must be an urgent and prime objective," with the $100,000; Bissell, "almost certain" he was told of the cable shortly after it went; not Helms or Bissell''s vacation)'
    units: A, B, C
- cite:
    id: cal.1960-08-18.congo-2
    item: '[[w.sen-church-alleged-assassination-plots]], 55, 58 (the NSC minutes quoted: Dillon, Lumumba "was working to serve the purposes of the Soviets," Dulles, "Lumumba was in Soviet pay"; the President, "the possibility that the U.N. would be forced out was simply inconceivable," to keep the UN in the Congo "even if we had to ask for European troops to do it"; the memorandum "clearly does not contain an order"; Johnson, 55–57, testified in 1975 that at an NSC meeting that summer the President said something that "came across to me as an order for the assassination of Lumumba," and could not tell Aug. 18 from Sept. 7, the report judging Aug. 18 "most likely")'
    units: A, B, C, D, F
- cite:
    id: cal.1960-09-19.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 23 (the cable of Sept. 19, signed by Bissell and Tweedy, to the "Station Officer" (Devlin), not called chief of station: "Joe" to arrive "approx 27 Sept," "Joe from Paris"; not Eisenhower and Lord Home)'
    units: '?'
- cite:
    id: cal.1960-09-24.congo-lumumba
    item: '[[w.sen-church-alleged-assassination-plots]], 24 (Dulles''s personal cable of Sept. 24: "We wish give every possible support in eliminating Lumumba from any possibility resuming governmental position or if he fails in Leopoldville, setting himself in Stanleyville or elsewhere"; the entry''s quotation reads differently)'
    units: '?'
- cite:
    id: cal.1960-09-26.congo-lumumba
    item: '[[w.sen-church-alleged-assassination-plots]], 24, 33 (Scheider, "Joseph Scheider," the report''s name for Gottlieb, with lethal biological materials, rubber gloves, mask and syringe; contact with Devlin Sept. 26; Lumumba "virtually a prisoner in U.N. custody, and inaccessible," 33; not Mobutu''s troops)'
    units: '?'
- cite:
    id: cal.1960-10-05.congo-lumumba
    item: '[[w.sen-church-alleged-assassination-plots]], 29 (Scheider, the report''s name for Gottlieb, left the Congo Oct. 5 in view of the "expiration date his material"; the station''s cable of Oct. 7: "[Joe] left certain items of continuing usefulness. [Station officer] plans continue try implement op"; not Lumumba''s being "reached")'
    units: '?'
- cite:
    id: cal.1960-10-17.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 32 (Devlin''s cable of Oct. 17, answering Tweedy''s of Oct. 15: "If case officer sent, recommend HQS pouch soonest high powered foreign make rifle with telescopic scope and silencer," "hunting rifles now forbidden," would "keep rifle in office pending opening of hunting season"; the request depends on a case officer''s being sent; not the poison)'
    units: '?'
- check:
    id: cal.1960-10-17.congo
    text: 'Check: when the poison was thrown into the river: Scheider testified he destroyed it and put it in the Congo River before leaving, Oct. 5; Devlin, that it was not disposed of until after Lumumba was imprisoned in early December ([[w.sen-church-alleged-assassination-plots]], 29–30 & n.).'
- variant:
    id: cal.1960-11.congo-lumumba
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: QJ/WIN, a foreign agent with a criminal record, reached Léopoldville Nov. 21, six days before Lumumba's flight; his plan, Nov. 29, was to escort Lumumba out of his residence; headquarters on Nov. 30 "prepared consider direct action"; "no clear evidence" that he was in an assassination plan
    at: 44–45
- cite:
    id: cal.1960-09-07.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 62 (the NSC of Sept. 7: Dulles on the Soviet aid to Lumumba, "Lumumba always seemed to come out on top in each of these struggles"; two pages of minutes, no statement by the President recorded; not the station and Mobutu)'
    units: B
- cite:
    id: cal.1960-11-27.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 33, 48 (Lumumba''s "departure for Stanleyville on November 27" from UN custody; not the night; the station, by Devlin, "quite certain" it had no part in his leaving)'
    units: '?'
- cite:
    id: cal.1960-12-01.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 14, 48 (captured by Mobutu''s troops "early in December" on the way to Stanleyville and held at Thysville; not Dec. 1, the Sankuru, or the flight back)'
    units: '?'
- cite:
    id: cal.1961-01-17.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 50 (Lumumba, Mpolo and Okito put aboard a plane Jan. 17, bound for Bakwanga, redirected to Elisabethville; the UN commission: Lumumba killed Jan. 17, "almost immediately after his arrival in Katanga"; not the beating on the way)'
    units: '?'
- cite:
    id: cal.1961-02-13.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 50 (Feb. 13, Katanga''s government "reported that Lumumba and his two companions escaped the previous day and died at the hands of hostile villagers"; the UN commission "not convinced")'
    units: A
- cite:
    id: cal.1960-07-27.congo
    item: '[[w.sen-church-alleged-assassination-plots]], 14, 53 (Lumumba in Washington in late July; Herter pledged economic aid; Dillon with Herter at the State Department meeting; not Blair House, the days, aid through the UN or Eisenhower)'
    units: '?'
- cite:
    id: cal.1961-01-12.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 196 (the Special Group, Merchant, Gray, Irwin and Dulles, approved "limited supplies of small arms and other material" for dissidents inside the Dominican Republic, the passage to be managed by the CIA and the dissidents themselves; not Eisenhower''s own approval or a shipment)'
    units: '?'
- variant:
    id: cal.1961-01-12.latin-america
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: the Special Group (Merchant, Gray, Irwin, Dulles) approves "limited supplies of small arms and other material" for dissidents in the Dominican Republic, the final transport by the dissidents themselves; no evidence any member but Dulles knew they meant to assassinate Trujillo; the report does not have Eisenhower approve it
    at: '196'
- cite:
    id: cal.1961-02-15.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 203 (Rusk''s memorandum to Kennedy of "February 15, 1961," the passage quoted as "[and] * * * the CIA has recently been authorized to arrange for delivery to them outside the Dominican Republic of small arms and sabotage equipment"; the note prints the memorandum''s date as 5/15/61; Rusk testified he was not told of the dissidents'' intent)'
    units: '?'
- cite:
    id: cal.1961-02-17.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 203–204 (Bissell''s briefing paper to Bundy, requested "for higher authority": dissident leaders'' "plan of action * * * implemented if they were provided with arms for 300 men, explosives, and remote control detonation devices"; a clash that "will end either with the liquidation of Trujillo and his cohorts or with a complete roll up of the internal opposition")'
    units: '?'
- variant:
    id: cal.1961-02-17.latin-america
    unit: B
    witness: w.sen-church-alleged-assassination-plots
    reads: the sentence is Bissell's, in his memorandum to Bundy of Feb. 17, not Rusk's
    at: '204'
- cite:
    id: cal.1961-05-05.cuba
    item: '[[w.sen-church-alleged-assassination-plots]], 209 (the Record of Actions: the Task Force on Cuba to prepare plans for crises in Haiti or the Dominican Republic; "Noted the President''s view that the United States should not initiate the overthrow of Trujillo before we knew what government would succeed him, and that any action against Trujillo should be multilateral"; approved by the President May 16)'
    units: '?'
- variant:
    id: cal.1961-05-05.cuba
    unit: J
    witness: w.sen-church-alleged-assassination-plots
    reads: '"the United States should not initiate the overthrow of Trujillo before we knew what government would succeed him, and that any action against Trujillo should be multilateral"'
    at: '209'
- cite:
    id: cal.1961-05.latin-america-3
    item: '[[w.sen-church-alleged-assassination-plots]], 207 (reports of an imminent assassination; Robert Kennedy talks with Dulles "apparently sometime in the early part of May," calls the President, "decided at that time that we''d put a task force on the problem"; the President "had known nothing about it," Kennedy''s notes of June 1; not the Pentagon or Goodwin)'
    units: '?'
- cite:
    id: cal.1961-05.latin-america-4
    item: '[[w.sen-church-alleged-assassination-plots]], 211 (the document of May 13, "neutralize" underscored, Goodwin circling the passage on the weapons passed, new to him; not Goodwin''s taking it to the President, Kennedy''s words or the instruction to Dearborn)'
    units: '?'
- cite:
    id: cal.1961-05-29.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 213 (the cable of May 29, revised by Goodwin: "we must not run risk of U.S. association with political assassination, since U.S. as matter of general policy cannot condone assassination. This last principal is overriding and must prevail in doubtful situation," the italicized words inserted at the President''s direction by Goodwin''s testimony; the four machine guns not to be transferred)'
    units: A, B
- check:
    id: cal.1961-05-30.latin-america
    text: 'Check: the report finds "no direct evidence that the weapons which were passed were used in the assassination," though one or more carbines were probably with the assassins; the killing was done "by handguns and shotguns," "near San Cristobal," late in the evening of May 30 ([[w.sen-church-alleged-assassination-plots]], 191, 213).'
- cite:
    id: cal.1961-05-30.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 213 (Trujillo "ambushed and assassinated near San Cristobal" late in the evening of May 30; the assassination "conducted by members of the action group, to whom the American carbines had been passed"; not the place outside Ciudad Trujillo or the CIA''s supply of the weapons used)'
    units: '?'
- cite:
    id: cal.1961-05-31.latin-america
    item: '[[w.sen-church-alleged-assassination-plots]], 214 (Salinger "made the first public announcement of the assassination," several hours ahead of the news in the Dominican Republic; Rusk, by his testimony, "most concerned," his son Ramfis being in Paris; not Rusk''s telephone call)'
    units: B
- cite:
    id: cal.1963-08-24.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 218–219 (Deptel 243, "prepared by Roger Hilsman" and Harriman and approved by Kennedy: Diệm to be rid of the Nhus, "if he remains obdurate" the United States "prepared to accept the obvious implication that we can no longer support Diem"; the generals told the United States will give "direct support in any interim period of breakdown central government mechanism"; not Forrestal, Ball, Hyannis Port, or the words of the sentence on preserving Diệm)'
    units: E, G
- cite:
    id: cal.1963-10-05.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 220 (Conein contacted Minh "On October 3," not Oct. 5; Minh explained a coup was planned, asked assurances of American support if it succeeded, outlined three courses, one the assassination of Nhu and Cẩn; the station''s cable of Oct. 5; not Minh''s headquarters, Lodge''s clearance or "the first")'
    units: '?'
- check:
    id: cal.1963-10-05.vietnam
    text: 'Check: the report dates Conein''s contact with Minh "On October 3," the station''s cable Oct. 5 ([[w.sen-church-alleged-assassination-plots]], 220).'
- cite:
    id: cal.1963-10-28.vietnam-saigon
    item: '[[w.sen-church-alleged-assassination-plots]], 222 (Oct. 28, Conein with Đôn, who "had received assurance from Lodge that Conein spoke for the United States," said he would give Lodge the coup plans "four hours before it took place" and suggested Lodge not change his plans to go to the United States Oct. 31; not the night, Đôn''s initiative, the 48 hours, Oct. 30, the units or Đình)'
    units: B, D
- cite:
    id: cal.1963-10-30.vietnam-2
    item: '[[w.sen-church-alleged-assassination-plots]], 222 (a cable from Bundy to Lodge of Oct. 30 "expressed White House concern": "[w]e cannot accept conclusion that we have no power to delay or discourage a coup"; a second the same day told Lodge to intercede with the generals if he did not think the coup would succeed, "strict non-involvement and somewhat less strict neutrality"; not the hour)'
    units: '?'
- variant:
    id: cal.1963-10-30.vietnam-2
    unit: A
    witness: w.sen-church-alleged-assassination-plots
    reads: '"[w]e cannot accept conclusion that we have no power to delay or discourage a coup"'
    at: '222'
- check:
    id: cal.1963-10-30.vietnam-2
    text: 'Check: the findings give the sender as "William Bundy" and say the coup took place "three days later" ([[w.sen-church-alleged-assassination-plots]], 257); the chapter has "Bundy," at 222.'
- cite:
    id: cal.1963-10-30.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 222 (Lodge "reported to Washington that he was powerless to stop the coup, and that the matter was entirely in Vietnamese hands"; the report''s words, not Lodge''s; not the hour, Diệm or "traitors")'
    units: '?'
- cite:
    id: cal.1963-11-01.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 222 (the coup begun late in the morning of Nov. 1; Conein at the Joint General Staff headquarters "during most of the coup"; the generals announce the coup on the radio at 4:30 p.m.; Diệm "called Lodge and inquired about the United States'' position," Lodge having "no view yet" and "concern for Diem''s safety"; not the city taken, the call''s hour or the church and armored car)'
    units: '?'
- check:
    id: cal.1963-11-01.vietnam
    text: 'Check: the report: "The details of Diem''s and Nhu''s deaths are not known": Conein supposed they left by a tunnel for a Catholic church in Cholon; a CIA source, that they left the palace the evening before, were at the church by 8:00 a.m. and were "forced into an army vehicle"; a field officer of unknown reliability, photographs of Nov. 16 with their hands tied behind them and an account of shooting and stabbing on the way to the headquarters ([[w.sen-church-alleged-assassination-plots]], 223 n.).'
- cite:
    id: cal.1963-09-12.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 220 (Church, "with White House approval," introduced a resolution condemning the South Vietnamese government''s handling of the Buddhists and ending aid unless the repression eased; not S. Res. 196, the cosponsors, State''s draft or Church''s words)'
    units: '?'
- cite:
    id: cal.1963-08-31.vietnam
    item: '[[w.sen-church-alleged-assassination-plots]], 220 (the CIA cable from Saigon, Aug. 31: "This particular coup is finished. Generals did not feel ready and did not have sufficient balance of forces. There is little doubt that GVN [South Vietnamese Government] aware US role and may have considerable detail"; not Lodge''s words)'
    units: B
- cite:
    id: cal.1963-08-26.vietnam-saigon
    item: '[[w.sen-church-alleged-assassination-plots]], 219 (the Director to Saigon, Aug. 26: Conein and another CIA officer told to see Generals Khiem and Khanh, "to convey to them the substance of Deptel 243, but to remind them that ''We cannot be of any help during initial action of assuming power of state. Entirely their own action, win or lose''"; the same day Lodge presented his credentials; not the hour, Harkins, Trueheart, Mecklin or Pleiku)'
    units: '?'
