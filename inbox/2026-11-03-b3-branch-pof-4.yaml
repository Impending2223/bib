      date: 1964-10
      thread: elections-1964
      also:
      - press-and-broadcasting
      c: 'Busby to Johnson, undated, after New Orleans: the traveling press, "tired and negative" on "your interest in the
        polls"; "the New Orleans (Negro, Negro, Negro) speech captured them." They now call him "the master," "the champ."'
      n: '[[w.branch-pillar-of-fire]], 515. Check: the day. To check: "BUZZ" (Horace Busby) to LBJ, nd, b10, Moyers Papers,
        LBJ (cited by [[w.branch-pillar-of-fire]], 515). See [[cal.1964-10-06.elections-1964]]. Names: Busby, Johnson.'
      src:
        c: ddef47de
        rows:
        - 'w.branch-pillar-of-fire 515: all'
        - 'via w.branch-pillar-of-fire 515 n.tired-and-negative: all'
      tags:
