      c: 'O''Brien to Johnson, "Florida Organizational Meeting": at St. Augustine the white Democratic organization dissolved;
        "it has proved impossible to get a campaign chairman so far."'
      n: '[[w.branch-pillar-of-fire]], 516. To check: O''Brien to LBJ, "Florida Organizational Meeting," Oct. 20, 1964, Box
        3, Henry Wilson Papers, LBJ (cited by [[w.branch-pillar-of-fire]], 516). See [[cal.1964-10-06.elections-1964-2]].
        Names: O''Brien, Johnson.'
