      - name:johnson-lyndon-b
      - name:goldwater-barry-m
- add:
    entry:
      id: cal.1964-10-11.elections-1964
      when: Oct. 11
      date: '1964-10-11'
      thread: elections-1964
      c: 'O''Brien to Johnson: "a special effort to get out the vote in Negro precincts"; little working relation among Democratic
        politicians across racial lines; in the South, "Dependence upon the Negro vote is a new experience."'
      n: '[[w.branch-pillar-of-fire]], 515-16. To check: O''Brien to LBJ, Oct. 11, 1964, Box 3, Henry Wilson Papers, LBJ (cited
        by [[w.branch-pillar-of-fire]], 515). See [[cal.1964-10-06.elections-1964-2]]. Names: O''Brien, Johnson.'
      src:
        c: 7e61aa14
        rows:
