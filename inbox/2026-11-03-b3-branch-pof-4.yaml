      when: Oct. 6
      date: '1964-10-06'
      thread: elections-1964
      c: 'O''Brien''s first of four confidential reports to Johnson on the campaign, Oct. 6, 11, 20 and 23: a landslide "without
        too much difficulty"; only Alabama and Mississippi conceded to Goldwater.'
      n: '[[w.branch-pillar-of-fire]], 515. Check: which of the four reports gives the prediction. To check: Larry O''Brien
        to LBJ, Oct. 6, 11, 20, and 23, 1964, Box 3, Henry Wilson Papers, LBJ (cited by [[w.branch-pillar-of-fire]], 515).
        Names: O''Brien, Johnson, Goldwater.'
      src:
        c: 5b014720
        rows:
        - 'w.branch-pillar-of-fire 515: all'
        - 'via w.branch-pillar-of-fire 515 n.confidential-october-reports: all'
      tags:
