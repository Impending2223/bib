      date: '1964-10-17'
      thread: king
      also:
      - elections-1964
      c: 'Rustin to Fauntroy by telephone, on the FBI''s tap: King, pressed to tour for Johnson, wants Wilkins and Whitney
        Young to share the load; to campaign alone would "look like Johnson has me in his pocket."'
      n: '[[w.branch-pillar-of-fire]], 516. Made public: the FBI''s file on King (FK), released after 1976 (Check: the release).
        To check: Bayard Rustin-Walter Fauntroy conversation of Oct. 17, 1964, cited in NY LHM dated Oct. 20, 1964, FK-NR
        (cited by [[w.branch-pillar-of-fire]], 516). Names: Rustin, King, Wilkins, Whitney Young, Johnson.'
