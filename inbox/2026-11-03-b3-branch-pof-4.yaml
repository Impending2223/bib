        527); NYT, Nov. 20, 1964, p. 1 (cited by [[w.branch-pillar-of-fire]], 527); [[w.garrow-bearing-the-cross]], 360 (cited
        by [[w.branch-pillar-of-fire]], 527). See [[cal.1964-11-18.civil-rights-the-executive]]. Names: King, Hoover, Rustin.'
