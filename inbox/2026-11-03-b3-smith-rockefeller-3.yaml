      when: Oct. 28
      date: '1966-10-28'
      thread: governors
      also:
      - elections-1966
      c: 'New York. Rockefeller to reporters: O''Connor, against compulsory treatment of addicts, would give them license
        "to mug, to purse-snatch, to steal, and even to murder."'
      n: '[[w.smith-on-his-own-terms]], 493 (and his closing spots: "If you want to keep crime rates high, O''Connor is your
