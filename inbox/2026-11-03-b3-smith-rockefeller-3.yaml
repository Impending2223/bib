patch: b3-smith-rockefeller-3
by: 'agent (batch 3 resumed, gop: Smith, On His Own Terms, third run)'
ops:
- cite:
    id: cal.1963-05-04.elections-1964
    item: '[[w.smith-on-his-own-terms]], 407, 417 (Saturday, May 4, at Laurance Rockefeller''s house on the estate; her divorce
      in Idaho, April 1963; his, 1962)'
    units: A
- cite:
    id: cal.1963-11-07.elections-1964
    item: '[[w.smith-on-his-own-terms]], 414 (Nov. 7, on NBC''s *Today* show)'
    units: A
- check:
    id: cal.1963-11-07.elections-1964
    text: 'Check: Smith, 414, also puts the declaration on NBC''s *Today* show, Nov. 7, not at Albany.'
- cite:
    id: cal.1964-07-13.elections-1964
    item: '[[w.smith-on-his-own-terms]], 451 (the convention at the Cow Palace; the platform''s scant mention of Eisenhower,
      its criticism of the hot line)'
    units: A
- cite:
    id: cal.1966-09-07.governors-ny
    item: '[[w.smith-on-his-own-terms]], 487–89 (Rockefeller renominated at Rochester; O''Connor, the City Council''s president,
      the Democrats'' convention "stacked against" Roosevelt; Adams, a Rochester academic, the Conservatives'' nominee; Roosevelt
      the Liberals'')'
    units: B, D-F
- cite:
    id: cal.1966-11-08.elections-1966
    item: '[[w.smith-on-his-own-terms]], 493 (Rockefeller over O''Connor; Winthrop Rockefeller, Arkansas''s first Republican
      governor since Reconstruction)'
    units: I, L
- cite:
    id: cal.1967-04-21.jobs-and-wages-ny
    item: '[[w.smith-on-his-own-terms]], 502 (Condon–Wadlin of 1947; the panel under George Taylor after the transit strike
      of 1966; the ban on strikes kept, heavy fines on the unions; collective bargaining; the Public Employment Relations
      Board)'
    units: B-D
- cite:
    id: cal.1968-02-02.jobs-and-wages-nyc
    item: '[[w.smith-on-his-own-terms]], 506 (Friday, Feb. 2; DeLury egged at a rally outside City Hall; the city''s offer,
      $400, hooted down; the strike illegal under the Taylor Law; seventy thousand tons of garbage uncollected)'
    units: B-C
- cite:
    id: cal.1968-03-21.elections-1968
    item: '[[w.smith-on-his-own-terms]], 517 (the ballroom of the New York Hilton; "I have decided today to reiterate unequivocally
      that I am not a candidate campaigning directly or indirectly for the presidency of the United States"; hours before
      Oregon''s filing deadline; Agnew watching with reporters in his office at Annapolis, not called beforehand; McCall "shocked
      and dismayed")'
    units: B-C, E
- cite:
    id: cal.1968-04-09.cities-and-housing-ny
    item: '[[w.smith-on-his-own-terms]], 523–26 (Logue''s terms, among them the override of local zoning and codes; Tuesday,
      Apr. 9, the day of King''s funeral; the Senate passes it; the Assembly sends it back to committee by a narrow margin;
      Rockefeller, flying back from Atlanta, orders a second vote; a few minutes before midnight the Assembly passes it, 86
      to 45)'
    units: B, D
- cite:
    id: cal.1968-09-10.governors-ny
    item: '[[w.smith-on-his-own-terms]], 541 (Lindsay sounded first, through O''Donnell; Goodell, forty-two, of Jamestown,
      named Sept. 9)'
    units: B
- check:
    id: cal.1968-09-10.governors-ny
    text: 'Check: Smith, 541, has Rockefeller name Goodell Sept. 9.'
- cite:
    id: cal.1963-11-13.democratic-party
    item: '[[w.smith-on-his-own-terms]], 414–15 (three and a half hours, for a campaign against Goldwater; of Rockefeller:
      his nomination "would be too good to be true ... but he doesn''t have a chance")'
    units: A
- to-check:
    id: cal.1963-11-13.democratic-party
    add:
    - Sorensen, *Kennedy* (2009 ed.), 754 (cited by [[w.smith-on-his-own-terms]], 415)
- cite:
    id: cal.1963-11-22.goldwater
    item: '[[w.smith-on-his-own-terms]], 418 (Goldwater at Muncie for his mother-in-law''s funeral; his note to Mrs. Kennedy;
      he and Kennedy had imagined a campaign of debates in 1964, sharing a plane)'
    units: A-B
- cite:
    id: cal.1963-11-22.elections-1964-2
    item: '[[w.smith-on-his-own-terms]], 417–18 (the lunch at Rockefeller''s clubhouse, 13 West Fifty-fourth Street; a maid
      brings the news; Dewey slips out; Rockefeller''s statement; all political activity suspended for thirty days; home to
      Pocantico)'
- cite:
    id: cal.1963-09-07.republican-party
    item: '[[w.smith-on-his-own-terms]], 413 (the visit to Illinois; the local Republican leaders kept away by "scheduling
      conflicts")'
- cite:
    id: cal.1964-05-30.elections-1964-2
    item: '[[w.smith-on-his-own-terms]], 446 (the Lying-In Hospital, East Seventieth Street, 4:15 p.m., Saturday, May 30;
      by a staff member''s account, labor induced by a decision at the campaign''s "highest level"; Goldwater''s advertisements
      that weekend, four and a half pages in the Sunday *Los Angeles Times*)'
- cite:
    id: cal.1964-06-02.elections-1964
    item: '[[w.smith-on-his-own-terms]], 447 (Goldwater 1,089,133, 51.3 percent; Rockefeller 1,030,180, 48.7 percent; the
      networks call it before the polls close in the north; Rockefeller: "I listened to the wrong people")'
    units: B
- cite:
    id: cal.1964-07-14.elections-1964
    item: '[[w.smith-on-his-own-terms]], 451 (his televised appeal for moderation shouted down)'
    units: E
