      when: Sept. 3–5
      date: '1966-09-03'
      thread: governors
      also:
      - elections-1966
      c: 'New York, the Labor Day weekend. Rockefeller on the beaches of Queens and Brooklyn and in the Bronx. His 1962 pledge
        to hold the line on taxes "the big blooper I made in politics." On the stump: 61 percent of the State''s budget goes
        back to the localities.'
      n: '[[w.smith-on-his-own-terms]], 489. To check: *New York Post*, Sept. 6, 1966; *New York Times*, Sept. 6, 1966 (cited
        by [[w.smith-on-his-own-terms]], 489). See [[cal.1962-11-06.governors-ny]]. Names: Rockefeller.'
      tags:
      - name:rockefeller-nelson
      - state:ny
      - city:nyc
      src:
        c: c5610637
        rows:
        - 'w.smith-on-his-own-terms 489: all'
        - 'via x.1966-09-06.new-york-post-sept-6-1966: C'
        - 'via x.1966-09-06.new-york-times-sept-6-1966: B'
