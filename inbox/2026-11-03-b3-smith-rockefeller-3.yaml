      when: Sept.
      date: 1963-09
      thread: elections-1964
      c: Roanoke. Rockefeller faults the Kennedy administration for appointing federal judges unsympathetic to the Negro cause.
        In Illinois and Virginia the local Republican leaders find conflicts in their schedules.
