- cite:
    id: cal.1968-03-19.republican-party-congress
    item: '[[w.smith-on-his-own-terms]], 516 (the breakfast, Morton presiding, sixteen Senators; most want him in only to
      add to Nixon''s primary victories)'
    units: A-C
- check:
    id: cal.1968-03-19.republican-party-congress
    text: 'Check: Smith, 516, has Rockefeller at Fifty-fifth Street with Hughes and Braun at 11:30 that morning and the decision
      made by one o''clock: "It''s a no-go."'
