- add:
    entry:
      id: cal.1963-09.elections-1964-3
      when: Sept.
      date: 1963-09
      thread: elections-1964
      c: 'Rockefeller in Europe from the third week of September, two weeks, six nations; Kissinger with him. De Gaulle at
        the Élysée, in French; Adenauer at Bonn; the Wall in Berlin; Paul VI, without his wife. Macmillan at Chequers turns
        the talk from his policies; to Heath, after: "he ought to have known that I am Jack Kennedy''s man."'
      n: '[[w.smith-on-his-own-terms]], 413–14. To check: [[w.heath-course-of-my-life]], 244 (cited by [[w.smith-on-his-own-terms]],
        414; Chequers). Check: the days. See [[cal.1963-07-14.elections-1964]]. Names: Rockefeller, Kissinger, de Gaulle,
        Adenauer, Paul VI, Macmillan, Heath.'
      tags:
      - name:rockefeller-nelson
      - name:kissinger-henry-a
      - name:de-gaulle-charles
      - name:adenauer-konrad
      - name:paul-vi
      - name:macmillan-harold
      - name:heath-edward-r-g
      src:
        c: ec0aa30b
        rows:
        - 'w.smith-on-his-own-terms 413–14: all'
- add:
    entry:
      id: cal.1964-09-25.elections-1964-2
      when: Sept. 25
      date: '1964-09-25'
      thread: elections-1964
      c: Albany, N.Y., the steps of the Capitol. Goldwater and Rockefeller at a rally together; no lunch at the Executive
        Mansion.
      n: '[[w.smith-on-his-own-terms]], 453 (and Rockefeller''s course after the convention: for the whole ticket, but not
        saying how he will vote for President; no fusion with the Conservatives; Scelsi to run the campaign in the State).
        See [[cal.1964-07-16.elections-1964]]. Names: Goldwater, Rockefeller.'
      tags:
      - name:goldwater-barry-m
      - name:rockefeller-nelson
      - state:ny
      src:
        c: 038ae807
        rows:
        - 'w.smith-on-his-own-terms 453: all'
