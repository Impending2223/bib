    item: '[[w.smith-on-his-own-terms]], 452 ("several dozen" of his delegation follow him)'
    units: B-C
- cite:
    id: cal.1964-07-17.elections-1964-2
    item: '[[w.smith-on-his-own-terms]], 452 (Rockefeller missed the speech; "dangerous, irresponsible, and frightening")'
    units: A
