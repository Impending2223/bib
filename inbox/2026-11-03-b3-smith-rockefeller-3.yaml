- cite:
    id: cal.1966-11-08.governors-ny
    item: '[[w.smith-on-his-own-terms]], 493–94 (election night at the New York Hilton; Adams third, ahead of Roosevelt, for
      Row C; the Jewish vote; Manhattan, Staten Island and Queens carried; O''Connor''s margin in the city under seventy thousand;
      his telegram of concession by midnight)'
- cite:
    id: cal.1966-11-08.states-and-cities-nyc
    item: '[[w.smith-on-his-own-terms]], 492–93 (the Conservative Party and the Patrolmen''s Benevolent Association force
      the referendum; the board defeated; Rockefeller stays out of it, O''Connor for the board)'
- cite:
    id: cal.1968-03-18.republican-party
    item: '[[w.smith-on-his-own-terms]], 516 (to Washington the day after the Sunday meeting, to sound Republicans in Congress;
      Morton leaves the Foxhall Road dinner sure he will be national campaign chairman; Hughes''s two statements, one to run,
      one not)'
    units: A-C
- to-check:
    id: cal.1968-03-18.republican-party
    add:
    - '*Newsweek*, Apr. 1, 1968 (cited by [[w.smith-on-his-own-terms]], 516)'
