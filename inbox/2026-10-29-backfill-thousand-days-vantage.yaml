- add:
    entry:
      id: cal.1964-05-14.elections-1964
      when: May 14
      date: '1964-05-14'
      thread: elections-1964
      c: 'Lady Bird Johnson''s memorandum to Johnson on running, written by hand on a stenographer''s notebook at his asking. If he gets out: their motives questioned; "You let us down"; she dreads seeing him "semi-idle, frustrated." If not: criticism, bad decisions, perhaps an earlier death. "My Conclusions: Stay in."'
      n: '[[w.johnson-vantage-point]], 93–94 (the memorandum, printed). Made public: [[w.johnson-vantage-point]], 93–94 (1971). Names: Lady Bird Johnson, Johnson.'
      tags:
      - name:johnson-lady-bird
      - name:johnson-lyndon-b
      src:
        c: bcaf5ec6
        rows:
        - 'w.johnson-vantage-point 93–94: all'
- add:
    entry:
      id: cal.1965-02-03.vietnam
      when: Feb. 3
      date: '1965-02-03'
      thread: vietnam
      c: 'McCone with Johnson, a long private talk: a serious and immediate political crisis likely in Saigon, Khánh''s arrangement with the Buddhists come apart, most of the generals against him; Kosygin''s mission to Hanoi, the chief of the Soviet air force in it, to bring military aid. McCone for bombing selected targets in the North, from the south working north, at least a raid a day.'
      n: 'McCone, memorandum for the record, Feb. 3: [FRUS 1964–68, II, doc. 61](https://history.state.gov/historicaldocuments/frus1964-68v02/d61); McCone to McGeorge Bundy at Saigon: [FRUS 1964–68, II, doc. 62](https://history.state.gov/historicaldocuments/frus1964-68v02/d62). [[w.johnson-vantage-point]], 123–24. Made public: FRUS 1964–68, II (1996). See [[cal.1965-01-27.vietnam]]. Names: McCone, Johnson, Nguyễn Khánh, Kosygin.'
      tags:
      - name:mccone-john-a
      - name:johnson-lyndon-b
      - name:nguyen-khanh
      - name:kosygin-aleksei
      src:
        c: 67e7c032
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d61: all'
        - 'https://history.state.gov/historicaldocuments/frus1964-68v02/d62: A-B'
        - 'w.johnson-vantage-point 123–24: all'
- add:
    entry:
      id: cal.1967-04-06.vietnam-sunflower
      when: Apr. 6
      date: '1967-04-06'
      thread: vietnam-sunflower
      c: 'Johnson''s second letter to Hồ Chí Minh: disappointed at his answer to the letter of Feb. 8; Lincoln''s words of 1861; the offers stand, talks first, then a stop to the fighting, or steps of mutual de-escalation, in Moscow, Rangoon or elsewhere; the Geneva Accords of 1954 and 1962. Delivered to the North Vietnamese Embassy in Moscow; returned the same day, opened.'
      n: '[[w.johnson-vantage-point]], 256, 596 (the letter, printed at 596; its delivery and return, by Johnson''s account, at 256). Made public: [[w.johnson-vantage-point]], 596 (1971). Check: the delivery, in the embassy''s record. See [[cal.1967-02-08.vietnam]]. Names: Johnson, Hồ Chí Minh.'
      tags:
      - name:johnson-lyndon-b
      - name:ho-chi-minh
      src:
        c: 8ce1b7a5
        rows:
        - 'w.johnson-vantage-point 596: A-D'
        - 'w.johnson-vantage-point 256: all'
- add:
    entry:
      id: cal.1967-06-22.soviet-union
      when: June 22
      date: '1967-06-22'
      thread: soviet-union
      c: 'New York, the Soviet Mission, noon: Rusk to Kosygin, for Johnson, a meeting the next day at McGuire Air Force Base, N.J. Kosygin: not on a military base; not objecting to the area. Johnson takes up Governor Hughes''s offer to Rostow the day before of a place in New Jersey; Hughes proposes Glassboro. Christian announces the meeting at 6:35 p.m.'
      n: 'Rusk to State, Secto 16: [FRUS 1964–68, XIV, doc. 227](https://history.state.gov/historicaldocuments/frus1964-68v14/d227) (the talk). [[w.johnson-vantage-point]], 481–82 (Hughes; Glassboro; the hour: Johnson''s account); [FRUS 1964–68, XIV, doc. 228](https://history.state.gov/historicaldocuments/frus1964-68v14/d228) gives the hour from the memoir. Made public: FRUS 1964–68, XIV (2001). The meeting: [[cal.1967-06-23.soviet-union]]. Names: Rusk, Kosygin, Johnson, Hughes, Rostow, Christian.'
