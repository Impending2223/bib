    entry:
      id: cal.1968-03-11.vietnam-205000
      when: Mar. 11
      date: '1968-03-11'
      thread: vietnam-205000
      c: 'Johnson with Rusk, Clifford, Nitze, Wheeler, Taylor, Helms and Rostow, 6:57 to 8:18 p.m., Rusk leaving early for his second day of testimony. Westmoreland prefers the second alternative, seven more maneuver battalions, about 30,000 men; Wheeler: the reserves must be called. No decision.'
      n: '[FRUS 1964–68, VI, doc. 120](https://history.state.gov/historicaldocuments/frus1964-68v06/d120) (Tom Johnson''s notes). [[w.johnson-vantage-point]], 405 (no decision). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Johnson, Rusk, Clifford, Nitze, Wheeler, Taylor, Helms, Rostow, Westmoreland.'
