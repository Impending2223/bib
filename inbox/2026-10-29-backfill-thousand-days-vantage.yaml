        rows:
        - 'w.johnson-vantage-point 421: all'
- add:
    entry:
      id: cal.1969-01-20.transition-and-staff-2
      when: Jan. 20
      date: '1969-01-20'
      thread: transition-and-staff
      c: 'Bethesda, Md., after the inauguration: lunch at Clark and Marny Clifford''s. Johnson gives five Medals of Freedom, signed that day: Rusk, Clifford, Harriman, Rostow, William S. White. Then to Andrews, Md., and home on Air Force One.'
      n: '[[w.johnson-vantage-point]], 567, by Johnson''s account. See [[cal.1969-01-20.transition-and-staff]]. Names: Johnson, Clifford, Rusk, Harriman, Rostow.'
      tags:
      - name:johnson-lyndon-b
