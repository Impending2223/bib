- add:
    entry:
      id: cal.1961-03-18.laos
      when: Mar. 18
      date: '1961-03-18'
      thread: laos
      also:
      - soviet-union
      c: 'Rusk and Gromyko. After the group''s talk Rusk takes Gromyko aside with the line of Bohlen''s memorandum, as from a talk with the President. Gromyko: "But don''t underestimate us either"; the Soviet Union "wants nothing" in Laos. Rusk: the Soviets content to let matters develop on the ground.'
      n: '[FRUS 1961–63, XXIV, doc. 34](https://history.state.gov/historicaldocuments/frus1961-63v24/d34) (Rusk''s notes). [[w.schlesinger-thousand-days-1965]], 331 (the attempt; Gromyko gives no ground). Made public: FRUS 1961–63, XXIV. See [[cal.1961-03-09.laos]]. Names: Rusk, Gromyko, Bohlen.'
      tags:
      - name:rusk-dean
      - name:gromyko-andrei
      - name:bohlen-charles-e
      src:
        c: 464a1048
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d34: all'
        - 'w.schlesinger-thousand-days-1965 331: A-B'
- add:
    entry:
      id: cal.1961-03-20.laos
      when: Mar. 20
      date: '1961-03-20'
      thread: laos
      c: 'Lunch: Kennedy with Lippmann and Schlesinger, on Laos. The United States overcommitted in Southeast Asia; Vientiane to be held as a basis for negotiation; "We cannot and will not accept any visible humiliation over Laos"; Eisenhower''s unilateral intervention not feasible on any major scale, nor supported by the allies. "If I decided to do nothing, I could be an exceedingly popular President."'
      n: '[[w.schlesinger-thousand-days-1965]], 331–32, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-09.laos]]. Names: Kennedy, Lippmann, Schlesinger.'
      tags:
      - name:kennedy-john-f
      - name:lippmann-walter
      - name:schlesinger-arthur-m-jr
      src:
        c: d884e9f3
        rows:
        - 'w.schlesinger-thousand-days-1965 331–32: all'
- add:
    entry:
      id: cal.1961-03-21.laos
      when: Mar. 21
      date: '1961-03-21'
      thread: laos
      c: 'The White House, on Laos, a second meeting in two days. Rusk: if American forces go in, not to fight a big war but to lay a foundation for negotiation, "two-stringed." Britain to modify its position; Moscow told how seriously Washington takes it; a de facto cease-fire, then the co-chairmen at New Delhi, then a conference of fourteen nations; a SEATO force in Thailand, not yet in Laos. No decision.'
      n: '[FRUS 1961–63, XXIV, doc. 36](https://history.state.gov/historicaldocuments/frus1961-63v24/d36) (William Bundy''s memorandum, from Nitze''s notes). [[w.schlesinger-thousand-days-1965]], 333 (the two meetings; no decision). Made public: FRUS 1961–63, XXIV. See [[cal.1961-03-09.laos]]. Names: Rusk.'
      tags:
      - name:rusk-dean
      src:
        c: 392281ad
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d36: A-F'
        - 'w.schlesinger-thousand-days-1965 333: A, G'
- add:
    entry:
      id: cal.1961-04-06.cuba-bay-of-pigs
      when: Apr. 6
      date: '1961-04-06'
      thread: cuba-bay-of-pigs
      c: 'Another meeting on the landing. Schlesinger, after it: "We seem now destined to go ahead on a quasi-minimum basis—a large-scale infiltration (hopefully) rather than an invasion."'
      n: '[[w.schlesinger-thousand-days-1965]], 256, from his notes. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-29.cuba]]. Names: Schlesinger.'
      tags:
      - name:schlesinger-arthur-m-jr
      src:
        c: f0482888
        rows:
        - 'w.schlesinger-thousand-days-1965 256: all'
- add:
    entry:
      id: cal.1961-04-20.laos
      when: Apr. 20
      date: '1961-04-20'
      thread: laos
      c: 'Kennedy turns the American military advisers in Laos, in civilian clothes till now, into a Military Assistance Advisory Group: uniforms, and with the Laotian troops in the field.'
      n: '[[w.schlesinger-thousand-days-1965]], 336, by Schlesinger''s account. Check: the order and its day in the record. See [[cal.1961-03-09.laos]]. Names: Kennedy.'
      tags:
      - name:kennedy-john-f
      src:
        c: 4c1e8f4d
        rows:
        - 'w.schlesinger-thousand-days-1965 336: all'
- add:
    entry:
      id: cal.1961-04-20.cuba-bay-of-pigs
      when: Apr. 20
      date: '1961-04-20'
      thread: cuba-bay-of-pigs
      also:
      - laos
      c: 'Nixon with Kennedy: an invasion of Cuba; "a commitment of American air power" to Laos. Kennedy, by Nixon''s recollection: "I just don''t think we ought to get involved in Laos, particularly where we might find ourselves fighting millions of Chinese troops in the jungles."'
      n: '[[w.schlesinger-thousand-days-1965]], 336–37 (Nixon''s account, as Schlesinger quotes it). Made public: Nixon, *Reader''s Digest*, Nov. 1964. To check: Richard M. Nixon, "Cuba, Castro and John F. Kennedy," *Reader''s Digest*, Nov. 1964 (cited by [[w.schlesinger-thousand-days-1965]], 337 n.*). See [[cal.1961-03-29.cuba]]. Names: Nixon, Kennedy.'
      tags:
      - name:nixon-richard-m
      - name:kennedy-john-f
      src:
        c: ff526232
        rows:
        - 'w.schlesinger-thousand-days-1965 336–37: all'
        - 'via w.schlesinger-thousand-days-1965 337 n.*: all'
- add:
    entry:
      id: cal.1961-04-27.laos
      when: Apr. 27
      date: '1961-04-27'
      thread: laos
      also:
      - cuba-bay-of-pigs
      c: 'The 479th NSC, 10 a.m. to 12:02 p.m., Kennedy presiding, thirty-three present: Laos, and Cuba after the landing. The congressional leaders to be told of Laos that morning. By Rostow''s account, the worst White House meeting he attended: the Chiefs would not guarantee success even with the 60,000 men they had asked a month before; Johnson proposes they put their views in writing; seven memoranda, it is said, from the four Chiefs and the three service secretaries.'
      n: '[FRUS 1961–63, XXIV, doc. 63](https://history.state.gov/historicaldocuments/frus1961-63v24/d63) (the editorial note: the time, those present, NSC Action No. 2410); [FRUS 1961–63, X, doc. 184](https://history.state.gov/historicaldocuments/frus1961-63v10/d184) (Bowles''s notes: Cuba). [[w.schlesinger-thousand-days-1965]], 337 (Rostow''s account, as Schlesinger gives it). Made public: FRUS 1961–63, XXIV; X (1997). See [[cal.1961-03-09.laos]]. Names: Kennedy, Rostow, Johnson.'
      tags:
      - name:kennedy-john-f
      - name:rostow-walt-w
      - name:johnson-lyndon-b
      src:
        c: f7acbc20
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1961-63v24/d63: A-B'
        - 'https://history.state.gov/historicaldocuments/frus1961-63v10/d184: A'
        - 'w.schlesinger-thousand-days-1965 337: C-E'
- add:
    entry:
      id: cal.1961-10-25.latin-america
      when: Oct. 25
      date: '1961-10-25'
      thread: latin-america
      c: 'Jagan, Premier of British Guiana, with Kennedy, 11 a.m., Ball, Schlesinger, Goodwin and Tyler present: his development plans; a socialist and a believer in state planning; evasive on doctrine. Kennedy: "We are not engaged in a crusade to force private enterprise on parts of the world where it is not relevant. If we are engaged in a crusade for anything, it is national independence."'
      n: '[FRUS 1961–63, XII, doc. 259](https://history.state.gov/historicaldocuments/frus1961-63v12/d259) (Tyler''s memorandum). [[w.schlesinger-thousand-days-1965]], 775 (Kennedy''s words; Jagan''s *Meet the Press* before it). Made public: FRUS 1961–63, XII. See [[cal.1961-03-10.latin-america]]. Names: Jagan, Kennedy, Ball, Schlesinger, Goodwin, Tyler.'
      tags:
      - name:jagan-cheddi-b
      - name:kennedy-john-f
      - name:ball-george-w
      - name:schlesinger-arthur-m-jr
      - name:goodwin-richard-n
