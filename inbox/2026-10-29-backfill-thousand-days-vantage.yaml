- add:
    entry:
      id: cal.1961-02-16.latin-america
      when: Feb. 16
      date: '1961-02-16'
      thread: latin-america
      c: 'Berle''s Latin American Task Force, Mann with him. Berle: "to develop policies and programs which would channel the revolution now going on in Latin America in the proper direction and to prevent it from being taken over by the Sino-Soviet bloc"; a moral equivalent of the Marshall Plan. Agreed: a ten-year development program; new machinery; an end to the bar on aid to government-owned enterprises; a major address by the President soon.'
      n: '[[w.schlesinger-thousand-days-1965]], 202, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). The Alliance proposed: [[cal.1961-03-13.latin-america]]. Names: Berle, Mann.'
      tags:
      - name:berle-adolf-a
      - name:mann-thomas-c
      src:
        c: 251c8fdf
        rows:
        - 'w.schlesinger-thousand-days-1965 202: all'
- add:
    entry:
      id: cal.1961-03-09.laos
      when: Mar. 9
      date: '1961-03-09'
      thread: laos
      c: 'The White House, 3:30 to 4:44 p.m. Kennedy with Johnson, McNamara, Lemnitzer, Felt, Nitze, Dulles, Bissell, Bundy, Rostow and others on the Chiefs'' plan of action on the Plain of Jars: to split the guerrillas, cut the Pathet Lao from North Vietnam''s support, and destroy them. The Laos task force proposes more military aid to the Royal Laotian Army.'
      n: '[FRUS 1961–63, XXIV, doc. 25](https://history.state.gov/historicaldocuments/frus1961-63v24/d25) (Clifton''s memorandum of the conference); [FRUS 1961–63, XXIV, doc. 26](https://history.state.gov/historicaldocuments/frus1961-63v24/d26) (a memorandum of the meeting, not declassified). [[w.schlesinger-thousand-days-1965]], 331 (the task force''s proposal). Made public: FRUS 1961–63, XXIV. See [[cal.1961-01-19.laos]]. Names: Kennedy, Johnson, McNamara, Lemnitzer, Felt, Nitze, Dulles, Bissell, Bundy, Rostow.'
      tags:
      - name:kennedy-john-f
      - name:johnson-lyndon-b
      - name:mcnamara-robert-s
      - name:lemnitzer-lyman-l
      - name:felt-harry-d
      - name:nitze-paul
      - name:dulles-allen-w
      - name:bissell-richard-m-jr
      - name:bundy-mcgeorge
      - name:rostow-walt-w
      src:
