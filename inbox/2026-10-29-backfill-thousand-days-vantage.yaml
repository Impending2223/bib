- add:
    entry:
      id: cal.1968-03-10.vietnam-205000
      when: Mar. 10
      date: '1968-03-10'
      thread: vietnam-205000
      c: 'Sunday. Rusk at lunch with Johnson on his testimony before Foreign Relations the next day: as full a picture as security allows; the review under way; his proposal of a bombing cutback not for the Senate.'
      n: '[[w.johnson-vantage-point]], 402, by Johnson''s account. Check: Rusk to the committee, Mar. 11, as Johnson quotes him (403): he called on the President "yesterday afternoon after he got back from church." See [[cal.1968-02-27.vietnam]]. Names: Rusk, Johnson.'
      tags:
