- add:
    entry:
      id: cal.1968-03-15.vietnam-205000
      when: Mar. 15
      date: '1968-03-15'
      thread: vietnam-205000
      c: 'Johnson with Clifford, Rusk, Wheeler, Nitze, Fortas, Taylor and Rostow, 5:15 to 7:10 p.m., on the reserves and the deployment. Clifford: two call-ups, 50,000 and 48,000; 43,000 more men for Vietnam, 30,000 and 13,000 in support. Rusk, by Johnson''s account: "If we do this without a tax bill, we are dead." Johnson: no decision before Fowler, the committees and the leaders are heard.'
      n: '[FRUS 1964–68, VI, doc. 130](https://history.state.gov/historicaldocuments/frus1964-68v06/d130) (the editorial note: the time, those present, from the Daily Diary; the meeting''s notes quoted). [[w.johnson-vantage-point]], 406–7 (Rusk''s words; no decision). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Johnson, Clifford, Rusk, Wheeler, Nitze, Fortas, Taylor, Rostow, Fowler.'
