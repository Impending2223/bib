        - 'w.schlesinger-thousand-days-1965 775: A-B, D'
- add:
    entry:
      id: cal.1962-07-18.africa
      when: July 18
      date: '1962-07-18'
      thread: africa
      c: 'The Cabinet Room, on African policy at the UN. Kennedy: why take the initiative on a resolution on Portugal; the Azores not to be lost with the test ban coming up; "Let us not try to shepherd everyone around." Stevenson: France would seek the best of both worlds. Kennedy: "Well, let us try that this time."'
      n: '[[w.schlesinger-thousand-days-1965]], 582, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1961-03-22.africa]]. Names: Kennedy, Stevenson.'
      tags:
      - name:kennedy-john-f
      - name:stevenson-adlai-e
      src:
        c: 6c51723f
        rows:
        - 'w.schlesinger-thousand-days-1965 582: all'
- add:
    entry:
      id: cal.1962-12-01.missile-crisis
      when: Dec. 1
      date: '1962-12-01'
      thread: missile-crisis
      c: 'Kennedy calls Schlesinger in: Bartlett and Stewart Alsop''s piece on Cuba for the *Saturday Evening Post*, which Chalmers Roberts is to present in the *Washington Post* as an attack on Stevenson. "You had better warn Adlai that this is coming"; he never talked to Bartlett or any reporter about the crisis.'
      n: '[[w.schlesinger-thousand-days-1965]], 835, by Schlesinger''s account. Made public: [[w.schlesinger-thousand-days-1965]] (1965). See [[cal.1962-05-24.missile-crisis]]. Names: Kennedy, Schlesinger, Bartlett, Alsop, Roberts, Stevenson.'
      tags:
