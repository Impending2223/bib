- add:
    entry:
      id: cal.1968-03-15.vietnam-205000-2
      when: Mar. 15
      date: '1968-03-15'
      thread: vietnam-205000
      c: 'Goldberg, from New York, for Rusk, Clifford and the President: a new and fresh move toward a political solution now. Stop the bombing of the North without conditions or time limit, under the San Antonio formula, for the time needed to see whether Hanoi will negotiate in good faith. Forwarded to Johnson at the Ranch the next morning.'
      n: '[FRUS 1964–68, VI, doc. 131](https://history.state.gov/historicaldocuments/frus1964-68v06/d131). [[w.johnson-vantage-point]], 408 (the formula; the forwarding). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Goldberg, Rusk, Clifford, Johnson.'
      tags:
      - name:goldberg-arthur-j
      - name:rusk-dean
      - name:johnson-lyndon-b
      - name:clifford-clark
      src:
        c: 6f356ee3
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d131: A-B'
        - 'w.johnson-vantage-point 408: B-C'
- add:
    entry:
      id: cal.1968-03-16.vietnam-205000
      when: Mar. 16
      date: '1968-03-16'
      thread: vietnam-205000
      c: 'Rusk to Bunker, literally eyes only: two staff proposals beyond the San Antonio formula, their authors unnamed. Stop the bombing soon, taking Hanoi''s statements to show it understands the "no advantage" assumption; or confine it to the area south of Vinh, with the simplest announcement. Bunker''s judgment asked on the South Vietnamese reaction.'
      n: '[FRUS 1964–68, VI, doc. 137](https://history.state.gov/historicaldocuments/frus1964-68v06/d137). [[w.johnson-vantage-point]], 408 (the authors unnamed). Made public: FRUS 1964–68, VI (2002). Reply: [[cal.1968-03-20.vietnam-205000-2]]. See [[cal.1968-02-27.vietnam]]. Names: Rusk, Bunker.'
      tags:
      - name:rusk-dean
      - name:bunker-ellsworth
      src:
        c: 61f68b8d
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d137: all'
        - 'w.johnson-vantage-point 408: A'
- add:
    entry:
      id: cal.1968-03-19.vietnam-205000-2
      when: Mar. 19
      date: '1968-03-19'
      thread: vietnam-205000
      also:
      - economy-surcharge
      c: 'The Cabinet Room, in the evening: Johnson to the Senate and House leaders on the call-up. More men under arms, some to restore the strategic reserve, some to Westmoreland; not 400,000, nor 200,000 more men to Vietnam. A call-up of about 100,000 would add $8–10 billion to the deficit; the tax bill a "must."'
      n: '[[w.johnson-vantage-point]], 409, by Johnson''s account. See [[cal.1968-02-27.vietnam]]. Names: Johnson, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      src:
        c: 095c3956
        rows:
        - 'w.johnson-vantage-point 409: all'
- add:
    entry:
      id: cal.1968-03-20.vietnam-205000-2
      when: Mar. 20
      date: '1968-03-20'
      thread: vietnam-205000
      c: 'Bunker to Rusk, eyes only, on the two proposals: a full stop "would create the greatest difficulties for us here. I recommend strongly that we not pursue this course." A limited halt easier for Saigon to accept, but premature now, above all before an announced increase in American forces. The South Vietnamese leaders to be consulted first.'
      n: '[FRUS 1964–68, VI, doc. 145](https://history.state.gov/historicaldocuments/frus1964-68v06/d145). [[w.johnson-vantage-point]], 411. Made public: FRUS 1964–68, VI (2002). See [[cal.1968-03-16.vietnam-205000]]. Names: Bunker, Rusk.'
      tags:
      - name:bunker-ellsworth
      - name:rusk-dean
      src:
        c: 449efd2c
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d145: all'
        - 'w.johnson-vantage-point 411: all'
- add:
    entry:
      id: cal.1968-03-20.vietnam-205000-3
      when: Mar. 20
      date: '1968-03-20'
      thread: vietnam-205000
      c: 'Clifford to Johnson by telephone, 8:44 a.m.: McGeorge Bundy offers to help with the address. Johnson: a peace front with the left hand while the right goes "after their jaw"; Goldberg''s plan "not worth a damn"; Clifford and Rusk to explore an offer, Hanoi and Haiphong spared, a Geneva conference. Clifford: Kennedy and McCarthy the peace candidates, Johnson the war candidate.'
      n: '[FRUS 1964–68, VI, doc. 146](https://history.state.gov/historicaldocuments/frus1964-68v06/d146). [[w.johnson-vantage-point]], 410 (the call, by Johnson''s account). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Clifford, Johnson, McGeorge Bundy, Goldberg, Rusk, Robert Kennedy, McCarthy.'
      tags:
      - name:clifford-clark
      - name:johnson-lyndon-b
      - name:bundy-mcgeorge
      - name:goldberg-arthur-j
      - name:rusk-dean
      - name:kennedy-robert-f
      - name:mccarthy-eugene-j
      src:
        c: 66be1307
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d146: all'
        - 'w.johnson-vantage-point 410: B-D'
- add:
    entry:
      id: cal.1968-03-22.vietnam-205000
      when: Mar. 22
      date: '1968-03-22'
      thread: vietnam-205000
      c: 'Johnson with Rusk, Clifford, Fowler, Clark, Fortas, McGeorge and William Bundy, Rostow, McPherson and Christian, on McPherson''s draft of the address. Johnson: from his office on television, not to a joint session; taxes, troops and reserves, negotiations and peace. Clifford: call up the reserves, commit no troops beyond those promised Westmoreland, support troops only. By Johnson''s account, the plan by now: about 62,000 reserves, 13,500 more men for Vietnam.'
      n: '[FRUS 1964–68, VI, doc. 149](https://history.state.gov/historicaldocuments/frus1964-68v06/d149) (Christian''s notes). [[w.johnson-vantage-point]], 415 (the figures). Made public: FRUS 1964–68, VI (2002). See [[cal.1968-02-27.vietnam]]. Names: Johnson, Rusk, Clifford, Fowler, Clark, Fortas, McGeorge Bundy, William Bundy, Rostow, McPherson, Christian, Westmoreland.'
      tags:
      - name:johnson-lyndon-b
      - name:rusk-dean
      - name:clifford-clark
      - name:fowler-henry-h
      - name:clark-ramsey
      - name:fortas-abe
      - name:bundy-mcgeorge
      - name:bundy-william
      - name:rostow-walt-w
      - name:mcpherson-harry
      - name:christian-george
      - name:westmoreland-william
      src:
        c: 6cb61d87
        rows:
        - 'https://history.state.gov/historicaldocuments/frus1964-68v06/d149: A-D'
        - 'w.johnson-vantage-point 415: E'
- add:
    entry:
      id: cal.1968-03-29.vietnam-205000
      when: Mar. 29
      date: '1968-03-29'
      thread: vietnam-205000
      c: 'Johnson with Russell, a long talk in the morning: the military moves planned and the halt of the bombing over most of North Vietnam. Clifford to tell other members of Armed Services.'
      n: '[[w.johnson-vantage-point]], 421, by Johnson''s account. See [[cal.1968-02-27.vietnam]]. Names: Johnson, Russell, Clifford.'
      tags:
      - name:johnson-lyndon-b
      - name:russell-richard-b
      - name:clifford-clark
      src:
        c: 6b4f80f7
        rows:
        - 'w.johnson-vantage-point 421: all'
- add:
    entry:
      id: cal.1968-03-30.vietnam-205000-2
      when: Mar. 30
      date: '1968-03-30'
      thread: vietnam-205000
      c: 'Clifford briefs Stennis, Margaret Chase Smith, Symington, Jackson and others of Armed Services: the bombing halt to be effective north of the 20th parallel.'
      n: '[[w.johnson-vantage-point]], 421, by Johnson''s account. See [[cal.1968-03-29.vietnam-205000]]. Names: Clifford, Stennis, Smith, Symington, Jackson.'
      tags:
