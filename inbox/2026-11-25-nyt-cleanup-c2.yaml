      c: Some thirty of the Stevenson-for-President Committee, led by Ira Lesser, picket City Hall to press Wagner to support Stevenson.
      n: '"Wagner Denies State Delegation Is Rigged to Favor Kennedy," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). See [[cal.1960-07-05.elections-1960-nomination]]. Names: Wagner, Stevenson.'
      tags:
      - name:wagner-robert-f-jr
      - name:stevenson-adlai-e
      - state:ny
      - city:new-york
