- edit:
    id: cal.1960-07-05.china
    base: 568a20dc
    set:
      n: '"Ghana Asks ''Bold'' Western Aid," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). [[w.zhonghua-renmin-gongheguo-waijiao-2001]], 150 (July 5, 1960).'
- add-words:
    id: cal.1960-07-05.china
    after: end
    words: Xinhua carries the Foreign Ministry's announcement. Ghana is the second African state to recognize the Peking government, after Guinea, the *Times* reports.
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html)'
- edit:
    id: cal.1960-07-05.cuba-2
    base: 8fa10630
    kind: correct
    set:
      c: Agriculture halts new imports of Cuban sugar pending the President's action under the new act.
      n: 'William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2. Split under R17: the White House''s word on the signing and the State Department''s announcement of the Advisory Committee''s meeting, in the same story, are entries of their own. Law: [[cal.1960-07-06.cuba-2]].'
    unset:
    - tags
- add-words:
    id: cal.1960-07-05.cuba-2
    after: end
    words: Cuba's quota for the year is 3,119,655 tons, about 740,000 not yet received, the *Times* reports.
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html)'
- add:
    entry:
      id: cal.1960-07-05.cuba-8
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: cuba
      c: A White House spokesman says the President has delayed signing the sugar bill, passed over the week-end, pending a review by the departments concerned.
      n: 'William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 2. See [[cal.1960-07-05.cuba-2]].'
      tags:
      - name:eisenhower-dwight-d
- add:
    entry:
      id: cal.1960-07-05.cuba-9
      when: July 5
      date: '1960-07-05'
      place: washington
      thread: cuba
      c: 'The State Department announces the National Advisory Committee on Inter-American Affairs to meet July 6 and 7, Dillon presiding, Herter on vacation; Cuba to head the agenda, informed sources say. The public members: Walter J. Donnelly, Milton S. Eisenhower, George K. Holland, O. A. Knight, Charles A. Meyer, Dana Gardner Munro.'
      n: 'William J. Jorden, "U.S. Files Protest on Cuban Seizure of Oil Refineries," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1, 2. See [[cal.1960-07-05.cuba-2]]. Names: Dillon, Herter, Donnelly, Milton Eisenhower, Meyer.'
      tags:
      - name:dillon-c-douglas
      - name:herter-christian-a
      - name:donnelly-walter-j
      - name:eisenhower-milton-s
      - name:meyer-charles-a
- edit:
    id: cal.1960-07-05.elections-1960-los-angeles
    base: ce8ddec1
    set:
      n: 'Leo Egan, "Democrats Hear Ideas for Planks," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20. W. H. Lawrence, "Democratic Hopefuls Face Early Test on Voting Rule," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 1 (the four days of hearings; the debate on Social Security; Butler''s prediction). Names: Bowles, Annis, Butler.'
- add-words:
    id: cal.1960-07-05.elections-1960-los-angeles
    after: end
    words: 'Other witnesses: Bishop Gerald H. Kennedy of the Methodist Church for the National Council of Churches; Cecil E. Burney of Corpus Christi, Tex., for the American Bar Association. Nearly ninety are to appear. Butler predicts a platform without a major floor fight.'
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html)'
- add:
    entry:
      id: cal.1960-07-05.elections-1960-los-angeles-7
      when: July 5
      date: '1960-07-05'
      place: los-angeles
      thread: elections-1960-los-angeles
      also:
      - democratic-party
      follows:
      - cal.1960-07-05.elections-1960-los-angeles
      c: 'Butler, to reporters after his appearance before the Platform Committee, answering Johnson''s complaint: no candidate consulted on the convention''s officials, chosen by the fourteen-member committee on arrangements, he one member, from nineteen possibilities; of those chosen only Bowles has declared for a candidate.'
      n: 'Leo Egan, "Democrats Hear Ideas for Planks," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html), at 20. The order: after his appearance before the committee. Check: whether this is the news conference of [[cal.1960-07-05.democratic-party]]. Names: Butler, Johnson, Bowles.'
      tags:
      - name:johnson-lyndon-b
      - name:bowles-chester
      - ok:name-untagged
- edit:
    id: cal.1960-07-05.elections-1960-nomination
    base: 8ec14eb4
    kind: correct
    set:
      c: 'Wagner, chairman of the New York delegation, at a City Hall news conference: the delegation not rigged, no unit rule; he would "like to see young men get a chance."'
      n: '"Wagner Denies State Delegation Is Rigged to Favor Kennedy," [*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html). Split under R17: the Stevenson pickets at City Hall, in the same story, are an entry of their own. The order: the pickets came first. See [[cal.1960-07-02.elections-1960-2]]. Names: Wagner, Truman, Stevenson.'
- add-words:
    id: cal.1960-07-05.elections-1960-nomination
    after: end
    words: 'Asked about Truman''s charge of a rigged convention, Wagner says Truman has "every right" to his opinion. Too busy to visit the Stevenson headquarters; Stevenson "an old and good friend." More than 100 of the delegation''s 114 votes are indicated for Kennedy, the *Times* reports.'
    text: '[*New York Times*, July 6, 1960](https://timesmachine.nytimes.com/timesmachine/1960/07/06/issue.html)'
- names:
    id: cal.1960-07-05.elections-1960-nomination
    add:
    - Kennedy
    tags:
    - name:kennedy-john-f
