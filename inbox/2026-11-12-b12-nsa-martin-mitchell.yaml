patch: 2026-11-12-b12-nsa-martin-mitchell
by: 'Claude (batch 12 reader, William H. Martin and Bernon F. Mitchell: NSA release, Eisenhower Library memo, Almanac, HUAC report, Durant, NSA 60th)'
ops:
- cite:
    id: cal.1960-09-06.soviet-union
    item: '[[w.martin-press-conference-house-of]], 1, 4–5, 8–9 (the place; the citizenship; their reasons, the airspace flights and the intercepts of allies'' messages; the C-130 and the high NSA official''s word to Martin, 4–5; the code clerk, at 9, "the Turkish Embassy"; not Kharlamov, the Foreign Ministry''s Press Department, the "cryptology department," or the refusal on arrival)'
    units: A, C, E, F
- cite:
    id: cal.1960-09-06.intelligence-2
    item: '[[w.martin-press-conference-house-of]], 1 (Martin: the statement left "at the end of June" in safety deposit box 174 at the State Bank of Laurel, Md.; not the department''s holding it)'
    units: '?'
- check:
    id: cal.1960-09-06.intelligence-2
    text: 'Check: the date of leaving: Martin says they left the United States "at the end of June" ([[w.martin-press-conference-house-of]], 1); Lansdale''s memorandum of Aug. 1 has them leave Washington June 25 and reach Havana July 1 (see [[cal.1960-06-25.intelligence]], [[cal.1960-07-01.intelligence]]).'
- check:
    id: cal.1960-09-06.antisubversion
    text: 'Check: the day: the committee''s report has its hearings begin Sept. 14 ([[w.activities-security-practices-in-the]], 2).'
- check:
    id: cal.1960-09-07.intelligence-2
    text: 'Check: the records: Lansdale''s memorandum of Aug. 1 reports that the lie-detector check at Mitchell''s employment "revealed that Mitchell had some sexual aberration prior to age 20" (see [[cal.1960-06-24.intelligence]]); the department''s statement of Sept. 12 so corrects this one ([[w.activities-security-practices-in-the]], 3).'
- check:
    id: cal.1960-09-07.intelligence-3
    text: 'Check: the date: the Moscow statement has the two see a Congressman in February 1959, one who had publicly questioned the State Department''s concealing the facts of the C-130 ([[w.martin-press-conference-house-of]], 5); Hays says "last spring."'
- add:
    entry:
      id: cal.1960-06-24.intelligence
      when: June 24
      date: '1960-06-24'
      thread: intelligence
      c: Fort Meade, Md. Bernon F. Mitchell and William H. Martin, mathematicians in statistical research at the National Security Agency, go on summer leave together, telling fellow employees they may visit their parents in Eureka, Calif., and Ellensburg, Wash. They hint that if they are not back by July 11 they will take another week, returning July 18.
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960, at 1 (Office of the Secretary of Defense; Dwight D. Eisenhower Library, declassified with deletions May 23, 2002, MR 99-57: the leave from June 24, the words to fellow employees, the hint of a third week; the two "not missed until after 18 July"). [[w.mowry-betrayers-of-the-trust]], 2 (the application for leave, June 24 to July 11, to visit their parents; not the hint of a third week). Made public: 2002. Names: Mitchell, Martin.'
      tags:
      - state:md
      - city:fort-meade
- add:
    entry:
      id: cal.1960-06-25.intelligence
      when: June 25
      date: '1960-06-25'
      thread: intelligence
      c: Washington National Airport. Mitchell and Martin, each with a single suitcase, buy one-way tickets to Mexico City on Eastern Airlines and fly there, arriving the same day.
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 1–2 (the taxi to the airport, the single suitcases, the one-way tickets on Eastern Airlines, arrival the same day; the memo gives June 25 for the taxi and the hotel in Mexico City). [[w.mowry-betrayers-of-the-trust]], 2 (Eastern Airlines Flight 305 from National Airport, June 25). Made public: 2002. Names: Mitchell, Martin.'
      tags: []
- add:
    entry:
      id: cal.1960-07-01.intelligence
      when: July 1
      date: '1960-07-01'
      thread: intelligence
      c: Mitchell and Martin fly from Mexico City to Havana, on Cuban Airlines by a later report. The Defense Department has no report of their movements afterward, as of Aug. 1.
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 2 ("A subsequent report is that they flew to Havana on Cuban Airlines on 1 July. There is no further report of their movements after 1 July"). [[w.mowry-betrayers-of-the-trust]], 2 (Mexico City to Havana on July 1, then to Russia, "apparently on a Soviet trawler"; not the airline). Made public: 2002. Names: Mitchell, Martin.'
      tags: []
- add:
    entry:
      id: cal.1960-07-26.intelligence
      when: July 26
      date: '1960-07-26'
      thread: intelligence
      c: Fort Meade, Md. The National Security Agency's Office of Personnel is notified that Mitchell and Martin have apparently disappeared.
      n: '[[w.mowry-betrayers-of-the-trust]], 2 ("On 26 July the Office of Personnel was notified that they had apparently disappeared"). Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 1 (they were "not missed until after 18 July"; no day for the notice). Made public: 2004 (the Almanac''s copy is marked released by NSA Aug. 12, 2004, under the Freedom of Information Act; the issue is dated May–June 2002). Names: Mitchell, Martin.'
      tags:
      - state:md
      - city:fort-meade
- add:
    entry:
      id: cal.1960-07-30.intelligence
      when: July 30
      date: '1960-07-30'
      thread: intelligence
      c: Lt. Gen. John A. Samford, director of the National Security Agency, tells Brig. Gen. Edward G. Lansdale, of the Office of Special Operations in the Secretary of Defense's office, of the two missing NSA employees, in the afternoon. The office of Deputy Secretary Douglas and the duty officer for Public Affairs are then alerted.
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 3 ("The writer was informed of this affair the afternoon of 30 July by General Samford"; "Your office and the duty officer for Public Affairs were then alerted"). Made public: 2002. Names: Samford, Lansdale, Douglas.'
      tags:
      - name:samford-john-a
      - name:lansdale-edward-g
      - name:douglas-james-h-jr
- add:
    entry:
      id: cal.1960-07-31.intelligence
      when: July 31
      date: '1960-07-31'
      thread: intelligence
      c: Murray Snyder, Assistant Secretary of Defense for Public Affairs, meets in the morning with representatives of Deputy Secretary Douglas's office, the Office of Special Operations, the National Security Agency and the CIA. After "considerable discussion" they decide "to handle any publicity initially as a routine AWOL case."
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 3 (the meeting "the morning of 31 July," the decision; not the calls to the parents, the FBI and the Laurel and D.C. police that followed, or the contact of Martin''s parents with Rep. May''s office). Made public: 2002. Names: Snyder, Douglas.'
      tags:
      - name:snyder-murray
      - name:douglas-james-h-jr
- add:
    entry:
      id: cal.1960-08-01.intelligence
      when: Aug. 1
      date: '1960-08-01'
      thread: intelligence
      c: 'Lansdale to Douglas, "Missing NSA Personnel," a summary of the case of Mitchell and Martin. It expects the Mexico City and Havana aspects to come from press contacts with the local police, "and possibly with either the families or Congressman May": "It has the potential of a sensational story, if the press starts speculating." Mitchell and Martin have been "administratively relieved of all duties at NSA, pending further information."'
      n: 'Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 1–4 (the summary; the expected press contacts, the "sensational story," the relief from duties, 4; not the security estimate, the personal details or the FBI''s doubts about jurisdiction, 2–3). The memo writes "Congressman Edith Nourse May in Yakima, Washington"; the member from Yakima in 1960 was Catherine D. May. Made public: 2002. Names: Lansdale, Douglas, May, Mitchell, Martin.'
      tags:
      - name:lansdale-edward-g
      - name:douglas-james-h-jr
      - name:may-catherine-d
- add:
    entry:
      id: cal.1960-08-01.intelligence-2
      when: Aug. 1
      date: '1960-08-01'
      thread: intelligence
      c: The Defense Department announces that two employees of the National Security Agency have failed to return from a vacation trip they took together.
      n: '[[w.activities-security-practices-in-the]], 1–2 (the announcement of Aug. 1, 1960: two NSA employees "failed to return from a supposed vacation trip which they had taken together"; the names not given there). [[w.mowry-betrayers-of-the-trust]], 2 (on Aug. 1 the department "announced their unauthorized absence"). [[w.durant-congress-and-countersubversion-in]], 76 (the department "announced that Martin and Mitchell were missing"). To check: *New York Times*, Aug. 2, 1960.'
      tags: []
- add:
    entry:
      id: cal.1960-08-05.intelligence
      when: Aug. 5
      date: '1960-08-05'
      thread: intelligence
      c: 'The Defense Department, after its own inquiry into why Mitchell and Martin did not return from leave: "there is a likelihood that they have gone behind the Iron Curtain."'
      n: '[[w.activities-security-practices-in-the]], 2 (the "followup statement" of Aug. 5, 1960, as quoted). [[w.durant-congress-and-countersubversion-in]], 76 (Aug. 5: "likely that the two men had fled to the Eastern Bloc"). [[w.mowry-betrayers-of-the-trust]], 2 (the department admitted "a few days later" than Aug. 1; no day). Names: Mitchell, Martin.'
      tags: []
- add:
    entry:
      id: cal.1960-08-11.soviet-union
      when: Aug. 11
      date: '1960-08-11'
      thread: soviet-union
      also:
      - intelligence
      c: The Soviet Union officially grants Mitchell and Martin asylum, and each a monthly allowance of 500 rubles, roughly their NSA salaries.
      n: '[[w.durant-congress-and-countersubversion-in]], 76 (the day, the grant, the allowance; no source given). [[w.martin-press-conference-house-of]], 1 (the announcer: the Soviet government "has granted Mitchell and Martin the right of political asylum"; they are "Soviet citizens with full rights"; no day). To check: the Soviet grant of asylum, Aug. 11, 1960, and the allowance, which Durant gives without a source. Names: Mitchell, Martin.'
      tags:
      - polity:ussr
- add:
    entry:
      id: cal.1960-08-31.antisubversion
      when: Aug. 31
      date: '1960-08-31'
      thread: antisubversion
      also:
      - intelligence
      c: 'Walter, chairman of the House Un-American Activities Committee, to Gates, Secretary of Defense, by letter: "Executive regulations intended to guarantee the loyalty of Government employees, especially of sensitive agencies, are not effective and are not safeguarding the security of the United States." By the committee''s later account its investigators had found "important evidence indicating there was far more involved than just the fact that two NSA employees had defected to the U.S.S.R."'
      n: '[[w.activities-security-practices-in-the]], 2 (the letter, as quoted; the investigators'' evidence "by the end of August"). Names: Walter, Gates.'
      tags:
      - name:walter-francis-e
      - name:gates-thomas-s-jr
- add:
    entry:
      id: cal.1960-09-07.antisubversion-3
      when: Sept. 7
      date: '1960-09-07'
      thread: antisubversion
      c: 'The House Un-American Activities Committee authorizes a formal investigation and hearings on the National Security Agency, the day after the Moscow press conference. Its stated purposes: tighter security laws on unauthorized disclosure of defense information and on loss of nationality; the law on suspending civilian employees in the interest of national security; procedures for investigative clearance before Government employment, to keep out subversives and security risks; legislative oversight.'
      n: '[[w.activities-security-practices-in-the]], 1, 3 (the authorization of Sept. 7; the four purposes, with H.R. 2232, referred to the committee Jan. 12, 1959; Sec. 349 of the Immigration and Nationality Act; H.R. 1989, introduced by the chairman Jan. 9, 1959; the Act of Aug. 26, 1950). [[w.durant-congress-and-countersubversion-in]], 77 (the committee launches the investigation Sept. 7; 13 months, 2,000 hours of staff work, 16 executive-session hearings, 34 witnesses). See [[cal.1960-09-06.antisubversion]], [[cal.1960-09-07.antisubversion]]. Check: who ordered the inquiry: [[w.agency-60-years-of-defending]], 30, has "President Eisenhower" order an investigation of the incident, a "13-month study"; the report and Durant have the committee''s own inquiry, 13 months.'
      tags: []
- add:
    entry:
      id: cal.1960-09-12.intelligence
      when: Sept. 12
      date: '1960-09-12'
      thread: intelligence
      c: 'A Defense Department statement corrects its denial of Sept. 7: "one of the men, Mitchell, in his employment interview, stated that in his teens he had engaged in certain abnormal sexual practices."'
      n: '[[w.activities-security-practices-in-the]], 3 (the denial of Sept. 7; the "corrective public statement" of Sept. 12, as quoted). See [[cal.1960-09-07.intelligence-2]]; Lansdale to Douglas, memorandum, "Missing NSA Personnel," Aug. 1, 1960 (in full at [[cal.1960-06-24.intelligence]]), at 2 (the lie-detector check at Mitchell''s employment, which "revealed that Mitchell had some sexual aberration prior to age 20"). Names: Mitchell.'
      tags: []
- add:
    entry:
      id: cal.1960-09-14.antisubversion
      when: Sept. 14
      date: '1960-09-14'
      thread: antisubversion
      also:
      - intelligence
      c: The House Un-American Activities Committee begins its executive-session hearings on the National Security Agency.
      n: '[[w.activities-security-practices-in-the]], 2, 4 (the hearings "began on September 14, 1960"; 16 executive sessions in 13 months, 34 present and former NSA employees as witnesses; the testimony not to be made public, 4). See [[cal.1960-09-06.antisubversion]].'
      tags: []
- add:
    entry:
      id: cal.1960-09-15.intelligence
      when: Sept. 15
      date: '1960-09-15'
      thread: intelligence
      also:
      - congress
      c: 'A top Defense Department official, testifying before a subcommittee of the House Armed Services Committee: because employment in the National Security Agency "requires access to very highly classified information, NSA employees must meet the strictest of all the security standards in the Department."'
      n: '[[w.activities-security-practices-in-the]], 4 (the testimony of Sept. 15, 1960, as quoted; the official not named).'
      tags: []
- add:
    entry:
      id: cal.1960-09-16.antisubversion
      when: Sept. 16
      date: '1960-09-16'
      thread: antisubversion
      also:
      - intelligence
      c: The House Un-American Activities Committee, in executive session, refuses to accept as the testimony of the Defense Department's General Counsel the text of a statement released to the public the day before, or a summary of it.
      n: '[[w.activities-security-practices-in-the]], 3 (the session of Sept. 16, 1960; the General Counsel "attempted to present as his testimony the verbatim text"; the General Counsel not named). See [[cal.1960-09-06.antisubversion]].'
      tags: []
- add:
    entry:
      id: cal.1961-02-08.antisubversion
      when: Feb. 8
      date: '1961-02-08'
      thread: antisubversion
      also:
      - intelligence
      c: 'Walter to the Secretary of Defense, by letter: the difficulties the House Un-American Activities Committee met under his predecessor in obtaining certain records for its National Security Agency investigation. He asks that the predecessor''s decision be reviewed.'
      n: '[[w.activities-security-practices-in-the]], 16–17 (the letter of Feb. 8, 1961; not the plan of cooperation agreed afterward, no day given). Names: Walter.'
      tags:
      - name:walter-francis-e
- add:
    entry:
      id: cal.1961-08.intelligence
      when: Aug.
      date: 1961-08
      thread: intelligence
      also:
      - antisubversion
      c: By August, 26 persons on the National Security Agency's payroll have been fired for sex deviation, in a review of employees' files holding derogatory information that the agency began after the House Un-American Activities Committee opened its executive hearings in September 1960.
      n: '[[w.activities-security-practices-in-the]], 15, 18 ("by August 1961, 26 persons on the payroll had been fired by NSA for reasons of sex deviation," 15; measure 19, "dropped from the rolls," 18). Check: the day: the report gives "by August 1961."'
      tags: []
- add:
    entry:
      id: cal.1961-09-22.antisubversion
      when: Sept. 22
      date: '1961-09-22'
      thread: antisubversion
      also:
      - intelligence
      c: 'Hoover, by letter to the House Un-American Activities Committee, answering whether his views of 1953 on the polygraph had changed: his position "remains basically and essentially unchanged"; the technique "is still not sufficiently precise to permit absolute judgments of guilt or nonguilt without qualifications."'
      n: '[[w.activities-security-practices-in-the]], 14–15 (Hoover''s evaluation of 1953, 14; the committee''s question and the letter of Sept. 22, 1961, as quoted, 15). Names: Hoover.'
      tags:
      - name:hoover-j-edgar
- add:
    entry:
      id: cal.1961-11-10.intelligence
      when: Nov. 10
      date: '1961-11-10'
      thread: intelligence
      also:
      - antisubversion
      c: Fort Meade, Md. The National Security Agency's director of personnel resigns, effective Nov. 10, ordered to by the Defense Department. The House Un-American Activities Committee says he had falsified his Form 57 and tried to cover it up by substituting a corrected version.
      n: '[[w.activities-security-practices-in-the]], 10–12, 18 (measure 18, the resignation "effective November 10, 1961"; the Defense Department''s own inquiry into the form, 11–12; the report does not name him; the director of security and two others in the Office of Security Services "also ordered to resign for misconduct," no day: not entered).'
      tags:
      - state:md
      - city:fort-meade
- add:
    entry:
      id: cal.1962-02-08.antisubversion
      when: Feb. 8
      date: '1962-02-08'
      thread: antisubversion
      c: Walter introduces H.R. 10174, for added legislation to secure the National Security Agency and strengthen the hands of the Secretary of Defense and the agency's Director in providing it.
      n: '[[w.activities-security-practices-in-the]], 19 (the bill, introduced Feb. 8, 1962). Names: Walter.'
      tags:
      - name:walter-francis-e
- add:
    entry:
      id: cal.1962-03-21.antisubversion
      when: Mar. 21
      date: '1962-03-21'
      thread: antisubversion
      c: 'The House Un-American Activities Committee, in executive session, hears Defense, the National Security Agency and the Civil Service Commission on H.R. 10174: Assistant Secretary of Defense Rubel, with Vice Adm. L. H. Frost, the agency''s director; Macy, the Commission''s chairman. Counsel for Defense and for the agency, and the Commission''s general counsel, also testify.'
      n: '[[w.activities-security-practices-in-the]], 19 (the hearings of Mar. 21, 1962, on the need for the bill; the witnesses named there: John H. Rubel, Frost, Frank A. Bartimo, Roy R. Banner, John W. Macy, Jr., Lawrence V. Meloy). See [[cal.1962-02-08.antisubversion]]. Names: Macy.'
      tags:
      - name:macy-john-w-jr
- add:
    entry:
      id: cal.1962-06-12.antisubversion
      when: June 12
      date: '1962-06-12'
      thread: antisubversion
      c: Walter introduces H.R. 12082, a clean bill incorporating suggestions and revisions requested by the Departments of Defense and Justice and the Civil Service Commission.
      n: '[[w.activities-security-practices-in-the]], 19 (the bill, introduced June 12, 1962). See [[cal.1962-03-21.antisubversion]]. Names: Walter.'
      tags:
      - name:walter-francis-e
- add:
    entry:
      id: cal.1962-06-19.antisubversion
      when: June 19
      date: '1962-06-19'
      thread: antisubversion
      c: Scherer, the House Un-American Activities Committee's ranking minority member, introduces H.R. 12207, identical to Walter's H.R. 12082, in support of the chairman's proposal.
      n: '[[w.activities-security-practices-in-the]], 19 (the bill, introduced June 19, 1962). See [[cal.1962-06-12.antisubversion]]. Names: Scherer, Walter.'
      tags:
      - name:scherer-gordon-h
      - name:walter-francis-e
- add:
    entry:
      id: cal.1962-08-02.antisubversion
      when: Aug. 2
      date: '1962-08-02'
      thread: antisubversion
      c: The House Un-American Activities Committee reports H.R. 12082 favorably, recommending passage. Section 402 requires a full field investigation in connection with the employment, detail or assignment of any person to the National Security Agency, subject to conditions; boards of appraisal are to assist the Secretary of Defense and the Director in doubtful security cases.
      n: '[[w.activities-security-practices-in-the]], 19–20 (the report to the House, Aug. 2, 1962, "House Rept. No. 2120"; secs. 401–02). To check: H. Rept. 2120, 87th Cong., 2d Sess., and the bill''s fate. See [[cal.1962-06-12.antisubversion]].'
      tags: []
- add:
    entry:
      id: cal.1962-08-13.antisubversion
      when: Aug. 13
      date: '1962-08-13'
      thread: antisubversion
      also:
      - intelligence
      c: 'The House Un-American Activities Committee publishes its report, *Security Practices in the National Security Agency*, on its 13-month inquiry into the defection: 16 executive-session hearings, 34 present and former NSA employees as witnesses. It finds that until the inquiry the agency gave interim access to cryptologic information on a national agency check and a polygraph interview alone. It prints 22 corrective measures listed by the NSA''s Director at its request, among them a full field investigation before access to cryptologic information and notice of unexplained absences within two hours, and recommends legislation.'
      n: '[[w.activities-security-practices-in-the]], 1–2, 4–5, 17–20 (the title page, Aug. 13, 1962; the findings; the 22 measures, 17–19, the two-hour notice, 18). [[w.mowry-betrayers-of-the-trust]], 2–3 ("as a result of the House investigation," screening by examination, polygraph, national agency check, medical examination, tests and full field investigation; notice of unexplained absences "within two hours"). [[w.agency-60-years-of-defending]], 30 (NSA "tightened its hiring and security practices to include full background checks and polygraphs"). [[w.durant-congress-and-countersubversion-in]], 77 (a report of August 1962). See [[cal.1962-08-02.antisubversion]].'
      tags: []
