# Each fiscal year's budget, fiscal 1961-1970: receipts by source and expenditures (outlays) by function, as the
# President proposed them in January and as first reported after the year closed. Kept by hand, read off FRASER's
# scans of the *Budget of the United States Government* (and, for fiscal 1967's expenditures, the Treasury's *Annual
# Report*), each figure checked against the table's printed total (`check`: the rows must add to it within rounding).
# Today's figures, on today's unified basis and functions, are budgets/today.yaml (tools/budgets/make_today.py).
# Rendered by tools/bib/budgets.py under the calendar entry tagged `budget:<FY>` (that January's budget message).
#
#   docs      each document read: title, the January it was sent, its FRASER file
#   <FY>      proposed / actual, each with receipts and expenditures:
#     doc, table, page (printed), pdf (the page in FRASER's file), unit (m: millions, bn: billions)
#     basis   administrative (the budget's own accounts, trust funds out) or unified (from fiscal 1969's budget)
#     rows    [key, figure] or [key, figure, as printed]: the key is the row the figure goes in; the third element is
#             the source's own label where it differs (a renamed line, shown on hover). '*' is the source's "less
#             than $50 million". A row the source prints as a deduction is negative.
#     total   the printed total; total_label where it is not the budget's total
#     note    a remark on the column, shown under the table
#
# Rows share a key only where the line means the same thing in both columns. Where the classification changed
# between the proposal and the report (the functions of fiscal 1963's budget, Food for Peace moved to international
# affairs in fiscal 1966's, the unified budget's functions of fiscal 1970's and 1971's), the lines are different
# keys and stand in different rows, "—" in the other column (indicators STYLE 8).
