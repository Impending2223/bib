# The statutory limits on the public debt, June 30, 1960-Apr. 7, 1969: each act changing the limit in section 21 of the
# Second Liberty Bond Act (31 U.S.C. 757b). Kept by hand. Rendered by tools/bib/budgets.py under the calendar entry
# tagged `debt-limits` (the Debt limit thread's first entry); `check` fails on a limit that is not a number, a cite
# with no govinfo link, a term out of order, or an entry id that names no calendar entry.
#
# Source: OMB, Historical Tables, Table 7.3, "Statutory Limits on Federal Debt: 1940-Current" (the fiscal 2025 budget's,
# govinfo BUDGET-2025-TAB-8-3.xlsx, read Oct. 21, 2026), each act checked against its text in the Statutes at Large on
# govinfo (the limit, the term, the bill and the day approved). The permanent limit stood at $285 billion (73 Stat.
# 156, June 30, 1959) until the act of June 30, 1967 made it $358 billion. The act of Mar. 2, 1967 prints
# "$386,000,000,000" in govinfo's text layer; the page image and Table 7.3 read $336 billion.
#
#   date      the day approved          stat   'vol|page' and the govinfo granule (a suffix where several acts begin on
#   bill      the bill enacted                 the page: 76 Stat. 124 is the second, STATUTE-76-Pg124-2)
#   pl        the public law            terms  [from, to, limit in $ billions]: each period the act sets; `to` null for
#   permanent the permanent limit after the act (where it changed)                         a permanent limit
#   entry     the calendar entry of the signing (none for the act of 1969, after the calendar ends)
