# The pages' size budget and the splits it directs (tools/bib/pages.py, its docstring; ./bib pages, ./bib pages --plan).
# budget: bytes a page may hold, its HTML alone; budgets: a family's own; fill: a split packs its parts to this share
# of the budget; exempt: reported, never split. The rest is the plan, written by `./bib pages --plan` (by hand only to
# set a split aside): names, a letter in surname ranges; works, a page a letter; executive and congress, their top
# sections in parts; threads, a thread's page in parts by date; retired, the pages a split replaced, each forwarding
# its old links. The calendar's parts are in
# lists/cal/list.yaml (`split:`, `retired_parts`).
budget: 5000000
budgets:
  cal: 8000000
fill: 0.7
why:
  budget: 'Five megabytes of HTML a page: what a phone loads, parses and lays out in a second or two; past it a
    page is slow to open and to search. The default of the pass (Nov. 19, 2026).'
  cal: 'The calendar keeps the owner''s page-size rule, "some 8 MB" (Nov. 12, 2026: "Keep the page size rule and
    split the years"): its days'' documents already load when opened, and a part split further is a quarter, then
    a month.'
  fill: 'A split packs its parts to 70 percent of the budget: room to grow before the next split.'
  works: 'The owner, Nov. 19, 2026: "Do we need to split Works? ... I think we do." A page a letter, as Names.'
exempt:
  series.html: the one-page reader, all of the series by design; its days' blocks already load when opened (lazydays.py)
works:
  by: letter
