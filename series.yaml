# The series: its lists, their abbreviations, and where each is published.
# Order here is the order of the compiled reader.
title: The 1968 series
compiled_artifact: https://claude.ai/artifact/9VsXuvj8UhFT9pLFxVMav5
source_repo: https://github.com/impending2223/bib
home:
  h1: The 1968 series
  lede: 'Nine lists for the thriller, compiled into one reader: the Kennedy and Johnson years, the Republican opposition, the calendar for the 87th Congress and the 88th''s first session, the 1968 list, the Nixon years through Watergate, and the war in Vietnam.'
  logic:
    - 'The cross-references are live. A list and section such as K–J Adm. II.D opens that section. A bare "Also Opp." opens the same work or person in Opp. where it can be found, otherwise the top of the list. Calendar dates open the entry, and names after "Names:" open the person. Lines beginning "Elsewhere" were added in compilation: they find the same title or person in other lists, whether or not the note says so. {counts}'
    - Back returns from a jump, as does the browser's back. Hold the pointer on a link to preview it. Search covers every list; press / to open it. The Outline button lists the lists and the outline of the one you are in, and the handle on the right edge scrubs through it.
