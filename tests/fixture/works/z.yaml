    n: A chronology, in Chinese, of the PRC's diplomatic acts (statements, notes, protests, agreements, visits), from the Foreign Ministry's archive. This volume, II, runs Jan. 1957–Dec. 1964; Li Jiasong 黎家松 chief ed.; Shijie Zhishi Chubanshe 世界知识出版社, Beijing, 2001 (CIP date Oct. 2001; first printing Aug. 2001). No notes.
  - id: w.zhou-enlai-nianpu-1949
    editor:
      - Zhonggong Zhongyang Wenxian Yanjiushi 中共中央文献研究室
    title: Zhou Enlai nianpu, 1949–1976
    script: 周恩来年谱（一九四九—一九七六）
    trans: Chronological biography of Zhou Enlai, 1949–1976
    paren: 3 vols., Zhonggong Zhongyang Wenxian Yanjiushi 中共中央文献研究室 ed., Li Ping 力平 & Ma Zhisun 马芷荪 chief eds., 1997
    year: '1997'
    n: Three volumes. The Kissinger and Nixon meetings, day by day, from the Party's side. *Mao Zedong nianpu, 1949–1976* 毛泽东年谱（一九四九—一九七六） (2013) does the same for Mao.
  - id: w.zhou-enlai-shuxin-xuanji
