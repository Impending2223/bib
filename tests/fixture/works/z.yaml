    author:
      - Julian E. Zelizer
    title: 'Taxing America: Wilbur D. Mills, Congress, and the State, 1945–1975'
    year: '1998'
    n: The 1964 tax cut and Medicare from the chair. Mills and the Family Assistance Plan; Mills and revenue sharing.
