    title: Zhou Enlai waijiao huodong dashiji, 1949–1975
    script: 周恩来外交活动大事记（1949—1975）
    trans: Chronology of Zhou Enlai's diplomatic activities, 1949–1975
    paren: Zhonghua Renmin Gongheguo Waijiaobu Waijiaoshi Yanjiushi 中华人民共和国外交部外交史研究室 ed., Shijie Zhishi Chubanshe 世界知识出版社, 1993
    year: '1993'
    n: A chronology, in Chinese, of Zhou's diplomatic acts, day by day, from the Foreign Ministry's historians. No notes.
