# The works catalogue: cards whose id begins w.z. The fields: tools/bib/works.py. Run ./bib check after editing.
# tests/make_fixture.py: the cards the fixture's slice cites
cards:
  - id: w.zagoria-sino-soviet-conflict-1956
    author:
      - Donald S. Zagoria
    title: The Sino-Soviet Conflict, 1956–1961
    year: '1962'
  - id: w.zedong-jianguo-yilai-mao-zedong
    author:
      - Mao Zedong 毛泽东
    title: Jianguo yilai Mao Zedong wengao
    script: 建国以来毛泽东文稿
    trans: Manuscripts of Mao Zedong since the founding of the People's Republic
    paren: 13 vols., Zhonggong Zhongyang Wenxian Yanjiushi 中共中央文献研究室 ed., 1987–98
    year: 1987–98
    n: The first edition, 13 vols., Zhongyang Wenxian Chubanshe 中央文献出版社, internal circulation (neibu faxing), 1987–98; cited by volume and page in arabic ("9, 467"), as MacFarquhar and Schoenhals cite it. Vols. 9 (Jan. 1960–Dec. 1961) and 10 (1962–63), 1996; vol. 12 (1966–68), 1998. The revised and enlarged edition of 2023, 20 vols., is its own card, w.jianguo-yilai-mao-zedong ("XVI, 104"), whose volumes and pages differ.
  - id: w.zedong-mao-zedong-nianpu
    editor:
      - Zhonggong Zhongyang Wenxian Yanjiushi 中共中央文献研究室
    title: Mao Zedong nianpu, 1949–1976
    script: 毛泽东年谱（一九四九—一九七六）
    trans: Chronological biography of Mao Zedong, 1949–1976
    paren: 6 vols., Zhonggong Zhongyang Wenxian Yanjiushi 中共中央文献研究室 ed., Pang Xianzhi 逄先知 & Feng Hui 冯蕙 chief eds., 2013
    year: '2013'
