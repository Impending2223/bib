  - id: w.zhonghua-renmin-gongheguo-jiaoyu
    editor:
      - Zhongyang Jiaoyu Kexue Yanjiusuo
    title: Zhonghua Renmin Gongheguo Jiaoyu Dashiji, 1949–1982
    trans: A chronicle of education in the PRC, 1949–1982
    year: '1983'
  - id: w.zhonghua-renmin-gongheguo-waijiao-2001
    editor:
      - Li Jiasong 黎家松
    title: Zhonghua renmin gongheguo waijiao dashiji
    script: 中华人民共和国外交大事记
    trans: Chronology of the PRC's diplomacy
    volume: II
