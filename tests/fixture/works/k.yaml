# The works catalogue: cards whose id begins w.k. The fields: tools/bib/works.py. Run ./bib check after editing.
# tests/make_fixture.py: the cards the fixture's slice cites
cards:
  - id: w.kabaservice-rule-and-ruin
    author:
      - Geoffrey Kabaservice
    title: 'Rule and Ruin: The Downfall of Moderation and the Destruction of the Republican Party, from Eisenhower to the Tea Party'
    year: '2012'
    n: The moderates' side of the war. Most of the book is 1960–68.
  - id: w.kaplan-mcnamara-ascendancy-1961-1965
    author:
      - Lawrence S. Kaplan
      - Ronald D. Landa
      - Edward J. Drea
    title: The McNamara Ascendancy, 1961–1965
    year: '2006'
    online: https://history.defense.gov/Portals/70/Documents/secretaryofdefense/OSDSeries_Vol5.pdf
  - id: w.kempe-berlin-1961
    author:
      - Frederick Kempe
    title: 'Berlin 1961: Kennedy, Khrushchev, and the Most Dangerous Place on Earth'
    year: '2011'
  - id: w.kennedy-and-the-press
    editor:
      - Harold W. Chase
      - Allen H. Lerman
    title: 'Kennedy and the Press: The News Conferences'
    year: '1965'
  - id: w.khrushchev-dva-tsveta-vremeni
    c: '*Nikita Sergeevich Khrushchev: Dva tsveta vremeni* Никита Сергеевич Хрущев. Два цвета времени, 2 vols. (N. G. Tomilina ed., 2009)'
    n: Documents from his personal fond at RGANI. Vol. I, the 1930s to the early 1950s, and the struggle after Stalin's death, with three items of 1961–62; vol. II, 1950s–60s, his speeches, notes to the Presidium and dictations, agriculture, the party, culture.
  - id: w.khrushchev-khrushchev-remembers
    author:
      - Nikita S. Khrushchev
    translator:
      - Strobe Talbott
    title: Khrushchev Remembers
    year: '1970'
    translates: w.khrushchev-vremya-lyudi-vlast
  - id: w.khrushchev-khrushchev-remembers-1974
    author:
      - Nikita Khrushchev
    title: 'Khrushchev Remembers: The Last Testament'
    year: '1974'
  - id: w.khrushchev-vremya-lyudi-vlast
    author:
      - Nikita S. Khrushchev
    c: '*Vremya. Lyudi. Vlast''* Время. Люди. Власть. (1999)'
    n: The dictations complete, in four volumes. The earlier English books, *Khrushchev Remembers* (1970) and *The Last Testament* (1974), were cut and arranged by others; the complete English is *Memoirs of Nikita Khrushchev* (Sergei Khrushchev ed., 2004–07). The son's book was expanded in translation as *Nikita Khrushchev and the Creation of a Superpower* (2000). Check the son's Russian date, and expanded or abridged.
  - id: w.knaggs-two-party-texas
    author:
      - John R. Knaggs
    title: 'Two-Party Texas: The John Tower Era, 1961–1984'
    year: '1986'
    n: Cal.
  - id: w.kruse-white-flight
    author:
      - Kevin M. Kruse
    title: 'White Flight: Atlanta and the Making of Modern Conservatism'
    year: '2005'
    n: Also Opp. Cal.
  - id: w.kyvig-explicit-and-authentic-acts
    author:
      - David E. Kyvig
    title: 'Explicit and Authentic Acts: Amending the U.S. Constitution, 1776–1995'
    year: '1996'
