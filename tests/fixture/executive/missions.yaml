name: Chiefs of mission
under: state
order: 90
law:
  - act: Foreign Service Act of 1946
    date: '1946-08-13'
    tags: [appointment, creates]
    cite: ch. 957, §§ 401, 411, 60 Stat. 999, 1002, 1004
    usc: 22 U.S.C. §§ 841, 901 (1958)
    does: Chiefs of mission appointed by the President, by and with the advice and consent of the Senate; the classes of chief of mission.
  - act: Foreign Service Act of 1946
    date: '1946-08-13'
    until: '1956-07-28'
    tags: [pay]
    cite: ch. 957, § 411, 60 Stat. 999, 1002
    usc: 22 U.S.C. § 866 (1952)
    does: 'Chiefs of mission in four salary classes, the President classifying the posts: class 1, $25,000 a year; class 2, $20,000; class 3, $17,500; class 4, $15,000.'
  - act: Foreign Service Act Amendments of 1956
    date: '1956-07-28'
    until: 1964-07
    tags: [pay]
    cite: ch. 770, § 2, 70 Stat. 704
    usc: 22 U.S.C. § 866 (1958)
    does: Class 1, $27,500 a year; class 2, $25,000; class 3, $22,500; class 4, $20,000; from the first pay period after July 28, 1956.
  - act: Federal Executive Salary Act of 1964
    date: '1964-08-14'
    effective: 1964-07
    until: 1967-12
    tags: [pay]
    cite: Pub. L. 88-426, § 306(b), 78 Stat. 400, 428
    usc: 22 U.S.C. § 866 (1964)
    does: 'The classes tied to the Executive Schedule: class 1 at the rate of level II ($30,000 a year), class 2 at level III ($28,500), class 3 at level IV ($27,000), class 4 at level V ($26,000).'
  - act: Federal Salary Act of 1967
    date: '1967-12-16'
    effective: 1967-12
    until: 1969-02
    tags: [pay]
    cite: Pub. L. 90-206, § 215, 81 Stat. 613, 638
    usc: 5 U.S.C. §§ 5314–5316 (1970)
    does: 'Classes 2 to 4 raised with levels III to V: $29,500, $28,750 and $28,000 a year; class 1 at $30,000.'
  - act: Federal Salary Act of 1967, § 225
    date: '1967-12-16'
    effective: 1969-02
    tags: [pay]
    cite: Pub. L. 90-206, § 225(h)–(j), 81 Stat. 613, 644
    usc: 2 U.S.C. §§ 358–360 (1970)
    does: 'Class 1, $42,500 a year; class 2, $40,000; class 3, $38,000; class 4, $36,000: levels II to V on the President''s recommendation of Jan. 15, 1969 (34 Fed. Reg. 2241).'
n: 'Every chief of mission who served between Jan. 20, 1953, and Aug. 31, 1974, from POCOM, with the deputies, delegations, and embassy officers named in the series'' FRUS documents. Grouped by the regional bureaus of the 1960s. Chargés d''affaires ad interim are acting. Took office: the presentation of credentials. Nominations and confirmations from the Congressional Record where found.'
