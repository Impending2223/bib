unit: nsc
name: National Security Council
under: eop
order: 40
law:
  - act: National Security Act of 1947
    date: '1947-07-26'
    effective: '1947-09-18'
    tags: [creates, powers]
    cite: ch. 343, § 101, 61 Stat. 495, 496
    usc:
      - 50 U.S.C. § 402 (1958)
    does: 'Establishes the National Security Council, the President presiding: to advise the President on the integration of domestic, foreign, and military policies relating to the national security; to assess and appraise the objectives, commitments, and risks of the United States in relation to its military power; to consider policies of common interest to the departments and agencies concerned with the national security; to report to the President. Members: the President; the Secretaries of State, Defense, the Army, the Navy, and the Air Force; the Chairman of the National Security Resources Board; and such Secretaries of executive departments and chairmen of the Munitions Board and the Research and Development Board as the President designates, their offices held with the Senate''s consent.'
  - act: National Security Act Amendments of 1949
    date: '1949-08-10'
    tags: [reorganizes]
    cite: ch. 412, § 3, 63 Stat. 578, 579
    usc:
      - 50 U.S.C. § 402(a) (1958)
    does: 'Members: the President, the Vice President, the Secretaries of State and Defense, the Chairman of the National Security Resources Board, and such Secretaries and Under Secretaries of other executive and of the military departments as the President appoints to it, with the Senate''s consent to their offices. The service Secretaries no longer members by statute.'
  - act: Reorganization Plan No. 4 of 1949
    date: '1949-08-20'
    tags: [reorganizes]
    cite: 63 Stat. 1067
    does: Transfers the Council and the National Security Resources Board to the Executive Office of the President.
  - act: Reorganization Plan No. 3 of 1953
    date: '1953-06-12'
    until: '1958-07-01'
    tags: [reorganizes]
    cite: 67 Stat. 634
    does: Abolishes the National Security Resources Board; transfers the functions of its Chairman, his membership on the Council included, to the Director of the Office of Defense Mobilization.
  - act: Reorganization Plan No. 7 of 1953
    date: '1953-08-01'
    until: '1955-06-30'
    tags: [reorganizes]
    cite: 67 Stat. 639
    does: Transfers the functions of the Director for Mutual Security, his membership on the Council included, to the Director of the Foreign Operations Administration. The Administration abolished June 30, 1955 (Executive Order 10610); its Director's seat with it.
  - act: Reorganization Plan No. 1 of 1958
    date: '1958-07-01'
    tags: [reorganizes]
    cite: 72 Stat. 1799
    does: Transfers the membership of the Director of the Office of Defense Mobilization to the Director of the new Office of Defense and Civilian Mobilization (named the Office of Civil and Defense Mobilization, Aug. 26, 1958).
  - act: Act of Sept. 22, 1961
    date: '1961-09-22'
    tags: [reorganizes]
    cite: Pub. L. 87-296, 75 Stat. 630
    does: Renames the Office of Civil and Defense Mobilization the Office of Emergency Planning; its Director a member.
  - act: Supplemental Appropriation Act, 1969
    date: '1968-10-21'
    tags: [reorganizes]
    cite: Pub. L. 90-608, § 402, 82 Stat. 1190, 1194
    does: Renames the Office of Emergency Planning the Office of Emergency Preparedness.
  - act: Reorganization Plan No. 1 of 1973
    date: '1973-07-01'
    tags: [reorganizes]
    cite: 87 Stat. 1089, 1090
    does: 'Abolishes the Office of Emergency Preparedness and its Director''s functions as a member of the Council. Members thereafter: the President, the Vice President, the Secretaries of State and Defense.'
n: 'Members by statute (no office here for each seat): the President (chairman), the Vice President, the Secretaries of State and Defense; the Director for Mutual Security (to Aug. 1, 1953) and of the Foreign Operations Administration (to June 30, 1955); the Director of the Office of Defense Mobilization (from June 12, 1953), of Civil and Defense Mobilization (1958), of Emergency Planning (1961), of Emergency Preparedness (1968), to July 1, 1973. The Director of Central Intelligence and the Chairman of the Joint Chiefs of Staff attend as advisers. Others sit by the President''s invitation. Staff under the Special Assistant (Assistant from 1969), a White House officer, and the Executive Secretary, the officer the Act provides. The Planning Board and the Operations Coordinating Board abolished Feb. 18–19, 1961; the Executive Committee, Oct. 1962–1963; the Review Group, Under Secretaries Committee and interdepartmental groups set up by NSDM 2, Jan. 20, 1969. Membership: CDIR at each edition; Government Organization Manual, 1958, 1972–73.'
