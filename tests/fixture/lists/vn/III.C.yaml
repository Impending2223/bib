entries:
  - id: vn.who.durbrow-elbridge
    s: Durbrow, Elbridge
    r: Ambassador to Saigon, 1957–61
    n: Pressed Diệm to reform. Diệm wanted him out.
  - id: vn.who.lansdale-edward-g
    s: Lansdale, Edward G.
    r: Pentagon special operations, 1957–63; senior liaison officer in Saigon, 1965–68
    n: Diệm's sponsor, 1954–55. Kept from Saigon under Kennedy by Rusk and McNamara. Mongoose. See II.H.2.
  - id: vn.who.nolting-frederick-e-jr
    s: Nolting, Frederick E., Jr.
    r: Ambassador to Saigon, 1961–63
    n: 'On leave through much of the Buddhist crisis, June–July 1963. Voice: memoir (II.H.1).'
