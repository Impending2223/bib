# Cal.: page text and outline. Entries live in the files named by 'file'.
# The list's own page_title, h1, lede and index_logic are the index's (cal.html); its logic shows on the index and on
# every year's page, before the year's own (`split:`, a part a year; tools/bib/calsplit.py, STYLE 13).
# tests/make_fixture.py: the outline cut to the fixture's slice
page_title: Calendar, January 1960–1970
h1: Calendar of the Eisenhower, Kennedy and Johnson years, January 6, 1960, to January 20, 1969; with the presidential primaries and conventions of 1960 to 1976
lede: 'Executive, legislative, judicial, and state events from the opening of the 86th Congress''s second session, Jan. 6, 1960, to Nixon''s inauguration, Jan. 20, 1969: the 86th Congress''s second session, the 87th through the 90th, and the 91st''s opening; the Eisenhower administration''s last year, Kennedy''s, and Johnson''s. After the inauguration, the foreign leaderships'' records carried on (the owner, Nov. 14, 2026: "The calendar extends as far as I want it to extend"). A page a year, 1960 to 1970, and one for the primaries of 1972 and 1976. This page is the calendar''s index.'
logic:
  - Seventh list in the series. This one is Cal. It points into K–J Adm. and K–J Cong., into Viet. for the war, and into the earlier lists where they hold the record.
  - 'How to read it. Laid out by day. Each day gives its date, the *New York Times* for that date, the entries for events that began that day, each under its thread in small capitals, and the day''s documents, closed until opened: the President''s (American Presidency Project) and FRUS, every document dated that day. A later day of an event that ran several days points back to it. The line says what happened. The note gives sources: the first entry of each thread carries its bibliography, and later entries point back by date ("See Apr. 15"). Works are cited in full at their first appearance in each year''s calendar, by short form after, each linked to its entry in Works, the A–Z bibliography. Names point to Part III of the lists. Presidential messages, speeches, and press conferences are cited by title and date; all are in the *Public Papers* (Eisenhower''s 1960–61 volume; Kennedy''s for 1961, 1962 and 1963; Johnson''s from Nov. 22, 1963, in his volumes for 1963–64 through 1968–69) and on the American Presidency Project (K–J Adm. II.K). FRUS means *Foreign Relations of the United States*, by subseries and volume: *1958–1960* for Eisenhower''s last year, *1961–1963*, and, from Nov. 22, 1963, *1964–1968*. Votes link to Voteview where the roll call is identified. "Check" marks a detail to verify.'
  - 'Indicators. Each month opens with a table of the figures that report on it, filed by the period they cover, not the date they were issued: months in their month, quarters in the quarter''s last month, fiscal years (July–June) in June, calendar years in December. Two values: as first reported, with its release date, and as revised today. First releases are from ALFRED (CPI, unemployment, payrolls, industrial production, GNP, real GNP; the deflator is GNP over real GNP in the same release). Wholesale prices, the budgets, the federal sector of the national accounts, and the balance of payments are from the next January''s *Economic Report*; for those, first reported means as reported then. Three budgets: the administrative budget (federal funds; the deficit of the headlines), the consolidated cash statement (with the trust funds), and the federal sector of the national income accounts. The unified budget came with fiscal 1969; today''s budget figures are on that basis. The over-all balance of payments is no longer published. The output gap: the CEA''s estimates then and the CBO''s now, in separate rows, since the concepts differ. Monthly changes are from the prior month, not annualized; CPI, wholesale prices, and industrial production add the change from a year earlier (y/y). Quarterly changes are at annual rates in both columns. Concepts and sources: on each year''s page, after the month where each series first appears there, what concerns that year''s months, each row''s name linked to it; the whole statement, and every series in full, on the Indicators page. A figure''s source shows on hover. Data: indicators/ in the repository.'
index_logic:
  - 'Parts: the contents of the whole calendar, its months by year and its tables and maps, each linked to its place on its year''s page; then the threads, each with the years it has entries in. Each year''s page has the same contents and its own index of threads: each thread''s statement for that year, its dates there, and, muted, its last date in an earlier year and its next in a later one.'
