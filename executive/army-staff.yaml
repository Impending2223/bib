# The Army Staff and the major Army commands, 1953-74. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: army-staff
name: The Army Staff and major Army commands
under: army
order: 50
law:
  - act: Army Organization Act of 1950
    date: '1950-06-28'
    until: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 383, title II, 64 Stat. 263, 265
    does: 'The Army Staff: the Chief of Staff, a Vice Chief of Staff, Deputy and Assistant Chiefs of Staff, general officers detailed; prepares plans for the employment, organizing, supplying, and training of the Army; acts as the agent of the Secretary and the Chief of Staff.'
  - act: Title 10, United States Code, enacted
    date: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 1041, 70A Stat. 1, 161
    usc: 10 U.S.C. §§ 3031–3036 (1958)
    does: 'The Army Staff restated: composition, general duties, the Vice Chief of Staff, the Deputy and Assistant Chiefs.'
  - act: Department of Defense Reorganization Act of 1958
    date: '1958-08-06'
    tags: [powers]
    cite: Pub. L. 85-599, § 4(a), (g), 72 Stat. 514, 516
    usc: 10 U.S.C. §§ 3032, 3034 (1958)
    does: The Chief of Staff supervises such members and organizations of the Army as the Secretary determines, consistent with the full operational command of the unified and specified commanders; the Army Staff prepares for the employment of the Army.
n: The Chief of Staff is in the Joint Chiefs of Staff unit (jcs.army-chief). Officers detailed by the Secretary of the Army; the commands are assignments, the officers' grades confirmed by the Senate. Staff holders from the Congressional Directory editions, the commands from Wikipedia's lists of commanders; where only a year or month is known the holder's note says Check.
