law:
  - act: Airways Modernization Act of 1957
    date: '1957-08-14'
    until: '1958-11-01'
    tags: [creates, powers, appointment]
    cite: 'Pub. L. 85-133, 71 Stat. 349'
    does: Establishes an Airways Modernization Board of three, a Chairman appointed by the President with the advice and consent of the Senate, the Secretary of Defense and the Secretary of Commerce, to develop and select systems of navigation and traffic control for civil and military aviation; to expire June 30, 1960.
  - act: Federal Aviation Act of 1958
    date: '1958-08-23'
    tags: [creates, powers, reorganizes]
    cite: 'Pub. L. 85-726, § 301, 72 Stat. 731, 744'
    usc: '49 U.S.C. § 1341 (1964)'
    does: Establishes the Federal Aviation Agency, headed by an Administrator; transfers to it the functions of the Civil Aeronautics Administration, the Airways Modernization Board, and the safety rule-making of the Civil Aeronautics Board; repeals the Airways Modernization Act. Most provisions in effect sixty days after the first Administrator qualified (Dec. 31, 1958).
  - act: Executive Order 10786
    date: '1958-11-01'
    tags: [reorganizes]
    url: https://www.presidency.ucsb.edu/documents/executive-order-10786-transferring-functions-the-airways-modernization-board-the
    does: Under § 304 of the Federal Aviation Act, transfers all functions of the Airways Modernization Board and its Chairman, with its records, property, employees and funds, to the Administrator of the Federal Aviation Agency.
  - act: Department of Transportation Act
    date: '1966-10-15'
    effective: '1967-04-01'
    tags: [reorganizes]
    cite: 'Pub. L. 89-670, § 3(e), 80 Stat. 931, 932'
    usc: '49 U.S.C. § 1652 (1970)'
    does: The Federal Aviation Agency transferred to the Department of Transportation as the Federal Aviation Administration, headed by an Administrator.
n: 'Quesada sworn as the first Administrator Nov. 1, 1958; the Agency assumed its full functions Dec. 31, 1958, superseding the Civil Aeronautics Administration (Department of Commerce). From Apr. 1, 1967, a modal administration of the Department of Transportation. Source for the dates: FAA Historical Chronology, 1926–1996 (FAA).'
