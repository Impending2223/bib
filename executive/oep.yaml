# The Office of Defense Mobilization (1950; in the Executive Office by plan, 1953), consolidated with the Federal
# Civil Defense Administration as the Office of Defense and Civilian Mobilization (1958), renamed the Office of
# Civil and Defense Mobilization (1958), the Office of Emergency Planning (1961), and the Office of Emergency
# Preparedness (1968); abolished July 1, 1973. With the National Security Resources Board, merged into it in 1953,
# and the President's telecommunications adviser and Director of Telecommunications Management. Kept by hand.
# Holders known only from the Congressional Directory (CDIR <edition>) carry year dates and a Check.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: oep
name: Office of Defense Mobilization
names:
  - {name: Office of Defense and Civilian Mobilization, from: '1958-07-01'}
  - {name: Office of Civil and Defense Mobilization, from: '1958-08-26'}
  - {name: Office of Emergency Planning, from: '1961-09-22'}
  - {name: Office of Emergency Preparedness, from: '1968-10-21'}
under: eop
order: 50
until: '1973-07-01'
law:
  - act: Executive Order 10193
    date: '1950-12-16'
    cite: '15 Fed. Reg. 9031'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10193-providing-for-the-conduct-the-mobilization-effort-the-government
    until: '1953-06-12'
    tags: [creates, powers]
    does: 'Establishes in the Executive Office an Office of Defense Mobilization under a Director, to direct, control, and coordinate all mobilization activities of the executive branch, under the Defense Production Act of 1950.'
  - act: Reorganization Plan No. 3 of 1953
    date: '1953-06-12'
    cite: '67 Stat. 634'
    usc: '50 U.S.C. App. § 2153 note (1958)'
    tags: [creates, appointment, vacancy, pay, reorganizes]
    does: 'Establishes in the Executive Office a new Office of Defense Mobilization under a Director appointed by the President by and with the advice and consent of the Senate ($22,500), with a Deputy Director so appointed ($17,500) who acts in the Director''s absence or a vacancy; transfers to the Director the functions of the Chairman of the National Security Resources Board, including membership on the National Security Council, and the stockpiling functions of the Munitions Board; abolishes the Board.'
  - act: Executive Order 10460
    date: '1953-06-16'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10460-providing-for-the-performance-the-director-defense-mobilization
    tags: [powers]
    does: 'Provides for the performance by the Director of Defense Mobilization of telecommunications functions formerly delegated to the Telecommunications Adviser to the President, among others.'
  - act: Reorganization Plan No. 1 of 1958
    date: '1958-07-01'
    cite: '72 Stat. 1799'
    usc: '50 U.S.C. App. § 2271 note (1958)'
    tags: [reorganizes, creates, appointment, vacancy, pay]
    does: 'Transfers to the President the functions of the Office of Defense Mobilization and the Federal Civil Defense Administration and consolidates them as the Office of Defense and Civilian Mobilization: a Director at the pay of a head of department, a Deputy Director, and three Assistant Directors, all appointed by the President by and with the advice and consent of the Senate; the Deputy acts in the Director''s absence or a vacancy; up to ten Regional Directors; the Director a member of the National Security Council.'
  - act: Executive Order 10773
    date: '1958-07-01'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10773-delegating-and-transferring-certain-functions-and-affairs-the-office
    tags: [powers]
    does: 'Delegates to the Office of Defense and Civilian Mobilization and its Director the functions transferred to the President by the plan.'
  - act: Act of Aug. 26, 1958
    date: '1958-08-26'
    cite: 'Pub. L. 85-763, 72 Stat. 861'
    usc: '50 U.S.C. App. § 2271 note (1958)'
    tags: [reorganizes]
    does: Renames the Office of Defense and Civilian Mobilization the Office of Civil and Defense Mobilization.
  - act: Executive Order 10952
    date: '1961-07-20'
    cite: '26 Fed. Reg. 6577'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10952-assigning-civil-defense-responsibilities-the-secretary-defense-and
    tags: [reorganizes]
    does: 'Delegates the civil defense functions of the Federal Civil Defense Act to the Secretary of Defense; the Director keeps the coordination of civil and defense mobilization.'
  - act: Act of Sept. 22, 1961
    date: '1961-09-22'
    cite: 'Pub. L. 87-296, 75 Stat. 630'
    usc: '50 U.S.C. App. § 2271 note (1964)'
    tags: [reorganizes]
    does: Renames the Office of Civil and Defense Mobilization the Office of Emergency Planning.
  - act: Second Supplemental Appropriations Act, 1969
    date: '1968-10-21'
    cite: 'Pub. L. 90-608, ch. IV, § 402, 82 Stat. 1190, 1194'
    usc: '50 U.S.C. App. § 2271 note (1970)'
    tags: [reorganizes]
    does: Renames the Office of Emergency Planning the Office of Emergency Preparedness; references in other laws to follow.
  - act: Reorganization Plan No. 1 of 1973
    date: '1973-07-01'
    cite: '87 Stat. 1089'
    usc: '5 U.S.C. App. (1970 Supp. IV)'
    tags: [reorganizes]
    does: 'Transfers the functions of the Office of Emergency Preparedness and its Director to the President and abolishes the Office, its Director, Deputy Director, Assistant Directors, and Regional Directors, and the Director''s membership on the National Security Council. The functions went to the Administrator of General Services, the Secretary of Housing and Urban Development, and the Secretary of the Treasury (Executive Order 11725).'
