# The President's science adviser: the Special Assistant to the President for Science and Technology (Nov. 1957),
# the President's Science Advisory Committee (from the Office of Defense Mobilization's Science Advisory Committee,
# Nov. 1957), and the Office of Science and Technology (1962–73). Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: ost
name: Office of Science and Technology
under: eop
order: 60
from: '1957-11-07'
until: '1973-07-01'
law:
  - act: Reorganization Plan No. 2 of 1962
    date: '1962-06-08'
    cite: '76 Stat. 1253'
    usc: '42 U.S.C. § 1861 note (1964)'
    tags: [creates, appointment, vacancy, pay, powers]
    does: 'Establishes in the Executive Office the Office of Science and Technology, under a Director ($22,500) and a Deputy Director ($20,500), both appointed by the President by and with the advice and consent of the Senate; the Deputy acts in the Director''s absence or a vacancy; transfers from the National Science Foundation the functions of advising the President on coordinated policy for basic research and education in the sciences and of evaluating the Government''s scientific research programs (Part I).'
  - act: Reorganization Plan No. 1 of 1973
    date: '1973-07-01'
    cite: '87 Stat. 1089'
    usc: '5 U.S.C. App. (1970 Supp. IV)'
    tags: [reorganizes]
    does: 'Transfers the functions of the Office and its Director and Deputy Director to the Director of the National Science Foundation and abolishes the Office (§§ 2, 3(a)(5)).'
n: 'The office of Special Assistant announced by Eisenhower Nov. 7, 1957, after Sputnik. Before the Office, the Special Assistant''s staff was in the White House Office. Federal Council for Science and Technology, Executive Order 10807, Mar. 13, 1959, the Special Assistant chairman.'
