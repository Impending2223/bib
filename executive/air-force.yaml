  cite: ch. 343, § 207, 61 Stat. 495, 502
  does: Establishes the Department of the Air Force, an executive department within the National Military Establishment,
    headed by a Secretary of the Air Force appointed from civilian life by the President with the advice and consent
    of the Senate; an Under Secretary and two Assistant Secretaries.
