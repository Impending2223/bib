under: president
order: 500
until: '1955-06-30'
law:
  - act: Mutual Security Act of 1951
    date: '1951-10-10'
    until: '1953-08-01'
    tags: [creates, appointment, powers]
    cite: ch. 479, §§ 501, 502, 65 Stat. 373
    does: 'A Director for Mutual Security in the Executive Office of the President, appointed by the President with the advice and consent of the Senate: the continuous supervision and general direction of the military, economic, and technical assistance programs. The Economic Cooperation Administration continued as the Mutual Security Agency, under the Director.'
  - act: Reorganization Plan No. 7 of 1953
    date: '1953-08-01'
    tags: [creates, reorganizes, appointment, vacancy, powers]
    cite: 67 Stat. 639
    does: Establishes the Foreign Operations Administration under a Director, appointed by the President with the advice and consent of the Senate (the Secretary of State to advise on the appointment and tenure), and a Deputy Director, who acts in a vacancy; six further offices, appointed the same way. Transfers to the Director the functions of the Director for Mutual Security, the Mutual Security Agency, and the Technical Cooperation Administration; abolishes the office of Director for Mutual Security and the Mutual Security Agency.
  - act: Executive Order 10610
    date: '1955-05-09'
    effective: '1955-06-30'
    tags: [reorganizes]
    cite: 20 Fed. Reg. 3179
    does: 'Under the Mutual Security Act of 1954, §§ 521, 525: the functions and offices of the Foreign Operations Administration, but for its Director, to the Secretary and the Department of State (the International Cooperation Administration), the military assistance functions to the Secretary of Defense, at the close of June 30, 1955.'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10610-administration-mutual-security-and-related-functions
n: In the Executive Office of the President as the Mutual Security Agency; an independent agency as the Foreign Operations Administration, Aug. 1, 1953–June 30, 1955. Succeeded by the International Cooperation Administration in the Department of State.
