# The Central Intelligence Agency. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: cia
name: Central Intelligence Agency
under: president
order: 500
law:
  - act: National Security Act of 1947
    date: '1947-07-26'
    tags: [creates, powers, appointment]
    cite: 'ch. 343, § 102, 61 Stat. 495, 497'
    usc: '50 U.S.C. § 403 (1958)'
    does: Establishes under the National Security Council a Central Intelligence Agency, with a Director of Central Intelligence its head; the Director appointed by the President with the advice and consent of the Senate, from the commissioned officers of the armed services or from civilian life. The Agency to advise the Council, correlate and evaluate intelligence, and perform services of common concern; no police, subpoena, law-enforcement or internal-security functions.
  - act: Central Intelligence Agency Act of 1949
    date: '1949-06-20'
    tags: [powers]
    cite: 'ch. 227, 63 Stat. 208'
    usc: '50 U.S.C. §§ 403a–403j (1958)'
    does: The Agency's administration. Procurement, education and training, travel and allowances; the Director may spend funds without regard to the laws on public money, on his certificate alone, for objects of a confidential nature; exempts the Agency from disclosing its organization, functions, names, titles, salaries or numbers of personnel.
n: The Agency's officers below the Director and Deputy Director are the Agency's employees, appointed by the Director. The directorates and their heads are the Agency's own organization, not set by statute; dates for them are from the FRUS lists of persons and other secondary sources, and many need checking.
