# The Council of Economic Advisers. Kept by hand.
# Dates of office: the oath and separation dates in the Council's annual reports to the President,
# printed with the Economic Report (ERP 1962-1975, FRASER), cited as "ERP 1975, p. 235".
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: cea
name: Council of Economic Advisers
under: eop
order: 30
law:
  - act: Employment Act of 1946
    date: '1946-02-20'
    cite: 'ch. 33, § 4, 60 Stat. 23, 24'
    usc: '15 U.S.C. § 1023 (1958)'
    tags: [creates, appointment, pay, powers]
    does: 'Creates in the Executive Office of the President a Council of Economic Advisers of three members, appointed by the President by and with the advice and consent of the Senate, each exceptionally qualified to analyze and interpret economic developments; $15,000 a year; the President designates one chairman and one vice chairman. The Council assists in the Economic Report, gathers information on economic trends, appraises the Government''s programs, and reports to the President.'
  - act: Reorganization Plan No. 9 of 1953
    date: '1953-08-01'
    cite: '67 Stat. 644'
    usc: '15 U.S.C. § 1023 note (1958)'
    url: https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-9-1953-concerning-the
    tags: [powers, reorganizes]
    does: 'Transfers to the Chairman the Council''s functions of employing and fixing the pay of its staff (§ 4(b)) and of reporting to the President (§ 4(c)); abolishes the vice chairman.'
