from: '1957-09-09'
law:
  - act: Civil Rights Act of 1957, part I
    date: '1957-09-09'
    tags: [creates, appointment, powers, vacancy]
    cite: 'Pub. L. 85-315, §§ 101–106, 71 Stat. 634'
    usc: ['42 U.S.C. §§ 1975–1975e (1958)']
    does: 'Creates in the executive branch a Commission on Civil Rights: six members appointed by the President, by and with the advice and consent of the Senate, not more than three of one party; the President designates a Chairman and a Vice Chairman, who acts in the Chairman''s absence or disability or in a vacancy. To investigate allegations that citizens are deprived of the right to vote by reason of color, race, religion, or national origin; to study legal developments constituting a denial of equal protection; to appraise federal laws and policies. Hearings and subpenas. To report within two years and cease sixty days after.'
  - act: Mutual Security Appropriation Act, 1960, title IV
    date: '1959-09-28'
    tags: [powers]
    cite: 'Pub. L. 86-383, title IV, 73 Stat. 717, 724'
    usc: '42 U.S.C. § 1975c(b) (1958 Supp. I)'
    does: The Commission's life extended to four years from enactment of the 1957 Act.
  - act: Judiciary Appropriation Act, 1962 (title IV)
    date: '1961-09-21'
    tags: [powers]
    cite: 'Pub. L. 87-264, title IV, 75 Stat. 545, 559'
    usc: '42 U.S.C. § 1975c(b) (1958 Supp. III)'
    does: The Commission's life extended to Sept. 30, 1963.
  - act: Act of Oct. 17, 1963
    date: '1963-10-17'
    tags: [powers]
    cite: 'Pub. L. 88-152, § 2, 77 Stat. 271'
    usc: '42 U.S.C. § 1975c(b) (1964)'
    does: The Commission's life extended to Sept. 30, 1964 (a section added to a private act for the relief of Elizabeth G. Mason).
  - act: Civil Rights Act of 1964, title V
    date: '1964-07-02'
    tags: [powers]
    cite: 'Pub. L. 88-352, §§ 501–505, 78 Stat. 241, 249'
    usc: ['42 U.S.C. §§ 1975a–1975d (1964)']
    does: 'Duties enlarged: a national clearinghouse for information on denials of equal protection in voting, education, housing, employment, public facilities, transportation, and the administration of justice; investigation of vote frauds. Final report by Jan. 31, 1968.'
  - act: Act of Dec. 14, 1967
    date: '1967-12-14'
    tags: [powers]
    cite: 'Pub. L. 90-198, 81 Stat. 582'
    usc: '42 U.S.C. § 1975c(b) (1970)'
    does: The Commission's life extended to Jan. 31, 1973.
  - act: Act of Nov. 25, 1970
    date: '1970-11-25'
    tags: [pay, powers]
    cite: 'Pub. L. 91-521, 84 Stat. 1356'
    usc: ['42 U.S.C. §§ 1975b, 1975d (1970)']
    does: Members' compensation and the Staff Director's; appropriations authorized.
  - act: Act of Oct. 14, 1972
    date: '1972-10-14'
    tags: [powers]
    cite: 'Pub. L. 92-496, 86 Stat. 813'
    usc: ['42 U.S.C. §§ 1975a–1975e (1970 Supp. II)']
    does: The Commission's life extended; its jurisdiction extended to discrimination because of sex.
n: Members as the Congressional Directory lists them at each edition and their biographies; dates known only to the year carry a Check.
