unit: navy-staff
name: Office of the Chief of Naval Operations and the fleets
under: navy
order: 50
law:
  - act: Title 10, United States Code, enacted
    date: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 1041, 70A Stat. 1, 281
    usc: 10 U.S.C. §§ 5081–5087 (1958)
    does: 'The Office of the Chief of Naval Operations: the Chief, a Vice Chief, Deputy and Assistant Chiefs; the Chief commands the operating forces under the Secretary of the Navy.'
  - act: Department of Defense Reorganization Act of 1958
    date: '1958-08-06'
    tags: [powers]
    cite: Pub. L. 85-599, § 4(b), 72 Stat. 514, 516
    usc: 10 U.S.C. § 5081(c) (1958)
    does: The Chief of Naval Operations supervises such members and organizations of the Navy and Marine Corps as the Secretary determines, consistent with the full operational command of the unified and specified commanders.
n: 'The Chief of Naval Operations is in the Joint Chiefs of Staff unit (jcs.cno). Fleet commanders are assigned; the fleets serve under the unified commanders (commands). Dates from Wikipedia''s lists of commanders; months only where so given: Check days.'
