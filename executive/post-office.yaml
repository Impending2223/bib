# The Post Office Department, to July 1, 1971. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Sources: the Congressional Directory (CDIR, by edition; its biographies of the Postmasters General and their
# deputies give nominations and confirmations), the Public Papers (APP), Wikipedia (leads only), the Statutes.
unit: post-office
name: Post Office Department
under: president
order: 70
until: '1971-07-01'
law:
  - act: Act of June 8, 1872 (Post Office Department)
    date: '1872-06-08'
    tags: [creates, appointment]
    cite: 'ch. 335, §§ 1–2, 17 Stat. 283, 284'
    usc: ['5 U.S.C. § 361 (1958)', '5 U.S.C. § 363 (1958)']
    until: '1960-09-02'
    does: An executive department to be known as the Post Office Department, a Postmaster General its head, appointed by the President with the Senate's consent, for the term of the President by whom appointed and one month thereafter; Assistant Postmasters General (R.S. §§ 388–389).
  - act: Reorganization Plan No. 3 of 1949
    date: '1949-08-20'
    tags: [powers, reorganizes, appointment]
    cite: '63 Stat. 1066'
    usc: '5 U.S.C. § 133z-15 note (1958)'
    until: '1960-09-02'
    does: The functions of all subordinate officers and agencies, the Assistant Postmasters General included, transferred to the Postmaster General, who may delegate them (§ 1). A Deputy Postmaster General (§ 2); four Assistant Postmasters General, in place of the First to Fourth (§§ 3, 5); an Advisory Board, the Postmaster General chairman and the Deputy vice chairman, seven members from the public (§ 4). Transmitted June 20, 1949.
  - act: Act of Sept. 2, 1960 (Title 39, U.S. Code, enacted)
    date: '1960-09-02'
    tags: [creates, powers, appointment]
    cite: 'Pub. L. 86-682, § 1, 74 Stat. 578, 579'
    usc: '39 U.S.C. §§ 301–309 (1964)'
    until: '1971-07-01'
    does: The Post Office Department continued (§ 301). The Postmaster General its head, vested with the functions of all subordinate officers and agencies, for the term of the President by whom appointed and one month (§ 302). A Deputy (§ 304) and five Assistant Postmasters General (§ 305), appointed by the President with the Senate's consent, to perform such duties as the Postmaster General designates. The Advisory Board continued (§ 306). A General Counsel (§ 307). Delegation (§ 309).
  - act: Federal Executive Salary Act of 1964
    date: '1964-08-14'
    effective: '1964-07'
    tags: [pay]
    cite: 'Pub. L. 88-426, title III, § 303, 78 Stat. 400, 415'
    usc: ['5 U.S.C. § 5312 (1970)', '5 U.S.C. §§ 5314–5316 (1970)']
    does: 'Postmaster General, level I; Deputy Postmaster General, level III; the five Assistant Postmasters General and the General Counsel, level IV; the Chief Postal Inspector, level V.'
  - act: Postal Reorganization Act, § 4(a)
    date: '1970-08-12'
    effective: '1971-07-01'
    tags: [reorganizes]
    cite: 'Pub. L. 91-375, § 4(a), 84 Stat. 719, 773'
    usc: '39 U.S.C. § 201 note (1970)'
    does: All functions, powers and duties of the Post Office Department and the Postmaster General transferred to the United States Postal Service; the Department and the office of Postmaster General abolished. In effect on the day set by the Board of Governors, July 1, 1971.
