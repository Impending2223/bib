# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: sacb
name: Subversive Activities Control Board
under: president
order: 500
until: '1973-06-30'
law:
  - act: Subversive Activities Control Act of 1950 (Internal Security Act of 1950, title I)
    date: '1950-09-23'
    tags: [creates, appointment, powers]
    cite: 'ch. 1024, § 12, 64 Stat. 987, 997'
    usc: '50 U.S.C. § 791 (1958)'
    does: 'Creates the Board: five members appointed by the President, by and with the advice and consent of the Senate, for three years; not more than three of one party; the President designates the Chairman; removable upon notice and hearing for neglect of duty or malfeasance in office, but for no other cause. On application of the Attorney General, to determine whether an organization is a Communist-action or Communist-front organization, and order it to register.'
  - act: Act of Jan. 2, 1968
    date: '1968-01-02'
    tags: [powers]
    cite: 'Pub. L. 90-237, 81 Stat. 765'
    usc: ['50 U.S.C. §§ 786, 792–793 (1970)']
    does: The registration provisions replaced, after Albertson v. SACB (1965), by Board determinations and public registers of the organizations and their members.
n: 'Members as the Congressional Directory lists them at each edition and their biographies. The Board went out of operation June 30, 1973, when the Congress gave it no appropriation for fiscal 1974.'
