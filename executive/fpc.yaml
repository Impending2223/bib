# The Federal Power Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: fpc
name: Federal Power Commission
under: president
order: 500
law:
  - act: Federal Water Power Act
    date: '1920-06-10'
    tags: [creates]
    cite: 'ch. 285, § 1, 41 Stat. 1063'
    usc: '16 U.S.C. § 792 (1958)'
    does: Creates the Commission, of the Secretaries of War, the Interior, and Agriculture, to license water-power projects on navigable waters and public lands.
  - act: Act of June 23, 1930
    date: '1930-06-23'
    tags: [reorganizes, appointment]
    cite: 'ch. 572, § 1, 46 Stat. 797'
    usc: '16 U.S.C. § 792 (1958)'
    does: 'Reorganizes the Commission: five commissioners appointed by the President, by and with the advice and consent of the Senate, for five years; not more than three of one party; none with an interest in the power business. One designated by the President as chairman; thereafter chairmen elected by the commission.'
  - act: Federal Power Act (Public Utility Act of 1935, title II)
    date: '1935-08-26'
    tags: [powers]
    cite: 'ch. 687, title II, 49 Stat. 803, 838'
    usc: ['16 U.S.C. §§ 791a–825r (1958)']
    does: Jurisdiction over the transmission and sale at wholesale of electric energy in interstate commerce; rates, accounts, and securities of public utilities.
  - act: Natural Gas Act
    date: '1938-06-21'
    tags: [powers]
    cite: 'ch. 556, 52 Stat. 821'
    usc: ['15 U.S.C. §§ 717–717w (1958)']
    does: Jurisdiction over the transportation and sale for resale of natural gas in interstate commerce; certificates of public convenience and necessity for pipelines.
n: Terms of five years, expiring June 22. Dates of service are the Federal Energy Regulatory Commission's list of past commissioners, as Wikipedia gives it; where that list and the Congressional Directory disagree, a Check.
