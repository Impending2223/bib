law:
  - act: Federal Reserve Act
    date: '1913-12-23'
    tags: [creates, powers]
    cite: 'ch. 6, § 10, 38 Stat. 251, 260'
    usc: '12 U.S.C. § 241 (1958)'
    does: Creates the Federal Reserve Board, to supervise the Federal Reserve banks.
  - act: Banking Act of 1935
    date: '1935-08-23'
    tags: [reorganizes, appointment]
    cite: 'ch. 614, § 203, 49 Stat. 684, 704'
    usc: ['12 U.S.C. §§ 241–242 (1958)', '12 U.S.C. §§ 241–242 (1970)']
    does: 'Renames it the Board of Governors of the Federal Reserve System. Seven members appointed by the President, by and with the advice and consent of the Senate, for fourteen years; not more than one from any Federal Reserve district; due regard to financial, agricultural, industrial, and commercial interests and geographical divisions. A member who has served a full term not eligible for reappointment. Members serve until successors qualify. The Secretary of the Treasury and the Comptroller of the Currency off the Board from Feb. 1, 1936.'
n: 'Terms of fourteen years run from Feb. 1 of even years; one expires every two years. The Fed''s list of members gives the day each took the oath, and how each left.'
