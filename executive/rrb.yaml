# The Railroad Retirement Board. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: rrb
name: Railroad Retirement Board
under: president
order: 500
law:
  - act: Railroad Retirement Act of 1937
    date: '1937-06-24'
    tags: [creates, appointment, powers]
    cite: 'ch. 382, § 10, 50 Stat. 307, 314'
    usc: '45 U.S.C. § 228j (1958)'
    does: 'Establishes the Board as an independent agency in the executive branch: three members appointed by the President, by and with the advice and consent of the Senate, for five years; one from recommendations of the employees'' representatives, one from the carriers''; the third, the chairman, without recommendation and with no interest in any employer or organization of employees. To administer the retirement annuities of railroad employees.'
  - act: Railroad Unemployment Insurance Act
    date: '1938-06-25'
    tags: [powers]
    cite: 'ch. 680, 52 Stat. 1094'
    usc: ['45 U.S.C. §§ 351–367 (1958)']
    does: Unemployment benefits for railroad employees, administered by the Board.
n: Members as the Congressional Directory lists them at each edition; dates known only to the year carry a Check.
