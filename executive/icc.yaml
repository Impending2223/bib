    n: 'Until 1970 the Commission chose its chairman, by rotation, for a year: in 1953–55 the chair changed in midyear; from 1957 the term was the calendar year (so the Annual Reports, 1963–69). Chairmen as the Annual Reports, the Directory, and letters in the Congressional Record name them.'
