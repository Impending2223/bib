    law:
      - act: Reorganization Plan No. 1 of 1969
        date: '1969-10-11'
        tags: [appointment, powers]
        cite: '83 Stat. 859'
        usc: '49 U.S.C. § 11 note (1970)'
        does: 'The Commission''s executive and administrative functions transferred to the Chairman, governed by its general policies. The Commission''s function of choosing the Chairman transferred to the President, from Jan. 1, 1970 (§ 3); the Commission may designate an acting chairman when no designated chairman is available.'
      - act: Federal Executive Salary Act of 1964
