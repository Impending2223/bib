# The Interstate Commerce Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: icc
name: Interstate Commerce Commission
under: president
order: 500
law:
  - act: Act to Regulate Commerce (Interstate Commerce Act)
    date: '1887-02-04'
    tags: [creates, appointment, powers]
    cite: 'ch. 104, § 11, 24 Stat. 379, 383'
    usc: '49 U.S.C. § 11 (1958)'
    does: Creates the Commission, its commissioners appointed by the President, by and with the advice and consent of the Senate; not more than a bare majority of one party; removable for inefficiency, neglect of duty, or malfeasance in office. Rates of railroads in interstate commerce to be reasonable and just.
  - act: Transportation Act, 1920
    date: '1920-02-28'
    tags: [appointment]
    cite: 'ch. 91, § 440, 41 Stat. 456, 497'
    usc: '49 U.S.C. § 11 (1958)'
    does: Eleven commissioners, for seven years.
  - act: Motor Carrier Act, 1935
    date: '1935-08-09'
    tags: [powers]
    cite: 'ch. 498, 49 Stat. 543'
    usc: ['49 U.S.C. §§ 301–327 (1958)']
    does: Jurisdiction over motor carriers in interstate commerce (part II); water carriers added in 1940 (part III), freight forwarders in 1942 (part IV).
n: 'Eleven commissioners. Members as the Congressional Directory lists them at each edition; where Wikipedia has a biography its dates are used. Most dates are known only to the year: a "Check" gives the editions between which a member came or went. Members in office in Mar. 1953 whose appointment was not found are entered from 1953, with a Check.'
