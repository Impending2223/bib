# The National Mediation Board. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: nmb
name: National Mediation Board
under: president
order: 500
law:
  - act: Railway Labor Act amendments of 1934
    date: '1934-06-21'
    tags: [creates, appointment, powers]
    cite: 'ch. 691, § 2, 48 Stat. 1185, 1193'
    usc: '45 U.S.C. § 154 (1958)'
    does: 'Creates the National Mediation Board in place of the Board of Mediation: three members appointed by the President, by and with the advice and consent of the Senate, for three years, not more than two of one party; the Board annually designates a member to act as chairman. To mediate disputes between carriers and their employees, and to investigate and certify representatives.'
  - act: Act of Apr. 10, 1936
    date: '1936-04-10'
    tags: [powers]
    cite: 'ch. 166, 49 Stat. 1189'
    usc: ['45 U.S.C. §§ 181–188 (1958)']
    does: The Railway Labor Act extended to carriers by air.
n: Members as the Congressional Directory lists them at each edition; dates known only to the year carry a Check.
