# The Appalachian Regional Commission: its federal officers. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: arc
name: Appalachian Regional Commission
under: president
order: 500
from: '1965-03-09'
law:
  - act: Appalachian Regional Development Act of 1965
    date: '1965-03-09'
    tags: [creates, appointment, powers]
    cite: 'Pub. L. 89-4, §§ 101–105, 79 Stat. 5'
    usc: ['40 U.S.C. App. §§ 101–105 (1970)']
    does: 'Establishes the Appalachian Regional Commission: a Federal Cochairman, appointed by the President by and with the advice and consent of the Senate, and one member from each participating State; decisions require the affirmative vote of the Federal Cochairman and of a majority of the State members. To develop plans and programs for the region, with highways, health centers, and other public works financed by the Act.'
n: The Federal Cochairman and his alternate as the Congressional Directory lists them at each edition; the State members, officers of the States, are not entered.
