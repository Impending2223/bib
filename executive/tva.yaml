unit: tva
name: Tennessee Valley Authority
under: president
order: 500
law:
  - act: Tennessee Valley Authority Act of 1933
    date: '1933-05-18'
    tags: [creates, appointment, powers]
    cite: 'ch. 32, §§ 1–4, 48 Stat. 58'
    usc: ['16 U.S.C. §§ 831–831c (1958)']
    does: 'Creates a corporation, the Tennessee Valley Authority, to operate the properties at Muscle Shoals and develop the Tennessee River for navigation, flood control, and power. A board of three directors appointed by the President, by and with the advice and consent of the Senate, for nine years; the President designates the chairman; removable by the President, or by concurrent resolution of the Congress. Each director to profess belief in the feasibility and wisdom of the Act.'
  - act: Act of Aug. 6, 1959 (TVA revenue bonds)
    date: '1959-08-06'
    tags: [powers]
    cite: 'Pub. L. 86-137, 73 Stat. 280'
    usc: '16 U.S.C. § 831n-4 (1964)'
    does: The Authority may issue revenue bonds to finance power facilities, up to $750 million; its power service area limited.
n: Directors as the Congressional Directory lists them at each edition and their biographies.
