  - act: Act of July 3, 1930
    date: '1930-07-03'
    until: '1959-01-01'
    tags: [creates, powers, appointment]
    cite: 'ch. 863, 46 Stat. 1016'
    usc: '38 U.S.C. §§ 11–11a (1952)'
    does: Authorizes the President to consolidate the Bureau of Pensions, the National Home for Disabled Volunteer Soldiers and the Veterans' Bureau into a Veterans' Administration, headed by an Administrator of Veterans' Affairs appointed by the President with the advice and consent of the Senate; the Administrator may reorganize its bureaus and offices.
