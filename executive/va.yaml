    date: '1958-09-02'
    effective: '1959-01-01'
    tags: [creates, powers]
    cite: 'Pub. L. 85-857, § 1, 72 Stat. 1105, 1114'
    usc: '38 U.S.C. §§ 201–202 (1964)'
    does: Codifies the veterans' laws as Title 38. The Veterans' Administration an independent establishment in the executive branch, for the administration of the laws on relief and benefits for veterans and their dependents.
