# The Federal Home Loan Bank Board (the Home Loan Bank Board, in the Housing and Home Finance Agency, to Aug. 11, 1955). Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: fhlbb
name: Home Loan Bank Board
names:
  - name: Federal Home Loan Bank Board
    from: '1955-08-11'
under: president
order: 500
law:
  - act: Federal Home Loan Bank Act
    date: '1932-07-22'
    tags: [creates, powers]
    cite: 'ch. 522, 47 Stat. 725'
    usc: ['12 U.S.C. §§ 1421–1449 (1958)']
    does: Creates the Federal Home Loan Bank Board and the system of regional Federal Home Loan Banks, to make advances to savings and loan associations and other home-financing institutions.
  - act: Reorganization Plan No. 3 of 1947
    date: '1947-07-27'
    tags: [reorganizes, appointment]
    cite: '61 Stat. 954'
    usc: '5 U.S.C. § 133y–16 note (1952)'
    does: 'A Home Loan Bank Board of three members, appointed by the President with the advice and consent of the Senate, a constituent agency of the Housing and Home Finance Agency; the President designates the Chairman; the Board to have the functions of the Federal Home Loan Bank Board and the Federal Savings and Loan Insurance Corporation.'
  - act: Housing Amendments of 1955
    date: '1955-08-11'
    tags: [reorganizes]
    cite: 'ch. 783, § 109, 69 Stat. 635, 640'
    usc: '12 U.S.C. § 1437 (1958)'
    does: The Board no longer a constituent agency of the Housing and Home Finance Agency but an independent agency in the executive branch, with the Federal Savings and Loan Insurance Corporation; renamed the Federal Home Loan Bank Board; to report annually to the Congress.
n: Members as the Congressional Directory lists them at each edition; dates known only to the year carry a Check.
