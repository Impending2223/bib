# The Export-Import Bank. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: exim
name: Export-Import Bank of Washington
names:
  - name: Export-Import Bank of the United States
    from: '1968-03-13'
under: president
order: 500
law:
  - act: Export-Import Bank Act of 1945
    date: '1945-07-31'
    tags: [creates, powers]
    cite: 'ch. 341, 59 Stat. 526'
    usc: ['12 U.S.C. §§ 635–635h (1958)']
    does: The Bank continued as an agency of the United States, to aid in financing and facilitating exports and imports; its management in a board of directors.
  - act: Reorganization Plan No. 5 of 1953
    date: '1953-06'
    tags: [reorganizes, appointment, vacancy]
    cite: '67 Stat. 637'
    usc: '12 U.S.C. § 635a note (1958)'
    does: The Board of Directors abolished and its functions transferred to a Managing Director, appointed by the President with the advice and consent of the Senate; a Deputy Director, likewise appointed, to act in his absence or a vacancy; lending policies set by the National Advisory Council.
  - act: Act of Aug. 9, 1954
    date: '1954-08-09'
    tags: [reorganizes, appointment, vacancy]
    cite: 'ch. 660, 68 Stat. 677'
    usc: '12 U.S.C. § 635a (1958)'
    does: 'The Bank an independent agency, not to be transferred without act of Congress. A President of the Bank, its chief executive officer, and a First Vice President, who acts in his absence or a vacancy, each appointed by the President with the advice and consent of the Senate; a Board of Directors of the President (chairman), the First Vice President (vice chairman), and three directors so appointed, not more than three of the five of one party.'
  - act: Act of Mar. 13, 1968
    date: '1968-03-13'
    tags: [reorganizes]
    cite: 'Pub. L. 90-267, 82 Stat. 47'
    usc: '12 U.S.C. § 635 (1970)'
    does: Renamed the Export-Import Bank of the United States.
n: Officers as the Congressional Directory lists them at each edition and their biographies.
