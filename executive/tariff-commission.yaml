# The United States Tariff Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: tariff-commission
name: United States Tariff Commission
under: president
order: 500
law:
  - act: Revenue Act of 1916, title VII
    date: '1916-09-08'
    tags: [creates]
    cite: 'ch. 463, § 700, 39 Stat. 756, 795'
    usc: '19 U.S.C. § 1330 note (1958)'
    does: Creates the Tariff Commission, to investigate the administration and effects of the customs laws and report to the President and the Congress.
  - act: Tariff Act of 1930
    date: '1930-06-17'
    tags: [appointment, powers]
    cite: 'ch. 497, §§ 330–341, 46 Stat. 590, 696'
    usc: ['19 U.S.C. §§ 1330–1341 (1958)']
    does: 'Six commissioners appointed by the President, by and with the advice and consent of the Senate, for six years, one term expiring each year; not more than three of one party; members of different parties appointed alternately. Investigations of costs of production and of unfair practices in import trade; the flexible tariff (§ 336).'
  - act: Trade Agreements Extension Act of 1951
    date: '1951-06-16'
    tags: [powers]
    cite: 'ch. 141, § 7, 65 Stat. 72, 74'
    usc: '19 U.S.C. § 1364 (1958)'
    does: Escape-clause investigations, on petition, of imports increased by trade-agreement concessions so as to cause or threaten serious injury to a domestic industry.
  - act: Trade Expansion Act of 1962
    date: '1962-10-11'
    tags: [powers]
    cite: 'Pub. L. 87-794, § 301, 76 Stat. 872, 884'
    usc: '19 U.S.C. § 1901 (1964)'
    does: Investigations of injury from imports, for tariff adjustment and for adjustment assistance to firms and workers.
n: Members as the Congressional Directory lists them at each edition; most dates are known only to the year, and carry a Check.
