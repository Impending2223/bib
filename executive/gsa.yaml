unit: gsa
name: General Services Administration
under: president
order: 500
law:
  - act: Federal Property and Administrative Services Act of 1949
    date: '1949-06-30'
    tags: [creates, powers, reorganizes]
    cite: 'ch. 288, §§ 101–104, 63 Stat. 377, 379'
    usc: '40 U.S.C. § 751 (1958)'
    does: Establishes in the executive branch the General Services Administration; transfers to it the Bureau of Federal Supply, the Federal Works Agency (public buildings), the National Archives Establishment and the liquidation of the War Assets Administration; procurement and supply, property utilization and disposal, records management.
  - act: Federal Records Act of 1950
    date: '1950-09-05'
    tags: [powers]
    cite: 'ch. 849, § 6, 64 Stat. 578, 583'
    usc: '44 U.S.C. §§ 391–401 (1958)'
    does: Records management throughout the Government under the Administrator; the National Archives of the United States, records determined by the Archivist to have enduring value and accepted by the Administrator; presidential libraries; a National Historical Publications Commission, the Archivist its chairman.
