# The National Aeronautics and Space Council, 1958–73. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: nasc
name: National Aeronautics and Space Council
under: eop
order: 70
from: '1958-07-29'
until: '1973-07-01'
law:
  - act: National Aeronautics and Space Act of 1958
    date: '1958-07-29'
    cite: 'Pub. L. 85-568, § 201, 72 Stat. 426, 427'
    usc: '42 U.S.C. § 2471 (1958 Supp. V)'
    tags: [creates, powers, appointment]
    does: 'Establishes the National Aeronautics and Space Council: the President, presiding; the Secretaries of State and Defense, the Administrator of NASA, the Chairman of the Atomic Energy Commission, one more official and up to three members from private life appointed by the President; to advise the President in surveying the Nation''s aeronautical and space activities, developing a comprehensive program, fixing responsibility, and resolving differences among agencies; a staff headed by a civilian executive secretary.'
  - act: Act of Apr. 25, 1961
    date: '1961-04-25'
    cite: 'Pub. L. 87-26, 75 Stat. 47'
    usc: '42 U.S.C. § 2471 (1964)'
    tags: [reorganizes, powers]
    does: 'Places the Council in the Executive Office of the President; the Vice President its Chairman; the members from private life dropped; the Council to advise and assist the President on aeronautical and space policies, plans, and programs.'
  - act: Reorganization Plan No. 1 of 1973
    date: '1973-07-01'
    cite: '87 Stat. 1089, 1090'
    usc: '5 U.S.C. App. (1970 Supp. IV)'
    tags: [reorganizes]
    does: Abolishes the Council, including the office of Executive Secretary, with its functions (§ 3(a)(4)).
