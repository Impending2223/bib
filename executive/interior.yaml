    date: '1950-08-26'
    until: '1958-02-15'
    tags: [vacancy]
    cite: '15 Fed. Reg. 5789'
    does: Designates the officers of the Department who act as Secretary in case of death, resignation, absence, or sickness.
  - act: Executive Order 10753
    date: '1958-02-15'
    until: '1969-10-06'
    tags: [vacancy]
    cite: '23 Fed. Reg. 1107'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10753-designation-certain-officers-the-department-the-interior-act
    does: 'Order of succession to act as Secretary: the Under Secretary; the Assistant Secretaries and the Assistant Secretary for Fish and Wildlife, by length of service; the Solicitor.'
  - act: Executive Order 11487
    date: '1969-10-06'
    tags: [vacancy]
    cite: '34 Fed. Reg. 15593'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11487-designation-officers-the-department-the-interior-act-secretary-the
    does: 'When neither the Secretary nor the Under Secretary is available, an Assistant Secretary or the Solicitor acts as Secretary, in the order the Secretary prescribes, otherwise by date of taking office.'
