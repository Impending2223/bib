# The Department of the Interior. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Holders are dated from the Congressional Directory (CDIR, two editions a Congress), the bureaus' own
# lists, and Wikipedia; where only a Directory edition brackets a change, the date is a month or a year
# and the holder's note says "Check".
