    date: '1966-05-10'
    tags: [reorganizes, appointment]
    cite: '80 Stat. 1608'
    does: 'Transfers the Federal Water Pollution Control Administration and the water pollution functions of the Secretary of Health, Education, and Welfare to the Secretary of the Interior; one additional Assistant Secretary (PAS).'
