# The Department of the Interior. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Holders are dated from the Congressional Directory (CDIR, two editions a Congress), the bureaus' own
# lists, and Wikipedia; where only a Directory edition brackets a change, the date is a month or a year
# and the holder's note says "Check".
unit: interior
name: Department of the Interior
under: president
order: 80
law:
  - act: Act of Mar. 3, 1849
    date: '1849-03-03'
    tags: [creates]
    cite: 'ch. 108, § 1, 9 Stat. 395'
    usc: ['5 U.S.C. § 481 (1958)', '43 U.S.C. § 1451 (1970)']
    does: Establishes the Department of the Interior, with a Secretary of the Interior at its head (R.S. § 437).
  - act: Act of Mar. 1, 1873
    date: '1873-03-01'
    tags: [powers]
    cite: 'ch. 217, 17 Stat. 484'
    usc: ['5 U.S.C. § 486 (1958)', '43 U.S.C. § 1458 (1970)']
    does: The Secretary exercises the powers and duties in relation to the Territories formerly exercised by the Secretary of State (R.S. § 442).
  - act: Reorganization Plan No. 3 of 1950
    date: '1950-05-24'
    tags: [powers, appointment, reorganizes]
    cite: '64 Stat. 1262'
    usc: '43 U.S.C. § 1451 note (1970)'
    does: 'Transfers to the Secretary all functions of all other officers, agencies, and employees of the Department, with power to delegate; one additional Assistant Secretary (PAS); an Administrative Assistant Secretary, appointed by the Secretary with the approval of the President under the classified civil service.'
  - act: Executive Order 10156
    date: '1950-08-26'
    until: '1958-02-15'
    tags: [vacancy]
    cite: '15 Fed. Reg. 5789'
    does: Designates the officers of the Department who act as Secretary in case of death, resignation, absence, or sickness.
  - act: Executive Order 10753
    date: '1958-02-15'
    until: '1969-10-06'
    tags: [vacancy]
    cite: '23 Fed. Reg. 1107'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10753-designation-certain-officers-the-department-the-interior-act
    does: 'Order of succession to act as Secretary: the Under Secretary; the Assistant Secretaries and the Assistant Secretary for Fish and Wildlife, by length of service; the Solicitor.'
  - act: Executive Order 11487
    date: '1969-10-06'
    tags: [vacancy]
    cite: '34 Fed. Reg. 15593'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11487-designation-officers-the-department-the-interior-act-secretary-the
    does: 'When neither the Secretary nor the Under Secretary is available, an Assistant Secretary or the Solicitor acts as Secretary, in the order the Secretary prescribes, otherwise by date of taking office.'
  - act: Reorganization Plan No. 2 of 1966
    date: '1966-05-10'
    tags: [reorganizes, appointment]
    cite: '80 Stat. 1608'
    does: 'Transfers the Federal Water Pollution Control Administration and the water pollution functions of the Secretary of Health, Education, and Welfare to the Secretary of the Interior; one additional Assistant Secretary (PAS).'
  - act: Reorganization Plan No. 3 of 1970
    date: '1970-12-02'
    tags: [reorganizes]
    cite: '84 Stat. 2086'
    does: Transfers the Federal Water Quality Administration and other functions of the Secretary to the new Environmental Protection Agency.
  - act: Act of June 1, 1971
    date: '1971-06-01'
    tags: [appointment]
    cite: 'Pub. L. 92-22, § 1, 85 Stat. 75'
    usc: '43 U.S.C. § 1453a (1970 Supp. V)'
    does: An additional Assistant Secretary of the Interior, appointed by the President with the advice and consent of the Senate.
