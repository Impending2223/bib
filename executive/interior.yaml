    date: '1950-05-24'
    tags: [powers, appointment, reorganizes]
    cite: '64 Stat. 1262'
    usc: '43 U.S.C. § 1451 note (1970)'
    does: 'Transfers to the Secretary all functions of all other officers, agencies, and employees of the Department, with power to delegate; one additional Assistant Secretary (PAS); an Administrative Assistant Secretary, appointed by the Secretary with the approval of the President under the classified civil service.'
