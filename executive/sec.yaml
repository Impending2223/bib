# The Securities and Exchange Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: sec
name: Securities and Exchange Commission
under: president
order: 500
law:
  - act: Securities Exchange Act of 1934
    date: '1934-06-06'
    tags: [creates, appointment]
    cite: 'ch. 404, § 4, 48 Stat. 881, 885'
    usc: '15 U.S.C. § 78d (1958)'
    does: 'Creates the Commission: five commissioners appointed by the President, by and with the advice and consent of the Senate, for five years; not more than three of one party; to engage in no other business. The functions of the Federal Trade Commission under the Securities Act of 1933 transferred to it (§ 210).'
  - act: Securities Act of 1933
    date: '1933-05-27'
    tags: [powers]
    cite: 'ch. 38, 48 Stat. 74'
    usc: ['15 U.S.C. §§ 77a–77aa (1958)']
    does: Registration of securities offered to the public in interstate commerce; prospectuses; civil liability for misstatement.
  - act: Public Utility Holding Company Act of 1935
    date: '1935-08-26'
    tags: [powers]
    cite: 'ch. 687, title I, 49 Stat. 803'
    usc: ['15 U.S.C. §§ 79–79z-6 (1958)']
    does: Registration and simplification of holding-company systems of gas and electric utilities.
  - act: Investment Company Act of 1940; Investment Advisers Act of 1940
    date: '1940-08-22'
    tags: [powers]
    cite: 'ch. 686, 54 Stat. 789'
    usc: ['15 U.S.C. §§ 80a-1–80a-52 (1958)', '15 U.S.C. §§ 80b-1–80b-21 (1958)']
    does: Registration and regulation of investment companies and investment advisers.
n: Terms of five years, one expiring each June 5. Dates of service and of chairmanship are the Commission's own historical summary.
