unit: usia
name: United States Information Agency
under: president
order: 500
from: '1953-08-01'
law:
  - act: United States Information and Educational Exchange Act of 1948
    date: '1948-01-27'
    tags: [powers]
    cite: ch. 36, 62 Stat. 6
    usc: 22 U.S.C. §§ 1431–1479 (1958)
    does: Authorizes the dissemination abroad of information about the United States, its people, and its policies, by press, publications, radio, motion pictures, and information centers, and educational exchanges; the functions then in the Secretary of State.
  - act: Reorganization Plan No. 8 of 1953
    date: '1953-08-01'
    tags: [creates, appointment, vacancy, powers, reorganizes]
    cite: 67 Stat. 642
    does: Establishes the United States Information Agency, headed by a Director appointed by the President with the advice and consent of the Senate (the Secretary of State to advise on the appointment and tenure), with a Deputy Director, appointed the same way, who acts as Director in a vacancy; transfers to the Director the information programs of the Department of State (but for the educational exchanges), the Mutual Security Agency, and the Technical Cooperation Administration.
  - act: Mutual Educational and Cultural Exchange Act of 1961
    date: '1961-09-21'
    tags: [powers]
    cite: Pub. L. 87-256, 75 Stat. 527
    usc: 22 U.S.C. §§ 2451–2458 (1964)
    does: Consolidates the educational and cultural exchange programs; the President may assign their functions, which he did to the Secretary of State (Executive Order 11034, 1962).
