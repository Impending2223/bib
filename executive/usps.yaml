        does: A Postal Rate Commission of five Commissioners appointed by the President, not more than three of one party, for six years, removable only under 5 U.S.C. § 7521; one designated Chairman by the President, at his pleasure (§ 3601). Recommends rates and classes of mail to the Governors (§§ 3622–3625).
