unit: usps
name: United States Postal Service
under: president
order: 500
from: '1971-07-01'
n: An independent establishment of the executive branch. The Board of Governors and the Postal Rate Commission were organized from the fall of 1970; the Service took over the Post Office Department's functions July 1, 1971.
law:
  - act: Postal Reorganization Act
    date: '1970-08-12'
    tags: [creates, powers, reorganizes]
    cite: 'Pub. L. 91-375, § 2, 84 Stat. 719, 720'
    usc: ['39 U.S.C. § 201 (1970)', '39 U.S.C. § 401 (1970)']
    does: The United States Postal Service established as an independent establishment of the executive branch (§ 201), with the powers of a public corporation (§ 401). The functions of the Post Office Department and the Postmaster General transferred to it, on the day set by the Board, July 1, 1971 (§ 4(a)).
