        usc: ['39 U.S.C. § 202(c) (1970)', '39 U.S.C. § 203 (1970)']
        does: The Governors appoint and may remove the Postmaster General, a voting member of the Board, his pay and term fixed by the Governors; the chief executive officer of the Postal Service.
    n: Appointed by the Governors, not the President.
