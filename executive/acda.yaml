law:
  - act: Arms Control and Disarmament Act
    date: '1961-09-26'
    tags: [creates, appointment, vacancy, powers]
    cite: Pub. L. 87-297, 75 Stat. 631
    usc: 22 U.S.C. §§ 2551–2592 (1964)
    does: Establishes the United States Arms Control and Disarmament Agency (§ 21), headed by a Director appointed by the President with the advice and consent of the Senate, the principal adviser to the Secretary of State and the President on arms control and disarmament, with primary responsibility for them under the direction of the Secretary of State (§ 22); a Deputy Director, appointed the same way, who acts in a vacancy (§ 23); up to four Assistant Directors, appointed the same way (§ 24); bureaus and offices, among them an Office of the General Counsel, set up by the Director (§ 25).
