# The Renegotiation Board. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: renegotiation-board
name: Renegotiation Board
under: president
order: 500
law:
  - act: Renegotiation Act of 1951
    date: '1951-03-23'
    tags: [creates, appointment, powers]
    cite: 'ch. 15, § 107, 65 Stat. 7'
    usc: '50 U.S.C. App. § 1217 (1958)'
    does: 'Creates the Renegotiation Board, an independent establishment: five members appointed by the President, by and with the advice and consent of the Senate, one each from among persons recommended by the Secretaries of Defense, the Army, the Navy, and the Air Force and the Administrator of General Services; the President designates the chairman. To determine and eliminate excessive profits on defense contracts and subcontracts.'
n: The Act was extended for periods of two to three years throughout. Members as the Congressional Directory lists them at each edition; dates known only to the year carry a Check.
