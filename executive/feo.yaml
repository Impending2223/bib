# The Energy Policy Office (June 1973) and the Federal Energy Office (Dec. 1973). Kept by hand. Holders known only from the Congressional Directory (CDIR <edition>) carry year
# dates and a Check. See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: feo
name: Energy Policy Office
names:
  - {name: Federal Energy Office, from: '1973-12-04'}
under: eop
order: 200
from: '1973-06-29'
until: '1974-06-28'
law:
  - act: Executive Order 11726
    date: '1973-06-29'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11726-energy-policy-office
    tags: [creates, powers]
    does: Establishes in the Executive Office an Energy Policy Office, under a Director, to formulate and coordinate energy policy for the President.
  - act: Executive Order 11748
    date: '1973-12-04'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11748-federal-energy-office
    tags: [creates, reorganizes, powers]
    does: 'Establishes in the Executive Office the Federal Energy Office, under an Administrator, with the functions of the Energy Policy Office and the allocation of fuels under the Emergency Petroleum Allocation Act of 1973.'
  - act: Federal Energy Administration Act of 1974
    date: '1974-05-07'
    cite: 'Pub. L. 93-275, 88 Stat. 96'
    usc: '15 U.S.C. § 761 (1970 Supp. IV)'
    tags: [reorganizes]
    does: 'Establishes the Federal Energy Administration, an independent agency, with the Federal Energy Office''s functions; activated June 28, 1974. Check.'
