    does: 'Establishes in the Executive Office the National Council on Marine Resources and Engineering Development: the Vice President, Chairman; the Secretaries of State, the Navy, the Interior, Commerce, Health, Education, and Welfare, and the Treasury, the Chairman of the Atomic Energy Commission, and the Director of the National Science Foundation; a staff headed by a civilian executive secretary appointed by the President, pay up to level II; the Council to expire 120 days after the final report of the Commission on Marine Science, Engineering, and Resources.'
