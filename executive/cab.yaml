# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: cab
name: Civil Aeronautics Board
under: president
order: 500
law:
  - act: Civil Aeronautics Act of 1938
    date: '1938-06-23'
    tags: [creates, powers]
    cite: 'ch. 601, 52 Stat. 973'
    usc: ['49 U.S.C. §§ 401–722 (1952)']
    does: Creates the Civil Aeronautics Authority, of five members, to regulate air carriers by certificate of public convenience and necessity, tariffs, and safety rules.
  - act: Reorganization Plan No. IV of 1940
    date: '1940-06-30'
    tags: [reorganizes]
    cite: '54 Stat. 1234, 1235'
    usc: '5 U.S.C. § 133t note (1958)'
    does: The Authority's five members and the Air Safety Board's functions made the Civil Aeronautics Board, in the Department of Commerce for administrative housekeeping only; the Administrator's functions to the Secretary of Commerce.
  - act: Federal Aviation Act of 1958
    date: '1958-08-23'
    tags: [creates, appointment, powers]
    cite: 'Pub. L. 85-726, § 201, 72 Stat. 731, 741'
    usc: '49 U.S.C. § 1321 (1964)'
    does: 'The Board continued as an independent agency: five members appointed by the President, by and with the advice and consent of the Senate, for six years; not more than three of one party; removable for inefficiency, neglect of duty, or malfeasance in office. The President annually designates a chairman and a vice chairman. Economic regulation of air carriers (title IV); safety rulemaking to the new Federal Aviation Agency, accident investigation kept.'
n: 'Dates here come chiefly from the Congressional Directory''s lists at each edition, with the members'' biographies where Wikipedia has them; a "Check" marks a date known only to the year or the interval between editions.'
