# The Equal Employment Opportunity Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: eeoc
name: Equal Employment Opportunity Commission
under: president
order: 500
from: '1964-07-02'
law:
  - act: Civil Rights Act of 1964, title VII
    date: '1964-07-02'
    tags: [creates, appointment, vacancy]
    cite: 'Pub. L. 88-352, § 705, 78 Stat. 241, 258'
    usc: '42 U.S.C. § 2000e-4 (1964 Supp. I)'
    does: 'Creates the Commission: five members appointed by the President, by and with the advice and consent of the Senate, for five years (the first for one to five), not more than three of one party. The President designates a chairman and a vice chairman; the chairman responsible for the administrative operations; the vice chairman acts in the chairman''s absence or disability or a vacancy in the office.'
  - act: Civil Rights Act of 1964, title VII
    date: '1964-07-02'
    effective: '1965-07-02'
    tags: [powers]
    cite: 'Pub. L. 88-352, §§ 703–706, 716, 78 Stat. 241, 255'
    usc: ['42 U.S.C. §§ 2000e-2–2000e-5 (1970)']
    does: Discrimination in employment because of race, color, religion, sex, or national origin made unlawful for employers, unions, and employment agencies of 100 workers or more in the first year, falling to 25; the Commission to investigate charges and seek conciliation; suits by the person aggrieved, or by the Attorney General for a pattern or practice. Effective one year after enactment.
  - act: Equal Employment Opportunity Act of 1972
    date: '1972-03-24'
    tags: [powers, appointment]
    cite: 'Pub. L. 92-261, 86 Stat. 103'
    usc: ['42 U.S.C. §§ 2000e-4, 2000e-5 (1970 Supp. II)']
    does: The Commission may bring civil actions against private employers; coverage extended to State and local governments and employers of 15 or more; federal employment to the Civil Service Commission. A General Counsel appointed by the President with the advice and consent of the Senate, for four years.
n: Chairmen as Wikipedia lists them; members as the Congressional Directory lists them at each edition, with a Check where a date is known only to the year.
