  - name: National Advisory Committee for Aeronautics
    from: '1915-03-03'
  - name: National Aeronautics and Space Administration
    from: '1958-10-01'
law:
  - act: Naval Appropriation Act of Mar. 3, 1915
    date: '1915-03-03'
    until: '1958-10-01'
    tags: [creates, powers]
    cite: 'ch. 83, 38 Stat. 928, 930'
    usc: '50 U.S.C. § 151 (1952)'
    does: Establishes an Advisory Committee for Aeronautics of not more than twelve members, appointed by the President, to supervise and direct the scientific study of the problems of flight; members serve without compensation.
  - act: National Aeronautics and Space Act of 1958
    date: '1958-07-29'
    tags: [creates, powers]
    cite: 'Pub. L. 85-568, § 202, 72 Stat. 426, 429'
    usc: '42 U.S.C. §§ 2451–2476 (1964)'
    does: 'Declares that activities in space be devoted to peaceful purposes; aeronautical and space activities the responsibility of a civilian agency, except those peculiar to weapons, military operations or defense. Establishes the National Aeronautics and Space Administration, headed by an Administrator; under the President''s supervision, the Administrator exercises all its powers and controls its personnel.'
  - act: National Aeronautics and Space Act of 1958
    date: '1958-07-29'
    effective: '1958-10-01'
    tags: [reorganizes]
    cite: 'Pub. L. 85-568, § 301, 72 Stat. 426, 432'
    usc: '42 U.S.C. § 2471 (1964)'
    does: The National Advisory Committee for Aeronautics ceases to exist; its functions, powers, property, personnel and records transferred to the Administration.
n: The Administration began operating Oct. 1, 1958, absorbing the Committee.
