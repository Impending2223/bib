unit: marine-corps
name: 'United States Marine Corps: Headquarters and Fleet Marine Forces'
under: navy
order: 50
law:
  - act: National Security Act of 1947
    date: '1947-07-26'
    until: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 343, § 206(c), 61 Stat. 495, 502
    usc: 5 U.S.C. § 411a (1952)
    does: 'The Marine Corps, within the Department of the Navy: Fleet Marine Forces of combined arms, with supporting air, for service with the fleet, seizure of advanced naval bases, and land operations essential to a naval campaign.'
  - act: Act of June 28, 1952 (Marine Corps strength; the Commandant and the Joint Chiefs)
    date: '1952-06-28'
    until: '1956-08-10'
    tags: [powers]
    cite: Pub. L. 82-416, ch. 479, § 1, 66 Stat. 282
    usc: 5 U.S.C. § 411a (1952)
    does: The Marine Corps of not less than three combat divisions and three air wings; Regular strength not over 400,000 except in war or declared emergency.
  - act: Title 10, United States Code, enacted
    date: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 1041, 70A Stat. 1, 278
    usc:
      - 10 U.S.C. § 5013 (1958)
      - 10 U.S.C. §§ 5201–5202 (1958)
    does: The composition and functions of the Marine Corps (§ 5013); the Commandant and Assistant Commandant (§§ 5201–5202).
n: The Commandant is in the Joint Chiefs of Staff unit (jcs.commandant). Dates from Wikipedia's lists of officeholders.
