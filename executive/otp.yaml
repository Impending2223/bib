# The Office of Telecommunications Policy, 1970-. Kept by hand. Holders known only from the Congressional Directory (CDIR <edition>) carry year
# dates and a Check. See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: otp
name: Office of Telecommunications Policy
under: eop
order: 130
from: '1970-04-20'
law:
  - act: Reorganization Plan No. 1 of 1970
    date: '1970-04-20'
    cite: '84 Stat. 2083'
    usc: '47 U.S.C. § 305 note (1970)'
    tags: [creates, appointment, vacancy, pay, reorganizes]
    does: 'Establishes in the Executive Office the Office of Telecommunications Policy; transfers to its Director the President''s function of assigning frequencies to Government radio stations; a Director at level III and a Deputy Director at level IV, both appointed by the President by and with the advice and consent of the Senate; the Deputy acts in the Director''s absence or a vacancy unless the President designates another; abolishes the office of Director of Telecommunications Management in the Office of Emergency Preparedness.'
  - act: Executive Order 11556
    date: '1970-09-04'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11556-assigning-telecommunications-functions
    tags: [powers]
    does: 'Assigns to the Director the functions of policy for and coordination of the Government''s telecommunications, and the frequency functions; the Director the President''s principal adviser on telecommunications.'
