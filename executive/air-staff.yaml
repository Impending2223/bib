# The Air Staff and the major Air Force commands, 1953-74. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: air-staff
name: The Air Staff and major Air Force commands
under: air-force
order: 50
law:
  - act: Air Force Organization Act of 1951
    date: '1951-09-19'
    until: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 407, title II, 65 Stat. 326, 327
    does: 'The Air Staff: the Chief of Staff, a Vice Chief of Staff, not over five Deputy Chiefs of Staff; plans for the employment, organizing, supplying, and training of the Air Force. The Air Force divided into commands, forces, and organizations as the Secretary prescribes.'
  - act: Title 10, United States Code, enacted
    date: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 1041, 70A Stat. 1, 490
    usc:
      - 10 U.S.C. §§ 8031–8036 (1958)
      - 10 U.S.C. § 8074 (1958)
    does: 'The Air Staff restated: composition, duties, the Vice Chief and Deputy Chiefs (§§ 8031–8036); the commands (§ 8074).'
  - act: Department of Defense Reorganization Act of 1958
    date: '1958-08-06'
    tags: [reorganizes, powers]
    cite: Pub. L. 85-599, § 4(d)–(f), 72 Stat. 514, 517
    usc: 10 U.S.C. § 8074 (1958)
    does: The Air Force divided into such organizations as the Secretary prescribes (the statutory commands repealed); the Chief of Staff's supervision consistent with the full operational command of the unified and specified commanders.
n: The Chief of Staff is in the Joint Chiefs of Staff unit (jcs.air-force-chief); the Strategic Air Command, a specified command, and the Continental Air Defense Command are in commands. Dates from Wikipedia's lists of commanders.
