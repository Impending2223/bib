# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Dates of service for the Office of the Secretary: the Treasury's own tables, Annual Report of the
# Secretary of the Treasury, 1973, exhibit 81 (officials from 1789 to Jan. 20, 1973), and 1974, p. XI
# (Jan. 21, 1973, to June 30, 1974); FRASER, St. Louis Fed.
unit: treasury
name: Department of the Treasury
under: president
order: 40
law:
  - act: Act of Sept. 2, 1789
    date: '1789-09-02'
    cite: 'ch. 12, 1 Stat. 65'
    usc: ['5 U.S.C. §§ 241, 242 (1958)', '31 U.S.C. § 1001 (1970)']
    tags: [creates, powers, appointment]
    does: 'A Department of Treasury: a Secretary of the Treasury, to be deemed head of the department; a Comptroller, an Auditor, a Treasurer, a Register, and an Assistant to the Secretary. The Secretary to digest and prepare plans for the improvement and management of the revenue and the support of the public credit; prepare estimates; superintend the collection of the revenue; grant warrants for moneys issued from the Treasury in pursuance of appropriations by law; report to either House on matters referred to him.'
  - act: Reorganization Plan No. 26 of 1950
    date: '1950-07-31'
    cite: '64 Stat. 1280'
    usc: '5 U.S.C. § 241 note (1958)'
    tags: [powers, reorganizes]
    does: 'Transfers to the Secretary all functions of all other officers, agencies and employees of the Department, except the hearing examiners'' and the Comptroller of the Currency''s; the Secretary may authorize any officer or employee to perform any function of the Secretary.'
  - act: Executive Order 10941
    date: '1961-05-15'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10941-designation-certain-officers-act-secretary-the-treasury
    tags: [vacancy]
    does: 'Designates the officers who act as Secretary of the Treasury in the absence of the Secretary and of the officers the statute names, in a fixed order.'
  - act: Act of May 18, 1972
    date: '1972-05-18'
    cite: 'Pub. L. 92-302, 86 Stat. 148'
    usc: '31 U.S.C. §§ 1004, 1005a (1970 Supp. III)'
    tags: [creates, appointment, vacancy, pay]
    does: 'Establishes a Deputy Secretary, who acts as Secretary in a vacancy; keeps an Under Secretary, whom the President may designate Counselor, and the Under Secretary for Monetary Affairs; adds two Deputy Under Secretaries, whom the President may designate Assistant Secretaries; the Assistant Secretary for Administration appointed by the President, with the Senate''s consent.'
