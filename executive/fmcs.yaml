# The Federal Mediation and Conciliation Service. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: fmcs
name: Federal Mediation and Conciliation Service
under: president
order: 500
law:
  - act: Labor Management Relations Act, 1947, title II
    date: '1947-06-23'
    tags: [creates, appointment, powers]
    cite: 'ch. 120, §§ 202–203, 61 Stat. 136, 153'
    usc: ['29 U.S.C. §§ 172–173 (1958)']
    does: 'Creates an independent agency, the Federal Mediation and Conciliation Service, under a Director appointed by the President, by and with the advice and consent of the Senate; the functions of the Conciliation Service of the Department of Labor transferred to it. The Service may proffer its services in any labor dispute in an industry affecting commerce, to assist the parties to settle it through conciliation and mediation.'
n: Directors as the Congressional Directory lists them and their biographies.
