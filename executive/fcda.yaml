# The Federal Civil Defense Administration, to July 1, 1958, when it was consolidated with the Office of Defense
# Mobilization (executive/oep.yaml). Kept by hand. See tools/bib/executive.py for the fields.
unit: fcda
name: Federal Civil Defense Administration
under: president
order: 500
until: '1958-07-01'
law:
  - act: Federal Civil Defense Act of 1950
    date: '1951-01-12'
    cite: 'ch. 1228, § 101, 64 Stat. 1245, 1247'
    usc: '50 U.S.C. App. § 2271 (1952)'
    tags: [creates, appointment, vacancy, pay, powers]
    does: 'Establishes in the executive branch a Federal Civil Defense Administration under an Administrator appointed from civilian life by the President by and with the advice and consent of the Senate ($17,500), subject to the direction and control of the President; a Deputy Administrator so appointed ($16,000), who acts for the Administrator in his absence or disability; a Civil Defense Advisory Council, the Administrator chairman.'
  - act: Reorganization Plan No. 1 of 1958
    date: '1958-07-01'
    cite: '72 Stat. 1799'
    usc: '50 U.S.C. App. § 2271 note (1958)'
    tags: [reorganizes]
    does: Transfers the functions of the Administration and the Administrator to the President and consolidates the Administration with the Office of Defense Mobilization as the Office of Defense and Civilian Mobilization.
n: Created by Executive Order 10186, Dec. 1, 1950, in the Office for Emergency Management; by statute from Jan. 12, 1951. Headquarters at Battle Creek, Michigan, from 1954.
