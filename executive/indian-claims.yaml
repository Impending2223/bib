# The Indian Claims Commission, 1946–78. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: indian-claims
name: Indian Claims Commission
under: president
order: 500
law:
  - act: Indian Claims Commission Act
    date: '1946-08-13'
    tags: [creates, appointment, powers]
    cite: 'ch. 959, §§ 1–3, 60 Stat. 1049, 1050'
    usc: ['25 U.S.C. §§ 70–70b (1958)']
    does: 'Creates the Commission, to hear and determine claims against the United States on behalf of any tribe, band, or other identifiable group of American Indians arising before Aug. 13, 1946: a Chief Commissioner and two Associate Commissioners appointed by the President, by and with the advice and consent of the Senate; at least two members of the bar of the Supreme Court; not more than two of one party. The Commission to end ten years after its first meeting (extended).'
n: Chief commissioners as the Congressional Directory lists them at each edition; dates known only to the year carry a Check. The Commission was enlarged to five members in 1967, under a Chairman.
