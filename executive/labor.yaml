# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Below the Secretary, most dates come from the Congressional Directory's editions (CDIR <date>), so many are
# years only and carry a "Check". The Department's own list of officials (dol.gov) was not reachable from here.
unit: labor
name: Department of Labor
under: president
order: 110
law:
  - act: Act of Mar. 4, 1913
    date: '1913-03-04'
    cite: 'ch. 141, 37 Stat. 736'
    usc: ['5 U.S.C. §§ 611, 612 (1958)', '29 U.S.C. §§ 551, 552 (1970)']
    tags: [creates, powers, appointment]
    does: 'Creates an executive department to be known as the Department of Labor, with a Secretary of Labor at its head, appointed by the President, by and with the advice and consent of the Senate; its purpose to foster, promote and develop the welfare of the wage earners of the United States, to improve their working conditions, and to advance their opportunities for profitable employment. The Bureau of Labor Statistics and the Children''s Bureau transferred to it.'
  - act: Reorganization Plan No. 6 of 1950
    date: '1950-05-24'
    cite: '64 Stat. 1263'
    usc: '5 U.S.C. § 133z note (1958)'
    tags: [powers, reorganizes]
    does: 'Transfers to the Secretary all functions of all other officers, agencies and employees of the Department, except the hearing examiners''; the Secretary may authorize any officer or employee to perform them; an Administrative Assistant Secretary, appointed by the Secretary with the President''s approval under the classified civil service.'
