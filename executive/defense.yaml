unit: defense
name: Department of Defense
under: president
order: 50
law:
- act: National Security Act of 1947
  date: '1947-07-26'
  tags:
  - creates
  - powers
  - appointment
  cite: ch. 343, §§ 201, 202, 61 Stat. 495, 499, 500
  does: Establishes the National Military Establishment, with the Departments of the Army, the Navy, and the Air
    Force; a Secretary of Defense at its head, appointed from civilian life by the President with the advice and
    consent of the Senate, with general direction, authority, and control over the departments.
- act: National Security Act Amendments of 1949
  date: '1949-08-10'
  tags:
  - creates
  - powers
  - reorganizes
  cite: ch. 412, §§ 4, 5, 6, 63 Stat. 578, 579–581
  usc:
  - 5 U.S.C. §§ 171, 171a (1958)
  does: The National Military Establishment converted into the Department of Defense, an Executive Department; the
    Army, Navy, and Air Force military departments within it, separately administered; the Secretary has direction,
    authority, and control over the Department. A Deputy Secretary and three Assistant Secretaries; fiscal management
    under a Comptroller (title IV).
- act: Reorganization Plan No. 6 of 1953
  date: '1953-06-30'
  tags:
  - reorganizes
  - creates
  - powers
  cite: 67 Stat. 638
  usc: 5 U.S.C. § 171 note (1958)
  does: Transfers to the Secretary of Defense the functions of the Munitions Board, the Research and Development
    Board, the Defense Supply Management Agency, and the Director of Installations, and abolishes them; six more
    Assistant Secretaries of Defense and a General Counsel; the Secretary may delegate any of his functions.
- act: Department of Defense Reorganization Act of 1958
  date: '1958-08-06'
  tags:
  - powers
  - reorganizes
  - creates
  cite: Pub. L. 85-599, 72 Stat. 514
  usc: 5 U.S.C. § 171a (1958)
  does: Each military department separately organized under its own Secretary, under the direction, authority, and
    control of the Secretary of Defense; the Secretary may transfer, reassign, or consolidate functions on report
    to the Armed Services Committees; no Assistant Secretary to issue orders to a military department without written
    delegation; a Director of Defense Research and Engineering; Assistant Secretaries of Defense reduced to seven.
- act: Act of Sept. 7, 1962 (Title 10 revision)
  date: '1962-09-07'
  tags:
  - creates
  - powers
  - reorganizes
  cite: Pub. L. 87-651, title II, § 202, 76 Stat. 506, 517
  usc: 10 U.S.C. §§ 131–137 (1964)
  does: 'Restates the Department''s organic law as chapter 4 of title 10: the Department an executive department
    (§ 131), its seal (§ 132), the Secretary (§ 133), the Deputy Secretary (§ 134), the Director of Defense Research
    and Engineering (§ 135), seven Assistant Secretaries (§ 136), the General Counsel (§ 137).'
- act: Federal Executive Salary Act of 1964
  date: '1964-08-14'
  effective: '1964-07'
  until: '1966-09-06'
  tags:
  - pay
  cite: Pub. L. 88-426, title III, § 303(d), 78 Stat. 400, 418
  does: 'Executive Schedule level IV: Assistant Secretaries of Defense (7).'
- act: Act of Sept. 6, 1966 (Title 5 enacted)
  date: '1966-09-06'
  tags:
  - pay
  cite: Pub. L. 89-554, 80 Stat. 378, 462
  usc: 5 U.S.C. § 5315 (1970)
  does: 'Level IV continued: Assistant Secretaries of Defense (7).'
n: The Office of the Secretary of Defense and the Defense agencies. The military departments, the Joint Chiefs of
  Staff, and the commands are separate units.
