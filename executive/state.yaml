unit: state
name: Department of State
under: president
order: 30
law:
  - act: Act of July 27, 1789
    date: '1789-07-27'
    tags: [creates]
    cite: ch. 4, § 1, 1 Stat. 28
    usc:
      - 5 U.S.C. § 151 (1958)
      - 22 U.S.C. § 2651 (1970)
    does: 'Establishes an executive department, the Department of Foreign Affairs, and a principal officer, the Secretary for the Department of Foreign Affairs, to perform such duties as the President shall enjoin: correspondence and instructions to ministers and consuls, negotiations with foreign ministers, and other foreign affairs.'
  - act: Act of Sept. 15, 1789
    date: '1789-09-15'
    tags: [creates, powers]
    cite: ch. 14, § 1, 1 Stat. 68
    usc:
      - 5 U.S.C. § 151 (1958)
      - 22 U.S.C. § 2651 (1970)
    does: The Department of Foreign Affairs to be called the Department of State, and its principal officer the Secretary of State; domestic duties, among them the custody of the seal of the United States.
  - act: Foreign Service Act of 1946
    date: '1946-08-13'
    tags: [creates, powers]
    cite: ch. 957, 60 Stat. 999
    usc: 22 U.S.C. §§ 801–1158 (1958)
    does: The Foreign Service of the United States, administered by the Secretary of State; a Director General of the Foreign Service and a Board of the Foreign Service; the Foreign Service Institute; the classes of officers and chiefs of mission.
  - act: Act of May 26, 1949
    date: '1949-05-26'
    tags: [creates, appointment, powers]
    cite: ch. 143, §§ 1–4, 63 Stat. 111
    usc:
      - 5 U.S.C. § 151a (1958)
      - 22 U.S.C. §§ 2652, 2653, 2658 (1970)
    does: In the Department, besides the Secretary, an Under Secretary and ten Assistant Secretaries, appointed by the President with the advice and consent of the Senate; the Secretary may designate two Assistant Secretaries as Deputy Under Secretaries; the Counselor and the Legal Adviser rank with the Assistant Secretaries. The Secretary to administer, coordinate, and direct the Foreign Service; may make rules and delegate his functions.
  - act: Act of Aug. 5, 1955
    date: '1955-08-05'
    tags: [creates, appointment, pay]
    cite: ch. 576, §§ 1, 2, 69 Stat. 536
    usc:
      - 5 U.S.C. § 151a (1958)
      - 22 U.S.C. §§ 2652, 2653 (1970)
    does: In the Department, besides the Secretary, an Under Secretary, three Deputy Under Secretaries, and ten Assistant Secretaries, appointed by the President with the advice and consent of the Senate; the Counselor and the Legal Adviser rank and are paid with the Assistant Secretaries.
  - act: Act of July 18, 1958
    date: '1958-07-18'
    tags: [creates]
    cite: Pub. L. 85-524, § 1, 72 Stat. 363
    usc: 5 U.S.C. § 151a (1958)
    does: Eleven Assistant Secretaries of State, for ten. The eleventh used for the Bureau of African Affairs.
  - act: Foreign Relations Authorization Act of 1972
    date: '1972-07-13'
    effective: '1972-07-01'
    tags: [creates, reorganizes, pay]
    cite: Pub. L. 92-352, §§ 103, 104, 86 Stat. 489, 490
    usc: 22 U.S.C. § 2652 (1970 Supp. II)
    does: In the Department, besides the Secretary, a Deputy Secretary, an Under Secretary for Political Affairs, an Under Secretary for Economic Affairs, a Deputy Under Secretary, and eleven Assistant Secretaries; the duties of the Under Secretary to the Deputy Secretary, the incumbent not to be reappointed. Deputy Secretary, level II; the two Under Secretaries, level III; Deputy Under Secretary, level IV.
