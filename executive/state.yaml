  - id: legal-adviser
    title: Legal Adviser
    rank: principal
    appt: PAS
    under: secretary
    group: Staff offices
    level: IV
    law:
      - act: Act of Feb. 23, 1931
        date: '1931-02-23'
        tags: [creates, appointment]
        cite: ch. 276, § 7, 46 Stat. 1207, 1214
        usc: 22 U.S.C. § 2654 (1970)
        does: A Legal Adviser of the Department of State, appointed by the President with the advice and consent of the Senate, in place of the Solicitor.
      - act: 'Act of May 26, 1949'
        date: '1949-05-26'
        until: '1955-08-05'
        cite: 'ch. 143, § 2, 63 Stat. 111'
        does: 'Ranks equally with the Assistant Secretaries of State. Rank only; the salary is not linked.'
      - act: 'Act of Aug. 5, 1955'
        date: '1955-08-05'
        until: '1956-07'
        tags: [pay]
        cite: 'ch. 576, § 2, 69 Stat. 536'
        does: '"shall rank equally with and shall receive the same salary as the Assistant Secretaries of State": $15,000 under the Executive Pay Act of 1949, § 5.'
      - act: 'Federal Executive Pay Act of 1956'
        date: '1956-07-31'
        effective: '1956-07'
        until: '1960-07'
        tags: [pay]
        cite: 'ch. 804, title I, § 106(b)(9), 70 Stat. 736, 739'
        usc: '5 U.S.C. § 2205(b) (1958)'
        does: '"Legal adviser, solicitor, or general counsel of an executive or military department (excluding the Department of Justice)", $19,000. The later act, naming the office''s class and rate, governs over the 1955 act''s link to the Assistant Secretaries ($20,000, § 106(a)(17)).'
      - act: 'Act of July 1, 1960'
        date: '1960-07-01'
        effective: '1960-07'
        until: '1964-07'
        tags: [pay]
        cite: 'Pub. L. 86-568, title II, § 201(1), 74 Stat. 296, 305'
        usc: '5 U.S.C. § 2205(a) (1958 Supp. V)'
        does: 'The legal adviser, solicitor, or general counsel of an executive department moved to § 106(a), $20,000: the Assistant Secretaries'' rate again.'
      - act: 'Federal Executive Salary Act of 1964'
        date: '1964-08-14'
        effective: '1964-07'
        until: '1966-09-06'
        tags: [pay]
        cite: 'Pub. L. 88-426, § 303(d)(47), 78 Stat. 400, 418'
        usc: '5 U.S.C. § 2211(d) (1964)'
        does: 'Level IV, $27,000 a year.'
      - act: 'Act of Sept. 6, 1966 (Title 5 enacted)'
        date: '1966-09-06'
        until: '1967-12'
        tags: [pay]
        cite: 'Pub. L. 89-554, 80 Stat. 378, 462'
        usc: '5 U.S.C. § 5315 (1970)'
        does: 'Level IV continued, $27,000 a year (§ 5315(47)).'
      - act: 'Federal Salary Act of 1967'
        date: '1967-12-16'
        effective: '1967-12'
        until: '1969-02'
        tags: [pay]
        cite: 'Pub. L. 90-206, § 215(b), 81 Stat. 613, 638'
        usc: '5 U.S.C. § 5315 (1970)'
        does: 'Level IV raised to $28,750 a year.'
      - act: 'Federal Salary Act of 1967, § 225'
        date: '1967-12-16'
        effective: '1969-02'
        tags: [pay]
        cite: 'Pub. L. 90-206, § 225(h)–(j), 81 Stat. 613, 644'
        usc: '2 U.S.C. §§ 358–360 (1970)'
        does: 'Level IV, $38,000 a year, on the President''s recommendation of Jan. 15, 1969 (34 Fed. Reg. 2241).'
