law:
  - act: Communications Act of 1934
    date: '1934-06-19'
    tags: [creates, appointment, powers]
    cite: 'ch. 652, §§ 1, 4, 48 Stat. 1064, 1066'
    usc: ['47 U.S.C. §§ 151, 154 (1958)']
    does: 'Creates the Commission to regulate interstate and foreign commerce in communication by wire and radio. Seven commissioners appointed by the President, by and with the advice and consent of the Senate, for seven years; not more than four of one party; one designated by the President as chairman.'
  - act: Communications Act Amendments, 1952
    date: '1952-07-16'
    tags: [powers]
    cite: 'ch. 879, § 4, 66 Stat. 711, 712'
    usc: '47 U.S.C. § 155 (1958)'
    does: The chairman the chief executive officer of the Commission; a review staff; a commissioner may be designated to act in the chairman's absence.
n: Terms of seven years, expiring June 30. Dates of service are Wikipedia's table of commissioners, which follows the Commission's own list.
