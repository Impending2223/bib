# The White House Office, 1953-74. Kept by hand.
# Offices in the order of the Congressional Directory's lists (CDIR <edition>). Holders known only from the
# Directory carry the edition's month or year and a Check. The Special Assistant for National Security Affairs
# and the NSC staff are in nsc.yaml; the science adviser in ost.yaml; consumer affairs in consumer.yaml.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: wh
name: The White House Office
under: eop
order: 10
law:
  - act: Executive Order 8248
    date: '1939-09-08'
    cite: '4 Fed. Reg. 3864'
    url: https://www.presidency.ucsb.edu/documents/executive-order-8248-establishing-the-divisions-the-executive-office-the-president-and
    tags: [creates, powers]
    does: 'The White House Office the first division of the Executive Office: "to serve the President in an intimate capacity in the performance of the many detailed activities incident to his immediate office." Subdivisions: the Secretaries to the President, the Executive Clerk, the Administrative Assistants to the President.'
  - act: Act of June 25, 1948 (Title 3, U.S. Code, enacted)
    date: '1948-06-25'
    cite: 'ch. 644, 62 Stat. 672, 678'
    usc: ['3 U.S.C. § 105 (1946 Supp. II)', '3 U.S.C. § 107 (1946 Supp. II)']
    tags: [pay, powers]
    does: 'Secretary to the President, $10,000 (§ 105). Employees of the executive departments and independent establishments may be detailed to the White House Office for temporary assistance (§ 107).'
  - act: Act of Oct. 15, 1949
    date: '1949-10-15'
    cite: 'ch. 695, § 2, 63 Stat. 880'
    usc: '3 U.S.C. § 105 (1952)'
    until: '1956-07-31'
    tags: [pay]
    does: 'The President to fix the pay of the six administrative assistants, the Executive Secretary of the National Security Council, and five other secretaries or immediate staff assistants in the White House Office: two at not over $20,000, three at $18,000, seven at $15,000.'
  - act: Federal Executive Pay Act of 1956
    date: '1956-07-31'
    effective: '1956-07-01'
    cite: 'ch. 804, § 109, 70 Stat. 736, 740'
    usc: '3 U.S.C. § 105 (1958)'
    until: '1964-08-14'
    tags: [pay]
    does: 'Eight other secretaries or immediate staff assistants: two at not over $22,500, three at $21,000, seven at $20,000, three at $17,500. In effect from the first pay period after June 30, 1956.'
  - act: Federal Executive Salary Act of 1964
    date: '1964-08-14'
    effective: '1964-07-01'
    cite: 'Pub. L. 88-426, § 304(b), 78 Stat. 400, 422'
    usc: '3 U.S.C. § 105 (1964)'
    tags: [pay]
    does: 'The six administrative assistants, the Executive Secretaries of the National Security Council and the National Aeronautics and Space Council, and eight other secretaries or immediate staff assistants in the White House Office: pay fixed by the President, not above level II of the Federal Executive Salary Schedule. In effect from the first pay period beginning on or after July 1, 1964.'
  - act: 'Act of Oct. 4, 1961'
    date: '1961-10-04'
    effective: '1961-12'
    until: '1964-07'
    tags: [pay]
    cite: 'Pub. L. 87-367, § 303(h), 75 Stat. 785, 794'
    usc: '3 U.S.C. § 105 (1958 Supp. V)'
    does: 'The three places at not over $17,500 raised to $18,500.'
n: 'Staff appointed by the President alone; no office in the White House Office required confirmation. Titles below the six statutory administrative assistants rest on the President''s appointment and the annual appropriation for the Office. Military aides were officers detailed from their services.'
