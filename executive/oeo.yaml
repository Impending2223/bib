# (CDIR <edition>) carry year dates and a Check. See tools/bib/executive.py for the fields.
unit: oeo
name: Office of Economic Opportunity
under: eop
order: 90
from: '1964-08-20'
law:
  - act: Economic Opportunity Act of 1964
    date: '1964-08-20'
    cite: 'Pub. L. 88-452, §§ 601, 602, 78 Stat. 508, 528'
    usc: '42 U.S.C. §§ 2941, 2942 (1964)'
    tags: [creates, appointment, pay, powers]
    does: 'Establishes in the Executive Office of the President the Office of Economic Opportunity, headed by a Director, with one Deputy Director and three Assistant Directors, all appointed by the President by and with the advice and consent of the Senate; the Director''s pay fixed by the President up to that of the Director of the Bureau of the Budget, the Deputy''s up to the Deputy Director''s, the Assistant Directors'' up to an Assistant Secretary''s; the President may move the Office out of the Executive Office by reorganization plan after one year. The Office administers the Job Corps, work-training, community action, and VISTA programs of the Act.'
n: 'Planned by the President''s Task Force on the War Against Poverty, Feb.–Aug. 1964, Shriver director.'
