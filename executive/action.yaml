# ACTION, from July 1, 1971: the Peace Corps, VISTA, and the other volunteer programs. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: action
name: ACTION
under: president
order: 500
from: '1971-07-01'
law:
  - act: Reorganization Plan No. 1 of 1971
    date: '1971-07-01'
    tags: [creates, appointment, vacancy, pay, reorganizes]
    cite: 85 Stat. 819
    does: Establishes in the executive branch an agency known as Action, headed by a Director appointed by the President with the advice and consent of the Senate, at level III; a Deputy Director, appointed the same way, at level IV, who acts in a vacancy; up to four Associate Directors, at level V. Transfers to it VISTA and the other volunteer programs of the Office of Economic Opportunity, the Foster Grandparents and Retired Senior Volunteer programs, and SCORE and ACE.
  - act: Executive Order 11603
    date: '1971-06-30'
    effective: '1971-07-01'
    tags: [reorganizes, powers]
    cite: 36 Fed. Reg. 12675
    does: Delegates to the Director of Action the functions under the Peace Corps Act, which the Peace Corps carries on within Action.
    url: https://www.presidency.ucsb.edu/documents/executive-order-11603-assigning-additional-functions-the-director-action
n: An independent agency, created July 1, 1971. Its Associate Director for International Operations was the Director of the Peace Corps.
