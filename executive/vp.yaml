  - id: military-aide
    title: 'Military Aide to the Vice President'
    rank: military
    appt: MIL
    n: 'An officer detailed by his service to the Vice President''s staff. No statute or published order for the post or the detail found, 1953–74; details to "the Office of the Vice President" first authorized in 1978 (Pub. L. 95-570, § 3; 3 U.S.C. § 112).'
