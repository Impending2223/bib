        src: ['FRUS persons list, 1961–63, II', 'FRUS 1961–63, XXI, doc. 243']
      - name: 'Dunn, John M.'
        rank: 'Brig. Gen., USA'
        title: 'Military Assistant to the Vice President; from 1973, Senior Military Aide'
