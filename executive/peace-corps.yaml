# The Peace Corps, in the Department of State, 1961-71; in ACTION from July 1, 1971 (see action.yaml). Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: peace-corps
name: Peace Corps
under: state
order: 70
from: '1961-03-01'
until: '1971-07-01'
law:
  - act: Executive Order 10924
    date: '1961-03-01'
    until: '1962-08-06'
    tags: [creates, powers]
    cite: 26 Fed. Reg. 1789
    does: 'Under the Mutual Security Act of 1954: the Secretary of State shall establish in the Department an agency known as the Peace Corps, headed by a Director, for the training and service abroad of men and women of the United States in programs of assistance; financed from mutual security funds.'
    url: https://www.presidency.ucsb.edu/documents/executive-order-10924-establishment-and-administration-the-peace-corps-the-department
  - act: Peace Corps Act
    date: '1961-09-22'
    tags: [creates, appointment, powers, pay]
    cite: Pub. L. 87-293, 75 Stat. 612
    usc: 22 U.S.C. §§ 2501–2523 (1964)
    does: 'Authorizes the President to carry out a Peace Corps program: volunteers to serve abroad; a Director and a Deputy Director, appointed by the President with the advice and consent of the Senate (§ 4(a)); the President may delegate his functions.'
  - act: Executive Order 11041
    date: '1962-08-06'
    tags: [powers]
    does: Delegates the President's functions under the Peace Corps Act to the Secretary of State, who redelegated them to the Director; supersedes Executive Order 10924.
    url: https://www.presidency.ucsb.edu/documents/executive-order-11041-continuance-and-administration-the-peace-corps-the-department-state
  - act: Federal Executive Salary Act of 1964
    date: '1964-08-14'
    tags: [pay]
    cite: Pub. L. 88-426, § 303, 78 Stat. 400, 416
    does: 'Executive Schedule: Director, level III; Deputy Director, level IV; Associate Director for Volunteers and Associate Director for Program Development and Operations, level V.'
  - act: Reorganization Plan No. 1 of 1971
    date: '1971-07-01'
    tags: [reorganizes]
    cite: 85 Stat. 819
    does: With Executive Order 11603 (June 30, 1971), transfers the Peace Corps's functions from the Department of State to Action.
n: An agency in the Department of State. From July 1, 1971, a part of ACTION; its Director there is under the Director of ACTION.
