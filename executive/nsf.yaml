unit: nsf
name: National Science Foundation
under: president
order: 500
law:
  - act: National Science Foundation Act of 1950
    date: '1950-05-10'
    tags: [creates, powers]
    cite: 'ch. 171, §§ 2–3, 64 Stat. 149'
    usc: '42 U.S.C. §§ 1861–1875 (1958)'
    does: Establishes in the executive branch a National Science Foundation, a National Science Board and a Director; the Foundation to develop a national policy for basic research and education in the sciences, support research by contracts and grants, award scholarships and graduate fellowships, and keep a register of scientific and technical personnel; it operates no laboratories.
  - act: Act of July 18, 1968
    date: '1968-07-18'
    tags: [powers, reorganizes]
    cite: 'Pub. L. 90-407, 82 Stat. 360'
    usc: '42 U.S.C. §§ 1861–1875 (1970)'
    does: Amends the 1950 Act. Adds applied research and the social sciences; annual authorization of appropriations; a Deputy Director and four Assistant Directors appointed by the President with the advice and consent of the Senate.
