# The Selective Service System. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: sss
name: Selective Service System
under: president
order: 500
law:
  - act: Selective Service Act of 1948
    date: '1948-06-24'
    tags: [creates, powers]
    cite: 'ch. 625, § 10(a), 62 Stat. 604, 618'
    usc: '50 U.S.C. App. § 460 (1958)'
    does: Establishes in the executive branch the Selective Service System, with a national headquarters, a headquarters in each State, and local and appeal boards of civilians, and a Director of Selective Service its head; transfers to it the Office of Selective Service Records.
  - act: Universal Military Training and Service Act
    date: '1951-06-19'
    tags: [powers]
    cite: 'ch. 144, § 1, 65 Stat. 75'
    usc: '50 U.S.C. App. §§ 451–471 (1958)'
    does: Renames the 1948 Act; extends induction to July 1, 1955 and lowers the age to eighteen and a half; a National Security Training Commission. Induction extended by later acts in 1955, 1959 and 1963.
  - act: Military Selective Service Act of 1967
    date: '1967-06-30'
    tags: [powers]
    cite: 'Pub. L. 90-40, 81 Stat. 100'
    usc: '50 U.S.C. App. §§ 451–473 (1970)'
    does: Renames the Act again and extends induction to July 1, 1971. Amended Nov. 26, 1969 (Pub. L. 91-124, 83 Stat. 220) to permit a random selection (the lottery); induction authority extended to July 1, 1973 by Pub. L. 92-129 (Sept. 28, 1971), and not after.
