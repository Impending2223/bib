# The Council on International Economic Policy, 1971-. Kept by hand. Holders known only from the Congressional Directory (CDIR <edition>) carry year
# dates and a Check. See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: ciep
name: Council on International Economic Policy
under: eop
order: 120
from: '1971-01-19'
law:
  - act: International Economic Policy Act of 1972
    date: '1972-08-29'
    cite: 'Pub. L. 92-412, title II, §§ 204–208, 86 Stat. 644, 647'
    usc: '22 U.S.C. §§ 2841–2845 (1970 Supp. II)'
    tags: [creates, powers, appointment, pay]
    does: 'Creates in the Executive Office a Council on International Economic Policy: the President, Chairman; the Secretaries of State, the Treasury, Defense, Agriculture, Commerce, and Labor, the Director of the Office of Management and Budget, the Chairman of the Council of Economic Advisers, and the Special Representative for Trade Negotiations; to advise the President on international economic policy and prepare an annual International Economic Report; a staff headed by an Executive Director appointed by the President, at level II (§ 208).'
n: 'Established by the President, Jan. 19, 1971, before the act of 1972. Check the instrument.'
