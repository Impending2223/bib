# The Federal Maritime Board (1950–61) and the Federal Maritime Commission (1961–). Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: fmc
name: Federal Maritime Board
names:
  - name: Federal Maritime Commission
    from: '1961-08-12'
under: president
order: 500
law:
  - act: Shipping Act, 1916
    date: '1916-09-07'
    tags: [powers]
    cite: 'ch. 451, 39 Stat. 728'
    usc: ['46 U.S.C. §§ 801–842 (1958)']
    does: Regulation of common carriers by water in foreign and interstate commerce; conference and other agreements filed for approval; discrimination and rebates forbidden.
  - act: Reorganization Plan No. 21 of 1950
    date: '1950-05-24'
    tags: [creates, appointment, reorganizes]
    cite: '64 Stat. 1273'
    usc: '5 U.S.C. § 133z–15 note (1958)'
    does: 'The United States Maritime Commission abolished. A Federal Maritime Board in the Department of Commerce: three members appointed by the President, by and with the advice and consent of the Senate, for four years, not more than two of one party; the President designates the chairman, who is ex officio Maritime Administrator. The Board keeps the regulatory functions and the award of subsidies, independent of the Secretary.'
  - act: Reorganization Plan No. 7 of 1961
    date: '1961-08-12'
    tags: [creates, appointment, reorganizes]
    cite: '75 Stat. 840'
    usc: '46 U.S.C. § 1111 note (1964)'
    does: 'The Federal Maritime Board abolished. The Federal Maritime Commission, independent: five commissioners appointed by the President, by and with the advice and consent of the Senate, for four years, not more than three of one party; the President designates the chairman, the chief executive and administrative officer. Regulatory functions to the Commission; subsidy functions to the Secretary of Commerce (Maritime Subsidy Board).'
n: The Board's and the Commission's members as the Congressional Directory lists them at each edition; the Commission's from 1961 by Wikipedia's list, which gives months. A "Check" marks a date known only to the year or month.
