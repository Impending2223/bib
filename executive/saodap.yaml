    does: 'Establishes in the Executive Office the Special Action Office for Drug Abuse Prevention, its Director and Deputy Director appointed by the President by and with the advice and consent of the Senate, and Assistant Directors; the President may authorize a sitting official to act until the posts are first filled; the Director at level II, the Deputy at level IV, six Assistant Directors at level V (§ 212). The Office to expire June 30, 1975.'
