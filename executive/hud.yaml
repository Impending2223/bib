law:
  - act: Reorganization Plan No. 3 of 1947
    date: '1947-07-27'
    cite: '61 Stat. 954'
    tags: [creates]
    until: '1965-11-09'
    does: 'Consolidates the Home Owners'' Loan Corporation, the Federal Savings and Loan Insurance Corporation, the Federal Housing Administration, the United States Housing Authority and other agencies in a Housing and Home Finance Agency, with constituent agencies the Home Loan Bank Board, the Federal Housing Administration and the Public Housing Administration.'
  - act: Housing Act of 1954
    date: '1954-08-02'
    cite: 'ch. 649, 68 Stat. 590'
    usc: '42 U.S.C. §§ 1450–1462 (1958)'
    tags: [powers]
    does: 'Urban renewal: loans and grants for slum clearance, rehabilitation and conservation; a workable program required of the community. Rechartered the Federal National Mortgage Association (title II).'
  - act: Department of Housing and Urban Development Act
    date: '1965-09-09'
    effective: '1965-11-09'
    cite: 'Pub. L. 89-174, 79 Stat. 667'
    usc: '42 U.S.C. §§ 3531–3537 (1970)'
    tags: [creates, reorganizes, powers]
    does: 'Establishes the Department; all functions of the Agency, of the Federal Housing Administration and of the Public Housing Administration, and of their heads and officers, to the Secretary; the Federal National Mortgage Association to the Department. Takes effect sixty days after approval.'
  - act: Department of Housing and Urban Development Act, § 11(b)
    date: '1965-09-09'
    cite: 'Pub. L. 89-174, 79 Stat. 667, 671'
    tags: [vacancy]
    until: '1966-01-18'
    does: 'Where a Senate-confirmed officer has not entered on office on the effective date, the President may designate an officer of the Agency to act for up to sixty days.'
  - act: Civil Rights Act of 1968, title VIII (Fair Housing)
    date: '1968-04-11'
    cite: 'Pub. L. 90-284, 82 Stat. 73, 81'
    usc: '42 U.S.C. §§ 3601–3619 (1970)'
    tags: [powers]
    does: 'Discrimination in the sale or rental of housing unlawful; administration of the title in the Secretary.'
  - act: Housing and Urban Development Act of 1968, § 802
    date: '1968-08-01'
    cite: 'Pub. L. 90-448, 82 Stat. 476, 536'
    usc: '12 U.S.C. § 1716b (1970)'
    tags: [reorganizes]
    does: 'The Federal National Mortgage Association partitioned: a Government National Mortgage Association in the Department; the secondary market operations to a private corporation.'
n: 'The Home Loan Bank Board was a constituent agency to Aug. 11, 1955 (Housing Amendments of 1955), then independent.'
