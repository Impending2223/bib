  - act: Reorganization Plan No. 1 of 1954
    date: '1954-07'
    tags: [creates, appointment, reorganizes]
    cite: '68 Stat. 1279'
    usc: '22 U.S.C. § 1622 note (1958)'
    does: 'Establishes the Commission: three members appointed by the President, by and with the advice and consent of the Senate, holding office during his pleasure; the President designates the Chairman. The functions of the War Claims Commission and of the International Claims Commission of the United States (in the Department of State) transferred to it; both abolished.'
