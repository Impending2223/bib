    does: Creates the Federal Deposit Insurance Corporation, to insure the deposits of member banks of the Federal Reserve System and of admitted nonmember banks.
  - act: Federal Deposit Insurance Act
    date: '1950-09-21'
    tags: [appointment, powers]
    cite: 'ch. 967, § 2, 64 Stat. 873'
    usc: ['12 U.S.C. §§ 1811–1831 (1958)']
    does: 'The Corporation''s law restated as a separate act. A Board of Directors of three: the Comptroller of the Currency and two members appointed by the President, by and with the advice and consent of the Senate, for six years; one of the appointive members the Chairman; not more than two of one party. The Comptroller acts as Chairman in a vacancy.'
n: Chairmen as the Corporation lists them; directors as the Congressional Directory lists them at each edition. The Comptroller of the Currency, the third member, is entered under the Treasury.
