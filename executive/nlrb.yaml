# The National Labor Relations Board. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: nlrb
name: National Labor Relations Board
under: president
order: 500
law:
  - act: National Labor Relations Act
    date: '1935-07-05'
    tags: [creates, powers]
    cite: 'ch. 372, §§ 3, 10, 49 Stat. 449, 451'
    usc: ['29 U.S.C. §§ 153, 160 (1958)']
    does: Creates the Board, of three members; empowered to prevent unfair labor practices affecting commerce and to certify bargaining representatives.
  - act: Labor Management Relations Act, 1947
    date: '1947-06-23'
    tags: [reorganizes, appointment, powers]
    cite: 'ch. 120, title I, § 101, 61 Stat. 136, 139'
    usc: '29 U.S.C. § 153 (1958)'
    does: 'Board enlarged to five members, appointed by the President by and with the advice and consent of the Senate for five years; one designated by the President as Chairman; removable by the President, upon notice and hearing, for neglect of duty or malfeasance in office, but for no other cause. A General Counsel. Unfair labor practices of labor organizations added.'
  - act: Labor-Management Reporting and Disclosure Act of 1959
    date: '1959-09-14'
    tags: [powers]
    cite: 'Pub. L. 86-257, § 701, 73 Stat. 519, 541'
    usc: '29 U.S.C. §§ 153(b), 164(c) (1964)'
    does: The Board may delegate its powers over representation cases to regional directors; may decline jurisdiction over disputes with slight effect on commerce, the States to assert it.
n: Terms of five years. Dates of service and of chairmanship are the Board's own list of members since 1935.
