# The Department of Commerce. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Below the Secretary, most dates come from the Congressional Directory's editions (CDIR <date>), so many are
# years or months only and carry a "Check". The Community Relations Service (in Commerce, July 1964–Apr. 1966)
# is in justice.yaml; the Federal Maritime Board, whose chairman was Maritime Administrator to Aug. 12, 1961,
# in fmc.yaml; the Bureau of Public Roads after Apr. 1, 1967, in transportation.yaml.
unit: commerce
name: Department of Commerce
under: president
order: 100
law:
  - act: Act of Feb. 14, 1903
    date: '1903-02-14'
    cite: 'ch. 552, 32 Stat. 825'
    tags: [creates, appointment]
    does: 'Establishes the Department of Commerce and Labor, with a Secretary of Commerce and Labor at its head, appointed by the President, by and with the advice and consent of the Senate, and an Assistant Secretary; to foster, promote, and develop the foreign and domestic commerce, the mining, manufacturing, shipping, and fishery industries, and the transportation facilities of the United States.'
  - act: Act of Mar. 4, 1913
    date: '1913-03-04'
    cite: 'ch. 141, 37 Stat. 736'
    usc: ['5 U.S.C. §§ 591, 596 (1958)', '15 U.S.C. §§ 1501, 1503 (1970)']
    tags: [creates, reorganizes]
    does: 'Creates a separate Department of Labor; the Department of Commerce and Labor renamed the Department of Commerce, the Secretary of Commerce and Labor the Secretary of Commerce.'
  - act: Reorganization Plan No. 5 of 1950
    date: '1950-05-24'
    cite: '64 Stat. 1263'
    usc: '5 U.S.C. § 133z note (1958)'
    tags: [powers, reorganizes]
    does: 'Transfers to the Secretary all functions of all other officers, agencies and employees of the Department, except the hearing examiners'', the Civil Aeronautics Board''s and the Inland Waterways Corporation''s; the Secretary may authorize any officer or employee to perform them; an Administrative Assistant Secretary, appointed by the Secretary with the President''s approval under the classified civil service.'
