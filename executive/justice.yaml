# The Department of Justice. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Sources: the Congressional Directory (CDIR, by edition), the Department's biographies of the Attorneys
# General (justice.gov), the Public Papers (APP), the Federal Judicial Center's biographical database (FJC),
# FRUS lists of persons, Wikipedia (leads only), the Statutes at Large and the U.S. Code, 1970 edition.
unit: justice
name: Department of Justice
under: president
order: 60
law:
  - act: Act of June 22, 1870 (Department of Justice)
    date: '1870-06-22'
    tags: [creates, appointment]
    cite: 'ch. 150, §§ 1–2, 16 Stat. 162'
    usc: ['5 U.S.C. § 291 (1958)', '5 U.S.C. § 295 (1958)']
    until: '1966-09-06'
    does: An executive department to be known as the Department of Justice, the Attorney General its head (§ 1). A Solicitor General and two Assistant Attorneys General, learned in the law, appointed by the President with the Senate's consent, to assist the Attorney General (§ 2). Carried into Revised Statutes §§ 346–348; later acts raised the Assistant Attorneys General to six (Act of Mar. 2, 1943, 57 Stat. 4).
  - act: Reorganization Plan No. 2 of 1950
    date: '1950-05-24'
    tags: [powers, reorganizes, appointment]
    cite: '64 Stat. 1261'
    usc: '5 U.S.C. § 133z-15 note (1958)'
    until: '1966-09-06'
    does: All functions of all other officers, agencies and employees of the Department transferred to the Attorney General, except those of hearing examiners, Federal Prison Industries, Inc., and the Board of Parole (§ 1); the Attorney General may authorize any officer or employee to perform any of his functions (§ 2). The Assistant to the Attorney General retitled Deputy Attorney General (§ 3). An additional Assistant Attorney General, the office of Assistant Solicitor General abolished (§ 4). An Administrative Assistant Attorney General (§ 5).
  - act: Reorganization Plan No. 4 of 1953
    date: '1953-06-20'
    tags: [appointment, vacancy, reorganizes]
    cite: '67 Stat. 636'
    usc: '5 U.S.C. § 133z-15 note (1958)'
    url: https://www.presidency.ucsb.edu/documents/special-message-the-congress-transmitting-reorganization-plan-4-1953-concerning-the
    does: The Deputy Attorney General, not the Solicitor General, to act as Attorney General in a vacancy, and to be the first assistant; failing both, the Assistant Attorneys General and the Solicitor General in the order the Attorney General prescribes (§ 1). An additional Assistant Attorney General; the Assistant Attorney General in charge of customs matters abolished (§ 2). Transmitted Apr. 20, 1953.
  - act: Civil Rights Act of 1957, § 111
    date: '1957-09-09'
    tags: [creates, appointment]
    cite: 'Pub. L. 85-315, § 111, 71 Stat. 634, 637'
    usc: '5 U.S.C. § 295 (1958)'
    does: One additional Assistant Attorney General, appointed by the President with the Senate's consent. The Civil Rights Division followed (Attorney General's order, Dec. 9, 1957).
  - act: Act of Sept. 6, 1966 (Title 5, U.S. Code, enacted)
    date: '1966-09-06'
    tags: [creates, powers, appointment, vacancy]
    cite: 'Pub. L. 89-554, § 4(c), 80 Stat. 378, 611'
    usc: ['28 U.S.C. §§ 501–510 (1970)']
    does: 'The Department of Justice an executive department at the seat of Government (§ 501). The President, with the Senate''s consent, appoints the Attorney General, its head (§ 503); may appoint a Deputy Attorney General (§ 504); appoints a Solicitor General (§ 505) and nine Assistant Attorneys General (§ 506). The Attorney General appoints an Assistant Attorney General for Administration, in the competitive service (§ 507). Vacancies (§ 508). All functions of the Department''s officers vested in the Attorney General (§ 509); he may delegate them (§ 510).'
