    n: 'Appointed by the Attorney General under 28 U.S.C. §§ 509, 510 and 515; removable only for extraordinary improprieties. Cox discharged on the President''s order by the Acting Attorney General, Oct. 20, 1973; the office abolished Oct. 23 and restored Nov. 2, 1973.'
