    law:
      - act: Judiciary Act of 1789, § 35
        date: '1789-09-24'
        tags: [creates, powers]
        cite: 'ch. 20, § 35, 1 Stat. 73, 92'
        usc: '5 U.S.C. § 291 (1958)'
        does: A meet person, learned in the law, to act as Attorney General for the United States; to prosecute and conduct all suits in the Supreme Court in which the United States is concerned, and to give his advice and opinion upon questions of law when required by the President or by the heads of departments.
      - act: Act of Sept. 6, 1966 (Title 5, U.S. Code, enacted)
        date: '1966-09-06'
        tags: [powers]
        cite: 'Pub. L. 89-554, § 4(c), 80 Stat. 378, 612'
        usc: '28 U.S.C. §§ 511–519 (1970)'
        does: The Attorney General gives his advice and opinion on questions of law when required by the President (§ 511) and by the heads of executive departments (§ 512); conducts and supervises all litigation in which the United States is a party (§§ 516–519).
      - act: Act of Dec. 10, 1973 (Attorney General's compensation)
        date: '1973-12-10'
        tags: [pay, appointment]
