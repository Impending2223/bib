        does: 'The compensation and emoluments of the office those in effect on Jan. 1, 1969, notwithstanding any increase effective from noon, Jan. 3, 1969, through noon, Jan. 2, 1975 (§ 1); a civil action, before three judges, to contest the appointment under Art. I, § 6, cl. 2 (§ 2). Enacted for Saxbe, a Senator in the Congress that raised the pay.'
