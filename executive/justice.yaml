        date: '1973-05-31'
        tags: [creates, powers, appointment]
        cite: '38 Fed. Reg. 14688'
        does: 'An Office of Watergate Special Prosecution Force, headed by a Special Prosecutor with full authority over the investigation and prosecution of offenses arising from the 1972 election and the Watergate break-in; the Attorney General not to remove him except for extraordinary improprieties (28 C.F.R. § 0.37 and appendix).'
