  - id: special-prosecutor
    title: Special Prosecutor
    rank: inferior
    appt: HD
    group: Watergate Special Prosecution Force
    from: '1973-05-25'
    n: 'Appointed by the Attorney General under 28 U.S.C. §§ 509, 510 and 515; removable only for extraordinary improprieties. Cox discharged on the President''s order by the Acting Attorney General, Oct. 20, 1973; the office abolished Oct. 23 and restored Nov. 2, 1973.'
    law:
      - act: Attorney General's Order No. 517-73
        date: '1973-05-31'
        tags: [creates, powers, appointment]
        cite: '38 Fed. Reg. 14688'
        does: 'An Office of Watergate Special Prosecution Force, headed by a Special Prosecutor with full authority over the investigation and prosecution of offenses arising from the 1972 election and the Watergate break-in; the Attorney General not to remove him except for extraordinary improprieties (28 C.F.R. § 0.37 and appendix). Check the Federal Register page.'
      - act: Acting Attorney General's Order No. 546-73
        date: '1973-10-23'
        tags: [reorganizes]
        cite: '38 Fed. Reg. 29466'
        does: The Office abolished, effective Oct. 21, 1973, its functions to the Criminal Division. Check the Federal Register page.
      - act: Acting Attorney General's Order No. 551-73
        date: '1973-11-02'
        tags: [creates, powers, appointment]
        cite: '38 Fed. Reg. 30738'
        does: The Office re-established, with the same authority; the jurisdiction not to be limited, nor the Special Prosecutor removed, without the President's first consulting the leaders of both Houses and the Judiciary Committees and finding a consensus. Upheld in United States v. Nixon, 418 U.S. 683 (1974).
    holders:
      - name: Cox, Archibald
        appointed: '1973-05-18'
        from: '1973-05-25'
        to: '1973-10-20'
