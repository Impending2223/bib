# The Federal Bureau of Investigation. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
# Sources: the Congressional Directory (CDIR, by edition), the Public Papers (APP), FRUS lists of persons,
# Wikipedia (leads only), the Statutes and the U.S. Code, 1970 edition.
unit: fbi
name: Federal Bureau of Investigation
under: justice
order: 10
law:
  - act: Act of May 22, 1908 (appropriations)
    date: '1908-05-22'
    tags: [creates]
    cite: 'ch. 186, 35 Stat. 184, 236'
    usc: '28 U.S.C. § 531 note (1970)'
    does: Funds for the detection and prosecution of crimes; the Bureau of Investigation made from them by the Attorney General's order of July 26, 1908. The act does not name the Bureau.
  - act: Executive Order 6166, § 3
    date: '1933-06-10'
    tags: [reorganizes]
    url: https://www.presidency.ucsb.edu/documents/executive-order-6166-organization-executive-agencies
    does: The Bureau of Investigation and the investigative functions of the Bureau of Prohibition consolidated in a Division of Investigation in the Department of Justice, headed by a Director of Investigation.
  - act: Act of Mar. 22, 1935 (appropriations)
    date: '1935-03-22'
    tags: [reorganizes]
    cite: 'ch. 39, title II, 49 Stat. 67, 77'
    does: The Division of Investigation first designated the Federal Bureau of Investigation.
  - act: Act of Sept. 6, 1966 (Title 5, U.S. Code, enacted)
    date: '1966-09-06'
    tags: [creates, powers]
    cite: 'Pub. L. 89-554, § 4(c), 80 Stat. 378, 616'
    usc: '28 U.S.C. §§ 531–535 (1970)'
    does: The Federal Bureau of Investigation is in the Department of Justice (§ 531). The Attorney General may appoint officials to detect and prosecute crimes against the United States, to assist in protecting the President, and to conduct other investigations (§ 533).
offices:
  - id: director
    title: Director of the Federal Bureau of Investigation
    rank: inferior
    appt: HD
    level: II
    n: Appointed by the Attorney General; by the President with the Senate's consent from May 3, 1972 (Pub. L. 90-351, § 1101).
    law:
      - act: Act of Sept. 6, 1966 (Title 5, U.S. Code, enacted)
        date: '1966-09-06'
        tags: [appointment]
        cite: 'Pub. L. 89-554, § 4(c), 80 Stat. 378, 616'
        usc: '28 U.S.C. § 532 (1970)'
        does: The Attorney General may appoint a Director of the Federal Bureau of Investigation, its head.
      - act: Federal Executive Salary Act of 1964, § 303(b)
        date: '1964-08-14'
        effective: '1964-07'
        tags: [pay]
        cite: 'Pub. L. 88-426, § 303(b), 78 Stat. 400, 416'
        usc: '5 U.S.C. § 5313 (1970)'
        does: Level II so long as the position is held by the present incumbent; thereafter level III.
      - act: Omnibus Crime Control and Safe Streets Act of 1968, § 1101
        date: '1968-06-19'
        effective: '1972-05-03'
        tags: [appointment, pay]
        cite: 'Pub. L. 90-351, § 1101, 82 Stat. 197, 236'
        usc: '28 U.S.C. § 532 note (1970)'
        does: From the day after the present incumbent ceases to serve, the Director appointed by the President with the Senate's consent, at level II.
    holders:
      - name: Hoover, J. Edgar
        from: '1924-05-10'
        to: '1972-05-02'
        out: Died.
        n: Director of the Bureau of Investigation, 1924; of the Division of Investigation, 1933; of the FBI from 1935. Appointed by the Attorney General.
        src: [Wikipedia, CDIR 1953-03, FRUS persons list]
      - name: Gray, L. Patrick, III
        acting: true
        nominated: '1973-02'
        from: '1972-05-03'
        to: '1973-04-27'
        out: Resigned.
        n: 'Designated by the Attorney General, May 3, 1972. Nominated Director, Feb. 1973; withdrawal announced Apr. 5, 1973 (APP). Check: Wikipedia gives the nomination Feb. 15.'
        src: [APP, Wikipedia]
      - name: Ruckelshaus, William D.
        acting: true
        from: '1973-04-30'
        to: '1973-07-09'
        n: Administrator, Environmental Protection Agency, to Apr. 30, 1973.
        src: [FRUS persons list, Wikipedia]
      - name: Kelley, Clarence M.
        from: '1973-07-09'
        n: Sworn July 9, 1973, at Kansas City by Chief Judge Becker (APP). The first Director confirmed by the Senate. Check the dates of nomination and confirmation.
        src: [APP, FRUS persons list, CDIR 1973-12]

