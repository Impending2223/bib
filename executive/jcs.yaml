  - id: commandant
    title: Commandant of the Marine Corps
    rank: military
    appt: MIL
    law:
      - act: Act of June 28, 1952 (Marine Corps strength; the Commandant and the Joint Chiefs)
        date: '1952-06-28'
        until: '1956-08-10'
        tags: [powers]
        cite: Pub. L. 82-416, ch. 479, § 2, 66 Stat. 282, 283
        usc: 5 U.S.C. § 171f (1952)
        does: The Commandant indicates to the Chairman any matter before the Joint Chiefs of Staff directly concerning the Marine Corps; unless the Secretary of Defense determines otherwise, he meets with them on it, with co-equal status.
      - act: Title 10, United States Code, enacted
        date: '1956-08-10'
        tags: [appointment, powers]
        cite: ch. 1041, 70A Stat. 1, 292
        usc:
          - 10 U.S.C. § 5201 (1958)
          - 10 U.S.C. § 141(c) (1958)
        does: The Commandant appointed by the President, by and with the advice and consent of the Senate, for four years, from officers of the Marine Corps not below colonel; duties under the Secretary of the Navy; his place with the Joint Chiefs (§ 141(c)).
      - act: Act of June 5, 1967 (Armed Forces appropriation authorization, 1968), title IV
        date: '1967-06-05'
        effective: '1969-01-01'
        tags: [appointment]
        cite: Pub. L. 90-22, § 404, 81 Stat. 52, 54
        usc: 10 U.S.C. § 5201(a) (1970)
        does: A term of four years, at the President's pleasure; reappointment for not more than four years only in a war or national emergency declared by Congress after Dec. 31, 1968.
    n: Head of the Marine Corps, in the Department of the Navy; his staff and commands are in the Marine Corps unit. Appointed by the President, by and with the advice and consent of the Senate (10 U.S.C. § 5201). A member of the Joint Chiefs of Staff only for matters directly concerning the Marine Corps (1952); a full member from 1978.
