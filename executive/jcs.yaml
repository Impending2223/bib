# The Joint Chiefs of Staff and the Joint Staff, 1953-74. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: jcs
name: Joint Chiefs of Staff
under: defense
order: 10
law:
  - act: National Security Act of 1947
    date: '1947-07-26'
    until: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 343, § 211, 61 Stat. 495, 505
    usc: 5 U.S.C. § 171f (1952)
    does: 'Establishes the Joint Chiefs of Staff: the Chief of Staff, U.S. Army; the Chief of Naval Operations; the Chief of Staff, U.S. Air Force. Principal military advisers to the President and the Secretary of Defense. Strategic plans; joint logistic plans; unified commands in strategic areas; joint training.'
  - act: National Security Act Amendments of 1949
    date: '1949-08-10'
    until: '1956-08-10'
    tags: [reorganizes, powers]
    cite: ch. 412, § 7(b), 63 Stat. 578, 581
    usc: 5 U.S.C. § 171f (1952)
    does: 'The Joint Chiefs of Staff within the Department of Defense: the Chairman, presiding, without vote, and the three chiefs. Principal military advisers to the President, the National Security Council, and the Secretary of Defense. Duties restated.'
  - act: Title 10, United States Code, enacted
    date: '1956-08-10'
    tags: [creates, powers]
    cite: ch. 1041, 70A Stat. 1, 6
    usc: 10 U.S.C. §§ 141–143 (1958)
    does: 'Restates the law of the Joint Chiefs of Staff: composition, the Chairman, the Joint Staff, duties (§§ 141–143); the Commandant''s place on Marine Corps matters (§ 141(c)).'
  - act: Department of Defense Reorganization Act of 1958
    date: '1958-08-06'
    tags: [powers]
    cite: Pub. L. 85-599, § 3(a), 72 Stat. 514, 516
    usc: 5 U.S.C. § 171a(c)(8) (1958)
    does: A member of the Joint Chiefs of Staff may present recommendations to Congress on his own initiative, after first informing the Secretary of Defense. Unified and specified commands under the President through the Secretary; the Joint Chiefs advise.
n: 'Members: the Chairman; the Chief of Staff, U.S. Army; the Chief of Naval Operations; the Chief of Staff, U.S. Air Force; and, for matters directly concerning the Marine Corps, the Commandant of the Marine Corps (a full member only from 1978). Each chief is appointed to his post by the President, by and with the advice and consent of the Senate. Dates: the JCS History Office''s table of members (taking office and leaving), with Wikipedia''s lists; where they differ the JCS date is given and the holder''s note says so. Nomination and confirmation dates for most of the chiefs not yet found (Senate Executive Journal): Check.'
offices:
  - id: chairman
    title: Chairman of the Joint Chiefs of Staff
    rank: military
    appt: MIL
    law:
      - act: National Security Act Amendments of 1949
        date: '1949-08-10'
        until: '1956-08-10'
        tags: [creates, appointment, pay, powers]
        cite: ch. 412, § 7(b), 63 Stat. 578, 582
        usc: 5 U.S.C. § 171f(c)–(e) (1952)
        does: 'Creates the Chairman: appointed by the President, by and with the advice and consent of the Senate, from the Regular officers, to serve at the President''s pleasure for two years, eligible for one reappointment except in a war declared by Congress. Presides; no vote; no command over the Joint Chiefs or the services; pay of the Chief of Staff of the Army; precedence over all other officers.'
      - act: Title 10, United States Code, enacted
        date: '1956-08-10'
        tags: [appointment, powers]
        cite: ch. 1041, 70A Stat. 1, 6
        usc: 10 U.S.C. § 142 (1958)
        does: 'The Chairman: appointment, two-year term, one reappointment in peace; duties; precedence.'
      - act: Department of Defense Reorganization Act of 1958
        date: '1958-08-06'
        tags: [powers]
        cite: Pub. L. 85-599, § 7, 72 Stat. 514, 519
        usc: 10 U.S.C. §§ 141–143 (1958)
        does: 'Strikes "who has no vote": the Chairman a voting member of the Joint Chiefs of Staff. The Chairman manages the Joint Staff and its Director on behalf of the Joint Chiefs.'
    n: Appointed by the President, by and with the advice and consent of the Senate (10 U.S.C. § 142), for two-year terms.
