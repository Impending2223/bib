# The International Cooperation Administration (1955-61) and the Agency for International Development (from 1961),
# in the Department of State. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: aid
name: International Cooperation Administration
names:
  - name: Agency for International Development
    from: '1961-11-03'
under: state
order: 60
from: '1955-07-01'
law:
  - act: Executive Order 10610
    date: '1955-05-09'
    effective: '1955-06-30'
    until: '1961-11-03'
    tags: [creates, reorganizes]
    cite: 20 Fed. Reg. 3179
    does: The functions and offices of the Foreign Operations Administration, but for the office of its Director, to the Secretary and the Department of State, to be administered by a semiautonomous organization there; the Secretary established it as the International Cooperation Administration (Delegation of Authority No. 85, June 30, 1955).
    url: https://www.presidency.ucsb.edu/documents/executive-order-10610-administration-mutual-security-and-related-functions
  - act: Mutual Security Act of 1954
    date: '1954-08-26'
    until: '1961-11-03'
    tags: [powers]
    cite: ch. 937, 68 Stat. 832
    does: The military, economic, and technical assistance programs; the President's functions, delegated in part to the Secretary of State and administered by the Director of the International Cooperation Administration.
  - act: Foreign Assistance Act of 1961
    date: '1961-09-04'
    tags: [creates, appointment, reorganizes, powers]
    cite: Pub. L. 87-195, § 624, 75 Stat. 424, 445
    usc: 22 U.S.C. § 2384 (1964)
    does: The President may appoint, with the advice and consent of the Senate, an officer with the rank of an Under Secretary of an executive department to direct the programs, and other officers to administer them (§ 624(a)); abolishes the International Cooperation Administration and the Development Loan Fund, their functions to the President.
  - act: Executive Order 10973
    date: '1961-11-03'
    tags: [creates, powers, appointment]
    cite: 26 Fed. Reg. 10469
    does: The President's functions under the Foreign Assistance Act delegated to the Secretary of State, who shall establish in the Department the Agency for International Development, headed by an Administrator, the officer of § 624(a)(1) of the Act.
    url: https://www.presidency.ucsb.edu/documents/executive-order-10973-administration-foreign-assistance-and-related-functions
  - act: Federal Executive Salary Act of 1964
    date: '1964-08-14'
    tags: [pay]
    cite: Pub. L. 88-426, § 303, 78 Stat. 400, 416
    does: 'Executive Schedule: Administrator, level II; Deputy Administrator, level III; Assistant Administrators (6) and Regional Assistant Administrators (4), level IV; General Counsel, level V.'
n: In the Department of State, under the Secretary's direction. The International Cooperation Administration from July 1, 1955; the Agency for International Development from Nov. 3, 1961 (Executive Order 10973), which took the functions of the ICA and the Development Loan Fund.
