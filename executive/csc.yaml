law:
  - act: Civil Service Act (Act of Jan. 16, 1883)
    date: '1883-01-16'
    tags: [creates, powers, appointment]
    cite: 'ch. 27, § 1, 22 Stat. 403'
    usc: ['5 U.S.C. §§ 632–633 (1958)', '5 U.S.C. §§ 1101–1105 (1970)']
    does: Three Civil Service Commissioners, appointed by the President with the advice and consent of the Senate, not more than two of the same party, removable by the President, holding no other office; the Commission aids the President in preparing civil service rules and holds open competitive examinations.
  - act: Reorganization Plan No. 5 of 1949
    date: '1949-08-20'
    tags: [powers, reorganizes]
    cite: '63 Stat. 1067'
    usc: '5 U.S.C. § 632 note (1958)'
    does: The President designates one commissioner Chairman, the Commission's presiding head and chief executive and administrative officer; transfers to him the functions of the President of the Commission, the Executive Director and Chief Examiner, and the Secretary.
