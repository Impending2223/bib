# The Council on Environmental Quality, 1970-. Kept by hand. Holders known only from the Congressional Directory (CDIR <edition>) carry year
# dates and a Check. See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: ceq
name: Council on Environmental Quality
under: eop
order: 110
from: '1970-01-01'
law:
  - act: National Environmental Policy Act of 1969
    date: '1970-01-01'
    cite: 'Pub. L. 91-190, §§ 202–206, 83 Stat. 852, 854'
    usc: '42 U.S.C. §§ 4342–4346 (1970)'
    tags: [creates, appointment, powers, pay]
    does: 'Creates in the Executive Office a Council on Environmental Quality of three members appointed by the President to serve at his pleasure, by and with the advice and consent of the Senate; the President designates one Chairman; the Council assists in the annual Environmental Quality Report, gathers information on environmental trends, appraises the Government''s programs, and recommends policy; the Chairman at level II, the other members at level IV (§ 206).'
  - act: Environmental Quality Improvement Act of 1970
    date: '1970-04-03'
    cite: 'Pub. L. 91-224, title II, 84 Stat. 91, 114'
    usc: '42 U.S.C. §§ 4371–4374 (1970)'
    tags: [creates, powers]
    does: 'Establishes in the Executive Office an Office of Environmental Quality, its Director the Chairman of the Council, to provide the Council''s professional and administrative staff.'
