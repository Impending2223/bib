- id: ocb-chairman
  title: Chairman of the Operations Coordinating Board
  rank: employee
  appt: XO
  group: The Operations Coordinating Board, 1953–61
  from: '1953-09-02'
  until: '1961-02-18'
  law:
  - act: Executive Order 10483
    date: '1953-09-02'
    until: '1957-07-01'
    tags:
    - creates
    - powers
    - appointment
    cite: 18 Fed. Reg. 5379
    url: https://www.presidency.ucsb.edu/documents/executive-order-10483-establishing-the-operations-coordinating-board
    does: 'Establishes the Board, reporting to the Council: the Under Secretary of State (chairman), the Deputy Secretary
      of Defense, the Director of the Foreign Operations Administration, the Director of Central Intelligence, and a representative
      of the President; to coordinate the departments'' operational plans to carry out national security policies the President
      approves. Abolishes the Psychological Strategy Board.'
