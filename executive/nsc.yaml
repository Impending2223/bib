  n: 'A White House Office post, not provided by statute: appointed by the President, paid from the White House staff appropriation
    (3 U.S.C. § 105), and serving at his pleasure. Created for Cutler, Mar. 1953, as the Council''s principal executive officer:
    chairman of the Planning Board, and from 1953 a member of the Operations Coordinating Board (its chairman, 1960–61). Heads
    the Council''s staff from 1961. Rostow''s title omitted the words "for National Security Affairs".'
