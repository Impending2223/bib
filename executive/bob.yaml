# The Bureau of the Budget; the Office of Management and Budget from July 1, 1970. Kept by hand.
# Below the Director and Deputy, holders known only from the Congressional Directory (CDIR <edition>) carry year dates
# and a Check. See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: bob
name: Bureau of the Budget
names:
