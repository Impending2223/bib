under: eop
order: 20
law:
  - act: Budget and Accounting Act, 1921
    date: '1921-06-10'
    cite: 'ch. 18, § 207, 42 Stat. 20, 22'
    usc: '31 U.S.C. § 16 (1958)'
    tags: [creates, powers, appointment, vacancy]
    does: 'Creates in the Treasury a Bureau of the Budget, with a Director and an Assistant Director appointed by the President; the Assistant Director acts as Director in his absence or in a vacancy. The Bureau prepares the Budget for the President, with authority to assemble, correlate, revise, reduce, or increase the estimates of the departments.'
  - act: Reorganization Plan No. 1 of 1939
    date: '1939-07-01'
    cite: '53 Stat. 1423'
    usc: '5 U.S.C. § 133t note (1958)'
    tags: [reorganizes]
    does: 'Transfers the Bureau, its Director and Assistant Director, from the Treasury to the Executive Office of the President, administered by the Director under the direction of the President (§ 1).'
  - act: Budget and Accounting Procedures Act of 1950
    date: '1950-09-12'
    cite: 'ch. 946, title I, 64 Stat. 832'
    usc: '31 U.S.C. §§ 18a–18c (1958)'
    tags: [powers]
    does: 'The President, through the Director, to develop programs and regulations for better organization and management of the executive branch and for improved statistical information (§§ 103, 104); budget form and content.'
  - act: Reorganization Plan No. 2 of 1970
    date: '1970-07-01'
    cite: '84 Stat. 2085'
    usc: '31 U.S.C. § 16 note (1970)'
    tags: [reorganizes, powers, vacancy]
    does: 'Transfers the functions of the Bureau and its Director to the President; designates the Bureau the Office of Management and Budget, its Director, Deputy Director, and statutory Assistant Directors as officers of the Office; up to six further officers at level V appointed by the Director; the Deputy Director acts as Director in his absence or in a vacancy (Part I).'
  - act: Executive Order 11541
    date: '1970-07-01'
    cite: '35 Fed. Reg. 10737'
    url: https://www.presidency.ucsb.edu/documents/executive-order-11541-prescribing-the-duties-the-office-management-and-budget-and-the
    tags: [powers]
    does: 'Delegates to the Director the functions transferred to the President by the plan; the Office to assist in developing efficient coordinating mechanisms, in preparing the budget, in clearing legislation, and in evaluating programs.'
