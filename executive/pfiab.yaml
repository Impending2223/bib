order: 45
from: '1956-01-13'
law:
- act: Executive Order 10656
  date: '1956-02-06'
  effective: '1956-01-13'
  until: '1961-05-04'
  tags:
  - creates
  - powers
  - appointment
  - pay
  cite: 21 Fed. Reg. 859
  url: https://www.presidency.ucsb.edu/documents/executive-order-10656-establishing-the-presidents-board-consultants-foreign-intelligence
  does: 'Establishes the President''s Board of Consultants on Foreign Intelligence Activities: members appointed by the President
    from outside the Government, without compensation; to review the Government''s foreign intelligence activities and the
    Central Intelligence Agency''s performance and report to the President semiannually.'
- act: Executive Order 10938
  date: '1961-05-04'
  until: '1969-03-20'
  tags:
  - creates
  - powers
  - appointment
  - pay
  cite: 26 Fed. Reg. 3951
  url: https://www.presidency.ucsb.edu/documents/executive-order-10938-establishing-the-presidents-foreign-intelligence-advisory-board
  does: Establishes the President's Foreign Intelligence Advisory Board, members from outside the Government, with compensation;
    to advise the President on the objectives and conduct of foreign intelligence and review all functions of the Central
    Intelligence Agency; revokes Executive Order 10656.
- act: Executive Order 11460
  date: '1969-03-20'
  tags:
  - creates
  - powers
  - appointment
  - pay
  cite: 34 Fed. Reg. 5535
  url: https://www.presidency.ucsb.edu/documents/executive-order-11460-establishing-the-presidents-intelligence-advisory-board
  does: 'Re-establishes the Board: to advise on the objectives, conduct, management and coordination of the national intelligence
    effort; a staff under an Executive Secretary appointed by the President; revokes Executive Order 10938.'
n: Eight members named Jan. 1956 (letter to Killian, Jan. 11, 1956). The members resigned with the administration (last meeting
  with Eisenhower, Jan. 5, 1961); no board until May 4, 1961. Members' terms from the FRUS persons lists, APP and Wikipedia;
  most only by year.
