        does: 'Members appointed by the President with the advice and consent of the Senate, the nomination to set out the nominee''s experience and qualifications; five-year terms; removable by the President for inefficiency, neglect of duty, or malfeasance; no other business or employment; $18,000, the Chairman $20,000 (§ 22).'
