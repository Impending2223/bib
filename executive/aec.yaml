        tags: [appointment, vacancy, powers]
        cite: 'ch. 1073, § 1, 68 Stat. 919, 924'
        usc: '42 U.S.C. § 2031 (1958)'
        does: 'The President designates one member Chairman, during his pleasure; the Chairman may designate another member Acting Chairman in his absence. The Chairman presides, speaks for the Commission, and sees to the faithful execution of its policies and decisions (§ 21).'
