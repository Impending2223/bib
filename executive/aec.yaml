# The Atomic Energy Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: aec
name: Atomic Energy Commission
under: president
order: 500
law:
  - act: Atomic Energy Act of 1946
    date: '1946-08-01'
    until: '1954-08-30'
    tags: [creates, powers, appointment]
    cite: 'ch. 724, § 2, 60 Stat. 755, 756'
    usc: '42 U.S.C. §§ 1801–1819 (1952)'
    does: Establishes an Atomic Energy Commission of five members, appointed by the President with the advice and consent of the Senate, one designated Chairman by the President; Government ownership of fissionable material and production facilities; the Commission to conduct research and production for the common defense and security.
  - act: Atomic Energy Act of 1954
    date: '1954-08-30'
    tags: [creates, powers, reorganizes]
    cite: 'ch. 1073, § 1, 68 Stat. 919, 921'
    usc: '42 U.S.C. §§ 2011–2281 (1958)'
    does: Restates the 1946 Act. The Commission continued (§ 21); private ownership and operation of reactors under Commission license; dissemination of information and international cooperation under agreements for cooperation.
n: The Commission's functions divided by the Energy Reorganization Act of 1974 (Pub. L. 93-438, Oct. 11, 1974) between the Energy Research and Development Administration and the Nuclear Regulatory Commission; the Commission abolished Jan. 19, 1975, after the period.
