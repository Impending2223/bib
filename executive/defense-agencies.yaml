# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: defense-agencies
name: Defense agencies
under: defense
order: 60
law:
  - act: Department of Defense Reorganization Act of 1958
    date: '1958-08-06'
    tags: [creates, powers]
    cite: Pub. L. 85-599, § 3(a), 72 Stat. 514, 515
    usc:
      - 5 U.S.C. § 171a(c)(6) (1958)
      - 10 U.S.C. § 125(d) (1964)
    does: Whenever the Secretary of Defense finds it advantageous in effectiveness, economy, or efficiency, he provides for the carrying out of any supply or service activity common to more than one military department by a single agency.
n: Agencies of the Department of Defense headed by military officers, established by the President's directive or the Secretary's. Their directors are assigned; no Senate confirmation of the post. ARPA (1958), a civilian agency under the Director of Defense Research and Engineering, is with the Office of the Secretary of Defense.
