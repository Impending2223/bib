# The Federal Trade Commission. Kept by hand.
# See tools/bib/executive.py for the fields. Run ./bib executive check after editing.
unit: ftc
name: Federal Trade Commission
under: president
order: 500
law:
  - act: Federal Trade Commission Act
    date: '1914-09-26'
    tags: [creates, appointment]
    cite: 'ch. 311, § 1, 38 Stat. 717, 718'
    usc: '15 U.S.C. § 41 (1958)'
    does: 'Creates the Commission: five commissioners appointed by the President, by and with the advice and consent of the Senate, for seven years; not more than three of one party; removable by the President for inefficiency, neglect of duty, or malfeasance in office. The commission to choose a chairman from its own membership.'
  - act: Federal Trade Commission Act
    date: '1914-09-26'
    tags: [powers]
    cite: 'ch. 311, §§ 5–6, 38 Stat. 717, 719'
    usc: ['15 U.S.C. §§ 45–46 (1958)']
    does: Unfair methods of competition in commerce declared unlawful; the Commission empowered to prevent them by complaint, hearing, and order to cease and desist, and to investigate corporations and report.
  - act: Clayton Act
    date: '1914-10-15'
    tags: [powers]
    cite: 'ch. 323, § 11, 38 Stat. 730, 734'
    usc: '15 U.S.C. § 21 (1958)'
    does: Authority to enforce the prohibitions of price discrimination, tying contracts, stock acquisitions, and interlocking directorates, in commerce generally.
  - act: Wheeler-Lea Act
    date: '1938-03-21'
    tags: [powers]
    cite: 'ch. 49, 52 Stat. 111'
    usc: ['15 U.S.C. §§ 45, 52–58 (1958)']
    does: Unfair or deceptive acts or practices in commerce made unlawful; false advertisement of foods, drugs, devices, and cosmetics.
n: 'Seven-year terms expire Sept. 25 or 26. The Wikipedia list of members begins in 1949 and omits most of the members of the 1950s; their dates here come from their biographies and the Congressional Directory, and carry a "Check" where only the year or month is known.'
