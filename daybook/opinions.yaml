# The opinions of the Attorney General and the Office of Legal Counsel, Jan. 1960-Dec. 1969 (kept by hand).
# Rendered in each day's Documents block, "Opinions", by tools/bib/opinions.py (its STYLE notes); checked there too.
# Every row read off a copy; nothing from memory. What is known of and not read is under `known`, with its Check.
#
# opinions: one row an opinion or legal memorandum, in date order.
#   key        oag:<vol>-<page> (Official Opinions of the Attorneys General); olc:supp1-<page> (Supplemental Opinions
#              of the Office of Legal Counsel, vol. 1, 2013); frus:<volume>/d<N> (printed in FRUS); dsb:<date>-<name>
#   kind       ag (the Attorney General's formal opinion, in the Official Opinions); olc (the Office of Legal Counsel's);
#              doj (another officer's of the Department: the Deputy Attorney General's, an Attorney General's informal
#              memorandum); state (the State Department's Legal Adviser's: noted, not the Department of Justice's)
#   cite       the Bluebook's: "42 Op. Att'y Gen. 69 (1961)"; the Office's own form for its supplement, "1 Op. O.L.C.
#              Supp. 195 (1961)"; the FRUS document; the Bulletin's issue and page
#   date       the opinion's date as printed (YYYY-MM-DD)
#   filed      frus: undated, filed under the date of the FRUS document that prints it (see note)
#   title      the heading as printed (the volume's in capitals, put in title case); FRUS's subject line
#   by         the signer, as Part III writes names ("Kennedy, Robert F."); none where unsigned
#   by_title   his title as signed ("Acting Attorney General"; "Assistant Attorney General, Office of Legal Counsel")
#   to         the addressee, as printed ("the President", "the Secretary of State"); none for a statement
#   holding    one line, the series' plain style, from the headnotes and the text
#   note       what the volume or its editor says of the signer, the date or the publication
#   released   the date the volume says it was released for publication, where later than the opinion
#   made_public  the year a private opinion was first printed (the supplement: 2013)
#   copy       the open copy read, linked at the opinion's first page
#   read       the copy and the page or leaf read
# known: opinions known of from another document and not read: key, kind (known), date (as close as known),
#   by_title, what, source (the document that names it, cited), check (what to find).
