  date: 1960-07
  by_title: Attorney General
  what: The Attorney General advised Eisenhower that the refugee act's termination of the parole power by a simple resolution
    of either House raised "a serious question" of constitutionality.
  source: Statement by the President Upon Signing Bill Providing for the Admission of Refugees, 1960–61 Pub. Papers 579
    (July 14, 1960)
  check: The advice and its date; not in 41 Op. Att'y Gen.
