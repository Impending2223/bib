    value of the shipment does not exceed $400; H.R. 4317, to amend the Internal Revenue Code of 1954 and incorporate
    therein provisions for the payment of annuities to widows and certain dependents of the judges of the Tax Court
    of the U.S.; ~nd H.R. 6413, to extend to fishermen the same treatment accorded farmers in relation to estimated
    income tax. The committee also instructed the chairman to introduce a clean bill embodying decisions made on
    the proposal relating to the duty-free allowance accorded returning tourists as follows: Reduction of the $500
    allowance to $100 for the period until July 1, 1963, with certain other amendments relating to the Virgin Islands.
    There would be no absence requirement in the case of travel to the Virgin Islands to be eligible to claim this
    exemption. The committee will continue in executive session Wednesday, April 26.'
