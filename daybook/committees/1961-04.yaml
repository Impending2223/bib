  heading: WATER POLLUTION
  bills:
  - H.R. 4036
  exec: true
  text: Met in executive session and ordered favorably reported to the House, with amendments, H.R. 4036, to amend
    the Federal Water Pollution Control Act to provide for a more effective program of water pollution control.
    H.R. 4036, as amended, authorizes (1) increaS!ng the authorization of appropriations for waste treatment works
    construction grants from $50 million to $100 million annually and the total authorization from $500 million
    to $1 billion; (2) increasing maximum allowable grant from $250,000 to $800,000 and substituting sliding scale
    formula for present 30-percent grant limitation; (3) construction of joint projects serving more than one municipality
    with $2.4 million ceiling on grants for such projects; (4) requiring priority for all' previously filed applications
    under $250,000; (5) increasing grants to. States and interstate water pollution control programs from $3 million
    to $5 million and extending the time limit on such grants to June 30, 1971; (6) establishment of field research
    facilities in various parts of the country, and water quality studies of the Great Lakes; (7) expanding Federal
    pollution abatement enforcement authority to all navigable waters and issuance of final orders by Secretary
    of Health, Education, and Welfare in enforcement actions; (8) inclusion of discharges from Federal installations
    in all administrative.findings and recommendations in Federal abatement actions; and (9) transfer of re.sponsibility
    for administration of Fed. eral pollution control program from the Surgeon Gen eral to the Secretary of Health,
    Education, and Welfare. Also approved a Federal post office and a prospectus on a post office, in Macon, Ga.
  page: D160
  pdf: 158
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=158
