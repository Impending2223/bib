  heading: NOMINATIONS, AND AGREEMENT WITH GERMANY
  exec: true
  open: true
  text: On Wednesday, April 5, committee, in executive session, ordered favorably reported the nominations of Frederick
    Reinhardt, of California, to be Ambassador to Italy; Joseph C. Satterthwaite, of Michigan, to be Ambassador
    to the Union of South Africa; Parker T. Hart, of Illinois, to be Ambassador to Saudi Arabia; Raymond Telles,
    of Texas, to be Ambassador to Costa Rica; Graham A. Martin, of Florida, to be U.S. representative to the 16th
    Session of the Economic Commission for Europe of the U.N. Eco:nomic and Social Council; Mrs. Jane Warner Dick,
    of Illinois, to be U.S. representative to the U.N. Social Commission on the Economic and Social Council; and
    John M. Leddy, of Virginia, to be U.S. Executive Director of the International Bank for Reconstruction and Development.
    Prior to this action, in open session, hearings were held on the nominations of Messrs. Reinhardt, Satterthwaite,
    Hart, and Telles, where the nominees testified and answered questions in their own behalf. The committee also
    held hearings on the Second Agreement between the U.S. and the Federal Republic of Germany in regard to validation
    of German Dollar Bonds (Ex. D, 87th Cong., 1st sess.), with testimony thereon from Richard H. Davis, Deputy
    Assistant Secretary of State for European Affairs.
