  text: Subcommittee on Indian Affairs concluded hearings on S. 869 and S. 870, to amend the Menominee Termination
    Act to extend Federal supervision of the Menominee Tribe, after receiving testimony from Gerald Grignon and
    Mitchell Dodge, both representing the Menominee Tribe; and Dr. Thomas L. Shinnick and Albert Stevenson, both
