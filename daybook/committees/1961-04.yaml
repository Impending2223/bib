  text: Subcommittee on National Parks ordered favorably reported to the full committee H.R. 6422 (amended), to
    add federally owned lands to, and exclude federally owned lands from, the Cedar Breaks National Monument, Utah;
    H.R. 5760 (amended), to revise the boundaries of the Scotts Bluff National Monument, Nebr.; H.R. 6346, to include
    Ackia Battleground National Monument, Miss., and Meriwether Lewis National Monument, Tenn., in the Natchez Trace
