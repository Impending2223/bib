  text: 'Subcommittee on Merchant Marine and Fisheries held hearings on the following four bills: S. 1183, to provide
    for the reimbursement of certain vessel construction expenses; S. 1184, to amend the Merchant Marine Act with
    regard to acquisition and disposition of certain vessels; S. 1185, to amend the Merchant Marine Act so as to
    authorize expenditure from certain capital reserve funds of certain amounts for research and development; and
    S. 1289, to eliminate the oath requirement with respect to certain export manifests. Testimony was received
    from Representative Hiestand, and J. Edward Ely, Foreign Trade Division, Bureau of the Census, both of whom
    directed their remarks to S. 1289; Adm. Walter C. Ford, Deputy Maritime Administrator, who discussed S. 1183,
    1184, and 1185; Adm. John Will, American Export Lines, who testified with regard to S. 1183 and 1184; and Sidney
