  bills:
  - H.R. 3935
  - S. Res. 267
  exec: true
  text: 'Committee, in executive session, ordered favorably reported with an amendment in the nature of a substitute
    H.R. 3935, proposed amendments to the Fair Labor Standards Act. As approved by the,committee, the bill would
    (1) extend minimum wage coverage to approximately 4.1 million workers, the majority of whom are in the retail
    trades and services, (2) adopt the $r.25 minimum wage, which amount would be reached in 28 months for presently
    covered workers, and in 40 months for newly covered workers, the latter of whom would be given overtime protection,
    reaching the 40-hour maximum workweek in 52 months (until these points are reached $1.15 minimum wage would
    be in effect), and (3) adopt the so-called "inflow" test, which means that retail and service enterprises would
    be covered by the bill, only if they met the following test: (a) the employer must be engaged in commerce or
    the production of goods for commerce, (b) the employer must receive $250,000 worth of goods, for resale, which
    have moved across State lines (so-called "inflow" test), and (c) the employer must have an annual gross volume
    of sales of not less than $1 million, exclusive of excise taxes at the retail level. The committee also approved
    the nomination of Gerald A. Brown, to be a member of the National Labor Relations Board, and the filing of an
    interim report of the Subcommittee on Migratory Labor, pursuant to S. Res. 267, the 86th Congress, 2d session
    (with minority views).'
