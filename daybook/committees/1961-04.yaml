  text: Subcommittee on Housing continued its hearings on pending housing legislation, receiving testimony from
    E. J. Burke, Jr., National Association of Home Builders; George Mc- Lain, California Institute of Social Welfare;
    Dwight D. Townsend, Cooperative League of the U.S.A.; and Charles Warden, National Association of Real Estate
    Brokers. On Wednesday, April 5, testimony was received from Richardson Dilworth, mayor of Philadelphia, and
    president, U.S. Conference of Mayors; Charles Wellman, National League of Insured Savings Associations; Robert
    E. Carter, National Retail Furniture Association; and John H. Haas, who represented the Home Improvement Council.
    On Tuesday, April 4, subcommittee began this series of hearings, receiving testimony from Robert C. Weaver,
    Administrator, Housing and Home Finance Agency, who was accompanied and assisted by other HHF A officials. Hearings
    continue tomorrow.
