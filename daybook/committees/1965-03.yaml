  text: 'Subcommittee on Research, Development, and Radiation continued its series of hearings on the High Energy
    Physics Resear~h Program, having as its witnesses Edwin L. Goldwasser, professor of physics, University of Illinois;
    Ralph P. Shutt, Brookhaven National Laboratory; L.eon Lederman, professor of physics, Columbia University; A.
    H. Rosenfeld, Lawrence Radiation Laboratory, Berkeley, Calif.; John R. Pasta, professor of physics, University
    of Illinois; Victor F. W eisskopf, Director General, CERN; and Louis Rosen, Los Alamos Scientific Laboratory.
    In addition to those listed as having testified on this matter on Wednesday, March 3, were the following who
    sat as a panel of witnesses: Frederick Seitz, National Academy of Sciences; Philip H. Abelson, Geophysical Laboratory,
    Carnegie Institution of Washington; George Kistiakowsky, professor of chemistry, Harvard University; William
    McElroy, professor of biology, Johns Hopkins University; Wolfgang K. H. Panofsky, Stanford Linear Accelerator
    Center; Emanuel R. Piore, IBM; Charles Townes, Massachusetts Institute of Technology; Eugene P. Wigner, professor
    of physics, Princeton University; and C. N. Yang, professor of theoretical physics, Institute for Advanced Studies,
    Princeton, N.J. Hearings continue tomorrow. the Department of the Interior, and related agencies, receiving
    testimony from Mrs. James H. Rowe, Jr., Chairman, National Capital Planning Commission, who was accompanied
    by her associates; and Joseph Fitzgerald, Chairman, Federal Development Planning Committees for Alaska. Hearings
    continue on Monday, March 8.'
