  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following measures: S. Res. 89, authorizing
    attendance at the next general meeting of the Commonwealth Parliamentary Association to be held in Wellington,
    New Zealand, this coming November ($1o,ooo); H. Con. Res. 7, to print additional copies of H. Doc. 103 of the
    86th Congress relating to Code of Ethics; H. Con. Res. 83, to print the proceedings in connection with the acceptance
    of the statue of the late Speaker Sam Rayburn, of Texas; H. Con. Res. 97, to print as a House document a pamphlet
    entitled "Our American Government-What Is It? How Does It Function?"; H. Con. Res. 125, to print as a House
    document the inaugural addresses from President Washington to President Johnson; H. Con. Res. 153, to print
    as a House document tributes by Members of the Congress to the life, character, and public service of the late
    Sir Winston Churchill; H. Con. Res. 165, authorizing the reprinting of H. Doc. 103 of the 88th Congress on "How
    Our Laws Are Made" (amended); H. Con. Res. 167, to print addi~ tiona! copies of a study of compensation and
    assistance for persons affected by real property acquisition for Federal projects; H. Con. Res. 338, to print
    as a House document the State Department''s White Paper relating to North Vietnam''s campaign to conquer South
    Vietnam; S. Con. Res. 27, to print additional copies of a committee print entitled "Catalog of Federal Aids
    to State and Local Governments-Supplement, January 4, 1965"; and an original resolution authorizing gratuity
    payment to a survivor of a deceased Senate employee. Committee also considered other pending business items,
    including approval of a report in connection with the use by Senate committees of representatives of other governmental
    agencies on a reimbursable basis. Committee also received an interim report from the Senate Sergeant at Arms
    relating to the possibility of Senate use of the Federal Telecommunications System.'
