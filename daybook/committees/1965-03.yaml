  text: Subcommittee on National Parks and Recreation held a hearing on H.R. 89, H.R. 542, and H.R. 888, bills to
    authorize the establishment of the Tocks Island National Recreation Area in the States of Pennsylvania and New
    Jersey; and H.R. 5169, to authorize establishment of the Tocks Island National Recreation Area in the States
    of Pennsylvania, New Jersey, and New York. Testimony was given by Senator Clark; Representatives Saylor, Thompson
    of New Jersey, Rooney, and Dow; Department of the Army witnesses; and public witnesses. On Friday, February
    26, the Subcomittee on National Parks held a hearing on H.R. 881, to authorize the estab-. lishment of the Alibates
    Flint Quarries and Texas Panhandle Pueblo Culture National Monument; and H.R. 2176, re property in Dare County,
    N.C. Testimony was given by Representatives Rogers of Texas and Bonner; and departmental witnesses.
