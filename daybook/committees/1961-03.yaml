  code: j.conferees
  name: Conferees
  heading: TEMPORARY UNEMPLOYMENT COMPENSATION
  bills:
  - H.R. 4806
  exec: true
  text: 'in executive session, agreed to file a conference report on the differences between the Senate- and House-passed
    versions of H.R. 4806, proposed Temporary Extended Unemployment Compensation Act of 1961. Agreements of the
    conferees are as follows: I. Taxes: The conferees accepted the House provision relating to taxes, i.e., the
    4 percent points will apply to the years 1962 and 1963. (The Senate version moved them forward to 196! and 1962.)
    2. Retirement and pension disqualification: The Senate amendment on this subject was modified as follows: (a)
    There will be no reduc~ion in TEUC for social security benefits.. (b) There will be a reduction in the case
    of other retirement systems and annuities if the unemployment compensation payments are based on the same wages
    that the retirement payments and annuities are based on to the extent of the retirement pension or annuity.
    However, there will be no reduction if unemployment compensation payments are based on earnings from another
    employer (that is, earnings independent of those which generated the retirement pension or annuity). There would
    be no reduction for veterans'' disability and compensation payments. 3-. Ceiling on administrative expenses:-
    It was agreed that the ceiling for fiscal year 196! would be $385 million and fiscal 1962, $415 million. The
    Senate had raised the ceiling to $425 million for these 2 years. (The ceiling under present law is $350 million.)
    4- Conferees accepted the Senate amendment calling for the Secretary of Labor to collect certain information
    on receipts of temporary unemployment compensation.'
  page: D112
  pdf: 110
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=110
