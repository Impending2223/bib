  text: 'Committee held hearings on the nomination of William P. Daniel, of Texas, to be Governor of Guam, with
    testimony from John Carver, Assistant Secretary of the Interior, Antonio B. W onPat, Speaker of the Legislature
    of Guam, and the nominee. Several written statements were sub: mitted for inclusion in the record. Also, the
    committee ordered favorably reported S. 54, granting 81 acres of public land to the Cocopah Indians in Arizona;
    S. 108, to change the leasing provisions of the Indian Long-Term Leasing Act; S. 200, relating to employment
    for certain adult Indians on or near Indian reservations; S. 1294, relating to water rights in connection with
    the Fort Hall Indian irrigation project; S. 1295, authorizing the use of funds arising from a judgment in favor
    of the Nez Perce Tribe of Indians; S. 1297, authorizing per diem payment to members of the Indian Arts and Crafts
    Board at same rate of other Government employees serving without compensation; S. 1298, authorizing revocation
    of the school and agency farm reserve on the Lac du Flambeau Reservation; and with amendment S. 1299, relative
    to conveyance of certain schoo~ properties to local school districts or public agencies.'
