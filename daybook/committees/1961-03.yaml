    James A. Alger, Jr., for promotion to rear admiral in the Coast Guard; and 45 routine nominations in the Coast
    and Geodetic Survey. The committee agreed to change its regular meeting day from Wednesday to Tuesday. Committee
    agreed to hold hearings on April 11 on the nominations of Howard Morgan and Joseph Swidler, to be members of
    the FPC. The committee considered, but postponed until its meeting of April n, the nomination of Philip Elman,
