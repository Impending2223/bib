  committee: Committee on Ways and Means
  code: 196
  name: Ways and Means
  heading: INSURANCE FOR THE AGED -
  exec: true
  text: 'The committee, in executive session, agreed on the provisions to be included in a clean bill, making changes
    in the old-age and survivors'' insurance program, which the chairman will introduce tomorrow. These provisions
    are as follows: (1) The minimum benefit will be raised from $33 in the case of the primary insured to $40 per
    month; (2) The widow''s benefit will be raised from 75 percent to 82½ percent of the amount of the primary insured
    husband; (3) The retirement age for men will be reduced to age 62 on an optional basis with an actuarial reduction;
    (4) The insured status provision will be changed from one quarter of coverage out of each three quarters elapsing
    between 1950 and the date of reaching retirement age to one out of four such quarters elapsing; (5) The foregoing
    provisions would become effective with respect to the first month beginning on or after -- 30 days after enactment,
    and would be financed by an increase of one-eighth percent each on employer and employee, and three-sixteenths
    percent on self-employed, effective January 1, 1962. The committee will meet, in executive session, Tuesday,
    March 28, on the President''s recommendations for financing the Federal-aid highway program.'
  page: D125
  pdf: 123
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=123
