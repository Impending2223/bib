  exec: true
  text: 'The committee, in executive session, ordered favorably reported with amendments H.R. 10495, authorizing
    funds for the construciton of certain highways for fiscal years 1962 and 1963. As approved, the bill would provide
    approximately $2.2 billion. The bill was amended so as to incorporate the texts of (1) S. 3412, relating to
    payments on Federal-aid projects undertaken by a Federal agency, (2) S. 3290, relating to changing the formula
    in State requirement for matching Federal funds for the ABC system, and (3) H.R. 11240, providing for participation
    of Federal-aid highway funds in the construction of approach roads to ferry facilities on Federal-aid systems.
    An amendment was also adopted which would allow Interstate Route No. 95 in Maryland and Delaware to be constructed
    as a toll road. The committee also ordered reported S. 3625, to establish a Wabash Basin Interagency Water Resources
    Commission (tentatively approved); S. 3108, to provide fot; public hearings on air pollution problems, and to
    extend the duration of the air pollution control law (amended); H.R. 11522, authorizing conveyance of certain
    U.S. land to States and other political subdivisions for highway improvements; and S. 3260, authorizing Secretary
    of the Army to modify certain leases entered into for the provision of recreational facilities in reservoir
    areas (amended). Also, the committee approved (1) the following six watershed projects: Big Prairie and French
    Creeks, Ala.; Misteguay Creek, Mich.; Upper Black Bear Creek, Okla.; Mill Run, Pa.; Reelfoot-Indian Creeks,
    Tenn.; and Olmitos and Garcias Creeks, Tex., (2) the construction of a post office building at Concord, N.H.,
    and (3) three alteration prospectuses, two in New York, and one in Pennsylvania. Prior to this action, the Subcommittee
    on Public Roads, in executive session, approved H.R. 10495 for full committee considera,tion.'
  page: D382
  pdf: 380
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=380
