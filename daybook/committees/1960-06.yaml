  exec: true
  text: 'Committee, in executive session, ordered favorably reported H.R. 5547, relating to the income-estate-gift
    tax status of American citizens residing in the Virgin Islands, and estate-gift tax status of American citizens
    residing in Puerto Rico, with technical amendments, and the following additional amendments: (1) combined draft
    of texts of S. 3029, S. 3073, H.R. 7854, H.R. 9564, H.R. 10146, and S. 3712, which would grant relief where
    specified pension plans negotiated under collectivebargaining agreements operated for some period as nonqualified
    plans prior to securing qualification under the Internal Revenue Code; (2) text of S. 3698, imposing a fixed
    duty on lead of 2 cents plus a flexible additional tax of I cent per pound to be applied when price of lead
    falls below 13 ½ cents and removed when price reaches 14½ cents per pound and imposing a fixed duty on zinc
    of 1 ½ cents per pound, plus a flexible additional duty of 0.7 cents per pound to be applied when price of zinc
    falls below 12 ½ cents per pound and removed when price of zinc reaches 13 ½ cents per pound. (3) to provide
    an explicit rule whereby leases by scientific medical research organizations to medical clinics of adjacent
    premises will be considered "related" (and therefore exempt from the tax on business lease income) if the exempt
    organization utilizes treatment of clinic patients, medical histories of clinic patients, and donated services
    of clinic doctors for medical research purposes; (4) text of S. 3103, to prevent the doubling up of accruals
    of the deduction for State taxes by reason of actions taken by the taxing jurisdiction with amendment changing
    effective date to taxable years ending after December 31, 1960, and striking section 3 of bill entitled "Effect
    of Enactment"; (5) to exempt from excise tax the sale of American distilled spirits and wines used in foreign
    embassies in this country; (6) to permit farmers to deduct currently their expenditures for lime, ground limestone,
    and marl; (7) text of S. 3614, which would allow taxpayer credit as a charitable deduction $50 for each month
    in which an elementary or high school student resides in his home; (8) S. 3240, relating to credit against the
    estate tax for amount of gift tax paid on a gift of property included in gross estate of a decedent (amended
    so as to apply it prospectively); (9) an amendment in regard to taxation of certain distributions of stock made
    pursuant to orders enforcing the antitrust laws; and (IO) an amendment embodying the language of H.R. 12691,
    relating to the determination of stock ownership of personal holding companies, and H.R. 7885, relating to income
    tax treatment of nonrefundable capital contributions to FNMA.'
  page: D394
  pdf: 392
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=392
