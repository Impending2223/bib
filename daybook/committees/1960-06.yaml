    to provide for the construction of such memorial by the Secretary of the Interior; H. Res. 466, to provide additional
    funds for the expenses of the investigations and studies authorized by H.- Res. 78 of the 86th Congress; H.
    Res. 544, to provide for four additional temporary mail clerks for the post office of the House of Representatives;
    H. Res. 480, to authorize reprinting of 5,000 additional copies of H. Rept. 1251 (86th Congress), entitled "Committee''s
    Annual Report for 1959"; H. Res. 499, to authorize reprinting of 25,000 additional copies of committee hearings
    entitled "Review of the American Educational System"; H. Res. 524, to print, as a House document, the bi(?graphy
    of Taras Shevchenko; H. Res. 534, to authorize printing, as a House document,. the Prayers of House Chaplain
    Braskamp offered during the 85th and 86th Congresses, and providing for an additional 2,000 copies for his personal
    distribution to the House of Representatives; S. Con. Res. 87, to authorize reprinting for the use of the Joint
    Economic Committee 1,000 additional copies of its Report on Employment, Growth, and Price Level~; S. Con. Res.
    89, to authorize reprinting for the use of the Joint Economic Committee 1,000 additional copies of its study
    entitled "Comparisons of the U.S.-Soviet Economies"; H. Con. Res. 691, authorizing disposal by Joint Committee
    on Printing of certain surplus publications now stored in the House folding room and the Senate warehouse, respectively;
    H.J. Res. 704 (amended), to remove copyright restrictions on the music for "The Pledge of Allegiance to the
    Flag" and directing the Joint Committee on Printing to prepare and print arrangements for congressional distribution;
    H.J. Res. 311, authorizing the erection of a statue of Taras Shevchenko on public grounds in the District of
    Columbia; and H.J. Res. 416, to provide for the erection in the city of Page, Ariz., of an appropriate marker
    to commemorate the achievements of former Commissioner of Reclamation John C. Page.'
