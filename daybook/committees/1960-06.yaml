  text: Committee, in executive session, ordered favorably reported the nominations of Thomas C. Scalley and Randolph
    C. Richardson, to be associate judges of the municipal court for the D.C.; H.R. 12483, to abolish mandator.y
    capital punishment in the D.C.; H.R. 12584, to amend the Uniform Narcotic Drug Act so as to require retail dispensation
    of certain drugs on prescription only; S. 3616, relieving D.C. employees from personal liability for damages
    arising out of their operation of D.C. vehicles while on duty (amended); H.R. II931, relating to the time within
    which a caveat to a will must be filed in the D.C.; S. 675, to regulate the practice of physical therapy in
    the D.C.; S. 2979, authorizing conveyance of U.S. moneys and land to the Convalescent Hospital of Washington,
    D.C., Inc. (amended); H.R. 10952, authorizing the National Society Daughters of the American Colonists to use
    certain D.C. property as its national headquarters; H.R. 10921, to revise provisions of the D.C. Life Insurance
    Act dealing with investment of funds of life insurance companies; and S. 3727, to provide for the bonding of
    persons engaged in the repair or modernization of residential property in the D.C, (amended). Prior to this
    action, in open session, hearings were held on the nominations of Messrs. Scalley and Richardson.
