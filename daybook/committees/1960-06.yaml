  exec: true
  text: Committee, in executive session, by a vote of 14 to 1 (with 2 abstaining), agreed to issue a report with
    regard to the recent summit conference and events incident thereto. The committee announced that it hoped to
    have copies of this report available to the press tomorrow for release on Sunday, June 26. The committee ordered
    favorably reported the nominations of Joseph S. Farland, to be Ambassador to Panama; Arthur L. Richards, to
    be Ambassador to Ethiopia; and A. Burks Summers, to be Ambassador to Luxembourg; and the following nominees
    for promotion to the class of career ambassador; Llewellyn E. Thompson, Ambassador to the U.S.S.R.; Raymond
    E. Hare, Deputy Under Secretary of State for Political Affairs; Ellis 0. Briggs, Ambassador to Greece; Charles
    E. Bohlen, Special Assistant to the Secretary of State; George V. Allen, Director, U.S. Information Agency;
    James.W. Riddleberger, Director of ICA; and Livingston T. Merchant, Under Secretary of State for Political Affairs.
    Committee also ordered reported with amendments H.R. 12263, authorizing conclusion of an agreement for construction
    by the U.S. and Mexico of the Amistad Dam on the Rio Grande.
