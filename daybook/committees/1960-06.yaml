    Establishment between the U.S. and France (Ex. G, 86th Cong., 2d sess.); and the following five nominees to
    be Representatives to the 15th Session of the U.N. General Assembly: Henry Cabot Lodge; Senators Morse and Aileen;
    Assistant Secretary of State Francis O. Wilcox; and Mrs. Oswald B. Lord, of New York; and the following five
    Alternate Representatives to the U.N. General Assembly: Mrs. Zelma Watson George, of Ohio; Arthur F. Lamey,
    of Montana; Frederick B. Payne, of New York; Charles Rosenbaum, of Colorado; and Miss Frances E. Willis, Ambassador
    to Norway; and the nominations of Leland Barrows, Ambassador to the Republic of Cameroun, also to serve as Ambassador
    to the Republic of Togo, and Vinton Chapin, to be Ambassador to the Dominican Republic; and 96 routine Foreign
    Service nominations. Prior to these actions, in open session, testimony was received as follows: On Exs. F and
    G, from Edward M. Martin, Deputy Assistant Secretary of State for Economic Affairs; on Ex. D and H.J. Res. 627,
    Edward M. Martin and Representative Libonati; and on H.R. 12263, authorizing conclusion of an agreement for
    construction by the U.S. and Mexico of the Amistad Dain on the Rio Grande, from Leland H. Hewitt, International
    Boundary and Water Commission, U.S. and Mexico, and Melville E. Osborne, Officer in Charge of Mexican Affairs,
    State Department. Hearings on H.R. 12263 will be continued tomorrow, following which, in executive session,
    the committee will consider voting on a draft report on events incident to the summit con£ erence.'
