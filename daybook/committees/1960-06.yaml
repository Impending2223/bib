  exec: true
  text: Committee, in executive session, ordered favorably reported an original omnibus housing authorizations bill
    (S. 3670). The bill as approved would authorize approximately $1.3 billion, including (1) $350 million for urban
    renewal, (2) $150 million for a 1-year extension for GI direct loans; (3) $500 million for college housing,
    (4) $100 million for public facilities loans, (5) $25 million for direct loans for the elderly, and (6) $50
    million for direct loans for farmers. The committee also approved S. 1342, to assist in the provision of housing
    for moderate-income families and for elderly persons (amended); S. 3292, providing for the establishment of
    a Department of Housing and Metropolitan Affairs (amended); S. 3278, to assist in the improvement of mass transportation
    services in metropolitan areas (amended); S. 3158, to exempt State-controlled banks belonging to the Federal
    Reserve System from the statutory limits on the number of their directors; S. 3439, authorizing the President
    to present a gold medal to Robert Frost; and H.R. 12052, to extend the Defense Production Act for 2 additional
    years (amended).
