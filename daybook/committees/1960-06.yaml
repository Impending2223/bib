  text: 'in executive session, agreed to file a conference report on the differences between the Senate- and House-passed
    versions of HR. 12381, proposed Public Debt and Tax Rate Extension Act of 1900. The effect of the agreement
    which was reached is as follows: 1. The provision~ which were in the original House bill relating to the extension
    of certain tax rates were agreed to in toto; 2. The amendment which the Senate added which would have repealed
    the 4 percent dividend credit provision will be stricken from the bill; 3. The amendment which the Senate added
    relative to the disallowance of certain entertainment expenses in the course of a trade or business will be
    stricken, and it). lieu thereof language will be included in the bill to require the Secretary of the Treasury
    to submit a report to the Congress as soon as practicable as to the results which he has obtained under new
    regulations recently issued on the subject of entertainment and business expenses; and 4. Modifications were
    made in the amendment which the Senate added with respect to th:e treatment processes which shall be considered
    mining for purposes of percentage depletion in the case of certain minerals. A copy of the language agreed to
    in this respect is available at the Committee on Ways and Means Office, Room 1102, New House Office Building.'
