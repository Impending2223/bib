  text: Committee, in executive session, ordered favorably reported H.R. 10500, to amend the Career Compensation
    Act with respect to incentive pay for nuclear-powered submarine service (amended so as to include the text of
    S. 3636, providing incentive pay to. service personnel performing duty as operators of submersibles); H.R. 11787,
    authorizing continuation of flight instruction for members of the ROTC until August 1, 1964; H.R. n57, providing
    for the promotion of economic and social development in the Ryukyu Islands (amended); an original Senate bill
    to impose limitations on the transportation of household effects by air for members of Armed Forces (identical
    to H.R. 12570); H.R. 12200, authorizing a reduction in the grade of enlisted members upon approval of certain
    court-martial sentences (amended); H.R. 8212, relating to the procedure for ordering certain members of the
    Reserve components to active duty; an original Senate bill authorizing certain persons to perform notarial acts
    in the Armed Forces (identical to H.R. 12265); H.R. 9702, authorizing certain payments of deceased members'
    final accounts without the necessity of settlement by the GAO; H.R. 3291, to change the designation of certain
    medals; an original bill (S. 3734) relating to the definition of total commissioned service of certain naval
    officers (identical to H.R. 12415); an original Senate bill (S. 3733) to place Naval ROTC graduates in a status
    comparable with Naval Academy graduates; H.R. 5040, to clarify the reemployment provisions of the Universal
    Military Training and Service Act (amended); S. 3558, authorizing the transfer of certain Federal property to
    the government of American Samoa; H.R. 3923, authorizing presentation of medals to persons having served as
    members of a U.S. expedition to Antarctica; H.R. 10068, relating to travel and transportation allowances for
    certain servicemen and their dependents; and H.R. 5569, providing for the awarding of certain medals in cases
    where recommending reports have been lost. Also, the committee ordered reported 2,426 nominations in the Navy
    and Marine Corps, and approved for filing with the Senate a subcommittee report relating to the NATO Status
    of Forces Treaty. The committee agreed to recommend that the Senate. agree to the House amendments to S. 2969,
    awarding posthumously medals to Chaplains George L. Fox, Alexander D. Goode, Clark V. Poling, and John P. Washington,
    and S. 1795, relating to the promotion and involuntary retirement of officers. The committee considered, but
    took no action on, S. 2922, providing for the disposition of the Fort Mifflin Naval Ammunition Depot, Philadelphia.
    Prior to this action, in open session, testimony was received on H.R. 10500, from Rear Adm L. P. Ramage, Office
