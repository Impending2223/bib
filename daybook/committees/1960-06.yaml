    in interstate commerce (amended); H.R. 5o68, to provide for licensing independent foreign freight forwarders
    (amended, so as to include the text of S. 2300, a related bill); an original joint resolution to suspend for
    the 1960 campaign the equal-opportunity requirements of section 315 of the Communications Act for nominees for
