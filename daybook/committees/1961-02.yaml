  digest: '1961-02-02'
  heading: SMALL BUSINESS-COMMITTEE ORGANIZATION
  exec: true
  text: 'On Wednesday, February 1, the committee held an executive meeting for organizational purposes and adopted
    a list of 28 projects which it will study during this session of Congress. The chairman announced membership
    to the six regular subcommittees as follows: Subcommittee on Taxes-Senators Bible, chairman, Long of Louisiana,
    Bartlett, Moss, Cooper, and Prouty; Subcommittee on Monopoly-Senators Long of Louisiana, chairman, Sparkman,
    Humphrey, Engle, Schoeppel, and J avits; Subcommittee on Financing-Senators Morse, chairman, Smathers, Engle,
    Humphrey, Saltonstall, and Cooper; Subcommittee on Government Procurement-Senators Smathers, chairman, Bible,
    Randolph, Williams of New Jersey, Saltonstall, and Scott; Subcommittee on Relations of Business With Government-Senators
    Randolph, chairman, Sparkman, Smathers, Bartlett, Javits, and Prouty; Subcommittee on Retailing, Distribution,
    and Marketing Practices-Senators Humphrey, chairman, Morse, Moss, Williams of New Jersey, Schoeppel, and Scott.'
  page: D31
  pdf: 29
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=29
