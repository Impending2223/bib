  text: 'On Friday, February 3, the committee, in executive session, ordered favorably reported the nomination of
    Neville Miller, to be a member -of the D.C. Redevelopment Land Agency. Committee also announced appointments
    to subcommittees as follows: Subcommittee on Fiscal Affairs--''-Senators Smith (Massachusetts), chairman, Bible,
    and Beall; Subcommittee on the Judiciary-Senators Hartke, chairman, Smith (Massachusetts), and Miller; Subcommittee
    on Public Health, Education, Welfare, and Safety-Senators Morse; chairman, Hartke, and Prouty; Subcommittee
    on Business and Commerce-Senators Beall, chairman, Morse, and Miller; and Subcommittee on Metropolitan Area
    Problems- Senators Bible, chairman, Morse, and Beall. Also, Senators Smith (Massachusetts), Bible, and Beall
    were appointed as ex officio members to the Senate Appropriations Committee, and Senator Smith (Massachusetts)
    was appointed as conferee to the Senate Appropriations Committee. Prior to this action, in open session, hearings
    were held on prospective nomination of Walter N. Tobriner, designated to be a D.C. Commissioner, with testimony
    from several witnesses including Robert E. McLaugh~ lin, President of the D.C. Board of Commissioners; and on
    the nomination of Mr. Miller, with testimony from several witnesses including Representative Burke of Kentucky
    and Mr. McLaughlin. The nominees-testi-:-.fied and answered questions in their own behalf.'
