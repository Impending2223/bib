  text: 'Subcommittee on Indian Affairs ordered favorably reported to the full committee the following bills: HR.
    5870 (amended and companion bill S. 1751 ordered reported to the full committee to be tabled)~ to place in trust
    status certain lands on the Wind River Indian Reservation, Wyo.; H.R. 1150 (amended), to authorize the partition
    or sale of inherited interests in trust and restricted allotted lands and restricted purchased allotted lands
    in the State of Minnesota; H.R. 9028 (amended), to provide that certain funds shall be paid to the Kickapoo
    Tribal Council of Oklahoma; H.R. 11104, to provide for the termination of Federal supervision over the property
    of the Lower Elwha Band of Clallam Tribe of Indians of western Washington, and to individual members thereof;
    S. 2877 (and companion bill H.R. 10471 ordered reported to the committee to be tabled), to authorize the reconveyance
    of tribally owned lands by the Muckleshoot Indian Tribe of the State of Washington to the original allottees,
    their heirs, devisees, or assigns; and S. 2804 (and companion bill H.R. 10640 ordered reported to the committee
    to be tabled), to donate to the Keweenaw Bay Indian Tribe, L''Anse Reservation, Mich., a certain tract of Federal
    land with improvements located thereon. The subcommittee also considered but passed over H.R~ 5727 and H.R.
    4613, and considered but took no final action on HR. 11161, all relating to Indian affairs. Testimony was heard
    from Representative Tollefson oil H.R. 10471, and Interior Department witnesses were also heard on the various
    bills.'
