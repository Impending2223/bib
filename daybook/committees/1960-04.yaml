  - H.R. 11748
  exec: true
  text: 'The committee instructed its staff to draft three amendments to H.R. 5, the Foreign Investment Incentive
    Tax Act: (1) Tax deferral provided for in the bill to be limited to income earned in the underdeveloped countries
    of the free world; (2) to eliminate the "gross-up" provision applicable to the dividend income of the Foreign
    13usiness Corporation; and (3) to provide that a corporation would not be eligible as a Foreign Business Corporation
    if the Secretary of Labor found that it was engaged in production outside of the United States under unfair
    labor standard conditions. Also ordered favorably reported to the House, H.R. 11748, to continue until the close
    of June 30, 1961, the suspension of duties on metal scrap. The committee will resume its consideration of proposed
    social security amendments in executive session Friday, April 22.'
