  text: 'Ordered favorably reported to the House the following bills: H.R. 113, to prohibit the severance of a service-connected
    disability which has been in effect for IO or more years, except when based on fraud; H.R. 276, to establish
    a new effective date for payment of additional compensation for dependents; H.R. 641, to provide that the widow
    of a peacetime -veteran who married the veteran within 15 years after his last discharge or release from the
    service may be entitled to death compensation in case of the service-connected death of the veteran; H.R. 7
    502, to amend the basis for certifications with respect to basic pay for dependency and indemnity compensation
    award purposes; H.R. 7965, to authorize outpatient treatment incident to authorized hospita:_l care for certain
    veterans; H.R. 8098, to specify certain creditable service for pension purposes; H.R. 9785, to provide for equitable
    adjustment of the msurance status - of certain member~ of the Armed Forces; R.R. 9786, to permit Indian War
    and Spanish-. American War veterans to elect to receive pension at the rates applicable to veterans of World
    War I; H.R. 9788, to prohibit the furnishing of benefits under laws administered by the Veterans'' Administration
    to any child on account of the death of more than one parent in the same parental line; H.R. 9792, regarding
    salary of managers of Veterans'' Administration hospitals, domiciliaries, and centers; H.R. 10108, to authorize
    reimbursement of certain Veterans'' Administration beneficiaries and their attendants for ferry fares, and bridge,
    road, and tunnel tolls; H.R. 105¢, to change the method of payment of Federal aid to State or territorial homes
    for the support of disabled soldiers, sailors, airmen, and marines of the H.R. 10703, to grant a waiver of national
    service life insurance premiums to certain veterans who became totally disabled in line of duty between the
    9ate of application and the effective-date of their insurance; H.R. 1089B, to provide additional compensation
    for seriously disabled veterans having four or more children; and H.R. 11045, to permit the conversion or exchange
    of policies of national service life insurance to a new modified life plan. The committee also unanimously directed
    its staff to obtain cost estimates on various features of the proposed peacetime GI bill.'
