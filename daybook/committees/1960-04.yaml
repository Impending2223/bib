  text: 'Committee, in executive session, ordered favorably reported the following bills: S.J. Res. 9, a. private
    bill; S. rn66, to revise the boundaries and change the name of Fort Donelson National Military Park, Tenn. (amended);
    S. 1268, to require notice to States owning surface titles to lands of proposals of the Government to lease
    its mineral rights therein; S. 14n, relative to restoration of certain lands at Big Delta and Tok Junctions,
    Alaska; S. 1833, authorizing the establishment of a national historic site at Bent''s Old Fort near La Junta,
    Colo. (amended); S. 2128 and S. 2174, private bills (both amended); S. 2434, to revise the boundaries and change
    the name of the Fort Laramie National Monument, Wyo.; S. 2576, authorizing the addition of certain donated lands
    to the Everglades National Park, Fla.; S. 2674, authorizing acquisition of certain lands for addition to Harpers
    Ferry National Monument, W. Va. (amended); H.R. 725, to provide for the establishment of the Wilson''s Creek
    Battlefield National Park, Mo.; H.R. 1805, relating to the purchase of land in connection with the Antietam
    Battle.field Site, Md.; H.R. 3676, to convey certain lands to the city of Tillamook, Oreg.; H.R. 7359, to convey
    certain lands in the State of Nevada to the Colorado River Commission; H.R. 9543, to revise the boundaries and
    change the name of Stones River National Military Park, Tenn.; S. 939, authorizing establishment of the Fort
    Bowie National Historical Site, Ariz.; S.J. Res. 162, authorizing continued delivery of water to lands in certain
    irrigation districts in the State of Washington for calendar years 1960 and 1¢1 (amended); and S. 1092, providing
    for the construction of the Cheney division, Wichita Federal reclamation project, Kansas (amended). The committee
    also approved a small project loan resolution for Browns Valley Irrigation District, California.'
