    to the control, appropriation, use, and distribution of water and providing that the U.S. shall sue and be sued
    in courts of such State in litigation arising therefrom; and H.R. 2363, to affirm and recognize the water laws
    of the States lying wholly or partly west of the 98th meridian. Subcommittee held an open hearing on H.J. Res.
