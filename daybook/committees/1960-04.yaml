  exec: true
  text: 'Committee, in executive session, approved for reporting four bills as follows: H.R. 8649, to continue for
    3 years suspension of tax on first domestic processing of coconut oil, palm oil, and palm-kernel oil; H.R. 9820,
    to extend for 3 years period for free import of certain tanning extracts; H.R. 9307, to continue for 2 years
    suspension of duty on certain alumina and bauxite, with amendment to extend suspension of duty on crude chicory;
    H.R. 270, to increase rate of special pension to certain persons awarded the Medal of Honor, with amendments
    providing a monthly award of $100 (reduced by any non-service-connected pension to which such individual may
    be entitled) available upon application therefor by Congressional Medal of Honor holders upon attaining the
    age of 62, if honorably -discharged from service. Committee also approved the nomination of Glenn L. Sutton,
    of Georgia, to be a member of the U.S. Tariff Commission for term expiring June 16, 1966. In addition to the
    actions listed above, committee tabled the following three bills having to do with veterans: H.R. 5996; 268,
    and 283. It also deferred action on the following four bills respecting tariff: H.R. 9308, 9861, 9862, and 9881.'
  page: D168
  pdf: 166
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=166
