  text: Committee concluded its executive consideration of H.R. 7977, to increase postal rates and salaries -of
    Federal employees, and ordered the bill favorably reported to the Senate with amendments. As approved by the
    committee, the bill would (I) increase first-class mail rates from 5 to 6 cents, airmail rates from 8 to 10
    cents, and third-class bulk mail (per piece) to 3.6 cents in 1¢8 and 4.0 in 1¢9, (2) delete from the House-passed
    bill provisions granting addi. tional mailing benefits to military personnel, (3) accept House provisions granting
    6-percent pay increases to postal employees, and 4Yz-percent increases to classified employees-amended to establish
    maximum limits for certain employees of the legislative branch, (4) provide additional insurance benefits for
    all Government employees, (5) accept House provisions relating to pornographic literature, and (6) provide effective
    date of October I, 1¢7, on salary increase provisions. Committee announced that it expects to file report on
    this bill by Friday, November 17.
