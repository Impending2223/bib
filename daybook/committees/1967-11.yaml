  text: 'Subcommittee on Permanent Investigations continued its hearings on recent riots in American cities, hearing
    testimony from the following witnesses: Lt. M. L. Singleton, Intelligence Division, and R. G. Blaylock, police
    officer, both of the Houston Police Department; Mayor Louie Welch, of Houston, accompanied by his aide, Blair
    Justice. upon request at home and overseas, with testimony from Senator Tydings; Representatives Bush and Scheuer.
    Also heard were the following witnesses from the Department of Health, Education, and Welfare, and the Office
    of Economic Opportunity: HEW -Dr. Philip R. Lee, Assistant Secretary for Health and Scientific Affairs, accompanied
    by three consultants, Dr. Oscar Harkavy, Ford Foundation, Frederick S. Jaffe, Planned Parenthood-World Population,
    and Dr. Samuel M. Wishik, Columbia University; Mrs. Katherine B. Oettinger, Deputy Assistant Secretary for Family
    Planning and Population; Dr. Gerald La Veck, Director, National Institute of Child Health and Human Development;
    and Dr. Philip Corfman, Assistant to the Director for Population Research; and OEO--Dr. Joseph English, Assistant
    Director, Office of Health Affairs, and Dr. Gary London, Associate Director for Family Planning, Office of Health
    Services. Subcommittee recessed subject to call.'
