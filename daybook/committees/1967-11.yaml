  text: 'Committee, in executive session, ordered favorably reported an original resolution (S. Res. 187), declaring
    that it is the sense of the Senate that a "national commitment" by the U.S. to a foreign power must result from
    affirmative action by the executive an''d legislative branches. The resolution reads as follows: Whereas the
    executive and legislative branches of the U.S. Government have joint responsibility and authority to formulate
    the foreign policy of the United States; and Whereas the authority to initiate war is vested in Congress by
    the Constitution: Now, therefore, be it Resolved, That a commitment for purposes of this resolution means the
    use of, or promise to a foreign state or people to use, Tri-State Transportation Commission; and Arthur Palmer,
    transportation administrator, City of New York. Hearings continue on Tuesday, November 28.'
