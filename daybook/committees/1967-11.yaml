  text: 'Committee continued its executive consideration of H.R. 12o8o, proposed Social Security Amendments of 1¢7,
    following which the Chairman announced that the following amendments have been adopted: (I) To make the tax
    rate provisions of the bill effective in I968, rather than I969 as the House bill would have provided; (2) the
    administration''s proposal to provide a rs-percent increase in benefits and a $70 minimum benefit, in contrast
    to the I2Yzpercent increase and $so minimum in the House bill; (3) to increase the $40 individual and $6o family
    payments in the House bill for individuals age 72 and over who did not contribute to the social security program,
    to $so and $7s respectively, per month; (4) to make all workers and beneficiaries eligible to retire at age
    6o at reduced benefits; (S) to liberalize the House provision providing a so-percent disability benefit to widows
    and widowers at age 50 and thereafter to allow them to receive the full 82Yz-percent widow''s benefit at any
    age provided they are severely disabled; (6) to provide for a study by the Secretary of Health, Education, and
    Welfare of (I) the matter of providing for coverage of drugs under the medicare program and (2) the matter of
    emphasizing. reimbursement for drugs in the public programs on a generic basis. The study would be required
    to be reported to the Committee on Finance and the Committee on Ways and Means by January I,I969. The committee
    rejected amendments which (a) would have extended medicare coverage to disabled persons under age 65 and (b)
    would have repealed the $r,5oo limitation under outside earnings under the social security program. Also, committee
    ordered favorably reported the nomination of Stanley D. Metzger, of D.C., to be member of Tariff Commission.
    Committee continues on H.R. 12080 tomorrow. NATIONAL coMMITMENTs'
