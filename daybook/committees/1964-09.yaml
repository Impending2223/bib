  - H.R. 5986
  - S. 3
  - H.R. 1695
  - H.R. 2874
  text: 'Committee approved and ordered favorably reported H.R. 12253, which makes amendments in the Tariff Schedules
    of the United States. The bill as passed by the House was ordered reported to the Senate with the following
    amendments: Provisions of the House bill which were amended: Section 10-Particleboard: The committee deleted
    section IO, relating to particleboard. The effect of this would be to continue the current rate of 12 percent
    (rather i:han the 20 percent rate provided in House bill). Section 15-V-belts: The committee deleted this section
    from the bill. The effect of this would be to continue the duty of 16 percent on imported V-belts (rather than
    8.5 percent for V-belts as provided in House bill). Section 26-Round wire: The committee deleted this section
    from the bill. This would have the effect of continuing the duty of 0.3 cent per pound on round wire, 0.060
    inch or more in diameter, containing over 0.25 percent carbon (rather than the higher 8.5 percent rate provided
    in House bill). Section 29(e)-Integral shaft bearings: The committee deleted this subsection from the bill.
    This would have the effect of making the duty on this product 10 percent (as a pump part) rather than 12 percent
    as provided by the House bill. Section 39-Commutators: The committee amended this provision to restore the rate
    of 8.5 percent (rather than 12.5.percent provided for in the House bill) for commutators I Yi inches or less
    in diameter. Section 58-Slide fasteners: The committee modified this amendment to delete the provision which
    prevented textile tapes without teeth from being classified as parts of zippers. This would have the effect
    of retaining the rate of 50 percent on these textile tapes (rather than 20 percent as would have been available
    under the House bill). Section 65-Sausage casings: The committee deleted this provision from the House bill.
    The effect of this would be to continue the rate of 16 percent on artificial sausage casings (rather than 12.5
    percent provided for in the House bill. Provisions added to the House bill: 1. Wool fabrics: The committee added
    an amendment to the bill to deal with an avoidance practice with respect to woven fabrics made of a blend of
    reclaimed wool and ramie or flax. Although the reprocessed wool is the principal fiber component of the fabrics,
    a relatively small quantity of flax or ramie determines its present duty treatment at IO percent ad valorem.
    This enables a large quantity of wool fabrics to escape the higher wool fabrics rates. The committee amendment
    provides that in the case of such fabrics containing over 17 percent by weight of wool, the duty is to be 30
    cents a pound plus 45 percent ad valorem. This rate is approximately the equivalent of the rates which would
    have been applied to such fabrics under the old tariff structure. 2. Button blanks: The committee added an amendment
    to the bill to deal with an avoidance problem relating to button blanks. At present certain almost finished
    polyester buttons can be imported as "button blanks" at a rate of 36 percent whereas such buttons if finished
    would be dutiable at a rate which is equivalent to ad valorem rates ranging up to 140 percent. The committee
    amendment would make button blanks dutiable at the same rate as finished buttons. 3. Farm equipment: The committee
    added an amendment to the bill to clarify the duty-free status of certain farm equipment. 4. Brooms: The committee
    added the text of H.R. 5986 to the bill. This bill imposes a duty of 24 cents each upon brooms valued at 96
    cents. or less and a duty of 8 cents each on whisk brooms valued at 32 cents or less. 5. Dictaphones: The committee
    added a provision reducing the duty on dictating machines using nonmagnetizable tapes to 11.5 percent (from
    15 percent), making the rate the same for all dictating machines. 6. Mass spectrometers: The committee added
    the text of amendment No. 1235, providing for the free entry of one mass spectrometer for Pomona College, and
    the text of S. 3 I09, providing for the free entry of one mass spectrometer for the University of New Hampshire.
    7. Polyethylene imine: The committee added the text of amendment No. 1236 to the bill. It provides for the free
    entry of polyethylene imine imported after the date of enactment and on or before June 30, 1967. 8. Limestone
    spalls: The committee added the text of H.R. 1695 to the bill. This amendment provides for the free importation
    of limestone chips (spalls). 9. Aluminum: The committee added an amendment which modifies the rules'' governing
    the duty on continuous cast aluminum. Under this amendment, continuous cast aluminum would be dutiable as "unwrought"
    (a) at r.25 cents per pound if it is imported to be melted, rolled, forged, drawn, or extruded; and (b) at 2.5
    cents per pound if imported for other uses. ro. Certain textile: The committee added an amendment to provide
    that for the period August 3r, r963-September r, r964, certain plastic or rubber-coated textile luggage (which
    presently is dutiable at 40 percent) is to be treated as if the duty had been 20 percent. The committee tabled
    the following bills: H.R. ror70, to continue until the close of June 30, r965, the existing exemption from duty
    enjoyed by returning residents arriving from the Virgin Islands of the United States. H.R. 2874, to amend the
    Tariff Act of r930 to provide that imp~rted electron microscopes shall be subject to the regular.H of customs
    duty regardless of the nature of the institution or organization importing them. The committee announced no
    further meetings will be held this session.'
  page: D485
  pdf: 483
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=483
