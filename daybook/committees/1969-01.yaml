  text: 'Subcommittee on Economy in Government resumed its hearings on military procurement practices, with testimony
    today regarding cost overruns being incurred in connection with the C-sA cargo plane contract. Witnesses heard
    were Frank Weitzel, Assistant Comptroller General, and Charles Bailey, Director, Defense Division, both of the
    General Accounting Office; and Robert H~ Charles, Assistant Secretary, and A. E. Fitzgerald, Deputy for Management
    Systems, Office of the Assistant Secretary, both of the Air Force. The message was referr~d to the Committee
    on Science and Astronautics and ordered printed with illustrations (H.Doc.91-49). Page 1097 Presidential Message-Medical
    Science: Received a message from the President submitting the 2d annual report of the U.S.-Japan cooperative
    medical science program. The message was referred to the Committee on Interstate and Foreign Commerce and ordered
    printed (H. Doc. 91-48).. Page 1097 Presidential Message-Economic Report: Received a message from the President
    submitting the Economic Report of the President, together with the annual report of the Council of Economic
    Advisers. The message was referred to the Joint Economic Committee and ordered printed with illustrations (H.
    Doc. 91-28). Pages 1097-1103 Adjournment: Adjourned at 3 p.m.'
