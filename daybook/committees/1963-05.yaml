  heading: SENIOR CITIZENS
  text: Committee held an executive organizational meeting and agreed to establish Subcommittees on (1) Housing,
    (2) Retirement Income and Employment Opportunities for Senior Citizens, (3) Federal, State, and Community Services
    for Senior Citizens, (4) Health of the Elderly (under the chairmanship of Senator McNamara), and (5) Frauds
    and Misrepresentations Affecting Older Citizens (under the chairmanship of Senator Williams, of New Jersey).
