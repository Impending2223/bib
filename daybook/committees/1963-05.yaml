    Conetoe Creek, N.C.; Upper Little Mmnesota River, S. Dak.; and Harmon Creek, W. Va. and Pa. Also, committee
    announced that it had scheduled hearings as follows: (1) On pending feed grain legislation (H.R. 4997), to begin
    on Friday, May 3, and to cQntinue into the following week through May 8, (2) on pending dairy legislation, to
