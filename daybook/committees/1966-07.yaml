  text: Subcommittee on Public Lands met in open session and approved for full committee action H.R. 9520, to authorize
    the Secretary of the Interior to convey certain lands in Inyo County, Calif., to the estate of Gwilym L. Morris,
    Dolores G. Morris, George D. Ishmael, and Verna H. Ishmael. Prior to that action the subcommittee held a hearing
    on the bill. Also considered H.R. 13883, to assist the State of Florida' and certain property owners in resolving
    problems of landownership and use of the Naval Live Oak Reservation property at Gulf Breeze, Fla. Testimony
    on the bills was heard from Representative Sikes; Harry R. Anderson, Assistant Secretary of Inte~ rior for Public
    Land Management; and public witnesses. Statements for the record were submitted by Representatives Johnson of
    California and Talcott. Sent to the full committee for proper disposition was H.R. 9525, to authorize the Secret~y
    of the Interior to convey certain lands in Inyo County, Calif., to the estate of Gwilym L. Morris, Dolores G.
    Morris, George D. Ishmael, and Verna H. Ishmael.
