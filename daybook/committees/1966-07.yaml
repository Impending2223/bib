  heading: UNEMPLOYMENT INSURANCE
  bills:
  - H.R. 15119
  - S. Res. 149
  exec: true
  text: 'Committee, in executive session, by a vote of 13 to 4, ordered favorably reported with amendments H.R.
    15119, proposed Unemployment Insurance Amendments of 1966. The bill was amended in the following manner: (1)
    Benefit requirements.-As passed by the House H.R. 15II9 would not have imposed any standards on the level of
    benefits o~ the conditions under which they would be paid in the States. The Committee on Finance added standards
    to the bill. They are: (a) Benefit amount: Individual weekly benefit amount must be at least 50 percent of the
    individual''s average weekly wage, but limited to 50 percent of the State-wide average wage. (b) Duration: Any
    worker who has 20 weeks of employment (or equivalent) shall be entitled to not less than 26 times his weekly
    benefit amount. (c) Eligibility: No worker may be required to have more than 20 weeks of employment (or equivalent)
    in his base period to qualify for benefits. (2) Extended benefits.-All of the House provisions on extended benefits
    for the long-term unemployed were accepted except that instead of paying 50 percent of the cost out of the Federal
    portion of the unemployment tax and the other 50 percent out of the State unemployment tax, all costs of the
    extended benefits program will be financed by the Federal portion. The committee amended the financing feature
    because of the burden it had imposed on the States in upgrading their regular unemployment compensation benefits.
    (3) Tax rate and wage base.-The Federal unemployment tax rate increase to 3.3 percent (from 3.1 percent) provided
    by the House bill was retained. The wage base increase to $3,900 was made effective for 1968 rather than 1969
    as under the House bill, and the further increase in the wage base in 1972 is to $4,800 rather than to $4,200.
    This greater increase in the wage base was necessitated by the committee''s decision to pay the entire cost
    of the extended benefits program out of the Federal share of the unemployment tax. (4) Small firms.-The House
    provision extending coverage to employers of one or more workers during each of 20 weeks in a calendar year
    or employers of payrolls of $1,500 in a calendar quarter is deleted, leaving the provision of present law which
    limits coverage to employers of four or more workers during each of 20 weeks in a calendar year. (5) Multistate
    workers.-Employees engaged in work in more than one State will have all of their employment included for purposes
    of determining their eligibility for unemployment benefits without regard to variations in State laws. (6) Life
    insurance salesmen.-The committee directed that its report include a statement of intent that the present exclusion
    for full-time life insurance salesmen remunerated solely by way of commission would not be upset because the
    salesman is provided tax-free fringe benefits (such as group life insurance). Steel imports.-ln addition to
    the action on the unemployment insurance bill, the chairman announced that the committee had directed its staff
    to conduct a study of imports of steel mill pr0<ilucts into the United States. This matter had been the subject
    of hearings by the committee and a resolution (S. Res. 149) directing such a study by the Department of Commerce
    wa s pending before the committee. In instructing its staff the committee in effect disposed of S. Res. 149.'
  page: D390
  pdf: 388
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=388
