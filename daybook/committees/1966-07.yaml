  text: 'Subcommittee on Improvements in Judicial Machinery began a series of hearings on S. 3475, to abolish the
    Office of U.S. Commissioner, and to establish in place thereof the Office of U.S. Magistrate. Testimony was
    received from Senator Brewster; Judge Edward S. Northrop, U.S. district judge for the district of Maryland;
    Emory H. Niles, retired chief judge of the Supreme Bench of Baltimore City, who represented a special committee
    of the American Bar Association; Judge Theodore Levin, chief judge, U.S. District Court for the Eastern District
    of Michigan; Lewis A. Sigler, Office of the Solicitor, Department of the Interior; and the following individuals
    who represented the National Association of U.S. Commissioners: F. Archie Meatyard, president, Bethesda, Md.;
    John W. Underwood, Hinesville, Ga.; Fritz Windhorst, New Orleans; Max Schiffman, Brooklyn, N.Y.; Bester F. Witter,
    Rock Island, Ill.; Earl Bishopp, New York City; and Harve M. Duggins, Knoxville, Tenn. Hearings continue tomorrow.'
