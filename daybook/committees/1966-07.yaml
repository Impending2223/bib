  text: Committee, in executive session, ordered favorably reported the nominations of William S. Gaud, of Connecticut,
    to be Administrator of the Agency for International Development; and Dr. Walter Adams, of Michigan, Dr. Joseph
    R. Smiley, of Colorado, and Dr. Paulin<;; Tompkins, of Maine, all for reappointment to the U.S. Advisory Commission
    on International Educational and Cultural Affairs. The committee also approved S. 3498, facilitating the carrying
    out of obligations of the U.S. under the Convention on the Settlement of Investment Disputes Between States
    and Nationals of Other States; Protocol for the Further Extension of the International Wheat Agreement (Ex.
    F, 89th Cong., 2d sess.); Protocols to the International Convention for the Northwest Atlantic Fisheries (Ex.
    I, 89th Cong., 2d sess.); and S.J. Res. 167, authorizing organization of an International Conference on Water
    and Peace in the U.S. in 1967. Prior to this action, in open session, committee received testimony from Mr.
    Gaud in behalf of his own nomination; from Fred B. Smith, General Counsel, Department of the Treasury, who testified
    with regard to S. 3498; from John A. Schnittker, Under Secretary of Agriculture, who directed his remarks to
    Executive F, 89th Congress, 2d session; from Burdick H. Brittin, Deputy Special Assistant for Fisheries and
    Wildlife, Department of State, who testified with regard to Executive I, 89th Congress, 2d session; and from
    William B. Buffum, Deputy Assistant Secretary of State for International Organization Affairs, and Robert Nelson,
    Assistant Secretary of the Interior, both of whom testi- fied with regard to S.J. Res. 167.
  page: D346
