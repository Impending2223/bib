  text: 'Committee, in executive session, adopted, in lieu of S. Res. 191, the following committee resolution: "Resolved,
    That a subcommittee of the Senat~ Committee on Armed Services, to be appointed or designated by the chairman,
    be authorized and directed to study and appraise the use of military personnel and facilities to arouse the
    public to the menace of the cold war and to inform and educate armed services personnel on the nature and menace
