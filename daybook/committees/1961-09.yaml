  exec: true
  text: 'Committee, in executive session, ordered favorably reported with amendments S. 1732, to increase the number
    of supergrade and scientific positions in. the Federal service. The committee voted to add 419 additional supergradetype
    positions which would be available to the Civil Service Commission, of which 100 would be used only upon Presidential
    order. In addition, 28 positions were authorized for the Dep3:rtment of Defense, 12 for the National Security
    Agency, and 6 for the Immigratjon and Naturalization Service; making a total authorization of 465 such positions.
    The committee approved 249 scientific-type positions as follows: 135 for NASA, 75 for DOD, 10 each for NSA and
    FAA, 4 for the Library of Congress, and 3 each for the Departments of Interior, Agriculture, HEW, Commerce,
    and Post Office. Committee also approved 82 postmaster nominations, and tentatively approved H.R. 6007, to increase
    the number of positions in grades 16, 17, and 18 in the GAO from 25 to 40.'
