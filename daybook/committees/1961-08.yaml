  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 206, to
    facilitate administration of the fishery loan fund; H.R. 3159, to permit certain foreign-flag vessels to land
    their catches of fish in the Virgin Islands in certain circumstances; S. 606, to provide for the construction
    of a shellfisheries research center at Milford, Conn.; H.R. 3788, to provide for the trans£ er of the U.S. vessel
    Alaska to the State of California for the use and benefit of the department of fish and game of such State;
    H.R. 7490, for the protection of marine mammals on the high seas; S. 1222, relating to the documentation and
    inspection of vessels of the U.S.; S. 881, to permit documentation of vessels sold or transferred abroad; H.R.
    2292, to issue certificates of honorable discharge in lieu of certificates of disenrollment to certain persons
    who served as temporary members of the U.S. Coast Guard Reserve during World War II; H.R. 4229 (amended), to
    amend the Coast and Geodetic Survey Commissioned Officers Act of 1948; H.R. 8152 (amended), for the prevention
    of the Pollution of the Sea by Oil; S. 1289, to eliminate the oath requirement with respect to certain export
    manifests; and H.R. 3156, to make the Panama Canal Company immune from attachment or garnishment of salaries
    owed to its employees. The committee considered H.R. 2894 (same title as S. 6o6); and H.R. 205 (same title as
    S. 881). Passed over H.R. 7513, to restate the terms of the grants covering the Rockefeller Wildlife Refuge
    and Game Preserve, and reref erred to subcommittee H.R. 3840, to provide for the conveyance of certain real
    property of the U.S. to the Carolina Power & Light Co.'
  page: D423
  pdf: 421
