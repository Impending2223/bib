  text: 'Committee, in executive session ordered favorably reported the nomination of John E. Cosgrove, to be an
    Assistant Director of the Office of Civil and Defense Mobilization; H.R. 4323, to amend the Career Compensation
    Act with respect to special pay for diving duty; H.R. 7657, to amend the Uniform Code of Military Justice to
    provide specific authority for prosecution of bad check offenses; H.R. 7722, to provide that Medical Service
    Corps officers may exercise command outside the Army Medical Service when directed by proper authority; H.R.
    4321, authorizing transportation of dependents and household effects of certain retired military personnel;
    H.R. 181, permitting enlistment in the Army and Air Force by aliens lawfully admitted to the U.S. for permanent
    residence;. S. 1240, authorizing the lending of certain military equipment in connection with the senior roundup
    of the Girl Scouts scheduled for July 1962 in Vermont; S. 2079, providing for retrocession of jurisdiction to
    North Carolina over an area near Camp Lejeune; and 286 nominations in the Army and Marine Corps. Prior to this
    action, in open session, testimony was received on items as indicated from the following witnesses: On the nomination
    of Mr. Cosgrove-Senator Miller and Representative Smith of Iowa; on H.R. 4323-Capt. Arthur G. Esch, Bureau of
    Naval Personnel; on H.R. 7657-Maj. Gen. A. M. Kuhfeld, Judge Advocate General, Air Force; on H.R. 7722-Brig.
