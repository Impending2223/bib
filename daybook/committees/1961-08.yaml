  exec: true
  text: 'Met in executive session and ordered favorably reported to the House the following bills: H.R. 8558, relating
    to the organization of the Bureau of Public Roads; H.R. 8678 (amended), to provide for the conveyance of a portion
    of the Henry G. Shirley Memorial Highway and other highways on the Pentagon road network to the Commonwealth
    of Virginia; S. 1719 (amended), relating to Indian reservation roads; H.R. 157 (amended), to change the name
    of the Play a del Rey Inlet and Harbor, Venice, Calif., to the Marina del Rey Small Craft Harbor, Los Angeles,
    Calif.; H.R. 7854, to modify the project for the Duluth- Superior Harbor, Minn. and Wis., to provide for the
    abandonment of the 21st A venue west channel; H.R. 7888, to extend the time-within which the land in certain
    reservoir projects in Texas may be reconveyed to the former owners thereof; H.R. 8320, to amend the Freeport
    Harbor project, Texas; H.R. 3801 (amended), to authorize the Secretary of the Army and the Secretary of Agriculture
    to make joint investigations and surveys of watershed areas for flood prevention; and H.R. 5279 (amended, a
    clean bill to be introduced), to provide for the annual audit of bridge commissions and authorities created
    by act of Congress, for the filling of vacancies in the membership thereof. Adopted seven watershed work plans,
    and five navigation and flood control resolutions. The subcommittee also approved a Select Subcommittee on Real
    Property Acquisitions.'
