  text: 'Committee, in executive session, ordered favorably reported the -following bills: S. 51, authorizing relinquishment
    to Wyoming of the jurisdiction over the Pole Mountain District of Medicine Bow National Forest; S. 1388, to
    extend the boundaries of the Cache National Forest in Utah by including 1,700 additional acres; S. 582, to extend
    for 2 years exemption, of peanuts for boiling from marketing quotas; S. 400, providing uniform penalties for
    misuse of feed made available for relieving distress, etc.; s. s8r, extending for 2 years provisions for. permitting
    the lease and transfer of tobacco acreage allotments (amended); S. 623, providing for a program of agricultural
    land development in Alaska; H.R. s86o, to facilitate the carrying out of voluntary programs for promotion, research,
    and education relating to livestock; and H.R. 40, authorizing funds for State construction of research facilities
    at State agricultural experime~t stat~ons. Committee also approved seven watershed projects as follows: B~ckhorn-Mesa,
    Ariz.; Tupelo Bayou, Ark.; Naalehu, Hawaii; Bear-Pierce-Cedar, Nebr.; Bellwood, Nebr.; Caney Creek, Okla.; and
    Thompson Creek, Tenn. (supplemental plan).'
