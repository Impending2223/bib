  text: Committee, in execu- tive session, ordered favorably reported the nominations of Adm. David L. McDonald,
    to be Chief of Naval Operations; Eugene G. Fubini, of New York, to be an Assistant Secretary of Defense; Alexander
    H. Flax, of New York, to be an Assistant Secretary of the Air Force; Gen. Curtis E. LeMay, for reappointment
    as Chief of Staff of 'the Air Force; and 1,829 nominations in the Army, Navy, and Air Force. The committee also
    approved S. 546, granting an easement for the use of lands in Camp Pendleton, Calif., for a nuclear electric
    generating station (amended); S.J. Res. 51, authorizing presentation of an Air Force Medal of Recognition to
    Maj. Gen. Benjamin D. Foulois, retired; and an original bill (S. 1809) to improve the active-duty promotion
    opportunity of Air Force officers from the grade of major to the grade of lieutenant colonel., Prior to this
    action, in open session, testimony was received from Secretary of the Navy Fred Korth in behalf of Admiral McDonald;
    and Dr. Harold E. Brown, Director of Defense Research and Engineering, who testified in behalf of Mr. Fubini.
    Admiral MeDonold and Messrs. Fubini and Flax were present to testify and answer questions on their own behalf.
