    office: representing several employees' associations
  text: 'Committee, in executive session, ordered favorably reported the nominations of Edward F. O''Malley, to
    be comptroller of customs, and John Neil McCardell, to be collector of customs, both with headquarters at Baltimore;
    and the following bills: H.R. 8517, to grant retirement benefits to certain emergency officers who did not qualify
    therefor because their applications were not submitted before May 25, 1929; H.R. 6371, to increase the amount
    of retirement income credit, and prescribing different limitations for individuals under age 72; H.R. 12599,
    relating to the income tax treatment of terminal railroad corporations and their shareholders (amended); H.R.
    IOII7, to provide that plans which provide medical and other benefits for retired employees may be qualified
    pension plans (amended); H.R. 10620, increasing the maximum limitations on the amount allowable as a deduction
    for medical, dental, etc., expenses (amended so as to include the text of S. 2046, allowing a dependency exemption
    in the case of a physically handicapped grandchild, although such grandchild has income in excess of $6oo);
    and H.R. 8846, relating to the taxation of dispositions of property (other than stock) pursuant to orders enforcing
    the antitrust laws. Committee rejected S. Con. Res. 95, relating to the importation of Curacao liqueur into
    the U.S.; H. Con. Res. 356, designating "bourbon whiskey" as a distinctive product of the U.S.; and H.R. 2016,
    to provide that States and political subdivisions which operate liquor stores shall not be required to pay more
    than one tax as a retail dealer in liquor. Prior to this action, in open hearings, testimony on H.R. 6371 was
    received from Stanley S. Surrey, Assistant Secretary of the Treasury; and Leonard J. Calhoun, representing several
    employees'' associations.'
