  exec: true
  text: 'The committee, in executive session; ordered the following bills reported favorably to the House: H.R.
    10569 (amended), to amend title 13, United States Code, to preserve the confidential nature of copies of information
    filed with the Bureau of the Census on a confidential basis; S. 1070, to amend the Federal Employees Group Life
    Insurance Act of. 1954, as amended, so as to provicle for an additional unit of life insurance; and. H.R. 10706
    (amended), to amend the Civil Service Retirement Act so as to provide for increase in annuities, eliminate the
    option with respect to certain survivor annuities. Major features of H.R. 10706 are as follows: 1. 7Y2-percent
    increase in annuities and survivor benefits effective January 1, 1963, with a minimum of $120 for widows of
    employees who served 20 years; 2. Gradually reduced percentage increase for those retiring in the next 4 years;
    3 Arbitrary "ceilings" in P.L. 555, 82d Congress, and P.L. 369, 84th Congress, are removed ($2,160 and -$4,104
    ceilings); 4 Future annuity adjustments when the Consumer Price Index rises by 3 percent or more; 5 The minimum
    2Y2 percent annuity reduction for providing survivor benefits is extended to the first $3,6oo of annuity, rather
    than the present $2,400; 6. The ratio of survivor benefits to basic annuities is increased frotn 50 to 55 percent;
    and 7 Retiree survivor benefits will be automatic unless the retiree elects not to so provide otherwise.'
