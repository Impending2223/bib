  text: 'Committee continued its ex~cu tive consideration of H.R. 1 I9''JO, proposed Trade Ex-. pansion Act of 1g62,
    and announced the -following tentative actions thereon: I. Section 221, relating to the advice of the Tariff
    Commission to the President prior to negotiations was redrafted to make more specific the factors to be taken
    into consideration by the Tariff Commission in making the prenegotiation study. 2. Approved an amendment substituting
    for the provisions of the bill relating to the EEC a new group, called the Free European Trading Community,
    consisting of all members of the European Economic Community and -such members of the European Free Trade Association
    as the President may designate. 3 Adopted an amendment redesignating section 252(c) as (d) and inserting a new
    section (c) which would provide that whenever a country which receives benefits from trade agree ment concessions
    made by the U.S. maintains unreasonable import restrictions which either directly or indirectly substan tially
    burden U.S. commerce, the President may suspend, with draw, or prevent the application of benefits of trade
    agreement concession to products of such country or refrain from proclaiming benefits of trade agreement concessions
    to carry out a trade agreement with such country. 4 Adopted amendment to provide that nothing contained in this
    act shall be construed to repeal or modify in any way any of the provisions of section 22 of the Agricultural
    Adjustment Act, or to apply to any import restrictions heretofore or here after imposed under said section.
    Committee will continue consideration of this n1easure tomorrow.'
