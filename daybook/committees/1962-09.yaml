  - S. 2937
  exec: true
  text: Committee, in executive session, ordered favorably reported with amendments H.R. 7927, providing for postal
    rate in creases and for increases in Federal employees' salaries. The bill, as approved by the committee, would
    provide an estimated $603 million annual additional revenue from postal rate increases, derived from (I) increased
    first-class postal rate to 5 cents, (2) increased airmail rate to 8 cents, (3) in second-class mail, three annual
    4-percent increases in editorial content, and three annual Io-percent increases in advertising content, and
    (4) increases in third- and fourth-class mail. With regard to Federal employees' pay increases, the bill would
    (I) provide upon enactment an average of 5.5-percent increase for classified workers, and an additional 4-I-percent
    increase on January I, Ig64, (2) provide upon enactment an average of 8.6-percent increase for postal workers,
    and an additional 2.6-percent increase on January I, Ig64, and (3) provide upon enactment a 7-percent increase
    for legislative employees. Also, committee adopted a substitute amendment for the so-called Cunningham amendment,
    which deals with section I2 of the bill, relating to dissemination of Communist propaganda by the U.S. mails.
    Also, committee adopted an amendment which would include in the bill the text of S. 2937, to provide increases
    in civil service retirement annuities.
