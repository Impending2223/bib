  exec: true
  text: Committee, in executive session~ ordered favorably reported with amendments H.R. 9042, implementing agreement
    concerning automotive products trade between the U.S. and Canada. The bill was amended (1) to permit implementation
    of new agreements with other countries (or replacement parts agreements with Canada) only after Congress has
    endorsed the President's proposed proclamation by passage of a concurrent resolution -of approval, and (2) to
    provide for reinstatement of U.S. duties (after 1968) on autos and parts from Canada if the Canadian value added
    after 1968 should increase abdve the level provided for in the letters of undertaking given to Canada by the
    auto manufacturers. Also, committee anounced that it would hold 2 days of public he~rings on Tuesday and Wednesday,
    September 28 and 29, on H.R. 11135, to extend the Sugar Act, if this bill has passed the House by that date.
