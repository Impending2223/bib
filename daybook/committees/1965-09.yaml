  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following: S. 1349, amending the inland,
    Great Lakes, and western rivers rules concerning passage of sailing vessels and vessels under 65 feet in length;
    S. 2142, to simplify the admeasurement of small vessels (amended); S. 2118, to clarify the Shipping Act of 1916
    and the Ship Mortgage Act of 1920, with regard to evidence of indebtedness on vessels. (amended); S. 906, providing
    for the measurement of gross and net tonnages for seagoing vessels having two or more decks; H.R. 725, to clarify
    the responsibility for the marking of obstructions in navigable waters; H.R. 727, to provide for the administration
    of the Coast Guard Band; H.R. 5989, to facilitate the use of cargo containers in coastwise trade; H.R. 7779,
    to provide for the retirement of enlisted members of the Coast Guard Reserve; H.R. 8761, providing an increase
    in the retired pay of certain members of the former Lighthouse Service; the nominations of Willard Deason, of
    Texas, to be a member of the ICC; Robert T. Bartley, of Texas, to be a member of the FCC; and 14 nominations
    in the Environmental Science Services Administration. Committee also discussed the controversy in the ad~ ministration
    of track and field events in the U.S. be~ tween the NCAA anq AAU, but made no recommenda tions with regard thereto.
    Prior to this action, committee held hearings on Mr. Bartley''s nomination where the nominee was present to
    testify and answer questions on his own behalf. ~'
  page: D517
  pdf: 515
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=515
