    or the supplemental s~ockpile, or both; H.R. 6852 (amended), to authorize the disposal, without regard to the
    prescribed 6~month waiting period, of approximately 47 million pounds of abaca from the national stockpile;
    H.R. ro5r6, authorizing the disposal of vegetable tannin extracts from the national stockpile; H.R. I0714, to
    authorize the disposal of colemanite from the supplemental stockpile; H.R. I07I5, to authorize the disposal
    of chemical grade chromite from the supplemental stockpile; and H.R. 10748, to authorize the transfer of copper
