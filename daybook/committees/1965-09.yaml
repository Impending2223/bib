  text: 'Committee, in executive session, ordered favorably reported the nominations.. of John S. Foster, Jr., of
    California, to be Director of Defense Research and Engineering; Dr. Robert A. Brooks, to be an Assistant Secretary
    of the Army; and 4,688 nominations in the Navy and Marine Corp. The committee also ordered reported the following
    measures: H.R. 7812, relating to the loan of naval vessels to friendly foreign countries (with an amendment
    in the nature of a substitute bill providing two submarines to Italy, one helicopter carrier to Spain, two destroyers
    to Argentina, three destroyers to Brazil, two destroyers to Turk~y, and one destroyer-escort to the Philippines);
    H.R. 6852, authorizing disposal of abaca from the national stockpile (amended); H.R. 10305, authorizing disposal
    of nickel from the national stockpile (-amended); H.R. rosr6, authorizing disposal of vegetable tannin extract
    from the national stockpile; H.R. ro7r4, authorizing disposal of colemanite from the supplemental stockpile;
    H.R. ro7r5, authorizing disposal of chemical grade chromite from the supplemental stockpile; H.R. 10748, authorizing
    transfer of copper from the national stockpile to the Bureau of the Mint; and H.J. Res. 330, authorizing disposal
    of chromium metal acid grade fluorspar and silicon carbide from the supplemental stockpile. Prior to this action,
    also, in.executive session, committee heard Adm. David L. McDonald, Chief of Naval Operations, and Vice Adm.
    Luther Heinz, Director of Military Assistance, Office of the Assistant Secretary of Defense, relative to loan
    of naval vessels to friendly foreign countries. In open session, subcommittee heard Messrs. Foster and Brooks
    testify and answer questions on their own behalf.'
