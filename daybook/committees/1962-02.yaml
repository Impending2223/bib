    297, to print copies of a hearing on export of strategic materials to Soviet-bloc countries; S. Res. 298, to
    print as a Senate document a compilation of tributes to Senator Hayden (amended); and an original concurrent
    resolution in lieu of S. Res. 287, to print additional copies of S. Rept. 448, 87th Congress, on the study of
    "Administered Prices in the Drug Industry." Committee also approved a report on the use of employees, by various
    Senate committees, of Government agencies on a reimbursable basis during the period of February I, 19(}1, through
    January 31, 1962. Committee announced appointment of subcommittees as follows: Standing Rules of the Senate-Senators
    Hayden, chairman, Cannon, and Dirksen; Privileges and Elections-Senators Cannon, chairman, Pell, and Curtis;
    Printing-Senators Hayden, chairman, Mansfield, and Curtis; Library-Senators Jordan, chairman, Mansfield, and
    Dirksen; - Smithsonian l1utitution-Senators Hickey, chairman, Pell, and Pearson; and Restaurant-Senators Jordan,
    chairman, Hickey, and Pearson. Committee approved an original resolution appointing Senator Curtis as a member
    of the Joint Committee on Printing, vice Senator Miller, and Senators Dirksen and Pearson as members of the
    Joint Committee on the Library, vice Senators Keating and Miller, respectively.'
