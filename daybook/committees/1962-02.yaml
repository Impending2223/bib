    sites and to repeal obsolete statutes. No final action was taken on this bill but the subcommittee voted to
    favorably report to the full committee the following bills: H.R. 9097, to authorize the Secretary of the Interior
    to sell certain public lands in Idaho, amended; H.R. 9273, to repeal obsolete laws relating to military bounty
    land warrants and to provide for cancellation of recorded warrants, amended; H.R. 8o3o, to amend the "Admittance
