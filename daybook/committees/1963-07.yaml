  exec: true
  text: The committee in executive session agreed, in part, to the administration revenue proposals contained in
    H.R. 3846, the Land and Water Conse~ation Fund Act of 1g63, concerning the transfer of certain taxes derived
    from gasoline and special motor fuels used in motorboats froin the highway trust fund to the land and water
    conservation account envisioned by the other parts of H.R. 3846. Under the committee decision, existing law
    relative to the amounts of these taxes will remain the same, as will also be true of the refund provisions (concerning
    2 cents of the 4-cent tax). However, the proceeds from the taxes will go into the land and water conservation
    account instead of the highway trust fut;1d. The committee agreed that these revenue provisions should be placed
    in a separate title in the bill, and that language therefor with respect thereon would be transmitted to the
    Interior Committee. The committee also agreed that the chajrman would introduce a clean bill embodying the provisions
    of H.R. 3386, the maternal and child health and mental retardation bill, amended in two particulars. This clean
    bill will be introduced within the nex~ several days. The committee will meet next on Monday, July 15, 1¢3,
    in executive session, to resume consideration of the Pr~sident' s Ig63 tax recommendations.
