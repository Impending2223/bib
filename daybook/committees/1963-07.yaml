  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: S. 130, to change
    the name of Fort Randall Reservoir in the State of South Dakota to Lake Francis Case; H.R. n35, to designate
    the dam to be constructed and the reservoir to be formed on the Des Moines River, Iowa, as the Red Rock Dam
    and Lake Red Rock; S. 131, to change the name of the Big Bend Reservoir in South Dakota to Lake Sharpe; S. 850,
    to change the name of the Bruces Eddy Dam and Reservoir in Idaho to the Dworshak Dam and Reservoir; H.R. 5478,
    to ~uthorize a survey of the Frio River in the vicinity of Three Rivers, Tex., in the interest of flood control
    and allied purposes; H.R. 6923, to authorize a survey of Cedar Bayou, Tex., for flood control; H.R. 1696 (amended),
    to define interests of local public agencies in water reservoirs constructed by the Federal Government where
    such agencies have contributed to construction costs; H.R. n36, to pay fair value for improvements rendered
    inoperative or adversely affected by the construction of the Red Rock Reservoir project; H.R. 5160, to authorize
    payments for certain improve~ ments affected adversely by the construction of the Milford Dam and Reservoir
    project, Kansas; H.R. 2671, to authorize construction of a bank protection and erosion prevention project on
    the Guyandot River at Barboursville, W.Va.; H.R. 7594, to designate the McGee Bend Dam and Reservoir on the
    Angelina River, Tex., as the Sam Rayburn Dam and Reservoir; and S. 254, to authorize the Architect of the Capitol
    to acquire certain property in the District of Columbia as an addition to the grounds of the U.S. Supreme Court
    Building. Approved four flood control resolutions.'
