    subcommittee amendments to Senate-passed bill: I. Mental retardation research centers (construction): Cut back
    to 3 years (from 5 years). Appropriations authorized for fiscal years 1¢4, 1965, 1¢6, totaling $2o million.
    2. Mental retardation facilities (construction): (a) University grants: Cut back to 3 years (from 5 years).
    Appropriations authorized for fiscal years r¢4, 1965, 1¢6, totaling $22.5 million. (b) State grants: Cut back
    to 2 years (from 4 years). Appropriations authorized for fiscal years 1¢5, r¢6, totaling $27.5 million. 3 Community
    mental health centers (construction): Cut back to 2 years (from 4 years). Appropriations authorized for fiscal
    years 1965, r¢6, totaling $ns million. 4 Community mental health centers (initial staffing): Cut back to 6 years
    (from 8 years). Appropriations authorized for fiscal year 1¢6 through fiscal year 1971, totaling $1l>9 million.
    Federal share of initial staffing costs cut to: Maximum of so percent (from 75 percent)-first 18 months. Maximum
    of 40 percent (from 6o percent)-next 12 months. Maximum of 30 percent (from 45 percent)-next 12 months. Maximum
    of 20 percent (from 30 percent)-final 12 months. S. rsJ6, as amended by subcommittee, authorizes appropriations
    totaling $407 million. The Senate~ passed bill authorizes appropriations totaling $8so million.'
