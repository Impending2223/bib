  text: Committee, in executive session, ordered favorably reported the nominations of John S. Everton, of New York,
    to be Ambassador to Burma, and Fulton Freeman, of California, to be Ambassador to Colombia; and the International
    Convention on the Prevention of Pollution of the Sea by Oil (Ex. C, 86th Cong., 2d sess.). Prior to this action,
    in open session, testimony was received from Messrs. Everton and Freeman in behalf of their own nominations.
    The committee also held hearings on S. J. Res. 75, providing for acceptance by the U.S. of the Agreement for
    Establishment of the Caribbean Organization, receiving testimony from Resident Commissioner A. Fern6s-Isern,
    of Puerto Rico, and John W. Hanes, Jr., U.S. Chairman, Caribbean Commission, who was accompanied by Abram Chayes,
    Legal Adviser, Department of State; and on the International Telecommunications Convention (Ex. J, 86th Cong.,
    2d sess.), and Radio Regulations (Ex. I, 86th Cong., 2d sess.), receiving testimony from Edwin M. Martin, Assistant
    Secretary of State for Economic Affairs; T. A. M. Craven and Rosel H. Hyde, FCC Commissioners; John Stephen,
    Air Transport Association; Donald C. Beelar, a D.C. attorney; R. N. White, Trans-World Airlines; and Clarence
    Rice, Avionic Products, Bendix Radio Corp.
