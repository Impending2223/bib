  text: Committee, in executive session, ordered favorably reported the nomination of Ernest R. F eidler for promotion
    to rear admiral in the U.S. Coast Guard; 226 other nominations in the Coast Guard; without amendment H.R. 2457,
    to amend the Merchant Marine Act in order to clarify the construction subsidy provisions with respect to reconstruction,
    reconditioning, and conversion; and S. 1222, relating to the documentation and inspection of U.S. vessels; and
    with amendment S. 1289, to eliminate the oath requirement with respect to certain export manifests; S. 684,
    to amend the Communications Act with respect to the painting and illumination of radio towers; S. n83, providing
    for the reimbursement of certain vessel construction expenses; S. n85, to amend the Merchant Marine Act so as
    to authorize the expenditure from certain capital reserve funds of certain amounts for research, development,
    and design expenses; and S.J. Res. 21, authorizing sale of IO Liberty-type merchant vessels to U.S. citizens
    for conversion into barges.. The committee referred to its Subcommittee on Communications for study and analysis
    the proposed reorganization plan of the FCC. Prior to this action, in open session, hearings were held -on the
    nominations of Mr. Feidler, and Joseph C. Swidler, of Tennessee, and Howard Morgan, of Oregon, both to be members
    of. the FPC, where the nominees testified and answered questions in their own behalf. Hearings were also held
    on S. n89, authorizing the Coast Guard to carry on certain 9ceanographic research, with testimony from Vice
    Adm. James A. Hirshfeld, Assistant Commandant, U.S. Coast Guard.
