  text: 'Committee, in executive session, ordered favorably reported the following bills: S. 529, providing a more
    e.ff ective evaluation of the fiscal requirements of executive agencies of the U.S. Government; S. 540, authorizing
    agencies of the U.S. Government to pay in advance for required publications; S. 541, to empower the GSA Administrator
    to appoint non uniformed special policemen; S. 537, to revise a restriction on the conveyance of surplus land
    for historic-monument purposes; S. 539, to make nationals, American and foreign, eligible for certain scholarships
    under the Surplus Property Act of 1944; S. 538, to empower certain officers and employees of the GSA to administer
    oaths to witnesses; S. 796, authorizing the use of surplus personal property by State distribution agencies;
    S. 649, authorizing certain payments of deceased members'' final accounts without necessity of settlement by
    GAO; S. 162, creating a commission to be known as the Commission on Noxious and Obscene Matters and Materials;
    and S. 1869, to provide for the establishment of a commission on problems of small towns and rural counties.
    Committee deferred action on S. 154, adjusting the legislative jurisdiction exercised by the U.S. over lands
    in the several States which are used for Federal purposes; S. 1412, authorizing conveyance of certain public
    lands in Arkansas to the city of Fayetteville; and S. 1497, authorizing reconveyance to former owner thereof
    of certain property at Cheli Air Force Depot, Los Angeles County, Calif. Committee announced that it will hold
    hearings on June 6 on Reorganization Plans Nos. 1, 2, 3, and 4, which deal respectively with the SEC, FCC, CAB,
    and FTC. Committee referred to its Subcommittee on Reorganization and International Organizations S. 289, 375,
    609, and 1633, bills providing for the establishment of a Department of Urban Affairs. Committee indefinitely
    postponed further action on S. 647, to restrict the purposes for which certain real property to be disposed
    of by the U.S. may be sold. Committee authorized the filing as Senate reports of a report of its Permanent Subcommittee
    on Investigations entitled "Incompetence of Sta.ff Director, Commission on Civil Rights," and committee print
    of its Subcommittee on Reorganization and International Organizations on "Coordination of Information on Current
    Scientific Research and Development Supported by the U.S. Government."'
