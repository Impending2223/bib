  name: Conferees
  heading: MINIMUM WAGE
  bills:
  - H.R. 3935
  exec: true
  text: 'in executive session, agreed to file a conference report on the differences between the Senate- and House-passed
    versions of H.R. 3935, Fair Labor Standards Amendments of 1¢1. As agreed by the conferees, the bill would (1)
    extend minimum wage coverage to approximately 3.6 million workers (provisions for extended coverage to employees
    of laundry establishments and automobile dealers were deleted from the bill), (2) establish the 5-year escalation
    period to reach the minimum wage of $1.25, and the 40-hour workweek, and (3) adopt the so-called inflow test,
    which means that retail and service enterprises would be covered by the bill, only if they met the following
    test: (a) the employer must be engaged in commerce or the production of goods for commerce, (b) the employer
    must receive $250,000 worth of goods, for resale, which have moved across State lines (so-called inflow test),
    and (c) the employer must have an annual gross volume of sales of not less than $1 million, exclusive of excise
    taxes at the retail level.'
  page: D187
  pdf: 185
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=185
