  text: 'Subcommittee on Flood Control-Rivers and Harbors began hearings on several pending bills relating to the
    Federal Water Pollution Control Act, receiving testimony from Senator Moss; Dr. John D. Porterfield, Deputy
    Surgeon General, Public Health Service; Maj. Gen. William F. Cassidy, Corps of Army Engineers; and Milton P.
    Adams, Water Resources Commission, Lansing, Mich. Several statements were submitted for inclusion in the record,
    including one by Senator Young of North Dakota. Hearings continue tomorrow. Also, the subcommittee, after holding
    hearings thereon, approved for full committee consideration the following four bills: S. 48, authorizing the
    modification of certain leases entered into for provision of recreational facilities in reservoir areas; S.
    49, to provide for the annual audit of certain bridge commissions and authorities; S. 50, authorizing establishment
    of regulations at water supply projects in the D.C. and environs; and S. 8n, to establish a Wabash Basin Interagency
    Water Resources Commission.'
