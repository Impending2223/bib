  text: Subcommittee on Public Lands approved for full committee consideration S. 1018, authorizing acquisition
    of additional land for Cumberland Gap National Historical Park, Ky.; S. 1317, to change the name of the portion
    of the Hawaii National Park which is on the island of Hawaii to Hawaii Volcanoes National Park; S. 1489, to
    revise the boundaries of the Fort Raleigh National Historical Site, N.C.; S. 1492, relating to the method of
    selection of superintendents of national cemeteries; S. 1647, providing for the addition of certain lands to
    the Cedar Breaks National Monument, Utah; S. 1675, to revise the boundaries of Scotts Bluff National Monument,
    Nebr.; S. 1775, authorizing acquisition of 12 acres of land for the Richmond National Battle.field Park, Va.;
    H.R. 3283, changing name of the Fort Vancouver National Monument to Fort Vancouver National Historical Site,
    Wash.; H.R. 5416, to include within the boundaries of Joshua Tree National Monument, Calif., certain federally
    owned lands; H.R. 5475, to transfer a section of the Blue Ridge Parkway to the Shenandoah National Park, Va.;
    H.R. 5571, providing for the addition of certain lands to the Effigy Mounds National Monument, Iowa; and H.R.
    5765, authorizing purchase and exchange of land and interests therein of the Blue Ridge and Natchez Trace Parkways.
    Prior to approval of these bills, subcommittee received testimony thereon, and on other pending bills, from
    Frank E. Harrison, National Park Service, and George H. Morrissey, Office of the Quartermaster General, Army,
    who directed his remarks to S. 1492. Subcommittee also received testimony from Senator Holland, who directed
    his remarks to public lands measures in the State of Florida (S. 93, H.R. 2898 and 3526); and Max Caplan, Bureau
    of Land Management, on several bills. Subcommittee recessed subject to call of the Chair.
