  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 879 (amended),
    to increase rates of wartime disability compensation;. H.R. 2417 (amended), to provide increased benefits for
    parents of veterans dying from service-connected disabilities;. H.R. 6269, to extend the provisions for benefits
    based on limited periods immediately following discharge from active duty after December 31, 1956, to veterans
    discharged before that date; and H.R. 7148, relating to the transportation of the remains of veterans who die
