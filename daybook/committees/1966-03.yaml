    title: Secretary of the Treasury
    name: Henry H. Fowler
  text: Committee, in ex ecutive session, by a vote of 13 to o, ordered favorably reported with amendments H.R.
    12752, proposed Tax Adjustment Act. Amendments adopted to the bill would (1) delete the 1-percent floor stock
    tax on auto dealers' inventories; (2) make a technical amendment to the graduated withholding provision relating
    to eligibility for withholding allowances; (3) disallow deduction for certain indirect political contributions;
    and (4) require the Secretary of Agriculture to send information returns to recipients of agricultural payments
    showing total amount of payment made during the year. Prior to this action, committee concluded its hearings
    on the bill after receiving further testimony from Secretary of the Treasury Henry H. Fowler.
  page: D75
