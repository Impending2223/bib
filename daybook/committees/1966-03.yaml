    Business Administration to sell participations in pools of SBA loans directly or through FNMA (amended); S.
    2719, authorizing the mint to strike 200,000 medals and sell them at cost to the Alaska Centennial Commission;
    S. 2729, increasing by $125 million the ceiling on the SBA revolving fund (amended); S. 2831, authorizing the
    mint to strike 150,000 medals and sell them at cost to the Scranton Association, Inc., which is commemorating
    the looth anniversary of Scranton, Pa.; S. 2835, to authorize the mint to strike 50,000 medals and sell them
    at cost to the American Numismatic Association, which is celebrating its 75th anniversary; and HR. 7526, to
    authorize the mint to strike 100,000 medals and sell them at cost to the HemisFair Corporation, which is celebrating
