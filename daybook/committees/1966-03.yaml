  text: 'Subcommittee on Veterans'' Affairs held hearings on the following bills: S. 2748, providing for participation
    by the VA in medical commun,ity planning; H.R. 11631, clarifying responsibility of the VA with respect to the
    training and education of health service personnel; H.R. 203, to provide that the VA Administrator set aside
    funds for research into spinal cord injuries and diseases; S. 2666, clarifying the statutory functions of the
    Department of Medicine and Surgery of the VA; and S. 3086, to im:prove medical care for veterans by authorizing
    the Administrator to enter into cooperative agreements with private medical facilities for the purpose of sharing
    advanced information and techniques. Witnesses heard were Dr. H. Martin Engle, Chief Medical Director, Dr. B.
    B. Wells, Assistant Chief Medical Director for Research and Medicine, and A. T. Bronaugh, Assistant General
    Counsel, all of the Veterans'' Administration; Dixon Christian, Paralyzed Veterans of America; Francis W. Stover,
    Veterans of Foreign Wars; F. B. Wallace, mayor of Amarillo, Tex.; and Dr. Stafford L. Warren, dean emeritus,
    UCLA Medical School. Hearings were adjourned subject to call.'
