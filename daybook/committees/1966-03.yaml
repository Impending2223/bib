    name: Alfred Bexelius
    office: a distinguished Swedish ombudsman, who explained the history and function of his office
  text: Subcommittee on Administrative Practice and Procedure held hearings on the possibility of creating an office
    of Ombudsman in the United States. Testimony was received from Alfred Bexelius, a distinguished Swedish ombudsman,
    who explained the history and function of his office. Mr. Bexelius was introduced to the committee by Hubert
    W. A. de Besche, Swedish Ambassador to the U.S. Generally speaking, the Office of Ombudsman, which exists in
    other Scandinavian countries and New Zealand, functions as a guardian of the peoples' rights against abuses
    and malfunctions by Government, its programs, and its officials. Hearings were recessed subject to call.
  page: D91
