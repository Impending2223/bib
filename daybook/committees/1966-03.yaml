  text: Committee, ih executive session, ordered favorably reported the nomination of Farris Bryant, of Florida,
    to be Director of the Office of Emergency Planning. Committee also approved S. 2642, authorizing disposal of
    platinum from the national stockpile without regard to the 6-month waiting period; and S. 1488, authorizing
    disposal from the national stockpile of refractory grade bauxite (amended so as to authorize disposal of 126,300
    long calcined tons instead of 50,000 tons, as originally proposed). Committee also approved an original resolution
    (S. Res. 235) authorizing an additional $10,000 for committee expenses. Prior to this action, committee held
    hearings on the nomination of Mr. Bryant with favoring testimony from Senator Holland on behalf of himself and
    Senator Smathers. The nominee was present to testify and answer questions on his own behalf.
