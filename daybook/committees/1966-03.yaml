  text: 'Committee, in executive session, ordered favorably reported the following bills: H.R. 432, to amend the
    Federal Employees Group Life Insurance Act and the Civil Service Retirement Act with regard to designation of
    beneficiari~s; H.R. 969, authorizing redetermination under Civil Service Retirement Act of annuities to certain
    reemployed annuitants; H.R. 1647, authorizing payment of back pay and restoration of employment benefits to
    certain Government employees who were improperly deprived thereof by unwarranted personnel action; H.R. 1746,
    to define "child" under the Civil Service Retirement Act to include adopted child but not stepchild for lump-sum
    benefits (amended); H.R. 6926, strengthening financial condition of the Federal employees'' insurance fund by
    authorizing Federal contributions thereto (amended); H.R. 8030, providing for the discontinuance of the Postal
    Savings System; and H.R. 10553, preserving the retirement, group life, and health benefits for Congressional
    employees receiving fellowships from the American Political Science Association; and S. 2573, validating the
    action of the Superintendent of Yosemite National Park in extending the 1955 leave year for employees engaged
    in storm and flood work... Committee also approved 207 postmaster nommatlons.'
