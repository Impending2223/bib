  exec: true
  text: 'continued in executive session to resolve the differences between the Senate- and House-passed versions
    of S. 3418, authorizing funds for the Federal-aid highway program for fiscal years 1970 and 1971, but did not
    reach final agreement, and will meet again on Tuesday, July 16. Private Bills: The following three private bills
    were passed as indicated: H.R. 2756, without amendment and cleared for White House; S. 3173, without amendment;
    and S. 3083, with committee amendment. Page 20965 Public Lands: Senate passed with committee amendments S. 1385,
    directing that 25 percent of gross revenues from sale of timber on public lands shall be paid to the appropriate
    counties for use for public schools and roads. Page 20967 Higher Education: Senate took up S. 3769, proposed
    higher education amendments of 1g68. Page 20993 Legislative Program: Majority leader announced that next week
    will be the crucial test in determining whether the goal of sine die adjournment by August 3 will be reached
    and it is therefore the intention of the leadership to convene early and stay late, if necessary, each day next
    week, and it is intended to meet next Saturday, if necessary, to take action on the following bills: On Monday
    morning Senate will consider its unfinished business S. 3769, higher education, to be followed by S. 3770, vocational
    education, and H.R. 17023, independent offices appropriations, after which it is hoped, on Monday, or as soon
    thereafter as possible, to consider S. 3724, mutual funds. Thereafter, it is hoped that H.R. 18188, Transportation
    Department appropriations, will be ready for floor consideration, to be followed by S. 3590, farm bill. The
    latter part of the week Senate should be considerering H.R. 17903, public works appropriations; H.R. 18027,
    Labor-HEW appropriations; and H.R. 17522, State-Justice-Commerce appropriations. Other matters on the calendar
    will be considered as time permits. The leadership requested that all Members arrange their schedules to permit
    the fullest attendance. Page 20965 Treaty Received: Convention on Transit Trade of Land-locked States (Ex. I,
    goth Cong., second sess.), signed on behalf of U.S. December 30, 1g65, was received; referred to Committee on
    Foreign Relations. Page 20968'
