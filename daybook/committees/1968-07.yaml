  text: 'Committee held hearings to receive testimony as to the usefulness of the model cities program to elderly
    Americans, with testimony from H. Ralph Taylor, Assistant Secretary, and Marie C. McGuire, Assistant for Problems
    of the Elderly and the Handicapped, both of the Department of HUD; William Beechill, Commissioner, Administration
    on Aging, Department of Health, Education, and Welfare; Margaret Bush Wilson, St. Louis Model City Agency; Naomi
    Gordon, Ecumenical Center of Roxbury, N.Y.; Roy T. Batchelor, Chattanooga-Hamilton County Community Action Agency,
    Tennessee; Mary Nenno, National Association of Housing and Rehabilitation Officials; David Joyce, Division of
    Community Services, Providence, R.I.; Mark Y essian, a research analyst in urban planning, Baltimore; and Geneva
    Mathiasen, National Council on the Aging. Hearings were recessed subject to call. Page 22744 Boy Scouts: Passed
    by a voice vote H.R. 15268, authorizes the Secretary of Defense to lend certain Army, Navy, and Air Force equipment
    and provides certain services to the Boy Scouts of America for use in the 1¢9 National Jamboree. Page 22745
    Firearms: Continued consideration of H.R. 17735, to provide for a better control of interstate traffic in firearms,
    and tentatively adopted in the Committee of the Whole amendments relating to: Exemption of collectors and licensed
    collectors; Applicability in relation to discharge from Armed Forces; Purpose and intent of bill; Repair or
    customizing of firearms; Exclusion of rifle, shotgun, and.22 caliber rim fire ammunition; Restriction on importation
    of surplus military firearms; Exclusion of those who handload, reload, and customload firearms; Exemption of
    people, institutions, and organizations engaged in competition and military training; and Retroactiveness of
    bill. Rejected amendments relating to:, Requirement that States license all gunowners; Limits definition of
    ammunition to ammunition for a destructive device; Exclusion of use of guns for sporting purposes; Makes unlawful
    interstate purchase of firearms if in violation of State law; Punishment for use of firearms in the commission
    of a felony; and Exemption of transactions between licensed dealers and individuals residing within the same
    State. Pages 22745-22795 Special Pay: Passed H.R. 17780, amended, providing for pay to certain members of the
    uniformed services held captive in North Korea. Page 22795 Quarters Allowance: Passed H.R. 6729, amended, making
    members of the Reserve and National Guard ordered to active duty for training for periods of 30 days or more
    eligible for quarters allowances. Page 22796 Officers: Passed H.R. 18146, to correct an inequity affecting officers
    of the Supply Corps and Civil Engineer Corps of the Navy. Page 22797 Health Services: Passed H.R. 16254, Health
    Services Career Incentives Act. Pages 22797-22798 Land Transfer: Passed and cleared for the White House S. 2908,
    authorizes the Secretary of the Army to quitclaim certain real property in Muscogee County, Ga. Page 22798 Land
    Restrictions: Passed and cleared for the White House S. 3495, authorizes the release of certain use restrictions
    on land in Iowa to permit the construction of the Iowa Law Enforcement Academy. Pages 22798-22799 Health: Passed
    H.J. Res. 1404, amended, provides for the designation of the week of November 17-23, lg}8, as "National Family
    Health Week." Page 22199 Professional Photography Week: Passed S.J. Res. 181, amended, to authorize the President
    to designate the week of August 4 through August 10, 1¢8, as "Professional Photography Week." Pages 22799-22800
    National Hispanic Heritage Week: Passed H.J. Res. 1299, amended, authorizing the President to proclaim the week
    including September 15 and 16 as "National Hispanic Heritage Week." Page 22800 Late Reports: Granted permission
    to the Committee on Rules to file several reports by midnight tonight; and to the Committee on Banking and Currency
    to file a conference report on S. 3497, Housing and Urban Development Act, by midnight tonight. Page 22800 Adjournment:
    Adjourned at 7:40 p.m.'
