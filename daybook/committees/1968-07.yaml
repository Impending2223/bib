  - S. 3736
  exec: true
  text: 'Committee, in executive session, by a vote of IO to 5, ordered reported without amendments S. 3590, extending
    and improving programs to maintain farm income, stabilize prices, and assure adequate supplies of agricultural
    commodities. As approved by the committee the bill would provide a four-year extension of the present farm program,
    including the class- 1 milk base program. Committee agreed to strike the title of the bill relative to farm
    bargaining. Committee also ordered reported S. 3578, authorizing release of a condition in a deed conveying
    certain lands to South Carolina (amended); S. 3687, authorizing release of a condition in a deed conveying certain
    lands to Ohio; and S. 3736, authorizing the sale to Central, New Mexico, of certain lands which were formerly
    part of the Fort Bayard Military Reservation. Committee also approved the following watershed projects: Lower
    Big Swamp Creek, Ala.; Upper Big Swamp Creek, Ala.; Buttonwillow Water Management project, California; Head
    of Little Tennessee River (supplement), Georgia and North Carolina; Georgetown Creek, Idaho; Hurley Creek, S.
    Dak.; Darrs Creek, Tex.; and Willow Creek, Wis.'
