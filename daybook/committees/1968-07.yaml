    title: Secretary of Commerce
    name: C. R. Smith
  text: Committee, in executive session, ordered favorably reported S. 3945, authorizing documentation of the vessel
    West Wind as a vessel of the U.S. with coast-wise privileges. Committee also approved for reporting nominations
    of Joseph W.. Bartlett, of Massachusetts, to be Under Secretary of Commerce; Wallace R. Burke, of Connecticut,
    to be an Interstate Commerce Commissioner; John H. Crooker, Jr., of the D.C., to be a member of the Civil Aeronautics
    Board; Frederick Simpich, of the D.C., to be General Counsel of the Department of Commerce; and Kenneth H. Tuggle,
    of Kentucky, to be an Interstate Comm~rce Commissioner; and sundry nominations in the Environmental Science
    Services Administration and the U.S. Coast Guard. Committee voted to reconsider its action of July 18 when it
    approved for reporting H.R. 163, preventing vessels built outside of the U.S. or documented under foreign registry
    from carrying cargoes restricted to vessels of the U.S. Committee agreed to hold hearings on this bill, the
    date of which is as yet undetermined. Prior to approval of the above nominations, committee held hearings on
    the nomination of Mr. Burke, with testimony from Senators Ribicoff and Dodd; and Representatives Monagan and
    Meskill. Testimony in behalf of Mr. Simpich was received from Secretary of Commerce C. R. Smith.
