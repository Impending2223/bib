  text: 'Subcommittee on Veterans'' Affairs held hearings on the following proposed veterans'' legislation: S. 2985
    and H.R. 16o25, educational benefits for widows; S. 792 and H.R. 3593, nursing home requirements in Alaska and
    Hawaii; S. 417 and S. 995, private contract hospitals in Alaska and Hawaii; S. 2093 and H.R. 16902, increasing
    Federal payments to States for veterans'' care; H.R. 7481, increasing payments to community nursing homes; S.
    2911 and H.R. 14954, authorizing part-time vocational rehabilitation; S. 3349, to liberalize educational entitlement
    and on-farm training; S. 3350, authorizing flight training for eligible veter~ms; S. 3476, relating to flight
    training payment schedule; S. 3477, authorizing educational assistance loans; and S. 3112, relating to school
    standards for training of veterans. Testimony was received from Senator Gruening; A. T. Bronaugh, Assistant
    General Counsel, A. W. Farmer, Chief Benefits Director, and Dr. Paul Haber, Department of Medicine and Surgery,
    all of the Veterans'' Administration; John Quigley, National Association of State Veterans Homes; Marvin Busbee,
    National Association of State Approving Agencies; Charles Mattingly and E. M. Golembieski, both of the American
    Legion; and Blue Carstensen, National Farmers Union. Hearings were adjourned subject to call.'
