  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following bills: H.R. 4739, authorizing
    long:.term leases on lands in the El Portal administrative site adjacent to Yosemite National Park, Calif.;
    S. 2159, to establish the Fort Point National Historic Site in San Francisco (amended); S. 3379, to designate
    as wilderness certain lands in the Great Swamp National Wildlife Refuge, N.J. (amended); S. 3343, to designate
    as wilderness certain lands in the Pelican Island National Wildlife Refuge, Fla. (amended); S. 3425, to designate
    as wilderness certain lands in the Monomoy National Wildlife Refuge, Mass. (amended); S. 3502, to designate
    as wilderness certain lands in Seney, Huron Islands, and Michigan Islands National Wildlife Refuges in Michigan,
    Gravel Island and Green Bay National Wildlife Refuges in Wisconsin, and Moosehorn National Wildlife Refuge,
    Maine (amended); S. 1385, directing that 25 percent of gross revenues from sale of timber on public lands shall
    be paid to the appropriate counties for use for public schools and roads (amended); S. 1764, to repeal the law
    which limits certain inheritances of deceased Yakima Indians to tribal members of one-fourth or more degree
    of Indian blood (amended); S. 3621, providing for disposition of judgment fonds in favor of the Muckleshoot
    Indians; S. 3620, providing for disposition of judgment funds to credit of the Quechan Tribe of the Fort Yuma
    Reservation, Calif.; S. 2715, providing for disposition of judgment funds in favor of the Chickasaw Nation or
    Tribe of Oklahoma; H.R. 9098, to revise the boundaries of the Badlands National Monument, S. Dak. (amended);
    S. 3227, to provide for disposition of funds judgment in favor of the Southern Paiute Nation of Indians; and
    S. 3575, authorizing Secretary of the Interior to engage in feasibility studies of certain water resource developments.'
