  - H.R. 16241
  exec: true
  text: Committee, in executive session, ordered favorably reported with amendments H.R. 16027, making graduated
    increases in compensation for disabled veterans with wartime disability. Also, committee agreed to amendments
    which (l) would suspend the application of the Antidumping Code, and (2) would provide for a 2-year extension
    of the Coffee Agreement, which amendments will be offered on the floor to the bill H.R. 17324, to amend and
    extend the Renegotiation Act of 1951, which is now pending on the Senate calendar. Committee also approved an
    amendment which would provide a 2-year suspension of duty on copper, which amendment will be offered to H.R.
    7735, relating to the dutiable status of aluminum hydroxide and oxide, calcined bauxite, and bauxite ore, which
    bill. is also pending on the Senate calendar. Committee announced that it will hold hearings on the Canadian
    Auto Agreement, date of which hearings is as yet undetermined. Committee also announced that it had canceled,
    until further notice, its hearings on H.R. 16241, to impose an excise tax on overseas air transportation tickets,
    and to reduce customs exemptions for residents returning from abroad.
