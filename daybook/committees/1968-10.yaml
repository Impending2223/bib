  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following: H.R. 18101, to amend section
    337 of the Internal Revenue Code with respect to recognition of gain or loss on sales or exchanges in connection
    with certain liquidations (amended so as to make cement mixers exempt from the truck tax); H.R. 18942, relating
    to income tax treatment of certain statutory mergers of corporations; H.R. 18486, to amend the Internal Revenue
    Code with respect to the treatment of income from the operation of a communications satellite system; H.R. n394,
    to amend certain provisions of the Internal Revenue Code relating to distilled spirits (amended so as to add
    the text of H.R. 16552, to revise tariff schedules with respect to tariff classification of invert or high-test
    molasses); H.R. 14095, to amend the Internal Revenue Code so as to make certain changes to facilitate the production
    of wine; H.R. 17332, to amend the Internal Revenue Code regarding credits and payments in the case of certain
    use of gasoline and lubricating oil (amended); H.R. 7567, to amend the Internal Revenue Code with respect to
    the definition of compensation for purposes of tax under the Railroad Retirement Tax Act; and H.R. 15003, to
    amend the tariff schedules so as to prevent the payment of multiple customs duties in the case of horses temporarily
    exported for the purpose of racing. Committee also approved the nominations of Will E. Leonard, Jr., of Louisiana,
    and Herschel D. Newsom, of Indiana, both to be members of the U.S. Tariff Commission.'
