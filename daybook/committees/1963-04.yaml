    the Vicksburg National Military Park and provide for adjustments necessitated by the installation of a park
    tour road; S. 932, to allow the secretary of the Interior to set the age limits of U.S. Park Police; and S.
    1039, authorizing exchange of surplus park property at Great Falls, Va. Prior to this action, subcommittee held
    hearings, with testimony from Senator Randolph, who directed his remarks to S. 18, and Frank Harrison, National
    Park Service, who testified in connection with all of these bills, and S. 503, authorizing acceptance of a donation
    of 6 acres for a headquarters site at Isle Royale National Park, Mich. Statements were filed for inclusion in
    the record by Senators Stennis and Eastland in connection with S. 386, and by Senator Hart in connection with
    s.so3. Subcommittee also held hearings on S. 792, to establish in Michigan the Sleeping Bear Dunes National
    Lakeshore, with testimony from Robert B. Hotaling, professor of urban planning, Michigan State University. Hearings
    on this bill and on S. 503 were recessed subject to call of the Chair.
