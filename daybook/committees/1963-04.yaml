  text: Subcommittee on Veterans' Affairs, in executive session, approved for full committee consideration S. 331,
    to extend grants-in-aid to the Republic of the Philippines for hospitalization of Commonwealth Army veterans;
    S. 384, prohibiting eviction of dependents of military personnel where monthly rental does not exceed $135;
    S. 412, authorizing VA to waive or release claims following default and loss of property by the borrower veteran
    under certain conditions; S. 449, authorizing up to $1,6oo for purchase of automobiles for certain disabled
    cold war veterans (amended); and S. 625, including within the definition of "VA facilities" private hospitals
    under contract to the VA in States without such facilities (Alaska and Hawaii) (amended). Following this meeting,
    subcommittee held hearings on S. 5, proposed Cold War Veterans' Readjustment Assistance Act, and S. 330, to
    designate State agencies to work in conjunction with the VA in approving courses under the educational programs
    established for war orphans, receiving testimony from Senators Bayh,. Randolph, and Pong; William Truitt, assistant
    director, National Farmers Union; Dr. Kenneth E. Carl and Carter Layne, both on behalf of the American Vocational
    Association; Robert Salling, National Association of State Approval Agencies; and Patrick F. Cavanaugh, University
    of Maryland Veterans' Association. Hearings continue tomorrow.
