    Kotschnig, of Maryland, to be U.S. Representative to the 18th Plenary Session of the Economic Commission for
    Europe of the Economic and Social Council of the U.N. Also, the committee approved amendments to the Philippine
    War Damage Claims Act of 1962, and authorized Chairman Fulbright to request the Appropria~ tions Committee to
    include these amendments in the bill H.R. 5517, supplemental appropriations for fiscal year 1963, which bill
