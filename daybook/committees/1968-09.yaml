  text: Subcommittee on Financial Institutions began a series of hearings to determine what financial institutions
    are doing now to help meet the investment and credit needs of the ghetto, and to explore what additional steps
    can be taken to channel more private investment into the inner city. Witnesses heard were Senators Mondale and
    Percy; Mayor Joseph Alioto of San Francisco, representing the U.S. Conference of Mayors and the National League
    of Cities; Ross D. Davis, Assistant Secretary for Economic Development, accompanied by Jonathan Lindley, Deputy
    Assistant Secretary, both of the Commerce Department, and Richard Allen, Economic Resources Corporation, Los
    Angeles; and William B. Ross, Deputy Under Secretary of Housing and Urban Development, the latter of whom submitted
    a statement. Hearings continue tomorrow.
