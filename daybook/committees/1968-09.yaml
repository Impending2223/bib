  text: 'Committee held hearings on the nomination of Jam es R. Wiggins, of the D.C., to be U.S. representative
    to the United Nations, with testimony from Lev E. Dobriansky, Professor at Georgetown University, and Chairman,
    National Captive Nations Committee. The nominee was present to testify and answer questions on his own behalf.
    Committee will hold an executive meeting tomorrow to consider this nomination, and other committee business.
    D.C. Claims: The House concurred in Senate amendments to H.R. 8140, D.C. claims settlement, thus clearing the
    bill for White House action. Page 28691 Private Bill: The House concurred in Senate amendments to H.R. 6862,
    a private bill, thus clearing the bill for White House action. Page 28691 Aeronautical Exposition: The House
    by a voice vote passed H.R. 12012, International Aeronautical Exposition, amended. Pages 28691-28692 Ways and
    Means: The following bills reported from the Committee on Ways and Means were called up (by unanimous consent)
    and passed: H.R. ''59o9, rate of duty on stethoscope parts, amended; H.R. 7567, definition of compensation under
    Railroad Retirement Tax Act, amended; H.R. 13419, free entry of Cuprophane, amended; H.R. 15023, regulated investment
    compames, amended; H.R. 15114, losses incurred in connection with redemption of savings notes; H.R. 17332, credits
    and payments in the case of certain uses of gasoline and lubricating oil, amended; H.R. 18253, effective date
    of 1966 change in definition of earned income for purposes of pension plans of selfemployed individuals, amended;
    H.R. 18373, implementing conventions for free admission of professional equipment and containers, and for AT
    A, ECS, and TIR Carnets, amended; H.R. 18486, tax treatment of income from operation of communications satellite
    system, amended; H.R. 18942, income tax treatment of certain statutory mergers of corporations, amended; H.R.
    15003, to prevent payment of multiple customs duties on certain racehorses, amended; H.R. 11394, amending Internal
    Revenue Code re distilled spirits, amended; H.R. 14095, relating to the production of wine, amended;'
