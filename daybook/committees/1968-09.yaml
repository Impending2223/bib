  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following measures: H.R. 5n7, authorizing
    funds to construct and operate the Palmetto Bend reclamation project, Texas; S. 2553, to authorize modification
    of operation and relocation of costs of the Kartes unit, Missouri River Basin project, Wyoming, for.fishery
    conservation (amended); H.R. 17684, to authorize longer term leases of Indian lands on the Pueblos of Cochiti,
    Pojoaque, Tesuque, and Zuni, in New Mexico; H.R. 18885, providing for distribution of judgment funds in favor
    of the Seminole Tribe of Oklahoma; H.R. 17273, permitting appointment of guardians to protect the interest of
    the Agua Caliente Band of Mission Indians; H.R. 551, authorizing establishment of the Biscayne National Monument
    in Florida; H.R. 13099, authorizing establishment of the Carl Sandburg Home National Historic Site in North
    Carolina; H.R. 17787, authorizing funds to satisfy judgments against the U.S. in condemnation proceedings for
    Padre Island National Seashore, Tex.; and H.R. 8781, authorizing exchange of certain public lands in Shasta
    County, Calif. Also, committee approved an original resolution callin cr for referral to the Court of Claims
    to determine the re;l equities and report back to Congress relative to the bill H.R. 10256, to render the assertion
    of land claims by the U.S. based upon accretion or avulsion subject to legal and equitable defenses to which
    private persons asserting such claims would be subject. Committee also approved the nomination of T. Harold
    Scott, to be a member of the Indian Claims Commission, prior to which action, the nominee was present to testify
    and answer questions on his own behalf.'
