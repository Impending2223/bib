  text: 'met in executive session to resolve the differences between the Senate- and House-passed versions of H.R.
    17324, proposed Renegotiation Act Amendments of 1g68, but did not reach final agreement, and will meet again
    tomorrow. Bills Referred: Numerous House-passed bills were appropriately referred. Pages 28935 -28936 Fortas
    Nomination-Cloture: By 45 yeas to 43 nays, Senate rejected Mansfield motion to close debate on his motion to
    consider nomination of Abe Fortas, of Tennessee, to be Chief Justice of the United States (twothirds of the
    Senators present and voting not having voted in the affirmative). Question on adoption of Mansfield motion to
    consider this nomination remains unfinished business in executive session. Pages 28926-28934 Taxation: Senate
    returned to legislative session from executive session, after its vote on the cloture motion respecting the
    F ortas nomination, and the unfinished business in legislative session, H.R. 2767, to allow farmers an amortized
    tax deduction for assessments levied by soil or water conservation districts, was returned to the legislative
    calendar. Page 28934 Gratuity: Senate adopted S. Res. 396, authorizing payment of a gratuity to survivor of
    a deceased Senate employee. Page 28954 Senate Commission on Arts: Senate adopted with committee amendments (motion
    to reconsider tabled) S. Res. 382, to establish a Commission on Arts and Antiquities of the U.S. Senate. Pages
    28954-28955 Palmetto Bend, Texas: Senate passed without amendment and cleared for White House H.R. 5n7, authorizing
    funds to construct and operate the Palmetto Bend reclamation project, Texas. Pages 28972-28974 Higher Education:
    S. 376g, proposed Higher Education Amendments of 1g68, was cleared for White House when Senate adopted conference
    report thereon. Pages 28974-29002 Vocational Education: Senate considered, but did not complete action on, conference
    report on H.R. 18366, proposed Vocational Education Amendments of 1g68,'
