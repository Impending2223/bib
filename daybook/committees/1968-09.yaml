  text: 'Committee continued, in executive session, its hearings on H.R. 19908, fiscal 1¢9 appropriations for the
    foreign aid program, receiving testimony from James V. Siena, Deputy Under Secretary of the Army for International
    Affairs, on funds for the administration of the Ryukyu Islands; Jack Hood Vaughn, Director of the Peace Corps;
    Graham Martin, Special Assistant to the Secretary of State for Refugee and Migration Affairs, on funds for migration
    and refugee assistance; Joseph H. Meyers, Deputy Administrator, Social and Rehabilitation Service, De- William
    B. Buffum, of Maryland, Louis Stulberg, of New York, and Mrs. Harvey Picker, of New York, to be alternate U.S.
    representatives to the 23d session of the U.N. General Assembly; William Benton, of Connecticut, Alvin Christian
    Eurich, of Colorado, Katie Scofield Louchheim, of the D.C., James H. McCrocklin, of Texas, and Frederick Seitz,
    of Illinois, to be U.S. representatives to the 15th session of the General Conference of UNESCO; Robert H. B.
    Wade, of Maryland, Marietta Moody Brooks, of Texas, Elizabeth Ann Brown, of Oregon, Morton Keller, of Massachusetts,
    and George E. Taylor, of Washington, to be alternate U.S. representatives to the 15th session of the General
    Conference of UNESCO; and Wayland P. Moody, of Texas, Arnold M. Picker, of New York, and Thomas E. Robinson,
    of New Jersey, to be members of the U.S. Advisory Commission on International Educational and Cultural Affairs.
    Committee also approved the following treaties: Convention establishing a Customs Cooperation Council (Ex. G,
    goth Cong., second sess.); Astronaut Assistance and Return Agreement (Ex. J, goth Cong., second sess.); Convention
    on Transit Trade of Land-Locked States (Ex. I, goth Cong., second sess.); Partial Revision of the Geneva Radio
