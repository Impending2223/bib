  text: 'Subcommit-. tee on Federal Employees'' Compensation held hearings on S. 1710 and S. 2078, permitting injured
    Federal employees to receive services from physicians and qualified chiropractors, receiving testimony from
    Senators Burdick and Magnuson, the latter of whom submitted a statement; Grady V. Lake. and Joseph P. Adams,
    both of the International Chiropractors Association; Paul Badger, an attorney of Washington, D.C.; James E.
    Bunker and Dr. Benjamin Goldstein, both of the American Chiropractic Association; Dewey Anderson, Public Affairs
    Institute; Jerome J. Keating, National Associatiqn of Letter Carriers; and John O''Connor, United Federation
    of Postal Clerks. Several written statements were submitted for inclusion in the record. Hearings were adjourned
    subject to call. amendments H.R. no49, Federal Employees Salary Act of 1¢4, after which it issued the following
    statement: The committee raised the increases in grades 9, IO, n, and 12 to an even 3 percent. The House provision
    for increasing the compensation of postmasters at fourth-class offices was modified to reduce costs while at
    the same time granting liberal increases. Annual step increases for the first seven steps have been extended
    to all levels of the Postal Field Service. The salary increase for Members of Congress as provided in the House
    bill was adopted. The committee amended the executive salary schedule to provide for five levels of executive
    compensation. The offices and positions in all five levels are specified in the bill as amended by the Senate
    committee. The rates for the five levels are: $35,000; $30,000; $28,500; $27,000; and $26,ooo. In addition,
    the President has been given the authority to place 20 other officers at either level 4 or level 5. The House
    provisions for judicial salary increases were approved with minor changes, not affecting.Federal judges. The
    committee deleted title 5, the Udall amendment, from the Senate version of the bill. The effective date of the
    bill has been set for July r, 1964. The committee amended the House bill to provide for increases in the allowances
    for the staffs of former Presidents of the United States.'
