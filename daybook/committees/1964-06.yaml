  text: Committee, in executive session, ordered favorably reported H.R. 3496, extending until June 1, 1965, the
    Reorganization Act of 1949; H.R. 6237, authorizing grants for the reproduction of documentary source material
    significant to the history of the U.S.; S. 1509, authorizing reimbursement for moving expenses, etc., to certain
    owners of lands acquired by the U.S. (amended); S. 1232, amending Federal Property and Administrative Services
    Act to make title 3 applicable to procurement of property and nonpersonal services by executive agencies; S.
    2114, providing for periodic congressional review of Federal grantsin-aid to States and local governments (with
    amendments); and S. 2586, extending for 2 years period for which payment in lieu of taxes may be made with respect
    to certain land transferred by the RFC to other Government departments. Committee also approved resolutions
    providing for printing of additional copies of (1) "Catalog of Federal Aids to State and Local Governments,"
    (2) hearings on "Interagency Coordination in Environmental Hazards (Pesticides)-Part 1,"'' and (3) report of
    a study of U.S. foreign aid in IO Middle East and African countries.
