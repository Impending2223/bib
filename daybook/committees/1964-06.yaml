  text: 'Ordered reported favorably to the House the following bills: H.R. 2500 (amended), to equalize the treatment
    of Reserves and Regulars in the payment of per diem; H.R. 2501, to authorize the promotion of qualified Reserve
    officers of the Army and Air Force to fill vacancies in any organized unit; H.R. 2502 (amended), to provide
    for the remission or cancellation of an indebtedness due the United States by enlisted members of the National
    Guard; H.R. 2509, to authorize Reserve officers to combine service in more than one Reserve component in computing
    the 4 years of satisfactory Federal service necessary to qualify for uniform maintenance allowance; H.R. 6299,
    to authorize the production and sale of oil from the U miat field, naval petroleum reserve, for making fuel
    available for use in connection with exploration and development operations in nearby areas; H!R. 8676 (amended),
    to authorize the Department of Defense to ship automobiles owned by members of the armed services to and from
    Alaska by commercial motor carrier via highways and the Alaska ferry system; H.R. 9021, to authorize the conveyance
    of two tracts of land situated iri Salt Lake City, Utah, to the Board of Education of Salt Lake City; H.R. 9634
    (amended), to authorize the Secretary of Defense to lend certain Navy, Army, and Air Force equipment and provide
    certain services to the Girl Scouts of America for the 1¢5 International Senior Girl Scout roundup encampment;
    H.R. rn328 (amended), to validate erroneous payments of uniform allowances to certain Reserve officers ordered
    to active duty; H.R. noo4, to authorize the sale, without regard to the 6-month waiting period prescribed, of
    zinc proposed to be disposed of pursuant to the Strategic and Critical Materials Stock Piling Act; H.R. n235,
    to authorize the disposal, without regard to the prescribed 6-month waiting period, of approximately I I million
    pounds of molybdenum from the national stockpile; H.R. 11257 (amended), to authorize the sale, without regard
    to the 6-month waiting period prescribed, of lead proposed to be disposed of pursuant to the Strategic and Critical
    Materials Stock Piling Act; H.R. n626 (amended), to authorize the payment of expenses incident to the evacuation
    of dependents of military personnel from Panama and Cyprus; and H. Con. Res. 300, to authorize the disposal
    of approximately 98,000 long tons of pig tin from the national stockpile; to the Committee on Armed Services.
    Also considered H.R. ro744, to make permanent the authority for flight instruction for members of Reserve Officers''
    Training Corps. No final action was taken.'
