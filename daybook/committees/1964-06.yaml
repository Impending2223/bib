  heading: CX-DD--17 INDIAN AFFAIRS-IRRIGATION-RECLAMATION
  bills:
  - S. 136
  - H.R. 8334
  - H.R. 7215
  - H.R. 1003
  - S.J. Res. 49
  - H.R. 3672
  exec: true
  text: 'Ordered reported favorably to the House the following bills: R.R. 6151, amended, to increase the appropriation
    authorization for completion of the construction of the irrigation and power systems of the Flathead Indian
    irrigation project, Montana; H.R. rn973, to provide for the disposition of judgment funds on deposit to the
    credit of the Lower Pend D''Oreille or Kalispel Tribe of Indians; H.R. nn8, to provide for the disposition of
    funds from judgments in favor of the Nehalem Band of the Tillamook Indians and the Tillamook Band of the Tillamook
    Indians; S. 136, to place in trust status certain lands on the Rosebud Sioux Reservation in South Dakota; H.R.
    8334, amended, to authorize the exchange of lands within the Salt River Pima-Maricopa Indian Reservation; and
    H.R. 7215, amended, to authorize the Secretary of the Interior to convey certain lands to the U.S. in trust
    for the Citizen Band of Potawatomi Indians of Oklahoma and to convey certain other lands to the U.S. in trust
    for the Absentee-Shawnee Tribe of Indians of Oklahoma. Following the full committee meeting the Subcommittee
    on Irrigation and Reclamation met in executive session and ordered reported favorably to the full committee
    H.R. 1003, amended, to make certain provisions in connection with the construction of the Garrison diversion
    unit, Missouri River Basin project; S.J. Res. 49, amended, authorizing the Secretary of the Interior to carry
    out a continuing program to reduce nonbeneficial consumptive use of water in the Pecos River Basin, N. Mex.
    and Tex.; and H.R. 3672, amended, to provide for the construction, operation, and maintenance of the Savery-Pot
    Hook, Bostwick Park, and Fruitland Mesa participating reclamation projects under the Colorado River Storage
    Project Act..'
  page: D257
  pdf: 255
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=255
