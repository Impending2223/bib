    an Assistant Secretary of the Treasury; Andrew M. Bacon, of Louisiana, to be comptroller of customs, with headquarters
    at New Orleans; John A. Vaccaro, of New York, to be surveyor of customs, with headquarters at New York City;
    and the following nominees to be collectors of customs: Samuel S. Wyatt, of Tennessee, with headquarters at
    Memphis; Sam D. W. Low, of Texas, with headquarters at Galveston; Craig Pottinger, of Arizona, with headquarters
    at Nogales; Minnie M. Zoller, of Texas, with headquarters at Port Arthur; Charles H. Kazen, of Texas, with headquarters
    at Laredo; Eugene V. Atkinson, of Pennsylvania, with headquarters at Pittsburgh; and William W. Knight, of Alaska,
    with headquarters at Juneau. The committee, by a vote of 13 yeas, agreed to hold prompt hearings on medical
    care for the aged as soon as the bill is received from the House. By a vote of ro nays to 7 yeas, committee
    rejected a motion that hearings be held on S. 909 (which incorporates the President''s recommendations on this
    matter) not later than April r, regardless of whether the House had acted on the identical bill now pending
    in the House Committee on Ways and Means.'
