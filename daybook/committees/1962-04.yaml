    the Library of Congress; (2) That it had approved ~ recommendation made by the Architect of the Capitol relative
    to the preservation of a small building of.the U.S. Botanic Garden on square 576; (3) That the Architect of
    the Capitol submitted a report on the placement of statues in the Statuary Hall collection; (4) That it had
    accepted the recommendation of the Librarian of Congress that legislation be introduced to raise the limit of
    the Permanent Loan Fund of the Library''s Trust Fund Board; and (5) That the Librarian of Congress had made
    a presentation relative to (a) courses of study in library. science, (b) the urgent need for additional, space
    for the Library''s facilities, (c) the need for adjustment in the salaries of certain Library personnel, (d)
    the current efforts to assure the hiring and promotion of Library personnel solely on the basis of quality,
    and (e) the projected financial difficulty in the issuance of the monthly index of Russian accessions. Committee
    also announced that it had elected Senator Jordan and Representative Burleson as its chairman and vice chairman,
    respectively, and Gordon F. Harri son and Julian P. Langston as its chief clerk and assistant chief clerk, respectively.'
