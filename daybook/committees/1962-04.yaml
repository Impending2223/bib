  text: 'On Friday, April 13, committee, in executive session, ordered favorably reported with amendments S. 2786,
    proposed Food and Agriculture Act of I962. A summary of the bill, as approved by the committee, is as follows:
    Land Use Adjustment I. Permanent extension of the agricultural conservation pro~ gram on a national basis. -
    2. Payments to producers under the Soil Conservation and Domestic Allotment Act under long~term agreements (not
    to exceed I5 years) to conserve and develop soil, water, forest, wildlife, and recreation resources. Total payments
    are re~ stricted to $Io million annually. 3 Development of more economic use of lands, fish and wildlife projects,
    and assistance t<? local public authorities to provide public recreation under the Bankhead~Jones Farm Tenant
    Act. 4 Loans under the Bankhead~J ones Act to State and local public agencies to carry out plans of land conservation
    and land utilization, such loans to be repaid in 30 years. -5 Payment of h~f the cost of ''fish, wildlife, and
    recreation i.rp.provements involving land, easements, rights~of-way, and minimum basic facilities under the
    Watershed Act. 6. Farmers Home Administration loans for recreation facili~ ties. Public Law 480 1. Authori~e
    long-term supply contracts with private trade. 2. Makes permissive rather than mandatory the authority to make
    agreements with other exporting nations to participate in long~term supply programs. - Feed Grain Program,.
    Extends for I year (through I9~3) the ~pecial feed. grain pro gram. Wheat Program Authorizes producers by a
    majority vote to choose between~ (a) a 2-year extension (through I964) of the special wheat program; or (b)
    a marketing certificate plan under which noncertifi~ cated wheat would be supported at the feed value with corn
    and certificated wheat would be supported at between 65 and 90 percent of parity. Certificates would cover all
    wheat consumed domestically for food and such part of the exports as determined by the Secretary would carry
    out the price and income objectives of the bill. Rural Electrification Administratt"on Provides revolving fund
    for REA loans. Industrial Uses of Agricultural Products Establishes an Agricultural Research and Industrial
    Use Ad~ ministration within the Department of,Agriculture to carry out an expanded research program on industrial
    uses of agricultural commodities.'
