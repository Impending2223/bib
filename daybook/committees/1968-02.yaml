  text: 'Subcommittee on Government Procurement continued its hearings to receive testimony from officials of several
    Government agencies on various procurement problems affecting small business. Witnesses heard were Aaron J.
    Racusin, Office of Assistant Secretary of the Air Force for Installations and Logistics; Col. Abraham J. Dreiseszun,
    Air Force Logistics Command; Maj. Gen. Fred J. Higgins, Air Force Systems Command; Robert T. Griffin, Assistant
    Administrator, GSA; George J. Vecchietti, Director of Procurement, National Aeronautics and Space Administration;
    Joseph L. Smith, Atomic Energy Commission; Robert F. Keller, General Counsel, GAO; and Irving Maness, Associate
    Administrator, Small Business Administration, all of whom were accompanied by their associates. Hearings were
    adjourned subject to call. Government Operations and ordered printed as a House document (H. Doc. 249). Page
    2421 Export-Import Bank Act: By a record vote of 375 yeas to 19 nays the House passed H.R. 6649, regarding extension
    of the Export-Import Bank Act. Subsequently vacated this passage and passed S. u55 in lieu after amending the
    bill to contain the Housepassed language. Rejected a recommittal motion designed to reduce by $1 billion the
    Export-Import Bank lending authority by a record vote of 164 yeas to 232 nays. Adopted the Patman amendment
    in the nature of a substitute, as amended. Rejected an amendment designed to improve international trade practices;
    and an amendment identical to the recommittal motion. Pages 2421-2433 "LULAC Week": Adopted H.J. Res. 947, authorizing
    the President to proclaim the period February 11 through 17, 1968, as "LULAC Week." Page 2433 Adjournment: Adjourned
    at 4:50 p.m.'
