  text: Subcommittee on Foreign Aid Expenditures continued its hearings on the population crisis, and on S. 1676,
    to create within the Departments of State and HEW offices for population problems. Testimony was received from
    William S. Gaud, Administrator, Herbert J. Waters, Assistant Administrator for War on Hunger, Maurice Williams,
    Assistant Administrator for Near East and South Asia, and Dr. R. T. Ravenholt, Office of War on Hunger, all
    of the Agency for International Development; Philander P. Claxton, Special Assistant to the Secretary of State
    for Population Matters; and Brent K. Ashabranner, Deputy Director, and Dr. Martha Leas, both of the Peace Corps.
    Hearings were recessed subject to.call. mony from Senator Bennett; Representative Lloyd; Jake Garn, Commissioner,
    Salt Lake City; and W. C. Haµge, Salt Lake City Metropolitan Water District; Norwalk River Basin, Conn., with
    testimony from Representative Irwin; and Aquilla Creek Watershed, Texas, and Texas City, with testimony from
    Senator Yarborough. Committee also received testimony from Brig. Gen. H. G. Woodbury, Jr., Director of Civil
    Works, Office of the Chief of Army Engineers, who directed his remarks to funds for the above-listed items and
    other projects. Hearings continue on Wednesday, February 7.
  page: D28
