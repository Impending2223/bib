  next: '1968-02-21'
  text: 'Subcommittee on Roads continued its hearings on S. 2658, to raise the allowable limits of motor vehicle
    weights and width limitations now under Federal control of the Interstate Highway System, receiving-testimony
    from John O. Morton, president, American Association of State Highway Officials, accompanied by his associates;
    William W. Owen, City Transit Co., Dayton, Ohio, representing the American Transit Association; George F. Kachlein,
    Jr., American Automobile Association; and Matt Triggs, American Farm Bureau Federation. Hearings continue tomorrow.
    Private Calendar: Passed the following bills on the call of the Private Calendar: Cleared for the White House:
    S. 269. Sent to the Senate without amendment: H.R. 1879. Sent to the Senate, amended: S. 10, 1093, and 1821
    and H.R. 10851. Passed over without prejudice: H.R. 2281, 2282, 4058, 4386,4936,7210,10327, 11381,12119,S.155,233,321,503,
    1040, 1580, and H. Res. 991. Recommitted: H.R. 2288 and 8091. Pages 3484-3487 Supplemental Appropriation: By
    a voice vote the House passed H.R. 15399, the Urgent Supplemental Appropriation Act. Pages 3488-3493 Visitor
    Center: Disagreed to Senate amendments to H.R. 12003, the National Visitor Center Act; and appointed as conferees
    Representatives Gray, Jones of Alabama, Kluczynski, Blatnik, Wright, Grover, Schwengel, and Cramer. 1Page 3495
    Gold Cover: Completed general debate on H.R. 14743, to eliminate the reserve requirements of Federal Reserve
    notes and for U.S. notes and Treasury notes of 1890 (removal of gold cover). Aftet reading the first section
    of the bill the committee arose. H. Res. 1068, the rule under which the legislation was considered was adopted
    earlier by a voice vote. Pages 3493-3516 Referral: One Senate-passed measure was referred to the appropriate
    committee. Page 3574 Adjournment: Adjourned at 5:05 p.m.'
