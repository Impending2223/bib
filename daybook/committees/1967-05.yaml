  text: 'On Friday, May 12, the Subcommittee on Indian Affairs met in open session and approved for full committee
    action the following bills: H.R. 678 (amended), to provide for the disposition of funds appropriated to pay
    a judgment in favor of the Upper and Lower Chehalis Tribes of Indians in Claims Commission Docket 237; H.R.
    4919, to amend the act of August 6, 1955, to authorize longer term leases of Indian lands on the Hualapai Reservation
    in Arizona; H.R. 2154, to provide long-term leasing for the Gila River Indian Reservation; and H.R. 536, to
    provide that the U.S. shall hold certain Chilocco Indian school lands at Chilocco, Okla., in trust for the Cherokee
    Nation upon payment by the Cherokee Nation of $3.75 per acre to the Federal Government. Prior to that action,
    the subcommittee heard further testimony on the bills from Representative Steiger of Arizona; Harry R. Anderson,
    Assistant Secretary of the Interior for Public Land Management; and a public witness.'
