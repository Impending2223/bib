    name: Andrew J. Biemiller
    office: legislative director
  text: 'Subcommittee on Labor concluded its hearings on S.J. Res. 8I, providing for settlement of the labor dispute
    between certain carriers by railroad and certain of their employees, after receiving testimony from Andrew J.
    Biemiller, legislative director, accompanied by Thomas Harris, associate general counsel, both of the AFL-CIO.
    It was announced that the subcommittee would meet in executive session on Monday, June 5, to consider this bill.
    Bills Reported: Reports were filed as follows: H.R. 678, regarding judgment in favor of the Upper and Lower
    Chehalis Tribes of Indians, amended (H. Rept. 298); H.R. Io226, to provide additional free letter mail and air
    transportation mailing privileges for certain members of the U.S. Armed Forces (H. Rept. 299); Disposition of
    executive papers (H. Rept. 300); Conference report on H.R. 948I, making supplemental appropriations for the
    fiscal year ending June 30, I967 (H. Rept. 30I); and Conference report on H.R. 6950, to restore the in vestment
    credit and the allowance of accelerated depreciation in the case of certain real property (H. Rept. 302). Page
    13960 Elementary-Secondary Education: By a record vote of 294 yeas to I22 nays the House passed H.R. 78I9, the
    Elementary and Secondary Education Amendments of I967. Rejected a motion to recommit the bill with instructions
    to hold further hearings, by a record vote of I8o yeas to 236 nays. In addition to the committee substitute
    amendment the House adopted amendments to provide uniform guidelines, within statutory authority, on desegregation
    for all so States; regarding deferment of funds in desegregation matters without hearings; regarding expenditures
    per pupil in the States (by a record vote 222 yeas to I94 nays); the Green amendment to title III, regarding
    supplementary educational centers and services (by a record vote of 230 yeas to I85 nays); to strike language
    regarding the Teacher Corps; and to strengthen State departments of ed11cation. Rejected amendments regarding
    block grants to the States (the Quie amendment); grants to private schools; funds to help low-income families;
    additional funds for special education for the children of migratory workers; teacher -intern training programs
    at universities; grants for State administration; and prohibition of Federal control of education. Pages 13814-13899
    Adjournment: Adjourned at I:49 p.m.'
