  exec: true
  text: 'Met in executive session and continued on H.R. 57IO, to amend the Social Security Act to provide an increase
    in benefits under the old-age, survivors, ~nd disability insurance system. No final action was taken. Thursday,
    ]une l, 1967 Bill Reported: Report was made as follows: H.R. 2508, providing for the reapportionment of congressional
    districts, with amendments (S. Rept. 291). Page 14407 Bill Referred: H.R. I0345, fiscal I¢8 appropriations for:
    the Departments of State, Justice, and Commerce, the Judiciary, and related agencies, was referred to Committee
    on Appropriations. Page 14''104 President''s Message-Reorganization Plan No. 3 (D.C.): President transmitted
    message with his legislative recommendations to provide a better government for the citizens of the national
    Capital-referred to Committee on Government Operations. Pages 14481-14482 Kentucky Anniversary: Senate concurred
    in H. Con. Res. 204, marking the I75th anniversary of the admission of Kentucky to the Union. This completed
    legislative action on the resolution. Pages 14426-14427 Authority To Report: Committee on Government Operations
    was granted extension of time until June 30, I967, to file reports entitled "Investigation Into Small Business
    Companies" and "Investigation Into FHA Multiple Dwelling Projects." Page 14407 Congressional Reapportionment:
    Authority was granted for filing of minority and individual views on H.R. 2508, providing for the reapportionment
    of congressional districts. Page 14407 Veterans: Senate concurred (with an amendment) in House amendments to
    S. I6, to provide additional readjustment assistance to veterans who have served in the military during the
    Vietnam era. This amendment to the House amendments was in the nature of a substitute by Senator Long (Louisiana),
    and prior to its adoption was modified by acceptance of a Javits amendment (for himself and Senators Randolph
    and Yarborough) and by acceptance of a Gruening amendment. Motion to reconsider adoption of the Long substitute
    amendment, as modified, was tabled. Senate insisted on its amendment, asked for conference with House, and appointed
    as conferees Senators Long (Louisiana), Smathers, Randolph, Yarborough, Williams (Delaware), and Dominick. Pages
    14454-14464 Silver Certificates: Senate made its unfinished business S. I352, authorizing adjustments in the
    amount of outstanding silver certificates. Pages 14464-14465 Adjournment: Adjourned at 3:52. p.m.'
