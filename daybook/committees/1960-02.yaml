  text: The Internal Security Subcommittee held hearings to question Gus Hall, general secretary of the Communist
    Party of the U.S.A., New York. The witness refused, on grounds of possible selfincrimination (fifth amendment),
    to answer many of the questions of the subcommittee. Testimony was also received from Leonard Patterson, a New
    York cab driver, and a former Communist who attended the Len.in school of subversive methods in Moscow with
    Mr.Hall. The subcommittee issued a subpena calling for the appearance at 9:30 a.m. tomorrow morning of Benjamin
    Davis, national secretary of the cPUSA, resulting from his interruption of today's hearings.
