  - H.R. 5270
  - S.J. Res. 150
  witnesses:
  - as: Mr. Gilbert Stamm
    title: Mr.
    name: Gilbert Stamm
  - as: Mr. Donald Mitchell
    title: Mr.
    name: Donald Mitchell
  text: 'The Subcommittee on Irrigation and Reclamation ordered favorably reported to the full committee S. 68,
    to provide for continued delivery of water under the reclamation laws upon death of husband or wife; S. 1218,
    authorizing the Department of the Interior to acquire or accept land for Geological Survey activities in gaging
    streams and underground water resources; S. 1732, to approve repayment contract wi~ Conejos Water Conservancy
    District, Colorado;. H.R. 5270 (S. 1202), to restore to the Metropolitan Water District of Salt Lake City excess
    land previously deeded to the U.S.; and S.J. Res. 150, permitting continued delivery of water to lands in the
    Third Division, Riverton Federal reclamation project, Wyoming. Prior to this action, subcommittee heard testimony
    on these bills as follows: On S. 68 and S. 1732-Gilbert Stamm and Donald Mitchel, both of the Bureau of Reclamation;
    on S. 1218-Philip E. Lamoreaux, Geological Survey; and on HR. 5270-Messrs. Stamm and Mitchel; and Grant Midgley,
    representing Senator Moss. Also approved was a subcommittee resolution approving a contract for minor construction
    work on the Talent Division, Rogue River project, Oregon, on which testimony was received from Messrs. Gilbert
    Stamm and Donald Mitchell, both of the Bureau of Reclamation.'
  page: D39
  pdf: 37
