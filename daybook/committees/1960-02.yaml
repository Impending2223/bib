  text: 'Committee began a series of hearings on the President''s economic report, with testimony on the economic
    outlook for 1960 from the following panel of witnesses: Louis Paradiso, Office of Business Economics, Department
    of Commerce, who discussed the outlook for Federal, State, and local government expenditures; Martin Gainsbrugh,
    National Industrial Conference Board, who discussed the outlook for inventories, plants, and equipment; George
    Cline Smith, F. W. Dodge Corp., who discussed the outlook for housing construction and consumer expenditures;
    Peter Henle, AFL-CIO, who discussed the outlook for labor force and employment; Roy Reierson, Bankers Trust
    Co., who discussed the outlook for demani:l and supply of funds and interest rates; and George Brandow, Pennsylvania
    State University, who discussed the outlook for agriculture. Hearings continue tomorrow.'
