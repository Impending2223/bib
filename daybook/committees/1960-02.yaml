  text: Committee, in executive session, ordered. favorably reported the North American Regional Broadcasting Agreement,
    and final protocol thereto (Ex. A, 82d Cong., 1st sess.), and an agreement between the U.S. and Mexico concerning
    radio broadcasting in the standard broadcast band (Ex. G, 85th Cong., 1st sess.). The committee received testimony
    from Senators Kefauver and Cooper in regard to S. Con. Res. 17, favoring a convention of delegates from Atlantic
    democracies looking to greater cooperation and unity of pur-. pose. Committee announced that it would consider
    an amended version of this resolution at its next regular meeting. Testimony was also received from George V.
    Allen, Director, USIA, on an agreement for facilitating the international circulation of visual and auditory
    materials of an educational, scientific, and cultural character (Ex. V, 81st Cong., 2d sess.). Testimony was
    also received from John J. Grady, of Illinois, in behalf of his own nomination to be Deputy Director for Management
    of the ICA.
