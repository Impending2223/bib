  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following measures: S. 68, to provide for
    continued delivery of water under the reclamation laws upon death of husband or wife (amended); H.R. 4483, authorizing
    the Department of the Interior to acquire or accept land for Geological Survey activities in gaging streams
    and underground water resources; H.R. 6516, to approve repayment contract with Conejos Water Conservancy District,
    Colorado; H.R. 5270, to restore to the Metropolitan Water District of Salt Lake City excess land previously
    deeded to the U.S.; S.J. Res. 150, to permit continued delivery of water to lands in the third division, Riverton
    Federal reclamation project, Wyoming; H.R. 24, relating to certain U.S. lands of the Fort McDermitt Indian Reservation,
    Nev.; H.R. 6136, authorizing sale of certain tribal land of the Lac du Flamb.eau Band of Lake Superior Chippewa
    Indians, Wisconsin; S. 2307, to set aside permanently certain land in McKinley County, N. Mex., for the use
    of Navajo Indians (amended); S. 2456, relative to the leasing of certain lands owned by the Navajo and Hopi
    Indians (amended);- S. 2877, authorizing reconveyance of tribally owned land by the Muckleshoot Indian Tribe
    of the State of Washington to the original allottees; S.'' 2878, to adjust Indian and non-Indian land-use areas
    in the vicinity of the Navajo Indian Reservation, N. Mex. (amended); S. 2804, to donate to the Keweenaw Bay
    Indian Tribe, Michigan, a certain tract of Federal land; anq S. 2962, to grant 81 acres of public domain to
    the Cocopah Indians in Arizona. The committee also approved a committee resolution approving a contract for
    minor construction work on the Talent division, Rogue River project, Oregon. The committee also approved a letter
    from the chairman to the Secretary of the Interior relating to a contract for a saline water plant in the Virgin
    Islands.'
