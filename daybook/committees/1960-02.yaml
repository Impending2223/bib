  heading: WORLD WAR II CLAIMS PAYMENTS
  bills:
  - H.R. 2485
  text: 'Ordered favorably reported to the House H.R. 2485 (amended), to amend the War Claims Act of 1948, as ~mended,
    to provide compensation for certain World War II losses. The bill, as approved by the committee, provides for
    payment of four general categories of claims arising out of military operations during World War II, ~hich have
    not been provided for in other legislation or treaties. The bill does not provide for the return of any vested
    property. Payments will be made to claimants under the bill out of the War Claims Fund (which consists of proceeds
    resulting from the sale of vested property), and not out of appropriations. The general categories of claims
    authorized are set forth on page 18, line 12, through page 22, line 16, of Committee Print No. 3, and are as
    follows: (r) Damage to or destruction of property located in certain European countries and in areas attacked
    by the Japanese resulting from military operations or special war measures against property (claims for losses
    arising in the Philippines are allowable where the claimant received no compensation under prior legislation);
    (2) Damage to or destruction of ships and ship cargoes as a result of military action; (3) Net losses of insurers
    under war-risk insurance contracts covering ships; and (4) Death or disability, and property losses, suffered
    by civilian passengers ~n vessels attacked on the high seas before December n, 1941.'
  page: D52
  pdf: 50
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=50
