  text: 'Committee continued its hearings to receive testimony from Members of Congress on various proposed changes
    in the organization of the Congress. Witnesses heard were Representatives Younger, McClory, Rosenthal, and Monagan.
    Hearings continue tomorrow. Bill Referred: H.R. 7997, making appropriations for independent offices for fiscal
    year nfi6; was referred to Committee on Appropriations. Page 10302 Pre~ident''s MessagC7-Federal Salaries: President
    transmitted message containing- his legislative recommendations for the following adjustments in Federal pay:
    An average increase of 3 percent for Federal civilian salaries; an average increase of 4.8 percent for uniformed
    personnel, except enlisted personnel with less than 2 years'' service; and a 2.7-percent increase ~n base pay
    of enlisted personnel with less than 2 years of service-referred to Committee on Post Office and Civil Service.
    Pages 10300-10301 Voting Rights: Senate worked on S. 1564, to enforce the 15th amendment of the Constitution
    of the u.s. (right to vote), rejecting, by 28 yeas to 62 nays (motion to reconsider tabled), Ervin amendments
    en bloc (to Mansfield-Dirksen amendment in nature of a substitute for the amended committee substitute for the
    bill). Pending at adjournment were Sparkman amendments en bloc to provide that list of eligible voters shall
    be made up of those persons the examiner finds to have the qualifications prescribed by State law rather than
    those having such qualifications not inconsistent with the Constitution and the laws of the U.S. By unanimous
    con~nt, it was agreed that vote will be taken on the aboye-described Sparkman amendments at 2 p;in. Thursday,
    May 13, the time between 12:30 and 2 p.m. to be equally divided, and with the proviso that there be a morning
    hour of not more than 30 minut.es after chaplain''s prayer. Pages 10352-10359, 10362-10365, 10370-10374 Nominations:
    One civilian nomination and one postmaster withdrawal were received. Page 10399 Adjournment: Adjourned at 5:39
    p.m.'
