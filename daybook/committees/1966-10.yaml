  text: 'Committee, in executive session, ordered favorably reported H.R. 15748, authorizing a 30-day leave and
    free round-trip transportation to the U.S. or to another place of his choice for members of the military who
    agree to extend their service in Vietnam for 6 months (amended); H.R. 17119, to permit members of the Armed
    Forces to be assigned to the Environmental Science Services Administration, Department of Commerce; H.R. 266,
    permitting certain military personnel to extend the period in which they are entitled to transportation of dependents
    and effects;. H.R. 5297, requiring the military services to inform by letter reservists who complete 20 years
    of satisfactory Federal service; S. 2444, to authorize disposal of the Government-owned Alaska Communications
    System (amended); and on original bill (S. 3887) authorizing appointment of four persons from friendly foreign
    countries to each of the military academies. Gommittee also approved for reporting the nomination of Vice Adm.
    Rufus L. Tayl~r, to be Deputy Director of Central Intelligence; and 8,315 nominations in the Army, Navy, and
    Air Force, included in which is the nomination of Maj. Gen. Ferdinand T. Unger, for appointment to the rank
    of lieutenant general in connection with his assignment as High Commissioner of the Ryukyu Islands. Pr~or to
    this action, in open "session, testimony was received as follows: Brig. Ge:n~ William W. Berg, Deputy Assistant
    Secretary of Defense for Military Personnel Policy, who testified with regard to H.R. 15748; Col. Eugene C.
    St; Clair, Office of the Deputy Chief of Staff, Air For~e: who directed his remarks to H.R. 17119; Col. Alfred
    R. Grimm, Directorate of Personnel Planning, Air Force, who discussed the provisions of H.R. 266; and Capt.
    James W. Darroch, Deputy Assistant CNO for Naval Reserves, and John H. Pratt, Judge Advocate of the Marine Corps
    Reserve Officers Association, both of whom directed their remarks to H.R. 5297. Admiral Taylor was present to
    testify and answer questions in behalf of his nomination.'
