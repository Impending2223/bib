  text: 'Committee held he~ings in the form of an economic symposium on the occasion of the 20th anniversary of
    enactment of the Employment Act of 1946. Witnesses heard were Roy Blough, professor of international business,
    Columbia University; Henry C. Wallich, professor of economics, Yale University; Leon H. Keyserling, president,
    Conference on Economic Progress; Arthur F. Burns, president, National Bureau of Economic Research, Inc.; Walter
    W. Heller, professor of economics, University of Minnesota; Raymond J. Saulnier, professor of economics, Barnard
    College; Kermit Gordon, vice president, the Brookings Institution; Paul W. McCracken, school of business administration,
    University of Michigan; and Neil H. Jacoby, dean of the graduate school of business administration, University
    of California, all of whom were former members of the Council of Economic Advisers; Bertram M. Gross, professor
    of political science, Syracuse University, and Gerhard Colm, both of whom are for~ mer staff members of the
    Council of Economic Advisers; and John W. Lehman, regional director, Bureau of Labor Statistics, Cleveland,
    and a former member of the staff of the Joint Economic Committee. Bill Referred: H.R. 12752, proposed Tax Adjustment
    Act of 1966, was referred to Committee on Finance. Page 3925 Wind River: Senate concurred in House amendments
    to S.J. Res. 9, to cancel unpaid reimbursable construction costs of the Wind River irrigation project, Wyoming,
    chargeable against certain non-Indian lands, Clearing bill for the President. Pages 3983-3984 Military Procurement:.
    Senate continued debate of S. 2791, fiscal 1966 supplemental authorizations for military procurement, pending
    question at adjournment being adoption of committee amendment (in the nature of a substitute for the bill).
    Pages 3956-4000 Confirmations: The following nominations were con-.firmed: Lee C. White, of Nebraska, to be
    member of FPC; and numerous nominations in the Environmental Science Services Administration, and in the Coast
    Guard. Page 4000 Adjournment: Adjourned at 6:20 p.m.'
