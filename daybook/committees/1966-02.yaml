  heading: TAX ADJUSTMENT HEARINGS
  bills:
  - H.R. 12752
  text: 'Committee issued the following press release: Russell B. Long, chairman of the Committee on Finance, announced
    today that the committee would begin hearings on Friday, February 25, 1966, with respect to H.R. 12752, the
    Tax Adjustment Act of 1966. The Secretary of the Treasury, the Honorable Henry H. Fowler, is to be the first
    witness. Persons desiring to be heard on the proposals contained in H.R. 12752 should submit requests to Tom
    Vail, chief counsel, Committee on Finance, not later than Wednesday, February 2~, 1966. In order to facilitate
    committee consideration of this important legislation, those with similar interests are. urged to designate
    a single spokesman to present their testimony. Witnesses who are scheduled to appear are further urged to make
    their statements as brief as possible to conserve the time of the committee. In order to further conserve the
    time of the committee, the committee will be pleased to receive from any interested person a written statement
    for inclusion in the printed record of the hearings in lieu of a personal appearance. These statements will
    be given the same full consideration as though they had been delivered orally. All statements should include
    a summary sheet and subject headings. The chairman further announced that the committee would proceed to executive
    consideration of the President''s tax proposals promptly upon completion of the hearings.'
  page: D57
  pdf: 55
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1966-pt23/pdf/GPO-CRECB-1966-pt23-1.pdf#page=55
