  text: Subcommittee on Research, Development, and Radiation resumed its hearings to receive testimony concerning
    programs to solve problems of radiation exposure of uranium miners, receiving testimony from Duncan Holaday
    and Dr. Victor Archer, both of the OccupationaL Health Field Station, Public Health Service, Salt Lake City;
    Dr. Gena Saccomanno, St. Maris Hospital, Grand Junction, Colo.; and Dr. Malcolm Peterson, Committee for Environmental
    Information. In an afternoon session, subcommittee received testimony from a panel of witnesses consisting of
    Duncan Holaday, Dr. Victor Archer, Dr. Gena Saccomanno; and Dr. Gordon M. Dunning, Division of Operational Safety,
    AEC; Dr. Robley Evans, Department of Physics, MIT; Dr. K. Z. Morgan and Dr. W. S. Snyder, both of Oak Ridge
    National Laboratory; Herbert Parker, Battelle Memorial Institute, Richland, Wash.; John J. Sheehan, United Steel
    Workers of America; L. W. Swent, American Mining Congress; George Taylor, Division of Research, AFL-Cl 0; and
    Dr. Paul C. Tompkins, Federal Radiation Council. Hearings continue tomorrow.
