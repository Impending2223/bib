  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following bills: S. 1251, to make certain
    reclamation project expenses nonreimbursable (amended); S. 862, forbidding Federal participation in irrigation
    projects under the Small Reclamation Projects Act until 30 days after project''s approval has been submitted
    to Congress; S. 16og, to amend the Small Reclamation Projects Act so as to include any complete water development
    for irrigation, municipal, or industrial use; S. 285, relating to long-term leasing of Indian lands (amended);
    S. I 173, declaring that certain public land is held by the U.S. in trust for the Cheyenne and Arapaho Tribes
    of Oklahoma (amended); S. 528, to place in trust status certain lands on the Wind River Reservation, Wyo.; S.
    306, to increase authorizations for Indian adult vocational education (amended); S. 491, to determine the rights
    of Navajo and Ute Indians to certain lands in New Mexico (amended); S. 1701, declaring that the U.S. holds in
    trust for the Indians of the Battle Mountain Colony certain lands to be used for cemetery purposes; H.R. 678,
    providing for disposition of judgment funds in favor of the Upper and Lower Chehalis Tribes of Indians (amended);
    H.R. 2532, providing for disposition of judgment furids of the Ottawa Tribe of Oklahoma; and H.R. 363I, providing
    for dedication of certain streets on the Agua Caliente Indian Reservation; and S. I I9, to reserve certain public
    lands for a National Wild Rivers System.'
