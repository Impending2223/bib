    $25,ooo for expenses of Committee on Labor and Public Welfare; H. Con. Res. 346, to print as a House document
    pamphlet entitled "Our Flag"; H. Con. Res. 348, to print for House Veterans'' Committee "Summary of Veterans''
    Legislation Reported, Ninetieth Congress, First Session"; H. Con. Res. 369, authorizing printing of several
    documents of the Select Committee on Small Business of the House; S. Res. 140, to print as a Senate document
    annual report of National Forest Reservation Commission; H. Con. Res. 253, to print as a House document the
    Southeast Asia briefing map prepared by the Army Map Service (approved with certain reservations); and S. 1581,
    to increase participation of service personnel in Federal elections (amended). Committee also approved a recommendation
    for the use of a legislative call system for attack and major disaster warnings, and took up other pending items
    of business.'
