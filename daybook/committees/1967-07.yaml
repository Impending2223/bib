  text: On Friday, July 28, Subcommittee on National Parks and Recreation held a hearing on H.R. 1340, and related
    bills, to authorize the Secretary of the Interior to accept donations of land for, and to construct, administer,
    and maintain an extension of the Blue Ridge Parkway in the States of North Carolina and Georgia. Testimony was
    heard from Representatives Landrum and Davis of Georgia; Stanley A. Cain, Assistant Secretary of Interior for
    Fish and Wildlife and Parks; and public witnesses.
