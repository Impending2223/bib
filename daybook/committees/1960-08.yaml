  text: 'Ordered favorably reported to the House the following measures: S. 1105, to improve the land tenure patterns
    on the Fort Belknap Reservation; S. 1889, to authorize the transfer of three units of the Fort Belknap Indian
    irrigation project to the landowners within the project; H.R. 8712 (amended), to authorize longer term leases
    of Indian lands on the Agua Caliente (Palm Springs) Reservation and the Seminole Reservations in Florida; S.
    2757 (amended), to permit any State to acquire certain public lands for recreational use; S. 2914, to authorize
    the purchase and exchange of land and interest therein on the Blue Ridge and Natchez Trace Parkways; S. 3267
    (amended), relating to the disposition of certain public lands in Alaska; S. 3399, to authorize the exchange
    of certain property within the Shenandoah National Park in the State of Virginia; S. 1670 (amended), to provide
    for the granting of mineral rights in certain homestead lands in the State of Alaska; and S. 1663, directing
    the Secretary of the Interior to convey certain property in the State of North Dakota to the city of Bismarck,
    N. Dak. Tabled S. 1565, to amend the act entitled "An act relative to employment for certain adult Indians on
    or near Indian reservations," approved August 3, 1956. The compiittee will meet again Tuesday, August 30.'
  page: D479
