  text: Committee, in executive session, ordered favorably reported the nominations of Frederic P. Bartlett, of
    New York, to be Ambassador to Malagasy; Fraser Wilkins, of Nebraska, to be Ambassador to Cyprus; Henry S. Villard,
    of New York, to be Ambassador to the Federation of Mali; Christian M. Ravndal, of Iowa, to be Ambassador to
    Czechoslovakia; Edwin McCammon Martin, of Ohio, to be Assistant Secretary of State for Economic Affairs; Roy
    R. Rubottom, Jr., of Texas, to be Ambassador to Argentina; Robert Newbegin, of New Hampshire, to be Ambassador
    to Haiti; Charles R. Burrows, of Ohio, to be Ambassador to Honduras; and routine. Foreign Service nominations.
    Committee passed over until next year pending passport legislation, and announced that such legislation would.be
    its first order of business in the 87th Congress. The committee also passed over S.J. Res. 210, to provide for
    the determination of U.S. participation in the New York World's Fair to be held in 1964 and 1¢5; and S. 2827,
    authorizing presentation to the people of Mexico of a monument commemorating the 150th anniversary of the independence
    of Mexico. Committee postponed action on S. Con. Res. 111, providing for the development through the U.N. of
    international educational programs. Committee, in open session, received testimony from Under Secretary of State
    Douglas Dillon on S. Con. Res. 114, relating to the provisions of food to needy people in member states of the
    United Nations, and related meas ures. Committee will hold an executive session tomorrow for the consideration
    of this bill.
