    Army, Gen. Nathan F. Twining, to be placed on the retired list in the grade of general, and 3,6o6 nominations
    in the Army, Navy, Marine Corps, and Air Force; S. 3800, to provide a method for regulating wage rates for employees
    of the Portsmouth, N.H., Naval Shipyard; S. 3269, authorizing Secretary of the Navy to convey certain property
    to the State of Hawaii; and S. 3299, to provide for the conveyance to the State of Maine of certain lands located
    in such State (amended). Also, the committee adopted a report of its Procurement Subcommittee relative to a
    study on military procurement, and agreed to file same with tht Senate. The committee also discussed H.R. 11318,
    to increase the retired pay of certain military personnel who were retired before June 1, 1958, and authorized
    the Chairman to contract with an independent nongovernmental research organization for the conduct of a full
    study of the subject of military retirement pay. Prior to these actions, in open session, hearings were held
    on the nominations of Generals Lemnitzer and Decker, where the nominees were present to testify and answer questions
    in their own behalf.'
