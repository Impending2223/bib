    commercial recreational facilities at the John H. Kerr Reservoir, Va.-N.C.; and the nomination of Col. Herbert
    N. Turner, Corps of Army Engineers, to be a member and Secretary of the California Debris Commission. The committee
    also approved the following watershed projects: Leader-Middle Clear Boggy Cr.eek, Okla.; Fourche Maline Creek,
