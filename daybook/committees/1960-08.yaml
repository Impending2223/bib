  exec: true
  text: Committee, in executive session, ordered favorably reported an original bill (S. 3855), to increase by $100
    million authorizations for the President's mutual security contingency fund for fiscal year 1g61. The committee
    also approved an original bill authorizing $500 million for assistance in the development of Latin America,
    and $100 million for aid in the reconstruction of Chile. Under the provisions of this hill the moneys would
    be appropriated to the Secretary of State, who would keep the Committee on Foreign Relations of the Senate and
    the Committee on Foreign Affairs of the House of Representatives informed as to plans and programs for the utilization
    of such funds.
