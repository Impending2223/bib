  - H.R. 12659
  - H.R. 11573
  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following bills: (1) H.R. 7885, relating
    to the. income tax treatment of nonrefundable capital contributions to Federal National Mortgage Association,
    with the following amendments: (a) providing that taxpayers in the cement industry may for past, open years
    elect for percentage depletion purposes to, have the kiln-feed cutoff point apply for purposes of computing
    the allowable depletion (this is the same as was provided prospectively in the Gore amendment to the Public
    Debt and Tax Rat.e Extension Act of 1960); (b) adopting the text of H.R. 12857 relating to the base of the manufacturer''s
    excise tax on mechanical cigarette lighters. Under the amendment the tax is to be IO percent of the manufacturer''s
    price or 10 cents per lighter, whichever is less. (This is in lieu of the present tax of IO percent of the manufacturer''s
    price);, (c) restoring dependency exemptions for nationals of American Samoa and Swains Island (primarily children
    of U.S. naval personnel, numbering around 100); (d) (1) permitting, for 1960 and future years, a partnership
    which has elected to be taxed as a corporation to apply the.taxfree reorganization provisions if it actually
    becomes a corpora-. tion; and (2) requiring that the election to be taxed as a corporation be made in the last
    month of the preceding year or the first month of the current year for which it is to be so taxed; (e) relating
    to the declaration of estimated income tax by individuals which (1) increases the "other income" limit from
    $100 to $200; and (2) provides that no declaration need be filed where the estimated tax is less than $40. Also,
    the gross income test of $400 plus $600 times the number of exemptions is eliminated; (f) requiring individuals
    living abroad and other taxpayers (including corporations) claiming the benefits of foreign income provisions
    to file their returns at the office designated by the Secretary rather than in the district where they claim
    legal residence or place of business; (g) providing that claiming a false or fraudulent deduction for a dependent
    may be prosecuted as a misdemeanor rather than a felony. This also repeals section 7207, relating to the treatment
    of fraudulent returns, statements, or other documents as misdemeanors (leaving only the felony provisions applicable);
    and (h) the text of section 9 of H.R. 5547 (as previously reported by the Finance Committee) prohibiting the
    doubling up of the deduction of taxes for those on an accrual basis where States have changed the assessment
    or lien date. (2) H.R. 12536, which excludes certain local advertising charges from the sale price, within limits,
    for purposes of the manufacturer''s excise taxes (without amendment). (3) H.R. 10960, relating to the determination
    of retail price for purposes of the Federal excise tax on cigars (without amendment). (4) H.R. 4384, to provide
    for the free importation of certain articles for religious purposes not now included in paragraph 1774 of the
    Tariff Act (without amendment). (5) H.R. 10841, to provide for the free importation of bamboo pipestems, except
    those imported from Communist-dominated areas (without amendment). (6) H.R. 12659, to suspend import duties
    on heptanoic acid for a period of 3 years (without amendment). (7) H.R. 11573, to provide for the free importation
    of two electron microscopes for use in designated universities (with amendment adding certain grain-milling
    equipment for study and research in a university). The committee adopted a committee resolution directing the
    Tariff Commission to make a thorough study of the shrimp industry and report to the Finance Committee early
    in the next session of Congress.'
  page: D461
  pdf: 459
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=459
