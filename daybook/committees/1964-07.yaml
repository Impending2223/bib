  text: 'Committee, in executive session, ordered favorably reported an original bill authorizing a pay increase
    for members of the armed services. As approved, the bill would provide a 2 Yzpercent increase in basic pay for
    all officers and enlisted personnel with over 2 years of service. Officers with ~nder 2 years of service would
    receive an 8Yz-percent mcrease. Committee also approved H.R. 8954, authorizing transportation of house trailers
    of members of the uniformed services within the continental U.S., Alaska; or between the two (amended); H.R.
    10322, extending program authorizing retention of passed-over captains and colonels on active duty in the Navy
    and Marine Corps; H.R. 6299, authorizing sale of crude oil from Nav~l Petroleum Reserve at Umiat Field, Alaska,
    for fuel m the local area; H.R. 393, to retrocede to Massachusetts jurisdiction over certain land in the vicinity
    of Fort Devens; H.R. 4177, authorizing conveyance of part of the St. Paul Quartermaster Depot to the city of
    St. Paul, Minn.; H.R. 7248, allowing.certain property conveyed to Fort Walton Beach, Fla., to be used for educational
    as well as recreational purposes;, H.R. 7499, authorizing conveyance of. certain land to the city of Oroville,
    Calif.; H.R. 9021, authorizing conveyance of certain land to the Board of Education of Salt Lake City (amended);
    H.R. 10736, authorizing relinquishment to Virginia of all or a portion of the jurisdiction over lands comprising
    the l!.S. Naval Hospital, Portsmouth; and S. 2369, to retrocede to Kansas jurisdiction over certain highways
    bordering Fort Leavenworth Military Reservation al)d the U.S. Penitentiary (amended). The committee also approved
    for reporting 4,031 Army nominations. Prior to this:iction, committee, in open session, heard Vice Adm. B. J.
    Semmes, Jr., Chief of Na val Personnel, and Brig.'' Gen. 0: R. Simpson, Assistant Chief of Staff, G-1, Marine
    Corps, testify with regard to the H.R. 10322; and Lt. Col. Joseph B. Corcoran, Office of the Directorate of
    Personnel, Air Force, testify with regard to H.R. 8954..'
