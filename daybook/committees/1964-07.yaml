    (amended relative to revolving credit); H.R. 4649, authorizing use of certain volatile fruit flavor concentrates
    in the cellar treatment of wine (amended to (1) exempt from excise tax rebuilt auto parts, and (:2) re determination
    of sales price of rebuilt TV picture tubes); H.R. 10467, continuing for a temporary period certain rules relating
    to the deductibility of accrued vacation pay (with amendment No. 10¢, gross estate value determined after deduction
    of bequest of $808,147 to the State Department, and amendment No. 1111, authorizing Secretary of Commerce to
    study feasibility of imposing taxes on certain federally assisted commuter systems under the Urban Transportation
    Act of 1¢4, and with the text of S. 2723, to amend the Internal Revenue Code with respect to the constructive
    ownership of stock); H.R. 7301, to amend the collapsible corporation provisions of the Internal Revenue Code
    (with amendment relating to personal holding companies); and H.R. 4844, release of liability under bonds filed
    under section 44(d) of the Internal Revenue Code of 1939 (amended so as to include text of S. 3013, providing
    for nonrecognition of gain or loss on certain reacquisitions of real property). Committee considered and passed
    over for hearings H.R. 5739, re taxation of life insurance companies, and amendment No. 1114 (exempting sweepstakes
    conducted by States from tax on wagering) to the bill H.R. 10467. Committee will meet again tomorrow to consider
    H.R. 8000, proposed Interest Equalization Tax Act, and H.R. 7307, re apportionment of depletion allowance.'
