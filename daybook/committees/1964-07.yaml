  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following measures: H.R. 10041, authorizing
    funds for improved hospital and medical facilities; H.R. n611, to establish a National Commission on Automation
    (amended); H.R. 8611, providing for the indemnification of contractors to facilitate medical research and development
    within the VA; H.R. 8009, authorizing the VA Administrator to establish additional beds for furnishing nursing-home
    care to eligible veterans (amended); H.R. 7751, autho!izing construction in Los Angeles of an Army Reserve Center
    by the VA in order to provide better veterans'' hospital facilities; S. 1046, providing medical care for non-service-connected
    disability to certain recipients of the Medal of Honor; H.R. 10610, to convey certain real property of the VA
    to the city of McKinney, Tex.; H.R. lOOII, providing for the conveyance of the sewage treatment plant of the
    VA hospital to the city of McKinney, Tex.; H.R. 8251, to authorize dental services and treatment for certain
    veterans; and a bill embodying proposed amendments to the National Defense Education Act, including a 3-year
    extension of that act, and a 2-year extension of impacted areas legislation. Committee announced that it will
    consider the college student aid bill and other pending legislation at its next executive meeting. Prior to
    this action, Subcommittee on Employment and Manpower approved for full committee consideration H.R. rr6rr.'
  page: D360
