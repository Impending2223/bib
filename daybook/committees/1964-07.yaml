  text: 'Committee, in executive session, ordered favorably reported the nomination of Franklin B. Dryden, of Kentucky,
    to be Deputy Director, Office of Emergency Planning; and 7,004 nominations in the Army, Navy, Marine Corps,
    and Air Force. The committee also approved the following measures: H.R. 11035, authorizing extension of existing
    loans of forty ships to twelve different countries; H.R. 4739, regarding advance movement of dependents and
    baggage and household effects from overseas areas; H.R. 10319, to increase fees for the sale of publications
    of the U.S. Naval Oceanographic Office; H.R. 2989, to permit the continued crediting of pay to persons who are
    detained in foreign countries against their will; H.R. g634, authorizing Secretary of Defense to lend equipment
    to the Girl Scouts for their 1g65 Senior Roundup Encampment at Farragut Wildlife Management Area, Idaho; H.R.
    189, authorizing conveyance of certain land at the Naval Ordnance Test Station, China Lake, California, to Kern
    County (amended); an original bill to provide for the withholding of pay of military personnel who, while prisoners
    of war, aid the enemy; and an original bill to make permanent the authority for flight instruction for members
    of the Reserve Officers Training Corps. Also, committee voted to send a resolution of condolence to the family
    of the late Senator Engle. Prior to this action, in open session, committee held hearings on the nomination
    of Mr. Dryden, with testimony from Senator Hayden and Representative Watts, and the nominee; on H.R. 11035,
    with testimony from Rear Adm. D. C. Lyndon, Foreign Military Assistance Division, Office of the CNO; on H.R.
    4739, with testimony from Maj. E. D. Clerk and Miss Mabel Parsons, both of the Office of the Chief of Finance,
    Army; on H.R. 8676, shipment of automobiles to Alaska by motor carrier or railroad, with testimony from Roy
    L. Allen, Office of the Chief of Transportation, Army; on H.R. 10319, with testimony from Capt. Victor A. Moitoret,
    U.S. Naval Oceanographic Office; and on H.R. 2989, with testimony from Col. Walter C. Cook, Office of the Deputy
    Chief of Staff for Personnel, Air Force.'
