  text: 'Committee, in executive session, ordered favorably reported S. 1147, to enable construction of an adequate
    system of roads for the national forests (amended); S. 1282, permitting a State to increase the mileage of its
    Federal-aid primary system when provision is made for the completion and maintenance of 75 percent thereof;
    S. I 593, authorizing funds for planning the Great River Road along the Mississippi Valley; S. 1847, to provide
    a residence for Congressional and Supreme Court pages (amended); H.R. 5478, authorizing a survey of the Frio
    River in the vicinity of Three Rivers, Tex., in the interest of flood control; H.R. 6923, authorizing a survey
    of Cedar Bayou, Tex., in the interest of flood control; H.R. 10392, authorizing location of a portion of a vehicular
    tunnel under parts of the U.S. Capitol Grounds; and H.R. 10503, authorizing funds for highway construction for
    fiscal years 1¢6 and 1967 (amended). Also, committee approved public buildings prospectuses for (1) construction
    of 25'' new small buildings for the Social Security Administration, Department of HEW, (2) construction of new
    buildings for Internal Revenue Service Regional Service Center at Ogden, Utah, and courthouse and Federal office
    building at San Antonio, (3) construction of new buildings (revised prospectuses) for border stations at Nogales,
    Ariz., arid Derby Line, Vt., and a post office building at San Antonio, and (4), alterations to the San Antonio
    post office and courthouse buildings. Committee also approved the following four watershed projects: Hiawassee
    River,.Ga.; Muddy Creek, Kans.; Presque Isle Strait, Maine; and West Fork of Duck Creek, Ohio.'
  page: D320
