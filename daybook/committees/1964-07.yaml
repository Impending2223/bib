    of certain lands to the city of Saxman, Alaska; S. 2419, authorizing condemnation of certain property in St.
    Augustine, Fla., for the Castillo de San Marcos National Monument; S. 1481, providing for the establishment
    of Agate Fossil Beds National Monument, Nebr. (amended); S. 2048, providing for the establishment of the Big
    Horn Canyon National Recreation Area in Wyoming and Montana (amended); S. 91, authorizing the establishment
    of the Fort Bowie National Historic Site, Ariz.; H.R. 1892, to repeal (Pittman Act) the right to prospect for
    underground water on designated public lands in Nevada; H.R. 5302, a private bill; S. 605, authorizing acquisition
    of the Graff House Site for inclusion in Independence National Historic Park, Philadelphia (amended); S. 1365,
    providing for the establishment of Fire Island National Seashore, N.Y. (amended); S. 1909, authorizing funds
    for the opera~ tion of the Battle of New Orleans Sesquicentennial Celebration Commission; H.R. 5159, policy
    of Congress that lands administered by Secretary of the Interior be managed under principles of multiple use
    to produce a sustained yield of products and services (amended); S. 2655, authorizing sale of 58 acres of Eastern
    Shawnee tribal land in Oklahoma; H.R. 7833, to provide for the distribution of lands and assets of certain Indian
    rancherias and reservations in California; H.R. 7215, conveying certain lands in trust for the Citizen Band
    of Potawatomi and Absentee-Shawnee Tribes of Indians of Oklahoma; S. 1820, conveying certain federally owned
    land in trust status to the Cherokee Indians of Oklahoma (amended); S. 2210, authorizing exchange of land within
    the Salt River Pima-Maricopa Indian Reservation (amended); H.R. I I n8, providing for the distribution of funds
    from judgments in favor of certain Tillamook Indians (amended); H.R. 2977, authorizing the sale of certain lands
    of the Cheyenne River Sioux Tribe; S. 1531, increasing authorizations for the completion of the Flathead Indian
    irrigation project, Montana (amended); S. 2608, providing for disposition of judgment funds to the Lower Pend
    d''Oreille or Kalispel Tribe of Indians; H.R. 5837, authorizing purchase, sale, and exchange of certain lands
    of the Yakima Indian Reservation (amended); H.R. 1988, authorizing settlement of claims of inhabitants of Rongelap
    Atoll for radiation exposure resulting from atomic testing at Bikini Atoll (amended); and H.R. 3198, permitting
    aid by Federal agencies to the Trust Territories of the Pacific Islands (amended).'
