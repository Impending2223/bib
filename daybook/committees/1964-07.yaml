  text: 'Subcommittee on Indian Affairs held hearings on the following bills: S. 2482, providing for disposition
    of judgment funds for the Pawnee Tribe of Oklahoma_; H.R. 8834, providing for disposition of judgment funds
    to the Shawnee Tribe of Indians; S. 2961, providing for disposition of judgment funds to the Northern Cheyenne
    tribe of the Tongue River Reservation, Mont.; H.R. 8080 (S. 2027), providing for distribution of judgment funds
    in favor of the Snake or Paiute Indians of the former Malheur Reservation, Oreg.; H.R. 1713, canceling irrigation
    charges against non-Indian-owned lands under the Klamath Indian irrigation project, Oregon; S. 90, to relocate
    members of the Papago Indians in the village of Sil Murk, adjoining the Gila Bend Indian Reservation; S. 2752,
    conveying ro acres of public land on the White Earth Reservation to the Minnesota Annual Conference of the Methodist
    Church; and S. 28II, declaring that 80 acres of land acquired for the Flandreau Boarding School is held by the
    U.S. in trust for the Flandreau Santee Sioux Tribe. Testimony was received from Graham E. Holmes, Assistant
    Commissioner of Indian Affairs, Department of the Interior, who testified with regard to all the bills; Marvin
    J. Sonoski, attorney, and Delbert Horsechief, Jr., chairman, both of the Pawnee Business Council, who testified
    with regard to S. 2482; and Loney W. Hart, Office of the Chief of Army Engineers, who directed his remarks to
    S. go.'
