  text: The Juvenile Delinquency Subcommittee held hearings with regard to the interstate sale of fireworks, with
    especial emphasis on the recent incidents resulting from the sale to the public of plastic-covered cherry bombs.
    Witnesses heard were Lawrence R. Woltz, fire marshal of Prince Georges County, Md.; James C. Robertson, assistant
    fire marshal of the State of Maryland; William C. Mooney, Jr., an investigator of the subcommittee's staff;
    and Bernard J. Semel, Capital Fireworks, Inc., Brandywine, Md., a manufacturer of plastic cherry bombs. Hearings
    are tentatively scheduled to continue on Tuesday, August 6.
