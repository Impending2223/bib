  - H.R. 6996
  - H.R. 2192
  exec: true
  text: Committee, in executive session, ordered favorably reported with an amendment in the nature of a substitute
    bill H.R. 5555, increasing rates of pay of members of the armed services. Also, committee approved H.R. 69¢,
    revising authority for deferment from certain Reserve training and revising special enlisted training programs
    (with amendments); H.R. 2192, a private bill; and an original bill which would waive the normal 6.month waiting
    period for disposal from our national stockpile of water. fowl feathers and down. Committee also approved 7,960
    nominations in the Army, Navy, Marine Corps, and Air Force. Prior to this action, committee received a report
    on H.R. 5555 from Senator Cannon, chairman of the spe cial subcommittee which handled this bill; and from Senator
    Symington, chairman of the Subcommittee on the National Stockpile, relative to the disposal matter mentioned
    above.
