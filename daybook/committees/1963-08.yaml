  exec: true
  text: In executive session the committee approved a provision which will, beginning in r¢4, gradually "speed up"
    payment of corporate income taxes. A detailed release is available in committee office (RR 63-29). With respect
    to multiple surtax exemptions, in addition to minor technical amendments, the committee modified the provision
    previously agreed to providing a 3-percent penalty tax in certain cases so that the penalty tax will be 5 percent
    on.the first $25,000 of income and, on the excess over $2s,ooo, 2 percent for the calendar year 1¢4 and 3 percent
    for subsequent years. A detailed release on this is also available in the committee office (RR 63-30). In addition,
    the 2-percent tax on cohsblidated returns would be repealed, and no change would be made in the intercorporate
    dividends-received deduction provided by existing law. The committee also agreed to repeal the provision contained
    in the Revenue Act of 1¢2 relating to the deduction from the depreciation base of the amount of the investment
    credit. The committee also agreed to repeal the 4 percent dividend credit over a 2-year period-(making the credit
    2 percent in 1964 and complete repeal in 1¢5) and to double the $so dividend exclusion, making a $100 exclusion.
    Details relative to these and other decisions of the committee are available in a press release in the main
    committee office (RR 63-30).
