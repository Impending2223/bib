  text: 'Subcommittee on Indian Affairs approved for full committee consideration the following bills: Amended-S.
    203, declaring that the U.S. hold in trust for the pueblos of Santa Ana, Zia, Jemez, San Felipe, Santo Domingo,
    Cbchiti, Isleta, and San Ildefonso certain public domain lands; S. 344, providing for the distribution of certain
    excess income to enrolled members of the Seneca Nation; S. 1501, relating to the administration of Government-owned
    utility systems by the Bureau of Indian Affairs; S. 1518, providing for the distribution of judgment funds of
    the Omaha Tribe of Indians; and S. 1540, to remove the limitation upon the amount of appropriation authorized
    to establish the Indian revolving loan fund; and Without amendment-H.R. 1593, authorizing conveyance of certain
    land in the Big Sandy Rancheria, Calif.; S. 1807, authorizing disposition of land no longer needed for the Chilocco
    Indian Industrial School, Oklahoma; S. 2016, to give to the Walker River Paiute Tribe the reserved minerals
    underlying its reservation; S. 2087, authorizing conveyance of certain lands and personal property to the State
    of Washington; S. 2216, authorizing transfer of three units of the Fort Belknap Indian irrigation project to
    the landowners within the project; S. 2224, to grant minerals on certain lands in the Northern Cheyenne Indian
    Reservation, Mont., to certain Indians; and S. 2241, donating 391 acres of public land to the Jicarilla Apache
    Tribe of the Jicarilla Reservation, N.Mex. Prior to approval of these bills, testimony thereon was received
    from John 0. Crow, Acting Commissioner of Indian Affairs, Martin P. Mangan, Assistant Commissioner of Indian
    Affairs, and Lewis Sigler, Assistant Legislative Counsel, all of the Department of the Interior.'
