  text: Committee, in executive session, ordered favorably reported H.J. Res. 392, relating to the furnishing of
    office equipment to Members of the House of Representatives; S. Res. 170, suggesting suitable forms for certificates
    of appointment or election of Senators; S. Res. 168, authorizing attendance of a delegation from the Senate
    at a meeting of the Commonwealth Parliamentary Association; S. Con. Res. 29, authorizing attendance of delegations
    from the Senate and House at meeting of the Commonwealth Parliamentary Association; H. Con. Res. 308, to print
    additional copies of hearings entitled "Communist Training Operations-Communist Activities and Propaganda Among
    Youth Groups"; H. Con. Res. 309, to print additional copies of hearings entitled "The Northern California District
    of the Communist Party-Structure-Objectives-Leadership"; H. Con. Res. 3n, to print additional copies of H. Doc.
    336, 86th Congress, entitled "Facts on Communism-Volume I, The Communist Ideology" (amended); H. Con. Res. 320,
    authorizing printing as a House document inaugural addresses of the Presidents; H. Con. Res. 327, to print additional
    copies of H. Doc. 198, 84th Congress, entitled "The Commission on Intergovernmental Relations"; H. Con. Res.
    342, authorizing printing as a House document the tributes extended to Speaker Sam Rayburn (amended); S. Res.
    165, to print as a Senate document "The Constitution of the United States of America, Approved by the Continental
    Congress" (amended); S. Res. 169, to print as a Senate document a committee print of a "Study Mission to Eastern
    (American) Samoa"; an original resolution (S. Res. 178) establishing date of commencement of service of term
    of Senator Tower; and two original resolutions (S. Res. 176 and 177), authorizing payment of gratuities to survivors
    of Senate employees. Committee received a report from Senator Jordan relating to the operation of the Senate
    restaurant. Committee also agreed that one of the old subway cars would be utilized through the 87th Congress.
    Committee indefinitely postponed further action on S.J. Res. 86, providing that each Presidential press conference
    held during a session of Congress be printed in the Congressional Record.
