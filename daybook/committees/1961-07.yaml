  exec: true
  text: 'Met in executive session and ordered favorably reported to the House the following bills: H.R. 1022 (amended),
    to provide for the lease and transfer of tobacco acreage allotments; H.R. 3879, to convey to the State of Wyoming
    for agricultural purposes certain real property in Sweetwater County, Wyo.; H.R. 4682 (amended), to sell and
    convey certain lands in Iowa to the State of Iowa; H.R. 4821, to convey a certain parcel of land to the town
    of Tellico Plains, Tenn.; H.R. 4939, to provide for the conveyance of a certain tract of land in Jasper County,
    Ga., to the Jasper County Board of Education; H.R. 6193, to convey certain lands in Wyoming to the county of
    Fremont, Wyo.; H.R. 7176, to provide for a national hog cholera eradication program; H.R. 3920, to amend the
    Navy ration statute so as to provide for the serving of oleomargarine or margarine; H.R. 5628, to study the
    desirability and feasibility of establishing and maintaining a National Tropical Botanic Garden; S. 702, to
    exchange certain lands in Wyoming with the town of Afton, Wyo.; S. 1873, to permit the use of Commodity Credit
    Corporation donated foods under certain circumstances for training college students in home economics courses;
    and H.R. 1375, a private bill. Also approved 22 watershed projects and passed over, for further consideration,
    H.R. 3689, to provide for the transfer of rice acreage history where producer withdraws ~rom the production
    of rice.'
