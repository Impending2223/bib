  exec: true
  text: Committee, in executive session, ordered favorably reported n2 postmaster nominations; H.R. 1986, to repeal
    the law requiring the Postmaster General to furnish the ICC information on revenue received by railroads from
    express companies; S. 1070, to provide additional group life insurance for Federal employees (amended); H.R.
    3279, increasing maximum rates of per diem allowance for Federal employees traveling on official business (amended);
    S. 189, to increase the equipment allowance for rural carriers (amended); H.R. 5432, to make permanent certain
    increases in civil service annuities; S. 1640, to amend disability provisions of the Civil Service Retirement
    Act (amended); and S. 740, providing for allotment of pay in case of evacuated Federal employees. Committee
    agreed to hold hearings on S. 1996, and S. 659, providing for appointment by the Postmaster General of postmasters
    at first-, second-, and third-class post offices. Hearings will also be held before the Retirement Subcommittee
    -on S. 1149, increasing the factor in computing annuities for certain Federal employees engaged in hazardous
    duties, and related bills, and on S. 1683, relating to employees of the agricultural stabilization and county
    conservation committees. Dates for these hearings have not as yet been fixed. Prior to this action, the Retirement
    Subcommittee approved for full committee consideration S. 745, companion bill to H.R. 5432.
  page: D352
