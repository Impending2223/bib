  text: Committee continued its executive consideration of S. 1643, proposed Agricultural Act of 196!, and agreed
    to remove soybeans from those commodities eligible for marketing orders, and further agreed that cottonseed,
    flaxseed, and honey would not be included among such eligible commodities. On Thursday, July 6, committee, in
    connection with this bill, adopted (1) a wheat program for 1¢2, providing for a IO-percent mandatory reduction
    in acreage allotments with an additional 30-percent voluntary reduction in acreage allotments, and (2) a corn
    and feed grain program for 1962 providing a 20-percent mandatory reduction in order to be eligible for price
    supports, and would apply only to corn, grain sorghums, and barley. Also, on Thursday, July 6, committee ordered
    favorably reported without amendment S. 763, authorizing funds to reimburse the Commodity Credit Corporation
    for net losses incurred, and S. 1873, permitting use of donated foods for training college students in home
    economics courses; and with amendment S. 1 ro7, exempting production of Durum wheat in portions of Modoc and
    Siskiyou Counties, Calif., from acreage allotments and marketing quota restrictions; and S. 1710, authorizing
    the Secretary of Agriculture to make emergency livestock loans. Committee will continue consideration of S.
    1643 on Monday, July IO.
  page: D351
  pdf: 349
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=349
