  text: Subcommittee No. 2 ordered favorably reported to the full committee H.R. 218 (amended), to provide that
    individuals enlisted in the Armed Forces of the United States shall take an oath to support and defend the Constitution
    of the United States; H.R. 4785 (amended), relating to withholding for State employee retirement, disability,
    and death benefit system, on the compensation of certain civilian employees of the National Guard; H.R. 4786,
    to provide travel and transportation allowances for members of the National Guard and Reserve eomponents when
    travel is performed in an active duty or inactive duty training status in compliance with Federal directives;
    H.R. 4790, to amend section 709 of title 32, United States Code; H.R. 4792, to clarify the status of members
    of the National Guard while attending or instructing at National Guard schools; H.R. 7719, to authorize certain
    persons who complete a ~eserve Offi-, cers' Training Corps program to be appointed as commissioned officers
    in the Coast and Geodetic Survey; and H.R. 7934 (amended), to make emergency payments to persons who are injured
    or whose property is damaged as a result of aircraft or missile accidents. Prior to taking action on the measures
    the subcommittee heard testimony from Representative Gross (H.R. 218); president, National Guard Association
    (H.R. 4790, 4792, 4785), and Defense Department witnesses (all measures).
