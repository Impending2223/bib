  exec: true
  text: 'Ordered reported to the House the following measures: H.R. 218 (amended), to provide that individuals enlisted
    into the Armed Forces of the U.S. shall take an oath to support and defend the Constitution of the U.S.; H.R.
    4785 (amended), relating to withholding for State employee retirement, disability, and death benefit system,
    on the compensation of certain civilian employees of the National Guard; H.R. 4786, to provide travel and transportation
    allowance for members of the National Guard and Reserve components when travel is performed in an active duty
    or inactive duty training status in compliance with Federal directives; H.R. 4790, to amend section 709 of title
    32, U.S. Code; H.R. 4792, to clarify the status of members of the National Guard while attending or instructing
    at National Guard schools; H.R. 7719, to authorize certain persons who complete a Reserve Officers'' Training
    Corps program to be appointed as commissioned officers in the Coast and Geodetic Survey; H.R. 7934 (amended),
    to make emergency payments to persons who are injured or whose property is damaged as a result of aircraft or
    missile accidents; H.R. 5228, to lend certain Army, Navy, and Air Force equipment to the Girl Scouts of the
    U.S. for use at the 1962 Girl Scouts senior roundup encampment; H.R. 7725, to reconvey to the town of Malone,
    N.Y., certain real property heretofore donated by said town to the U.S. as an Army Reserve Center; H.R. 7721,
    to adjust the legislative jurisdiction exercised by the U.S. over lands within the Fort Sheridan Military Reservation,
    Ill.; H.R. 7728 (amended), to authorize the Secretary of a military department to sell goods and services to
    the owner of an aircraft or his agent in an emergency. H.R. 7727, to permit members of the Armed Forces to accept
    fellowships, scholarships, or grants; S. 1087, to authorize and direct the transfer of certain Federal property
    to the government of American Samoa; H.R. 1794 (amended), to provide for the conveyance of certain real property
    of the U.S. situated in Hawaii and to the city and county of Honolulu, Hawaii; H.R. 763 (amended), to provide
    for an additional payment of $165,000 to the village of Highland Falls, N.Y., toward the cost of the water.filtration
    plant constructed by such village; H.R. 2877, to approve a financial contribution for civil defense purposes
    to the State of Oklahoma; H.R. 7447 (amended), to provide for the immediate disposition of certain waterfowl
    feathers; H.R. 7726 (amended), to authorize the loan of naval vessels to friendly foreign countries and the
    extension of certain naval vessel loans now in existence. Prior to taking action on H.R. 7726, the committee
    heard departmental witnesses, in executive session. Adjourned subject to call of the Chair.'
  page: D381
  pdf: 379
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=379
