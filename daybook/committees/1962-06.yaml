  exec: true
  text: Committee, in executive session, ordered favorably reported S. 3244, to amend the Merchant Marine Act so
    as to authorize investment of the war risk insurance fund in U.S. securities; S. 678, to extend the application
    of the Automobile Information Disclosure Act to Guam and the Virgin Islands (with an amendment in the nature
    of a substitute); and S. 256o, to require that all States conform their regulations of interstate motor carriers
    with the uniform standards of the ICC (with amendments). Committee approved an amendment to be offered as a
    committee amendment to S. 16os, to permit the Federal Power Commission to delegate its functions in certain
    cases, which bill is now on the Senate Calendar. The amendment adopted would authorize recall of a delegation
    of authority by a majority of the FPC less one member. Committee received a briefing in connection with matters
    pertaining to the Panama Canal from Assistant Secretary of State for Economic Affairs Edwin M. Martin. Committee
    adopted a committee resolution to be addressed to the Committee on Finance, favoring repeal of the tax on transportation.
    Committee appointed a special subcommittee to consider H.J. Res. 489 and S.J. Res. 105, providing protection
    for the Golden Eagle. Committee announced that it would hold hearings June 27-29 on S. 3242 and S. 3243, the
    administration's transportation bills.
