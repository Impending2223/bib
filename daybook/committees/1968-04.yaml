  text: 'Subcommittee on Government Procurement continued hearings to investigate the extent to which Federal procurement
    can be used to alleviate hard-core unemployment in urban and rural poverty districts. Witnesses heard were Commissioner
    Cyril Tyson, Manpower and Career Development Agency, New York City; Berkeley G. Burrell, Matthew Clarke, and
    Buxton W. Cooke, all of the National Business League; Stanley H. Ruttenberg, Assistant Secretary of Labor for
    Manpower; Robert C. Moot, Administrator, Small Business Administration; and William Haskins, National Urban
    League. Hearings were adjourned subject to call. Committee on Agriculture and ordered printed as a House document,
    with illustrations (H. Doc. 296). !Pages 8775-8776 Standards of Official Conduct: Adopted, by a record vote
    of 405 yeas to 1 nay, H. Res. 1099, to amend H. Res. 418, 9oth Congress, to continue the Committee on Standards
    of Official Conduct as a permanent standing committee of the House of Representatives. Adopted a committee amendment.
    Rejected the Ottinger substitute amendment; and an amendment to eliminate fundraising testimonial dinners and
    regarding disclosure of sources of campaign funds. A point of order against an amendment was sustained. H. Res.
    1119, the rule under which the legislation was considered, was adopted earlier by a voice vote. Pages 8776-8812
    Committee Appointments: Adopted H. Res. 1126, providing that the following-named Members be elected to the following
    standing committees of the House of Representatives: Committee on Banking and Currency: Representatives Wolff
    and Griffin.'
