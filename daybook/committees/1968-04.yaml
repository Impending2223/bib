    calendar seven bills, of which one was private, were passed as follows: Without amendment and cleared for President:
    Merchant marine: H.R. 9473, authorizing Federal Maritime Commission to permit a carrier to refund a portion
    of freight charges collected from a shipper; Merchant marine: H.R. 14401, granting to masters of certain U.S.
    vessels a lien on such vessels for wages and certain other disbursements; D.C.: H.R. 12019, to exempt from D.C.
    taxation certain property of the B''nai B''rith Henry Monsky Foundation; and Private bill: One private bill,
    H.R. 7909. With amendment, to be sent back to House: D.C.: H.R. 15131, providing salary increases for D.C. policemen,
    firemen, and teachers. Without amendment and cleared for House: Merchant marine: S. 3102, to postpone for 2
    years the date on which passenger vessels operating solely on the inland rivers and waterways must comply with
