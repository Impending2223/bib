    excise tax on communication and automobiles, and to expedite payments of estimated tax by corporations, but
    made no announcements, and recessed subject to call, probably sometime after the Easter recess. Bills Reported:
    Reports were made as follows: S. 3293, authorizing funds for military procurement for fiscal year 1969 (S. Rept.
    1087); H.R. 14940, authorizing funds for the Arms Control and Disarmament Agency for fiscal years 1969 and 1970,
    with individual views (S. Rept. 1088); Report of Committee on Government Operations entitled "AID''s Mismanagement
    of Excess Property Program" (S. Rept. 1089); H.R. 10477, Veterans'' Administration housing law amendments, with
    amendments (S. Rept. 1090); and S. Res. 276, authorizing additional $20,000 for Committee on Labor and Public
    Welfare (no written report)-ref erred to Committee on Rules and Administration. Pages 9432, 9438 Bills Referred:
    Two House-passed bills were referred to appropriate committees. Pages 9407, 9493 Call of Calendar: On call of
    calendar seven bills, of which one was private, were passed as follows: Without amendment and cleared for President:
    Merchant marine: H.R. 9473, authorizing Federal Maritime Commission to permit a carrier to refund a portion
    of freight charges collected from a shipper; Merchant marine: H.R. 14401, granting to masters of certain U.S.
    vessels a lien on such vessels for wages and certain other disbursements; D.C.: H.R. 12019, to exempt from D.C.
    taxation certain property of the B''nai B''rith Henry Monsky Foundation; and Private bill: One private bill,
    H.R. 7909. With amendment, to be sent back to House: D.C.: H.R. 15131, providing salary increases for D.C. policemen,
    firemen, and teachers. Without amendment and cleared for House: Merchant marine: S. 3102, to postpone for 2
    years the date on which passenger vessels operating solely on the inland rivers and waterways must comply with
    certain safety standards. With amendment and cleared for House: Auto insurance study: S.J. Res. 129, authorizing
    Secretary of Transportation to conduct a comprehensive study of all aspects of the auto insurance system. Pages
    9407-9430 Courts: Senate concurred in House amendments to S. 159, authorizing transfer to a single district
    of civil actions involving one or more common questions of fact'
