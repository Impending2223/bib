  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 728 (amended),
    to broaden the vessel exchange provisions of section 5Io(i) of the Merchant Marine Act, I936, and to extend
    such provisions for an additional 5 years; H.R. 729, to amend section 5IO (a) (I) of the Merchant Marine Act,
    I936; S. 998 (in lieu of H.R. 4227), to authorize the Secretary of the Interior to make loans for the financing
    and refinancing of new and used fishing vessels, and to extend the term during which the Secretary of the Interior
    is authorized to make fisheries loans under the Fish and Wildlife Act of I956; H.R. 722 (amended), to amend
    certain provisions of existing law concerning the relationship of the Coast and Geodetic Survey to the Army
    and Navy so they will apply with similar effect to the Air Force; H.R. 725 (amended), to clarify the responsibility
    for marking of obstructions in navigable waters; H.R. 727 (amended), to provide for the administration of the
    Coast Guard Band; H.R. 7779, to provide for the retirement of enlisted members of the Coast Guard Reserve; H.R.
    876r (amended), to provide an increase in the retired pay of certain members of the former Lighthouse Service;
    and S. 627 (amended), to exempt oceanographic research vessels from the application of certain vessel inspection
    laws.'
