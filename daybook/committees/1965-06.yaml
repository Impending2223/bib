  text: 'Committee continued its execu tive consideratio-n of H._R. 6675, increasi~g benefits under the Social Security
    Act, and to provide a hospital insurance plan for the aged under that act, and tentatively adopted amendments
    which would- (1) Include as physician''s services, the s~rvices of chiropractors and podiatrists; (2) Include
    in definition of drugs under the basic hospital plan (a) drugs included in the Homeopathic Pharmacopoeia, and
    (b) combination of drugs if princip~l ingredient is a drug otherwise approved. (3) Permit the coverage under
    the basic hospital plan of the doctor''s portion of the following medical specialties: pathology, radiology,
    physiatry, and anesthesiology, providing they are billed through a hospital (Douglas amendment No. 156); and
    (4): Assure that-payment for any service under both the basic hospital and the supplementary health plans would
    not be denied to any individual because he is also covered by a St~te or local government employee health plan..
    The committee will continue consideration of this bill tomorrow..'
