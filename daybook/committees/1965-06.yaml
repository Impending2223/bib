    increase in rates of subsistence allowances paid to disabled veterans pursuing vocational rehabilitation training
    and to the sons and daughters of deceased or permanently and totally disabled veterans pursuing a program of
    education under the war orphans'' educational assistance program; H.R. 208 (amended), to amend chapter 31 of
    title 38, United States Code, to extend to all totally disabled veterans the same liberalization of time limits
    for pursuing vocational rehabilitation training as was authorized for blinded veterans by Public Law 87-591,
    and to clarify the language of the law relating to the limiting of periods for pursuing such training; H.R.
    227 (ani ended), to amend title 38 of the United States Code to entitle the children of certain veterans who
    served in the Armed Forces prior to September 16, 1940, to benefit under the war orphans'' educational assistance
    program; H.R. 235 (amended), to amend title 38 of the United States Code to repeal the provisions relating to
    education of Korean conflict veterans; H.R. 2656, provides that the size of flags furnished by the Administrator
    of Veterans'' Affairs to drape the caskets of deceased veterans shall measure 5 feet in width and 9Yz feet in
    length.'
