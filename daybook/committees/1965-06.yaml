    Indians of the Pueblos of Acoma, Sandia, Santa Ana, and Zia (amended); S. 1938, to remove the so-year-lease
    limitation on the Pyramid Lake Indian Reservation land in Nevada; H.R. s86o, to amend the law relating to the
