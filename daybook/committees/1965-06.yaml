  exec: true
  text: In executive session, committee continued its consideration of H.R. 6675, to increase benefits under the
    Social Security Act, and to provide a hospital insurance plan for the aged under that act, tentatively adopting
    the following amendments:. (I) By.Senator Smathers "whereby a widow, aged 6o or over, who marries a social security
    beneficiary will be entitled to a benefit in an amount equal to a wife's benefit from her former or current
    husband, whichever benefit is higher. If she. marries a man who is not entitled to social security benefits
    she will receive a benefit in an amount equal to a wife's benefit from her former husband. Under existing law
    her benefits would terminate entirely in the lat~er case"; and (2) Deferring the effective date of the voluntary
    supplementary health insurance plan from July I, I966, to January I, I967. Hearings were recessed subject to
    call of the Chair.
