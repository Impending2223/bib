  text: 'Subcommittee on Indian Affairs met in open session and approved for full committee action the following
    bills: H.R. 8580 (amended), to convey certain land to the Squaxin Tribe of Indians; H.R. 2828 (amended), to
    provide for the disposition of funds appropriated to pay a judgment in favor of the Iowa Tribes of Kansas and
    Nebraska and of Oklahoma in Indian Claims Commission docket No. 138; and S. 491, to determine the rights and
    interests of the Navajo Tribe of the Ute Mountain Reservation in and to certain lands in the State of New Mexico.
    Referred H.R. 3273 and H.R. 9553, to determine the rights and interests of the Navajo Tribe of the Ute Mountain
    Reservation in and to certain lands in the State of New Mexico, to full committee for appropriate disposition.
    Considered, but took no final action on H.R. 11847, and related bills, to provide for the disposition of judgment
    funds now on deposit to the credit of the Cheyenne-Arapaho Tribes of Oklahoma. Prior to this action the subcommittee
    held a hearing on the bills. Testimony was heard from Representatives Mize and Aspinall; and Robert Bennett,
    Commissioner, Bureau of Indian Affairs. A statement for the record was submitted by Representative Walker.'
