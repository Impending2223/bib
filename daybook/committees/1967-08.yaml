  others:
  - public witnesses. committee on Administrative Practice and Procedurereferred to Committee on Rules and Administration
  text: 'Subcommittee on National Parks and Recreation held a hearing on H.R. I0835, to establish the National Park
    Foundation. Testimony was heard from George B. Hartzog, Jr., Director, National Park Service, Department of
    the Interior; and public witnesses. committee on Administrative Practice and Procedurereferred to Committee
    on Rules and Administration. Page 21710 Bills Referred:'' 13 House-passed bills and one Houseadopted concurrent
    resolution were appropriately referred. Pages 21707, 21777 President''s Message-Interoceanic Canal: Message
    was received from President transmitting with his comments the Third Annual Report of the Atlantic-Pacific Interoceanic
    Canal Study Commission-referred to Committee on Commerce. Pages 21709-21710 Taxation: Senate passed with committee
    amendments H.R. I282, providing for withdrawal of wine from bonded wine cellars without payment of tax when
    rendered unfit for beverage use. Pages 21707-21709 Wild Rivers: By unanimous vote of 84 yeas, Senate passed
    (motion to reconsider tabled) S. I I9, to reserve certain public lands for a National Wild Rivers System, after
    adopting committee amendment, which had been amended by adoption of Yarborough amendment to include the Rio
    Grande in Texas in the Wild Rivers System. Pages 21742-21751 Export-Import Bank: Senate considered S. 1155,
    extending period within which the Export-Import Bank is authorized to exercise its functions. Pending at adjournment
    was modified Ellender amendment (No. 245) barring issuances of guarantees or insurance or making loans in any
    extension of credit for purchase of defense articles by any less-developed country or national thereof. By unanimous
    consent, it was agreed to limit debate, effective at 12:I5 p.m., August 9, as follows: 2 hours, equally divided,
    on pending modified Ellender amendment No. 245; 2 hours, equally divided, on Dirksen amendment No. 246 stating
    policy of Congress that the Bank shall not (rather than should not) guarantee or insure or make loans in any
    extension of credit in connection with purchase of any product by a Communist country or national thereof; and
    4 hours, equally divided, on question of passage of the bill. Pages 21755, 21785-21799'
