  next: '1967-08-03'
  text: 'Subcommittee on Fiscal Policy continued its series of hearings to study policies of the sharing of Federal
    revenues with State and local governments. Witnesses heard today were Walter W. Heller, professor of economics,
    University of Minnesota; Joseph A. Pechman, director of economic studies, the Brookings Institution; Herbert
    Stein, vice president and chief economist, Committee for Economic Development; and Melville J. Ulmer, professor
    of economics, University of Maryland. Hearings continue tomorrow. Bills Reported: Reports were made as follows:
    S. 109, prohibiting discrimination against agricultural producer concerning his right to belong to an association
    of producers, with amendment (S. Rept. 474); S. 2126, to make newly acquired farms eligible for the cropland
    adjustment program under certain circumstances (S. Rept. 475); S. 1657, authorizing indemnity payments to dairy
    farmers who are directed to remove their milk from markets because it contains certain chemical residues, with
    amendment (S. Rept. 476); S. 1678,922, 1709,975, and 1748, private bills (S. Repts. 477-481); H.R. 5876, codifying
    laws respecting pay allowances and annuities of Government employees (title 5), Coast Guard (title 14), and
    uniformed services (title 37) (S. Rept. 482); H.R. 4833, 44¢, 8485, and S. 234, private bills (S. Repts. 483-486);
    S. 1550, to amend the Consolidated Farmers Home Administration Act to provide for release of valueless liens,
    with amendments (S. Rept. 487); H.R. 6o56, providing rules for determining which divorced parent is entitled
    to the personal exemption for their dependent children, with amendment (S. Rept. 488); H.R. 1282, providing
    for withdrawal of wine from bonded wine cellars without payment of tax when rendered unfit for beverage use,
    with amendments (S. Rept. 489); and H.R. 4765, establishing special rules for income tax treatment of distribution
    by companies which became holding companies under Public Law 8g--485, with amendments (S. Rept. 490). Page 21282
    Resolution Rereferred: Committee on Foreign Relations was discharged from further consideration of S. Co11:.
    Res. 38, expressing sense of Congress with respect to the International Dumping Code, and the resolution was
    then referred to Committee on Finance. Page 21297 President''s Message-Taxation: President transmitted message
    recommending a temporary ro-percent surtax on corporate and personal income, a speedup of corporate tax collections,
    and continuation of excise taxes for the immediate future-referred to Committee on'
