    of judgment funds of the Minnesota Chippewa Tribe of Indians; S. 2162, reserving certain public lands in Nevada
    and Oregon as a grazing reserve for Indians of Fort MeDer~ mitt; S. 1958, relating to the rights of descendants
    of the Tiwa Indians of Texas; S. 1750, providing for disposition of judgment funds of the Sac and Fox Indians;
    S. 1933, providing for disposition of judgment funds of the Cheyenne~ Arapaho Tribes of Oklahoma; S. 1972, providing
    for disposition of judgment funds of the Emi~ grant New York Indians; H.R. 536, providing that the U.S. shall
    hold in trust certain Oklahoma lands for the Cherokee Nation; and H.R. 2531, relating to the disposition of
    property of the Creek Nation of Oklahoma. Testimony was received from Senator Harris, who directed his remarks
    to S. 1750, S. 1933, H.R. 536, and H.R. 2531; Robert L. Bennett, Commissioner of Indian Affairs, who directed
