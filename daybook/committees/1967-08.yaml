  text: 'Committee held hearings to hear Director of the Bureau of the Budget Charles L. Schultze present revised
    budget estimates for the current fiscal year 1968. Bills Reported: Reports were made as follows: H.R. 11945,
    to amend the college work-study program with respect to institutional matching and permissible hours of work
    (S. Rept. 539); S. 1504, to facilitate financing of rural community centers and other facilities under the Consolidated
    Farmers Home Administration Act, with amendments (S. Rept. 540); S. J. Res. 93, providing for the issuance of
    a gold medal to the widow of the late Walt Disney in recognition of his outstanding contributions to the U.S.
    and to the world, with amendment (S. Rept. 541); S. 1467, authorizing funds for highway safety and beautification
    programs, with amendments (S. Rept. 542); and Supplemental views on S. 188o, proposed Election Reform Act (Part
    2 of S. Rept. 515). Page 24135 Civil Rights: When H.R. 2516, to prescribe penalties for interference with civil
    rights, was received from the House, it was read for the first and second times. Senate then adopted Mansfield-Dirksen
    motion that the bill be referred to Committee on the Judiciary with instructions to report it back within 6o
    days. Page 24131 Private Bill: Senate passed without amendment and cleared for President''s signature H.R. 3717,
    private bill. Page 24133 Public Buildings-Physically Handicapped: S. 222, to insure that all public buildings
    shall be constructed so as to be reasonably accessible to the physically handicapped, was passed with committee
    amendments. Pages 24133-24144 Higher Education: Senate passed without amendment and cleared for President''s
    signature H.R. 11945, to amend the college work-study program with respect to institutional matching and permissible
    hours of work. Motion to reconsider this action was tabled. Pages 24161-24164 Authority To Report: Order was
    entered that following adjournment today until midnight Saturday, Au~ gust 26, all committees may file reports,
    including minority, individual, and supplemental views. Page 24199 Highway Beautification: Under prior agreement,
    S. 1467, authorizing funds for highway safety and beautification programs, became Senate''s unfinished business
    when it was reported. Page 24199'
