  text: 'Subcommittee on Mines and Mining met in executive session and approved for full committee action the following
    bills: H.R. 9085 (amended), to authorize the Secretary of the Interior to sell reserved phosphate interests
    of the United States in lands located in the State of Florida to the record owners of the surface thereof; H.R.
    5091, to amend Public Law 87--752 (76 Stat. 749) to eliminate the requirement of a reservation of certain mineral
    rights to the United States; H.R. 7940 (amended), to authorize the Secretary of the Interior to prevent terminations
