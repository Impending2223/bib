  text: 'Committee met in executive session to consider several organizational matters, including the appointment
    of subcommittees, as follows: Standing Rules of the Senate: Senators Hayden, chairman, Cannon, and Cooper; Privileges
    and Elections: Senators Cannon, chairman, Pell, and Curtis; Printing: Senators Hayden, chairman, Jordan, and
    Scott; Library: Senators Jordan, chairman, Clark, and Cooper; Smithsonian Institution: Senators Pell, chairman,
    Byrd of West Virginia, and Scott; Restaurant: Senators Byrd, chairman, Clark, and Scott. Committee announced
    that Senators Hayden, Jordan, and Scott will be the members of the Joint Committee on Printing, and that Senators
    Jordan, Pell, Clark, Cooper, and Scott will be the members of the Joint Committee on the Library. Also, committee
    ordered favorably reported the following measures: an original resolution providing for the preparation and
    printing of a new edition of the Senate Manual; an original resolution requesting $87,000 for its Subcommittee
    on Standing Rules of the Senate; three original resolutions authorizing payment of gratuities to survivors of
    deceased Senate employees; S. Con. Res. g, to print additional copies of prayers offered by the Reverend Peter
    Marshall in the Senate during the 8oth and 81st Congresses; S. Res. 22, to print as a Senate document a history
    of the Pima Indians and the San Carlos irrigation project; S. Res. 23, to print as a Senate document certain
    censuses of the Territory of New Mexico and Territory of Arizona; S. Res. 29, to print as a Senate document
    a compilation entitled "Mineral Potential of Eastern Montana-a Basis for Future Growth"; S. Res. 33, to print
    as a Senate document a report on the status of Colorado River storage project and participating projects; and
    the following resolutions requesting operating funds for the various Senate committees: Armed Services S. Res.
    37, to provide additional funds for the Committee on Armed Services ($175,000) (amended). Foreign Relations
    S. Res. 28, authorizing the Committee on Foreign Relations to examine and study the foreign policies of the
    U.S. ($135,ooo). Interior and Insular Affairs S. Res. 36, to provide additional funds for the Committee on Interior
    and Insular Affairs ($1os,ooo). Judiciary S. Res. 39, to study administrative practice and procedure ($15o,ooo).
    S. Res. 40, to investigate antitrust and monopoly laws of the U.S. ($543,500). S. Res. 41, to consider matters
    pertaining to Government charters, holidays, and celebrations ($7,500). S. Res. 42, authorizing a study of matters
    pertaining to constitutional amendments ($91,ooo) (amended). S. Res. 43, to investigate matters pertaining to
    constitutional rights ($195,ooo). S. Res. 44, to study matters pertaining to immigration and naturalization
    ($162,000). S. Res. 45, to study and examine the Federal judicial system ($1oo,ooo). S. Res. 46, to investigate
    the administration, operation, and enforcement of the Internal Security Act ($431,000) (amended). S. Res. 47,
    to investigate national penitentiaries ($s,ooo). S. Res. 48, to examine and review the administration of the
    Patent Office ($12o,ooo). S. Res. 49, to investigate problems created by the flow of refugees and escapees from
    communistic tyranny ($102,300). S. Res. so, to study revision and codification of the statutes of the U.S. ($4o,soo)
    (amended). S. Res. 51, to investigate the administration of the Trading With the Enemy Act ($6o,ooo). S. Res.
    52, to investigate juvenile delinquency ($220,000). Post Office and Civil Service S. Res. 13, authorizing the
    continuation of certain studies and the initiation of others by the Committee on Post Office and Civil Service
    ($1oo,ooo). S. Res. 14, authorizing the Committee on Post Office and Civil Service to employ one additional
    assistant. Public Works S. Res. 11, to provide additional funds for the Commit-- tee on Public Works ($no,ooo)
    (amended). Select Committee on Small Business S. Res. 32, to provide additional funds for the Select Committee
    on Small Business ($14o,ooo). Special Committee on Aging S. Res. 12, to extend the Special Committee on Aging
    through January 31,1966 ($213,000). Aeronautical and Space Sciences S. Res. 61, providing additional funds for
    the Committee on Aeronautical and Space Sciences ($gs,ooo). Banking and Currency S. Res. 10, authorizing the
    Committee on Banking and Currency to make certain investigations ($1o6,ooo). S. Res. 15, authorizing the Committee
    on Banking and Currency to investigate matters relating to public and private housing ($133,000). Government
    Operations S. Res. 54, authorizing the Committee on Government Operations to make certain studies as to the
    efficiency and economy of the operations of the Government ($435,000). S. Res. 56, to provide funds to study
    and evaluate effects of laws pertaining to proposed reorganizations in executive branch ($57,500). S. Res. 57,
    to provide funds for a study of certain aspects of national security and international operations ($go,ooo)
    (amended). S. Res. 58, to provide funds for the Subcommittee on Foreign Aid Expenditures of the Senate Committee
    on Government Operations ($57,500). S. Res. 59, authorizing a study of intergovernmental relationships between
    the U.S. and municipalities ($ 12g,ooo) (amended). Labor and Public Welfare S. Res. 24, authorizing the Committee
    on Labor and Public Welfare to examine, investigate, and study matters relating to migratory labor ($75,000).
    S. Res. 6o, to authorize additional staff for the Committee on Labor and Public Welfare. Also, committee approved
    a request permitting individual Senators to have their signature engraved on their Senate Gallery passes, provided
    that such engraving is at their own expense. Committee also approved a plan permitting individual Senators to
    req~est that electrostatic copy machines be placed in their offices on a rental basis. Minimum rental charges
    on such equipment would be paid by the Senate, but the costs of all additional copying charges and supplies
    would be charged to the Senator''s stationery account.'
