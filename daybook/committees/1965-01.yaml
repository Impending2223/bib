    adopting all committee amendments en bloc, which were thereafter considered as original text for purpose of
    further amendment. By unanimous consent, it was agreed that beginning at II a.m. Monday, February I, debate
    on any amendment, motion, or appeal (except motions to lay on table) shall be limited to 20 minutes, equally
    divided, except that debate on Hruska amendment No. II, to eliminate section on land stabilization, conservation,
