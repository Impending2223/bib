    Nuclear Explosives; and Gerald Johnson, Lawrence Radiation Laboratory, Livermore, Calif., all of the AEC. Hearings
    were adjourned subject to call. S. Res. I4, providing for the continuance of services of one additional clerical
    assistant to the staff of Committee on Post Office and Civil Service (S. Rept. 3), referred to Committee on
    Rules and Administration. Pages 166, 213 Electoral Count: Senate met in joint session with the House pursuant
    to provisions of S. Con. Res. I, providing for joint session in the Hall of the House on Wednesday, January
    6, I965, at I p.m. for the opening and counting of the electoral ballots of the several States for the election
    of President and Vice President (for tabulation of votes see House of Representatives item). After the Senate
    had returned to its chamber, Senator Jordan (North Carolina), one of the tellers on the part of the Senate appointed
    to count the electoral votes, announced the result of the count. Pages 323-324 Senate Rules: Two resolutions,
    as follows, to amend the cloture rule of the Senate were submitted, but when request was made for their immediate
    consideration objection was heard and the resolutions were ordered to lie over for I day under the rule: S.
    Res. 6, submitted by Senator Anderson for himself and Senator Morton; and S. Res. 8, submitted by Senator Douglas
    for himself and others. Pages 178-179 Committee Expenditures: S. Res. 7, to amend appropriations for certain
    subcommittees of the Judiciary Committee passed on February Io, I964, was submitted by Senator Dirksen for himself
    and Senator Mansfield, but was ordered to lie over under the rule after its immediate consideration was objected
    to. This resolution would provide an additional $28,500 for investigations by ~~bcommittee on Antitrust and
    Monopoly; $ro,ooo addttwnal for study by Subcommittee on Immigration and Naturalization; and $23,000 additional
