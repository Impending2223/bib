    nature of a substitute for the bill): Adopted: Lausche amendment to include the Little Miami River, Ohio, and
    the Little Beaver River, Ohio, among those to be studied; Jordan of Idaho amendment providing for the reporting
    by National Wild Rivers Review Board on demands for additional electrical capacity, particularly in relation
    to national emergency; and Kuchel amendment providing that State jurisdiction over the water of any stream in
    a wild river area shall be unaffected by this action to the extent that such jurisdiction may be exercised without
    impairing the purpose of the act; and Rejected: Allott-Simpson-Dominick amendment providing that when any portion
    of the waters of a stream are reserved for the purposes of this act, the laws of the State with respect to water
    and water rights shall be complied with and that water rights shall be subject to State law with respect to
    water allocation in years of shortage. Pending at adjournment was Morse amendment to the committee substitute
    barring acquisition by condemnation or exchange of any Oregon lands or waters as a part of this system. Pages
