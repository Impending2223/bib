  text: 'Subcommittee on National Parks and Recreation continued hearreceived from President relating to marine
    science affairs, together with second report of President to Congress on marine resources and engineering development-ref
    erred to Committee on Commerce. Pages 5929-5930 Gold Cover: It was agreed that on Tuesday, March 12, at conclusion
    of morning business, instead of Senator Stennis being recognized to call up resolution on standards and conduct,
    Senator Sparkman will be recognized to call up bill to eliminate the 25-percent reserve requirement for Federal
    Reserve notes. Majority leader stated that the standards and conduct resolution will be considered following
    disposition of this bill. Pages 5985-5986 Civil Rights: By 71 yeas to 20 nays (motion to reconsider tabled),
    Senate passed with amendment H.R. 2516, to prescribe penalties for certain acts of violence or intimidation.
    The amendment was committee amendment (in the nature of a substitute for the bill), which had been adopted March
    8 after adoption of modified J)irksen amendment No. 554, as amended (in the nature of a substitute for the committee
    substitute amendment), consisting of title I on interference with federally protected activities, and titles
    II and III on fair housing. Secretary of Senate was authorized to make technical and conforming amendments to
    the bill. Pages 5983-6002 Indians: Senate adopted conference report on H.R. 536, providing that the U.S. shall
    hold in trust for the CherOkee Nation certain Chilocco Indian school lands in Oklahoma. Page 6002 Urgent Supplemental
    Appropriations: Senate passed with amendments (motion to reconsider tabled) H.R. 15399, making urgent supplemental
    appropriations for fiscal year 1¢8, after taking the following actions on amendments and a motion to recommit:
    Adopted: All committee amendments en bloc, which were then considered as original text for purpose of further
    amendment; by 43 yeas to 42 nays, Clark amendment to add $25 million for Headstart program (Vice President voting
    to break tie); and Rejected: By 38 yeas to 42 nays (motion to reconsider tabled), Monroney amendment to provide
    $25,000 for salaries and expenses, Office of Secretary of Treasury (review of question of tax exemption from
    interest on certain municipal industrial revenue bonds). By 22 yeas to 64 nays, Senate rejected Williams (Delaware)
    motion to recommit the bill to Committee on Appropriations with instructions to report it back with aggregate
    appropriations therein reduced to $1,216,- 020,863 (same as budget estimates). Senate insisted on its amendments,
    asked for conference with House, and appointed as conferees Senators Hill, Hayden, Russell, Ellender, Holland,
    Byrd (W. Va.), Mundt, Young (N. Dak.), and Javits. Pages 6002-6031 Veterans: H.R. 12555, liberalizing laws relative
    to payment of veterans'' pensions, ''":''as passed without amendment, clearing bill for President''s signature.
    Pages 6033-6037 Saline Water Conversion: Senate passed with committee amendments S. 2912, authorizing funds
    for saline water conversion for fiscal year 1g69. Page 6037 Oahe Reservoir: H.R. 2901, to designate the Oahe
    Reservoir on the Missouri River in North Dakota and South Dakota as Lake Oahe, was passed without amendment.
    This action cleared bill for President''s signature. Pages 6037-6038 Gold Cover: Senate took up H.R. 14743,
    to eliminate the 25-percent reserve requirement for Federal Reserve notes. Page 6038 Confirmations: Eight nominations
    to positions in the receiving testimony from Edward P. Cliff, Chief, Forest Service, Department of Agriculture.
    Hearings continue tomorrow.'
