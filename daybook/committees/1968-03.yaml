  text: 'Subcommittee on Education continued its hearings on S. 3098, to extend and expand Federal programs for
    higher education, receiving testimony from the following witnesses: Prof. Joseph T. Sneed, Stanford University
    Law School; Dean Bayless A. Manning, Stanford University Law School; Dean John Scarlett, South Dakota University
    Law School; Robert M. O''Neil, professor of law, State University of New York at Buffalo; Dean Kenneth S. Tollett,
    Texas Southern University Law School; Prof. Morris L. Cohen, University of Pennsylvania Law School; Dean William
    B. Lockhart, University of Minnesota Law School; Dean Robert B. McKay, New York University Law School; and Prof.
    William W. Greenhalgh, Georgetown University Law Center, all representing the Association of American Law Schools;
    Brewster C. Denny, University of Washington, representing Council on Graduate Education for Public Administration;
    Earl M. Aldrich, Jr., University of Wisconsin; Carl J. Megel and Dr. Israel Kugler, both representing the American
    Federation of Teachers, AFL-CIO; Harry G. Green, Phillips Business College, Lynchburg, Va., representing the
    United Business Schools Association; and George T. Cody, Division of Social Studies, Cleveland Public Schools.
    Hearings continue on Tuesday, April 2. Bills Reported: Reports were filed as follows: Report entitled "Scientific
    Brain Drain Fr.om the Developing Countries" (23d report) (H. Rept. 1215); Private bills, H.R. 15591, S. 68,
    amended, n29, amended (H. Repts. 1216-1218); H.R. 15198, joint industry promotion fund, amended (H. Rept. 1219);
    H.R. 15822, to provide for the establishment of the Robert S. Kerr Arboretum and Nature Center (H. Rept. 1220);
    H.R. 13781, regarding extension of the Sea Grant College program, amended (H. Rept. 1221); and H.R. 15190, regarding
    site for a sea-level Atlantic- Pacific Ocean Canal (H. Rept. 1222). Page 8078 Late Report: Permission was granted
    to the Committee on Merchant Marine and Fisheries to file a report by midnight Friday, March 29, on H.R. 15979,
    regarding the effect of pesticides on fish. Page 8057 Save Your Breath Month: Agreed to the Senate amendment
    to H.J. Res. 933, proclaiming National Jewish Hospital Save Your Breath Month. Pages 8057-8058 Purchase-U.S.
    Obligations: By a record vote of 359 yeas to 5 nays the House passed H.R. 15344, to extend for 2 years the authority
    of Federal Reserve banks to purchase U.S. obligations directly from the Treasury. Rejected a motion to recommit
    the bill to the Committee on Banking and Currency by a voice vote. H. Res. n13, the rule under which the legislation
    was considered, was adopted earlier by a voice vote. Pages 8058-8062 Calendar Wednesday: Agreed to dispense
    with Calendar Wednesday business of April 3. Page 8062 Adjournment: Adjourned at 2:00 p.m.'
