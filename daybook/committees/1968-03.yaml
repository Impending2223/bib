    services and automobiles, and to expedite payments of estimated tax by corporations, adopting, by 51 yeas to
    32 nays (motion to reconsider tabled), the remaining committee amendment comprising section 5 of the bill respecting
    interest on industrial development bonds. Senate rejected, as shown, the following two amend~ ments proposed
    to Williams (Delaware)-Smathers amendment No. 662 (in the nature of a substitute for the bill) constituting
    a proposed "Balance of Payments and Domestic Economy Act of 1968": by 33 yeas to 56 nays (motion to reconsider
    tabled), Long of Louisiana amendment to eliminate provisions for (1) freeze on number of civilian employees
    in the executive branch to those employed September 20, 1966, (2) moratorium on public works projects, (3) limitation
    on expenditures during.fiscal year 1969 to $180.1 billion, except as to certain stated expenditures, and (4)
    instructions to Director of the Budget to reexamine current budget and to propose reduction of at least $rn
    billion in obligational authority. The Long amendment would have retained those basic provisions of the bill
    in the substitute, as well as the proposal in the substitute for surcharge on income tax for 1968 of 7.5 percent
    for individuals and 10 percent for corporations, and for 1969, 5 percent for each; and, by 35 yeas to 52 nays
    (motion to reconsider tabled), Prqxmire amendment to eliminate provisions in the substitute for income tax surcharge.
