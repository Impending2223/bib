    for President H.R. 14743, to eliminate the 25-percent reserve requirement for Federal Reserve notes, after rejecting
    amendments, as follows: By 18 yeas to 64 nays, modified Miller amendment No. 6n to limit net aggregate expenditures
    during fiscal 1¢9 to $139.4 billion, with exceptions for certain increases in defense costs and in interest
    on public debt, and providing that this legislation shall take effect upon enactment of a IO-percent income
    tax surcharge; by 17 yeas to 64 nays (motion to reconsider tabled), Curtis amendment No. 6o6 to defer effectiveness
    of legislation until there is a balanced budget or the President submits an estimated balanced budget; by 35
    yeas to 46 nays, Fannin amendment No. 6o8 providing for a study of U.S. gold policies if value of its gold stocks
    drops below $10 billion; by 37 yeas to 39 nays, modified Dominick amendment No. 610 providing that no nation,
    except for Great Britain, in arrears on debt to U.S. shall be entitled to exchange dollars for gold; and by
    19 yeas to 58 nays, Allott amendment No. 609 barring issuance of Federal Reserve notes in any year if it will
    result in expansion of the principal amount of such notes by more than four per centum. Pages 6559-6577, 6579-6607
    Standards and Conduct: Order was entered that when Senate completes its business on Friday, March 15, it will
    adjourn until noon Monday, March 18, when at conclusion of routine morning business Senator Stennis will be
    recognized to call up resolution on Senate standards and'
