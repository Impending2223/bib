  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following measures: S. 3102, to postpone
    for 2 years the date on which passenger vessels operating solely on the inland rivers and waterways must comply
    with certain safety standards; S. 3135, authorizing funds for the Corporation for Public Broadcasting for fiscal
    year 1g69; S. 2123, providing for the control of the alewife and other fish which adversely affect the ecological
    balance of the Great Lakes (amended); H.R. 9473, authorizing Federal Maritime Commission to permit a carrier
    to refund a portion of freight charges collected from a shipper; H.R. 12639, to set forth conditions under which
    cruise ships must operate (amended); H.R. 14401, granting to masters of certain U.S. vessels a lien on such
    vessels for wages and certain other disbursements; and an original concurrent resolution to provide for an expanded
    effort in weather predictions. Also, committee, by a vote of 12 to 5, rejected S. 1365, to amend the Federal
    Power Act to exempt cooperatives and certain public utilities from FPC jurisdiction.'
