  text: 'Subcommittee on Communications held hearings on the following bills: S. 708, relating to FCC consideration
    of construction permits and broadcast station license applications where Members of Congress are involved; S.
    I005, to give the FCC additional authority to grant specific temporary authorizations for 6o days for certain
    nonbroadcast operations; and S. I I93, requiring that petitions for intervention in hearings for a broadcasting
    license be filed with the FCC within 30 days after publication of the issues in the Federal Register. Testimony
    was received from Senator Proxmire, who directed his remarks to S. 708; E. William Henry, Chairman, Federal
    Communications Commission, who directed his remarks to all of the bills; and Frederick W. ford, member of the
    FCC, who submitted testimony on S. 708. Subcommittee recessed subject to call.'
