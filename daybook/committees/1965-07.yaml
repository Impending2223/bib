  exec: true
  text: 'Committee, in executive session, ordered favorably reported with amendment S. I766, authorizing Secretary
    of Agriculture to make loans to public agencies and nonprofit corporations for the development of water systems
    serv.: ing rural areas, and S. 7, providing for the establishment of Spruce Knob-Seneca Rocks National Recreation
    Area, W.Va.; and without amendment H.R. 5508, to facilitate in several regards the administrative work of the
    Secretary of Agriculture; H.R. 8620, to take into consideration floods and other natural disasters in reference
    to the feed grains, cotton, and wheat programs for I965; S. I270, extending for 2 years the definition of "peanuts,"
    which is now in effect under the Agricultural Adjustment Act; S. 1271, extending for 2 years provisions of the
    Agricultural Adjustment Act permitting the lease of tobacco acreage allotments; and S. 2294, to extend for I
    additional year the International Wheat Agreement Act of 1949. Committee also approved the following seven watershed
    projects: Cottonwood Creek, Nebr.; Lakin, Kans.; Mills Creek, Fla.; Mitchell Swamp-Pleasant Meadow Branch, S.C.;
    Standing Pine Creek, Miss.; Turkey Creek, Iowa; and Willis River, Va.'
