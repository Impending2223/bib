  text: 'Subcommittee on Financial Institutions held hearings on the following six bills: S. 1308, authorizing revised
    procedures for the destruction of unfit Federal Reserve notes; S. 1309, authorizing checks to be drawn in favor
    of banking organizations for the credit of a person''s account; S. 1556, authorizing the Board of Governors
    of the Federal Reserve System to qelegate certain of its functions; S. 1557, to enable Federal Reserve banks
    to invest in certain obligations of foreign governments; s. 1558, to amend the Federal Reserve Act with regard
    tQ limit~­ tion on loans by member banks to their executive officers; and S. 1559, enabling Federal Reserve
    banks to extend credit to member banks and others in accordance with current economic conditions. Witnesses
    heard were William McC. Martin, Jr., Chairman, Board of Governors of the Federal Reserve System, who directed
    his remarks to all of the bills; John K. Carlock, Fiscal Assistant Secretary, Department of the Treasury, who
    directed his remarks to S. 1308 and S. 1309; and Joseph J. McNally, Directorate of Accounting and Finance, Headquarters
    USAF, Department of Defense, who testified with regard to S. 1309. Following these hearings, subcommittee in
    executive session voted to report favorably to the full committee, and without amendment, the first five of
    these bills- S. 1308, 1309, 1556, 1557, and 1558.'
