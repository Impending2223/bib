  text: 'Committee continued hearings to receive testimony on long-range program and research needs in aging and
    related fields. Witnesses heard were Hobart Jackson, Stephen Smith Home, Philadelphia; Lionel M. Swan, National
    Medical Association; Miss Jeweldean Jones, National Urban League; Glen H. Beyer, Center for Housing and Environmental
    Studies, Cornell University; Louis Gelwicks, Rossmore-Cortese Institute, Los Angeles; Wilma Donahue, Director
    of Gerontology, University of Michigan; Carl Eisdorfer, professor of medical psychiatry, Duke University; and
    Bernard L. Strehler, professor of biology, University of Southern California. Hearings were adjourned subject
    to call. regarding the San Rafael Wilderness, and appointed as conferee Representative Burton of Utah. Page
    35134 Public Land Law R eview Commission: Agreed to Senate amendments to H.R. 12121, to extend the life of.
    the Public Land Law Review Commission, thus clearing the measure for the President. Page 35134 Federal Judicial
    Center: By a record vote of 231 yeas to 126 nays adopted the conference report on H.R. 6n 1, th~ Federal Judicial
    Center, thus clearing the measure for the White House. Pages 35135-35143 House Beauty Shop: Adopted H. Res.
    1000, to create a Select Committee on Operation of the House Beauty Shop. Appointed as members of the committee,
    Representatives Griffiths, Green of Oregon, and May. Page 35143 Meat Inspection: By a record vote of 336 yeas
    to 28 nays the House adopted the conference report on H.R. 12144, the Federal Meat Inspection Act, and sent
    the legislation to the Senate. Pages 35144-35164 Supplemental Appropriation: Granted permission that it be in
    order on Tuesday, December 12, or any subsequent day next week to consider a supplemental appropriation bill.
    Pages 35164-35165 Late Reports: Granted permission to conferees to file conference report on S. 2388, the Economic
    Opportunity Amendments, l?Y midnight on Thursday, December 7; conferees to file conference report on H.R. 4765,
    regarding the Bank Holding Company Act, by midnight on Thursday, December 7; conferees to file reports on H.R.
    6167, regarding loan of naval vessels; and H.R. 13510, the Uniformed Services Pay Act, by midnight Saturday,
    December 9; and conferees to file conference report on H.R. 7977, the Postal Revenue and Federal Salary Act,
    by midnight, Saturday, December 9'
