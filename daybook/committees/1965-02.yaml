  next: '1965-02-25'
  text: 'Committee continued its hearings on the President''s Economic Report, having as its witnesses Seymour Harris,
    professor of economics, University of California at La Jolla; and John Galbraith, professor of economics, Harvard
    University. Hearings continue tomorrow. sentatives on the Board of the Bank to vote aga~nst any loan from the
    Fund for any project or activity of a country which has expropriated American property without adequate compensation;
    and, by 49 yeas to 32 nays (motion to reconsider tabled), Gruening amendment to make U.S. contributions conditional
    upon repayment in U.S. dollars of at least one-third the aggregate of loans made from such contributions; and
    Rejected: By 34 yeas to 48 nays, Long of Louisiana amendment (as a substitute for Morse "expropriation" amendment)
    stating it to be sense of Congress that during any period that foreign aid to a particular country is suspended
    by President because of expropriation of American property without adequate compensation, the U.S. Executive
    Director of the Bank shall cast U.S. votes against any loans by the Fund to such country; and, by 37 yeas to
    44 nays, Lausche amendm~nt to reduce proposed capitalization increase for the Fund from $750 million to $480
    million. Senate insisted on its amendments, asked for conference with House, and appointed as conferees Senators
    Fulbright, Sparkman, Mansfield, Hickenlooper, and Aiken. S. 8os, companion bill, was indefinitely postponed.
    Pages 3598, 3605-3618. Authority To Report: Permanent Subcommittee on Investigations of the Committee on Government
    Opera-. tions was authorized until April 5 to file its report on narcotics and crime. Joint Economic Committee
    was granted extension of time until March 17 to file its report on the President''s. Economic Report. Pages
    3555-3556 Water Resources: Senate passed with committee amendments S. 21, proposed Water Resources Planning
    Act (motion to reconsider tabled). Pages 3621-3626'
