  heading: APPROPRIATIONS-AGRICULTURE SUPPLEMENTAL
  exec: true
  text: 'Committee, in executive session, ordered favorably reported with amendment H.J. Res~ 234, making supplemental
    appropriations for fiscal year I965 for certain activities of the Department of Agriculture. As approved by
    the committee, the language of the bill relative to the exportation of agricultural commodities to the United
    Arab Republic would read as follows: "Provided, That no part of this appropriation shall be used during the
    fiscal year 1965 to finance the export of any agricultural commodity to the United Arab Republic under the p:-ovisions
    of title I of such Act, except when such exports are necessary to carry out the Sales Agreement entered into
    October 8, 1962, as amended, and if the President determines that the financing of such exports is in the national
    interest." Prior to approval of this measure, committee heard testimony the~eon from George W. Ball, Under Secretary
    of State; and Clarence Eskildsen, Foreign Agricultural Service, Department of Agriculture.'
