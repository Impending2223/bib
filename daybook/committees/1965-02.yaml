    (b) civil aeronautics (including Federal Aviation Agency and Civil Aeronautics Board), (c) inland waterways,
    (d) safety (including highway traffic and air safety), and (e) railroad labor. Communications and Power.-Representatives
    Rogers of Texas, chairman, Moss, Kornegay, Van Deerlin, Rooney of Pennsylvania, Murphy of New York, Younger,
    Broyhill of North Carolina, and Harvey. Jurisdiction: (a) Interstate and foreign communications, (b) Weather
    ~ureau, (c) petroleum and natural gas (including interstate oil compact), (d) interstate electric power. Commerce
    and Finance.-Representatives Macdonald, chairman, Dingell, Huot, Farnsley, Keith, and Curtin. Jurisdiction:
    (a) Interstate and foreign commerce generally (including Federal Trade Commission and labeling), (b) securities
    and exchanges, (c) railroad retirement and unemployment, (d) newsprint, pulp and paper, and brand names, and
    (e) Trading With the Enemy and War Claims Acts. Special Subcommittee on Investigations.-Representatives Harris,
    chairman, Friedel, Rogers of Florida, Van Deerlin, Huot, Williams, Younger, Curtin, and Harvey of Michigan.
    Chairman Harris and Mr. Springer are members of each subcommittee, with voting privileges.'
