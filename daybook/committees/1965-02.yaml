  text: 'Subcommittee on Education continued its hearings on S. 370, to improve facilities and quality of elementary
    and secondary education in the U.S., receiving testimony from Senator Bartlett; Secretary of Labor W. Willard
    Wirtz; and the following panel of witnesses representing the National Education Association: Robert McKay, NEA
    Legislative Commission, Burlingame, Calif.; Dr. A. W. Beattie, superintendent of schools for Allegheny County,
    Pittsburgh, Pa.; Ralph Norris, superintendent of schools for Polk County, Des Moines, Iowa; Joseph M. Brooks,
    Los Angeles Teachers Association; and Dr. Thomas Lantos, California Teachers Association. In an afternoon session
    subcommittee received testimony from Maurice B. Mitchell, president, Encyclopaed.ia Britannica; Dr. Harold Cottingham,
    Florida State University, and Dr. Herbert Stern, Baltimore City Public Schools, both representing the American
    Personnel and Guidance Association; Emerson Brown, president, American Textbook Publishers Institute; Dan Lacey,
    American Book Publishers Council; and William G. Harley, president, and Jerrold Sandler, National Educational
    Radio, and Chalmers Marquis, Educational Television Stations, all representing the National Association of Educational
    Broadcasters. Hearings continue tomorrow.'
  page: D29
