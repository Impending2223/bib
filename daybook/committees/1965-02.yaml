  committee: Committee on Commerce
  code: 320
  name: Commerce
  heading: COMMITTEE BUSINESS
  text: 'Committee held its executive organizational meeting, where it adopted its rules of procedure for the 89th
    Congress, and set the first and third Tuesdays of each month as its regular meeting days. Committee.appointed
    Senators Neuberger and Morton to be members of the Board of Visitors to the Coast Guard Academy, and Senators
    Bartlett and Prouty to be members of the Board of Visitors to the Merchant Marine Academy. Committee ordered
    favorably reported an original resolution (S. Res. 76) requesting $442,700 for operation of the committee for
    the 12-month period ending January 31, 1966; and 871 routine nominations in the Coast Guard. Also, committee
    authorized the chairman to introduce a resolution clarifying the committee''s jurisdiction over legislation
    relating to weather and oceanographic matters. Committee announced establishment of and appointment of membership
    to subcommittees as follows: Merchant Marine and Fisheries: Senators Magnuson, chairman, Pastore, Bartlett,
    Hart, Brewster, Neuberger, Prouty, Dominick, and Cotton. Communications: Senators Pastore, chairman, Monroney,
    McGee, Hartke, Hart, Bass, Scott, Prouty, and Pearson. Aviation: Senators Monroney, chairman, Bartlett, Lausche,
    Hart, Cannon, Brewster, Cotton, Morton, and Scott. Surface Transportation: Senators Lausche, chairman, Hartke,
    McGee, Cannon, Neuberger, Bass, Morton., Pearson, and Dominick. Committee also appointed the following special
    subcommittees: Automobile Marketing Practices Subcommittee: Senators Monroney, chairman, Hart, and Scott. Freight
    Car Shortage Subcommittee: Senators Magnuson, chairman, Monroney, McGee, Pearson, and Dominick. Subcommittee
    To Study Textile Industry: Senators Pastore, chairman, McGee, and Cotton. Study of Federal Power Commission
    Procedures: Senators McGee, chairman, Monroney, and Morton.'
  page: D32
  pdf: 30
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1965-pt23/pdf/GPO-CRECB-1965-pt23-1.pdf#page=30
