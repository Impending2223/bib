  text: Met in executive session and ordered r:eported favorably to the House H.R. 10392, to authorize the Commissioners
    of the District of Columbia to locate a portion of a vehicular tunnel under parts of the U.S. Capitol Grounds
    and the U.S. Botanic Garden grounds; H.R. 9934 (amended), a private bill; H.R. 6197 (amended), to reenact and
    amend the legislation authorizing the Clinton Bridge Commission to construct and operate a bridge across the
    Mississippi River. at Clinton, Iowa, to authorize the issuance of bonds to finance the project; H.R. 8078, to
    amend the act of July 26, 1956, to authorize the Muscatine Bridg~ Commission to constru.ct, maintain, and operate
    a bridge across the Mississippi River at or near the city of Muscatine, Iowa, and the town of Drury, Ill.; H.R.
    9720, to authorize a study of dust control measures at Long Island, Port Isabel, Tex.; H.R. 7654, to designate
    the new lock on the St. Marys River at Sault Ste. Marie, Mich., as John A. Blatnik lock; H.R. 10787, to designate
    a bridge over the Mississippi River in the vicinity of Memphis, Tenn., as the "Clifford Davis Bridge"; and H.
    Con. Res. 45, to express the sense of the Congress that the Administrator of the St. Lawrence Seaway Corporation
    should cooperate with other governmental authorities in the United States and with Canadian authorities to reduce
    oil pollution. Various public building prospectuses and navigation and beach erosion resolutions were also approved.
    Prior to the full committee meeting the Subcommittee on Rivers and Harbors approved, in executive session, H.R.
    9934 (amended), H.R. 6197 (amended), H.R. 8078, H.R. 9720, and H. Con. Res. 45 (titles above). The subcommittee
