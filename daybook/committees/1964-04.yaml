    to be U.S. district judge for the eastern district of South Carolina; Robert W. Hemphill, to be U.S. district
    judge for the eastern and western districts of South Carolina; Ray McNichols, to be U.S. district judge for
    the district of Idaho; and Sidney L. Christie, to be U.S. district judge for the northern and southern districts
    of West Virginia; and 26 private immigration bills (S. 858, 2088, 2105, 2219, 2225, 2233, 2336, 2338, 2342,
    2410, 2436, 2449, 2490, H.R. I 179, 1252, 1266, 1382, 1435, 1439, 3654, 5083, 6133, 6568, 6837, 846g, and 9573).
    The committee also approved the annual report of its Subcommittee on Juvenile Delinquency for the 8Jth Congress,
    2d session; and the following annual reports of its subcommittees for the 88th Congress, 1st session: Trading
    With the Enemy; Constitutional Amendments; Improvements in Judicial Machinery; Patents, Trademarks, and Copyrights;
    and Constitutional Rights. Committee -indefinitely postponed further action on 16 private immigration bills
    (S. 393, 712, 906, 950, 952, 1164, 1450, 1630, 1714, 1813, 1913, 1955, 2145, 2412, 2683, and H.R. 1385).'
