    to the credit of the Pawnee Tribe of Oklahoma. Heard testimony from Representatives Tollefson (H.R. 2120) and
    Battin (H.R. 4013); and Department of the Interior officials (H.R. 2120, 4535, S. n69, H.R. 8080, and 4013).
