  heading: HILL-BURTON ACT
  bills:
  - H.R. 10041
  - S. 920
  - S. 1005
  - H.R. 9689
  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 10041 (amended),
    the Hill-Burton Hospital Construction Act; S. 920, to provide for issuance of authorizations, but not licenses,
    for alien amateur radio operators to operate their stations in the United States, its possessions, and Puerto
    Rico provided there is a reciprocal agreement between the United States and the alien''s government; S. 1005,
    to authorize the Federal Communications Commission to grant special temporary authorizations for 60 days for
    certain nonbroadcast operations; S. n93, to require that petitions for intervention in hearings for a broadcasting
    license be filed with the Federal Communications Commission within 30 days after publication of the issues in
    the Federal Register; and H.R. 9689 (amended), to declare a portion of Bayou Black and Bayou Terrebonne, La.,
    nonnavigable waterways of the United States. Principal provisions of H.R. 10041, as ordered reported: The bill
    as ordered reported by the committee would accomplish the following: (1) The bill extends the present Hill-Burton
    hospital construction program which expires June 30, 1964, to June 30, 1¢9. (2) The bill authorizes appropriations
    for construction and modernization of hospitals ranging from $150 million for.fiscal year 1¢5 through $180 million
    annually for the last 2 years of the program. Of these amounts, $20 million is specifically earmarked for modernization
    in fiscal year 1966, $35 million in 1¢7, $so million in 1968, and $ss million in 1¢9. The bill authorizes the
    States to transfer sums from the modernization category to new construction, in an aggregate amount not exceeding
    $150 million total for new construction in any fiscal year. (3) The bill consolidates nursing home and chronic
    disease categories and increases the combined authorization by $30 million (to $10 million) in fiscal 1¢5. (4)
    The bill adds grants for areawide health facility planning in metropolitan and other areas ($2.5 million in
    fiscal 1965 and $s million in each of the next 4 years, with 50 percent Federal and 50 percent State matching).
    (5) The bill permits States to use. 2 percent of their allotments (not to exceed $so,ooo a year) to meet increases
    over current cost levels of State administration of the construction program, on a so-so matching basis.'
