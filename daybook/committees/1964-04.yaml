    to ap-, point a joint committee to make arrangements for the inauguration of the President-elect and Vice Presidentelect
    on January 20, 1¢5; H. Con. Res. 29, to print additional copies of a Veterans'' Benefits Calculator; H. Con.
    Res. 243, to print as a House document a form suitable for framing of the inaugural address of President Kennedy;
    H. Con. Res. 247, to print additional copies of H. Doc. 104, entitled "Our Flag"; H. Con. Res. 266, to print
    as a House docum~nt the Constitution of the U.S. together with the Declaration of Independence; S. Con. Res.
    73, to print additional copies of parts 2 and 3 of hearings of the Joint Committee on Atomic Energy on AEC authorizing
    legislation; S. Res. 240, to print as Senate document a report on implementation of the Humphrey amendment to
    the 1961 Foreign Assistance Act relating to cooperatives abroad; S. Res. 276, to print as a Senate document
    the Seventh Annual Report on the Status of the Colorado River Storage Project and Participating Projects; S.
    Res. 289, to print additional copies of a committee print entitled "Administration of National Security: Selected
    Papers"; S. Res. 300, to print a Senate document on the Federal prison system; S. Res. 302, to print as a Senate
    document a compilation entitled "World Communism-A Selected Bibliography"; an original resolution authorizing
    continuance of the Senate Youth Program; an original resolution authorizing printing as a Senate document a
    revised edition of S. Doc. 92 (87th Cong.) entitled "Federal Corrupt Practices and Political Activities"; an
    original resolution authorizing printing as a Senate document the "Election Law Guidebook"; an original resolution
    authorizing printing as a Senate document the 66th annual report of the DAR; an original resolution authorizing
    an additional $36,300 for operation of the Senate restaurant; and three original resolutions authorizing payment
    of gratuities to survivors of three deceased Senate employees. Committee also approved (1) a report on the reimbursable
    services for temporary committee personnel borrowed from executive agencies, (2) a proposed new legislative
    buzzer and light system which would eliminate the five ring signal and would provide a six ring signal indicating
    the end of the morning hour, and (3) a contract between the Joint Economic Committee and Ray Ward, of Arlington,
    Va., concerning economic aspects of military procurement and supply.'
