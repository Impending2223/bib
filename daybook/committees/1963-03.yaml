  text: 'Subcommit~ tee on Veterans'' Affairs held and concluded hearings on the following bills: S. 274, S. 342,
    and S. 625) bills to prov~de Alaskan and Hawaiian veterans care in private hospttals under contract to the VA;
    S. 331, extension of grants-in-aid to the Republic of the Philippines for the hospitalization of Commonwealth
    Army veterans; S. 384, to prohibit the eviction of dependents of military personnel where the monthly rental
    does not exceed $135; S. 412, providing for a waiver of indebtedness to the U.S. in certain cases arising out
    of default on loans guaranteed or made by the VA; and S. 449, liberalizing provisions of the law relating to
    automobiles for certain disabled veterans. Testimony, as indicated, was re~ ceived as follows: Senators Bartlett
    and Gruening, on S. 625; Senator F ong, on S. 342 and S. 625; Senator Inouye, on S. 274; R. P. Bland, Assistant
    General Coun~ sel, who was accompanied by other Veterans'' Adminis~ tration officials, who submitted testimony
    on all of the bills Lt. Col. Norman Faulknor, U.S. Air Force, repre~ senting the Department of Defense, who
    testified in connection with S. 384; and Francis W. Stover, Veterans of Foreign Wars, and Charles Huber, Disabled
    Ameri~ can Veterans, both of whom discussed all of the bills on the agenda. The chairman announced that the
    record would re~ main open on this proposed legislation until Wednesday, March 20, for the inclusion of additional
    written material.'
