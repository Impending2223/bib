  heading: NOMINATION, AND COMMITTEE RULES
  exec: true
  text: 'Commit~ tee, in executive session, ordered favorably reported the nomination of William J. Hartigan, to
    be an Assistant Postmaster General. Also, c~mmittee adopted an amendment to its rules dealing with procedures
    in handling postmaster nomi~ nations, ¥ follows: Rule 8. When a nomination for an appointment is referred to
    the committee, the name of the nominee shall be referred to both Senators from the State in which the nominee
    resides. If no objection is made by either Senator within 30 days of the date of referral or if no response
    is received during that period, the nomination shall be considered as not having been contested. If either Senator
    makes known his objection within 30 days of the referral, or. if there is substantial objection from elsewhere,
    the nomination will be referred to the standing Subcommittee on Contested Nominations. This subcommittee, consisting
    of three members, will report as soon as possible to the committee. If the committee or the subcommittee decides
    that a hearing should be held, the subcommittee will fix the hearing date, make a timely insertion in the Congressional
    Record of the date decided upon, and notify both Senators of the ''State involved. All interested parti~ will
    be. given an opportunity to be heard at the hearing. The subcommittee will not report to the full committee
    until after the hearing date.'
  page: D84
  pdf: 82
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1963-pt21/pdf/GPO-CRECB-1963-pt21-1.pdf#page=82
