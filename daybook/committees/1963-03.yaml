  text: 'Committee concluded its hearings in connection with technical capabilities of detecting and inspecting
    a nuclear weapons test ban after receiving testimony from the following witnesses: Dr. J.P. Ruina, Director,
    and Dr. A. Schardt, both of Advanced Research Projects Agency, Department of Defense; Maj. Gen. A. W. Betts,
    Director, Division of Military Application, AEC; Comdr. Donald Chandler, Chief of VELA-Sierra Branch, ARPA;
    Dr. Edward Pierce, Los Alamos Scientific Laboratory, New Mexico; Maj. John Poulspn, Chief of VELA-Hotel Branch,
    ARPA. These witnesses testified generally with regard to detection of high altitude nuclear tests. Testimony
    was also received from Dr. Franklin Long, Assistant Director, and other officials of the Arms Control and Disarmament
    Agency, who discussed technical aspects of nuclear weapons test ban proposals.'
