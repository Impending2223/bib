    Act regarding eommunications service involving electrical transmission of sounds, pictlires, etc. (amended);
    H.R. I2653, increasing limitation on amount of loans which may be insured under subtitle A of the Consolidated
    Farmers Home Administration Act of I96I; H.R. I2855, to amend the Agricultural Adjustment Act with regard to
    the lease and transfer of tobacco acreage allotments; S. 3370, granting to the State of Wyoming jurisdiction
    over the Pole Mountain District within Medicine Bow National Forest; and S. 3756, relating to small farm wheat
    acreage allotments. Also, committee approved the following four watershed projects: Crooked Bayou, Ark.; West
    Fork Pond River, Ky.; and Hardin Creek and Mill Creek, Tenn.'
