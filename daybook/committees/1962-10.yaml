  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 13241, to
    amend section 309 of the Food and Agriculture Act of 1g62; and H.R. 13188, to provide for adjustments in yields
    resulting from irrigation. Passed over without prejudice H.R. 10101, to provide for a program of agricultural
    land development in Alaska; S. 3589, to acquire certain lands in Wright County, Minn., and exchange them with
    the State of Minnesota for State-owned lands in the Superior National Forest; and S. 3517, to establish and
    carry out a program to promote the flow of domestically produced lumber in commerce. Discussed H.R. 10708, regarding
    communication service for the transmission of voice, sounds, signals, pictures, writing, or signs of all kinds
    through the use of electricity; and H.R. 12688, to encourage and assist the several States in carrying on a
    program of forestry research.'
