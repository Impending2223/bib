  text: Committee, in executive session, ordered favorably reported the nominations of Llewellyn E. Thompson, of
    Colorado, to be Ambassador at Large; Dr. Leona Baumgartner, of New York, to be Assistant Administrator for Human
    Resources and Social Development, AID; Hollis B. Chenery, of California, to be Assistant Administrator for Program
    Review and Coordination, AID; W. Walton Butterworth, of Louisiana, to be Ambassador to Canada; and John M. Leddy,
    of Virginia, to be U.S. representative to the Organization for Economic Cooperation and Development. Committee
    also approved with amendment S. 3679, authorizing funds to enable the U.S. to extend an invitation to the Food
    and Agricultural Organization of the U.N. to hold a World Food Congress in the U.S. in r¢3. Prior to this action,
    in open session, Messrs. Thompson and Chenery, and Dr. Baumgartner, were present to testify and answer questions
    on their own behalf. Testimony on S. 3679 was received from Harlan Cleveland, Assistant Secretary of State for
    International Organization Affairs.
