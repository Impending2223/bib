  text: 'Committee issued the following release: The chairman has announced Comm''ittee on Finance will hold very
    limited hearings of 2 or 3 days on the additional amendments to the foreign income tax provisions of H.R. 10650
    proposed by Secretary of Treasury on May 10. It is unlikely that hearings can be held before the middle of June.
    Notification of hearing dates accompanied by Treasury draft of proposed amendments will be mailed out Thursday,
    May 31. Written statements will be recommended because it will be impossible to hear all who may desire to present
    testimony in the 2- or 3-day time allotted for the additional hearings. Chairman has stated that time limitation
    of 10 minutes for each witness will be strictly enforced. All requests to testify will be held until after the
    release of the Treasury statement and determination made as to whether desired testimony is within the scope
    of the hearings. Shall schedule as many who desire to testify as possible to hear within the allotted time and
    accept written statement from the others.'
