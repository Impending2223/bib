  text: 'Committee, in executive session, ordered favorably reported with an amendment in the nature of a substitute
    H.R. 9075, increasing military basic pay. As approved by the committee, the ''overall average increase in basic
    pay for all active-d~ty personnel would be 10.4 percent. Major provisions of the bill would (r) leave unchanged
    the House rates for increases for personnel with less than 2 years'' service. These increases average 17.3 percent
    in basic pay for enlisted personnel and 22 percent for commissioned personnel; (2) provide a flat 6 percent
    for officers with over 2 years'' service; (3) provide a flat rr-percent increase in basic pay for enlisted personnel
    with over 2 years'' service; (4) authorize an increase of $ro a month from $55 to $65 in hostile fire pay, which
    would affect all personnel in Vietnam; and (5) provide for increase in retired pay based on advances in the
    Consumer Price Index. The committee also ordered favorably reported H.R. 4905, to convey certain real property.
    of the Federal Governm-ent to Okaloosa County, Fla.; H. Con. Res. roo, expressing approval of Congress for disposal
    of raw silk and silk noils from the national stockpile; the-nominations of Harold Brown, to be Secretary of
    the Air Force; Norman S. Paul, to be Under Secretary of the Air Force; Thomas D. Morris, to be an Assistant
    Secre tary of Defense; and 73 nominations in the Army, Navy, Marine Corps, and Air Force. BALANCE OF PAYMENTS:
