    of the 18th and subsequent decennial censuses, of congressional districts composed of contiguous and compact
    territory for the election of Representatives. Page 17738 Land Claims: Rereferred from the Committee on the
    Judiciary to the Committee on Interior and Insular Affairs H.R. 10256, to render the assertion of land claims
    by the U.S. based upon accretion or avulsion subject to legal and equitable defense to which private persons
    asserting such claims would be subject. Page 17738 NASA Authorization: The House passed by a record vote of
    342 yeas to 53 nays H.R.. 10340, the National Aeronautics and Space Administration Authorization Act, 1g68.
