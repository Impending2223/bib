    the application of local law in determining the effect of claimant''s contributory negligence, to clarify the
    procedure for appeal from certain claims determinations, and to limit the amount of attorney fees thereunder,
    amended (H. Rept. 377). Page 16838 Recess: Recessed at 12:06 p.m. to I p.m. out of respect for deceased Representative
    J. Arthur Younger. Page 16659 Memphis State University: Agreed to Senate amendments to H.R. 47I7, to authorize
    the conveyance of certain lands owned by the U.S. to the State of Tennessee for the use of Memphis State University,
    Memphis, Tenn., thus clearing the measure for the White House. Page 16659 Debt Limit: By a record vote of 2I7
    yeas to I¢ nays the House passed H.R. 10867, to increase the public debt limit from $285 billion to $358 billion.
    Rejected by a record vote of I9I yeas to 223 nays a recommittal motion to reduce the limit to $336 billion.
    H. Res. 597, the rule under which the legislation was considered, was adopted earlier by a division vote of
    59 yeas to 15 nays. Pages 16659-16690 Late Reports: Granted permission to the Committee on District of Colu,mbia
    to file sundry reports by midnight Saturday, June 24.. Page 16690 Condolence Resolution: Adopted H. Res. 66I,
    expressing profound sorrow at the death of Representative J. Arthur Younger, and appointed as members of the
    funeral committee all of the Representatives in the California delegation. Page 16837 Adjournment: Adjourned
    at 6:oi p.m.'
