    Columbia Univer.sity; Dr. James E. Birren, Rossmoor-Cortese Institute, UCLA; and a Panel on Effects of Retirement
    composed of Dr. Ethel Shanas, professor of sociology, University of Illinois; Dr. Edward L. Bortz, former president,
    American Medical Association; and Dr. Adrian Ostfeld, college of medicine, University of Illinois. Hearings
    were recessed subject to call. This passage was subsequent! y vacated and S. 953 was passed in lieu after being
    amended to contain the House~ passed language. Rejected by a voice vote a motion to recommit the bill to the
