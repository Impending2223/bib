  bills:
  - S. Res. 112
  - H.J. Res. 60
  - S.J. Res. 90
  - S. 1577
  next: '1967-06-19'
  text: 'Committee heard former Gov. Farris Bryant, of Florida, presently Director of Emergency Planning, testify
    on the status of the overall mobilization program. Mr. Farris was accompanied by former Senator Price Daniel,
    of Texas, William C. Trupner, and William Lawrence, who are also associated with the Office of Emergency Planning.
    Hearings continue Monday, June 19. Bill Reported: Report was made as follows: Report of Joint Economic Committee
    entitled "Mainland China in the World Economy," together with supplemental views (S. Rept. 348). Pages 16313-16315
    Censure Resolution: Senate continued debate of S. Res. 112, recommending censure of Senator Dodd. By unanimous
    consent, it was ordered that the names of Senators arriving immediately after quorum call No. 147 today will
    be inserted at the appropriate place in the Congressional Record. Pages 16269-16301 Urban Mass Transportation:
    Senate passed without amendment and cleared for President H.J. Res. 6or, extending for 4 months the emergency
    provisions of the urban mass transportation program. S.J. Res. 90, companion bill, was indefinitely postponed.
    Page 16312 Vienna Convention: Senator Mansfield entered motion to reconsider action Senate took on Thursday,
    June 15, in passing with committee amendments S. 1577, to complement the Vienna Convention on Diplomatic Relations
    by conveying greater privileges to foreign personnel, and the House was then requested to return papers in connection
    with this matter to the Senate. Pages 16301-16302 President''s Communication-esc Appropriations: Communication
    was received from President transmitting an amendment to the budget for.fiscal year 1968 in the amount of $r3,95o,ooo
    for the Civil Service Commission, which was referred to Committee on Appropriations and ordered to be printed
    as S. Doc. 36. Page 16312 Nominations: Senate received the following four nominations to be representatives
    to the Fifth Emergency Special Session of the U.N. General Assembly: Arthur J. Goldberg, of Illinois; Joseph
    John Sisco and William B. Buffum, of Maryland; and Richard F. Pedersen, of California. Also received was one
    postmaster withdrawal. Page 16343 Confirmations: Committee on Foreign Relations was discharged from further
    consideration of the four U.N.. nominations received today and listed under "Nominations" above, and these nominations
    were then confirmed. Page 16343 Recess: Recessed at 5:27 p.m.'
