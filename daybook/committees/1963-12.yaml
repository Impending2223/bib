  text: Committee, in executive session, ordered favorably reported S. 1767, authorizing conveyance of U.S. interest
    in Fort Miles, Del., to the State of Delaware (amended); H.R. 4338, authorizing travel allowances for service
    personnel under orders which are later canceled; H.R. 2664, exempting from military service a sole-surviving
    son of a family when the father died as a result of military. service (amended); H.R. 3005, to permit persons
    lawfully admitted to the U.S. for permanent residence to enlist in the Armed Forces Reserves; and one nomination
    in the Marine Corps. The committee adopted the report of its Subcommittee on the Operation of Article VII of
    the NATO Status of Forces Treaty. Committee also considered, but took no action on, H.R. 2988, to increase authorizations
    for participation of military personnel in international sports activities; H.R. 7356, to. change the method
    of selection of candidates for appointment to the Military and Air Force Academies; and the nomination of Maj.
    Gen. Andrew J. Goodpaster, for promotion to the rank of lieutenant general, and for the proposed assignment
    as Assistant to the Chairman of the Joint Chiefs of Staff. Prior to this action, in open session, testimony
    was received from Senator MeN amara in connection with the nomination of General Goodpaster; Senator Williams
    of Delaware, who testified on S. 1767; Col. J. W. Scanlan, Office of the Deputy Chief of Staff for Personnel,
    Air Force, who discussed the provisions of H.R. 4338; Lt. Col. Hulett D. Smith, Office of the Deputy Chief of
    Staff for Personnel, Army, who testified in connection with H.R. 2664; Col. Robert H. Camp, Office of Reserve
    Components, Army, who discussed H.R. 3005; and William G. McNamara, Office of the Assistant Secretary of Defense
    for Public Affairs, and Lt. Col. Gene Myers, Chief of the Sports Branch, Office of the Adjutant General, Army,
    both of whom testified on H.R.29B8.
