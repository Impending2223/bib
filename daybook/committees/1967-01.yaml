  text: 'Subcommittee on the Far East and the Pacific met in executive session and heard a briefing on Far Eastern
    affairs by William Bundy, Assistant Secretary of State for Far Eastern Affairs. Reduction of European Forces:
    Senator Mansfield and others submitted S. Res. 49, expressing sense of Senate that in view of present techniques
    and logistics in warfare a substantial reduction of U.S. forces in Europe can be made without adverse effect
    on U.S. commitments to NATO, and providing that to the extent this resolution conflicts with S. Res. 99, adopted
    April 4, 1951 (sending troops to Europe for NATO), the present resolution is controlling. By unanimous consent,
    the resolution was referred jointly to Committees on Armed Services and Foreign Relations. Pages 997-1011 Senate
    Rules (Cloture): Senator McGovern moved that Senate proceed to consideration of S. Res. 6, to amend Rule XXII
    of the standing rules of the Senate, so as to allow the invoking of cloture by affirmative vote of three-fifths
    of Senators present and voting rather than by the present two-thirds. Majority leader filed motion signed by
    the required number of Senators to invoke cloture to bring to a close debate on motion to take upS. Res. 6.
    Pages 1011-1018 lnterparliamentary Meeting: On behalf of the Vice President the Chair appointed the following
    Senators to attend the U.S.-Mexico Interparliamentary Meeting to be held in Oaxaca, Mexico, February 8-15, 1967:
    Sparkman, Mansfield, Fulbright, Morse, Moss, Montoya, Church, Hollings, Gruening (alternate), Aiken, Fannin,
    Jordan (Idaho), Smith, and Hansen (alternate). Page 945 Confirmation: Nomination of William B. Camp, of Maryland,
    to be Comptroller of the Currency, was confirmed. Page 1033 Nomination: One civilian nomination was received.
    Page 1033 Adjournment: Adjourned at 4:51 p.m.'
