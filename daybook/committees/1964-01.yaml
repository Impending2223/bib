  - H.R. 8363
  next: '1964-01-13'
  text: 'Committee continued its executive consideration of H.R. 8363, proposed Revenue Act of 1964, and amendments
    thereto, and took the following additional tentative actions: (1) Reconsidered its action of January 9, and
    agreed to delete from the provisions of the bill Section 204- Reimbursed Medical Expenses in Excess of Expenses
    Incurred; and (2) With regard to Section 20g--Charitable, etc., Contributions and Gifts, committee modified
    its action of January 9 with respect to the charitable contribution deductions to provide that individuals making
    charitable contributions in excess of the 30-percent limitation may carry these excess contributions over for
    a period of up to 5 years. This carryover is available only with respect to contributions that qualify in the
    30-percent category (as amended by the House bill and as approved by the committee). Committee unanimously agreed
    to direct the chairman to send a letter to the Secretary of the Treasury requesting that he make a study of
    possible abuses of private foundations under the internal revenue laws and to report his findings to the committee
    by the end of this year, if possible. Committee will continue consideration of this bill on Monday, January
    13.'
  page: D8
