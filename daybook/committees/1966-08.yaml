  text: The Permanent Subcommittee on Investigations continued its series of hearings into the administration of
    certain urban renewal projects by the Federal Housing Administration, principally into the construction and
    operation of the Barrington Plaza multifamily project in Los Angeles. Witnesses heard were Jack L. Paradise
