  text: 'Committee continued its hearings on the President''s Economic Report, receiving testimony from Charles
    L. Schultze, Director, Bureau of the Budget, who was accompanied by his associates. Hearings continue on Monday,
    February 6. Legislative Reorganization: Senate worked on S. 355, proposed Legislative Reorganization Act of
    1967, adopting by 57 yeas to 27 nays Monroney motion to table Prouty amendment No. 38 on creation and composition
    of Select Committee on Small Business. Eight amendments by Senator Clark to amend various Standing Rules of
    the Senate were rejected, as follows: No. 19, respecting rule VII (morning business) and to add a new rule XLI
    (petitions and memorials), and a new rule XLII (calendar Monday); No. 15, to amend first sentence of paragraph
    1 of rule XIX respecting recognition of a Senator desiring to speak; No. 16, to amend rule XIX on raising of
    points of order and disposition thereof; No. 17, to amend rule XIX by adding language permitting a Senator to
    have printed in the Congressional Record his written remarks the same as if delivered orally except that a notation
    shall be made to that effect; No. 18, respecting rule XX as to debate on submission to Senate or appeal of point
    of order; No. 14, to amend rule V respecting "Quorum-absent Senators may be sent for"; No. 20, to amend rule
    XIV on "bills, joint resolutions, and resolutions"; and No. 21, to amend rule XII respecting recording of yea~and-nay
    votes. Senator Clark stated th~ he expects to request yeaand-nay votes on his amendments Nos. 12, 13, 22, 23,'
