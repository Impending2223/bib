  exec: true
  text: 'The chairman announced the following committee agenda: Executive sessions on Thursday, January 14, in consideration
    of subchapters J and K of the Internal Revenue Code and on Monday, January 18, on H.R. 5, Foreign Investment
    Incentive Act. Public hearings will be held on Monday, February 1, and not to run later than Friday, February
    5, on the subject of the tax treatment of cooperatives~ The committee agreed to defer further action on the
    cutoff point on percentage depletion until the Supreme Court hands down its decision on the Cannelton case..
    The committee will review H.R. 8126 (distributions pursuant to antitrust decisions), which was reported on September
    2, 1959, in light of the decree which has been handed down on one of the leading cases since the reporting of
    the bill. The committee will meet at a later date to reconsider H.R. 8273 (excise tax on cigarette lighters),
    which was ordered reported on September 1, 1959. The staffs will continue to work on the drafting of legislation
    of subchapter C of the Internal Revenue Code and it will be considered when the drafting is completed.'
