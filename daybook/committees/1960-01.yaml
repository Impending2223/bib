  text: Committee, in executive session, ordered favorably reported an original resolution requesting continuation
    of authority to make studies relative to foreign policy review, disarmament matters, and Latin America, and
    requesting $185,000 therefor; and three original resolutions authorizing the printing of additional copies of
    committee prints issued in connection with U.S. foreign policy. The committee agreed to hold further hearings
    on pending passport legislation, and also agreed to hold hearings on S. Con. Res. 17, favoring a convention
    of delegates from Atlantic democracies looking to greater cooperation and unity of purpose, and S. Res. 94,
    relating to the recognition of the jurisdiction of the International Court of Justice in certain legal disputes.
    Dates for holding of hearings on these matters are as yet unannounced. Committee will meet on January 18 to
    receive a briefing from Secretary of Defense Thomas Gates, Chairman of the Joint Chiefs of Staff Gen. Nathan
    Twining, and CIA Director Allen Dulles, and on J anuary 21 will receive a briefing from Secretary of State Christian
    A. Herter.
