    California, president, Stanford University, to be a member of the U.S. Advisory Commission on Educational Exchange.
    Committee considered, but put over for I week without prejudice, the nomination of Livingston T. Merchant, of
    the District of Columbia, to be Under Secretary of State for Political Affairs. Prior to this action, in open
    session, committee heard testimony from Messrs. Merchant, Hare, and Muccio in behalf of their own nominations.
    Also, the committee held hearings on S. Con. Res. 17, favoring a convention of delegates from Atlantic democracies
    looking to greater cooperation and unity of purpose, with testimony from Senators Kefauver, Church, Cooper,
    and Case of New Jersey; William H. Draper, Jr., U.S. Committee for the Atlantic Congress; Elmo Roper, of Elmo
    Roper & Associates,. New York City; and Lithgow Osborne, for the Declaration of Atlantic Unity, New York City.
    A written statement was submitted for inclusion in the record by Ivan B. White, Deputy Assistant Secretary of
    State for European Affairs. Hearin.gs on this resolution were adjourned subject to call of the Chair.
