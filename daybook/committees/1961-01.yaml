  text: 'Committee, in executive session, authorized the chairman to report, when received by the Senate, nominations
    of the following nominees-designate to positions in the Defense Department: Robert S. McNamara, Secretary of
    Defense; Roswell L. Gilpatric, Deputy Secretary of Defense; Charles J. Hitch, Assistant Secretary of Defense
    (Comptroller); Arthur Sylvester, Assistant Secretary of Defense (Public Affairs); Paul H. Nitze, Assistant Secretary
    of Defense (International Security Affairs); Thomas D. Morris, Assistant Secretary of Defense (Supply and Logistics);
    Cyrus R. Vance, General Counsel, Department of Defense; John B. Connally, Secretary of the Navy; Eugene M. Zuckert,
    Secretary of the Air Force; and Elvis J. Stahr, Jr., Secretary of the Army. Committee approval was given to
    the~e nominees-designate subject to their agreement to dispose of stocks in companies having contracts with
    the Defense Department. The disposal of such stocks would be accomplished within a reasonable time, not to exceed
    90 days. The chairman was requested to appoint a subcommittee to make recommendations concerning committee policy
    on disposal by future nominees of securities in organizations having Defense Department contracts. Prior to
    this action, in open session, committee heard testimony in their own behalf from Messrs. Connally, Zuckert,
    Nitze, Hitch, Vance, Sylvester, and Morris. Senators Yarborough and Blakley spoke in behalf of Mr. Connally.'
