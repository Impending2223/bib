  text: The Internal Security Subcommittee held hearings concerning the payment of a Castro subsidy to the Fair
    Play for Cuba Committee. Testimony was received from Dr. Charles A. Santos-Buch, a Cuban physician at a New
    York hospital, and a former official of the Fair Play for Cuba Committee, who stated that that committee received
    $3,500 from Cuban delegate to the U.N. Raulito Roa for a full-page pro-Castro advertisement in the New York
    Times last April. He also stated that this organization had never regist~red as a foreign agent, which contradicted
    the testimony of Robert Taber, a former CBS newsman, and presently an official of the Fair Play for Cuba Committee,
    who stated that no foreign money was used to pay for the aforementioned advertisement. Hearings were recessed
    subject to call of the Chair.
  page: D10
  pdf: 8
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1961-pt18/pdf/GPO-CRECB-1961-pt18-1.pdf#page=8
