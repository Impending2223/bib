    Senators Pastore, and James T. Ramey, Executive Director, Joint Committee on Atomic Energy, both on additional
    funds for the committee; L. Quincy Mumford, Librarian of Congress, and Raymond Blattenberger, the Public Printer,
    accompanied by Carper W. Buckley, Superintendent of Documents, who testified in behalf of funds for their respective
    departments; S. A. McCarthy, Association of Research Libraries; and John K. Pickens, American Bar Association.
    Hearings were recessed subject to call of the Chair.
