  text: 'Committee, in executive session, ordered favorably reported the following bills: H.R. 1217, to suspend
    for 2 years the import duty on certain amorphous graphite; H.R. 9308, extending for 3 years the suspension of
    duty on imports of crude chicory and the reduction in duty on ground chicory (amended so as to make the new
    expiration date June 30, 1963);. and H.R. 6779, to amend the Internal Revenue Code with regard to unlimited
    deduction for charitable contributions for certain individuals (amended so as to limit the years of qualification
    to those years prior to December 31, 1900, and to limitthe use of the bracketing to 4 years). Committee also
    considered, but did not complete action on, H.R. 8229, to amend the Internal Revenue Code so as to provide an
    exemption from income tax for supplemental unemployment benefit trusts.'
