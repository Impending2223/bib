  text: Subcommittee on Mines and Mining ordered reported to the full committee H.R. 8860, to stabilize the mining
    of lead and zinc by small domestic producers on public, Indian; and other lands. H.R. 8871, 9986, 10098, rn995,
    11009, and 11269, related bills to H.R. 8860, were tabled. Also the subcommittee held a hearing on S. 1268,
    to provide for notice to States owning surface of lands in which minerals are reserved to the Federal Government
    of.proposals to lease such minerals. Testimony was presented by an Interior Department witness. The subcommittee
    considered but passed over without prejudice H.R. 982, to amend the act of December 22, 1928, relating to the
    issuance of patents to tracts of public land held under color of title to provide that patents may be issued
    under such act without reservation of minerals; H.R. 3965 and ~76, to amend the Mineral Leasing Act to prevent
    the undesirable division of oil and gas leaseholds; and H.R. 3962, to amend the Mineral Leasing Act for acquired
    lands with respect to the leasing of mineral deposits in which the U.S. owns a partial or future interest. Hearings
    continue Tuesday, May 3.
