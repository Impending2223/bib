  bills:
  - H.R. 9
  text: 'Ordered favorably reported to the House H.R. 9B83 (am~nded); the bill provides the following: A 9-percent
    increase for approximately 1,700,000 Federal employees with a minimum increase of $350 per annum; The following
    employees are included under the bill: 96o,ooo employees paid under the Classification Act schedules; 550,000
    postal field service employees; 20,000 employees in the Veterans'' Administration Department of Medicine and
    Surgery; 4,100 employees of the judicial branch; 6,200 employees of the legislative branch; 12,600 employees
    in the Foreign Service; and 20,000 regular Agricultural Stabilization Conservation employees. The bill makes
    permanent the 2 ½-percent temporary pay increase granted to postal employees in 1958 which otherwise would expire
    at the end of this year. It also provides for Agricultural Stabilization Conservation county committee employees,
    in addition to the salary increase, retirement and life and health benefits provided under the Federal employees''
    retirement and insurance programs. The cost of the bill is estimated at $810,000,000 annually. The committee
    also ordered favorably reported to the House H.R. ~90, to make permanent the temporary 2½-percent increase for
    postal employees.'
