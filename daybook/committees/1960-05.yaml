  text: Subcommittee on Indian Affairs held a hearing on H.R. 10450, to provide for reimbursement of termination
    costs involved in termination of Menominee Tribe for Federal jurisdiction; H.R. 10451, to provide that documentary
    stamp taxes shall not be applicable to transactions involved in termination of Menominee Tribe from Federal
    jurisdiction; H.R. 11476, to authorize Federal loans to assist the Me!lominee Indian Tribe of Wisconsin, or
    its successor entity, in the conduct of its affairs; and H.R. n813, to amend the Menominee Termination Act.
    Testimony was given by Representative Laird; Department of Interior officials; and various members of the Menominee
    Tribe. Also the subcommittee considered H.R. 7701, 8033, and 8590, to provide a program for an Operation Bootstrap
    for the American Indian in order to improve con- ditions among Indians on reservations and in other communities.
    Representatives Berry, Langen, and Short testified on the bills. Hearings will continue on H.R. 7701, 8033,
    and 8590 Wednesday, June I.
