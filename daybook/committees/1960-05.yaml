  text: Committee, in executive session, ordered favorably reported S. 3338, to remove the $5,000 limitation which
    prevents settlement by the Secretary of the Air Force of certain claims arising from the crash of an Air Force
    aircraft at Little Rock, Ark. (amended); H.J. Res. 598, to extend the time for filing the final report of the
    Lincoln Sesquicentennial Commission; H.J. Res. 640, authorizing the President to issue proclamation upon the
    centennial of the birth of Gen. John J. Pershing (amended); the nominations of Joseph S. Bambacus, to be U.S.
    attorney for the eastern district of Virginia; William L. Longshore, to be U.S. attorney for the northern district
    of Alabama; Ralph Kennamer, to be U.S. attorney for the southern district of Alabama; Francis Adams Cherry,
    of Arkansas, to be a member of the Subversive Activities Control Board; and Oliver H. Metcalf, to be U.S. marshal
    for the middle district of Pennsylvania; 20 private immigration bills (s. 1349, 2627, 2635, 2739, 2776, 2799,
    2821, 2833, 2886, 2939, 3081, 3u4, H.R. 1752, 2082, 3786, 3934, 4562, 6843, 7254, and 8672); and 3 private claims
