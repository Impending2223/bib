    sale to surface owners of phosphate interests reserved by the Federal Government in certain Florida lands (amended);
    H.R. 1233, a private bill; H.R. 4479, conveying to California reserved mineral rights in certain real property
    (amended); S. 1534, proposed Lead and Zinc Stabilization Act of 1¢3 (amended); S. I 169, authorizing per capita
    distribution of $350 from funds arising from judgments in favor of the Confederated Tribes of the Colville Reservation;
    S. 536, donating certain public land to the Devils Lake Sioux Tribe of the Fort Totten Indian Reservation, N.
    Dak. (amended); S. 1931, providing that the U.S. shall hold certain land in trust for members of the Alamo Band
    of Puertocito Navajo Indians (amended); S. 71 I, authorizing sale and exchange of certain land on the Rosebud
    Sioux Indian Reservation, S. Dak. (amended); S. 1565, authorizing the sale of timber on Indian lands in accordance
    with the principles of sustained yield; S. 1757, ratifying certain conveyances of land on the Crow Indian Reservation;
    S. 2279, authorizing transfer of the Piegan unit of the Blackfeet Indian irrigation project, Montana): to the
    landowners within the unit; S. 2275, authorizing the return of ceded lands to Hawaii when no longer used by
    the Federal Government; S. 1878, extending for an additional 5 years the period in which Alaska may select lands
    under Federal mineral leases; H.R. 976, authorizing acquisition of the Narborne House for the Salem Maritime
    National Historic -Park, Mass. (amended); and S. 1137, authorizing establishment of the Oregon Dunes National
    Shorelands (amended).'
