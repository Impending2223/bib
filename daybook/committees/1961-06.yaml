  text: The Internal Security Sul;>committee had as its witness former heavyweight boxing champion Joe Louis, who
    testified and answered questions with regard to his experiences with Castro-controlled Cuba in promoting increased
    tourism among American Negroes in Cuba. Mr. Louis stated that a public relations firm operated by himself and
    his partner, William Rowe, had a contra.ct with Castro for such promotional purposes, which contract was terminated
    after a little less than 6 months, with Cuba's owing the firm approximately $100,000.
