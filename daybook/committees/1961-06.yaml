  exec: true
  text: 'On Friday, June 9, committee, in executive session, ordered favorably reported the following bills: S.
    857, to provide for the establishment of Cape Cod National Seashore Park (amended); S. 1492, amending the law
    to delete requirement that superintendents of national cemeteries must be selected from veterans who were disabled
    in active field service; S. rn18, authorizing acquisition of approximately 9 acres of land for addition to Cumberland
    Gap National Historical Park, Ky.; H.R. 3283, to revise the boundaries and change the name of Fort Vancouver
    National Monument, State of Washington; S. 1647, to provide for the addition of certain lands to Cedar Breaks
    National Monument, Utah; H.R. 5475, to transfer a section of Blue Ridge Parkway to the Shenandoah National Park,
    Va.; H.R. 5765, authorizing purchase and exchange of land and interests therein on the Blue Ridge and Natchez
    Trace Parkways; H.R. 5416, to include certain federally owned lands within the boundaries of Joshua Tree National
    Monument, Calif.; H.R. 576o, to revise the boundaries of the Scotts Bluff National Monument, Nebr.; S. 1775,
    authorizing the acquisition of approximately 12 acres of land for the Richmond National Battle.field Park, Va.;
    H.R. 4500, donating to the heirs of Anthony Bourbonnais, approximately one-third acre of land in Pottawatomie
    County, Okla. (amended); and H.R. 3572, to place certain lands in trust on the Crow Creek Indian Reservation,
    S. Oak. (amended). Committee discussed, but took no action on, S. 174, to establish a National Wilderness Preservation
    System.'
