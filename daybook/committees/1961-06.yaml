  exec: true
  text: Committee, in executive session, ordered favorably reported H.R. 879, to increase rates of compensation
    for service-connected disabled veterans (amended); H.R. 845, to increase the rate of special pension payable
    to certain persons awarded Medal of Honor (amended); H.R. 2953, relative to counting service time in more than
    one period of war for pension purposes; H.R. 6269, to fix midnight as the effective time of discharges from
    the Armed Forces prior to January 1, 1957, for purposes of veterans' benefits; H.R. 866, to require findings
    of fact and conclusions of law by the Board of Veterans' Appeals; H.R. 7148, relating to transportation to the
    place of burial of the remains of veterans who die in VA facilities; and H.R. 4539, providing for immediate
    payment of dividends on national service life insurance policies converted or exchanged for new insurance. Committee
    tabled H.R. 846, providing additional compensation for veterans having service-incurred disability for total
    deafness; and H.R. 873, relating to increased compensation for certain service-connected disabled veterans.
    Committee announced that it will hold hearings on July 6 and 7 on H.R. 856, permitting the conversion or exchange
    of policies of national service life insurance to a new modified plan; S. 977, providing a 2-year period during
    which veterans may be granted national service life insurance; and S. 397, permitting life insurance companies
    to deduct an amount equal to 2 percent of the premiums from individual accident and health insurance contracts
    in determining gain or loss from operations for income tax purposes.
