  text: 'Met in executive session and ordered reported to the House the following measures: H. Res. 341, authorizing
    the employment of two additional mail clerks for the House Post Office; H. Res. 348, authorizing the employment
    of one additional clerk for the Committee on Foreign Affairs; and an appropriation of $5,000 for expenses incurred
    in connection with participation in interparliamentary institutions, and the interchange and reception of foreign
    legislative bodies and officials of foreign governments; H. Res. 354, authorizing a flag for Members of the
    House of Representatives; H. Res. 357,, authorizing additional funds ($rn,ooo) for the Committee on House Administration;
    H.J. Rese 392, relating to electrical and mechanical office equipment for the use of Members, officers, and
    committees of the House of Representatives to provide that Members having constituencies of 500,000 shall be
    entitled to an additional $500 worth of equipment., and to increase the number of electric typewriters which
    may be furnished Members; H. Res. 250, to print as House document "Report on the Powers and Responsibilities
    of the Judicial Councils"; H. Res. 251 (amended), to print as House document, and 16,500 copies for Members
    of the House, the Constitution of the United States with index and proposed amendments; H. Res. 259, to print
    compilation of GAO findings on improving Government operations as House document, and 2,000 copies for Government
    Operations Committee; H. Res. 292, to print 20,000 additional copies of "Language as a Communist Weapon" for
    use of Committee on Un-American Activities; H. Res. 293, to print 20,000 additional copies of "The Kremlin''s
    Espionage and Terror Organizations" for use of Committee on Un-American Activities; H. Res. 294, to print 36,000
    additional copies of "The Ideological Fallacies. of Communism"; H. Res. 295~ to print 6,000 additional copies
    of "Communism in New York Area-Entertainment" for use of Committee ori "Qn-Amedcan Activities; H. Res. 296,
    to print 50,000 additional copies of "Communist Psychological Warfare-Brainwashing'''' for use of Committee
    on Un-American Activities; H. Res. 297,. to print 15,000 additional copies of- "Patterns of Communist Espionage"
    for use of Committee on. Un-American Activities; H. Con. Res. 307, to print 5,000 additional copies of volumes
    I and II of "Soviet Total War-Historic Mission of Violence and Deceit" for use of Committee on Un-American Activities;
    H. Con. Res. 308, to print 8,000 additional copies of parts r, 2, and 3 of "Communist Training Operations- Communist
    Activities and Propaganda Among Youth Groups" (hearings) for use of Committee on Un-:American Activities; H.
    Con. Res. 309, to print ro,ooo additional copies of parts 1, 2,, 3, and 4 of hearings entitled "The Northern
    California District of the Communist Party-Structure-Objectives-Leadership" for use of Un-American Activities
    Committee; H. Con. Res. 3ro, to print 20,000 additional copies of "Legislative Recommendations by House Committee
