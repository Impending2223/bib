    the authorized strength of the D.C. Metropolitan Police force shall be not less than 3,000 officers and members;
    H.R. 258, increasing the D.C. sales tax from 2 cents to 3 cents and to transfer certain parking fees and other
    moneys to the highway fund (amended); S. 564, to apportion the expense of operating the Woodrow Wilson Memorial
    Bridge from Jones Point, Va., to Maryland; S. 588, increasing the authorization of funds for extension of certain
    projects from the D.C. into Maryland (amended); S. 1291, to increase-from $1 to $2 the fee charged for learners''
    permits in the D.C.; S. 158, conferring upon the domestic relations branch of the D.C. municipal court jurisdiction
    to hear petition for adoption filed by Marie Taliaferro; S. 558, to exempt the D.C. from paying fees in any
