  text: Subcommittee on Patents. resumed its hearings on S. 1084 and 1176, establishing a national policy for the
    acquisition and disposition of patcvir-nn-17 ents on inventions made chiefly through the expenditure of public
    funds, receiving testimony from former Representative Fritz Lanham, representing the National Patent Council;
    David E. Sunstein, Chamber of Commerce of Greater Philadelphia; W. Brown Morton, American Patent Law Association;
    Howard I. Forman, a patent attorney; Charles I. Derr, Machinery & Allied Products Institute; J. Rabinow, Rabinow
