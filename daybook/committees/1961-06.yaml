    of customs at Great Falls, Mont.; A. Bayard Angle, of Florida, to be collector of customs at Tampa, Fla.; and
    Mrs. Edna M. Scales, of Oregon, to be collector of customs at Portland, Oreg. Committee also considered H.R.
    6027, Social Security Amendments of 196!, but did not conclude action thereon, and will meet again on Wednesday,
