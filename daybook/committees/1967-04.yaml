  text: 'Committee, in executive session, ordered favorably reported the nominations of Maurice J. Williams, of
    Maryland, to be Assistant Administrator for the Near East and South Asia, AID; Lucius D. Battle, of Florida,
    to be an Assistant Secretary of State; William W. Heath, of Texas, to be Ambassador to Sweden; K-arl F. Rolvaag,
    of Minnesota, to be Ambassador to Iceland; Richard H. Nolte, of Connecticut, to be Ambassador to the United
    Arab Republic; Ellsworth Bunker, of Vermont, to be Ambassador to the Republic of Vietnam; Henry Cabot Lodge,
    of Massachusetts, to be Ambassador at Large; Douglas MacArthur II, of the D.C., to be Ambassador to Austria;
    John M. McSweeney, of Nebraska, to be Ambassador to Bulgaria; and the following three persons to be members
    of the U.S. Advisory Commission on Information: Sigurd S. Larmon, of New York; Frank Stanton, of New York; and
    Thomas Van Husen Vail, of Ohio. Prior to this action, in open session, committee heard testimony from Senators
    Yarborough and Tower with regard to the nomination of Mr. Heath; from Senator Mondale on the nomination of Mr.
    Rolvaag; and from Representative MacGregor on the nomination of Mr. Nolte. Messrs. Williams, Battle, Heath,
    Rolvaag, Nolte, and Bunker were present to testify and answer questions on their own behalf.'
