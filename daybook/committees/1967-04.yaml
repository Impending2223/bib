  text: 'Subcommittee on Economic Progress concluded its hearings for the purpose of reviewing the teaching practices
    of economics in the U.S. at all school levels and in adult training, after receiving testimony from M. L. Frankel,
    president, Joint Council on Economic Education; Leon M. Shur, director, Wisconsin Council on Economic Education;
    Forbes Bottomly, superintendent of public schools, Portland, Oreg.; Mrs. Vincent Patrick, coordinator of economic
    education, Tulsa, Okla., public schools; Eugene I. Johnson, executive director, Adult Education Association
    of the U.S.A.; Harold Howe II, Commissioner of Education, HEW; and John T. Wilson, Deputy Director, National
    Science Foundation, Reports Filed: Reports were made as follows: Report of Com~ittee on the Judiciary entitled
    "Constitutional Amendments" (S. Rept. 191); and Report of Committee on Government Operations entitled "Labor
    Racketeering Activities of Jack McCarthy and National Consultants Association, Ltd., with individual views (S.
    Rept. 192). Pages 10560-10561 Obscene Telephone Calls: Senate passed without amendment S. 375, to set penalties
    for persons convicted of making obscene or harassing telephone calls. Pages 10598-10600 Taxation: Senat~ continued
    consideration of H.R. 6950, to restore investment tax credit and allowance of accelerated depreciation in the
    case of certain real property. Pending at adjournment was Mansfield motion to recommit bill to Committee on
    Finance with instructions (I) to report it back forthwith with provisions which relate to restoration of investment
    tax credit and provision for expiration date of July 31, 1967, of the Presidential Campaign Fund Act of 1966,
    and (2) to report back within 6 weeks provisions respecting Presidential Campaign Fund Act of 1966. Page 10588
    Treaty on Outer Space: Senate considered Treaty on Outer Space (Ex. D, 9oth Cong., 1st sess.), the treaty now
    having passed through its various stages up to and including presentation of resolution of ratification. By
    unanimous consent, it was agreed that vote on resolution on ratification of the treaty will take place at 2:30
    p.m. Tuesday, April 25. A record vote will be taken on the resolution of ratification of the treaty. Page 10593
    Nominations: Senate received nominations of Dennis L. McElroy, of Pennsylvania, to be a member of Federal Coal
    Mine Safety Board of Review; and of William W. Sherrill, of Texas, to be a member of the Board of Governors
    of the Federal Reserve System. In addition to the two Navy and four Marine Corps nominations shown as received
    on Friday, April 21, Senate also received numerous other Navy and Marine Corps nominations. Page 10600 Adjournment:
    Adjourned at 3:o8 p.m.'
