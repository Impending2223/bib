  text: Subcommittee on Improvements in Judicial Machinery continued its hearings on S. 915, to establish in the
    Administrative Office of the U.S. Courts a Federal Judicial Center for the purpose of conducting education and
    training programs in the judicial branch of the Government. Witnesses heard today were Maurice Rosenberg, professor
    of law, Linden, the American Textbook Publishers Institute; W. Brown Morton, Jr., EDUCOM, Interuniversity Communications
    Council; Charles Stewart, National Audio-Visual Association; Norman Jorgenson, National Association of Education
    Broadcasters; Jerome Adler, AFL-CIO Musicians Union; Michael V. DiSalle, National Council of Recording Arts;
    Sidney Diamond, Record Industry of America; Douglas A. Anello, National Association of Broadcasters; Nicholas
    E. Allen, Music Operators of America; Leonard Feist, National Music Publishers' Association; Robert R. Nathan,
    of Robert R. Nathan Associates; and James Fitzpatrick and Ernest Meyers, both of the Record Industry of America.
    Hearings were recessed subject to call.
