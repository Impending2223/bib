  text: 'Subcommittee on Employment, Manpower, and Poverty resumed its series of hearings to receive testimony on
    manpower and poverty implications of the Selective Service System, receiving testimony from the following panel
    of witnesses representing college newspapers: Don Morrison, editor in chief, Daily Pennsylvanian; Chuck Sable,
    editorial writer, Harvard Crimson; and Tom Myles, staff writer, Carolyn Carter, editor in chief, and Anthony
    Grittens, all of the Howard Hilltop. The subcommittee also received testimony from a panel of witnesses made
    up of young men rejected as unfit for military duty, some of whom presently hold jobs comparable to those performed
    by members of the Armed Forces; and a panel consisting of young men in vocational or other job training, some
    of whom are eligible for the draft and some of whom have been drafted out of their training programs. Hearings
    continue tomorrow. H.R. 6167, authorizing the co11tinued loan of certain naval vessels and a new loan, amended
