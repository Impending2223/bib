  bills:
  - H.R. 15414
  exec: true
  text: 'Met in executive session and agreed to the following motion by Representative Herlong: I move that the
    Committee on Ways and Means advise the chairman to advise the committee on conference between the House and
    the Senate on H.R. 15414 that the Committee on Ways and Means has studied the resolution adopted by the Committee
    on Appropriations calling for a reduction of not less than $4 billion in expenditures for the fiscal year ending
    June 30, 1969, with the exceptions enumerated therein, and that the Committee on Ways and Means, in the light
    of the existing critical domestic and international fiscal situation, adopts the following position: (1) That
    it is the view of the Committee on Ways and Means that budget expenditures for the fiscal year ending June 30,
    1969, should be reduced by at least $4 billion (excepting special Vietnam costs, interest on the debt, veterans''
    benefits, and Social Security Trust Funds, in excess of amounts estimated in the budget); (2) That the chairman
    and the House conferees are requested to negotiate within the conference on an appropriate limitation on expenditures
    for the fiscal year ending June 30, 1969; (3) That there should be a reduction of at least $10 billion in new
    obligational authority and a rescission of at least $8 billion in old authority; and (4) That the Committee
    on Ways and Means further considers, as a part of the foregoing, that appropriate income tax increases (either
    through a 10-percent surcharge or comparable rate adjustments) should be developed by the conferees on H.R.
    15414 to yield approximately $10 billion in a full year of operation to become a part of the combined expenditure-tax
    action to be embodied in the conference report on the bill, H.R. 15414.'
  page: D197
  pdf: 195
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1968-pt26/pdf/GPO-CRECB-1968-pt26-1.pdf#page=195
