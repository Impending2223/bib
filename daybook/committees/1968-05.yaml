  text: Committee, in executive session, ordered favorably reported H.R. 15004, to extend the expiration date of
    several authorities under the Federal Civil Defense Act; H.J. Res. 1224, authorizing the President to reappoint
    for l year Gen. Earle G. Wheeler as Chairman of the Joint Chiefs of Staff; H.R. 15348, extending authority to
