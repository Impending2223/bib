  exec: true
  text: Committee, in executive session, ordered favorably reported S. Res. 286, authorizing employment of three
    additional clerks for the Committee on the District of Columbia (amended); S. Res. 291, authorizing an additional
    $35,000 for expenses of the Committee on Appropriations; S. Res. 296, authorizing additional $10,000 for expenses
    of the Committee on Interior and Insular Affairs; S. 3504, to insure proper police force jurisdiction in buildings
    leased by the Library of Congress; H. Con. Res. 44, to print additional copies of a veterans' benefits calculator;
    H. Con. Res. 614, to print additional copies of House Judiciary Committee hearings on the anticrime program;
    H. Con. Res. 702, authorizing printing of "Summary of Veterans Legislation Reported, 90th Congress"; S. Res.
    292, to print additional copies of part 5 of Senate Select Committee on Small Business hearings on competitive
    problems in the drug industry; S. Res. 294, to print additional copies of part 6 of Senate Select Committee
    on Small Business hearings on competitive problems in the drug industry; S. Res. 295, to print as a Senate document
    study entitled "Automatic Data Processing and the Small Businessman"; an original concurrent resolution (S.
    Con. Res. 73) providing for the creation of a Joint Committee on the Inaugural Ceremonies; an original resolution
    (S. Res. 297) to print as a Senate document the tributes made on the Senate Floor to the Honorable Carl Hayden
    on the occasion of the announcement of his retirement from public office; and two original resolutions (S. Res.
    298 and 299) authorizing payment of gratuities to survivors of two deceased Senate employees. Committee also
    agreed to recommend that the Senate agree to the House amendments to S. 2884, to amend the Federal Voting Assistance
    Act so as to recommend to the States that its absentee registration and voting procedures be extended to all
    citizens temporarily residing abroad; and S. 1581, to increase participation of service personnel in Federal
    elections. Also, committee gave its endorsement to Capitol Police Board Order No. l-68, relating to security
    of the U.S. Capitol buildings and grounds.
