  text: 'Continued hearings on SBA small business assistance loans. Testimony was heard from SBA witnesses.,person,;present
    testim,ony or evidence, and be represented by counsel before his local draft board. Senate then turned to title
    III of the bill on wiretapping and electronic surveillance, taking the following actions on amendments thereto:
    Adopted: Modified Hart amendment No. 754 to authorize judge to include other parties to intercepted communications
    in the inventory required to be served by law enforcement agency on person named in order respecting placing
    of wiretap or bug; an~ Hart amendment No. 766 requiring applicant for extension of order for wiretap or bug
    to make a showing of cause by stating results thus far obtained; and Rejected: By 21 yeas to 6i nays, Long (Missouri)
    amendment No. 734 to remove language allowing postponement beyond 90 days, in certain circumstances, of the
    serving of an inventory of disclosure by law enforcement agency on person named in order respecting placing
    of wiretap or bug; and by 18 yeas to 60 nays, modified Long (Missouri) amendment No. 728 to eliminate language
    that would allow wiretap or bug in certain cases where crime "is about to be committed" and would confine such
    use to crime being committed or that has been committed. By unanimous consent, it was agreed that during further
    consideration of title III of the bill debate will be limited as follows: 30 minutes, equally divided, on any
    amendment thereto, except that there will be 1 hour, equally divided, on a Fong amendment to be o.ff ered, and
    provided that there will be no time limitation on any substitute amendment for title III or a motion to recommit
    the bill. Pending at recess was Hart amendment No. 755 providing that judge in his discretion may require results
    of wiretap or bug to be disclosed to the parties to the communications. Pages 14446-14463, 14469-14486'
