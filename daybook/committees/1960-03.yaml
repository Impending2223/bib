  exec: true
  text: 'Met in executive session and ordered favorably reported to the House the following bills: H.R. 471 (amended),
    to provide that the Secretary of the Navy shall have the same authority to remit indebtedness of enlisted members
    upon discharge as the Secretaries of the Army and the Air Force have; H.R. 5726, for the relief of Hood County,
    Tex.; H.R. 5850, for the relief of the borough of Ford City, H.R. 9921, to validate certain payment of additional
    pay for sea duty made to members and former members of the United States Coast Guard; H.R. 8868, for the relief
    of the Albertson Water District, Nassau County, N.Y.; H.R. 10419 (amended), to amend the act of September 2,
    1958, relating to immigration; H.R. 7847 (amended), provides for records on which. administrative orders or
    decisions under the Federal Food, Drug, and Cosmetic Act and the Federal Aviation Act are made to be filed with
    the court in cases involving petitions for court review of such orders; and H.J. Res. 6o2 (amended), authorizing
    the President to proclaim henceforth the week in May of each year in which falls the third Friday of that month
    as National Transportation Week. The committee also ordered favorably reported several private claim and immigration
    bills, respectively, and tabled H.R. 827, to confer jurisdiction upon the Court of Claims to hear, determine,
    and render judgment upon the claims of the State of California; and H.R. 4053, to amend the provision of the
    Court of Claims procedure dealing with time for filing suit.'
  page: D101
  pdf: 99
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=99
