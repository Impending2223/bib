    entitled "Data Compilation Activities of the Federal Government: Personnel and Contract Costs." Representative
    Foley was appointed to fill the vacancy on the Subcommittee on Postal Operations and Representative Oliver was
    appointed to fill the vacancy on the Subcommittee on Census and Government Statistics. Eight legislative subcommittees
    were appointed as follows: On H.R. 1907, to ame.n,d the Veterans'' Preference Act of 1944 to define mothers
    for purpose of such act: Representatives Lesinski, chairman, Alford, and Gross; On HR. 7506, to create a judicial
    officer for the Post Office Department: Representatives Granahan, chairman, Irwin, and Cunningham; On H.R. 9889,
    to eliminate the mandatory requirements for penalty charges on short paid mail: Representatives Porter, chairman,
    Dulski, and St. George; On H.R. 9507, 9514, to authorize the Postmaster General to waive collections on raised
    money orders cashed by banks and other business concerns: Representatives Dulski, chairman, Irwin, and Johansen;
    On HR. rn583, 10265, 7032, and 9291, to permit weekly publications to suspend publication for not more than
    two issues in any one calendar year without loss of second-class mail privileges: Representatives Foley, chairman,
    Scott, and Corbett; On H.R. rn695, to provide for the rotation in oversea assignments of civilian employees
    under the Defense Establishment having career conditional and career appointments in the competitive civil service:
    Representatives Irwin, chairman, Harmon, and W allhauser; On H.R. 8738 and 8739, to improve the work of Federal
    employees through evaluation of work performance to amend the Performance Rating Act of 1950: Representatives
    Alford, chairman, Oliver, and Broyhill; and On S. 1849 and H.R. 6835, to contract for certain powerboat service
    in Alaska, amending act of August rn, 1939: Representatives Oliver, chairman, Prokop, and Barry.'
