  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following bills: H.R. 66o1, authorizing
    the Secretary of Agriculture to sell certain land in Grand Junction, Colo. (amended); H.R. 7588, providing criminal
    punishment for violators of regulations to protect the national forests and grasslands; H.R. 10o69, authorizing
    the exchange of lands adjacent to Lassen National Forest, Calif.; H.R. 10419, requiring part of the patronage
    funds paid by a bank for cooperatives to be in cash after such bank becomes subject to Federal income tax; H.R.
    9747, extending for 3 years the special milk program for the Armed Forces and veterans'' hospitals; S. 2634,
    permitting the CCC to buy processed food grain products for donation under the foreign assistance and domestic
    welfare programs; H.R. 1642, providing for the sale of the U.S. Animal Quarantine Station to the city of Clifton,
    N.J., and to establish a new station in the New York- New Jersey port area (amended); H.R. 4242, providing for
    the release and transfer of all right, title, and interest of U.S. in certain land in Pender County, N.C.; S.
    1253, to provide 3-year staggered terms for agricultural stabilization and conservation county committeemen;
    and S. 2687, to extendfor 2 years the Agricultural Trade Development and Assistance Act of 1954 (P.L. 480).
    Committee also approved for reporting the nomination of John A. Schnittker, of Kansas, to be a member of the
    Board of Trustees of the CCC. Committee approved the following 17 watershed projects: Big Creek, Tex.; Crooked
    Lake Bayou, Ark.; Pennahatchee Creek, Ga.; Squirrel Creek, Okla.; Upper Tradewater River, Ky.; Willow Swamp,
    S.C.; Jewell Branch, Vt.; Lee Phillips, Ark.; Prairie Creek, Ind.; Little Choconut, Finch Hollow, and Trout
    Brook, N.Y.; Patterson, Brixius, and Grey Creek, N.Y.; Dunn Swamp and Cedar Branch tributaries, North Carolina;
    Lyon Swamp-White Oak Swamp, N.C.; Marshyhope Creek, Del. and Md.; Mill Creek, Ga.; Turtle Creek, Ga.; and Wellington-Napoleon,
    Mo.'
  page: D436
  pdf: 434
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1964-pt20/pdf/GPO-CRECB-1964-pt20-1.pdf#page=434
