    land acreage of phosphate leases that may be held by any person or company; S. 1g84, relating to the date of
    payment of rentals on mineral lease renewals; S. 883, to amend the Mineral Leasing Act to authorize geothermal
    steam leases (amended); S. 1442, relating to the closing of the roll of the Confederated Tribes of the Colville
    Indian Reservation preparatory to steps to terminate Federal supervision over such tribes (amendment in the
    nature of a substitute); S.J. Res. 6, to cancel unpaid reimbursable. construction costs of the Wind River irrigation
    project, Wyoming, chargeable against certain nonlndian lands; S. 3053, to increase authorizations for construction
    of the Riverton Federal reclamation project; S. 770, providing for construction and operation of the Savery-Pot
    Hook Federal reclamation prbject, Colorado and Wyoming (amended); H.J. Res. 733, designating the powerhouse
    on Clear Creek at the head of Whiskeytown Reservoir, Calif., as Judge Francis Carr Powerhouse (amended); and
    H.R. 130, providing for payment of compensation, including severance damages, for rights-of-way acquired by
    the U.S. in connection with reclamation projects begun after January 1, lg6I. Also, committee reconsidered its
    action of July 31, when it ordered favorably reported H.R. 5498, authorizing sale of public lands not needed
    for Federal program requirements, and agreed to amend the bill, and again ordered it favorably reported to the
    Senate.'
