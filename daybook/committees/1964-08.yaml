  committee: Committee on Foreign Relations
  code: 338
  name: Foreign Relations
  heading: COMMITTEE BUSINESS
  bills:
  - S. 2521
  - H.R. 491
  - S. 491
  exec: true
  open: true
  text: Committee, in executive session, ordered favorably reported the nomination of Harry C. McPherson, Jr., of
    the D.C., to be an Assistant Secretary of State. Committee also approved supplementary convention to the extradition
    treaty with Belgium (Ex. C, 88th Cong., 2d sess.). Committee tabled S. 2521, granting congressional consent
    to agreement between Minnesota and Manitoba, Canada, for certain highway construction, and H.R. 491, vesting
    in the American Battle Monuments Commission the care and maintenance of the lwo Ji.ma Memorial on Mount Suribachi.
    Prior to the above executive action, committee, in open session, heard Mr. McPherson testify and answer questions
    in behalf of his own nomination; Dowell Anders, Bureau of Public Roads, Department of Commerce, who testified
    with regard to S. 2521; Richard Petree, Officer in Charge of Japanese Affairs, Department of State, and Col.
    William A. Walker, American Battle Monuments Commission, who testified with regard to S. 491; and Richard D.
    Kearney, Deputy Legal Adviser, Department of State, who testified with regard to the extradition treaty with
    Belgium. Committee will meet tomorrow, in executive session, jointly with the Committee on Armed Services, to
    hear Secretary of State Rusk, Secretary of Defense McNamara, and Chairman of the Joint Chiefs of Staff Gen.
    Earle Wheeler, in connection with recent developments in Vietnam.
  page: D391
