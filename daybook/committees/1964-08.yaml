  exec: true
  text: 'Met in executive session and ordered reported favorably to the House the following bills: H.R. 9178, to
    provide 3-year staggered terms for county agricultural stabilization and conservation committeemen. Prohibits
    election of a member of the committee for more than three terms; S. 277, to amend the Federal Crop Insurance
    Act, in order to increase the number of new counties in which crop insurance may be offered each year; H.R.
    8290 (amended), to accept a transfer of certain lands within Everglades National Park, Dade County, Fla., for
    administration of said park; H.R. 3607, to define "screenings" under the Federal Seed Act to include materials
    containing less than 25 percent of agricultural or vegetable seeds; and H.R. 5406 (amended), to make investigations
    and studies, furnish technical assistance, and obtain assist ance of Federal agencies in planning for use of
    agricultural land in rapidly expanding urban areas and in other nonagricultural use areas. The committee postponed
    action on S. 1915, to amend the Agricultural Adjustment Act; and approved five watershed projects.'
