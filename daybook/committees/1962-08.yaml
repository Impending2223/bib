    of the U.S. Forest Service; and S. 3574, to extend the International Wheat Agreement Act of I949 Also, committee
    approved the following nine watershed projects: South Sumter and Upper Tampa Bay, both in Florida; North Branch
    Mill Creek, Mich.; Nanticoke Creek, N.Y.; Dicks Creek-Little Muddy Creek, Ohio; Line Creek, Tenn. and Ky.; Kent
    Creek, Tex.; Bajura, P.R.; and Davis-Battle Creek, Iowa.'
