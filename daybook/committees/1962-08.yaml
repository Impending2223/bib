  next: '1962-08-23'
  text: 'Committee continued its executive consideration of H.R. II970, proposed Trade Expansion Act of 1962, after
    which it announced the following actions: The committee agreed tentatively to amend section 102 of the bill,
    the Statement of Purposes, by requiring that the mutual benefits to be derived must be trade benefits. Paragraphs
    Nos. 3 and 4 of the Statement of Purposes were deleted. These refer to assistance to underdeveloped countries
    and the prevention of Communist penetration. It was the opinion of the majority of the committee that the balance
    of the Statement of Purposes was sufficiently broad to permit the President to carry out the intent of the program.
    Deleted section 231 of House-passed bill, substituting therefor related provision in existing law. This is the
    section relating to Communist-dominated areas and the change would permit a continuation of the present practice
    of granting most-favored~ nation treatment to Yugoslavia and Poland. This section was further amended to include
    specific reference to Communist China as one area which may not receive most-favored-nation treatment. Committee
    will continue consideration of this bill tomorrow.'
