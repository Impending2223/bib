  text: 'The Antitrust and Monopoly Subcommittee, in executive session, by a vote of 5 to 2, recommended that the
    full committee report an original resolution recommending that the Senate cite for contempt of the Congress
    the following four companies and nine officials thereof: A. B. Homer, chairman and chief. executive officer,
    Edmund Martin, president, and Frank R. Brugler, comptroller, all of the Bethlehem Steel Corp., New York City;
    Thomas F. Patton, president, and George M. Feiel, vice president and comptroller, both of the Republic Steel
    Corp., Cleveland; Thomas E. Millsop, chairman of the board of directors, and George Stinson, secretary, both
    of the National Steel Corp., Pittsburgh; and Logan T. Johnston, president, and D. E. Reichelderfer, vice president,
    finance, both of the Armco Steel Corp., Middletown, Ohio. Prior to this action, subcommittee held open hearings
    to receive testimony from the above-listed witnesses, all of whom had been subpenaed to appear at this hearing
    to produce su~penaed steel costs data.'
