  heading: DRUG INDUSTRY ANTITRUST ACT
  bills:
  - S. 1552
  next: '1962-08-09'
  text: 'Committee continued its executive consideration of certain amendments recommended by the President to S.
    1552, proposed Drug Industry Antitrust Act (which bill is now pending on the Senate Calendar), after which it
    announced the following additional actions: The committee today adopted an amendment in the nature of a substitute
    for section 9 of S. 1552 (relating to conspicuousness of official names of drugs) so that instead of merely
    requiring that the official name of a drug appear with such prominence and conspicuousness as is now required
    by the Food and Drug Act under other provisions of the act, the amendment will require that the so-called generic
    name of the drug-i.e., either the official name prescribed by the Secretary under section 1 o of the bill or
    the official tide of the drug in an official compendium, such as the U.S.P., or another generic name if there
    is no official name-appear on the label prominently and in type at least half as large as that used for the
    brand name of the drug. This was accomplished by substituting for section 9 of the bill the provisions of section
    112 of the Harris bill, with one substantive change, i.e., to change from a rule of giving precedence to the
    so-called generic name in position and equal size type to a rule requiring at least half-size type and no precedence
    in position on the label. Under the substitute, the same rule as to the relationship between brand name and
    so-called generic name will apply to the total drug and to a brand name, if any, used for an ingredient. The
    committee decided to retain section 10 of S.. 1552 relating to standardization of drug nomenclature instead
    of section I I I of the Harris bill because section IO sets out in more detail the procedure of cooperation
    with the voluntary bodies that both the administration and the committee have in mind. These amendments will
    be proposed as committee amendments to the bill upon Senate consideration thereof. Committee will meet again
    tomorrow for the further consideration of this legislation.'
  page: D444
  pdf: 442
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=442
