  exec: true
  text: 'Committee, in executive session, ordered favorably reported the following bills: S. 3162, to approve an
    amendatory repayment contract negotiated with the Quincy Columbia Basin Irrigation District (amended); S. 3117,
    to promote the coordination and development of Federal arid State outdoor recteation programs (amended); H.R.
    ~134, authorizing sale of mineral rights to the surface owners of some 4,500 acres near Phoenix (amended); H.R.
    10566, to ~ithdraw some 425,000 acres at Tucson from all forms of mineral entry (amended); S. 2369, to release
    title of the U.S. to streets in Heyburn, Idaho; H.R. 3507, to withdraw and reserve for the Air Force and Navy
    379,600 acres of public lands at the Luke Williams Air Force Range, Ariz.; H.R. 7782, to convey 3 acres of public
    land to the Prince Georges General Hospital, Maryland; H.R. 10276, changing the nar;ne of Petersburg National
    Military Park to Petersburg National Battlefield, and acquiring additional lands therefor; H.R. 8567, authorizing
    the creation of trial boards for the U.S. Park Police; H.R. 11405, authorizing the National Park Service to
    continue its practice of requiring concessionaires using U.S. buildings to repair and maintain same; S. 1878,
    to extend the boundaries of the Wasatch National Forest and add additional lands thereto (amended); S. 103,
    authorizing construction of the Auburn-Folsom south unit, American River division, Central Valley project, California
    (amended); S. 892, authorizing construction of the Arbuckle reclamation project, Oklahoma (amended); S. 55,
    authorizing establishment of the Fort Bowie National Historic Site, Ariz.; and S. 703, S. ro65, and S. 3100
    (private bills-all amended). Committee appointed a Special Subcommittee on Natural Resources Revenue, pursuant
    to S. Res. 361, the membership of which is composed of Senators Hickey, chairman, Church, Metcalf, Kuchel, and
    Allott. Committee adopted a committee resolution requesting the Secretary of the Interior to initiate a study
    on Federal policies regarding limitations on delivery of water from Federal projects to lands for irrigation
    purposes in excess of a specified or limited number of acres in individual or family ownership.'
  page: D422
  pdf: 420
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=420
