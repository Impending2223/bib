  text: 'Ordered reported favorably to the House the following measures: H.R. 3529 (amended), regarding sale of
    Indian timber; H.R. 10773 (amended), to provide relief for residential occupants of unpatented mining claims
    upon which valuable improvements have been placed;. H.R. 11164 (amended), to approve an amendatory repayment
    contract negotiated with the Quincy Columbia Basin Irrigation-District, authorize similar contracts with any
    of the Columbia Basin irrigation districts, and to amend the Columbia Basin Project Act of 1934; H.R. 11266
