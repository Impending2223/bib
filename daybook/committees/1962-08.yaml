  text: 'Ordered reported favorably to the House the following bills: H.R. 8113, to amend the act of August 9, 1955,
    to include the Southern Ute Indian Reservation among those excepted from the 25-year lease limitation; S. 2696,
    to correct certain land descriptions in the act entitled "An act to declare that the U.S. holds in trust for
    the pueblos of Santa Ana, Zia, Jemez, San Felipe, Santo Domingo, Cochiti, Isleta, and San Ildefonso certain
    public domain lands"; S. 2971, to declare that certain lands of the U.S. are held by the U.S. in trust for the
    Jicarilla Apache Tribe of the Jicarilla Reservation; S. 3342, to approve an order canceling irrigation charges
    against non-Indian-owned lands under the Klamath Indian irrigation project, Oregon; S. 1161, to provide for
    the use of lands in the Garrison Dam project by the Three Affiliated Tribes of the Fort Berthold Reservation;
    H.R. 9171 (amended), to a1nend the act of August 27, 1954, with respect to the Uintah and Ouray Reservation
    in Utah; and H.R. 9342 (amended), to provide for an exchange of lands between the U.S. and the Southern Ute
    Indian Tribe.'
  page: D511
