  text: Subcommittee on Reorganization and International Organizations held hearings to study problems of national
    and international exchange of up-to-date research information on experimental and other drugs, with especial
    emphasis today on the recent case of the baby-deforming drug "thalidomide," which was blocked from widespread
    commercial sale in the U.S. Witnesses heard were George Larrick, Administrator, who introduced Dr. Frances Kelsey,
    physician, both of the Food and Drug Administration, Department of HEW, the latter of whom was instrumental
    in preventing use of the drug in the U.S.; Julius Hauser, also of the Food and Drug Administration; and Dr.
    Frank B. Rogers, National Library of Medicine, Public Health Service. Hearings were recessed subject to call.
  page: D422
