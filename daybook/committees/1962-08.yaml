  committee: Committee on the Judiciary
  code: 358
  name: Judiciary
  heading: DRUG INDUSTRY ANTITRUST ACI
  bills:
  - S. 1552
  next: '1962-08-10'
  text: Committee continued its executive consideration of amendments recommended by the President to S. 1552, proposed
    Drug Industry Antitrust Act, and adopted amendments which would (I) insert provisions in the Food and Drug Act
    deeming a prescription drug to be misbranded if advertisements or other descriptive printed matter issued by
    the manufacturer, packer, or distributor with respect to the drug failed to include (a) the so-called generic
    name of the drug printed in prominent type, (b) the formula showing quantitatively each ingredient of the drug,
    and (c) information relating to effects and effectiveness of the drug, and (2) eliminate provisions in section
    12 of the bill which exclude veterinarian antibiotics from the certification requirement for antibiotics newly
    covered under the certification section. Committee will meet again tomorrow to consider other aspects of section
    12 of the bill.
  page: D451
  pdf: 449
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=449
