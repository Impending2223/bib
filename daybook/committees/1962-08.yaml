  text: 'Committee met in executive session to consider certain amendments recommended by the President to S. 1552,
    proposed Drug Industry Antitrust Act (which bill is now pending on the Senate Calendar), after which it announced
    the following actions: (I) The committee adopted an amendment to the bill which would change present law so
    as to prevent a new-drug application from automatically becoming effective, and requiring affirmative approval
    by the Secretary before the drug could go on the market. (2) The committee adopted an amendment to give the
    Secretary an initial period of 180 days (or longer if agreed to by the applicant) for considering a new-drug
    application. Under the amendment, unless he decided to approve the new-drug application within that time, the
    Secretary would have to give the applicant 30 days to request a hearing and in the event of such a request would
    have 90 days, in addition to such 30 days, in which to schedule a hearing (unless a different time was agreed
    on). The committee further provided that appeal from the Secretary''s action after hearing, refusing to permit
    a drug on the market or withdrawing it from the market, shall be subject to judicial review in the appropriate
    circuit court of appeals.. (3) The committee adopted a further amendment which would authorize the Secretary,
    if he found there was an imminent hazard to the public health, immediately to remove the drug from the market.
    In such cases he would have'' to give prompt notice of his action to the applicant and afford the applicant
    an opportunity for a hearing on an expedited basis. These amendments, adopted by the committee today, will be
    proposed as committee amendments to the bill upon Senate consideration thereof. Committee will meet again tomorrow
    for the further consideration of this matter.'
