    in their presence; H.R. 6691, to validate certain payments made to employees of the Forest Service, United States
    Department of Agriculture; H.R. r66s (amended), to amend title 28, entitled "Judicial Procedure," of the U.S.
    Code to confet juri$diction upon the Court of Claims to hear, determine, and render judgment in special jurisdictional
    cases; H.R. 6so7, to make section 1952 of title 18, U.S. Code, applicable to travel in aid of arson; and H.R.
