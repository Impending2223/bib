    for the Territory of Alaska in the computation of years of Federal judicial service for judges of the United
    States District Court for the District of Alaska; H.R. 3349, for the relief of certain retired officers of the
    Army, Navy, and Air Force; H.R. 5184, for relief of the port of Portland, Oreg.; H.R. 5640 (amended), to provide
