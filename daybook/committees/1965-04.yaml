  exec: true
  text: Committee, in executive session, by a vote of I6 to I, ordered favorably reported an original bill providing
    for a foreign aid program for fiscal years I966 and I967. As approved by the committee, the bill would support
    appropriations of $3.352 billion for fiscal year I966, and a generally similar amount in fiscal year I967..
    The committee reduced appropriations request by $28.2 million, of which amount $I9.2 million would be cut from
    "Supporting ' assistance," and $9 million from "International organizations." Also, committee adopted an amendment
    which would (I) terminate all assistance on June 30, Ig66, (2) request the President to submit, prior to July
    I, I966, his recommendations with regard to future foreign aid programs, and (3) create a Foreign Aid Planning
    Committee, consisting of Members of the Congress, and others, which committee would submit its findings and
    recommendations by January 3, I967. Committee rejected an amendment proposing to reduce the funds for foreign
    aid by $250 million.
