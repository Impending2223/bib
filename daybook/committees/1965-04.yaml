    H.R. 4526, to extend the provisions of title 12, Merchant Marine Act, 1936, relating to war risk insurance for
    an additional 5 years, ending September 7, 1970. Prior to the executive session the subcmnmittee held a hearing
    on all of the above bills, except H.R. 719, which had already been approved by the subcommittee. Testimony was
