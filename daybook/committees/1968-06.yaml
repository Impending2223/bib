    a letter for transmittal to the chairman of the Committee on the Judiciary embodying recommendations for certain
    conditions to be met prior to the granting of consent of the Congress to the following three proposed air pollution
    control coin pacts: S. 2350, West Virginia-Ohio air pollution control compact; S. 470, Indiana-Illinois air
    pollution control compact; and S.J. Res. 95, Mid-Atlantic States air pollution control compact. Prior to this
    action, Subcommittee on Air and Water Pollution, in executive session, approved for full committee consideration
    S. 3201, and the aforementioned letter concerning air pollution control compacts. Subcommittee also approved
    for full committee consideration S. 2525, providing stricter regulation of control of pollution from vessels
    using the navigable waters of the U.S.'
