  exec: true
  text: Committee, in executive session, adopted a resolution expressing their deep regret and sorrow in the death
    of their beloved colleague, the late Senator Robert F. Kennedy of New York. Also, committee ordered favorably
    reported the nominations of James D. Templeton, of Kentucky, to be Assistant Director of the Office of Economic
    Opportunity; George C. Trevorrow, of Maryland, to be member of the Federal Coal Mine Safety Board of Review;
    and Lynn Bartlett, of Michigan, to be an Assistant Secretary of the Department of Health, Education, and Welfare;
    eight nominations to the National Science Board, National Science Foundation; and three nominations to the Board
    of Regents of the National Library of Medicine. The committee also approved with amendments H. Con. Res. 705,
    to assist veterans of the Vietnam war in obtaining suitable employment; S. 3095, proposed Health Manpower Act
    of 1¢8; H.R. 16819, proposed Vocational Rehabilitation Amendments of 1968; and H.R. 3639, to establish standards
    for determining the safety of drugs for animals. Prior to this action, Subcommittee on Health, in executive
    session, approved for full committee consideration S. 3095, H.R. 16819, and H.R. 3639.
