  text: 'Subcommittee on Roads resumed hearings on S. 3418, authorizing funds for the Federal-aid highway program
    for fiscal years 1970 and 1971; S. 2888, providing for the elimination of tolls on roads in the Interstate Highway
    System; and S. 3381, authorizing additional program for improvement of the Federal-aid primary system. Witnesses
    heard were Antonio B. Won Pat, representing the government of Guam; M. M. Nelson, Forest Service, Department
    of Agriculture; J. L. Norwood, Acting Director, Bureau of Indian Affairs, accompanied by I. J. Trier, both of
    the Department of the Interior; Burton F. Miller, American Road Builders Association; and 0. R. Colan, American
    Right of Way Association. Hearings continue tomorrow. Bills Reported: Reports were filed as follows: H.R. 17734,
    making supplemental appropriations for fiscal year ending June 30, 1¢8, filed on Friday, June 7 (H. Rept. 1531);
    H.R. 6589, to make Federal buildings accessible to the physically handicapped, filed on Friday, June 7 (H. Rept.
    1532); Conference report on H.R. 15414, to control the existing tax rates on communication services and on automobiles
    (H. Rept. 1533); Conference report on H.R. 12639, regarding ocean cruises (H. Rept. 1534); Conference report
    on H.R. 15190, regarding sea-level canal connecting the Atlantic and Pacific Oceans (H. Re pt. 1535); H.R. 15785,
    to amend the Public Health Service Act, amended (H. Rept. 1536); and H.R. 17325, to amend the Internal Revenue
    Code (H. Rept. 1537)..Page 16478 Aircraft Noise: By a record vote of 312 yeas, the House passed H.R. 3400, to
    authorize aircraft noise abatement regulation. Adopted the committee substitute amendment and rejected an amendment
    regarding sonic boom. H. Res. 1203, the rule under which the legislation was considered, was adopted earlier
    by a voice vote. Pages 163e2-16400 Land Conveyance:.By a voice vote passed S. 974, to authorize the Secretary
    of Agriculture to convey certain lands to the city of Glendale, Ariz. Adopted the committee amendment. H. Res.
    1191, the rule under which the legislation was considered, was adopted earlier by a voice vote. Pages 16384,
    16400-16403 Communication-Gun Control: Received a communication from the Attorney General regarding a gun control
    law-referred to the Committee on the Judiciary. Page 16403 Adjournment: Adjourned at 4:06 p.m.'
