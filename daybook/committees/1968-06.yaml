  text: Subcommittee on Surface Transportation approved for full committee consideration S. 751, authorizing ICC
    to require establishment of through routes and joint rates between motor carriers and between motor carriers
    and other common carriers (amended); S. 1175, extending time period for the notice of proposed discontinuance
    of service required of carriers by rail or ferry under the Interstate Commerce Act (amended); S. J. Res. 52,
    providing for preparation and submission to the Congress of a master ground transportation plan for the U.S.
    (amended); S. Con. Res. 25, calling for a study to determine the potential of railroad passenger and mail transportation
    in the U.S. (amended); and S. 2687, making orders of the ICC reviewable by U.S. courts of appeals as are orders
    of other ma jar Federal regulatory agencies. Also, subcommittee considered S. 927, to prohibit discriminatory
    assessment of transportation property of common carriers, and agreed to recommend that the full committee appoint
    an ad hoc committee to study this matter and report back its findings thereon next year.
