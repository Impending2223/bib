  text: Committee, in executive session, ordered favorably reported H.R. 13593, increasing from five to nine the
    number of alternates each Congressman is entitled to nominate for vacancies at the military academies; H.R.
    15789, authorizing military contracts for services and supplies to extend for 5 years for operation and maintenance
    of facilities and equipment; H.R. 13050, increasing the number of Navy officers who may be designated as specialists
    in various technical and professional fields; and H.R. 5783, to make uniform the laws covering the administration
    of military correctional facilities and treatment of persons convicted under courts-martial. Committee also
    approved the reappointment for l additional year of Gen. Earle G. Wheeler as chairman of the Joint Chiefs of
    Staff, and 627 nominations in the Army, Navy, Marine Corps, and Air Force. Prior to this action, in open session,
    committee received testimony from John I. Woodruff, U.S. Military Academy, and Comdr. Donald A. Smith, U.S.
    Naval Academy, who directed their remarks to H.R. 13593; Aaron J. Racusin, Deputy Assistant Secretary of the
    Air Force, who testified with regard to H.R. 15789; Adm. Robert R. Crutchfield, Assistant Chief of Naval Personnel
    for Plans and Programs, whose testimony related to H.R. 13050; Maj. Gen. Carl C. Turner, the Provost Marshal
    General, Department of the Army, who directed his remarks to H.R. 5783; and James E. Welch, Deputy General Counsel,
    GAO, who testified with regard to H.R. rn573, to amend military procurement law with regard to negotiation of
    contracts.
