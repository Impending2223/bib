  text: 'Committee continued its executive consideration of H.R. 1o65o, Internal Revenue Act. a1nendments, after
    which it announced the following actions: Controlled foreign corporations} section 13 The committee approved
    a series of technical, clarifying amendments perfecting the substitute for section 13 previously adopted. Distributions
    in kind by foreign c01-porations} section 5 An amendment offered by Senator Kerr (7-9-62-E) was adopted providing
    that the foreign tax credit applicable with respect to distributions in kind by foreign corporations to domestic
    corporation is to be computed by reference to the fair market value of the property distributed in kind rather
    than its tax basis. Fore£gn investment companies} section 15 An amendment offered by Senator Kerr (7-9-62-I)
    was adopted which would provide (I) that if the foreign investment company elected to pay out its dividends
    currently and report currently its capital gains to the shareholders, these shareholders could use their proportion
    of any foreign tax credit which the corporation would otherwise be allowed and (2) the notice given by the corporation
    to its shareholders with respect to capital gains could be made 45 days after the close of the taxable year
    instead of 30 days as in the bill. There were also minor technical amendments to the language. Treatment of
    gain on sale or liquidation of certain foreign corporations} section 16 The committee agreed to amendment 7-9-62-J
    (offered by. Senator Kerr) to provide: (a) that amount of gain taxed as ordinary income is to be limited to
    the portion of the earnings and profits of the foreign corporation accumulated after December 31, 1962. (b)
