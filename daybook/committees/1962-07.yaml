  text: The Internal Security Subcommittee held hearings to receive testimony from Samuel Nakasian, a lawyer specializing
    in foreign investment and trade, on the Soviet's use of oil as a "cold war" weapon. The witness testified as
    to why the Soviet is making great price concessions in marketing its oil and what large value it is receiving
    in its barter negotiations. Subcommittee recessed subject to call.
