  text: 'Committee continued its executive consideratic;m of H.R~ I o6so, internal Revenue Act amendments, after
    which it announced the following actions: Mutual fire and casualty insurance companies, section zo The committee
    agreed to increase the exemption for small mutual insurance companies from $75,000 to $15o,ooo. It also agreed
    to permit ~utual insurance companies (including reciprocals) whose gross receipts do not exceed $6oo,ooo to
    be taxed on investment income only. With respect to concentrated risk companies (those whose principal premium
    income is from windstorm, hail, flood, etc.) it was agreed to provide an alternative area test in addition to
    the one-State test for qetermining whether these companies may obtain an additional protection against loss
    deduction. Under this alternative test if the principal premium income is derived from such risks insured within
    a radius of 200 miles of any point, the company will qualify for additional protection against loss deductions
    under the formula of the House-passed bill. The committee also agreed to allow reciprocal exchanges to compute
    their protection against loss deductions on the basis of the combined income of the reciprocal and its attorney-infact,
    except that the amount in the PAL account attributable to income of the attorney-in-fact must come back into
    income after 5 years. It also provided a special transitional loss rule under which mutual insurance companies
    with an experience of losses in 5 out of 6 years preceding the effective date of the bill may set aside an amount
    of inc9me equal to the accumulated losses, except that no amount may be set aside after 5 years. Committee will
    continue consideration of this bill tomorrow.'
  page: D384
  pdf: 382
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=382
