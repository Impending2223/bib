  - H.R. 9520
  exec: true
  next: '1962-07-12'
  text: 'Committee met in executive session to consider H.R. 1o65o, Internal Revenue Act amendments, and announced
    the following action thereon: Section 19, withholding: The committee voted to delete section 19 of H.R. 1060
    (relating to withholding on interest, dividends and patronage dividends). As a substitute, the committee agreed
    to amendments which would require payers of interest, dividends, and patronage dividends to report to the Treasury
    Department all such payments to recipients of $10 or more in a calendar year. It was also agreed that payers
    should give notice to recipients of the amounts of interest, dividends, and patronage dividends paid to them.
    The staff was instructed to prepare and submit to the committee a draft of a penalty to be assessed in case
    of failure to furnish information returns required by the committee decision. Section 2, investment credit:
    The committee tentatively agreed to modify the investment credit by reducing the depreciable basis of the property
    (for which the credit was allowed) by the amount of the credit. The mechanics of the modification have not yet
    been drafted. Pending, when the committee adjourned, were several additional modifications to or substitutes
    for the investment credit. Also, the committee approved and ordered reported without amendment H.R. 9520, to
    continue the suspension of duty for 2 years on certain alumina and bauxite. Committee will meet again tomorrow.'
  page: D363
  pdf: 361
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=361
