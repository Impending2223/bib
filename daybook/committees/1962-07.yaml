  next: '1962-07-17'
  text: 'Committee continued its executive consideration of H.R. 10650, Internal Revenue Act amendments, after which
    it announced the following actions: Foreign income The committee agreed to the substance of three amendments
    offered by Senator Kerr as complete substitutes for sections 6, 7, and I3 of the House-passed bill. The amendments
    are identified as 7-9-62-H (relating to controlled foreign corporations and optional schedule of minimum distributions);
    7-I2-62-A (relating to exceptions for certain export trade corporations); and 7-I3-62-G (relating to ordinary
    income tax treatment in case of sales and exchanges of patents, copyrights, exclusive processes, etc.). The
    purpose of each of these amendments is explained in the Congressional Record for the respective dates. Investment
    credit The committee agreed to change the effective date of the investment credit provision from January I,
    I962, to July I, 1962. It also agreed to exclude livestock from qualification for the investment credit. A 3-year
    carryback of unused credits was also provided. (The House bill permitted a 5-year carryforward but no carryback.)
    Earned income from foreign sources The committee agreed to delay the effective date of section 12 of the bill
    insofar as it relates to fringe benefits received by bona fide residents of foreign countries. In the case of
    fringe benefits the limitation of the bill will apply in full after 3 years; in the first year the value of
    fringe benefits will not be taken into account at all in determining earned income; in the second year one-third
    of the value of such benefits will be taken into account in determining earned income; in the third year two-thirds
    will be taken into account in determining earned income and in the fourth year and thereafter the full amount
    will become subject to the limitation. Committee will meet again tomorrow for the further consideration of this
    bill.'
  page: D375
  pdf: 373
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1962-pt19/pdf/GPO-CRECB-1962-pt19-1.pdf#page=373
