  heading: PROCEDURES ON APPROPRIATIONS LEGISLATION
  exec: true
  text: 'Committee met in a morning executive session to discuss procedures for the consideration of appropriations
    measures, but made no announcements. In an afternoon executive session, the joint comn1ittee from the Senate
    and House Committees on Appropriations adopted the following: Each branch of Congress in conference has group
    autonomy. The selection of the conference chairman is procedural for orderly functioning of the conference.
    Realizing this, the question of the selection of the conference chairman for the present session of Congress
    shall be left to the decision of the two subcommittee chairmen. It is agreed by the joint committee on behalf
    of the full Cum.mittees on Appropriations of the Senate and House of Representatives that for this session only
    the subcommittee chairmen of each body shall decide who shall act as chairman of the conference. It is further
    agreed that the chairmen of the Senate and House Committees on Appropriations appoint representatives of each
    committee to serve as a joint committee to study.all the issues involved and to report in January 1963 their
    recon1.mendations.'
