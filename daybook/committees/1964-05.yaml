  text: 'Committee, in executive session, heard Senator Case testify in connection with the committee''s investigation
    of financial and business activities of Senate employees and former Senate employees. Committee announced that
    it would meet in executive session on Wednesday, May 20, to consider its final report on this investigation,
    including recommendations. S. 1687, approving reclassification of land of the Big Flat unit of the Missoula
    Valley project, Montana, and authorizing the modification of the repayment contract with Big Flat Irrigation
