    mail publications (H.,Rept. 1394).; and H.R. 5986, regarding duty on brooms made of broomcorn, amended (H. Rept.
    1395). Page 10696 New Member Sworn: Representative-elect William J. Green III of the Fifth Congressional District
    of Pennsylvania presented himself in the well of the House and the Speaker administered the oath of office.
    Page 10695 Condolence Resolution: Adopted H. Res. 718, providing for expressions of sympathy and sorrow on the
    death of Representative Cannon of the Ninth Congressional District of Missouri. The Speaker appointed the following
    43 members to the funeral committee: Representatives Karsten, Mahon, Kirwan, Jensen, Whitten, Horan, Rooney
    of New York, Fogarty, Sikes, Gary, Evins, Passman, Jones of Missouri, Boland, Bolling, Curtis, Lesinski, Laird,
    Pillion, Sullivan, Natcher, Flynt, Flood, Denton, Hull, Minshall, McFall, Michel, Montoya, Conte, Langen, Milliken,
