  text: 'Subcommittee on the Smithsonian Institution held hearings on the following three bills: S. 808, authorizing
    maintenance of facilities in the Canal Zone for scientific study of natural features; S. 809, to redefine the
    term "buildings and grounds" applicable to the Smithsonian Institution; and S. 1659, providing that the salaries
    of the police of the National Zoological Park shall equal those of members of the U.S. Park Police having comparable
    duties. Witnesses heard were Dr. S. Dillon Ripley, Secretary, and James Bradley, Assistant Secretary, both of
    the Smithsonian Institution, who directed their remarks to all three bills; and Raymond Jacobson, Bureau of
    Programs and Standards, Civil Service Commission, and Herbert Price, representing the National Zoological Park
    Police, both of whom testified with regard to S. 1659. Statements were submitted for inclusion in the record
    by Senator Saltonstall in connection with S. 808 and S. 809, and by Senator Beall in connection with S. 1659.'
