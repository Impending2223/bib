  exec: true
  text: 'Committee, in executive session, unanimously approved for reporting with amendments H.R. 14122, providing
    salary increases for Federal employees. The bill as amended will do the following: (1) Provides a 2.9-percent
    increase across the board, effective July 1, 1966; (2) Retains the House-passed one-~tep increase in the Government''s
    contribution to high-option health insurance by IO percent; (3) Retains the provision for retirement on a full
    annuity at age 55 after 30 years of service, or at age 60 after 20 years'' service; (4) Liberalizes survivor
    annuity benefits for future widows of Federal employees and children of deceased Federal employees; (5) Provides
    a IO-percent increase in the annuities of widows or future widows of Federal employees who died or retired prior
    to October 11, 1962. This provision was adopted in lieu of the House provision for recomputation of annuities;
    (6) Extends health insurance coverage to children up to 22 years of age. The present maximum age is 21; (7)
    Liberalizes overtime pay law for classified and postal supervisory employees; (8) Provides Sunday premium pay
    at 25 percent for classified and wage board employees; (9) Increases uniform allowances for Federal employee&.
    by an average of 25 ~rcent. D.C. Legislation: The consideration of legislation perJ taining to the District
    of Columbia was in order and the following bills were called up, considered, and passed by voice votes: D.C.
    tax: H.R. 11087, to exempt from D.C. taxes real property investment income of certain foreign corporations (sent
    to the Senate without amendment). D.C. alcoholic beverage control: H.R. 10744 (adopted committee amendments
    and an amep.dment designed to raise the age limit from 18 to 21 years for purchasing beer and light wine), to
    amend the District of Columbia Alcoholic Beverage Control Act (sent to the Senate). Pages 1111 8-1112 3 Bills
    Referred: Four Senate-passed bills were referred to the appropriate committees. Page 11145 Adjournment: Adjourned
    at 12:50 p.m.'
