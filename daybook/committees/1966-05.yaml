  text: On Friday, May 13, Subcommittee on Indian Affairs approved for full committee consideration S. 2595, to
    place in trust status certain lands on the Wind River Reservation in Wyoming; S. 2948, setting aside certain
    Montana lands for the Indians of the Confederated Salish and Kootenai Tribes of the Flathead Reservation (amended);
    H.R. 10476, to retrocede to the State of Kansas concurrent jurisdiction over Haskell Institute; H.R. 12264,
    declaring that certain federally owned land is held by the U.S. in trust for the Apache Tribe of the Mescalero
    Reserva tion, N. Mex.; and H.R. 10431, declaring that certain federally owned land is held by the U.S. in trust
    for the Minnesota Chippewa Tribe. -Prior to this action, in open session, subcommittee held hearings on these
    bills, and on S. 3228, granting mineral rights on certain lands in the northern Cheyenne Indian Reservation,
    Mont., to certain Indians; and S. 3o68, to terminate the existence of the Indian Claims Commission. Witnesses
    heard were Harry R. Anderson, Assistant Secretary for Public Land Management, and Robert L. Bennett, Commissioner
    of Indian Affairs, both of the Department of the Interior, who submitted testimony on all of the bills; and
    Arthur V. Watkins, Chief Commissioner, Indian Claims Commission, who directed his remarks to S. 3068.
