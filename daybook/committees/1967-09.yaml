  text: 'Subcommittee on Merchant Marine and Fisheries continued its hearings on the following fishery bills: S.J.
    Res. 103 and S.J. Res. 75, to authorize a survey of coastal and fresh water commercial fishery resources of
    the U.S.; S. 1260, providing for protection of mammals under the Northwest Atlantic Fisheries Act of 1950; S.
    1752, making it unlawful for foreign vessels to engage in fisheries within U.S. territorial waters; S. 1784,
    authorizing Idaho to participate in pro- grams for the enhancement of the Nation''s anadromous fish; S. 1798,
    authorizing the Secretary of the Interior to make loans to fishermen''s cooperative associations; S. 2047, to
    exempt certain vessels engaged in the fishing industry from the requirements of certain inspection laws; and
    S. 2232 and S. 2269, relating to fishing in territorial waters by foreign vessels. Witnesses heard were Senator
    Gruening; Rear Adm. Charles P. Murphy, Office of Merchant Marine and Safety, U.S. Coast Guard; Jacob Dykstra,
    Point Judith Fishermen''s Cooperative Association, Inc.; and E. C. Biele, of Seattle. Hearings were adjourned
    subject to call.'
