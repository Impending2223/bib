  exec: true
  text: 'met in executive session to continue to resolve the differences between the Senate- and House-passed versions
    of S. 1320, providing for career status for certain Government employees serving under temporary appointments,
    but did not reach final agreement, and will meet again tomorrow. Flood Insurance: Senate passed (motion to reconsider
    tabled) S. 1985, to provide a national program of flood insurance, after adopting the following amendments thereto:
    All committee amendments en bloc; Proxmire amendment to bar profits for 5 years by private insurance companies
    until the Government recovers its expenses of reinsurance under the bill; Ellender amendment of a technical
    perfecting nature; and Hruska amendment to provide for 90 days rather than 30 days while Congress is in regular
    session, for report to Congress on implementation of flood insurance program. Page$ 25520-25543, 25549-25557
    Authority To Report: Committee on Finance was granted extension of time until Friday, September 22, to file
    its report on legislation covering Federal financing of presidential election campaigns. Pages 25557-25559 Local
    Police: Senate took from calendar and passed with amendment H.R. 11816, providing compensation to survivors
    of local law enforcement officers killed while apprehending persons for committing Federal crimes (motion to
    reconsider tabled), after substituting for its language the text of S. 798, companion bill, with adopted amendments,
    as indicated below: Committee amendment (in the nature of a substitute for the bill), which was then considered
    as original text for purpose of further amendment; four Hruska amendments en bloc, as follows-(1) to include
    in the bill''s coverage apprehension of Federal fugitives or location of material witnesses for testimony in
    Federal cases, (2) to provide that benefits shall not be barred because the fugitive was also being sought for
    violation of State law, (3) respecting procedures for payment of disability benefits, and (4) defining a local
    law enforcement officer; and Yarborough-Pastore amendment to include among those acts of the law enforcement
    officer that may be rewarded by stated benefits the lawful prevention of or lawful attempt to prevent commission
    of a crime against the U.S. Senate insisted on its amendments, asked for conference with House, and appointed
    as conferees Senators McClellan, Eastland, Ervin, Hart, Kennedy (Massachusetts), Hruska, Scott, and Thurmond.
    S. 789, companion bill, was indefinitely postponed. Pages 25559-25572'
