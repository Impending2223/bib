  text: 'Met in executive session and ordered favorably reported to the House the following bills: H.R. 5743, to
    amend the Federal Crop Insurance Act to permit inclusion of administrative costs in insurance premmms; H.R.
    10784 (amended), to provide that payment for the lands covered by the act of September 9, 1959, may be made
    on a def erred basis; H.R. 11917 (amended) to authorize the Secretary of Agriculture to convey certain lands
    in Lassen County, Calif., to the city of Susanville, Calif.; H.R. 12849 (amended), to protect farm and ranch
    operators making certain land use changes under the Great Plains conservation program and the soil bank program
    against loss of cropland acreage and acreage allotments; H.R. 12860 (amended), authorizing the Secretary of
    Agriculture to convey certain lands to Auburn University, Auburn, Ala. (testimony given by Representative Andrews
    on this bill);. S. 1857, to promote the foreign trade of the U.S. in '' grapes and plums; S. 2772, to authorize
    the Secretary of Agriculture to convey land in the town of Cascade, El Paso County, Colo.; S. 2919, providing
    for a study and investigation of the desirability and feasibility of establishing and maintaining a national
    tropical botanic garden (testimony given on this bill by Representative Inouye); S. 3070, to provide for the
    removal of the restriction on use with respect to certain lands in Morton County, N. Dak.; and S. 3665, to grant
    an easement over certain land to the trustees of the Cincinnati Southern Railway, their successors and assigns.
    The committee also approved two watershed projects, one in Texas and one in Indiana. The committee adjourned
    subject to call of the Chair.'
  page: D428
  pdf: 426
  url: https://www.govinfo.gov/content/pkg/GPO-CRECB-1960-pt16/pdf/GPO-CRECB-1960-pt16-1.pdf#page=426
