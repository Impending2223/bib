  text: On Friday, October 4, Subcommittee on Indian Affairs approved for full committee consideration H.R. 844
    and 845, bills declaring that certain U.S. land be held in trust for the Oglala Sioux Indian Tribe of the Pine
    Ridge Reservation; and S. 136, placing certain U.S.-held lands in trust for the Rosebud Sioux Tribe of South
